<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>随便看看 · 独立博客聚合</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06); --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5); --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.wrap{max-width:860px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 20px}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  margin:0 -24px;padding:12px 24px}
.search{flex:1;min-width:160px;display:flex;align-items:center;background:var(--fill);border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);border-radius:9px;padding:8px 14px;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:10px 12px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.src-toggle{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--mut);
  font-size:13px;font-weight:600;padding:10px 0 2px;cursor:pointer}
.src-toggle:hover{color:var(--ink)}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:8px 15px;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
.chip .n{opacity:.55;font-weight:400;margin-left:4px}
.chips-label{font-size:12px;color:var(--mut);margin:10px 2px -4px;font-weight:600;letter-spacing:.05em}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.ai-summary{background:linear-gradient(135deg,#e8f1fd,#f4ecff);border:1px solid rgba(0,113,227,.16);
  border-radius:var(--radius);padding:18px 20px;margin:14px 0 6px;box-shadow:var(--shadow);
  font-size:14px;line-height:1.85;color:var(--ink)}
[data-theme="dark"] .ai-summary{background:linear-gradient(135deg,#0a2540,#221038);border-color:rgba(10,132,255,.28)}
.ai-summary .ai-sum-head{font-weight:700;font-size:13px;color:var(--acc);margin-bottom:10px;letter-spacing:.05em}
.ai-summary p{margin:0 0 10px}.ai-summary p:last-child{margin:0}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);padding:18px 22px;
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;margin:0 0 6px;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--fill);color:var(--mut);white-space:nowrap}
.badge.score{background:var(--acc-soft);color:var(--acc)}
.sum{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 8px}
.src{font-size:12.5px;display:flex;gap:16px}
.src a{color:var(--acc);text-decoration:none;cursor:pointer}
.src .read-local{font-weight:600}
/* 时间线 */
.tl-day-h{position:sticky;top:64px;z-index:10;font-size:13px;font-weight:700;color:var(--mut);
  letter-spacing:.06em;margin:22px 0 4px;padding:6px 2px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.tl{position:relative;margin:6px 0 0 8px;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--fill-strong);border-radius:2px}
.tl-item{position:relative;padding:10px 0;cursor:pointer}
.tl-dot{position:absolute;left:-24px;top:18px;width:10px;height:10px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--acc)}
.tl-time{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:2px}
.tl-title{font-size:16.5px;font-weight:600;line-height:1.6;margin:2px 0 4px}
.tl-item:hover .tl-title{color:var(--acc)}
.tl-src{font-size:12px;color:var(--mut)}
.tl-sum{font-size:13.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 0}
.more{display:block;margin:26px auto 0;border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:12px 34px;font-size:14px;font-weight:600;cursor:pointer}
.more:hover{background:var(--fill-strong)}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.skel{border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:12px}
.skel i{display:block;height:14px;border-radius:7px;margin:10px 0;
  background:linear-gradient(90deg,var(--fill) 25%,var(--fill-strong) 50%,var(--fill) 75%);
  background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.foot{margin-top:40px;font-size:12px;color:var(--mut);text-align:center}
/* 站内阅读弹窗 */
.modal-bk{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-bk[hidden]{display:none}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);
  width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--fill)}
.m-meta{font-size:12.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m-x{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:var(--fill);
  color:var(--ink);font-size:15px;cursor:pointer}
.m-title{font-size:20px;font-weight:700;line-height:1.5;margin:0;padding:18px 24px 4px}
.m-body{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding:6px 24px 10px;font-size:15.5px;line-height:1.9;
  overflow-wrap:break-word;text-autospace:normal}
.m-body p{margin:0 0 1em}
.m-body h1,.m-body h2,.m-body h3,.m-body h4{line-height:1.5;margin:1.3em 0 .55em}
.m-body h1{font-size:1.45em}.m-body h2{font-size:1.3em}.m-body h3{font-size:1.15em}.m-body h4{font-size:1.05em}
.m-body blockquote{margin:0 0 1em;padding:8px 16px;border-left:3px solid var(--fill-strong);color:var(--mut)}
.m-body ul,.m-body ol{padding-left:1.4em;margin:0 0 1em}
.m-body li{margin-bottom:.4em}
.m-body a{color:var(--acc);text-decoration:none}
.m-body a:hover{text-decoration:underline}
.m-body img{max-width:100%;height:auto;display:block;margin:1.2em auto;border-radius:12px}
.m-body figure{margin:1.2em 0;text-align:center}
.m-body figcaption{font-size:13px;color:var(--mut);margin-top:8px}
.m-body table{display:block;width:100%;overflow-x:auto;border-collapse:collapse;margin:0 0 1.2em;font-size:14px;line-height:1.6}
.m-body th,.m-body td{border:1px solid var(--fill-strong);padding:8px 12px;text-align:left}
.m-body th{background:var(--fill);font-weight:600}
.m-body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.86em;background:var(--fill);border-radius:6px;padding:2px 6px}
.m-body pre{background:var(--fill);border-radius:12px;padding:14px 16px;overflow-x:auto;
  font-size:13px;line-height:1.7;white-space:pre}
.m-body pre code{background:none;padding:0;font-size:inherit}
.m-body hr{border:0;border-top:1px solid var(--fill-strong);margin:1.8em 0}
.m-body video{max-width:100%;border-radius:12px}
.m-foot{padding:12px 24px 18px;font-size:13.5px}
.m-foot a{color:var(--acc);text-decoration:none;font-weight:600}
.m-loading{text-align:center;color:var(--mut);padding:40px 0}
@media(max-width:640px){.wrap{padding:24px 16px 60px}h1{font-size:24px}
  .toolbar{margin:0 -16px;padding:10px 16px}.tl-day-h{top:118px}.modal-bk{padding:10px}.m-title{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline" id="dateline">独立博客聚合</div>
<h1>📡 随便看看</h1>
<div class="sub" id="subline">独立博客 · Jev 前置分类 · 每天 07:00 / 19:00 更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="index.html" title="回到每日看板">☀️ 看板</a>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>
</div>
</header>
<div class="stats">
<div class="stat"><b id="stN">–</b><span>篇文章</span></div>
<div class="stat"><b id="stS">–</b><span>个来源</span></div>
<div class="stat"><b id="stB">–</b><span>篇可站内阅读</span></div>
</div>
<div class="toolbar">
<div class="search"><span style="color:var(--mut);margin-right:8px">🔍</span><input id="q" placeholder="搜索标题 / 来源 / 摘要…"></div>
<div class="seg" id="viewSeg">
<button data-v="list">📋 列表</button><button data-v="timeline" class="on">🕐 时间线</button>
</div>
<select class="sel" id="sort"><option value="score">按推荐分</option><option value="time">按时间</option></select>
</div>
<div class="chips-label">栏目</div>
<div class="chips" id="chips"></div>
<button class="src-toggle" id="srcToggle" hidden><span id="srcToggleText"></span></button>
<div id="srcWrap" hidden>
<div class="chips-label" id="srcLabel">来源</div>
<div class="chips scrollx" id="srcChips"></div>
</div>
<div class="count" id="count"></div>
<div id="aiSummary" style="display:none"></div>
<div class="list" id="list">
<div class="skel"><i style="width:65%"></i><i style="width:92%"></i><i style="width:38%"></i></div>
<div class="skel"><i style="width:72%"></i><i style="width:88%"></i><i style="width:45%"></i></div>
<div class="skel"><i style="width:58%"></i><i style="width:95%"></i><i style="width:33%"></i></div>
</div>
<div id="tlwrap"></div>
<button class="more" id="moreBtn" hidden>加载更多</button>
<div class="foot">数据来自 584 个中文独立博客 RSS · 由 Jev 做相关性/分类/质量初筛，仅供浏览参考</div>
</div>
<div class="modal-bk" id="mBk" hidden>
<div class="modal" role="dialog" aria-modal="true">
<div class="m-head"><div class="m-meta" id="mMeta"></div><button class="m-x" id="mX">✕</button></div>
<h2 class="m-title" id="mTitle"></h2>
<div class="m-body" id="mBody"></div>
<div class="m-foot" id="mFoot"></div>
</div>
</div>
<script>
const BUCKET={"news":"📰 新闻","models":"🤖 模型","trending":"🔥 开源","interests":"🎯 深度","voices":"👀 言论","tutorial":"📖 教程","tools":"🛠️ 工具","paper":"📄 论文","ai":"🏢 AI专区"};
let DATA=[], AI_SUMMARY=null, VIEW=[], shown=0, tlShown=0, tlLastDay=""; const PAGE=30;
let fBucket="all", fSource="all", fCompany="all", fQ="", fSort="score", fView="timeline";
const COMPANIES=["腾讯混元","DeepSeek","月之暗面","智谱","Qwen","MiniMax","小米","OpenAI","Google","Anthropic","Meta","xAI"];
function md(s){return esc(s||"").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");}
function renderAiSummary(){
  const el=document.getElementById("aiSummary");
  if(fBucket==="ai"&&AI_SUMMARY&&AI_SUMMARY.text){
    let d="",ed="";
    try{const t=new Date(AI_SUMMARY.updated);d=`${t.getMonth()+1}月${t.getDate()}日`;
      const h=t.getHours();ed=h<12?"🌅 早间":h<18?"☀️ 午间":"🌙 晚间";}catch(e){}
    el.innerHTML=`<div class="ai-summary"><div class="ai-sum-head">✨ AI 专区动态总结${ed?" · "+ed:""}${d?" · "+d:""}</div><p>${md(AI_SUMMARY.text)}</p></div>`;
    el.style.display="";
  }else{el.innerHTML="";el.style.display="none";}
}
function score(a){return a.jev.relevance*(1+a.jev.quality/5);}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtTime(iso){try{const d=new Date(iso);const p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;}catch(e){return "";}}
function dayKey(iso){try{const d=new Date(iso);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}catch(e){return "";}}
function dayLabel(iso){try{const d=new Date(iso);
  return d.toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"long"});}catch(e){return "";}}
function filtered(){
  let r=DATA.filter(a=>(fBucket==="all"||a.jev.bucket===fBucket)&&(fSource==="all"||a.source===fSource));
  if(fBucket==="ai"&&fCompany!=="all")r=r.filter(a=>(a.company||"")===fCompany);
  if(fQ){const q=fQ.toLowerCase();r=r.filter(a=>(a.title+a.source+a.summary).toLowerCase().includes(q));}
  r.sort((x,y)=>fSort==="time"?new Date(y.published)-new Date(x.published):score(y)-score(x));
  return r;
}
function metaBadges(a){
  const comp=(a.jev.bucket==="ai"&&a.company)?`<span class="badge">${esc(a.company)}</span>`:"";
  return `<span class="badge">${BUCKET[a.jev.bucket]||a.jev.bucket}</span>`+comp+
    `<span class="badge score">推荐 ${score(a).toFixed(2)}</span>`+
    `<span>${esc(a.source)}</span><span>${fmtTime(a.published)}</span>`;
}
/* ---- 列表视图 ---- */
function card(a,idx){
  const local=a.body?`<a class="read-local" data-i="${idx}">📖 站内阅读</a>`:"";
  return `<div class="card"><h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h3>
  <div class="meta">${metaBadges(a)}</div>
  ${a.summary?`<p class="sum">${esc(a.summary)}</p>`:""}
  <div class="src">${local}<a href="${esc(a.url)}" target="_blank" rel="noopener">阅读原文 →</a></div></div>`;
}
function renderList(reset){
  const r=filtered();
  if(reset){shown=0;document.getElementById("list").innerHTML="";VIEW=[];}
  const slice=r.slice(shown,shown+PAGE);
  slice.forEach(a=>VIEW.push(a));
  document.getElementById("list").insertAdjacentHTML("beforeend",
    slice.map((a,k)=>card(a,shown+k)).join(""));
  shown+=slice.length;
  document.getElementById("moreBtn").hidden=shown>=r.length;
  setCount(r.length);
  if(!r.length)document.getElementById("list").innerHTML='<div class="empty">没有匹配的文章，换个条件试试</div>';
}
/* ---- 时间线视图 ---- */
function renderTimeline(reset){
  const r=filtered().slice().sort((x,y)=>new Date(y.published)-new Date(x.published));
  if(reset){tlShown=0;tlLastDay="";document.getElementById("tlwrap").innerHTML="";VIEW=[];}
  const slice=r.slice(tlShown,tlShown+PAGE);
  slice.forEach(a=>VIEW.push(a));
  const wrap=document.getElementById("tlwrap");
  let html="",curDay=null,curLabel="";
  const flush=()=>{
    if(!html)return;
    const last=wrap.lastElementChild;
    if(curDay===tlLastDay&&last&&last.classList&&last.classList.contains("tl")){
      last.insertAdjacentHTML("beforeend",html);  // 跨页同天：续进上一页的组
    }else{
      wrap.insertAdjacentHTML("beforeend",`<div class="tl-day-h">${curLabel}</div><div class="tl">${html}</div>`);
    }
    tlLastDay=curDay;html="";
  };
  slice.forEach((a,k)=>{
    const gi=tlShown+k,dk=dayKey(a.published);
    if(dk!==curDay){flush();curDay=dk;curLabel=dayLabel(a.published);}
    html+=`<div class="tl-item" data-i="${gi}"><div class="tl-dot"></div>
      <div class="tl-time">${fmtTime(a.published).split(" ")[1]||""}</div>
      <div class="tl-title">${esc(a.title)}</div>
      <div class="tl-src">${esc(a.source)} · ${BUCKET[a.jev.bucket]||""} · 推荐 ${score(a).toFixed(2)}${a.body?" · 📖":""}</div>
      ${a.summary?`<div class="tl-sum">${esc(a.summary)}</div>`:""}</div>`;
  });
  flush();
  tlShown+=slice.length;
  document.getElementById("moreBtn").hidden=tlShown>=r.length;
  setCount(r.length);
  if(!r.length)wrap.innerHTML='<div class="empty">没有匹配的文章，换个条件试试</div>';
}
function setCount(n){
  document.getElementById("count").textContent=`共 ${n} 篇`+(fSource!=="all"?` · ${fSource}`:"")+(fQ?`（“${fQ}”）`:"");
}
function render(reset){
  const isList=fView==="list";
  document.getElementById("list").style.display=isList?"":"none";
  document.getElementById("tlwrap").style.display=isList?"none":"";
  renderAiSummary();
  if(isList)renderList(reset);else renderTimeline(reset);
}
/* ---- 站内阅读弹窗 ---- */
let modalIdx=-1;
function openModal(i){
  const a=VIEW[i];if(!a)return;modalIdx=i;
  document.getElementById("mTitle").textContent=a.title;
  document.getElementById("mMeta").innerHTML=metaBadges(a);
  document.getElementById("mBody").innerHTML='<div class="m-loading">正文加载中…</div>';
  document.getElementById("mFoot").innerHTML=`<a href="${esc(a.url)}" target="_blank" rel="noopener">阅读原文 →</a>`;
  document.getElementById("mBk").hidden=false;
  document.body.style.overflow="hidden";
  if(a.body){fetch(a.body).then(r=>r.text()).then(t=>{
      if(modalIdx===i)document.getElementById("mBody").innerHTML=t;
    }).catch(()=>{if(modalIdx===i)document.getElementById("mBody").innerHTML='<div class="m-loading">正文加载失败，请阅读原文</div>';});
  }else{document.getElementById("mBody").innerHTML='<div class="m-loading">暂无站内正文，请阅读原文</div>';}
}
function closeModal(){document.getElementById("mBk").hidden=true;document.body.style.overflow="";modalIdx=-1;}
document.getElementById("mX").onclick=closeModal;
document.getElementById("mBk").addEventListener("click",e=>{if(e.target.id==="mBk")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
/* ---- 筛选器 ---- */
function initChips(){
  const c=[["all","全部"]].concat(Object.entries(BUCKET));
  document.getElementById("chips").innerHTML=c.map(([k,v])=>
    `<button class="chip${k==="all"?" on":""}" data-k="${k}">${v}</button>`).join("");
  document.getElementById("chips").addEventListener("click",e=>{
    const b=e.target.closest(".chip");if(!b)return;fBucket=b.dataset.k;
    fSource="all";fCompany="all";renderSecondRow();
    document.querySelectorAll("#chips .chip").forEach(x=>x.classList.toggle("on",x===b));render(true);});
}
/* 第二排：AI专区显示公司 tab，其余栏目显示来源 tab */
let srcOpen=false;  /* 来源默认折叠，点开展开 */
function renderSecondRow(){
  const el=document.getElementById("srcChips"), label=document.getElementById("srcLabel"),
        toggle=document.getElementById("srcToggle"), wrap=document.getElementById("srcWrap"),
        ttext=document.getElementById("srcToggleText");
  if(fBucket==="ai"){
    toggle.hidden=true; wrap.hidden=false;  /* 公司只有 12 个，保持展开 */
    label.textContent="公司";
    el.innerHTML=`<button class="chip on" data-k="all">全部公司</button>`+
      COMPANIES.map(c=>{
        const n=DATA.filter(a=>a.jev.bucket==="ai"&&(a.company||"")===c).length;
        return `<button class="chip" data-k="${esc(c)}">${esc(c)}${n?`<span class="n">${n}</span>`:""}</button>`;
      }).join("");
  }else{
    label.textContent="来源";
    const counts={};
    DATA.forEach(a=>{counts[a.source]=(counts[a.source]||0)+1;});
    const srcs=Object.entries(counts).sort((x,y)=>y[1]-x[1]);
    el.innerHTML=
      `<button class="chip on" data-k="all">全部来源</button>`+
      srcs.map(([s,n])=>`<button class="chip" data-k="${esc(s)}">${esc(s)}<span class="n">${n}</span></button>`).join("");
    toggle.hidden=false;
    ttext.textContent=`📚 来源（${srcs.length}） ${srcOpen?"▾":"▸"}`;
    wrap.hidden=!srcOpen;
  }
}
let srcToggleBound=false;  /* applyData 会跑两次（缓存+网络），监听只绑一次 */
function initSrcChips(){
  renderSecondRow();
  if(srcToggleBound)return;
  srcToggleBound=true;
  document.getElementById("srcToggle").addEventListener("click",()=>{srcOpen=!srcOpen;renderSecondRow();});
  document.getElementById("srcChips").addEventListener("click",e=>{
    const b=e.target.closest(".chip");if(!b)return;
    if(fBucket==="ai"){fCompany=b.dataset.k;}
    else{fSource=b.dataset.k;}
    document.querySelectorAll("#srcChips .chip").forEach(x=>x.classList.toggle("on",x===b));render(true);});
}
function theme(){
  let t="light";
  try{t=localStorage.getItem("reader-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}catch(e){}
  document.documentElement.dataset.theme=t;
  document.getElementById("themeBtn").textContent=t==="dark"?"☀️":"🌙";
}
document.getElementById("themeBtn").onclick=()=>{
  const t=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("reader-theme",t);}catch(e){}
  document.getElementById("themeBtn").textContent=t==="dark"?"☀️":"🌙";};
document.getElementById("q").addEventListener("input",e=>{fQ=e.target.value.trim();render(true);});
document.getElementById("sort").addEventListener("change",e=>{fSort=e.target.value;render(true);});
document.getElementById("viewSeg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;fView=b.dataset.v;
  document.querySelectorAll("#viewSeg button").forEach(x=>x.classList.toggle("on",x===b));render(true);});
document.getElementById("moreBtn").onclick=()=>render(false);
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest(".read-local");if(!b)return;openModal(parseInt(b.dataset.i,10));});
document.getElementById("tlwrap").addEventListener("click",e=>{
  const it=e.target.closest(".tl-item");if(!it)return;openModal(parseInt(it.dataset.i,10));});
theme();initChips();
const RCACHE="reader-data-v1";
function applyData(d){
  DATA=d.articles||[];
  document.getElementById("stN").textContent=DATA.length;
  document.getElementById("stS").textContent=new Set(DATA.map(a=>a.source)).size;
  document.getElementById("stB").textContent=DATA.filter(a=>a.body).length;
  initSrcChips();
  try{const t=new Date(d.generated_at);const p=n=>String(n).padStart(2,"0");
    document.getElementById("dateline").textContent=`${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日 · 独立博客聚合`;
  }catch(e){}
  render(true);
}
try{const c=JSON.parse(localStorage.getItem(RCACHE));  // 先吐旧数据，首屏不等网络
  if(c&&c.articles&&c.articles.length)applyData(c);}catch(e){}
fetch("reader_data.json").then(r=>r.json()).then(d=>{
  try{localStorage.setItem(RCACHE,JSON.stringify(d));}catch(e){}
  applyData(d);  // 后台拿到新数据再刷新
}).catch(()=>{if(!DATA.length)document.getElementById("list").innerHTML='<div class="empty">数据加载失败，请稍后刷新重试</div>';});
fetch("ai_summary.json").then(r=>r.json()).then(d=>{AI_SUMMARY=d;renderAiSummary();}).catch(()=>{});
</script>
</body>
</html>
