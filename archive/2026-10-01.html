<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月2日 星期五</div>
<h1>☀️ 每日看板</h1>
<div class="sub">论文 · 模型追踪 · 兴趣追踪 · 开源趋势 · 大佬动态 —— 每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>
</div>
</header>
<nav class="tabs" id="tabbar"><button class="tab" data-tab="papers">📚 论文 7</button><button class="tab" data-tab="models">🤖 模型追踪 23</button><button class="tab" data-tab="interests">🎯 兴趣追踪 6</button><button class="tab" data-tab="trending">🔥 开源趋势 20</button><button class="tab" data-tab="x">👀 大佬动态 64 <span class="tab-dot" id="xTabDot" hidden></span></button></nav>
<section class="tabpane" id="pane-papers">
<div class="stats">
<div class="stat"><b id="sTotal">–</b><span>收录论文</span></div>
<div class="stat"><b id="sDays">–</b><span>监测天数</span></div>
<div class="stat"><b id="sArxiv">–</b><span>arXiv 预印本</span></div>
<div class="stat"><b id="sExtra">–</b><span>其他来源</span></div>
<div class="stat"><b id="sJour">–</b><span>期刊 / 会议补录</span></div>
</div>
<div class="toolbar">
<label class="search"><span class="ico">🔍</span><input id="q" placeholder="搜索标题 / 作者 / 关键词…"></label>
<div class="chips" id="srcChips"></div>
<select class="sel" id="cat"><option value="">全部分类</option></select>
<select class="sel" id="day"><option value="">全部日期</option></select>
</div>
<div class="count" id="count"></div>
<div class="banner">🗂️ 这是 2026-10-01 的快照归档 · <a href="../index.html">← 返回最新看板</a><span class="run-switch">版次：<button data-run="08:00" class="">早</button><button data-run="22:00" class="on">晚</button></span></div>
<div id="list"></div>
</section>
<section class="tabpane" id="pane-models" hidden>
<div class="sect-head"><h2>🤖 模型追踪</h2><span class="n" id="mdCount"></span></div>
<div id="mdList"></div>
</section>
<section class="tabpane" id="pane-library" hidden>
<div class="sect-head"><h2>📖 我们的论文库</h2><span class="n" id="libCount"></span></div>
<div id="libList"></div>
</section>
<section class="tabpane" id="pane-interests" hidden>
<div class="sect-head"><h2>🎯 兴趣追踪</h2><span class="n" id="intCount"></span></div>
<div id="intList"></div>
</section>
<section class="tabpane" id="pane-trending" hidden>
<div class="sect-head"><h2>🔥 开源趋势</h2><span class="n" id="trCount"></span></div>
<div class="grid" id="trList"></div>
</section>
<section class="tabpane" id="pane-x" hidden>
<div class="sect-head"><h2>👀 大佬动态</h2><span class="n" id="xCount"></span></div>
<div id="xList"></div>
</section>
<footer>COCO 每日看板 · 每天 08:00 / 12:00 / 22:00 自动更新</footer>
</div>
<div class="modal" id="archModal" hidden>
<div class="modal-card" role="dialog" aria-label="历史归档">
<div class="modal-head"><h3>🗂️ 历史归档</h3><button class="modal-x" id="archClose" title="关闭">✕</button></div>
<div class="modal-list" id="archList"></div>
</div>

状态已发生变化。提出 BSC-R，一种确定性的 effect-boundary 机制，把单次使用的 commit 授权绑定到精确的动作本身以及\"授权状态的语义投影\"。在 2,847 个被攻击的 AgentDojo episode 上，边界内核完整保留未保护 agent 的行为（utility 80.576%，ASR 1.616%）；在 10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类预设的变更/重放类；在独立的 boundary-drift 实验中 4,403 个无效上下文零提交、5,899 个有效上下文全保留。作者诚实报告了局限：在更广泛的外部攻击套件上 BSC-R 仍有 25% 的无效 effect 提交率（CONTINUITY 套件上为 0%），因此定位为有作用域的 commit-time 一致性机制，而非通用 agent 安全方案。", "supplement": false}, {"title": "Don't Show What They Can't See: Authorization-First Schema Context for Secure Text-to-SQL", "authors": "Jianan Jiang（一作）等 6 人", "url": "https://doi.org/10.21203/rs.3.rs-10905100/v1", "category": "Research Square 预印本（2026-09-28）", "cats": [], "oneliner": "", "insight": "细粒度访问控制的跨领域实例，与我们 RU/AU 解耦形成直接对照：他们把授权执行点放在\"schema 上下文组装之前\"（本质是 per-view 思想在结构化领域的实例——只让模型看到授权视图），我们是检索后投影（retrieve-then-project）。它的\"provenance-aware permission inheritance\"（派生制品继承权限）与我们 KG 路径切割中\"派生事实的权限归属\"问题同构，可互相引用。可在 Related Work 里写一节跨领域对照（text-to-SQL schema vs RAG 非结构化文本）。注意这是 ResearchSquare 预印本（非同行评审），引用时需标注；领域是结构化 schema，未涉及 embedding 通道。不动摇 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex cited_by_count=0）", "code": "无", "zh_abs": "针对企业级 text-to-SQL 中 schema 元数据本身敏感的问题，提出 authorization-first 的 schema 上下文构造框架：表/列/关系级的授权在 relevance retrieval 之前强制执行，未授权对象永不进入低信任的检索、重排或生成组件；provenance-aware 的权限继承把保护延伸到派生制品（语义描述、join hint、SQL 示例）；在授权子空间内做权限安全的语义增强，并用 satisfiability gate 实现不泄露的弃答。在含 240 个 question-role 对、20 个数据库、4 个权限层级的 access-control-augmented Spider benchmark 上，process-level schema 暴露从每请求 35.5 个未授权对象降到 0，任务精度保持不变。", "supplement": false}, {"title": "VeriWeave Govern: Evidence-Gated Deterministic Runtime Governance for Enterprise AI Agents", "authors": "Kabeh Mohsenzadegan（一作）等 3 人", "url": "https://arxiv.org/abs/2609.37457", "category": "cs.AI, cs.CY, cs.MA, cs.SE（v1, 2026-09-26）", "cats": ["cs.AI", "cs.CY", "cs.MA", "cs.SE"], "oneliner": "", "insight": "关联中等。它的\"temporal policy evolution\"（时序策略演化）与可重放审计状态，与我们的\"策略独立存放、撤销机制\"有概念交集，可为 Discussion 的策略版本化段落提供一个引用点。但它是企业级治理框架（动作授权 + 人工审查 + 合规），不是内容级细粒度披露控制，与我们的 AU 级 claim 不竞争、不互补。它的 60k 用例 benchmark 方法论（多 seed、OOD、时序演化三轴）对我们未来 Agent 线 benchmark 设计有参考价值。列入仅为不漏检。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "面向企业 agent 的确定性运行时治理层：把动作生成与动作授权分离，用版本化策略评估结构化 agent 动作，校验 typed evidence，固定 deny > review > allow 优先级，把高后果动作路由给可问责的人工审查，并记录可重放、防篡改的审计状态。自建的 GovernBench（30 seeds、60,000 oracle 标注用例、5 个企业域、含对抗 evidence、OOD 动作、时序策略演化）上达到 0.9888 准确率、macro-F1 0.9836，零 false allow，零治理攻击成功率；消融显示 evidence gating、deny 优先、OOD fail-safe、人工审查、矛盾处理、时序重放各有互补贡献；另有 150 例欧盟/奥地利法规 grounded 的双盲人工评估。", "supplement": false}, {"title": "Same Bytes, Different Authority: Reserved-Token Representations in Chat-Template Prompt Injection", "authors": "Yan Zhan（一作）等 6 人", "url": "https://arxiv.org/abs/2609.35932", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱（完整性轴）。唯一值得记录的是它的核心发现：authority 可以编码在单个 token 的 learned representation 里——\"表示即权限信号\"。这与我们的 embedding 通道泄露有松散类比：两者都说明向量表示层会携带超出文本本身的权限相关信息，而文本级防御对此盲区。不能作为我们 A1 结论的证据引用，但可在 Discussion 里提一句\"表示层权限信号\"的开放问题。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "发现伪造的 chat-template 标记既可以作为单个 reserved control token、也可以作为普通 subword 序列到达模型（文本完全相同），而\"谁来决定用哪种编码\"的是防御方而非攻击方。把伪造标记编码为 subword（文本不变）可使 InjecAgent 上的攻击成功率下降 39–66pp（4 个开源家族中的 3 个），且差距延续到 AgentDojo 多轮任务。机制上，authority 位于 marker 位置的单个 learned vector：marker 的 subword 向量均值无法复现该 authority，而最近邻普通 token 的向量可在 Llama-3.1 上恢复攻击；自适应攻击者在 3/4 家族上能找到这样的 embedding 邻居。检查 400 个最受欢迎 chat 模型中的 67 种 tokenizer 配置，发现 33 种的标准缓解措施（把 special token 编码为普通 subword）对此类标记无效。", "supplement": false}, {"title": "Calibrating One-Round Membership Inference with Neighbors", "authors": "Francesco Rita（一作）、Jie Zhang、Florian Tramèr", "url": "https://arxiv.org/abs/2609.36331", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱。方法论上与我们 A2（单模型、top-1 分数 MI，无 reference model）同属 one-round 范式；neighbor calibration 思路可为 A2 的信号校准提供一个备选方案。但领域是图像分类器，离我们的 embedding 侧信道很远，不提供可直接引用的数字或结论。注意昨日 #9（Near-Duplicate MI）已警示 MI 阳性证据的系统性高估问题，本文的方法若用于 A2 同样需要该警示。列入仅为方法论备查。\n---", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "SOTA 的成员推断（MI）靠 reference model 对每个样本单独校准信号，但大模型训练成本使该范式难以扩展；one-round 设定（只有一个已训练模型）下逐样本校准无法估计，信号变弱。本文提出用目标点的邻居样本恢复校准：reference model 的作用只是揭示\"未见过该样本的模型会如何表现\"，而在目标模型上查询邻近样本能得到同样的信息；两种互补的邻居构造方式，叠加早期训练 checkpoint 查询可进一步增强信号。在 3 个图像分类数据集、3 种训练配置上达到与 reference-model 方法可比的攻击效果，且零额外训练成本。", "supplement": false}]}], "total": 7, "n_days": 1, "all_total": 7, "all_days": 1};

: "We’re also reopening Pro 200 subscriptions, with continued access to frontier models like Astra, including our new GPT-6.1 Sol model which brings near-Astra capabilities to a model you can use every day.\n\nOur commitment is that your subscription will continue to help you get more work done with an increasing level of quality.\n\nWe are also committing to not reintroducing the 5hr limit so that you can fully use your weekly usage when you want.", "created_at": "09-30 01:57", "likes": 410, "reposts": 16, "replies": 39, "views": 119810, "url": "https://x.com/OpenAI/status/2104993969486930015", "author": "OpenAI"}, {"id": "2104993967985381673", "text": "Ultrafast is available today for GPT-6 Astra in Codex, ChatGPT Work, and the API, with GPT-6.1 Sol coming soon.\n\nTo access it in Codex and ChatGPT Work, we’re introducing Pro 500—a new plan with our highest usage limits (25x Plus) and access to Ultrafast.\n\nhttps://chatgpt.com/pricing", "created_at": "09-30 01:57", "likes": 1018, "reposts": 46, "replies": 124, "views": 256794, "url": "https://x.com/OpenAI/status/2104993967985381673", "author": "OpenAI"}, {"id": "2104993966043320759", "text": "This is Ultrafast.\n\nOur premium speed tier, Ultrafast offers up to 8x faster token generation (300 tokens per second) in Codex and up to 6x in the API.", "created_at": "09-30 01:57", "likes": 6944, "reposts": 306, "replies": 409, "views": 1181225, "url": "https://x.com/OpenAI/status/2104993966043320759", "author": "OpenAI"}, {"id": "2104987422308335828", "text": "Codex Security Cloud is getting a major upgrade, with access to cyber-capable models through Daybreak Blue included by default.\n\nIt scans entire GitHub repos, continuously reviews new commits, investigates and deduplicates findings, and prepares fixes for review – even when your laptop is closed.\n\nAvailable as a plugin in Codex desktop and web.", "created_at": "09-30 01:31", "likes": 4304, "reposts": 300, "replies": 217, "views": 512356, "url": "https://x.com/OpenAI/status/2104987422308335828", "author": "OpenAI"}, {"id": "2104986136745767160", "text": "GPT-6.1 Sol is available starting today to all Plus, Pro, Business, Enterprise, and Edu users in ChatGPT Work and Codex.\n\nhttps://openai.com/index/introducing-gpt-6-1-sol", "created_at": "09-30 01:26", "likes": 783, "reposts": 46, "replies": 32, "views": 130886, "url": "https://x.com/OpenAI/status/2104986136745767160", "author": "OpenAI"}, {"id": "2104986135005192665", "text": "GPT-6.1 Sol shows major improvements over GPT-6 Sol in our alignment evaluations, bringing it more in line with GPT-6 Astra. It’s more transparent about its limitations and more reliable at respecting user intent and safety constraints.", "created_at": "09-30 11:05", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2104986135005192665", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2104995014208258235", "text": "Dots are here!\n\nA new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.\n\nhttps://openai.com/index/introducing-dots/", "created_at": "09-30 02:01", "likes": 14345, "reposts": 1053, "replies": 2045, "views": 1823602, "url": "https://x.com/sama/status/2104995014208258235", "author": "sama"}, {"id": "2104994601140711896", "text": "Ultrafast is\n\nso fast\n\nI do not ever want to go back", "created_at": "09-30 01:59", "likes": 11297, "reposts": 272, "replies": 1290, "views": 1025417, "url": "https://x.com/sama/status/2104994601140711896", "author": "sama"}, {"id": "2104994395980533804", "text": "6.1 Sol at 1/5th of the price of Astra, and 95% cache read discount! Extremely capable model.", "created_at": "09-30 01:59", "likes": 8057, "reposts": 272, "replies": 550, "views": 711750, "url": "https://x.com/sama/status/2104994395980533804", "author": "sama"}, {"id": "2104993363170861501", "text": "Over the past 5 weeks, the team completely rewrote ChatGPT Web on top of the desktop app codebase.\n\nThis was only possible with Astra, and it’s why Dots, Space, Codex Cloud, and so many more of our launches will come to web and desktop same day. \n\nEra of the megaproject begins.", "created_at": "09-30 01:55", "likes": 2486, "reposts": 97, "replies": 171, "views": 360094, "url": "https://x.com/ajambrosino/status/2104993363170861501", "author": "ajambrosino"}, {"id": "2104950376466362578", "text": "DevDay livestream in 2 hours.\n\nWe built some great stuff for you!", "created_at": "09-29 23:04", "likes": 9468, "reposts": 383, "replies": 929, "views": 696029, "url": "https://x.com/sama/status/2104950376466362578", "author": "sama"}, {"id": "2104661956879913457", "text": "Pretty excited for DevDay tomorrow.\n\nWe have found a new thing.", "created_at": "09-29 03:58", "likes": 9302, "reposts": 490, "replies": 855, "views": 2105363, "url": "https://x.com/sama/status/2104661956879913457", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2105519215092584786", "text": "One more thing, you can now build and deploy MCP servers right through ChatGPT. And restrict its access to anyone you want or share it with the world.", "created_at": "10-01 12:44", "likes": 4081, "reposts": 234, "replies": 359, "views": 507382, "url": "https://x.com/thsottiaux/status/2105519215092584786", "author": "thsottiaux"}, {"id": "2105464274747527543", "text": "GPT-6.1 Sol is our most demanded model pretty much ever both across both the API and subscriptions. \n\nWithin ChatGPT & Codex, we were under heavy load, but have brough more capacity online and the speed should get much better in the coming hours, reaching almost twice the speed compared to what we served yesterday.", "created_at": "10-01 09:06", "likes": 5481, "reposts": 241, "replies": 754, "views": 274043, "url": "https://x.com/thsottiaux/status/2105464274747527543", "author": "thsottiaux"}, {"id": "2105395200248156556", "text": "Asked my dot to paint me. After sending me something cartoonish, I asked it to try a bit harder and to find a recent picture of me on the internet. It did better.\n\nBelow video is me clicking through my dot's computer.", "created_at": "10-01 04:31", "likes": 1874, "reposts": 38, "replies": 349, "views": 209701, "url": "https://x.com/thsottiaux/status/2105395200248156556", "author": "thsottiaux"}, {"id": "2105348026416140781", "text": "Hi! What would you like to see us ship for dots and space in the next two weeks? Or how can we improve things in other parts of the product.", "created_at": "10-01 01:24", "likes": 3694, "reposts": 85, "replies": 4691, "views": 475953, "url": "https://x.com/thsottiaux/status/2105348026416140781", "author": "thsottiaux"}, {"id": "2105344482149613853", "text": "You can enroll here: https://chatgpt.com/cyber", "created_at": "10-01 01:10", "likes": 287, "reposts": 7, "replies": 45, "views": 131494, "url": "https://x.com/thsottiaux/status/2105344482149613853", "author": "thsottiaux"}, {"id": "2105344469923221941", "text": "For individual Daybreak Blue users, starting tomorrow (10/1), you'll need an eligible hardware key when using cyber-forward capabilities. Enterprise users are unaffected.\n\nHardware keys are a needed protection to help guarantee that you are behind the account and part of our strategy to disproportionately accelerate defenders.", "created_at": "10-01 01:10", "likes": 2662, "reposts": 86, "replies": 348, "views": 405378, "url": "https://x.com/thsottiaux/status/2105344469923221941", "author": "thsottiaux"}, {"id": "2105178959327756396", "text": "What’s up dot", "created_at": "09-30 14:12", "likes": 4009, "reposts": 73, "replies": 1917, "views": 772328, "url": "https://x.com/thsottiaux/status/2105178959327756396", "author": "thsottiaux"}, {"id": "2105105086506840421", "text": "We will have a few million dots online within days, working on all sorts of things across such a diverse and large community. \n\nExcited to learn from all of you on what you love and what doesn’t yet feel magical. Personally I felt a jump after 2-3 days of use after teaching it more about my preferences and things on my mind. It learns very quickly to be most useful and it can take on surprisingly ambitious tasks on its own.\n\nWe’re learning from how you all use your primary dot before releasing the ability to create an entire team of them.", "created_at": "09-30 09:18", "likes": 4989, "reposts": 127, "replies": 1173, "views": 700883, "url": "https://x.com/thsottiaux/status/2105105086506840421", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2105442037042663491", "text": "OpenAI's New Agent Stack: Superhuman Computer Use, Dots, Decisions API, UltraFast, & the AI Cloud https://www.latent.space/p/devday-2026\n\n@OpenAI’s @AriX and @nikunjhanda explain why Computer Use is already becoming faster than humans at real-world tasks, how Dots gives agents their own cloud computers, why better models can now debug and recover from failures, how Decisions API went from idea to product in weeks, and why async tools, UltraFast inference, caching, compaction, and higher-level agent primitives are turning OpenAI’s API into an AI-native cloud.", "created_at": "10-01 07:37", "likes": 40, "reposts": 9, "replies": 4, "views": 7148, "url": "https://x.com/latentspacepod/status/2105442037042663491", "author": "latentspacepod"}, {"id": "2105428405571428785", "text": "Announcing one more launch: ChatGPT Sites can now host MCP servers, including plugin extensions! 🤯\n\n> @⁠sites create a todo list that I can use in ChatGPT\n\nThis will:\n\n· Create an MCP server with extensions\n· Deploy that MCP server to Sites\n· Turn the MCP server into a plugin\n· Install the plugin for you across web, mobile, and desktop\n\nChatGPT is slowly becoming malleable software that anybody can customize to their needs. Very excited to see what you all build with this!", "created_at": "10-01 06:43", "likes": 547, "reposts": 45, "replies": 39, "views": 48935, "url": "https://x.com/mxstbr/status/2105428405571428785", "author": "mxstbr"}, {"id": "2105386639199732172", "text": "Had Astra on ultrafast (on med reasoning) rebuild 1-1 from scratch on the modretro they gave us at Dev Day yesterday\n\n- Took ~3 mins\n- Used 4 subagents\n- Used ~10% of my weekly limit ($500/mo. plan)\n\nUltrafast should rarely be used, but I'm ngl when u do use it it's really cool", "created_at": "10-01 03:57", "likes": 244, "reposts": 7, "replies": 21, "views": 23463, "url": "https://x.com/davis7/status/2105386639199732172", "author": "davis7"}, {"id": "2105365703654310113", "text": "Shareable profiles bring your Sites and plugins together in ChatGPT, so others can find and reuse what you’ve made.\n\nBuilt it? Show it off.", "created_at": "10-01 02:34", "likes": 779, "reposts": 36, "replies": 72, "views": 52997, "url": "https://x.com/OpenAIDevs/status/2105365703654310113", "author": "OpenAIDevs"}, {"id": "2105351380374585814", "text": "You don't need dots or Ultrafast to enter. \n\nAny 5 of the 10 quests can be completed on a Free account. \n\nChoose what's available to you — each eligible quest submission earns 1 ticket, up to 5 total: \n\nhttps://side-quests.openai.chatgpt.site/", "created_at": "10-01 01:37", "likes": 38, "reposts": 1, "replies": 3, "views": 8434, "url": "https://x.com/OpenAIDevs/status/2105351380374585814", "author": "OpenAIDevs"}, {"id": "2105207149869814091", "text": "GPT 6.1 Astra (ultra code mode) is making  this - threejs experience\ndonno whats with me and ocean - but this is gorgeous\n\nwork in progress..", "created_at": "09-30 16:04", "likes": 1083, "reposts": 62, "replies": 59, "views": 48748, "url": "https://x.com/chetanankola/status/2105207149869814091", "author": "chetanankola"}, {"id": "2105172475277693393", "text": "This is awesome from @modretro\n\nIt comes with a blank cartridge, you build games with Codex and then play them on the device.\n\nGreat work on this activation @DylanAbruscato", "created_at": "09-30 13:46", "likes": 772, "reposts": 54, "replies": 39, "views": 57703, "url": "https://x.com/rpnickson/status/2105172475277693393", "author": "rpnickson"}, {"id": "2105172136566640740", "text": "Here’s what he built 😂", "created_at": "09-30 13:45", "likes": 118, "reposts": 5, "replies": 6, "views": 24521, "url": "https://x.com/DanScalco/status/2105172136566640740", "author": "DanScalco"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2104982631037436201", "text": "Making your interview public is completely optional. Our blog post covers the benefits and possible risks of doing so.\n\nRead it here: https://www.anthropic.com/research/your-thoughts-on-ai", "created_at": "09-30 01:12", "likes": 170, "reposts": 9, "replies": 42, "views": 51070, "url": "https://x.com/AnthropicAI/status/2104982631037436201", "author": "AnthropicAI"}, {"id": "2104982629884063840", "text": "What do you want from AI?\n\nWe’re launching a new study with Anthropic Interviewer to learn more about your experiences using AI, what role you want it to play in your life and the world, and what you want from the companies building it.\n\nLast December, 81,000 people told us about their hopes and fears about AI in the largest qualitative study ever done. This time, we’re giving participants the option to make their responses public so that anyone, not just Anthropic, can learn from them.\n\nWhat you tell us will shape The Anthropic Institute’s research and inform the decisions we make. If many people say companies like Anthropic should be doing something differently, that will be on the record, where anyone can point to it.\n\nThe study runs Sept 29 to Oct 6 and is open to Free, Pro, and Max users on Claude and Claude Code.\n\nTake part here: http://claude.ai/anthropic-interviewer/your-thoughts-on-ai?from=social", "created_at": "09-30 01:12", "likes": 1954, "reposts": 183, "replies": 336, "views": 265575, "url": "https://x.com/AnthropicAI/status/2104982629884063840", "author": "AnthropicAI"}, {"id": "2104633259925630995", "text": "Claude Sonnet 5.5 is now available:", "created_at": "09-29 02:04", "likes": 11942, "reposts": 550, "replies": 401, "views": 646687, "url": "https://x.com/AnthropicAI/status/2104633259925630995", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2105624661912392028", "text": "As AI accelerates scientific discovery, we’re helping researchers keep pace by quickly authenticating if biological designs are created with built-in safeguards, without stalling crucial work. 🔬\n\nWe’re releasing these tools on an open basis for research use to strengthen safeguards → https://goo.gle/3VmICLk", "created_at": "10-01 19:43", "likes": 30, "reposts": 1, "replies": 3, "views": 8340, "url": "https://x.com/GoogleDeepMind/status/2105624661912392028", "author": "GoogleDeepMind"}, {"id": "2105624658951176323", "text": "Acting like a digital ID card, the watermark can help DNA labs verify synthetic proteins and keep sequence databases accurate.\n\nAs these requests increasingly scale, verifying if designs come from AI with built-in safeguards will help labs automate and strengthen biosecurity. 🛡️", "created_at": "10-01 19:43", "likes": 41, "reposts": 2, "replies": 7, "views": 10322, "url": "https://x.com/GoogleDeepMind/status/2105624658951176323", "author": "GoogleDeepMind"}, {"id": "2105624656170643854", "text": "SynthID Bio is our new family of watermarking methods made for AI-generated biological designs.\n\nIn a world first, we can now embed an imperceptible signature directly into protein sequences without affecting their biological function. 🧵", "created_at": "10-01 19:43", "likes": 268, "reposts": 25, "replies": 86, "views": 30734, "url": "https://x.com/GoogleDeepMind/status/2105624656170643854", "author": "GoogleDeepMind"}, {"id": "2105388087367127256", "text": "With a 1M token output limit, Argon adds a deeper level of reasoning to tackle long, multi-step problems in one go.\n\nFeedback from early testers will help us strengthen our systems before we roll out more broadly to developers, enterprises, and consumers soon.\n\nFind out more → https://goo.gle/4rZBiSd", "created_at": "10-01 04:03", "likes": 2236, "reposts": 71, "replies": 62, "views": 266128, "url": "https://x.com/GoogleDeepMind/status/2105388087367127256", "author": "GoogleDeepMind"}, {"id": "2105388084154056939", "text": "Introducing Gemini 4 Argon – our new frontier model.\n\nIt’s built for complex workflows across coding, enterprise knowledge work, and cybersecurity defense – rolling out today to a set of trusted testers through our Fairwind Program.", "created_at": "10-01 04:03", "likes": 33409, "reposts": 3723, "replies": 1435, "views": 5045598, "url": "https://x.com/GoogleDeepMind/status/2105388084154056939", "author": "GoogleDeepMind"}, {"id": "2105314763148321102", "text": "https://x.com/i/article/2105311091689414656", "created_at": "09-30 23:12", "likes": 431, "reposts": 72, "replies": 16, "views": 145259, "url": "https://x.com/pushmeet/status/2105314763148321102", "author": "pushmeet"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2105387954474746264", "text": "Importantly Argon has frontier safeguards and we are rolling it out responsibly - it’s with the US gov’t and going to a set of trusted cyber defenders through our Fairwind Program today.\n\nWe’re going to make it available as soon as we can and as safely as we can. So hold tight, lots more coming, and you’re going to see us iterating rapidly.\n\nhttps://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/", "created_at": "10-01 04:02", "likes": 1676, "reposts": 84, "replies": 51, "views": 171702, "url": "https://x.com/sundarpichai/status/2105387954474746264", "author": "sundarpichai"}, {"id": "2105387952478277979", "text": "Lots of discussion out there about our next model(!), so I wanted to give an early look as soon as possible. Introducing Gemini 4 Argon!\n\nIt shows frontier performance in complex workflows, cyber defense and software engineering. Teams are using it extensively at Google, from coding to quantum computing, great feedback. \n\nHere’s a look at the benchmarks:", "created_at": "10-01 04:02", "likes": 17514, "reposts": 1580, "replies": 932, "views": 2002888, "url": "https://x.com/sundarpichai/status/2105387952478277979", "author": "sundarpichai"}, {"id": "2105121763176894804", "text": "Great to meet today with @POTUS, @JDVance, @SpeakerJohnson and Administration + tech leaders. Important conversation and we signed today the White House Accord on Super Intelligence.\n\nAs I shared today, Google has invested hundreds of billions in the last two years alone, with more to come, across the entire stack, to deliver benefits for America and the world.  We’re working to build products that deliver real value for people and businesses, invest in local communities, and build trust in the technology.\n\nIndustry also has to innovate responsibly. Google’s focused on building the right way, with appropriate testing, evaluations, red-teaming, and other safeguards against misuse and misalignment – and releasing models or products only after they’ve been thoroughly reviewed.\n\nWe are committed to working with other industry leaders to establish norms and build public confidence. The White House Accord and the Joint Commitment on Frontier Responsibilities signed today is a solid basis for moving forward - it contains real tangible steps to promote safe development, while delivering the economic and scientific benefits of this technology.", "created_at": "09-30 10:25", "likes": 11999, "reposts": 1414, "replies": 1628, "views": 1648961, "url": "https://x.com/sundarpichai/status/2105121763176894804", "author": "sundarpichai"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2105288808929558891", "text": "New Research: We are releasing ExplorationBench, a benchmark for measuring how AI systems explore.\n\nScientific discovery begins where known problems end: a system has to frame hypotheses, design experiments, and learn from the results. Evaluating this is hard. Genuinely new answers cannot be checked quickly, and in familiar domains a model can simply recall what it has seen.\n\nAddressing this challenge, researchers from Tencent Hy, Fudan University, and Tsinghua University built verifiable Alien Worlds. Their rules are executable, so every answer is checked exactly, and they conflict with familiar knowledge, so recall alone cannot solve the tasks.\n\n🔹 Two sandboxes: AlienCode (31 hidden rule changes, 70 tasks) and AlienLogic (24 patched inference rules, 70 theorems)\n🔹 A flawed manual, four rounds of self-designed probes, and closed-book tests after every round\n🔹 Every answer graded by an interpreter or a proof checker, with no LLM judge\n\nWhat we found across 10 frontier AI systems:\n1️⃣ Getting feedback is more effective than thinking alone. No AlienCode run starts above 15.7%; after four rounds the best reaches 89.0%, while the same turns without feedback stay at 0.5–11.0%.\n2️⃣ Designing the experiments matters. Replaying a system's own best probes gives it exactly the same evidence, yet in AlienCode 9 of 10 systems do worse than when they chose the probes themselves.\n3️⃣ Knowing a rule is not using it. Even when every required rule is stated correctly, tasks are solved only 73.4% of the time.\n4️⃣ One score hides a lot. The same system under the same budget ended anywhere from 5.7% to 79.0%, and rankings barely transfer between the two worlds.\n\nCL-bench asked whether models can learn from context. ExplorationBench asks whether they can discover the rules themselves.\n\n📄 Paper: https://arxiv.org/abs/2609.30199\n🌐 Website & leaderboard: https://explorationbench.com\n📝 Blog: https://explorationbench.com/blog/\n💻 Code (coming soon): https://github.com/Tencent-Hunyuan/ExplorationBench", "created_at": "09-30 21:29", "likes": 320, "reposts": 33, "replies": 8, "views": 31413, "url": "https://x.com/TencentHunyuan/status/2105288808929558891", "author": "TencentHunyuan"}, {"id": "2105215199192207710", "text": "3 tracks. 3 winners. Go and Create. 🥇", "created_at": "09-30 16:36", "likes": 48, "reposts": 2, "replies": 1, "views": 6554, "url": "https://x.com/TencentHunyuan/status/2105215199192207710", "author": "TencentHunyuan"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": [{"id": "2097930627949711516", "text": "🌐 Supporting open source. Expanding deployment options.\n\nWe’ll work closely with the open-source community on V4.1-Flash inference support and explore more deployment options.\nPlanning a large-scale deployment with 2,000 GPUs + a storage cluster? Let’s talk.\n\n🔹 Model: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash\n🔹 Paper: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf\n\n6/6", "created_at": "09-10 14:10", "likes": 2851, "reposts": 212, "replies": }]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "", "tweets": [{"id": "1875761216062439461", "text": "购买 $ZHIPU —— 采用全自研的GLM模型架构，基于数十万亿中英文双语数据训练而成。ZHIPU 综合能力接近 GPT-4-Turbo，推理速度高达 80 token/s，阅读速度是人类极限（300词/分钟）的 25 倍，开创了AI性能的新标杆！\n\nhttps://bigmodel.cn/", "created_at": "01-05 12:28", "likes": 17, "reposts": 5, "replies": 7, "views": 9087, "url": "https://x.com/ZhipuAI/status/1875761216062439461", "author": "ZhipuAI"}]}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar": "", "tweets": [{"id": "2105256053403508849", "text": "Qwen3.8-27B is now accessible via @nebiustf. Whether you are building agents or doing deep research, this 27B dense model is ready for your multi-step workflows! 🥳", "created_at": "09-30 19:18", "likes": 291, "reposts": 14, "replies": 36, "views": 41548, "url": "https://x.com/Alibaba_Qwen/status/2105256053403508849", "author": "Alibaba_Qwen"}]}, "MiniMax_AI": {"name": "MiniMax", "label": "MiniMax 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_400x400.jpg", "tweets": [{"id": "2105372414557516212", "text": "Impressive work by the @HeyGen on the launch of HeyGen Video! ✨\n\nBuilt on MiniMax H3 and post-trained by HeyGen, it brings production-quality video to businesses at a even more accessible cost.\n\nProud to provide the foundation for this work, and excited to see how far the HeyGen team is taking it.", "created_at": "10-01 03:01", "likes": 368, "reposts": 13, "replies": 17, "views": 221416, "url": "https://x.com/MiniMax_AI/status/2105372414557516212", "author": "MiniMax_AI"}, {"id": "2105361931750306044", "text": "Built on MiniMax H3, @Creatify_Labs' Boreal-H3 is a video model optimized for advertising, keeping products and characters consistent while following creative briefs more accurately.\n\nExcited to see MiniMax H3 serve as the foundation for more frontier models tailored to specific industries! ✨", "created_at": 2147404862800097", "author": "XiaomiMiMo"}]}}, "errors": [], "summary": "**MiniMax H3 生态加速**：HeyGen Video、Creatify 的广告视频模型 Boreal-H3 均基于 MiniMax H3 构建并发布；Utopai X（H3 微调）在 Artificial Analysis 文生视频榜（v2.0）空降第二，仅次于 Wan 3.0、领先 Seedance 2.5，显示 H3 正成为第三方视频模型的热门基座。\n**Google DeepMind 发布 SynthID Bio**：首个面向 AI 生成生物设计的水印方法，可在不影响生物功能的前提下把不可感知签名直接嵌入蛋白质序列，作为\"数字身份证\"帮助 DNA 实验室验证合成蛋白来源、维护序列数据库准确性，工具已开放研究使用，瞄准生物安全合规场景。\n**马斯克主推 Grok 生态**：Grok Bot 迎来升级、Grokipedia 发布 v0.3 并以\"Encyclopedia Galactica\"为愿景公开招募共建（@SpaceXAI）；另转发 Starlink 盈利前景造势内容，整体仍是产品宣发节奏。\n**Tibo（OpenAI Codex 负责人）**：ChatGPT 内现可直接构建并部署 MCP server，还可按人限制访问或公开发布——MCP server 的创建门槛从开发者工具降到对话式操作，对 Agent 生态供给侧是实质利好。\n**中国 AI 模型与渠道动态**：腾讯混元联合复旦/清华发布 ExplorationBench（评测 AI 自主探索能力：AlienCode/AlienLogic 双沙盒，核心发现是\"有反馈的探索远胜空想\"，无反馈轮次最好仅 11%）；Qwen3.8-27B 上线 Nebius 可调用；Kimi 浏览器插件（原 WebBridge）上线、K3 登陆 Amazon Bedrock 并支持显式 prompt caching。\n**DeepSeek V4.1-Flash 降价**（9 月 10 日推文，本轮新收录）：架构更高效带来 API 降价，off-peak 价格为 peak 的 50%，同时扩大开源社区推理支持并招募 2000 GPU 级大规模部署合作——价格战仍在继续。\n注：本轮未发现用量/额度重置、rate limit 或订阅额度变更类消息；智谱一条为 $ZHIPU 代币推广帖、小米两条仅表情，无实质信息；部分低频账号的推文为近几周内最新动态而非当日发布。", "groups": [{"key": "openai", "label": "🤖 OpenAI"}, {"key": "claude", "label": "🟠 Claude"}, {"key": "google", "label": "🔵 Google"}, {"key": "china_ai", "label": "🇨🇳 中国 AI"}, {"key": "other", "label": "🌐 其他"}], "group_summaries": {"openai": "本轮仅 Tibo 一条，但信息量不小：ChatGPT 内可直接构建、部署 MCP server，并支持按人授权访问或公开发布。\n这意味着 MCP server 的供给门槛从开发者工具降到对话式操作，对 Agent 生态是实质利好。\n值得关注后续是否有配套的发现/审核机制。", "claude": "", "google": "Google DeepMind 发布 SynthID Bio——首个面向 AI 生成生物设计（蛋白质序列）的水印方法，可在不影响生物功能的前提下嵌入不可感知签名。\n定位是\"数字身份证\"：帮助 DNA 合成实验室验证序列来源、维护序列数据库准确性，工具已开放研究使用。\n这是 SynthID 家族从图像/文本/视频向生物序列的扩展，直接对应生物安全与合规审查场景。", "other": "本轮 5 条全部来自马斯克：核心是 Grok 生态——Grok Bot 升级、Grokipedia 发布 v0.3 并以\"Encyclopedia Galactica\"为愿景公开招募共建（@SpaceXAI）。\n另有一条 Starlink 盈利前景的造势视频和一条对 SpaceX 的表态。\n整体仍是产品宣发+个人品牌节奏，无技术细节披露。", "china_ai": "本轮 11 条，MiniMax H3 生态是亮点：HeyGen Video、Creatify 的广告视频模型 Boreal-H3 均基于 H3 构建；Utopai X（H3 微调）在 Artificial Analysis 文生视频榜 v2.0 空降第二，仅次于 Wan 3.0、领先 Seedance 2.5，显示 H3 正被第三方广泛选作视频基座。\n模型与渠道：Qwen3.8-27B 上线 Nebius 可调用；Kimi 浏览器插件（原 WebBridge）上线、K3 登陆 Amazon Bedrock 并支持显式 prompt caching。\n研究：腾讯混元联合复旦/清华发布 ExplorationBench，用可执行的\"外星世界\"沙盒评测 AI 自主探索能力，核心发现是\"有反馈的探索远胜空想\"（无反馈轮次最好仅 11%）。\n价格：DeepSeek V4.1-Flash 降价，off-peak 为 peak 的 50%，并扩大开源推理支持。\n智谱一条为代币推广帖、小米两条仅表情，无实质信息。"}};
const LIB = {"groups": [{"id": "access-control", "name": "RAG 访问控制", "papers": [{"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "venue": "arXiv:2609.36373 (2026)", "oneliner": "首个把\"授权先于上下文组装\"做成 sound + policy-complete 的记忆准入机制：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，10,000 个多方对话历史中零违规项进入上下文", "insight": "与我们\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照；其派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照，可在 Discussion 对比两种选择的代价；\"audience 扩大需显式对象特定授权\"可为 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience（非 AU 级内容划分），威胁面在 T1/T2 内。", "tags": ["授权前置", "related work", "必引候选"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "Scott Thornton 等", "insight": "与我们 KG 路径切割节（Round 8）主题相邻、贡献互补：他们是在线图扩展边界做单点授权检查，我们是离线 k-cut + 代价曲线（28.2% 公开文本代价、残留实体 4133→0）+ 子句级 PII 粒度。必须引用并主动写清差异；他们的 PD=2 命题与我们的 k=2 发现（k=3≡k=2）互相印证。", "oneliner": "形式化 Retrieval Pivot Risk：vector 检索出的 seed chunk 经实体链接 pivot 进敏感图邻域，造成纯向量检索不存在的跨租户泄露；提出 7 种攻击；泄露稳定出现在 PD=2（二部拓扑命题）。", "tags": ["KG", "pivot攻击", "必引"], "title": "Retrieval Pivot Attacks in Hybrid RAG: Measuring and Mitigating Amplified Leakage from Vector Seeds to Graph Expansion", "url": "https://arxiv.org/abs/2602.08668", "venue": "arXiv:2602.08668 (2026)"}, {"added": "2026-09-30", "authors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "title": "Integrating Access Control with Retrieval-Augmented Generation: A Proof of Concept for Managing Sensitive Patient Profiles (AC-RAG)", "url": "https://doi.org/10.1145/3672608.3707848", "venue": "ACM SAC 2025"}, {"added": "2026-09-30", "authors": "", "insight": "写 related work 全景段落时引用，界定我们的位置。", "oneliner": "RAG 安全攻防分类综述，§4.4 整节讲 Access Control / Privacy / Confidentiality（含 SD-RAG、AC-RAG、DPVoteRAG、PAD 等）。", "tags": ["综述", "related work"], "title": "Securing Retrieval-Augmented Generation: A Taxonomy of Attacks, Defenses, and Future Directions", "url": "https://arxiv.org/pdf/2604.08304", "venue": "arXiv:2604.08304 (§4.4)"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}]}], "note": "人工精选、长期维护的论文库；每日 08:00 看板构建时自动嵌入，不会被每日文献流覆盖", "updated": "2026-10-01"};

d Program.", "created_at": "10-01 04:03", "likes": 33409, "reposts": 3723, "replies": 1435, "views": 5045598, "url": "https://x.com/GoogleDeepMind/status/2105388084154056939", "author": "GoogleDeepMind"}, {"id": "2105314763148321102", "text": "https://x.com/i/article/2105311091689414656", "created_at": "09-30 23:12", "likes": 431, "reposts": 72, "replies": 16, "views": 145259, "url": "https://x.com/pushmeet/status/2105314763148321102", "author": "pushmeet"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2105387954474746264", "text": "Importantly Argon has frontier safeguards and we are rolling it out responsibly - it’s with the US gov’t and going to a set of trusted cyber defenders through our Fairwind Program today.\n\nWe’re going to make it available as soon as we can and as safely as we can. So hold tight, lots more coming, and you’re going to see us iterating rapidly.\n\nhttps://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/", "created_at": "10-01 04:02", "likes": 1676, "reposts": 84, "replies": 51, "views": 171702, "url": "https://x.com/sundarpichai/status/2105387954474746264", "author": "sundarpichai"}, {"id": "2105387952478277979", "text": "Lots of discussion out there about our next model(!), so I wanted to give an early look as soon as possible. Introducing Gemini 4 Argon!\n\nIt shows frontier performance in complex workflows, cyber defense and software engineering. Teams are using it extensively at Google, from coding to quantum computing, great feedback. \n\nHere’s a look at the benchmarks:", "created_at": "10-01 04:02", "likes": 17514, "reposts": 1580, "replies": 932, "views": 2002888, "url": "https://x.com/sundarpichai/status/2105387952478277979", "author": "sundarpichai"}, {"id": "2105121763176894804", "text": "Great to meet today with @POTUS, @JDVance, @SpeakerJohnson and const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s||'').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const fmtN = n => { n = n||0;
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
  return '' + n; };
const avatar = (a, h, cls, dot) => {
  const ch = esc((((a && a.name) || h || '?') + '').trim().charAt(0));
  const fb = '<span class="x-av-fb">' + ch + '</span>';
  const img = (a && a.avatar)
    ? '<img src="' + esc(a.avatar) + '" alt="" loading="lazy" onerror="this.remove()">'

  return '<span class="av-wrap ' + cls + '">' + fb + img
    + (dot ? '<span class="x-dot" hidden></span>' : '') + '</span>';
};

/* theme */
const rootEl = document.documentElement, themeBtn = document.getElementById('themeBtn');
function setTheme(t){ rootEl.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('lit-theme', t); }catch(e){} }
try{ setTheme(localStorage.getItem('lit-theme') || 'light'); }catch(e){ setTheme('light'); }
themeBtn.addEventListener('click', () =>
  setTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* tabs */
const TABS = ['papers','models','interests','trending','x'];
const PANES = TABS.concat(['library']);
function showTab(name){
  if (!PANES.includes(name)) name = 'papers';
  if (name === 'x') markXSeen();
  PANES.forEach(t => {
    document.getElementById('pane-' + t).hidden = (t !== name);
    const b = document.querySelector('[data-tab="' + t + '"]');
    if (b) b.classList.toggle('on', t === name);
  });
  ensureTab(name);  // 懒渲染：首次切到某 tab 时才渲染
  if (('' + location.hash).slice(1) !== name){
    try{ history.replaceState(null, '', '#' + name); }catch(e){}
  }
}
document.querySelectorAll('[data-tab]').forEach(b =>
  b.addEventListener('click', () => showTab(b.dataset.tab)));
document.getElementById('libBtn').addEventListener('click', () => showTab('library'));

function pdfUrl(u){
  const m = (u || '').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function codeLink(code){
  const m = (code || '').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);
  return m ? '<a href="https://github.com/' + esc(m[1]) + '" target="_blank" rel="noopener">💻 ' + esc(m[1]) + '</a>' : '';
}
function badges(p){
  const s = srcOf(p);
  let h = '<span class="badge ' + (SRC_CLS[s] || '') + '">' + esc(s) + '</span>';
  h += (p.cats || []).map(c => '<span class="badge cat">' +
    esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
  if (p.supplement) h += '<span class="badge cat">期刊/会议</span>';
  return h;
}
function card(p){
  const pdf = pdfUrl(p.url), ch = codeLink(p.code);
  const cite = (p.citations && p.citations !== '尚未收录')
    ? '<span>📊 引用 ' + esc(p.citations) + '</span>' : '';
  const links = (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文页面</a>' : '')
    + (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  return '<div class="card">'
    + '<div class="badges">' + badges(p) + '<span class="date">' + esc(p.date) + '</span></div>'
    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<details class="box zh"><summary>中文摘要</summary><div class="body">' +
        esc(p.zh_abs).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">' +
        esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + ((cite || ch) ? '<div class="meta-row">' + cite + (ch ? '<span>' + ch + '</span>' : '') + '</div>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}
function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){
  let html = '', n = 0;
  const latest = DATA.days[0];
  if (latest && latest.summary && !state.q && !state.src && !state.cat)
    html += colSummary('📌 今日论文综述', latest.summary.slice(0, 1400));
  DATA.days.forEach(day => {
    if (state.day && day.date !== state.day) return;
    const ps = day.papers.filter(match);
    if (!ps.length) return;
    n += ps.length;
    html += '<div class="day"><div class="day-head"><h2>📅 ' + esc(day.date) + '</h2>'
      + '<span class="n">' + ps.length + ' 篇</span></div>';
    if (day.summary && day.date !== latest.date && !state.q && !state.src && !state.cat)
      html += '<div class="x-summary"><div class="x-sum-b">' + md(day.summary.slice(0, 1000)) + '</div></div>';
    html += '<div class="grid">' + ps.map(card).join('') + '</div></div>';
  });
  document.getElementById('list').innerHTML =
    html || '<div class="empty">没有匹配的论文，换个关键词或清除筛选试试。</div>';
  document.getElementById('count').textContent =
    '共 ' + n + ' 篇' + (DATA.all_days > DATA.days.length ? '（近' + DATA.days.length + '天，更早的见右上角 🗂️归档）' : '');
}

/* ---- X 未读小红点：localStorage 记已读，APP 式 ---- */
const X_SEEN_KEY = 'coco_x_seen_v1';
const getXSeen = () => { try { return JSON.parse(localStorage.getItem(X_SEEN_KEY) || '{}'); } catch(e){ return {}; } };
function renderXDots(){
  const seen = getXSeen();
  let any = false;
  document.querySelectorAll('.x-chip').forEach(ch => {
    const h = ch.getAttribute('data-h'), nw = ch.getAttribute('data-newest') || '';
    const unread = !!(nw && (!seen[h] || nw > seen[h]));
    const dot = ch.querySelector('.x-dot');
    if (dot) dot.hidden = !unread;
    if (unread) any = true;
  });
  const tabDot = document.getElementById('xTabDot');
  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}
function toggleXAcc(btn){
  const g = btn.getAttribute('data-g'), h = btn.getAttribute('data-h');
  markXSeen(h);
  const det = document.getElementById('xd-' + g);
  const wasOpen = btn.classList.contains('open');
  det.parentElement.querySelectorAll('.x-chip.open').forEach(c => c.classList.remove('open'));
  if (wasOpen){ det.innerHTML = ''; return; }
  btn.classList.add('open');
  const a = XW.accounts[h];
  det.innerHTML = '<div class="x-detail-head">' + avatar(a, h, 'x-av-lg')
    + '<div><div class="x-acc-name">' + esc(a.name || h) + '</div>'
    + '<div class="x-acc-sub">@' + esc(h) + (a.label ? ' · ' + esc(a.label) : '')
    + '</div></div></div>' + twArticles(h);
  if (det.scrollIntoView) det.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function renderX(){
  const accs = XW.accounts || {};
  const handles = Object.keys(accs).filter(h => (accs[h].tweets || []).length);
  let total = 0;
  handles.forEach(h => { total += accs[h].tweets.length; });
  document.getElementById('xCount').textContent =
    (XW.date ? XW.date + ' 更新 · ' : '') + total + ' 条';
  const box = document.getElementById('xList');
  let html = '';
  if (XW.summary) {
    html += '<div class="x-summary"><div class="x-sum-t">📌 今日要点</div>'
      + '<div class="x-sum-b">' + md(XW.summary) + '</div></div>';
  }
  const gs = XW.group_summaries || {};
  const groups = XW.groups || [{key: 'other', label: '🌐 其他'}];
  html += groups.map(gr => {
    const hs = handles.filter(h => (accs[h].group || 'other') === gr.key);
    if (!hs.length) return '';
    const n = hs.reduce((s, h) => s + accs[h].tweets.length, 0);
    const chips = hs.map(h => {
      const a = accs[h];
      const newest = a.tweets.reduce((m, t) => (t.created_at && t.created_at > m) ? t.created_at : m, '');
      return '<button class="x-chip" data-g="' + esc(gr.key) + '" data-h="' + esc(h)
        + '" data-newest="' + esc(newest) + '" onclick="toggleXAcc(this)">'
        + avatar(a, h, 'x-av-chip', true)
        + '<div class="x-chip-name">' + esc(a.name || h) + '</div>'
        + '<div class="x-chip-sub">@' + esc(h) + ' · ' + a.tweets.length + '条</div></button>';
    }).join('');
    return '<section class="x-group"><div class="x-group-head"><div class="x-group-title">'
      + esc(gr.label) + '</div><div class="x-group-n">' + n + ' 条</div></div>'
      + (gs[gr.key] ? '<div class="x-group-sum">' + md(gs[gr.key]) + '</div>' : '')
      + '<div class="x-chips">' + chips + '</div>'
      + '<div class="x-detail" id="xd-' + esc(gr.key) + '"></div></section>';
  }).join('');
  box.innerHTML = html || '<div class="empty">今日暂无大佬动态数据。</div>';
}

    html += rc.map(c => '<div class="card"><div class="badges"><span class="badge cat">闭源</span>'
      + (c.date ? '<span class="date">' + esc(c.date) + '</span>' : '') + '</div>'
      + '<h3>' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) + '</h3>'

    html += ro.map(c => {

                    c.pipeline || '', c.license || ''].filter(Boolean).join(' · ');

      + (c.date ? '<span class="date">' + esc(c.date) + '</span>' : '') + '</div>'
      + '<h3><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.id) + '</a></h3>'

      + '<div class="authors">❤ ' + c.likes + ' · ⬇ ' + fmtN(c.downloads) + '</div></div>';

  if (arena.length){

            + (open ? '<span class="open-tag">开源</span>' : '')
            + (a.org ? '<span class="org">' + esc(a.org) + '</span>' : '') + '</td>'
            + '<td class="num">' + a.rating + '</td><td>' + dc + '</td></tr>';

      + '<div class="summary">人类盲测偏好评分（Bradley-Terry），数据来自 LMArena 公开数据集（CC-BY-4.0）。</div></div>';

let archScrollY = 0;
function lockBodyScroll(){
  archScrollY = window.scrollY || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + archScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';

function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, archScrollY);
}

  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  unlockBodyScroll();
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
