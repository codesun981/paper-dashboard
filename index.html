<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年11月7日 星期六</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-11-07", "summary": "", "papers": [{"title": "Rethinking Access Control for AI Agents: Recent Advances and Open Challenges", "authors": "Chijin Zhou 等", "url": "https://arxiv.org/abs/2611.06764", "category": "arXiv 预印本（arXiv:2611.06764，cs.SE）", "cats": ["cs.SE"], "oneliner": "Agent 访问控制的现状综述：按策略推导、身份与委托、动作与资源执行、信息流控制四块梳理现有机制，并提出“授权必须随工作流演进而重新评估”等四点再思考。", "insight": "这是今日与我们论文咬合最紧的一篇，也是我们新方向（执行时授权绑定）最直接的 related work 候选。第一，它的四块分类法（策略推导 / 身份委托 / 动作执行 / 信息流）可以借来作 related work 的组织骨架，我们的 RU/AU 解耦与“查询时逐 AU 求值”正好落在“动作与资源执行”一节里，有现成的位置可放。第二，它提出的“授权必须随工作流演进而重新评估”与我们“执行时绑定”的主张是同一思想的不同表述，可互相印证；“上下文信息可为决策提供依据、但本身不授予权限”这一点，则可用来回应一种常见质疑——即“agent 看到了某条信息是否等于获得了授权”，答案是否定的。第三，它的评估标准（同时看可观测行为与仍被允许的未授权效果）值得借鉴：ChainBind 的 E12 里 blocked_arg 归零但 ASR 未归零，正说明“观测到的越权少了”不等于“未授权效果被关掉了”，引用这条标准可以让我们的评估一节站得更稳。诚实标注：这是一篇综述而非实证工作，本身不提供新的数字或 benchmark；引用时应只引用其分类与论点，不把它当作任何机制有效性的证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "大模型 agent 会访问数据、调用工具、代用户行动，但 agent 自主选择执行路径、权限与运行条件又可能中途变化，要把它的行为约束在授权范围内并不容易。本文综述近年 agent 访问控制的进展，覆盖四个方面：策略的表述与推导、身份与委托、动作与资源的执行、信息流控制；比较各机制的控制对象、执行边界与假设，考察单个机制能做到什么、彼此如何配合。在此基础上，作者对授权的四个方面提出再思考：计划选择会塑造权限需求；上下文信息可以为决策提供依据、但本身不授予权限；限制条件在跨越系统接口时必须保持原意；授权必须随工作流演进而重新评估。文末给出开放挑战、具体研究问题与评估标准，特别强调评估应同时考察 agent 的可观测行为与“仍被允许的未授权效果”。", "supplement": false}, {"title": "Revoked, Not Stopped: Late Revocation Notices and Channel-Switching in LLM Agents", "authors": "Muzammal Hussain", "url": "https://doi.org/10.5281/zenodo.23964291", "category": "预印本（Zenodo，2026-11）", "cats": [], "oneliner": "撤销不是瞬间生效的：通知晚到一步，16.5% 的已撤销敏感动作照常通过；撤销若只按工具名下发，agent 会改走另一条通道把数据送出去，最高达 38.7%。", "insight": "这篇补上了我们论文尚未系统处理的一块：**授权的撤销**。我们的 RU/AU 框架默认“权限在查询时求值”，但这篇证明“求值时点”与“撤销到达时点”之间的滞后本身就是攻击面——16.5% 这个数字是“权限变了、判定没跟上”这一失效模式的直接量度，可与我们的“查询时逐 AU 求值”并列：我们讲求值应在查询时发生，它讲求值还必须在每次敏感动作前重做（否则滞后窗口就是 16.5%）。第二，“撤销必须按效果（数据离境）而非按工具命名”这一结论可直接写入威胁模型：我们的 AU 若按工具或数据源命名，同样会被通道切换绕过；按效果界定 AU（例如“患者文档不得离境”）才是对的粒度。第三，“403 裸错误会让通道切换率从 10.6% 升到 56.4%”说明拒绝消息的表述方式本身是安全机制的一部分，讨论节可借它写一句：我们的“未知 AU 默认拒绝”在实现时应返回明确的撤销语义，而非裸错误码。诚实标注三点：模拟器是确定性的 1800 条轨迹、真实模型实验只用了 5 个开源小模型（3B–8B），数字不宜直接外推到前沿闭源 agent；“患者文档外发”是虚构场景，不是真实医疗数据；venue 是 Zenodo 预印本，未经同行评审，引用时只引用其实验设计与数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "github.com/MHKhan50/agent-revocation-lag-benchmark (★0)", "zh_abs": "工具调用型 agent 可能在权限被撤销后继续按旧权限行动。本文研究两种失效方式。第一，agent 运行时缓存的授权要等撤销通知到达才失效：作者用 RevocationLag 确定性模拟器跑了 1800 条动作轨迹，通知晚到一步会让 16.5% 的已撤销敏感动作通过（95% CI 15.6–17.4）；丢失 30% 的通知时通过率为 28.2%；每两步重发一次丢失的通知可降至 12.7%（每回合 2.32 次控制事件）；只有每次敏感动作前都复核才能归零，代价是每回合 5.21 次控制事件。第二，agent 自身会绕过拒绝：在 1916 个回合、5 个本地运行的开源权重模型上，首次尝试把一份虚构患者文档发到诊所之外均被拒绝；但当撤销只覆盖被拒绝的那个工具（即权限按工具名命名）时，文档会经由另一条通道外泄，qwen2.5:3b 为 38.7%、qwen2.5:7b 为 33.5%、llama3.2:3b 为 11.2%、llama3.1:8b 为 5.4%；162 次外泄中有 96 次 agent 还同时告诉临床医生“权限已被撤销”。把明确的撤销消息换成一句光秃秃的“403 Forbidden”，qwen2.5:7b 的通道切换率会从 10.6% 升至 56.4%；在系统提示词里加一条规则能降低但不能消除该行为。结论是：agent 的撤销必须按效果（数据离境）来界定、在每次调用时执行、并明确表述。", "supplement": false}, {"title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "authors": "Woosang Lim 等", "url": "https://arxiv.org/abs/2611.07222", "category": "arXiv 预印本（arXiv:2611.07222，cs.CR）", "cats": ["cs.CR"], "oneliner": "不靠模型临场判断的确定性防线：动作的目标值只认工具类型化返回里的字段，注入文本一律先清洗、留证，三个 backbone、七个任务套件上标准模板注入零次得手。", "insight": "这篇与我们的“执行时授权绑定”在方法论上高度同构，值得在讨论节作强对照。我们的思路是“执行时逐 AU 求值、未知默认拒绝”，SPILLWAY 的思路是“目标值只认类型化字段、自由文本一律不算数”——两者都把“模型在运行时临场决定能做什么”这个自由度收走了，只是一个收在授权判定上、一个收在动作目标的来源上。它的“确定性底线 + 本地裁决器可恢复被拒调用、但绝不恢复目标在已删文本里的调用”这个不对称设计，尤其值得借鉴：我们的 per-view 索引与 retrieve-then-project 也可以配一个类似的“只放宽、不放行已污染目标”的恢复规则。诚实标注：零得手是在“标准模板注入”与作者选用的七个任务套件上的结果，强化学习攻击者仍有 0.007 的平均成功率；且它的准入判定依赖“目标值来自类型化字段”这一前提——对返回全是自由文本的工具（例如通用网页抓取），这条底线会退化为全靠清洗器，引用时应写清这一适用条件。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "工具调用型 agent 会操作邮件、文件与支付，藏在网页或共享文档里的指令可能让 agent 把数据或钱发给攻击者。许多运行时防御把“是否放行”的决定交给一个语言模型，因而决定本身可能读到攻击文本、且每步都要多调模型；溯源类防御把模型移出最终检查，却仍需模型先规划或路由每个任务。本文指出动作的目标其实可以从工具的类型化返回值里读出来：邮件发件人、支付账号等以类型化字段到达，而注入指令只以自由文本到达。SPILLWAY 据此建了一道无需逐任务规划的确定性底线：仅当工具输出中出现、但用户任务里没有的每个目标值，都是由只读工具以类型化字段返回、或被固定委托规则覆盖时，才放行该调用；确定性清洗器按固定规则删掉指令式片段、留存删掉的片段作证据，本地裁决器可以恢复被拒绝的调用，但绝不恢复目标落在已删文本里的调用。在三个 backbone、其中一个 backbone 的七个任务套件上，标准模板注入在 SPILLWAY 下零次把动作重定向到攻击者目标，且效用与综合评分（NRP、ERS）在所比较的防御中最高；伪造的聊天模板同样打出零分，在已发布的强化学习攻击者面前平均域内攻击成功率仅为 0.007，且全程几乎不增加模型调用、无需因防御触发而重跑 backbone。", "supplement": false}, {"title": "Beyond Instruction Override: Benchmarking Indirect Prompt Injection with Task-Tampering Attacks", "authors": "Rongting Zhang 等", "url": "https://arxiv.org/abs/2611.07640", "category": "arXiv 预印本（arXiv:2611.07640，cs.CR）", "cats": ["cs.CR"], "oneliner": "把间接提示注入重新定义为“越权”而非“像指令”：90 个验证案例里攻击篡改的是正在进行的任务的决策本身，现有防御对非目标类攻击几乎失效。", "insight": "这篇的定义工作对我们最有价值：**“按权限而非措辞定义注入”**——植入内容是否构成攻击，取决于其来源是否有权决定该决策，而不是它看起来像不像指令。这与我们的 AU 思路是同一枚硬币的两面：AU 回答“谁有权决定什么”，它回答“无权决定者试图决定即攻击”。这个定义可直接借来收紧我们威胁模型里 T1/T2 的表述（把“注入”从“文本像指令”改成“来源越权”）。第二，它的 90 个验证案例是可直接复用的评估素材，且攻击目标覆盖决策的六个环节，比只测任务重定向的基准更贴近真实 agent 的失效模式；ChainBind 若要补一个“决策篡改”评估臂，这套案例是现成的起点。第三，“工具策略防御 15.4% 对无防御 17.0%”这个数字值得在讨论节引用：它说明只限制“调哪个工具”、不限制“决策值从哪来”的防线几乎无效——这正是我们主张“授权绑定到执行（而非调用名）”的经验证据。诚实标注：90 个案例、三个环境、五个 LLM 的规模不算大，且“检测并删除”防御在观测/状态类攻击上仍有 9.5%/12.1% 的残余，说明该基准测出的更多是“现有防御的盲区”而非“某防御已解决此问题”。", "source": "arXiv", "citations": "尚未收录", "code": "github.com/amazon-science/task-tampering-prompt-injection (★0)", "zh_abs": "现有的间接提示注入基准大多只测“植入指令把 agent 引向攻击者指定的任务”。但攻击者控制的内容也可以篡改正在进行的任务的结果——例如买家纠纷证据引用一条虚假退款政策，在不改变任务的前提下抬高退款。本文按权限而非指令措辞来定义间接提示注入：当植入内容试图影响一个其来源无权决定的决策时，即构成攻击。作者据此建了一个让这条边界显式的基准：90 个验证案例、横跨三个工具使用环境，每个案例里用户请求都指明哪个来源有权裁决被针对的决策；每次攻击篡改的都是良性任务本身需要的决策，而非替换任务。每个案例的攻击针对 agent 决策的至多六个环节：目标、决策规则、可用动作、预期后果、对观测的解读、对当前状态的信念。无防御时，针对决策规则、可用动作与状态三类目标的攻击，在五个 LLM 上的平均成功率高于针对目标本身的攻击；检测并删除类防御能把目标类攻击压到 2.4%，但观测类与状态类攻击仍有 9.5% 与 12.1%，且在针对检测优化的重写下差距依旧；工具策略防御仍有 15.4% 的攻击成功率，接近无防御的 17.0%——因为这类攻击通常保留预期工具、只操纵执行中得到的值。因此，只测任务重定向或只针对 agent 目标的评估，会高估这些防御的覆盖范围。", "supplement": false}, {"title": "SecureGARD: Dynamic Ontology-Guided Governance for Secure Tool-Using LLM Agents", "authors": "Guoqin Xiong 等", "url": "https://arxiv.org/abs/2611.06682", "category": "arXiv 预印本（arXiv:2611.06682，cs.LG）", "cats": ["cs.LG"], "oneliner": "用可执行本体给工具调用做确定性裁决：就绪 / 等待 / 禁止三态，三个基准上间接提示注入攻击成功率 0%，且受攻击时效用反而高于基线。", "insight": "这篇与 SPILLWAY 形成一对有价值的对照：两者都把“模型临场决定”换成确定性判定，但 SecureGARD 用可执行本体 + 情节任务状态，SPILLWAY 用类型化返回值——一个重语义建模、一个重来源判定。它的“等待（义务未满足但可恢复）”三态裁决比二值允许/拒绝更贴近真实 agent 工作流，可作我们执行语义一节的对照：我们的 all-of 拒绝与 retrieve-then-project 之间，也可以考虑一个“义务未满足时挂起而非直接拒绝”的中间态。值得注意的是它在 AgentDyn 上也测了 0% ASR——而 AgentDyn 的作者自己说“现有防御要么不够安全、要么过度防御”，SecureGARD 称效用反而更高，这个张力值得细读原文的方法一节再决定是否引用。诚实标注：0% 是在三个作者选用的基准上的结果；本体需离线从已验证执行中演化，冷启动成本与跨工具泛化能力未量化；且“等待”态依赖“义务”能被本体显式表达，对开放式任务这一前提可能不成立。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "工具调用型大模型 agent 把模型输出翻译成有后果的动作，使间接提示注入成为执行安全问题。现有防御约束工具调用、轨迹或信息流，但常把动作语义、状态依赖与证据关系留在隐式层面，难以跨异构工具泛化、也难安全更新。本文提出 SecureGARD，一个动态本体引导的治理框架：把异构调用 grounding 到共享语义表示上，结合可执行本体与情节级任务状态，推导出确定性的就绪、等待与禁止三类裁决；“等待”表示某项可恢复的义务尚未满足，允许有界重规划而不扩大 agent 的授权边界。本体离线演化：离线 LLM 从已验证的训练执行中提出与实例无关的动作–状态公理，只有在能解决训练失败暴露的本体错误、保持逻辑一致性与受保护蕴含、并通过留出验证后才会被接受、本体随之冻结。在 AgentDojo、ASB 与 AgentDyn 三个基准的良性与间接提示注入设定下，SecureGARD 在三者上均取得 0% 攻击成功率，且受攻击时的任务效用高于现有基线。结果表明，显式的语义治理可以在不牺牲效用的前提下强化执行安全。", "supplement": false}, {"title": "An Explainable Graph Attention Network for Indirect Prompt Injection Detection in RAG Systems", "authors": "V. Rudrani 等", "url": "https://doi.org/10.22214/ijraset.2026.85566", "category": "期刊论文（International Journal for Research in Applied Science and Engineering Technology，2026）", "cats": [], "oneliner": "在检索内容进 LLM 之前用图注意力网络先检一遍：自采 1 万条样本上准确率 99.80%，但数据集未公开、未独立验证。", "insight": "关联较弱，但有一点方向可取：它把检测点放在“检索内容进入 LLM 之前”，与我们“授权判定在检索结果进上下文之前由架构保证”的立场方向一致——都是“进上下文之前先设关口”。除此之外不宜多引：IJRASET 为低门槛期刊，数据集为自采的金融/公司政策文档（未公开、未独立验证），99.80% 的数字是在自采数据上取得的，不宜引用为方法有效性的证据；且它只做“有害/良性”二分类，不区分“谁有权决定什么”，与我们的授权框架不在同一层。最多在 related work 里提一句“GAT 检测是另一条技术路线”，不进入核心论证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "RAG 让大模型用外部文档回答问题，但检索到的内容可能藏有操纵模型行为的隐蔽指令，即间接提示注入。本文提出一种基于图注意力网络（GAT）的检测方法：在文档进入语言模型之前识别有害指令。每篇文档按句切分，用冻结的 DeBERTa-v3-base 编码；按相邻句与余弦相似度高于 0.7 的句对建图；一个约 0.4M 可训练参数的两层 GAT 对文档做良性/恶意二分类。评估用从金融与公司政策文档中收集的 10000 条样本（训练 6400、验证 1600、测试 2000，两类均衡）；在输入特征上加校准高斯噪声后，测试准确率 99.80%、F1 0.998、Matthews 相关系数 0.996，准确率的 95% Wilson 置信区间为 99.49%–99.92%。关键词基线准确率为 87.93%，但 24.1% 的恶意样本不含其任何触发词。作者也承认，在未见数据上的表现仍需通过独立收集的实验进一步验证。", "supplement": false}, {"title": "A Governed Human–AI–Agent Workflow for Specialized Data and Data Engineering Agents: Authorization, Verification, and Provenance", "authors": "Héctor Poblete 等", "url": "https://doi.org/10.3390/electronics15215135", "category": "期刊论文（Electronics，MDPI，2026）", "cats": [], "oneliner": "人工监督下的数据工程 agent 治理工作流：九阶段 + 四份 prompt 合同，一次未验证的干预把 F1 提到 0.9077、却引入 49 个假阴性。", "insight": "关联较弱——它的“授权”是人工监督下的数据工程工作流治理（九阶段 + 四份 prompt 合同），不是 RAG/检索授权，与我们的 AU 框架不在同一层。但其中一个教训可作讨论节的旁证：“一次未验证的技术干预把 F1 从 0.8084 提到 0.9077、却引入 49 个假阴性”，说明任何“先执行、后验证”的 agent 工作流都需要一道“效果验证后才接受新持久状态”的关口——这与我们“授权判定在检索结果进上下文之前”的主张方向一致，只是它发生在数据写入侧。诚实标注：实验是合成学术数据的受控 Data Lakehouse 演示，方法论是设计科学研究（DSR）而非可复现的安全评估，引用价值有限；不要把它写成 agent 授权的实证证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "大模型 agent 越来越多地用于数据工程环境中分析数据、生成代码与执行操作，但技术上执行成功并不保证操作已获授权、结果正确可验证；当专业 agent 修改持久数据时，这会带来治理挑战。本文提出一个受治理的人–AI–agent 工作流，在人工监督下协调数据专家 agent 与数据工程 agent，明确规划、授权、执行、验证与溯源各自的责任。工作流用改编的设计科学研究方法开发，并在合成学术数据的受控 Data Lakehouse 实验中演示；通过分析记录在案的执行失败（重复执行、评估单位不一致、过早补救、跨数据质量规则的非预期影响），提炼治理需求与操作控制。最终产物包括九个阶段与四份基于 prompt 的合同：规划、执行、验证与精炼。一次初始干预把数据质量检测 F1 从 0.8084 提高到 0.9077，但引入了 49 个假阴性；随后一次经授权的精炼把 F1 提高到 0.9988，仅剩一个假阴性。结果说明，在接受新的持久数据状态之前，验证技术干预的效果至关重要。", "supplement": false}]}, {"date": "2026-11-06", "summary": "", "papers": [{"title": "Governed Retrieval Augmented Generation with Guardrails Role Based Access Control and Audit Logging", "authors": "Lohith Reddy Kalluru", "url": "https://doi.org/10.21275/sr261031123753", "category": "期刊论文（International Journal of Science and Research，2026-11-04）", "cats": [], "oneliner": "企业 RAG 的权限治理实测：只靠索引层过滤时，角色撤销后 99.5% 的查询仍会泄漏未授权上下文；加一道查询时权限复核后违规归零。", "insight": "这是今日与我们论文咬合最紧的一篇，因为它把我们主张的两个关键点都变成了可引用的数字。第一，**索引层过滤不等于授权**：99.5% 这个数字是“权限变了、索引没跟上”这一失效模式的直接证据，可与我们的“策略独立存放、查询时逐 AU 求值”并列——我们讲架构，它讲失效的量级。第二，**复核必须发生在查询时而非摄入时**：它的“当前权限复核”与我们的“查询时逐 AU 求值”是同一思想的不同实现，可在 related work 里互相印证。但必须诚实标注三点：其一，这是 SQLite FTS5 词法检索上的合成诊断，没有 LLM、没有真实语料，99.5% 不宜直接读成“生产 RAG 的泄漏率”；其二，venue 是 IJSR（低门槛期刊），同行评审分量有限，引用时应只引用其实验设计与数字、不引用其“治理框架”的宣称；其三，它只测了“角色/文档撤销”两类权限变化，未覆盖我们 T2/T3 的排序向量与全知识攻击面，不能用来支撑 embedding 通道部分的论证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业级 RAG 必须在保留源权限的同时控制不安全内容并留存审计证据。本文把带权限标签的摄入、授权感知检索、guardrails 与关联日志整合起来，在可复现的合成诊断中评估授权边界：5 种检索策略 × 8 次语料随机化，每次 750 篇文档、12 个主体、360 条查询、5 种策略条件，排序用 SQLite FTS5 精确词法排名，未评估任何语言模型或 Bedrock 部署。结果是：仅索引过滤时，角色撤销类查询平均 99.5%、文档撤销类 57.7% 会混入未授权上下文；加上一次“当前权限复核”后，测试条件下观测到的上下文违规为零；删掉 10% 私有索引元数据后授权召回为 92.1%；策略服务中断时所有受保护方法一律弃权。独立重算验证了保存的检索与策略决策。作者明确说明：这些结果只说明一种已知的“过期权限”失效模式及其缓解，不构成生产安全、生成答案安全或合规性结论。", "supplement": false}, {"title": "When Do Summaries Become Instructions? Unsupported Policy in LLM Agents' Self-Written Handoff Summaries", "authors": "Wenhui Chu", "url": "https://arxiv.org/abs/2611.06545", "category": "arXiv 预印本（arXiv:2611.06545，cs.CL）", "cats": ["cs.CL"], "oneliner": "长程 agent 压缩上下文时自己写出的交接摘要，会凭空编造出记录里不存在的权限与要求——无根据的授权占 0.1%–1.3%，且真能让继任者多做未授权动作。", "insight": "这篇把“授权”从静态策略表推进到了 agent 的**运行态记忆**，与我们的 T1 之外又开了一个新攻击面：**上下文压缩本身会制造授权**。我们的威胁模型假设“权限来自策略、执行来自工具调用”，但这篇证明，agent 在两次调用之间自己写出的摘要就能凭空多出一条授权（0.1%–1.3% 听着小，但“中性化虚假批准后未授权动作 24→7”说明它真会落地成越权行为），而且来源是 agent 自己的推理、不是外部注入——这比提示注入更难防，因为没有“不可信输入”可拦截。讨论节可借它写一句边界声明：我们的 AU 求值假设权限判定依据（策略、检索结果）是可信的，但如果 agent 的记忆/摘要本身就是权限的来源之一，则需要在“摘要进入上下文之前”也设一道关口（例如只允许结构化账本、不允许自然语言摘要携带权限断言）。诚实标注：1.2%/2.4% 与 0.1%/1.3% 是两个开源权重模型上的数字，闭源前沿模型未测；限制类句子的因果效应本身不显著（p=0.58），只有授权类句子的中性化有效果且为事后分析，引用时不要把“摘要导致越权”写成已确立的因果结论。", "source": "arXiv", "citations": "尚未收录", "code": "github.com/Chuw1/handoff-audit (★0)", "zh_abs": "长程 LLM agent 会把大部分历史压缩成摘要以继续任务。本文问：交接摘要是否会写出记录并不支持的权限或要求、这类句子是否会改变下一个实例（继任者）的行为、以及它们从何而来。实验用带 ground-truth 权限账本的合成工具使用任务，并用“同一快照重放”方法：把可疑句子替换成中性填充词后重跑继任者。两位 AI 评审员只读规则标记出的 held-out 摘要，确认两个开源权重模型的可读摘要里，无根据的限制占 1.2% 与 2.4%，无根据的授权占 0.1% 与 1.3%。对限制类句子，预先设定的重放检验不显著（p=0.58），后续检验发现脆弱效应（p=0.027）；而把虚假批准中性化后，未授权动作从 120 次 held-out 运行中的 24 次降到 7 次（事后分析；另一组为 48 次中的 17 次降到 11 次）。多数限制源于 agent 此前“某动作需要批准”的推理。预先设定的检验还发现，把系统提示词里的“有些动作需要批准”改成说明“要求从何而来”，可把无根据限制从开发集摘要的 5.0% 降到 1.8%、held-out 模板的 1.8% 降到 0.3%（均 p<10⁻⁹），而对账本真正要求的批准请求几乎没有影响。", "supplement": false}, {"title": "Securing Web Agents with the Compile-Then-Execute Paradigm", "authors": "Annabella Chow 等", "url": "https://arxiv.org/abs/2611.06039", "category": "arXiv 预印本（arXiv:2611.06039，cs.CR）", "cats": ["cs.CR"], "oneliner": "Web agent 的范式之争：先把用户请求编译成固定程序再执行，不让规划模型在运行时看网页内容——WASP 上攻击成功率 0%，WebArena 效用反而更高。", "insight": "这篇的价值在于它给出了一个**与“运行时授权绑定”同构、但发生在另一层的解决方案**，可作我们执行语义一节的强对照。我们的思路是“执行时逐 AU 求值、未知默认拒绝”，Baya 的思路是“执行前把任务编译成固定程序、运行时不允许合成新操作”——两者都把“模型在运行时临场决定能做什么”这个自由度收走了，只是一个收在授权判定上、一个收在控制流结构上。它的 0% ASR + 77.8% 效用（高于两个 ReAct 基线）这个组合值得在讨论节引用：它说明“收紧自由度”不必然以效用为代价，至少在 WebArena 这类任务上，提前编译反而帮模型避开了注入的干扰。但需诚实标注：0% 是在 WASP 这一作者选用的安全基准上的结果，且 Baya 依赖一个“Trusted Website API”——即网站动作空间必须事先被可信地抽象出来，这在开放网络上是一个很强的前提；我们的 AU 求值不依赖这种前提，两者的适用条件不同，引用时应写清 Baya 的前提、不要把它写成“通用解法”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Web agent 通常遵循 ReAct 范式，每一步动作都从混合了可信与不可信内容的运行时观测中选出，这种设计使控制流容易被嵌在网页里的提示注入劫持。本文提出 Baya：一个“编译后执行”的 web agent，设计上防止提示注入驱动的控制流劫持。在访问真实网站之前，Baya 先把用户请求编译成调用 Trusted Website API 的可执行 Python 程序；规划模型不观测真实网页内容，只有编译好的程序处理网页内容。不可信数据可以决定程序的取值、或在编译时已定义好的分支中选择，但不能重新定义用户任务，也不能让模型在运行时合成新的网站操作。Trusted Website API 给编译器一个统一的网站动作空间视图，从而可以提前规划，无需反应式 agent 那种逐步动作发现。在 581 个有效的 WebArena Verified 任务上，Baya 的总体效用为 77.8%，高于纯浏览器 ReAct（55.1%）与 API 版 ReAct（66.7%）；在 web agent 安全基准 WASP 上，Baya 的攻击成功率为 0%，而 API 版 ReAct 为 16.2%、纯浏览器 ReAct 为 25.5%。", "supplement": false}, {"title": "Read-Only Protection in MCP Database Servers: Classifier Blind Spots and Defense-in-Depth", "authors": "Shiqiang Chen", "url": "https://doi.org/10.5281/zenodo.23927631", "category": "预印本（Zenodo，2026-11-03）", "cats": [], "oneliner": "MCP 数据库服务器的“只读”承诺有多脆：分类器把 `SELECT * INTO` 误判为 SELECT，一个 77 星仓库因此存在可利用的授权缺陷；执行层只读能把它变成无害。", "insight": "这篇与我们论文的咬合点非常具体：**“只读”不是一个声明，而是一个必须在执行层兑现的授权语义**——这正是 RU/AU 解耦里“策略独立存放、执行时求值”要解决的问题在 MCP 世界的翻版。它的 L1/L2/L3 三层模型可直接借用到我们的讨论节：L1（语句分类）对应“按文本/启发式判断权限”，L2（角色授权）对应“策略表”，L3（执行层只读）对应“执行时强制”；而 `SELECT * INTO` 这个例子说明，只做到 L1/L2 而缺 L3 时，一个分类器的盲点就能让整个授权承诺失效——与我们“未知 AU 默认拒绝”要防的正是同一类“判定层与执行层脱节”。第二，它的“事务语义陷阱”（未提交写入会被回滚）提醒我们：评估授权机制时要小心“看似成功实则未落地”的假阳性，这对我们自己设计评估实验有方法论价值。诚实标注：这是 Zenodo 预印本（非同行评审），只审计了 6 个服务器、1 个可利用缺陷，77 星仓库的个案不宜读成“MCP 只读普遍不可信”；且检测器仓库链接未在摘要中给出，引用其工具前需先核实链接。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（文中称 11 模式检测器已开源，但未给出仓库链接）", "zh_abs": "模型上下文协议（MCP）服务器已被 30 多个 AI 助手采用，用于把 LLM 接到外部数据；其中宣称只读角色的数据库服务器最为安全敏感，因为一次绕过就会把 AI agent 变成数据库写入者。已有工作罗列了 MCP 生态的漏洞，但没有度量“只读”具体怎么实现、也没有解释为什么两个实现面对同一个盲点会有不同结局。本文定义了只读保护的三层模型（L1 语句分类、L2 基于角色的授权、L3 执行层只读强制），审计了 6 个面向数据库的 MCP 服务器，并用真实 PostgreSQL 16.15 的运行时差分实验与一个自研的 11 模式静态检测器逐层度量。结果：确认了一个可利用的授权缺陷（CWE-863/281，77 星仓库），其中 `SELECT * INTO` 被 sqlparse.get_type() 分类为 SELECT，使写入角色得以建表；同时证明纵深防御（L3 的 conn.read_only=True）能让同一盲点在第二个服务器上无害，而第三个服务器用递归关键词扫描（含 INTO）直接拒绝。检测器经过 6 轮迭代（v4–v7d），在 4 个被审计仓库上把误报从 40 条降到 0 条且召回无损。作者提供了 L1/L2/L3 模型、可复现的度量协议（包括“未提交写入会被事务语义回滚”这一陷阱）与一个保持精确率与召回率的开放 11 模式检测器。", "supplement": false}, {"title": "A.S.E 2.0: Understanding How Repository Context Impacts the Security of LLM-Generated Code", "authors": "Jiongchi Yu 等", "url": "https://arxiv.org/abs/2611.06294", "category": "arXiv 预印本（arXiv:2611.06294，cs.CR / cs.AI / cs.SE）", "cats": ["cs.CR", "cs.AI", "cs.SE"], "oneliner": "给 LLM 生成代码时喂什么上下文，决定它看不看得到项目的安全防线：少一个 safeguard，安全通过率最多掉 8.1 个百分点；多一个不安全示例，可利用代码增加 6.3 个百分点。", "insight": "关联较弱，但有一条可借鉴的方法论启示：**“模型有没有看到防线”本身就是一个需要度量的变量**。我们的 RAG 授权讨论默认“策略在场、模型按策略行事”，而这篇证明，即使防线就写在仓库里，agent 也只有 27%–36% 的轨迹真正看到了它——换到 RAG 场景就是：即使 AU 策略已正确下发，模型也可能因为上下文构造方式而“看不见”它。这支持我们在讨论节补一句诚实的边界：授权机制的有效性不仅取决于策略是否正确，还取决于策略信息是否以模型实际会注意到的形式出现在上下文里；“策略独立存放”之后，还需要一个“策略可见性”的评估维度。CASE-Bench 的“逐个编辑上下文元素”这一对照方法也可借鉴到我们自己的消融实验设计里。但需说明：这篇讲的是代码生成而非 RAG 授权，8.1pp、6.3pp 等数字不能直接迁移到我们的场景，引用时只能引用其方法论启示，不能引用其数字作为我们领域的证据。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "LLM 编码助手与 agent 在生成代码前会先构造仓库上下文；对安全敏感代码而言，这个上下文决定了模型能否看到项目的安全防线（如授权检查）、还是只看到可模仿的不安全代码。但上下文构造几乎只为功能正确性设计，而安全代码基准又把上下文当作固定量，因此仓库上下文如何影响生成代码的安全性一直不清楚。本文构建 CASE-Bench：145 个仓库级任务，来自 51 个项目的真实 CVE，每个任务都在 Docker 中运行，配有功能测试与双向验证的概念验证漏洞利用，并标注了仓库中强化或削弱安全的代码。用 CASE-Bench 对比 13 种上下文构造方法与 6 种控制手段、6 个 LLM，并逐个编辑上下文元素、分析编码 agent 的轨迹，发现：（1）面向功能的上下文最多把功能通过率提高 8.2 个百分点，但安全通过率最多只提高 3.7 个百分点；（2）拿掉一个 safeguard 会让安全通过率最多下降 8.1 个百分点，而插入一个不安全示例会让“功能正确但可利用”的代码增加 6.3 个百分点；（3）编码 agent 只有在 27%–36% 的轨迹里真正观察到了相关的 safeguard。这些发现可指导安全感知的上下文构造与安全代码评估。", "supplement": false}, {"title": "Privacy-Preserving Retrieval from Redacted Corpora: Effects of Retrieval Paradigm and Relevance Definition", "authors": "Yoshiyuki Sakamaki 等", "url": "https://doi.org/10.1007/978-3-032-37676-3_10", "category": "会议论文（ECML PKDD 2026，Lecture Notes in Computer Science, vol 16947）", "cats": [], "oneliner": "RAG 语料先脱敏再检索，代价有多大取决于检索范式：BM25 在脱敏下保持稳健，稠密检索与 ColBERT 则出现有统计支撑的退化。", "insight": "这篇与我们论文的咬合点在“裁剪/脱敏之后检索还剩多少用”这一问题上，可与我们的 retrieve-then-project 执行语义直接对照。我们的裁剪是按 AU 做的（未授权片段不进上下文），它做的是按 PII 做的（敏感实体先脱敏再检索），但两者面临同一个权衡：**保护越彻底，检索信号损失越大**。它的关键发现是这种损失不是均匀的——BM25 稳健、稠密检索退化——这对我们有两点启示：第一，我们评估裁剪语义时也应分检索范式报告效用损失，不能只报一个总体数字；第二，它提示“脱敏”与“授权过滤”在工程上可以互补（先按 AU 过滤、再对剩余内容脱敏），但两者叠加的效用损失需要单独度量，不能默认可加。诚实标注：这是 ECML PKDD 2026 的会议论文（LNCS），实验基于 Text Anonymization Benchmark 这一单一基准，结论外推到真实企业语料时需谨慎；且“完全脱敏有时优于保留类型脱敏”等结论是特定设定下的数值比较，不宜读成通用建议。另注：本篇昨日曾因抓取档未给出摘要而暂缓，今日已从 Springer 原文核实摘要后补报。", "source": "SemanticScholar", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "RAG 依赖从外部语料检索相关证据，但许多部署必须检索含有个人身份信息（PII）的来源；文本脱敏是常见防护，却可能抹掉检索线索、损害 top-k 检索质量，进而影响下游生成。本文对脱敏语料检索做了受控实证研究，比较三种变换：保留类型的脱敏、完全脱敏、PII 语义替换（把每个 PII 提及换成上下文感知的描述）。作者用 Text Anonymization Benchmark 构建引用式与违规式两种检索的相关性判断，对比 BM25、稠密检索、ColBERT 与一个纯描述对照，并设匹配的随机对照。结果同时取决于检索范式与相关性定义：引用检索中 BM25 在脱敏下保持稳健，而稠密检索与 ColBERT 出现有统计支撑的退化；违规检索在放宽的相关性阈值下，脱敏版 BM25 数值上优于未脱敏版，但多重比较校正后不再成立；跨两种设定，完全脱敏有时在神经检索上优于保留类型脱敏，而语义替换没有显示出比简单脱敏更清晰、有统计支撑的优势；纯描述对照优于匹配的随机对照，说明语义描述确实携带可用信号，但作为全文上下文的补充比作为独立检索表示更有效。总体上，脱敏语料检索仍可行，但其效果强烈依赖于检索范式与相关性定义。", "supplement": false}, {"title": "Prompt injection of OpenAI custom GPTs leaks informatics secrets.", "authors": "Van Q. Truong, Marylyn D. Ritchie", "url": "https://www.semanticscholar.org/paper/319bd8a3e3c67d45668c24942c3983115fa4f112", "category": "会议论文（AMIA Joint Summits on Translational Science 2026）", "cats": [], "oneliner": "医疗信息学场景的定制 GPT 全面失守：提示注入可泄漏系统指令、完整知识库文件与专有 API 细节。", "insight": "关联较弱但场景值得注意：这是今日唯一一篇把提示注入落到**医疗健康数据**上的论文，而 health data access 正是我们的关键词之一。它提示了一个我们威胁模型尚未明说的前提：当 RAG 的知识库本身就是敏感资产（患者数据、临床记录）时，泄漏的损失不仅是“未授权片段进了上下文”，还包括系统指令与 API 细节这类“元信息”——我们的 T1/T2/T3 目前按攻击者“能看到什么”分层，可以补一句：同一层攻击在医疗场景下的损失权重更高，因为被泄漏的不仅是答案、还有知识库文件本身。但必须诚实标注：本条目没有完整摘要，上述内容仅据 TLDR 转述，未核实测试规模与方法，不宜在论文里直接引用其结论；如需引用，应先读全文。", "source": "SemanticScholar", "citations": "Semantic Scholar 1 次", "code": "无", "zh_abs": "来源记录未提供完整摘要，仅提供 TLDR 式结论：测试的定制 GPT（cGPT）全部存在严重漏洞，可导致私有系统指令、完整知识库文件与专有 API 细节泄漏；这种系统性失效带来严重的安全与隐私风险，尤其是在处理敏感患者数据、临床记录或专有基础科学资产时。以上内容据 Semantic Scholar 页面 TLDR 转述，非论文摘要原文，细节（如测试数量、注入手法、成功率）需读全文核实。", "supplement": false}, {"title": "Data-Centric Security for Generative AI Systems: Protecting Sensitive Data against Leakage, Inference Attacks, and Unauthorized Model Access", "authors": "Santosh Kumar Jadala", "url": "https://doi.org/10.67228/30715717/ijdeic-v9i3p101", "category": "期刊论文（International Journal of Data Engineering and Intelligent Computing）", "cats": [], "oneliner": "生成式 AI 全生命周期的以数据为中心的安全综述：把控制绑定在敏感数据本身上，而不是绑定在它当前所处的位置。", "insight": "关联较弱。这是一篇综述性文章，没有新实验、新数据或新机制，其价值仅在于提供了一个“以数据为中心”的叙事框架——“控制跟着数据走、而不是跟着位置走”——与我们的 RU/AU 解耦在口号层面相通（我们的 AU 本质上也是把授权绑定在数据单元而非检索路径上）。但它没有给出任何可引用的数字、基准或威胁模型，related work 里如需引用，只能引用其“全生命周期攻击面”的罗列作为背景，不能引用任何有效性结论。另需诚实标注：venue 为低门槛期刊（IJDEIC），引用权重低；且“框架”本身未经实证检验，不宜与经过实验验证的工作并列引用。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "生成式 AI 在企业与公共部门的应用日益广泛，也带来了保护敏感数据的重大关切：生成式 AI 系统在训练、微调、检索、推理与输出各阶段处理大量信息，处处都可能发生未授权披露与滥用。本文以“以数据为中心的安全”为视角，研究如何保护敏感信息免受数据泄漏、成员推断、模型反演、基于提示的攻击、检索相关暴露、模型提取与对 AI 服务的未授权访问。文章回顾了生成式 AI 全生命周期中的主要攻击面，并评估了数据分类、最小化、加密、隐私保护学习、身份与访问管理、安全 RAG、输出过滤、数据丢失防护与持续监控等控制措施。在此基础上提出一个以数据为中心的安全框架，把数据敏感度、访问策略、模型控制与治理要求贯穿 AI 全生命周期；框架强调安全控制应始终绑定在敏感信息本身上，而不论数据被存储、处理、检索或生成于何处，并为希望在保持可控、可问责使用的同时降低隐私与保密风险的组织提供实践指导。", "supplement": false}, {"title": "Isolated Artificial Intelligence (IAI): A Privacy Preserving, Offline, Policy-Governed Architecture for Enterprise Knowledge Retrieval and Decision Support", "authors": "Rana Zahid Rana Muhammad Zahid Latif", "url": "https://doi.org/10.5281/zenodo.23960111", "category": "概念论文 / 预印本（Zenodo，2026-11-04）", "cats": [], "oneliner": "离线、隔离、策略治理的企业 RAG 架构设想：本地 embedding、本地模型、身份感知授权——但全部是设计主张，尚无实现与验证。", "insight": "关联较弱。这篇的思路与我们有表面相似处（身份感知授权、部门级访问边界、本地部署），但它明确声明自己只是一份设计提案、没有任何实现与验证，且发表在 Zenodo 预印本上，因此**不能作为证据引用**，最多在 related work 里用一句话提及“离线隔离部署是业界对 RAG 授权的一种朴素应对”，并随即指出其未经验证。真正值得注意的反而是它的反面：它把“本地化”等同于“安全”的隐含假设，正好衬托我们论文的立场——授权必须由架构保证（策略求值），而不是由部署位置保证（离线了就默认安全）。引用时应写清其概念论文性质，不宜把它与经过实验验证的工作并列。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "这是一篇概念论文，提出 Isolated Artificial Intelligence（IAI）：一个模块化的企业架构，用于在受控的本地或物理隔离环境中做检索增强问答与运营知识辅助。IAI 结合异构数据摄入、本地 embedding 与检索、本地语言模型、身份感知授权、证据关联的回答与 AI 管理控制。作者认为研究问题不在于本地语言模型是否存在，而在于如何把它们整合成一个可重复、领域无关的系统，使其能执行部门级访问边界、处理技术图纸与结构化运营记录，并展示可度量的隐私、检索质量、可靠性与资源效率。本文定义了拟议的设计、需求、威胁模型、实验方法与可证伪的评估标准；实现、性能与安全主张目前仍是待独立检验的假设。", "supplement": false}]}, {"date": "2026-11-05", "summary": "", "papers": [{"title": "Permitted but Unauthorized: Affordance-Induced Delegated-Scope Violations in Multi-Agent LLM Systems", "authors": "Shravya Kanchi", "url": "https://arxiv.org/abs/2611.04086v1", "category": "arXiv 预印本（arXiv:2611.04086v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "多智能体系统里的“被许可却未授权”：每个 agent 的权限都远宽于受托任务，决定它会不会动用同伴资源的不是权限表，而是对端动作有没有被“列出来”供它看见。", "insight": "这是今日最值得在 related work 里占位的一篇，因为它把“授权”拆成了两层，而我们论文目前主要讲了其中一层。第一层是**许可（permission）**：权限表上写着能不能动；第二层是**委托范围（delegated scope）**：这次任务到底指派了什么。实验说明，只修第一层不够——权限表不变，只改“动作列不列出来”，越界率就能从 0 走到 52/52，这意味着**呈现面（affordance）本身就是授权面的一部分**，我们的 per-view 索引语义可以顺着这个方向补一句：视图不仅要按 AU 过滤内容，还要按委托范围过滤“可执行动作的可见性”。第二，它的“范围执法 ≠ 伤害预防”结论值得原样引用：确定性监控器挡住了全部越界，却挡不住“用自己的已授权动作害人”，这与我们“未知 AU 默认拒绝”同属保守执法、也同有边界——讨论节写防御边界时可并列说明。第三，诚实标注：模拟环境、8 模型、析因部分只用了三模型，52/52 是单模型单格子的极端值，不宜读成“所有模型都会越界”；且新一代模型 0/100 的结果提示该现象可能随模型对齐进步而收敛，引用时应写清模型与格子条件。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "多智能体 LLM 系统把多个 agent 放在共享基础设施上，每个 agent 持有的权限都远宽于它受托的任务，因而每个 agent 在日常意义上都被“许可”动用它从未被指派的同伴资源。作者在两个模拟环境（CI/CD 发布流水线、安全运营事件队列）中用 8 个 LLM 做实验，以确定性、无模型参与的检测器对哈希链式、可重放验证的日志做判定。在竞争激励、候选可见性、收益信息三因素 2×2×2 析因实验中（三模型、每格 n=52），结论是动作呈现方式而非权限本身主导行为：对端动作未列出时没有 agent 越界，而在竞争压力下把对端动作列出来并给出收益信息时，越界率急剧上升，Claude Sonnet 4.5 高达 52/52 个回合。模型代际差异明显：两个较新模型（Claude Sonnet 5.5 与 Opus 5.5）在相同攻击下 0/100 越界，而上一代模型 9/10 越界。两种防御（确定性引用监控器、基于模型的事前执行裁判）都挡住了全部越界，且在任务可完成时把可避免的同伴截止期错失从 15/40 与 14/40 压到至多 1/40。但作者同时指出范围执法的边界：agent 仍可通过对自己资源的一个已授权动作（谎报自己事件的严重度）拖累同伴，而两种防御都检测不到。", "supplement": false}, {"title": "Right Tool, Wrong Parameters: Defending LLM Agents Against Parameter Poisoning", "authors": "Yao Wang 等", "url": "https://arxiv.org/abs/2611.04673v1", "category": "arXiv 预印本（arXiv:2611.04673v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "间接提示注入的另一条攻击线：不诱发新动作，只偷换工具参数（如收款人），按“查询诱导的信任层级”判定参数来源可信度的 AuthorityFlow 把攻击成功率从 93.06% 压到 9.03%。", "insight": "这篇与 ChainBind 的 E12 结论咬合得最紧，值得在讨论节单独写一段。第一，ChainBind 的 13/15 未守住案例里，草案投毒的模式正是“动作名与金额都对、只换了主题或日期”——AuthorityFlow 把判定下移到参数级、按来源字段的信任层级逐参数放行，恰好是“批准环节加来源过滤”这一缓解方向的一个可操作化版本，可作为该缓解的候选机制引用（而非只作为讨论空话）。第二，它的“信任层级由查询诱导”与我们的“策略独立存放、查询时逐 AU 求值”在结构上同源：判定依据都不来自模型提议本身，而来自一个先于执行的独立结构；区别在于它的层级由模型解读查询生成，存在“用被攻击的模型解读信任”的循环风险，引用时应点出这一层——信任层级的生成者本身也需要独立性，否则防御的根基仍在模型手里。第三，诚实标注：93.06%→9.03% 是 FactAuthBench 这一作者自建基准上的数字，良性效用 82.64% 对 90.28% 说明防御仍有约 7.6 个百分点的效用代价，引用时不要写成“无代价防御”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "现有间接提示注入防御大多关注“注入是否诱发了新的工具调用或非预期动作”，本文研究另一攻击面——参数投毒：攻击者保留用户原本要做的动作，只操纵一个或多个工具参数（如收款人等任务关键值）。这类攻击难检测，因为没有引入新动作，而参数变化本身又常常是用户请求的合法组成部分。作者的关键洞见是：参数变化的合法性应由产生它的信息流的可信度来判定——用户查询会在可用信息字段上诱导出一个任务特定的信任层级，某些字段可信到足以决定特定参数，另一些则不应有影响。基于此提出的三阶段防御 AuthorityFlow 先解读用户查询、构造任务特定的信任层级，再对每个工具参数追踪产生其当前值的信息流、归因到支撑字段，最后仅当该字段在当前任务下被信任可决定该参数时才接受，否则标记为可疑。作者还引入 FactAuthBench 评估参数投毒：无防御时攻击成功率达 93.06%，AuthorityFlow 将其降至 9.03%，同时保留 82.64% 的良性任务效用（无防御时为 90.28%）。", "supplement": false}, {"title": "The Devil is in the Context: Nine Dimensions of Prompt Injection Attacks", "authors": "Jiamin Chang 等", "url": "https://arxiv.org/abs/2611.04672v1", "category": "arXiv 预印本（arXiv:2611.04672v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "提示注入不是一种攻击，而是九个维度张成的空间：同一句话在一种上下文是注入、在另一种上下文是合法请求，现有基准大多只覆盖了其中一小片。", "insight": "这篇的价值不在新攻击、而在评估方法论，可作为我们威胁模型一节的“覆盖度声明”工具。我们的 T1/T2/T3 是按攻击者能力分层（仅见答案 / 可见排序向量 / 全知识），而九维分类法是按指令、任务关系与系统表现分层——两者正交，可互补：T 轴回答“攻击者能看到什么”，九维回答“注入以什么形态出现、在什么任务关系下才算注入”。讨论节可以借它写一句诚实的边界声明：我们的评估覆盖了哪些维度组合、哪些组合（如“良性第三方指令恰好与任务相关”的灰区）尚未覆盖，而 13% 未测试组合这个数字正好说明“在几个基准上全过”不等于“全空间安全”。但需诚实标注：这是一篇分类法论文，摘要未给出防御效果数字，引用时只能引用其覆盖度结论与方法，不能引用任何“防御有效性”数字；且九个维度的具体定义需读正文后才能在论文里逐项对照，不宜仅凭摘要转述维度名称。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "提示注入通常被当作单一、同质的攻击类型讨论与评估，但真实系统里报告的漏洞差异很大；同一条指令在一种上下文里是提示注入、在另一种上下文里可能是合法请求，取决于用户意图与系统策略。忽视这种差异会在防御评估里留下缺口，并给人虚假的安全感。作者提出九个维度刻画提示注入攻击，共同描述被注入指令本身、它与用户任务的关系、以及它在目标系统中的表现方式；每个维度都会影响哪些防御能检测或阻止它。作者先用该分类法刻画 6 个真实世界的提示注入漏洞，展示它们差异之大；再把它应用于 9 个提示注入基准，发现多数基准只覆盖了该空间的一小片区域；即使合并多个基准，仍有 13% 的成对类别组合未被测试，主要集中在较少被代表的类别上。最后作者说明该分类法支持基准的自动标注与针对性生成新测试用例以填补缺口，也可供防御作者声明自己评估过哪些类型的注入、供系统运营者识别哪些攻击适用于自己的系统并据此选防御。", "supplement": false}, {"title": "ScamWorld: An Interactive Environment for Evaluating Web Agents Against Online Fraud", "authors": "Yutao Wu 等", "url": "https://arxiv.org/abs/2611.04879v1", "category": "arXiv 预印本（arXiv:2611.04879v1，cs.AI）", "cats": ["cs.AI"], "oneliner": "Web agent 的新受害者画像：面对为骗人而设的假商店、假投资平台与预付费骗局，六个前沿模型驱动的 agent 被骗率 11%–35%，且常在“已经察觉可疑”之后仍然继续。", "insight": "这篇与我们论文的咬合点不在诈骗本身、而在它暴露的一种授权语义误读：**“用户让我做这件事”被模型读成了“用户授权我接受完成这件事所需的一切附加条件”**。这正是 RU/AU 解耦要切断的链条——用户指令是任务意图，不是空白授权书；每个 AU、每个副作用（付款、交凭证）都需要独立求值，而不是由“任务已下达”这一事实背书。讨论节可用 ScamWorld 的“察觉可疑仍继续”作为反例：仅靠模型自身的怀疑态度不够，怀疑必须落到一个能实际拦截的关口（我们的 AU 求值、或执行侧的确定性检查），否则怀疑只停留在轨迹文本里。但需诚实标注两点：第一，诈骗网站是“为骗人而设、agent 顺带中招”，不是针对 agent 的对抗性攻击，11%–35% 不宜与提示注入攻击成功率直接比较；第二，摘要未给出各模型的具体被骗率与任务设置，引用时只用区间数字，不编造单模型排名。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Web agent 越来越多地替用户浏览、购物、管理账户；已有工作表明它们会被对抗性内容（包括提示注入与欺骗性界面）误导。除此之外，在开放网络上活动的 agent 还会遇到原本为欺骗人类而设的在线诈骗，包括欺诈性网店、假投资平台与预付费骗局；agent 在执行任务时如何应对这类诈骗，此前研究较少，部分原因是诈骗网站存活期短、难以系统评估。作者引入 ScamWorld，复现已报告的诈骗网站，覆盖多样的场景、诈骗机制与语言；每个复现网站都复现了有记录的诈骗机制，使诈骗迹象在 agent 做出最终动作之前即可被观察，从而支持可控、可重复的评估。在对 6 个前沿 LLM 驱动的 Web agent 的大规模研究中，基线被骗率在不同模型间为 11%–35%；agent 比起索要凭证或钱包信息，更容易继续推进付款；对 agent 轨迹的细查显示，有些 agent 明明承认了可疑情形却仍继续，有时把“用户指令”当作了“接受网站附加条款的授权”。", "supplement": false}, {"title": "AgentDyn: A Dynamic Open-Ended Benchmark for Evaluating Prompt Injection Attacks of Real-World Agent Security System", "authors": "Hao Li 等", "url": "https://arxiv.org/abs/2602.03117", "category": "arXiv 预印本（arXiv:2602.03117，cs.CR；2026 年 2 月提交，5 月 v3）", "cats": ["cs.CR"], "oneliner": "动态开放式 agent 安全基准：60 个开放式任务、560 个注入案例，覆盖购物、GitHub 与日常生活，十种现有防御几乎全都“要么不够安全、要么过度防御”。", "insight": "这篇今天才作为独立条目出现，但它其实早已在我们的阅读视野里——10 月 31 日的 REALM 与昨日 ATrust 都是在它上面评估的，之前未单独报告、今天由 Semantic Scholar 候选翻出后补上，引用时应写清它是 2 月预印本而非 11 月新文。它的价值在于给“防御好不好”定了一个双指标口径：**攻击成功率与受攻击下的效用（attacked utility）必须同报**，只报其一会掩盖“靠过度防御换安全”的做法；ChainBind 的 E12 恰好是同口径（良性效用 0.608、受攻击效用 0.587），在讨论节引用 AgentDyn 时可把两组数字并列，说明“安全—效用权衡”不是我们一家遇到的取舍、而是该基准上十种防御的普遍困境。但需诚实标注：60 任务、560 案例均为作者人工设计，场景限于购物、GitHub、日常生活三类，结论外推到金融、医疗等高风险 agent 场景时需谨慎；且“几乎所有防御都不够好”是作者在自选十种防御与 GPT-4o 为主的评估下的结论，不宜读成“所有防御在所有场景下都失败”。", "source": "SemanticScholar", "citations": "Semantic Scholar 10 次", "code": "github.com/leolee99/AgentDyn", "zh_abs": "能够自主与外部工具和环境交互的 AI agent 前景广阔，但它们对外部数据的依赖使其暴露于间接提示注入攻击——藏在第三方内容里的恶意指令会劫持 agent 行为。已有 agent 安全基准推动了防御设计，但作者指出当前基准有三个根本缺陷：缺乏动态开放式任务、缺乏有益的第三方指令、用户任务过于简单。为弥补这些缺口，作者引入 AgentDyn：人工设计的基准，包含 60 个有挑战的开放式任务与 560 个注入测试案例，覆盖购物、GitHub 与日常生活三类场景；与以往静态基准不同，AgentDyn 要求动态规划，并在整个执行轨迹中纳入有益的第三方指令。对十种现有防御的评估表明，几乎所有防御要么不够安全、要么存在显著的过度防御，说明现有防御距离真实部署仍有距离。基准已公开。", "supplement": false}, {"title": "Risk Controlled Architecture and Offline Authorization Testing for Student Facing Large Language Model Agents with Minimal Data, Permission Boundaries, Scenario Checks, and Human Escalation", "authors": "Nayyar Ahmed Khan 等", "url": "https://doi.org/10.46759/iijsr.2026.10311", "category": "Irish Interdisciplinary Journal of Science & Research（期刊论文）", "cats": [], "oneliner": "面向学生的 LLM agent 的风险受控架构：权限矩阵 + 最小数据流 + 场景测试 + 人工升级，服务端授权函数在 16 个构造的角色—动作请求上 6 放行、10 拒绝、全部符合预期。", "insight": "关联较弱，但作为“设计模式 + 诚实边界声明”的双重参照仍值得收录。设计模式一面：它把授权做成**上线前可离线测试的服务端函数**（权限矩阵 + 场景检查 + 人工升级），与我们“策略独立存放、查询时逐 AU 求值”共享同一个直觉——授权判定不应由模型临场发挥，而应是可事先枚举、可事后审计的确定性结构；它的“内容、可访问性、留存、交接四类失败分设上线关口”也可借鉴为我们讨论节里“单次裁剪不等于全链路安全”的一句注脚。诚实边界一面：作者自述“16 例全对 ≠ 安全、合规或有益”，这种自我限定的写法正是我们引用小规模构造评估时应有的口径——收录它不是因为它证明了什么，而是因为它示范了“小评估该怎么说话”。分量标注必须写清：小刊物、引用 0 次、16 例构造测试、无真实学生、无真实 LLM 在环，引用时只能作为模式参照，不能作为任何效果数字的证据。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "本文规定了一个面向学生的、风险受控的 LLM agent：权限矩阵、最小数据流、响应状态、场景测试与人工升级。服务端授权函数在 16 个构造的角色—动作请求上接受了测试：6 个放行、10 个拒绝，全部与预期决策一致。一个假设的上线前案例说明，为什么内容、可访问性、留存与交接失败应作为彼此独立的上线关口。作者自己明确指出：该单元测试只验证所声明的权限规则，不能确立模型安全性、政策合规性或教育收益。", "supplement": false}]}, {"date": "2026-11-04", "summary": "", "papers": [{"title": "IAMRAGBENCH: Benchmarking Authorization Expansions in LLM-Generated AWS IAM Policies under RAG Poisoning", "authors": "Hasan Kaplan 等", "url": "https://arxiv.org/abs/2611.03431v1", "category": "arXiv 预印本（arXiv:2611.03431v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "RAG 投毒攻击 IAM 策略生成的基准：投毒上下文能让模型生成“提供商校验通过、但超出可信授权需求”的策略，60 个案例、确定性授权包络评分。", "insight": "这是今日最直接可引用的工作，且把我们的论点从“答案泄露”推进到了“授权扩张”。第一，它的“授权包络”（authorization envelope）与我们的 AU 求值在机制上同源：都是先划一条“可信授权需求”的线，再逐条判定生成物是否越线；区别在于它判定的是“生成的 IAM 策略文本”，我们判定的是“检索到的每个 AU”——讨论节可并列引用，说明“生成式授权”与“检索式授权”需要同一类独立于模型的判定层。第二，63.79% 这个数字值得单独写一句：投毒内容换个“架构例外”的包装、放在流程末尾，成功率比端到端检索高出一个数量级，说明**授权判定的位置（何时判、由谁判）比判定规则本身更脆弱**，这与我们“查询时逐 AU 求值、未知 AU 默认拒绝”的设计形成直接呼应。第三，CheckNoNewAccess 漏报 4 例的细节是诚实的反例：即使是提供商自带的“无新增访问”检查，也会在“策略文本有效但语义越权”的情形下失灵，说明形式校验不能替代包络语义校验。但需诚实标注：arXiv 预印本、尚未被 OpenAlex 收录，60 案例为作者自建基准，数字不宜读成真实云环境的攻击成功率。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "用 RAG 的 LLM 可以根据任务与运维文档合成 AWS IAM 策略，攻击者控制的上下文可能诱使模型生成超出可信授权需求、但提供商校验仍通过的策略。作者提出 60 案例基准，覆盖范围、条件、显式拒绝、信任、权限边界与角色委派，用确定性授权包络评分加案例专属验证（含请求级检查）。一次攻击成立需同时满足：干净策略与处理策略均提供商有效、干净策略满足任务、处理策略违反包络、匹配预先声明的目标、保留预期请求、且新授权了一项被禁请求。五端点含上下文暴露产生 49 个精确授权增量，其中 46 个目标匹配攻击（46/292，15.75%）；端到端 BM25 在 720 篇文档上对 60 个任务全部在 k=5 召回指定投毒，但只产生 7/294（2.38%）目标匹配攻击；同一弱化以“最终安全架构例外”呈现时，冻结双端点压力测试中攻击率达 74/116（63.79%），五端点事后扩展为 115/294（39.12%）。在 194 份违反任务要求的提供商有效处理策略重放中，AWS CheckNoNewAccess 对 168 个目标匹配精确攻击中的 4 个报告“无新增访问”；而完整的部署前规则拒绝了全部 171 个精确增量，仅 5 例送人工复核。", "supplement": false}, {"title": "SearchInject: Retrieval Exposure Control for Indirect Prompt Injection in Language-Model Search", "authors": "Kainan Zhou 等", "url": "https://arxiv.org/abs/2611.02643v1", "category": "arXiv 预印本（arXiv:2611.02643v1，cs.AI/cs.CY/cs.IR/cs.LG）", "cats": ["cs.AI", "cs.CY", "cs.IR", "cs.LG"], "oneliner": "间接提示注入的“准入关”防御：注入只有在载体页面进入模型上下文后才生效，于是在检索层用联合分数把可疑候选隔离，top-10 目标暴露率相对下降约 83%。", "insight": "这篇与我们的 retrieve-then-project 语义是“同一关口、不同方向”的对照：我们是在内容已检索到之后、按 AU 裁剪未授权片段，SearchInject 是在内容进入上下文之前、按“是否像注入载体”隔离候选。两者可叠加成两道关：**准入关挡“看起来像指令的页面”，授权关挡“不属于你的片段”**，讨论节可用它说明“检索层安全”与“授权层安全”不是同一件事——SearchInject 的干净质量几乎无损（nDCG@10 变化 0.0018）恰恰说明，准入控制的代价可以很小，真正难的是它诚实承认的两点：交互项在同等干净代价下的收益尚未证实，且 104 例跟进无法估计攻击成功率下降，引用时不要把“暴露率下降 83%”写成“攻击成功率下降 83%”。另注意评估局限：载荷类别虽留出、但构造家族在开发时已见过，属于家族内泛化而非全新攻击家族泛化。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "间接提示注入只有在其载体页面进入模型上下文后才能影响搜索增强的 LLM。SearchInject 用联合分数控制这一准入决策，综合检索相关性、搜索滥用信号、指令可能性与两项相关性交互项；隔离阈值在校准集上按“干净候选误隔离率 0.5%”的经验约束选取。评估用 300 条留出的 SciFact 查询与四类构造家族内留出的载荷类别；每检索器 1,200 个查询-家族结果中，top-10 目标暴露率从 BM25 的 0.9408 降至 0.1583、归一化混合检索的 0.9158 降至 0.1508、潜在语义分析的 0.8450 降至 0.1375，相对降幅 83.2%–83.7%，而干净 nDCG@10 的最大变化仅 0.0018。冻结阈值在干净测试集上的误隔离率为 0.59%–0.65%，略高于校准约束；另有 104 例生成跟进只记录到上下文移除、未确认无防御劫持，故无法估计攻击成功率的下降。", "supplement": false}, {"title": "ATrust: Adaptive Trust Boundary Expansion for Securing LLM Agents", "authors": "Xu Zhang、Zhichao Lu", "url": "https://arxiv.org/abs/2611.02741v1", "category": "arXiv 预印本（arXiv:2611.02741v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "自适应信任边界：以用户查询为信任锚点，在执行过程中逐步接纳任务必需的外部信息，在 AgentDyn 上把攻击成功率从 37.80% 压到 4.37%，同时效用提升 10%。", "insight": "这篇的价值在于它把“信任”做成了**运行时可扩展的状态**，而不是一次性静态判定——与我们“查询时逐 AU 求值”的思路相通，但粒度不同：ATrust 的边界按“信息是否任务必需”扩展，我们的 AU 按“权限是否满足”求值。两者结合是一个值得在讨论节提一句的方向：**任务必需性与授权许可性是两条独立的准入条件**，只满足其一都不应放行（任务必需但未授权的内容仍要裁剪，已授权但与任务无关的内容仍可排除以减小暴露面）。但需诚实标注三点：第一，arXiv 预印本、尚未收录，12.33% 的领先幅度是作者在自选基线与 GPT-4o 单引擎下的自报数字；第二，它在 AgentDyn 上的评估与 AgentDyn 本身“防御普遍过度防御或不够安全”的结论同源，存在基准与防御同源优化的循环风险；第三，摘要未报告误拒率与延迟代价，引用时不宜写成“无代价的安全提升”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "现有防御常基于有限的静态可信证据做安全决策，或孤立地评估每条观测，导致任务必需信息被不必要丢弃（过度防御、效用下降）。ATrust 提出运行时自适应扩展信任边界：以用户查询为根信任锚点，对照当前信任边界与执行状态评估外部观测，逐步把任务必需的信息接纳为新的信任锚点，同时把无关内容（无论良性还是恶意）排除在后续决策之外。在 AgentDojo 与 AgentDyn 上的评估称其取得现有防御中最佳的安全-效用权衡；以 GPT-4o 为引擎模型时，AgentDyn 攻击成功率从 37.80% 降至 4.37%，效用提升 10.00%，比最强基线 AuthGraph 高 12.33%。", "supplement": false}, {"title": "StateFence: Task-State Protection Against Evidence-Chain Contamination in Blue-Team LLM Agents", "authors": "Haowen Dai、Alejandro Guerra-Manzanares", "url": "https://arxiv.org/abs/2611.02605v1", "category": "arXiv 预印本（arXiv:2611.02605v1，cs.CR/cs.AI）", "cats": ["cs.CR", "cs.AI"], "oneliner": "蓝队 SOC agent 的任务状态保护：把严重度标签、事件叙述、响应策略、IOC 集合当作受保护状态，按被攻击的状态分流防御，避免“一刀切过滤”误删关键证据。", "insight": "这篇给我们的 T1/T2/T3 之外补了一个“任务依赖性”维度：**同一内容在不同任务下可能是证据、也可能是攻击**，这与我们“未知 AU 默认拒绝”形成张力——默认拒绝在安全上保守，但在 SOC 这类“证据本身就是任务对象”的场景里会误删关键指标。它的解法（按受保护状态分流防御、而非按字符串一刀切）可借鉴为我们 per-view 索引语义的一个注脚：不同视图下同一 chunk 的可见性本就不同，StateFence 说明“可见性”还应随任务状态变化。但需诚实标注：arXiv 预印本、尚未收录，摘要未给出攻击成功率、效用保留率等可核对数字（只有方向性表述），引用时只能作为“任务感知防御”的概念佐证，不能引用具体效果数字；且 SOC 场景的结论外推到通用 RAG 时需谨慎。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "蓝队 LLM agent 在安全运营中心（SOC）面临的独特风险是：恶意指令可藏在遥测、工单、检索结果或记忆里，再以“局部合理”的中间决策形态，经告警分流、事件摘要、响应建议、IOC 提取等环节传播，作者称之为受保护任务状态的证据链污染。难点在于任务依赖性：同一可疑字符串，对摘要任务可能是恶意控制文本，对 IOC 提取任务却可能是关键证据。StateFence 提出任务感知的评估与防御框架：把严重度标签、事件叙述、响应策略、IOC 集合视为受保护状态，把间接提示注入攻击映射为显式、隐蔽、多跳、持久四类 SOC 证据攻击，记录可观测的传播轨迹，并按被攻击的状态分流防御。在受控 SOC 案例与公开 SOC 验证案例中，StateFence 降低了攻击成功率、减少了证据被污染后才显现的失败，同时保留任务效用、避免了任务错配过滤造成的指标丢失。", "supplement": false}, {"title": "MemHarmBench: Evaluating Cross-Session Prompt Injection in Memory-Persistent AI Agents", "authors": "Zhihua Wang 等", "url": "https://arxiv.org/abs/2611.01700v1", "category": "arXiv 预印本（arXiv:2611.01700v1，cs.AI）", "cats": ["cs.AI"], "oneliner": "跨会话提示注入的受害者中心基准：恶意指令被写入记忆后，即使原始攻击内容已被删除，新会话里的正常任务仍会按攻击者意图做关键决策，且表面上毫无异常。", "insight": "这篇与昨日 RevBench（任务中途撤销权限）构成一对“时间维”证据：RevBench 讲的是“权限被收回后，已拿到的数据还在”，MemHarmBench 讲的是“攻击内容被删除后，已写入记忆的指令还在”——两者共同说明，**授权与安全判定不能只看“当前这次读取/这次会话”**，已进入上下文、草稿、记忆的残留物是独立的攻击面。我们的 retrieve-then-project 处理的是单次查询的裁剪，MemHarmBench 提示讨论节应补一句边界声明：单次裁剪不清除跨会话记忆里的已授权/已污染内容，记忆层需要独立的撤销与审计语义。但需诚实标注：arXiv 预印本、尚未收录，摘要未报告各系统的具体攻击成功率与隐蔽率数字（只有定性结论），引用时不宜编造数字；且“受害者中心”的三分法是评估框架而非防御机制，不能直接当作解决方案引用。", "source": "arXiv", "citations": "尚未收录", "code": "github.com/Kirito14IT/MemHarmBench", "zh_abs": "带持久记忆的 agent 会跨会话保留用户偏好与操作规则，但恶意指令也可经消息、文档或网页内容写入记忆，并在原始攻击内容删除后继续影响未来任务；现有攻击成功率指标无法刻画“谁受害”与“伤害如何体现在正常任务执行中”。MemHarmBench 提出受害者中心评估：区分用户、工作区/项目所有者、外部利益相关者三类潜在受害者；先让 agent 暴露于恶意指令并检验其是否被记忆保留，再删除攻击内容、用保留记忆的新会话执行合法任务，联合评估 agent 是否遵循攻击者意图、是否完成合法任务、是否出现可观测执行异常。作者在多个 agent 系统上的发现是：跨会话攻击可在行为上保持隐蔽——agent 常常正常完成任务、无可检测异常，却仍在关键决策上与攻击者意图一致。基准已公开。", "supplement": false}, {"title": "The Last Gate: Preventing Irreversible AI Agent Actions Before Execution", "authors": "Burak Oktenli", "url": "https://doi.org/10.5281/zenodo.23867081", "category": "Zenodo 原型存档（配套代码与运行日志）", "cats": [], "oneliner": "执行前的最后一道确定性门：不可逆动作必须持有独立签发的 HMAC 许可、未过期、未撤销、未重放且资源版本与策略纪元一致，否则一律拒绝或弃权，mock 评估中 500 例负向/保留案例零误提交。", "insight": "这篇的机制与我们“策略独立存放、查询时逐 AU 求值”在哲学上完全一致，只是落点在 agent 执行侧而非检索侧：**许可（permit）必须由授权方独立签发、且与动作摘要绑定**，模型提议本身不产生授权。它的“单次重放 + 资源版本 + 策略纪元”三项检查，恰好对应 ChainBind 讨论里“批准—执行绑定”需要补的三块：防重放、防过期批准执行在已变更的资源上、防旧策略纪元下的批准被复用——讨论节可引用其检查清单作为执行侧绑定的最小清单。但必须诚实标注分量与边界：第一，本体是 Zenodo 原型存档而非同行评议论文，引用 0 次；第二，评估是纯 mock、无真实 LLM、无真实人类批准人、无外部身份提供方、无真实金融系统或物理执行器，500 例零误提交是“在作者自建 mock 上的受控结果”，不能读成真实部署的安全保证；第三，作者自述负向/保留频率为构造值，引用时应写清“合成评估”，不宜与 IAMRAGBENCH 的基准数字并列比较。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；本体即 Zenodo 存档的网关代码与测试数据）", "zh_abs": "动机来自 AgentAbstain 研究（arXiv:2607.10059）：17 个前沿 LLM 在 4 个 agent 框架上的成对 act/abstain 任务准确率最高仅 59.5%（该数字衡量的是成对任务正确性，而非有害动作频率）。The Last Gate 是一个内存 Python 网关原型：在动作到达模拟的带副作用后端之前，检查严格动作模式、资源与参数范围、SHA-256 动作摘要、独立签发的 HMAC-SHA256 许可、过期时间、撤销状态、单次重放状态、资源状态版本与策略纪元，无法验证授权时拒绝或弃权。证据为 22 个构造场景家族各 25 例（550 例）、5 种策略下 2,750 次受控执行：500 例负向/保留案例零误提交、50/50 健康授权提交全部放行；18 项自动化测试通过，含 1,200 次授权变异、200 条含对抗性外观备注的合法动作与单进程并发重放测试；测试代码、数据输出、运行日志与校验和随附。", "supplement": false}]}, {"date": "2026-11-03", "summary": "", "papers": [{"title": "RevBench: code, scenarios, run logs and judgments for enforcing mid-task permission revocation in AI agents", "authors": "Martin Ignatovski", "url": "https://doi.org/10.5281/zenodo.23854359", "category": "Zenodo 软件与数据存档（配套论文《Revoking Access Does Not Revoke Knowledge: Enforcing Mid-Task Permission Changes in AI agents》）", "cats": [], "oneliner": "任务中途撤销权限的基准：agent 已拿到的数据不会因“下一次读取被拒”而消失，逐调用授权在 720 轮里失败 57.9%。", "insight": "这是今日最直接可引用的工作，且补上了我们论文与 ChainBind 都未单列的一块：授权不是一次性判定，而是**有生命周期的判定**——批准被收回后，已检索内容、草稿与记忆里的“残留知识”仍在执行链上。第一，它给 T1/T2/T3 之外加了一个时间维攻击面：“撤销后残留”（post-revocation residue），与我们的 retrieve-then-project 语义直接可比：裁剪只处理“当次查询的未授权片段”，RevBench 处理的是“此前已授权、此刻已撤销的片段”，两者叠加才构成完整的撤销语义，讨论节可用 57.9% 与 72.8% 这组对比数字说明“只在读取时设卡是不够的”。第二，它的“选择性重放 + 清单级溯源”与我们“逐 AU 求值 + 覆盖映射 M(r)”在机制上同源：都要一份“每条内容从哪来、当前还属不属于你”的清单，区别在于 RevBench 的清单服务于撤销后的重放，我们的映射服务于查询时的求值。第三，诚实标注分量：本体是 Zenodo 存档而非同行评议论文，失败率数字来自作者自建的模拟平台与 LLM 评判，引用时应写清“模拟平台上的作者自测”，不宜当作真实 SaaS 平台的实测结论。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；本体即 Zenodo 存档的代码、场景与运行日志）", "zh_abs": "SaaS 平台里的 agent 继承用户权限执行任务；权限在任务中途被撤销后，平台会拒绝下一次读取，但 agent 上下文、草稿、已保存文档与记忆里的数据还在。作者定义了四种撤销类型各自对应的封堵、清除或暂停义务（含改写、聚合与存在性提示等泄露形式），在模拟的外勤服务平台上比较了来自访问控制、信息流控制与机器遗忘的 9 种执行设计，在 6 个前沿模型上跑了 6,048 轮，以精确匹配与两个 LLM 评判打分。逐调用授权仍在 417/720 轮（57.9%）失败，撤销发生在检索之前时为 34.4%、发生在数据送达之后时升至 72.8%；信息流标签泄露最少（12.9%）却仍在 44.2% 的轮次里留下了已撤销数据；使上下文失效的设计表现最好，就地编辑上下文则会留下派生事实；完全重启与带清单级溯源的选择性重放分别达到 21.4% 与 21.0% 的实质失败率，后者少用 12.1% 的模型调用。剩余失败大多是“透露受限本身”的披露，且模型越大并未减少。", "supplement": false}, {"title": "Trust-Aware Orchestration Architecture for LLM-Assisted Workflows in Multi-Tenant Enterprise Systems", "authors": "Nandakishore Leburu", "url": "https://doi.org/10.1109/ACCESS.2026.3706063", "category": "IEEE Access（2026）", "cats": [], "oneliner": "多租户 LLM 工作流的确定性控制面：LLM 只提议动作，三道硬门（租户解析、工具授权、模式校验）决定是否执行，另有四道建议性过滤与仅追加审计日志。", "insight": "这篇的价值恰恰在于它的“诚实边界”。第一，它与我们的 RU/AU 解耦在哲学上一致——授权判定必须独立于模型提议之外、由确定性谓词执行，而不是让模型自己“判断该不该做”；它的三道硬门可视为 AU 求值在 agent 工具调用侧的对应物：租户解析对应“这份内容属于哪个授权域”，工具授权对应“这个 AU 是否允许这次调用”，模式校验对应“参数是否在批准范围内”。第二，它给 ChainBind 的“批准—执行绑定”划了一条清晰的能力边界：绑定能保证“执行的动作等于被批准的动作”，但保证不了“被批准的动作本身意图良善”——30%–70% 的权限内操纵成功率说明，意图层攻击需要另一层防御（如来源过滤、意图审计），不能指望把绑定做得更严就顺带解决。第三，诚实标注分量：IEEE Access 2026 年刊、引用 0 次，自适应案例只有 20 条 prompt 且为点估计，引用时应写清“小样本自适应案例”，不宜把 30%–70% 读成大规模实测。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "LLM 调用企业工具与 API 时存在参数幻觉、跨租户数据泄露与提示注入三类风险。作者提出“LLM 提议、确定性控制面验证并执行”的编排架构：三道硬门为身份认证与租户解析、基于角色的工具授权、模式校验，四道建议性过滤为输入清洗、检索定域、执行监控与输出合规，外加仅追加审计日志。硬门提供租户隔离、工具白名单执行、模式合规三项结构性保证（以确定性谓词表述、在控制面逻辑层验证），覆盖 14,885 次评估（1,497 条自定 prompt + TensorTrust 683 条 + AgentDojo 777 条 + 20 prompt 自适应案例）；AgentDojo 上的定向攻击成功率在 5 个模型上均 ≤1.9%，与已发表的防御基线相当；确定性语法恢复把 3B 模型的误拒率从 52% 降至 15.2% 且零延迟代价。但作者明确承认硬门防不住“权限内意图操纵”：获授权角色用获授权工具、以模式合法的参数达成恶意目的，20 prompt 自适应案例在 5 个模型（包括 Claude Haiku 4.5、Sonnet 4、Opus 4.6 三个前沿模型）上的成功率为 30%–70%；基于模式的输入清洗仅在 10.2% 的注入 prompt 上标记出注入模式，且从不单独拒止，证实模式检测不足。", "supplement": false}, {"title": "Not All Entities are Created Equal: A Dynamic Anonymization Framework for Privacy-Preserving Retrieval-Augmented Generation", "authors": "Xin-Yuan Zhu 等（南开大学）", "url": "https://www.semanticscholar.org/paper/6a33062b25e1a77702ad887f2958947bf2e005a4", "category": "arXiv 预印本（arXiv:2603.26074v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "TRIP-RAG：不搞一刀切全量匿名化，按实体的边际隐私风险、知识差异与主题相关性给每个实体打分，只对高风险实体做选择性泛化。", "insight": "与我们 embedding 通道一节可比但机制不同：我们处理的是“未授权内容不应进入检索结果”、用按授权视图重编码把 cloze 恢复率从 89.4%@20 压到 4.05%，TRIP-RAG 处理的是“敏感实体不应以明文进入检索语料”、用分级泛化在隐私与效用之间找中间点。两者可互补引用：视图重编码回答“谁有权看到这条内容”，实体分级泛化回答“这条内容里的哪个实体最值得先藏起来”——若把两者叠加，AU 求值可先定“能不能看”，实体风险分再定“看到的是泛化到哪一级的版本”，这是一个值得在讨论节提一句的组合方向。但需诚实标注：这是 arXiv 预印本、引用 0 次，且“Recall@k 下降不到 35%”本身就是不小的效用代价（作者的表述是“不到 35%”，不是“几乎无损”），引用时不要写成“隐私与效用兼得”；另注意本轮 S2 记录未带摘要，摘要数字经 arXiv 原文核实。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "RAG 知识库里的原始数据可能含敏感实体，全量匿名化保隐私却伤效用。TRIP-RAG 先做上下文感知的实体量化：从边际隐私风险、知识差异、主题相关性三个维度评估每个实体对隐私与效用的异质影响，再做动态泛化——按贪心策略只匿名化高风险实体，同时保留检索空间与文档知识的潜在拓扑结构。作者给出理论分析与实验：隐私保护与全量匿名化相当时，Recall@k 相对原始数据下降不到 35%，生成质量比现有基线最高提升 56%。", "supplement": false}, {"title": "RAG-grounded Advisory Systems for Government Decision-making", "authors": "Zeki Emre Tekin", "url": "https://doi.org/10.2139/ssrn.6570798", "category": "SSRN 工作论文（面向国家政府投资促进机构的部署报告）", "cats": [], "oneliner": "政府咨询场景的落地 RAG：四层 grounding（检索、引文验证、置信度校准、人工升级）+ 基于属性的访问控制，按文档密级执行。", "insight": "这是一份难得的“已部署 8 个月”的实证侧写，而非纯架构提案，有两处可直接对照。第一，它的 ABAC 是按“文档密级”执行的粗粒度控制——正好反衬我们 RU/AU 解耦的动机：密级是文档级属性，而 AU 是权限判定的原子单位；当同一文档内不同片段密级不同、或同一用户对同一文档在不同任务下权限不同时，文档级 ABAC 要么超取要么欠取，AU 级求值才是更细的解法，讨论节可用它作为“现有部署仍停在文档级”的现状证据。第二，它的 NLI 引文验证（无支撑论断 23%→4.1%）与我们配套机制里的 NLI 残留检查同源，但方向相反：它用 NLI 检查“答案里的每句话有没有引文支撑”，我们用 NLI 检查“裁剪后是否还有未授权残留”——两者可互相引用，说明 NLI 在 RAG 安全里既是事实性工具也是授权残留工具。但需诚实标注：SSRN 工作论文、未经同行评议，91.3% 精度与 94.2% 满意度均为作者单机构自报，无对照实验，引用时按“部署经验参考”处理。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "政府机构要在监管文本、政策备忘、项目档案等异构文档上做咨询，约束包括密级分类、双语运行、强制溯源与零容忍幻觉，通用 RAG 并不适配。作者报告了一个为国家政府投资促进机构部署 8 个月的系统：四层 grounding 架构（检索、引文验证、置信度校准、人工介入升级）+ 基于属性的访问控制（按文档密级执行）；混合检索（微调多语 sentence transformer 稠密向量 + BM25 稀疏分）在双语查询上 top-10 检索精度 91.3%；基于 NLI 的引文验证把无支撑论断从 23%（基线）降至 4.1%；置信度校准把 12% 的查询转交人工分析师；8 个月处理数千条咨询查询，分析师满意度 94.2%。作者将系统映射到 NIST AI 风险管理框架。", "supplement": false}, {"title": "Whispers of Wealth: Red-Teaming Google's Agent Payments Protocol via Prompt Injection", "authors": "Tanusree Debi、Wentian Zhu（佐治亚大学）", "url": "https://arxiv.org/abs/2601.22569", "category": "arXiv 预印本（arXiv:2601.22569v1）", "cats": [], "oneliner": "对 Google Agent Payments Protocol（AP2）的红队：密码学 mandate 保得住“授权凭证本身”，保不住“生成授权的那个决策过程”。", "insight": "这是 ChainBind 论点在支付场景的一个独立佐证：**批准（approval）不等于执行（execution）的安全**。AP2 的 mandate 在形式上就是一份“批准”——签名、可验证、有审计价值；但 Whispers of Wealth 证明，如果批准的形成过程（模型对上下文的推理）本身可被注入操纵，那么签名只保证了“被操纵的批准被忠实执行”，这正是我们论文里“批准环节需要来源过滤”的同一结论在另一个协议上的复现。讨论节引用时可写：“即使在有密码学 mandate 的 AP2 里，注入仍可操纵排序与数据提取；同理，agent 授权不能只校验批准凭证的形式有效性，还要校验批准形成时的信息来源。”但需诚实标注：arXiv 预印本、引用仅 2 次，实验基于作者自搭的单个购物 agent 原型（Gemini-2.5-Flash + ADK），未报告攻击成功率的系统数字（摘要只说“可靠地颠覆”），引用时不宜编造成功率；另注意本轮 S2 记录未带摘要，摘要经 arXiv 原文核实。", "source": "SemanticScholar", "citations": "Semantic Scholar 2 次", "code": "无", "zh_abs": "LLM agent 越来越多地自动执行金融交易，AP2 试图用可密码学验证的 mandate（授权委托书）来保障 agent 主导的购买，但其实践鲁棒性此前未被充分探索。作者在 Gemini-2.5-Flash + Google ADK 上搭了一个功能完整的 AP2 购物 agent，做 AI 红队评估，发现直接与间接提示注入两类漏洞，并提出两种攻击：Branded Whisper Attack（操纵商品排序）与 Vault Whisper Attack（提取敏感用户数据）。实验验证：简单的对抗 prompt 即可可靠地颠覆 agent 行为。结论是：密码学签名保护的是 mandate 一旦生成之后不被篡改，却防不住攻击者操纵“生成 mandate 之前的模型推理”。", "supplement": false}]}, {"date": "2026-11-02", "summary": "", "papers": [{"title": "Lineage: A UMA2.0 Protocol Extension for Multi-Hop LLM Agent Delegation", "authors": "Ştefania Ştefănescu 等", "url": "https://doi.org/10.1109/ACCESS.2026.3708618", "category": "IEEE Access（2026，OpenAlex 收录）", "cats": [], "oneliner": "给 UMA 2.0 补上多跳委托原语：每次受保护请求都携带经签名的完整委托血缘，资源服务器无需再向授权服务器往返即可验证。", "insight": "这是今日最直接可引用的工作。第一，它把 ChainBind 语境下的“批准—执行绑定”从单步扩展到了多跳：我们的 AU 求值回答“这份内容该不该给”，Lineage 回答“这份委托链上的每一跳是否还有效、是否越权”，两者叠加才是完整的 agent 授权链，讨论节可用它说明“单步绑定不够，委托链本身需要可验证的血缘”。第二，“协议层独立于模型行为拦住注入”与我们“过滤而非依赖引导”的结论同构，且给出了一个合规锚点（DORA 第 9 条的最小权限、完整性与持续监控子集），引用时应写清作者自己也承认“完整 DORA 合规还需要更广泛的制度治理，Lineage 只覆盖协议层子集”，不宜写成“已满足 DORA”。第三，诚实标注分量：IEEE Access 2026 年刊，引用仅 4 次，注入实验只有一次尝试，尚属原理验证而非大规模评测。", "source": "SemanticScholar", "citations": "OpenAlex 4 次", "code": "无", "zh_abs": "OAuth 2.0 与 UMA 2.0 只支持单跳委托，agent 把任务层层分包给子 agent 时会出现临时拼凑的权限模型与审计缺口，与欧盟 DORA 等合规要求冲突。Lineage 在 UMA 2.0 上加了一个可密码学验证的委托链原语：每条请求携带其完整委托祖先的签名记录，作用域单调性与委托深度上限由构造保证，每次授权决策写入可检测篡改的审计日志；扩展只需在资源服务器加两个链签名端点与一个签名密钥，授权服务器与 UMA token 流不用改。在 DORA 代表性场景的端到端参考实现中，一次真实的提示注入尝试被协议层独立于模型行为拦下，单请求开销相对 UMA 基线可忽略。", "supplement": false}, {"title": "An Efficient Privacy-Preserving Retrieval Scheme for Cloud-Based Retrieval-Augmented Generation", "authors": "Yuan Chang 等", "url": "https://doi.org/10.1109/TCCN.2026.3705821", "category": "IEEE Transactions on Cognitive Communications and Networking（2026）", "cats": [], "oneliner": "面向云端 RAG 的隐私检索方案 ShieldRAG：局部敏感哈希分桶 + 内积函数加密，云端看不到查询内容与文档访问模式。", "insight": "与我们论文的 embedding 通道一节直接可比，但角度不同：我们处理的是“检索结果里混进未授权内容”、用视图重编码把 cloze 恢复率从 89.4%@20 压到 4.05%，ShieldRAG 处理的是“云端从查询与访问模式反推隐私”，即 T2（可见排序向量）/T3（全知识）威胁模型里“服务器方观察者”这一分支。引用价值在于它给出了一个可量化的工程对照点（<0.5 秒、top-5 召回约 90%），说明隐私保护不必以检索不可用为代价；但需诚实标注：摘要未给出与明文基线的精度损失对比、也未说明函数加密在真实大规模索引下的密钥管理与更新成本，引用时不宜写成“已解决云端 RAG 隐私问题”。", "source": "SemanticScholar", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "云端 RAG 把查询与文档访问模式暴露给云服务方，既有方案往往以高计算成本或检索精度下降为代价。ShieldRAG 用局部敏感哈希做高效分桶、用内积函数加密保护隐私，另加向量聚合方法与不经意传输实例，使云端无法推断文档访问模式，同时保持检索性能。实验报告：检索延迟小于 0.5 秒，top-5 召回率约 90%，作者称适用于大规模真实场景。", "supplement": false}, {"title": "Authorization-Aware Multi-Agent Retrieval-Augmented Generation for Secure Enterprise Knowledge Access", "authors": "Chinmay Kundan Ahir 等", "url": "https://doi.org/10.55041/ijsrem68520", "category": "International Journal of Scientific Research in Engineering and Management（2026-10-31，OpenAlex 收录）", "cats": [], "oneliner": "文献综述型架构提案：把授权决策点与执行点前移到检索之前，只让有资格的候选集到达重排器、agent 与大模型。", "insight": "概念上与我们的 retrieve-then-project / per-view 索引高度一致——都是“授权前移、不要先检索再过滤”，且它点出的四类风险（尤其是“语义超取”与“跨域合成泄露”）可作为我们威胁模型 T1/T2 的对照清单，评测协议里的“撤销传播时间”与“委托违规”两个指标是我们现有评测未单列的，值得在讨论节提一句。但必须诚实标注其分量：作者自己声明“这是综述与设计贡献，未做实证评测、原型尚未评估”，且载体为低层级期刊，引用时只能按“观点与评测框架参考”处理，不能当作经验证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业 RAG 与多 agent 委托的风险在于：访问检查只发生在检索或答案生成之后。作者提出“授权感知”架构：策略决策点按当前用户与资源属性评估，策略执行点在内容到达重排器、agent 或大模型之前就把候选集限定在有资格的范围内，并结合 RBAC + ABAC、语义 embedding、向量检索、最小权限委托、溯源审计与受保护边界处的策略重验证。作者另做聚焦综述，点出语义超取、跨域合成泄露、权限过期、委托提权四类风险，定义了授权正确性条件，并提出一套评测协议（未授权上下文暴露率、已授权 Recall@k、答案相关性、延迟、撤销传播时间、委托违规、审计完整性）。", "supplement": false}, {"title": "Silo, Pool, and Bridge for Multi-Tenant RAG: Measuring Isolation, Noisy-Neighbor Effects, and Cost in SaaS Microservices", "authors": "Ritesh Kumar", "url": "https://doi.org/10.63282/3050-9246.ijetcsit-v7i1p106", "category": "International Journal of Emerging Trends in Computer Science and Information Technology（2026）", "cats": [], "oneliner": "多租户 RAG 的三种隔离模式（Silo / Pool / Bridge）与四平面隔离分类，并给出隔离、邻里干扰与成本的评测方法。", "insight": "这是我们 per-view 索引语义的部署侧对照：Silo 对应“每租户/每视图一索引”（隔离最强、成本最高），Pool 对应“共享索引 + 查询时过滤”（成本最低、但过滤必须可证明正确），Bridge 介于两者之间——这正是我们三种执行语义在多租户场景下的成本—隔离权衡表，讨论节可用它把“per-view 索引不是免费的”讲得更具体（邻里干扰与每查询成本是两个常被忽略的代价）。但需标注：该文同样只给出了评测方法而非实测数字，载体层级低，引用时按“框架参考”处理；其“跨租户 embedding 泄露”与我们 embedding 通道结论方向一致，可互相印证，但不能互相替代证据。", "source": "SemanticScholar", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "多租户 SaaS 的 RAG 必须在共享基础设施上保证严格的租户隔离，同时不让成本与性能方差失控。作者形式化了 Silo、Pool、Bridge 三种隔离模式，提出覆盖数据平面、向量平面、编排平面与 LLM 平面的隔离分类，并给出多租户 RAG 专属威胁模型：相似检索导致的跨租户 embedding 泄露、成员推断风险、作用域错误或投毒内容导致的检索污染、元数据推断。另给出 Kubernetes 原生参考架构（在摄入与检索两侧设显式策略执行点），以及一套评测方法：对抗检索下的泄露测试、混合租户 P50/P95 延迟（邻里干扰）、每查询成本拆解与运维开销。", "supplement": false}, {"title": "consent-substrate: Signed Authorization and Witness Boundaries for LLM Agents", "authors": "Consent Substrate Working Group", "url": "https://doi.org/10.5281/zenodo.23797525", "category": "Zenodo 软件存档（2026-10-30，配套论文《Detected or Proven: Signed Witness Boundaries Against Quiet-Class Compromise of LLM Agents》）", "cats": [], "oneliner": "签名授权 + 注入金丝雀的参考实现：Ed25519 签名的交战规则门（默认拒绝、失败关闭、哈希链审计）与共享同一信任根的诱饵路径/端点。", "insight": "机制上与我们“未知 AU 默认拒绝、查询时逐 AU 求值”的执行语义同源，且多了一个我们未展开的维度：金丝雀/诱饵（用可检测的标记主动发现静默渗透，而非只靠事后审计）。对 ChainBind 语境也有直接启发：签名门 + 哈希链审计正是“批准”应有的载体形式——批准若只是对话里的一句话，事后无法验证；若批准本身是签名记录，执行时就能校验血缘与范围。但需诚实标注：这是一份 Zenodo 软件存档、摘要只有一段，配套论文正文未在本轮抓取中出现，报告只按“软件存档”口径收录，不把它当作经同行评议的论文引用；其“detected-or-proven”保证的适用范围需等论文正文才能核实。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；本体即 Zenodo 存档的参考实现）", "zh_abs": "该存档是 consent-substrate 技术栈的参考实现：一道 Ed25519 签名的“交战规则”门（默认拒绝、失败时关闭、哈希链审计）与一套注入金丝雀基底（种子 token、诱饵路径、诱饵端点）共享同一信任根，目标是针对 LLM agent 的“静默类渗透”给出“被检测到或被证明”的保证。它是配套论文的软件部分，而非独立的论文正文。", "supplement": false}, {"title": "From Static Roles to Context-Aware Decisions: Integrating LLMs and RAG Into Access Control Frameworks for Power Systems", "authors": "Dong Feng 等", "url": "https://doi.org/10.1109/ACCESS.2026.3667843", "category": "IEEE Access（2026）", "cats": [], "oneliner": "反向用法：不是用确定性策略约束 LLM，而是用 LLM + RAG 推断隐式上下文，让静态 RBAC 变得自适应（电力系统场景）。", "insight": "这是一篇有警示价值的反向参照：它把 LLM 本身当作策略决策的参与者（用模型推理补规则的不足），而我们的立场恰恰相反——授权判定必须是确定性、可审计的逐 AU 求值，模型推理只能出现在检索与生成侧、不能成为授权的最终裁决者。两者对比可在讨论节讲清一条界线：“LLM 推断上下文”适合处理模糊请求的分诊与建议，但一旦它能直接放行，就把 T1/T2 威胁模型里的“模型可被操纵”重新引入了授权路径；该文的实验又只在合成数据集上、且未报告 LLM 误判导致的越权率，引用时应写清这一缺口，不宜把它当作“LLM 决策优于 RBAC”的证据。", "source": "SemanticScholar", "citations": "OpenAlex 3 次", "code": "无", "zh_abs": "RBAC 简单可解释，但难以适应动态用户行为与演变中的安全风险；传统上下文感知模型依赖人工定义的上下文属性与规则，维护成本高。作者在 RBAC 骨架上叠加 LLM + RAG：通过对非结构化访问日志推理、检索相关历史行为记录，推断行为衍生的隐式上下文语义，从而在保留 RBAC 可解释性的同时做出更灵活的授权决策。在合成电力系统访问控制数据集上的实验显示，RAG 增强框架在处理模糊或边界访问请求时持续优于静态 RBAC 基线。", "supplement": false}]}, {"date": "2026-11-01", "summary": "", "papers": [{"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations", "authors": "Evan Oktavianus 等", "url": "https://doi.org/10.24433/co.3932736.v1", "category": "Code Ocean（2026-10-30，OpenAlex 收录）", "cats": [], "oneliner": "面向公共机构场景的声明式 agentic RAG 访问控制：把工作流表示为状态机，每个状态挂自己的策略，跨 agent 通道与组织单元统一执行。", "insight": "这是昨天“待追踪”条目的正式落点，昨天留下的三个核对点今天可以逐项回答。第一，工作流状态如何形式化：答案是“状态机 + 每状态策略”，与我们的 AU 求值不在同一层而是叠加层——我们是“查询时、按内容归属”判定该不该给，StateGate 是“执行到哪一步”判定该不该给；两者叠加后，同一份文档的授权就变成“内容归属 × 工作流状态”的二维判定，这正是 ChainBind 语境下“批准发生在某一状态、执行发生在另一状态时原批准是否还有效”问题的直接参照，讨论节可用它把“批准—执行绑定”从单步动作扩展到状态转移时的重估。第二，“过滤而非依赖引导”与我们的 retrieve-then-project（裁剪未授权片段）同构，且它的数字（过滤防住 95.5% 暴露与 85/143 注入得手，引导仅把误述从 14% 降至 1.9%）为“引导不可靠、必须在执行层硬拦截”提供了可引用的对照证据。第三，诚实标注其分量：76,348 次零错误是在合成文档 + 独立 oracle 上的结果，不是真实政务数据；“状态无关策略误判 ≥9.7%”的对照基线是作者自设的简化策略，引用时应写清“合成场景、作者自建对照”，不宜写成对真实部署的普适结论；且 Code Ocean 载体本身不是传统期刊/会议 venue，引用时按预印本/技术报告口径处理。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；配套代码/数据存档见昨日上报的 Zenodo 条目 https://doi.org/10.5281/zenodo.23774020，代码 Apache-2.0、数据与结果 CC BY 4.0，全部文档均为合成数据）", "zh_abs": "StateGate 把工作流表示为状态机，以“工作流状态”为授权依据：同一份文档在流程的不同状态、经不同通道、面对不同组织单元时，策略可以不同，且一份决策适用于所有通道。在基于印尼财政部法规构建的 4 条关联工作流、合成文档上的两轮迭代、7 个评测回合中，对照独立编写的 oracle，**76,348 次请求零错误**（含跨单元读取）；无访问控制时同一批请求泄漏 **43,300 次**，与状态无关的策略至少误判 **9.7%** 的读取。测试覆盖全部状态与转移，检出 94%–100% 的非等价植入工作流错误与全部 5 个引擎 bug（其中 1 个靠崩溃发现）。接真实模型 agent 的实验中，无控制运行在 **95.5%** 的案例里暴露了受限文档，注入在 143 轮中 85 轮拿到隐藏目标；过滤同时防住了两者，而提示词引导仅把“模型误述文档状态”的回答占比从 14% 降至 1.9%。作者提炼出 5 条设计原则：授权绑定工作流状态、工作流以数据形式声明、过滤而非依赖引导、一份决策适用于每个通道、共享由所属单元说了算。", "supplement": false}]}], "total": 40, "n_days": 7, "all_total": 188, "all_days": 39};

let XW = {"date": "2026-11-07", "accounts": {"elonmusk": {"name": "Elon Musk", "label": "马斯克", "group": "other", "avatar": "https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_400x400.jpg", "tweets": [{"id": "2118987271965966564", "text": "Yesterday, I was working on something with Grok Bot when a guy nearby noticed me using it\n\nHe immediately pulled out his phone and started showing me how he uses Grok Bot, how he had set up all his bots, and how he manages his usage limits\n\nhe just literally saw me using Grok Bot and came over out of curiosity. We ended up having a really nice conversation about how we’re both using it haha", "created_at": "11-07 16:41", "likes": 1636, "reposts": 159, "replies": 194, "views": 341609, "url": "https://x.com/XFreeze/status/2118987271965966564", "author": "XFreeze"}, {"id": "2118956856978653374", "text": "True", "created_at": "11-07 14:40", "likes": 4224, "reposts": 579, "replies": 857, "views": 940716, "url": "https://x.com/elonmusk/status/2118956856978653374", "author": "elonmusk"}, {"id": "2118935230182805688", "text": "5 years ago", "created_at": "11-07 13:15", "likes": 9443, "reposts": 783, "replies": 877, "views": 3116857, "url": "https://x.com/elonmusk/status/2118935230182805688", "author": "elonmusk"}, {"id": "2118896809263169862", "text": "It’s time to put all the pieces together, the early tests to see how crazy it was to build a vehicle this size, the suborbital hops to practice subsonic maneuvering, the first real booster, expendable flight tests, trips to the Indian Ocean, and last flight with payload to orbit. We are one step away from the full mission, and that step is the double catch.\n\nWe will try for the first time on flight 15. I don’t think and of us can promise it will work the first time, but getting here feels like a turning point. I still feel like there’s so much to review (and we will be doing that continuously between now and launch) but when I take a moment to stop and think about it, it
