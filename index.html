<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月31日 星期六</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-10-31", "summary": "", "papers": [{"title": "REALM: Identifying Minimal Task Assets for LLM Agents", "authors": "Zihou Ren 等", "url": "https://arxiv.org/abs/2610.39155v1", "category": "cs.CR, cs.AI, eess.SY（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "为 LLM agent 识别并维护任务真正需要的最小资产集合，把“发现资产”与“授权使用”分开，用任务容器内的资源受限局部 API 收紧最小权限。", "insight": "这是今天与我们工作咬合最紧的一篇，值得在 related work 里占位。第一，它的“发现 ≠ 授权”分离与我们的 RU/AU 解耦在抽象层面同构：我们是检索侧“chunk 只存覆盖映射、策略独立存放、查询时逐 AU 求值”，它是执行侧“资产发现走依赖图、授权使用走受限 API”——两者合起来正好构成“检索授权 + 执行授权”的两段链条，写 related work 时可用 REALM 说明“最小权限”在 agent 时代必须从静态权限表升级为任务生命期内的动态资产集合。第二，它处理了我们 RU/AU 论文里着墨较少的难题：执行中才涌现的资产身份（assets whose identities emerge only during execution），其“来源限定接纳”机制可与我们的“未知 AU 默认拒绝”对照：一个是按来源可信度有条件接纳，一个是默认拒绝，两者取舍值得在讨论节写一段。第三，诚实标注其分量：16.6%→0.2% 是 AgentDyn + 单一基座模型（qwen3.5-flash）的数字，且注入下任务完成率 36.4% 本身不高，引用时应写清基准与模型，不宜泛化为“最小权限已解决注入问题”。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "LLM agent 常常拿到远超任务所需的文件、账号与服务访问权限，提示注入正是利用这部分超额访问把执行引向无关资源。本文提出 REALM（Required Execution Assets Linked to a Mission），把任务所需资产表示为依赖图节点、解析前置依赖关系，并通过来源限定选择接纳执行中才新发现的资产；REALM Builder 维护已选授权并投射资产文件，Partial API Manager 在任务容器内向 agent 只暴露资源受限的局部 API，同时保留 agent 自主选择计算方式的自由。在 AgentDyn 的 60 个干净任务与 560 个注入案例上，以 qwen3.5-flash 为基座，干净任务完成率 40.0%、注入下 36.4%，攻击成功率从 16.6% 降至 0.2%。", "supplement": false}, {"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations（代码、合成数据与结果存档）", "authors": "Evan Oktavianus 等", "url": "https://doi.org/10.5281/zenodo.23774020", "category": "Zenodo 存档（2026-10-29），配套文章的工作流引擎、8 个工作流文件、评测代码、合成文档、问题与注入提示及实验结果", "cats": [], "oneliner": "一份与“工作流状态驱动的 agentic RAG 访问控制”同题的公开存档：按工作流状态决定 agent 在 RAG 流程各阶段能取什么、能做什么，面向公共机构场景。", "insight": "即使只有标题与存档描述，这一想法的方向仍值得记一笔，因为它补了我们框架里一个显眼的缺口。我们的 AU 求值是“查询时、按内容归属”的静态判定，StateGate 的标题指向的是“按工作流状态”的动态判定：同一份文档在流程的不同阶段、不同步骤执行者手里，授权可能不同。这正是 ChainBind 语境下“批准—执行绑定”需要回答的问题——批准发生在某一工作流状态，执行发生在另一状态时，原批准是否还有效。建议把 StateGate 列为“待追踪”而非“已引用”：等论文本体出现后，重点核对三点——工作流状态如何形式化、状态转移时授权是否重估、与 RAG 检索授权是同一层还是叠加层；在此之前，任何关于它的机制描述都不应写进我们的稿子。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "该条目本身即代码/数据存档（代码 Apache-2.0，数据与结果 CC BY 4.0，全部文档均为合成数据）", "zh_abs": "必须先说明证据边界：本次抓到的不是论文正文，而是 Zenodo 上的配套存档，存档描述只说明它包含 StateGate 引擎、8 个工作流文件、评测代码、合成文档、问题与注入提示以及已存储的实验结果，未给出访问控制模型的形式化定义、策略语言或任何评估数字。因此本条只能确认“存在这样一个以工作流状态为授权依据的 agentic RAG 访问控制工作”，不能转述其机制细节与效果结论；正式引用须等论文本体出现后再核实。", "supplement": false}, {"title": "Judging Before Propagation: Task-Graph Contextual Integrity for Multi-Agent Privacy", "authors": "Hengyu Wu 等", "url": "https://arxiv.org/abs/2610.39532v1", "category": "cs.CR, cs.AI（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "把多智能体隐私从“单次披露合不合规”升级为“整条任务图上传播合不合规”：用任务图建模工作流，按信息项的预期传播范围做授权，附 144 例基准 MAPLE-Bench。", "insight": "关联较强，但要分清层次再引用。第一，它的“传播范围授权”与我们的 AU 粒度判定互补：我们回答“这条内容该不该给这个查询主体”，它回答“给了之后还能流向谁、流多远”；两者拼起来才是多智能体 RAG 的完整授权语义，讨论节可用它说明“单步 AU 求值是不够的，授权需要有传播语义”。第二，它的 Full-Scope 与 Auto-Region 恰好对应我们三种执行语义里的两端：全范围事前校验 vs 局部裁剪放行，这种“严格—宽松”权衡的对照写法可以直接借用。第三，诚实标注：85.8%–94.1% 是在自建 MAPLE-Bench（144 例构造场景）上的相对降幅，不是真实部署数据；且“保留精度 93.6%–96.1%”是相对基线任务精度的比例，基线本身的绝对精度未在摘要中给出，引用时只写相对数字、不写绝对效果。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "多智能体系统依赖持久记忆与 agent 间通信，隐私风险超出单次交互：一次孤立看合适的披露，与接收方既往已知信息组合、或沿计划工作流继续向下游传播后，可能变得不合适。现有情境完整性（Contextual Integrity）机制多为局部判断，不考虑信息向下游的传播。本文提出任务图情境完整性（TG-CI），把工作流表示为多智能体任务图（MATG），将情境完整性从原子转移扩展为有状态的图级信息流，同时考虑信息项的预期传播范围与接收方不断演变的披露状态；落地为两种互补策略：Full-Scope（要求在完整下游范围内均可接受）与 Auto-Region（用轻量前沿门把每项信息限制在其最大可接受区域）。MAPLE-Bench 基准含 144 例、四种场景，联合变化任务图拓扑、披露历史、被攻陷 agent 位置与单项隐私策略；主配置下 TG-CI 相对局部历史基线把平均未授权披露数降低 85.8%–94.1%，同时保留基线任务精度的 93.6%–96.1%。", "supplement": false}, {"title": "SEAL: Sealed Queries for Local Sanitization against Indirect Prompt Injection", "authors": "Doohyun Kim 等", "url": "https://arxiv.org/abs/2610.39758v1", "category": "cs.CR（arXiv 2026-10-29）", "cats": ["cs.CR"], "oneliner": "面向本地 agent 的间接提示注入清洗法：离线学一个软提示与评分读出头，用与待检工具文本无关的可信上下文构造评分查询，对工具输出做局部删除式净化，且不额外生成防御 token、不另起验证模型。", "insight": "关联中等，定位应是“输入净化层”的对照而非竞争。第一，它与我们的 AU 求值处在不同层：SEAL 清洗的是工具输出里的注入内容（防“坏内容进入推理”），我们管的是检索内容按授权放行（防“不该看的内容被看到”）；两者叠加才完整，威胁模型一节可用它说明 T1/T2/T3 之外还有一条“工具输出投毒”通道——但注意，我们的 T1（仅见答案）/T2（可见排序向量）/T3（全知识）是针对检索泄露划分的，SEAL 的通道应写为“与检索泄露并行的 agent 执行通道”，不要硬塞进 T1–T3。第二，它的“1/127 token 用量”与“联合指标 51.4%→77.5%”提醒我们：防御论文的卖点往往是“效果 + 成本”双数字，我们若补 agent 侧实验，也应同时报告 AU 求值的延迟/成本，否则单有效果数字说服力不足。第三，诚实标注：34.6%→0.1% 是 AgentDojo 上的结果，且“第二基座复现”未在摘要中给出具体数字，引用时限定在 AgentDojo 语境内。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "间接提示注入通过不可信工具输出威胁本地 LLM agent，防御需要在压制攻击的同时保留任务证据，且本地推理预算有限。本文提出 SEAL，离线学习软提示与评分读出头、用冻结的任务模型净化工具输出：评分查询由可信初始上下文与学到的提示构成，与被检工具文本无关；token 评分不跨上下文 token 归一化，并用保留正则化鼓励在局部删除时留住有用证据。该设计既不生成防御 token，也不需要独立验证模型。在 AgentDojo 上，SEAL 把攻击成功率从 34.6% 降至 0.1%，把“任务完成且未被攻陷”的联合指标从 51.4% 提升至 77.5%，防御相关 token 用量约为最强基线 PISanitizer 的 1/127；第二基座模型上的复现支持该训练方法的跨模型族适用性。", "supplement": false}, {"title": "Appreciation Teaches Unauthorized Execution: Self-Evolution Degrades the Robustness of Personal Agents to Indirect Prompt Injection", "authors": "Xinyan Wang 等", "url": "https://arxiv.org/abs/2610.39122v1", "category": "cs.CR, cs.AI（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "一个反直觉的发现：个人 agent 从用户反馈中自我演化（学技能、强化学习）之后，反而更容易执行第三方藏在外部内容里的未授权指令。", "insight": "关联中等，但对 agent 授权线有直接警示意义，可作“批准会漂移”的经验证据。第一，它揭示的机制与 ChainBind/E12 的“草案投毒”发现同源：授权（或习得的行为模式）一旦形成，就会在后续步骤里被忠实执行，哪怕触发它的内容来源不可信——我们的“批准必须绑定到执行那一刻的动作与来源”主张，正好是对这种漂移的回答，引用时可把该文定位为“为什么静态批准不够”的动机证据。第二，它划清了我们工作的边界：该文研究的是 agent 自身学习机制引入的脆弱性，不在 RU/AU 的检索授权范围内，不宜把它的百分点数字写成对我们检索防御的支撑。第三，诚实标注：14.0–48.8 与 3.0–39.3 都是跨任务的区间，具体任务、基座模型与演化方法的分布未在摘要中展开，引用时写区间、不挑区间端点当代表值。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "github.com/SaFo-Lab/Evolve-IPI（star 数本次未查到）", "zh_abs": "自我演化的个人 agent 为用户行事并从用户反馈中学习，但若 agent 服从了不可信第三方藏在内容里的指令，第三方就获得了对 agent 的控制。本文用两阶段对照方法研究自我演化是否削弱抗间接提示注入（IPI）鲁棒性：适应阶段用户要求 agent 阅读外部内容并完成其中描述的任务（日常常见请求），agent 按设计从用户反馈中学习改进；测试阶段第三方把类似任务写入新的外部内容，但用户的测试请求并未授权该注入任务。实验表明自我演化显著削弱鲁棒性：与不演化的基座 agent 相比，技能演化下平均攻击成功率上升 14.0–48.8 个百分点，强化学习下上升 3.0–39.3 个百分点。", "supplement": false}, {"title": "Understanding and Mitigating Role Spoofing in LLMs", "authors": "Ezra Edelman 等", "url": "https://arxiv.org/abs/2610.40396v1", "category": "cs.CR, cs.AI（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "揭示并缓解“角色冒充”攻击：模型按文本风格而非标注角色判断“谁说的”，工具输出里的恶意文本可借此冒充用户；作者还发现只教模型忽略内容型注入的对抗训练防不住结构型攻击，并提出用线性探针检测角色冒充。", "insight": "关联较弱，但有一个值得借鉴的方法论点。第一，它的“角色归因按风格而非标签”与我们在讨论“AU 判定依据”时要警惕的问题相通：授权判定必须依据可验证的来源标签与策略，而非内容表面的可信感——若 AU 映射依赖文本风格或启发式归因，攻击者就能用风格伪造越权；这一点可写进威胁模型讨论，作为“为什么 M(r) 覆盖映射必须是显式元数据而非推断结果”的佐证。第二，它的对抗训练“防内容、不防结构”结论提醒我们：任何只在内容层做防御的方案（包括我们若只做文本裁剪）都可能被结构层绕过，防御评估应分内容型/结构型两维报告。第三，诚实标注：线性探针“在不同设定下均有效”未在摘要中给出量化指标，且“简化设定”一词表明对抗训练结论来自受控实验，不宜写成对前沿模型的普遍结论；整体定位为方法论注脚，不展开引用。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "LLM 仍易受提示注入操纵，近期观察到的“角色混淆”（Ye et al., 2026）指出模型会按文本风格而非标注角色来归因文本来源；agent 访问的恶意网页等工具输出可利用这一点冒充用户，作者称之为角色冒充（role spoofing）。本文研究模型如何追踪“谁说了什么”，发现模型同时使用内容线索（语义、写作风格）与结构线索（控制 token、格式）；结合伪造结构与内容的角色冒充攻击极易得手。在简化设定中，教模型忽略内容型注入的对抗训练可缓解内容型攻击，却对结构型攻击无效——这可以解释为何对多数注入攻击抵抗力更强的前沿模型仍可能被角色冒充攻陷。最后，作者提出用训练于对话角色预测的线性探针检测角色冒充，在不同设定下均有效。", "supplement": false}]}, {"date": "2026-10-30", "summary": "", "papers": [{"title": "Evidence to Policy Assurance for Agentic AI: A Verifiable Provenance Framework for Regulated Enterprises", "authors": "Aditya Krishnan", "url": "https://doi.org/10.65796/fet.vol.2.issue.2.1", "category": "OpenAlex（2026-10-27），venue 未在 OpenAlex 中标注", "cats": [], "oneliner": "为受监管场景的 agent 行为建一张“证据—策略”溯源图：一次 consequential action 只有在其支撑证据同时满足权威性、时效性与充分性时，才算合规。", "insight": "这是今天唯一值得在 related work 里占位的一篇，且与我们的“批准—执行绑定”议题直接咬合。第一，它的扰动清单里“执行金额与授权不一致”与“缺失二次批准”正是 ChainBind/E12 语境下“批准≠执行”的两种具体形态：EPAG 的做法是事后用图把“授权了什么、执行了什么、证据是否合格”钉死、可重建、可分离——这与我们的事中 AU 求值互补，一前一后构成“事中拦截 + 事后可审计”的完整链条，写 related work 时可用它来说明“为什么光有拦截还不够，审计侧也需要结构化表示”。第二，它的六条标准里“确定性（determinacy）”与“可重建性（reconstruction）”值得借鉴为我们审计/日志一节的检验口径：我们的 AU 求值日志若不能从记录中唯一重建“当时按哪个策略版本、对哪个 AU 判了什么”，事后争议就说不清。第三，必须诚实标注其分量：作者自己明言结论只是“六个构造图实例的表示充分性”，不是部署实测、不是合规证明；且 AgentDojo/ToolEmu 数字只是引用背景、未实测，引用时绝不能写成“EPAG 在 629 个案例上有效”。另外 venue 未标注、引用 0 次，定位应为“概念框架参照”，不宜当作实证支撑。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "常规执行轨迹只记录 agent“做了什么”，无法证明支撑某次关键行动的证据是否权威、是否最新、是否足以支撑该策略判断。本文提出 Evidence to Policy Assurance Graph（EPAG），用类型化图把数据源、合格证据、主张、策略谓词、合规判定、授权、已执行动作与观测结果串起来。评估用一个 25 万美元资金划转构造案例：1 个有效基线（S0）+ 5 个单条件扰动（S1–S5），按完备性、资格、定位、确定性、可重建性、可分离性六条标准检验；基线全部通过，扰动分别暴露了陈旧账本证据、非权威电子表格、资金不足、缺失二次批准、执行金额与授权不一致五类失败，每类都映射到既定的处置与跟进动作。文中引用的 629 个 AgentDojo 安全案例与 144 个 ToolEmu 案例仅作风险背景，未用 EPAG 重跑。", "supplement": false}, {"title": "ACTA: A Verifiable Accountable Decryption Mechanism for Secure and Auditable Blockchain-Based Data Sharing", "authors": "Nabeel Zuhair Tawfeeq 等", "url": "https://openalex.org/W7223951028", "category": "Sakarya University Journal of Computer and Information Sciences（2026-10-27）", "cats": [], "oneliner": "在区块链数据共享里把“谁有权解密”与“解密实际执行”绑在一起：授权、密文与可信执行环境内的解密三段链接，事后留下可验证的审计证据而不泄露明文。", "insight": "关联较弱，但“绑定”思想可作跨域对照，不宜深引。第一，它的“三段链接”（访问授权—加密数据—enclave 内解密执行）与我们的“批准必须绑定到执行那一刻的动作”在抽象层面同构：都是防止“批的是一回事、执行的另一回事”，且它用“不泄露明文派生值”的方式解决了审计与机密性的张力——这一点对我们讨论“AU 求值日志该记多细”有启发：日志要能证明授权与执行的对应关系，又不能把被保护内容本身记进日志。第二，限定要写清：场景是证书/敏感记录共享而非 RAG 检索，16 TPS 量级与毫秒延迟是许可链 + TEE 实验台的数字，不能迁移为检索授权的性能参照；且其 DOI 在 OpenAlex 记录中显示截断（`10.35377/saucis...1986038`），本报告链接改用 OpenAlex 记录页，引用时需另行核实正式 DOI。总体定位：方法论注脚一句话即可，不值得在正文里展开。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "敏感记录共享需要同时满足严格访问控制、机密性与可问责性，但现有区块链方案对“可验证问责 + 受控解密”的支持有限。本文提出 ACTA（Accountable Confidential Trusted Access），结合区块链、可信执行环境（TEE）与 IPFS 离线加密存储：链上存内容标识（CID）与哈希做完整性校验，解密在注册 enclave 内执行，成功后链上记录“经认证的请求者按其授权取到了该加密记录、且操作由注册 enclave 执行”的可验证证据，且不发布任何源自明文的值。Hyperledger Caliper 四轮实测：证书签发峰值 16.82 TPS、完整可问责解密流程 16.45 TPS（ offered load 2–25 TPS），平均端到端延迟随负载上升分别从 1212 ms 降至 295 ms、从 1092 ms 降至 222 ms。", "supplement": false}]}, {"date": "2026-10-29", "summary": "", "papers": [{"title": "Heads of Security: Learned Attention Gates Improve Prompt Injection Robustness", "authors": "Igor Shilov 等", "url": "http://arxiv.org/abs/2610.37657v1", "category": "arXiv cs.LG / cs.CL / cs.CR（2026-10-27）", "cats": ["cs.LG", "cs.CL", "cs.CR"], "oneliner": "用少量可学习的逐头注意力门强制指令—数据分离：模型可以推理不可信内容，但不跟随其中夹带的指令。", "insight": "这是今天机制上最值得引用的防御对照。第一，它与我们的立场互补而非重叠：我们是在检索与执行层用 AU 求值决定“什么可见、什么可执行”，HoS 是在模型内部用注意力门决定“什么可被当作指令”——两者一个在系统边界、一个在模型内部，合起来正好构成纵深防御的两个层次，related work 里可以这样分层写，避免把“注意力门”与“授权求值”混为一类。第二，它给出了一个可借鉴的评测口径：不仅报告静态基准，还报告自适应攻击的成本倍数（3 倍 FLOPs）与工具效用底线（ASIDE 的 10% 是反面教材），我们的防御评测若只报静态攻击成功率，会低估自适应对手；至少应在讨论里说明自适应攻击成本未测。第三，限定要写清：HoS 的“分离”是学习到的门控，不是确定性保证——门可以被更强的自适应攻击磨穿（只是更贵），而我们的 AU 求值追求的是策略层面的确定性拒绝；引用时不能把 10% 写成“已解决注入问题”，只能写成“架构级分离把攻击成本抬高了数倍”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "HoS 为每个注意力头学习一组门，控制其在可信 token 与不可信 token 之间的注意力再分配，从而在架构层面实现指令与数据的分离。在 Llama-3.3-70B-Instruct 与 GPT-OSS-20B 上的评测中，黑盒 RL-Hammer 攻击对 GPT-OSS-20B 的成功率为 97%、对微调防御 SecAlign++ 为 85%，对 HoS 仅为 10%；经针对性强化的白盒 Claudini 攻击要在 HoS 上达到同样成功率，需要 3 倍 FLOPs。效用方面，HoS 在标准多选题与多种提示设置下保持基线水平，而 SecAlign 与 ASIDE 在 few-shot 下退化；静态攻击的 agent 基准上 HoS 与 SecAlign 相当，但 ASIDE 的工具调用效用仅 10%。", "supplement": false}, {"title": "Constraining the Commit Boundary: A DIO/ODI-Informed Authorization Guardrail for Agentic Entity Resolution", "authors": "Daniel Beránek", "url": "http://arxiv.org/abs/2610.37407v1", "category": "arXiv cs.AI / cs.CR / cs.DB（2026-10-27）", "cats": ["cs.AI", "cs.CR", "cs.DB"], "oneliner": "为 agent 实体解析划一条提交边界：能用来推理的证据，不等于能用来授权一次持久身份变更的证据。", "insight": "概念上与我们的 RU/AU 解耦几乎同构，值得作为“独立提出同一原则”的佐证引用。第一，它的“推理证据 vs 授权证据”二分，正是我们 M(r) 覆盖映射 + 逐 AU 求值的另一种表述：可见 ≠ 可用，可用 ≠ 可提交；我们在论文中可以用它来说明，这一区分不是我们的孤例，而是 agent 授权里正在收敛的共识。第二，它的“提交时版本有效性”与“逐命题支撑”两条，补了我们讨论里较弱的一环：我们谈了逐 AU 求值，但对“求值后、执行前状态变了怎么办”着墨不多，这篇把“提交时刻再校验版本与范围”写成了必要条件，可借鉴为执行语义的一条完整性要求。第三，必须诚实标注其分量：无实现、无数据，引用价值在原则与术语（commit boundary、UNVERIFIED 不授授权资格），不能当作“该方法有效”的证据；且其 DIO/ODI 本体论包装较重，引用时应剥离包装、只取边界原则，避免把我们的论文拖进本体论讨论。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Agentic 实体解析系统会循环规划、取证、修正假设并提出图变更，错误的身份假设还可能污染后续取证、制造自我印证。本文提出 DIO/ODI 启发的授权边界：领域治理的约束绑定函数把重建失败的区分映射为显式身份保持约束；抽象的两阶段监管器只在以下条件同时满足时才放行提交——每条必需命题都有“授权合格”的逐命题证据支撑、相关冲突已解决、操作在授权范围内、相关状态与策略版本在提交时仍有效；以 UNVERIFIED 准入只允许探索性推理，不授予授权资格；证据不足或存在实质冲突时一律推迟。作者明确声明：这是概念架构，无实现、无实测验证，不是对语义正确性的定理，也不阻止错误假设本身或假设条件化的取证。", "supplement": false}, {"title": "Policy-as-Code Governance for Agentic Enterprise Workflows", "authors": "Girish Rajagopalan Sesha", "url": "https://doi.org/10.5281/zenodo.23657643", "category": "Zenodo（2026-10-26）", "cats": [], "oneliner": "把“批准”写成可执行的契约：批准必须绑定规范动作、目标、参数、相关状态与软件版本，直到执行那一刻，且一次批准只能兑现一次。", "insight": "这是今天与我们“执行时授权绑定”主张最贴近的一篇，可直接用作 related work 里“批准—执行绑定”路线的代表。第一，它的五条不变量几乎可以逐条映射到我们的执行语义：规范动作 ≈ AU 粒度的授权对象，变化失效 ≈ 覆盖映射失效即拒绝，兑现时重查 ≈ 查询时逐 AU 求值而非事前一次性放行，单次消耗 ≈ 批准不可复用于变更后的动作——这种映射关系写进论文，能让读者一眼看出我们的贡献不是孤立的工程技巧，而是一组可检验契约的实例化。第二，它的并发演示（8 抢 1 只写 1 次）提醒我们一个评测缺口：我们的语义目前多谈单次求值，未明确“同一批准被并发/重放兑现”时的行为，至少应在威胁模型或局限里说明重放与并发兑现的处理。限定同样要写清：15 个场景是自编演示、非对抗评测，且载体是 Zenodo 存档而非同行评审 venue，引用时定位为“契约表述的参照”，而非“已被验证的系统”。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "本文针对企业 agent 工作流提出 approval-to-execution 契约，核心是五条显式承诺：批准指名一个规范动作；动作变化即失效匹配；兑现时重查当前权限、状态与版本；一次成功提交即消耗该批准；每次失败返回稳定、可操作的理由与补救，而不削弱授权。作者强调贡献是契约本身与运行不变量，而非新策略语言或交易授权的发明；Python + SQLite 演示通过了 15 个自编场景，其中 8 个并发兑现同一批准的尝试只产生一次模拟写入与一张回执。", "supplement": false}, {"title": "Penny for Your Prompts: A Measurement Study of Contextual Leakage in AI Chat Platforms", "authors": "Paschalis Bekos 等", "url": "http://arxiv.org/abs/2610.37467v1", "category": "arXiv cs.CR / cs.CY（2026-10-27）", "cats": ["cs.CR", "cs.CY"], "oneliner": "首次系统实测聊天平台的上下文泄露：42 个平台里，一半泄露对话标题、9 个原样泄露用户提示，邮箱外流还让对话能与身份挂钩。", "insight": "它把我们威胁模型里的一条暗线摆到了台面上：我们的 T1/T2/T3 按“对手能看到什么”分层，默认对手在系统内通过检索或排序通道窥探；这篇揭示的是**系统外的平台旁路**——用户以为只发给了聊天机器人，实际上标题、原文与邮箱经第三方脚本流向了追踪器。启迪有两层：第一，在论文的威胁模型讨论里，应明确划界——我们的 AU 机制管的是“系统内谁能看到哪段内容”，而平台侧第三方脚本泄露属于部署与前端治理问题，不在 AU 求值范围内，但两者叠加时风险会放大（已授权用户在前端的对话仍可能经追踪器外流），划界不清会被审稿人追问。第二，它提供了一个可引用的实测方法论参照：JS 引擎层归因把“谁触发、用什么 DOM 机制抓取”钉死，比只看网络包更能定责；我们若要论证“泄露通道不止 embedding 一条”，这篇的 21/42、9/42 就是现成的数字。限定：审计对象是 Web 界面实现，结论不宜外推到 API 调用或企业内网部署；且“大量平台发邮箱”未给精确计数，引用时只用有数字的两项。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "作者审计了 42 个通用与领域（医疗、法律、教育）聊天平台的 Web 界面，除常规网络拦截外，还在 JavaScript 引擎层插桩，把每条数据流精确归因到触发它的用户动作与 DOM 抓取机制——这是纯网络层分析看不到的粒度。结果：21 个平台向第三方追踪器泄露对话标题，9 个泄露逐字用户提示；此外还有大量平台向第三方发送用户邮箱，使对话上下文可与真实身份关联。作者指出，这类问题根植于用户与现代聊天机器人的交互方式本身，而非个别平台的实现失误。", "supplement": false}, {"title": "What Victims Take Away: Attack Reuse and Defense Revision after Prompt-Injection Attacks", "authors": "Zihan Chen 等", "url": "http://arxiv.org/abs/2610.36422v1", "category": "arXiv cs.CR / cs.HC（2026-10-27）", "cats": ["cs.CR", "cs.HC"], "oneliner": "攻击日志是双刃剑：用全部 56 万条 Tensor Trust 攻防记录证明，收到过的成功攻击会被受害者拿去再攻击别人，而同类攻击在受害者修补后成功率下降 24.5 个百分点。", "insight": "关联较弱，但对我们论文里“攻击披露与日志”一节有直接的警示价值，值得收为方法论注脚而非机制证据。第一，它揭示了一个我们目前没有讨论的披露困境：为了可复现、可审计而公开攻击样本，本身会扩散攻击能力——我们的论文若在附录或仓库里公开注入样本与防御绕过案例，应借鉴它的结论，至少讨论“技术描述 vs 全文披露”的分级策略，而不是默认全文公开就是负责任的。第二，它的“复用跟收益走、不跟表面像不像成功走”是一个可迁移的评估提醒：我们在评估防御时，若只看“攻击文本是否被模型复述/执行”，可能低估那些“看起来失败、实则已被学习”的传播效应；不过这一点在游戏场景里成立，迁移到企业 agent 部署时需谨慎，游戏玩家的攻击动机与企业内用户的行为模式不同。限定：数据源是游戏玩家行为，非真实企业攻防；23.2% 等数字是游戏内的统计，不宜当作真实世界的攻击复用率引用。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "攻击日志与红队报告会把攻击原文交给被攻击方以便修复，但提示注入本身就是纯文本，等于同时交出了一份可用的攻击副本。作者用 Tensor Trust 游戏的全部 563,349 条攻击记录，把每条被收到的攻击与同时期在相似玩家间流传、但未到达该目标的匹配攻击对照：被攻破防御的攻击在一周内被目标拿去攻击他人的比例为 10.0%，对照组仅 0.03%（调整后差异 8.8–10.0 个百分点）；“差点成功”（回复以 access granted 开头但判为失败）的复用率与失败攻击一样低，说明复用跟的是“是否得手”而非“回复看起来像不像成功”，符合按收益偏向的社会学习解释。被攻破后目标会修改防御，此后同族攻击对该目标的成功率相对其他防御者下降 24.5 个百分点；复用主要来自本来就在攻击的玩家，而非新人；所分析的成功劫持中有 23.2% 来自先前收到的文本。作者据此提出可检验的披露假设，如“只描述技术、不给全文”。", "supplement": false}, {"title": "Indirect Prompt Injection Attacks on LLM Agents and Defense Mechanisms", "authors": "Zijia Guo", "url": "https://doi.org/10.54254/2755-2721/2026.38107", "category": "Applied and Computational Engineering（2026-10-27）", "cats": [], "oneliner": "间接提示注入的系统综述：按攻击入口、劫持机制与危害三层分类攻击，按干预点把防御排成输入、处理、行为、训练、输出五层，并指出单层防御都有盲区。", "insight": "作为综述，它的价值在“定位图”而非新证据。第一，它的“单层防御必有盲区、至多 7.5 个百分点”这一判断，与我们“授权必须在执行层按 AU 求值、而非只在输入层过滤”的主张形成呼应：输入层过滤正是它五层中的一层，单靠它挡不住间接注入；我们在 related work 里引用它时，可以把它作为“为什么需要执行层授权”的一句支撑，但要注意它的 7.5 个百分点是综述层面的综合判断、非单次实验结果，引用时须标注为综述结论。第二，它的五层防御分类可作我们防御分层的对照表：我们的 RU/AU 机制横跨“处理（检索裁剪）+ 行为（执行授权）”两层，若能在论文里明确标出自己覆盖哪几层、哪几层留给互补机制，审稿人对“这篇到底防了什么”的疑问会少很多。限定：载体为会议论文集综述，非顶会 venue，分类的完备性未经独立验证，引用时定位为“分类参照”，不宜当作攻击有效性的原始证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "综述覆盖 LLM agent 间接提示注入的攻击、防御与评估三面：攻击侧建立入口路径（7 类）、劫持机制（5 类）与危害（5 类）的三层分类；防御侧按干预点组织为输入、处理、行为、训练、输出五层体系，并横向比较效果与部署成本；评估侧评述 BIPIA、InjecAgent 等代表性基准，提出攻击、防御、系统三维评估指标。核心结论是：现有防御对直接注入的稳健性提升明显，但对间接注入的提升至多 7.5 个百分点，且每个单层防御都有盲区，因此需要多层协同的纵深防御与统一评估框架。", "supplement": false}, {"title": "A Survey of Knowledge Extraction Attacks and Defenses in LLM Agent Ecosystems", "authors": "Fan Li 等", "url": "https://doi.org/10.20944/preprints202610.2538.v1", "category": "Preprints.org（2026-10-26）", "cats": [], "oneliner": "以“资产”为纲的 agent 知识抽取综述：训练资产、部署集成资产、运行时可复用资产三类，覆盖训练数据、模型、提示、RAG 系统、agent 记忆与技能。", "insight": "关联较弱，但分类框架对我们有借鉴价值。第一，它的资产分类把“RAG 系统、agent 记忆、技能”并列为可抽取资产，这与我们论文里“检索单元本身就是敏感资产”的视角一致：我们谈 embedding 泄露时，默认泄露对象是文档内容；这篇提醒我们，**记忆与技能也是可抽取的资产**，且抽取路径不一定经过检索——若我们的威胁模型只写文档泄露，审稿人可能追问记忆/技能抽取是否在 scope 内，至少应在讨论里划界。第二，它的“训练—部署—运行时”三分法可作我们相关工作组织的参照：我们的 AU 机制主要落在运行时授权，若能在 related work 里按此三分法标出各防御的位置，定位会更清晰。限定：Preprints 预印本、非同行评审，且摘要未给出任何量化结论，引用价值仅限分类框架，不能用来支撑任何攻击有效性或防御效果的数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "LLM agent 的开发与部署投入巨大，已成为有价值的知识产权资产，知识抽取攻击旨在无授权地恢复受保护知识或复制 agent 组件与功能，威胁知识产权与用户隐私。既有综述多聚焦模型抽取，或把信息泄露作为更广泛安全讨论的一部分，对 agent 生态内的知识抽取覆盖不足。本文提出资产导向的分类：训练资产、部署集成资产、运行时可复用资产，涵盖训练数据、LLM、提示、RAG 系统、agent 记忆与技能；对每一类系统梳理代表性攻击机制与对应防御，指出最新进展与未解挑战，目标是为更安全可信的 agent 提供全面认识。", "supplement": false}]}, {"date": "2026-10-28", "summary": "", "papers": [{"title": "CoSA: The Conflict of Skills Attack in Real-World LLM Agent Ecosystems", "authors": "Yujia Zheng 等", "url": "http://arxiv.org/abs/2610.35082v1", "category": "arXiv cs.CL / cs.AI / cs.CR（2026-10-26）", "cats": ["cs.CL", "cs.AI", "cs.CR"], "oneliner": "提出技能组合冲突（Conflict of Skills）：单技能各自合规、组合后却越权；并以 288 任务的 CoSA-Bench 实测这一失效，再用一个执行前检查信息流与授权的 harness 护栏把它压回去。", "insight": "这是今天对我们最直接的一篇，价值有三层。第一，它把我们 RU/AU 论文里\"逐 AU 求值\"的必要性从设计主张变成了可复现的反例：单体授权检查在组合下失效，不是因为某个 Skill 写坏了，而是因为**授权没有随制品/决策跨步骤传递**——这正是我们 M(r) 覆盖映射与\"批准依据绑定\"要解决的问题，可在论文中作为\"为什么不能只做单步检查\"的实证引用。第二，它的护栏设计与我们的执行语义高度可比：执行前检查信息流 + 授权 ≈ 我们的 retrieve-then-project / per-view 在执行层的对应物，且它给出了可用性代价（良性完成率仅 -1.67 个百分点），是我们论证\"安全不必以可用性崩盘为代价\"时可并列的数字。第三，它提醒我们一个威胁模型缺口：我们的 T1/T2/T3 按对手可见性分层，而 CoSA 的对手甚至不需要\"看见\"更多——只需往池子里加已准入的 Skill，组合本身就是攻击面；这提示我们在讨论\"组合语义\"时应明确：**AU 的组合规则（合取/传递/失效）本身需要形式化，缺了它，逐 AU 求值仍可能在组合处漏水**。限定：评测用的是公开 Skill 与受控服务，真实企业技能池的异构程度更高，23.43 个百分点的增幅不宜直接外推；且护栏只在 OpenClaw 招聘任务上验证，跨域泛化未证。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Agent Skills 让 LLM agent 复用现成能力，但逐个 Skill 单独检查无法排除组合后的策略违规：为某一目的产生的制品或评估信号，可能在下游被复用而不保留原有的限制或授权。作者以公开 Skill 的受控执行与单 Skill 对照，归纳出 CoS 的四种 recurring 机制；进而提出 CoSA 攻击——只向已有技能池中加入本地已准入的 Skill（不改动原有 Skill 与运行时权限），通过补齐缺失业务操作或重塑制品交换、决策复用、目标/动作绑定来触发违规。评测用真实 Skill 与受控服务搭建 CoSA-Bench（招聘、金融、IT、商业 4 域 288 任务，覆盖数据泄露、未授权状态修改、不安全执行），在 5 个 LLM × 3 个 harness 上，新增量控制在原池 5% 以内时策略违规率从 35.02% 升至 58.45%（+23.43 个百分点），轨迹分析把\"合规变违规\"的转移归因于涉及新增 Skill 的跨 Skill 依赖。最后的轻量 harness 护栏在执行前检查信息流与授权，在 OpenClaw 招聘任务上把违规率从 65.28% 降至 6.67%，而匹配良性对照的任务完成率仅从 66.67% 变为 65.00%。", "supplement": false}, {"title": "TrustJev: Separating Policy Authority from Untrusted Evidence in LLM-Based Decisions", "authors": "Zhiwei Xu 等", "url": "http://arxiv.org/abs/2610.34826v1", "category": "arXiv cs.AI（2026-10-26）", "cats": ["cs.AI"], "oneliner": "把\"策略权威\"与\"不可信证据\"分开：一个 Transformer 主干先从可信策略算出策略分数与修正预算，再把证据的修正幅度框在这个预算内，证据再怎么夹带指令也翻不了策略的盘。", "insight": "思路同构、实现分界清晰，引用时要同时写出这两面。同构的一面是\"策略权威独立于证据\"——策略分数与修正预算只从可信策略来，证据只能在预算内修正，这与我们\"策略独立存放、查询时逐 AU 求值、未知 AU 默认拒绝\"的架构哲学一致，可作 related work 里\"策略与证据分离\"路线的代表。分界的一面更重要：TrustJev 的\"权威\"是学习到的打分与预算，不是确定性策略求值——它的 95.77% 是统计意义上的稳健，不是\"策略被违反时一定拒绝\"的保证；而我们的 AU 求值追求的是确定性语义（策略说不就是不）。因此它不能用来论证我们的安全性，只能用来论证\"分离架构\"这一方向在决策模型里同样有效，且在需要容忍证据噪声的场景（如证据本身就是部分可信的业务数据）可作互补层。另有一个可借鉴的评测口径：Balance（攻击/非攻击调和平均）与\"每源全部攻击挡住率\"，比单点攻击成功率更能暴露\"偶尔漏一次就够\"的长尾风险，我们的评测在报告授权基准时可参考这种\"全挡住才算过\"的严苛口径。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "决策模型按自然语言输入从预定义动作中做选择，但供给事实的外部证据里可能藏有试图覆盖应用策略的指令。TrustJev 用\"受保护的策略打分 + 有界证据修正\"应对：单个 Transformer 主干从可信策略与候选项算出策略分数与修正预算，证据修正被预算框住；配对监督让模型在\"插入指令但事实不变\"时保持预测稳定、在\"编辑改变正确答案\"时跟随改变；权威监督则在策略本身无法定夺时容纳证据。0.6B 实现在认证、指令层级、可执行授权规则三类数据集上对 14 个基线取得最高平均 Balance（攻击与非攻击输入准确率的调和平均），每项超出最强基线 0.57–1.05 个百分点；在授权基准上，对固定攻击池中每源 32 次攻击全部答对的源占比达 95.77%（最强对照 80.98%），推理内存与中位延迟与基线相当，额外开销主要在训练侧。", "supplement": false}, {"title": "Scope-Gap Injection: Exploiting Evaluator Channel Blind Spots in the OpenClaw Agent Security Competition", "authors": "Weihang Niu 等", "url": "http://arxiv.org/abs/2610.34777v1", "category": "arXiv cs.AI / cs.CR（2026-10-26）", "cats": ["cs.AI", "cs.CR"], "oneliner": "多阶段安全评审的盲区攻击：评审只看任务指令与技能定义、不看附件，而 agent 执行时却会读附件——把目标标识、绕过参数与授权流程藏进附件写成的\"业务工作清单\"，就能让无害的表面任务在执行时触发权限绕过。", "insight": "这篇的价值不在攻击手法的新奇，而在它把\"范围不一致\"本身钉成了一个可命名的攻击面，这对我们有两处直接启示。第一，它与我们的 T1/T2/T3 分层形成镜像：我们按\"对手能看到什么\"分层，而 SGI 暴露的是\"评审能看到什么 vs agent 能碰到什么\"的不对称——任何只检查\"可见部分\"的安全机制（无论是 LLM 评审、静态扫描，还是检索后过滤），只要执行通道比检查通道宽，就必然存在 scope gap；这为我们\"授权必须在执行层、按 agent 实际可达的全部通道求值\"的主张提供了一个竞赛实证。第二，它与 CoSA 互补：CoSA 说\"组合会漏\"，SGI 说\"检查范围会漏\"，两者合起来说明**单点检查的失效不是偶然，而是结构性的**——我们的 per-view 索引（让 agent 根本看不到未授权视图）恰好是对这两类漏的共同回应：不是把检查做得更聪明，而是让不可达的在执行层就不存在。限定：结论来自一次竞赛的评审实现观察（\"S2 似乎不检查附件\"为作者推断，非官方确认），不宜推广为\"所有 LLM 评审都有此盲区\"；且 F = 0.385 的绝对分不算高，SGI 的意义在\"绕过三关\"的存在性而非得分。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "在 IJCAI 2026 OpenClaw Agent Security 攻击竞赛中，每个攻击包要过三关：静态技能扫描（S1）、对任务与技能定义的 LLM 评审安全检查（S2）、 live 执行审计（S3）。作者观察到一个范围缺口：S2 似乎只检查任务指令与技能定义、不检查附件内容，而 agent 在 S3 执行时却会读取附件。Scope-Gap Injection（SGI）正是利用这一点：让可见的任务与技能保持良性，把目标标识、绕过参数与授权流程移入附件（写成业务工作清单），S2 评审看到的是无害任务，agent 却按隐藏清单行事并触发权限绕过。实测中 SGI 对 19 个目标中的 5 个绕过了全部三关，单次最高分 F = 0.385；整个提交活动中，附件放置的 S2 通过率（78%）远高于技能内放置（23%）。作者最后给出防御方向：让评审范围与 agent 可达通道对齐。", "supplement": false}, {"title": "Then there is prompt injection, a malicious email, ...: The Wild Wide West of OpenClaw Agentic System Security", "authors": "Mostafijur Rahman Akhond 等", "url": "http://arxiv.org/abs/2610.35451v1", "category": "arXiv cs.CR / cs.SE（2026-10-26）", "cats": ["cs.CR", "cs.SE"], "oneliner": "OpenClaw 安全问题的田野调查：25K+ Reddit 帖子与 358 个安全标签 GitHub issue 里挖出 521 个 CWE 实例、59 类弱点，集中在访问控制失效、敏感数据暴露、注入与不安全执行——结论是这不是孤立 bug，而是整条 agent 执行管线信任边界的系统性缺失。", "insight": "关联较弱，但作为\"行业现状证据\"有引用价值，不宜作为机制证据。它的 521/59 数字与\"访问控制失效居首\"的分布，可以放在我们论文 motivation 一节，用来说明\"agent 执行管线的授权缺失不是理论风险，而是已在真实部署社区里成批出现\"——与我们 T1/T2/T3 的分层叙事互补：这篇给出的是\"问题有多普遍\"，我们给出的是\"问题在结构上为什么会发生、该怎么分层防\"。它的 7 类缓解策略（显式信任边界、最小权限、执行隔离、运行时监督、纵深防御）也可作对照：我们的 RU/AU 解耦与执行时绑定，恰好覆盖了其中\"信任边界\"与\"运行时监督\"两类，但用的是确定性授权语义而非最佳实践清单。需诚实标注限定：数据源是 Reddit 讨论与 GitHub issue（自我选择偏差大、非随机样本），CWE 映射是定性编码而非漏洞实测，数字不宜当作\"OpenClaw 漏洞率\"引用；且它是横断面调查，没有提出或验证新防御机制。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "OpenClaw 这类个人助理框架把 LLM 推理、持久记忆、工具调用、本地执行与 Web 工作流拼在一起，有用，但当不可信输入、模型推理、工具、记忆与部署配置在没有显式信任边界的情况下交互时就会产生安全风险。作者用两类互补数据源做实证：13 个 OpenClaw 相关 subreddit 的 25K+ 帖子中筛出 162 篇安全相关帖子（1,787 条评论），358 个安全标签 GitHub issue 中保留 180 个描述具体安全关切的 issue；经定性分析与证据锚定的 CWE 映射，得到 521 个 CWE 实例、59 类弱点，集中在访问控制失效、敏感数据暴露、注入与不安全执行；另从实践者建议中提炼 543 条缓解建议、归纳为 7 类 recurring 策略，并用虚拟密钥值做了一个敏感数据暴露路径的证据锚定示意重建。结论是 OpenClaw 的安全问题不是孤立实现 bug，而是 agent 执行管线信任边界的 recurring 失效；作者据此提出更安全 agentic 系统的含义：显式信任边界、最小权限工具访问、执行隔离、运行时监督与纵深防御部署。", "supplement": false}]}, {"date": "2026-10-27", "summary": "", "papers": [{"title": "Model Context Protocol and the Agent–Tool Ecosystem: A Systematic Survey of Standardizing AI Tool Integration", "authors": "Aref Mahmoudpour", "url": "https://doi.org/10.5281/zenodo.23617883", "category": "Zenodo（2026-10-24，未经同行评审）", "cats": [], "oneliner": "系统梳理 MCP（Anthropic 2024-11 提出、类比 LSP 的 agent–工具标准协议）的架构、三类 server 原语、传输与 OAuth 授权模型，以及第三方工具 server 带来的安全问题与开放问题。", "insight": "这是方向 2 最直接的\"协议层地图\"，可作 related work 的背景引用。它的价值不在新机制，而在把授权问题定位清楚：工具调用的授权不在模型一句话里，而在\"谁能注册 server、工具描述是否可信、OAuth  scope 如何随调用传递、能力漂移后旧授权是否还作数\"这几个关口——这与我们\"批准依据绑定 + 变化失效 + dispatch 重验\"的主张在同一条线上，可用来论证\"绑定必须落在协议/执行层而非 prompt 层\"。它的开放问题清单也可直接借用：能力漂移（capability drift）正是我们\"变化失效\"要形式化的现象，server 信任与注册治理则对应我们 AU 体系里\"谁有权定义 AU\"的前提问题，引用时可作对照。需诚实标注三处限定：① Zenodo 综述、未经同行评审，证据等级低；② 它梳理授权模型但未提出可验证的绑定机制，不能当作已有解决方案引用；③ Jev 初筛相关度仅 0.29，收录是人工复核全文摘要后的决定，读者应以\"背景地图\"而非\"核心证据\"看待它。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "在 MCP 之前，每个 AI 应用与外部系统（数据库、代码库、SaaS、文件系统）的连接都是一次性定制集成，造成 N×M 碎片化；MCP 以 host/client/server + JSON-RPC 的统一标准取代这种拼凑。本文描述其架构与三类 server 原语（tools、resources、prompts）及客户端特性（sampling、roots、elicitation），分析本地 stdio 与远程 Streamable HTTP 两种传输、演进中的 OAuth 授权模型，以及第三方工具 server 的安全问题——包括经由工具描述的 prompt injection 与越权工具暴露；并横向对比原生 function calling、OpenAPI 描述的工具与 A2A 等 agent 间协议，梳理从 function-calling 榜单到交互式 agent benchmark 的评测谱系，最后列出开放问题：server 信任与注册治理、缺乏 MCP 专用 benchmark、版本与能力漂移、以及向 Agentic AI Foundation 中立托管的过渡。", "supplement": false}, {"title": "Agentic and generative AI for intelligent autonomous vulnerability assessment and penetration testing: A systematic analysis", "authors": "Samuel Roy Anthony Truss 等", "url": "https://doi.org/10.1016/j.cosrev.2026.101083", "category": "Computer Science Review（2026-10-24）", "cats": [], "oneliner": "PRISMA 系统综述：从 1144 篇筛出 72 篇，刻画 agentic 与 generative 两条路线在自主漏洞评估与渗透测试（VAPT）中的分工，并导出统一模型、MCP 式接口威胁抽象与五维自主度 benchmark 设想。", "insight": "关联较弱，但有两处可借鉴、一处可作反向论据。可借鉴的是它的\"分层 + 治理\"叙事：自主审计正从孤立 AI 辅助任务走向\"政策约束、可审计架构\"，这与我们从 RAG 检索层走向\"检索—行动全链路绑定\"的演进判断同向，可在讨论段用来说明\"运行时护栏\"已是跨子领域的共识方向而非我们一家之言；它的\"MCP 式接口威胁抽象\"与\"五维自主度 benchmark\"设想也可作我们评测口径的对照（我们的五阶段拆分关注授权判定本身，他们的五维关注自主程度，两者正交、可互补）。反向论据是它的数据本身：72 篇中仅 2 篇真正做 agentic 控制、且自主度数字高度依赖脚手架——这提醒我们，任何\"agent 自主完成 X\"的宣称都必须同时报告脚手架与人类辅助比例，否则安全数字虚高；我们的评测在报告时应坚持这一披露口径。注意边界：这是 VAPT 领域的综述，场景是安全审计而非 RAG 授权，引用时不得把它的结论直接平移到 RAG 场景；且它提出的 benchmark 只是设想、尚未实证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "现有文献多孤立于审计的某个阶段、且以传统 IT 为中心。本文按 PRISMA 从 1144 篇初筛出 72 篇（2020–2025），按五属性编码：结论是 agentic 路线擅长序列化自适应任务（侦察编排、利用路径选择、横向移动、后渗透 pivoting、自适应复测），generative 路线擅长非结构化证据推理（配置与公告解读、漏洞情境化、可利用性评估、合规映射、可追溯审计报告）；但 72 篇中 56 篇用经典机器/深度学习、仅 14 篇用生成式/LLM 技术、仅 2 篇用强化学习或 agentic 控制，且无一篇在真实或仿真 OT/IIoT 目标上验证，报告的自主度高度依赖脚手架（AutoPenBench 上完全自主 21% vs 人类辅助 64%）。作者据此导出四层统一模型（agentic 决策、generative 推理、结构化工具接口、验证–治理），并提出 MCP 式接口层的形式化威胁与评测抽象和五维 VAPT 自主度 benchmark；遗留挑战包括幻觉控制、prompt injection、稀疏奖励、可解释性、安全感知评测与 benchmark 标准化。", "supplement": false}]}, {"date": "2026-10-26", "summary": "", "papers": [{"title": "Permission Withdrawal in Tool-Using Language Model Agents: Runtime Enforcement and Recovery", "authors": "Gaurav Chaulagain 等", "url": "https://doi.org/10.54536/ajdsai.v2i2.8776", "category": "American Journal of Data Science and Artificial Intelligence（2026-10-23）", "cats": [], "oneliner": "用户中途收紧权限后，tool-using agent 是否还会继续执行已被撤回的操作？本文把\"权限撤回\"定义为轨迹级授权问题，对比 prompt-only、规则门、模型门三种执行方式，并给出一个可复现的评测框架。", "insight": "这是方向 2\"执行时授权绑定\"目前最直接的实证支撑，可作 related work 的核心对照。它的\"轨迹级授权\"与我们的 RU/AU 解耦在检索层的工作互补：我们在查询时逐 AU 求值、未知 AU 默认拒绝，他们在行动执行时逐项过门、权限撤回即时生效——两者合起来正是\"检索—行动\"全链路绑定叙事的另一半。它的评测框架设计值得直接借鉴：我们的三语义评测目前也偏重最终结果，引入\"提议/门决策/派发/状态转移\"五阶段拆分后，才能区分\"被门拦住\"与\"因资源不存在而未遂\"这类关键差异，否则我们的安全数字同样可能虚高。它的数字也给出一个诚实的基线参照：规则门零漏放但僵化、模型门灵活但 3 次误放 + 3 次误拒——说明纯模型门不可单独托底，这正是我们主张\"确定性语义 + 默认拒绝\"而非\"模型自律\"的论据。注意边界：期刊影响力有限、样本为确定性模拟环境而非真实生产工具，引用时标注为\"受控环境实证\"而非生产验证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "现有 agent benchmark 多看任务完成度或最终状态，但这些指标看不出\"未授权操作是被提议、被批准、被派发，还是仅因下游错误而未遂\"。本文在确定性工具环境中测试两个行动模型：72 回合诊断（两个已暴露的写工作流）中，prompt-only agent 在 2 回合里执行了被禁的同值写操作，两个运行时门都拦住了禁令执行，但模型门误拒了 3 次合法调用；随后 384 回合扩展（8 个新任务 × 4 种授权机制）中，346 回合安全完成、383 回合保住了受保护状态，无一例禁令请求成功执行，但模型门批准了 3 个未授权请求——仅因引用资源不存在才未遂。作者的结论是：正确的最终状态和零禁令执行仍可能掩盖授权推理的失败，因此贡献了一个把提议、门决策、派发、状态转移、有用完成五阶段拆开的可复现评测框架。", "supplement": false}, {"title": "Democratizing reliable knowledge-seeking with MyGPT: a privacy-first, open-source retrieval-augmented generation platform", "authors": "Jaimin N Patel 等", "url": "https://doi.org/10.1038/s41467-026-78509-6", "category": "Nature Communications（2026-10-24）", "cats": [], "oneliner": "一个完全开源、可本地或机构内网部署的隐私优先 RAG 平台：敏感数据不出安全环境，配 relevance score 与 hallucination index 两种置信度指标和显式来源引用。", "insight": "关联较弱，但有一处可引用、两处需警惕。可引用的是\"系统存在性\"论据：隐私优先 RAG 不是纸面需求，已有 Nature Communications 级别的平台把\"数据不出域\"做成产品形态，这支撑我们论文的动机段（敏感域 RAG 需要访问控制，而非仅靠事后过滤）。需警惕的是：它的隐私保障来自\"部署边界\"（本地/内网），而非 AU 粒度的授权语义——数据一旦进入库内，库内不同密级文档之间并无细粒度隔离，这正是我们 RU/AU 解耦要补的缺口，引用时应明确区分\"环境隔离\"与\"授权语义\"两个层次，不要把它写成已解决细粒度访问控制的方案。它的 hallucination index 与 relevance score 是\"答案可信度\"指标，与我们的\"授权正确性\"指标正交，不宜混作安全评测。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（文中称全开源平台，抓取未返回独立仓库链接）", "zh_abs": "本文针对敏感域（生物医学文献、机密临床文档、多语种全球卫生政策）查询时的数据泄露与幻觉问题，提出 MyGPT 平台：用开源 LLM、在本地或机构安全环境内运行，用户自建文献库，敏感数据不离开安全环境；引入\"相关性分数\"与\"幻觉指数\"评估上下文支撑度，并在同一界面给出显式来源引用；作者强调其成本效益与模块化，可在无互联网的偏远设施使用，是商业服务的开源替代。", "supplement": false}, {"title": "The Half Circle — a note on a gate that cannot be talked past", "authors": "Chris Owadally", "url": "https://doi.org/10.5281/zenodo.23591575", "category": "Zenodo 实践笔记（2026-10-23，未经同行评审）", "cats": [], "oneliner": "一篇来自真实派单平台的实践笔记：主张 agent 授权的栅栏必须设在 agent 内部、\"主张变成事实\"的那一点上——核心事实若只有\"客户陈述\"而无\"客户确认\"，确认函数要在内核里拒绝（所谓\"半圆\"）。", "insight": "观点上有启发，证据上只能作\"实践印证\"引用，不可作实证引用。它的\"主张变事实的关口设门\"与我们\"执行时授权绑定\"是同一直觉在不同层的表达：我们是在查询/执行时对 AU 求值，他们是在确认动作时对 provenance 求值；它的\"拒绝返回收据与下一步\"也与我们 retrieve-then-project 的\"裁剪 + 可解释\"思路相通，可在讨论段作为\"工业界独立出现同类直觉\"的旁证。但必须诚实标注三处限定：① 未经同行评审，单平台经验，无对照实验；② \"多模型表现\"只有转录摘录，无可复现的量化结果；③ 场景是派单确认，泛化到 RAG 授权需论证，不宜直接类比。建议仅在动机/讨论段用一句话提及，不进核心证据链。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "笔记记录了一个派单平台的真实做法：预订上的每个事实都带 provenance——\"客户陈述\"或\"客户确认\"；只要核心事实仍只是陈述状态，确认函数就在内核拒绝，拒绝时返回收据与下一步真实动作，客户早期的肯定被\"存入\"而非\"花掉\"。作者记录了该门在语音与文本多模型 agent 下的表现（含系统转录原文），并给出让这道门可见的可观测性图例；核心论点是：agent 授权除了凭证、范围、隔离三道外 fence，还需要在 agent 内部、主张变事实的关口再设一道 fence。", "supplement": false}]}, {"date": "2026-10-25", "summary": "", "papers": [{"title": "Enhancing Large Language Models with External Knowledge Using Retrieval-Augmented Generation: A Critical Review of Retrieval Design, Context Compression, Safety and Evaluation, with a Conceptual Governance-Aware Architecture", "authors": "Auti Pallavi S. 等", "url": "https://doi.org/10.5281/zenodo.23593530", "category": "Zenodo 预印本综述（2026-10-23）", "cats": [], "oneliner": "一篇 RAG 批判性综述：系统梳理检索设计、上下文压缩、安全与评测的相互作用，并提出一个八层\"治理感知\"概念架构，把 IAM 权限过滤、时效性与安全性放进 RAG 设计的一等位置。", "insight": "这是治理视角对我们 RU/AU 解耦的一个外部印证，可作背景/动机引用（而非证据引用）。它的 IAM-based permission filtering 与我们的\"查询时逐 AU 求值\"同属\"检索前/检索时过滤\"一派，但它停留在概念层、没有给出 AU 粒度的形式化语义——正好反衬我们的贡献位置：**把\"过滤\"从工程惯例变成可论证的语义**。它那句\"只在显式信任假设下成立\"是我们论文可以直接呼应的表述：我们的\"未知 AU 默认拒绝\"本质上就是把信任假设显式化、形式化，引用时可把这句话作为动机支撑。另外，它的批评（小样本、单次运行、指标不一致）同样适用于我们自己的评估设计，其\"最小评测协议\"思路值得借鉴为三语义评测的报告规范。注意边界：综述无新实验，八层架构未经验证，不要把它写成已验证的基线。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "本文用聚焦叙事综述法梳理 RAG 文献：没有单一配置最优，最优选择取决于任务与指标；检索质量与答案质量在抽取式任务上强相关、在综合式任务上弱相关；自适应检索与压缩能省 token 但会增加延迟。关键判断是：访问控制、时效性与安全性可以放在 LLM 之外强制执行，但**只在显式信任假设下成立**；而现有研究大多基于维基百科问答、小样本、单次运行且指标不一致，作者还记录了若干研究内部的不一致。综述的产出包括 survey 矩阵、区分实验设定的比较分析、八层概念架构、公平比较的最小评测协议和基于证据的研究空白议程。", "supplement": false}, {"title": "De-identified data and analysis code for \"Evidence-Constrained Action Authorization for Agricultural Large Language Model Agents in Rice-Crayfish Aquaculture\"", "authors": "Haiqing Xu 等（安徽新华学院、中国科学技术大学、安徽农业大学）", "url": "https://doi.org/10.5281/zenodo.23544165", "category": "Zenodo 数据与代码包，随论文手稿材料发布（2026-10-22）", "cats": [], "oneliner": "注意：本条不是论文正文，而是\"证据约束行动授权\"研究的去标识化数据与分析代码包——稻虾养殖场景下 LLM agent 的行动须有证据支撑才放行，附 1296 个真实任务与 144,000 条合成机制评测输出。", "insight": "这是**运行时授权绑定**（我们 2026-10-11 定下的方向 2）在行动层的一个真实实例，可作 related work 的平行参照：它的\"无证据不放行\"与我们\"未知 AU 默认拒绝\"是同一哲学在不同层的实例化（他们在 agent 行动层、我们在检索授权层），两者结合起来正好构成\"检索—行动\"全链路授权绑定的叙事。规模数字（1296 真实任务、144,000 合成输出）可作我们 benchmark 规模设计的参照。但引用时必须标注三处限定：参考模式来自生产规则而非独立金标准、原始 prompt 未公开、独立安全验证尚未开展——在这些限定解除前，它的授权有效性结论只能作\"机制可行性\"引用，不能作\"安全性已验证\"引用。建议跟踪该研究原文正式发表后再评估是否收入论文库（standards-agent 组候选）。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "本数据包内含分析代码与验证脚本（Zenodo，1.1 MB），无独立 GitHub 仓库", "zh_abs": "该数据包收录了\"证据约束行动授权\"研究的去标识化任务级数据、保存的模型路由输出、汇总结果与分析代码，支持对已保存输出的再分析与报告点估计的复现：包括来自 6 个匿名池塘集群的 1296 个真实输入任务、冻结 prompt 条件下的输出、合成机制评测的 144,000 条保存输出、汇总表与验证脚本。作者同时坦承限定：真实输入的参考模式来自注册版生产规则、不是独立的农艺金标准；包内不含原始 prompt、源记录键、确切日期与田间图像；不含生产/产量结果；且后续的独立安全验证尚未开展。", "supplement": false}]}], "total": 26, "n_days": 7, "all_total": 148, "all_days": 32};

ss, he is fighting tirelessly to Keep our Border SECURE, Support our Incredible Military/Veterans, Unleash American Energy DOMINANCE, Grow the Economy, Cut Taxes and Regulations, Promote MADE IN THE U.S.A., Defend our always under siege Second Amendment, and Ensure PEACE THROUGH STRENGTH. Jeff's opponent, Dwayne Romero, is a Radical Left Democrat who is opposed to NO TAX ON TIPS, NO TAX ON OVERTIME, and NO TAX ON SOCIAL SECURITY and, if he and the Dumocrats ever got in, all of these things will be terminated. He wants massive Tax Increases, Open Borders, Men playing in Women's Sports, and Transgender Mutilization of your Children. Dwayne Romero is Reckless, Radical, and Dangerous! Jeff Hurd has my Complete and Total Endorsement for Re-Election. GET OUT AND VOTE FOR JEFF — HE WILL NEVER LET YOU DOWN!（中文背景：中期选举冲刺期为科罗拉多州第3选区众议员 Jeff Hurd 背书连任；本条 url 为 Trump’s Truth 存档页链接，因存档页未披露原 Truth Social 状态 ID，未编造原帖 ID）", "created_at": "10-31 05:13", "likes": 0, "reposts": 0, "replies": 0, "url": "https://www.trumpstruth.org/statuses/42897", "author": "realDonaldTrump"}]}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2116253388883345623", "text": "There are many futures. Which do you want to build?", "created_at": "10-31 03:38", "likes": 4450, "reposts": 291, "replies": 447, "views": 428746, "url": "https://x.com/OpenAI/status/2116253388883345623", "author": "OpenAI"}, {"id": "2116186509384815084", "text": "Privacy should advance as fast as intelligence. OpenAI Private Intelligence gives businesses stronger controls over their data while using our most capable models.\n\nWe’re building these protections in close collaboration with some of our largest customers to help businesses apply frontier AI to their most sensitive work.\nhttps://openai.com/business/private-intelligence/", "created_at": "10-30 23:12", "likes": 2219, "reposts": 155, "replies": 403, "views": 255506, "url": "https://x.com/OpenAI/status/2116186509384815084", "author": "OpenAI"}, {"id": "2115896329645723836", "text": "Today, we’re sharing a look at our expanded system for monitoring frontier models at OpenAI, which in September helped us catch a model’s attempt to access the live internet during training.\n\nSince the Hugging Face incident—when models broke out of an internal cybersecurity investigation where we weren’t running our misalignment monitors—we’ve substantially expanded our monitoring of frontier agents. We now monitor all frontier reinforcement learning runs and evaluations, as well as all internal Codex use. When our system finds evidence of a problem that might require intervention, it rapidly alerts human responders who can investigate and take action.\n\nTo detect when a model’s behavior departs from what we intended, we use several layers of monitoring. Activation probes look for patterns in a model’s internal activity. Reviewer models examine its reasoning and tool use, and investigative agents can read back through the model’s entire transcript to understand how a sequence of actions fits together and whether it warrants human review.\n\nTo test whether our current system would have detected the Hugging Face incident, we replayed the recorded activity with our new monitors in place. In the replay, our monitors alerted our security team about 30 minutes after the agents escaped their sandbox. That was more than 30 hours before the point at which the agents breached Hugging Face’s systems in the original incident.\n\nIn September, a model exploited a DNS misconfiguration to reach the live internet. Our monitors flagged the breach within 15 minutes, and a responder began reviewing the alert three minutes later. The alert enabled responders to investigate while the run was still underway.\n\nAs we give models more autonomy, we need to know when they cross a boundary we expected to hold. We believe that monitoring is essential to catching those failures in time for people to intervene. \nhttps://openai.com/index/how-we-detect-frontier-model-misalignment/", "created_at": "10-30 03:59", "likes": 4171, "reposts": 321, "replies": 658, "views": 791078, "url": "https://x.com/OpenAI/status/2115896329645723836", "author": "OpenAI"}, {"id": "2115852555762929732", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://openai.com/index/updated-model-spec", "created_at": "10-30 01:05", "likes": 791, "reposts": 97, "replies": 84, "views": 186065, "url": "https://x.com/w01fe/status/2115852555762929732", "author": "w01fe"}, {"id": "2115850175868727621", "text": "Day 25/\n\nWe are doubling all usage limits for all Pro 100/200/500 tiers and Business Premium, effective today.\n\nWe heard your kind feedback and won’t be reducing usage limits for Pro 200, so your Work and Codex usage will stay the same. We’re also going to continue offering extended limits for dots for now, and usage of your dot will still continue to be separate from your default usage.\n\nAnd we'll of course also keep shipping better models and other efficiency improvements that increase your effective usage over time.", "created_at": "10-30 00:56", "likes": 37823, "reposts": 2623, "replies": 7162, "views": 5707796, "url": "https://x.com/thsottiaux/status/2115850175868727621", "author": "thsottiaux"}, {"id": "2115496387613786374", "text": "By popular request, you can now text your dot.\n\nGive it a task to take off your plate or something to keep an eye on, using text, photos, or even voice notes. It will text you proactively with relevant updates.\n\nSafe, secure texting via iMessage or RCS. You’re the only one who can text your dot, and your dot can only text you. Rolling out now as a preview for Pro users in the US.", "created_at": "10-29 01:30", "likes": 8027, "reposts": 425, "replies": 652, "views": 2963896, "url": "https://x.com/ChatGPT/status/2115496387613786374", "author": "ChatGPT"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2114780711664398349", "text": "GPT-6.1 Terra: delivering fast and capable computer use at a lower price. GPT-6.1 Terra understands what’s on screen, takes action across apps, writes naturally, and is a more capable model for your whole workday with the efficiency to take on more of it.", "created_at": "10-27 06:47", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2114780711664398349", "author": "OpenAI"}, {"id": "2114818620782248024", "text": "6.1 Terra is here! It is good at a lot of things, but we are especially excited for this new era of computer use.", "created_at": "10-27 06:47", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2114818620782248024", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2115890336107233347", "text": "Send your kind feedback to this person", "created_at": "10-30 03:35", "likes": 4365, "reposts": 79, "replies": 1129, "views": 932083, "url": "https://x.com/thsottiaux/status/2115890336107233347", "author": "thsottiaux"}, {"id": "2115851621137784832", "text": "Graduating from The Reset Company to The Token Company.", "created_at": "10-30 01:01", "likes": 8484, "reposts": 163, "replies": 773, "views": 1496618, "url": "https://x.com/thsottiaux/status/2115851621137784832", "author": "thsottiaux"}, {"id": "2115850175868727621", "text": "Day 25/\n\nWe are doubling all usage limits for all Pro 100/200/500 tiers and Business Premium, effective today.\n\nWe heard your kind feedback and won’t be reducing usage limits for Pro 200, so your Work and Codex usage will stay the same. We’re also going to continue offering extended limits for dots for now, and usage of your dot will still continue to be separate from your default usage.\n\nAnd we'll of course also keep shipping better models and other efficiency improvements that increase your effective usage over time.", "created_at": "10-30 00:56", "likes": 37825, "reposts": 2623, "replies": 7162, "views": 5707662, "url": "https://x.com/thsottiaux/status/2115850175868727621", "author": "thsottiaux"}, {"id": "2115622002581188681", "text": "Day 24/ Text your dot just like anyone else. Makes it super easy to share/forward things, leave it voice notes or you can even go creative with \"Hey Siri, text Iggy to <INSERT WILD REQUEST>\" and sit back and relax.", "created_at": "10-29 09:49", "likes": 3905, "reposts": 139, "replies": 2247, "views": 1415344, "url": "https://x.com/thsottiaux/status/2115622002581188681", "author": "thsottiaux"}, {"id": "2115588390414581916", "text": "Team is working on this but it's not rolling out just yet, sorry for any confusion. Plan is to bring together best of both Chat / Work capabilities together at some point this year, but we're going to proceed carefully here and take our time.\n\nWe'll have more to share soon.", "created_at": "10-29 07:35", "likes": 5948, "reposts": 333, "replies": 1697, "views": 1629389, "url": "https://x.com/thsottiaux/status/2115588390414581916", "author": "thsottiaux"}, {"id": "2115473170279080149", "text": "Pretty wild that this site got 3M views.", "created_at": "10-28 23:58", "likes": 5519, "reposts": 71, "replies": 645, "views": 1104759, "url": "https://x.com/thsottiaux/status/2115473170279080149", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2115993543781269861", "text": "The future of super fast iterations is here!", "created_at": "10-30 10:25", "likes": 99, "reposts": 3, "replies": 1, "views": 14387, "url": "https://x.com/natalieyeo/status/2115993543781269861", "author": "natalieyeo"}, {"id": "2115855240444670267", "text": "Fatimah Hussain (@fatimahs_tech) and Chloe Hughes built Finnie with Codex. It pulls details from a student’s PDF to find scholarships that fit.", "created_at": "10-30 01:16", "likes": 14, "reposts": 2, "replies": 1, "views": 10571, "url": "https://x.com/OpenAIDevs/status/2115855240444670267", "author": "OpenAIDevs"}, {"id": "2115855186296226220", "text": "At @Shopify, @MParakhin asks people to bring a working prototype to the meeting. His team uses Codex to try out different ways to design a system.", "created_at": "10-30 01:16", "likes": 15, "reposts": 2, "replies": 3, "views": 11157, "url": "https://x.com/OpenAIDevs/status/2115855186296226220", "author": "OpenAIDevs"}, {"id": "2115854891650523391", "text": "How might a single cell respond to a drug?\n\nImmunologist @DeryaTR_ uses Codex to simulate that experiment.\n\n🧵 He’s one of nine builders in our community sharing what they’re working on with Codex\n\nhttps://openai.com/codex-originals/", "created_at": "10-30 01:14", "likes": 821, "reposts": 78, "replies": 100, "views": 97270, "url": "https://x.com/OpenAIDevs/status/2115854891650523391", "author": "OpenAIDevs"}, {"id": "2115593097044426997", "text": "Today, we're shipping real-time graphics.\n\nUsing Sol 6.1 Ultrafast we can generate custom overlays, diagrams, and even interactive 3D scenes right on a user's screen, no chat.\n\nIt's a new visual interface for AI.\n\nHere's me learning about LLMs + hardware.\n\nDemo:", "created_at": "10-29 07:54", "likes": 10277, "reposts": 668, "replies": 634, "views": 956124, "url": "https://x.com/FarzaTV/status/2115593097044426997", "author": "FarzaTV"}, {"id": "2115583721994944972", "text": "Credit amounts depend on the plan.\n\nPro plans get $100, $200 or $500 per month by tier.\n\nBusiness plans get $20 per paid Standard seat or $100 per paid Premium seat, pooled up to $500 per workspace.\n\nhttps://help.openai.com/articles/20001626", "created_at": "10-29 07:17", "likes": 507, "reposts": 27, "replies": 43, "views": 232132, "url": "https://x.com/OpenAIDevs/status/2115583721994944972", "author": "OpenAIDevs"}, {"id": "2115583710288613476", "text": "Start building:\n\n1. Claim your API credits in ChatGPT billing: https://chatgpt.com/settings/billing\n\n2. Use the OpenAI Developers plugin in ChatGPT or Codex to create an API key and start your next project:\nhttps://chatgpt.com/plugins/openai-developers?open_in_app", "created_at": "10-29 07:17", "likes": 961, "reposts": 76, "replies": 84, "views": 290570, "url": "https://x.com/OpenAIDevs/status/2115583710288613476", "author": "OpenAIDevs"}, {"id": "2115583698074755078", "text": "Starting today, eligible ChatGPT Pro and Business subscribers can claim up to $500 per month in API credits to build apps and agents.", "created_at": "10-29 07:17", "likes": 9156, "reposts": 795, "replies": 623, "views": 2004507, "url": "https://x.com/OpenAIDevs/status/2115583698074755078", "author": "OpenAIDevs"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2115871889549865429", "text": "We’ve trained Claude to flag potential misuse in conversations, a technique we call self-assessment. Right after it responds, Claude gives a preliminary safety assessment of the conversation. \n\nSince we began using self-assessment in June, it has surfaced misuse that our other safeguards weren’t designed to catch. \n\nBecause Claude has already read the conversation, self-assessment is very efficient. And unlike classifiers, which target a discrete set of harms, it draws on Claude’s own judgment, so it gets more accurate as our models improve.\n\nRead more on our new Safeguards blog:\nhttps://safeguards.anthropic.com/2026/self-assessment/", "created_at": "10-30 02:22", "likes": 4118, "reposts": 351, "replies": 1218, "views": 1431194, "url": "https://x.com/AnthropicAI/status/2115871889549865429", "author": "AnthropicAI"}, {"id": "2115825653539025142", "text": "We’ve expanded our AI for Science program beyond individual teams to support some of the world’s leading scientific foundations, institutions, and research groups. https://www.anthropic.com/news/ai-for-science-expands-foundations-research-institutions", "created_at": "10-29 23:18", "likes": 3190, "reposts": 259, "replies": 369, "views": 296861, "url": "https://x.com/AnthropicAI/status/2115825653539025142", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2115489356437651654", "text": "Gemini 4 Carbon is our next frontier model.\n\nIt’s state-of-the-art across cybersecurity and long-horizon capabilities.", "created_at": "10-29 01:02", "likes": 14407, "reposts": 1368, "replies": 711, "views": 1583951, "url": "https://x.com/GoogleDeepMind/status/2115489356437651654", "author": "GoogleDeepMind"}, {"id": "2115489359415890211", "text": "Carbon can work through complex tasks for days without getting stuck or taking shortcuts – delivering high-quality, reliable code.\n\nFeedback from an initial group of cyber defenders will help us iterate on guardrails before we expand access soon.\n\nFind out more ↓ https://goo.gle/4BCFvj8", "created_at": "10-29 01:02", "likes": 576, "reposts": 24, "replies": 48, "views": 76267, "url": "https://x.com/GoogleDeepMind/status/2115489359415890211", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2116233367020859888", "text": "こんにちは、日本！Hello Japan!", "created_at": "10-31 02:18", "likes": 3406, "reposts": 233, "replies": 90, "views": 143802, "url": "https://x.com/sundarpichai/status/2116233367020859888", "author": "sundarpichai"}, {"id": "2116214866444943853", "text": "A ‘hello world’ milestone for Project Suncatcher 🚀\n\nAfter launching our prototype satellite a few weeks ago, we’ve now successfully sent a command up to orbit, booted up the TPU, ran the prompt, and received our first complete response back on earth - a haiku!", "created_at": "10-31 01:05", "likes": 15875, "reposts": 1523, "replies": 873, "views": 1424185, "url": "https://x.com/sundarpichai/status/2116214866444943853", "author": "sundarpichai"}, {"id": "2115557846066819074", "text": "Read my full remarks here: https://blog.google/company-news/inside-google/message-ceo/alphabet-earnings-q3-2026/", "created_at": "10-29 05:34", "likes": 236, "reposts": 22, "replies": 45, "views": 67638, "url": "https://x.com/sundarpichai/status/2115557846066819074", "author": "sundarpichai"}, {"id": "2115535455156642066", "text": "Q3 is in the books! We’re now on a half-trillion annual revenue run rate, with Alphabet revenues growing at 25%.\n\n- Our AI investments are driving overall Search query growth, including commercial queries - our YoY query growth rate is the highest it’s been in the last five years.\n- Google Cloud revenue grew 103%, powered by extraordinary demand for our AI infrastructure and AI solutions. Our 1P model APIs now process nearly 32B tokens/min (up 40% QoQ).\n- Strong momentum in model progress with Argon and Carbon leading the frontier, and Genie 4 our most advanced new world model yet.\n\nThanks to our partners and employees around the world. More to share on the call soon!", "created_at": "10-29 04:05", "likes": 11810, "reposts": 771, "replies": 725, "views": 988827, "url": "https://x.com/sundarpichai/status/2115535455156642066", "author": "sundarpichai"}, {"id": "2115489222442594718", "text": "Read more about Gemini 4 Carbon below https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/", "created_at": "10-29 01:01", "likes": 1625, "reposts": 99, "replies": 54, "views": 348452, "url": "https://x.com/sundarpichai/status/2115489222442594718", "author": "sundarpichai"}, {"id": "2115489219804352921", "text": "I did say we'd be releasing our models periodically...introducing Gemini 4 Carbon, our next frontier model.\n\nFollowing Argon's release just two weeks ago, Carbon shows the pace at which we’re pushing the frontier, it ranks #1 on the recently updated v5.0 of @ArtificialAnlys Intelligence Index at 59. It also leads across key cybersecurity evaluations scoring 88.2% on SEC-bench Pro for finding vulnerabilities, 54.8% on ExploitGym for exploitation, and 71.0% on CWE-bench for patching.\n\nWe’re seeing significant improvements in long-horizon tasks even compared to Argon, and we’ve strengthened frontier safeguards.\n\nAs we did with Argon, we’re going to roll it out gradually + responsibly. Some trusted cyber defenders will get access starting this week. We'll be expanding it to more partners through our Fairwind Program, ahead of wider availability soon, so hang tight!", "created_at": "10-29 01:01", "likes": 34004, "reposts": 2746, "replies": 2073, "views": 6777551, "url": "https://x.com/sundarpichai/status/2115489219804352921", "author": "sundarpichai"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2115851165904814283", "text": "Technical report of Hy-Nomas released last Friday: https://arxiv.org/abs/2610.36729\n\nHy-Nomas-Bench is also open sourced for reproducible research: https://huggingface.co/datasets/tencent/Hy-Nomas-Bench\n\nWe also re-create Genie 4 examples with Hy-Nomas. See the full comparison video: Hy-Nomas vs Genie 4 👇\n\nTry our demo right now! No waitl luding without limitation the rights to (a) use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Model; (b) run, deploy, further train or otherwise modify the Model and create derivative works from it; and (c) permit persons to whom the Model is furnished to do so, subject to the following conditions:`；**条件二逐字**：`If the Licensee or any of its affiliates operates a Model as a Service business, the Licensee must enter into a separate commercial license with Mistral before using the Model or its derivative works for any commercial purpose.`；**官方对「`Model as a Service`」的定义逐字**：`\"Model as a Service\" means giving a third party access to the Model or its derivative works for inference or post-training by any means (for instance via API or hosted endpoints), in a manner that allows such third party to exercise meaningful control over the inputs, parameters, or training data.` ⚠️ **这条定义的边界很关键 —— 官方逐字排除了两种情形**：`This does not include (a) end-user products with model capabilities solely embedded within specific features or harnesses, or (b) mere relaying of requests to models hosted by others.` **即「把模型嵌进自己的产品里卖」不算 MaaS，「转手转发请求」也不算 —— 都要另签的只有「让第三方能控制输入/参数/训练数据」的那种形态**。**本报告写这份原文是因为「开放权重」与「可商用」在本例中不是同一件事**（避坑 154：**只写官方写了什么**）。\n- **本期头条之三（一条国家级算力平台的夜间限时免费 —— 截止日正好是本期基准日当天）**：`国家超算互联网` 价格调整 —— **一手未核到（媒体转述）**：`leiphone.com/category/industrynews/tZQilZ5sagKCk1Sm.html`（`200` / `47,685` 字节，官方逐字转述「国家超算互联网宣布最新价格调整」）。**逐字（媒体转述官方公告）**：`新用户可享DeepSeek-V4.1-Flash-1017、GLM-5.3-Flash两款前沿模型0.1元5000万tokens限时秒杀特惠`；`订阅TokenPlan用户还可享限时夜间免费模型权益：10月21日至30日，每晚21:00至次日09:00，Auto模型可免费调用`；`平台已上线卫星遥感成像、科学计算、数据安全、OCR文字识别等限时折扣、免费AI应用商品`。⚠️ **本期实访 `www.scnet.cn` 与 `scnet.cn` 均 `200` / `132,762` 字节，但「`TokenPlan`」「夜间」「`21:00`」「`0.1元`」「免费」六个词在该页各命中 `0` 次** —— **官方页未核到，本报告因此写「媒体转述」而不写「官方确认」**。⚠️ **截止日 `10/30` ＝ 本期基准日当天** —— 这是避坑 223 的第三个状态（「截止日当天」既不是「已过期」也不是「未开始」），**本报告不写「已结束」**。\n- **本期头条之四（`OpenAI` 把付费档的用量上限翻倍了 —— 但免费档那一档没动）**：**媒体转述官方公告**：`the-decoder.com/openai-doubles-usag
