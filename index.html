ful prior to registration or qualification under the securities laws of any such state or jurisdiction.", "created_at": "11-10 19:33", "likes": 4932, "reposts": 507, "replies": 595, "views": 1317099, "url": "https://x.com/AnthropicAI/status/2120117722230968385", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2120940342505566438", "text": "Now rolling out for:\nDevelopers: Build with the Gemini API in @GoogleAIStudio and Android Studio, and in Google @Antigravity for paid Google AI Pro and Ultra subscribers.\nEnterprises: Deploy via Gemini for business and Google @Antigravity\nEveryone: Access it in Google Search and the @Geminiapp model dropdown.\n\nSee the details → https://goo.gle/4zDCs8N", "created_at": "11-13 02:02", "likes": 243, "reposts": 13, "replies": 12, "views": 30991, "url": "https://x.com/GoogleDeepMind/status/2120940342505566438", "author": "GoogleDeepMind"}, {"id": "2120940338869055788", "text": "Meet Gemini 4 Hydrogen: built for rapid coding, multimodal synthesis, and everyday workflows.\n\nIt finishes tasks 2.5x faster than 3.8 Flash and surpasses Argon on the @ArtificialAnlys Intelligence Index.", "created_at": "11-13 02:02", "likes": 5165, "reposts": 437, "replies": 252, "views": 622629, "url": "https://x.com/GoogleDeepMind/status/2120940338869055788", "author": "GoogleDeepMind"}, {"id": "2120841927834968215", "text": "Watch → https://goo.gle/3Vgj7LX\nSpotify → https://goo.gle/4zRA8Lt\nApple Podcasts → https://goo.gle/4BZEaTx\n\nOr listen wherever you get your podcasts! 🎧", "created_at": "11-12 19:31", "likes": 31, "reposts": 1, "replies": 7, "views": 29164, "url": "https://x.com/GoogleDeepMind/status/2120841927834968215", "author": "GoogleDeepMind"}, {"id": "2120841923237683462", "text": "Finding the exact genetic cause of a rare disease is like looking for a needle in a haystack. 🪡\n\nOn our podcast, @fryrsquared explores with @Avsecz and  @adamgayoso how AlphaGenome 2 helps scientists test millions of DNA changes to find vital clues for human health.\n\nTimecodes:\n00:00 Introduction to AlphaGenome\n04:01 Genotype, Phenotype & DNA\n08:30 Transformers to AlphaGenome\n12:11 Mapping the Genome\n17:45 Rare disease cases\n21:10 AlphaGenome 2\n30:06 Future vision\n38:45 Hannah's thoughts", "created_at": "11-12 19:31", "likes": 564, "reposts": 65, "replies": 114, "views": 93886, "url": "https://x.com/GoogleDeepMind/status/2120841923237683462", "author": "GoogleDeepMind"}, {"id": "2120814064863461440", "text": "Our Gemini team @GoogleDeepMind is making tremendous progress.\n\nGemini 4 Carbon’s coding and scientific reasoning capabilities are a step change and have accelerated our own science workflows. \n\nCarbon has already helped our team:\n- Debug complex experimental flows. In one complex case, it traced anomalous assay results back to a faulty liquid handler and reagent carryover between high-throughput experimental runs.\n- Develop strategies to mine massive datasets, making models like AlphaFold 3 even more effective.\n- Compress computational workflows like cheminformatics tasks from weeks down to hours.\n\nI am happy to share that Gemini 4 Carbon is now generally available. Together with our updated Antigravity Science plugin, Carbon can greatly assist the work of scientists.\n\nI am really looking forward to seeing  scientists across the world use it for their work.", "created_at": "11-12 17:40", "likes": 1269, "reposts": 73, "replies": 67, "views": 69682, "url": "https://x.com/pushmeet/status/2120814064863461440", "author": "pushmeet"}, {"id": "2120532832145576242", "text": "By predicting how the same DNA is read differently from cell to cell, AlphaGenome 2 opens up entirely new possibilities for understanding human genetics.\n\nIt’s available now for non-commercial research via our API and interactive Colab tutorials. Find out more → https://goo.gle/4zikg3w", "created_at": "11-11 23:03", "likes": 215, "reposts": 14, "replies": 13, "views": 23438, "url": "https://x.com/GoogleDeepMind/status/2120532832145576242", "author": "GoogleDeepMind"}, {"id": "2120532829805096970", "text": "The model also adapts to lab experiments on the fly with no retraining needed.\n\nResearchers can plug in data from just a few dozen cells to see how DNA changes behave in specific moments, like:\n🔘 Immune cells responding to a vaccine\n🔘 Specific cells in the gut driving inflammatory disease\n🔘 Stem cells maturing into blood cells", "created_at": "11-11 23:03", "likes": 205, "reposts": 9, "replies": 8, "views": 27042, "url": "https://x.com/GoogleDeepMind/status/2120532829805096970", "author": "GoogleDeepMind"}, {"id": "2120532824465805749", "text": "Your heart, brain, and immune system share the same DNA sequence. So how can a single-letter change affect disease in some cells, while sparing the rest?\n\nAlphaGenome 2 is our new AI model that zooms in on specific cells to help scientists understand what drives disease. 🧵", "created_at": "11-11 23:03", "likes": 2934, "reposts": 455, "replies": 261, "views": 462897, "url": "https://x.com/GoogleDeepMind/status/2120532824465805749", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2121044919250997338", "text": "real-time speech translation on these is 🤯", "created_at": "11-13 08:58", "likes": 644, "reposts": 48, "replies": 79, "views": 61718, "url": "https://x.com/sundarpichai/status/2121044919250997338", "author": "sundarpichai"}, {"id": "2120947988143198302", "text": "Ok this is a big deal. We’ve been testing Gemini 4 Hydrogen in early access with the Box AI Complex Work Eval, and it’s a serious jump for fast models. \n\nHydrogen is 5 percentage points better in accuracy than Gemini 3.8 Flash. That alone would be a great boost in capability, but possibly more importantly it did the tasks in less than half the time with about 12% fewer tokens on a typical task.\n\nFor this eval, we give the Box Agent Hydrogen as a model for a series of complex tasks that represent real world work with enterprise documents across finance, consulting, life sciences, and other industries. Hydrogen will be a great model for a lot of efficient but complex tasks across these fields.\n\nGemini team is definitely cooking. Hydrogen will be rolling out in the Box AI Studio shortly so any customer can build a custom agent with it.", "created_at": "11-13 02:33", "likes": 583, "reposts": 39, "replies": 77, "views": 70701, "url": "https://x.com/levie/status/2120947988143198302", "author": "levie"}, {"id": "2120942632679674209", "text": "Today, Search is getting a massive upgrade with Gemini 4 Hydrogen!  It’s the biggest model improvement to Search yet.  And it’s available now for all users, globally.\n\nWhy it’s awesome:\n- Crazy fast\n- Cutting-edge intelligence, with advanced reasoning, more precise instruction following, and better tool calling\n- More visual responses, including images and custom tables, charts, and simulations\n- More scannable response layout\n- Better understanding of intent (including for long multi-part queries with ambiguous typos)\n- Broader range of links to the web (improved reasoning -> more query fan-outs)\n\nTL;DR: powerful and fast.  Take Hydrogen for a spin in Search and let me know what you think!", "created_at": "11-13 02:11", "likes": 2611, "reposts": 164, "replies": 83, "views": 154920, "url": "https://x.com/thefox/status/2120942632679674209", "author": "thefox"}, {"id": "2120940238378082764", "text": "more here: https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen", "created_at": "11-13 02:02", "likes": 307, "reposts": 20, "replies": 17, "views": 46045, "url": "https://x.com/sundarpichai/status/2120940238378082764", "author": "sundarpichai"}, {"id": "2120940236805169182", "text": "Following Carbon + Argon, Gemini 4 Hydrogen brings cutting-edge intelligence to everyone. Built for speed and efficiency for everyday tasks, coding and agentic workflows.\n\nCompared to 3.8 Flash, it finishes tasks 2.5x faster. Also has 4 thinking levels, so you only wait and pay for the reasoning depth a task requires.\n\nRolling out today to all tiers of @GoogleAIStudio, the Gemini API, @GeminiApp, Search and paid Google AI Pro and Ultra subscribers in Google @Antigravity.", "created_at": "11-13 02:02", "likes": 7448, "reposts": 437, "replies": 495, "views": 475597, "url": "https://x.com/sundarpichai/status/2120940236805169182", "author": "sundarpichai"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2120478188648472754", "text": "Hy4 on OpenRouter", "created_at": "11-11 19:26", "likes": 84, "reposts": 6, "replies": 6, "views": 6261, "url": "https://x.com/TencentHunyuan/status/2120478188648472754", "author": "TencentHunyuan"}, {"id": "2120447531113144571", "text": "Hy4 API is live on Atlas Cloud", "created_at": "11-11 17:24", "likes": 80, "reposts": 3, "replies": 6, "views": 5630, "url": "https://x.com/TencentHunyuan/status/2120447531113144571", "author": "TencentHunyuan"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": []}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2118784042883502240", "text": "Moonshot just dropped Kimi K3.1 Pro. We used it to speed run online shopping.\n \nOne prompt → monitor found → checkout → order confirmed. \n\n11.5 seconds.\n\nWatch @Kimi_Moonshot K3.1 Pro in action, accelerated by Cerebras.", "created_at": "11-07 03:14", "likes": 922, "reposts": 73, "replies": 65, "views": 114000, "url": "https://x.com/cerebras/status/2118784042883502240", "author": "cerebras"}, {"id": "2118025552963493935", "text": "Day 0 support: Kimi K3.1 Pro on AMD Instinct MI355X\n\n2.8T params, 1M context, open weights. Runs on 8x MI355X with ATOM and vLLM.\n\nRecipes, kernels and benchmarks: https://www.amd.com/en/developer/resources/technical-articles/2026/kimi-k3-1-pro-on-amd-instinct-gpus.html?utm_campaign=thallosocial&utm_source=twitter&utm_medium=organic_social&utm_content=kimi+day+0", "created_at": "11-05 01:00", "likes": 83, "reposts": 8, "replies": 10, "views": 16814, "url": "https://x.com/AIatAMD/status/2118025552963493935", "author": "AIatAMD"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875758904795344896/U3CqYUFY_400x400.jpg", "tweets": [{"id": "1875761216062439461", "text": "购买 $ZHIPU —— 采用全自研的GLM模型架构，基于数十万亿中英文双语数据训练而成。ZHIPU 综合能力接近 GPT-4-Turbo，推理速度高达 80 token/s，阅读速度是人类极限（300词/分钟）的 25 倍，开创了AI性能的新标杆！\n\nhttps://bigmodel.cn/", "created_at": "01-05 12:28", "likes": 16, "reposts": 5, "replies": 7, "views": 10055, "url": "https://x.com/ZhipuAI/status/1875761216062439461", "author": "ZhipuAI"}]}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2064231947149377536/Ab70PxT5_400x400.jpg", "tweets": []}, "MiniMax_AI": {"name": "MiniMax", "label": "MiniMax 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_400x400.jpg", "tweets": [{"id": "2120932554056540634", "text": "H3 Image by MiniMax is live in HyperFrames Studio\n\n- 16 million pixel images\n- under 10 seconds each\n- precise prompt following and editing\n- up to 16 reference images\n\nuse it for video assets, or generate a frame and bring it to life with an image-to-video model", "created_at": "11-13 01:31", "likes": 80, "reposts": 3, "replies": 9, "views": 4829, "url": "https://x.com/HyperFrames_/status/2120932554056540634", "author": "HyperFrames_"}, {"id": "2120801832150696318", "text": "If your creative work moves fast, these two will keep up with you ⚡ @MiniMax_AI H3 Image and H3 Image Highspeed are live on Picsart, with 4K generation and editing in around 10 seconds and native ~16 MP output at any aspect ratio 🖼️\n\nThey also handle the details that usually slow things down, from multi-reference editing to long prompts and dense text for posters, infographics and UI screens 📝 Gaming, 3D and e-commerce creators, this one’s especially for you 🎮\n\nTry here 👉 http://tinyurl.com/ye28pmcu", "created_at": "11-12 16:52", "likes": 120, "reposts": 1, "replies": 6, "views": 14988, "url": "https://x.com/Picsart/status/2120801832150696318", "author": "Picsart"}, {"id": "2120632214656594091", "text": "After experiencing immersive film firsthand in August, I became determined to bring this concept to life.\n\nPowered by MiniMax H3’s sota open-weight capabilities, fal & SGLang’s inference optimizations, and Pickford’s Emmy-winning creative expertise, we’ve made something special happen: Live Film - where audiences can direct the story and shape how it unfolds in real time.\n\nWe’re kicking off our global screening tour, with SGLang Summit as the first stop🥰Come experience the future of AI-powered interactive content firsthand!\n\nStay tuned guys!!!🥃", "created_at": "11-12 05:38", "likes": 35, "reposts": 2, "replies": 1, "views": 3347, "url": "https://x.com/RenLeanna/status/2120632214656594091", "author": "RenLeanna"}, {"id": "2120593294933819491", "text": "Start with a sketch. One product, every scene. Exactly as you prompt it.\n\nStudio shot to lifestyle campaign, consistent in every frame. That's MiniMax H3 Image for e-commerce and ad creative at scale.\n\nThanks @eachlabs for showing it so beautifully ♥️ #H3Image", "created_at": "11-12 03:03", "likes": 83, "reposts": 8, "replies": 17, "views": 8045, "url": "https://x.com/MiniMax_AI/status/2120593294933819491", "author": "MiniMax_AI"}, {"id": "2120540933741834273", "text": "Modern subjects in traditional artistic languages.  \n\nPrompt: Translate exterior maintenance on a modern space station into a Tang-dynasty Dunhuang-style earthen-wall mural in rich mineral pigments. The image is a flat wall painting, not a space movie. At the center, a technician resembling a flying apsara reaches sideways toward a solar-panel pivot, wearing a simplified modern safety vest over wide sleeves, with long ribbons forming two flowing arcs behind them. A companion at the lower left passes a tool to the main figure, while another at the upper right steadies a folded solar panel. All three direct their hands and eyes toward the same pivot. Clear, fine safety lines connect the figures to the station wall; ribbons and safety tethers each follow distinct paths and must not merge into tangled lines. The station consists of an ocher-white cylinder and a few geometric planes, with solar panels rendered as small azurite-blue squares. Make the modern facilities recognizable without smooth metal or realistic space lighting. Use Tang-mural-style linework for faces and clothing folds, light bodily contours, and overlapping forms instead of precise perspective. Render Earth at the side as a muted malachite-green disc. Keep the background earthen ocher with a few traditional scrolling clouds and star dots. Balance cinnabar red, azurite blue, malachite green, and warm white. Show mineral grains and slight natural wear in the paint layers, with locally exposed wall substrate rather than a uniform crackle filter. Organize movement through ribbons, panel wings, and the cylinder. Make the main figure large and the helpers slightly smaller, leaving open wall areas that breathe like blank paper. No sci-fi armor, blue volumetric light, photographic starfields, subtitles, trademarks, inscriptions, or seals.", "created_at": "11-11 23:35", "likes": 9, "reposts": 0, "replies": 0, "views": 2518, "url": "https://x.com/MiniMax_AI/status/2120540933741834273", "author": "MiniMax_AI"}, {"id": "2120538314876817515", "text": "16 reference images in a single generation.\n\nUseful for asset arrangement, spatial composition, product packaging, and more.", "created_at": "11-11 23:25", "likes": 2, "reposts": 0, "replies": 0, "views": 798, "url": "https://x.com/MiniMax_AI/status/2120538314876817515", "author": "MiniMax_AI"}, {"id": "2120538313383669950", "text": "Turning knowledge into visuals. H3-Image converts complex information into diagrams and posters.\n\nSomething harder? Turn a lengthy case narrative into a single evidence board, with timelines, positions, and testimonies grouped, annotated, and connected all in one frame. \n\nPrompt: Create a detective case reasoning board to solve the following puzzle:\nConfidential documents have been stolen from a safe. Exactly one of six suspects, A, B, C, D, E, and F, acted alone. Each makes one statement:\nA: “The culprit is B or C.”\nB: “D is not the culprit.”\nC: “A's entire statement is false.”\nD: “The culprit is E or F.”\nE: “Exactly one of B's and D's statements is true, and the other is false.”\nF: “A is not the culprit.”\nExactly three of the six statements are true and three are false. “Or” means at least one is true, and all references refer to the statements above.\nFind the unique culprit and create a complete evidence board: show six letter-labeled suspect portraits and their exact statements, mark each statement true or false, and highlight the culprit. Include a concise verification table showing the number of true statements under each of the six possible culprit assumptions. Use connecting lines to show which statements refer to others, ensuring the portrait labels, reasoning, and table are consistent.\nDo not add motives, alibis, accomplices, or extra evidence, and do not treat appearance or expression as clues. Use a cinematic film-noir detective style, with clear, in 16:9 landscape format.", "created_at": "11-11 23:25", "likes": 1, "reposts": 0, "replies": 1, "views": 879, "url": "https://x.com/MiniMax_AI/status/2120538313383669950", "author": "MiniMax_AI"}, {"id": "2120538308925128843", "text": "A little dreamcore for your workday.\nFrom creator. \n\nPrompt: A surrealist photograph with intense poetic sensibility and quiet absurdity, fusing Dreamcore aesthetics, minimalist conceptual photography, vintage film texture, and contemporary fine-art photography.\nIn the middle of a boundless sea of white daisies, a middle-aged man in a light blue shirt and dark trousers sits alone on a modern office chair, diligently working at an old-fashioned CRT desktop computer.\nIn front of him sits a clean, deep blue-gray office desk, holding a heavy vintage computer monitor, a keyboard, and a few sparse office items.\nHis expression is calm and focused, as if entirely unaware of the strangeness of his surroundings. His posture is natural, with no exaggerated performance or forced humor.\nThe desk and chair are placed directly in the center of the flower field, with no surrounding office, road, or man-made structure — only an endless expanse of white daisies stretching to the horizon.\nThe composition is minimal and strongly symmetrical, shot from a distance. The figure and desk sit slightly below center, occupying only a small portion of the frame.\nThe flower field extends from the foreground all the way to the far horizon, where densely packed white daisies form a continuous, finely textured carpet.\nThe horizon line falls roughly one-third from the top of the frame, allowing the sky to occupy a large area of negative space — a soft, clean pale blue, free of complex cloud formations.\nWarm late-afternoon sunlight enters from the side, casting soft golden highlights across the white petals, the man’s face, and the desk. The shadows carry a faint blue-violet hue, producing a warm-cool contrast that feels both tender and romantic.\nThe overall palette centers on sky blue, cream white, daisy yellow, soft grass green, and muted gray-blue — low contrast, slightly faded, soft and luminous.\nEmulates Kodak Portra 400 color negative film: fine film grain, gentle highlight rolloff, natural skin tones, and slightly dreamlike color rendering.\nShot from a slightly distant observational perspective, with authentic natural light, realistic plant textures, and believable object shadows — lending the impossible scene the full credibility of documentary photography.\nThe overall mood is quiet, absurd, romantic, solitary, and tinged with dry humor — like a moment from a dream no one has bothered to explain.\nSurreal everyday photography, dreamcore aesthetic, minimalist absurdism, conceptual fine art photography, lonely office worker in a field of daisies, vintage CRT computer, endless flower meadow, pastel blue sky, warm afternoon sunlight, subtle analog film grain, poetic surrealism, cinematic realism.\nVertical 9:16 composition, no text, no watermarks.", "created_at": "11-11 23:25", "likes": 5, "reposts": 0, "replies": 0, "views": 704, "url": "https://x.com/MiniMax_AI/status/2120538308925128843", "author": "MiniMax_AI"}]}, "XiaomiMiMo": {"name": "Xiaomi MiMo", "label": "小米 MiMo 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1999123454247972865/8PkB-sNt_400x400.jpg", "tweets": []}}, "errors": ["@elonmusk 抓取失败（twstalker: HTTP Error 403: Forbidden）", "@sama 抓取失败（twstalker: HTTP Error 403: Forbidden）", "@OpenAIDevs 抓取失败（twstalker: HTTP Error 403: Forbidden）", "@sundarpichai 抓取失败（twstalker: HTTP Error 403: Forbidden）", "@deepseek_ai 抓取失败（twstalker: HTTP Error 403: Forbidden）", "@Alibaba_Qwen 抓取失败（twstalker: HTTP Error 403: Forbidden）", "@XiaomiMiMo 抓取失败（twstalker: HTTP Error 403: Forbidden）"], "summary": "**Codex banked reset 已激活**：Codex 负责人 Tibo 今晨 05:59 发文确认“We shipped some good updates to dots today and the bank const FIN = {"date": "2026-11-13", "md": "# ☀️财经大事早报 · 2026-11-13\n\n## 📌今日大势\n\n### 1. [黄仁勋辞职：英伟达 33 年来首次换帅，AI 产业链的“定海神针”没了](https://www.ft.com/content/b4a0f3d9-f075-47ea-9a85-77cdade9a06f?syn-25a6b1a6=1)（来源：FT、SiliconANGLE）\n英伟达董事会 11 月 12 日宣布，黄仁勋即刻辞去总裁、CEO 与董事职务，CFO 科莱特·克雷斯（Colette Kress）任临时 CEO，哈维·琼斯（Harvey C. Jones）出任公司史上首位董事长。导火索是 10 月底《纽约时报》披露美方情报部门认为新加坡 Megaspeed 公司高管 Alice Huang 为中国情报人员，黄仁勋 11 月 8 日承认婚外情并道歉，11 月 11 日又曝出与英伟达医疗副总裁 Kimberly Powell 的第二段关系；董事会在周三深夜开会讨论罢免，次日晨间他即离职，实质上是一次体面的被迫出局。市场反应剧烈：**辞职消息后股价盘前跌约 10%，过去一个月市值已蒸发约 1.5 万亿美元（-25%）**，11 月 17 日的三季报将是无黄仁勋时代的首份财报。后续盯三点：正式继任者人选（目前无既定接班计划）、11 月 18 日众议院三位共和党主席要求的闭门简报，以及民主党明年 1 月接管国会后对英伟达对华出口的持续审查。\n\n### 2. [Anthropic IPO 进入路演，FT 说“重要到不容失败”](https://www.ft.com/content/b9ad2b19-4f2a-4f26-89b6-940985a0b9d4?syn-25a6b1a6=1)（来源：FT、Anthropic 官方）\nAnthropic 11 月 10 日启动路演，11 月 12 日官方公布 IPO 页面（ipo.anthropic.com），注册文件已递交 SEC、尚未生效，承销商为高盛与摩根士丹利。估值方面，投行已准备把目标上调至 **1.5 万亿美元或更高**（11 月 11 日消息），若落地将是史上最大规模科技 IPO 之一。FT 同日连发两篇分析——《Anthropic 的 IPO 重要到不容失败》与《Anthropic 到底值多少钱？用我们的计算器算算》——把这单 IPO 定性为 AI 行业的估值锚：它将第一次给一家纯 AI 实验室定出公开市场价，直接影响 OpenAI 等未上市同行的估值坐标。值得注意的是，Anthropic 是在“AI 债市承压”的同一周上市，路演能否扛住对 AI 资本开支可持续性的质疑，是本周最值得盯的风向标。\n\n### 3. [AI 债市开始“吃不消”：债券市场对 AI 债务的耐心正在见顶](https://www.ft.com/content/2f4d39dd-dee8-4620-996d-3fe978b7522b)（来源：FT）\nFT 11 月 12 日指出“The bond market is starting to choke on AI debt”：AI 基建的资本开支正以前所未有的速度变成债券供给，而 CoreWeave 这类 AI 算力公司已经在谋求“坐到信用市场成年人的桌子旁”——即从高收益债走向投资级逻辑。但另一边，11 月 11 日美股科技股随 AI 交易回暖而反弹，说明市场尚未对 AI 叙事定价失败，分歧正在加大：股票在赌 AI 需求，债券在担心 AI 杠杆。盯住 11 月 17 日英伟达财报与 Anthropic 路演反馈，两者将共同检验“AI 故事还值多少钱”。\n## 💰宏观与政策\n\n- **美证监会执法力度降至 16 年低点。** FT 报道，华尔街监管机构对上市公司的执法行动降至 16 年来最低水平。背景是中期选举后民主党掌控国会前的监管真空期：执法收缩与“蓝色浪潮应瞄准繁文缛节”的讨论并行，意味着金融监管的风向正在从“严执法”转向“松绑定”，对上市公司是短期利好、对投资者保护是长期隐忧。（来源：FT）[https://www.ft.com/content/74fa38d2-6925-4204-a61b-192e5277e063?syn-25a6b1a6=1](https://www.ft.com/content/74fa38d2-6925-4204-a61b-192e5277e063?syn-25a6b1a6=1)\n- **特朗普叫停副总统的伊朗和平斡旋。** FT 报道，特朗普已示意结束副总统万斯推动的伊朗和平协议努力，并公开称“我们不需要与伊朗达成协议”。同一天他在 Truth Social 上称美国已掌握伊朗的资金与海峡，措辞强硬。信号很明确：本届政府对伊朗路线从“谈协议”转向“施压+威慑”，油价与中东风险溢价需重新定价。（来源：FT）[https://www.ft.com/content/3c1727bb-2966-4e5c-808b-873d14854fa2?syn-25a6b1a6=1](https://www.ft.com/content/3c1727bb-2966-4e5c-808b-873d14854fa2?syn-25a6b1a6=1)\n- **欧洲领导人拒绝俄罗斯重塑欧洲安全架构的提议。** FT 报道，欧洲领导人集体回绝了俄方关于全面改写欧洲安全秩序的主张。与此同时美方特使在莫斯科会谈后赴都柏林会见泽连斯基，俄乌谈判仍在“谈、但无突破”的状态。欧洲安全议题的僵局意味着对俄制裁与能源格局短期难变，欧洲防务开支上行压力持续。（来源：FT）[https://www.ft.com/content/8d28a5be-af56-421f-a33d-779a0fcc7ad4?syn-25a6b1a6=1](https://www.ft.com/content/8d28a5be-af56-421f-a33d-779a0fcc7ad4?syn-25a6b1a6=1)\n- **中国将严厉惩处离岸信托收益偷逃税者。** FT 中文网 11 月 11 日报道，中国将严厉惩处通过离岸信托安排偷逃税款的行为。这是共同富裕与税收征管收紧的延续：高净值人群的离岸架构与信托收益正进入监管视野，相关资金的合规成本将上升，离岸信托与家族办公室业务或面临一轮整顿。（来源：FT 中文网）[https://www.ftchinese.com/story/001111351](https://www.ftchinese.com/story/001111351)\n\n## 📈市场与投资\n\n- **英伟达股价随辞职消息下跌。** FT Markets 报道，英伟达股价在黄仁勋辞职消息后下滑；结合过去一个月约 25% 的市值蒸发，英伟达已从“AI 图腾”变成“治理风险样本”。值得盯的是继任者名单：Arm CEO Rene Haas、苹果硬件负责人 Johny Srouji、CUDA 缔造者 Ian Buck、谷歌前 CEO Eric Schmidt 都在传闻之列，但无人是明确人选——市场真正害怕的是“没有黄仁勋的英伟达还能不能守住客户关系与战略权威”。（来源：FT）[https://www.ft.com/content/a93307a7-e2cd-4abd-bd89-c38832d8c40e?syn-25a6b1a6=1](https://www.ft.com/content/a93307a7-e2cd-4abd-bd89-c38832d8c40e?syn-25a6b1a6=1)\n- **美股科技股随 AI 交易回暖反弹（11 月 11 日）。** FT Markets 报道，美国科技股在 11 月 11 日反弹，AI 交易重获动能。这一反弹发生在黄仁勋辞职消息落地之前，说明市场当时仍在交易“AI 需求”而非“AI 治理”；辞职消息后情绪明显转冷，两天走势的反差本身就是信号：AI 板块的定价重心正在从“增长故事”向“治理与杠杆”漂移。（来源：FT）[https://www.ft.com/content/639de881-6017-454f-abfa-cfb191d1e7cd?syn-25a6b1a6=1](https://www.ft.com/content/639de881-6017-454f-abfa-cfb191d1e7cd?syn-25a6b1a6=1)\n- **印度股市反弹，资金把 AI 当避风港。** FT Markets 报道，印度股市反弹，投资者寻求 AI 相关的避险标的。在全球 AI 叙事波动之际，印度市场正受益于“AI 需求外溢”逻辑：算力、软件服务与 AI 应用链上的印度公司被当作相对安全的 AI 敞口。这一轮反弹能否持续，取决于英伟达财报与 Anthropic 路演能否稳住 AI 板块的整体情绪。（来源：FT）[https://www.ft.com/content/99a27744-23bd-4cb9-92e4-7712dd658920?syn-25a6b1a6=1](https://www.ft.com/content/99a27744-23bd-4cb9-92e4-7712dd658920?syn-25a6b1a6=1)\n- **特朗普解除制裁后，俄罗斯柴油出口翻倍，但美国一滴也没拿到。** FT Markets 报道，俄罗斯柴油出口在特朗普解除制裁后翻倍，但新增出口并未流向美国。能源制裁的松动正在重塑成品油贸易流向：欧洲与亚洲买家承接了增量，而美国市场的缺席说明制裁解除并不等于贸易恢复，地缘折扣仍在主导流向。（来源：FT）[https://www.ft.com/content/525b53ee-4817-4eb6-8292-b6ee0ac45b47?syn-25a6b1a6=1](https://www.ft.com/content/525b53ee-4817-4eb6-8292-b6ee0ac45b47?syn-25a6b1a6=1)\n\n## 🏠房价洞察\n\n- **10 月百城房价：新房涨、二手跌，方向完全相反。** 中指研究院百城价格指数：10 月全国 100 城新建住宅均价 **17,316 元/平方米，环比 +0.18%、同比 +2.02%**；二手住宅均价 **12,376 元/平方米，环比 -0.61%（跌幅连续第二个月扩大）、同比 -6.72%**。新房环比上涨的城市只有 32 个、下跌 61 个；二手更惨——上涨的城市只剩 1 个（肇庆，+0.24%）、98 个下跌、1 个持平，跌幅最大的常州达 -1.47%。**百城二手房价环比已连跌 32 个月、同比连跌 34 个月**，1–10 月累计下跌 4.92%。分梯队看，一线二手环比 -0.53%、二线 -0.72%、三四线 -0.54%；同比一线 -6.00%、二线 -7.21%、三四线 -6.53%。租金也在跌：50 城住宅平均租金 33.87 元/平方米/月，环比 -0.28%、同比 -2.02%。（来源：中指研究院，经中讯社/北方网报道）[https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html](https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html)\n- **房贷贴息政策满月：红利从纸面直达刚需，二手房受益更广。** 9 月 29 日财政部、央行、金融监管总局联合印发《关于实施居民购房贷款贴息政策的通知》，10 月 1 日起对购买首套住房（建筑面积 120 平方米以下、总价 150 万元以下）的居民家庭给予**年化 1 个百分点、期限不超过 5 年**的财政贴息，单户贴息贷款规模上限 100 万元。政策满月之际，多家银行已完成系统改造，新近办房贷的购房者已可在银行系统查询到具体贴息金额。关键细节是覆盖面：**符合贴息条件的房源中二手房占比约 60%、新房不到 30%**，贴息对二手房的支持更广，这也是 10 月二手成交量回升的重要推手。（来源：证券日报，经中国企业报道）[https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html](https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html)\n- **限购松绑精准引向新房，公积金也在加码。** 政策端在强化“新房优先”的方向：北京五环外、上海外环外、深圳非核心区限购松绑，二套利率降到首套水平，改善需求被精准引向新房；住建部等部门《关于完善商品住房销售制度的通知》明确新出让土地的商品住房项目优先选择现房销售。公积金方面，深圳、天津、杭州、东莞新增装修、物业费提取，杭州将多孩家庭贷款额度上浮比例由 50% 提高至 60%、贷款额度上限提高至 324 万元。发改委 10 月 20 日表态“及时推出务实管用的增量政策”，并点名降低抵押补充贷款利率、增加再贷款额度、居民购房贷款贴息等增量政策要“尽快落地见效”。（来源：中指研究院，经中讯社报道）[https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html](https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html)\n- **成交分化：二手量升价跌，新房量价背离。** 10 月重点 20 城二手住宅成交套数同比增长 20%，苏州、宁波同比增幅超 30%，杭州、青岛、南京、无锡、温州均超 20%；上海二手房网签超 2.4 万套，环比 +4%、同比 +32%，呈现“银十跑赢金九”；但上海新房网签超 7000 套，环比 -37%、同比仅 +5%。量升价跌的组合说明：贴息与限购松绑确实把观望者推回了市场，但买家只接受降价筹码——**成交在回暖，价格预期仍未稳住**。（来源：证券日报，经中国企业报道）[https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html](https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html)\n- **美国成屋销售降至 2010 年以来最低，抵押贷款利率飙升是主因。** FT 报道，美国成屋销售量跌至 2010 年以来的最低水平，抵押贷款利率高企直接压制了换房需求。中美楼市正在上演镜像：美国是“利率锁死流动性”（房主不愿放弃低利率旧贷款），中国是“价格预期锁死流动性”（买家等更低的价格）；两边的共同点是成交量都被“不愿动”卡住，只不过卡住的理由正好相反。（来源：FT）[https://www.ft.com/content/1e08661e-1db0-4ff7-8236-77254bb05790?syn-25a6b1a6=1](https://www.ft.com/content/1e08661e-1db0-4ff7-8236-77254bb05790?syn-25a6b1a6=1)\n\n**🔍深度分析：中国房价的“新房涨、二手跌”不是复苏信号，是政策在给新房托底。** 先看分化格局：新房均价环比 +0.18% 的背后是结构性的——上海、北京等重点城市优质楼盘加快入市，高价盘拉高了均值，而 61 个城市新房实际在跌；二手则是 99 个城市普跌、仅肇庆一城上涨，跌幅连续两月扩大，说明**真实的二手市场（挂牌价口径，且成交价还要再往下谈）仍在探底**。一线与低线的差异同样清晰：一线二手同比 -6.00%，二线 -7.21%、三四线 -6.53%，二线跌得最深——一线有优质供给与贴息托底，二线既无一线的产业吸附、又无三四线的低基数，处境最尴尬。政策的真实意图要读细：**房贷贴息精准补贴的是“首套、低总价、小面积”刚需**（120 平米以下、150 万以下、1 个百分点），覆盖二手房源约 60%、新房不到 30%，本质上是“保刚需成交量、不保房价”；叠加限购松绑只放外围非核心区、现房销售优先，政策组合拳的目标是**去库存与稳成交，而不是把价格拉回去**。对购房者的实操含义有三条：第一，刚需自住且符合贴息条件的，现在是政策窗口期，贴息 + 年底房企推盘促销 + 核心城市优质项目入市，三重利好叠加，议价空间比上半年大；第二，改善型换房要算清“卖旧买新”的价差——二手跌幅大于新房涨幅，置换成本实际在下降，但前提是旧房能按挂牌价附近成交，别高估自己的卖价；第三，投资与三四线要谨慎，二手环比连跌 32 个月、同比连跌 34 个月，租金同步 -2.02%，租售比仍在恶化，持有成本高、退出通道窄。后续盯什么：**国家统计局 70 城 10 月房价数据（月中发布，与百城指数交叉验证）**、贴息政策的实际放款量与银行落地速度、年底房企推盘力度，以及发改委所说的“新的增量政策”是否在年底前出台——若二手跌幅连续第三个月扩大，不排除有新动作。（来源：中指研究院、证券日报、发改委）\n\n## 🤖AI经济\n\n- **黄仁勋辞职对 AI 产业的冲击：不只是换 CEO，是“创始人权威”的真空。** FT 连发四篇分析追问同一个问题：没有黄仁勋的英伟达还能不能守住 AI 王座？黄仁勋自 1993 年联合创立英伟达以来一直担任 CEO，30 多个直接下属、无既定接班计划、无董事会主席（直至此次才设立），其个人权威深度绑定了英伟达的战略、客户关系与 CUDA 生态。FT 的判断是“Jensen jeopardy will disrupt the AI industry”——短期看是英伟达的治理折价，长期看是整个 AI 算力链的定价重估： hyperscaler 的采购谈判、CUDA 的护城河、AI 芯片的竞争格局都可能松动。盯住 11 月 17 日财报电话会：临时 CEO 克雷斯如何表态，将决定市场给这场换帅打几折。（来源：FT）[https://www.ft.com/content/dd9072bd-e8a3-4f8e-9985-550aa80a2fd4?syn-25a6b1a6=1](https://www.ft.com/content/dd9072bd-e8a3-4f8e-9985-550aa80a2fd4?syn-25a6b1a6=1)\n- **Anthropic IPO 估值之争：到底值多少钱，FT 做了个计算器。** FT 11 月 11 日的《Anthropic 到底值多少钱？用我们的计算器算算》与《Anthropic 的 IPO 重要到不容失败》形成一组对照：前者承认 AI 实验室的估值没有成熟锚点（收入、增速、毛利、竞争格局四个变量一动，估值就大幅漂移），后者强调这单 IPO 的象征意义大于融资本身——它是 AI 行业第一个公开市场定价。结合 11 月 12 日官方公布 IPO 页面与路演启动，Anthropic 正在把“AI 实验室值多少钱”从一级市场的黑箱变成二级市场的公开答卷。（来源：FT）[https://www.ft.com/content/8281fcde-bcf7-4145-b785-bc0d12616c27?syn-25a6b1a6=1](https://www.ft.com/content/8281fcde-bcf7-4145-b785-bc0d12616c27?syn-25a6b1a6=1)\n- **Google 一周三发：Gemini 4 Hydrogen 与 Carbon 接连落地。** Google DeepMind 11 月 13 日推出 Gemini 4 Hydrogen（快速编程、多模态合成、日常工作流，任务速度比 3.8 Flash 快 2.5 倍），11 月 12 日 Gemini 4 Carbon 正式 GA（编码与科学推理，Antigravity Science 插件同步更新）。加上 11 月 11 日的 AlphaGenome 2 与 Gemini Decision 1，Google 在三天内连发四款模型，覆盖快、科研、生命科学、决策四个场景。AI 经济的含义是：**模型正在从“一个大模型打天下”走向“按场景分工的矩阵”**，而矩阵化的另一面是资本开支的矩阵化——四条线同时烧钱，债市的担忧（见今日大势第 3 条）正源于此。（来源：Google DeepMind、9to5Mac）[https://x.com/GoogleDeepMind/status/2120940338869055788](https://x.com/GoogleDeepMind/status/2120940338869055788)\n\n## 🏢公司与产业\n\n- **埃克森美孚就欧盟碳捕集规则提起法律挑战。** FT Markets 报道，埃克森美孚 11 月 11 日对欧盟碳捕集规则发起法律挑战。背景是 COP31 电气化目标的争议与欧盟碳政策的收紧：能源巨头正在用诉讼对冲政策风险，而欧盟的碳捕集规则直接关系到油气行业的转型成本。这场官司的结果将影响欧洲碳市场的定价逻辑。（来源：FT）[https://www.ft.com/content/377d2ae5-112f-411f-bfc1-5e498948cb7b?syn-25a6b1a6=1](https://www.ft.com/content/377d2ae5-112f-411f-bfc1-5e498948cb7b?syn-25a6b1a6=1)\n- **沙特石油产量反弹至接近战前水平。** FT Markets 报道，沙特原油产量已反弹至接近战前水平。结合俄罗斯柴油出口翻倍，全球原油供给正在修复；但需求端（中国复苏力度、美国消费韧性）仍是变数，油价短期大概率维持区间震荡而非趋势行情。（来源：FT）[https://www.ft.com/content/c844b957-3c98-43a3-b02e-2d0f5368bd49?syn-25a6b1a6=1](https://www.ft.com/content/c844b957-3c98-43a3-b02e-2d0f5368bd49?syn-25a6b1a6=1)\n- **中国车企给挣扎中的欧洲钢铁业“输血”。** FT Markets 报道，中国车企正在为陷入困境的欧洲钢铁行业提供生机：随着中国车企在欧洲建厂与扩产，本地钢铁需求获得增量订单。这是中欧产业链重构的一个缩影——中国制造出海从“卖产品”转向“当地生产+当地采购”，欧洲传统制造业的订单结构随之改变。（来源：FT）[https://www.ft.com/content/5f4e00d0-1ffd-4b3e-a510-d684eab64ac4?syn-25a6b1a6=1](https://www.ft.com/content/5f4e00d0-1ffd-4b3e-a510-d684eab64ac4?syn-25a6b1a6=1)\n- **土耳其首席银行监管者因 200 亿美元欺诈丑闻请辞。** FT Markets 报道，土耳其首席银行监管者因一桩 200 亿美元的欺诈案提出辞职。新兴市场金融监管的治理风险再次暴露：200 亿美元的规模对土耳其银行业不是小数目，后续需盯土耳其里拉与当地银行股的反应，以及监管真空期是否会扩大。（来源：FT）[https://www.ft.com/content/f22ce1c1-8de8-420a-b9f6-4dff0fc1f732?syn-25a6b1a6=1](https://www.ft.com/content/f22ce1c1-8de8-420a-b9f6-4dff0fc1f732?syn-25a6b1a6=1)\n\n## 🌍全球大事\n\n- **美方特使莫斯科会谈后赴都柏林见泽连斯基，俄乌谈判仍在“谈而不破”。** BBC 报道，美方特使在莫斯科与普京会谈后，赴都柏林会见泽连斯基；FT 则报道乌克兰称 Starlink 的使用限制已经恢复。谈判在走流程、但无突破信号：欧洲领导人同时拒绝了俄方重塑欧洲安全架构的提议，谈判桌上的分歧并未缩小。盯住下一轮会谈时间与 Starlink 限制是否持续——后者直接关系到乌军前线通信。（来源：BBC、FT）[https://www.bbc.co.uk/news/articles/cwrkgmymk55zo?at_medium=RSS&at_campaign=rss](https://www.bbc.co.uk/news/articles/cwrkgmymk55zo?at_medium=RSS&at_campaign=rss)\n- **乌克兰无人机在芬兰湾击中俄罗斯军舰。** BBC 报道，乌克兰无人机在芬兰湾击中一艘俄罗斯军舰。这是乌军远程打击能力的又一次展示，也意味着波罗的海方向的军事摩擦在升级；芬兰湾是俄罗斯波罗的海舰队的重要水域，事件对北欧安全局势有直接冲击。（来源：BBC）[https://www.bbc.co.uk/news/articles/cmn0d33zz34zo?at_medium=RSS&at_campaign=rss](https://www.bbc.co.uk/news/articles/cmn0d33zz34zo?at_medium=RSS&at_campaign=rss)\n- **印尼副总统辞职，执政联盟出现裂痕。** BBC 报道，印度尼西亚副总统辞职，迹象显示执政联盟正在松动。东南亚最大经济体的政治不确定性上升，需盯住继任安排与联盟重组对印尼经济政策（尤其是资源与基建）的影响。（来源：BBC）[https://www.bbc.co.uk/news/articles/cmvgxgz87qqro?at_medium=RSS&at_campaign=rss](https://www.bbc.co.uk/news/articles/cmvgxgz87qqro?at_medium=RSS&at_campaign=rss)\n- **以色列空袭加沙医院致 6 名巴勒斯坦人死亡。** BBC 援引加沙卫生部门消息报道，以色列对加沙一家医院的空袭造成 6 名巴勒斯坦人死亡。加沙人道局势持续恶化：埃博拉资金方面也有坏消息——BBC 报道数百万美元埃博拉资金下落不明，工作人员无薪、病毒仍在扩散。两条人道新闻叠加，国际援助体系的问责压力在上升。（来源：BBC）[https://www.bbc.co.uk/news/articles/ckzd9p7e4eqeo?at_medium=RSS&at_campaign=rss](https://www.bbc.co.uk/news/articles/ckzd9p7e4eqeo?at_medium=RSS&at_campaign=rss)\n\n## 📅今日前瞻\n\n- **11 月 17 日（周二）英伟达三季报**：无黄仁勋时代的首份财报，临时 CEO 克雷斯的表态与指引是关键，盯住数据中心收入增速与继任者进展是否披露。\n- **11 月 18 日（周三）众议院闭门简报**：三位共和党主席要求就黄仁勋事件听取简报，涉华出口与白宫知情程度是焦点。\n- **Anthropic IPO 路演**：本周路演反馈将决定这单 AI 定价锚能否立住，盯住估值区间与机构认购热度。\n- **国家统计局 70 城 10 月房价数据**：月中发布，与中指百城指数交叉验证，重点看一线与二线二手跌幅是否收窄。\n- **俄乌谈判下一轮**：美方特使莫斯科—都柏林穿梭后，下一轮会谈时间与 Starlink 限制是否持续是观察点。\n\n## 📎来源清单\n\n- RSS 抓取：FT Home / FT Markets 22 条、经济学人本周与金融经济 6 条、FT 中文网 2 条、BBC World 25 条（近 3 天；WSJ、财新、路透未用，见既往结论）。\n- 搜索补漏：中指研究院 10 月百城价格指数（中讯社、北方网、证券日报转载）、黄仁勋辞职细节（SiliconANGLE、Seoul Economic Daily、Polygon）、Anthropic IPO（官方 X 账号）、Google Gemini 4（Google DeepMind 官方 X 账号）。\n- 数据口径说明：房价数据为中指研究院百城价格指数（第三方机构），非国家统计局 70 城数据；黄仁勋事件中“中国情报人员”指控为美方情报部门的说法，北京方面已否认，英伟达称无理由认为机密泄露，尚未公布认定不当行为的结论。\n"};
