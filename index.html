<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 晨间看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年9月30日 星期三</div>
<h1>☀️ 晨间看板</h1>
<div class="sub">论文 · 新闻 · 会议 Deadline · 开源趋势 · 日程 · 大佬动态 —— 每天 08:00 自动更新</div>
</div>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>
</header>
<nav class="tabs" id="tabbar"><button class="tab" data-tab="papers">📚 论文 13</button><button class="tab" data-tab="news">📰 新闻 40</button><button class="tab" data-tab="deadlines">⏰ Deadline 7</button><button class="tab" data-tab="trending">🔥 开源趋势 20</button><button class="tab" data-tab="agenda">📅 日程</button><button class="tab" data-tab="x">👀 大佬动态 46</button></nav>
<section class="tabpane" id="pane-papers">
<div class="stats">
<div class="stat"><b id="sTotal">–</b><span>收录论文</span></div>
<div class="stat"><b id="sDays">–</b><span>监测天数</span></div>
<div class="stat"><b id="sArxiv">–</b><span>arXiv 预印本</span></div>
<div class="stat"><b id="sExtra">–</b><span>其他来源</span></div>
<div class="stat"><b id="sJour">–</b><span>期刊 / 会议补录</span></div>
</div>
<div class="toolbar">
<label class="search"><span class="ico">🔍</span><input id="q" placeholder="搜索标题 / 作者 / 关键词…"></label>
<div class="chips" id="srcChips"></div>
<select class="sel" id="cat"><option value="">全部分类</option></select>
<select class="sel" id="day"><option value="">全部日期</option></select>
</div>
<div class="count" id="count"></div>

<div id="list"></div>
</section>
<section class="tabpane" id="pane-news" hidden>
<div class="sect-head"><h2>📰 AI / 安全新闻</h2><span class="n" id="newsCount"></span></div>
<div class="list" id="newsList"></div>
</section>
<section class="tabpane" id="pane-deadlines" hidden>
<div class="sect-head"><h2>⏰ 会议投稿倒计时</h2><span class="n" id="dlCount"></span></div>
<div class="list" id="dlList"></div>
</section>
<section class="tabpane" id="pane-trending" hidden>
<div class="sect-head"><h2>🔥 开源趋势</h2><span class="n" id="trCount"></span></div>
<div class="grid" id="trList"></div>
</section>
<section class="tabpane" id="pane-agenda" hidden>
<div class="sect-head"><h2>📅 今日日程</h2><span class="n" id="agCount"></span></div>
<div class="list" id="agList"></div>
</section>
<section class="tabpane" id="pane-x" hidden>
<div class="sect-head"><h2>👀 大佬动态</h2><span class="n" id="xCount"></span></div>
<div id="xList"></div>
</section>
<footer>COCO 晨间看板 · 每天 08:00 自动更新 · <a href="archive/index.html">历史归档</a></footer>
</div>

const DATA = {"days": [{"date": "2026-09-30", "summary": "今日 arXiv 六个分类共 50 篇去重命中（含 22 篇 new），精选 12 篇 v1 新论文 + 1 篇期刊补录。最值得关注的是 **CoSec（2609.34790）**——首个面向多用户/多社区 agent 系统的 authorization benchmark，把\"授权状态\"作为执行期验证的一等对象，与我们的\"查询时逐 AU 求值\"思路同构，是 Agent 访问控制线的直接邻居；以及 **Residual Authority Replay（2609.33910）**——揭示授权决策\"有效期\"本身就是攻击面（ASR 最高 +35.1pp），反向论证了我们\"策略独立存放、查询时无状态求值\"设计的合理性，可直接写入 Discussion 的 revocation 段落。另有 **Authorization Closure Graph（2609.32428）** 给撤销/策略变更的形式化提供了雏形，**BMA（2609.32186）** 的\"provenance-bound authorization 远胜 memory-side controls\"（2.0% vs 11.0%）是我们绑定与执行语义的外部实证。RAG 主线的新攻击 **LENS（2609.35155）** 属于完整性轴而非机密性轴，与我们的威胁模型正交，但应在 Related Work 中提及以界定 scope。", "papers": [{"title": "CoSec: Benchmarking Agent Security in Communities", "authors": "Hao Chen（一作）等 15 人", "url": "https://arxiv.org/abs/2609.34790", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "首个可执行的 agent 社区安全 benchmark，208 个场景覆盖固定/演化边界，用执行轨迹对照\"活跃授权状态\"验证信息流是否越权。", "insight": "这是我们 Agent 访问控制线最直接的邻居工作。它的核心发现——\"task utility 不蕴含 authorization compliance\"——正是我们整篇论文的动机句式，可直接引用。方法论上，它把 authorization state 作为执行期验证对象，与我们的\"查询时逐 AU 求值 P(a,u)\"同构；其场景设计（跨社区、演化边界）可作为我们未来 Agent 线 benchmark 的起点。注意它测的是 agent 系统整体而非 RAG 检索层，不与我们的 claim 直接竞争，定位是 related work + 动机证据。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "When Consent Outlives Context: Residual Authority Replay in Long-Lived Agents", "authors": "Zhihao Zhang（一作）等", "url": "https://arxiv.org/abs/2609.33910", "category": "cs.AI（v1, 2026-09-27）", "cats": ["cs.AI"], "oneliner": "揭示 long-lived agent 中\"授权残留\"攻击：良性交互合法获得的授权在后续对抗执行中被重放，6 个 LLM 家族上 ASR 最高提升 35.1pp。", "insight": "这是我们威胁模型缺失的一维：授权决策的有效期/上下文绑定。我们的框架目前是查询时无状态求值 P(a,u)，这篇文章反向证明了\"把授权结论持久化（缓存、记忆）而不绑定上下文\"必然产生残留授权攻击面——这恰好论证了我们\"策略独立存放、chunk 不存密级结论\"设计的正确性。建议写入 Discussion 的 revocation / time-bounded authorization 段落，并作为 Agent 线 threat model 的新增攻击范式（纵向攻击：先合法取权、后重放）。不动摇现有 claim，反而加强设计合理性。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Authorization Closure Graph: Minimal Repair for LLM Agents with Evolving User Instructions", "authors": "Qingzhuo Wang（一作）等", "url": "https://arxiv.org/abs/2609.32428", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "把授权及其依赖表示为演化的版本化状态（ACG），指令变更时只选择性失效受影响的授权并计算 minimal repair。", "insight": "这是我们 Discussion 未来工作\"撤销机制\"的最接近的形式化雏形：策略/指令变更时，哪些授权失效需要精确计算而非全量重算。它的 minimal repair 思路可直接引用为 related work。但注意其粒度是\"指令级动作授权\"，未涉及内容级细粒度授权（我们的 AU 级）；可作为对比点——我们是 per-query per-AU 求值，他们是 per-instruction 状态维护。威胁面不超出我们的 T1/T2/T3，但补充了时间维度的授权一致性问题。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "BMA: Backchain Memory Attacks Create Unauthorized Control Paths in LLM Agents", "authors": "Kaisheng Fan（一作）等", "url": "https://arxiv.org/abs/2609.32186", "category": "cs.CR（v1, 2026-09-26）", "cats": ["cs.CR"], "oneliner": "攻击者不写记忆、不改任务，仅编辑低信任证据，经记忆固化后在干净任务中被检索并驱动受保护动作；provenance-bound authorization 将攻击成功率压到 2.0%，远胜 memory-side controls 的 11.0%。", "insight": "这是对我们\"绑定与执行语义\"核心设计最有力的外部证据：事后管控记忆（memory-side controls）远不如按来源绑定授权（provenance-bound authorization）——与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构，可在论文中引用为设计选择的实证支撑。方法论上，它的 Path-CASR（registered pathway + matched-intervention checks，区分记忆介导命中与巧合命中）值得借鉴：我们的 A1 cloze 评估同样需要区分\"真实泄露\"与\"标注缺口/巧合命中\"。对 RAG 主线，持久化记忆通道 ≈ 我们的 embedding 通道（持久化表示泄露），类比成立。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "LENS: The Sum Is Worse Than the Parts for Set-Level Poisoning in Retrieval-Augmented Generation", "authors": "Kaisheng Fan（一作）等（与 BMA 同一团队）", "url": "https://arxiv.org/abs/2609.35155", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "形式化 RAG 的 set-level compositional poisoning：单个文档各自无害、合在一起才把 RAG 输出带偏到目标答案（full-set ASR 0.852，任一真子集 ≤0.069）。", "insight": "诚实地说，这是与我们正交的轴：LENS 是完整性（integrity）攻击，我们的威胁模型是机密性（未授权披露）。它不在我们的 T1/T2/T3 之外，而是不在同一维度。但应在 Related Work 中引用以完整界定 RAG 攻击面、明确我们的 scope 限定在访问控制/披露风险。方法论可借鉴：它的\"真子集不足\"形式化定义与 counterexample-guided repair 构造方式，可类比用于设计针对我们 projection 机制的组合式压力测试（多个各自合规的 AU 组合后是否泄露）。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "RAISE: Reinforcing Access Control Policy Synthesis in LLMs via Symbolic Evaluation", "authors": "Yingming Zhou（一作）等", "url": "https://arxiv.org/abs/2609.33796", "category": "cs.SE, cs.CR, cs.LG（v1, 2026-09-27）", "cats": ["cs.SE", "cs.CR", "cs.LG"], "oneliner": "构建 CedarInstruct（5,800 场景 / 44 领域，首个支持可验证 Cedar 策略合成的数据集），并用 verifier 信号做两阶段训练（SFT + off-context GRPO）提升策略语义正确率。", "insight": "我们的\"策略独立存放\"一直缺一个具体的策略语言实例；Cedar（AWS 开源策略语言）是现成候选，CedarInstruct 给了策略合成的可验证 benchmark——我们若要做 end-to-end demo，策略层可直接用 Cedar，评估可用 CedarBench。这是工程实现层的相关工作，不涉及检索/披露威胁面，不动摇安全 claim。它的训练发现（verifier signal 的用法比用量更重要）对我们无直接影响。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Certified Multi-Source Integrity for Structured Agent Actions", "authors": "Anmol Pandey（一作）等", "url": "https://arxiv.org/abs/2609.34245", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "在 corruption budget 下给出\"最大可用\"的安全认证器：动作的每个字段必须通过其证据结构支持的规则（corruption-distinct 证据类的 minimum hitting set 计数），否则拒绝执行。", "insight": "防御思路可借鉴但轴不同：它是完整性认证（字段值是否被污染），我们是机密性（未授权内容是否披露）。其\"corruption-distinct 证据类 / minimum hitting set\"形式化与我们的 KG 路径切割有类比价值——都是把\"证据独立性\"变成图/集合上的计数问题。它的实证发现（genuine corroboration 是少数现象；naive attestation counting 高估独立性）对我们的 NLI 残留检查是个警示：看似独立的公开证据可能共享上游来源。关联中等，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Policy-Conditioned Constrained Decoding for Column-Level Access Control in Text-to-SQL", "authors": "Ryoto Miyamoto（一作）等", "url": "https://arxiv.org/abs/2607.12341", "category": "cs.CL, cs.CR, cs.DB", "cats": ["cs.CL", "cs.CR", "cs.DB"], "oneliner": "把列级使用策略编译进解码器的 per-token logits mask，单次解码确定性消除列误用，在 Spider-CU 上达 9:27", "likes": 2876, "reposts": 404, "replies": 595, "views": 1825829, "url": "https://x.com/elonmusk/status/2105107252529013032", "author": "elonmusk"}, {"id": "2105103689417408624", "text": "Starship Super Heavy", "created_at": "09-30 09:13", "likes": 10094, "reposts": 1104, "replies": 910, "views": 2219467, "url": "https://x.com/elonmusk/status/2105103689417408624", "author": "elonmusk"}, {"id": "2105090209897500828", "text": "Due to high winds, the new Roadster demo is postponed by 2 weeks", "created_at": "09-30 08:19", "likes": 19399, "reposts": 1230, "replies": 1597, "views": 3994750, "url": "https://x.com/elonmusk/status/2105090209897500828", "author": "elonmusk"}, {"id": "2105088792139014331", "text": "Grok 4.7 rank 1 on AA cyber index", "created_at": "09-30 08:14", "likes": 3667, "reposts": 530, "replies": 486, "views": 1668015, "url": "https://x.com/elonmusk/status/2105088792139014331", "author": "elonmusk"}, {"id": "2105087367686025454", "text": "I think it's a significant positive step that the leaders of every major American lab have committed to implementing robust internal controls and multiple layers of audits and reviews. This should give people more confidence that the technology each lab is building will work as intended.", "created_at": "09-30 08:08", "likes": 15298, "reposts": 1434, "replies": 1315, "views": 1222397, "url": "https://x.com/finkd/status/2105087367686025454", "author": "finkd"}, {"id": "2105085334585299283", "text": "We’re now live in Ecuador with @Starlink Mobile! The new service with @CNT_EC will connect people in cellular dead zones across the country’s diverse terrains including the Amazon rainforest and Galápagos Islands.", "created_at": "09-30 08:00", "likes": 941, "reposts": 130, "replies": 54, "views": 407493, "url": "https://x.com/SRBednarek/status/2105085334585299283", "author": "SRBednarek"}], "group": "other"}, "realDonaldTrump": {"name": "Donald Trump", "label": "特朗普", "avatar": "https://pbs.twimg.com/profile_images/874276197357596672/kUuht00m_400x400.jpg", "tweets": [{"id": "2103486761775325234", "text": "Hallelujah @WhiteHouse…", "created_at": "09-25 22:08", "likes": 20805, "reposts": 3983, "replies": 773, "views": 849151, "url": "https://x.com/DanScavino/status/2103486761775325234", "author": "DanScavino"}, {"id": "2103467836114936060", "text": "Truly unbelievable—Here’s another behind the scenes of last nights State Dinner at the @WhiteHouse…", "created_at": "09-25 20:53", "likes": 44515, "reposts": 8539, "replies": 1924, "views": 3374088, "url": "https://x.com/DanScavino/status/2103467836114936060", "author": "DanScavino"}], "group": "other"}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2104993966043320759", "text": "This is Ultrafast.\n\nOur premium speed tier, Ultrafast offers up to 8x faster token generation (300 tokens per second) in Codex and up to 6x in the API.", "created_at": "09-30 01:57", "likes": 6044, "reposts": 277, "replies": 340, "views": 842286, "url": "https://x.com/OpenAI/status/2104993966043320759", "author": "OpenAI"}, {"id": "2104993967985381673", "text": "Ultrafast is available today for GPT-6 Astra in Codex, ChatGPT Work, and the API, with GPT-6.1 Sol coming soon.\n\nTo access it in Codex and ChatGPT Work, we’re introducing Pro 500—a new plan with our highest usage limits (25x Plus) and access to Ultrafast.\n\nhttps://chatgpt.com/pricing", "created_at": "09-30 01:57", "likes": 926, "reposts": 40, "replies": 103, "views": 221835, "url": "https://x.com/OpenAI/status/2104993967985381673", "author": "OpenAI"}, {"id": "2104993969486930015", "text": "We’re also reopening Pro 200 subscriptions, with continued access to frontier models like Astra, including our new GPT-6.1 Sol model which brings near-Astra capabilities to a model you can use every day.\n\nOur commitment is that your subscription will continue to help you get more work done with an increasing level of quality.\n\nWe are also committing to not reintroducing the 5hr limit so that you can fully use your weekly usage when you want.", "created_at": "09-30 01:57", "likes": 379, "reposts": 15, "replies": 29, "views": 104334, "url": "https://x.com/OpenAI/status/2104993969486930015", "author": "OpenAI"}, {"id": "2104987422308335828", "text": "Codex Security Cloud is getting a major upgrade, with access to cyber-capable models through Daybreak Blue included by default.\n\nIt scans entire GitHub repos, continuously reviews new commits, investigates and deduplicates findings, and prepares fixes for review – even when your laptop is closed.\n\nAvailable as a plugin in Codex desktop and web.", "created_at": "09-30 01:31", "likes": 3771, "reposts": 258, "replies": 178, "views": 437426, "url": "https://x.com/OpenAI/status/2104987422308335828", "author": "OpenAI"}, {"id": "2104986136745767160", "text": "GPT-6.1 Sol is available starting today to all Plus, Pro, Business, Enterprise, and Edu users in ChatGPT Work and Codex.\n\nhttps://openai.com/index/introducing-gpt-6-1-sol", "created_at": "09-30 01:26", "likes": 751, "reposts": 45, "replies": 30, "views": 121162, "url": "https://x.com/OpenAI/status/2104986136745767160", "author": "OpenAI"}, {"id": "2104986135005192665", "text": "GPT-6.1 Sol shows major improvements over GPT-6 Sol in our alignment evaluations, bringing it more in line with GPT-6 Astra. \n\nIt’s more transparent about its limitations and more reliable at respecting user intent and safety constraints.", "created_at": "09-30 01:26", "likes": 703, "reposts": 19, "replies": 19, "views": 124519, "url": "https://x.com/OpenAI/status/2104986135005192665", "author": "OpenAI"}, {"id": "2104986129686741046", "text": "GPT-6.1 Sol: near-Astra intelligence for a fifth of the price.\n\nIt’s the most cost-efficient model for its performance available today.", "created_at": "09-30 01:26", "likes": 19089, "reposts": 1542, "replies": 586, "views": 2488972, "url": "https://x.com/OpenAI/status/2104986129686741046", "author": "OpenAI"}, {"id": "2104984508454121795", "text": "Dots will be available in ChatGPT on web, mobile, and desktop across Pro, Business Premium, and Enterprise users in eligible markets.\n\nTo get started, create your first dot in the ChatGPT desktop app or your desktop browser, connect your apps, and let it introduce itself.", "created_at": "09-30 01:19", "likes": 1030, "reposts": 31, "replies": 85, "views": 387955, "url": "https://x.com/OpenAI/status/2104984508454121795", "author": "OpenAI"}], "group": "openai"}, "sama": {"name": "Sam Altman", "label": "OpenAI", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2104995014208258235", "text": "Dots are here!\n\nA new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.\n\nhttps://openai.com/index/introducing-dots/", "created_at": "09-30 02:01", "likes": 12480, "reposts": 916, "replies": 1723, "views": 1489377, "url": "https://x.com/sama/status/2104995014208258235", "author": "sama"}, {"id": "2104994601140711896", "text": "Ultrafast is\n\nso fast\n\nI do not ever want to go back", "created_at": "09-30 01:59", "likes": 9355, "reposts": 230, "replies": 1077, "views": 740802, "url": "https://x.com/sama/status/2104994601140711896", "author": "sama"}, {"id": "2104994395980533804", "text": "6.1 Sol at 1/5th of the price of Astra, and 95% cache read discount! Extremely capable model.", "created_at": "09-30 01:59", "likes": 6946, "reposts": 229, "replies": 476, "views": 564135, "url": "https://x.com/sama/status/2104994395980533804", "author": "sama"}, {"id": "2104993363170861501", "text": "Over the past 5 weeks, the team completely rewrote ChatGPT Web on top of the desktop app codebase.\n\nThis was only possible with Astra, and it’s why Dots, Space, Codex Cloud, and so many more of our launches will come to web and desktop same day. \n\nEra of the megaproject begins.", "created_at": "09-30 01:55", "likes": 1998, "reposts": 83, "replies": 142, "views": 230156, "url": "https://x.com/ajambrosino/status/2104993363170861501", "author": "ajambrosino"}, {"id": "2104950376466362578", "text": "DevDay livestream in 2 hours.\n\nWe built some great stuff for you!", "created_at": "09-29 23:04", "likes": 9243, "reposts": 372, "replies": 913, "views": 638395, "url": "https://x.com/sama/status/2104950376466362578", "author": "sama"}, {"id": "2104661956879913457", "text": "Pretty excited for DevDay tomorrow.\n\nWe have found a new thing.", "created_at": "09-29 03:58", "likes": 9274, "reposts": 488, "replies": 839, "views": 1919135, "url": "https://x.com/sama/status/2104661956879913457", "author": "sama"}], "group": "openai"}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2105178959327756396", "text": "What’s up dot", "created_at": "09-30 14:12", "likes": 2079, "reposts": 41, "replies": 1170, "views": 257248, "url": "https://x.com/thsottiaux/status/2105178959327756396", "author": "thsottiaux"}, {"id": "2105105086506840421", "text": "We will have a few million dots online within days, working on all sorts of things across such a diverse and large community. \n\nExcited to learn from all of you on what you love and what doesn’t yet feel magical. Personally I felt a jump after 2-3 days of use after teaching it more about my preferences and things on my mind. It learns very quickly to be most useful and it can take on surprisingly ambitious tasks on its own.\n\nWe’re learning from how you all use your primary dot before releasing the ability to create an entire team of them.", "created_at": "09-30 09:18", "likes": 4041, "reposts": 105, "replies": 1002, "views": 434522, "url": "https://x.com/thsottiaux/status/2105105086506840421", "author": "thsottiaux"}, {"id": "2105102820706058498", "text": "It was so nice to connect with so many of you in person at DevDay. Immaculate vibes from the crowd and fun to see so many build things throughout the day.", "created_at": "09-30 09:09", "likes": 2111, "reposts": 41, "replies": 234, "views": 234423, "url": "https://x.com/thsottiaux/status/2105102820706058498", "author": "thsottiaux"}, {"id": "2105102312167575701", "text": "I got community noted, but the note is wrong 😅\n\nYour primary dot is included in your plan and will be available 24/7. If you ask it to create a codex task for you, that one will be drawing usage as usual. But when your dot does work directly, that uses nothing and is all on top of your plans usage. In the future you will be able to increase the speed and allow your dot to have more bandwidth, this will be a paid feature, but the baseline functionality will always just be included in your plan.", "created_at": "09-30 09:07", "likes": 3309, "reposts": 116, "replies": 468, "views": 712708, "url": "https://x.com/thsottiaux/status/2105102312167575701", "author": "thsottiaux"}, {"id": "2105041299934187874", "text": "Full recap of all the announcements\n\nhttps://openai.com/index/devday-2026-recap/", "created_at": "09-30 05:05", "likes": 2048, "reposts": 189, "replies": 584, "views": 378085, "url": "https://x.com/thsottiaux/status/2105041299934187874", "author": "thsottiaux"}, {"id": "2105039816438227206", "text": "Proud of this. Open is the way.", "created_at": "09-30 04:59", "likes": 4366, "reposts": 115, "replies": 234, "views": 616776, "url": "https://x.com/thsottiaux/status/2105039816438227206", "author": "thsottiaux"}, {"id": "2105039500149948878", "text": "https://developers.openai.com/plugins/deploy/submission", "created_at": "09-30 04:58", "likes": 365, "reposts": 11, "replies": 33, "views": 146279, "url": "https://x.com/thsottiaux/status/2105039500149948878", "author": "thsottiaux"}, {"id": "2105039482013757749", "text": "Plugin discovery on ChatGPT leads to massive adoption opportunity. Open ecosystems will win.", "created_at": "09-30 04:58", "likes": 1921, "reposts": 48, "replies": 151, "views": 253215, "url": "https://x.com/thsottiaux/status/2105039482013757749", "author": "thsottiaux"}], "group": "openai"}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2105073692934091018", "text": "Want to catch up with everything?\n\nhttps://openai.com/index/devday-2026-recap", "created_at": "09-30 07:14", "likes": 31, "reposts": 2, "replies": 2, "views": 12638, "url": "https://x.com/OpenAIDevs/status/2105073692934091018", "author": "OpenAIDevs"}, {"id": "2105073680829366411", "text": "Plugin extensions let you build interactive panels, file viewers, and a sidebar home in ChatGPT.\n\nGet clearer feedback when submitting your plugin for review.\n\nWith support for the proposed MCP Events specification, events in connected apps can start automations in ChatGPT:\n\nhttps://developers.openai.com/plugins/build/extensions", "created_at": "09-30 07:14", "likes": 52, "reposts": 4, "replies": 6, "views": 14213, "url": "https://x.com/OpenAIDevs/status/2105073680829366411", "author": "OpenAIDevs"}, {"id": "2105073596611830252", "text": "Code faster, review changes, and keep parallel work moving.\n\n🧵 Here's a roundup of all the developer updates from OpenAI DevDay:", "created_at": "09-30 07:13", "likes": 759, "reposts": 38, "replies": 37, "views": 82343, "url": "https://x.com/OpenAIDevs/status/2105073596611830252", "author": "OpenAIDevs"}, {"id": "2105072331567866350", "text": "Plaid speed in Amp now runs GPT-6 Astra really really fast (6x speed).\n\nGreat for situations when you're in a hurry and willing to pay a premium. You can toggle it on/off in an existing thread.\n\nNote: ChatGPT subscriptions do not yet support this.", "created_at": "09-30 07:08", "likes": 91, "reposts": 6, "replies": 9, "views": 20851, "url": "https://x.com/beyang/status/2105072331567866350", "author": "beyang"}, {"id": "2105060234469495022", "text": "Factory is a launch partner for the OpenAI B2B Marketplace.\n\nEligible @OpenAI enterprise customers can now apply part of their existing OpenAI commitment toward Factory, driving engineering efficiency and accelerating software development with autonomous AI agents.", "created_at": "09-30 06:20", "likes": 103, "reposts": 5, "replies": 13, "views": 15726, "url": "https://x.com/FactoryAI/status/2105060234469495022", "author": "FactoryAI"}, {"id": "2105049335310520381", "text": "Register and complete the challenges in this Site:\n\nhttps://side-quests.openai.chatgpt.site/", "created_at": "09-30 05:37", "likes": 86, "reposts": 1, "replies": 10, "views": 20594, "url": "https://x.com/OpenAIDevs/status/2105049335310520381", "author": "OpenAIDevs"}, {"id": "2105049323239285110", "text": "Ready for a DevDay side quest?\n\n10 builder challenges.\n5 Codex Micros up for grabs.\n\nComplete any 5 side quests to earn 1 raffle ticket for each.\n\n48 hours. Join from anywhere 🌎", "created_at": "09-30 05:37", "likes": 768, "reposts": 63, "replies": 53, "views": 80292, "url": "https://x.com/OpenAIDevs/status/2105049323239285110", "author": "OpenAIDevs"}, {"id": "2105039887888154768", "text": "Codex X Gaming! ❤️‍🔥\n\nFirst look at the ModRetro Chromatic 🎮\n\nThe new @OpenAI handheld device we got at DevDay!", "created_at": "09-30 04:59", "likes": 438, "reposts": 32, "replies": 34, "views": 31757, "url": "https://x.com/lenadroid/status/2105039887888154768", "author": "lenadroid"}], "group": "openai"}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2104982629884063840", "text": "What do you want from AI?\n\nWe’re launching a new study with Anthropic Interviewer to learn more about your experiences using AI, what role you want it to play in your life and the world, and what you want function pdfUrl(u){
  const m = (u || '').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function codeLink(code){
  const m = (code || '').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);
  return m ? '<a href="https://github.com/' + esc(m[1]) + '" target="_blank" rel="noopener">💻 ' + esc(m[1]) + '</a>' : '';
}
function badges(p){
  const s = srcOf(p);
  let h = '<span class="badge ' + (SRC_CLS[s] || '') + '">' + esc(s) + '</span>';
  h += (p.cats || []).map(c => '<span class="badge cat">' +
    esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
  if (p.supplement) h += '<span class="badge cat">期刊/会议</span>';
  return h;
}
function card(p){
  const pdf = pdfUrl(p.url), ch = codeLink(p.code);
  const cite = (p.citations && p.citations !== '尚未收录')
    ? '<span>📊 引用 ' + esc(p.citations) + '</span>' : '';
  const links = (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文页面</a>' : '')
    + (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  return '<div class="card">'
    + '<div class="badges">' + badges(p) + '<span class="date">' + esc(p.date) + '</span></div>'
    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<details class="box zh"><summary>中文摘要</summary><div class="body">' +
        esc(p.zh_abs).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">' +
        esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + ((cite || ch) ? '<div class="meta-row">' + cite + (ch ? '<span>' + ch + '</span>' : '') + '</div>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}
function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){
  let html = '', n = 0;
  DATA.days.forEach(day => {
    if (state.day && day.date !== state.day) return;
    const ps = day.papers.filter(match);
    if (!ps.length) return;
    n += ps.length;
    html += '<div class="day"><div class="day-head"><h2>📅 ' + esc(day.date) + '</h2>'
      + '<span class="n">' + ps.length + ' 篇</span></div>';
    if (day.summary && !state.q && !state.src && !state.cat)
      html += '<div class="summary">' + esc(day.summary).slice(0, 600) + '</div>';
    html += '<div class="grid">' + ps.map(card).join('') + '</div></div>';
  });
  document.getElementById('list').innerHTML =
    html || '<div class="empty">没有匹配的论文，换个关键词或清除筛选试试。</div>';
  document.getElementById('count').textContent = '共 ' + n + ' 篇';
}

function renderDeadlines(){
  const ref = new Date((DL.updated || '2026-09-30') + 'T00:00:00');
  const items = (DL.items || []).map(d => {
    const dd = new Date(d.deadline + 'T00:00:00');

  box.innerHTML = html || '<div class="empty">今日暂无大佬动态数据。</div>';
}

render();
renderNews();
renderDeadlines();
renderTrending();
renderAgenda();
renderX();
showTab(('' + location.hash).slice(1) || 'papers');
</script>
