ds of Blue Collar Workers will be positively affected, BIG TIME, by the passage of this Bill. The amount of money spent on these Tax Incentives will be made up tenfold by the money pouring into the Treasury's coffers. Meetings are being set up, routinely, with the Leaders of both Parties in order to, GET THIS DONE! It is a very Bipartisan undertaking, especially in that so much of the money being lost to other countries is coming out of the Blue States. Hopefully Republicans and Democrats will get together and finalize this already very actively negotiated Legislation. It can be done quickly, accurately, efficiently and, importantly, will benefit all of America. MAKE OUR ENTERTAINMENT INDUSTRY GREAT AGAIN! President DONALD J. TRUMP（背景：会见演员 Jon Voight 后发文，力推两党影视税收抵免法案 Motion Picture, Television, and Entertainment Revitalization Act，要求国会尽快通过，把好莱坞制作带回美国；同日全美航班大面积停飞，他未就此表态）", "created_at": "11-14 06:30", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#20261114-film-incentive", "author": "realDonaldTrump"}, {"id": "20261113-vance-fraud", "text": "Vice President JD Vance and Republicans are doing a great job hunting down Fraud in the various States. Billions of Dollars is being found, and we've just started!（背景：赞扬万斯牵头的反欺诈行动，称已发现数十亿美元浪费）", "created_at": "11-14 00:00", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#20261113-vance-fraud", "author": "realDonaldTrump"}, {"id": "43567", "text": "[图片转发] Republican Party News 图片：BEST PRESIDENT IN THE HISTORY OF AMERICA.（背景：转发共和党新闻账号的自我宣传图片）", "created_at": "11-13 22:02", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#43567", "author": "realDonaldTrump"}, {"id": "20261113-democrats-corrupt-evil", "text": "THE DEMOCRATS ARE CORRUPT AND EVIL, and I am the exact opposite!（背景：当日清晨首帖之一，开启一连串抨击民主党的帖子）", "created_at": "11-13 21:31", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#20261113-democrats-corrupt-evil", "author": "realDonaldTrump"}, {"id": "20261113-tax-records", "text": "[发文回顾其首任期税单公开事宜，并重申不领取总统薪水]（背景：清晨帖子之一，内容据 Reality Tea 报道概述，原帖全文未获完整转载）", "created_at": "11-13 19:28", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#20261113-tax-records", "author": "realDonaldTrump"}, {"id": "20261113-tariff-video-fox", "text": "[视频转发] Fox News 播报：Trump threatens to double tariffs on Mexico if it does not halt migrants.（背景：转发福克斯新闻关于对墨关税威胁的报道视频）", "created_at": "11-13 19:22", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#20261113-tariff-video-fox", "author": "realDonaldTrump"}]}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2120581630196879460", "text": "(1/10) Today, we’re sharing new research from @OpenAI: How does CoT monitorability (no-CoT capability and CoT controllability) evolve over the model training lifecycle? \n\nWe emerged with unsurprising but sobering findings: as we scale toward more intelligent systems, models are becoming harder to monitor through their CoT. 🧵", "created_at": "11-12 02:17", "likes": 1429, "reposts": 186, "replies": 124, "views": 237104, "url": "https://x.com/jeffreygwang/status/2120581630196879460", "author": "jeffreygwang"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2118429823244935257", "text": "Today’s GPT-6 Cyber release is a meaningful step for defenders: stronger vulnerability research and better alignment. We’ve already been using GPT-6 Cyber alongside GPT-6 Astra with Daybreak to harden our own systems, finding weaknesses, validating their impact, and developing fixes.\n\nEven after years @OpenAI, model capabilities continue to surprise me. One small example came from testing a prerelease version of GPT-6 Astra earlier this summer. We were examining tools used across our research infrastructure and one of our research infra leads, Michael Dalton, was looking into some low risk areas like a math task grader that used SymPy, a mathematics library, to check answers.\n\nIn an offline test, the submitted answer used characters that looked like ordinary letters to get past the grader’s checks. It caused the grader to run a shell command that printed “4242”, while still returning the expected result, 1/2. The grader marked the answer correct. A valid math answer had become a way to run code inside the grader - diagram below.\n\nThis is the kind of vulnerability that can be very hard for a human to find, even with a fuzzer. It takes connecting how input validation and evaluation interact, constructing an input that passes the checks but triggers unintended behavior, and recognizing the failure even when the final answer is correct. Models can reason across those pieces and help uncover classes of vulnerabilities that are difficult to spot when reviewing components in isolation.\n\nThat’s why it’s important for more defenders to use models with Daybreak to find and fix vulnerabilities in their own systems. Whether it’s a potentially internet-melting bug like PHP2Shell or a subtle but important issue like this grader bug, finding it before an attacker does gives defenders time to act.\n\nOur goal is to dramatically expand Daybreak, bringing advanced security research to organizations of every size, independent researchers, and open-source maintainers.\n\nWe’re also expanding Daybreak Blue alpha access for GPT‑6 Astra to more organizations and individual security researchers - let us know if you’re interested:\nhttps://docs.google.com/forms/d/e/1FAIpQLSdQu8mNYXDpUW_0kRS6JBWBPMWfUjjxi6xLi8AkFPObLupkpg/viewform", "created_at": "11-06 03:46", "likes": 502, "reposts": 56, "replies": 44, "views": 113813, "url": "https://x.com/fouadmatin/status/2118429823244935257", "author": "fouadmatin"}, {"id": "2117794005165748448", "text": "People should always be in control of the future.\n\nOpenAI is against the notion that it would be acceptable for people to be relegated to a role of doing things that “AI systems think makes sense to reward in humans”.\n\nPeople should not cede control of the future to superintelligence, and that requirement should ultimately constrain AI progress.", "created_at": "11-04 09:40", "likes": 20781, "reposts": 1024, "replies": 6013, "views": 10745117, "url": "https://x.com/sama/status/2117794005165748448", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2121062974161092792", "text": "How can codex be improved? Try not to say model.", "created_at": "11-13 10:09", "likes": 9472, "reposts": 165, "replies": 12110, "views": 1883304, "url": "https://x.com/thsottiaux/status/2121062974161092792", "author": "thsottiaux"}, {"id": "2121036562058400200", "text": "We announced new tools we're developing for cybersecurity today across automated patching and automated red teaming. Watch the recording here https://openai.com/cyber-at-the-frontier/", "created_at": "11-13 08:24", "likes": 3203, "reposts": 156, "replies": 672, "views": 584460, "url": "https://x.com/thsottiaux/status/2121036562058400200", "author": "thsottiaux"}, {"id": "2120999993079451919", "text": "We shipped some good updates to dots today and the banked reset has been activated and should land in everyones accounts sometime soon!", "created_at": "11-13 05:59", "likes": 6664, "reposts": 245, "replies": 1618, "views": 963765, "url": "https://x.com/thsottiaux/status/2120999993079451919", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2121386540551036931", "text": "It’s beautiful! Time to get to work! 💪", "created_at": "11-14 07:35", "likes": 85, "reposts": 3, "replies": 7, "views": 13206, "url": "https://x.com/Ckowski4/status/2121386540551036931", "author": "Ckowski4"}, {"id": "2121256499552915586", "text": "What’s the best model for proactive agents?\n\nToday, we’re introducing the Agent Initiative Benchmark. We tested 12 frontier models on realistic workplace tasks inside a synthetic company with 6 years of highly detailed history: it has a financial model, CRM records, past-due invoices, Linear tickets, and real-life events affecting company development - competitor product announcements, SVB collapse, etc.\n\nWe used the company’s Slack to test how a proactive agent listening in on each conversation would assist the team in day-to-day tasks: from stepping in to align initiatives across teams to warning the team not to use an unapproved customer logo.\n\nHighlights:\n\n- 6.1 Sol and Astra from @OpenAIDevs beat Anthropic's latest Fable 5.2, with Sol crushing it at both performance and cost ($0.11 per task vs $1.87).\n- The most expensive models aren't the best: Fable 5.1 is 430x more expensive than GPT-6 Luna, with similar performance.\n- Most models try to help even if they're not needed. Interestingly, in these failure cases, they spend more time thinking, and the unnecessary work takes about 80% more time and money than if they stayed quiet.\n\nIf you’re building agents, keep reading for more tips on which model is best for your use case. Detailed breakdown, the open-source dataset, and benchmark code below:", "created_at": "11-13 22:58", "likes": 611, "reposts": 103, "replies": 95, "views": 326473, "url": "https://x.com/jakubjurovych/status/2121256499552915586", "author": "jakubjurovych"}, {"id": "2121208355310190759", "text": "I’m excited to take on the role of @OpenAI Codex Ambassador Regional Lead for Korea! 🇰🇷\n\nI’ve been part of the program since day one, and I’m looking forward to helping our ambassadors connect, share ideas, and build together.", "created_at": "11-13 19:47", "likes": 56, "reposts": 6, "replies": 5, "views": 5949, "url": "https://x.com/swhan0329/status/2121208355310190759", "author": "swhan0329"}, {"id": "2121188275490611334", "text": "The only way community scales is with community. I'm so excited to introduce you to our Codex Ambassadors regional leads! 🌍\n\nThey’re some of our top contributors, and what makes them exceptional is how much they give back. \n\nThey bring their local communities together, support builders around the world, and are the drivers that will help bring program to greater heights.\n\nThank you @maxjendrall, @mrlesk, @borvibe, @Andy_AJT, @dgrreen, @aileenvl, @aastroza, @RaygunIcecream, @yashrajnayak, @nukonuko, @brianchew, @dayvough, @thatsmyThucents for all that you do! Excited to build 🫡\n\nhttps://developers.openai.com/community/codex-ambassadors/directory#regional-leads", "created_at": "11-13 18:27", "likes": 212, "reposts": 23, "replies": 36, "views": 31031, "url": "https://x.com/paw_lean/status/2121188275490611334", "author": "paw_lean"}, {"id": "2121028549154885778", "text": "Giving my @OpenAIDevs dot total control over eight Raspberry Pi’s and an old MacBook Air so that I don’t have to use a smartphone anymore and can just tell the dot in plain English to do all the smartphone things for me, but without all the doomscrolling (also so that the blast radius of any shenanigans is relatively contained)\n\nEight Pis is probably overkill, but you can get them cheap by ripping them out of helium miners so why not.", "created_at": "11-13 07:53", "likes": 22, "reposts": 2, "replies": 0, "views": 6430, "url": "https://x.com/AaronCederberg/status/2121028549154885778", "author": "AaronCederberg"}, {"id": "2120925212493656164", "text": "Announcing Parallel for Startups:\n\nFree credits for teams at the frontier of the agentic web.\n\nAvailable today to founders and teams backed by @ycombinator, @speedrun, @neo, @joinef, @fdotinc, or @nullfellows.\n\nNot in a partner program? Apply at https://parallel.ai/startups?utm_source=twitter", "created_at": "11-13 01:02", "likes": 79, "reposts": 11, "replies": 2, "views": 16421, "url": "https://x.com/p0/status/2120925212493656164", "author": "p0"}, {"id": "2120886277113254257", "text": "fyi, eligible ChatGPT users can get a @Yubico bundle 46% off right now\n\njust go to this link: https://chatgpt.com/yubikey\n\nmy recommendation: use ChatGPT computer use to help set up your C Nano and C NFC\n\nthen throw the C NFC on your keys // Nano on mac/pc\n\nstay secure friends!", "created_at": "11-12 22:27", "likes": 718, "reposts": 55, "replies": 52, "views": 170688, "url": "https://x.com/nickbaumann_/status/2120886277113254257", "author": "nickbaumann_"}, {"id": "2120859153711222927", "text": "Proud to have people like @laraavci_ in our Codex Ambassador program, absolute star!", "created_at": "11-12 20:40", "likes": 124, "reposts": 6, "replies": 2, "views": 23385, "url": "https://x.com/paw_lean/status/2120859153711222927", "author": "paw_lean"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2121317227618340990", "text": "Safety evaluations are critical for understanding whether a model is ready to deploy, which safeguards to build for it, and where to focus training and research.\n\nOn our Engineering Blog, we offer 10 recommendations for how to design, run and report them.\n\nhttps://www.anthropic.com/research/building-strong-safety-evaluations", "created_at": "11-14 03:00", "likes": 1932, "reposts": 171, "replies": 375, "views": 191634, "url": "https://x.com/AnthropicAI/status/2121317227618340990", "author": "AnthropicAI"}, {"id": "2121272083863011714", "text": "Streaming live at 12 PM ET: A fireside chat with JPMorgan her forecasting.", "created_at": "11-14 00:35", "likes": 46, "reposts": 6, "replies": 2, "views": 13672, "url": "https://x.com/PeterWBattaglia/status/2121280736296567039", "author": "PeterWBattaglia"}, {"id": "2121229780573888544", "text": "These datasets make it easier for teams to tackle real-world problems - from being able to issue more accurate flood warnings in regions without ground radar to tracking wildfire smoke and solar energy.\n\nExplore the data on @GoogleCloud Storage and Earth Engine →  https://goo.gle/4C0v496", "created_at": "11-13 21:12", "likes": 62, "reposts": 5, "replies": 1, "views": 15001, "url": "https://x.com/GoogleDeepMind/status/2121229780573888544", "author": "GoogleDeepMind"}, {"id": "2121229777835089974", "text": "What’s under the hood:\n🌧️ PARDIG: Estimates global rainfall every 15 minutes, while improving precipitation detection skill by more than 30%.\n🛰️ SatWeave: Combines several geostationary satellites into one live view of Earth’s clouds and storms every 60 minutes.", "created_at": "11-13 21:12", "likes": 76, "reposts": 4, "replies": 8, "views": 17559, "url": "https://x.com/GoogleDeepMind/status/2121229777835089974", "author": "GoogleDeepMind"}, {"id": "2121229774865527097", "text": "Accurate weather forecasting starts with how clearly we can observe the atmosphere in real-time. 🌍\n\nThat’s why we’re releasing PARDIG and SatWeave - the foundational datasets behind WeatherNext 3 - to help researchers and developers build new climate applications 🧵", "created_at": "11-13 21:12", "likes": 566, "reposts": 81, "replies": 157, "views": 52501, "url": "https://x.com/GoogleDeepMind/status/2121229774865527097", "author": "GoogleDeepMind"}, {"id": "2120940342505566438", "text": "Now rolling out for:\nDevelopers: Build with the Gemini API in @GoogleAIStudio and Android Studio, and in Google @Antigravity for paid Google AI Pro and Ultra subscribers.\nEnterprises: Deploy via Gemini for business and Google @Antigravity\nEveryone: Access it in Google Search and the @Geminiapp model dropdown.\n\nSee the details → https://goo.gle/4zDCs8N", "created_at": "11-13 02:02", "likes": 302, "reposts": 18, "replies": 16, "views": 49322, "url": "https://x.com/GoogleDeepMind/status/2120940342505566438", "author": "GoogleDeepMind"}, {"id": "2120940338869055788", "text": "Meet Gemini 4 Hydrogen: built for rapid coding, multimodal synthesis, and everyday workflows.\n\nIt finishes tasks 2.5x faster than 3.8 Flash and surpasses Argon on the @ArtificialAnlys Intelligence Index.", "created_at": "11-13 02:02", "likes": 7082, "reposts": 588, "replies": 400, "views": 1391263, "url": "https://x.com/GoogleDeepMind/status/2120940338869055788", "author": "GoogleDeepMind"}, {"id": "2120841927834968215", "text": "Watch → https://goo.gle/3Vgj7LX\nSpotify → https://goo.gle/4zRA8Lt\nApple Podcasts → https://goo.gle/4BZEaTx\n\nOr listen wherever you get your podcasts! 🎧", "created_at": "11-12 19:31", "likes": 37, "reposts": 1, "replies": 7, "views": 34364, "url": "https://x.com/GoogleDeepMind/status/2120841927834968215", "author": "GoogleDeepMind"}, {"id": "2120841923237683462", "text": "Finding the exact genetic cause of a rare disease is like looking for a needle in a haystack. 🪡\n\nOn our podcast, @fryrsquared explores with @Avsecz and  @adamgayoso how AlphaGenome 2 helps scientists test millions of DNA changes to find vital clues for human health.\n\nTimecodes:\n00:00 Introduction to AlphaGenome\n04:01 Genotype, Phenotype & DNA\n08:30 Transformers to AlphaGenome\n12:11 Mapping the Genome\n17:45 Rare disease cases\n21:10 AlphaGenome 2\n30:06 Future vision\n38:45 Hannah's thoughts", "created_at": "11-12 19:31", "likes": 632, "reposts": 74, "replies": 124, "views": 192466, "url": "https://x.com/GoogleDeepMind/status/2120841923237683462", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2121404249712300209", "text": "When we started building Intelligent Eyewear on Android XR with @SamsungMobile, @WarbyParker & @_GentleMonster_, our goal was simple: glasses you actually want to wear all day, helpful hands-free Gemini, and privacy from day one.\n\nGreat seeing first reactions roll in 👇", "created_at": "11-14 08:46", "likes": 223, "reposts": 9, "replies": 22, "views": 38502, "url": "https://x.com/rosterloh/status/2121404249712300209", "author": "rosterloh"}, {"id": "2121338095664808238", "text": "What we shipped this week @google \n\nMonday: Two new 8th-gen TPUs\nTuesday: Gemini 4 Carbon\n- AlphaProof Code verified Signal protocol\n- Gemini Robotics 2.5\nWednesday: AlphaGenome 2 for disease research\n- Gemini Decisions API in AI Studio\nThursday: Gemini 4 Hydrogen\n- intelligent eyewear pre-orders\nFriday: U2 new album (ok not us but exciting!)\n\nonwards!", "created_at": "11-14 04:23", "likes": 10485, "reposts": 559, "replies": 581, "views": 722668, "url": "https://x.com/sundarpichai/status/2121338095664808238", "author": "sundarpichai"}, {"id": "2121263753006374997", "text": "For the first time in a very long time, we have a non-OpenAI model as #1 on MathArena! Gemini 4 Carbon takes over the first place from GPT-6.1 Sol, with Fable 5.2 taking #2.", "created_at": "11-13 23:27", "likes": 1373, "reposts": 104, "replies": 51, "views": 120337, "url": "https://x.com/j_dekoninck/status/2121263753006374997", "author": "j_dekoninck"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2121161030751694873", "text": "#3 on the Artificial Analysis Cyber Index and #1 on CWE-Bench-AA 🎉🎉🎉", "created_at": "11-13 16:39", "likes": 175, "reposts": 5, "replies": 12, "views": 10691, "url": "https://x.com/TencentHunyuan/status/2121161030751694873", "author": "TencentHunyuan"}, {"id": "2120478188648472754", "text": "Hy4 on OpenRouter", "created_at": "11-11 19:26", "likes": 86, "reposts": 6, "replies": 7, "views": 6700, "url": "https://x.com/TencentHunyuan/status/2120478188648472754", "author": "TencentHunyuan"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": [{"id": "2121247907076813077", "text": "🌱 More possibilities, ready to build\n\nThe DeepSeek App is just one way to interact with AI. Its capabilities are now yours to call and combine freely. Spend less time rebuilding the basics and more time creating something new.\n\nBuild with DeepSeek. Let your imagination lead.\n\n4/4", "created_at": "11-13 22:24", "likes": 249, "reposts": 3, "replies": 6, "views": 42389, "url": "https://x.com/deepseek_ai/status/2121247907076813077", "author": "deepseek_ai"}, {"id": "2121247903603941471", "text": "💰 API pricing\n\nExtended capabilities incur tool usage fees in addition to standard token charges.\nSee the tool pricing breakdown below.\n\n3/4", "created_at": "11-13 22:24", "likes": 445, "reposts": 21, "replies": 11, "views": 64184, "url": "https://x.com/deepseek_ai/status/2121247903603941471", "author": "deepseek_ai"}, {"id": "2121247896918253875", "text": "🚀 The full DeepSeek App experience, now via API\n\nSearch, files, links, safety, and voice. The capabilities behind the DeepSeek App are now available through the DeepSeek API.\nEnable built-in features with a few parameters, or call standalone APIs such as OCR, ASR, and TTS. Build richer conversations or recreate the full DeepSeek App in your own application.\n\nTry our open-source frontend demo, with support for importing DeepSeek conversation history.\n\n🔗 Demo: https://cdn.deepseek.com/chat-demo\n📦 Code: https://github.com/deepseek-ai/chat-demo\n📖 Details: https://api-docs.deepseek.com/guides/build_a_chatbot\n\n1/4", "created_at": "11-13 22:24", "likes": 6795, "reposts": 558, "replies": 306, "views": 502925, "url": "https://x.com/deepseek_ai/status/2121247896918253875", "author": "deepseek_ai"}]}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2118784042883502240", "text": "Moonshot just dropped Kimi K3.1 Pro. We used it to speed run online shopping.\n \nOne prompt → monitor found → checkout → order confirmed. \n\n11.5 seconds.\n\nWatch @Kimi_Moonshot K3.1 Pro in action, accelerated by Cerebras.", "created_at": "11-07 03:14", "likes": 926, "reposts": 73, "replies": 64, "views": 115322, "url": "https://x.com/cerebras/status/2118784042883502240", "author": "cerebras"}, {"id": "2118025552963493935", "text": "Day 0 support: Kimi K3.1 Pro on AMD Instinct MI355X\n\n2.8T params, 1M context, open weights. Runs on 8x MI355X with ATOM and vLLM.\n\nRecipes, kernels and benchmarks: https://www.amd.com/en/developer/resources/technical-articles/2026/kimi-k3-1-pro-on-amd-instinct-gpus.html?utm_campaign=thallosocial&utm_source=twitter&utm_medium=organic_social&utm_content=kimi+day+0", "created_at": "11-05 01:00", "likes": 83, "reposts": 8, "replies": 11, "views": 16878, "url": "https://x.com/AIatAMD/status/2118025552963493935", "author": "AIatAMD"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875758904795344896/U3CqYUFY_400x400.jpg", "tweets": []}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2064231947149377536/Ab70PxT5_400x400.jpg", "tweets": []}, "MiniMax_AI": {"name": "MiniMax", "label": "MiniMax 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_400x400.jpg", "tweets": [{"id": "2120932554056540634", "text": "H3 Image by MiniMax is live in HyperFrames Studio\n\n- 16 million pixel images\n- under 10 seconds each\n- precise prompt following and editing\n- up to 16 reference images\n\nuse it for video assets, or generate a frame and bring it to life with an image-to-video model", "created_at": "11-13 01:31", "likes": 194, "reposts": 8, "replies": 13, "views": 11155, "url": "https://x.com/HyperFrames_/status/2120932554056540634", "author": "HyperFrames_"}, {"id": "2120801832150696318", "text": "If your creative work moves fast, these two will keep up with you ⚡ @MiniMax_AI H3 Image and H3 Image Highspeed are live on Picsart, with 4K generation and editing in around 10 seconds and native ~16 MP output at any aspect ratio 🖼️\n\nThey also handle the details that usually slow things down, from multi-reference editing to long prompts and dense text for posters, infographics and UI screens 📝 Gaming, 3D and e-commerce creators, this one’s especially for you 🎮\n\nTry here 👉 http://tinyurl.com/ye28pmcu", "created_at": "11-12 16:52", "likes": 122, "reposts": 1, "replies": 7, "views": 16230, "url": "https://x.com/Picsart/status/2120801832150696318", "author": "Picsart"}, {"id": "2120632214656594091", "text": "After experiencing immersive film firsthand in August, I became determined to bring this concept to life.\n\nPowered by MiniMax H3’s sota open-weight capabilities, fal & SGLang’s inference optimizations, and Pickford’s Emmy-winning creative expertise, we’ve made something special happen: Live Film - where audiences can direct the story and shape how it unfolds in real time.\n\nWe’re kicking off our global screening tour, with SGLang Summit as the first stop🥰Come experience the future of AI-powered interactive content firsthand!\n\nStay tuned guys!!!🥃", "created_at": "11-12 05:38", "likes": 37, "reposts": 2, "replies": 2, "views": 4055, "url": "https://x.com/RenLeanna/status/2120632214656594091", "author": "RenLeanna"}, {"id": "2120593294933819491", "text": "Start with a sketch. One product, every scene. Exactly as you prompt it.\n\nStudio shot to lifestyle campaign, consistent in every frame. That's MiniMax H3 Image for e-commerce and ad creative at scale.\n\nThanks @eachlabs for showing it so beautifully ♥️ #H3Image", "created_at": "11-12 03:03", "likes": 90, "reposts": 8, "replies": 19, "views": 9468, "url": "https://x.com/MiniMax_AI/status/2120593294933819491", "author": "MiniMax_AI"}, {"id": "2120540933741834273", "text": "Modern subjects in traditional artistic languages.  \n\nPrompt: Translate exterior maintenance on a modern space station into a Tang-dynasty Dunhuang-style earthen-wall mural in rich mineral pigments. The image is a flat wall painting, not a space movie. At the center, a technician resembling a flying apsara reaches sideways toward a solar-panel pivot, wearing a simplified modern safety vest over wide sleeves, with long ribbons forming two flowing arcs behind them. A companion at the lower left passes a tool to the main figure, while another at the upper right steadies a folded solar panel. All three direct their hands and eyes toward the same pivot. Clear, fine safety lines connect the figures to the station wall; ribbons and safety tethers each follow distinct paths and must not merge into tangled lines. The station consists of an ocher-white cylinder and a few geometric planes, with solar panels rendered as small azurite-blue squares. Make the modern facilities recognizable without smooth metal or realistic space lighting. Use Tang-mural-style linework for faces and clothing folds, light bodily contours, and overlapping forms instead of precise perspective. Render Earth at the side as a muted malachite-green disc. Keep the background earthen ocher with a few traditional scrolling clouds and star dots. Balance cinnabar red, azurite blue, malachite green, and warm white. Show mineral grains and slight natural wear in the paint layers, with locally exposed wall substrate rather than a uniform crackle filter. Organize movement through ribbons, panel wings, and the cylinder. Make the main figure large and the helpers slightly smaller, leaving open wall areas that breathe like blank paper. No sci-fi armor, blue volumetric light, photographic starfields, subtitles, trademarks, inscriptions, or seals.", "created_at": "11-11 23:35", "likes": 9, "reposts": 0, "replies": 0, "views": 2583, "url": "https://x.com/MiniMax_AI/status/2120540933741834273", "author": "MiniMax_AI"}, {"id": "2120538314876817515", "text": "16 reference images in a single generation.\n\nUseful for asset arrangement, spatial composition, product packaging, and more.", "created_at": "11-11 23:25", "likes": 2, "reposts": 0, "replies": 0, "views": 819, "url": "https://x.com/MiniMax_AI/status/2120538314876817515", "author": "MiniMax_AI"}, {"id": "2120538313383669950", "text": "Turning knowledge into visuals. H3-Image converts complex information into diagrams and posters.\n\nSomething harder? Turn a lengthy case narrative into a single evidence board, with timelines, positions, and testimonies grouped, annotated, and connected all in one frame. \n\nPrompt: Create a detective case reasoning board to solve the following puzzle:\nConfidential documents have been stolen from a safe. Exactly one of six suspects, A, B, C, D, E, and F, acted alone. Each makes one statement:\nA: “The culprit is B or C.”\nB: “D is not the culprit.”\nC: “A's entire statement is false.”\nD: “The culprit is E or F.”\nE: “Exactly one of B's and D's statements is true, and the other is false.”\nF: “A is not the culprit.”\nExactly three of the six statements are true and three are false. “Or” means at least one is true, and all references refer to the statements above.\nFind the unique culprit and create a complete evidence board: show six letter-labeled suspect portraits and their exact statements, mark each statement true or false, and highlight the culprit. Include a concise verification table showing the number of true statements under each of the six possible culprit assumptions. Use connecting lines to show which statements refer to others, ensuring the portrait labels, reasoning, and table are consistent.\nDo not add motives, alibis, accomplices, or extra evidence, and do not treat appearance or expression as clues. Use a cinematic film-noir detective style, with clear, in 16:9 landscape format.", "created_at": "11-11 23:25", "likes": 1, "reposts": 0, "replies": 2, "views": 903, "url": "https://x.com/MiniMax_AI/status/2120538313383669950", "author": "MiniMax_AI"}, {"id": "2120538308925128843", "text": "A little dreamcore for your workday.\nFrom creator. \n\nPrompt: A surrealist photograph with intense poetic sensibility and quiet absurdity, fusing Dreamcore aesthetics, minimalist conceptual photography, vintage film texture, and contemporary fine-art photography.\nIn the middle of a boundless sea of white daisies, a middle-aged man in a light blue shirt and dark trousers sits alone on a modern office chair, diligently working at an old-fashioned CRT desktop computer.\nIn front of him sits a clean, deep blue-gray office desk, holding a heavy vintage computer monitor, a keyboard, and a few sparse office items.\nHis expression is calm and focused, as if entirely unaware of the strangeness of his surroundings. His posture is natural, with no exaggerated performance or forced humor.\nThe desk and chair are placed directly in the center of the flower field, with no surrounding office, road, or man-made structure — only an endless expanse of white daisies stretching to the horizon.\nThe composition is minimal and strongly symmetrical, shot from a distance. The figure and desk sit slightly below center, occupying only a small portion of the frame.\nThe flower field extends from the foreground all the way to the far horizon, where densely packed white daisies form a continuous, finely textured carpet.\nThe horizon line falls roughly one-third from the top of the frame, allowing the sky to occupy a large area of negative space — a soft, clean pale blue, free of complex cloud formations.\nWarm late-afternoon sunlight enters const FIN = {"date": "2026-11-14", "md": "# ☀️财经大事早报 · 2026-11-14\n\n## 📌今日大势\n\n### 1. 黄仁勋辞职：英伟达 33 年创始人时代终结，AI 叙事的最大单一风险兑现\n英伟达 11 月 12 日宣布，联合创始人黄仁勋即日起辞去总裁、首席执行官及董事职务，结束 33 年的执掌；CFO Colette Kress 兼任临时 CEO，前 Synopsys 总裁 Harvey C. Jones 出任董事会史上首位主席。公司声明未说明辞职原因；据路透社等报道，辞职与近期婚外情指控有关，其中一名女性被美国情报机构认为系中国招募的间谍，董事会 11 月 8 日已就此启动独立调查。**股价当日盘中一度暴跌 14%，收盘跌 4.3%，本周累计跌约 11%，较 10 月历史高点回落约 29%**；周五盘前反弹约 2.7%。**为什么重要**：黄仁勋不只是 CEO，他是英伟达“AI 基础设施总设计师”的化身——技术路线、客户关系与资本开支叙事都系于一人；他的离开把“关键人风险”从理论变成了财报季前最大的不确定性。**后续盯什么**：11 月 17 日英伟达 2027 财年 Q3 财报（按原定时间举行）——这是新管理层第一次面对市场；以及正式继任人搜索（Arm CEO Rene Haas 已被接洽）；还有黄仁勋名下约 1,350 亿美元持股的去向。（来源：NPR、路透社、FT）\n\n### 2. 微软 365 全球宕机近 24 小时：云办公的单点故障再敲警钟\n11 月 12 日 Exchange Online 出现连接故障，随后波及 Outlook、Teams、SharePoint、OneDrive 与 Copilot 等 Microsoft 365 服务的部分功能，多国用户无法正常访问；微软称故障源于部分基础设施与服务器连接问题，正在调整网络流量并恢复服务，**截至 11 月 13 日仍有部分用户受影响、未宣布全面恢复**。微软公开致歉，专家称这是“世界对少数几家大型科技供应商的依赖有多深”的 stark reminder。**为什么重要**：这是全球办公基础设施的系统性事件——邮件、日程、协作与 AI 助手同时失灵，且与英伟达风波同日叠加，放大了科技股的波动；微软股价周五盘前跌逾 2%。**后续盯什么**：微软何时宣布全面恢复、是否公布根因（目前只说“通信/基础设施问题”），以及企业客户是否会重新评估单一云办公供应商的集中度风险。（来源：BBC World）\n\n### 3. 美债创“解放日”以来最差一周，AI 债市开始“噎住”\n美国国债录得自特朗普“解放日”以来最差一周；FT 同时警告“债市开始被 AI 债务噎住”——AI 基建的资本开支正以前所未有的速度变成债券供给。**为什么重要**：两件事合流说明 AI 繁荣的融资端正在收紧：10 月 PPI 同比 6.5%（2022 年 11 月以来最高）让 12 月加息预期升温，而 AI 公司的发债规模又在推高期限溢价；股与债同时承压时，AI 交易的“只涨不跌”假设第一次受到双向检验。**后续盯什么**：12 月 8–9 日美联储议息（25 个基点加息已被市场基本定价）、英伟达 11 月 17 日财报对 AI 资本开支的表态，以及 AI 相关新债发行的认购情况。（来源：FT Markets）\n\n## 💰宏观与政策\n\n- **FAA 全国停飞所有离港航班：911 以来第二次**。美国联邦航空管理局 11 月 13 日美东 15:54 下令全国停飞所有离港航班，原因是影响全部 22 个空中交通管制中心的通信故障；已在空中的航班获准降落，国际入境航班个案处理。FlightAware 数据显示初期近 7,000 架次延误或取消，随后扩大至取消逾 1,000 班、延误近 1 万班；国土安全部称目前无迹象表明是网络攻击，定性为电信故障。路透社称这是 911 事件以来第二次全国停飞。截至发稿 FAA 未宣布解除时间。**（来源：FT Home、路透社）** [链接](https://www.ft.com/content/c9b119ff-d1da-46a7-b2b3-4ad0544fff6b?syn-25a6b1a6=1)\n- **美国 10 月 PPI 同比 6.5%，创 2022 年 11 月以来最高**。劳工统计局 11 月 13 日公布：10 月 PPI 环比 +0.3%（低于预期的 +0.4%，9 月上修至 +1.4%），同比 +6.5%（低于预期的 +6.6%，9 月为 +6.3%）；剔除食品、能源与贸易服务的核心 PPI 环比 +0.5%、同比 +4.9%。分项看商品 +0.5%（食品 +1.3%）、服务 +0.2%，卡车运费 +3.9% 而柴油 -7.9%。本周稍早的 10 月 CPI 环比 +0.4%，高于预期的 +0.3%。**这是 12 月议息前最后一份通胀数据**：月度放缓给了市场喘息，但同比 6.5% 说明生产端通胀压力仍在高位，12 月加息 25 个基点已被市场基本定价。**（来源：搜索补漏·路透社/ActionForex）** [链接](https://www.actionforex.com/live-comments/660801-us-ppi-slows-sharply-to-0-3-but-underlying-price-pressures-stay-firm/)\n- **芯片出口管控内讧：财长公开指责商务部长，议员施压、中国警告**。美国财长贝森特公开指责商务部长卢特尼克的部门未能把 Megaspeed 列入黑名单；与此同时美国议员就芯片出口管控问题向卢特尼克施压，而中国警告美国不要以黄仁勋之事为借口收紧技术出口限制。**三方同日发声说明黄仁勋辞职已从公司治理事件升级为出口管制政治**：白宫内部对华强硬派与务实派的分歧公开化，而中国 AI 股抛售加深正是对“更严限制”的定价。**（来源：FT Home、FT中文网）** [链接](https://www.ft.com/content/ce6d292e-eaaa-4c23-b909-34276e1a1e8d?syn-25a6b1a6=1)\n\n## 📈市场与投资\n\n- **美股 11 月 12 日三指数齐跌，科技股领跌**。道指 -0.36%、标普 500 -0.35%、纳指 -0.39%；黄仁勋辞职与微软 365 宕机是当日两大拖累。周五盘前期货小幅回升（道指期货 +0.16%、标普 +0.28%、纳指 100 +0.19%）。**（来源：搜索补漏·TradingKey）** [链接](https://www.tradingkey.com/analysis/stocks/us-stocks/262304609-nvda-nvidia-msft-us-ppi-tradingkey)\n- **英伟达股价：盘中 -14%、收盘 -4.3%、周跌约 11%、较 10 月高点 -29%**。辞职消息后 NVDA 盘中一度暴跌 14%，周四收盘跌 4.3%，本周累计跌约 11%，较 10 月历史高点回落约 29%；周五盘前反弹约 2.7%。FT 另有专栏追问“辞职前做空英伟达赚了 2 亿美元的是谁”，以及“该给英伟达估值、而不是给黄仁勋估值”。**（来源：FT Markets、搜索补漏）** [链接](https://www.coindesk.com/zh/markets/2026/11/12/nvidia-shares-plunge-10-as-jensen-huang-resigns)\n- **中国 AI 企业股价大跌：出口限制担忧加深抛售**。FT 称中国 AI 抛售因市场担心美国收紧英伟达芯片出口限制而加深；FT中文网同题报道指出英伟达风波已传导至中国 AI 板块。黄仁勋辞职的政治化（间谍指控 + 董事会调查）让“更严限制”从传闻变成可交易的预期。**（来源：FT Markets、FT中文网）** [链接](https://www.ft.com/content/0d4e93e4-895e-4ae0-a01b-833a3ed440a8?syn-25a6b1a6=1)\n- **全球油市转向过剩：海湾出货反弹**。FT Markets 称随着海湾地区出货反弹，全球石油市场转向供应过剩。结合 10 月 PPI 中柴油价格 -7.9%，能源价格是本轮通胀数据中少有的拖累项；但油市过剩与地缘（俄罗斯柴油出口翻倍，见公司与产业）并存，价格方向仍看需求。**（来源：FT Markets）** [链接](https://www.ft.com/content/20b68fe2-9d60-4c0c-b714-1f3e03015823?syn-25a6b1a6=1)\n\n## 🏠房价洞察\n\n- **10 月百城价格指数：新房涨、二手跌，分化仍是主线**。中指研究院数据显示，10 月全国 100 城新建住宅均价 17,316 元/平方米，环比 +0.18%、同比 +2.02%；二手住宅均价 12,376 元/平方米，环比 -0.61%（跌幅较上月扩大 0.01 个百分点）、同比 -6.72%；50 城住宅平均租金 33.87 元/平方米/月，环比 -0.28%、同比 -2.02%。**（来源：搜索补漏·中指研究院/中讯社）** [链接](https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html)\n- **二手房成交持续放量：18 城同比 +18%、重点 20 城 +20%**。10 月 18 城二手房成交量同比增长 18%；重点 20 城二手房 10 月成交量同比上涨 20%，增速较 9 月明显抬升；上海 10 月二手房网签超 2.4 万套、环比 +4%（截至 10 月 20 日成交 1.41 万套、同比 +37.9%）。**成交在先、价格在后**：量先起来是贴息政策见效的直接证据，但二手均价仍在环比下跌，说明放量主要靠以价换量。**（来源：搜索补漏·中指研究院/证券日报）** [链接](https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html)\n- **新房：销售面积同比 -15%，但均价 15 个月来首次同比上涨**。10 月 100 城新房销售面积同比下降约 15%（重点 100 城新建住宅成交面积约 1,600 万平方米，环比 -7%），其中一线城市增长 4%；但全国新建住宅均价（成交金额/成交面积）同比上涨 0.2% 至 10,072 元/平方米，为 15 个月来首次上涨；9 月环比上涨的城市 17 座，为年内第二高，上海（+2.8%）、杭州（+1.8%）等 5 城新房价格同比转正。**（来源：搜索补漏·易居研究院/虎嗅）** [链接](https://www.huxiu.com/article/4900471.html)\n- **政策：房贷贴息满月，17 城出台 8·28 新政细则**。9 月 29 日三部委房贷贴息政策（首套、≤120 平方米、总价 ≤150 万元，年化 1% 贴息 5 年）已满月，银行系统改造落地，购房者已可查询具体贴息金额；深圳总价 150 万元以内二手房成交占比升至 21.5%。截至 10 月末已有 17 城发布 8·28 新政实施细则（北京、上海、广州在 9 月末已出）；发改委 10 月 20 日表态抓好降低抵押补充贷款利率、增加再贷款额度、居民购房贷款贴息等增量政策落地。地方上深圳、天津、杭州、东莞新增公积金装修与物业费提取，杭州多孩家庭贷款额度上浮比例由 50% 提至 60%、上限 324 万元。**（来源：搜索补漏·中指研究院/证券日报）** [链接](https://news.szhome.com/394318.html)\n\n### 🔍深度分析：分化格局、一线与低线差异、政策真实意图、对购房者的实操含义、后续盯什么\n\n**分化格局**：10 月数据的关键词是“新房涨、二手跌、一线稳、低线弱”。新房均价同比转正靠的是核心城市优质楼盘集中入市拉高结构，而非普涨；二手均价环比 -0.61%、同比 -6.72%，跌幅还在扩大。**一线与低线差异**：一线城市二手房自 3 月起持续环比上涨，上海 9 月二手房率先同比转正、10 月网签超 2.4 万套，是全国唯一量价齐升的一线；但 70 城口径下多数城市仍在下跌，常州、台州、金华、西安、珠海等 70 个城市二手跌幅在 5%–10% 之间。**政策真实意图**：9 月 29 日贴息只补首套、≤120 平方米、总价 ≤150 万元——瞄准的是刚需而非投资；发改委“抓好增量政策落地”的表态说明政策重心仍在“让已出台的政策见效”，而非加码。**对购房者的实操含义**：一线核心区二手房已出现趋势性上涨信号，刚需可按贴息条件（总价 150 万以内）锁定筹码；但三四线与非核心区仍在以价换量，不宜把一线的回暖读成全国拐点；新房方面 10 月 300 城土地平均溢价率仅 1.49%（近年新低），说明房企拿地极度谨慎，未来新房供给会收缩。**后续盯什么**：11 月 70 城房价数据（12 月中旬公布）看一线二手同比转正是否扩散；高盛的判断值得留意——其测算 2026 年底全国未售住宅库存 65 亿平方米中有 34% 是无效供给，预测一线城市 2028 年前出现明显新房匮乏、上海深圳到 2028 年累计上涨 20%（为机构预测，非事实）；以及年底房企推盘促销对新房成交的支撑力度。\n\n## 🤖AI经济\n\n- **Anthropic IPO：CEO 称“不太担心”市场动荡，但 FT 追问“什么能让 IPO 脱轨”**。Anthropic CEO Amodei 在市场动荡前夕接受采访，称对 IPO 前的市场波动“不太担心”；FT 另文追问 IPO 的潜在变数。Anthropic 是本轮 AI 资本开支叙事的另一极——若其 IPO 在英伟达风波后仍能顺利定价，将证明市场区分“个股风险”与“行业风险”；反之则说明 AI 情绪已系统性转弱。**（来源：FT Home、FT Markets）** [链接](https://www.ft.com/content/4b7b83d7-7fea-4ce2-bfe3-4f2cf75b1d82?syn-25a6b1a6=1)\n- **Nscale：350 亿美元 IPO 前警告需要更多现金**。英国 AI 基建商 Nscale 在 350 亿美元 IPO 前警告需要更多现金。AI 基建的烧钱速度正在成为公开市场的显性问题——与“债市开始被 AI 债务噎住”同日出现，说明融资端压力已从二级市场传导到一级市场。**（来源：FT Home）** [链接](https://www.ft.com/content/8d5a8642-d0a1-458d-aaa4-c1e7d344fe47?syn-25a6b1a6=1)\n- **英伟达接班人搜索：Arm CEO Rene Haas 已被接洽**。FT 称 Arm 首席执行官 Rene Haas 已在英伟达 CEO 搜索中被接洽。Arm 与英伟达同属 AI 芯片产业链核心，接洽 Haas 说明董事会优先考虑“懂芯片 + 懂生态”的产业内人选，而非纯职业经理人；但 Haas 是否愿意离开 Arm 仍是未知数。**（来源：FT Home）** [链接](https://www.ft.com/content/2a64f698-46dd-4178-a3f4-4c5f4c0a0926?syn-25a6b1a6=1)\n- **投资者称：AI 繁荣在黄仁勋离任后仍将托住英伟达**。FT 引述投资者称，即使黄仁勋离任，AI 繁荣仍将支撑英伟达；FT 首页亦称“AI 信徒在英伟达风波后坚守阵线”。市场正在把“黄仁勋风险”与“AI 需求风险”拆开定价：前者是人事与治理，后者看 11 月 17 日财报中的数据中心收入与指引。**（来源：FT Markets、FT Home）** [链接](https://www.ft.com/content/ecb2b4ed-1b61-4c8a-a2e7-a6f9c85a59ff?syn-25a6b1a6=1)\n\n## 🏢公司与产业\n\n- **俄罗斯柴油出口翻倍：特朗普解除制裁后，美国一滴也拿不到**。FT 称特朗普解除制裁后俄罗斯柴油出口翻倍，但美国分不到任何份额。制裁解除的红利流向了其他买家，说明能源制裁的松绑首先改变的是贸易流向、而非美国国内供给。**（来源：FT Markets）** [链接](https://www.ft.com/content/525b53ee-4817-4eb6-8292-b6ee0ac45b47?syn-25a6b1a6=1)\n- **挪威在油田气候案中败诉**。挪威在一宗具有里程碑意义的气候诉讼中败诉，涉及油田开发的合法性。判决对欧洲最大产油国的能源政策有直接约束，也会影响北海油田新项目的审批节奏。**（来源：FT Markets）** [链接](https://www.ft.com/content/8535fe3e-f48b-43ac-b14c-946cd5aa1d51?syn-25a6b1a6=1)\n- **Kalshi 与小特朗普切割：中期选举横扫后的站队**。预测市场平台 Kalshi 在民主党中期选举横扫后，断绝了与小特朗普的关系。政治风向变化正在直接改写企业的政治站队与商业关系。**（来源：FT Markets）** [链接](https://www.ft.com/content/1352ac24-bdd6-4093-9ebd-7b27b6fd29d3?syn-25a6b1a6=1)\n\n## 🌍全球大事\n\n- **普京提高和谈要价：四州 + 北约东扩旧账，欧盟称之为“陷阱”**。BBC 驻俄记者 Rosenberg 报道，普京在与特使 Witkoff、Kushner 的莫斯科会谈中提高了对乌和谈的要求：坚持四州（顿涅茨克、卢甘斯克、扎波罗热、赫尔松，含未占领区）归属俄罗斯、拒绝外国驻军、并重提 2021 年 12 月条约草案（北约停止东扩、限制在东欧的军事活动、莫斯科对 1997 年后入约国的军力部署有发言权）。欧盟外交负责人 Kallas 称其为转移停火注意力的“陷阱”。积极信号是 Witkoff 称普京同意欧洲参加下一轮谈判（克里姆林宫称尚未最终决定），且阿布扎比 10–11 日的九个月来首次俄乌直接会谈已就大规模战俘交换达成一致。**（来源：BBC World、搜索补漏）** [链接](https://www.bbc.co.uk/news/articles/cq39glwprknjo?at_medium=RSS&at_campaign=rss)\n- **德国情报部门获新权，应对境外“混合威胁”**。德国间谍机构获得新权力，以应对来自境外的混合威胁。欧洲安全架构的讨论（见普京条目）正在同步转化为各国的国内立法行动。**（来源：BBC World）** [链接](https://www.bbc.co.uk/news/articles/c6jre3z03w4go?at_medium=RSS&at_campaign=rss)\n- **舒默面临领导权挑战：民主党中期横扫后的内斗**。参议院民主党领袖舒默将面临领导权挑战。民主党在中期选举横扫后，党内对领导层的问责已经开始，这与 Kalshi 与小特朗普切割是同一政治周期的两面。**（来源：BBC World）** [链接](https://www.bbc.co.uk/news/articles/cmy4930jq749o?at_medium=RSS&at_campaign=rss)\n- **朝鲜黑客用假视频通话实施 4 亿美元加密货币盗窃，FBI 披露**。FBI 称朝鲜黑客通过伪造视频通话实施了 4 亿美元的加密货币盗窃。手法升级（从钓鱼邮件到实时视频伪造）说明针对加密资产的社会工程攻击已进入深度伪造阶段。**（来源：BBC World）** [链接](https://www.bbc.co.uk/news/articles/cqdj1ellpd70o?at_medium=RSS&at_campaign=rss)\n\n## 📅今日前瞻\n\n- **11 月 17 日（周二）英伟达 2027 财年 Q3 财报**：美东约 13:20 公布、14:00 电话会。这是黄仁勋离任后的第一份财报，看数据中心收入、指引，以及临时 CEO Kress 如何回应继任与战略连续性问题。\n- **下周 APEC 深圳峰会**：普京可能与特朗普、习近平举行单独会晤，和谈下一轮的参与方与时间表或在此前后明确。\n- **微软 365 恢复进展**：关注微软是否宣布全面恢复及根因说明，企业客户的容灾复盘将跟进。\n- **12 月 8–9 日美联储议息**：10 月 PPI（同比 6.5%）已出，12 月加息 25 个基点基本定价；11 月 25 日公布的 10 月 PCE 将是议息前最后一块拼图。\n- **英伟达正式继任人搜索**：Arm CEO Haas 已被接洽，关注董事会是否扩大搜索范围或加速决策。\n\n## 📎来源清单\n\n- RSS 抓取（finance.json，近 3 天）：FT Home 10 条、FT Markets 22 条、经济学人本周 4 条、经济学人金融经济 3 条、FT中文网 5 条、BBC World 21 条，合计 65 条；本简报引用其中 17 条。\n- 搜索补漏：财经轮（黄仁勋辞职细节、美股收盘、FAA 全国停飞、10 月 PPI 结果）4 条、国际轮（普京和谈要价细节）1 条、中国房地产轮（10 月百城价格指数、二手成交、新房销售、贴息政策）4 条，合计引用 9 条（含普京条目 1 条为 RSS+搜索混合引用）；其余内容为 RSS 原文。\n- 注：WSJ、财新、路透新旧 feed 未采用（内容冻结/403/失效）；FAA 与 PPI 细节来自路透社转载与 BLS 公开数据，链接以搜索结果原文为准。\n"};
