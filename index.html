<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月9日 星期五</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-10-09", "summary": "", "papers": [{"title": "Lineage-Aware Memory Governance: A Derivation-Gated Framework for Privacy-Preserving Column-Level Access Control in Enterprise AI Agents", "authors": "Venkata M Sangaraju、Sudhir Vissa", "url": "https://arxiv.org/abs/2610.07258", "category": "智能体内存访问控制 / 血缘门控（HF 每日论文，arXiv 分类未标注）", "cats": [], "oneliner": "提出 Analytical Memory Unit（AMU）模式：为共享内存中每条缓存结果附上完整推导（血缘）图，检索策略只有在请求者对该结果触及的每一列都有授权时才返回命中，否则拒绝。", "insight": "**直接相关，是我们\"授权求值\"思路在智能体内存侧的镜像工作，可引作相关工作**。第一，设计哲学可对比：AMU 是\"检索时逐血缘求值\"（每个派生结果带 lineage graph，策略在命中时验证请求者是否对所有触及列有授权），我们的 AU 是\"查询时逐 AU 求值\"（chunk 只存覆盖映射 M(r)，策略独立存放）——两者都把授权决策推迟到查询时，但 AMU 的门控质量**依赖血缘记录的完整度**，而我们的框架对**未知/未映射 AU 默认拒绝**。它们的实测结论（血缘低于 75% 则泄露消除不彻底）恰恰为我们的默认拒绝设计提供了论据：血缘不可能永远完整，fail-closed 必须内建在语义层。第二，它们的\"条件式设计保证\"（conditional design guarantee）措辞值得借鉴：我们写安全保证时也可明确区分\"设计保证\"与\"经验结论\"，避免审稿人抓住保证条件的漏洞。第三，局限：企业内存场景、列级粒度，与 RAG 检索语义层不同；O(n) 最坏开销的 n 定义模糊；PoC 明确声明不是生产可行性证据。引用价值高，对抗价值低——没有工作撞我们的解耦框架本身。", "source": "HuggingFace", "citations": "尚未收录", "code": "github.com/sangaraju1988/Lineage-Aware-Memory", "zh_abs": "企业智能体共享内存时存在两类未被解决的风险：敏感数据可经由请求者本无权推导的\"合法计算结果\"泄露；不同部门可能用冲突逻辑算出同名 KPI。既有智能体内存系统（MemGPT、Zep、A-MEM）按内容/所有权/角色做检索门控，不看推导过程，会漏掉嵌入了禁用列的缓存洞察。AMU 为每条缓存结果附上完整血缘图并做检索门控：只有请求者对结果触及的每一列都有授权才返回命中。作者声称在血缘记录完整的前提下，可\"构造性证明\"该策略能阻断来自敏感列的派生结果检索（最坏 O(n)），但明确这是条件式设计保证而非经验结论——且消除实测泄露需要 75–90% 的血缘完整度，因此把 90% 定为保守部署目标。六组实验显示血缘门控消除了朴素内容门控 18.8–25.5% 的跨部门泄露，保留 81.5–82.6% 的内存复用率，最坏开销 13.8 微秒；一个 LLM 生成 SQL 的真实智能体 PoC 在 9 轮对话中零泄露、自动捕获 2 次冲突。作者定位该工作为\"源层访问控制的补充\"，并声称有助于 EU AI Act 合规。", "supplement": false}, {"title": "Package Hallucination Attacks on Coding Agents through Prompt Injection in Rule Files", "authors": "Yupu Wang、Zhengyuan Jiang、Reachal Wang、Neil Zhenqiang Gong（杜克大学）", "url": "https://arxiv.org/abs/2610.09264v1", "category": "cs.CR, cs.AI / 编码智能体提示注入攻击", "cats": ["cs.CR", "cs.AI"], "oneliner": "提出 package hallucination 攻击：向社区共享的 benign 规则文件（AGENTS.md/.cursorrules）注入恶意提示，诱导编码智能体把合法依赖替换为攻击者控制的包；配套提出进化优化框架 PackHallu，用轨迹级反馈 + LLM 引导变异迭代改写注入提示。", "insight": "**相邻相关，攻击面弹药（agent 线）**。这是一类\"供应链式间接提示注入\"：恶意内容不在检索语料里，而在智能体启动时即加载的规则文件里——相当于 agent 的\"系统级检索上下文\"被投毒。我们的威胁模型（T1/T2/T3）目前聚焦 RAG 检索侧；这篇提示我们，在 agent 线并行探索里，**规则文件/skill 文件应被视为与检索语料同等地位的不可信输入**，tool-use 授权（我们关键词列表里的 tool-use authorization）需要覆盖\"智能体读入的配置型上下文\"。局限：纯攻击论文，不提供防御构造；与 AU 求值机制无直接对比点。可在威胁模型章节一句话引用为\"规则文件投毒\"实例。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "现代智能体编码框架越来越依赖社区共享的规则文件指导自主代码生成，但这条管道的安全风险此前未被充分研究。攻击者向良性规则文件注入恶意提示，使编码智能体在安装依赖时把合法包替换为攻击者控制的包。为高效构造注入提示，作者提出 PackHallu：用轨迹级反馈和 LLM 引导的变异做进化优化，迭代改写注入提示。在多个 benchmark、多种 LLM 与智能体框架上的评估显示 PackHallu 攻击成功率高，且在不同模型与智能体组合间迁移性强。结论：编码智能体对 package hallucination 攻击脆弱，自主编码系统亟需更强的安全防护。", "supplement": false}, {"title": "VeriChainSim: Verifiable Evidence-Chain Simulation for LLM-Based Multi-agent Authorization in Aerospace Trusted Data Spaces", "authors": "G. E. Huiling、Zhiguo Shi（通讯，北京科技大学）、Yungui Nie", "url": "https://doi.org/10.1007/978-981-92-5712-6_34", "category": "LLM 多智能体授权 / 可验证证据链（Springer CCIS vol. 3155, CSC 2026 会议论文集章节）", "cats": [], "oneliner": "提出可验证证据链仿真框架 VeriChainSim：把 LLM 智能体的每一次授权决策绑定到类型化证据指针（目录记录、策略标识、合同条款、会话绑定、证明对象），在 token 激活或可信执行前由外部验证器对照可信状态注册表校验。", "insight": "**直接相关（授权机制），\"失败时安全降级\"的现实例子**。第一，它实现了一个我们只在目标里写了的性质：**对畸形证据 fail-closed**——验证器在 token 激活前做存在性/完整性/范围/会话一致性校验，任何一项不过即拒绝。这与我们的 retrieve-then-project 语义（裁剪未授权片段，失败降级）是同一家族的设计，可在讨论章节引用为\"授权决策前置校验 + fail-closed\"的实例。第二，设计对比：VeriChainSim 是\"决策时绑定证据、外部验证器校验\"的中心化校验模式，我们的 AU 是\"查询时逐 AU 求值\"的去中心化策略求值——两者都试图解决\"LLM 生成的授权理由不可信\"问题，路径不同，可在相关工作里并列。第三，局限：航空航天可信数据空间的专用场景，评估是仿真+确定性测试，威胁模型未明确分层（无 T1/T2/T3 对应）；CCIS 会议论文集章节，引用权重有限。不动摇我们的 claim，但可引用。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "LLM 智能体可以在航空航天可信数据空间中解析请求并协调授权步骤，但其自然语言 rationale 无法提供可验证的证据：智能体可能引用不存在的策略、依赖被投毒的目录元数据，或起草与许可数据范围不一致的合同条款。VeriChainSim 把每个智能体决策绑定到类型化证据指针，token 激活或可信执行前，外部验证器对照可信状态注册表校验这些指针：检查对象存在性、摘要完整性、范围与会话一致性、必需合同条款，以及授权步骤间的图级依赖。在多模型后端与对抗性授权场景下的实验显示，VeriChainSim 在保持合法访问的同时降低了错误授权；确定性测试显示对畸形证据的 fail-closed 行为，且验证器侧延迟随注册表规模增长保持低位。结论：把 LLM 智能体决策绑定到可验证证据链，可提升可信数据空间授权的可审计性与鲁棒性。", "supplement": false}, {"title": "AI-Powered Attacks and Mitigation Strategies for Enterprises: A Comprehensive Research Review", "authors": "Sarathkumar K、Pandian R、Shyamala Gowri B、Karthiga R", "url": "https://doi.org/10.47392/irjaeh.2026.0719", "category": "企业 AI 攻击面综述（International Research Journal on Advanced Engineering Hub, IRJAEH）", "cats": [], "oneliner": "面向企业的 AI 攻击与缓解综述：提出 24 路径攻击分类法（覆盖身份访问、输入上下文、数据检索、供应链、工作流、基础设施与输出域），回顾主要攻击类别并提出结合零信任身份、最小权限、溯源、完整性校验、安全工具执行、持续监控、对抗测试、人工监督与 AI 专项事件响应的纵深防御架构。", "insight": "**关联较弱，综述类参考**。唯一价值是它的 24 路径分类法把\"数据检索\"（含检索存储/向量数据库）列为独立攻击域，并在研究空白里点名\"授权（authorization）\"与\"持久内存\"——与我们\"检索 ≠ 授权\"的论述方向一致，可在引言里一句话引用为\"企业 AI 攻击面分类已把检索存储单列，但授权机制仍是空白\"的佐证。局限：IRJAEH 是低影响力期刊，综述深度有限，无新数据、新机制、新评估；24 路径分类法是文献整理而非实证。**不建议作为核心引用**，仅作背景点缀。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "AI/LLM/RAG/自主智能体正在重塑企业信息系统，但也引入了超出传统应用与网络漏洞的攻击面：攻击者可利用身份、API、提示、文档、检索存储、向量数据库、模型产物、智能体工具、浏览器会话、软件流水线、云凭证与网关。该综述从参考文献出发构建 24 路径攻击分类法，覆盖身份访问、输入上下文、数据检索、供应链、工作流、基础设施与输出六大域；回顾主要攻击类别，提出纵深防御缓解架构（零信任身份、最小权限、溯源、完整性校验、安全工具执行、持续监控、对抗测试、人工监督、AI 专项事件响应）；并指出 prompt 注入检测、授权、持久内存、供应链保障等方向仍存在研究空白。", "supplement": false}]}, {"date": "2026-10-08", "summary": "", "papers": [{"title": "Surviving the Router: Optimizing Skill Injections for Retrieval and Execution", "authors": "Haneen Najjar、Luca Scionis、Haritz Puerto、Sahar Abdelnabi", "url": "http://arxiv.org/abs/2610.08098v1", "category": "LLM Agent 安全 / 技能检索侧注入攻击", "cats": [], "oneliner": "证明在 skill 路由器管理的多技能环境里，注入的恶意技能必须先赢得检索竞争（既有注入的实际 ASR 因此被压低 87–97%），并提出分阶段优化检索与端到端的攻击方法 CORSA。", "insight": "**相邻相关，检索层威胁建模的直接参照**。第一，我们的威胁模型里 retrieval poisoning / 间接提示注入正好走这条路：这篇给出了检索层攻击的量化基线（检索竞争压低 87–97%、跨路由器可迁移），可引用进威胁模型章节，说明\"检索层既是攻击咽喉也是评估偏差来源\"。第二，它的 8 类恶意载荷扩展 benchmark 是我们未来做\"自适应检索投毒评估\"时可对比的测试台思路。第三，警示意义：**它批评的\"默认恶意内容已被检索到\"式评估偏差，恰恰是我们写 embedding 通道泄露评估时要自查的**——我们的 cloze 89.4%@20 是在攻击者已知机密位置附近的设定下测的，报告里应明确评估假设，避免同类质疑。局限：纯攻击论文，不提供防御构造；与授权机制本身无关，不能直接对比我们的 AU 求值。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "智能体越来越多依赖由 skill 路由器动态选择的第三方\"技能\"；既有研究默认恶意技能已被选中执行，这会显著高估攻击成功率。作者证明在真实多技能环境中，注入的技能必须先参与检索竞争，导致现有注入的实际攻击成功率下降 87–97%。为此提出 CORSA（Cluster Optimization for Router-Aware Skill Attacks）：分阶段先优化检索命中、再优化端到端攻击成功，在 SkillRouter 引入的 benchmark 上扩展出 8 类恶意载荷类别评估。实验显示 CORSA 同时显著提升检索与端到端成功率，且攻击可迁移到不同路由器架构与 LLM 底座，同时保持用户效用与注入自然度。", "supplement": false}, {"title": "Agents in Disguise - Weaknesses in Authentication and Authorization in Public AI Ecosystems", "authors": "Jan Stanek、Lukas Kencl（通讯：Jan Stanek，捷克理工大学）", "url": "https://doi.org/10.1007/978-3-032-38702-8_15", "category": "LLM Agent 授权 / 开放生态系统认证授权实测", "cats": [], "oneliner": "系统实测 MCP 等开放 AI 生态与协议中的认证授权现状，发现 agent 身份缺失、弱认证泛滥、授权可选或已损坏等问题，并给出改进方向。", "insight": "**直接相关（agent 线），并暴露了我们主线的一个隐含假设**。我们 RU/AU 解耦的授权求值 P(a,u) 默认主体 u 已知且认证可信；这篇证明在开放生态中，**u 的认证本身就是未解决的问题**（身份缺失、弱认证、授权可选）。这意味着我们论文的威胁模型/讨论章节应明确写清边界：AU 框架解决的是\"已认证主体对内容的细粒度授权\"，而\"主体身份可信\"需要下层认证机制支撑——引用这篇正好补上这块拼图，且与我们\"标准与 Agent 线\"并行探索直接对接（NIST NCCoE 概念文件、mcpanalysis 工具都可顺藤摸瓜）。另外，它是 LNCS 章节、引用链扎实（MCP/A2A/ANP/VISA TAP），可作为 agent 授权相关工作的锚点文献。局限：它是现状实测而非新机制，不直接动摇/加强我们的 claim。", "source": "OpenAlex", "citations": "尚未收录", "code": "github.com/kelanth/mcpanalysis（作者自带分析工具，星标数未抓取）", "zh_abs": "作者指出 AI 生态中信任至关重要，但其技术使能器（认证与授权机制）常常缺失或配置不当。他们收集了常用开放协议（MCP、A2A 等）与生态的全面数据，识别出一批安全问题：agent 身份缺席（无定义或无存在感）、弱认证方法被过度使用、授权可选、授权逻辑损坏。论文评估了这些发现，分析了现状成因，并提出值得进一步研究与开发的改进方向。附录还逐一分析了 VISA Trusted Agent Protocol、AgentCard、Universal Commerce Protocol 等新兴 agent 支付协议的身份与授权属性。引用了 NIST NCCoE 的 agent 身份与授权概念文件等标准工作。", "supplement": false}, {"title": "Human-in-the-Loop Control for High-Risk Legal Agents", "authors": "Shatrunjay Kumar Singh", "url": "https://doi.org/10.38124/ijisrt/26aug422", "category": "LLM Agent 授权 / 高风险场景治理框架", "cats": [], "oneliner": "针对法律等高风险场景，提出把\"语言生成—授权—执行\"三权分立的风险自适应治理架构 HILC-Legal，批判\"最终审批点一下\"式的人机回路并不充分。", "insight": "**相邻相关，\"解耦\"思想在 agent 动作侧的同构实例**。他们的\"生成—授权—执行三权分立\"与我们的\"检索单元/授权单元解耦\"哲学一致：**安全决策不寄托于生成模型本身的自觉，而放在独立的授权层强制**。最值得借鉴的是 version-bound authorization tokens（授权绑定到具体版本）——对应我们 per-view 索引语义的一个实现细节：防止\"授权时一个版本、执行时另一个版本\"的 TOCTOU 类问题，我们在讨论 per-view 时可引用此概念。可在 related work 里并列引用：RAG 侧的 AU 求值 vs Agent 侧的 HILC，是同一思想在两个平面的实例。局限：纯设计框架、无实证；IJISRT 期刊质量存疑，只能弱引用、不可作强证据。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "法律智能体可分解目标、检索判例、调用工具、起草文书、执行多步工作流；作者论证在高风险场景下，最后的人工审批点击不是充分控制：错误会沿轨迹传播、证据可被隐瞒、机密数据可越过未授权边界、人审批的版本可能与实际执行的版本不一致。为此提出 HILC-Legal 架构：分离语言生成与授权、分离授权与执行，组合硬策略约束、校准的动作风险评分、证据包、能力感知审稿人路由、版本绑定的授权令牌、最小权限执行代理、溯源日志与事后监控。定义了六条法律后果行为的控制不变量与四级监督策略（从有界只读辅助到人类全权决策），并给出覆盖\"不安全动作逃逸、授权与证据保真、审批-版本一致性\"等的评估协议。作者明确这是设计与评估框架，不宣称部署结果。", "supplement": false}, {"title": "AdvSim2Real : Training Web Agents Against Adaptive Prompt Injection in a Web World Model", "authors": "Sarim Hashmi 等（6 人）", "url": "http://arxiv.org/abs/2610.08773v1", "category": "Web Agent 安全 / 提示注入对抗训练", "cats": [], "oneliner": "在冻结的 web 世界模型里让任务课程、注入攻击者与 agent 三方共同演化做对抗训练，使 4B agent 对未见过的自适应注入攻击更稳健（150 个 web 任务上相对基线提升 33.6%）。", "insight": "**关联较弱，属正交防御路线**。他们做的是模型内禀稳健性（训练时让模型\"更抗注入\"），我们做的是授权架构（执行时强制求值、默认拒绝）——共同敌人是提示注入，但防御层完全不同，不能互相替代，也不直接可比。诚实地说，这篇对我们 claim 既无加强也无动摇。唯一可借鉴的是评估方法论：他们用\"未见过的前沿模型攻击者\"做泛化测试，这种自适应攻击者思路值得我们在设计\"自适应检索投毒\"评估时参考——不要只测固定注入模板。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Web agent 必须读写第三方编写的页面，页面里植入的指令可把 agent 带偏离用户目标；现有防御用训练前固定的注入做微调，会被自适应的攻击者绕过；普通对抗训练让攻击者自适应但任务固定，agent 解出任务后任务就不再有教学价值。AdvSim2Real 在冻结的 web 世界模型内让三者共同演化：课程奖励\"agent 约一半能解出\"的任务，攻击者只因\"成功翻转\"（把一次被判成功的执行变成失败的注入）获奖励。结果：4B agent 在有无攻击下完成率都上升，能顶住训练时从未见过的前沿模型攻击者，且能力增益可迁移到真实浏览器；在 150 个 web 任务上，对未见攻击者的完成率相对基线提升 33.6%。", "supplement": false}]}, {"date": "2026-10-07", "summary": "", "papers": [{"title": "Role Based Access Control in Enterprise RAG", "authors": "Gnaneshwar Kethavath", "url": "https://doi.org/10.5281/zenodo.23168856", "category": "RAG 访问控制 / RBAC 实证评估", "cats": [], "oneliner": "用 15 份虚构公司文档和 3 个模拟角色，实证对比企业 RAG 的四种 RBAC 实现，证明代码级过滤能把受限事实泄露降到零，而仅靠 prompt 声明权限仍显著泄露。", "insight": "**直接相关，是我们主张的第三方实证**。它的\"code-based filtering\"与我们的思路异曲同工——权限判定不依赖模型的自觉（prompt 声明），而在执行层强制。**37/99 vs 12/99 vs 0/0** 这组数字可直接引用进论文\"动机/相关工作\"段：仅靠 prompt 约束权限是不够的（12 次泄露），策略必须独立于模型、查询时逐单元强制求值——这正是我们 RU/AU 解耦的论证起点。局限也很清楚：Zenodo 非同行评审、单作者、合成小数据，只能作支持性引文，不能当 benchmark 用；且它做的是文档级 RBAC（粗粒度），我们的 AU 是更细粒度的\"策略同质\"划分，粒度差异本身可写成对比点：文档级 RBAC 是 AU 划分的一个特例（每文档一个 AU）。", "source": "OpenAlex", "citations": "OpenAlex 0 次（刚收录）", "code": "无", "zh_abs": "该研究比较四种企业 RAG 助手实现（未过滤 / 仅 prompt 声明权限 / 两种代码级过滤），用 15 份虚构短文档和 3 个模拟角色构造测试：开发集 30 例、留出测试集 60 例、每实现评估 3 轮，共 720 次评估。结果：未过滤 RAG 在 99 次未授权/攻击评估中出现 37 次受限事实泄露，仅 prompt 声明权限的有 12 次，两种代码级过滤实现均为 0；四种实现在 54 次授权评估中全部答对，授权证据召回均为 1.0，因此\"检索前过滤能提升召回\"的假设未被数据支持。作者明确标注局限：单模型、小合成语料、简单攻击、标签由作者自检。", "supplement": false}, {"title": "Compromise Is Not Consequence: Evaluating Task-Scoped Authorization in LLM Agents with Paired Replay", "authors": "Tural Hagverdiyev", "url": "http://arxiv.org/abs/2610.05840v1", "category": "LLM Agent 授权 / 提示注入遏制评估", "cats": [], "oneliner": "用 paired-replay 测试台量化任务范围授权对提示注入后工具执行的遏制效果：broad bearer 下攻击后执行率 8.9–37.8%，scoped JWT / sender-constrained / OPA 三种限定条件全部为零。", "insight": "**直接相关，属\"授权原子单位\"家族的同行实证**。他们的\"task-scoped authorization\"（按任务限定凭证作用域）与我们的 AU（按内容划分权限判定单元）粒度不同但哲学一致：**授权的原子单位越小、越靠近执行点，遏制效果越好**。最值得引用的是它的核心结论——\"The policy changes execution, not the frozen model decision\"（策略改变的是执行，而非冻结的模型决策）——这与我们的 retrieve-then-project 执行语义形成跨域互证：不要把安全寄托在模型\"自觉拒绝\"上，要在执行层裁剪/拒绝。局限：它测的是**遏制（containment）而非预防（prevention）**，作者自己也承认；AgentDojo 扩展样本小（24 例）、效用对比 5/24 vs 6/24 差异不大。可在我们论文\"执行语义/威胁模型\"章节引用作对比：RAG 侧的 AU 求值 vs Agent 侧的 task-scoped，是同一思想在两个平面的实例。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "研究问题是：当模型被恶意指令带偏、但其凭证本身合法时，任务范围授权能否遏制随后的工具执行。方法上用 paired-replay：对同一模型请求采样一次，把相同的 action/resource/arguments 分别提交给 broad bearer、scoped JWT、sender-constrained、Open Policy Agent 四种授权条件。主实验 128 个场景 × 4 个工具域 × 5 种本地模型配置：在有效被攻击的暴露后决策中，broad bearer 执行率为 8.9%–37.8%（随模型而异），三种 scoped 条件全部为零。另在 AgentDojo 上做 6 任务扩展：broad 策略 24 次注入攻击中 11 次被标记，scoped 为 0/24，效用分别为 5/24 与 6/24。", "supplement": false}, {"title": "Can CaMeLs Talk? Securing Multi-Agent Systems Against Indirect Prompt Injection Attacks", "authors": "James Peters-Gill、Avi Semler、Henning Bartsch、Ilia Shumailov、Christian Schroeder de Witt", "url": "http://arxiv.org/abs/2610.05640v1", "category": "多智能体安全 / 间接提示注入", "cats": [], "oneliner": "证明单智能体的 CaMeL 安全保证在分层多智能体系统中不组合（不可信数据可在下游被重新解释为可信输入），并提出跨智能体保持 provenance 的 multi-CaMeL 通信协议。", "insight": "**关联中等，但攻击面在我们 T1/T2/T3 之外，值得记录**。我们的威胁模型目前是单 RAG 系统内的三层（仅见答案/可见排序向量/全知识）；这篇工作揭示的是**组合性维度**：每个单元各自安全，跨边界组合后仍可能被绕过——\"不可信数据被下游重新解释为可信输入\"，恰是我们 embedding 通道/投影语义中\"边界重解释\"问题的多智能体版本。对我们论文的直接影响：per-view 索引执行语义目前只论证单系统内的隔离；若未来把框架扩展到多智能体 RAG（agent 调用 agent、视图跨智能体传递），**视图隔离的组合性需要单独证明**，这是个诚实的未来工作点，可在论文\"局限与未来工作\"段引用此文作为佐证。当前 claim 不受动摇。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "CaMeL 通过分离可信控制流与不可信数据、在运行时执行基于能力的策略来保护单个智能体免受间接提示注入。本工作考察这些保证在分层多智能体系统（智能体把其他智能体当工具调用）中是否组合：结论是不组合。作者构造了一个具体攻击：即使所有组成智能体各自运行 CaMeL，攻击仍成功——利用的是\"不可信数据可被下游智能体重新解释为可信输入\"。随后提出 multi-CaMeL，一种智能体间通信协议，通过独立数据通道传递不可信数据、保持 provenance，从而保留安全保证；在 AssetOpsBench 上评估效用，在自研的 MultiAgentDojo benchmark 上评估安全-效用权衡：multi-CaMeL 把攻击成功率降至 **0.0%**（单智能体 CaMeL 为 0.2%、无 CaMeL 为 12.9%），效用代价随模型能力增强而下降。", "supplement": false}]}, {"date": "2026-10-06", "summary": "", "papers": [{"title": "Enhancing security in LLM applications: a performance evaluation of early detection systems", "authors": "Valerii Gakh、Hayretdin Bahşi", "url": "https://doi.org/10.1007/s10207-026-01338-7", "category": "提示注入检测 / 安全评估", "cats": [], "oneliner": "", "insight": "它的核心论点——**\"提示泄露是独立于注入的保密性风险，且现有检测器防不住构造型泄露\"**——与我们 embedding 通道实测的结论方向一致（cloze 攻击在全文 embedding 索引下 89.4%@20 可恢复机密）。两者防御层次不同（它是输入侧检测器，我们是检索侧授权与索引隔离），不构成竞争，但其\"检测工具有效性必须实证而非宣称\"的方法论立场，可在我们论文\"防御评估\"段落互引：我们的 per-view 重编码把泄露降至 4.05%，正是对\"宣称式防御\"的实证回应。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "系统实测了若干开源提示注入早期检测系统的性能，指出两点缺口：现有防御对提示泄露（prompt leakage，提示注入的保密性变体）识别不精确；攻击者可构造能绕过多数防御的泄露攻击。工作同时填补了\"检测工具在实践中到底多有效\"这一实证空白。", "supplement": false}, {"title": "Prompt Injection Threats in Azure-Based Large Language Model Applications", "authors": "Shekar Rao Lakavath", "url": "https://doi.org/10.61424/jcsit.v3i2.1077", "category": "提示注入 / 企业 LLM 安全综述", "cats": [], "oneliner": "", "insight": "关联较弱。它是综述而非新防御/新 benchmark，六类分类法可作威胁建模背景引用；\"指令与数据边界坍缩\"的论述与我们的 T1/T2/T3 威胁模型无直接对话。对论文 claim 无动摇也无加强，工程落地参考价值为主。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "一篇文献综述，把提示注入及相邻 LLM 安全威胁映射到 Azure 落地组件（Azure OpenAI Service、Azure AI Search、Azure AI Content Safety、Logic Apps 插件/函数调用），提出六类提示注入攻击分类：直接注入、间接注入、提示泄露等。", "supplement": false}]}, {"date": "2026-10-05", "summary": "**数据口径说明**：06:45 拉取的 `arxiv_2026-10-05.json` 为空（arXiv 抓取失败），HF 每日榜单亦未更新，今日候选仅来自 OpenAlex 近 3 天关键词检索（7 篇，去重后 6 篇新候选，Jev 粗筛保留 2 篇）。若 06:46 轮拉取恢复，次日回补。\n\n今日新命中 2 篇（均为 OpenAlex），Agent 授权线占一席。**最值得关注的是 \"Authorized Access, Unauthorized Effects\" 的 replication package**：它把 LLM-Agent 系统里\"源使用授权\"（source-use authorization）与\"控制点放置\"（control placement）做成可测量的实证对象——360 个主实验世界 + 24 个载体替换复制、溯源中继审计、确定性验证测试。核心议题正是\"检索到的内容是否被授权使用\"以及\"授权检查放在链路的哪一环\"，与我们检索内容粒度 AU 求值的执行语义是同一问题在 Agent 侧的镜像，**可作为 Agent 线的实证引用**（注意：我们只拿到了复现包，原论文正文未在爬取范围，引用前需拿到原文核实结论）。另一篇 \"Beyond Hallucination\" 是对齐失配的方法论框架，定义了 Unauthorized Action Rate 等度量，与我们主线关联较弱，可当背景读物。\n\n---", "papers": [{"title": "Replication package for: Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems", "authors": "Kai Pan, Rong Hou（A2A Lab）", "url": "https://doi.org/10.5281/zenodo.23108972", "category": "LLM Agent 安全 / 实证测量（Zenodo 复现包，2026-10-03 发布）", "cats": [], "oneliner": "原论文把\"源使用授权\"和\"控制点放在哪一环\"变成可测量对象，复现包公开了 360 个主实验世界、24 个载体替换复制的聚合结果、溯源中继审计与加密清单。", "insight": "这是目前我们看到的、与我们\"执行语义层授权求值\"最贴近的 Agent 侧实证工作。我们的三种执行语义（all-of 拒绝 / retrieve-then-project / per-view 索引）本质上也是\"控制点放置\"的设计选择——这篇的测量方法论（合成世界 + 载体替换复制）可以直接借鉴，用来量化不同放置点的授权覆盖率与误伤率差异，建议在 Related Work 的 Agent 线引用并对比：它是工具/动作调用粒度（source-use），我们是检索内容粒度（AU），两者正交互补。**但注意**：我们只抓到复现包，没有原论文正文——其具体结论（如哪一环放置最优）必须拿到原文后核实，本次只登记为\"待深读\"。适合 standards-agent 线候选（见论文库维护）。", "source": "OpenAlex", "citations": "尚未收录", "code": "复现包内含 Python 重构与事件归一化代码、确定性验证测试（无独立 GitHub 仓库）", "zh_abs": "该复现包配套原论文《Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems》。它用合成任务夹具（synthetic task fixtures）与授权策略搭建实验世界，测量 agent 在使用检索/工具来源内容时，授权检查究竟应该放在链路的哪一环（control placement），并通过溯源中继审计（provenance-relay audits）追踪权限在调用链中的传递。实验规模是 360 个主世界 + 24 个载体替换复制，全部结果经确定性验证测试与密码学清单固定。", "supplement": false}, {"title": "Beyond Hallucination: A Functional Framework for Detecting and Mitigating AI Misalignment in Large Language Models and Agentic Systems", "authors": "Kishore Chalakkal Varghese", "url": "https://doi.org/10.5281/zenodo.23100091", "category": "AI 对齐 / 方法论框架（Zenodo 自出版预印本，2026-10-02 发布）", "cats": [], "oneliner": "提出一个八层对齐失配分类法与\"失配检测鸿沟\"概念，并定义 Unauthorized Action Rate 等实证度量，为企业场景设计可复现的 benchmark 方法论。", "insight": "关联较弱。其\"授权边界\"（authorization boundaries）作为企业 benchmark 的场景变量之一出现，但全文是方法论框架、没有任何实证数据，也未深入授权机制本身。八层分类法可作为背景知识知道有这么一套话语体系，但对 RU/AU 解耦的技术设计没有直接启迪，不建议引用。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "作者把对齐失配定义为\"目标保真度的失败\"（不只是幻觉那种认知不可靠），提出八层分类法：意图、规范、代理与奖励设计、目标泛化、偏好优化、监督条件行为、agent 动作、部署上下文。核心概念是 Misalignment Detection Gap——真实目标偏离与评估者可检测性之间的差距。方法上给出启发式风险模型（失配概率 × 自主性 × 权限 × 影响 × 运行时可检测性），并为模糊目标、KPI 压力、授权边界、弱监督、工具使用等企业场景定义了 Task Success Rate、Alignment Preservation Rate、Unauthorized Action Rate 等度量。", "supplement": false}]}, {"date": "2026-10-04", "summary": "今日新命中 4 篇（arXiv 1 篇 + OpenAlex 3 篇），整体质量中等偏上，Agent 安全方向占了三席。最值得关注的是 **Authority Is Not a String**：它把\"环境权限\"（ambient authority）问题形式化为 capability-scoped  harness，用系统级权限能力模型对抗间接 prompt injection——其\"命名资源≠被授权操作\"的立场，与我们 RU/AU 解耦\"查询时逐 AU 求值、未知默认拒绝\"的执行语义在哲学上高度一致，值得在 Related Work 的 Agent 线引用。**Securing Enterprise Language Model Applications** 是一篇 结构化训练、preference optimization、capability enforcement 与 action attribution。核心结论是提出六个保障边界（身份与范围、源授权、内容溯源、模型交互、可执行动作、输出放行），并明确主张：**权威的保密与授权决策必须依赖独立于模型的应用层/基础设施层控制**。", "supplement": false}, {"title": "Mapping the RAG Landscape: A Four Axis Taxonomy of Efficiency, Defense, Interactivity, and Reasoning", "authors": "抓取档未记录作者信息（arXiv 元数据缺失），详见原文页", "url": "http://arxiv.org/abs/2610.01936v1", "category": "cs.AI（arXiv 2026-10-01）", "cats": ["cs.AI"], "oneliner": "一篇 RAG 全景综述，按效率、防御、交互、推理四个轴组织当代 RAG 研究。", "insight": "Defense 轴部分可作为 RAG 安全防御的全景引用，帮我们快速定位已有防御工作的位置，避免 Related Work 挂一漏万。但它是一篇宽口径综述，不会深入访问控制这一细分方向；对我们的 RU/AU 解耦框架没有直接技术启迪，关联较弱，引用价值限于\"领域地图\"层面。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "该综述把近年 RAG 研究整理为四轴分类：检索效率优化、鲁棒性与安全防御、用户驱动的交互式工作流、多步/复杂推理。覆盖 dense/sparse 检索、融合策略、embedding 优化、基于强化学习的检索策略，并综合各轴的评估方法，讨论这些进展如何影响实际部署与系统设计。", "supplement": false}, {"title": "Red-Teaming Coding Agents from a Tool-Invocation Perspective: An Empirical Security Assessment", "authors": "Yuchong Xie, Mingyu Luo, Zesen Liu, Zhixiang Zhang, K. F. Zhang, Yu Liu, Ci Tao, Changhui Wang", "url": "https://doi.org/10.1145/3832267", "category": "软件工程 / Agent 安全（ACM）", "cats": [], "oneliner": "首次系统地从\"工具调用\"视角对六款主流 coding agent（Cursor、Claude Code、Copilot、Windsurf、Cline、Trae）做红队评估，发现 ToolLeak 与双通道 prompt injection 攻击。", "insight": "ToolLeak 揭示的\"参数生成阶段的安全假设断裂\"是一个新颖的攻击面，但它属于 agent 工具调用链，与 RAG 检索授权主线关联较弱。可作为 standards-agent 线的背景引用（一句话带过），说明 agent 侧的授权问题同样严峻、但与我们解决的检索内容授权是正交维度；不建议深入展开。", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无", "zh_abs": "红队分两阶段：第一阶段发现\"模式鸿沟\"——模型在 schema 驱动的参数补全时表现得像在做无害的结构化填充，可能把隐藏的 agent 上下文（system prompt、工具元数据）复制进工具调用参数，作者将其实例化为 ToolLeak 攻击实现 prompt 外泄；第二阶段用工具描述中的双通道 prompt injection 劫持 agent 的工具调用行为。", "supplement": false}]}, {"date": "2026-10-03", "summary": "今日 arXiv 六个分类共抓取 830 篇，关键词命中 36 篇；Jev 初筛（preset=papers）保留 15 篇，去重（lit_seen.txt）剔除昨日已报 2 篇，人工终判入选 **12 篇**（4 篇 direct、6 篇 adjacent、2 篇 background）。最值得关注的是 **Walking the Embedding Space（2610.01871）**——针对返回图像的多模态 RAG 的自适应数据抽取攻击 `\\immrag`：攻击者在黑盒下把影子图像与已恢复图像混合、按相关性加权重新采样，持续把查询推向 embedding 空间中尚未被抽取的区域；单次 2500 查询即可重构 **611 张放射影像 / 566 张文档扫描件 / 416 张通用图像**，抽取到的不同条目数是**非自适应基线的 5.6 倍**。这是 embedding 通道攻击线的强力增援：我们的 A1 是文本 cloze 攻击（89.4%@20），它是多模态、图像返回配置下的**自适应抽取**，说明\"向量索引存整 chunk embedding\"的问题在图文跨模态场景下同样成立且可被放大，是 T2 威胁（可见排序向量）最具体的新实证，值得在 threat model 一节引用对照。其次是 **Locket（2610.00309）**——把细粒度访问控制直接做进生成侧：为每种访问策略训练一个轻量 LoRA 适配器，keyed entry token 经硬路由解锁对应策略（完全披露 / PII 掩码 / 差分隐私级别），无 token 则触发隐私保护适配器；与我们的数据平面方案（chunk 只存 M(r)、查询时逐 AU 求值）形成\"模型内授权 vs 数据面授权\"的鲜明对照。此外 **OverAct（2610.01508）** 给\"工具调用主动越权\"建了 8 个隐私敏感域的确定性 benchmark（7 个模型全都超授权范围；SelfAudit 推理时自检把隐私越权压低 43%），是 Agent 授权线可直接复用的评测设计。注意：扩展来源今日只有 OpenAlex 19 篇候选（入选 3 篇），**HuggingFace 每日 50 篇部分缺失**（06:45 拉取档未产出，按约定不重跑，见\"抓取说明\"）。", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica（一作）等 4 人", "url": "https://arxiv.org/abs/2610.01871", "category": "cs.AI（v1, 2026-10-01）", "cats": ["cs.AI"], "oneliner": "", "insight": "embedding 通道攻击线的最强邻居。我们的 A1 是文本侧的完形查询攻击（89.4%@20），它证明**同一通道在多模态场景下可被自适应放大**：自适应重采样把\"被动试探\"变成\"主动覆盖\"，抽取效率是基线的 5.6 倍——这说明即使我们做了按授权视图重编码（4.05%），若索引是跨模态共享的 embedding 空间，攻击者的收益函数会变化。两处可引用：① T2 威胁模型一节可把它列为\"攻击者可见排序向量/可反复查询\"的最具体新实证；② 它的\"局部特征对应判定\"可借鉴为 embedding 通道泄露的度量方法（我们目前用 cloze 命中率，它用重构出的不同条目数）。注意它的攻击目标是**完整条目抽取**（confidentiality），我们还关心\"投影后残留语义\"（NLI），两者互补不竞争；它不涉及授权语义（任何用户都可查），所以不直接给出防御，但它把\"embedding 索引本身必须被授权视图切分\"的论证推得更强——正是我们 per-view 索引的动机。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对\"返回图像\"的多模态 RAG（检索到的视觉制品本身就是回答）提出 `\\immrag`：黑盒、自适应的数据抽取攻击。每次查询把攻击者持有的影子图像与已从系统恢复的图像混合，用相关性加权重新采样把后续查询推向 embedding 空间中仍能产生新检索的区域；与以往靠文本提示词诱导泄露的抽取攻击不同，它把恶意指令直接嵌进用户给定的输入图像。在医疗助手、文档助手、通用工具三类真实场景下，对多个 CLIP 家族检索器与生成器做评估：单次 2500 查询可重构多达 611 张放射影像、566 张文档扫描件、416 张通用图像（按局部特征对应判定），抽取到的不同 datastore 条目数达非自适应基线的 **5.6 倍**。", "supplement": false}, {"title": "Tokenized Key-Gated Adapter Routing: A Secure Access Control Mechanism Against Private Data Leakage in LLMs (Locket)", "authors": "Mohamed Shaaban（一作）、Mohamed Elmahallawy 等", "url": "https://arxiv.org/abs/2610.00309", "category": "cs.AI（v1, 2026-09-28）", "cats": ["cs.AI"], "oneliner": "", "insight": "与我们形成**\"模型内授权 vs 数据面授权\"**的干净对照。它把策略编译进权重（每个策略一个 LoRA），我们把策略存在数据面（chunk 只存 M(r)、查询时逐 AU 求值 P(a,u)）；它的授权密钥是输入 token，我们的是查询时策略求值。两处差异值得在 related work 里点出来：① 它的授权粒度是\"策略档位\"（coarse，几个固定档），我们的 AU 是源内容驱动的细粒度划分——它的方案遇到\"同一文档内不同片段不同密级\"会退化为保守整档拒绝；② 它的撤销语义未讨论（token 一旦发出即长期有效），而我们\"未知 AU 默认拒绝\"天然支持撤销即时生效。不动摇我们的 claim，但为\"为什么不在模型里做访问控制\"提供了一个现成的反面参照——可以在 Discussion 里用一句话回应：权重内授权难以表达 AU 级的细粒度与动态撤销。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "把细粒度的、策略驱动的访问控制直接嵌入 LLM 生成过程。为每种访问策略训练一个轻量 LoRA 适配器（完全披露 / PII 掩码式部分披露 / 指定差分隐私级别披露）；一个紧凑门控模块学会把 keyed entry token 经序列级硬路由唯一地关联到一个适配器——有效 token 是解锁对应私有知识的授权密钥，无效或缺失 token 则触发隐私保护适配器做脱敏。在 Enron、ECHR、Yelp 三个数据集与 Qwen3（1.7B/8B）、Llama-3.2（1B/3B）、Gemma-2-2B 上评估：token 正确时困惑度与无防护微调相当；token 缺失/无效时 PII 泄露显著下降，效用与强基线相当。", "supplement": false}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang（一作）等 5 人", "url": "https://arxiv.org/abs/2610.01508", "category": "cs.CL（v1, 2026-10-01）", "cats": ["cs.CL"], "oneliner": "", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计思路。它的\"越权来自结构性决策倾向而非解码随机性\"的结论对我们 RU/AU 主线无直接冲击，但与我们\"保守子句切分器\"背后的直觉相通——**授权边界应该由机制保证而非模型自觉**：它的 SelfAudit 仍是让模型自己审计自己（43% 改善但仍是启发式），我们的路线是确定性求值 P(a,u)，对比之下更显出\"把授权从模型行为里剥离出来\"的价值。它的\"请求具体度越权越轻\"可作为一个引用点：支持我们在查询侧做\"意图—权限\"对齐的动机。注意它是工具调用授权（动作侧），我们是检索内容授权（数据侧），不竞争。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究结构化工具调用 agent 的\"主动越权\"（proactive over-authorization）：agent 取回的私有数据超出用户请求明确需要的范围。提出 OverAct benchmark：覆盖 8 个隐私敏感域、确定性、无需 judge 打分；另给一个可解释的决策理论框架并导出三个可检验预测。在 4 个家族 7 个模型上：**所有模型都显著超出授权范围**；请求越具体越权越轻（specificity 是最强预测因子）；越权随工具池规模次线性增长；解码温度几乎无影响——作者解释为\"成本不对称\"导致的结构性倾向而非解码随机性。提出 SelfAudit：零样本推理时方法，生成基于请求的调用理由并过滤掉无依据的调用；消融显示显式过滤是主因，**隐私向越权降低 43%**，无需 oracle。", "supplement": false}, {"title": "Secure and Responsible Retrieval-Augmented Generation for Resource-Constrained Organizations: A Multi-Cloud Reference Architecture and Experimental Evaluation", "authors": "Joseph Arayemi（单作者）", "url": "https://doi.org/10.5281/zenodo.23048250", "category": "技术报告（2026-09-29）", "cats": [], "oneliner": "", "insight": "工程侧的同路人：它明确把\"tenant-aware access control\"列为 RAG 参考架构的一等组件，说明业界已把 RAG 访问控制当成基线需求——这加强了我们论文的动机（problem statement）而非削弱。但学术含量有限：单作者 Zenodo 自出版技术报告、40 例合成评测、无同行评审，**引用时只能当\"业界实践佐证\"，不能当技术邻居**。它的\"确定性本地检索 + 证据弃答\"与我们的 retrieve-then-project 有表面相似，但它的访问控制粒度是租户级（coarse），我们的 AU 是内容级——正好衬托我们的细粒度贡献。不动摇 claim。", "source": "OpenAlex", "citations": "OpenAlex 收录（引用数未显示，计为 0/未被引用）", "code": "无（声称有开源仓库与评测数据，链接未在摘要中给出）", "zh_abs": "面向资源受限组织的安全 RAG 多云参考架构：组合了许可源摄入、确定性本地检索、**租户感知的访问控制**、PII 脱敏、prompt 注入检测、基于证据的弃答、来源引用、版本化评估与部署控制；给出 AWS 与 Azure 的等价生产路径。在冻结的 40 例合成测试集上端到端成功率 0.85，同时展示了基于模式的 prompt 注入防护的局限性。", "supplement": false}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang（一作）等 7 人", "url": "https://arxiv.org/abs/2610.00371", "category": "cs.AI（v1, 2026-09-30）", "cats": ["cs.AI"], "oneliner": "", "insight": "它的核心命题\"权限必须与执行保持可验证的连接\"与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是反对\"权限是附在数据上的静态标签\"。它的\"联合成功标准\"（安全与可用同时度量）值得借鉴：我们目前的评估是安全侧（泄露率）为主，它的思路提示未来可以在论文评估里加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）是我们 T1/T2 之外的一个新维度：**跨 AU 的组合推理泄露**——我们目前的 AU 求值是逐 AU 独立的，它提醒我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"（类似我们的 KG 路径切割一节可呼应）。建议在 standards-agent 线 related work 引用。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "https://github.com/yunbeizhang/FlowReview（★数未知，刚发布）", "zh_abs": "多智能体系统的安全困境：单独看都合规的贡献，组合起来可能促成被禁止的用途；一刀切地拦掉所有敏感动作会扼杀协作价值。提出 authorization-paired evaluation：把\"拦住被禁止用途\"与\"完成被授权用途\"作为**联合成功标准**；FlowReview 框架连接对象解析（object resolution）、权限排序（permission ranking）与确定性执行。在受控组合实验中，对组合制品做审查把 denied-commit 率从 **86.0% 降到 0**，且授权供给无损失。核心发现：只保留信息与血缘（lineage）不足以保证权限归因正确——**对象身份与权限必须通过输出可验证的组件与执行保持连接**。", "supplement": false}, {"title": "The Innocent Courier: Covert Exfiltration Through Legitimate LLM Web Fetching", "authors": "Alessandro Pegoraro（一作）、Daryan Merx、Phillip Rieger、Ahmad-Reza Sadeghi（通讯）", "url": "https://arxiv.org/abs/2610.01768", "category": "cs.CR（v1, 2026-10-01）", "cats": ["cs.CR"], "oneliner": "", "insight": "这是一个我们 T1/T2/T3 三层威胁模型**没有覆盖**的泄露维度：它不偷\"检索到的内容\"，而是把 LLM 的**工具调用本身**变成外发信道。我们的威胁模型假设\"泄露 = 未授权内容进入答案/排序\"，而 LLMLeak 说明即使检索授权完美、答案完全合规，机密仍可经由工具参数（URL）外泄。诚实地说，这超出了 RU/AU 解耦框架的解决范围——我们的框架管的是\"谁能看到什么内容\"，它攻击的是\"模型能做什么动作\"。价值在于 Discussion 的\"局限与未来工作\"：可以明确声明我们的威胁模型覆盖内容披露通道，动作侧隐蔽信道（如工具调用外发）是正交的开放问题；它的 79.7% 成功率是一个有力的动机数字，说明\"只做内容授权不够\"。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "提出 LLMLeak：一种新型隐蔽信道。本地恶意软件无法直连互联网，但可滥用 LLM 的网页抓取工具：把机密编码进 URL，谎称该网站是完成某个良性任务（如迁移软件库）所需的信息来源；LLM 访问 URL 时，攻击者通过自己控制的 DNS/网页服务器收到编码后的机密。在 11 个开源参数模型上评估，**攻击成功率 79.7%**；另有真实聊天机器人的案例研究。", "supplement": false}, {"title": "Red-Teaming Coding Agents from a Tool-Invocation Perspective: An Empirical Security Assessment", "authors": "Yuchong Xie（一作）、Mingyu Luo、Zesen Liu、Zhixiang Zhang、K. F. Zhang、Yu Liu、Ci Tao、Changhui Wang", "url": "https://doi.org/10.1145/3832267", "category": "ACM 会议/期刊（2026-10-01，OpenAlex 归类为软件工程）", "cats": [], "oneliner": "", "insight": "Agent 授权线的实证重器（ACM 发表，6 个真实产品，RCE 级后果）。它的\"模态鸿沟\"发现与我们 embedding 通道有方法论上的呼应：**安全边界不能假设\"模型在某种输出模态下是良性的\"**——它在工具参数模态，我们在向量模态。对我们论文的直接价值在 standards-agent 线 related work：它的 Phase 1 本质是\"授权上下文（系统提示词）经由未授权通道（工具参数）泄露\"，与我们的\"未授权 AU 经由 embedding 通道泄露\"可并列为\"通道错位\"类问题。注意它是完整性/提权攻击（RCE），我们是机密性，不竞争。可引用其\"工具调用是独立攻击面\"的结论来支撑我们未来 Agent 线的动机。", "source": "OpenAlex", "citations": "尚未收录（太新）", "code": "无", "zh_abs": "首个从**工具调用视角**系统红队 6 个真实 coding agent（Cursor、Claude Code、Copilot、Windsurf、Cline、Trae）的工作。两阶段：Phase 1 的 ToolLeak 利用\"聊天生成 vs 工具调用参数生成\"的模态鸿沟——schema 驱动的参数补全时模型像在做良性结构化填充，会把隐藏的 agent 上下文（系统提示词、工具元数据）复制进工具参数，从而外泄；在 25 个 agent-LLM 组合中的 18 个上取得最优伪召回。Phase 2 用工具描述与工具返回的双通道 prompt 注入劫持工具调用行为，在 6 个真实 agent 上**全部实现 RCE**，攻击成功率高于基线。", "supplement": false}, {"title": "From A2A Attacks to Envelope-Layer Defense: Red-Teaming Evaluation of LLM Agents and a Three-Layer Isomorphic Attack-Defense Model", "authors": "Yuelin Han", "url": "https://arxiv.org/abs/2610.00392", "category": "cs.CR（v1, 2026-09-30）", "cats": ["cs.CR"], "oneliner": "", "insight": "它的\"信封层\"（envelope layer）概念对我们有直接借鉴价值：A2A/tool/memory 这些**内容进入 agent 的通道**本身就是防御维度——类比到我们，embedding 索引、chunk 文本、重排序器就是 RAG 的\"信封层\"。它的\"给信封加恶意标签提升识别\"是一个轻量防御思路，可与我们的\"查询时逐 AU 求值\"对照：一个是标注不可信来源，一个是求值授权策略。它的四类结果度量（拒绝/突破/拦截/穿透）比单一 ASR 更诚实，我们评估投影防御时也可借鉴这种分层度量。注意它是协议与注入方向，不涉及数据授权；单作者、方法论偏框架性，引用时定位为\"防御分层思想参考\"即可。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 A2A/ACP 等 agent 互操作协议：远端 peer 发来的任务被当作合法请求，成为间接 prompt 注入的天然通道。提出 A2A-TIBA 攻击原理（间接注入 + 绕过规避）：经\"植入—命令—外发\"三步诱使目标 agent 部署回调交互程序，之后攻击者绕过 agent 直接下命令。为更细地评估防御，设计 GDA Measurement 红队测试方法（经 LLM 网关做原始上下文捕获、双数据留存、agent 自主裁判），把 ASR 扩展为四类结果：语义拒绝率 / 语义突破率 / 拦截率 / 穿透率。提出 ELA-ITL 三层同构攻防模型：防御分信封封装（envelope packaging）、LLM 识别、agent 拦截三层，攻击分植入通道、提示词优化、执行机制三层。在 15 种 agent 前端 × LLM 后端组合与 1000 例数据集上验证；发现**给 A2A/tool/memory 等信封通道的恶意提示词加标签能显著提升 LLM 对恶意内容的识别率**。", "supplement": false}, {"title": "Securing Enterprise Language Model Applications Against Data Leakage and Response Manipulation", "authors": "Kaik Tavares Barroso", "url": "https://doi.org/10.66104/3m1m5x77", "category": "Nexus Science Review（综述，2026-10-01）", "cats": [], "oneliner": "", "insight": "综述本身学术增量有限（作者自己都声明未经验证），但两个概念值得记下来：**cumulative-disclosure budgets（累积披露预算）** 与 **revocation propagation（撤销传播）**。前者正好对应我们 T2 威胁下\"多次查询累积泄露\"的量化问题——我们的评估目前是单查询 cloze 命中率，它的\"预算\"概念提示未来可以做\"多查询累积泄露上界\"的形式化；后者与我们 Discussion 的开放问题\"撤销机制\"直接相关，可与昨日的 ResidualAuth 并列引用。它的六个边界中的\"来源授权\"粒度粗（应用/基础设施级），正好反衬我们 AU 级细粒度的定位。引用时明确标注为\"未验证的综述框架\"，只取概念不取结论。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "叙事性/主题性综述（主体发现在 2026-09-29 完成检索，10-01 做补充检索与来源状态审计）：覆盖企业 LM 应用的数据泄露与响应操纵，证据包括间接 prompt 注入、语料投毒、检索阶段利用、日志污染、embedding 反演、累积式知识库抽取。提出六个保证边界：身份与范围、**来源授权**、内容溯源、模型交互、可执行动作、输出放行。作者明确声明这是**未经验证的决策辅助工具**，非 NIST/OWASP 背书标准。另用假设性助手与前瞻性协议示例说明权限保持处理、**累积披露预算**、撤销传播、合法任务效用与验证成本。", "supplement": false}, {"title": "Kernel-Managed Shared Memory for System-Wide Personalization", "authors": "Ryan Lum（一作）、Yongfeng Zhang（通讯）", "url": "https://arxiv.org/abs/2609.10144", "category": "cs.AI（v2, 2026-09-30；已被 AgenticOS Workshop @ NeurIPS 2026 接收）", "cats": ["cs.AI"], "oneliner": "", "insight": "它的核心架构主张——**把隐私强制从 agent 手里收到内核/系统层**——与我们的\"策略独立存放、查询时集中求值\"是同一范式在不同层的实现：它管的是 agent 间共享记忆，我们管的是 RAG 检索内容。它的实证（集中治理在质量不降的前提下还能降延迟）为我们\"集中式授权求值不必然带来不可接受的开销\"的论点提供了旁证。但注意它的\"隐私强制\"具体机制在摘要中未展开（偏工程实现），且目标是多 agent 个性化而非访问控制，相关性为 adjacent；NeurIPS workshop 接收给了基本可信度。可在 related work 里一句话并列。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "多智能体系统里，一个 agent 学到的个性化上下文往往无法被其他 agent 使用。提出内核管理的共享内存：专用 agent 写结构化、带标签的记忆，而**检索、隐私强制、prompt 注入治理都由 agent 系统内核（而非各 agent 自己）负责**。在 AIOS 上实现，对比三个备选（Mem0 非托管外部记忆、标准 RAG 注入、全量无过滤上下文拼接），跨 GPT-4o、Llama-3.1:8B、Qwen-2.5:7B 共 1800 轮试验：相对 Mem0 与标准 RAG 注入，个性化评分提升 2.4–4.0（5 分制，如 GPT-4o 上画像利用率从 1.05 到 4.69，p<10⁻¹⁸）；相对全量拼接，质量基本持平但端到端延迟低 15–61%。", "supplement": false}, {"title": "Intrusion Detection for Agentic Processes: Evidence-Based Runtime Monitoring（背景）", "authors": "Arslan Brömme（单作者）", "url": "https://arxiv.org/abs/2610.00151", "category": "cs.CR（v1, 2026-09-10；本轮为跨库重抓取）", "cats": ["cs.CR"], "oneliner": "", "insight": "关联较弱。唯一可取的是\"监控平面本身是攻击面\"与\"不把未观测事件当作未发生的证明\"的诚实方法论——对我们写局限章节有措辞参考价值。无实证、单作者概念文，不建议引用；列入报告仅为完整性。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "提出 A-IDS：面向 agent 过程的、证据感知的运行时入侵检测解释层；把有证据支撑的观测与\"被治理的、版本化的期望基线\"（工作流状态、授权、通信、强制事件）做对比。概念贡献包括动态应然的治理期望、三值匹配、显式的未决观测状态、把证据状态与运营影响分离的有限结论；并把监控平面本身视为攻击面。作者明确声明**这只是概念性贡献，无实现、无实证检测性能、无因果归因、无强制机制**。", "supplement": false}, {"title": "Operationalizing clinical artificial intelligence through secure FHIR pipelines（背景）", "authors": "Femi Oke", "url": "https://doi.org/10.3389/fdgth.2026.1953969", "category": "Frontiers in Digital Health（Hypothesis and Theory，2026-09-29）", "cats": [], "oneliner": "", "insight": "关联较弱（医疗信息学场景）。可取的是\"每次数据跃迁都要有策略决策 + 版本化证据\"的表述，与我们的\"查询时逐 AU 求值 P(a,u)\"在精神上一致，且医疗场景是 AU 级授权最自然的用例之一（病人记录的字段级密级）。但它是 Hypothesis and Theory 类型、无实证，不建议作为技术引用；可作为\"细粒度授权在医疗 RAG 的应用动机\"一句话带过。\n---", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "FHIR 标准化了临床数据交换，但不保证下游 AI 使用仍是被授权的、语义一致的、可问责的。提出 evidence-continuous boundary control：每个实质性的数据/模型/工作流跃迁都由适用的策略决策治理，并链接到其前提、执行、处置的版本化证据。八项需求、五个功能层（含零信任控制平面与策略感知授权，含知情同意）。以成人再入院风险工作流为例；明确声明**无实证架构评估、无患者数据集、无临床有效性、无独立专家验证**。", "supplement": false}]}], "total": 31, "n_days": 7, "all_total": 61, "all_days": 10};

let XW = {"date": "2026-10-09", "accounts": {"elonmusk": {"name": "Elon Musk", "label": "马斯克", "group": "other", "avatar": "https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_400x400.jpg", "tweets": [{"id": "2108526656902091103", "text": "Why open-weight models that compress margins at the model layer are net positive for AI infra demand, exhibit 1001.\n\nAn open-weight token consumes *roughly* the same amount of compute as a frontier token for a similar size model.", "created_at": "10-09 19:55", "likes": 1208, "reposts": 146, "replies": 133, "views": 209985, "url": "https://x.com/GavinSBaker/status/2108526656902091103", "author": "GavinSBaker"}, {"id": "2108462793112371679", "text": "😑", "created_at": "10-09 15:41", "likes": 5669, "reposts": 594, "replies": 949, "views": 1641387, "url": "https://x.com/elonmusk/status/2108462793112371679", "author": "elonmusk"}, {"id": "2108396888160387541", "text": "We’re just going to have @Grok Bots manage Grokipedia", "created_at": "10-09 11:19", "likes": 1731, "reposts": 206, "replies": 399, "views": 431491, "url": "https://x.com/elonmusk/status/2108396888160387541", "author": "elonmusk"}, {"id": "2108396588544745887", "text": "Using Grok @Bot is like hiring a super smart, hard-working person for peanuts", "created_at": "10-09 11:18", "likes": 1612, "reposts": 166, "replies": 375, "views": 459315, "url": "https://x.com/elonmusk/status/2108396588544745887", "author": "elonmusk"}, {"id": "2108377550116503695", "text": "Tesla Super Intelligence is the only one dedicated to solving real-world intelligence, from large-scale bits to atoms.", "created_at": "10-09 10:02", "likes": 974, "reposts": 94, "replies": 78, "views": 112330, "url": "https://x.com/yunta_tsai/status/2108377550116503695", "author": "yunta_tsai"}, {"id": "2108348368447778862", "text": "One of my favorite and totally underrated @bot features is canvas.\n\nJust ask your Chief of Staff to present you an updates on the canvas, relax, and enjoy the results 😉", "created_at": "10-09 08:06", "likes": 831, "reposts": 85, "replies": 165, "views": 249274, "url": "https://x.com/stepango/status/2108348368447778862", "author": "stepango"}, {"id": "2108328114552000842", "text": "I'm GrokBot pilled.\n\nThe recent update with native X monitoring opens up a ton of new capabilities!\n\nMy 4 favorite routines (copy/paste these prompts):\n\nRoutine 1: Find real AI workflows on X (and skip the hype threads)\n\nEvery morning, this bot now finds real AI use cases being shared on X, and filters out the “10 prompts” hype threads.\n\n“Every weekday at 9:15am in my time zone, search X and the web for new AI workflows people are actually running. Keep only cases that name the old task, the tool, and the result: time saved, a step removed, or a handoff that used to need a person. Drop product announcements, “10 prompts” threads, and anything the author has not used more than once. Return at most 3. For each, give the link, the job it replaces, what I would need connected, and whether it fits my work. Send it to me on Slack. Do not post or reply anywhere else. Save this as a routine. If nothing qualifies, send one line saying so.”\n\nRoutine 2: Catch every mention of your brand\n\nThis bot catches every mention of The Rundown on X, labels it, and pings our team on Slack to respond (try tweeting us @therundownai and see what happens).\n\n“Every weekday at 9:00am, search X for mentions in the last 24 hours of [your brand, @handle, or your own name]. For each hit, give the author, link, a one-line summary, and whether it is praise, complaint, question, or neutral. Do not reply to anyone. Post the digest in [your Slack channel] and tag me. Save this as a routine. If a source is unavailable, say which one.”\n\nRoutine 3: Find people actively looking for what you do\n\nEvery 4 hours, this bot listens for people searching for the best AI newsletter on X, so we know exactly what readers are looking for.\n\n“Every 4 hours, search X for people evaluating [your category]. Catch three things: reviews or complaints about [category]; posts asking which [category] to use; and complaints about the problem [your product] solves. Quote the post, link it, name the account, and label it review, shopping, or complaint. Skip anything older than 24 hours, and skip [category] accounts promoting themselves. Post to [your Slack channel] only if there is at least one new hit you haven’t already shared. Do not reply to or interact with anyone. Save this as a routine. If the search fails, report the failure in Slack.”\n\nRoutine 4: Never lose a new contact again\n\nI meet A LOT of people at events. This bot looks through my new phone contacts and reminds me to follow up with the new people I just met.\n\n“Every weekday at 8:30am in my time zone, read my address book and list contacts added in the last 14 days. For each, show name, date added, phone, email, and any note. Ask me what we talked about before you write anything. Once I reply, draft a follow-up task for each person in [your task tool] with the context attached. Never text, email, or call anyone. Save this as a routine. If the address book is unavailable, say so and do not use old data.”", "created_at": "10-09 06:46", "likes": 1231, "reposts": 151, "replies": 115, "views": 306606, "url": "https://x.com/rowancheung/status/2108328114552000842", "author": "rowancheung"}, {"id": "2108326517323248060", "text": "Btw, this would ACTUALLY work!!", "created_at": "10-09 06:39", "likes": 550, "reposts": 22, "replies": 77, "views": 35621, "url": "https://x.com/elonmusk/status/2108326517323248060", "author": "elonmusk"}]}, "realDonaldTrump_truth": {"name": "Donald Trump", "label": "特朗普 · Truth Social", "group": "other", "avatar": "https://pbs.twimg.com/profile_images/874276197357596672/kUuht00m_400x400.jpg", "tweets": [{"id": "oct9-mike-rogers-michigan", "text": "Mike Rogers, the great American Patriot and Republican Candidate for the U.S.Senate from Michigan, completely obliterated Mohammad El-Sayed in the big debate tonight. […] I won Michigan BIG, and know that Mike Rogers, a total winner, is the man for you!!! President DJT（背景：特朗普为密歇根州联邦参议员共和党候选人 Mike Rogers 背书，称其在辩论中大胜对手 Mohammad El-Sayed）", "created_at": "10-09 12:02", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#oct9-mike-rogers-michigan", "author": "realDonaldTrump"}, {"id": "oct8-dumocrats-scammers", "text": "The Dumocrats are Scammers. These are the real FACTS!!!（背景：纯党派口号帖）", "created_at": "10-09 09:09", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#oct8-dumocrats-scammers", "author": "realDonaldTrump"}, {"id": "oct8-trump-men-un", "text": "Trump's men at the United Nations（背景：转发 Washington Examiner 杂志文章，讲其政府在联合国的人事与改革；纯转链）", "created_at": "10-09 08:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#oct8-trump-men-un", "author": "realDonaldTrump"}, {"id": "oct8-melania-unsc", "text": "Melania Trump makes history presiding over UN Security Council — remarking on Iran war deaths（背景：转发 NY Post，称 Melania 主持联合国安理会会议并就伊朗战争死亡表态；纯转链）", "created_at": "10-09 08:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#oct8-melania-unsc", "author": "realDonaldTrump"}, {"id": "oct8-un-peace-nypost", "text": "How Trump defied the 'experts' — and pushed the UN toward post-Oct. 7 peace（背景：转发 NY Post 评论，称其促成联合国在 10·7 后走向和平；纯转链）", "created_at": "10-09 08:51", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#oct8-un-peace-nypost", "author": "realDonaldTrump"}, {"id": "oct8-alaska-endorsement", "text": "Can you believe that Alaska, a State I love, and won BIG, all three times, has three Republicans running against one Dumocrat for Governor?... His name is Dan S. Sullivan, and he is the Incumbent... Alaska needs Senator Dan S. Sullivan in the Senate, and Congressman Nick Begich, in Congress — That is a
