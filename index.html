y we’ll either ship one thing that is a clear improvement and relevant for most codex/work users or ship a full reset. Let the improvements begin.", "created_at": "10-05 04:33", "likes": 11333, "reposts": 537, "replies": 1700, "views": 530381, "url": "https://x.com/thsottiaux/status/2106845241357824205", "author": "thsottiaux"}, {"id": "2106610099720720811", "text": "All right, we’re locking in. Only things being worked on are simplifications, more efficiency for more usage, groundbreaking features or new models. \n\nSometimes you have to invest ahead of the curve, but feedback is clear that you all want things to get simpler. On it.", "created_at": "10-04 12:59", "likes": 13286, "reposts": 311, "replies": 1788, "views": 1240904, "url": "https://x.com/thsottiaux/status/2106610099720720811", "author": "thsottiaux"}, {"id": "2106603980386394123", "text": "What it did\n\n- delete all categories of email that were not needed for me to keep, validating them in batch\n- identify labels for types of work that I do and label all the emails appropriately\n- walked me through emails that needed a reply, searching for relevant context in the background to help get things right\n\nand in the process I was able to go through a lot of feedback and requests people send me directly through email. It was a good Saturday.", "created_at": "10-04 12:35", "likes": 520, "reposts": 11, "replies": 64, "views": 115448, "url": "https://x.com/thsottiaux/status/2106603980386394123", "author": "thsottiaux"}, {"id": "2106602729875685780", "text": "I have never in my life achieved inbox zero until I just made it an active goal for my dot to help get it done. Let’s see how long it lasts, but it’s a great feeling.", "created_at": "10-04 12:30", "likes": 2547, "reposts": 56, "replies": 461, "views": 427594, "url": "https://x.com/thsottiaux/status/2106602729875685780", "author": "thsottiaux"}, {"id": "2106501204285239560", "text": "If we were to add one more sidebar, what should be in it", "created_at": "10-04 05:46", "likes": 3474, "reposts": 55, "replies": 2238, "views": 651555, "url": "https://x.com/thsottiaux/status/2106501204285239560", "author": "thsottiaux"}, {"id": "2106439068557144179", "text": "What’s one thing that’s missing in codex that you wish we had?", "created_at": "10-04 01:39", "likes": 5569, "reposts": 120, "replies": 7988, "views": 1398185, "url": "https://x.com/thsottiaux/status/2106439068557144179", "author": "thsottiaux"}, {"id": "2106252868307271752", "text": "Fortunately our future models will be much better at code deletion and simplification. Just in time", "created_at": "10-03 13:19", "likes": 12586, "reposts": 284, "replies": 1075, "views": 924320, "url": "https://x.com/thsottiaux/status/2106252868307271752", "author": "thsottiaux"}, {"id": "2106239435461579088", "text": "All fixed. Surprising number of Pro 500 users on here.", "created_at": "10-03 12:26", "likes": 3904, "reposts": 68, "replies": 593, "views": 753515, "url": "https://x.com/thsottiaux/status/2106239435461579088", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2106176799545970710", "text": "Building with the Agents API?\n\nCatch up on what’s new:", "created_at": "10-03 08:17", "likes": 481, "reposts": 25, "replies": 63, "views": 78999, "url": "https://x.com/OpenAIDevs/status/2106176799545970710", "author": "OpenAIDevs"}, {"id": "2106169182257811709", "text": "Awesome Sites has voting. Go vote for your favorites! Personally I think Jelly Hockey needs some love. #awesomesites", "created_at": "10-03 07:47", "likes": 48, "reposts": 7, "replies": 8, "views": 16564, "url": "https://x.com/simpsoka/status/2106169182257811709", "author": "simpsoka"}, {"id": "2106159012538442068", "text": "The team behind Agents API continues to cook. Here's what's new this week:\n\nComputer use: Spin up a browser + agent with 1 API call 🖥️\nBedrock Managed Agents: Agents API except AWS\nGPT‑6.1 Sol 🌞\nEnvironment sizes: Spin up a light or beefy oai-hosted environment 💪\nDashboard improvements: configure subagents and more from the dashboard 📈\nEnvironment portability: Re-use environments across multiple sessions 🤖\nOverall better reliability: 99.97% turn reliability, fewer SSE disconnects, 20% faster tool calls 🪨\n\nhappy building ❤️ u all", "created_at": "10-03 07:06", "likes": 216, "reposts": 17, "replies": 27, "views": 95698, "url": "https://x.com/stevendcoffey/status/2106159012538442068", "author": "stevendcoffey"}, {"id": "2106152299026661641", "text": "Your dot learns how you work, keeps context across apps, coordinates Codex tasks, and flags what needs your attention.", "created_at": "10-03 06:40", "likes": 794, "reposts": 46, "replies": 105, "views": 88904, "url": "https://x.com/OpenAIDevs/status/2106152299026661641", "author": "OpenAIDevs"}, {"id": "2106152048924438967", "text": "https://x.com/i/article/2106076978206175232", "created_at": "10-03 06:39", "likes": 234, "reposts": 15, "replies": 14, "views": 42504, "url": "https://x.com/OpenAIDevs/status/2106152048924438967", "author": "OpenAIDevs"}, {"id": "2106126796408451308", "text": "Got to take the main stage at OpenAI DevDay to talk about plugin extensions!\n\nA few takeaways for developers building plugins:\n\n1. Make your plugin part of how people work.\nPlugin extensions let you build apps that open from ChatGPT’s sidebar, side panel, custom file viewers and editors, and settings for your plugin. Full spec here:\nhttp://github.com/openai/mcp-extensions/blob/main/docs/spec.md⁠\n\n2. Put care into what happens after installation.\nYou can provide a custom onboarding skill to guide people through setup and help them learn what your plugin can do. Use that first experience to help someone accomplish something useful and give them a reason to come back. \n\n3. Make it easier to get started.\nPlugins can support Sign in with ChatGPT so people can connect using their existing ChatGPT account. A smoother sign-in experience can help more people get through setup and start using what you’ve built. \n\n@vigyso wrote a great walkthrough of Sign in with ChatGPT for developers who want to learn more:\nhttp://developers.openai.com/cookbook/articles/sign-in-with-chatgpt⁠\n\nHere are some of the folks behind the platform: @mxstbr , @ShopifyVC , @tarstarr , and @glencoates . We’re listening to your feedback and excited to support more of the open ecosystem. \n\nHope these help you get building. I’d love to see what you make!", "created_at": "10-03 04:58", "likes": 164, "reposts": 15, "replies": 21, "views": 30299, "url": "https://x.com/coreyching/status/2106126796408451308", "author": "coreyching"}, {"id": "2106081991200579883", "text": "Today was mostly about modularity.\n\nI’m building MOSS to be modular from day one, so getting started doesn’t mean buying exactly the hardware I use. Maybe you already have a Raspberry Pi lying around from another project. Maybe a more affordable depth camera fits your budget better.\n\nPi 5, with or without Hailo, or Jetson. RealSense or Gemini. Different combinations, same rover.\n\nThat’s what I committed to when I applied to the @OpenAIdevs Codex Physical Builds program. Here’s that idea taking shape.", "created_at": "10-03 02:00", "likes": 240, "reposts": 20, "replies": 13, "views": 22924, "url": "https://x.com/metrox_eth/status/2106081991200579883", "author": "metrox_eth"}, {"id": "2106050413313286265", "text": "In a self driving car using codex to install a game my dot made for me while I was asleep. This is wild! \n\n@OpenAI @OpenAIDevs", "created_at": "10-02 23:55", "likes": 100, "reposts": 8, "replies": 7, "views": 15978, "url": "https://x.com/NicholasRuncie/status/2106050413313286265", "author": "NicholasRuncie"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2105733864152858919", "text": "In physics, an “impedance mismatch” occurs when two systems each work well but are poorly matched.\n\nIn this Science Blog guest post, Harvard physicist Matthew Schwartz argues that something similar is happening with AI and science. LLMs are capable at many things, but working with them as you would with a human collaborator isn’t currently the best way to elicit their scientific strengths.\n\nTo address this mismatch, Schwartz created a toolkit for exact calculations in quantitative science. Because similar calculations often emerge in very different areas of science, Claude found connections to ecology, population genetics, and a dozen other fields, and Schwartz worked with domain experts to steer it towards interesting questions.\n\nRead more about these projects here: https://www.anthropic.com/research/claude-shaped-science", "created_at": "10-02 02:57", "likes": 3621, "reposts": 405, "replies": 406, "views": 601348, "url": "https://x.com/AnthropicAI/status/2105733864152858919", "author": "AnthropicAI"}, {"id": "2104982629884063840", "text": "What do you want from AI?\n\nWe’re launching a new study with Anthropic Interviewer to learn more about your experiences using AI, what role you want it to play in your life and the world, and what you want from the companies building it.\n\nLast December, 81,000 people told us about their hopes and fears about AI in the largest qualitative study ever done. This time, we’re giving participants the option to make their responses public so that anyone, not just Anthropic, can learn from them.\n\nWhat you tell us will shape The Anthropic Institute’s research and inform the decisions we make. If many people say companies like Anthropic should be doing something differently, that will be on the record, where anyone can point to it.\n\nThe study runs Sept 29 to Oct 6 and is open to Free, Pro, and Max users on Claude and Claude Code.\n\nTake part here: http://claude.ai/anthropic-interviewer/your-thoughts-on-ai?from=social", "created_at": "09-30 01:12", "likes": 2098, "reposts": 204, "replies": 397, "views": 329087, "url": "https://x.com/AnthropicAI/status/2104982629884063840", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2105707090547478914", "text": "Watch → https://goo.gle/4de3fiR\nSpotify → https://goo.gle/4dKZwte\nApple Podcasts → https://goo.gle/4dQqKyH\n\nOr listen wherever you get your podcasts! 🎧", "created_at": "10-02 01:11", "likes": 35, "reposts": 5, "replies": 8, "views": 27608, "url": "https://x.com/GoogleDeepMind/status/2105707090547478914", "author": "GoogleDeepMind"}, {"id": "2105707085287567709", "text": "When AI-generated content has become so realistic, how do we verify what's made by human, machine, or nature?\n\nWe explore the vital role of provenance – and how imperceptible watermarking can safeguard both digital media and biological designs – on our podcast. ↓\n\nTimecodes:\n00:00 Introduction\n00:34 What is a watermark?\n04:35 SynthID\n15:16 Images and video\n19:28 SynthID Bio\n28:00 Future of resilience", "created_at": "10-02 01:11", "likes": 551, "reposts": 56, "replies": 122, "views": 72875, "url": "https://x.com/GoogleDeepMind/status/2105707085287567709", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2105828136428691774", "text": "In a busy week, SynthID Bio, our watermarking tech for AI-designed proteins, was a big big step forward for scientific integrity and biosecurity! Congrats to the team @GoogleDeepMind", "created_at": "10-02 09:12", "likes": 1407, "reposts": 112, "replies": 198, "views": 372506, "url": "https://x.com/sundarpichai/status/2105828136428691774", "author": "sundarpichai"}, {"id": "2105817662651777367", "text": "I remember the first meeting where the team pitched the idea of putting compute in space - exciting idea!\n\nToday's successful launch with our partner @planet prototype satellite shows how far we've come...and how far there is to go. Thanks for the lift, @SpaceX, another spectacular booster landing too🚀", "created_at": "10-02 08:30", "likes": 11683, "reposts": 1124, "replies": 459, "views": 1145206, "url": "https://x.com/sundarpichai/status/2105817662651777367", "author": "sundarpichai"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2105288808929558891", "text": "New Research: We are releasing ExplorationBench, a benchmark for measuring how AI systems explore.\n\nScientific discovery begins where known problems end: a system has to frame hypotheses, design experiments, and learn from the results. Evaluating this is hard. Genuinely new answers cannot be checked quickly, and in familiar domains a model can simply recall what it has seen.\n\nAddressing this challenge, researchers from Tencent Hy, Fudan University, and Tsinghua University built verifiable Alien Worlds. Their rules are executable, so every answer is checked exactly, and they conflict with familiar knowledge, so recall alone cannot solve the tasks.\n\n🔹 Two sandboxes: AlienCode (31 hidden rule changes, 70 tasks) and AlienLogic (24 patched inference rules, 70 theorems)\n🔹 A flawed manual, four rounds of self-designed probes, and closed-book tests after every round\n🔹 Every answer graded by an interpreter or a proof checker, with no LLM judge\n\nWhat we found across 10 frontier AI systems:\n1️⃣ Getting feedback is more effective than thinking alone. No AlienCode run starts above 15.7%; after four rounds the best reaches 89.0%, while the same turns without feedback stay at 0.5–11.0%.\n2️⃣ Designing the experiments matters. Replaying a system's own best probes gives it exactly the same evidence, yet in AlienCode 9 of 10 systems do worse than when they chose the probes themselves.\n3️⃣ Knowing a rule is not using it. Even when every required rule is stated correctly, tasks are solved only 73.4% of the time.\n4️⃣ One score hides a lot. The same system under the same budget ended anywhere from 5.7% to 79.0%, and rankings barely transfer between the two worlds.\n\nCL-bench asked whether models can learn from context. ExplorationBench asks whether they can discover the rules themselves.\n\n📄 Paper: https://arxiv.org/abs/2609.30199\n🌐 Website & leaderboard: https://explorationbench.com\n📝 Blog: https://explorationbench.com/blog/\n💻 Code (coming soon): https://github.com/Tencent-Hunyuan/ExplorationBench", "created_at": "09-30 21:29", "likes": 335, "reposts": 36, "replies": 10, "views": 34301, "url": "https://x.com/TencentHunyuan/status/2105288808929558891", "author": "TencentHunyuan"}, {"id": "2105215199192207710", "text": "3 tracks. 3 winners. Go and Create. 🥇", "created_at": "09-30 16:36", "likes": 52, "reposts": 2, "replies": 1, "views": 7105, "url": "https://x.com/TencentHunyuan/status/2105215199192207710", "author": "TencentHunyuan"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": [{"id": "2105915715241062644", "text": "Please check out @DeepSeekHarness. We just released packaged desktop versions for macOS and Windows; Linux users can get it from the @​deepseek-ai/dsh package on npm. https://deepseek.com/harness", "created_at": "10-02 15:00", "likes": 4536, "reposts": 354, "replies": 221, "views": 424718, "url": "https://x.com/deepseek_ai/status/2105915715241062644", "author": "deepseek_ai"}, {"id": "2097930627949711516", "text": "🌐 Supporting open source. Expanding deployment options.\n\nWe’ll work closely with the open-source community on V4.1-Flash inference support and explore more deployment options.\nPlanning a large-scale deployment with 2,000 GPUs + a storage cluster? Let’s talk.\n\n🔹 Model: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash\n🔹 Paper: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf\n\n6/6", "created_at": "09-10 14:10", "likes": 2853, "reposts": 212, "replies": 68, "views": 355259, "url": "https://x.com/deepseek_ai/status/2097930627949711516", "author": "deepseek_ai"}]}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2102372557190230244", "text": "Meet the new Kimi Browser Extension, formerly Kimi WebBridge.\n\nFrom your browser sidebar, you can chat with Kimi to navigate websites, fill out forms, and get things done.\n\nFor repetitive tasks, record your steps once and save them as a skill. Kimi can take it from there next time.\n\nAvailable now on http://kimi.ai/products/kimi-browser-extension and the Chrome Web Store.", "created_at": "09-22 20:20", "likes": 972, "reposts": 71, "replies": 61, "views": 76547, "url": "https://x.com/Kimi_Moonshot/status/2102372557190230244", "author": "Kimi_Moonshot"}, {"id": "2102244258531213596", "text": "Kimi K3 is now on Amazon Bedrock!\n\nRun coding, document analysis, and extended agent workflows with Bedrock's access, encryption, and auditing controls.  Explicit prompt caching supported.\n\nStart building with K3 on AWS 👉 https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3.html", "created_at": "09-22 11:51", "likes": 944, "reposts": 57, "replies": 37, "views": 974068, "url": "https://x.com/Kimi_Moonshot/status/2102244258531213596", "author": "Kimi_Moonshot"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/p I"}, {"id": "2106117690041712697", "text": "New York, see you next week 🗽✨\n\nMiniMax is heading to @advertisingweek New York, Oct 5–8. \n\n📍 Booth A16E, near the Food Trucks\n🎬 Live MiniMax H3 demos all week\n🎙️ Our panel with @krea_ai  × @fal  × @magnific : Thu 10/8 · 2:30 PM ET · Innovation Stage\n\nPanel details in the replies👇\n\n@AWNewYork_ #AWNewYork26", "created_at": "10-03 04:22", "likes": 345, "reposts": 4, "replies": 6, "views": 109426, "url": "https://x.com/MiniMax_AI/status/2106117690041712697", "author": "MiniMax_AI"}]}, "XiaomiMiMo": {"name": "Xiaomi MiMo", "label": "小米 MiMo 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1999123454247972865/8PkB-sNt_400x400.jpg", "tweets": [{"id": "2102153146525253816", "text": "💗", "created_at": "09-22 05:49", "likes": 452, "reposts": 9, "replies": 20, "views": 22053, "url": "https://x.com/XiaomiMiMo/status/2102153146525253816", "author": "XiaomiMiMo"}, {"id": "2102147404862800097", "text": "🔥", "created_at": "09-22 05:26", "likes": 535, "reposts": 13, "replies": 14, "views": 36750, "url": "https://x.com/XiaomiMiMo/status/2102147404862800097", "author": "XiaomiMiMo"}]}}, "errors": ["@elonmusk 抓取失败（twstalker: HTTP Error 403: Forbidden）"], "summary": "**Codex 或迎用量重置**：Codex 负责人 Tibo（@thsottiaux）宣布未来 28 天每天要么发布一个对大多数 Codex/Work 用户有明显改进的功能，要么发一次「full reset」（疑似额度重置）——结合他随后强调「simplifications、more efficiency for more usage」以及「Surprising number of Pro 500 users」，这次表态被社区解读为对用量/额度问题的正面回应，对 Codex 重度用户意味着配额压力可能缓解，值得持续盯。**OpenAI 新品「dot」曝光**：sama 称 dot 是他最喜欢的 OpenAI 产品，「每天都在变好」、能跨应用记上下文并协调 Codex 任务；官方账号也在密集预热同一产品，推测是个人 AI 助手类新品。**OpenAI 开发者侧更新**：Agents API 本周新增 computer use（一行 API 起浏览器+agent）、Bedrock 托管 Agents（除 AWS 外对齐 GPT‑6.1 Sol）与更大环境尺寸。**特朗普 Truth Social 刷屏 8 条**：最大外交动向是美伊伊斯兰堡谈判破裂后，CENTCOM 宣布自美东时间周一上午 10 点起封锁进出伊朗港口的海上交通；另宣布与科技巨头签署「超级智能白宫协议」、Bayer 22 亿美元俄亥俄制药园区等。**中国 AI 组活跃**：腾讯发布 ExplorationBench（测 AI 探索能力的新 benchmark）、DeepSeek 发布桌面端打包版 harness 并规划 2000 台规模的 V4.1-Flash 推理部署、Kimi K3 登陆 Amazon Bedrock、Qwen3.8-27B 通过 Nebius 上线。**谷歌组**：皮查伊宣布 SynthID Bio（AI 设计蛋白质的水印技术，是科研诚信与生物安全的大动作）与太空算力卫星原型发射成功。", "groups": [{"key": "openai", "label": "🤖 OpenAI"}, {"key": "claude", "label": "🟠 Claude"}, {"key": "google", "label": "🔵 Google"}, {"key": "china_ai", "label": "🇨🇳 中国 AI"}, {"key": "other", "label": "🌐 其他"}], "group_summaries": {"openai": "OpenAI 组是今日最热闹的一组。**Tibo 预告 Codex 28 天连续更新或「full reset」**，并明确当前工作优先级是简化、提升用量效率、突破性功能或新模型——对被额度困扰的用户是利好信号。**「dot」成为新的关键词**：sama 亲口称其为最喜欢的 OpenAI 产品，能学用户工作流、跨应用保持上下文、协调 Codex 任务并实现 inbox zero；@OpenAI 和 @OpenAIDevs 同步预热，发布在即。开发者侧：Agents API 新增 computer use（一行 API 拉起浏览器+agent）、Bedrock 托管 Agents（除 AWS 外可用 GPT‑6.1 Sol）。sama 还回应了与 Cerebras 合作的传闻，称双方在速度前沿有深度合作。", "claude": "@AnthropicAI 只有 2 条，偏品牌/研究向：Science Blog 刊登哈佛物理学家 Matthew Schwartz 的客座文章，用「阻抗失配」比喻 AI agent 与人类系统的配合问题；另发起一项新的用户研究（Anthropic Interviewer），想了解用户希望 AI 在生活中扮演什么角色。无产品发布，无用量相关消息。", "google": "谷歌组 2 条账号各有亮点。**皮查伊宣布 SynthID Bio**：给 AI 设计的蛋白质加不可见水印的技术，被他称为「科研诚信与生物安全的重大进展」——这是水印技术从媒体内容走向生命科学的关键一步。另透露与 Planet 合作的太空算力原型卫星发射成功，「把算力放上太空」的想法从会议走向现实。@GoogleDeepMind 则在播客里继续讲 provenance 与水印在鉴别 AI 生成内容中的作用。", "other": "other 组今日几乎是特朗普 Truth Social 的专场（8 条）。**最大的一条是外交/地缘**：美伊伊斯兰堡谈判（10 月 3–4 日，21 小时）破裂后，特朗普宣布美军将拦截向伊朗缴纳过航费的船只，CENTCOM 随即宣布自美东周一上午 10 点起封锁进出伊朗港口的海上交通——霍尔木兹海峡局势骤然升级。**AI 政策**：宣布与全球重要科技公司签署「历史性白宫超级智能协议」，并继续推动把 AI 改名为「super intelligence」。**产业**：Bayer 宣布在俄亥俄州哥伦布附近建 22 亿美元制药园区。其余为集会、meme 与人事任命（John Coale 出任人质事务特使）。马斯克账号今日无更新。", "china_ai": "中国 AI 组今日 7 账号全部有更新，信息量大。**腾讯混元发布 ExplorationBench**：一个测 AI 系统「探索能力」的新 benchmark（提假设、设计实验、从失败中学习），科学发现导向。**DeepSeek 两条实锤**：发布 macOS/Windows 桌面打包版 harness（Linux 走 npm），并宣布与开源社区合作做 V4.1-Flash 推理支持、规划 2000 台规模的大规模部署。**Kimi**：浏览器扩展（原 WebBridge）上线侧边栏，可导航网站、填表单、录制重复任务；**Kimi K3 登陆 Amazon Bedrock**，支持显式 prompt caching。**Qwen**：Qwen3.8-27B 通过 Nebius 上线，主打 agent 与深度研究场景。智谱一条为推广性质（$ZHIPU 代币宣传），已按推广处理。"}};

const FIN = {"date": "2026-10-05", "md": "# ☀️ 财经大事早报 2026-10-05（周一）\n\n## 📌今日大势\n\n**1. 中央财政首次给个人房贷贴息，刚需购房成本直降 1 个百分点。** 9 月 29 日财政部、央行、金融监管总局联合印发《关于实施居民购房贷款贴息政策的通知》，自 **10 月 1 日起**对符合条件的新发放首套商贷给予**年化 1%、最长 5 年**的财政贴息，单户本金上限 100 万元，实施期暂定 1 年。条件有三：新发放首套商贷（不含存量置换）、面积≤120㎡、总价≤150 万元。官方测算 **100 万元贷款最多省息近 5 万元**，相当于现行首套利率打了约 7 折；资金中央财政承担 90%、总规模不设上限、据实结算。这是继 9 月 28 日国常会\"研究稳定房地产市场政策\"后 24 小时内应声落地的增量政策，政策组合拳从供给侧（专项债收储）正式打到需求侧。后续盯：10 月中下旬 70 城房价与成交量是否出现\"银十\"脉冲，以及地方细则落地速度。（来源：新浪财经）[链接](https://finance.sina.cn/2026-09-29/detail-initpatt7606041.d.html)\n\n**2. 10 年期美债收益率冲上 5.34%，创 24 年新高，全球资产定价之锚剧烈摇晃。** 钜亨网报道，上周四 10 年期美债收益率升至 **5.34%**，为 2002 年以来最高；此前美联储 9 月**时隔 3 年首次升息**，本周还将公布 9 月会议纪要。利率高企的另一面是美股依然强势：标普 500 年内已涨近 13%，Q3 盈利预计增超 30%，英伟达盘中再创历史新高——但市场开始担心这轮涨幅过度依赖 AI 资本开支叙事。11 月 3 日美国中期选举也是变数。对中国的传导：美元指数跌至 101.67，**离岸人民币逼近 6.70**，人民币阶段性走强窗口打开。后续盯：本周 Fed 会议纪要的措辞（是否暗示继续加息）、美债收益率能否站稳 5.3% 上方。（来源：钜亨网、新浪财经）[链接](https://m.cnyes.com/news/id/6620631)\n\n**3. 石油\"战争\"开打：G7 宣布释放 1 亿桶储备，OPEC+ 宣布 11 月不增产。** G7 宣布通过 IEA 协调释放 **1 亿桶石油储备**（为期 4 个月、重点投放柴油），消息一出 WTI 盘中一度跌超 5% 至 88 美元；OPEC+ 主要成员国随即宣布 **11 月产量配额不作任何调整**（沙特维持 1047.8 万桶/日）。但别被单日波动迷惑：布伦特自 7 月已从 70 美元一路反弹至 **102 美元**上方，中东战事（美伊谈判破裂、霍尔木兹海峡封锁在即）才是定价主线。**11 月 29 日 OPEC+ 全体部长级会议**将决定明年政策，是下一个关键节点。（来源：新浪财经）[链接](https://finance.sina.cn/stock/jdts/2026-10-03/detail-initwzsp5050870.d.html)\n\n---\n\n## 💰宏观与政策\n\n- **央行 10 月 8 日开展 1.2 万亿元买断式逆回购，较到期量加量 2000 亿。** 9 月 30 日公告，10 月有 1 万亿到期，等于加量续作，意在支持政府债券发行、保持节后资金面充裕；分析认为降准可能因此延后。注意：A 股国庆休市至 10 月 7 日，**10 月 8 日开市**当天资金面值得看。（来源：搜索补漏）[链接](http://money.2500sz.com/doc/2026/10/04/1232070.shtml)\n- **PSL 利率降至 1.5%，再贷款加码 7000 亿。** 央行 9 月 29 日同步下调抵押补充贷款（PSL）利率 25bp 至 1.5%，科技创新和技术改造再贷款 +2000 亿、支农支小再贷款 +5000 亿，结构性工具继续发力。（来源：搜索补漏）[链接](https://news.creaders.net/china/2026/09/29/3052990.html)\n- **英国预算案承压。** FT 述评：英国预算需要在控制支出与提振增长之间走钢丝，财政整固的政治成本正在上升。（来源：FT）[链接](https://www.ft.com/content/dfa07e3f-5557-46ba-8128-72f43aa6558d?syn-25a6b1a6=1)\n\n## 📈市场与投资\n\n- **非农爆冷反而助涨美股，英伟达盘中新高。** 9 月非农就业数据爆冷压低了短端加息预期，美股续涨；但 10 年期美债收益率走出 V 形反弹至 5.30%，连续两日刷新 2002 年以来高位——股债同涨的背后是\"坏数据=加息暂停\"的交易逻辑，还能走多远要看本周纪要。（来源：新浪财经）[链接](https://finance.sina.cn/stock/jdts/2026-10-03/detail-initwzsp5050870.d.html)\n- **投资者开始躲避 AI 集中度风险。** FT 报道，面对英伟达等少数 AI 标的在指数中权重过高，机构投资者正寻找对冲 AI 集中风险的组合方案——这是\"AI 叙事\"从一致预期走向分歧的早期信号。（来源：FT）[链接](https://www.ft.com/content/3302fd5c-8b92-425b-9523-673b2565bb10?syn-25a6b1a6=1)\n- **日本股市牛市面临风险。** 日本最大商社掌门人警告，日股这轮牛市存在风险，估值与外部需求是主要隐忧。（来源：FT）[链接](https://www.ft.com/content/1fdb8380-2fac-474a-a184-616c0a29feb6?syn-25a6b1a6=1)\n- **IPO 市场冰火两重天。** FT 两篇报道对照看：上半年 IPO 数量井喷但质量参差（booming and busting），眼下华尔街的 IPO 热情已因需求疲软和估值担忧降温。（来源：FT）[链接](https://www.ft.com/content/8b7e2800-3e36-4d0c-9016-32deaae67b62)\n\n## 🏠房价洞察\n\n- **9 月百城房价：新房微涨、二手跌幅扩大。** 中指院数据：百城新建住宅均价 **17285 元/㎡**（环比 +0.17%、同比 +2.12%）；二手住宅均价 **12452 元/㎡**（环比 -0.6%、跌幅较 8 月扩大 0.15 个百分点，同比 -6.94%）；100 城中二手仅 **3 城**环比上涨、**97 城下跌**——二手市场的调整仍未见底。（来源：搜索补漏）[链接](https://news.creaders.net/china/2026/10/02/3053975.html)\n- **房贷贴息 10 月 1 日起实施（详见今日大势第 1 条）。** 政策精准卡位\"金九银十\"，新市民、青年人与城镇工薪刚需家庭是主要受益群。（来源：新浪财经）[链接](https://finance.sina.cn/2026-09-29/detail-initpatz2785626.d.html)\n- **西班牙爆发住房危机大抗议。** BBC 报道，数万人走上街头抗议住房危机，\"Anger in the streets\"——高房价/高租金已从经济问题演变为欧洲多国的政治火药桶，BBC 甚至在讨论是否会引发提前大选。（来源：BBC）[链接](https://www.bbc.co.uk/news/articles/cm2kej47095no?at_medium=RSS&at_campaign=rss)\n\n**🔍深度分析：中国房价处在\"政策底\"与\"市场底\"的赛跑中。** 数据呈现的分化很典型：**新房价格**在政策托底下一线城市基本稳住（百城 +0.17%），**二手房**却 97 城下跌、跌幅还在扩大——说明\"以价换量\"仍是二手市场的主旋律，价格发现机制还在工作。**政策意图**看得很清楚：150 万/120㎡/首套的三重门槛，把财政资金精确导向\"真实自住的刚需\"，不刺激投资投机；中央 90% 出资、不设总规模上限，表达的是\"需求侧工具箱正式打开\"的信号意义。**对购房者的实操含义**：① 符合条件的首套刚需，现在是历史上购房政策最宽松的窗口之一（降首付+低利率+财政贴息三叠加），月供压力实打实下降约 1 个百分点；② 但别把政策底当市场底——二手 97 城下跌意味着你买入的房子短期仍可能计价下跌，自住可入、投资慎入；③ 存量房贷不享受，别为了贴息置换，算不过账。**后续盯什么**：10 月\"银十\"成交量能否环比转正、70 城房价环比跌幅是否收窄、地方跟进细则（尤其是二线城市的执行口径）。\n\n## 🤖AI经济\n\n- **OpenAI 法律风险堆积。** FT 报道，OpenAI 自查发现数十起黑客攻击事件后，Altman 面临的法律风险正在累积——AI 公司的安全事件正从技术问题变成治理与诉讼问题。（来源：FT）[链接](https://www.ft.com/content/2c24ece3-ac99-43a8-b0e6-4a3867e37ebf?syn-25a6b1a6=1)\n- **Nvidia 8 亿美元押注 Reflection：西方 open-weight 的\"国家队\"来了。** Axios 爆料 Reflection 即将发布首个 open-weight 模型，Nvidia 注资 8 亿美元，SpaceX 每月 1.5 亿美元算力+ Nebius 超 10 亿美元算力协议打底。AI 基建的资本开支竞赛，正从\"买 GPU\"升级到\"养国家队\"。（来源：Axios 经 aistockwire 转述）[链接](https://aistockwire.com/blog/nvidia-nvda-backed-reflection-open-weight-ai-model-axios-october-2026)\n- **DeepSeek × 华为：去 CUDA 化的中国 AI 栈。** DeepSeek 宣布与华为合作建设针对昇腾芯片优化的开源基础设施——一旦跑通，中国大模型训练推理对 Nvidia 生态的依赖将实质性下降，地缘科技战的又一块拼图。（来源：LinkedIn AI News Brief）[链接](https://www.linkedin.com/pulse/ai-news-brief-friday-2-october-2026-ist-muralidhar-rao-fn5kc)\n\n## 🏢公司与产业\n\n- **施耐德电气接近以 200 亿美元收购工业软件集团 PTC。** 若落地，将是今年欧洲最大科技并购之一，工业软件+电气化的协同是核心逻辑。（来源：FT）[链接](https://www.ft.com/content/2084f349-0829-4130-a5e6-b98929a6e633?syn-25a6b1a6=1)\n- **并购热潮可能提前熄火。** FT 报道，交易撮合活动放缓正在威胁今年 M&A 繁荣的持续性，利率高企与估值分歧是主因。（来源：FT）[链接](https://www.ft.com/content/00fb4438-1f86-4bf2-a165-0c39f2fd506b?syn-25a6b1a6=1)\n- **美国将接收白俄罗斯钾肥船货，两国关系解冻。** FT 报道，在美白关系缓和背景下，美国将接收来自白俄罗斯的钾肥 shipment——化肥是大宗商品地缘政治里常被忽视的一环。（来源：FT）[链接](https://www.ft.com/content/9cbc0aea-259a-41eb-bbf4-ad8a674ca8b7?syn-25a6b1a6=1)\n\n## 🌍全球大事\n\n- **美伊谈判破裂，霍尔木兹海峡封锁一触即发。** 伊斯兰堡美伊谈判（10 月 3–4 日，21 小时）无果而终后，特朗普宣布美军将拦截向伊朗缴纳过航费的船只；CENTCOM 宣布**自美东时间周一上午 10 点起**封锁进出伊朗港口的海上交通。这是今日全球最大的地缘变量，直接挂钩油价。（来源：Truth Social 经大佬动态栏目转述）\n- **梅德韦杰夫警告\"全面太空战争\"。** 针对乌方要求美方封锁俄\"黎明\"低轨卫星系统，梅德韦杰夫 10 月 4 日警告此举将导致全面太空战争；泽连斯基此前接受 FT 采访称已多次要求特朗普制裁相关中俄卫星企业。太空正在成为俄乌冲突的新战线。（来源：新浪财经）[链接](https://finance.sina.cn/2026-10-04/detail-initzzvh0392246.d.html)\n- **俄警告外国公民远离基辅。** 俄外交部 10 月 3 日警告外国公民和外交官不要留在基辅及乌军事设施附近；此前俄无人机袭击了基辅桥梁，德国总理突访基辅。局势升级信号明确。（来源：中国网、BBC）[链接](https://www.bbc.co.uk/news/articles/ckreyjzzzywqo?at_medium=RSS&at_campaign=rss)\n- **巴西大选胶着。** 投票结束，Lula 与 Bolsonaro 之子 Flávio 得票咬得很紧；巴西还指控美国干涉选举。拉美最大经济体的政治走向本周揭晓。（来源：BBC）[链接](https://www.bbc.co.uk/news/articles/ck1l34ed592no?at_medium=RSS&at_campaign=rss)\n- **也门政府宣布\"全面开战\"收复胡塞地盘；埃塞俄比亚反政府武装撤出提格雷首府。** 中东与非洲之角两条战线同时生变。（来源：BBC）[链接](https://www.bbc.co.uk/news/articles/cx8dzj9vpp01o?at_medium=RSS&at_campaign=rss)\n\n## 📅今日前瞻\n\n- **美东时间周一上午 10 点**：CENTCOM 对伊朗港口海上封锁令生效，盯油价与航运股。\n- **本周**：美联储公布 9 月会议纪要（首次升息后的措辞是关键）。\n- **10 月 8 日（周三）**：A 股国庆后开市；央行 1.2 万亿买断式逆回购开展。\n- **11 月 3 日**：美国中期选举；**11 月 29 日**：OPEC+ 部长级会议。\n\n## 📎来源清单\n\n- RSS 抓取：FT（15 条）、BBC World（9 条）\n- 搜索补漏：新浪财经（4 条）、钜亨网（1 条）、中华网（1 条）、中国网（1 条）、money.2500sz.com（1 条）、creaders.net（2 条，政策事实已用新浪财经/中华网交叉验证）、aistockwire（1 条，转述 Axios）、LinkedIn（1 条）\n- 大佬动态栏目转述：Truth Social（1 条）\n"};

rs": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "venue": "arXiv cs.CR/cs.AI/cs.SE (2026-09-30)", "oneliner": "系统化揭示 coding-agent 中“人批准的 A ≠ 实际执行的 A'”的六类批准—执行绑定失效，提出 keyed capability (Approval Token) 部分修复并诚实报告负结果。", "insight": "“批准—执行绑定完整性”与我们的 M(r) 绑定思想同属一范式，可在 Agent 线 related work 并列；其“字段级验证器看不见进程层级分叉”的负结果警示授权证据必须绑定到执行语义层；诚实负结果段落是局限章节范本。", "tags": ["approval-binding", "capability", "coding-agent", "negative-result"], "added": "2026-10-02"}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han et al.", "url": "https://arxiv.org/abs/2609.39450", "venue": "arXiv cs.CR/cs.AI (2026-09-30)", "oneliner": "技能投毒下的工具调用授权：授权上下文与生成上下文分离，基于可信用户意图做 fail-closed 裁决，319 次注入测试中 ASR 相对降低 35–46%。", "insight": "“授权决策输入限于可信侧”与我们“策略独立存放、查询时逐 AU 求值”同构，Agent 线 related work 可并列引用；其 Reviewer 仍是 LLM 裁决，与我们“确定性求值”路线形成对照，可在 Discussion 讨论取舍。", "tags": ["tool-call-authorization", "skill-injection", "fail-closed", "agent"], "added": "2026-10-02"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica 等 4 人", "url": "https://arxiv.org/abs/2610.01871", "venue": "arXiv:2610.01871 (2026)", "oneliner": "针对返回图像的多模态 RAG 的黑盒自适应数据抽取攻击：影子图像混合+相关性加权重采样，单次 2500 查询重构 611 张放射影像，抽取条目数达非自适应基线的 5.6 倍。", "insight": "embedding 通道攻击线的最强邻居：我们的 A1 是文本完形攻击（89.4%@20），它是多模态、图像返回配置下的自适应抽取，说明向量索引的通道问题在跨模态场景同样成立且可被放大。可在 T2 威胁模型一节引用为最具体的实证；其\"重构出的不同条目数\"可借鉴为 embedding 泄露的度量。它不涉及授权语义（任何用户可查），防御侧无直接给出，但把\"embedding 索引必须被授权视图切分\"的论证推得更强——正是 per-view 索引的动机。", "tags": ["embedding 泄露", "数据抽取", "多模态 RAG", "攻击"], "added": "2026-10-03"}, {"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "venue": "ACM (2026)", "oneliner": "用 capability-scoped 权限模型重构 coding agent 工具沙箱：工具调用须持有显式能力令牌，命名资源≠被授权操作，架构层面切断间接 prompt injection 的执行通道", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的执行语义哲学同构——都是把\"能说出名字/能检索到\"从隐含授权中剥离。差异在于粒度：它是工具调用级 capability，我们是检索内容级 AU。适合 Related Work 的 Agent 线引用，作为显式授权能力模型的独立佐证；两者交叉可作 future work 一笔。", "tags": ["agent 安全", "capability 模型", "prompt injection", "授权执行"], "added": "2026-10-04"}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang 等 5 人", "url": "https://arxiv.org/abs/2610.01508", "venue": "arXiv:2610.01508 (2026)", "oneliner": "研究工具调用 agent 的\"主动越权\"：8 个隐私敏感域的确定性 benchmark，7 个模型全部超授权范围；SelfAudit 零样本推理时自检把隐私向越权降低 43%。", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计。\"越权来自结构性决策倾向而非解码随机性\"的结论与我们\"保守子句切分器\"的直觉相通——授权边界应由机制保证而非模型自觉；SelfAudit 仍是模型自己审计自己（启发式），我们的确定性求值 P(a,u) 是更彻底的路线，可在 Discussion 对照。注意它是动作侧授权，我们是数据侧，不竞争。", "tags": ["Agent 授权", "越权", "benchmark"], "added": "2026-10-03"}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang 等 7 人", "url": "https://arxiv.org/abs/2610.00371", "venue": "arXiv:2610.00371 (2026)", "oneliner": "提出 authorization-paired evaluation（拦住禁用用途+完成授权用途为联合成功标准）与 FlowReview 框架（对象解析+权限排序+确定性执行），组合审查把 denied-commit 率从 86.0% 降到 0 且授权供给无损失。", "insight": "核心命题\"对象身份与权限必须通过输出可验证的组件与执行保持连接\"与我们的\"chunk 只存 M(r)、查询时逐 AU 求值\"同构——都反对权限是附在数据上的静态标签。它的\"联合成功标准\"值得借鉴：我们评估以安全侧为主，未来可加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）提示我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"，与 KG 路径切割一节可呼应。", "tags": ["Agent 授权", "组合安全", "评估方法"], "added": "2026-10-03"}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}]}], "note": "人工精选、长期维护的论文库；每日 08:00 看板构建时自动嵌入，不会被每日文献流覆盖", "updated": "2026-10-04"};

function pdfUrl(u){
  const m = (u || '').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function codeLink(code){
  const m = (code || '').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);

}

  h += (p.cats || []).map(c => '<span class="badge cat">' +
    esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
  if (p.supplement) h += '<span class="badge cat">期刊/会议</span>';
  return h;
}
function card(p){
  const pdf = pdfUrl(p.url), ch = codeLink(p.code);

    + (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  return '<div class="card">'
    + '<div class="badges">' + badges(p) + '<span class="date">' + esc(p.date) + '</span></div>'
    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<details class="box zh"><summary>中文摘要</summary><div class="body">' +
        esc(p.zh_abs).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">' +
        esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + ((cite || ch) ? '<div class="meta-row">' + cite + (ch ? '<span>' + ch + '</span>' : '') + '</div>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}
function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){
  let html = '', n = 0;
  const latest = DATA.days[0];

    html += colSummary('📌 今日论文综述', latest.summary.slice(0, 1400));

    if (state.day && day.date !== state.day) return;

    if (!ps.length) return;

    html += '<div class="day"><div class="day-head"><h2>📅 ' + esc(day.date) + '</h2>'
      + '<span class="n">' + ps.length + ' 篇</span></div>';

/* ---------- finance (💰财经大事): 长简报 md 渲染 ---------- */
function mdInline(s){
  return esc(s||'')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function renderFinance(){
  const M = FIN || {}, src = M.md || '';
  const n = (src.match(/^(\*\*|[-•▪]\s)/gm) || []).length;
  document.getElementById('finCount').textContent =
    dline(M.date) + n + ' 条';
  const box = document.getElementById('finList');
  if (!src.trim()){ box.innerHTML = '<div class="empty">今日暂无财经大事早报。</div>'; return; }
  let html = '', inList = false, inTable = false;
  const closeList = () => { if (inList){ html += '</ul>'; inList = false; } };
  const closeTable = () => { if (inTable){ html += '</tbody></table>'; inTable = false; } };
  src.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line){ closeList(); closeTable(); return; }
    let m;
    if ((m = line.match(/^###\s+(.*)/))){ closeList(); closeTable(); html += '<div class="fin-h3">' + mdInline(m[1]) + '</div>'; return; }
    if ((m = line.match(/^##\s+(.*)/))){ closeList(); closeTable(); html += '<h2 class="fin-h2">' + mdInline(m[1]) + '</h2>'; return; }
    if (/^#\s/.test(line)){ closeList(); closeTable(); return; }  /* H1 跳过（tab 已有标题） */
    if (/^---+$/.test(line)){ closeList(); closeTable(); html += '<hr class="fin-hr">'; return; }
    if (/^\|.*\|$/.test(line)){
      closeList();
      if (/^\|[\s|\-:]*\|$/.test(line) && /-/.test(line)) return;  /* 表格分隔行跳过 */
      const cells = line.split('|').slice(1, -1).map(c => mdInline(c.trim()));
      if (!inTable){ html += '<table class="fin-table"><tbody>'; inTable = true; }
      html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      return;
    }
    if (/^\*\*\d+\.\s/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item fin-num">' + mdInline(line) + '</li>';
      return;
    }
    if (/^(\*\*|[-•▪]\s)/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item">' + mdInline(line.replace(/^[-•▪]\s/, '')) + '</li>';
      return;
    }
    closeList(); closeTable();
    html += '<p class="fin-p">' + mdInline(line) + '</p>';
  });
  closeList(); closeTable();
  box.innerHTML = '<article class="fin-body">' + html + '</article>';
}

/* ---- X 未读小红点：localStorage 记已读，APP 式 ---- */
const X_SEEN_KEY = 'coco_x_seen_v1';
const getXSeen = () => { try { return JSON.parse(localStorage.getItem(X_SEEN_KEY) || '{}'); } catch(e){ return {}; } };
function renderXDots(){
  const seen = getXSeen();
  let any = false;
  document.querySelectorAll('.x-chip').forEach(ch => {
    const h = ch.getAttribute('data-h'), nw = ch.getAttribute('data-newest') || '';
    const unread = !!(nw && (!seen[h] || nw > seen[h]));
    const dot = ch.querySelector('.x-dot');
    if (dot) dot.hidden = !unread;
    if (unread) any = true;
  });
  const tabDot = document.getElementById('xTabDot');
  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}
function toggleXAcc(btn){
  const g = btn.getAttribute('data-g'), h = btn.getAttribute('data-h');

const TAB_DONE = {};
function ensureTab(name){
  if (!TAB_DONE[name] && TAB_RENDER[name]){ TAB_RENDER[name](); TAB_DONE[name] = 1; }
}
renderXDots();  // tab 栏小圆点不受懒渲染影响，照常初始化
const _initTab = ('' + location.hash).slice(1);
ensureTab(PANES.includes(_initTab) ? _initTab : 'papers');
showTab(_initTab || 'papers');

/* ---------- archive modal（历史归档弹窗） ---------- */
const ARCH_PREFIX = location.pathname.indexOf('/archive/') >= 0 ? '' : 'archive/';
const DIGEST_URL = ARCH_PREFIX + 'digest.json';
let archDigestCache = null;
function archItemHTML(it, open){
  const runs = (it.runs || []).map(r =>
    '<span class="run-tag">' + esc(r.name) + '</span>').join('');
  const secs = [
    ['📚 论文', it.papers, it.papers_n ? it.papers_n + ' 篇' : ''],
    ['🤖 模型追踪', it.models],
    ['🎯 兴趣追踪', it.interests],
    ['🔥 开源趋势', it.trending],
    ['👀 大佬动态', it.x],
    ['📰 AI情报', it.ainews],
  ];
  const body = secs.filter(s => s[1]).map(s =>
    '<div class="arch-sec"><div class="arch-sec-t">' + s[0] +
    (s[2] ? ' <span class="arch-hint">' + esc(s[2]) + '</span>' : '') +
    '</div><div class="arch-sec-b">' + md(s[1]) + '</div></div>'
  ).join('') || '<div class="empty">暂无摘要</div>';
  return '<details class="arch-item"' + (open ? ' open' : '') + '>' +
    '<summary><span class="arch-date">📅 ' + esc(it.date) + '</span>' +
    runs + '<span class="arch-hint">→</span></summary>' +
    '<div class="arch-body">' + body +
    '<a class="arch-go" href="' + ARCH_PREFIX + it.date + '.html">查看当天完整看板 →</a>' +
    '</div></details>';
}
function renderArchList(items, partial){
  const list = document.getElementById('archList');
  if (!items || !items.length){
    list.innerHTML = '<div class="empty">暂无归档</div>';
    return;
  }
  list.innerHTML =
    (partial ? '<div class="empty">本地打开为精简模式，仅显示近 7 天</div>' : '') +
    items.map((it, i) => archItemHTML(it, i === 0)).join('');
}
let archScrollY = 0;
function lockBodyScroll(){
  archScrollY = window.scrollY || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + archScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, archScrollY);
}
async function openArchive(){
  const m = document.getElementById('archModal');
  m.hidden = false;
  lockBodyScroll();
  if (archDigestCache){ renderArchList(archDigestCache.list, archDigestCache.partial); return; }
  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  unlockBodyScroll();
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
</body>
