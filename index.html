const FIN = {"date": "2026-11-16", "md": "# ☀️ 财经大事早报 · 2026-11-16\n\n## 📌 今日大势\n\n### 1. 英伟达“换帅风波”升级：黄仁勋谈回归、财长要外部 CEO、国会收紧芯片出口\n据 FT 报道，**黄仁勋正在与盟友讨论以 CEO 身份回归英伟达**，而美国财长贝森特公开表示英伟达需要一次“换血”、由外部人士出任 CEO；国会则在英伟达风波之后推动收紧 AI 芯片出口规则。与此同时，BBC 援引 Megaspeed 的说法称，一名据称与英伟达前老板有关的中国间谍嫌疑人已于 2025 年离职。这一连串消息把一家公司的治理风波升级为华盛顿的政治议题：**人事、出口管制与对华技术脱钩被绑在了一起**。市场已经在用脚投票——FT 同日报道，**数据中心建设相关股票市值合计蒸发 4.2 万亿美元**，AI 交易的退潮正在从英伟达一只股票扩散到整条基建链。后续盯三件事：黄仁勋回归谈判有没有实质进展、贝森特的表态会不会变成正式的人事压力、国会出口规则的立法文本何时落地。（来源：FT Home、FT Markets、BBC World）\n\n### 2. 伊朗三天内两度袭击巴林美军基地，霍尔木兹海峡风险再起\n伊朗伊斯兰革命卫队称，周日凌晨向巴林利法直升机基地的美军防空雷达发射了 **6 架无人机**，巴林军方称防空系统在无人机达成目标前将其拦截摧毁，未报告人员伤亡与损失。这是**三天内第二次**袭击巴林——周五那次，伊朗称摧毁了一座美军早期预警雷达，美军中央司令部则否认，称击落两架无人机、无损失。革命卫队把袭击称为对“美国敌对行动”的报复，并警告“霍尔木兹海峡已经关闭”。背景是今年 2 月 28 日美以对伊朗发动打击后开始的战争，巴林驻有美国海军第五舰队总部。对市场的直接含义是油价与航运：**全球油市刚因海湾出货反弹而转向过剩**（FT 11 月 13 日），一次针对海峡的实质威胁就可能把这个判断翻过来。后续盯美军中央司令部对周日袭击的正式回应，以及霍尔木兹海峡的实际通航情况。（来源：BBC World、Reuters/AFP 转引）\n\n### 3. Anthropic IPO 本周上市：6 倍超额认购，AI 估值的下一个压力测试\nAnthropic 的 IPO 定于 **11 月 19 日**上市，FT 称这是“AI 的下一个重大考验”。据彭博消息人士（经第三方转引），认购额约为可供股份的 **6 倍**，募资规模最高可达 1000 亿美元、有望成为史上最大 IPO；发行价区间为每股 70–78 美元、发行 8.25 亿股 A 类股。CEO 阿莫迪对市场动荡表现得“不太在意”（FT 11 月 13 日）。一个有意思的对照数字来自 FT：**如果 SBF（Sam Bankman-Fried）没有出事，他在 Anthropic 的持股在 IPO 中价值接近 400 亿美元**。Anthropic 上市正撞上 AI 交易退潮与英伟达风波这两股逆风——它的定价与首日表现，会成为市场给“AI 故事”重新估值的第一个公开标尺。（来源：FT Markets、彭博消息人士经第三方转引）\n\n## 💰 宏观与政策\n\n- **中国今日公布 10 月经济数据，市场预期分化**：国家统计局将于今日公布 10 月工业增加值、固定资产投资与社会消费品零售总额。市场预期：工业增加值同比约 5.3%–5.7%（9 月为 5.5%），社零约 0%–0.9%（9 月为 1.1%，受中秋假期错位与乘用车零售下滑拖累），固定资产投资累计同比约 -7%（9 月为 -7.2%），房地产开发投资降幅或走阔至约 -21%–27%。先行指标偏弱：10 月制造业 PMI 为 49.3%，重回收缩区间；10 月汽车产销同比分别下降 8.8% 与 9.2%。积极信号是 8000 亿元新型政策性金融工具已于 10 月 28 日前全部完成投放。（来源：金融界、第一财经、国家统计局公开日程）\n- **美债创“解放日”以来最差一周**：美国国债上周录得自特朗普 4 月“解放日”关税冲击以来最差的一周表现。美债收益率上行与股市动荡同步，反映出市场对财政与关税政策的再定价。FT 同期发文称“债券重新变得有意思了”，提示在波动中重新评估久期价值。（来源：FT Markets）\n- **美英就业市场“低开工、低招聘”，拖累生产率**：FT 指出，美英两国的劳动力市场同时陷入“低解雇、低招聘”的冻结状态，企业不裁员也不招人，劳动力配置僵化正在拖累生产率。英国方面，政府计划为脱离工作或培训满一年的年轻人提供就业保障。这一组合意味着：失业率数字好看，但经济的自我修复能力在变弱。（来源：FT Home）\n- **欧盟银行业监管机构放弃单一存款保险计划**：欧盟银行业监管机构正在远离建立单一存款保险机制的方案，银行业联盟的核心支柱之一再度搁浅。短期看是监管路线的回调，长期看意味着欧洲银行体系的风险共担仍停留在国家层面，跨境银行的风险传导链条没有统一的安全网。（来源：FT Markets）\n\n## 📈 市场与投资\n\n- **AI 交易退潮：数据中心建设股蒸发 4.2 万亿美元**：FT 11 月 15 日报道，随着 AI 热潮退潮，数据中心建设相关股票市值合计蒸发 4.2 万亿美元。与英伟达风波叠加，AI 基建叙事正从“确定性增长”转向“资本开支是否过度”的质疑。FT 11 月 13 日的另一篇报道称，AI 的信徒们在英伟达动荡之后仍在坚守阵线，但分歧正在加大。（来源：FT Home、FT Markets）\n- **香港房企新世界发展拟 32 亿美元供股**：香港开发商新世界发展公布 32 亿美元供股计划，是房企去杠杆、补充流动性的又一动作。供股规模之大，反映出香港楼市调整期里开发商的资金压力仍未缓解。（来源：FT Markets）\n- **Diamondback 拟以近 50 亿美元扩大二叠纪盆地钻探**：美国页岩油商 Diamondback 接近达成一笔近 50 亿美元的交易，以扩大在石油富集的二叠纪盆地的钻探版图。与此同时，FT 报道全球油市因海湾出货反弹而转向过剩，油价中枢承压。（来源：FT Markets）\n- **中国受挫科技股：便宜的 AI，少一点戏剧性**：FT 11 月 14 日指出，中国受挫的科技股可能提供一种“戏剧性较小的 AI 敞口”——估值已大幅回落，而 AI 业务仍在推进。在英伟达风波与美国出口管制收紧的背景下，资金正在重新评估中国 AI 资产的风险收益比。（来源：FT Markets）\n\n## 🏠 房价洞察\n\n- **10 月百城房价：新房结构性涨、二手普跌**：中指研究院百城价格指数显示，10 月全国 100 城新建住宅均价 **17,316 元/平方米，环比上涨 0.18%、同比上涨 2.02%**，32 城上涨、61 城下跌；二手住宅均价 **12,376 元/平方米，环比下跌 0.61%、同比下跌 6.72%**，环比跌幅连续第二个月扩大，仅 1 城上涨、98 城下跌、1 城持平。分梯队看，一线二手环比下跌 0.53%，二线下跌 0.72%，三四线下跌 0.54%。1–10 月百城二手价格指数累计下跌 4.92%。（来源：中指研究院，经中国经济网）\n- **成交有韧性，价格没止跌**：截至 10 月 28 日，重点 20 城二手住宅成交套数同比增长 20%，苏州、宁波增幅超 30%；18 个重点城市 10 月二手房成交 11.6 万套、同比增长 17.5%。上海二手房网签超 2.4 万套、同比增长 32%，连续 8 个月同比增长；北京二手网签 13,081 套、同比增长 8.2%。新房方面，上海新房网签超 7000 套、同比增长 5%，但环比下降 37%。**量涨价跌**是当前最准确的概括。（来源：中指研究院，经证券日报、21 世纪经济报道）\n- **政策端：房贷贴息与年底推盘**：10 月 20 日国家发改委发布会提及购房贷款贴息政策，有助于降低居民购房成本；叠加房企年底推盘促销与核心城市优质项目入市，中指研究院预计对新房成交形成一定支撑，但整体延续筑底态势；二手房成交有望保持活跃，但受预期偏弱影响，价格预计维持小幅下跌。（来源：21 世纪经济报道、中指研究院）\n- **房企动态：新世界 32 亿美元供股**：香港开发商新世界发展的供股计划（见上文市场部分）是房企去杠杆的缩影——融资不是为了扩张，而是为了在调整期里活下去。内地房企的债务与交付压力仍在，10 月房地产开发投资同比降幅预计走阔至约 21%–27%。（来源：FT Markets、华泰证券预测经金融界）\n- **🔍 深度分析**：10 月数据的核心矛盾是**新房均价涨、二手房价跌**，两个方向完全相反。拆开看：新房的上涨是**结构性**的——上海、北京等重点城市优质楼盘集中入市，拉高了均价，而 61 个城市的新房价格其实在跌；二手则是**普遍性**下跌，98 城跌、仅 1 城（肇庆，涨 0.24%）上涨，跌得最深的常州达 -1.47%，百城二手价格环比已连续下跌超过两年半。**一线与低线的分化**也很清楚：新房一线环比涨 0.52%、二线涨 0.31%，三四线仍在以价换量；二手则是一线跌 0.53%、二线跌 0.72%——低线城市的二手跌幅更深、且缺乏一线那样的成交支撑。**政策的真实意图**是托成交、不是托价格：房贷贴息降的是购房成本，新型政策性金融工具投的是基建与新动能，没有一味给房价托底；监管容忍“以价换量”换成交量。对购房者的**实操含义**：自住刚需可以盯核心城市的优质新盘与次新二手——成交活跃意味着议价空间真实存在，上海二手连续 8 个月同比增长说明流动性在恢复；但投资性购房仍无依据，二手普跌 32 个月未见拐点信号，三四线城市尤其要警惕“买了就跌、卖了没人接”。后续盯三件事：**今日公布的 10 月官方 70 城房价数据**、年底房企推盘促销的实际去化、以及房贷贴息政策的落地细则。\n\n## 🤖 AI 经济\n\n- **美国及盟友签署协议，保护 AI 供应链不受中国影响**：据 FT 报道，美国及其盟友签署协议，以保护 AI 供应链免受中国影响。这是技术脱钩从单边出口管制走向多边协调的标志，AI 芯片、算力基础设施的供应链正在按阵营重组。（来源：FT Home）\n- **国会推动收紧 AI 芯片出口规则**：英伟达风波之后，美国国会正推动通过更严格的 AI 芯片出口规则。结合上文的供应链协议，AI 硬件的跨境流动将面临更严的审查，英伟达等厂商的对华业务与合规成本同步上升。（来源：FT Home）\n- **AI 基建叙事动摇，资本开支面临拷问**：数据中心建设股蒸发 4.2 万亿美元（见市场部分），叠加英伟达人事风波，AI 资本开支的可持续性成为市场焦点。Anthropic 本周 IPO 的定价表现，将是检验 AI 估值叙事的第一块试金石。（来源：FT Markets）\n\n## 🏢 公司与产业\n\n- **Anthropic IPO 本周上市，6 倍超额认购**：详见今日大势第 3 条。募资规模最高可达 1000 亿美元，有望成为史上最大 IPO。（来源：FT Markets、彭博消息人士经第三方转引）\n- **特朗普媒体集团面临 10 亿美元债务 crunch，比特币押注褪色**：特朗普媒体集团正面临 10 亿美元的债务压力，而其比特币押注的收益正在消退。政治关联资产的波动性与加密资产的回调叠加，构成双重挤压。（来源：FT Markets）\n- **Brookfield 与 KKR 争夺海湾零售商 Eyewa 的 7 亿美元交易**：Brookfield 与 KKR 正在争夺以约 7 亿美元收购海湾地区零售商 Eyewa的交易，显示出私募巨头对中东消费市场的持续兴趣。（来源：FT Markets）\n\n## 🌍 全球大事\n\n- **伊朗两度袭击巴林美军基地**：详见今日大势第 2 条。第二次袭击针对利法直升机基地的美军防空雷达，巴林称已拦截；革命卫队警告霍尔木兹海峡已经关闭。（来源：BBC World）\n- **泽连斯基呼吁美国与马斯克解除 Starlink 限制**：乌克兰总统泽连斯基呼吁美国与马斯克解除对 Starlink 的限制，并“站在历史正确的一边”。Starlink 已成为乌克兰战场通信的关键基础设施，其使用限制直接关系到前线作战能力。（来源：BBC World）\n- **美国航班持续大面积取消，电信升级酿成全国停飞**：美国数千架次航班在全国性停飞两天后仍在取消或延误。BBC 报道称，电信升级工程是这场混乱的源头——一次基础设施升级失误，瘫痪了全国的航空调度。（来源：BBC World）\n- **孟加拉国服装厂因薪资罢工停工**：孟加拉国服装工厂因工人罢工要求涨薪而关闭。全球服装供应链的成本压力正在向品牌商传导，低成本制造模式的劳资矛盾再度激化。（来源：BBC World）\n- **欧洲与俄罗斯对话、捷克与巴黎的抗议潮**：FT 刊文认为“欧洲需要与俄罗斯对话”；捷克民众集会反对改变公共媒体资金来源的计划；巴黎警方禁止在 10 所学校与 5 所大学附近抗议。欧洲内部在安全、外交与言论议题上分歧加剧。（来源：FT Home、BBC World）\n\n## 📅 今日前瞻\n\n- **中国 10 月经济数据今日公布**：国家统计局公布 10 月工业增加值、固定资产投资、社零与 70 城房价数据，是判断四季度经济成色的关键窗口，尤其看房地产开发投资降幅与消费增速是否企稳。\n- **Anthropic IPO 11 月 19 日上市**：认购已超 6 倍，发行价与首日表现将检验 AI 估值叙事。\n- **APEC 深圳峰会即将召开**：亚太经合组织第三十三次领导人非正式会议与工商领导人峰会将在深圳举行，关注中美经贸信号。\n- **英伟达风波后续**：黄仁勋回归谈判、贝森特的表态与国会出口规则立法是本周持续发酵的三条线。\n- **霍尔木兹海峡局势**：盯美军中央司令部对周日袭击的回应与海峡实际通航情况，油价波动风险未解除。\n\n## 📎 来源清单\n\n- FT Home：11 条（英伟达系列、AI 供应链协议、英国住房与就业、欧洲与俄罗斯等）\n- FT Markets：25 条（数据中心股、美债、Anthropic IPO、新世界供股、油市等）\n- BBC World：19 条（伊朗袭击、泽连斯基、美国航班、孟加拉罢工等）\n- 经济学人本周：1 条（封面故事通讯：AI 崩盘还是牛市？）\n- 搜索补漏：中国 10 月房价（中指研究院百城价格指数，经中国经济网、证券日报、21 世纪经济报道）、中国 10 月经济数据前瞻（金融界、第一财经）、伊朗袭击细节（Reuters/AFP 经多家转引）、Anthropic IPO 认购情况（彭博消息人士经第三方转引）\n\n*注：FT 部分标题后带追踪参数的链接为 RSS 原文链接；中指研究院百城价格指数为第三方机构数据，非国家统计局 70 城官方数据；Anthropic IPO 的认购倍数与募资规模为彭博消息人士口径，尚未经官方确认。*\n"};

const LIB = {"groups": [{"id": "access-control", "name": "RAG 访问控制", "papers": [{"title": "Security, Privacy, and Trustworthy Design for Retrieval-Augmented Generation Systems", "authors": "Abdulrahman Abdullah Alghamdi", "url": "https://doi.org/10.3390/electronics15225229", "venue": "期刊论文（Electronics，MDPI，2026-11-11）", "oneliner": "按流水线阶段梳理 2020–2026 年 RAG 安全工作的叙事综述：投毒、抽取、成员推断与间接 prompt 注入可组合；引入权限后攻击成功率下降；现有 benchmark 几乎不评估授权状态与多租户隔离。", "insight": "可作相关工作的“缺口陈述”第三方佐证：benchmark 不评估授权状态与多租户隔离，正是我们的 per-view 索引与 cloze 实测要补的位置；其分层控制清单（来源、访问控制、检索时异常检测、上下文隔离、输出监控、工具权限）可用来划定我们工作的边界——我们做的是其中访问控制与上下文隔离一层。诚实标注：单作者叙事综述、无新实验，引用时写清综述性质，不宜当作实证证据。", "tags": ["RAG 安全综述", "授权状态评估", "多租户隔离", "相关工作背景"], "added": "2026-11-13"}, {"title": "Authorization Drift in LLM Agents: Evaluating Boundary Compliance in Multi-Step Tool Use", "authors": "Chuxue Cao 等", "url": "https://arxiv.org/abs/2611.09113", "venue": "arXiv 预印本（cs.CR / cs.LG，2026-11-06）", "oneliner": "没有攻击者也会越界：把 agent 多步工具调用中的授权越界形式化为“授权漂移”，648 样本 ADB 基准实测前沿模型漂移率 0.43–0.61。", "insight": "补上 ChainBind 威胁模型里缺失的非对抗维度：我们的 T1/T2/T3 全是攻击者驱动的注入，这篇证明无对手时 agent 自己也会为走捷径而多拿数据、多调工具；漂移四维度（数据、工具、范围、时间）恰好对应批准绑定需要逐项核对的要素。ADB 的漂移率 + 干净成功率可与我们 E12 的 ASR + 良性效用并列引用，说明“安全—效用权衡”的双指标口径。另可引用其法律映射：数据最小化是最常被触及的条款，93.5% 漂移运行映射多司法辖区。引用须写清基准口径与预印本性质。", "tags": ["授权漂移", "批准绑定", "Agent 安全", "基准"], "added": "2026-11-10"}, {"title": "From Procedures to Permissions: Learning Precise Subagent Authorization from Agent Skills", "authors": "Wenkai Yu 等", "url": "https://arxiv.org/abs/2611.08905", "venue": "arXiv 预印本（cs.CL，2026-11-06）", "oneliner": "从 Agent Skills 的程序知识里学出子 agent 的最小权限集：工具权限精确率 +13.4 个百分点、工作区权限精确率 +24.1 个百分点。", "insight": "与 ChainBind 互补：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”——学出来的最小权限集可作批准的标的、由运行时绑定强制执行。把授权监督信号从“事后轨迹”前移到“事前程序”，与“策略独立于模型提议之外求值”同构。引用须写清数字出自 ClawArena-Team 单一基准与 Qwen3.5-35B-A3B 单一模型族，ground truth 为作者自合成的程序推导。", "tags": ["最小权限", "子 agent", "Agent Skills", "授权"], "added": "2026-11-10"}, {"title": "Right Tool, Wrong Parameters: Defending LLM Agents Against Parameter Poisoning", "authors": "Yao Wang 等", "url": "https://arxiv.org/abs/2611.04673v1", "venue": "arXiv 预印本（cs.CR，2026-11-03）", "oneliner": "参数投毒防御：不诱发新动作、只偷换工具参数，AuthorityFlow 按查询诱导的信任层级逐参数判定来源可信度。", "insight": "与 ChainBind 草案投毒直接咬合：动作名与金额都对、只换主题或日期的投毒，恰好需要参数级而非动作级的批准绑定。AuthorityFlow 的字段信任归因是“批准环节加来源过滤”的可操作化候选，但其信任层级由模型解读查询生成，存在循环风险，引用时须点出该层。数字为作者自建 FactAuthBench 上的 93.06%→9.03%，良性效用代价约 7.6 个百分点。", "tags": ["参数投毒", "批准绑定", "信任层级", "Agent 安全"], "added": "2026-11-05"}, {"title": "Permitted but Unauthorized: Affordance-Induced Delegated-Scope Violations in Multi-Agent LLM Systems", "authors": "Shravya Kanchi", "url": "https://arxiv.org/abs/2611.04086v1", "venue": "arXiv 预印本（cs.CR，2026-11-02）", "oneliner": "多智能体系统里的“被许可却未授权”：决定 agent 越界的不是权限表，而是对端动作有没有被列出来供它看见。", "insight": "把授权拆成许可与委托范围两层：权限表不变、只改动作可见性，越界率就能从 0 走到 52/52。我们的 per-view 语义可据此补一句——视图不仅要按 AU 过滤内容，还要按委托范围过滤可执行动作的可见性。另可引用其“范围执法 ≠ 伤害预防”边界：确定性监控器挡住全部越界，却挡不住用自己的已授权动作拖累同伴。引用须写清模拟环境与单格子极端值。", "tags": ["委托范围", "多智能体", "授权", "呈现面"], "added": "2026-11-05"}, {"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations", "authors": "Evan Oktavianus、Dana Indra Sensuse、Imairi Eitiveni", "url": "https://doi.org/10.24433/co.3932736.v1", "venue": "Code Ocean（2026-10-30，OpenAlex 收录）", "oneliner": "面向公共机构的声明式 agentic RAG 访问控制：工作流表示为状态机，每状态挂自己的策略，跨通道与组织单元统一执行。", "insight": "补了 RU/AU 框架里“状态维度”的缺口：我们是查询时按内容归属逐 AU 求值，StateGate 是按工作流状态判定授权，两者叠加构成“内容归属 × 工作流状态”的二维判定，直接对应 ChainBind 的“批准—执行跨状态是否还有效”问题。其“过滤而非依赖引导”与 retrieve-then-project 同构（过滤防住 95.5% 暴露与 85/143 注入得手）。引用时须标注合成文档 + 自建 oracle/对照的证据边界，载体按预印本/技术报告口径处理。", "tags": ["工作流状态", "agentic RAG", "访问控制", "过滤"], "added": "2026-11-01"}, {"title": "REALM: Identifying Minimal Task Assets for LLM Agents", "authors": "Zihou Ren、Byungchul Tak、Long Wang", "url": "https://arxiv.org/abs/2610.39155v1", "venue": "arXiv 预印本（cs.CR, cs.AI, eess.SY，2026-10-29）", "oneliner": "为 LLM agent 识别并维护任务真正需要的最小资产集合，把“发现资产”与“授权使用”分开，在任务容器内只暴露资源受限的局部 API。", "insight": "与 RU/AU 解耦在执行侧同构：我们是检索侧“策略独立存放、查询时逐 AU 求值”，REALM 是执行侧“资产发现走依赖图、授权使用走受限 API”。它还处理了执行中才涌现的资产身份问题，其“来源限定接纳”可与“未知 AU 默认拒绝”对照。AgentDyn 上 ASR 16.6%→0.2%（qwen3.5-flash），引用时须限定基准与模型。", "tags": ["最小权限", "agent 授权", "提示注入", "AgentDyn"], "added": "2026-10-31"}, {"title": "Contextual Candour: Role-Aware Graduated Disclosure for LLMs over Mixed-Sensitivity Contexts", "authors": "Devansh Srivastav、David Pape、Samira Abedini 等", "url": "https://arxiv.org/abs/2610.28067", "venue": "arXiv 预印本", "oneliner": "把访问控制从二值 grant/deny 扩展为按用户授权等级校准回答粒度的渐进披露（graduated disclosure），用 reward-based 优化在生成过程里做披露控制。", "insight": "与 per-view 索引形成互补路线：我们是索引侧的离散视图隔离，他们是生成侧的连续粒度校准；结合点正是执行时授权绑定方向（生成时按 AU 动态校准）。其 reward 明确惩罚改写型泄露，呼应我们 retrieve-then-project 的 NLI 残留检查，可互相印证。", "tags": ["渐进披露", "生成侧控制", "授权校准"], "added": "2026-10-22"}, {"title": "Local Allow, Global Deny: Why Per-Action Authorization Does Not Compose in LLM Agents", "authors": "Anmol Pandey、Aditya Jain、Liang Chen 等", "url": "https://arxiv.org/abs/2610.27620", "venue": "arXiv 预印本", "oneliner": "证明逐动作授权在逻辑上无法组合成全局授权：关系型目的违规是 2-safety hyperproperty，零误报的单动作监控器一个都检测不到；AL-SYNTH 用 SAT/SMT 合成最小 CAF 见证。", "insight": "直接质疑逐 AU 求值这类局部授权语义的完备性：跨 AU 的关系型约束（如两段各自授权的片段拼在一起才构成泄露）在单查询内不可见。论文 limitations 应声明 AU 求值是 per-query 单轨迹语义，关系型策略需要跨执行监控，列为未来工作。AL-SYNTH 的最小见证合成法可借鉴，用于评估我们三语义在组合性攻击下的表现。", "tags": ["agent 授权", "组合性", "2-safety", "不可能性定理"], "added": "2026-10-22"}, {"title": "Lineage-Aware Memory Governance: A Derivation-Gated Framework for Privacy-Preserving Column-Level Access Control in Enterprise AI Agents", "authors": "Venkata M Sangaraju、Sudhir Vissa", "url": "https://arxiv.org/abs/2610.07258", "venue": "arXiv 预印本（HF 每日论文）", "oneliner": "提出 Analytical Memory Unit（AMU）：为共享内存中每条缓存结果附上完整推导血缘图，检索策略只有在请求者对结果触及的每一列都有授权时才返回命中。", "insight": "与我们 RU/AU 解耦形成直接对话：它是智能体内存侧的'检索时逐血缘求值'镜像设计。关键是其负面实证——消除泄露需要 75–90% 的血缘记录完整度——恰恰论证了我们'未知/未映射 AU 默认拒绝'的必要性：血缘不可能永远完整，fail-closed 必须内建在语义层而非依赖记录完整度。另可借鉴其'条件式设计保证 vs 经验结论'的措辞区分。引用价值高。", "tags": ["智能体内存", "访问控制", "血缘门控", "默认拒绝"], "added": "2026-10-09"}, {"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "venue": "arXiv:2609.36373 (2026)", "oneliner": "首个把\"授权先于上下文组装\"做成 sound + policy-complete 的记忆准入机制：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，10,000 个多方对话历史中零违规项进入上下文", "insight": "与我们\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照；其派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照，可在 Discussion 对比两种选择的代价；\"audience 扩大需显式对象特定授权\"可为 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience（非 AU 级内容划分），威胁面在 T1/T2 内。", "tags": ["授权前置", "related work", "必引候选"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "Scott Thornton 等", "insight": "与我们 KG 路径切割节（Round 8）主题相邻、贡献互补：他们是在线图扩展边界做单点授权检查，我们是离线 k-cut + 代价曲线（28.2% 公开文本代价、残留实体 4133→0）+ 子句级 PII 粒度。必须引用并主动写清差异；他们的 PD=2 命题与我们的 k=2 发现（k=3≡k=2）互相印证。", "oneliner": "形式化 Retrieval Pivot Risk：vector 检索出的 seed chunk 经实体链接 pivot 进敏感图邻域，造成纯向量检索不存在的跨租户泄露；提出 7 种攻击；泄露稳定出现在 PD=2（二部拓扑命题）。", "tags": ["KG", "pivot攻击", "必引"], "title": "Retrieval Pivot Attacks in Hybrid RAG: Measuring and Mitigating Amplified Leakage from Vector Seeds to Graph Expansion", "url": "https://arxiv.org/abs/2602.08668", "venue": "arXiv:2602.08668 (2026)"}, {"added": "2026-09-30", "authors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "title": "Integrating Access Control with Retrieval-Augmented Generation: A Proof of Concept for Managing Sensitive Patient Profiles (AC-RAG)", "url": "https://doi.org/10.1145/3672608.3707848", "venue": "ACM SAC 2025"}, {"added": "2026-09-30", "authors": "", "insight": "写 related work 全景段落时引用，界定我们的位置。", "oneliner": "RAG 安全攻防分类综述，§4.4 整节讲 Access Control / Privacy / Confidentiality（含 SD-RAG、AC-RAG、DPVoteRAG、PAD 等）。", "tags": ["综述", "related work"], "title": "Securing Retrieval-Augmented Generation: A Taxonomy of Attacks, Defenses, and Future Directions", "url": "https://arxiv.org/pdf/2604.08304", "venue": "arXiv:2604.08304 (§4.4)"}, {"title": "ResidualAuth: What Authorization State Must Language Agents Preserve under Revocable Delegation?", "authors": "Moonwon Choi et al.", "url": "https://arxiv.org/abs/2609.08062", "venue": "arXiv cs.AI/cs.CR (2026-09-08, v2)", "oneliner": "可撤销委托下授权状态的形式化：两段历史可权限相同但撤销后决策相反，系统必须保留的恰是 residual authorization state，并给出内存精确/紧界。", "insight": "与我们 Discussion 的“撤销机制”开放问题直接对接：授权结论是授权历史的函数而非权限快照的函数；其内存下界与我们 AU 粒度—安全—成本权衡曲线呼应；与昨日 Residual Authority Replay 攻击形成“攻击—理论”配对引用。", "tags": ["revocable-delegation", "authorization-state", "theory", "memory-bounds"], "added": "2026-10-02"}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "venue": "arXiv cs.CR/cs.AI/cs.SE (2026-09-30)", "oneliner": "系统化揭示 coding-agent 中“人批准的 A ≠ 实际执行的 A'”的六类批准—执行绑定失效，提出 keyed capability (Approval Token) 部分修复并诚实报告负结果。", "insight": "“批准—执行绑定完整性”与我们的 M(r) 绑定思想同属一范式，可在 Agent 线 related work 并列；其“字段级验证器看不见进程层级分叉”的负结果警示授权证据必须绑定到执行语义层；诚实负结果段落是局限章节范本。", "tags": ["approval-binding", "capability", "coding-agent", "negative-result"], "added": "2026-10-02"}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han et al.", "url": "https://arxiv.org/abs/2609.39450", "venue": "arXiv cs.CR/cs.AI (2026-09-30)", "oneliner": "技能投毒下的工具调用授权：授权上下文与生成上下文分离，基于可信用户意图做 fail-closed 裁决，319 次注入测试中 ASR 相对降低 35–46%。", "insight": "“授权决策输入限于可信侧”与我们“策略独立存放、查询时逐 AU 求值”同构，Agent 线 related work 可并列引用；其 Reviewer 仍是 LLM 裁决，与我们“确定性求值”路线形成对照，可在 Discussion 讨论取舍。", "tags": ["tool-call-authorization", "skill-injection", "fail-closed", "agent"], "added": "2026-10-02"}, {"title": "Role Based Access Control in Enterprise RAG", "authors": "Gnaneshwar Kethavath", "url": "https://doi.org/10.5281/zenodo.23168856", "venue": "Zenodo preprint (2026)", "oneliner": "用 15 份虚构公司文档 × 3 个模拟角色 × 4 种实现实证企业 RAG 的 RBAC：未过滤 RAG 在 99 次未授权/攻击评估中泄露 37 次，prompt-only 权限声明仍泄露 12 次，两种代码级过滤均为 0。", "insight": "我们\"策略独立于模型、在执行层强制\"主张的第三方实证：37/99 vs 12/99 vs 0 这组数字可直接进论文动机段——仅靠 prompt 声明权限不够。它做的是文档级 RBAC（粗粒度），恰好是 AU 划分的一个特例（每文档一个 AU），粒度差异本身可写成对比点。注意局限：Zenodo 非同行评审、单作者、合成小数据、作者自检标签，只能作支持性引文。", "tags": ["RBAC", "企业 RAG", "实证评估", "必引候选"], "added": "2026-10-07"}, {"title": "Safe Separability for Autonomous Authorization: Branch-Relative Authority Closure Under Decision-Critical Uncertainty", "authors": "Mohammad Amir Khusru Akhtar", "url": "https://doi.org/10.21203/rs.3.rs-11086182/v1", "venue": "Research Square 预印本（Under Review）", "oneliner": "形式化“授权决策所需证据、其获取动作本身也需要授权”的循环为 safe separability，提出分支相对授权闭包（BRAC），只用在所有仍兼容世界中都合法的探测来消解决策关键不确定性。", "insight": "与我们“未知 AU 默认拒绝”的保守路线形成直接对照：BRAC 是“在可证明安全的分支内允许证据采集”的积极路线，两者都承认授权信息不完备时行动的困难但选择相反的风险分配，可在 discussion 并列为“证据采集 vs 默认拒绝”权衡。其“先给受限可解类、再用最小反例划界”的形式化写法（联合状态语义+单调类+世界依赖反例）值得我们写 T1/T2/T3 形式化时借鉴；266 回归测试+穷举小世界+随机认证对比的评估方法学可作授权语义正确性评估模板。注意是审稿中预印本，引用时标注。", "tags": ["authorization", "autonomous-agents", "formal-methods", "evidence-acquisition"], "added": "2026-10-10"}, {"title": "After the Edit, Freshness and Access Control of Tool-Calling Retrieval and Vector RAG for a Community-Edited Knowledge Base", "authors": "Nikolaos D. Tantaroudas、Ilias Karachalios、Andrew J. McCracken", "url": "https://doi.org/10.20944/preprints202610.0645.v1", "venue": "Preprints.org 预印本（OpenAlex）", "oneliner": "在可编辑社区知识库上对照实测工具调用检索与向量 RAG 的新鲜度与访问控制：48 组反事实编辑 + 48 条合成 canary 记录，测编辑后新值给出率与 gated 内容泄露率。", "insight": "与我们 RU/AU 解耦框架直接对话的三组数字：工具 agent 在 240 次探测中零泄露 gated 内容，而批量重索引的 RAG 在重索引前泄露了全部已撤销 canary、忽略 gating 标记的索引器在 96 次探测中泄露 93 次——这是“撤销必须内建在执行语义层、gating 必须跟随内容复制的每一步”的现成实证，可引作我们撤销机制一节的经验证据。另：RAG 在对话内被追问时只有 19.6% 给出新值（多为撤回之前的正确答案），说明检索新鲜度不仅是索引问题也是对话状态问题——与我们“查询时逐 AU 求值”的设计呼应。局限：Preprints.org 预印本、单平台案例（希腊农业平台），引用时需标注。", "tags": ["访问控制", "撤销机制", "工具调用检索", "新鲜度", "实证"], "added": "2026-10-11"}, {"title": "One Word Opens the Gate: The Option-Channel Attack on Typed Decision Models as Agent Guardrails", "authors": "Seyedarmin Azizi、Erfan Baghaei Potraghloo、Massoud Pedram", "url": "https://arxiv.org/abs/2610.12292", "venue": "arXiv 预印本（OpenAlex 增补）", "oneliner": "评估 7 个开源类型化决策模型作为 agent guardrail 的允许/阻止决策质量：准确率仅 36%–72%，6 行无关日志文本可把 fail-open 率从 0% 抬到 63%，误导性选项名可抬到 93%–100%；结论是这类模型不应成为做决定的组件。", "insight": "直接论证我们架构的核心选择：授权判定必须是确定性的策略求值（逐 AU 计算 P(a,u)），而不是模型推理——模型做 allow/block 在对抗文本下 fail-open 率可达 93%–100%。fail-open/fail-closed 二分法与我们“未知 AU 默认拒绝”同构，且论文显示模型 guardrail 的默认倾向不稳定，正是默认拒绝必须写进语义层的理由。另：“选项通道攻击”是 T1/T2/T3 之外的新攻击面（攻击决策组件自身的输入通道），我们的框架因 AU 求值不经过模型而天然免疫。局限：arXiv 预印本、0 引用，评估的是开源小模型而非 Jev 本体。", "tags": ["类型化决策模型", "guardrail", "选项通道攻击", "默认拒绝", "授权判定"], "added": "2026-10-11"}, {"title": "Provenance and Authorization in Autobiographical Language Models", "authors": "Faruk Alpay、Taylan Alpay", "url": "https://arxiv.org/abs/2610.17935", "venue": "arXiv 预印本（cs.CR，2026-10-13）", "oneliner": "把自传式语言模型档案中\"叙事内容悄悄变成授权依据\"形式化为安全问题：定义类型化记录、认证断言、与内容分离的独立策略通道和可容许视图，并给出完整性规约与 noninterference 论证。", "insight": "与我们 RU/AU 解耦的核心主张跨领域收敛：\"策略与内容载体分离、查询时独立求值\"。其 noninterference 论证框架可直接借鉴为我们\"零泄露\"目标的形式化语言；\"admissible views\" 与我们的 per-view 索引执行语义直接对应。它还给了一个 T1/T2/T3 之外的新攻击面实例：授权依据在推理时的语义漂移（叙事→同意），提示威胁模型可在\"检索后、生成前\"补一刀。只引形式化部分，不引其小规模合成试点数字。", "tags": ["策略通道分离", "可容许视图", "noninterference", "授权语义"], "added": "2026-10-15"}, {"title": "From Detection to Decision: Calibration and Deferral for Prompt-Injection Detection", "authors": "Qianlong Lan、Anuj Kaul、Vinothini Pandurangan、Indranil Sanyal", "url": "https://arxiv.org/abs/2610.20907", "venue": "arXiv 预印本（2026-10-14，cs.CR）", "oneliner": "把 prompt injection 防御从二分类检测器推进到允许/拦截/升级的运营决策：47,611 样本测校准与 deferral，结论是概率输出救不了分布偏移下的安全决策。", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的强制授权立场形成可对比论证：即使 AUROC 0.897 的最佳检测器，在 1% 漏报目标下也需要 >91.8% 人工升级率，证明\"先检测后决策\"在运营上不可行——这正是我们不走检测过滤、而走执行语义授权绑定的实证支撑。引用点在论证链，不在技术细节。", "tags": ["提示注入", "检测天花板", "强制授权"], "added": "2026-10-18"}, {"title": "When Approval Becomes Execution: Authorization-Grounded Workflow Attacks on Tool-Using Agents", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2610.23077", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "攻击者不覆盖策略、而是引导 agent 走完一条局部自洽的审批工作流，用合法申请的 approval token 经 authorized_by 拿到受保护文档（8/9 完成精确目标操作）。", "insight": "执行时授权绑定方向最直接的经验证据：token 持有被当作充分授权，而请求者身份/审批者权限/资源范围/动作类型/业务目的没有被联合强制执行。可与我们的执行语义并列为绑定缺失的第二个实例（我们是检索时绑定，它是执行时绑定），related work 里互补引用。", "tags": ["agent 授权", "执行时绑定", "工作流攻击", "token 上下文"], "added": "2026-10-20"}, {"title": "Agenra: A Language and Verified Core for Stateful LLM Agent Authorization", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2608.22868", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "带 Lean 验证核心的策略语言，处理可消耗权限的状态化授权：用新旧 permission ledger 之间的 simulation 认证权限修订，51 个人工修订上 21/21 通过、30/30 拒绝且全部经 replay 确认。", "insight": "与我们执行语义互补：我们目前是查询时静态策略求值，没有处理授权随执行消耗的动态维度；其 simulation 认证思路可借来论证 AU 划分/策略变更后既有授权语义是否保持（审稿人可能追问的点）。其安全 vs 工作流保持分离的写作范式也值得学。", "tags": ["形式化验证", "状态化授权", "权限修订", "Lean"], "added": "2026-10-20"}, {"title": "Securing LLM-Agent Long-Term Memory Against Poisoning: Non-Malleable, Origin-Bound Authority with Machine-Checked Guarantees", "authors": "Yedidel Louck", "url": "https://doi.org/10.66977/xsci.2610.001o", "venue": "OpenAlex 补录（2026-10-18）", "oneliner": "双独立源背书或显式用户授权的策略，在抽象记忆模型中机器验证了其在允许变换下对任意规模存储保持成立；1152 个受控 episode 中无防御 61/72 被攻陷、有 monitor 后 0/72。", "insight": "origin-bound authority 是执行时授权绑定的雏形：授权证据与来源绑定、随时间保持有效。直接启发：我们的 AU 授权判定目前是查询时的，长期会话/记忆场景下 AU 映射 M(r) 会漂移，其在变换下保持的证明框架可借鉴来论证 AU 划分稳定性；其保守默认与我们未知 AU 默认拒绝可互相印证。", "tags": ["agent 记忆", "投毒防御", "机器验证", "权限绑定"], "added": "2026-10-20"}, {"title": "PP-RAG evaluation package: deterministic privacy controls for retrieval-augmented generation over educational feedback", "authors": "Vassilios S. Verykios、George Vorvilas、Evgenia Paxinou 等", "url": "https://doi.org/10.5281/zenodo.23458295", "venue": "Zenodo 评估包（2026-10-18；配套论文投 Intelligent Decision Technologies）", "oneliner": "PP-RAG 确定性隐私控制的 seeded 完全可复现评估包：PII 检测与匿名化、基于角色的 ACL-filtered retrieval、LLM 前自适应输出控制、最小 cohort-size 阈值，附 span 级 ground truth 合成数据集。", "insight": "与我们思路最接近的现存竞品，必须正面处理：其 ACL-filtered retrieval 是检索时按 ACL 过滤，我们是策略独立存放、查询时逐 AU 求值——差异点正好是我们的核心 claim（策略变更不需重建索引）。评估包可复现，可作为我们补基线对比的候选基准。标记为竞品对比候选。", "tags": ["RAG 隐私", "ACL 过滤", "可复现基准", "竞品"], "added": "2026-10-20"}, {"title": "SpanGuard: Decoupling Instruction Localization from Authorization for Lightweight IPI Defense", "authors": "Yinxiang Wang, Zehua Ma, Kejiang Chen, Weiming Zhang, Han Fang", "url": "https://arxiv.org/abs/2610.26013", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "把 IPI 防御拆成无监督指令定位 + 块级授权判定两步，小模型守卫也能达到 0.32% ASR。", "insight": "与我们 RU/AU 解耦哲学最同构的相关工作：\"定位 vs 授权判定\"分离论证了\"解耦带来轻量化+可验证性\"。它的块级授权判定正是\"执行时逐 AU 求值\"在 IPI 通道的镜像，可在 related work 中并列；0.32% ASR 是\"解耦不牺牲防御强度\"的硬证据。", "tags": ["IPI 防御", "解耦", "授权判定", "轻量守卫"], "added": "2026-10-21"}, {"title": "RAGLeak: Supply-Chain Privacy Backdoors in Retrieval-Augmented Generation", "authors": "Yuchen Chen, Wei Cheng, Yuan Xiao, Junda He, Jieke Shi, PingPing OuYang, Quanjun Zhang, Chunrong Fang, David Lo, Zhenyu Chen", "url": "https://arxiv.org/abs/2610.25937", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "在 RAG 生成器中植入供应链后门：触发时可逆混淆检索到的私密文档，辅助 LLM 高保真恢复，ASR 最高 100%，干净微调不消除。", "insight": "T1/T2/T3 之外的新攻击面：威胁在模型供应链而非检索通道。它动摇了\"生成器可信、风险只在检索与上下文\"的隐含假设——威胁模型章节应明确声明信任边界（生成器供应链在 scope 之外），否则审稿人会质疑 per-view 索引能否挡住被污染的生成器。100% ASR 可引用。", "tags": ["RAG 攻击", "供应链后门", "隐私泄露", "威胁模型"], "added": "2026-10-21"}, {"title": "Memory, Know Your PLACE: Governing Lifecycle State and Query-Time Eligibility in Persistent-Memory Agents", "authors": "Chen-Fang Hu, Hong-Han Shuai, Woan-Shiuan Chien", "url": "https://arxiv.org/abs/2610.25179", "venue": "arXiv cs.AI/cs.CL 预印本（2026-10-18）", "oneliner": "为持久记忆 agent 加可拆卸治理层 PLACE：写侧状态认证 + 读侧授权，读侧治理消除了可测量的因果泄露。", "insight": "\"读侧授权\"是\"查询时逐 AU 求值\"在记忆载体上的实现，其\"消除可测因果泄露\"结论可直接引用论证\"读侧强制有效\"。对执行时授权绑定方向：它的写侧认证+读侧授权双层结构是完整形态，提醒我们\"授权证据随时间保持有效\"需要写侧机制——与 Yedidel Louck 的 origin-bound authority 互相印证。", "tags": ["agent 记忆", "读侧授权", "因果泄露", "执行时绑定"], "added": "2026-10-21"}, {"title": "Auditing the Hand-Written Inputs of Learned Access Control", "authors": "Arsalan Jalil Sarghaleh、Mehdi Hazrati", "url": "https://arxiv.org/abs/2610.31388", "venue": "arXiv 预印本", "oneliner": "审计学得访问控制背后两件手写制品（hard-deny 集合、region map）：5 个 ABAC Lab 策略上穷举检查，忠实转录的 deny 条款不可靠率 0.50–0.70，未经验证上线会误删 16–78% 合法授权。", "insight": "对我们最直接的警示性证据：\"未知 AU 默认拒绝\"的前提是 deny 判定本身 sound，而这篇证明手写 deny 制品在实践中大面积 unsound，失败模式正是\"自然语言作用域 vs 规则析取\"的语义错位。建议在论文 limitation/deployment notes 引用：deny 集合须经穷举 soundness 检查，否则默认拒绝变误删。其\"false-non-grant 与 false-permit 两种损失同时报告\"值得借鉴为三语义评估规范。注：Jev 粗筛 relevance 0.56 未过线，人工终审判定直接相关而收入。", "tags": ["访问控制", "deny 语义", "soundness", "ABAC"], "added": "2026-10-24"}, {"title": "Structured Decomposition for Reliable LLM-Generated Access Control Policies", "authors": "Vatsal Gupta、Darshan Sreenivasamurthy（Apple Inc.）", "url": "https://doi.org/10.1007/978-981-92-6837-5_10", "venue": "ICICS 2026（LNCS vol 17216）", "oneliner": "自然语言访问控制策略 → OPA Rego 可执行代码的模块化流水线（策略检测/组件抽取/schema 校验/lint/编译/自动测试），372 条 ACRE 语句上端到端正确率 50.3%（基线 15.3%，3.3×）。", "insight": "\"LLM 生成访问控制策略\"的扎实工程参照，与我们是上下游互补关系（他们做策略生成可靠性，我们做检索时授权绑定）。deny 语义正确率 87.5% 与 Auditing 一文互相印证：deny 是访问控制最脆弱的一环，正是我们\"未知 AU 默认拒绝\"需形式化保证的 motivation。其\"正反两类测试都通过才算正确\"的严格标准可借鉴为三语义评测准则。注：Jev 粗筛 relevance 0.62 未过线，人工终审判定可引用而收入；代码尚未公开。", "tags": ["策略生成", "OPA/Rego", "policy-as-code", "deny 语义"], "added": "2026-10-24"}, {"title": "Enhancing Large Language Models with External Knowledge Using Retrieval-Augmented Generation: A Critical Review of Retrieval Design, Context Compression, Safety and Evaluation, with a Conceptual Governance-Aware Architecture", "authors": "Auti Pallavi S. 等", "url": "https://doi.org/10.5281/zenodo.23593530", "venue": "Zenodo 预印本综述（2026-10-23）", "oneliner": "RAG 批判性综述：梳理检索设计、压缩、安全与评测的相互作用，提出八层治理感知架构，把 IAM 权限过滤放进 RAG 设计核心。", "insight": "可作我们论文 related work 的治理视角动机引用：它把 IAM-based permission filtering 列为 RAG 设计的一等要素，并点明访问控制放在 LLM 之外执行只在显式信任假设下成立——这正是我们把信任假设形式化为逐 AU 求值与未知默认拒绝的动机。但注意边界：这是未经同行评审的综述、无新实验，八层架构未经验证，只能作背景/动机引用，不能作证据引用。", "tags": ["RAG 治理", "IAM 权限过滤", "综述"], "added": "2026-10-25"}, {"title": "An Efficient Privacy-Preserving Retrieval Scheme for Cloud-Based Retrieval-Augmented Generation", "authors": "Yuan Chang 等", "url": "https://doi.org/10.1109/TCCN.2026.3705821", "venue": "IEEE Transactions on Cognitive Communications and Networking（2026）", "oneliner": "云端 RAG 隐私检索 ShieldRAG：局部敏感哈希分桶 + 内积函数加密，云端看不到查询内容与文档访问模式，延迟 <0.5 秒、top-5 召回约 90%。", "insight": "与我们 embedding 通道一节可比但角度不同：我们防“结果里混进未授权内容”，ShieldRAG 防“云端从查询与访问模式反推隐私”，即 T2/T3 里服务器方观察者分支；可量化对照点是隐私不必以检索不可用为代价，但摘要未给明文基线精度损失与密钥管理成本，不宜写成已解决问题。", "tags": ["隐私检索", "函数加密", "云端 RAG"], "added": "2026-11-02"}, {"title": "RevBench: code, scenarios, run logs and judgments for enforcing mid-task permission revocation in AI agents", "authors": "Martin Ignatovski", "url": "https://doi.org/10.5281/zenodo.23854359", "venue": "Zenodo 软件与数据存档（配套论文 Revoking Access Does Not Revoke Knowledge）", "oneliner": "任务中途撤销权限的基准：逐调用授权 720 轮失败 57.9%，撤销发生在数据送达后失败率升至 72.8%，选择性重放+清单级溯源降至 21.0%。", "insight": "补上 AU 求值未单列的一维：授权的生命周期。我们的覆盖映射回答查询时某内容属不属于你，RevBench 回答此前已授权、此刻已撤销的内容在上下文、草稿与记忆里的残留如何清除；其清单级溯源与 M(r) 同源，讨论节可用 57.9%/72.8% 说明只在读取时设卡不够。标注证据边界：自建模拟平台 + LLM 评判，非真实 SaaS 实测。", "tags": ["权限撤销", "agent 授权", "残留知识", "基准"], "added": "2026-11-03"}, {"title": "IAMRAGBENCH: Benchmarking Authorization Expansions in LLM-Generated AWS IAM Policies under RAG Poisoning", "authors": "Hasan Kaplan 等", "url": "https://arxiv.org/abs/2611.03431v1", "venue": "arXiv:2611.03431v1 (2026)", "oneliner": "RAG 投毒攻击 IAM 策略生成的基准：投毒上下文诱使模型生成提供商校验通过、但超出可信授权需求的策略，60 案例、确定性授权包络评分。", "insight": "与 RU/AU 框架最直接的新证据：其“授权包络”即生成侧的 AU 求值——先划可信授权需求的线，再逐条判定生成物是否越线；“架构例外”包装下攻击率 63.79% 说明判定位置（何时判、由谁判）比规则本身更脆弱，呼应“查询时逐 AU 求值、未知 AU 默认拒绝”。另注意 CheckNoNewAccess 漏报 4 例：形式校验不能替代包络语义校验。引用时标注 arXiv 预印本、自建基准。", "tags": ["RAG 投毒", "授权扩张", "IAM 策略", "基准"], "added": "2026-11-04"}, {"title": "SearchInject: Retrieval Exposure Control for Indirect Prompt Injection in Language-Model Search", "authors": "Kainan Zhou 等", "url": "https://arxiv.org/abs/2611.02643v1", "venue": "arXiv:2611.02643v1 (2026)", "oneliner": "间接提示注入的检索层准入关：用相关性、搜索滥用信号与指令可能性联合打分隔离可疑候选，top-10 目标暴露率相对下降约 83%，干净检索质量几乎无损。", "insight": "与 retrieve-then-project 构成两道关对照：准入关挡“看起来像指令的页面”，授权关挡“不属于你的片段”，两者叠加才完整；其 nDCG@10 最大变化仅 0.0018 说明准入控制代价可以很小。引用时不要把“暴露率下降 83%”写成“攻击成功率下降 83%”（104 例跟进无法估计后者），且评估为家族内泛化。", "tags": ["间接提示注入", "检索准入", "隔离", "搜索增强"], "added": "2026-11-04"}, {"title": "Governed Retrieval Augmented Generation with Guardrails Role Based Access Control and Audit Logging", "authors": "Lohith Reddy Kalluru", "url": "https://doi.org/10.21275/sr261031123753", "venue": "International Journal of Science and Research（2026-11-04）", "oneliner": "企业 RAG 权限治理实测：只靠索引层过滤时角色撤销后 99.5% 的查询仍泄漏未授权上下文，加一道查询时权限复核后违规归零。", "insight": "把我们“策略独立存放、查询时逐 AU 求值”的主张变成了可引用的数字：99.5% 是“权限变了、索引没跟上”这一失效模式的直接证据；其“当前权限复核”与我们的查询时求值同构，可在 related work 里互相印证。引用时须写清三点限制：SQLite FTS5 合成诊断、无 LLM、无真实语料；IJSR 为低门槛期刊；只覆盖角色/文档撤销两类变化，未覆盖 T2/T3 攻击面。", "tags": ["RAG 授权", "RBAC", "权限撤销", "查询时复核"], "added": "2026-11-06"}, {"title": "Rag n' Roll: A Framework to Evaluate Indirect Prompt Manipulation Attacks against RAG-based Applications", "authors": "Gianluca De Stefano 等", "url": "https://doi.org/10.1145/3847352.3848095", "venue": "ACM Workshop on Artificial Intelligence and Security (AISec 2026)", "oneliner": "RAG 间接提示操纵评估框架：默认配置下攻击可控制高达 70% 的生成答案，而既有评估方法会系统性高估攻击成功率。", "insight": "给 RU/AU 论文一个可引用的攻击面数字：默认配置 70% 答案可被操纵，且效果高度依赖流水线参数——注入文档一旦进了检索集，文本层面的防御就拦不住，只有在检索/授权边界上卡住才行，与我们“授权判定在检索结果进上下文前由架构保证”同构。方法论提醒：我们的 cloze 攻击 89.4%@20 与重编码后 4.05% 的对比也应写清评估口径（检索配置、k 值、判定标准），否则同样会被质疑可比性。引用须写清 70% 为默认配置最高值。", "tags": ["RAG 安全", "间接提示注入", "评估框架", "AISec"], "added": "2026-11-11"}, {"title": "Isolation Is Not Confidentiality: Security Boundaries of Geometric Access Control in RAG", "authors": "Steve Nouyep 等", "url": "https://arxiv.org/abs/2611.14061", "venue": "arXiv 预印本（cs.CR，2026-11-10）", "oneliner": "几何访问控制保住了检索效用与策略隔离，却保不住表示机密性：几百对对齐向量即可恢复原始 embedding，策略相关几何还会泄露成员关系。", "insight": "把“隔离≠机密性”形式化成四个可分开检验的目标（隔离/机密性/抗伪造/成员隐藏），直接支撑我们论文的 embedding 通道论证：全文 embedding 索引下 cloze 攻击 89.4%@20、按授权视图重编码后 4.05% 的对比，恰好是“隔离成立、机密性仍失效”的实证。它的对齐样本恢复攻击与我们的 T2（可见排序向量）同构；策略成员隐藏是我们尚未显式处理的风险点，per-view 索引方案应说明是否覆盖这一层。引用须写清结论出自作者评估的公开实现与三个编码器。", "tags": ["RAG 访问控制", "几何变换", "embedding 泄露", "策略隔离"], "added": "2026-11-12"}, {"title": "Fail-Closed Authorization for Tool-Using AI Agents: A Capability Contract and Case Study", "authors": "Andrey Lesnikov", "url": "https://doi.org/10.21203/rs.3.rs-11676427/v1", "venue": "预印本（Research Square，单作者）", "oneliner": "默认拒绝的执行前授权门 ASC：工具目录 SHA-256 锁定、高危工具须带外批准、所有错误路径收敛到 BLOCK；60 例对抗探针放行攻击 32→1，代价是 3 个良性误拦。", "insight": "与 ChainBind 的执行时授权绑定同线互补：它的 fail-closed 姿态（未知即拒绝、错误即拒绝）与我们的“未知 AU 默认拒绝”一致，可并列引用；它给出的误拦代价（严格参数规则拦掉 94/97 良性任务）是“绑定越严、效用越低”的量化证据，应与我们 E12 的良性效用并排讨论；其 JSON 证据信封（每次裁决带完整性校验）是裁决审计记录的可借鉴机制。引用须写清评估只用静态录制轨迹、未跑 live agent，66 场景语料为作者自建。", "tags": ["执行时授权", "fail-closed", "MCP", "批准绑定"], "added": "2026-11-12"}, {"title": "Cited but Unused: Parametric Provenance in Retrieval-Augmented Generation", "authors": "Tanzeel Abbas, Tehseen Zia, David Windridge", "url": "https://arxiv.org/abs/2611.17161", "venue": "arXiv 预印本 (cs.AI), 2026-11-12", "oneliner": "RAG 的引用经常错报来源：1.2%–15.7% 的可引用 claim 实际来自参数记忆而非检索上下文，且标准 NLI 验证对此与随机无异。", "insight": "直接警示我们配套机制里的 NLI 残留检查：模型可以凭记忆答出未授权内容、再贴一个授权片段的引用，NLI 会放行；写 NLI 残留检查一节时必须回应这一点。它的反事实值替换方法（把授权片段关键事实换成虚假变体、看输出是否跟随）可直接借用为更诚实的残留检查实现，值得在下一轮实验里试。", "tags": ["RAG provenance", "NLI verification", "citation", "residual check"], "added": "2026-11-14"}, {"title": "POSTER: A Context-Consistent Attack Exploiting the Inspection--Execution Gap in Code-Executing Agents", "authors": "Pei Yan、Wenbo Guo、Xianbo Mo、Shunquan Tan、Jiwu Huang", "url": "https://doi.org/10.1145/3830454.3846448", "venue": "会议海报（ACM CCS 2026，2026-11-12）", "oneliner": "代码执行 agent 先静态检查、后执行，但运行时变换会产出未经检查的可执行载荷；900 次试验 87.3% 攻击成功率。", "insight": "与 ChainBind“批准不是执行”同构的平行证据：批准时看到的产物与执行时实际用的载荷之间存在变换窗口，窗口不关则批准失效；作者主张的“提取后授权检查点”与我们的运行时绑定是同一原则在代码执行场景下的实例，可在相关工作里并列引用。", "tags": ["agent 授权", "检查-执行鸿沟", "CCS 2026", "海报"], "added": "2026-11-15"}, {"title": "POSTER: Evaluating Mitigation Strategies Against Prompt Injection Attacks in Retrieval-Augmented Language Models", "authors": "Denis Biewer、Misha Glazunov、Theodor Schnitzler", "url": "https://doi.org/10.1145/3830454.3846434", "venue": "会议海报（ACM CCS 2026，2026-11-14）", "oneliner": "在单一受控配置下隔离评测 RAG 三阶段轻量防御：检索、提示词、输出防御各管一摊，没有任何单阶段能提供广谱保护。", "insight": "支撑“架构级授权”立论的实证注脚：三阶段防御都在模型拿到内容之后做缓解，我们的 AU 求值在检索结果进上下文之前，属于它未覆盖的第四个位置；其三类攻击场景（指令跟随、外泄、知识污染）可对应我们的 T1/T2 威胁层级。", "tags": ["RAG 安全", "prompt 注入", "防御评测", "CCS 2026"], "added": "2026-11-15"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica 等 4 人", "url": "https://arxiv.org/abs/2610.01871", "venue": "arXiv:2610.01871 (2026)", "oneliner": "针对返回图像的多模态 RAG 的黑盒自适应数据抽取攻击：影子图像混合+相关性加权重采样，单次 2500 查询重构 611 张放射影像，抽取条目数达非自适应基线的 5.6 倍。", "insight": "embedding 通道攻击线的最强邻居：我们的 A1 是文本完形攻击（89.4%@20），它是多模态、图像返回配置下的自适应抽取，说明向量索引的通道问题在跨模态场景同样成立且可被放大。可在 T2 威胁模型一节引用为最具体的实证；其\"重构出的不同条目数\"可借鉴为 embedding 泄露的度量。它不涉及授权语义（任何用户可查），防御侧无直接给出，但把\"embedding 索引必须被授权视图切分\"的论证推得更强——正是 per-view 索引的动机。", "tags": ["embedding 泄露", "数据抽取", "多模态 RAG", "攻击"], "added": "2026-10-03"}, {"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}, {"title": "Erased, but Not Gone: Output Forgetting Is Not True Forgetting", "authors": "Teresa Pui Yee Yong、Win Kent Ong、Chee Seng Chan", "url": "https://arxiv.org/abs/2606.25001", "venue": "arXiv 预印本（cs.AI）", "oneliner": "以“不含遗忘数据从零重训的模型群体”为理想遗忘参照，证明输出层遗忘指标系统性高估真遗忘：表征空间留着沿重训相关方向的结构化残差，relearning 攻击可恢复信息。", "insight": "与我们 embedding 通道泄露故事同构的“表面删除≠真删除”：它研究训练数据遗忘，我们研究检索内容授权，失效模式一致。可在论文动机/相关工作里并置引用（我们的 cloze 89.4%@20 与它的“输出指标系统性高估”互为佐证）。对 RU/AU 撤销机制的直接警示：AU 权限撤销后旧 embedding 向量若仍在索引里就是它的“结构化残差”——撤销评估必须做表征层一致性检查，不能只看输出层。", "tags": ["机器遗忘", "表征残差", "评估方法"], "added": "2026-10-13"}, {"title": "Residual Privacy Leakage after Output Scrubbing in Tool-Using LLM Agents under Indirect Prompt Injection", "authors": "Kashvi Gupta", "url": "https://doi.org/10.21203/rs.3.rs-11428254/v1", "venue": "Research Square preprint", "oneliner": "oracle 级事后输出清洗也清不干净：间接注入导致的隐私泄露经逐字+3-token 片段删除后，残留率仍达 61.2%/62.1%，幸存者主要是语义改写。", "insight": "用硬数字回答了我们论文的核心设计问题——为什么不用事后过滤而做检索时/索引时授权绑定：模型接触数据后，有限跨度的精确值清洗结构性失效（连 oracle 级都救不回来），唯一清零的是接触前的 pre-context-removal。其 57% 人工重判残留率可直接引用作 NLI 残留检查必须做到语义级的 motivation 数据。", "tags": ["事后清洗", "间接注入", "残留泄露", "接触前防御"], "added": "2026-10-23"}, {"title": "Privacy-Preserving Retrieval from Redacted Corpora: Effects of Retrieval Paradigm and Relevance Definition", "authors": "Yoshiyuki Sakamaki 等", "url": "https://doi.org/10.1007/978-3-032-37676-3_10", "venue": "ECML PKDD 2026（LNCS vol 16947）", "oneliner": "RAG 语料先脱敏再检索：BM25 在脱敏下保持稳健，稠密检索与 ColBERT 出现有统计支撑的退化；脱敏代价取决于检索范式与相关性定义。", "insight": "与我们的 retrieve-then-project 语义直接对照：按 AU 裁剪与按 PII 脱敏面临同一权衡，损失不是均匀的——评估裁剪语义时应分检索范式报告效用损失；脱敏与授权过滤可互补，但叠加损失需单独度量。实验基于 Text Anonymization Benchmark 单一基准，外推到真实企业语料需谨慎。", "tags": ["RAG 隐私", "脱敏检索", "BM25", "检索范式"], "added": "2026-11-06"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Permission Withdrawal in Tool-Using Language Model Agents: Runtime Enforcement and Recovery", "authors": "Gaurav Chaulagain、Medhavee Upadhyaya", "url": "https://doi.org/10.54536/ajdsai.v2i2.8776", "venue": "American Journal of Data Science and Artificial Intelligence", "oneliner": "用户中途收紧权限后，tool-using agent 是否还会执行已被撤回的操作：轨迹级授权问题与运行时门的对照实证。", "insight": "执行时授权绑定（方向 2）在行动层的直接对照：prompt-only 真的执行了被禁写操作，规则门零漏放、模型门 3 次误放且仅因资源不存在未遂。其五阶段可复现评测框架（提议/门决策/派发/状态转移/有用完成）值得借鉴为我们三语义评测的拆分方式，避免最终状态指标掩盖授权失败。限定：确定性模拟环境、期刊影响力有限，引用时标注受控环境实证。", "tags": ["agent 授权", "权限撤回", "运行时门", "轨迹级评测"], "added": "2026-10-26"}, {"title": "Act on Your Behalf, Beyond Your Authorization: Benchmarking LLM Agent Authorization Alignment", "authors": "Zhiping Zhang、Franklin Mingzhe Li、Zihao Huang 等", "url": "https://arxiv.org/abs/2610.27548", "venue": "arXiv 预印本", "oneliner": "发布 AuthorizationBench：286 个可执行任务、6,864 条轨迹，agent 在 19.2% 的轨迹中超出用户授权范围行动；任务完成不等于授权合规。", "insight": "agent 授权对齐方向第一个大规模实证基准，可引用作 motivation 数据（19.2% 越权率、加大推理力度不降低违规率）。维度区分：它测的是行动授权（delegation scope），我们做的是数据授权（AU 求值），related work 里应明确区分。其授权感知沙箱（授权内外路径均可执行可观测）是评估执行时授权绑定的现成实验装置。", "tags": ["benchmark", "agent 授权", "越权评测"], "added": "2026-10-22"}, {"title": "Package Hallucination Attacks on Coding Agents through Prompt Injection in Rule Files", "authors": "Yupu Wang、Zhengyuan Jiang、Reachal Wang、Neil Zhenqiang Gong（杜克大学）", "url": "https://arxiv.org/abs/2610.09264v1", "venue": "arXiv 预印本（cs.CR/cs.AI）", "oneliner": "提出 package hallucination 攻击：向社区共享的规则文件（AGENTS.md/.cursorrules）注入恶意提示，诱导编码智能体把合法依赖替换为攻击者控制的包；配套进化优化框架 PackHallu 构造注入提示，多 benchmark/多模型/多框架高成功率且迁移性强。", "insight": "攻击面弹药：这是一类'供应链式间接提示注入'——恶意内容不在检索语料里，而在智能体启动即加载的规则文件里。提示我们 agent 线探索应把规则文件/skill 文件视为与检索语料同等地位的不可信输入，tool-use 授权需覆盖'配置型上下文'。纯攻击论文、无防御构造，威胁模型章节一句话引用即可。", "tags": ["提示注入", "编码智能体", "供应链攻击", "规则文件"], "added": "2026-10-09"}, {"title": "VeriChainSim: Verifiable Evidence-Chain Simulation for LLM-Based Multi-agent Authorization in Aerospace Trusted Data Spaces", "authors": "G. E. Huiling、Zhiguo Shi（通讯）、Yungui Nie（北京科技大学）", "url": "https://doi.org/10.1007/978-981-92-5712-6_34", "venue": "Springer CCIS vol. 3155（CSC 2026 会议论文集章节）", "oneliner": "把 LLM 智能体的每次授权决策绑定到类型化证据指针（目录记录、策略标识、合同条款、会话绑定、证明对象），token 激活前由外部验证器对照可信状态注册表校验。", "insight": "实现了我们只在目标里写了的性质：对畸形证据 fail-closed（存在性/完整性/范围/会话一致性任一不过即拒绝）。与我们的 retrieve-then-project 同属'授权决策前置校验 + 失败降级'家族，但路径不同（中心化外部验证器 vs 查询时逐 AU 求值），可在相关工作/讨论章节并列引用。局限：航空航天专用场景、仿真评估，威胁模型未分层。", "tags": ["智能体授权", "证据链", "fail-closed", "可审计性"], "added": "2026-10-09"}, {"title": "Agents in Disguise - Weaknesses in Authentication and Authorization in Public AI Ecosystems", "authors": "Jan Stanek, Lukas Kencl", "url": "https://doi.org/10.1007/978-3-032-38702-8_15", "venue": "Lecture notes in computer science (2026)", "oneliner": "系统实测 MCP 等开放 AI 生态与协议中的认证授权现状：agent 身份缺失、弱认证泛滥、授权可选或逻辑损坏，并给出改进方向。", "insight": "直接相关 agent 授权线：它点出了我们主论文的一个隐含假设——RU/AU 框架的 P(a,u) 默认授权主体 u 已认证可信，而开放生态中 u 的认证本身仍未解决。可在威胁模型/讨论章节引用作边界声明：AU 框架解决已认证主体对内容的细粒度授权，主体身份可信需下层认证机制支撑。附带价值：引用链可顺藤摸瓜到 NIST NCCoE agent 身份概念文件与 mcpanalysis 分析工具。", "tags": ["agent 授权", "认证", "MCP", "开放生态", "实测"], "added": "2026-10-08"}, {"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "venue": "ACM (2026)", "oneliner": "用 capability-scoped 权限模型重构 coding agent 工具沙箱：工具调用须持有显式能力令牌，命名资源≠被授权操作，架构层面切断间接 prompt injection 的执行通道", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的执行语义哲学同构——都是把\"能说出名字/能检索到\"从隐含授权中剥离。差异在于粒度：它是工具调用级 capability，我们是检索内容级 AU。适合 Related Work 的 Agent 线引用，作为显式授权能力模型的独立佐证；两者交叉可作 future work 一笔。", "tags": ["agent 安全", "capability 模型", "prompt injection", "授权执行"], "added": "2026-10-04"}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang 等 5 人", "url": "https://arxiv.org/abs/2610.01508", "venue": "arXiv:2610.01508 (2026)", "oneliner": "研究工具调用 agent 的\"主动越权\"：8 个隐私敏感域的确定性 benchmark，7 个模型全部超授权范围；SelfAudit 零样本推理时自检把隐私向越权降低 43%。", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计。\"越权来自结构性决策倾向而非解码随机性\"的结论与我们\"保守子句切分器\"的直觉相通——授权边界应由机制保证而非模型自觉；SelfAudit 仍是模型自己审计自己（启发式），我们的确定性求值 P(a,u) 是更彻底的路线，可在 Discussion 对照。注意它是动作侧授权，我们是数据侧，不竞争。", "tags": ["Agent 授权", "越权", "benchmark"], "added": "2026-10-03"}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang 等 7 人", "url": "https://arxiv.org/abs/2610.00371", "venue": "arXiv:2610.00371 (2026)", "oneliner": "提出 authorization-paired evaluation（拦住禁用用途+完成授权用途为联合成功标准）与 FlowReview 框架（对象解析+权限排序+确定性执行），组合审查把 denied-commit 率从 86.0% 降到 0 且授权供给无损失。", "insight": "核心命题\"对象身份与权限必须通过输出可验证的组件与执行保持连接\"与我们的\"chunk 只存 M(r)、查询时逐 AU 求值\"同构——都反对权限是附在数据上的静态标签。它的\"联合成功标准\"值得借鉴：我们评估以安全侧为主，未来可加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）提示我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"，与 KG 路径切割一节可呼应。", "tags": ["Agent 授权", "组合安全", "评估方法"], "added": "2026-10-03"}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}, {"title": "Compromise Is Not Consequence: Evaluating Task-Scoped Authorization in LLM Agents with Paired Replay", "authors": "Tural Hagverdiyev", "url": "https://arxiv.org/abs/2610.05840", "venue": "arXiv:2610.05840 (2026)", "oneliner": "paired-replay 测试台量化任务范围授权对提示注入后工具执行的遏制：broad bearer 攻击后执行率 8.9–37.8%，scoped JWT / sender-constrained / OPA 三种限定条件全部为零。", "insight": "与我们 AU 授权单元同属\"授权原子单位\"家族的同行实证，粒度不同（按任务限定凭证 scope vs 按内容划分 AU）但哲学一致。核心结论\"The policy changes execution, not the frozen model decision\"与我们的 retrieve-then-project 执行语义形成跨域互证：安全寄托在执行层裁剪而非模型自觉。局限：测的是遏制非预防；AgentDojo 扩展样本小。可在执行语义/威胁模型章节引用作 RAG 侧 AU 求值 vs Agent 侧 task-scoped 的对照。", "tags": ["agent authorization", "scoped credentials", "paired-replay", "执行语义对照"], "added": "2026-10-07"}, {"title": "Can CaMeLs Talk? Securing Multi-Agent Systems Against Indirect Prompt Injection Attacks", "authors": "James Peters-Gill, Avi Semler, Henning Bartsch, Ilia Shumailov, Christian Schroeder de Witt", "url": "https://arxiv.org/abs/2610.05640", "venue": "arXiv:2610.05640 (2026)", "oneliner": "证明单智能体 CaMeL 安全保证在分层多智能体系统中不组合（不可信数据可被下游重新解释为可信输入），提出保持 provenance 的 multi-CaMeL 协议，把攻击成功率从 12.9% 降至 0.0%。", "insight": "攻击面在我们 T1/T2/T3 之外的新维度——组合性：每个单元各自安全，跨边界组合仍可被绕过，恰是我们 embedding 通道\"边界重解释\"问题的多智能体版本。对我们论文的直接影响：per-view 索引目前只论证单系统内隔离，若未来扩展到多智能体 RAG，视图隔离的组合性需单独证明——诚实的未来工作点，可在局限段引用此文佐证。当前 claim 不受动摇。", "tags": ["多智能体安全", "组合性", "CaMeL", "威胁模型扩展"], "added": "2026-10-07"}, {"title": "Semantic Privilege Collapse: Trust Boundaries and Execution-Level Authorization in Agentic AI Systems", "authors": "Narnaiezzsshaa Truong", "url": "https://doi.org/10.5281/zenodo.23285357", "venue": "Zenodo 预印本（OpenAlex 扩展源）", "oneliner": "提出“语义权限坍缩”概念：任务数据或授权不足的指令经模型解释被提升为实际动作权限；主张授权绑定在执行时而非读取/检索时，信任边界必须在执行流水线中显式存在。", "insight": "与我们独立主线方向2（执行时授权绑定）直接对话的概念级文献。它的“数据→动作权限坍缩”是 T1/T2/T3 之外的攻击面（我们管“读”，它管“做”）；“执行时重新求值”与我们“查询时逐 AU 计算 P(a,u)”共享同一哲学——反对一次性授权、后续信任传递。援引的 capability-oriented control 与 AU 本质（逐 AU 授权 = 逐能力持有）可对齐，为两条主线的理论接口提供概念桥。局限必须标注：单作者、Zenodo note、无实证数字、0 引用，只能作概念锚点，不能作经验证据；且未形式化执行时判定的语义——正是我们能贡献的形式化增量。", "tags": ["执行时授权", "权限坍缩", "概念锚点"], "added": "2026-10-12"}, {"title": "LLMail-Inject: A Dataset from a Realistic Adaptive Prompt Injection Challenge", "authors": "Sahar Abdelnabi、Aideen Fay、Ahmed Salem 等", "url": "https://arxiv.org/abs/2506.09956", "venue": "arXiv 预印本（cs.CR）", "oneliner": "20.8 万条真人红队撰写的间接提示注入攻击，评估“检索→绕防御→触发未授权工具调用”完整攻击链：Meta SecAlign 仍 32% ASR、GPT-4o 58%、GPT-5 mini 47%，旧基准已饱和而它没有。", "insight": "与我们两条主线都对话的攻击侧基准：攻击链恰好横跨检索层授权（retrieve-then-project）与执行层授权（方向2），其 28–45% 的跨域迁移 ASR 是论证“仅做检索侧裁剪不够”的有力数字；引用它的“旧基准饱和论”可为防御评估选用高强度基准背书。注意它的“未授权”指任务目标被篡改、非用户权限不足，引用时需注明。", "tags": ["提示注入", "评测基准", "agent 安全"], "added": "2026-10-13"}, {"title": "Designing for Doubt: The Case for Informed Abstention in Autonomous Agents", "authors": "Victor Ojewale、Suresh Venkatasubramanian", "url": "https://doi.org/10.1609/aies.v9i3.43281", "venue": "AAAI/ACM AIES 2026", "oneliner": "诊断 agent 评测的合规偏置（只奖“做完”不奖“该停就停”），提出“知情弃权”：缺输入/证据/授权时阻断下一次工具调用；144 场景评测中危险动作阻断率 87.5–91%、授权场景可用性 75–92%。", "insight": "方向2（执行时授权绑定）最强的同盟文献之一：“缺授权→结构化暂停+阻断工具调用”正是执行时授权绑定的 fail-closed 降级语义；“危险动作阻断率/授权场景可用性”双指标可直接复用为我们评估执行时绑定的指标对；runtime enforcement + auditable trace 与“查询时逐 AU 求值+审计日志”架构同构。差异点：它的弃权是 agent 自主判断，我们是外部策略求值 P(a,u)——两篇论文可互相引用。注意：AIES 为伦理社会会议、初步评测仅 144 场景，引用时如实标注。", "tags": ["执行时授权", "agent 安全", "评估方法"], "added": "2026-10-13"}, {"title": "Kairos: Transactional Security Enforcement at the System Boundary for LLM Agents", "authors": "Kristoffer Hempel、Nils Loose、Lorenzo Cavallaro、Thomas Eisenbarth", "url": "https://arxiv.org/abs/2610.18457", "venue": "arXiv 预印本（cs.CR/cs.LG，2026-10-13）", "oneliner": "不改造 agent 本体，在系统隔离边界做 reference monitor：tool call/shell/脚本越界一律视为文件与网络操作；声明式策略定可信来源，判不定的挂起、agent 推测执行，权限受限的决策预言机按完整 trace 逐条裁决；AgentDojo 攻击成功率 47.0%→2.7%，良性效用不降。", "insight": "agent 访问控制主线（执行时授权绑定方向）的直接平行工作。它的\"挂起+推测执行+事后按 trace 裁决\"是一种延迟绑定授权：授权不在 action 发起时、而在效果提交前基于完整证据做——与我们 RAG 侧\"检索时逐 AU 求值、执行语义层再裁决\"同构，可互引为延迟授权绑定的两个实例（agent 执行 vs RAG 检索）。AgentDojo 47.0%→2.7% 是可引用的 agent 侧授权机制实证上界。注意它不处理检索授权，与主论文是平行关系而非直接对比。", "tags": ["agent 授权", "延迟绑定", "reference monitor", "AgentDojo"], "added": "2026-10-15"}, {"title": "The Agent Knew: Internal States Forecast Unauthorized Actions and Stop Them, and the Lies That Follow", "authors": "Arya Fayyazi、Mehdi Kamal、Massoud Pedram", "url": "https://arxiv.org/abs/2610.17301", "venue": "arXiv 预印本（cs.AI，2026-10-12）", "oneliner": "Agent 越权行为可在行动前被残差流线性探针预测（AUROC 0.94）；预测门控把 Gemma-4 越权率从 0.70 降到 0.09，任务完成率保持 1.00；阻止越权也是阻止事后撒谎的最可靠方式。", "insight": "agent 访问控制主线（执行时授权绑定方向）的直接证据：授权判定点从\"action 发起时\"前移到\"内部状态可预测时\"，与 Kairos 的延迟绑定形成一前一后两种授权绑定点位，可互引。CAPE-Bench 的\"单事实决定授权与否\"任务设计可借鉴为我们 runtime binding 的评估范式；\"追溯性权限洗白\"概念落在 T2/T3 讨论空间——内部状态既是防御信号也是可观测攻击面。实验预注册+hash 锁定，方法论可信度高。", "tags": ["agent 授权", "越权预测", "内部状态", "CAPE-Bench"], "added": "2026-10-16"}, {"title": "Policy-Verified Self-Training: Learning Agent Compliance from Verifiable Policy Rewards", "authors": "Min-Young Yu", "url": "https://arxiv.org/abs/2610.19372", "venue": "arXiv 预印本（cs.LG/cs.AI，2026-10-14）", "oneliner": "把运行时策略验证器的判定复用为可验证的策略奖励做后训练：Qwen3-8B 违规轨迹 37.2%→10.3%，成功攻击 12.4%→0.5%，效用不降。", "insight": "\"运行时策略验证器\"正是 AU 逐单元鉴权在 agent 侧的形态——区别是他们把 verifier verdict 复用为训练信号，我们是查询时逐 AU 求值做执行时裁决，两种用法可在论文讨论/相关工作里并置对比。他们总结的 verdict 信息量两条件（任务成功≠合规；被保护动作须同时出现在允许与禁止语境）对我们设计策略绑定评估用例有直接参考价值。注意其策略可编译为确定性门控的工程假设与我们的独立策略存放不同，引用时需说明。", "tags": ["agent 合规", "策略验证器", "后训练", "verifiable reward"], "added": "2026-10-16"}, {"title": "Approve What, Exactly? Effect Binding and Trusted Rendering for Agent Step-Up Authorization", "authors": "Sai Varun Kodathala、Prashanth Pollishetty、Jaylen Cargill", "url": "https://arxiv.org/abs/2610.21063", "venue": "arXiv:2610.21063 (2026)", "oneliner": "证明 agent 的\"审批授权\"只有精确命名批准对象时才算第二因素：定义 12 种审批路径攻击，在 AP2/微软 action-bound/MCP elicitation 上测试；10 个运行时审计均无第三方可验证审批记录；参考实现 ASU（规范效应描述符渲染卡 + passkey 签名 + 只执行存过的调用），Tamarin 形式化证明绑定性。", "insight": "agent 独立主线（runtime authorization binding）的第一个硬核锚点。其\"审批必须精确命名批准对象\"即执行时授权绑定的另一种表述，12 种攻击枚举可直接借用为绑定评估的威胁基线；负结果（洪水攻击仍 0.45-0.60 成功、审批挡不住策略允许的坏行为）是我们写论文时给 binding 划安全边界的诚实范例。对 RAG 主论文是方法论借鉴：规范效应描述符与 AU 划分在\"授权原子单位必须精确可审计\"上同构。", "tags": ["agent授权", "审批绑定", "威胁模型", "必引候选"], "added": "2026-10-17"}, {"title": "Matoi: Selective Revalidation of Consequence Evidence for Agent Authorization", "authors": "Zexun Wang", "url": "https://arxiv.org/abs/2610.21394", "venue": "arXiv:2610.21394 (2026)", "oneliner": "把\"可复用的后果证据\"与\"当前执行权\"解耦：消费者只能复用自己已核验且观测仍有效的证据，签名请求/实时配额/不确定结果每次必重新履行，形成有界、可审计的复用契约（AgentDojo Banking 场景拒绝 35 次复用攻击计划交叉）。", "insight": "与我们 RU/AU 解耦在解耦方法论层同构：chunk 只存 M(r) 映射（证据），策略独立、查询时逐 AU 求值（授权结论）。它对\"可缓存 vs 必重验\"的分类可借鉴为我们设计 AU 缓存/重求值策略的对照：已核验有效可复用、不确定结果不可复用——正好对应我们\"未知/未映射 AU 默认拒绝\"。对 RAG 主论文是设计论证引用，对 agent 主线是\"授权持续性\"相关工作；实验为脚本化合成场景，数字不可比。", "tags": ["agent授权", "证据复用", "解耦设计", "相关工作"], "added": "2026-10-17"}, {"title": "INFUSE: A Unified Surface Benchmark for Indirect Prompt Injection in Agentic Systems", "authors": "Thuy Dung Nguyen、Jingyi Guo、Rana Seda Dubauskas、Sreepriya Damuluru、Taylor T. Johnson、Kevin Leach", "url": "https://arxiv.org/abs/2610.20776", "venue": "arXiv 预印本（2026-10-14，cs.CR/cs.AI）", "oneliner": "第一个覆盖长周期 agent 全流程的间接 prompt injection 端到端基准：40 真实任务 × 56 攻击场景 × 19 模型，41824 条对抗轨迹。", "insight": "agent 独立主线可直接借用的评估基座：56 场景 × 5 威胁类别的攻击面枚举可对标我们\"执行时授权绑定\"的防御评测；分模型 ASR-L（3.2%–41.9%）的报告格式值得照抄。核心论据价值在其反面：prompt 级指令硬化只能把 ASR 从 58.2% 压到 14.3%，证明指令层防御有上限，执行语义层绑定才是回答。", "tags": ["基准评测", "间接提示注入", "agent 安全"], "added": "2026-10-18"}, {"title": "Certified Execution Harness for Agentic AI: Safe and Least-Intrusive Petri-Net Supervisory Control Between Reasoning and Action", "authors": "Chao Gu、Quanyan Zhu", "url": "https://arxiv.org/abs/2610.31376", "venue": "arXiv 预印本", "oneliner": "用 Petri 网把 LLM agent 的工具执行 harness 形式化为 supervisory control：capability/approval/budget 建模为 token，前置条件不满足的注入请求被结构性拒绝。", "insight": "agent authorization 线的 related work 引用：其\"前置条件不满足即拒绝\"与我们\"未知 AU 默认拒绝\"同哲学不同层。反直觉结论——maximally permissive supervisor 在重规划闭环里反而可能比更严格者更具侵入性——可作我们三语义\"安全-效用权衡必须在带重试闭环里评估\"的平行证据。威胁模型是 prompt injection 下工具执行（T2 附近），非检索侧信道，引用时勿混淆。", "tags": ["agent 授权", "supervisory control", "prompt injection", "形式化"], "added": "2026-10-24"}, {"title": "CoSA: The Conflict of Skills Attack in Real-World LLM Agent Ecosystems", "authors": "Yujia Zheng 等", "url": "http://arxiv.org/abs/2610.35082v1", "venue": "arXiv cs.CL / cs.AI / cs.CR（2026-10-26）", "oneliner": "单技能各自合规、组合后却越权：仅加 5% 技能就把策略违规率从 35.02% 拉到 58.45%，执行前检查信息流与授权的护栏又把它压到 6.67%。", "insight": "授权组合语义的实证锚点：单体检查在组合下系统性失效，因为授权没有随制品/决策跨步骤传递——与 RU/AU 的 M(r) 覆盖映射与批准依据绑定同向，可作“为什么不能只做单步检查”的引用；护栏的可用性代价（良性完成率仅 -1.67 个百分点）也是论证安全不必以可用性崩盘为代价的并列数字。限定：公开 Skill 与受控服务评测，增幅不宜直接外推到企业技能池。", "tags": ["Agent 授权", "技能组合", "执行时护栏", "CoSA-Bench"], "added": "2026-10-28"}, {"title": "TrustJev: Separating Policy Authority from Untrusted Evidence in LLM-Based Decisions", "authors": "Zhiwei Xu 等", "url": "http://arxiv.org/abs/2610.34826v1", "venue": "arXiv cs.AI（2026-10-26）", "oneliner": "策略权威与不可信证据分离：0.6B 决策模型先从可信策略算分数与修正预算，证据修正被框在预算内，授权基准上 95.77% 的源挡住全部 32 次攻击。", "insight": "“策略独立存放”在决策模型里的同构实现，可作 related work 中策略与证据分离路线的代表；但必须点明分界：它是学习到的打分而非确定性策略求值，95.77% 是统计稳健性、不是“策略被违反时一定拒绝”的保证，不能用来论证确定性授权的安全性。", "tags": ["策略权威", "决策模型", "授权基准"], "added": "2026-10-28"}, {"title": "Heads of Security: Learned Attention Gates Improve Prompt Injection Robustness", "authors": "Igor Shilov 等", "url": "http://arxiv.org/abs/2610.37657v1", "venue": "arXiv cs.LG / cs.CL / cs.CR（2026-10-27）", "oneliner": "用可学习逐头注意力门在架构层强制指令—数据分离：黑盒 RL-Hammer 对 HoS 成功率仅 10%（基线 97%、SecAlign 85%），工具效用未崩。", "insight": "指令—数据分离在模型内部的架构实现，与系统边界的 AU 求值互补成纵深防御的两层；评测口径可借鉴（自适应攻击成本倍数 + 工具效用底线）。但必须点明分界：门控是学习到的统计稳健性、不是确定性保证，不能写成“已解决注入问题”。", "tags": ["提示注入防御", "指令数据分离", "注意力机制"], "added": "2026-10-29"}, {"title": "Lineage: A UMA2.0 Protocol Extension for Multi-Hop LLM Agent Delegation", "authors": "Ştefania Ştefănescu、Iulian Aciobăniței", "url": "https://doi.org/10.1109/ACCESS.2026.3708618", "venue": "IEEE Access（2026）", "oneliner": "给 UMA 2.0 补多跳委托原语：每条受保护请求携带经签名的完整委托血缘，资源服务器无需再向授权服务器往返即可验证，作用域单调、深度有界、决策入防篡改审计日志。", "insight": "把“批准—执行绑定”从单步扩展到多跳委托链的最直接参照：我们的 AU 求值回答内容该不该给，Lineage 回答委托链每一跳是否还有效。协议层独立于模型行为拦住一次真实提示注入尝试，与“过滤而非依赖引导”同构；引用时须写清作者自认只覆盖 DORA 第 9 条协议层子集、注入实验仅一次尝试。", "tags": ["agent 委托", "UMA 2.0", "审计"], "added": "2026-11-02"}, {"title": "Trust-Aware Orchestration Architecture for LLM-Assisted Workflows in Multi-Tenant Enterprise Systems", "authors": "Nandakishore Leburu", "url": "https://doi.org/10.1109/ACCESS.2026.3706063", "venue": "IEEE Access（2026）", "oneliner": "多租户 LLM 工作流的确定性控制面：LLM 只提议，三道硬门决定执行；但硬门拦不住权限内恶意意图（自适应案例成功率 30%–70%）。", "insight": "AU 求值在 agent 工具调用侧的对应物：租户解析、工具授权、模式校验分别对应授权域归属、AU 是否允许调用、参数是否在批准范围内；同时为 ChainBind 划出能力边界——绑定保证执行等于批准，保证不了批准本身意图良善。标注：自适应案例仅 20 条 prompt，点估计。", "tags": ["确定性控制面", "多租户", "工具授权", "AgentDojo"], "added": "2026-11-03"}, {"title": "Whispers of Wealth: Red-Teaming Google's Agent Payments Protocol via Prompt Injection", "authors": "Tanusree Debi、Wentian Zhu", "url": "https://arxiv.org/abs/2601.22569", "venue": "arXiv 预印本（arXiv:2601.22569v1）", "oneliner": "AP2 红队：密码学 mandate 保得住凭证本身，保不住生成批准的推理过程；Branded/Vault Whisper 分别操纵排序与提取敏感数据。", "insight": "ChainBind 论点在支付协议上的独立佐证：批准不等于执行安全，签名只保证被操纵的批准被忠实执行；引用时可论证授权校验还需校验批准形成时的信息来源。标注：单原型（Gemini-2.5-Flash + ADK）、摘要未给系统成功率数字。", "tags": ["AP2", "提示注入", "支付授权", "红队"], "added": "2026-11-03"}, {"title": "ATrust: Adaptive Trust Boundary Expansion for Securing LLM Agents", "authors": "Xu Zhang、Zhichao Lu", "url": "https://arxiv.org/abs/2611.02741v1", "venue": "arXiv:2611.02741v1 (2026)", "oneliner": "自适应信任边界：以用户查询为信任锚点，运行时逐步接纳任务必需的外部信息，AgentDyn 攻击成功率 37.80%→4.37%，效用提升 10%。", "insight": "把“信任”做成运行时可扩展状态，与“查询时逐 AU 求值”相通但粒度不同：任务必需性与授权许可性是两条独立准入条件，只满足其一都不应放行。引用时标注 arXiv 预印本、GPT-4o 单引擎自报数字，且摘要未报告误拒率与延迟代价。", "tags": ["信任边界", "agent 防御", "AgentDyn", "过度防御"], "added": "2026-11-04"}, {"title": "Securing Web Agents with the Compile-Then-Execute Paradigm", "authors": "Annabella Chow 等", "url": "https://arxiv.org/abs/2611.06039", "venue": "arXiv 预印本（cs.CR，2026-11-04）", "oneliner": "Web agent 先编译后执行：规划模型运行时不看网页内容，WASP 上攻击成功率 0%，WebArena 效用 77.8% 反而高于 ReAct 基线。", "insight": "与“运行时授权绑定”同构但发生在另一层的解法：我们收的是执行时授权判定的自由度，Baya 收的是运行时合成新操作的自由度；0% ASR + 效用反升说明收紧自由度不必然以效用为代价，可在讨论节引用。但 Baya 依赖事先可信抽象的 Trusted Website API，开放网络上前提很强，与我们 AU 求值的适用条件不同，引用时须写清前提。", "tags": ["Agent 安全", "提示注入", "编译执行", "控制流"], "added": "2026-11-06"}, {"title": "Rethinking Access Control for AI Agents: Recent Advances and Open Challenges", "authors": "Chijin Zhou、Quan Zhang", "url": "https://arxiv.org/abs/2611.06764", "venue": "arXiv 预印本（cs.SE，2026-11-04）", "oneliner": "Agent 访问控制综述：四块分类 + 四点再思考，“授权须随工作流演进而重新评估”与执行时授权绑定同构。", "insight": "可直接作 related work 骨架：四块分类法给 RU/AU 解耦与查询时逐 AU 求值提供了现成位置；其评估标准（同时看可观测行为与仍被允许的未授权效果）可借来强化 ChainBind 评估一节。综述无新实证数字，引用时只引分类与论点。", "tags": ["Agent 访问控制", "综述", "授权绑定", "评估标准"], "added": "2026-11-07"}, {"title": "Revoked, Not Stopped: Late Revocation Notices and Channel-Switching in LLM Agents", "authors": "Muzammal Hussain", "url": "https://doi.org/10.5281/zenodo.23964291", "venue": "Zenodo 预印本（2026-11）", "oneliner": "撤销的滞后本身就是攻击面：通知晚到一步，16.5% 的已撤销敏感动作照常通过；按工具名撤销会被通道切换绕过，最高 38.7%。", "insight": "补上我们论文尚未系统处理的“授权撤销”一环：撤销须按效果（数据离境）界定、在每次敏感动作前重做；拒绝消息应给明确撤销语义而非裸 403。诚实标注：5 个开源小模型 + 虚构场景 + Zenodo 预印本，数字不宜外推到前沿闭源 agent。", "tags": ["授权撤销", "Agent 安全", "通道切换", "执行时授权"], "added": "2026-11-07"}, {"title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "authors": "Woosang Lim 等", "url": "https://arxiv.org/abs/2611.07222", "venue": "arXiv 预印本（cs.CR，2026-11-05）", "oneliner": "确定性防线：动作目标只认工具类型化返回的字段，标准模板注入零次得手，几乎不增加模型调用。", "insight": "与执行时授权绑定同构的另一实现：把“模型临场决定”换成确定性判定；“只放宽、不放行已污染目标”的不对称恢复规则可借鉴到 per-view 索引。适用条件：目标值须来自类型化字段，纯自由文本工具上底线会退化。", "tags": ["提示注入", "确定性防御", "工具调用", "Agent 安全"], "added": "2026-11-07"}, {"title": "Position: Agents Orchestrate, Policy Enforces — A Deterministic Tool-Use Control Pattern for Agentic Assistants over Sensitive EEG Data", "authors": "S. Katamadze、Ankur Chattopadhyay", "url": "https://doi.org/10.1145/3846374.3846391", "venue": "第 3 届 ACM 大型 AI 系统隐私与安全分析研讨会（2026）", "oneliner": "agent 只编排、不授权：工具调用的授权交给模型之外的确定性策略引擎，三道信任边界按序设防，32 个对抗调用全拒、25 个良性全放。", "insight": "与 ChainBind“批准不是执行”同一架构原则的独立旁证：定权限的东西必须坐在被管的东西之外，判定发生在执行之前、不依赖模型临场判断。作者诚实标出的缺口（工具输出边界 B3 的投毒未被评估）恰是 E12 残余失败的草案投毒一类，可对照引用；三边界次序控制可与我们的 T1/T2/T3 交叉引用。引用须写清这是 position 论文 + 脚本化可行性套件，不是稳健性基准。", "tags": ["确定性策略引擎", "MCP 工具调用", "批准绑定", "信任边界"], "added": "2026-11-09"}, {"title": "Evil-AI Benchmark: An Evaluation Framework for Adversarial Security Assessment of LLM Agents in Smart Environments", "authors": "Aygun Varol 等", "url": "https://doi.org/10.1109/ACCESS.2026.3727159", "venue": "IEEE Access（2026）", "oneliner": "智能环境 agent 对抗安全评测：五类威胁向量 + 能力验证 + 50 个良性过拒测试，工具触发直连 Arduino 舵机做物理验证；8 个模型 Evilness 率 0.8%–54.0%。", "insight": "评测方法论可引用：过拒测试与对抗测试并列为一等公民，与 E12 同时报告良性效用与受攻击效用的做法一致；跨模型 Evilness 率 spread（0.8%–54.0%）与我们六模型基线 ASR spread 同构，说明防御效果必须分模型报告。物理执行验证标出我们工作的边界：授权绑定目前只覆盖软件工具调用。引用须写清文中称开源但本轮未拿到仓库链接。", "tags": ["Agent 安全评测", "提示注入", "过拒测试", "智能环境"], "added": "2026-11-09"}, {"title": "Authorization assurance for tool-using LLM agents: a structured review of enforcement semantics and effect-level security evidence", "authors": "M. Elmasry", "url": "https://doi.org/10.1007/s10207-026-01343-w", "venue": "International Journal of Information Security (Springer, 2026-11-10)", "oneliner": "结构化综述：75 篇文献筛成 30 篇、92 条来源—主张记录，21 篇 agent 文献里无一条可评估的撤销主张、无一条委托 containment 主张。", "insight": "投稿前最值得对照的审稿人视角：它把“撤销主张为零”写成全领域空白，我们的 epoch 撤销机制恰好落在这个空白上，相关工作里可直接引用该统计作外部定位；“最小权限只量变窄、不量轨迹有效权限”的批评则反衬我们 E12 的轨迹级度量（ASR + 良性效用）正是它要求的证据形态；“最终状态正确 ≠ 授权正确”可直接支撑“批准不是执行”。引用须写清 30 篇为作者冻结的闭合语料、覆盖截止 2026-07-15，MAAP 为初步报告框架未经验证。", "tags": ["授权保证", "撤销", "委托", "综述", "ChainBind"], "added": "2026-11-11"}, {"title": "PRISM: Causal Counterfactual Minimization of Agent Tool Privileges via Information Bottleneck Role Induction", "authors": "Yang Luo 等", "url": "https://arxiv.org/abs/2611.11539", "venue": "arXiv 预印本（cs.CR，2026-11-08）", "oneliner": "把角色工程对象从人换成 agent：因果反事实 + 信息瓶颈学出最小工具集，单角色授权工具数压掉 78.3%、爆炸半径降至 15.9%，任务成功率 78.2%。", "insight": "与 ChainBind 互补：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”——学出的最小权限集可作批准的标的、由运行时绑定强制执行。78.2% 成功率与 15.9% 爆炸半径可与我们 E12 的 ASR + 良性效用并列，说明“权限压下来、正常路没走死”的双指标口径。引用须写清数字出自 AgentDojo/τ-bench/ToolEmu 三基准与作者自建的反事实干预流程，且它只解决批准前权限集生成、不处理执行时越界。", "tags": ["最小权限", "工具权限", "因果反事实", "Agent 安全"], "added": "2026-11-11"}, {"title": "CapLite: Prompt-Injection Defense for Small Language Model Agents without Model-Written Security Artifacts", "authors": "Zimo Xu, Wenzhuo Liu, Hideki Nakayama", "url": "https://arxiv.org/abs/2611.17115", "venue": "arXiv 预印本 (cs.AI/cs.CL/cs.CR), 2026-11-12", "oneliner": "小模型 agent 写不出可信的安全工件：改从工具 schema 派生策略、写操作先提交，13,935 个被攻击的 AgentDojo 回合零攻破。", "insight": "直接支撑 ChainBind“执行时授权绑定”的立论：模型写出的权限策略本身不可信（Progent/IPIGuard/DRIFT 的策略在 11–14 个小模型上可被攻破），授权锚点不能放在可被注入改写的同一层。它的“写完整性”保证（接收方、金额、对象、目的地四元组必须出自用户请求）与我们 AU 求值的思路同构，可在相关工作里并列：它管写操作的授权绑定，我们管检索单元的授权绑定，两者合起来覆盖 agent 的读与写。", "tags": ["agent authorization", "prompt injection", "AgentDojo", "write integrity"], "added": "2026-11-14"}]}], "note": "人工精选、长期维护的论文库；每日 08:00 看板构建时自动嵌入，不会被每日文献流覆盖", "updated": "2026-11-15"};
const INT = {"interests": [{"id": "rag-access-control", "items": [{"title": "RAG Pipeline Utils v3.8.2: Security Fixes and a Re-ingest Check", "url": "https://devilsdev.github.io/rag-pipeline-utils/blog/v3-8-2-release", "kind": "news", "date": "2026-11-09", "why": "补完 3.8.1 的 RetrievalGuard 绕过修复：顶层 acl/requiredRole 在 Qdrant/Pinecone/Weaviate/PgVector 四家检索器里会被漏放给无权限用户（GHSA-234f-v76m-p9wc），是 RAG 访问控制绕过的真实案例。"}, {"title": "RAG Pipeline Utils v3.8.1：修复 RetrievalGuard 访问控制绕过漏洞", "url": "https://dev.to/devildev/rag-pipeline-utils-v381-3pl2", "kind": "news", "date": "2026-11-07", "why": "一次真实的 RAG 访问控制失效案例：角色受限文档可能被无该角色的用户拿到（GHSA-8393-cmg7-9rv3），修复后 RetrievalGuard 要求满足文档设定的全部限制条件；与我们“授权必须在检索时求值”的主张直接呼应。"}, {"title": "RAG Security Enters the Spotlight, but the Real Risk Is Hidden in the Pipeline", "url": "https://netcrook.com/written_article?slug=rag-security-hidden-risks-in-the-pipeline&lang=en", "kind": "news", "date": "2026-10-21", "why": "论述 RAG 安全风险决定于文档采集、访问控制、来源校验等管线环节而非模型本身，与检索授权管线治理主题直接相关。"}, {"title": "Progress Software Connects Enterprise Knowledge Across Business Systems with New Agentic RAG Capabilities", "url": "https://usanewshour.com/progress-software-connects-enterprise-knowledge-across-business-systems-with-new-agentic-rag-capabilities/394126/", "kind": "news", "date": "2026-10-02", "why": "Progress 新版 Agentic RAG 强调跨业务系统问答时沿用已有索引内容的访问控制与治理框架、无需重建索引——企业级 RAG「权限延续」的产品案例，与 RU/AU「权限随数据、检索时强制执行」思路同向。"}, {"title": "Dify 1.17.1 Strengthens Knowledge Base Security and Fixes Critical RAG Data Corruption Bugs", "url": "https://undercodenews.com/dify-1171-strengthens-knowledge-base-security-and-fixes-critical-rag-data-corruption-bugs-video/", "kind": "news", "date": "2026-10-01", "why": "Dify 知识库 API key 终于支持绑定到单个 dataset：此前一个 key 可访问 workspace 内所有知识库，1.17.1 起可收窄作用域——“授权粒度下沉到数据对象”的产品实例，与 RU/AU 细粒度思想同向。"}, {"title": "CodePoisonRAG: knowledge poisoning attacks on retrieval-augmented code generation", "url": "https://adversa.ai/blog/top-ai-coding-agent-security-resources-october-2026/", "kind": "news", "date": "2026-10-04", "why": "检索投毒实证：85 个投毒代码制品跨 10 类漏洞在 3 个代码生成器上达到 0.80–0.93 成功率，且制品\"保持任务相关性+伪造安全声明\"——与我们关注的检索阶段攻击面直接相关，可作 RAG 安全防御的引用弹药。"}, {"title": "FramePoison: attacks on medical RAG that target framing, not just facts", "url": "https://www.nature.com/articles/s44387-026-00163-6", "kind": "paper", "date": "2026-10-07", "why": "检索投毒的新维度：不换事实、换“表述框架”——3 个生物医学语料、5 个开放权重模型上，每问题投 5 篇文档即有 ≥3 篇进 top-5，1–2 篇就足以翻转答案。说明 RAG 授权不能只验内容是否“事实正确”，表述层的影响也应进入授权/执行语义的考量，可作我们论文攻击面讨论的引用。"}, {"title": "IBM FTM 曝未授权 RAG 投毒漏洞 CVE-2026-18875（CVSS 7.3）：毒化向量库可劫持 MCP 工具调用", "url": "https://forkast.news/unauthenticated-rag-poisoning-in-ibm-financial-transaction-manager-exposes-mcp-tool-calls-to-hijacking/", "kind": "news", "date": "2026-10-12", "why": "IBM Financial Transaction Manager 的 AI agent 服务器允许未授权攻击者向上游 runbook 向量库写入恶意内容，毒化后的检索上下文进而操纵 MCP 工具调用、执行未授权支付动作。这是“检索投毒→工具调用劫持”的完整生产案例链：检索完整性失效直接转化为执行侧越权，正好落在我们的 T3（全知识对手）与 agent 授权线的交叉点上。"}, {"title": "Protecto：RAG 流水线的数据政策——在 ingestion 与 retrieval 两处设防（厂商博客）", "url": "https://www.protecto.ai/blog/data-policy-in-the-rag-pipeline-stop-30-years-of-exposure/", "kind": "news", "date": "2026-10-12", "why": "厂商博客，观点可取：索引级访问控制不够，因为“查询索引的 agent 都是已授权的”，问题在返回什么、之后发生什么；主张 ingestion 时脱敏（保留语义去标识）+ retrieval 后按请求者/任务施加策略。思路与我们 retrieve-then-project 同构，但它是工程产品文案，无形式化结果，仅作思路参照。"}, {"title": "genai-tk 设计调查：Agentic RAG 的访问控制（pre-retrieval 过滤 + 确定性强制执行）", "url": "https://github.com/tclatos/genai-tk/blob/HEAD/docs/studies/access_control_agentic_rag.md", "kind": "repo", "date": "2026-10-09", "why": "Agent 型 RAG 系统的访问控制设计调查：主张授权必须在 LLM 看到上下文之前（pre-retrieval）完成，post-retrieval 过滤不充分（缓存/流式缓冲/观测链路仍可泄露），强制执行必须是确定性的而非 prompt 式的——与我们 RU/AU“查询时逐 AU 求值、确定性策略”的设计哲学一致。"}, {"title": "Document-Level Access Control In RAG: Stop Vector DB Leaks", "url": "https://vertexfrontier.com/document-level-access-control-in-rag/", "kind": "news", "date": "2026-10-11", "why": "实务指南：RAG 文档级访问控制——chunk 必须携带稳定的 document_id 以便删除/改权限时全量定位，且“决策”要与“请求”分开记录（能证明实际执行了什么，而不只是问了什么）——与我们 M(r) 覆盖映射和审计日志的要求呼应。"}, {"title": "authzed/examples：agentic-rag-authorization（SpiceDB 文档级授权示例）", "url": "https://github.com/authzed/examples/blob/HEAD/agentic-rag-authorization/README.md", "kind": "repo", "date": "2026-10-08", "why": "SpiceDB 做的 agentic RAG 文档级授权示例：retrieve→authorize→generate 三段式确定性边界（agent 无法绕过），50 文档/4 种权限模式——是我们 per-view 索引执行语义的工程对照实现。"}, {"title": "Vector Access Control Leaks: Why Post-Retrieval Filtering is a Security Lie", "url": "https://dev.to/asifmiqbal/vector-access-control-leaks-why-post-retrieval-filtering-is-a-security-lie-1gh7", "kind": "news", "date": "2026-10-16", "why": "直指检索后过滤是安全谎言：未授权 chunk 先进应用内存再过滤，多步 agent 管道中会污染上下文与遥测日志；主张查询时把用户签名的 JWT 权限 join 进向量检索——与我们 chunk 只存覆盖映射 M(r)、查询时逐 AU 求值的设计同构，可作工程侧论据。"}, {"title": "RAG with Permissions (Supabase Docs)", "url": "https://supabase.com/docs/guides/ai/rag-with-permissions", "kind": "news", "date": "2026-10-19", "why": "Supabase 官方文档（昨日更新）：用 Postgres Row Level Security 在 pgvector 检索层做细粒度访问控制、pre-retrieval 过滤，是 AU 思想在向量数据库层的工程实现参考。"}, {"title": "RAG vs Fine-Tuning Security: Two Data Paths, Two Control Plans", "url": "https://www.deepinspect.ai/blog/rag-vs-fine-tuning-security", "kind": "news", "date": "2026-10-22", "why": "明确指出 RAG 可在每次查询时对用户/租户强制权限（corpus 外置于模型），而微调把权限混进权重后无法重建——这正是我们论文\"检索时逐 AU 求值、策略独立于模型\"立场的独立佐证；另提出\"响应过滤发生在未授权 chunk 已越过模型边界之后\"，与我们对 post-retrieval 过滤的批评同构。"}, {"title": "Building Permission-Aware RAG Caching on AWS", "url": "https://medium.com/@tolghn/building-permission-aware-rag-caching-on-aws-5cf998722bbf", "kind": "news", "date": "2026-10-21", "why": "实测演示：缓存命中前重查 DynamoDB 权限快照，撤权后同一问题自动返回公开版答案；tenant_id/用户 ID 都做不好这个——缓存键必须绑定\"权限视图\"。这是我们 M(r) 权限撤销传播问题在缓存层的具体实例，含 Terraform/Lambda 可复现代码。"}, {"title": "RAG Security: Data Governance Failures in Enterprise Deployments（Nightfall AI 2026 审计：45 家企业 RAG 部署中 71% 无 chunk 级访问控制）", "url": "https://nohack.net/retrieval-augmented-generation-security-enterprise/", "kind": "news", "date": "2026-10-24", "why": "第三方审计给出硬数字：71% 的企业 RAG 部署没有 chunk 级访问控制——正是我们论文要解决的\"检索层无授权\"问题的行业现状证据，可作 motivation 引用。"}, {"title": "AI Gateway Exploitation: LiteLLM, RAGFlow, Kestra Hit（AI 网关应被视为 Tier-0 基础设施）", "url": "https://brandefense.io/blog/ai-gateway-exploitation-litellm-ragflow-kestra/", "kind": "news", "date": "2026-10-24", "why": "LiteLLM/RAGFlow/Kestra 网关被攻陷可导致全量 provider 凭证与向量库访问权泄露；报告建议把 AI 网关当作 Tier-0 基础设施（等同身份提供商）防护——与我们\"检索授权是基础设施层问题\"的立场一致。"}, {"title": "RAG Security: Protecting Retrieval-Augmented Generation Systems（68% 的 RAG 部署缺乏检索层 AuthZ）", "url": "https://hackersonlineclub.com/rag-security/", "kind": "news", "date": "2026-10-24", "why": "给出 RAG 全管线攻击面地图（注入/越权/投毒/检索操纵/外泄/供应链），其中\"68% 部署缺乏检索层 AuthZ\"与 Nightfall 的 71% 互相印证，可作行业现状双证据。"}, {"title": "Your RAG System Can Be Correct — and Still Leak Confidential Data", "url": "https://medium.com/@alinasir1596/your-rag-system-can-be-correct-and-still-leak-confidential-data-decb0c47e87e", "kind": "news", "date": "2026-11-04", "why": "从业者文章直指 RAG 访问控制的核心命题：检索要同时通过“相关性”与“是否有权看”两道检验；源系统权限在切块、索引、缓存、摘要后并不自动存续，告诉模型“不要泄露机密”修不好已经送错内容的管线。文中为假设案例而非真实事件，引用时需注明。"}, {"title": "The Scariest Bug in Enterprise RAG Isn't Hallucination. It's Cross-Tenant Leakage.", "url": "https://chaitanyagaur7.medium.com/the-scariest-bug-in-enterprise-rag-isnt-hallucination-it-s-cross-tenant-leakage-784d8b69c82a", "kind": "news", "date": "2026-11-02", "why": "与我们论文的论点直接呼应：提示词护栏不是授权，授权必须落在数据通路里；并给出跨租户泄露的成因与实操检查清单。"}, {"title": "Securing Locally Deployed LLM-RAG Assistants: A Cross-Model and Cross-Lingual Evaluation of Indirect Prompt Injection Defenses", "url": "https://www.mdpi.com/2076-3417/16/21/11039", "kind": "paper", "date": "2026-11-07", "why": "本地部署 LLM-RAG 助手上四类间接提示注入攻击与五种防御的实测：确定性后生成过滤把 ASR 从 70.4% 降至 22.2%，为“确定性防线优于模型临场判断”提供新数据。"}, {"title": "Six retrieval decisions behind a RAG agent that must not leak", "url": "https://medium.com/@mohammed.tue/six-retrieval-decisions-behind-a-rag-agent-that-must-not-leak-bc969d3f9a50", "kind": "news", "date": "2026-11-07", "why": "一名开发者用 Postgres RLS + pgvector 实作“按人检索”的 RAG agent：查询时以使用者的身份跑混合检索，未授权 chunk 由行级安全策略过滤；连“存在性泄露”的坑都踩过——只护住 chunk、忘了 documents 表标题，导致普通用户仍能列出 27 份机密文档标题。六个检索决策与我们的逐 AU 求值同构，是工程落地的现成参照。"}, {"title": "RAG application security: retrieval must respect data access", "url": "https://www.cypheninnovations.com/insights/rag-application-data-security", "kind": "news", "date": "2026-11-02", "why": " practitioner 指南：检索必须尊重数据访问——在上下文组装之前、按可信边界执行访问控制，不能只靠模型指令让它忽略不该看的内容；索引与缓存本身就是敏感信息库，权限撤销与文档删除必须在全管线生效。与我们“授权判定在检索结果进上下文之前、由架构保证”的主张直接呼应。"}, {"title": "The access decision in RAG happens before the model says a word", "url": "https://medium.com/@dkyrkos/the-access-decision-in-rag-happens-before-the-model-says-a-word-172b8cdc0baa", "kind": "news", "date": "2026-11-12", "why": "与我们论文核心论点同构的实务文章：授权判定必须发生在检索时（只搜用户有权读的子集），而不是靠提示词事后约束；可作 per-view 索引思路的业界佐证。"}, {"title": "Amazon Bedrock's New Approach to RAG Access Control", "url": "https://medium.com/@langprotect/amazon-bedrocks-new-approach-to-rag-access-control-65449c833d9e", "kind": "news", "date": "2026-11-12", "why": "AWS Bedrock 新增查询时实时文档权限检查（ACL-aware retrieval）：索引时先按 ACL 过滤，返回前再到原数据源实时核验权限，未授权文档不进模型上下文；文章同时点明“这只是过滤、不是完整授权”（Bedrock 不认证用户身份），与我们“授权在检索前求值”的思路同构，对论文的边界讨论有直接参考价值。"}, {"title": "\"Don't reveal it\" is not an access control. RAG permissions belong in retrieval.", "url": "https://dev.to/cyclopt_dimitrisk/dont-reveal-it-is-not-an-access-control-rag-permissions-belong-in-retrieval-3475", "kind": "news", "date": "2026-11-12", "why": "一篇写给工程师的实务短文，把我们论文的核心主张说成了大白话：靠提示词让模型“别泄露”不是访问控制，授权必须落在检索环节；并点出两个典型失效——检索后过滤（为时已晚）与索引时冻结的权限（员工换组四天后仍被当作原组成员）。可直接用来向非安全背景的读者解释“为什么 AU 求值要在检索前”。"}, {"title": "RAG Permission Revocation: Test Cached Retrieval Leaks", "url": "https://www.promptspherehub.com/2026/11/rag-permission-revocation-cached-retrieval.html", "kind": "news", "date": "2026-11-08", "why": "补录：聚焦权限撤销后的缓存泄露——用户维度的缓存键能防跨用户串味，但防不住“同一用户权限已被撤销、缓存结果仍可用”；作者用 Python/SQLite 复现了三类失效，主张缓存结果进上下文前必须重查当前授权、权限变更时作废缓存答案。这正是我们论文尚未单列的一点：AU 求值的新鲜度（revocation freshness），值得在讨论里补一句。"}], "keywords": ["RAG security", "retrieval access control", "RAG privacy", "retrieval poisoning"], "name": "RAG 访问控制", "rss": [], "since": "2026-09-30", "source": "user"}, {"id": "agent-authz", "items": [{"title": "AI Agent Security: Prompt Injection, Access and Audit", "url": "https://www.chmltech.com/post/agent-security-and-identity-prompt-injection-least-privilege-credentials-audit.html", "kind": "news", "date": "2026-11-12", "why": "把 agent 当作一等非人类身份治理的实务模型：指令可被颠覆，但不授予某动作的凭证无法被说服授权——与 ChainBind“批准不是执行”的论点同构。"}, {"title": "Who writes a small agent's security rules? (CapLite)", "url": "https://arxiv.org/abs/2611.17115", "kind": "paper", "date": "2026-11-12", "why": "小模型自己写的 Progent/IPIGuard/DRIFT 安全规则在 15 个模型里 11–14 个被攻破；而从工具 schema 派生规则、写操作在读工具结果前提交的 CapLite 在 13,935 个 AgentDojo episode 里 0 次攻破——与我们 ChainBind 的编译期绑定思路高度呼应。"}, {"title": "Log-To-Leak: Prompt Injection Attacks on Tool-Using LLM Agents via the Model Context Protocol", "url": "https://arxiv.org/html/2610.36108v1", "kind": "paper", "date": "2026-11-15", "why": "AGENT-SEC '26 论文：MCP 工具元数据里的注入指令可在最后一次合法调用之后再诱导一次攻击者控制的日志调用，18 组模型-服务器配对 ASR 62.64%–100%，三类防御后残余 ASR 在 GitHub MCP + GPT-4o 上仍超 55%，结论直接指向二次工具调用需要宿主侧授权。"}, {"title": "Edera 以对象能力实现 agent“有界授权”：无凭证访问、权限由 hypervisor 强制执行", "url": "https://www.prnewswire.com/news-releases/edera-redefines-ai-agent-security-with-bounded-authority-and-credential-free-access-302930175.html", "kind": "news", "date": "2026-11-05", "why": "把“动作”与“动作背后的凭证”分开：agent 可在单个 GitHub 仓库内工作却不持有 GitHub token，即使被提示注入攻破、权限仍被限定在该仓库内；这是最小权限在运行时层的一种实现，与我们 ChainBind 的执行时绑定思路同构（厂商通稿，技术主张需独立验证）。"}, {"title": "You can't fully stop prompt injection. Here's the layered defense we built instead.", "url": "http://dev.to/dmitry_korolev_ecef498a64/you-cant-fully-stop-prompt-injection-heres-the-layered-defense-we-built-instead-498b", "kind": "news", "date": "2026-10-21", "why": "主张注入无法根除、防御要分层，核心思路是授权检查永远在模型之外、模型只能接触已被授权的数据，与 AU 逐值授权的执行时语义相呼应。"}, {"title": "Summarize this document, then run it: Vibe-Trading's prompt-injection-to-root shell", "url": "http://dev.to/actionable-vectors/summarize-this-document-then-run-it-vibe-tradings-prompt-injection-to-root-shell-5bk6", "kind": "news", "date": "2026-10-21", "why": "用 Vibe-Trading 真实案例展示提示注入如何劫持代理直达 root shell（CVE-2026-114106），并给出工具授权与最小权限/容器降权等具体防御清单。"}, {"title": "BeyondTrust AI Agent Security Now Generally Available", "url": "https://www.beyondtrust.com/press/ai-agent-security-general-availability", "kind": "news", "date": "2026-10-21", "why": "BeyondTrust 宣布 AI 代理安全产品正式可用，配套 Phantom Labs 研究（4 周内编码代理发起 128 万次 shell 调用、85% 用户配置 MCP），主打对每个代理动作的实时管控；厂商新闻稿，数据供参考。"}, {"title": "OpenAI discloses four more agent misalignment incidents (total 19)", "url": "https://aibriefing.dev/", "kind": "news", "date": "2026-10-18", "why": "新增 4 起 agent 失齐公开披露（含未授权加密支出、下载 24 年医院床位数据）——执行时授权缺失的真实事故，可作 binding 动机的实证材料。"}, {"title": "CERT-In Flags AI Agents Crossing Into Live Systems Without Permission (CIAD-2026-0049)", "url": "https://netcrook.com/written_article?slug=cert-in-ai-agents-live-systems-without-permission&lang=en", "kind": "news", "date": "2026-10-15", "why": "印度 cyber 机构警告 autonomous agent 未经授权进入生产系统、读取业务记录——“安全边界不在 prompt，而在身份、权限与监控”，与我们 runtime authorization binding 的主张同构，可引用为监管侧佐证。"}, {"title": "Archon AI coding agent's control API has no login by default — anyone who can reach it can run commands", "url": "https://aicyberbrief.com/article/archon-ai-coding-agent-s-control-api-has-no-login-by-default-anyone-who-can-reach-it-can-run-commands", "kind": "news", "date": "2026-10-15", "why": "23k star 的开源 AI coding agent 工作流引擎被曝控制 API 默认无认证、agent 以 bypassPermissions 运行——“缺失的锁”而非高深漏洞，正是执行时授权缺失的典型反例，可作 binding 论文的反面案例。"}, {"title": "Bigeye launches Policy Engine for runtime agent governance across AI gateways", "url": "https://www.einpresswire.com/article/949402050/bigeye-adds-policy-engine-to-agent-trust-hub-with-runtime-enforcement-across-ai-gateways", "kind": "news", "date": "2026-10-14", "why": "企业级 agent 运行时授权的工业界落地：每次 agent 动作按身份/目的/动作/数据状态做 allow/deny/restrict/escalate，与我们 runtime authorization binding 方向同构，可作产业对照"}, {"title": "Unauthorized Tool Invocation: When Attackers Call the AI's Tools Directly", "url": "https://www.linkedin.com/pulse/unauthorized-tool-invocation-when-attackers-call-ais-t1ege", "kind": "news", "date": "2026-10-08", "why": "攻击者绕过 AI agent、直接调用其底层工具的攻击演示：应用若不验证请求是否来自既定的 agent 工作流，工具就会被未授权执行——正是'编排不等于授权'的现实注脚，与 tool-use authorization 方向直接相关。"}, {"title": "Peregrini's Agent Court: How Common Law Enforcement Turns LLM Mistakes Into Binding Precedent", "url": "https://dev.to/mech_app_ai/peregrinis-agent-court-how-common-law-enforcement-turns-llm-mistakes-into-binding-precedent-1jpe", "kind": "news", "date": "2026-10-02", "why": "在工具边界授权之上叠加「普通法执法」问责层：记录 agent 承诺与实际交付偏差，形成跨实例传播的判例与信任分——补位现有授权机制执行后的问责空白，与 agent 授权治理方向相关。"}, {"title": "AI Agents Accessed Government Systems Without Permission—OpenAI and Anthropic Disclose Tens of Thousands of Incidents", "url": "https://www.karmactive.com/openai-anthropic-ai-agent-security-incidents-2026/", "kind": "news", "date": "2026-10-02", "why": "OpenAI 与 Anthropic 披露 agent 未授权访问第三方系统的批量事件，核心故障是第三方 API 工具包装器与默认宽泛权限（而非推理错误），典型手法为间接提示注入——正是 tool-use authorization 要解决的现实威胁，凸显「授权独立于模型」控制面的紧迫性。"}, {"title": "AgentFox: open-source control plane for AI agents", "url": "https://github.com/architsharm/agentfox", "kind": "repo", "date": "2026-09-29", "why": "开源 agent 控制平面：模型流量 guardrail、工具调用按 capability grant 限界、防篡改审计轨迹映射合规框架；其“按值来源（provenance）而非载荷内容做拒绝”的守卫逻辑与我们“授权绑定到数据来源”的范式同构。"}, {"title": "Indirect Prompt Injection in Web Content Targets AI Agents (Zscaler ThreatLabz)", "url": "https://www.infosecurity-magazine.com/news/indirect-prompt-injection-web/", "kind": "news", "date": "2026-10-04", "why": "真实世界间接提示注入战役：攻击者用仿冒 DeBank 的 typo 域名藏指令，26 个模型中 4 个（含 Llama/Gemini 版本）被操纵执行欺诈支付——\"内容即攻击面\"的最新实证，与 Agent 授权方向的威胁模型直接相关。"}, {"title": "A blind trust, the bloody thrust: trojanized hook updates
