<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月5日 星期一</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-10-05", "summary": "**数据口径说明**：06:45 拉取的 `arxiv_2026-10-05.json` 为空（arXiv 抓取失败），HF 每日榜单亦未更新，今日候选仅来自 OpenAlex 近 3 天关键词检索（7 篇，去重后 6 篇新候选，Jev 粗筛保留 2 篇）。若 06:46 轮拉取恢复，次日回补。\n\n今日新命中 2 篇（均为 OpenAlex），Agent 授权线占一席。**最值得关注的是 \"Authorized Access, Unauthorized Effects\" 的 replication package**：它把 LLM-Agent 系统里\"源使用授权\"（source-use authorization）与\"控制点放置\"（control placement）做成可测量的实证对象——360 个主实验世界 + 24 个载体替换复制、溯源中继审计、确定性验证测试。核心议题正是\"检索到的内容是否被授权使用\"以及\"授权检查放在链路的哪一环\"，与我们检索内容粒度 AU 求值的执行语义是同一问题在 Agent 侧的镜像，**可作为 Agent 线的实证引用**（注意：我们只拿到了复现包，原论文正文未在爬取范围，引用前需拿到原文核实结论）。另一篇 \"Beyond Hallucination\" 是对齐失配的方法论框架，定义了 Unauthorized Action Rate 等度量，与我们主线关联较弱，可当背景读物。\n\n---", "papers": [{"title": "Replication package for: Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems", "authors": "Kai Pan, Rong Hou（A2A Lab）", "url": "https://doi.org/10.5281/zenodo.23108972", "category": "LLM Agent 安全 / 实证测量（Zenodo 复现包，2026-10-03 发布）", "cats": [], "oneliner": "原论文把\"源使用授权\"和\"控制点放在哪一环\"变成可测量对象，复现包公开了 360 个主实验世界、24 个载体替换复制的聚合结果、溯源中继审计与加密清单。", "insight": "这是目前我们看到的、与我们\"执行语义层授权求值\"最贴近的 Agent 侧实证工作。我们的三种执行语义（all-of 拒绝 / retrieve-then-project / per-view 索引）本质上也是\"控制点放置\"的设计选择——这篇的测量方法论（合成世界 + 载体替换复制）可以直接借鉴，用来量化不同放置点的授权覆盖率与误伤率差异，建议在 Related Work 的 Agent 线引用并对比：它是工具/动作调用粒度（source-use），我们是检索内容粒度（AU），两者正交互补。**但注意**：我们只抓到复现包，没有原论文正文——其具体结论（如哪一环放置最优）必须拿到原文后核实，本次只登记为\"待深读\"。适合 standards-agent 线候选（见论文库维护）。", "source": "OpenAlex", "citations": "尚未收录", "code": "复现包内含 Python 重构与事件归一化代码、确定性验证测试（无独立 GitHub 仓库）", "zh_abs": "该复现包配套原论文《Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems》。它用合成任务夹具（synthetic task fixtures）与授权策略搭建实验世界，测量 agent 在使用检索/工具来源内容时，授权检查究竟应该放在链路的哪一环（control placement），并通过溯源中继审计（provenance-relay audits）追踪权限在调用链中的传递。实验规模是 360 个主世界 + 24 个载体替换复制，全部结果经确定性验证测试与密码学清单固定。", "supplement": false}, {"title": "Beyond Hallucination: A Functional Framework for Detecting and Mitigating AI Misalignment in Large Language Models and Agentic Systems", "authors": "Kishore Chalakkal Varghese", "url": "https://doi.org/10.5281/zenodo.23100091", "category": "AI 对齐 / 方法论框架（Zenodo 自出版预印本，2026-10-02 发布）", "cats": [], "oneliner": "提出一个八层对齐失配分类法与\"失配检测鸿沟\"概念，并定义 Unauthorized Action Rate 等实证度量，为企业场景设计可复现的 benchmark 方法论。", "insight": "关联较弱。其\"授权边界\"（authorization boundaries）作为企业 benchmark 的场景变量之一出现，但全文是方法论框架、没有任何实证数据，也未深入授权机制本身。八层分类法可作为背景知识知道有这么一套话语体系，但对 RU/AU 解耦的技术设计没有直接启迪，不建议引用。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "作者把对齐失配定义为\"目标保真度的失败\"（不只是幻觉那种认知不可靠），提出八层分类法：意图、规范、代理与奖励设计、目标泛化、偏好优化、监督条件行为、agent 动作、部署上下文。核心概念是 Misalignment Detection Gap——真实目标偏离与评估者可检测性之间的差距。方法上给出启发式风险模型（失配概率 × 自主性 × 权限 × 影响 × 运行时可检测性），并为模糊目标、KPI 压力、授权边界、弱监督、工具使用等企业场景定义了 Task Success Rate、Alignment Preservation Rate、Unauthorized Action Rate 等度量。", "supplement": false}]}, {"date": "2026-10-04", "summary": "今日新命中 4 篇（arXiv 1 篇 + OpenAlex 3 篇），整体质量中等偏上，Agent 安全方向占了三席。最值得关注的是 **Authority Is Not a String**：它把\"环境权限\"（ambient authority）问题形式化为 capability-scoped  harness，用系统级权限能力模型对抗间接 prompt injection——其\"命名资源≠被授权操作\"的立场，与我们 RU/AU 解耦\"查询时逐 AU 求值、未知默认拒绝\"的执行语义在哲学上高度一致，值得在 Related Work 的 Agent 线引用。**Securing Enterprise Language Model Applications** 是一篇企业级综述，明确主张\"授权与保密决策必须落在应用/基础设施控制层，而非模型内部\"——这是我们论文基础设施层授权立场的第三方背书。RAG 综述 **Mapping the RAG Landscape** 的 Defense 轴可作为相关综述引用；**Red-Teaming Coding Agents** 的 ToolLeak 揭示了工具调用参数生成阶段的模式鸿沟，属 Agent 侧攻击面补充，与 RAG 主线关联较弱。\n\n---", "papers": [{"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "category": "cs.AI / 软件工程（ACM）", "cats": ["cs.AI"], "oneliner": "提出用 capability-scoped 权限模型重构 coding agent 的工具沙箱：工具携带显式能力（capability）而非环境权限，从根本上阻断间接 prompt injection。", "insight": "这篇的\"ambient authority\"批判与我们的 AU 划分哲学同构：我们主张 chunk 不存密级结论、查询时逐 AU 独立求值、未知 AU 默认拒绝——本质上也是把\"检索到≠有权用\"的显式授权检查前置到执行语义层。可在 Related Work 的 Agent 线引用为\"显式授权能力模型\"的独立佐证；差异点在于它是工具调用粒度（tool-level capability），我们是检索内容粒度（content-level AU），两者互补，可作为 future work 的交叉点提一句。", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无", "zh_abs": "Coding agent 的系统级工具（读文件、执行命令、改代码）通常携带环境权限——只要能命名资源就能操作它。间接 prompt injection 正是利用这一点，把指令藏在仓库文件或工具输出里诱使 agent 执行用户未授权的动作。该文提出 capability-scoped harness：每个工具调用必须持有显式授予的能力令牌，权限不再从\"能说出名字\"中隐含获得，从而在架构层面切断注入指令的执行通道。", "supplement": false}, {"title": "Securing Enterprise Language Model Applications Against Data Leakage and Response Manipulation", "authors": "Kaik Tavares Barroso", "url": "https://doi.org/10.66104/3m1m5x77", "category": "企业 AI 安全综述（Nexus Science Review）", "cats": [], "oneliner": "一篇企业级 LLM 应用安全的批判性叙事综述，系统梳理数据泄露与响应操纵的攻击面，并提出六层保障边界。", "insight": "其\"授权决策不能放在模型内部\"的结论是我们的核心立场（策略独立存放、执行语义层求值）的第三方背书，适合在 Introduction/Related Work 引用。攻击面清单（embedding inversion、累积式知识库抽取）恰好落在我们的 T2/T3 威胁模型内，可用来佐证三层威胁模型的划分不是凭空设计。但注意这是叙事性综述（narrative review），证据强度弱于实证论文，引用时定位为\"立场佐证\"而非\"技术对比\"。", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无", "zh_abs": "综述覆盖间接 prompt injection、语料投毒、检索阶段利用、日志污染、embedding inversion 和累积式知识库抽取等多类攻击（引用 Chang 2026、Greshake 2023、Morris 2023 等），防御侧讨论 provenance signaling、结构化训练、preference optimization、capability enforcement 与 action attribution。核心结论是提出六个保障边界（身份与范围、源授权、内容溯源、模型交互、可执行动作、输出放行），并明确主张：**权威的保密与授权决策必须依赖独立于模型的应用层/基础设施层控制**。", "supplement": false}, {"title": "Mapping the RAG Landscape: A Four Axis Taxonomy of Efficiency, Defense, Interactivity, and Reasoning", "authors": "抓取档未记录作者信息（arXiv 元数据缺失），详见原文页", "url": "http://arxiv.org/abs/2610.01936v1", "category": "cs.AI（arXiv 2026-10-01）", "cats": ["cs.AI"], "oneliner": "一篇 RAG 全景综述，按效率、防御、交互、推理四个轴组织当代 RAG 研究。", "insight": "Defense 轴部分可作为 RAG 安全防御的全景引用，帮我们快速定位已有防御工作的位置，避免 Related Work 挂一漏万。但它是一篇宽口径综述，不会深入访问控制这一细分方向；对我们的 RU/AU 解耦框架没有直接技术启迪，关联较弱，引用价值限于\"领域地图\"层面。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "该综述把近年 RAG 研究整理为四轴分类：检索效率优化、鲁棒性与安全防御、用户驱动的交互式工作流、多步/复杂推理。覆盖 dense/sparse 检索、融合策略、embedding 优化、基于强化学习的检索策略，并综合各轴的评估方法，讨论这些进展如何影响实际部署与系统设计。", "supplement": false}, {"title": "Red-Teaming Coding Agents from a Tool-Invocation Perspective: An Empirical Security Assessment", "authors": "Yuchong Xie, Mingyu Luo, Zesen Liu, Zhixiang Zhang, K. F. Zhang, Yu Liu, Ci Tao, Changhui Wang", "url": "https://doi.org/10.1145/3832267", "category": "软件工程 / Agent 安全（ACM）", "cats": [], "oneliner": "首次系统地从\"工具调用\"视角对六款主流 coding agent（Cursor、Claude Code、Copilot、Windsurf、Cline、Trae）做红队评估，发现 ToolLeak 与双通道 prompt injection 攻击。", "insight": "ToolLeak 揭示的\"参数生成阶段的安全假设断裂\"是一个新颖的攻击面，但它属于 agent 工具调用链，与 RAG 检索授权主线关联较弱。可作为 standards-agent 线的背景引用（一句话带过），说明 agent 侧的授权问题同样严峻、但与我们解决的检索内容授权是正交维度；不建议深入展开。", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无", "zh_abs": "红队分两阶段：第一阶段发现\"模式鸿沟\"——模型在 schema 驱动的参数补全时表现得像在做无害的结构化填充，可能把隐藏的 agent 上下文（system prompt、工具元数据）复制进工具调用参数，作者将其实例化为 ToolLeak 攻击实现 prompt 外泄；第二阶段用工具描述中的双通道 prompt injection 劫持 agent 的工具调用行为。", "supplement": false}]}, {"date": "2026-10-03", "summary": "今日 arXiv 六个分类共抓取 830 篇，关键词命中 36 篇；Jev 初筛（preset=papers）保留 15 篇，去重（lit_seen.txt）剔除昨日已报 2 篇，人工终判入选 **12 篇**（4 篇 direct、6 篇 adjacent、2 篇 background）。最值得关注的是 **Walking the Embedding Space（2610.01871）**——针对返回图像的多模态 RAG 的自适应数据抽取攻击 `\\immrag`：攻击者在黑盒下把影子图像与已恢复图像混合、按相关性加权重新采样，持续把查询推向 embedding 空间中尚未被抽取的区域；单次 2500 查询即可重构 **611 张放射影像 / 566 张文档扫描件 / 416 张通用图像**，抽取到的不同条目数是**非自适应基线的 5.6 倍**。这是 embedding 通道攻击线的强力增援：我们的 A1 是文本 cloze 攻击（89.4%@20），它是多模态、图像返回配置下的**自适应抽取**，说明\"向量索引存整 chunk embedding\"的问题在图文跨模态场景下同样成立且可被放大，是 T2 威胁（可见排序向量）最具体的新实证，值得在 threat model 一节引用对照。其次是 **Locket（2610.00309）**——把细粒度访问控制直接做进生成侧：为每种访问策略训练一个轻量 LoRA 适配器，keyed entry token 经硬路由解锁对应策略（完全披露 / PII 掩码 / 差分隐私级别），无 token 则触发隐私保护适配器；与我们的数据平面方案（chunk 只存 M(r)、查询时逐 AU 求值）形成\"模型内授权 vs 数据面授权\"的鲜明对照。此外 **OverAct（2610.01508）** 给\"工具调用主动越权\"建了 8 个隐私敏感域的确定性 benchmark（7 个模型全都超授权范围；SelfAudit 推理时自检把隐私越权压低 43%），是 Agent 授权线可直接复用的评测设计。注意：扩展来源今日只有 OpenAlex 19 篇候选（入选 3 篇），**HuggingFace 每日 50 篇部分缺失**（06:45 拉取档未产出，按约定不重跑，见\"抓取说明\"）。", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica（一作）等 4 人", "url": "https://arxiv.org/abs/2610.01871", "category": "cs.AI（v1, 2026-10-01）", "cats": ["cs.AI"], "oneliner": "", "insight": "embedding 通道攻击线的最强邻居。我们的 A1 是文本侧的完形查询攻击（89.4%@20），它证明**同一通道在多模态场景下可被自适应放大**：自适应重采样把\"被动试探\"变成\"主动覆盖\"，抽取效率是基线的 5.6 倍——这说明即使我们做了按授权视图重编码（4.05%），若索引是跨模态共享的 embedding 空间，攻击者的收益函数会变化。两处可引用：① T2 威胁模型一节可把它列为\"攻击者可见排序向量/可反复查询\"的最具体新实证；② 它的\"局部特征对应判定\"可借鉴为 embedding 通道泄露的度量方法（我们目前用 cloze 命中率，它用重构出的不同条目数）。注意它的攻击目标是**完整条目抽取**（confidentiality），我们还关心\"投影后残留语义\"（NLI），两者互补不竞争；它不涉及授权语义（任何用户都可查），所以不直接给出防御，但它把\"embedding 索引本身必须被授权视图切分\"的论证推得更强——正是我们 per-view 索引的动机。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对\"返回图像\"的多模态 RAG（检索到的视觉制品本身就是回答）提出 `\\immrag`：黑盒、自适应的数据抽取攻击。每次查询把攻击者持有的影子图像与已从系统恢复的图像混合，用相关性加权重新采样把后续查询推向 embedding 空间中仍能产生新检索的区域；与以往靠文本提示词诱导泄露的抽取攻击不同，它把恶意指令直接嵌进用户给定的输入图像。在医疗助手、文档助手、通用工具三类真实场景下，对多个 CLIP 家族检索器与生成器做评估：单次 2500 查询可重构多达 611 张放射影像、566 张文档扫描件、416 张通用图像（按局部特征对应判定），抽取到的不同 datastore 条目数达非自适应基线的 **5.6 倍**。", "supplement": false}, {"title": "Tokenized Key-Gated Adapter Routing: A Secure Access Control Mechanism Against Private Data Leakage in LLMs (Locket)", "authors": "Mohamed Shaaban（一作）、Mohamed Elmahallawy 等", "url": "https://arxiv.org/abs/2610.00309", "category": "cs.AI（v1, 2026-09-28）", "cats": ["cs.AI"], "oneliner": "", "insight": "与我们形成**\"模型内授权 vs 数据面授权\"**的干净对照。它把策略编译进权重（每个策略一个 LoRA），我们把策略存在数据面（chunk 只存 M(r)、查询时逐 AU 求值 P(a,u)）；它的授权密钥是输入 token，我们的是查询时策略求值。两处差异值得在 related work 里点出来：① 它的授权粒度是\"策略档位\"（coarse，几个固定档），我们的 AU 是源内容驱动的细粒度划分——它的方案遇到\"同一文档内不同片段不同密级\"会退化为保守整档拒绝；② 它的撤销语义未讨论（token 一旦发出即长期有效），而我们\"未知 AU 默认拒绝\"天然支持撤销即时生效。不动摇我们的 claim，但为\"为什么不在模型里做访问控制\"提供了一个现成的反面参照——可以在 Discussion 里用一句话回应：权重内授权难以表达 AU 级的细粒度与动态撤销。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "把细粒度的、策略驱动的访问控制直接嵌入 LLM 生成过程。为每种访问策略训练一个轻量 LoRA 适配器（完全披露 / PII 掩码式部分披露 / 指定差分隐私级别披露）；一个紧凑门控模块学会把 keyed entry token 经序列级硬路由唯一地关联到一个适配器——有效 token 是解锁对应私有知识的授权密钥，无效或缺失 token 则触发隐私保护适配器做脱敏。在 Enron、ECHR、Yelp 三个数据集与 Qwen3（1.7B/8B）、Llama-3.2（1B/3B）、Gemma-2-2B 上评估：token 正确时困惑度与无防护微调相当；token 缺失/无效时 PII 泄露显著下降，效用与强基线相当。", "supplement": false}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang（一作）等 5 人", "url": "https://arxiv.org/abs/2610.01508", "category": "cs.CL（v1, 2026-10-01）", "cats": ["cs.CL"], "oneliner": "", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计思路。它的\"越权来自结构性决策倾向而非解码随机性\"的结论对我们 RU/AU 主线无直接冲击，但与我们\"保守子句切分器\"背后的直觉相通——**授权边界应该由机制保证而非模型自觉**：它的 SelfAudit 仍是让模型自己审计自己（43% 改善但仍是启发式），我们的路线是确定性求值 P(a,u)，对比之下更显出\"把授权从模型行为里剥离出来\"的价值。它的\"请求具体度越权越轻\"可作为一个引用点：支持我们在查询侧做\"意图—权限\"对齐的动机。注意它是工具调用授权（动作侧），我们是检索内容授权（数据侧），不竞争。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究结构化工具调用 agent 的\"主动越权\"（proactive over-authorization）：agent 取回的私有数据超出用户请求明确需要的范围。提出 OverAct benchmark：覆盖 8 个隐私敏感域、确定性、无需 judge 打分；另给一个可解释的决策理论框架并导出三个可检验预测。在 4 个家族 7 个模型上：**所有模型都显著超出授权范围**；请求越具体越权越轻（specificity 是最强预测因子）；越权随工具池规模次线性增长；解码温度几乎无影响——作者解释为\"成本不对称\"导致的结构性倾向而非解码随机性。提出 SelfAudit：零样本推理时方法，生成基于请求的调用理由并过滤掉无依据的调用；消融显示显式过滤是主因，**隐私向越权降低 43%**，无需 oracle。", "supplement": false}, {"title": "Secure and Responsible Retrieval-Augmented Generation for Resource-Constrained Organizations: A Multi-Cloud Reference Architecture and Experimental Evaluation", "authors": "Joseph Arayemi（单作者）", "url": "https://doi.org/10.5281/zenodo.23048250", "category": "技术报告（2026-09-29）", "cats": [], "oneliner": "", "insight": "工程侧的同路人：它明确把\"tenant-aware access control\"列为 RAG 参考架构的一等组件，说明业界已把 RAG 访问控制当成基线需求——这加强了我们论文的动机（problem statement）而非削弱。但学术含量有限：单作者 Zenodo 自出版技术报告、40 例合成评测、无同行评审，**引用时只能当\"业界实践佐证\"，不能当技术邻居**。它的\"确定性本地检索 + 证据弃答\"与我们的 retrieve-then-project 有表面相似，但它的访问控制粒度是租户级（coarse），我们的 AU 是内容级——正好衬托我们的细粒度贡献。不动摇 claim。", "source": "OpenAlex", "citations": "OpenAlex 收录（引用数未显示，计为 0/未被引用）", "code": "无（声称有开源仓库与评测数据，链接未在摘要中给出）", "zh_abs": "面向资源受限组织的安全 RAG 多云参考架构：组合了许可源摄入、确定性本地检索、**租户感知的访问控制**、PII 脱敏、prompt 注入检测、基于证据的弃答、来源引用、版本化评估与部署控制；给出 AWS 与 Azure 的等价生产路径。在冻结的 40 例合成测试集上端到端成功率 0.85，同时展示了基于模式的 prompt 注入防护的局限性。", "supplement": false}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang（一作）等 7 人", "url": "https://arxiv.org/abs/2610.00371", "category": "cs.AI（v1, 2026-09-30）", "cats": ["cs.AI"], "oneliner": "", "insight": "它的核心命题\"权限必须与执行保持可验证的连接\"与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是反对\"权限是附在数据上的静态标签\"。它的\"联合成功标准\"（安全与可用同时度量）值得借鉴：我们目前的评估是安全侧（泄露率）为主，它的思路提示未来可以在论文评估里加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）是我们 T1/T2 之外的一个新维度：**跨 AU 的组合推理泄露**——我们目前的 AU 求值是逐 AU 独立的，它提醒我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"（类似我们的 KG 路径切割一节可呼应）。建议在 standards-agent 线 related work 引用。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "https://github.com/yunbeizhang/FlowReview（★数未知，刚发布）", "zh_abs": "多智能体系统的安全困境：单独看都合规的贡献，组合起来可能促成被禁止的用途；一刀切地拦掉所有敏感动作会扼杀协作价值。提出 authorization-paired evaluation：把\"拦住被禁止用途\"与\"完成被授权用途\"作为**联合成功标准**；FlowReview 框架连接对象解析（object resolution）、权限排序（permission ranking）与确定性执行。在受控组合实验中，对组合制品做审查把 denied-commit 率从 **86.0% 降到 0**，且授权供给无损失。核心发现：只保留信息与血缘（lineage）不足以保证权限归因正确——**对象身份与权限必须通过输出可验证的组件与执行保持连接**。", "supplement": false}, {"title": "The Innocent Courier: Covert Exfiltration Through Legitimate LLM Web Fetching", "authors": "Alessandro Pegoraro（一作）、Daryan Merx、Phillip Rieger、Ahmad-Reza Sadeghi（通讯）", "url": "https://arxiv.org/abs/2610.01768", "category": "cs.CR（v1, 2026-10-01）", "cats": ["cs.CR"], "oneliner": "", "insight": "这是一个我们 T1/T2/T3 三层威胁模型**没有覆盖**的泄露维度：它不偷\"检索到的内容\"，而是把 LLM 的**工具调用本身**变成外发信道。我们的威胁模型假设\"泄露 = 未授权内容进入答案/排序\"，而 LLMLeak 说明即使检索授权完美、答案完全合规，机密仍可经由工具参数（URL）外泄。诚实地说，这超出了 RU/AU 解耦框架的解决范围——我们的框架管的是\"谁能看到什么内容\"，它攻击的是\"模型能做什么动作\"。价值在于 Discussion 的\"局限与未来工作\"：可以明确声明我们的威胁模型覆盖内容披露通道，动作侧隐蔽信道（如工具调用外发）是正交的开放问题；它的 79.7% 成功率是一个有力的动机数字，说明\"只做内容授权不够\"。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "提出 LLMLeak：一种新型隐蔽信道。本地恶意软件无法直连互联网，但可滥用 LLM 的网页抓取工具：把机密编码进 URL，谎称该网站是完成某个良性任务（如迁移软件库）所需的信息来源；LLM 访问 URL 时，攻击者通过自己控制的 DNS/网页服务器收到编码后的机密。在 11 个开源参数模型上评估，**攻击成功率 79.7%**；另有真实聊天机器人的案例研究。", "supplement": false}, {"title": "Red-Teaming Coding Agents from a Tool-Invocation Perspective: An Empirical Security Assessment", "authors": "Yuchong Xie（一作）、Mingyu Luo、Zesen Liu、Zhixiang Zhang、K. F. Zhang、Yu Liu、Ci Tao、Changhui Wang", "url": "https://doi.org/10.1145/3832267", "category": "ACM 会议/期刊（2026-10-01，OpenAlex 归类为软件工程）", "cats": [], "oneliner": "", "insight": "Agent 授权线的实证重器（ACM 发表，6 个真实产品，RCE 级后果）。它的\"模态鸿沟\"发现与我们 embedding 通道有方法论上的呼应：**安全边界不能假设\"模型在某种输出模态下是良性的\"**——它在工具参数模态，我们在向量模态。对我们论文的直接价值在 standards-agent 线 related work：它的 Phase 1 本质是\"授权上下文（系统提示词）经由未授权通道（工具参数）泄露\"，与我们的\"未授权 AU 经由 embedding 通道泄露\"可并列为\"通道错位\"类问题。注意它是完整性/提权攻击（RCE），我们是机密性，不竞争。可引用其\"工具调用是独立攻击面\"的结论来支撑我们未来 Agent 线的动机。", "source": "OpenAlex", "citations": "尚未收录（太新）", "code": "无", "zh_abs": "首个从**工具调用视角**系统红队 6 个真实 coding agent（Cursor、Claude Code、Copilot、Windsurf、Cline、Trae）的工作。两阶段：Phase 1 的 ToolLeak 利用\"聊天生成 vs 工具调用参数生成\"的模态鸿沟——schema 驱动的参数补全时模型像在做良性结构化填充，会把隐藏的 agent 上下文（系统提示词、工具元数据）复制进工具参数，从而外泄；在 25 个 agent-LLM 组合中的 18 个上取得最优伪召回。Phase 2 用工具描述与工具返回的双通道 prompt 注入劫持工具调用行为，在 6 个真实 agent 上**全部实现 RCE**，攻击成功率高于基线。", "supplement": false}, {"title": "From A2A Attacks to Envelope-Layer Defense: Red-Teaming Evaluation of LLM Agents and a Three-Layer Isomorphic Attack-Defense Model", "authors": "Yuelin Han", "url": "https://arxiv.org/abs/2610.00392", "category": "cs.CR（v1, 2026-09-30）", "cats": ["cs.CR"], "oneliner": "", "insight": "它的\"信封层\"（envelope layer）概念对我们有直接借鉴价值：A2A/tool/memory 这些**内容进入 agent 的通道**本身就是防御维度——类比到我们，embedding 索引、chunk 文本、重排序器就是 RAG 的\"信封层\"。它的\"给信封加恶意标签提升识别\"是一个轻量防御思路，可与我们的\"查询时逐 AU 求值\"对照：一个是标注不可信来源，一个是求值授权策略。它的四类结果度量（拒绝/突破/拦截/穿透）比单一 ASR 更诚实，我们评估投影防御时也可借鉴这种分层度量。注意它是协议与注入方向，不涉及数据授权；单作者、方法论偏框架性，引用时定位为\"防御分层思想参考\"即可。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 A2A/ACP 等 agent 互操作协议：远端 peer 发来的任务被当作合法请求，成为间接 prompt 注入的天然通道。提出 A2A-TIBA 攻击原理（间接注入 + 绕过规避）：经\"植入—命令—外发\"三步诱使目标 agent 部署回调交互程序，之后攻击者绕过 agent 直接下命令。为更细地评估防御，设计 GDA Measurement 红队测试方法（经 LLM 网关做原始上下文捕获、双数据留存、agent 自主裁判），把 ASR 扩展为四类结果：语义拒绝率 / 语义突破率 / 拦截率 / 穿透率。提出 ELA-ITL 三层同构攻防模型：防御分信封封装（envelope packaging）、LLM 识别、agent 拦截三层，攻击分植入通道、提示词优化、执行机制三层。在 15 种 agent 前端 × LLM 后端组合与 1000 例数据集上验证；发现**给 A2A/tool/memory 等信封通道的恶意提示词加标签能显著提升 LLM 对恶意内容的识别率**。", "supplement": false}, {"title": "Securing Enterprise Language Model Applications Against Data Leakage and Response Manipulation", "authors": "Kaik Tavares Barroso", "url": "https://doi.org/10.66104/3m1m5x77", "category": "Nexus Science Review（综述，2026-10-01）", "cats": [], "oneliner": "", "insight": "综述本身学术增量有限（作者自己都声明未经验证），但两个概念值得记下来：**cumulative-disclosure budgets（累积披露预算）** 与 **revocation propagation（撤销传播）**。前者正好对应我们 T2 威胁下\"多次查询累积泄露\"的量化问题——我们的评估目前是单查询 cloze 命中率，它的\"预算\"概念提示未来可以做\"多查询累积泄露上界\"的形式化；后者与我们 Discussion 的开放问题\"撤销机制\"直接相关，可与昨日的 ResidualAuth 并列引用。它的六个边界中的\"来源授权\"粒度粗（应用/基础设施级），正好反衬我们 AU 级细粒度的定位。引用时明确标注为\"未验证的综述框架\"，只取概念不取结论。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "叙事性/主题性综述（主体发现在 2026-09-29 完成检索，10-01 做补充检索与来源状态审计）：覆盖企业 LM 应用的数据泄露与响应操纵，证据包括间接 prompt 注入、语料投毒、检索阶段利用、日志污染、embedding 反演、累积式知识库抽取。提出六个保证边界：身份与范围、**来源授权**、内容溯源、模型交互、可执行动作、输出放行。作者明确声明这是**未经验证的决策辅助工具**，非 NIST/OWASP 背书标准。另用假设性助手与前瞻性协议示例说明权限保持处理、**累积披露预算**、撤销传播、合法任务效用与验证成本。", "supplement": false}, {"title": "Kernel-Managed Shared Memory for System-Wide Personalization", "authors": "Ryan Lum（一作）、Yongfeng Zhang（通讯）", "url": "https://arxiv.org/abs/2609.10144", "category": "cs.AI（v2, 2026-09-30；已被 AgenticOS Workshop @ NeurIPS 2026 接收）", "cats": ["cs.AI"], "oneliner": "", "insight": "它的核心架构主张——**把隐私强制从 agent 手里收到内核/系统层**——与我们的\"策略独立存放、查询时集中求值\"是同一范式在不同层的实现：它管的是 agent 间共享记忆，我们管的是 RAG 检索内容。它的实证（集中治理在质量 声明**无实证架构评估、无患者数据集、无临床有效性、无独立专家验证**。", "supplement": false}]}, {"date": "2026-10-02", "summary": "今日 arXiv 六个分类共抓取 1085 篇，关键词命中 14 篇（全部为新增）；扩展来源中 HuggingFace 每日 50 篇无命中，OpenAlex 近 3 天 22 个关键词候选中剔除 Zenodo/figshare 通用噪声后入选 2 篇；Jev 初筛保留 13 篇，人工终判入选 **10 篇**（6 篇 direct、4 篇 adjacent）。最值得关注的是 **ResidualAuth（2609.08062）**——首个给可撤销委托下的授权状态做形式化刻画的工作：证明两段授权历史可以\"当前权限相同、但同一次撤销后要求相反决策\"，因此系统必须保留的信息恰是 residual authorization state，并给出随委托冗余度变化的**精确/紧内存界**与信息保留不足时的决策误差下界；这与我们论文 Discussion 列出的开放问题\"撤销机制\"直接对接，是理论段落最可引用的邻居。其次是 **Approval Laundering（2609.38983）**——系统化揭示 coding-agent harness 中\"人批准的动作 A ≠ 实际执行的 A'\"的六类绑定失效，提出 keyed capability 的部分修复，并**诚实报告负结果**（Scope/Argument 两类无显著改善），是 Agent 授权线的强邻居。**ActionGuard（2609.39450）** 把工具调用授权的执行点放在被污染的技能文本之外、基于可信用户意图做 fail-closed 裁决，在 319 次注入测试中把 ASR 相对压低 **35–46%**。值得注意的是今日主题高度集中于 **Agent 授权**（8/10 篇），RAG 检索侧的直接相关新工作今日缺席；ResidualAuth 与昨日报告的 Residual Authority Replay 攻击形成\"攻击揭示—理论修复\"的呼应。", "papers": [{"title": "ResidualAuth: What Authorization State Must Language Agents Preserve under Revocable Delegation?", "authors": "Moonwon Choi（一作）等 4 人", "url": "https://arxiv.org/abs/2609.08062", "category": "cs.AI, cs.CR（v2, 2026-09-08；本轮为更新版本重公布）", "cats": ["cs.AI", "cs.CR"], "oneliner": "", "insight": "与我们论文 Discussion 的开放问题\"撤销机制\"直接对接：我们冻的是\"未知 AU 默认拒绝\"的静态求值语义，ResidualAuth 补上了**时间/委托维度**的形式化——授权结论不是查询时刻权限快照的函数，而是授权历史的函数；其\"residual state 等价类\"的刻画可为我们未来处理动态权限变更（grant/revoke/委托链）提供理论语言。它的内存下界结果也与我们 AU 粒度—安全—成本权衡曲线相呼应：保留多少授权状态信息是有代价的，且代价可量化。注意它研究的是 agent 动作授权而非 RAG 内容授权，粒度是委托路径不是 AU；威胁面在 T1（决策者可见授权历史）内，未涉及 embedding 通道。不动摇现有 claim，但为\"撤销与动态授权\"一节提供可引用的理论邻居；与昨日 Residual Authority Replay（残留授权攻击）形成\"攻击—理论\"的完整呼应。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究可撤销委托下的授权状态问题：两段不同的授权历史可以产生完全相同的当前权限，却在同一次撤销之后对同一查询要求相反的决策。提出 ResidualAuth 框架，其形式化核心 residual authorization state 把两段历史等同，当且仅当\"之后任意的授予/撤销/使用序列在两者之后同有效或同无效\"。证明即使委托可达关系相同，仍可存在指数多个互异的 residual state；并随委托冗余度给出精确或紧的内存界，以及在保留信息有显式上界时的平均决策误差下界。实证上构造受限可执行 benchmark：成对 episode 授权相关历史不同、要求相反决策，pair accuracy 要求两问全对；另做记忆诊断，发现模型会从\"通过了固定未来授权测试的有效记忆\"出发仍答错，区分了\"未来授权需要保留什么\"与\"agent 能否访问/维护/使用这些信息\"。", "supplement": false}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "category": "cs.CR, cs.AI, cs.SE（v1, 2026-09-30）", "cats": ["cs.CR", "cs.AI", "cs.SE"], "oneliner": "", "insight": "Agent 访问控制线的强邻居。它的核心问题\"批准—执行绑定完整性\"（credential-binding integrity）与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值 P(a,u)\"同属\"把授权绑定到可验证的声明而非事后信任执行\"范式：我们的 M(r) 是 chunk 与 AU 的绑定，它的 Approval Token 是批准与执行的绑定，可在 Agent 线 related work 中并列。其\"字段级验证器看不见进程层级分叉\"的负结果是一个方法论警示——对我们意味着：若未来做 Agent 线，授权证据必须绑定到实际执行语义层，而不仅是调用参数快照。它防的是授权完整性（A≠A'），我们是未授权披露（机密性），不直接竞争。写作上，它的诚实负结果段落是局限章节的范本。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "指出 coding-agent harness（Claude Code、Codex CLI、Cursor）的安全边界建立在一个未经审视的假设上：人批准的动作 A 就是 harness 实际执行的动作 A'。提出 Approval Laundering：六类在批准之后静默地把 A 替换为 A' 的失效模式（Scope、Argument、Temporal、Tool、Delegation、Semantic laundering）。通过插桩 Claude Code 的 PreToolUse 中介点做受控重复测量研究，报告 Bound-Gap Rate（含 Wilson 置信区间）。提出 Approval Token——由永不把密钥交还给 agent 的中介签发的 keyed capability Hk(principal, agent_id, session_id, tool, arguments, scope, expiry)，经 118 轮配对重放评估：完全消除 Delegation laundering，对构造的 session-identity-mismatch 消除 Temporal laundering（p<10⁻⁵），但按设计对 Scope laundering 无效、对 Argument laundering 无显著改善（p=1）——作者明确承认这两类在\"进程层级低于字段级验证器可观测\"处分叉，是诚实的负结果。", "supplement": false}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han（一作）等 4 人", "url": "https://arxiv.org/abs/2609.39450", "category": "cs.CR, cs.AI（v1, 2026-09-30）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "tool-use 授权的直接邻居，其\"授权上下文与生成上下文分离\"与我们的\"chunk 只存 M(r)、策略独立存放、查询时逐 AU 求值\"同构——都是把授权决策的输入限制在可信侧（可信用户请求 / 独立策略），不信任不可信内容（被污染 skill / chunk 文本）。它的 fail-closed 默认与我们的\"未知 AU 默认拒绝\"一致，可在 Agent 线 related work 并列引用。它的\"within-skill 注入 vs within-tool 参数篡改\"的区分对我们未来 Agent 线的威胁模型细化有参考价值。注意它防的是完整性攻击（IPI 诱导越权调用），我们是机密性（未授权披露），T1 威胁面内不竞争。它的 Reviewer 仍是 LLM 做裁决——与我们\"确定性求值\"的路线形成对照，可在 Discussion 里讨论\"LLM-as-judge 授权 vs 确定性策略求值\"的取舍。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对第三方 skill 被投毒导致 agent 工具调用越权的问题，提出 ActionGuard：在执行前一刻检查受 skill 影响的工具调用。关键设计是把目标 agent 的\"动作生成上下文\"与 safeguard 的\"授权上下文\"分离——目标 agent 仍可用原始 skill 做规划，但 Reviewer 收不到可能被污染的原始 skill 文本，而是基于可信的用户请求、平衡的 skill 画像、近期工具调用和本地脚本内容，判断每个动作是否有用户意图支撑；在 OpenClaw 的 before-tool-call 阶段拦截并执行 Reviewer 的 ALLOW/DENY，采用 fail-closed 策略。在 139 次上下文注入 + 180 次显式注入的 SKILL-INJECT 场景下，相对现有 safeguard（Dynamic Guardian、SkillGuard）ASR 降低 35.54–46.11%，相对无防护降低 70.44%，同时保持高良性任务完成率。", "supplement": false}, {"title": "ContractWarden: Kernel-Enforced Damage Boundaries for AI Agents via Human-Authorized Contracts", "authors": "Dongxu Cui（一作）等 4 人", "url": "https://arxiv.org/abs/2609.38248", "category": "cs.CR, cs.OS（v1, 2026-09-29）", "cats": ["cs.CR", "cs.OS"], "oneliner": "", "insight": "Agent 授权执行语义的硬核实例：它的\"人类批准合约 + 内核强制执行\"正是我们三种执行语义中\"确定性强制\"一极的工程实现（我们的 per-view 索引是检索侧的确定性强制，它是执行侧的）。它的 no_egress 单调传播与我们 KG 路径切割中\"权限沿派生边传播\"的思想相通，可互相引用。注意它解决的是动作副作用的损害边界（damage boundary），不是内容披露；粒度是进程/文件对象，不是 AU。它的\"模型提议、人拍板\"流程可为我们未来 Agent 线的授权 UX 提供参考。不动摇 RAG 主线 claim。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 LLM agent 的 prompt injection 或规划错误转化为操作系统副作用的问题，提出 ContractWarden：一个不信任 agent 及其策略建议的 Linux reference monitor。模型可提议三态资产合约（allow / deny / no_egress），但最终由人类拍板；执行门把合约绑定到具体任务后才允许不可信代码运行；扩展的 eBPF LSM 数据平面强制文件与网络决策，并把 no_egress 单调传播到进程、文件、管道、FIFO 和 Unix-domain socket。19 个安全测试 × 570 轮全部满足预设的返回值与副作用判据；三组文件 I/O 负载下中位开销在 VM 中 11.96–12.89%、物理机上 35.79–61.54%，低于对比的冻结 ActPlane 基线。", "supplement": false}, {"title": "Aletheia: Permission-Minimality Testing for Coding-Agent Rules", "authors": "Jieke Shi（一作）等 5 人", "url": "https://arxiv.org/abs/2609.39678", "category": "cs.CR, cs.SE（v1, 2026-09-30）", "cats": ["cs.CR", "cs.SE"], "oneliner": "", "insight": "最小权限原则在 agent 规则层的可操作化，与我们 AU 划分质量\"系统安全上界\"的论断呼应：都是\"权限粒度决定安全上界\"的实例，只是它的粒度是规则索取的权限类型，我们的是内容 AU。它的\"dispensability witness\"（缩减权限下仍通过功能测试即为可疑）是一个可借鉴的评估方法论：我们评估 AU 划分器时也可构造类似的\"权限缩减—功能保持\"对照实验。注意它针对的是规则注入（完整性），不是检索披露；314 检出是在合成攻击集上，生态效度有限。不动摇 claim，但\"最小权限可测试化\"的思路值得在 Discussion 的未来工作里提一句。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "仓库指令文件（如 CLAUDE.md 类规则）既指导 coding agent，也通过 prompt injection 暴露攻击面：恶意规则可在产出正确补丁的同时索取凭证访问或数据外传。提出 Aletheia：权限最小性测试框架——把规则索取的权限翻译成类型化语言，合成可执行的沙箱配置；在全权限与逐个剥离某一权限的独立约束下运行同一规则与任务；若在严格缩减的权限下仍通过功能测试，则得到 dispensability witness（可舍弃性证据），结合任务上下文诊断可疑索取。形式化了合成条件与 witness→强制约束的连接条件。在共享重构任务上检出全部 314 个 AIShellJack 攻击输入，5 个良性模板零误报；80 条人工验证的良性 GHAgentFiles 规则中误报 3 条（3.75%）。", "supplement": false}, {"title": "CATP: Design and Evaluation of Local Agent Authorization and Audit Evidence", "authors": "Linfeng Zhou", "url": "https://arxiv.org/abs/2609.38223", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "", "insight": "授权证据绑定（evidence binding）的细致工作，与我们的 M(r) 覆盖映射思想直接可比：我们绑定的是\"chunk—AU 覆盖关系\"，它绑定的是\"执行时策略 + 归一化动作 + 决策\"。它的核心警示——\"签名只能证明断言存在，不能证明断言与决策所用策略一致\"——对我们有直接的方法论价值：我们若在论文中主张 M(r) 的完整性，必须同样论证映射构建时所用的 AU 划分与查询时求值的策略版本一致（策略版本绑定问题），否则 M(r) 只是\"有人断言过这个映射\"。它的\"参数向量归一化后哈希相同\"的发现也提示：AU 划分的规范化必须确定，否则同一内容的不同切分会产生不可比的映射。可在 Discussion 的\"映射完整性假设\"段落引用。注意它是 agent 动作授权线，不涉及 RAG 检索。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "指出签名的授权记录只能证明\"签名者断言过什么\"，不能证明\"该断言与执行时用于决策的策略和动作一致\"。CATP 规定把本地执行前决策转化为离线可验证证据所需的绑定：hook 承诺执行时的策略与 adapter 归一化后的动作，在返回允许之前持久记录决策；后续 receipt 把记录绑定到自包含的审计导出。在 Claude Code 与 Codex 上的实现验证了这些绑定：受控的有效签名反例暴露 5 个缺失的一致性检查；另发现不同参数向量可在哈希前归一化为同一动作，限制了即使一致的 receipt 能证明什么。8 个脚本化运行时用例验证 hook 投递与允许/拒绝行为；中位成对 hook 开销约 85ms，离线验证端到端约 174ms。作者明确限定：证据以可信运行时/监视器/主机/签名密钥为条件，只认证\"关于归一化动作的决策\"，不证明执行真实性。", "supplement": false}, {"title": "NAQD Env: A benchmark for selective withdrawal in language agents", "authors": "Mohamed Abouzahra", "url": "https://arxiv.org/abs/2609.38460", "category": "cs.AI（v1, 2026-09-29）", "cats": ["cs.AI"], "oneliner": "", "insight": "撤销（revocation）语义的 benchmark，与 ResidualAuth（#1）形成\"理论—评测\"配对：ResidualAuth 回答\"需要保留什么状态\"，NAQD-Env 测量\"模型能否按授权变化正确撤回/恢复\"。它的\"区分试图违规与被放行的违规\"的指标设计值得借鉴——我们评估 retrieve-then-project 时也可区分\"模型试图引用未授权 AU\"与\"实际泄露到答案\"。注意它是合成环境、授权输入可信结构化，不证明真实遏制能力；且粒度是动作级不是 AU 级。可在 Discussion 的撤销机制段落与 ResidualAuth 一并引用（理论 + benchmark）。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "language agent 需要在证据变化、权限被撤销或收到停止指令时修正已规划动作；理想响应是选择性的：暂停受影响动作、保留未受影响的工作、修复充分后才恢复。提出 NAQD-Env 合成环境：用确定性参考策略评估这些决策，显式建模证据、授权与约束依赖；11 个依赖家族支持结构/家族/组合泛化评估；指标区分\"试图违规\"与\"被执行门放行的违规\"，联合报告策略一致性、任务价值、撤回、恢复与事件上报。三组开源指令模型 × 三种提示条件 × 350 冻结场景 = 3150 个 episode：撤回召回率最高仅 0.06，符合条件的恢复一次未发生，仅 1 个 episode 完全匹配参考策略。探索性 SFT 可把 Qwen2.5-3B 决策准确率从 0.45–0.54 提到 0.83–0.92，但也带来课程缺失后的不当撤回与事件上报丢失。", "supplement": false}, {"title": "Kill-Chain Canaries: Stage-Level Tracking of Prompt Injection Across Attack Surfaces and Five Production LLMs", "authors": "Haochuan Kevin Wang, Zechen Zhang", "url": "https://arxiv.org/abs/2603.28013", "category": "cs.CR, cs.AI, cs.LG（v4, 原 2026-03-30；本轮为更新版本重公布）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "攻击面测量的精细化方法论：四阶段 kill-chain（暴露/持久化/中继/执行）的划分与我们的 T1/T2/T3 威胁分层异曲同工——都是\"攻击成功不是二值的，要看泄露走到了哪一层\"。它的\"canary token 追踪\"技术可直接借鉴：我们评估 embedding 通道泄露时，也可用 canary 式标记追踪机密 AU 片段经过检索→重排→生成的完整路径，而不仅是最终答案是否泄露。它的\"中继注入更难拒绝\"发现提示我们：retrieve-then-project 裁剪后的残留片段若被模型复述转写，可能构成类似的\"中继\"泄露通道，值得在投影语义的失败分析里讨论。注意它是 IPI 攻击测量，不是访问控制机制；v4 是旧工作的更新。关联为 adjacent，方法论启迪为主。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "github.com/KevinChunye/prompt_injection (★2)", "zh_abs": "针对\"prompt injection 抗性通常只报一个成功率数字\"的问题，提出 kill-chain canary 方法：在每个注入载荷中植入唯一 token，记录它到达四个阶段（Exposed→Persisted→Relayed→Executed）中的最远处；950 轮、5 个生产级 LLM、6 个攻击面、5 种防御条件。调用了工具的轮次中暴露率 100%，差异在下游：Claude Haiku 4.5 / Sonnet 4.5 在 164 次文本面攻击中零执行，文本中继里 canary 从未出现在记忆写入中（0/40）；GPT-4o-mini 执行了 53%。四个发现：(1) Claude writer 在所有中继轮次中把 canary 挡在共享记忆之外，跨模型配对（Claude 写、GPT-4o-mini 读，n=3）下似能保护读者；(2) Claude 对预置记忆注入 0/40，但 Haiku 4.5 执行了 2/3 个经 GPT-4o-mini 中继的注入——中继注入是否更难拒绝仍是开放问题；(3) DeepSeek Chat 在预置记忆上 0/24、在工具结果上 8/8，渲染不可见的白字 PDF 载荷至少与可见载荷一样有效；(4) pi_detector/write_filter 在不检查的通道上失效，spotlighting 在被包裹内容上失效。代码与运行日志已公开。", "supplement": false}, {"title": "Runtime Policy Firewall: A Zero-Trust Governance Layer for Enterprise Agentic AI", "authors": "Swapneswar Ray", "url": "https://doi.org/10.63412/16ctyp82", "category": "International Journal of Global Innovations and Solutions (IJGIS)（OpenAlex 收录）", "cats": [], "oneliner": "", "insight": "关联较弱。这是一篇概念性/框架性综述，发表在不知名期刊（IJGIS），无实证评估；其\"运行时策略执行\"的呼吁方向正确，但颗粒度停留在原则层面，没有可借鉴的机制或可引用的数据。唯一价值是作为\"企业侧对 agent 运行时授权有真实需求\"的佐证性引用（如需说明动机）。不建议在 related work 中实质引用；我们的三种执行语义已比它具体得多。不动摇任何 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex 无引用记录）", "code": "无", "zh_abs": "面向企业级 agentic AI 的运行时治理：当 agent 从被动问答转向自主执行（分解目标、检索业务上下文、调工具、改记录、发消息、发起交易、跨系统编排），组织需要治理的不仅是\"它说了什么\"，更是\"它在运行时做了什么\"。主张零信任运行时控制平面，覆盖检索增强生成、reasoning-action 循环、工具使用与基础模型治理；梳理 prompt injection、间接指令攻击、数据泄露、工具滥用等已知风险，提出把策略执行点下沉到运行时的治理层设计。", "supplement": false}, {"title": "Security of The Model Context Protocol Ecosystem: Emerging Threats, Empirical Attack Evidence, Trust and Authorization Failures, Supply-Chain Risks, And Defensive Strategies", "authors": "Khalid D. Muhammed, David Chinonso Anih", "url": "https://doi.org/10.64388/irev10i3-1723420", "category": "Iconic Research and Engineering Journals（OpenAlex 收录，2020–2026 文献综述）", "cats": [], "oneliner": "", "insight": "关联较弱，定位是文献地图而非机制创新。发表在不知名期刊（Iconic Research and Engineering Journals），综述深度与引用规范性需打折；但作为 MCP 攻击面的\"一站式威胁清单\"，在我们未来 Agent 线的威胁模型写作时可做背景引用（tool discovery / delegated authority / supply chain 三类风险划分可直接借用）。对 RAG 主线无直接启迪：MCP 是工具调用通道，不涉及检索内容授权或 embedding 通道。不动摇 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex 无引用记录）", "code": "无", "zh_abs": "MCP 生态安全综述：MCP 把 LLM 变成能发现工具、访问资源、处理信息、在外部环境执行的 agent，但也引入了语义信息、委托授权、软件依赖与运行时能力交织的安全面。基于 2020–2026 年同行评审文献（侧重 2025–2026 实证证据），系统梳理 MCP 架构与信任边界、工具发现与选择、授权（authorization）与信任失效、供应链风险及防御策略。", "supplement": false}]}, {"date": "2026-10-01", "summary": "今日 arXiv 六个分类 26 篇关键词命中（去重后 24 篇新，2 篇昨日已报），扩展来源 18 篇候选中剔除噪声后 1 篇入选；Jev 初筛保留 13 篇，人工终判入选 **7 篇**（5 篇 direct、2 篇 adjacent）。最值得关注的是 **Audience-Bound Persistent Memory（2609.36373）**——首个把\"授权先于上下文组装\"做成 sound + policy-complete 的准入机制的工作：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，在 10,000 个多方对话历史的前瞻性确认中**零违规项进入上下文**，而无作用域检索 82% 的上下文暴露了禁用项；这与我们的\"查询时逐 AU 求值\"哲学同构，是 RAG 主线 related work 的直接对照。其次是 **ToolFence（2609.37196）**——面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行、judge 只做 capability-level 授权而非逐调用裁决，在 AgentDojo 上把 ASR 压到**近零**且 clean utility 仅降 3.8pp，是 Agent 访问控制线的直接邻居。**Boundary-State Control（2609.37475）** 补上了授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 proposal-to-commit 间隙，与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"的呼应。跨领域对照 **Don't Show What They Can't See**（ResearchSquare 预印本）把授权执行点放在 text-to-SQL 的 schema 组装之前，240 个 question-role 对上把 schema 暴露从 35.5 降到 **0**，是我们 per-view 索引思想在结构化领域的实例。", "papers": [{"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "这是\"授权先于组装\"范式最完整的形式化：sound + policy-complete 的 admission、靠排除而非模型行为执行——与我们的\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照。它的派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照：他们选了保守的抑制，我们给了裁剪选项，可在 Discussion 里对比两种选择的代价。它的\"audience 扩大需显式对象特定授权\"可为我们 Discussion 的 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience，不是 AU 级内容划分；威胁面仍在 T1/T2 内，未涉及 embedding 通道。不动摇我们的 claim，但给\"授权前置\"提供了可引用的形式化邻居。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究个人 agent 跨私密/共享对话的记忆授权问题：每个记忆项携带记录时的在场 audience；派生项按 audience 划分、取其来源 audience 的交集，或被抑制；audience 的扩大只能通过显式的、对象特定的授权；记忆项进入模型上下文的前提是当前所有 viewer 都属于其授权 audience，否则 fail-closed 到仅公开。在显式身份、provenance、完全中介三假设下，该准入机制对\"精确组装出的上下文\"是 sound 且 policy-complete 的，且靠排除（exclusion）而非模型行为来执行。在 10,000 个多方历史的前瞻性冻结确认中，零禁用项进入上下文，而无作用域检索 82% 的上下文暴露了禁用项；授权召回与策略等价基线完全一致，且 Recall@5 超出无作用域检索 0.30（Holm 确认）。", "supplement": false}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li（一作）等 4 人", "url": "https://arxiv.org/abs/2609.37196", "category": "cs.CR, cs.AI（v1, 2026-09-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "Agent 访问控制线的直接邻居。它的\"provenance-aware authorization\"（按来源区分授权值与不可信观测）与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构——都是把授权绑定到数据来源而非事后管控内容，可在 Agent 线 related work 中并列引用。它的架构选择（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；其授权粒度权衡（capability 级而非逐调用）与我们的 AU 粒度选择可对比讨论。注意它防的是 IPI（完整性轴），我们是未授权披露（机密性轴），不直接竞争。它的 within-tool 攻击定义对我们未来 Agent 线的威胁模型有参考价值。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 tool-using agent 的间接提示注入问题，提出 ToolFence：执行前编译一份 typed authorization blueprint（授权蓝图），由确定性 monitor 强制执行；当蓝图不完备时，judge 只负责授予新的 capability，而非逐个裁决具体调用。关键有二：细粒度的 provenance-aware 授权能区分用户授权的值与不可信观测值，从而堵住 within-tool 攻击（保留原定工具但篡改其参数）；确定性快路径 + capability 级运行时授权大幅减少昂贵的 judge 调用。在 AgentDojo（Qwen3-max）上整体 ASR 降至近零，clean utility 仅下降 3.8pp，开销实际可用。", "supplement": false}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "", "insight": "直接补上我们威胁模型的时间维度，与昨日 Residual Authority Replay（授权残留攻击）形成\"攻击揭示—机制修复\"的呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 则给出\"单次 commit 授权绑定授权状态语义投影\"的具体修复机制。它的形式化可为我们 Discussion 的 revocation / time-bounded authorization 段落提供引用。它的诚实局限写作（25% vs 0%，主动限定 scope）是局限段落的范本。注意其粒度是动作级 commit，不是内容级 AU；不涉及 T2 embedding 通道。不动摇现有 claim，反而加强我们\"查询时无状态求值\" Y", "cs.MA", "cs.SE"], "oneliner": "", "insight": "关联中等。它的\"temporal policy evolution\"（时序策略演化）与可重放审计状态，与我们的\"策略独立存放、撤销机制\"有概念交集，可为 Discussion 的策略版本化段落提供一个引用点。但它是企业级治理框架（动作授权 + 人工审查 + 合规），不是内容级细粒度披露控制，与我们的 AU 级 claim 不竞争、不互补。它的 60k 用例 benchmark 方法论（多 seed、OOD、时序演化三轴）对我们未来 Agent 线 benchmark 设计有参考价值。列入仅为不漏检。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "面向企业 agent 的确定性运行时治理层：把动作生成与动作授权分离，用版本化策略评估结构化 agent 动作，校验 typed evidence，固定 deny > review > allow 优先级，把高后果动作路由给可问责的人工审查，并记录可重放、防篡改的审计状态。自建的 GovernBench（30 seeds、60,000 oracle 标注用例、5 个企业域、含对抗 evidence、OOD 动作、时序策略演化）上达到 0.9888 准确率、macro-F1 0.9836，零 false allow，零治理攻击成功率；消融显示 evidence gating、deny 优先、OOD fail-safe、人工审查、矛盾处理、时序重放各有互补贡献；另有 150 例欧盟/奥地利法规 grounded 的双盲人工评估。", "supplement": false}, {"title": "Same Bytes, Different Authority: Reserved-Token Representations in Chat-Template Prompt Injection", "authors": "Yan Zhan（一作）等 6 人", "url": "https://arxiv.org/abs/2609.35932", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱（完整性轴）。唯一值得记录的是它的核心发现：authority 可以编码在单个 token 的 learned representation 里——\"表示即权限信号\"。这与我们的 embedding 通道泄露有松散类比：两者都说明向量表示层会携带超出文本本身的权限相关信息，而文本级防御对此盲区。不能作为我们 A1 结论的证据引用，但可在 Discussion 里提一句\"表示层权限信号\"的开放问题。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "发现伪造的 chat-template 标记既可以作为单个 reserved control token、也可以作为普通 subword 序列到达模型（文本完全相同），而\"谁来决定用哪种编码\"的是防御方而非攻击方。把伪造标记编码为 subword（文本不变）可使 InjecAgent 上的攻击成功率下降 39–66pp（4 个开源家族中的 3 个），且差距延续到 AgentDojo 多轮任务。机制上，authority 位于 marker 位置的单个 learned vector：marker 的 subword 向量均值无法复现该 authority，而最近邻普通 token 的向量可在 Llama-3.1 上恢复攻击；自适应攻击者在 3/4 家族上能找到这样的 embedding 邻居。检查 400 个最受欢迎 chat 模型中的 67 种 tokenizer 配置，发现 33 种的标准缓解措施（把 special token 编码为普通 subword）对此类标记无效。", "supplement": false}, {"title": "Calibrating One-Round Membership Inference with Neighbors", "authors": "Francesco Rita（一作）、Jie Zhang、Florian Tramèr", "url": "https://arxiv.org/abs/2609.36331", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱。方法论上与我们 A2（单模型、top-1 分数 MI，无 reference model）同属 one-round 范式；neighbor calibration 思路可为 A2 的信号校准提供一个备选方案。但领域是图像分类器，离我们的 embedding 侧信道很远，不提供可直接引用的数字或结论。注意昨日 #9（Near-Duplicate MI）已警示 MI 阳性证据的系统性高估问题，本文的方法若用于 A2 同样需要该警示。列入仅为方法论备查。\n---", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "SOTA 的成员推断（MI）靠 reference model 对每个样本单独校准信号，但大模型训练成本使该范式难以扩展；one-round 设定（只有一个已训练模型）下逐样本校准无法估计，信号变弱。本文提出用目标点的邻居样本恢复校准：reference model 的作用只是揭示\"未见过该样本的模型会如何表现\"，而在目标模型上查询邻近样本能得到同样的信息；两种互补的邻居构造方式，叠加早期训练 checkpoint 查询可进一步增强信号。在 3 个图像分类数据集、3 种训练配置上达到与 reference-model 方法可比的攻击效果，且零额外训练成本。", "supplement": false}]}, {"date": "2026-09-30", "summary": "今日 arXiv 六个分类共 50 篇去重命中（含 22 篇 new），精选 12 篇 v1 新论文 + 1 篇期刊补录。最值得关注的是 **CoSec（2609.34790）**——首个面向多用户/多社区 agent 系统的 authorization benchmark，把\"授权状态\"作为执行期验证的一等对象，与我们的\"查询时逐 AU 求值\"思路同构，是 Agent 访问控制线的直接邻居；以及 **Residual Authority Replay（2609.33910）**——揭示授权决策\"有效期\"本身就是攻击面（ASR 最高 +35.1pp），反向论证了我们\"策略独立存放、查询时无状态求值\"设计的合理性，可直接写入 Discussion 的 revocation 段落。另有 **Authorization Closure Graph（2609.32428）** 给撤销/策略变更的形式化提供了雏形，**BMA（2609.32186）** 的\"provenance-bound authorization 远胜 memory-side controls\"（2.0% vs 11.0%）是我们绑定与执行语义的外部实证。RAG 主线的新攻击 **LENS（2609.35155）** 属于完整性轴而非机密性轴，与我们的威胁模型正交，但应在 Related Work 中提及以界定 scope。", "papers": [{"title": "CoSec: Benchmarking Agent Security in Communities", "authors": "Hao Chen（一作）等 15 人", "url": "https://arxiv.org/abs/2609.34790", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "首个可执行的 agent 社区安全 benchmark，208 个场景覆盖固定/演化边界，用执行轨迹对照\"活跃授权状态\"验证信息流是否越权。", "insight": "这是我们 Agent 访问控制线最直接的邻居工作。它的核心发现——\"task utility 不蕴含 authorization compliance\"——正是我们整篇论文的动机句式，可直接引用。方法论上，它把 authorization state 作为执行期验证对象，与我们的\"查询时逐 AU 求值 P(a,u)\"同构；其场景设计（跨社区、演化边界）可作为我们未来 Agent 线 benchmark 的起点。注意它测的是 agent 系统整体而非 RAG 检索层，不与我们的 claim 直接竞争，定位是 related work + 动机证据。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "When Consent Outlives Context: Residual Authority Replay in Long-Lived Agents", "authors": "Zhihao Zhang（一作）等", "url": "https://arxiv.org/abs/2609.33910", "category": "cs.AI（v1, 2026-09-27）", "cats": ["cs.AI"], "oneliner": "揭示 long-lived agent 中\"授权残留\"攻击：良性交互合法获得的授权在后续对抗执行中被重放，6 个 LLM 家族上 ASR 最高提升 35.1pp。", "insight": "这是我们威胁模型缺失的一维：授权决策的有效期/上下文绑定。我们的框架目前是查询时无状态求值 P(a,u)，这篇文章反向证明了\"把授权结论持久化（缓存、记忆）而不绑定上下文\"必然产生残留授权攻击面——这恰好论证了我们\"策略独立存放、chunk 不存密级结论\"设计的正确性。建议写入 Discussion 的 revocation / time-bounded authorization 段落，并作为 Agent 线 threat model 的新增攻击范式（纵向攻击：先合法取权、后重放）。不动摇现有 claim，反而加强设计合理性。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Authorization Closure Graph: Minimal Repair for LLM Agents with Evolving User Instructions", "authors": "Qingzhuo Wang（一作）等", "url": "https://arxiv.org/abs/2609.32428", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "把授权及其依赖表示为演化的版本化状态（ACG），指令变更时只选择性失效受影响的授权并计算 minimal repair。", "insight": "这是我们 Discussion 未来工作\"撤销机制\"的最接近的形式化雏形：策略/指令变更时，哪些授权失效需要精确计算而非全量重算。它的 minimal repair 思路可直接引用为 related work。但注意其粒度是\"指令级动作授权\"，未涉及内容级细粒度授权（我们的 AU 级）；可作为对比点——我们是 per-query per-AU 求值，他们是 per-instruction 状态维护。威胁面不超出我们的 T1/T2/T3，但补充了时间维度的授权一致性问题。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "BMA: Backchain Memory Attacks Create Unauthorized Control Paths in LLM Agents", "authors": "Kaisheng Fan（一作）等", "url": "https://arxiv.org/abs/2609.32186", "category": "cs.CR（v1, 2026-09-26）", "cats": ["cs.CR"], "oneliner": "攻击者不写记忆、不改任务，仅编辑低信任证据，经记忆固化后在干净任务中被检索并驱动受保护动作；provenance-bound authorization 将攻击成功率压到 2.0%，远胜 memory-side controls 的 11.0%。", "insight": "这是对我们\"绑定与执行语义\"核心设计最有力的外部证据：事后管控记忆（memory-side controls）远不如按来源绑定授权（provenance-bound authorization）——与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构，可在论文中引用为设计选择的实证支撑。方法论上，它的 Path-CASR（registered pathway + matched-intervention checks，区分记忆介导命中与巧合命中）值得借鉴：我们的 A1 cloze 评估同样需要区分\"真实泄露\"与\"标注缺口/巧合命中\"。对 RAG 主线，持久化记忆通道 ≈ 我们的 embedding 通道（持久化表示泄露），类比成立。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "LENS: The Sum Is Worse Than the Parts for Set-Level Poisoning in Retrieval-Augmented Generation", "authors": "Kaisheng Fan（一作）等（与 BMA 同一团队）", "url": "https://arxiv.org/abs/2609.35155", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "形式化 RAG 的 set-level compositional poisoning：单个文档各自无害、合在一起才把 RAG 输出带偏到目标答案（full-set ASR 0.852，任一真子集 ≤0.069）。", "insight": "诚实地说，这是与我们正交的轴：LENS 是完整性（integrity）攻击，我们的威胁模型是机密性（未授权披露）。它不在我们的 T1/T2/T3 之外，而是不在同一维度。但应在 Related Work 中引用以完整界定 RAG 攻击面、明确我们的 scope 限定在访问控制/披露风险。方法论可借鉴：它的\"真子集不足\"形式化定义与 counterexample-guided repair 构造方式，可类比用于设计针对我们 projection 机制的组合式压力测试（多个各自合规的 AU 组合后是否泄露）。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "RAISE: Reinforcing Access Control Policy Synthesis in LLMs via Symbolic Evaluation", "authors": "Yingming Zhou（一作）等", "url": "https://arxiv.org/abs/2609.33796", "category": "cs.SE, cs.CR, cs.LG（v1, 2026-09-27）", "cats": ["cs.SE", "cs.CR", "cs.LG"], "oneliner": "构建 CedarInstruct（5,800 场景 / 44 领域，首个支持可验证 Cedar 策略合成的数据集），并用 verifier 信号做两阶段训练（SFT + off-context GRPO）提升策略语义正确率。", "insight": "我们的\"策略独立存放\"一直缺一个具体的策略语言实例；Cedar（AWS 开源策略语言）是现成候选，CedarInstruct 给了策略合成的可验证 benchmark——我们若要做 end-to-end demo，策略层可直接用 Cedar，评估可用 CedarBench。这是工程实现层的相关工作，不涉及检索/披露威胁面，不动摇安全 claim。它的训练发现（verifier signal 的用法比用量更重要）对我们无直接影响。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Certified Multi-Source Integrity for Structured Agent Actions", "authors": "Anmol Pandey（一作）等", "url": "https://arxiv.org/abs/2609.34245", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "在 corruption budget 下给出\"最大可用\"的安全认证器：动作的每个字段必须通过其证据结构支持的规则（corruption-distinct 证据类的 minimum hitting set 计数），否则拒绝执行。", "insight": "防御思路可借鉴但轴不同：它是完整性认证（字段值是否被污染），我们是机密性（未授权内容是否披露）。其\"corruption-distinct 证据类 / minimum hitting set\"形式化与我们的 KG 路径切割有类比价值——都是把\"证据独立性\"变成图/集合上的计数问题。它的实证发现（genuine corroboration 是少数现象；naive attestation counting 高估独立性）对我们的 NLI 残留检查是个警示：看似独立的公开证据可能共享上游来源。关联中等，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Policy-Conditioned Constrained Decoding for Column-Level Access Control in Text-to-SQL", "authors": "Ryoto Miyamoto（一作）等", "url": "https://arxiv.org/abs/2607.12341", "category": "cs.CL, cs.CR, cs.DB", "cats": ["cs.CL", "cs.CR", "cs.DB"], "oneliner": "把列级使用策略编译进解码器的 per-token logits mask，单次解码确定性消除列误用，在 Spider-CU 上达到 0% 泄露率。", "insight": "这是细粒度访问控制在 text-to-SQL 的实例，与我们的 AU 级控制形成跨领域对照：他们把策略执行点放在生成时（enforcement at generation），我们放在检索后（enforcement at retrieval / retrieve-then-project）——两种\"策略执行点\"设计的对比可在 Related Work 里写一节。它的\"column-use policy 按语义使用区分（output/filter/aggregation）\"提示我们的 P(a,u) 也可按\"使用方式\"（直接引用 vs 仅作排序信号）区分授权语义，这是个可探索的新问题。确定性零泄露的实证与我们的\"直接零泄露\"安全目标呼应。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Near-Duplicate Families Break Exact-Record Membership Inference", "authors": "Yiyong Liu（一作）等", "url": "https://arxiv.org/abs/2609.33909", "category": "cs.CR（v1, 2026-09-27）", "cats": ["cs.CR"], "oneliner": "证明标准 MI 在近似重复家族存在时系统性误判：CC-News 上 clean-reference LiRA 把 99.70% 的\"家族在场但精确记录不在\"的样本判为成员。", "insight": "直接相关：我们的 A2 成员推断评估（top-1 分数 AUROC 0.655→0.484）用的正是这类 MI 方法论。这篇文章说明 MI 阳性证据可能只是 family-level exposure——我们\"残余 4.05% 为标注缺口通道\"的结论需要更谨慎的表述，残余命中里可能混有近似重复而非真实机密。建议在论文 limitations 里引用：MI-based 泄露度量本身有系统性高估风险。好消息是 89.4%→4.05% 的量级差远大于此混杂，不动摇主要 claim，但要求我们对 A2 数字的表述更诚实。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Silent Failures in Agentic Security Evaluation: A Validated Harness for Tool-Call Mediation Under Indirect Prompt Injection", "authors": "Animesh Shaw", "url": "https://arxiv.org/abs/2609.32691", "category": "cs.CR, cs.LG（v1, 2026-09-26）", "cats": ["cs.CR", "cs.LG"], "oneliner": "审计 IPI benchmark 的评估工具链，找出四类\"沉默缺陷\"（如按工具身份而非参数计分可把 ASR 从 1.2% 虚报为 21.7%），并发布了使缺陷不可表示的 harness。", "insight": "方法论警示，直接相关。我们的对抗评估 A1（cloze 89.4%→4.05%）和 A2（AUROC 0.655→0.484）必须自查这四类缺陷——特别是\"攻击成功按检索命中而非实际披露内容计分\"（类比 tool-identity vs argument-level scoring）。建议在 THREAT_MODEL.md 或论文附录加一段 evaluation-validity 自查说明。这是诚实局限写作的范本；不提供新攻击面，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "API Secrets Should Never Become Tokens in the LLM's Vocabulary", "authors": "Patrick Kenney（一作）等", "url": "https://arxiv.org/abs/2609.33371", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-27）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "形式化 agent 系统中 API 凭证暴露的威胁链，评估 vault-mediated 执行边界（模型只选 connector 标识，凭证由可信边界注入）。", "insight": "关联较弱。主题是 agent 系统的凭证卫生，不是 RAG 内容访问控制。唯一可借鉴的是\"执行边界\"思想：敏感材料（对我们是未授权 AU 内容，对他们是 API key）不应进入模型可观测的数据管道——与我们的 retrieve-then-project 在哲学上一致，可在 Discussion 里一笔带过。Agent 线相关度高于 RAG 主线。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "CoDeL: Co-Evolutionary Defense against Indirect Prompt Injection in LLM-based Agents", "authors": "Xiao Yang（一作）等", "url": "https://arxiv.org/abs/2609.34463", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "防御者与攻击探测器协同进化的 IPI 训练式防御，在三个 benchmark 上把 ASR 降低 88.5%。", "insight": "关联较弱。IPI 防御属于完整性轴，与我们的访问控制（机密性轴）正交；训练式防御思路对我们的声明式策略框架无直接借鉴。列入仅为不漏检。\n---", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Permission-Aware RAG: Identity and Access Management (IAM)-Based Access Filtering in Multi-Resource Environments", "authors": "Jooyoung Jeong", "url": "https://doi.org/10.1109/access.2025.3628960", "category": "期刊", "cats": [], "oneliner": "这是与我们最直接对照的\"权限感知 RAG\"工作（IAM-based access filtering）；需精读全文判断它是 chunk 级继承过滤还是投影", "insight"
