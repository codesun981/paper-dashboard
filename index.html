万 token 输出上限**（此前 6.4 万），定位复杂工作流/代码/网络安全防御；定价 **$2/$10 per 百万 input/output tokens**；目前仅向 Fairwind 可信测试者与美国政府开放，无全面上线时间表。（来源：AI Week in Review）\n- **OpenAI 推出 Pro 500 订阅**：**$500/月**，25 倍 Plus 用量，新增 Codex Ultrafast 档（最高 300 tokens/秒）；同时原 $200 Pro 被降至 10 倍 Plus 用量——涨价与分层并行。（来源：AI Week in Review）\n- **美国 GSA 10 月 19 日起**：联邦承包商不得用政府数据训练 LLM/做广告/转售，须加密传输+审计日志+72 小时事件报告——AI 公司拿政府订单的合规成本上升。（来源：AI News 10-03）\n- **Anthropic 承诺 1 亿美元**：到 2027 年底培训 10,000 名\"Frontier Deployed Engineers\"，采用医学住院医师模式——AI 落地人才争夺战升级。（来源：AI News 10-03）\n- **Ai2 开源 AstaBrief**：8B 报告生成模型+训练数据开源，自称可比肩其 Claude 驱动的 pipeline，平均 51.1 秒/份报告（快 3.5 倍）。（来源：AI News 10-03）\n\n## 🏢 公司与产业\n\n- **Temu 英国销售额翻倍至 $1.71 亿**：低价电商在英国市场继续高歌猛进。（来源：[FT](https://www.ft.com/content/b119a81f-2347-4ba8-8b5f-13b380cf45fa?syn-25a6b1a6=1)）\n- **Stability AI 转向音乐**：发布 3 个新音频模型；Sony、Warner、Universal 8 月底注资 **7600 万美元**并授权曲库用于训练——从诉讼对立转向合作。（来源：AI News 10-03）\n- **Flydubai 航班惊魂**：副驾驶用斧头袭击机长，被定性为\"恐怖行为\"；机长事后讲述驾驶舱经过。航空业飞行员筛查机制再受审视。（来源：[FT](https://www.ft.com/content/36b90fa1-f61e-4563-8622-127cdb471101?syn-25a6b1a6=1)、[BBC](https://www.bbc.co.uk/news/articles/c61wv7lgex13o?at_medium=RSS&at_campaign=rss)）\n- **国庆档票房超 11 亿元**：2025 国庆档（假期）电影票房破 11 亿；假期前四天全社会跨区域人员流动 **12.49 亿人次**（同比 +5.7%），消费市场\"新场景新业态\"不断。（来源：央视新闻）\n- **\"蛟龙\"号实现我国首次北极冰区载人深潜**：深海科考里程碑。（来源：央视新闻）\n\n## 🌍 全球大事\n\n- **加沙停火现转机**：哈马斯原则上同意在美国\"20 点计划\"框架下释放所有被扣押人员；以色列称已做好落实准备；以军被命令停止进攻加沙城计划。（来源：央视新闻）\n- **俄罗斯打击基辅第二座大桥**：俄乌冲突基础设施打击升级。（来源：[BBC](https://www.bbc.co.uk/news/articles/c83vqxzdg1yko?at_medium=RSS&at_campaign=rss)）\n- **高市早苗当选自民党新总裁**：10 月 4 日下午第二轮投票胜出，**成为该党首位女总裁**；消息刺激日股创新高、日债日元遭抛售，日元跌破 152。（来源：央视新闻/第一财经）\n- **巴西指责美国干涉选举**：美巴关系再添摩擦。（来源：[BBC](https://www.bbc.co.uk/news/videos/c3eweld0nddeo?at_medium=RSS&at_campaign=rss)）\n- **美国医疗飞机失踪**：一架载有 6 人的医疗飞机在马萨诸塞州海岸外失联。（来源：[BBC](https://www.bbc.co.uk/news/articles/cme3x85013llo?at_medium=RSS&at_campaign=rss)）\n- **田纳西监狱长辞职**：此前 Christa Pike 死刑执行失败，监狱长引咎辞职。（来源：[BBC](https://www.bbc.co.uk/news/articles/c8zxl62yzxzxo?at_medium=RSS&at_campaign=rss)）\n\n## 📅 今日前瞻\n\n- **美国政府停摆谈判**：能否在下周初结束停摆、恢复关键经济数据发布，直接影响 10 月美联储议息能见度\n- **加沙\"20 点计划\"落实**：人质释放时间表、以军是否实质停止进攻与撤出\n- **美联储官员讲话**：停摆\"数据荒\"下官员表态成为市场判断利率路径的主要依据\n- **国庆假期后半程**：假期消费与出行最终数据，验证内需成色\n- **日元与日股**：高市早苗当选后市场对其财政/货币政策立场的定价\n\n## 📎 来源清单\n\nRSS 抓取（06:45）：FT Home（9 条）、FT Markets（8 条）、经济学人（本周/金融经济）、FT 中文网、BBC World（25 条）——共约 60 条候选，近 3 天。\n搜索补漏：路透早报（TradingView 转载）、新浪财经、央视新闻（新闻联播 10-04）、证券时报/每日经济新闻（东财转载）、AI Week in Review（Substack）、AI News 10-03（usecarly）。\n未使用：WSJ（内容冻结在 2025-01）、财新 RSS（403）、路透新旧 feed（失效）。\n"};

const LIB = {"groups": [{"id": "access-control", "name": "RAG 访问控制", "papers": [{"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "venue": "arXiv:2609.36373 (2026)", "oneliner": "首个把\"授权先于上下文组装\"做成 sound + policy-complete 的记忆准入机制：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，10,000 个多方对话历史中零违规项进入上下文", "insight": "与我们\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照；其派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照，可在 Discussion 对比两种选择的代价；\"audience 扩大需显式对象特定授权\"可为 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience（非 AU 级内容划分），威胁面在 T1/T2 内。", "tags": ["授权前置", "related work", "必引候选"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "Scott Thornton 等", "insight": "与我们 KG 路径切割节（Round 8）主题相邻、贡献互补：他们是在线图扩展边界做单点授权检查，我们是离线 k-cut + 代价曲线（28.2% 公开文本代价、残留实体 4133→0）+ 子句级 PII 粒度。必须引用并主动写清差异；他们的 PD=2 命题与我们的 k=2 发现（k=3≡k=2）互相印证。", "oneliner": "形式化 Retrieval Pivot Risk：vector 检索出的 seed chunk 经实体链接 pivot 进敏感图邻域，造成纯向量检索不存在的跨租户泄露；提出 7 种攻击；泄露稳定出现在 PD=2（二部拓扑命题）。", "tags": ["KG", "pivot攻击", "必引"], "title": "Retrieval Pivot Attacks in Hybrid RAG: Measuring and Mitigating Amplified Leakage from Vector Seeds to Graph Expansion", "url": "https://arxiv.org/abs/2602.08668", "venue": "arXiv:2602.08668 (2026)"}, {"added": "2026-09-30", "authors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "title": "Integrating Access Control with Retrieval-Augmented Generation: A Proof of Concept for Managing Sensitive Patient Profiles (AC-RAG)", "url": "https://doi.org/10.1145/3672608.3707848", "venue": "ACM SAC 2025"}, {"added": "2026-09-30", "authors": "", "insight": "写 related work 全景段落时引用，界定我们的位置。", "oneliner": "RAG 安全攻防分类综述，§4.4 整节讲 Access Control / Privacy / Confidentiality（含 SD-RAG、AC-RAG、DPVoteRAG、PAD 等）。", "tags": ["综述", "related work"], "title": "Securing Retrieval-Augmented Generation: A Taxonomy of Attacks, Defenses, and Future Directions", "url": "https://arxiv.org/pdf/2604.08304", "venue": "arXiv:2604.08304 (§4.4)"}, {"title": "ResidualAuth: What Authorization State Must Language Agents Preserve under Revocable Delegation?", "authors": "Moonwon Choi et al.", "url": "https://arxiv.org/abs/2609.08062", "venue": "arXiv cs.AI/cs.CR (2026-09-08, v2)", "oneliner": "可撤销委托下授权状态的形式化：两段历史可权限相同但撤销后决策相反，系统必须保留的恰是 residual authorization state，并给出内存精确/紧界。", "insight": "与我们 Discussion 的“撤销机制”开放问题直接对接：授权结论是授权历史的函数而非权限快照的函数；其内存下界与我们 AU 粒度—安全—成本权衡曲线呼应；与昨日 Residual Authority Replay 攻击形成“攻击—理论”配对引用。", "tags": ["revocable-delegation", "authorization-state", "theory", "memory-bounds"], "added": "2026-10-02"}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "venue": "arXiv cs.CR/cs.AI/cs.SE (2026-09-30)", "oneliner": "系统化揭示 coding-agent 中“人批准的 A ≠ 实际执行的 A'”的六类批准—执行绑定失效，提出 keyed capability (Approval Token) 部分修复并诚实报告负结果。", "insight": "“批准—执行绑定完整性”与我们的 M(r) 绑定思想同属一范式，可在 Agent 线 related work 并列；其“字段级验证器看不见进程层级分叉”的负结果警示授权证据必须绑定到执行语义层；诚实负结果段落是局限章节范本。", "tags": ["approval-binding", "capability", "coding-agent", "negative-result"], "added": "2026-10-02"}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han et al.", "url": "https://arxiv.org/abs/2609.39450", "venue": "arXiv cs.CR/cs.AI (2026-09-30)", "oneliner": "技能投毒下的工具调用授权：授权上下文与生成上下文分离，基于可信用户意图做 fail-closed 裁决，319 次注入测试中 ASR 相对降低 35–46%。", "insight": "“授权决策输入限于可信侧”与我们“策略独立存放、查询时逐 AU 求值”同构，Agent 线 related work 可并列引用；其 Reviewer 仍是 LLM 裁决，与我们“确定性求值”路线形成对照，可在 Discussion 讨论取舍。", "tags": ["tool-call-authorization", "skill-injection", "fail-closed", "agent"], "added": "2026-10-02"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica 等 4 人", "url": "https://arxiv.org/abs/2610.01871", "venue": "arXiv:2610.01871 (2026)", "oneliner": "针对返回图像的多模态 RAG 的黑盒自适应数据抽取攻击：影子图像混合+相关性加权重采样，单次 2500 查询重构 611 张放射影像，抽取条目数达非自适应基线的 5.6 倍。", "insight": "embedding 通道攻击线的最强邻居：我们的 A1 是文本完形攻击（89.4%@20），它是多模态、图像返回配置下的自适应抽取，说明向量索引的通道问题在跨模态场景同样成立且可被放大。可在 T2 威胁模型一节引用为最具体的实证；其\"重构出的不同条目数\"可借鉴为 embedding 泄露的度量。它不涉及授权语义（任何用户可查），防御侧无直接给出，但把\"embedding 索引必须被授权视图切分\"的论证推得更强——正是 per-view 索引的动机。", "tags": ["embedding 泄露", "数据抽取", "多模态 RAG", "攻击"], "added": "2026-10-03"}, {"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "venue": "ACM (2026)", "oneliner": "用 capability-scoped 权限模型重构 coding agent 工具沙箱：工具调用须持有显式能力令牌，命名资源≠被授权操作，架构层面切断间接 prompt injection 的执行通道", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的执行语义哲学同构——都是把\"能说出名字/能检索到\"从隐含授权中剥离。差异在于粒度：它是工具调用级 capability，我们是检索内容级 AU。适合 Related Work 的 Agent 线引用，作为显式授权能力模型的独立佐证；两者交叉可作 future work 一笔。", "tags": ["agent 安全", "capability 模型", "prompt injection", "授权执行"], "added": "2026-10-04"}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang 等 5 人", "url": "https://arxiv.org/abs/2610.01508", "venue": "arXiv:2610.01508 (2026)", "oneliner": "研究工具调用 agent 的\"主动越权\"：8 个隐私敏感域的确定性 benchmark，7 个模型全部超授权范围；SelfAudit 零样本推理时自检把隐私向越权降低 43%。", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计。\"越权来自结构性决策倾向而非解码随机性\"的结论与我们\"保守子句切分器\"的直觉相通——授权边界应由机制保证而非模型自觉；SelfAudit 仍是模型自己审计自己（启发式），我们的确定性求值 P(a,u) 是更彻底的路线，可在 Discussion 对照。注意它是动作侧授权，我们是数据侧，不竞争。", "tags": ["Agent 授权", "越权", "benchmark"], "added": "2026-10-03"}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang 等 7 人", "url": "https://arxiv.org/abs/2610.00371", "venue": "arXiv:2610.00371 (2026)", "oneliner": "提出 authorization-paired evaluation（拦住禁用用途+完成授权用途为联合成功标准）与 FlowReview 框架（对象解析+权限排序+确定性执行），组合审查把 denied-commit 率从 86.0% 降到 0 且授权供给无损失。", "insight": "核心命题\"对象身份与权限必须通过输出可验证的组件与执行保持连接\"与我们的\"chunk 只存 M(r)、查询时逐 AU 求值\"同构——都反对权限是附在数据上的静态标签。它的\"联合成功标准\"值得借鉴：我们评估以安全侧为主，未来可加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）提示我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"，与 KG 路径切割一节可呼应。", "tags": ["Agent 授权", "组合安全", "评估方法"], "added": "2026-10-03"}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}]}], "note": "人工精选、长期维护的论文库；每日 08:00 看板构建时自动嵌入，不会被每日文献流覆盖", "updated": "2026-10-04"};

function pdfUrl(u){
  const m = (u || '').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function codeLink(code){
  const m = (code || '').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);

}

  let h = '<span class="badge ' + (SRC_CLS[s] || '') + '">' + esc(s) + '</span>';
  h += (p.cats || []).map(c => '<span class="badge cat">' +
    esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
  if (p.supplement) h += '<span class="badge cat">期刊/会议</span>';
  return h;
}
function card(p){
  const pdf = pdfUrl(p.url), ch = codeLink(p.code);
  const cite = (p.citations && p.citations !== '尚未收录')
    ? '<span>📊 引用 ' + esc(p.citations) + '</span>' : '';
  const links = (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文页面</a>' : '')
    + (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  return '<div class="card">'
    + '<div class="badges">' + badges(p) + '<span class="date">' + esc(p.date) + '</span></div>'
    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<details class="box zh"><summary>中文摘要</summary><div class="body">' +
        esc(p.zh_abs).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">' +
        esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + ((cite || ch) ? '<div class="meta-row">' + cite + (ch ? '<span>' + ch + '</span>' : '') + '</div>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}
function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){
  let html = '', n = 0;

    html += colSummary('📌 今日论文综述', latest.summary.slice(0, 1400));

    if (state.day && day.date !== state.day) return;
    const ps = day.papers.filter(match);
    if (!ps.length) return;
    n += ps.length;
    html += '<div class="day"><div class="day-head"><h2>📅 ' + esc(day.date) + '</h2>'
      + '<span class="n">' + ps.length + ' 篇</span></div>';

      html += '<div class="x-summary"><div class="x-sum-b">' + md(day.summary.slice(0, 1000)) + '</div></div>';

    html || '<div class="empty">没有匹配的论文，换个关键词或清除筛选试试。</div>';

}

/* ---------- finance (💰财经大事): 长简报 md 渲染 ---------- */
function mdInline(s){
  return esc(s||'')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function renderFinance(){
  const M = FIN || {}, src = M.md || '';
  const n = (src.match(/^(\*\*\d+\.\s*\[|▪\s?)/gm) || []).length;
  document.getElementById('finCount').textContent =
    dline(M.date) + n + ' 条';
  const box = document.getElementById('finList');
  if (!src.trim()){ box.innerHTML = '<div class="empty">今日暂无财经大事早报。</div>'; return; }
  let html = '', inList = false, inTable = false;
  const closeList = () => { if (inList){ html += '</ul>'; inList = false; } };
  const closeTable = () => { if (inTable){ html += '</tbody></table>'; inTable = false; } };
  src.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line){ closeList(); closeTable(); return; }
    let m;
    if ((m = line.match(/^###\s+(.*)/))){ closeList(); closeTable(); html += '<div class="fin-h3">' + mdInline(m[1]) + '</div>'; return; }
    if ((m = line.match(/^##\s+(.*)/))){ closeList(); closeTable(); html += '<h2 class="fin-h2">' + mdInline(m[1]) + '</h2>'; return; }
    if (/^#\s/.test(line)){ closeList(); closeTable(); return; }  /* H1 跳过（tab 已有标题） */
    if (/^---+$/.test(line)){ closeList(); closeTable(); html += '<hr class="fin-hr">'; return; }
    if (/^\|.*\|$/.test(line)){
      closeList();
      if (/^\|[\s|\-:]*\|$/.test(line) && /-/.test(line)) return;  /* 表格分隔行跳过 */
      const cells = line.split('|').slice(1, -1).map(c => mdInline(c.trim()));
      if (!inTable){ html += '<table class="fin-table"><tbody>'; inTable = true; }
      html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      return;
    }
    if (/^\*\*\d+\.\s*\[/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item fin-num">' + mdInline(line) + '</li>';
      return;
    }
    if (/^▪\s?/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item">' + mdInline(line.replace(/^▪\s?/, '')) + '</li>';
      return;
    }
    closeList(); closeTable();
    html += '<p class="fin-p">' + mdInline(line) + '</p>';
  });
  closeList(); closeTable();
  box.innerHTML = '<article class="fin-body">' + html + '</article>';
}

/* ---- X 未读小红点：localStorage 记已读，APP 式 ---- */
const X_SEEN_KEY = 'coco_x_seen_v1';
const getXSeen = () => { try { return JSON.parse(localStorage.getItem(X_SEEN_KEY) || '{}'); } catch(e){ return {}; } };
function renderXDots(){
  const seen = getXSeen();
  let any = false;
  document.querySelectorAll('.x-chip').forEach(ch => {
    const h = ch.getAttribute('data-h'), nw = ch.getAttribute('data-newest') || '';
    const unread = !!(nw && (!seen[h] || nw > seen[h]));
    const dot = ch.querySelector('.x-dot');
    if (dot) dot.hidden = !unread;
    if (unread) any = true;
  });
  const tabDot = document.getElementById('xTabDot');
  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}
function toggleXAcc(btn){
  const g = btn.getAttribute('data-g'), h = btn.getAttribute('data-h');
  markXSeen(h);
  const det = document.getElementById('xd-' + g);
  const wasOpen = btn.classList.contains('open');
  det.parentElement.querySelectorAll('.x-chip.open').forEach(c => c.classList.remove('open'));
  if (wasOpen){ det.innerHTML = ''; return; }
  btn.classList.add('open');

const ARCH_PREFIX = location.pathname.indexOf('/archive/') >= 0 ? '' : 'archive/';
const DIGEST_URL = ARCH_PREFIX + 'digest.json';
let archDigestCache = null;
function archItemHTML(it, open){
  const runs = (it.runs || []).map(r =>
    '<span class="run-tag">' + esc(r.name) + '</span>').join('');
  const secs = [
    ['📚 论文', it.papers, it.papers_n ? it.papers_n + ' 篇' : ''],
    ['🤖 模型追踪', it.models],
    ['🎯 兴趣追踪', it.interests],
    ['🔥 开源趋势', it.trending],
    ['👀 大佬动态', it.x],
    ['📰 AI情报', it.ainews],
  ];
  const body = secs.filter(s => s[1]).map(s =>
    '<div class="arch-sec"><div class="arch-sec-t">' + s[0] +
    (s[2] ? ' <span class="arch-hint">' + esc(s[2]) + '</span>' : '') +
    '</div><div class="arch-sec-b">' + md(s[1]) + '</div></div>'
  ).join('') || '<div class="empty">暂无摘要</div>';
  return '<details class="arch-item"' + (open ? ' open' : '') + '>' +
    '<summary><span class="arch-date">📅 ' + esc(it.date) + '</span>' +
    runs + '<span class="arch-hint">→</span></summary>' +
    '<div class="arch-body">' + body +
    '<a class="arch-go" href="' + ARCH_PREFIX + it.date + '.html">查看当天完整看板 →</a>' +
    '</div></details>';
}
function renderArchList(items, partial){
  const list = document.getElementById('archList');
  if (!items || !items.length){
    list.innerHTML = '<div class="empty">暂无归档</div>';
    return;
  }
  list.innerHTML =
    (partial ? '<div class="empty">本地打开为精简模式，仅显示近 7 天</div>' : '') +
    items.map((it, i) => archItemHTML(it, i === 0)).join('');
}
let archScrollY = 0;
function lockBodyScroll(){
  archScrollY = window.scrollY || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + archScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, archScrollY);
}
async function openArchive(){
  const m = document.getElementById('archModal');
  m.hidden = false;
  lockBodyScroll();
  if (archDigestCache){ renderArchList(archDigestCache.list, archDigestCache.partial); return; }
  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  unlockBodyScroll();
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
