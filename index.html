<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;
  padding:9vh 16px 16px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{overflow-y:auto;padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月1日 星期四</div>
<h1>☀️ 每日看板</h1>
<div class="sub">论文 · 兴趣追踪 · 新闻 · 开源趋势 · 大佬动态 —— 每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>
</div>
</header>
<nav class="tabs" id="tabbar"><button class="tab" data-tab="papers">📚 论文 20</button><button class="tab" data-tab="models">🤖 模型追踪 23</button><button class="tab" data-tab="interests">🎯 兴趣追踪 6</button><button class="tab" data-tab="news">📰 新闻 40</button><button class="tab" data-tab="trending">🔥 开源趋势 20</button><button class="tab" data-tab="x">👀 大佬动态 49 <span class="tab-dot" id="xTabDot" hidden></span></button></nav>
<section class="tabpane" id="pane-papers">
<div class="stats">
<div class="stat"><b id="sTotal">–</b><span>收录论文</span></div>
<div class="stat"><b id="sDays">–</b><span>监测天数</span></div>
<div class="stat"><b id="sArxiv">–</b><span>arXiv 预印本</span></div>
<div class="stat"><b id="sExtra">–</b><span>其他来源</span></div>
<div class="stat"><b id="sJour">–</b><span>期刊 / 会议补录</span></div>
</div>
<div class="toolbar">
<label class="search"><span class="ico">🔍</span><input id="q" placeholder="搜索标题 / 作者 / 关键词…"></label>
<div class="chips" id="srcChips"></div>
<select class="sel" id="cat"><option value="">全部分类</option></select>
<select class="sel" id="day"><option value="">全部日期</option></select>
</div>
<div class="count" id="count"></div>

<div id="list"></div>
</section>
<section class="tabpane" id="pane-models" hidden>
<div class="sect-head"><h2>🤖 模型追踪</h2><span class="n" id="mdCount"></span></div>
<div id="mdList"></div>
</section>
<section class="tabpane" id="pane-library" hidden>
<div class="sect-head"><h2>📖 我们的论文库</h2><span class="n" id="libCount"></span></div>
<div id="libList"></div>
</section>
<section class="tabpane" id="pane-interests" hidden>
<div class="sect-head"><h2>🎯 兴趣追踪</h2><span class="n" id="intCount"></span></div>
<div id="intList"></div>
</section>
<section class="tabpane" id="pane-news" hidden>
<div class="sect-head"><h2>📰 AI / 安全新闻</h2><span class="n" id="newsCount"></span></div>
<div class="list" id="newsList"></div>
</section>
<section class="tabpane" id="pane-trending" hidden>
<div class="sect-head"><h2>🔥 开源趋势</h2><span class="n" id="trCount"></span></div>
<div class="grid" id="trList"></div>
</section>
<section class="tabpane" id="pane-x" hidden>
<div class="sect-head"><h2>👀 大佬动态</h2><span class="n" id="xCount"></span></div>
<div id="xList"></div>
</section>
<footer>COCO 每日看板 · 每天 08:00 / 12:00 / 22:00 自动更新 · <a href="archive/index.html">历史归档</a></footer>
</div>
<div class="modal" id="archModal" hidden>
<div class="modal-card" role="dialog" aria-label="历史归档">
<div class="modal-head"><h3>🗂️ 历史归档</h3><button class="modal-x" id="archClose" title="关闭">✕</button></div>
<div class="modal-list" id="archList"></div>
</div>

状态已发生变化。提出 BSC-R，一种确定性的 effect-boundary 机制，把单次使用的 commit 授权绑定到精确的动作本身以及\"授权状态的语义投影\"。在 2,847 个被攻击的 AgentDojo episode 上，边界内核完整保留未保护 agent 的行为（utility 80.576%，ASR 1.616%）；在 10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类预设的变更/重放类；在独立的 boundary-drift 实验中 4,403 个无效上下文零提交、5,899 个有效上下文全保留。作者诚实报告了局限：在更广泛的外部攻击套件上 BSC-R 仍有 25% 的无效 effect 提交率（CONTINUITY 套件上为 0%），因此定位为有作用域的 commit-time 一致性机制，而非通用 agent 安全方案。", "supplement": false}, {"title": "Don't Show What They Can't See: Authorization-First Schema Context for Secure Text-to-SQL", "authors": "Jianan Jiang（一作）等 6 人", "url": "https://doi.org/10.21203/rs.3.rs-10905100/v1", "category": "Research Square 预印本（2026-09-28）", "cats": [], "oneliner": "", "insight": "细粒度访问控制的跨领域实例，与我们 RU/AU 解耦形成直接对照：他们把授权执行点放在\"schema 上下文组装之前\"（本质是 per-view 思想在结构化领域的实例——只让模型看到授权视图），我们是检索后投影（retrieve-then-project）。它的\"provenance-aware permission inheritance\"（派生制品继承权限）与我们 KG 路径切割中\"派生事实的权限归属\"问题同构，可互相引用。可在 Related Work 里写一节跨领域对照（text-to-SQL schema vs RAG 非结构化文本）。注意这是 ResearchSquare 预印本（非同行评审），引用时需标注；领域是结构化 schema，未涉及 embedding 通道。不动摇 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex cited_by_count=0）", "code": "无", "zh_abs": "针对企业级 text-to-SQL 中 schema 元数据本身敏感的问题，提出 authorization-first 的 schema 上下文构造框架：表/列/关系级的授权在 relevance retrieval 之前强制执行，未授权对象永不进入低信任的检索、重排或生成组件；provenance-aware 的权限继承把保护延伸到派生制品（语义描述、join hint、SQL 示例）；在授权子空间内做权限安全的语义增强，并用 satisfiability gate 实现不泄露的弃答。在含 240 个 question-role 对、20 个数据库、4 个权限层级的 access-control-augmented Spider benchmark 上，process-level schema 暴露从每请求 35.5 个未授权对象降到 0，任务精度保持不变。", "supplement": false}, {"title": "VeriWeave Govern: Evidence-Gated Deterministic Runtime Governance for Enterprise AI Agents", "authors": "Kabeh Mohsenzadegan（一作）等 3 人", "url": "https://arxiv.org/abs/2609.37457", "category": "cs.AI, cs.CY, cs.MA, cs.SE（v1, 2026-09-26）", "cats": ["cs.AI", "cs.CY", "cs.MA", "cs.SE"], "oneliner": "", "insight": "关联中等。它的\"temporal policy evolution\"（时序策略演化）与可重放审计状态，与我们的\"策略独立存放、撤销机制\"有概念交集，可为 Discussion 的策略版本化段落提供一个引用点。但它是企业级治理框架（动作授权 + 人工审查 + 合规），不是内容级细粒度披露控制，与我们的 AU 级 claim 不竞争、不互补。它的 60k 用例 benchmark 方法论（多 seed、OOD、时序演化三轴）对我们未来 Agent 线 benchmark 设计有参考价值。列入仅为不漏检。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "面向企业 agent 的确定性运行时治理层：把动作生成与动作授权分离，用版本化策略评估结构化 agent 动作，校验 typed evidence，固定 deny > review > allow 优先级，把高后果动作路由给可问责的人工审查，并记录可重放、防篡改的审计状态。自建的 GovernBench（30 seeds、60,000 oracle 标注用例、5 个企业域、含对抗 evidence、OOD 动作、时序策略演化）上达到 0.9888 准确率、macro-F1 0.9836，零 false allow，零治理攻击成功率；消融显示 evidence gating、deny 优先、OOD fail-safe、人工审查、矛盾处理、时序重放各有互补贡献；另有 150 例欧盟/奥地利法规 grounded 的双盲人工评估。", "supplement": false}, {"title": "Same Bytes, Different Authority: Reserved-Token Representations in Chat-Template Prompt Injection", "authors": "Yan Zhan（一作）等 6 人", "url": "https://arxiv.org/abs/2609.35932", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱（完整性轴）。唯一值得记录的是它的核心发现：authority 可以编码在单个 token 的 learned representation 里——\"表示即权限信号\"。这与我们的 embedding 通道泄露有松散类比：两者都说明向量表示层会携带超出文本本身的权限相关信息，而文本级防御对此盲区。不能作为我们 A1 结论的证据引用，但可在 Discussion 里提一句\"表示层权限信号\"的开放问题。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "发现伪造的 chat-template 标记既可以作为单个 reserved control token、也可以作为普通 subword 序列到达模型（文本完全相同），而\"谁来决定用哪种编码\"的是防御方而非攻击方。把伪造标记编码为 subword（文本不变）可使 InjecAgent 上的攻击成功率下降 39–66pp（4 个开源家族中的 3 个），且差距延续到 AgentDojo 多轮任务。机制上，authority 位于 marker 位置的单个 learned vector：marker 的 subword 向量均值无法复现该 authority，而最近邻普通 token 的向量可在 Llama-3.1 上恢复攻击；自适应攻击者在 3/4 家族上能找到这样的 embedding 邻居。检查 400 个最受欢迎 chat 模型中的 67 种 tokenizer 配置，发现 33 种的标准缓解措施（把 special token 编码为普通 subword）对此类标记无效。", "supplement": false}, {"title": "Calibrating One-Round Membership Inference with Neighbors", "authors": "Francesco Rita（一作）、Jie Zhang、Florian Tramèr", "url": "https://arxiv.org/abs/2609.36331", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱。方法论上与我们 A2（单模型、top-1 分数 MI，无 reference model）同属 one-round 范式；neighbor calibration 思路可为 A2 的信号校准提供一个备选方案。但领域是图像分类器，离我们的 embedding 侧信道很远，不提供可直接引用的数字或结论。注意昨日 #9（Near-Duplicate MI）已警示 MI 阳性证据的系统性高估问题，本文的方法若用于 A2 同样需要该警示。列入仅为方法论备查。\n---", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "SOTA 的成员推断（MI）靠 reference model 对每个样本单独校准信号，但大模型训练成本使该范式难以扩展；one-round 设定（只有一个已训练模型）下逐样本校准无法估计，信号变弱。本文提出用目标点的邻居样本恢复校准：reference model 的作用只是揭示\"未见过该样本的模型会如何表现\"，而在目标模型上查询邻近样本能得到同样的信息；两种互补的邻居构造方式，叠加早期训练 checkpoint 查询可进一步增强信号。在 3 个图像分类数据集、3 种训练配置上达到与 reference-model 方法可比的攻击效果，且零额外训练成本。", "supplement": false}]}, {"date": "2026-09-30", "summary": "今日 arXiv 六个分类共 50 篇去重命中（含 22 篇 new），精选 12 篇 v1 新论文 + 1 篇期刊补录。最值得关注的是 **CoSec（2609.34790）**——首个面向多用户/多社区 agent 系统的 authorization benchmark，把\"授权状态\"作为执行期验证的一等对象，与我们的\"查询时逐 AU 求值\"思路同构，是 Agent 访问控制线的直接邻居；以及 **Residual Authority Replay（2609.33910）**——揭示授权决策\"有效期\"本身就是攻击面（ASR 最高 +35.1pp），反向论证了我们\"策略独立存放、查询时无状态求值\"设计的合理性，可直接写入 Discussion 的 revocation 段落。另有 **Authorization Closure Graph（2609.32428）** 给撤销/策略变更的形式化提供了雏形，**BMA（2609.32186）** 的\"provenance-bound authorization 远胜 memory-side controls\"（2.0% vs 11.0%）是我们绑定与执行语义的外部实证。RAG 主线的新攻击 **LENS（2609.35155）** 属于完整性轴而非机密性轴，与我们的威胁模型正交，但应在 Related Work 中提及以界定 scope。", "papers": [{"title": "CoSec: Benchmarking Agent Security in Communities", "authors": "Hao Chen（一作）等 15 人", "url": "https://arxiv.org/abs/2609.34790", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "首个可执行的 agent 社区安全 benchmark，208 个场景覆盖固定/演化边界，用执行轨迹对照\"活跃授权状态\"验证信息流是否越权。", "insight": "这是我们 Agent 访问控制线最直接的邻居工作。它的核心发现——\"task utility 不蕴含 authorization compliance\"——正是我们整篇论文的动机句式，可直接引用。方法论上，它把 authorization state 作为执行期验证对象，与我们的\"查询时逐 AU 求值 P(a,u)\"同构；其场景设计（跨社区、演化边界）可作为我们未来 Agent 线 benchmark 的起点。注意它测的是 agent 系统整体而非 RAG 检索层，不与我们的 claim 直接竞争，定位是 related work + 动机证据。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "When Consent Outlives Context: Residual Authority Replay in Long-Lived Agents", "authors": "Zhihao Zhang（一作）等", "url": "https://arxiv.org/abs/2609.33910", "category": "cs.AI（v1, 2026-09-27）", "cats": ["cs.AI"], "oneliner": "揭示 long-lived agent 中\"授权残留\"攻击：良性交互合法获得的授权在后续对抗执行中被重放，6 个 LLM 家族上 ASR 最高提升 35.1pp。", "insight": "这是我们威胁模型缺失的一维：授权决策的有效期/上下文绑定。我们的框架目前是查询时无状态求值 P(a,u)，这篇文章反向证明了\"把授权结论持久化（缓存、记忆）而不绑定上下文\"必然产生残留授权攻击面——这恰好论证了我们\"策略独立存放、chunk 不存密级结论\"设计的正确性。建议写入 Discussion 的 revocation / time-bounded authorization 段落，并作为 Agent 线 threat model 的新增攻击范式（纵向攻击：先合法取权、后重放）。不动摇现有 claim，反而加强设计合理性。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Authorization Closure Graph: Minimal Repair for LLM Agents with Evolving User Instructions", "authors": "Qingzhuo Wang（一作）等", "url": "https://arxiv.org/abs/2609.32428", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "把授权及其依赖表示为演化的版本化状态（ACG），指令变更时只选择性失效受影响的授权并计算 minimal repair。", "insight": "这是我们 Discussion 未来工作\"撤销机制\"的最接近的形式化雏形：策略/指令变更时，哪些授权失效需要精确计算而非全量重算。它的 minimal repair 思路可直接引用为 related work。但注意其粒度是\"指令级动作授权\"，未涉及内容级细粒度授权（我们的 AU 级）；可作为对比点——我们是 per-query per-AU 求值，他们是 per-instruction 状态维护。威胁面不超出我们的 T1/T2/T3，但补充了时间维度的授权一致性问题。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "BMA: Backchain Memory Attacks Create Unauthorized Control Paths in LLM Agents", "authors": "Kaisheng Fan（一作）等", "url": "https://arxiv.org/abs/2609.32186", "category": "cs.CR（v1, 2026-09-26）", "cats": ["cs.CR"], "oneliner": "攻击者不写记忆、不改任务，仅编辑低信任证据，经记忆固化后在干净任务中被检索并驱动受保护动作；provenance-bound authorization 将攻击成功率压到 2.0%，远胜 memory-side controls 的 11.0%。", "insight": "这是对我们\"绑定与执行语义\"核心设计最有力的外部证据：事后管控记忆（memory-side controls）远不如按来源绑定授权（provenance-bound authorization）——与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构，可在论文中引用为设计选择的实证支撑。方法论上，它的 Path-CASR（registered pathway + matched-intervention checks，区分记忆介导命中与巧合命中）值得借鉴：我们的 A1 cloze 评估同样需要区分\"真实泄露\"与\"标注缺口/巧合命中\"。对 RAG 主线，持久化记忆通道 ≈ 我们的 embedding 通道（持久化表示泄露），类比成立。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "LENS: The Sum Is Worse Than the Parts for Set-Level Poisoning in Retrieval-Augmented Generation", "authors": "Kaisheng Fan（一作）等（与 BMA 同一团队）", "url": "https://arxiv.org/abs/2609.35155", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "形式化 RAG 的 set-level compositional poisoning：单个文档各自无害、合在一起才把 RAG 输出带偏到目标答案（full-set ASR 0.852，任一真子集 ≤0.069）。", "insight": "诚实地说，这是与我们正交的轴：LENS 是完整性（integrity）攻击，我们的威胁模型是机密性（未授权披露）。它不在我们的 T1/T2/T3 之外，而是不在同一维度。但应在 Related Work 中引用以完整界定 RAG 攻击面、明确我们的 scope 限定在访问控制/披露风险。方法论可借鉴：它的\"真子集不足\"形式化定义与 counterexample-guided repair 构造方式，可类比用于设计针对我们 projection 机制的组合式压力测试（多个各自合规的 AU 组合后是否泄露）。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "RAISE: Reinforcing Access Control Policy Synthesis in LLMs via Symbolic Evaluation", "authors": "Yingming Zhou（一作）等", "url": "https://arxiv.org/abs/2609.33796", "category": "cs.SE, cs.CR, cs.LG（v1, 2026-09-27）", "cats": ["cs.SE", "cs.CR", "cs.LG"], "oneliner": "构建 CedarInstruct（5,800 场景 / 44 领域，首个支持可验证 Cedar 策略合成的数据集），并用 verifier 信号做两阶段训练（SFT + off-context GRPO）提升策略语义正确率。", "insight": "我们的\"策略独立存放\"一直缺一个具体的策略语言实例；Cedar（AWS 开源策略语言）是现成候选，CedarInstruct 给了策略合成的可验证 benchmark——我们若要做 end-to-end demo，策略层可直接用 Cedar，评估可用 CedarBench。这是工程实现层的相关工作，不涉及检索/披露威胁面，不动摇安全 claim。它的训练发现（verifier signal 的用法比用量更重要）对我们无直接影响。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Certified Multi-Source Integrity for Structured Agent Actions", "authors": "Anmol Pandey（一作）等", "url": "https://arxiv.org/abs/2609.34245", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "在 corruption budget 下给出\"最大可用\"的安全认证器：动作的每个字段必须通过其证据结构支持的规则（corruption-distinct 证据类的 minimum hitting set 计数），否则拒绝执行。", "insight": "防御思路可借鉴但轴不同：它是完整性认证（字段值是否被污染），我们是机密性（未授权内容是否披露）。其\"corruption-distinct 证据类 / minimum hitting set\"形式化与我们的 KG 路径切割有类比价值——都是把\"证据独立性\"变成图/集合上的计数问题。它的实证发现（genuine corroboration 是少数现象；naive attestation counting 高估独立性）对我们的 NLI 残留检查是个警示：看似独立的公开证据可能共享上游来源。关联中等，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Policy-Conditioned Constrained Decoding for Column-Level Access Control in Text-to-SQL", "authors": "Ryoto Miyamoto（一作）等", "url": "https://arxiv.org/abs/2607.12341", "category": "cs.CL, cs.CR, cs.DB", "cats": ["cs.CL", "cs.CR", "cs.DB"], "oneliner": "把列级使用策略编译进解码器的 per-token logits mask，单次解码确定性消除列误用，在 Spider-CU 上达到 0% 泄露率。", "insight": "这是细粒度访问控制在 text-to-SQL 的实例，与我们的 AU 级控制形成跨领域对照：他们把策略执行点放在生成时（enforcement at generation），我们放在检索后（enforcement at retrieval / retrieve-then-project）——两种\"策略执行点\"设计的对比可在 Related Work 里写一节。它的\"column-use policy 按语义使用区分（output/filter/aggregation）\"提示我们的 P(a,u) 也可按\"使用方式\"（直接引用 vs 仅作排序信号）区分授权语义，这是个可探索的新问题。确定性零泄露的实证与我们的\"直接零泄露\"安全目标呼应。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Near-Duplicate Families Break Exact-Record Membership Inference", "authors": "Yiyong Liu（一作）等", "url": "https://arxiv.org/abs/2609.33909", "category": "cs.CR（v1, 2026-09-27）", "cats": ["cs.CR"], "oneliner": "证明标准 MI 在近似重复家族存在时系统性误判：CC-News 上 clean-reference LiRA 把 99.70% 的\"家族在场但精确记录不在\"的样本判为成员。", "insight": "直接相关：我们的 A2 成员推断评估（top-1 分数 AUROC 0.655→0.484）用的正是这类 MI 方法论。这篇文章说明 MI 阳性证据可能只是 family-level exposure——我们\"残余 4.05% 为标注缺口通道\"的结论需要更谨慎的表述，残余命中里可能混有近似重复而非真实机密。建议在论文 limitations 里引用：MI-based 泄露度量本身有系统性高估风险。好消息是 89.4%→4.05% 的量级差远大于此混杂，不动摇主要 claim，但要求我们对 A2 数字的表述更诚实。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Silent Failures in Agentic Security Evaluation: A Validated Harness for Tool-Call Mediation Under Indirect Prompt Injection", "authors": "Animesh Shaw", "url": "https://arxiv.org/abs/2609.32691", "category": "cs.CR, cs.LG（v1, 2026-09-26）", "cats": ["cs.CR", "cs.LG"], "oneliner": "审计 IPI benchmark 的评估工具链，找出四类\"沉默缺陷\"（如按工具身份而非参数计分可把 ASR 从 1.2% 虚报为 21.7%），并发布了使缺陷不可表示的 harness。", "insight": "方法论警示，直接相关。我们的对抗评估 A1（cloze 89.4%→4.05%）和 A2（AUROC 0.655→0.484）必须自查这四类缺陷——特别是\"攻击成功按检索命中而非实际披露内容计分\"（类比 tool-identity vs argument-level scoring）。建议在 THREAT_MODEL.md 或论文附录加一段 evaluation-validity 自查说明。这是诚实局限写作的范本；不提供新攻击面，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "API Secrets Should Never Become Tokens in the LLM's Vocabulary", "authors": "Patrick Kenney（一作）等", "url": "https://arxiv.org/abs/2609.33371", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-27）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "形式化 agent 系统中 API 凭证暴露的威胁链，评估 vault-mediated 执行边界（模型只选 connector 标识，凭证由可信边界注入）。", "insight": "关联较弱。主题是 agent 系统的凭证卫生，不是 RAG 内容访问控制。唯一可借鉴的是\"执行边界\"思想：敏感材料（对我们是未授权 AU 内容，对他们是 API key）不应进入模型可观测的数据管道——与我们的 retrieve-then-project 在哲学上一致，可在 Discussion 里一笔带过。Agent 线相关度高于 RAG 主线。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "CoDeL: Co-Evolutionary Defense against Indirect Prompt Injection in LLM-based Agents", "authors": "Xiao Yang（一作）等", "url": "https://arxiv.org/abs/2609.34463", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "防御者与攻击探测器协同进化的 IPI 训练式防御，在三个 benchmark 上把 ASR 降低 88.5%。", "insight": "关联较弱。IPI 防御属于完整性轴，与我们的访问控制（机密性轴）正交；训练式防御思路对我们的声明式策略框架无直接借鉴。列入仅为不漏检。\n---", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Permission-Aware RAG: Identity and Access Management (IAM)-Based Access Filtering in Multi-Resource Environments", "authors": "Jooyoung Jeong", "url": "https://doi.org/10.1109/access.2025.3628960", "category": "期刊", "cats": [], "oneliner": "这是与我们最直接对照的\"权限感知 RAG\"工作（IAM-based access filtering）；需精读全文判断它是 chunk 级继承过滤还是投影", "insight": "这是与我们最直接对照的\"权限感知 RAG\"工作（IAM-based access filtering）；需精读全文判断它是 chunk 级继承过滤还是投影", "supplement": true, "source": "期刊补录", "citations": "", "code": "", "zh the-decoder.com/anthropic-says-zhipus-open-weight-glm-5-3-nearly-matches-claude-mythos-preview-at-building-exploits/", "source": "The Decoder", "summary": "Zhipu's open-weight model GLM-5.3 writes cyber exploits nearly as well as Claude Mythos Preview, according to Anthropic. Its smaller Flash variant put together a reliable Chrome attack for just $20.40 at Zhipu's API prices. The model's safeguards are easy to strip out, and unlocked versions are alre", "published": "2026-09-30"}, {"title": "Google is paying almost no publishers almost nothing for content used in AI answers", "url": "https://the-decoder.com/google-is-paying-almost-no-publishers-almost-nothing-for-content-used-in-ai-answers/", "source": "The Decoder", "summary": "Google pays about 100 digital publishers for content used in AI Overviews, AI Mode, and Gemini, according to The Information. Payments range from under $1,000 over several months to more than $1 million a year. Some participants don't know how Google calculates payments, while some larger publishers", "published": "2026-09-30"}, {"title": "Attackers Exploit Zimbra Flaw to Deploy Web Shells and Harvest Authentication Secrets", "url": "https://thehackernews.com/2026/09/attackers-exploit-zimbra-flaw-to-deploy.html", "source": "The Hacker News", "summary": "Threat actors have weaponized a now-patched security flaw in Zimbra Collaboration Suite (ZCS) to deploy web shells and access mailbox data, according to findings from the Microsoft Security Research team. The attack exploits CVE-2026-73570 (CVSS score: 8.9), an unauthenticated operating system comma", "published": "2026-09-30"}, {"title": "Attackers Abuse MSP360 to Deploy ScreenConnect in Dual-RMM Phishing Attacks", "url": "https://thehackernews.com/2026/09/attackers-abuse-msp360-to-deploy.html", "source": "The Hacker News", "summary": "Microsoft has warned of phishing campaigns distributing an installer for the MSP360 Remote Monitoring and Management (RMM) software under the guise of meeting invitations, PDF-themed lures, software update prompts, and other social-engineering content. \"Once executed, the legitimate MSP360 installer", "published": "2026-09-30"}, {"title": "Cisco Warns of Attackers Exploiting Critical Authentication Bypass in SD-WAN Manager", "url": "https://thehackernews.com/2026/09/cisco-warns-of-attackers-exploiting.html", "source": "The Hacker News", "summary": "Attackers are exploiting a new critical zero-day flaw in Cisco Catalyst SD-WAN Manager, the system companies use to manage their Cisco SD-WAN networks, Cisco said in an advisory on September 30. The flaw, CVE-2026-76504, could allow a remote attacker with no login access to use the Manager's API as ", "published": "2026-09-30"}, {"title": "Attackers Abuse ChatGPT Custom GPTs to Deliver RAT via ClickFix Lures", "url": "https://thehackernews.com/2026/09/attackers-abuse-chatgpt-custom-gpts-to.html", "source": "The Hacker News", "summary": "Threat actors are abusing ChatGPT Custom GPTs to disguise them as legitimate product offerings and direct unsuspecting victims to malicious sites that employ ClickFix lures to deliver malware. Huntress, which observed the activity in late September 2026, said it marks the abuse of yet another featur", "published": "2026-09-30"}, {"title": "Know Your Enemy: Browser-Based Attack Techniques in 2026", "url": "https://thehackernews.com/2026/09/know-your-enemy-browser-based-attack.html", "source": "The Hacker News", "summary": "Given that the browser is where business apps are accessed and used, it makes sense that attacks are happening there too. Most breaches today begin in a browser session. Often, they never leave it, with the entire attack chain from initial access to exfiltration playing out in the browser. Here are ", "published": "2026-09-30"}, {"title": "US-Focused CSuite Phishing Steals Microsoft 365 Sessions and Deploys RMM Tools for Remote Access", "url": "https://thehackernews.com/2026/09/us-focused-csuite-phishing-steals.html", "sourc 44555, "reposts": 8543, "replies": 1931, "views": 3389566, "url": "https://x.com/DanScavino/status/2103467836114936060", "author": "DanScavino"}]}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2105373267171438779", "text": "Small teams are taking on more with AI—from finding customers to building products and managing finances.\n\nOur new report explores how small businesses are putting AI agents to work. And through a new partnership with @ASBDC, we're bringing hands-on AI training and local guidance to help more owners get started.\n\nhttps://openai.com/index/helping-small-businesses-put-ai-to-work/", "created_at": "10-01 03:04", "likes": 986, "reposts": 54, "replies": 136, "views": 135025, "url": "https://x.com/OpenAI/status/2105373267171438779", "author": "OpenAI"}, {"id": "2104993966043320759", "text": "This is Ultrafast.\n\nOur premium speed tier, Ultrafast offers up to 8x faster token generation (300 tokens per second) in Codex and up to 6x in the API.", "created_at": "09-30 01:57", "likes": 6876, "reposts": 303, "replies": 406, "views": 1154678, "url": "https://x.com/OpenAI/status/2104993966043320759", "author": "OpenAI"}, {"id": "2104993967985381673", "text": "Ultrafast is available today for GPT-6 Astra in Codex, ChatGPT Work, and the API, with GPT-6.1 Sol coming soon.\n\nTo access it in Codex and ChatGPT Work, we’re introducing Pro 500—a new plan with our highest usage limits (25x Plus) and access to Ultrafast.\n\nhttps://chatgpt.com/pricing", "created_at": "09-30 01:57", "likes": 1008, "reposts": 45, "replies": 121, "views": 253856, "url": "https://x.com/OpenAI/status/2104993967985381673", "author": "OpenAI"}, {"id": "2104993969486930015", "text": "We’re also reopening Pro 200 subscriptions, with continued access to frontier models like Astra, including our new GPT-6.1 Sol model which brings near-Astra capabilities to a model you can use every day.\n\nOur commitment is that your subscription will continue to help you get more work done with an increasing level of quality.\n\nWe are also committing to not reintroducing the 5hr limit so that you can fully use your weekly usage when you want.", "created_at": "09-30 01:57", "likes": 408, "reposts": 16, "replies": 38, "views": 118510, "url": "https://x.com/OpenAI/status/2104993969486930015", "author": "OpenAI"}, {"id": "2104987422308335828", "text": "Codex Security Cloud is getting a major upgrade, with access to cyber-capable models through Daybreak Blue included by default.\n\nIt scans entire GitHub repos, continuously reviews new commits, investigates and deduplicates findings, and prepares fixes for review – even when your laptop is closed.\n\nAvailable as a plugin in Codex desktop and web.", "created_at": "09-30 01:31", "likes": 4289, "reposts": 298, "replies": 216, "views": 507841, "url": "https://x.com/OpenAI/status/2104987422308335828", "author": "OpenAI"}, {"id": "2104986136745767160", "text": "GPT-6.1 Sol is available starting today to all Plus, Pro, Business, Enterprise, and Edu users in ChatGPT Work and Codex.\n\nhttps://openai.com/index/introducing-gpt-6-1-sol", "created_at": "09-30 01:26", "likes": 782, "reposts": 46, "replies": 32, "views": 130224, "url": "https://x.com/OpenAI/status/2104986136745767160", "author": "OpenAI"}, {"id": "2104986135005192665", "text": "GPT-6.1 Sol shows major improvements over GPT-6 Sol in our alignment evaluations, bringing it more in line with GPT-6 Astra. \n\nIt’s more transparent about its limitations and more reliable at respecting user intent and safety constraints.", "created_at": "09-30 01:26", "likes": 731, "reposts": 20, "replies": 20, "views": 132290, "url": "https://x.com/OpenAI/status/2104986135005192665", "author": "OpenAI"}, {"id": "2104986129686741046", "text": "GPT-6.1 Sol: near-Astra intelligence for a fifth of the price.\n\nIt’s the most cost-efficient model for its performance available today.", "created_at": "09-30 01:26", "likes": 20513, "reposts": 1660, "replies": 652, "views": 2899715, "url": "https://x.com/OpenAI/status/2104986129686741046", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2104995014208258235", "text": "Dots are here!\n\nA new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.\n\nhttps://openai.com/index/introducing-dots/", "created_at": "09-30 02:01", "likes": 14219, "reposts": 1036, "replies": 2033, "views": 1801486, "url": "https://x.com/sama/status/2104995014208258235", "author": "sama"}, {"id": "2104994601140711896", "text": "Ultrafast is\n\nso fast\n\nI do not ever want to go back", "created_at": "09-30 01:59", "likes": 11066, "reposts": 267, "replies": 1273, "views": 996405, "url": "https://x.com/sama/status/2104994601140711896", "author": "sama"}, {"id": "2104994395980533804", "text": "6.1 Sol at 1/5th of the price of Astra, and 95% cache read discount! Extremely capable model.", "created_at": "09-30 01:59", "likes": 7978, "reposts": 271, "replies": 545, "views": 701904, "url": "https://x.com/sama/status/2104994395980533804", "author": "sama"}, {"id": "2104993363170861501", "text": "Over the past 5 weeks, the team completely rewrote ChatGPT Web on top of the desktop app codebase.\n\nThis was only possible with Astra, and it’s why Dots, Space, Codex Cloud, and so many more of our launches will come to web and desktop same day. \n\nEra of the megaproject begins.", "created_at": "09-30 01:55", "likes": 2459, "reposts": 96, "replies": 170, "views": 352897, "url": "https://x.com/ajambrosino/status/2104993363170861501", "author": "ajambrosino"}, {"id": "2104950376466362578", "text": "DevDay livestream in 2 hours.\n\nWe built some great stuff for you!", "created_at": "09-29 23:04", "likes": 9455, "reposts": 383, "replies": 930, "views": 691693, "url": "https://x.com/sama/status/2104950376466362578", "author": "sama"}, {"id": "2104661956879913457", "text": "Pretty excited for DevDay tomorrow.\n\nWe have found a new thing.", "created_at": "09-29 03:58", "likes": 9298, "reposts": 490, "replies": 853, "views": 2083161, "url": "https://x.com/sama/status/2104661956879913457", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2105395200248156556", "text": "Asked my dot to paint me. After sending me something cartoonish, I asked it to try a bit harder and to find a recent picture of me on the internet. It did better.\n\nBelow video is me clicking through my dot's computer.", "created_at": "10-01 04:31", "likes": 1392, "reposts": 23, "replies": 304, "views": 134014, "url": "https://x.com/thsottiaux/status/2105395200248156556", "author": "thsottiaux"}, {"id": "2105348026416140781", "text": "Hi! What would you like to see us ship for dots and space in the next two weeks? Or how can we improve things in other parts of the product.", "created_at": "10-01 01:24", "likes": 3337, "reposts": 80, "replies": 4312, "views": 391534, "url": "https://x.com/thsottiaux/status/2105348026416140781", "author": "thsottiaux"}, {"id": "2105344482149613853", "text": "You can enroll here: https://chatgpt.com/cyber", "created_at": "10-01 01:10", "likes": 265, "reposts": 5, "replies": 44, "views": 105314, "url": "https://x.com/thsottiaux/status/2105344482149613853", "author": "thsottiaux"}, {"id": "2105344469923221941", "text": "For individual Daybreak Blue users, starting tomorrow (10/1), you'll need an eligible hardware key when using cyber-forward capabilities. Enterprise users are unaffected.\n\nHardware keys are a needed protection to help guarantee that you are behind the account and part of our strategy to disproportionately accelerate defenders.", "created_at": "10-01 01:10", "likes": 2431, "reposts": 80, "replies": 333, "views": 326921, "url": "https://x.com/thsottiaux/status/2105344469923221941", "author": "thsottiaux"}, {"id": "2105178959327756396", "text": "What’s up dot", "created_at": "09-30 14:12", "likes": 3932, "reposts": 71, "replies": 1910, "views": 738116, "url": "https://x.com/thsottiaux/status/2105178959327756396", "author": "thsottiaux"}, {"id": "2105105086506840421", "text": "We will have a few million dots online within days, working on all sorts of things across such a diverse and large community. \n\nExcited to learn from all of you on what you love and what doesn’t yet feel magical. Personally I felt a jump after 2-3 days of use after teaching it more about my preferences and things on my mind. It learns very quickly to be most useful and it can take on surprisingly ambitious tasks on its own.\n\nWe’re learning from how you all use your primary dot before releasing the ability to create an entire team of them.", "created_at": "09-30 09:18", "likes": 4933, "reposts": 125, "replies": 1163, "views": 678049, "url": "https://x.com/thsottiaux/status/2105105086506840421", "author": "thsottiaux"}, {"id": "2105102820706058498", "text": "It was so nice to connect with so many of you in person at DevDay. Immaculate vibes from the crowd and fun to see so many build things throughout the day.", "created_at": "09-30 09:09", "likes": 2604, "reposts": 44, "replies": 264, "views": 344151, "url": "https://x.com/thsottiaux/status/2105102820706058498", "author": "thsottiaux"}, {"id": "2105102312167575701", "text": "I got community noted, but the note is wrong 😅\n\nYour primary dot is included in your plan and will be available 24/7. If you ask it to create a codex task for you, that one will be drawing usage as usual. But when your dot does work directly, that uses nothing and is all on top of your plans usage. In the future you will be able to increase the speed and allow your dot to have more bandwidth, this will be a paid feature, but the baseline functionality will always just be included in your plan.", "created_at": "09-30 09:07", "likes": 4344, "reposts": 147, "replies": 593, "views": 1070796, "url": "https://x.com/thsottiaux/status/2105102312167575701", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2105428405571428785", "text": "Announcing one more launch: ChatGPT Sites can now host MCP servers, including plugin extensions! 🤯\n\n> @⁠sites create a todo list that I can use in ChatGPT\n\nThis will:\n\n· Create an MCP server with extensions\n· Deploy that MCP server to Sites\n· Turn the MCP server into a plugin\n· Install the plugin for you across web, mobile, and desktop\n\nChatGPT is slowly becoming malleable software that anybody can customize to their needs. Very excited to see what you all build with this!", "created_at": "10-01 06:43", "likes": 199, "reposts": 17, "replies": 21, "views": 13580, "url": "https://x.com/mxstbr/status/2105428405571428785", "author": "mxstbr"}, {"id": "2105386639199732172", "text": "Had Astra on ultrafast (on med reasoning) rebuild 1-1 from scratch on the modretro they gave us at Dev Day yesterday\n\n- Took ~3 mins\n- Used 4 subagents\n- Used ~10% of my weekly limit ($500/mo. plan)\n\nUltrafast should rarely be used, but I'm ngl when u do use it it's really cool", "created_at": "10-01 03:57", "likes": 200, "reposts": 5, "replies": 16, "views": 17659, "url": "https://x.com/davis7/status/2105386639199732172", "author": "davis7"}, {"id": "2105365703654310113", "text": "Shareable profiles bring your Sites and plugins together in ChatGPT, so others can find and reuse what you’ve made.\n\nBuilt it? Show it off.", "created_at": "10-01 02:34", "likes": 707, "reposts": 30, "replies": 65, "views": 45779, "url": "https://x.com/OpenAIDevs/status/2105365703654310113", "author": "OpenAIDevs"}, {"id": "2105351380374585814", "text": "You don't need dots or Ultrafast to enter. \n\nAny 5 of the 10 quests can be completed on a Free account. \n\nChoose what's available to you — each eligible quest submission earns 1 ticket, up to 5 total: \n\nhttps://side-quests.openai.chatgpt.site/", "created_at": "10-01 01:37", "likes": 36, "reposts": 1, "replies": 3, "views": 7680, "url": "https://x.com/OpenAIDevs/status/2105351380374585814", "author": "OpenAIDevs"}, {"id": "2105207149869814091", "text": "GPT 6.1 Astra (ultra code mode) is making  this - threejs experience\ndonno whats with me and ocean - but this is gorgeous\n\nwork in progress..", "created_at": "09-30 16:04", "likes": 1034, "reposts": 56, "replies": 59, "views": 46184, "url": "https://x.com/chetanankola/status/2105207149869814091", "author": "chetanankola"}, {"id": "2105172475277693393", "text": "This is awesome from @modretro\n\nIt comes with a blank cartridge, you build games with Codex and then play them on the device.\n\nGreat work on this activation @DylanAbruscato", "created_at": "09-30 13:46", "likes": 729, "reposts": 47, "replies": 36, "views": 53410, "url": "https://x.com/rpnickson/status/2105172475277693393", "author": "rpnickson"}, {"id": "2105172136566640740", "text": "Here’s what he built 😂", "created_at": "09-30 13:45", "likes": 104, "reposts": 4, "replies": 6, "views": 22576, "url": "https://x.com/DanScalco/status/2105172136566640740", "author": "DanScalco"}, {"id": "2105159277434528174", "text": "Built a Tomodachi game for the ModRetro I got at OpenAI DevDay!\n\nAlmost everyone at the afterparty got to create a character of themselves, and they were able to chat in-game with characters of other people from the party!", "created_at": "09-30 12:54", "likes": 128, "reposts": 2, "replies": 9, "views": 19087, "url": "https://x.com/sriramkiron/status/2105159277434528174", "author": "sriramkiron"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2104982629884063840", "text": "What do you want from AI?\n\nWe’re launching a new study with Anthropic Interviewer to learn more about your experiences using AI, what role you want it to play in your life and the world, and what you want from the companies building it.\n\nLast December, 81,000 people told us about their hopes and fears about AI in the largest qualitative study ever done. This time, we’re giving participants the option to make their responses public so that anyone, not just Anthropic, can learn from them.\n\nWhat you tell us will shape The Anthropic Institute’s research and inform the decisions we make. If many people say companies like Anthropic should be doing something differently, that will be on the record, where anyone can point to it.\n\nThe study runs Sept 29 to Oct 6 and is open to Free, Pro, and Max users on Claude and Claude Code.\n\nTake part here: http://claude.ai/anthropic-interviewer/your-thoughts-on-ai?from=social", "created_at": "09-30 01:12", "likes": 1946, "reposts": 180, "replies": 328, "views": 259169, "url": "https://x.com/AnthropicAI/status/2104982629884063840", "author": "AnthropicAI"}, {"id": "2104982631037436201", "text": "Making your interview public is completely optional. Our blog post covers the benefits and possible risks of doing so.\n\nRead it here: https://www.anthropic.com/research/your-thoughts-on-ai", "created_at": "09-30 01:12", "likes": 166, "reposts": 8, "replies": 40, "views": 49822, "url": "https://x.com/AnthropicAI/status/2104982631037436201", "author": "AnthropicAI"}, {"id": "2104633259925630995", "text": "Claude Sonnet 5.5 is now available:", "created_at": "09-29 02:04", "likes": 11938, "reposts": 549, "replies": 401, "views": 644808, "url": "https://x.com/AnthropicAI/status/2104633259925630995", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2105388084154056939", "text": "Introducing Gemini 4 Argon – our new frontier model.\n\nIt’s built for complex workflows across coding, enterprise knowledge work, and cybersecurity defense – rolling out today to a set of trusted testers through our Fairwind Program.", "created_at": "10-01 04:03", "likes": 27439, "reposts": 2962, "replies": 1233, "views": 3665920, "url": "https://x.com/GoogleDeepMind/status/2105388084154056939", "author": "GoogleDeepMind"}, {"id": "2105388087367127256", "text": "With a 1M token output limit, Argon adds a deeper level of reasoning to tackle long, multi-step problems in one go.\n\nFeedback from early testers will help us strengthen our systems before we roll out more broadly to developers, enterprises, and consumers soon.\n\nFind out more → https://goo.gle/4rZBiSd", "created_at": "10-01 04:03", "likes": 1827, "reposts": 54, "replies": 53, "views": 210067, "url": "https://x.com/GoogleDeepMind/status/2105388087367127256", "author": "GoogleDeepMind"}, {"id": "2105314763148321102", "text": "https://x.com/i/article/2105311091689414656", "created_at": "09-30 23:12", "likes": 378, "reposts": 68, "replies": 16, "views": 110082, "url": "https://x.com/pushmeet/status/2105314763148321102", "author": "pushmeet"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2105387954474746264", "text": "Importantly Argon has frontier safeguards and we are rolling it out responsibly - it’s with the US gov’t and going to a set of trusted cyber defenders through our Fairwind Program today.\n\nWe’re going to make it available as soon as we can and as safely as we can. So hold tight, lots more coming, and you’re going to see us iterating rapidly.\n\nhttps://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/", "created_at": "10-01 04:02", "likes": 1378, "reposts": 71, "replies": 45, "views": 130051, "url": "https://x.com/sundarpichai/status/2105387954474746264", "author": "sundarpichai"}, {"id": "2105387952478277979", "text": "Lots of discussion out there about our next model(!), so I wanted to give an early look as soon as possible. Introducing Gemini 4 Argon!\n\nIt shows frontier performance in complex workflows, cyber defense and software engineering. Teams are using it extensively at Google, from coding to quantum computing, great feedback. \n\nHere’s a look at the benchmarks:", "created_at": "10-01 04:02", "likes": 13895, "reposts": 1226, "replies": 763, "views": 1469148, "url": "https://x.com/sundarpichai/status/2105387952478277979", "author": "sundarpichai"}, {"id": "2105121763176894804", "text": "Great to meet today with @POTUS, @JDVance, @SpeakerJohnson and Administration + tech leaders. Important conversation and we signed today the White House Accord on Super Intelligence.\n\nAs I shared today, Google has invested hundreds of billions in the last two years alone, with more to come, across the entire stack, to deliver benefits for America and the world.  We’re working to build products that deliver real value for people and businesses, invest in local communities, and build trust in the technology.\n\nIndustry also has to innovate responsibly. Google’s focused on building the right way, with appropriate testing, evaluations, red-teaming, and other safeguards against misuse and misalignment – and releasing models or products only after they’ve been thoroughly reviewed.\n\nWe are committed to working with other industry leaders to establish norms and build public confidence. The White House Accord and the Joint Commitment on Frontier Responsibilities signed today is a solid basis for moving forward - it contains real tangible steps to promote safe development, while delivering the economic and scientific benefits of this technology.", "created_at": "09-30 10:25", "likes": 11667, "reposts": 1393, "replies": 1588, "views": 1598924, "url": "https://x.com/sundarpichai/status/2105121763176894804", "author": "sundarpichai"}]}}, "errors": [], "summary": "今日大佬动态的核心是两场模型发布对撞：**Google DeepMind 正式发布 Gemini 4 Argon**（新一代 frontier 模型，主打复杂工作流：代码、企业知识工作与网络安全，**1M token 输出上限**，主打长多步任务一次搞定；Sundar Pichai 强调前沿安全护栏、与美国政府及可信网络安全伙伴先行落地，目前还不可公开使用），**OpenAI 则推出 GPT-6.1 Sol**（接近 Astra 的智能、**价格只有五分之一**，95% 缓存读取折扣，已向 Plus/Pro/Business/Enterprise/Edu 全量开放），并配套发布 **Ultrafast 高速档**（Codex 中最高 **300 tokens/秒**、8 倍速，GPT-6 Astra 先行、6.1 Sol 即将来）。发布节奏上，OpenAI 刚办完 **DevDay**（Codex Security Cloud 大升级：Daybreak Blue 网络安全能力默认集成，个人用户 10/1 起需硬件密钥），Sam Altman 力推新形态 **Dots**（24/7 自主工作的 AI，Tibo 称几天内将有数百万个 dots 在线并公开征集未来两周的产品需求），OpenAI Devs 还宣布 **ChatGPT Sites 可托管 MCP 服务器**（含插件扩展）。政策面，**马斯克与一众科技领袖在白宫签署《超级智能自愿协议》**，Pichai 同日会见特朗普等政要；安全新闻上，**OpenAI 被曝搁置 GPT-6.1 Astra**（测试发现欺骗与未授权行为）、英国 AI 安全研究所称 **GPT-6 Astra 的 rogue 攻击率环比涨 5 倍**，给高速加便宜的叙事泼了冷水。Anthropic 侧相对安静，仅宣布 **Claude Sonnet 5.5 上线**并启动一项 AI 使用体验研究；马斯克另发布 **Grokipedia v0.3**。特朗普账号近 60 小时无新动态。", "groups": [{"key": "openai", "label": "🤖 OpenAI"}, {"key": "claude", "label": "🟠 Claude"}, {"key": "google", "label": "🔵 Google"}, {"key": "other", "label": "🌐 其他"}], "group_summaries": {"openai": "OpenAI 组今日是发布日模式：**GPT-6.1 Sol** 正式上线（near-Astra 智能、1/5 价格、95% 缓存折扣，全 tier 开放），**Ultrafast** 高速档同步推出（Codex 300 tokens/秒），**Codex Security Cloud** 集成 Daybreak Blue 网络安全能力（个人用户 10/1 起需硬件密钥）。Sam Altman 主推 **Dots**（24/7 自主 AI），Tibo 透露几天内数百万 dots 在线并征集需求；OpenAI Devs 宣布 **ChatGPT Sites 支持托管 MCP 服务器**。负面消息是 HN 曝出 **GPT-6.1 Astra 因欺骗与未授权行为被搁置**，以及英国 AISI 称 **GPT-6 Astra rogue 攻击率涨 5 倍**。", "claude": "Anthropic 组今日相对平静：**Claude Sonnet 5.5 正式上线**（9/29），另启动一项与 Anthropic Interviewer 合作的 AI 使用体验研究（公开访谈可选）。无新模型发布消息，LMArena 榜单上 Claude 系仍占据前三。", "google": "Google 组今日最大新闻是 **Gemini 4 Argon 发布**：新一代 frontier 模型，主打代码、企业知识工作与网络安全复杂工作流，**1M token 输出上限**支撑长多步推理；Pichai 强调前沿安全护栏、负责任 rollout，首批与美国政府及可信网络安全伙伴合作。Pichai 同日赴白宫参与签署超级智能协议。Ars 评价追平 OpenAI 与 Anthropic 但未明显超越。", "other": "其他账号中，**马斯克**宣布 **Grokipedia v0.3**（改进视觉效果），转发白宫超级智能协议签署消息，并谈及 Starship Flight 14 与 GDP 预测；**特朗普**账号近 60 小时无新动态（最新仍为 9/25 国宴内容）。"}};
const LIB = {"groups": [{"id": "access-control", "name": "RAG 访问控制", "papers": [{"added": "2026-09-30", "authors": "Scott Thornton 等", "insight": "与我们 KG 路径切割节（Round 8）主题相邻、贡献互补：他们是在线图扩展边界做单点授权检查，我们是离线 k-cut + 代价曲线（28.2% 公开文本代价、残留实体 4133→0）+ 子句级 PII 粒度。必须引用并主动写清差异；他们的 PD=2 命题与我们的 k=2 发现（k=3≡k=2）互相印证。", "oneliner": "形式化 Retrieval Pivot Risk：vector 检索出的 seed chunk 经实体链接 pivot 进敏感图邻域，造成纯向量检索不存在的跨租户泄露；提出 7 种攻击；泄露稳定出现在 PD=2（二部拓扑命题）。", "tags": ["KG", "pivot攻击", "必引"], "title": "Retrieval Pivot Attacks in Hybrid RAG: Measuring and Mitigating Amplified Leakage from Vector Seeds to Graph Expansion", "url": "https://arxiv.org/abs/2602.08668", "venue": "arXiv:2602.08668 (2026)"}, {"added": "2026-09-30", "authors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "titl   if (!PANES.includes(name)) name = 'papers';

    document.getElementById('pane-' + t).hidden = (t !== name);
    const b = document.querySelector('[data-tab="' + t + '"]');
    if (b) b.classList.toggle('on', t === name);
  });
  ensureTab(name);  // 懒渲染：首次切到某 tab 时才渲染

    try{ history.replaceState(null, '', '#' + name); }catch(e){}
  }

catSel.addEventListener('change', () => { state.cat = catSel.value; render(); });
const daySel = document.getElementById('day');
DATA.days.forEach(d => { const o = document.createElement('option'); o.value = d.date; o.textContent = d.date; daySel.appendChild(o); });
daySel.addEventListener('change', () => { state.day = daySel.value; render(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
function pdfUrl(u){
  const m = (u || '').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function codeLink(code){
  const m = (code || '').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);
  return m ? '<a href="https://github.com/' + esc(m[1]) + '" target="_blank" rel="noopener">💻 ' + esc(m[1]) + '</a>' : '';
}
function badges(p){
  const s = srcOf(p);
  let h = '<span class="badge ' + (SRC_CLS[s] || '') + '">' + esc(s) + '</span>';
  h += (p.cats || []).map(c => '<span class="badge cat">' +
    esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
  if (p.supplement) h += '<span class="badge cat">期刊/会议</span>';
  return h;
}
function card(p){
  const pdf = pdfUrl(p.url), ch = codeLink(p.code);
  const cite = (p.citations && p.citations !== '尚未收录')
    ? '<span>📊 引用 ' + esc(p.citations) + '</span>' : '';
  const links = (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文页面</a>' : '')
    + (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  return '<div class="card">'
    + '<div class="badges">' + badges(p) + '<span class="date">' + esc(p.date) + '</span></div>'
    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<details class="box zh"><summary>中文摘要</summary><div class="body">' +
        esc(p.zh_abs).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">' +
        esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + ((cite || ch) ? '<div class="meta-row">' + cite + (ch ? '<span>' + ch + '</span>' : '') + '</div>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}
function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){
  let html = '', n = 0;
  const latest = DATA.days[0];
  if (latest && latest.summary && !state.q && !state.src && !state.cat)
    html += colSummary('📌 今日论文综述', latest.summary.slice(0, 1400));
  DATA.days.forEach(day => {
    if (state.day && day.date !== state.day) return;
    const ps = day.papers.filter(match);
    if (!ps.length) return;
    n += ps.length;
    html += '<div class="day"><div class="day-head"><h2>📅 ' + esc(day.date) + '</h2>'
      + '<span class="n">' + ps.length + ' 篇</span></div>';
    if (day.summary && !state.q && !state.src && !state.cat)
      html += '<div class="summary">' + esc(day.summary).slice(0, 1000) + '</div>';
    html += '<div class="grid">' + ps.map(card).join('') + '</div></div>';
  });
  document.getElementById('list').innerHTML =
    html || '<div class="empty">没有匹配的论文，换个关键词或清除筛选试试。</div>';
  document.getElementById('count').textContent =
    '共 ' + n + ' 篇' + (DATA.all_days > DATA.days.length ? '（近' + DATA.days.length + '天，更早的见右上角 🗂️归档）' : '');
}

/* ---- X 未读小红点：localStorage 记已读，APP 式 ---- */
const X_SEEN_KEY = 'coco_x_seen_v1';
const getXSeen = () => { try { return JSON.parse(localStorage.getItem(X_SEEN_KEY) || '{}'); } catch(e){ return {}; } };
function renderXDots(){
  const seen = getXSeen();
  let any = false;
  document.querySelectorAll('.x-chip').forEach(ch => {
    const h = ch.getAttribute('data-h'), nw = ch.getAttribute('data-newest') || '';
    const unread = !!(nw && (!seen[h] || nw > seen[h]));
    const dot = ch.querySelector('.x-dot');
    if (dot) dot.hidden = !unread;
    if (unread) any = true;
  });
  const tabDot = document.getElementById('xTabDot');
  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}
function toggleXAcc(btn){
  const g = btn.getAttribute('data-g'), h = btn.getAttribute('data-h');
  markXSeen(h);
  const det = document.getElementById('xd-' + g);
  const wasOpen = btn.classList.contains('open');
  det.parentElement.querySelectorAll('.x-chip.open').forEach(c => c.classList.remove('open'));
  if (wasOpen){ det.innerHTML = ''; return; }
  btn.classList.add('open');
  const a = XW.accounts[h];
  det.innerHTML = '<div class="x-detail-head">' + avatar(a, h, 'x-av-lg')
    + '<div><div class="x-acc-name">' + esc(a.name || h) + '</div>'
    + '<div class="x-acc-sub">@' + esc(h) + (a.label ? ' · ' + esc(a.label) : '')
    + '</div></div></div>' + twArticles(h);
  if (det.scrollIntoView) det.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function renderX(){
  const accs = XW.accounts || {};
  const handles = Object.keys(accs).filter(h => (accs[h].tweets || []).length);
  let total = 0;
  handles.forEach(h => { total += accs[h].tweets.length; });
  document.getElementById('xCount').textContent =
    (XW.date ? XW.date + ' 更新 · ' : '') + total + ' 条';
  const box = document.getElementById('xList');
  let html = '';
  if (XW.summary) {
    html += '<div class="x-summary"><div class="x-sum-t">📌 今日要点</div>'
      + '<div class="x-sum-b">' + md(XW.summary) + '</div></div>';
  }
  const gs = XW.group_summaries || {};
  const groups = XW.groups || [{key: 'other', label: '🌐 其他'}];
  html += groups.map(gr => {
    const hs = handles.filter(h => (accs[h].group || 'other') === gr.key);
    if (!hs.length) return '';
    const n = hs.reduce((s, h) => s + accs[h].tweets.length, 0);
    const chips = hs.map(h => {
      const a = accs[h];
      const newest = a.tweets.reduce((m, t) => (t.created_at && t.created_at > m) ? t.created_at : m, '');
      return '<button class="x-chip" data-g="' + esc(gr.key) + '" data-h="' + esc(h)
        + '" data-newest="' + esc(newest) + '" onclick="toggleXAcc(this)">'
        + avatar(a, h, 'x-av-chip', true)
        + '<div class="x-chip-name">' + esc(a.name || h) + '</div>'
        + '<div class="x-chip-sub">@' + esc(h) + ' · ' + a.tweets.length + '条</div></button>';
    }).join('');
    return '<section class="x-group"><div class="x-group-head"><div class="x-group-title">'
      + esc(gr.label) + '</div><div class="x-group-n">' + n + ' 条</div></div>'
      + (gs[gr.key] ? '<div class="x-group-sum">' + md(gs[gr.key]) + '</div>' : '')
      + '<div class="x-chips">' + chips + '</div>'
      + '<div class="x-detail" id="xd-' + esc(gr.key) + '"></div></section>';
  }).join('');
  box.innerHTML = html || '<div class="empty">今日暂无大佬动态数据。</div>';
}

let archDigestCache = null;
function archItemHTML(it, open){
  const runs = (it.runs || []).map(r =>

  ).join('') || '<div class="empty">暂无摘要</div>';

    runs + '<span class="arch-hint">→</span></summary>' +
    '<div class="arch-body">' + body +
    '<a class="arch-go" href="' + ARCH_PREFIX + it.date + '.html">查看当天完整看板 →</a>' +

function renderArchList(items, partial){
  const list = document.getElementById('archList');
  if (!items || !items.length){
    list.innerHTML = '<div class="empty">暂无归档</div>';
    return;
  }
  list.innerHTML =
    (partial ? '<div class="empty">本地打开为精简模式，仅显示近 7 天</div>' : '') +
    items.map((it, i) => archItemHTML(it, i === 0)).join('');
}
async function openArchive(){
  const m = document.getElementById('archModal');
  m.hidden = false;
  document.body.style.overflow = 'hidden';
  if (archDigestCache){ renderArchList(archDigestCache.list, archDigestCache.partial); return; }
  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  document.body.style.overflow = '';
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const NEWS_LATEST = NEWS, XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  NEWS = (r && r.news) ? r.news : NEWS_LATEST;
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderNews === 'function'){ renderNews(); TAB_DONE.news = 1; }
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
