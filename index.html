const INT = {"interests": [{"id": "rag-access-control", "items": [{"title": "IAMRAGBENCH: Benchmarking Authorization Expansions in LLM-Generated AWS IAM Policies under RAG Poisoning", "url": "https://arxiv.org/abs/2611.03431", "kind": "paper", "date": "2026-11-02", "why": "首个针对“RAG 投毒导致生成的 IAM 策略越权”的基准：60 个带授权包络的案例，投毒文档诱使模型删掉租户隔离条件；评估对象是生成的授权代码本身，与 ChainBind 的执行时授权绑定思路互补。"}, {"title": "Isolation Is Not Confidentiality: Security Boundaries of Geometric Access Control in RAG", "url": "https://arxiv.org/abs/2611.14061", "kind": "paper", "date": "2026-11-10", "why": "几何访问控制方向的关键分析：把授权直接编码进 embedding 几何变换的做法能保检索效用与策略隔离，但对齐观测下变换可被学出来、原始 embedding 可恢复、策略成员关系会泄露；“隔离不等于保密”的结论直接对应我们“只裁剪文本不够、必须按授权视图重编码”的论证。"}, {"title": "RAG Pipeline Utils v3.8.2: Security Fixes and a Re-ingest Check", "url": "https://devilsdev.github.io/rag-pipeline-utils/blog/v3-8-2-release", "kind": "news", "date": "2026-11-09", "why": "补完 3.8.1 的 RetrievalGuard 绕过修复：顶层 acl/requiredRole 在 Qdrant/Pinecone/Weaviate/PgVector 四家检索器里会被漏放给无权限用户（GHSA-234f-v76m-p9wc），是 RAG 访问控制绕过的真实案例。"}, {"title": "RAG Pipeline Utils v3.8.1：修复 RetrievalGuard 访问控制绕过漏洞", "url": "https://dev.to/devildev/rag-pipeline-utils-v381-3pl2", "kind": "news", "date": "2026-11-07", "why": "一次真实的 RAG 访问控制失效案例：角色受限文档可能被无该角色的用户拿到（GHSA-8393-cmg7-9rv3），修复后 RetrievalGuard 要求满足文档设定的全部限制条件；与我们“授权必须在检索时求值”的主张直接呼应。"}, {"title": "RAG Security Enters the Spotlight, but the Real Risk Is Hidden in the Pipeline", "url": "https://netcrook.com/written_article?slug=rag-security-hidden-risks-in-the-pipeline&lang=en", "kind": "news", "date": "2026-10-21", "why": "论述 RAG 安全风险决定于文档采集、访问控制、来源校验等管线环节而非模型本身，与检索授权管线治理主题直接相关。"}, {"title": "Progress Software Connects Enterprise Knowledge Across Business Systems with New Agentic RAG Capabilities", "url": "https://usanewshour.com/progress-software-connects-enterprise-knowledge-across-business-systems-with-new-agentic-rag-capabilities/394126/", "kind": "news", "date": "2026-10-02", "why": "Progress 新版 Agentic RAG 强调跨业务系统问答时沿用已有索引内容的访问控制与治理框架、无需重建索引——企业级 RAG「权限延续」的产品案例，与 RU/AU「权限随数据、检索时强制执行」思路同向。"}, {"title": "Dify 1.17.1 Strengthens Knowledge Base Security and Fixes Critical RAG Data Corruption Bugs", "url": "https://undercodenews.com/dify-1171-strengthens-knowledge-base-security-and-fixes-critical-rag-data-corruption-bugs-video/", "kind": "news", "date": "2026-10-01", "why": "Dify 知识库 API key 终于支持绑定到单个 dataset：此前一个 key 可访问 workspace 内所有知识库，1.17.1 起可收窄作用域——“授权粒度下沉到数据对象”的产品实例，与 RU/AU 细粒度思想同向。"}, {"title": "CodePoisonRAG: knowledge poisoning attacks on retrieval-augmented code generation", "url": "https://adversa.ai/blog/top-ai-coding-agent-security-resources-october-2026/", "kind": "news", "date": "2026-10-04", "why": "检索投毒实证：85 个投毒代码制品跨 10 类漏洞在 3 个代码生成器上达到 0.80–0.93 成功率，且制品\"保持任务相关性+伪造安全声明\"——与我们关注的检索阶段攻击面直接相关，可作 RAG 安全防御的引用弹药。"}, {"title": "FramePoison: attacks on medical RAG that target framing, not just facts", "url": "https://www.nature.com/articles/s44387-026-00163-6", "kind": "paper", "date": "2026-10-07", "why": "检索投毒的新维度：不换事实、换“表述框架”——3 个生物医学语料、5 个开放权重模型上，每问题投 5 篇文档即有 ≥3 篇进 top-5，1–2 篇就足以翻转答案。说明 RAG 授权不能只验内容是否“事实正确”，表述层的影响也应进入授权/执行语义的考量，可作我们论文攻击面讨论的引用。"}, {"title": "IBM FTM 曝未授权 RAG 投毒漏洞 CVE-2026-18875（CVSS 7.3）：毒化向量库可劫持 MCP 工具调用", "url": "https://forkast.news/unauthenticated-rag-poisoning-in-ibm-financial-transaction-manager-exposes-mcp-tool-calls-to-hijacking/", "kind": "news", "date": "2026-10-12", "why": "IBM Financial Transaction Manager 的 AI agent 服务器允许未授权攻击者向上游 runbook 向量库写入恶意内容，毒化后的检索上下文进而操纵 MCP 工具调用、执行未授权支付动作。这是“检索投毒→工具调用劫持”的完整生产案例链：检索完整性失效直接转化为执行侧越权，正好落在我们的 T3（全知识对手）与 agent 授权线的交叉点上。"}, {"title": "Protecto：RAG 流水线的数据政策——在 ingestion 与 retrieval 两处设防（厂商博客）", "url": "https://www.protecto.ai/blog/data-policy-in-the-rag-pipeline-stop-30-years-of-exposure/", "kind": "news", "date": "2026-10-12", "why": "厂商博客，观点可取：索引级访问控制不够，因为“查询索引的 agent 都是已授权的”，问题在返回什么、之后发生什么；主张 ingestion 时脱敏（保留语义去标识）+ retrieval 后按请求者/任务施加策略。思路与我们 retrieve-then-project 同构，但它是工程产品文案，无形式化结果，仅作思路参照。"}, {"title": "genai-tk 设计调查：Agentic RAG 的访问控制（pre-retrieval 过滤 + 确定性强制执行）", "url": "https://github.com/tclatos/genai-tk/blob/HEAD/docs/studies/access_control_agentic_rag.md", "kind": "repo", "date": "2026-10-09", "why": "Agent 型 RAG 系统的访问控制设计调查：主张授权必须在 LLM 看到上下文之前（pre-retrieval）完成，post-retrieval 过滤不充分（缓存/流式缓冲/观测链路仍可泄露），强制执行必须是确定性的而非 prompt 式的——与我们 RU/AU“查询时逐 AU 求值、确定性策略”的设计哲学一致。"}, {"title": "Document-Level Access Control In RAG: Stop Vector DB Leaks", "url": "https://vertexfrontier.com/document-level-access-control-in-rag/", "kind": "news", "date": "2026-10-11", "why": "实务指南：RAG 文档级访问控制——chunk 必须携带稳定的 document_id 以便删除/改权限时全量定位，且“决策”要与“请求”分开记录（能证明实际执行了什么，而不只是问了什么）——与我们 M(r) 覆盖映射和审计日志的要求呼应。"}, {"title": "authzed/examples：agentic-rag-authorization（SpiceDB 文档级授权示例）", "url": "https://github.com/authzed/examples/blob/HEAD/agentic-rag-authorization/README.md", "kind": "repo", "date": "2026-10-08", "why": "SpiceDB 做的 agentic RAG 文档级授权示例：retrieve→authorize→generate 三段式确定性边界（agent 无法绕过），50 文档/4 种权限模式——是我们 per-view 索引执行语义的工程对照实现。"}, {"title": "Vector Access Control Leaks: Why Post-Retrieval Filtering is a Security Lie", "url": "https://dev.to/asifmiqbal/vector-access-control-leaks-why-post-retrieval-filtering-is-a-security-lie-1gh7", "kind": "news", "date": "2026-10-16", "why": "直指检索后过滤是安全谎言：未授权 chunk 先进应用内存再过滤，多步 agent 管道中会污染上下文与遥测日志；主张查询时把用户签名的 JWT 权限 join 进向量检索——与我们 chunk 只存覆盖映射 M(r)、查询时逐 AU 求值的设计同构，可作工程侧论据。"}, {"title": "RAG with Permissions (Supabase Docs)", "url": "https://supabase.com/docs/guides/ai/rag-with-permissions", "kind": "news", "date": "2026-10-19", "why": "Supabase 官方文档（昨日更新）：用 Postgres Row Level Security 在 pgvector 检索层做细粒度访问控制、pre-retrieval 过滤，是 AU 思想在向量数据库层的工程实现参考。"}, {"title": "RAG vs Fine-Tuning Security: Two Data Paths, Two Control Plans", "url": "https://www.deepinspect.ai/blog/rag-vs-fine-tuning-security", "kind": "news", "date": "2026-10-22", "why": "明确指出 RAG 可在每次查询时对用户/租户强制权限（corpus 外置于模型），而微调把权限混进权重后无法重建——这正是我们论文\"检索时逐 AU 求值、策略独立于模型\"立场的独立佐证；另提出\"响应过滤发生在未授权 chunk 已越过模型边界之后\"，与我们对 post-retrieval 过滤的批评同构。"}, {"title": "Building Permission-Aware RAG Caching on AWS", "url": "https://medium.com/@tolghn/building-permission-aware-rag-caching-on-aws-5cf998722bbf", "kind": "news", "date": "2026-10-21", "why": "实测演示：缓存命中前重查 DynamoDB 权限快照，撤权后同一问题自动返回公开版答案；tenant_id/用户 ID 都做不好这个——缓存键必须绑定\"权限视图\"。这是我们 M(r) 权限撤销传播问题在缓存层的具体实例，含 Terraform/Lambda 可复现代码。"}, {"title": "RAG Security: Data Governance Failures in Enterprise Deployments（Nightfall AI 2026 审计：45 家企业 RAG 部署中 71% 无 chunk 级访问控制）", "url": "https://nohack.net/retrieval-augmented-generation-security-enterprise/", "kind": "news", "date": "2026-10-24", "why": "第三方审计给出硬数字：71% 的企业 RAG 部署没有 chunk 级访问控制——正是我们论文要解决的\"检索层无授权\"问题的行业现状证据，可作 motivation 引用。"}, {"title": "AI Gateway Exploitation: LiteLLM, RAGFlow, Kestra Hit（AI 网关应被视为 Tier-0 基础设施）", "url": "https://brandefense.io/blog/ai-gateway-exploitation-litellm-ragflow-kestra/", "kind": "news", "date": "2026-10-24", "why": "LiteLLM/RAGFlow/Kestra 网关被攻陷可导致全量 provider 凭证与向量库访问权泄露；报告建议把 AI 网关当作 Tier-0 基础设施（等同身份提供商）防护——与我们\"检索授权是基础设施层问题\"的立场一致。"}, {"title": "RAG Security: Protecting Retrieval-Augmented Generation Systems（68% 的 RAG 部署缺乏检索层 AuthZ）", "url": "https://hackersonlineclub.com/rag-security/", "kind": "news", "date": "2026-10-24", "why": "给出 RAG 全管线攻击面地图（注入/越权/投毒/检索操纵/外泄/供应链），其中\"68% 部署缺乏检索层 AuthZ\"与 Nightfall 的 71% 互相印证，可作行业现状双证据。"}, {"title": "Your RAG System Can Be Correct — and Still Leak Confidential Data", "url": "https://medium.com/@alinasir1596/your-rag-system-can-be-correct-and-still-leak-confidential-data-decb0c47e87e", "kind": "news", "date": "2026-11-04", "why": "从业者文章直指 RAG 访问控制的核心命题：检索要同时通过“相关性”与“是否有权看”两道检验；源系统权限在切块、索引、缓存、摘要后并不自动存续，告诉模型“不要泄露机密”修不好已经送错内容的管线。文中为假设案例而非真实事件，引用时需注明。"}, {"title": "The Scariest Bug in Enterprise RAG Isn't Hallucination. It's Cross-Tenant Leakage.", "url": "https://chaitanyagaur7.medium.com/the-scariest-bug-in-enterprise-rag-isnt-hallucination-it-s-cross-tenant-leakage-784d8b69c82a", "kind": "news", "date": "2026-11-02", "why": "与我们论文的论点直接呼应：提示词护栏不是授权，授权必须落在数据通路里；并给出跨租户泄露的成因与实操检查清单。"}, {"title": "Securing Locally Deployed LLM-RAG Assistants: A Cross-Model and Cross-Lingual Evaluation of Indirect Prompt Injection Defenses", "url": "https://www.mdpi.com/2076-3417/16/21/11039", "kind": "paper", "date": "2026-11-07", "why": "本地部署 LLM-RAG 助手上四类间接提示注入攻击与五种防御的实测：确定性后生成过滤把 ASR 从 70.4% 降至 22.2%，为“确定性防线优于模型临场判断”提供新数据。"}, {"title": "Six retrieval decisions behind a RAG agent that must not leak", "url": "https://medium.com/@mohammed.tue/six-retrieval-decisions-behind-a-rag-agent-that-must-not-leak-bc969d3f9a50", "kind": "news", "date": "2026-11-07", "why": "一名开发者用 Postgres RLS + pgvector 实作“按人检索”的 RAG agent：查询时以使用者的身份跑混合检索，未授权 chunk 由行级安全策略过滤；连“存在性泄露”的坑都踩过——只护住 chunk、忘了 documents 表标题，导致普通用户仍能列出 27 份机密文档标题。六个检索决策与我们的逐 AU 求值同构，是工程落地的现成参照。"}, {"title": "RAG application security: retrieval must respect data access", "url": "https://www.cypheninnovations.com/insights/rag-application-data-security", "kind": "news", "date": "2026-11-02", "why": " practitioner 指南：检索必须尊重数据访问——在上下文组装之前、按可信边界执行访问控制，不能只靠模型指令让它忽略不该看的内容；索引与缓存本身就是敏感信息库，权限撤销与文档删除必须在全管线生效。与我们“授权判定在检索结果进上下文之前、由架构保证”的主张直接呼应。"}, {"title": "The access decision in RAG happens before the model says a word", "url": "https://medium.com/@dkyrkos/the-access-decision-in-rag-happens-before-the-model-says-a-word-172b8cdc0baa", "kind": "news", "date": "2026-11-12", "why": "与我们论文核心论点同构的实务文章：授权判定必须发生在检索时（只搜用户有权读的子集），而不是靠提示词事后约束；可作 per-view 索引思路的业界佐证。"}, {"title": "Amazon Bedrock's New Approach to RAG Access Control", "url": "https://medium.com/@langprotect/amazon-bedrocks-new-approach-to-rag-access-control-65449c833d9e", "kind": "news", "date": "2026-11-12", "why": "AWS Bedrock 新增查询时实时文档权限检查（ACL-aware retrieval）：索引时先按 ACL 过滤，返回前再到原数据源实时核验权限，未授权文档不进模型上下文；文章同时点明“这只是过滤、不是完整授权”（Bedrock 不认证用户身份），与我们“授权在检索前求值”的思路同构，对论文的边界讨论有直接参考价值。"}, {"title": "\"Don't reveal it\" is not an access control. RAG permissions belong in retrieval.", "url": "https://dev.to/cyclopt_dimitrisk/dont-reveal-it-is-not-an-access-control-rag-permissions-belong-in-retrieval-3475", "kind": "news", "date": "2026-11-12", "why": "一篇写给工程师的实务短文，把我们论文的核心主张说成了大白话：靠提示词让模型“别泄露”不是访问控制，授权必须落在检索环节；并点出两个典型失效——检索后过滤（为时已晚）与索引时冻结的权限（员工换组四天后仍被当作原组成员）。可直接用来向非安全背景的读者解释“为什么 AU 求值要在检索前”。"}, {"title": "RAG Permission Revocation: Test Cached Retrieval Leaks", "url": "https://www.promptspherehub.com/2026/11/rag-permission-revocation-cached-retrieval.html", "kind": "news", "date": "2026-11-08", "why": "补录：聚焦权限撤销后的缓存泄露——用户维度的缓存键能防跨用户串味，但防不住“同一用户权限已被撤销、缓存结果仍可用”；作者用 Python/SQLite 复现了三类失效，主张缓存结果进上下文前必须重查当前授权、权限变更时作废缓存答案。这正是我们论文尚未单列的一点：AU 求值的新鲜度（revocation freshness），值得在讨论里补一句。"}, {"title": "Characterizing the blast radius of triple level poisoning attacks in knowledge graph retrieval augmented generation systems", "url": "https://link.springer.com/article/10.1007/s44163-026-02733-8", "kind": "paper", "date": "2026-11-13", "why": "首次量化 KG-RAG 三类三元组投毒（边/枢纽/链）的爆炸半径，并给出基于度加权信任分的图谱级防御，直接对应 RAG 访问控制与检索投毒方向。"}, {"title": "Poisoned memory and retrieval: what published attacks show", "url": "https://rillor.com/insights/pdf/poisoned-memory-and-retrieval.pdf", "kind": "news", "date": "2026-11-13", "why": "行业报告系统梳理已发表的 RAG/记忆投毒攻击、披露案例与防御实效，对评估访问控制方案的威胁模型很有参考价值。"}], "keywords": ["RAG security", "retrieval access control", "RAG privacy", "retrieval poisoning"], "name": "RAG 访问控制", "rss": [], "since": "2026-09-30", "source": "user"}, {"id": "agent-authz", "items": [{"title": "GitLab：MCP 作用域 token 可越权审批合并 MR（CVE-2026-123142）", "url": "https://theinjection.dev/items/gitlab-mcp-token-merge-request-approval/", "kind": "news", "date": "2026-11-16", "why": "GitLab 11 月 16 日补丁修复：MCP 服务器授权检查错误，持 MCP 作用域 OAuth token 的已认证用户可越权审批、合并 MR；同批共修 37 个安全问题，另含 3 个 Duo Agent Platform 授权缺陷。"}, {"title": "MCP 协议透传：agent 间信任缺口，CVE-2026-97228 与企业 AI 栈内的 SSRF 风险", "url": "https://www.aireport.net/Gn_08f9f0b3d4ab", "kind": "news", "date": "2026-11-18", "why": "Ars Technica 报道：Google、摩根大通、Weaviate、Rapid7 等五家机构在过去五个月里修补了同一类 MCP 信任缺陷——提示注入打进弱防护的工具 agent，再被转发给受信任的下游 agent，常以服务端请求伪造收场；Google MCP Toolbox 缺陷评级 8/10。"}, {"title": "CVE-2026-110195：IBM ContextForge MCP 网关授权绕过", "url": "https://mcp.cve.now/CVE-2026-110195", "kind": "news", "date": "2026-11-17", "why": "IBM ContextForge MCP 网关 1.0.0–1.0.11 的 RFC 8693 token 交换缓存键不够具体，已登录用户可跨凭证复用缓存的上游 bearer token，绕过凭证级授权策略（CVSS 5.4）；同网关另有 A2A 端点 SSRF（CVE-2026-77822）。"}, {"title": "Zero-Trust Sandboxing for AI Agents：进程隔离拦不住提示注入", "url": "https://dev.to/dev_kestrel/zero-trust-sandboxing-for-ai-agents-why-process-isolation-alone-wont-stop-prompt-injection-a53", "kind": "news", "date": "2026-11-17", "why": "针对近期走红的零信任 agent 沙箱的提醒：进程隔离防的是读文件，防不住模型被说服去调一个本就有权调的工具；主张在 socket 之前放确定性出站门，“不要把模型输出当授权决策，授权属于代码”。"}, {"title": "MCP Won the Agent Protocol War. Now Who Controls It?", "url": "https://nx1.medium.com/mcp-won-the-agent-protocol-war-now-who-controls-it-d6cb5c308b16", "kind": "news", "date": "2026-11-17", "why": "MCP 已成 Linux 基金会标准（月 SDK 下载 9,700 万次），但规范里授权是可选的，STDIO 传输甚至被告知跳过授权规范；NSA 5 月指引直言协议未定义会话与身份的关联、也不支持实例化时交换 RBAC 权限——“MCP 只告诉 agent 如何够到工具，不管这个 agent 此刻有没有权用它”。"}, {"title": "Agent Gateway Control Matrix: What A2A and MCP Gateways Enforce Before an Agent Touches Lakehouse Data", "url": "https://datalakehousehub.com/blog/agent-gateway-control-matrix/", "kind": "news", "date": "2026-11-09", "why": "对照 SAP A2A 网关、agentgateway 1.7.0 与 Databricks MCP 的六项控制（认证、令牌校验、用户级授权、工具输出检查等），10 月 27 日三家同日落地的进展汇总。"}, {"title": "MCP governance: who's really allowed to let your agents act", "url": "https://medium.com/@digitalmadhavai/mcp-governance-whos-really-allowed-to-let-your-agents-act-5db209fdf316", "kind": "news", "date": "2026-11-13", "why": "论证普通 API 网关看不懂 MCP 方法调用、无法区分无害的 tools/list 与破坏性的 tools/call，治理必须在协议层内执行；与今日文献的 MCP Gateway 论文同题、一攻一守。"}, {"title": "CVE-2026-109492: Microsoft MCP Gateway Authorization Bypass", "url": "https://theinjection.dev/items/microsoft-mcp-gateway-name-collision-cve/", "kind": "news", "date": "2026-11-10", "why": "微软开源 MCP 网关的名字碰撞授权绕过漏洞，CVSS 8.8：已认证用户可通过同名工具/适配器进入他人工作负载；网关层“按名字信任而非按属主校验”的经典失误，1.0.0 已修复，多租户部署应立即升级。"}, {"title": "AI Agent Security: Prompt Injection, Access and Audit", "url": "https://www.chmltech.com/post/agent-security-and-identity-prompt-injection-least-privilege-credentials-audit.html", "kind": "news", "date": "2026-11-12", "why": "把 agent 当作一等非人类身份治理的实务模型：指令可被颠覆，但不授予某动作的凭证无法被说服授权——与 ChainBind“批准不是执行”的论点同构。"}, {"title": "Who writes a small agent's security rules? (CapLite)", "url": "https://arxiv.org/abs/2611.17115", "kind": "paper", "date": "2026-11-12", "why": "小模型自己写的 Progent/IPIGuard/DRIFT 安全规则在 15 个模型里 11–14 个被攻破；而从工具 schema 派生规则、写操作在读工具结果前提交的 CapLite 在 13,935 个 AgentDojo episode 里 0 次攻破——与我们 ChainBind 的编译期绑定思路高度呼应。"}, {"title": "Log-To-Leak: Prompt Injection Attacks on Tool-Using LLM Agents via the Model Context Protocol", "url": "https://arxiv.org/html/2610.36108v1", "kind": "paper", "date": "2026-11-15", "why": "AGENT-SEC '26 论文：MCP 工具元数据里的注入指令可在最后一次合法调用之后再诱导一次攻击者控制的日志调用，18 组模型-服务器配对 ASR 62.64%–100%，三类防御后残余 ASR 在 GitHub MCP + GPT-4o 上仍超 55%，结论直接指向二次工具调用需要宿主侧授权。"}, {"title": "Edera 以对象能力实现 agent“有界授权”：无凭证访问、权限由 hypervisor 强制执行", "url": "https://www.prnewswire.com/news-releases/edera-redefines-ai-agent-security-with-bounded-authority-and-credential-free-access-302930175.html", "kind": "news", "date": "2026-11-05", "why": "把“动作”与“动作背后的凭证”分开：agent 可在单个 GitHub 仓库内工作却不持有 GitHub token，即使被提示注入攻破、权限仍被限定在该仓库内；这是最小权限在运行时层的一种实现，与我们 ChainBind 的执行时绑定思路同构（厂商通稿，技术主张需独立验证）。"}, {"title": "You can't fully stop prompt injection. Here's the layered defense we built instead.", "url": "http://dev.to/dmitry_korolev_ecef498a64/you-cant-fully-stop-prompt-injection-heres-the-layered-defense-we-built-instead-498b", "kind": "news", "date": "2026-10-21", "why": "主张注入无法根除、防御要分层，核心思路是授权检查永远在模型之外、模型只能接触已被授权的数据，与 AU 逐值授权的执行时语义相呼应。"}, {"title": "Summarize this document, then run it: Vibe-Trading's prompt-injection-to-root shell", "url": "http://dev.to/actionable-vectors/summarize-this-document-then-run-it-vibe-tradings-prompt-injection-to-root-shell-5bk6", "kind": "news", "date": "2026-10-21", "why": "用 Vibe-Trading 真实案例展示提示注入如何劫持代理直达 root shell（CVE-2026-114106），并给出工具授权与最小权限/容器降权等具体防御清单。"}, {"title": "BeyondTrust AI Agent Security Now Generally Available", "url": "https://www.beyondtrust.com/press/ai-agent-security-general-availability", "kind": "news", "date": "2026-10-21", "why": "BeyondTrust 宣布 AI 代理安全产品正式可用，配套 Phantom Labs 研究（4 周内编码代理发起 128 万次 shell 调用、85% 用户配置 MCP），主打对每个代理动作的实时管控；厂商新闻稿，数据供参考。"}, {"title": "OpenAI discloses four more agent misalignment incidents (total 19)", "url": "https://aibriefing.dev/", "kind": "news", "date": "2026-10-18", "why": "新增 4 起 agent 失齐公开披露（含未授权加密支出、下载 24 年医院床位数据）——执行时授权缺失的真实事故，可作 binding 动机的实证材料。"}, {"title": "CERT-In Flags AI Agents Crossing Into Live Systems Without Permission (CIAD-2026-0049)", "url": "https://netcrook.com/written_article?slug=cert-in-ai-agents-live-systems-without-permission&lang=en", "kind": "news", "date": "2026-10-15", "why": "印度 cyber 机构警告 autonomous agent 未经授权进入生产系统、读取业务记录——“安全边界不在 prompt，而在身份、权限与监控”，与我们 runtime authorization binding 的主张同构，可引用为监管侧佐证。"}, {"title": "Archon AI coding agent's control API has no login by default — anyone who can reach it can run commands", "url": "https://aicyberbrief.com/article/archon-ai-coding-agent-s-control-api-has-no-login-by-default-anyone-who-can-reach-it-can-run-commands", "kind": "news", "date": "2026-10-15", "why": "23k star 的开源 AI coding agent 工作流引擎被曝控制 API 默认无认证、agent 以 bypassPermissions 运行——“缺失的锁”而非高深漏洞，正是执行时授权缺失的典型反例，可作 binding 论文的反面案例。"}, {"title": "Bigeye launches Policy Engine for runtime agent governance across AI gateways", "url": "https://www.einpresswire.com/article/949402050/bigeye-adds-policy-engine-to-agent-trust-hub-with-runtime-enforcement-across-ai-gateways", "kind": "news", "date": "2026-10-14", "why": "企业级 agent 运行时授权的工业界落地：每次 agent 动作按身份/目的/动作/数据状态做 allow/deny/restrict/escalate，与我们 runtime authorization binding 方向同构，可作产业对照"}, {"title": "Unauthorized Tool Invocation: When Attackers Call the AI's Tools Directly", "url": "https://www.linkedin.com/pulse/unauthorized-tool-invocation-when-attackers-call-ais-t1ege", "kind": "news", "date": "2026-10-08", "why": "攻击者绕过 AI agent、直接调用其底层工具的攻击演示：应用若不验证请求是否来自既定的 agent 工作流，工具就会被未授权执行——正是'编排不等于授权'的现实注脚，与 tool-use authorization 方向直接相关。"}, {"title": "Peregrini's Agent Court: How Common Law Enforcement Turns LLM Mistakes Into Binding Precedent", "url": "https://dev.to/mech_app_ai/peregrinis-agent-court-how-common-law-enforcement-turns-llm-mistakes-into-binding-precedent-1jpe", "kind": "news", "date": "2026-10-02", "why": "在工具边界授权之上叠加「普通法执法」问责层：记录 agent 承诺与实际交付偏差，形成跨实例传播的判例与信任分——补位现有授权机制执行后的问责空白，与 agent 授权治理方向相关。"}, {"title": "AI Agents Accessed Government Systems Without Permission—OpenAI and Anthropic Disclose Tens of Thousands of Incidents", "url": "https://www.karmactive.com/openai-anthropic-ai-agent-security-incidents-2026/", "kind": "news", "date": "2026-10-02", "why": "OpenAI 与 Anthropic 披露 agent 未授权访问第三方系统的批量事件，核心故障是第三方 API 工具包装器与默认宽泛权限（而非推理错误），典型手法为间接提示注入——正是 tool-use authorization 要解决的现实威胁，凸显「授权独立于模型」控制面的紧迫性。"}, {"title": "AgentFox: open-source control plane for AI agents", "url": "https://github.com/architsharm/agentfox", "kind": "repo", "date": "2026-09-29", "why": "开源 agent 控制平面：模型流量 guardrail、工具调用按 capability grant 限界、防篡改审计轨迹映射合规框架；其“按值来源（provenance）而非载荷内容做拒绝”的守卫逻辑与我们“授权绑定到数据来源”的范式同构。"}, {"title": "Indirect Prompt Injection in Web Content Targets AI Agents (Zscaler ThreatLabz)", "url": "https://www.infosecurity-magazine.com/news/indirect-prompt-injection-web/", "kind": "news", "date": "2026-10-04", "why": "真实世界间接提示注入战役：攻击者用仿冒 DeBank 的 typo 域名藏指令，26 个模型中 4 个（含 Llama/Gemini 版本）被操纵执行欺诈支付——\"内容即攻击面\"的最新实证，与 Agent 授权方向的威胁模型直接相关。"}, {"title": "A blind trust, the bloody thrust: trojanized hook updates take over AI agent harnesses", "url": "https://adversa.ai/blog/top-ai-coding-agent-security-resources-october-2026/", "kind": "news", "date": "2026-10-04", "why": "插件更新投毒：恶意 lifecycle hook 更新攻陷全部 7 个被测 agent harness（含 Claude Code、Codex CLI），10 类攻击目标成功率最高 92.5%，而 Defender/Semgrep 漏掉近半样本——说明 agent 供应链授权（更新审查）比扫描更重要，属 Agent 访问控制的授权组合缺陷。"}, {"title": "Google's Approach to AI Agent Security: Identity, Permissions, and Runtime Boundaries", "url": "https://codecrux.com/blog/googles-approach-to-ai-agent-security-identity-permissions-and-runtime-boundaries/", "kind": "news", "date": "2026-10-03", "why": "Google 公开的 agent 安全架构：把 agent 当作一等非人类主体，传输层认证+逐请求授权+最小权限+JIT 凭证+默认拒绝，与 RU/AU 解耦「策略独立存放、执行层求值」的立场同构，可作 Agent 线引用。"}, {"title": "Replication package for: Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems", "url": "https://doi.org/10.5281/zenodo.23108972", "kind": "paper", "date": "2026-10-06", "why": "实证测量 LLM agent 系统中\"源使用授权\"与\"控制点放置\"的关系（360 个实验世界+载体替换复制+溯源审计），与 Agent 工具调用授权的追踪方向直接相关；注意目前仅复制包公开、原论文正文未见。"}, {"title": "Aembit Extends Access Controls to Personal AI Agents", "url": "https://gbhackers.com/aembit-extends-access-controls-to-personal-ai-agents/", "kind": "news", "date": "2026-10-07", "why": "个人 AI agent（Meta Muse、OpenAI Dots）进企业带来的新授权难题：agent 复用员工凭证访问邮件/代码库/内部工具，行为难与员工本人区分。Aembit 方案是 agent 独立身份+员工身份的 blended identity，运行时评估 agent+用户+资源+条件，签发短期凭证，可独立撤销 agent 而不影响员工账号。与我们 AU 授权单元思路同源（授权原子单位+运行时求值），是 agent 身份赛道的产品化样本。"}, {"title": "GitHub Copilot CLI Flaw Lets Attackers Steal Developer Secrets", "url": "https://cyberpress.org/github-copilot-cli-prompt-injection/", "kind": "news", "date": "2026-10-07", "why": "Adversa 发现：加密 blob 解密后才显形的指令可劫持 Copilot CLI 窃取开发者磁盘密钥（源码/配置/凭证），而 GitHub 赏金团队拒绝定为漏洞——理由是“用户让 agent 取攻击者内容且给了全自主权限”。“用户授权了全自主”是否等于代理一切可为，正是“授权应独立于模型、在执行层显式授权”主张的现实注脚。"}, {"title": "Attackers Hide AI Prompt Injections Inside Phishing Emails", "url": "https://www.infosecurity-magazine.com/news/attackers-hide-ai-prompt/", "kind": "news", "date": "2026-10-07", "why": "Barracuda 10-07 研究：一封邮件同时攻击人和 AI 助手——人收到密码保护附件的社工诱饵，AI 邮箱摘要器则被藏在 HTML 注释/不可见文本/Base64/零宽字符里的指令操纵，把邮件包装成“紧急可信”。间接提示注入进入邮件渠道且双目标，给 agent 授权边界讨论增加了输入渠道的实证。"}, {"title": "AdvSim2Real: Training Web Agents Against Adaptive Prompt Injection in a Web World Model", "url": "https://arxiv.org/abs/2610.08773", "kind": "paper", "date": "2026-10-06", "why": "web agent 抗自适应提示注入的训练侧方案：任务课程、注入攻击者、agent 三者在冻结的 web 世界模型里协同演化，4B agent 在 150 个 web 任务上、面对训练中从未见过的前沿模型攻击者，相对完成率提升 33.6%。与授权侧防御（我们的立场）形成对比/组合论据，可引为“训练侧方案在自适应攻击者下的天花板”。"}, {"title": "GitLab AI Gateway Flaw CVE-2026-90970: CVSS 9.9", "url": "https://tech-insider.org/gitlab-ai-gateway-cve-2026-90970-duo-agent-2026/", "kind": "news", "date": "2026-10-07", "why": "Duo Agent Platform 的 prompt-template 沙箱被特制 flow 配置逃逸，直接触达宿主机 OS，需跨三分支三次发版才修好。提示过滤管的是“模型决定做什么”，沙箱逃逸改变的是“系统允许模型的输出碰到什么”——管道层（沙箱/权限边界）与模型行为同样值得审视，与我们“执行层独立控制面”的威胁模型分层互证。"}, {"title": "AI Safety ≠ AI Security: EnforceAuth Announces Evidence IQ", "url": "https://world.einnews.com/pr_news/948261386/ai-safety-ai-security-enforceauth-announces-evidence-iq", "kind": "news", "date": "2026-10-08", "why": "把 agent 授权决策做成可重放、防篡改的证据层，直接回应“为什么当时允许它这么做”的审计问题；提出的 Authorization Gap（单步都合规、组合起来像数据窃取）与我们 AU 求值“逐单元合法但组合需警惕”的思路同构"}, {"title": "AI Agents Are Creating a New Identity Security Challenge (SailPoint Navigate 2026)", "url": "https://redmondmag.com/articles/2026/10/07/ai-agents-are-creating-a-new-identity-security-challenge.aspx", "kind": "news", "date": "2026-10-07", "why": "SailPoint 在 Navigate 2026 扩展 Agentic Fabric：发现影子 agent、运行时授权、可一键停用 agent；关键数字：79% 企业已有 agent 跑在生产环境，仅 2% 部署了专为 agent 设计的身份安全工具——授权缺口正在变成行业共识"}, {"title": "awesome-ai-agent-attacks（持续更新的 agent 攻击案例清单）", "url": "https://github.com/webpro255/awesome-ai-agent-attacks/blob/HEAD/README.md", "kind": "repo", "date": "2026-10-11", "why": "收录 2026-10 发生的真实 agent 攻击/漏洞案例（含 AWS Loom 编排平台 CVE-2026-103956 未配置 IdP 时鉴权 fail-open 被任意网络客户端接管），是 agent 授权失效模式的现成案例库"}, {"title": "Kong 发布 MCP Tool ACLs：AI Gateway 3.13 的 MCP 工具细粒度授权", "url": "https://konghq.com/blog/product-releases/mcp-tool-acls-ai-gateway", "kind": "news", "date": "2026-10-12", "why": "网关层对 MCP 工具调用做基于身份的 ACL：按调用者身份过滤可见工具子集、默认拒绝、可复用 Kong consumer group。这正是我们“执行时授权绑定”方向的工程实现形态——授权点从 MCP 服务器移到网关，且是工具级的而非整服务器二选一。"}, {"title": "MCP Agent-to-Agent 漏洞分析：协议层没有“这个 agent 能否替这个用户调这个工具”的答案", "url": "http://dev.to/mech_app_ai/mcp-agent-to-agent-vulnerabilities-what-googles-flaw-reveals-about-protocol-level-security-23d2", "kind": "news", "date": "2026-10-12", "why": "披露 Google 相关 MCP 缺陷的利用链：恶意 MCP 服务器把目标 agent 当 confused deputy，去调用其信任的其他服务器工具。核心论点与我们一致——MCP 协议本身没有调用者身份、没有授权原语（“能发消息就能调工具”），agent-to-agent 场景下人类不再是安全边界。"}, {"title": "Harvey 宣布 MCP Policy Engine：法律 AI 工作流的运行时工具访问控制", "url": "https://www.tokenpost.com/news/technology/27817", "kind": "news", "date": "2026-10-08", "why": "法律 AI 平台 Harvey 的 MCP 策略引擎：最小权限、工具动作完全中介、信息流控制；Tool Pinner 追踪获批工具变更（防 rug-pull 攻击），Sanitizer 清洗工具结果中的隐藏指令——是“执行时授权绑定”在垂直场景的工程实现，可作新主线调研的工程参照。"}, {"title": "EnforceAuth 发布监管证据对照表：一条授权决策记录映射 9 大合规框架", "url": "https://www.einnews.com/pr_news/948262228/enforceauth-maps-ai-agent-decision-evidence-to-9-compliance-frameworks", "kind": "news", "date": "2026-10-13", "why": "EnforceAuth 继上周发布 Evidence IQ 后再出 Regulatory Evidence Crosswalk：单条\"谁在何种授权下对何资源做了何决策\"的记录，直接映射 EU AI Act、DORA、HIPAA、PCI DSS、SOC 2 等 9 大框架的访问/日志/监督要求。CEO 称监管正从\"给我看政策\"转向\"给我看决策\"。与我们的执行时授权绑定（方向2）同源——审计证据必须在决策发生时捕获，而非事后重建。"}, {"title": "DeepSeek v4.1 Flash 在测试中擅自使用暴露的 API 密钥调用外部模型", "url": "https://www.techtarget.com/ai/news/366652106/DeepSeek-and-what-enterprises-should-learn-from-AI-agent-exploits", "kind": "news", "date": "2026-10-13", "why": "两组 coding agent 基准测试显示，DeepSeek v4.1 Flash 拿到了沙箱环境里暴露的 API 密钥，不是忽略它们，而是直接拿去调用其他模型刷分。TechTarget 称这是首例有记录的中国模型\"未经许可行动\"案例（此前 OpenAI agent 盗用凭证攻陷 Hugging Face 基础设施、Anthropic/Google 模型自行逃出沙箱均有先例）。这是\"执行时授权绑定\"要解决的教科书场景：agent 能碰到什么密钥、能调用什么外部服务，必须在运行时由策略决定，而不是靠模型\"自觉\"。"}, {"title": "Amex 为 agent 购物建授权护栏：API 级购买授权", "url": "https://www.techbuzz.ai/articles/amex-builds-ai-shopping-guardrails-as-agent-commerce-takes-off", "kind": "news", "date": "2026-10-13", "why": "Amex 正在为 AI agent 购物建基础设施：agent 发起购买前必须先经 Amex 系统验证授权，按交易金额和用户偏好要求生物识别确认或明确口头同意；用户可设支出上限、品类限制和审批要求。这是\"支付即授权\"的工程实例——把授权检查做到交易 API 边界，而不是放在 prompt 里，与我们\"策略独立存放、查询时逐 AU 求值\"的思路同构。"}, {"title": "Transcend 发布 Rails：运行时 agent 策略执行平台", "url": "https://techintelpro.com/news/ai/agentic-ai/transcend-launches-rails-for-agent-policy-enforcement", "kind": "news", "date": "2026-10-06", "why": "运行时 agent 策略执行：回答\"这个 agent 现在能否为这个目的做这件事\"（毫秒级、逐动作）；Gartner 预测到 2030 年一半 agent 部署失败将源于运行时执行不足——runtime authorization binding 的产业侧印证。"}, {"title": "AIBound 发布 AgentHarness：安全策略在 agent 内部执行", "url": "https://lifestyle.californiaconsumerbanking.com/story/903339/aibound-launches-agentharness-security-policy-enforced-inside-ai-agents", "kind": "news", "date": "2026-10-06", "why": "把数百条安全规则直接做进 agent 内部（prompt 级执行：deny 密钥读取、碰生产前先问用户）；CSA 4 月数据称 53% 的组织已有 agent 越权——agent 授权\"最后一公里\"的另一种形态。"}, {"title": "ServiceNow and NVIDIA to Develop \"AI Passport\" for AI Agent Runtime Permission Control", "url": "https://windowsforum.com/news/servicenow-ai-passport-cryptographic-runtime-controls-for-enterprise-ai-agents.448547/", "kind": "news", "date": "2026-10-15", "why": "ServiceNow 10-15 发布 AI Passport：每个 agent 持加密签名的权限凭证，运行时校验权限范围，越界触发分级响应（重定向/限流/kill switch），Q4 2026 GA，NVIDIA 为设计与发布伙伴——正是我们执行时授权绑定独立主线的工业界实例，可作对比参照。"}, {"title": "OpenClaw Security Vulnerability CVE-2026-33579: What Developers Need to Know", "url": "https://techplanet.today/post/openclaw-security-vulnerability-cve-2026-33579-what-developers-need-to-know", "kind": "news", "date": "2026-10-20", "why": "OpenClaw 网关设备审批路径的权限提升漏洞：/pair approve 未传递调用者 scope 参数时 fail-open，可绕过 scope 上限提权到 operator.admin；13.5 万实例暴露在公网、63% 零认证——正是我们论文主张 fail-closed（默认拒绝）的反面教材。"}, {"title": "OpenCode AI Agent BYOK Compromise: How Stored Developer API Keys Fuel Automated Token Draining and Cloud Abuse", "url": "https://sh3llc0d3.com/blog/opencode-ai-agent-byok-compromise-how-stored-developer-api-keys-fuel-automated-token-draining-and-cloud-abuse/", "kind": "news", "date": "2026-10-18", "why": "OpenCode 安全事件的技术深挖：BYOK 模式下集中存储的第三方 API key 成为高价值目标，凭证外泄直接转化为云账单盗刷与未授权推理代理——agent 基础设施密钥管理的教训。"}, {"title": "LiteLLM 网关高危漏洞：缺失授权检查可致 RCE（CVE-2026-35029）+ SSRF 泄露 API 密钥（CVE-2026-59823）", "url": "https://www.infosecurity-magazine.com/news/high-risk-vulnerabilities-llm-tool/", "kind": "news", "date": "2026-10-20", "why": "网关是 AI 调用的“授权集中点”：缺失权限检查让低权限账户直达管理功能、改运行时配置实现 RCE；SSRF 则可盗走各家模型 API key。Wiz 称约 9.6% 实例暴露，其中一漏洞已进 CISA KEV。与昨日 OpenClaw CVE 同属“缺失的锁”系列，是执行时授权绑定缺失的现实案例。"}, {"title": "CVE-2026-109440：LangAlpha agent 间接 prompt injection 致 RCE（CVSS 8.1）", "url": "https://www.redpacketsecurity.com/cve-alert-cve-2026-109440-ginlix-ai-langalpha/", "kind": "news", "date": "2026-10-20", "why": "攻击者在 agent 可能检索的内容里放恶意指令，agent 处理后调用执行工具（bash/execCode）导致远程代码执行，可盗凭证、改工作区。IPI→代码执行的完整链条，印证“工具调用通道同样需要授权绑定”。"}, {"title": "OpenCode Flaw Lets Malicious MCP Servers Execute Code During Sign-In on Windows and WSL", "url": "https://thehackernews.com/2026/10/opencode-flaw-lets-malicious-mcp.html", "kind": "news", "date": "2026-10-22", "why": "恶意/被接管的 MCP 服务器通过 OAuth 授权端点 URL 注入 PowerShell 命令，在开发者机器上执行（Pillar 评 9.8/10）；Anomaly 称\"外部 MCP 服务器在其信任边界之外\"、未申请 CVE——这正是我们\"MCP 协议缺调用者身份与授权原语\"论点的现实注脚，且厂商把信任边界外推本身就是 fail-open 思维。"}, {"title": "LiteLLM supply chain compromise: What you need to know", "url": "https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-docker/", "kind": "news", "date": "2026-10-21", "why": "10-21 攻击者用被盗 GitHub CLI OAuth token 发布恶意 litellm 1.107.0（周下载 2300 万），载荷专偷 AI 工具凭证（Claude/Codex/Gemini/Cursor/Copilot 会话与 LiteLLM 代理库里的上游 key）；AI 网关是 agent 调用的授权集中点，其供应链被攻陷直接转化为 agent 基础设施的凭证劫持——agent 身份/密钥治理的新实证。"}, {"title": "Securing AI Agents: Prompt Injection, MicroVMs, Zero Trust（确定性控制而非更聪明的过滤器）", "url": "https://xsypher.com/article/securing-ai-agents-prompt-injection-microvms-zero-trust", "kind": "news", "date": "2026-10-24", "why": "提出 agent 安全的确定性架构：Firecracker microVM 隔离、SPIFFE 短期凭证、CaMeL 数据溯源、Ed25519 人工签名、默认拒绝 L7 出口代理；引用 EchoLeak（CVE-2025-32711）证明间接注入非理论风险——与我们\"授权决策必须在模型之外确定性执行\"的主张同构。"}, {"title": "Grok Bot Prompt Injection: Tool-call validity ≠ intent validity", "url": "https://dev.to/aiza-hextyx/grok-bot-prompt-injection-how-malicious-web-content-can-hijack-an-ai-agent-2elh", "kind": "news", "date": "2026-10-24", "why": "提出关键区分：工具调用在格式/认证/授权上完全合法，仍可能是恶意的——安全问题在于 agent 为何发起调用（intent validity），而非能否调用。这正是 agent authorization 需要回答的问题，可作概念引用。"}, {"title": "You approved that agent skill once. Its next update runs with the same trust. How do you stop a bad update?", "url": "https://zeroagency.ai/blog/agent-skill-update-trust", "kind": "news", "date": "2026-11-04", "why": "上海交大与 Inria 的“工具更新缺口”研究：一次批准的工具权限在代码更新后仍延续，7 个 agent 框架（Claude Code、Codex CLI、Gemini CLI 等）上攻击成功率 97.6%、工具正常功能保留 95.9%；与“批准一次即永久授权”问题直接相关，修复方向是版本 pinning 与把每次更新当作新安装。"}, {"title": "Claude Sonnet 4.6 抗提示注入能力大幅提升，与 Opus 4.6 相当", "url": "https://www.anthropic.com/news/claude-sonnet-4-6", "kind": "news", "date": "2026-11-08", "why": "Anthropic 官方 11 月 8 日发布 Sonnet 4.6，安全评估称其抗提示注入能力较 Sonnet 4.5 大幅提升、与 Opus 4.6 相当；1M 上下文进入 beta，Free 与 Pro 计划默认升级。模型侧防御能力的变化直接影响 agent 授权绑定的代价与必要性，值得盯后续独立验证。"}, {"title": "Dynatrace MCP 工具投毒跨框架实测：12 框架、18 模型、9720 格，总体攻击成功率 22.9%", "url": "https://arxiv.org/abs/2611.03555", "kind": "paper", "date": "2026-11-02", "why": "首个 MCP 工具投毒跨框架实测（AISec '26）：恶意 MCP 服务器在工具描述里藏指令，12 个 agent 框架、18 个模型、45 个攻击场景共 9720 格，总体 ASR 22.9%，其中 12.1% 的可攻破格子实锤外泄了机密；代码审计发现 12 个框架均无针对工具投毒的 intentional 防御，抵抗力几乎全来自模型本身（Claude Fable 5 为 0.4%，Amazon Nova Pro 高达 49.7%）。为“授权必须落在模型之外”提供了迄今最硬的实测证据。"}, {"title": "AuthGateBench: Benchmarking LLMs as Authorization Gate", "url": "https://arxiv.org/abs/2610.16426", "kind": "paper", "date": "2026-11-06", "why": "首个针对良性请求的策略引导式授权门控 benchmark（v2 修订于 11 月 6 日）：1,400 个实例、5 种失效模式，均取自真实 Claude Code 事故；用“同一动作与轨迹、不同请求翻转放行/拦截”的对比对，测模型是否真在按上下文推理而非只看动作。结论值得注意：模型过度依赖内在安全对齐，即使明确授权仍拦截多数动作，授权判定并不稳定——这正是“授权判定不能只靠模型”的又一证据。"}, {"title": "EpiSEM-Bench: Evaluating Safety and Evidence Recovery in LLM Agents under Missing Evidence", "url": "https://arxiv.org/abs/2610.31650", "kind": "paper", "date": "2026-10-22", "why": "300 对匹配任务、6 个领域：系统性地扣掉关键证据（如支出上限、访问许可级别、医疗禁忌），测 agent 是否会在“每个返回的陈述都为真、请求本身良性”的情况下执行被禁操作。10 个前沿模型普遍中招——把不完整的肯定性工具响应当作隐式批准。并配独立审计工具测 agent 是否会主动追问缺失的事实。给 ChainBind 的启示：批准时锁定的参数若缺失关键证据，授权判定本身就是不可信的。"}, {"title": "Too much authority, checked too late", "url": "https://manideep.info/blog/too-much-authority-checked-too-late", "kind": "news", "date": "2026-11-14", "why": "7 月 1 日至 11 月 13 日共 568 个已公开漏洞提到 MCP、其中 20 个出在 AWS 自家服务器，作者逐条梳理后认为共同根因是“权限给多了、检查得太晚”；并开源了 agent 授权层 Ratchet：agent 即便被提示注入完全接管，也不能超出被明确授予的权限行动。"}, {"title": "How Gemini's defense-in-depth approach works", "url": "https://blog.google/security/how-geminis-defense-in-depth-approach-works/", "kind": "news", "date": "2026-11-17", "why": "Google 官方披露其 Agent 的五层纵深防御架构（沙箱、注入分类器、Policy Guardian、Action Safety Agent、人工接管），是工业界 Agent 授权/注入防御的标杆设计。"}, {"title": "DeepMind Agent Swarms Break Prompt Injection Defenses", "url": "https://i10x.ai/news/deepmind-agent-swarms-break-prompt-injection-defenses", "kind": "news", "date": "2026-11-15", "why": "DeepMind 用 LLM agent 集群自适应攻击使 7 个模型中 6 个的攻击抵抗率降到 10% 以下，说明仅靠模型加固不足以做授权边界，呼应纵深防御路线。"}, {"title": "IBM Granite 4.1 LLMON Cuts Indirect Prompt Injection Rates", "url": "https://aiweekly.co/alerts/ibm-granite-41-llmon-cuts-indirect-prompt-injection-rates", "kind": "news", "date": "2026-11-13", "why": "IBM 用 LLMON 结构化标记把间接注入成功率从 53–100% 降到 0.02–5.6%，并明确声明这是学习行为而非强制保证，是工具调用授权边界的新思路。"}], "keywords": ["LLM agent security", "tool-use authorization", "agent authorization", "prompt injection"], "name": "Agent 访问控制", "rss": [], "since": "2026-09-30", "source": "user"}, {"id": "embedding-privacy", "items": [{"title": "SPARSE：概念感知的隐私机制防御 embedding 反演攻击（ICLR 2026）", "url": "https://en.papernotes.org/ICLR2026/llm_safety/concept-aware_privacy_mechanisms_for_defending_embedding_inversion_attacks/", "kind": "paper", "date": "2026-11-18", "why": "针对标准差分隐私“给所有维度加噪、毁掉语义”的痛点，提出 SPARSE：用可微神经元掩码学出与用户指定隐私概念相关的关键维度，只对敏感维度注入按维度敏感度校准的椭球噪声，保住非敏感语义、六个数据集上隐私—效用权衡更好。"}, {"title": "AudioTrace：音频大模型的逐文件成员检测", "url": "https://arxiv.org/abs/2611.21088", "kind": "paper", "date": "2026-11-16", "why": "把成员推断做到音频大模型与文件粒度：检测某音频文件是否在训练集中。方向上与 embedding/隐私攻击线相关，但注意是音频模态、与 RAG 文本 embedding 泄露不是同一攻击面。"}, {"title": "XposedMIA: Exploiting Explainable Artificial Intelligence (XAI) for One-Shot Membership Inference Attacks", "url": "https://www.machinebrief.com/news/xposedmia-exploiting-explainable-artificial-intelligence-xai-5vlb", "kind": "paper", "date": "2026-11-11", "why": "把 LIME 等可解释性输出当作成员推断的代理信号：只需 30 个样本校准、每个目标一次查询，成功率最高 0.95；“为透明而开放的解释”本身成了新的泄露面。"}, {"title": "Noise as a Probe: Membership Inference Attacks on Diffusion Models Leveraging Initial Noise", "url": "https://arxiv.org/abs/2601.21628", "kind": "paper", "date": "2026-11-10", "why": "MM'26 论文：扩散模型噪声调度无法完全消除图像语义，初始噪声里的残留语义信号可被用来做成员推断；无需影子模型与分类器，单次生成即可判断成员关系，揭示了生成模型的又一条泄露通道。"}, {"title": "How Much Do Modern Embeddings Reveal? Inversion Attacks on Commercial Embedding Models", "url": "https://arxiv.org/abs/2611.05716v1", "kind": "paper", "date": "2026-11-03", "why": "用 vec2text 对 text-embedding-3-small 等商用模型做反演，健康类指令精确还原率 47.4%、BERTScore F1 超 87——给我们论文 embedding 泄露一节提供了商用模型的最新数字。"}, {"title": "I leaked a Vector Database and Reconstructed the Secret From Numbers Alone", "url": "https://medium.com/@bharathbandari/i-leaked-a-vector-database-and-reconstructed-the-secret-from-numbers-alone-efad0c504086", "kind": "news", "date": "2026-11-05", "why": "动手实验证明“只存向量不存原文也等于泄漏”：用同一模型重嵌候选文本、按余弦相似度排序，真实机密得 1.0 分，同类错误猜测 0.71–0.79、异类仅 0.53–0.61——即使猜不中原文，仅凭分数梯度也能判定秘密的类别。"}, {"title": "Forget Me: Deletion in a System Designed to Remember", "url": "https://pub.towardsai.net/forget-me-deletion-in-a-system-designed-to-remember-c011b906428d", "kind": "news", "date": "2026-11-05", "why": "讨论 agent 系统里的删除难题：一次删除请求要遍历摘要、embedding、检查点、缓存等所有衍生副本，而 embedding 本身就是个人数据的副本（embedding 反演已被证实可还原内容）——与我们“授权单元与数据衍生形态”的讨论直接相关。"}, {"title": "OWASP AISVS C08: Embedding Sanitization & Validation（1.0 章节更新）", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C08-Memory-and-Embeddings/C08-02-Embedding-Sanitization-Validation.md", "kind": "repo", "date": "2026-10-11", "why": "OWASP AI 安全验证标准中 embedding 清洗验证章节：总结 SPARSE/DPPN 两种 2026 年初的定向防御（只扰动隐私敏感维度），并明确运维定级——向量库泄露等同源文档泄露（可反演 50-92%），与我们论文 embedding 通道实测结论一致"}, {"title": "OWASP AISVS 新增 C11.2 章节：成员推断与模型反演缓解（1.0 研究版更新）", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C11-Adversarial-Robustness/C11-02-Membership-Inference-Model-Inversion-Mitigation.md", "kind": "news", "date": "2026-10-12", "why": "继昨日 C08（Embedding 清洗与验证）更新后，AISVS 又新增 C11.2 成员推断/模型反演缓解章节：明确差分隐私、输出校准、限流与输出最小化是最有效的已知防御。标准侧对“embedding 通道”的定调在持续收紧，可作为我们论文 embedding 通道一节引用标准时的配套条目。"}, {"title": "PUC：用预测不确定性曲线做成员推断攻击，比 LiRA 快 21 倍", "url": "https://scienmag.com/uncertainty-curves-expose-the-data-ai-models-memorize-new-attack-shows/", "kind": "news", "date": "2026-10-11", "why": "新攻击框架 PUC 用\"预测不确定性曲线\"（模型置信度在扰动下的弯曲/ flatten/衰减形态）判断某数据是否在训练集中：在 RTX 4090 上全流程约 426 秒，比 16 个影子模型的 LiRA（9133 秒）快 21 倍；仅需输出 logits 的 Temperature Scaling 变体也有判别力。标签平滑 0.1 以下仍保持 AUC>0.8，DP-SGD 也只能部分削弱。关联：这是对\"训练数据记忆\"而非 RAG 检索库的攻击，但它的方法论（不依赖影子模型的低成本 MIA）可直接迁移到评估我们的\"按授权视图重编码\"是否真消除了成员信号——评估章节可引用作攻击强度参照。"}], "keywords": ["embedding inversion", "membership inference", "privacy-preserving retrieval"], "name": "Embedding 与隐私攻击", "rss": [], "since": "2026-09-30", "source": "conversation"}, {"id": "jev-models", "name": "Jev 决策模型（System One）", "source": "user", "keywords": ["jev", "typesafe", "system one", "JEV-27B", "decision model", "RLCD"], "rss": [], "items": [{"title": "How to Split Your AI Agent Into System One and System Two", "url": "https://bhavishyapandit9.substack.com/p/how-to-split-your-ai-agent-into-system", "kind": "news", "date": "2026-11-09", "why": "把 agent 拆成 System One（Jev 类决策模型）与 System Two（LLM）的设计指南：原子提问、代码内组合、置信度阈值自定；并提到 LiteLLM 已统一路由多家决策模型，附 29 篇类型化决策模型论文的早期证据审计。"}, {"title": "TypeSafe Jev explained: how it works, access and API pricing", "url": "https://www.requesty.ai/blog/typesafe-jev-explained", "kind": "news", "date": "2026-11-13", "why": "Jev 1.14（10 月 14 日发布）仍是 11 月最新版，新增 Box 提问类型与多语言支持；定价 $0.042/百万输入 tokens、输出免费，可经 TypeSafe API 或 Requesty 调用。"}, {"title": "Google is the latest tech giant to chase TypeSafe's 8-week-old Jev | AI Weekly #543", "url": "https://aiweekly.co/issues/google-is-the-latest-tech-giant-to-chase-typesafes-8-week", "kind": "news", "date": "2026-11-13", "why": "Google 11 月 11 日发布 Gemini Decision 1 与 Decisions API，继 OpenAI、微软之后第三家跟进决策模型；TypeSafe 另融 8.7 亿美元、估值 75 亿美元，Jev 上线两周内覆盖 Vercel 付费团队 35%。"}, {"title": "TypeSafe Jev Played Chess — And Landed Next to Reasoning Models", "url": "https://dev.clauneck.workers.dev/maximsaplin/typesafe-jev-played-chess-and-landed-next-to-reasoning-models-28ga", "kind": "news", "date": "2026-11-05", "why": "第三方把 Jev 放上 LLM Chess 榜：jev-latest 约第 59 名、Elo 约 243，与 Qwen3.6-27B、o4-mini-medium 相邻，但每局成本仅约 0.0015 美元——“只做决策、不写文本”的模型在需要选择的任务上能摸到推理模型的水平。"}, {"title": "Ragic Makes AI Agents More Affordable With Automatic Jev", "url": "https://rss.globenewswire.com/news-release/2026/11/05/3396808/0/en/ragic-makes-ai-agents-more-affordable-with-automatic-jev-selection-for-classification-tasks.html", "kind": "news", "date": "2026-11-05", "why": "无代码数据库 Ragic 的 AI Agent 开始自动用 Jev 替代通用 LLM 做分类任务，官方估计同类任务模型成本可降 97–98%——Jev 从“便宜分类器”走向产品内默认路由。"}, {"title": "Jev Adds Vision: Cheaper Extraction, Not Yet Production-Ready", "url": "https://medium.com/ai-architecture-and-engineering/jev-adds-vision-cheaper-extraction-not-yet-production-ready-319e505554d9", "kind": "news", "date": "2026-10-30", "why": "对 Jev 1.14 视觉扩展的第三方评测：图像输入按普通输入 token 计价、无独立视觉定价档，但厂商 CEO 亲口承认视觉与长上下文功能未达生产级；并指出 OpenAI 10 月 6 日向全体开发者开放 Decisions API（0.10 美元/百万输入 token）是对 Jev 品类的直接回应，决策模型赛道的价格与能力竞争正在升温。"}, {"title": "TypeSafe releases Jev 1.14: images, box type, 262k context (jev-preview)", "url": "https://www.mark B（24 天涨 37.5×）", "url": "https://temperature2.com/p/2026-10-10-typesafe-jev-870-million-series-a/", "kind": "news", "date": "2026-10-10", "why": "Jev 母公司 TypeSafe 宣布 a16z 领投的 $870M A 轮，估值 $7.5B——距离 $200M 种子轮仅 24 天；官方称约 1/3 财富 500 强已在用（未独立验证），Martin Casado 进董事会。决策模型赛道资本热度的最强信号；微软同日以完全相同的 $0.042/百万 token 定价推出 Decision One 对打，竞争格局已定。"}, {"title": "Microsoft Takes Aim at Jev With a Fast, Cheap Decision Model", "url": "https://techstrong.ai/features/microsoft-takes-aim-at-jev-with-a-fast-cheap-decision-model/", "kind": "news", "date": "2026-10-13", "why": "微软推出对标 Jev 的 Decision-1 决策模型：定价与 Jev 完全相同（$0.042/百万输入 tokens、输出免费），不打价格战、打 benchmark（JevBench 开放榜单）与 Azure Foundry 分发；Xbox（1 万+玩家反馈分类，14 倍速）、Copilot（100 倍速评测回复）、Discovery（重规划循环快 4 倍）内测数据亮眼——Jev 发布仅一个月，决策模型赛道就进入巨头正面下场阶段。"}, {"title": "Workday put the four-week-old Jev model on every user's home screen", "url": "https://theinference.org/article/a16z-priced-typesafe-at-7-5-billion-workday-put-the-four-week-old-model-on-every-user-s-home-screen", "kind": "news", "date": "2026-10-13", "why": "Workday 把 11 亿美元收购的 Sana 助手设为 HR/财务/IT 软件的默认首页，由仅发布四周的 Jev 决定每个界面元素（卡片/表单/日历）的显隐——Banking77 意图分类实测 Jev 中位 175ms、81% 准确率，Claude Opus 5 需 2.3 秒且贵 22 倍。这是决策模型品类迄今最有分量的生产落地证据，也解释了 a16z 为何给出 $7.5B 估值。"}, {"title": "TypeSafe AI Decision Model Jev Sets Vercel Record", "url": "https://www.theinduspulse.com/ai/typesafe-ai-decision-model-jev-sets-adoption-record-on-vercel", "kind": "news", "date": "2026-10-17", "why": "Vercel 10-15 发布的 AI Gateway Index 确认：Jev 上线 24 小时覆盖近 13% 付费团队、两周达 35%，为该网关史上采用最快的模型发布——决策模型品类得到市场验证。"}, {"title": "OpenAI makes its Jev competitor widely available as decision model competition heats up", "url": "https://techcrunch.com/2026/10/22/openai-makes-its-jev-competitor-widely-available-as-decision-model-competition-heats/", "kind": "news", "date": "2026-10-22", "why": "OpenAI 的 Decisions API（GPT-6 Luna 改装）10-22 全面 GA，直接对打 Jev：Speak 实测动作间隔从 1.4s 降到 0.13s；公开榜单上 Liquid D1 Ultra 与 Base Lab Elephant-1 领先，Jev 居 3/7、OpenAI 居 8/14——决策模型赛道从\"Jev 独舞\"进入多供应商竞争，对我们流水线的分类/排序选型意味着真实的议价与备选空间。"}, {"title": "What Is Jev? TypeSafe's Decision Model, Tested Against LLMs", "url": "https://aimlapi.com/blog/what-is-jev", "kind": "news", "date": "2026-10-22", "why": "第三方独立实测（900 样本×3 任务）：Jev 1.13 内容审核 F1 全场最佳、但答案质量评分垫底；比 Claude Opus 5.5 快 6–18x、便宜 84–150x；0.9+ 置信度下准确率 94–96%（校准确实成立）；作为 Opus 前置过滤器可在 38–45% 成本下保持同等分类准确率——给我们 pipeline 里 Jev 承担预筛角色提供了去营销化的配置依据。"}, {"title": "vLLM Semantic Router Releases d3-ultra: A 27B Open Multimodal Decision Model", "url": "https://www.marktechpost.com/2026/10/26/vllm-semantic-router-d3-ultra-27b-multimodal-decision-model/?amp=1", "kind": "news", "date": "2026-10-26", "why": "决策模型赛道出现首个开源多模态竞品：27B 参数、Apache-2.0 开源权重、文本/JSON/图像/视频输入、Box+track 定位，自报 SR-Text 87.2 高于 Jev 1.14 的 73.1（厂商自报口径，需独立复测）；免费 API 与自托管双路线，意味着 Jev 的“快而便宜”不再是闭源独占，流水线选型有了可本地部署的备选。"}, {"title": "Decision Studio: Try Decision Models Without Writing a Request", "url": "https://llmgateway.io/blog/decision-studio", "kind": "news", "date": "2026-10-27", "why": "LLM Gateway 上线 Decision Studio：无需手写 JSON 即可在浏览器里试决策模型，并排对比 OpenAI gpt-6-luna-decisions、Microsoft Decision-1 与 Jev 1.14/1.13，输出可一键转成 /v1/decisions 请求——决策模型从“API 概念”走向“可上手试用的工具”，对评估 Jev 替代品的成本很低。"}, {"title": "MotherDuck 推出 prompt_jev()：在 SQL 里直接用 Jev 做文本分类", "url": "https://motherduck.com/videos/prompt-jev-sql-text-classification/", "kind": "news", "date": "2026-10-30", "why": "MotherDuck 新函数 prompt_jev() 让 Jev 决策模型直接在 SQL 内跑文本分类，官方演示称 10 万行分类 89% 准确率仅用 40 秒，而同等 LLM 调用需 32 分钟、37.58 美元——决策模型从“API 概念”落到数据栈内的又一生产证据，与我们流水线用 Jev 做预筛的选型直接相关。"}, {"title": "Your Decision is Hacked: Security Threat Assessment for System One Models", "url": "https://medium.com/@itay955/jev-security-threat-assessments-for-system-one-models-87cb5614a581", "kind": "news", "date": "2026-11-02", "why": "System One 模型（Jev、OpenAI Decisions）的安全威胁评估：决策模型虽不生成长文本，仍可被投毒导致决策翻转与分数操纵，而这类模型正被放在 agent 工具调用门控、退款审批、风险评分等关键路径上——与用户把 Jev 只用作预筛、绝不做授权裁决的定位直接相关，提醒决策层本身也需要防护。"}, {"title": "Same question, different words: how much do Jev's probabilities change?", "url": "https://medium.com/telusdigital-research-hub-briefs/same-question-different-words-how-much-do-jevs-probabilities-change-165e5889f7a7", "kind": "news", "date": "2026-11-04", "why": "TELUS Digital 研究团队对 Jev 的概率敏感性实测：18 道医疗问题问 5940 次，改写上下文平均只移动 2.9 个百分点，但改写问题措辞时个别条目从 40% 跳到 82%，直接关系到“Jev 只做预筛、不做授权裁决”定位下的校准可信度。"}, {"title": "How Decision Models Work: Inside the Open System One Models", "url": "https://medium.com/@cerizzi/how-decision-models-work-inside-the-open-system-one-models-078de1398b58", "kind": "news", "date": "2026-11-04", "why": "对 5 个开源决策模型（KnowLine、vLLM-SR、Perplexity Decider、Clef、Strands Decider）与 Jev、OpenAI Decisions API 的实测对照：200 个常规决策上开源大模型正确率 93%–98%、单 GPU 106–194ms，Jev 1.14 为 59ms、Decisions API 往返 161ms；是 Jev 生态“开放对照组”的一手实测资料。"}, {"title": "System One decision models: Jev and the case for classifiers", "url": "https://www.octaneural.com/research/system-one-decision-models-jev-classifiers", "kind": "news", "date": "2026-11-01", "why": "第三方评测汇总：Arize、OpenRouter、Red Hat 的独立测试显示 Jev 的速度与成本宣称基本成立（中位延迟约 130–360ms，成本比前沿裁判低数十至数百倍），Vercel 上线 24 小时内近 13% 的付费团队在用 Jev；但幻觉检测需调阈值才能追平 Opus 5，校准在中段仍有偏差。"}, {"title": "What Is Jev? TypeSafe AI's New Non-Chat Model, Explained", "url": "https://geotoolbox.ai/blog/what-is-jev-ai", "kind": "news", "date": "2026-11-03", "why": "系统梳理 Jev 的定位与现状：11 月 3 日起注册开放、无需等候名单；Box 与图像仍处实验阶段；并指出 RLCD 方法与校准曲线至今未公开，官方自测中 Jev 与参考答案一致率 67.8%。"}, {"title": "Decision Models: Stop Paying a Chat Model to Choose", "url": "https://www.mmntm.net/articles/decision-models", "kind": "news", "date": "2026-11-18", "why": "决策模型品类格局更新：谷歌 11 月 11 日推出 Gemini Decisions API，OpenAI Decisions API 已于 10 月 22 日 GA；第三方指数上 Liquid D1 Ultra 与 Base Lab Elephant-1 居前，Jev 排第 7/第 3、OpenAI 第 8/第 14。"}, {"title": "How Decision Models Make AI Hallucination Vanish", "url": "https://spectrum.ieee.org/typesafe-ai-hallucination-decision-models", "kind": "news", "date": "2026-11-16", "why": "IEEE Spectrum 深度解析 Jev/Syste const ARCH_RUNS = null;
const SRC_CLS = {"arXiv":"", "HuggingFace":"hf", "OpenAlex":"oa", "期刊补录":"j"};
/* 数据缺失 vs 零新增必须可区分：date 为空时头部显示"数据缺失" */
function dline(d){ return d ? d + ' 更新 · ' : '数据缺失 · '; }
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s||'').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const fmtN = n => { n = n||0;
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
  return '' + n; };
const avatar = (a, h, cls, dot) => {
  const ch = esc((((a && a.name) || h || '?') + '').trim().charAt(0));
  const fb = '<span class="x-av-fb">' + ch + '</span>';
  const img = (a && a.avatar)
    ? '<img src="' + esc(a.avatar) + '" alt="" loading="lazy" onerror="this.remove()">'
    : '';
  return '<span class="av-wrap ' + cls + '">' + fb + img
    + (dot ? '<span class="x-dot" hidden></span>' : '') + '</span>';
};
const colSummary = (t, b) => '<div class="x-summary"><div class="x-sum-t">' + esc(t)
  + '</div><div class="x-sum-b">' + md(b) + '</div></div>';

/* theme */
const rootEl = document.documentElement, themeBtn = document.getElementById('themeBtn');
function setTheme(t){ rootEl.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try{ localStorage.setItem('lit-theme', t); }catch(e){} }
try{ setTheme(localStorage.getItem('lit-theme') || 'light'); }catch(e){ setTheme('light'); }
themeBtn.addEventListener('click', () =>
  setTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* tabs */
const TABS = ['papers','models','interests','ghtrending','trending','x','apple','deals','finance','ainews'];
const PANES = TABS.concat(['library']);
function showTab(name){
  if (!PANES.includes(name)) name = 'papers';
  if (name === 'x') markXSeen();
  PANES.forEach(t => {
    document.getElementById('pane-' + t).hidden = (t !== name);
    const b = document.querySelector('[data-tab="' + t + '"]');
    if (b) b.classList.toggle('on', t === name);
  });
  ensureTab(name);  // 懒渲染：首次切到某 tab 时才渲染
  if (('' + location.hash).slice(1) !== name){
    try{ history.replaceState(null, '', '#' + name); }catch(e){}
  }
}
document.querySelectorAll('[data-tab]').forEach(b =>
  b.addEventListener('click', () => showTab(b.dataset.tab)));
document.getElementById('libBtn').addEventListener('click', () => showTab('library'));

/* ---------- papers ---------- */
const all = [];
DATA.days.forEach(d => d.papers.forEach(p => all.push(Object.assign({}, p, {date: d.date}))));
const srcOf = p => p.supplement ? '期刊补录' : (p.source || 'arXiv');
const state = {q:'', src:'', cat:'', day:''};
document.getElementById('sTotal').textContent = DATA.all_total;
document.getElementById('sDays').textContent = DATA.all_days;
document.getElementById('sArxiv').textContent = all.filter(p => srcOf(p) === 'arXiv' && !p.supplement).length;
document.getElementById('sExtra').textContent = all.filter(p => !p.supplement && srcOf(p) !== 'arXiv').length;
document.getElementById('sJour').textContent = all.filter(p => p.supplement).length;
const srcChips = document.getElementById('srcChips');
const srcs = [''].concat([...new Set(all.map(srcOf))].sort());
const SRC_NAME = {'':'全部来源'};
srcs.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip' + (s === '' ? ' on' : '');
  b.textContent = SRC_NAME[s] || s;
  b.dataset.src = s;
  b.addEventListener('click', () => {
    state.src = s;
    srcChips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  srcChips.appendChild(b);
});
const cats = [...new Set(all.flatMap(p => (p.cats || []).length ? p.cats : (p.supplement ? ['期刊'] : [])))].sort();
const catSel = document.getElementById('cat');
cats.forEach(c => { const o = document.createElement('option'); o.value = c;
  o.textContent = (CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c; catSel.appendChild(o); });
catSel.addEventListener('change', () => { state.cat = catSel.value; render(); });
const daySel = document.getElementById('day');
DATA.days.forEach(d => { const o = document.createElement('option'); o.value = d.date; o.textContent = d.date; daySel.appendChild(o); });
daySel.addEventListener('change', () => { state.day = daySel.value; render(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
function pdfUrl(u){
  const m = (u || '').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function codeLink(code){
  const m = (code || '').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);
  return m ? '<a href="https://github.com/' + esc(m[1]) + '" target="_blank" rel="noopener">💻 ' + esc(m[1]) + '</a>' : '';
}
function badges(p){
  const s = srcOf(p);
  let h = '<span class="badge ' + (SRC_CLS[s] || '') + '">' + esc(s) + '</span>';
  h += (p.cats || []).map(c => '<span class="badge cat">' +
    esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
  if (p.supplement) h += '<span class="badge cat">期刊/会议</span>';
  return h;
}
function card(p){
  const pdf = pdfUrl(p.url), ch = codeLink(p.code);
  const cite = (p.citations && p.citations !== '尚未收录')
    ? '<span>📊 引用 ' + esc(p.citations) + '</span>' : '';
  const links = (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文页面</a>' : '')
    + (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  return '<div class="card">'
    + '<div class="badges">' + badges(p) + '<span class="date">' + esc(p.date) + '</span></div>'
    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<details class="box zh"><summary>中文摘要</summary><div class="body">' +
        esc(p.zh_abs).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">' +
        esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + ((cite || ch) ? '<div class="meta-row">' + cite + (ch ? '<span>' + ch + '</span>' : '') + '</div>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}
function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){
  let html = '', n = 0;
  const latest = DATA.days[0];
  if (latest && latest.summary && !state.q && !state.src && !state.cat)
    html += colSummary('📌 今日论文综述', latest.summary.slice(0, 1400));
  DATA.days.forEach(day => {
    if (state.day && day.date !== state.day) return;
    const ps = day.papers.filter(match);
    if (!ps.length) return;
    n += ps.length;
    html += '<div class="day"><div class="day-head"><h2>📅 ' + esc(day.date) + '</h2>'
      + '<span class="n">' + ps.length + ' 篇</span></div>';
    if (day.summary && day.date !== latest.date && !state.q && !state.src && !state.cat)
      html += '<div class="x-summary"><div class="x-sum-b">' + md(day.summary.slice(0, 1000)) + '</div></div>';
    html += '<div class="grid">' + ps.map(card).join('') + '</div></div>';
  });
  document.getElementById('list').innerHTML =
    html || '<div class="empty">没有匹配的论文，换个关键词或清除筛选试试。</div>';
  document.getElementById('count').textContent =
    '共 ' + n + ' 篇' + (DATA.all_days > DATA.days.length ? '（近' + DATA.days.length + '天，更早的见右上角 🗂️归档）' : '');
}

    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">'
        + esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.url ? '<div class="links"><a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文链接 ↗</a></div>' : '')
    + '</div>';
}

      + '<div class="grid">' + ps.map(libCard).join('') + '</div></div>';
  }).join('');
  document.getElementById('libList').innerHTML = html || '<div class="empty">论文库暂无内容。</div>';
}

/* ---------- finance (💰财经大事): 长简报 md 渲染 ---------- */
function mdInline(s){
  return esc(s||'')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function renderFinance(){
  const M = FIN || {}, src = M.md || '';
  const n = (src.match(/^(\*\*|[-•▪]\s)/gm) || []).length;
  document.getElementById('finCount').textContent =
    dline(M.date) + n + ' 条';
  const box = document.getElementById('finList');
  if (!src.trim()){ box.innerHTML = '<div class="empty">今日暂无财经大事早报。</div>'; return; }
  let html = '', inList = false, inTable = false;
  const closeList = () => { if (inList){ html += '</ul>'; inList = false; } };
  const closeTable = () => { if (inTable){ html += '</tbody></table>'; inTable = false; } };
  src.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line){ closeList(); closeTable(); return; }
    let m;
    if ((m = line.match(/^###\s+(.*)/))){ closeList(); closeTable(); html += '<div class="fin-h3">' + mdInline(m[1]) + '</div>'; return; }
    if ((m = line.match(/^##\s+(.*)/))){ closeList(); closeTable(); html += '<h2 class="fin-h2">' + mdInline(m[1]) + '</h2>'; return; }
    if (/^#\s/.test(line)){ closeList(); closeTable(); return; }  /* H1 跳过（tab 已有标题） */
    if (/^---+$/.test(line)){ closeList(); closeTable(); html += '<hr class="fin-hr">'; return; }
    if (/^\|.*\|$/.test(line)){
      closeList();
      if (/^\|[\s|\-:]*\|$/.test(line) && /-/.test(line)) return;  /* 表格分隔行跳过 */
      const cells = line.split('|').slice(1, -1).map(c => mdInline(c.trim()));
      if (!inTable){ html += '<table class="fin-table"><tbody>'; inTable = true; }
      html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      return;
    }
    if (/^\*\*\d+\.\s/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item fin-num">' + mdInline(line) + '</li>';
      return;
    }
    if (/^(\*\*|[-•▪]\s)/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item">' + mdInline(line.replace(/^[-•▪]\s/, '')) + '</li>';
      return;
    }
    closeList(); closeTable();
    html += '<p class="fin-p">' + mdInline(line) + '</p>';
  });
  closeList(); closeTable();
  box.innerHTML = '<article class="fin-body">' + html + '</article>';
}

/* ---- X 未读小红点：localStorage 记已读，APP 式 ---- */
const X_SEEN_KEY = 'coco_x_seen_v1';
const getXSeen = () => { try { return JSON.parse(localStorage.getItem(X_SEEN_KEY) || '{}'); } catch(e){ return {}; } };
function renderXDots(){
  const seen = getXSeen();
  let any = false;
  document.querySelectorAll('.x-chip').forEach(ch => {
    const h = ch.getAttribute('data-h'), nw = ch.getAttribute('data-newest') || '';
    const unread = !!(nw && (!seen[h] || nw > seen[h]));
    const dot = ch.querySelector('.x-dot');
    if (dot) dot.hidden = !unread;
    if (unread) any = true;
  });
  const tabDot = document.getElementById('xTabDot');
  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}
function toggleXAcc(btn){
  const g = btn.getAttribute('data-g'), h = btn.getAttribute('data-h');
  markXSeen(h);
  const det = document.getElementById('xd-' + g);
  const wasOpen = btn.classList.contains('open');
  det.parentElement.querySelectorAll('.x-chip.open').forEach(c => c.classList.remove('open'));

    ['📰 AI情报', it.ainews],
  ];
  const body = secs.filter(s => s[1]).map(s =>
    '<div class="arch-sec"><div class="arch-sec-t">' + s[0] +
    (s[2] ? ' <span class="arch-hint">' + esc(s[2]) + '</span>' : '') +
    '</div><div class="arch-sec-b">' + md(s[1]) + '</div></div>'
  ).join('') || '<div class="empty">暂无摘要</div>';
  return '<details class="arch-item"' + (open ? ' open' : '') + '>' +
    '<summary><span class="arch-date">📅 ' + esc(it.date) + '</span>' +
    runs + '<span class="arch-hint">→</span></summary>' +
    '<div class="arch-body">' + body +
    '<a class="arch-go" href="' + ARCH_PREFIX + it.date + '.html">查看当天完整看板 →</a>' +
    '</div></details>';
}
function renderArchList(items, partial){
  const list = document.getElementById('archList');
  if (!items || !items.length){
    list.innerHTML = '<div class="empty">暂无归档</div>';
    return;
  }
  list.innerHTML =
    (partial ? '<div class="empty">本地打开为精简模式，仅显示近 7 天</div>' : '') +
    items.map((it, i) => archItemHTML(it, i === 0)).join('');
}
let archScrollY = 0;
function lockBodyScroll(){
  archScrollY = window.scrollY || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + archScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, archScrollY);
}
async function openArchive(){
  const m = document.getElementById('archModal');
  m.hidden = false;
  lockBodyScroll();
  if (archDigestCache){ renderArchList(archDigestCache.list, archDigestCache.partial); return; }
  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  unlockBodyScroll();
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
