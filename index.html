elligence. we’re letting gpt-6 fill the canvas with high utility visual and interactive components. it’s a pretty big change to chatgpt! we had to craft the right tools for gpt-6 to be able to produce interfaces that are token efficient, stream in instantly, match our design language, and are expressive enough for anything you might talk to chatgpt about.", "created_at": "10-08 05:02", "likes": 1087, "reposts": 72, "replies": 66, "views": 110602, "url": "https://x.com/michpokrass/status/2107939609380331811", "author": "michpokrass"}, {"id": "2107909792945832070", "text": "We're sharing progress on ChatGPT for Teens, our ChatGPT experience for people under 18, alongside a preview of College Planner, new study tools, and support for college advisers and teen voices.\n\nChatGPT for Teens applies automatically to accounts identified as belonging to someone under 18, with protections on by default.\n\nComing soon: College Planner brings application requirements, deadlines, tasks and financial-aid steps together for high school students in the U.S. planning to attend a four-year college.\n\nWe'll keep building these tools, evaluating how they and their protections work in practice, and sharing what we learn.\n\nhttps://openai.com/index/teens-learn-and-plan/", "created_at": "10-08 03:03", "likes": 3087, "reposts": 164, "replies": 246, "views": 351602, "url": "https://x.com/OpenAI/status/2107909792945832070", "author": "OpenAI"}, {"id": "2107895006350791071", "text": "GPT‑6 with Intelligent UI rolls out globally to Plus, Pro, Business, and Enterprise users today and will expand to Free and Go users starting tomorrow.\n\nGPT‑6 in ChatGPT is powered by GPT‑6 Sol for Plus, Pro, Business, and Enterprise tiers, and GPT‑6 Luna for Free and Go tiers. Both are tuned for everyday conversation.\n\nThis update applies to the Chat tab in ChatGPT. The models powering Work and Codex are not changing as part of this release. \nhttps://openai.com/index/gpt-6-for-everyone/", "created_at": "10-08 02:05", "likes": 1701, "reposts": 134, "replies": 73, "views": 322788, "url": "https://x.com/OpenAI/status/2107895006350791071", "author": "OpenAI"}, {"id": "2107895004819775938", "text": "Play around with interactive answers to help customize your response.", "created_at": "10-08 02:05", "likes": 805, "reposts": 23, "replies": 6, "views": 180434, "url": "https://x.com/OpenAI/status/2107895004819775938", "author": "OpenAI"}, {"id": "2107895003490169213", "text": "Deepen your understanding of a topic with visuals that bring concepts to life.", "created_at": "10-08 02:05", "likes": 998, "reposts": 27, "replies": 8, "views": 143374, "url": "https://x.com/OpenAI/status/2107895003490169213", "author": "OpenAI"}, {"id": "2107895002022187411", "text": "Create interactive tools you can use right in the conversation, like a game or interactive budget planning calculator.", "created_at": "10-08 02:05", "likes": 1299, "reposts": 45, "replies": 20, "views": 176461, "url": "https://x.com/OpenAI/status/2107895002022187411", "author": "OpenAI"}, {"id": "2107894999119774148", "text": "With Intelligent UI, GPT‑6 can now compose responses using text, visuals, and interactive elements, choosing how they fit together based on your question.\n\nResponses can include graphics and charts to help explain an idea, along with tappable buttons, forms, and interactive experiences you can use directly in your conversation.", "created_at": "10-08 02:05", "likes": 2303, "reposts": 102, "replies": 44, "views": 318391, "url": "https://x.com/OpenAI/status/2107894999119774148", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2107924677801001381", "text": "Have been waiting for this one for a long time, and I would hate to have to go back to the old version of Chat!", "created_at": "10-08 04:03", "likes": 686, "reposts": 12, "replies": 140, "views": 108131, "url": "https://x.com/sama/status/2107924677801001381", "author": "sama"}, {"id": "2107924408597950702", "text": "ChatGPT can now generate a custom UI for you!", "created_at": "10-08 04:01", "likes": 10969, "reposts": 505, "replies": 639, "views": 1481989, "url": "https://x.com/sama/status/2107924408597950702", "author": "sama"}, {"id": "2107691577015755196", "text": "and thank you to the untold number of people who put in the technical work, brick by brick over the generations, to get us to the point where such a wonder is possible.", "created_at": "10-07 12:36", "likes": 3937, "reposts": 126, "replies": 219, "views": 317592, "url": "https://x.com/sama/status/2107691577015755196", "author": "sama"}, {"id": "2107691262795239805", "text": "thank you to the machines, and the structure of reality, for letting us understand a little more.", "created_at": "10-07 12:35", "likes": 3483, "reposts": 98, "replies": 181, "views": 255756, "url": "https://x.com/sama/status/2107691262795239805", "author": "sama"}, {"id": "2107691261776052633", "text": "looking up at the stars with extra awe tonight.\n\n\"thy sea is so great and my boat is so small.\"", "created_at": "10-07 12:35", "likes": 12458, "reposts": 663, "replies": 1174, "views": 1713182, "url": "https://x.com/sama/status/2107691261776052633", "author": "sama"}, {"id": "2107623610483720463", "text": "We are entering a new era of discovery now:\n\nhttps://openai.com/index/sharing-ai-progress-in-mathematics/", "created_at": "10-07 08:06", "likes": 10811, "reposts": 961, "replies": 742, "views": 1891935, "url": "https://x.com/sama/status/2107623610483720463", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2108349826727588000", "text": "Today, we are announcing ChatGPT.\n\nIt is here: https://chatgpt.com/", "created_at": "10-09 08:12", "likes": 14965, "reposts": 397, "replies": 1700, "views": 2063824, "url": "https://x.com/thsottiaux/status/2108349826727588000", "author": "thsottiaux"}, {"id": "2108275041276420573", "text": "Day 4/\n\nWe have improved steering to be instant, leading to the model now reacting much faster to adjustments you make, allowing you to course-correct direction in realtime and not have the model waste effort.\n\nAlso releasing GPT-6.1 Sol ultrafast. The two work very well together.", "created_at": "10-09 03:15", "likes": 6108, "reposts": 165, "replies": 1105, "views": 369491, "url": "https://x.com/thsottiaux/status/2108275041276420573", "author": "thsottiaux"}, {"id": "2108084615349170480", "text": "Day 3 (encore)/\n\nWe silently re-shipped codex cloud. It’s pretty good now", "created_at": "10-08 14:38", "likes": 6510, "reposts": 172, "replies": 1096, "views": 714994, "url": "https://x.com/thsottiaux/status/2108084615349170480", "author": "thsottiaux"}, {"id": "2108040921044639779", "text": "Confirmed landed across all accounts. How are we doing so far?", "created_at": "10-08 11:44", "likes": 7473, "reposts": 111, "replies": 1550, "views": 687714, "url": "https://x.com/thsottiaux/status/2108040921044639779", "author": "thsottiaux"}, {"id": "2107913738791596286", "text": "Will be there by EOD PST.", "created_at": "10-08 03:19", "likes": 2377, "reposts": 22, "replies": 197, "views": 422437, "url": "https://x.com/thsottiaux/status/2107913738791596286", "author": "thsottiaux"}, {"id": "2107913674593644711", "text": "Day 3/\n\nThe big one is GPT-6 in Chat, but today is also a little celebration day with a new high of 40M active users across Codex and ChatGPT Work.\n\nLoading a banked reset in everyone's paid accounts. See you again tomorrow!", "created_at": "10-08 03:19", "likes": 19962, "reposts": 701, "replies": 1625, "views": 2093375, "url": "https://x.com/thsottiaux/status/2107913674593644711", "author": "thsottiaux"}, {"id": "2107912709715132482", "text": "We're going beyond text and are releasing a new version of GPT-6 to all users in ChatGPT. Lots of model and infra improvements coming together here to scale it to 1.2B users!", "created_at": "10-08 03:15", "likes": 6913, "reposts": 239, "replies": 484, "views": 692812, "url": "https://x.com/thsottiaux/status/2107912709715132482", "author": "thsottiaux"}, {"id": "2107676653895967106", "text": "Also! Good evening!!", "created_at": "10-07 11:37", "likes": 1834, "reposts": 9, "replies": 73, "views": 168529, "url": "https://x.com/thsottiaux/status/2107676653895967106", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2108388035767521718", "text": "The attention to detail is a little concerning.", "created_at": "10-09 10:44", "likes": 889, "reposts": 49, "replies": 44, "views": 53278, "url": "https://x.com/OpenAIDevs/status/2108388035767521718", "author": "OpenAIDevs"}, {"id": "2108302123553247742", "text": "I built an escape room game with Codex.\n\nIt features my cute @OpenAIDevs dot solving puzzles on the @modretro Chromatic.\n\nSOUND ON 🔊", "created_at": "10-09 05:02", "likes": 63, "reposts": 4, "replies": 5, "views": 10673, "url": "https://x.com/fedesarquis/status/2108302123553247742", "author": "fedesarquis"}, {"id": "2108263846511362361", "text": "Welcome to GPT-6.1 Sol ultrafast! \nHere is a small demo of me making very quick changes in a native SwiftUI iOS app using ultrafast. It's is up to 8X faster than standard mode and open many workflows with the right agentic setup. 🧵", "created_at": "10-09 02:30", "likes": 314, "reposts": 15, "replies": 19, "views": 26697, "url": "https://x.com/Dimillian/status/2108263846511362361", "author": "Dimillian"}, {"id": "2108262843544211494", "text": "In Codex and ChatGPT Work, access is available on Pro 500, eligible usage-based Enterprise, and credit-based Edu plans. Enterprise admins must enable access.\n\nUltrafast for GPT-6.1 Sol is available in all supported regions, including support for data residency in the US and EU. We’ve also added support for EU data residency for GPT-6.1 Sol Fast and GPT-6 Luna Fast.\n\nhttps://developers.openai.com/api/docs/guides/ultrafast-mode", "created_at": "10-09 02:26", "likes": 244, "reposts": 11, "replies": 36, "views": 46237, "url": "https://x.com/OpenAIDevs/status/2108262843544211494", "author": "OpenAIDevs"}, {"id": "2108262830348886150", "text": "API pricing for GPT-6.1 Sol in Ultrafast mode is $12 per million input tokens and $60 per million output tokens.\n\nBuilt for work where speed and intelligence make a difference: debugging an outage, agents navigating apps, and live experiences where every second counts.", "created_at": "10-09 02:26", "likes": 452, "reposts": 19, "replies": 22, "views": 57510, "url": "https://x.com/OpenAIDevs/status/2108262830348886150", "author": "OpenAIDevs"}, {"id": "2108262812489531498", "text": "Ultrafast is rolling out today for GPT-6.1 Sol in the API, Codex, and ChatGPT Work.\n\nNear-Astra intelligence at up to 8x faster speeds than Sol Standard, so you can build as fast as the ideas come.", "created_at": "10-09 02:26", "likes": 3645, "reposts": 235, "replies": 303, "views": 582753, "url": "https://x.com/OpenAIDevs/status/2108262812489531498", "author": "OpenAIDevs"}, {"id": "2108222064725483776", "text": "point your codex at https://github.com/openai/mcp-extensions to start building a chatgpt plugin!", "created_at": "10-08 23:44", "likes": 512, "reposts": 16, "replies": 30, "views": 51469, "url": "https://x.com/mxstbr/status/2108222064725483776", "author": "mxstbr"}, {"id": "2108206463755944219", "text": "GPT-6 Luna is the fastest Decisions model today, at 180ms on global requests 🏁\n\nFollowed by Jev and Perplexity Decider:", "created_at": "10-08 22:42", "likes": 473, "reposts": 20, "replies": 26, "views": 30904, "url": "https://x.com/OpenRouter/status/2108206463755944219", "author": "OpenRouter"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2108302545953157156", "text": "This is part of our broader effort to make the systems we all rely upon more secure and resilient.\n\nThat work will take time: the Anthropic Cyber Mission will expand and change as we learn what works, alongside our partners in the public and private sectors.", "created_at": "10-09 05:04", "likes": 71, "reposts": 1, "replies": 5, "views": 13429, "url": "https://x.com/AnthropicAI/status/2108302545953157156", "author": "AnthropicAI"}, {"id": "2108302543977906649", "text": "To secure open-source software, we’re launching OSS Scanner.\n\nWe’ll use our frontier models to periodically scan opted-in open-source projects for vulnerabilities, at no cost. Our reports will provide a proof-of-concept, explanation, and suggested fix.\n\nhttps://www.anthropic.com/research/launching-opt-in-vuln-finding-service-for-open-source", "created_at": "10-09 05:04", "likes": 200, "reposts": 20, "replies": 16, "views": 23212, "url": "https://x.com/AnthropicAI/status/2108302543977906649", "author": "AnthropicAI"}, {"id": "2108302539498414208", "text": "We’re launching the Anthropic Cyber Mission, a new effort to secure critical infrastructure and open-source software.\n\nhttps://www.anthropic.com/news/anthropic-cyber-mission", "created_at": "10-09 05:04", "likes": 984, "reposts": 100, "replies": 75, "views": 75354, "url": "https://x.com/AnthropicAI/status/2108302539498414208", "author": "AnthropicAI"}, {"id": "2108290395599667700", "text": "An astrophysicist worked with Claude Science to create the first complete ultraviolet map of the sky. Astronomers have already created complete sky maps from radio to gamma rays. But large regions of the sky have never been observed in UV.\n\nIn today’s science blog, Brice Ménard explains how he guided Claude to find existing datasets, combine them, and fill in the gaps with statistical inference. The work would have taken humans weeks of work, but, with Claude, just took a few days while Ménard worked on other projects.\n\nThe resulting map is a useful teaching tool and an example of exactly the sort of slow, low-priority work which scientists never quite get around to, but which AI now makes feasible.\n\nRead more: https://www.anthropic.com/research/the-missing-map-of-the-sky", "created_at": "10-09 04:16", "likes": 1938, "reposts": 188, "replies": 116, "views": 86696, "url": "https://x.com/AnthropicAI/status/2108290395599667700", "author": "AnthropicAI"}, {"id": "2108226292235809081", "text": "We're deepening our commitment to scientific research and technological discovery by committing $150 million to the Genesis Mission.\n\nWe'll also make Claude and our technical support available to more than 15 federal agencies.\n\nhttps://www.anthropic.com/news/genesis-mission-commitment", "created_at": "10-09 00:01", "likes": 2331, "reposts": 175, "replies": 173, "views": 137573, "url": "https://x.com/AnthropicAI/status/2108226292235809081", "author": "AnthropicAI"}, {"id": "2107894208547983705", "text": "Claude Haiku 5.5, our latest model:", "created_at": "10-08 02:01", "likes": 7208, "reposts": 286, "replies": 268, "views": 386699, "url": "https://x.com/AnthropicAI/status/2107894208547983705", "author": "AnthropicAI"}, {"id": "2107546569654636883", "text": "We’re expanding our Cyber Verification Program to give security professionals broader access to our most capable models.\n\nThrough this program, verified security professionals can access Claude Mythos 5.1, Opus 5.5, and Sonnet 5.5 with safeguards designed for defensive work.\n\nWe’re also opening up new tiers to allow for authorized offensive work, like penetration testing and red-teaming. \n\nhttps://www.anthropic.com/news/cyber-verification-program", "created_at": "10-07 03:00", "likes": 5767, "reposts": 619, "replies": 481, "views": 1271214, "url": "https://x.com/AnthropicAI/status/2107546569654636883", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2108202009673244700", "text": "New essay for the @GoogleDeepMind Institute with James Manyika on AI x Science, \"Bending the Curve of Discovery\".\n\nWhile accelerating existing scientific practices is certainly useful, the real promise of AI is its potential to act as an invention of a method of invention (IMI) a la Griliches--e.g., the microscope or statistical inference--which would unlock questions and whole modes of discovery that were previously beyond human reach.\n\nToday, LLMs and specialized models like AlphaFold act as economic complements. LLMs handle analysis, coding, and writing, while specialized tools handle domain-specific predictions. Most handoffs between them run through the scientist.\n\nWhat may the future of science look like? LLMs orchestrating those handoffs automatically--prompting specialized models, auditing outputs, and looping until either the question is answered or a non-automated stage is reached (e.g., wet lab testing). The scientist's role shifts from running each step to designing this loop. We saw a glimpse of this workflow with Anthropic’s enzyme discovery a few weeks ago, and we're seeing this in our own work too.\n\nThis raises foundational epistemic questions:\n\n1. What will scientific understanding look like when discoveries are made by black-box models whose output is increasingly difficult to interpret?\n2. How do we extract underlying mechanisms, not just outputs, as science becomes more automated? What will theory look like?\n3. If AI automates the writing and junior lab work, how do we train the next generation of scientists to push the frontier?\n4. What will motivate scientists in this epistemic reality?\n\nThere's an economics angle too. Hypothesis generation gets cheap, so bottlenecks move downstream to verification and to choosing which questions are worth asking. Realizing AI’s full potential will take investment in infrastructure and institutional reform--making this as much an organizational challenge as a technical one\n\nWe don't have the answers yet, and I'd love to hear what others think.\n\nPaper here: https://bit.ly/ai-in-science", "created_at": "10-08 22:25", "likes": 192, "reposts": 42, "replies": 13, "views": 23452, "url": "https://x.com/alexolegimas/status/2108202009673244700", "author": "alexolegimas"}, {"id": "2107873568822276533", "text": "Building predictive biology models is one of the most important scientific challenges of our time, but solving this requires new experimental biological data at an unprecedented scale. \n\nI’m pleased to announce that @GoogleDeepmind is partnering with @ChanZuckerberg’s Virtual Biology Initiative to create the multi-modal datasets needed for improved predictive biology models.\n\nI wrote recently about the need to discover how life works at many different scales, from DNA and individual proteins to living cells and whole-body health. As we learnt from AlphaFold and the Protein Data Bank, solving grand biological challenges will not be possible without high-quality open data and efforts like the @czbiohub initiative.\n\nRead the announcement here: https://biohub.org/news/virtual-biology-initiative-expansion\n\nAnd my previous essay here: https://www.linkedin.com/pulse/understanding-life-every-scale-pushmeet-kohli-m2ofe/\n\n@AllenInstitute, @BroadInstitute, @GladstoneInst, @humancellatlas, @ProteinAtlas, @sangerinstitute, @IsomorphicLabs, @Meta", "created_at": "10-08 00:39", "likes": 414, "reposts": 41, "replies": 7, "views": 30965, "url": "https://x.com/pushmeet/status/2107873568822276533", "author": "pushmeet"}, {"id": "2107834254222581862", "text": "SynthID Detector can quickly identify our watermarks in video, audio and images – even after edits, like adding filters. ✂️\n\nYou can also use existing AI identification features found in @GoogleChrome, @Google Search, and the @GeminiApp.", "created_at": "10-07 22:03", "likes": 63, "reposts": 4, "replies": 12, "views": 17605, "url": "https://x.com/GoogleDeepMind/status/2107834254222581862", "author": "GoogleDeepMind"}, {"id": "2107834249680499136", "text": "SynthID Detector is now available to everyone. 🌐\n\nCheck whether online content was generated using @GoogleAI, or with tools from our industry partners – including @OpenAI, @NVIDIA, Kakao and coming soon, @Apple.\n\nTry it out → https://synthid.com", "created_at": "10-07 22:03", "likes": 1383, "reposts": 252, "replies": 198, "views": 147763, "url": "https://x.com/GoogleDeepMind/status/2107834249680499136", "author": "GoogleDeepMind"}, {"id": "2107502289652982118", "text": "At 740M parameters, it’s competitive across benchmarks – even outperforming some specialist models more than twice its size.\n\nDevelopers can use it to add multimodal search to their apps – like finding moments in a video using a voice memo – or pair it with Gemma 4 for private, on-device RAG.\n\nEmbeddingGemma 2 is released under an Apache 2.0 license. Check out the weights on @HuggingFace and @Kaggle.\n\nFind out more → https://goo.gle/4y9wXgl", "created_at": "10-07 00:04", "likes": 556, "reposts": 44, "replies": 26, "views": 56808, "url": "https://x.com/GoogleDeepMind/status/2107502289652982118", "author": "GoogleDeepMind"}, {"id": "2107502286758895878", "text": "Meet EmbeddingGemma 2, our first natively multimodal open model for on-device embeddings.\n\nIt expands beyond text to unify code, images, audio, and video in a shared space. 🧵", "created_at": "10-07 00:04", "likes": 4389, "reposts": 526, "replies": 242, "views": 801183, "url": "https://x.com/GoogleDeepMind/status/2107502286758895878", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2108329198955958339", "text": "Today @TheLancet published our AMIE study with @BIDMC_Medicine, the first prospective study of patient-facing conversational diagnostics in a real clinic.\n\nAMIE is a research system people can chat with before doctors appointments. Testing AMIE outside the lab with real urgent care patients showed how technology can help gather medical histories safely. Clinicians reported that the summaries helped them prepare for visits in 75% of cases and influenced their approach to care in more than half. AMIE’s differential diagnoses also matched the doctors’ final diagnoses 90% of the time giving clinicians more time to focus on patient care.\n\nIt’s Google’s first-ever paper in The Lancet’s main journal!", "created_at": "10-09 06:50", "likes": 582, "reposts": 103, "replies": 107, "views": 90263, "url": "https://x.com/sundarpichai/status/2108329198955958339", "author": "sundarpichai"}, {"id": "2108257472553386059", "text": "Great to be with 700+ @googlecloud  customers at the historic NASA Hangar One for Gemini at Work! \n\nToday, we introduced the new Gemini agent, a single, universal agent for work that has all of your business context and answers your questions, handles your knowledge work, creates your images and media, and writes and runs code - all from a single prompt box. It is connected to your personal workflows, your systems of record, and your enterprise controls.\n\nIt’s built around a few core architectural principles:\n\nUnified Agent: Gemini can answer questions, do knowledge work and generate code from a single prompt box.\n\nAccess: Gemini is web-based and can be accessed from any device and integrated into third-party applications. It can also operate without a dedicated user interface.\n\nPersistent Execution: It runs in the cloud, which means it maintains a single set of memories, context and one personalization graph no matter where you access it.\n\nMulti-Agent Orchestration: Gemini can create sub-agents to tackle multi-step tasks and can also act as a coworker agent with a defined role and its own dedicated identity\n\nContext: Gemini knows your tools, data, and work history and learns how you work the more you use it.\nModel Choice Flexibility: It orchestrates across multiple models to deliver optimal quality and lower your costs.\n\nRead more in our blog: https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026", "created_at": "10-09 02:05", "likes": 1712, "reposts": 157, "replies": 144, "views": 120214, "url": "https://x.com/sundarpichai/status/2108257472553386059", "author": "sundarpichai"}, {"id": "2107501975671890211", "text": "Introducing EmbeddingGemma 2, a new open multimodal model that sets the standard for on-device efficiency.\n\n- our first open, natively multimodal embedding model\n- handles text, code, image, video, and audio tasks within a lightweight, modular 740M parameter form factor\n- ideal for offline, privacy-first RAG when paired with Gemma 4\n- outperforms some specialist models more than twice its size\n\nWeights available now on Hugging Face.", "created_at": "10-07 00:03", "likes": 8725, "reposts": 891, "replies": 434, "views": 775201, "url": "https://x.com/sundarpichai/status/2107501975671890211", "author": "sundarpichai"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2108386202080657757", "text": "more 🔛  https://github.com/Tencent-Hunyuan/ExplorationBench", "created_at": "10-09 10:36", "likes": 10, "reposts": 1, "replies": 0, "views": 1337, "url": "https://x.com/TencentHunyuan/status/2108386202080657757", "author": "TencentHunyuan"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": [{"id": "2105915715241062644", "text": "Please check out @DeepSeekHarness. We just released packaged desktop versions for macOS and Windows; Linux users can get it from the @​deepseek-ai/dsh package on npm. https://deepseek.com/harness", "created_at": "10-02 15:00", "likes": 4590, "reposts": 358, "replies": 238, "views": 452731, "url": "https://x.com/deepseek_ai/status/2105915715241062644", "author": "deepseek_ai"}, {"id": "2097930627949711516", "text": "🌐 Supporting open source. Expanding deployment options.\n\nWe’ll work closely with the open-source community on V4.1-Flash inference support and explore more deployment options.\nPlanning a large-scale deployment with 2,000 GPUs + a storage cluster? Let’s talk.\n\n🔹 Model: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash\n🔹 Paper: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf\n\n6/6", "created_at": "09-10 14:10", "likes": 2851, "reposts": 212, "replies": 68, "views": 356538, "url": "https://x.com/deepseek_ai/status/2097930627949711516", "author": "deepseek_ai"}]}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2102372557190230244", "text": "Meet the new Kimi Browser Extension, formerly Kimi WebBridge.\n\nFrom your browser sidebar, you can chat with Kimi to navigate websites, fill out forms, and get things done.\n\nFor repetitive tasks, record your steps once and save them as a skill. Kimi can take it from there next time.\n\nAvailable now on http://kimi.ai/products/kimi-browser-extension and the Chrome Web Store.", "created_at": "09-22 20:20", "likes": 984, "reposts": 71, "replies": 67, "views": 80227, "url": "https://x.com/Kimi_Moonshot/status/2102372557190230244", "author": "Kimi_Moonshot"}, {"id": "2102244258531213596", "text": "Kimi K3 is now on const FIN = {"date": "2026-10-09", "md": "# ☀️ 财经大事早报（2026-10-09）\n\n## 📌今日大势\n\n**1. [全球债市抛售加剧，美 30 年期收益率创 2002 年以来新高](https://www.ft.com/content/eec1e15d-78b9-4706-a518-2a9db4f37128?syn-25a6b1a6=1)**（来源：FT）\n美国 30 年期国债收益率盘中一度升 7.35 个基点至 **5.731%**，10 年期升至 **5.365%**，双双创 2002 年以来高位。导火索是纽约联储 9 月消费者调查：未来一年通胀预期从 3.58% 升至 **3.9%**，创 2023 年 5 月以来最高。FT 另文警告，美国财政部**反复出手干预债市**正在侵蚀自身信誉——华尔街质疑财政部是否有足够\"火力\"持续压低收益率（仅 2025 年美国政府就发债约 4.8 万亿美元）。后续盯：新任美联储主席沃什在杰克逊霍尔年会的首秀表态，以及 390 亿美元 10 年期国债拍卖后收益率的回落能否持续（拍卖认购倍数强劲，曾短暂压低收益率）。\n\n**2. [油价飙升：WTI 重返 91.8 美元，胡塞—沙特冲突升级点燃曼德海峡担忧](https://www.ft.com/content/ec860f96-5a2b-461a-a897-a957860c3dba?syn-25a6b1a6=1)**（来源：FT）\n周四 WTI 原油盘中大涨超 **3%** 至 91.8 美元，一举收复 90 美元关口。直接诱因：胡塞武装宣称用弹道导弹和无人机打击了沙特首都利雅得的阿美石油公司目标；伊朗革命卫队 5 天内在霍尔木兹海峡对 **7 艘\"违规\"油轮**采取行动；一艘油轮在卡塔尔外海被多枚炮弹击中；利雅得机场 **100 多个航班取消**。能源与航运风险正从\"尾部\"变成定价因子。后续盯：霍尔木兹海峡实际通行量（美伊各执一词）、OPEC+ 是否有增产表态。\n\n**3. [美伊战争持续 7 个月，停战试探出现但核心分歧未解](https://news.creaders.net/world/2026/10/07/3055600.html)**（来源：万维读者网/路透）\n两个新信号：国务卿卢比奥称伊朗已\"完全失去\"霍尔木兹海峡控制权（Kpler 数据：海湾原油出口 7 天均值 **1830 万桶/天**，已恢复至战前约 1800 万桶水平）；副总统万斯划出停战核底线——伊朗必须**实质性削减铀浓缩能力**（直指 60% 浓缩铀库存，此前约 440.9 公斤），\"口头承诺不造核武\"不够。特朗普则称战争\"很快\"结束、油价或跌破战前水平，并承诺**中期选举前不打伊朗**。但伊朗革命卫队坚称海峡仍在其\"完全控制\"下，双方说法完全相反。后续盯：下周在利雅得召开的\"麦加防务联盟\"紧急会议（沙特、土耳其、巴基斯坦将商讨与胡塞政治接触，系伊朗提议）。\n\n## 💰宏观与政策\n\n**1. [美联储新主席沃什杰克逊霍尔首秀，市场押注 10 月加息概率超五成](https://finance.eastmoney.com/a/202608273855302452.html)**（来源：东方财富/央视财经）\n本周杰克逊霍尔全球央行年会召开，美联储主席沃什将首次亮相。债市利率走高给沃什出难题：CME 利率观察工具显示，市场预计 10 月议息会议加息的概率**略超五成**。贝莱德固收 CIO 里克·里德提醒，关键要看清美联储的政策反应函数——当前最看重通胀还是就业。分析人士预期沃什可能释放偏鹰派信号。（来源：搜索补漏）\n\n**2. [美国房贷利率七连涨，创 2023 年以来最高](https://www.ft.com/content/04d6ae65-5d5f-4ed6-9c15-16aa0f4d0713?syn-25a6b1a6=1)**（来源：FT Markets）\n美国 30 年期固定房贷利率连续第七周上升，触及 2023 年以来最高水平。长端收益率飙升正沿着\"国债→房贷→房地产\"链条传导，对美国住房可负担性是实质打击。（来源：RSS）\n\n**3. [法国债券抛售蔓延，欧洲上演\"捡漏\"行情](https://www.ft.com/content/9cf103ed-548e-4b06-baed-71632abca961?syn-25a6b1a6=1)**（来源：FT Markets）\n法国国债遭抛售，借贷成本走高，FT 发问\"法国是否对借贷成本过于满不在乎\"。抛售潮中部分欧洲资金开始\"bottom fishing\"（捡漏）。法国还有校园抗议发酵，财政与政治风险叠加。（来源：RSS）\n\n**4. [微软被禁止为外国员工申请美国永居担保](https://www.ft.com/content/5cfecbba-69ed-42d0-98fd-3ae019144692?syn-25a6b1a6=1)**（来源：FT Home）\n特朗普政府移民收紧再落一子：微软被禁止为外国员工提供美国居留（绿卡）担保。这对依赖全球人才的大型科技公司是直接冲击，也可能外溢到 H-1B 与留学生留美路径。后续盯：是否有其他科技巨头被波及。（来源：RSS）\n\n**5. 央行阐明人民币汇率政策立场：中国从不搞竞争性货币贬值**（来源：东方财富/搜索补漏）\n10 月 8 日央行阐明人民币汇率政策立场，强调不搞竞争性贬值。在美元逼近 18 个月高点的背景下表态，意在稳定预期。（来源：搜索补漏）\n\n## 📈市场与投资\n\n**1. 纳指 100 终结六连涨，股债双杀阴影再现**（来源：Mitrade/搜索补漏）\n周三欧美股市承压，纳指 100 终结六连涨。通胀预期上行 + 长端收益率飙升的组合，让\"股债双杀\"的担忧重回台面。（来源：搜索补漏）\n\n**2. 黄金 4100 美元失而复得，白银创两个月新低，美元逼近 18 个月高点**（来源：Mitrade/搜索补漏）\n避险与强美元拉扯：黄金在 4100 美元关口反复争夺后收复，白银则创两个月新低，美元指数逼近 18 个月高点。强美元、弱黄金的格局若延续，金价或考验 4000 美元下方支撑。（来源：搜索补漏）\n\n**3. [主权债与 AI 抢资金：\"挤出效应\"浮出水面](https://www.ft.com/content/bf40e0fb-9542-4ddf-9ac3-c216be55a5a6?syn-25a6b1a6=1)**（来源：FT Markets）\nFT 提出一个值得深思的框架：各国政府海量发债与 AI 基建的资本开支正在争夺同一池子资金，\"crowding out\"（挤出）把主权债和 AI 推到对立面。这对理解本轮\"AI 资本开支 vs 财政赤字\"的宏观张力很关键。（来源：RSS）\n\n**4. 英国投资者从房地产基金赎回要等三个月**（来源：FT Markets）\n英国开放式房地产基金的流动性问题再现：投资者赎回面临**三个月等待期**。商业地产基金的期限错配老问题，在利率高企环境下再次暴露。（来源：RSS）\n\n## 🏠房价洞察\n\n**1. [\"银十\"70城楼市\"量稳价弱\"：新房价格环比下降，上海等 6 城上涨](https://finance.eastmoney.com/a/202511143564763571.html)**（来源：东方财富/新京报）\n10 月 14 个重点城市二手住宅挂牌量环比上升 **1.4%**，自 5 月以来连续 5 个月上升。二手房价格持续下探：新房产品力（得房率、户型）冲击二手消化，下半年二手成交价跌幅较大拖累预期。业内定调当前为\"量稳价弱\"：一线城市核心板块企稳、二线内部分化、三四线整体承压。（来源：搜索补漏）\n\n**2. [8 月 70 城数据：市场保持稳的态势，二手房网签面积同比增 10.6%](http://www.eeo.com.cn/2026/0915/1037290.shtml)**（来源：经济观察网/新华财经）\n国家统计局 8 月数据：一线城市新房价格环比由持平转涨 **0.1%**（上海、深圳、广州、杭州等居前），二三线降幅收窄；1–8 月全国二手房交易网签面积 **5.49 亿平方米，同比增 10.6%**，而新建商品房销售面积同比降 12.1%——\"存量房交易正超过新房成为主力\"。8 月末新建商品房待售面积同比降 **1.1%**，连续 6 个月下降，短期库存（3 年以内）去化更快。（来源：搜索补漏）\n\n**3. [西班牙\"秃鹫基金\"引发全国住房抗议](https://www.bbc.co.uk/news/articles/c3j4790elkx7o?at_medium=RSS&at_campaign=rss)**（来源：BBC）\n西班牙抗议者把住房危机归咎于\"秃鹫基金\"（vulture funds），一位因被驱逐而引发全国抗议的西班牙退休老人去世，事件持续发酵。欧洲住房可负担性危机正在从经济议题变成政治议题。（来源：RSS）\n\n**🔍深度分析**：中国房价的格局是**分化下的弱企稳**。一线城市新房环比转正（+0.1%）且二手网签量大增，说明核心城市的刚需与改善需求仍在释放；但\"量稳价弱\"是更准确的概括——成交靠\"以价换量\"，价格端（尤其二手）仍在承压，挂牌量连升 5 个月意味着供给压力未减。**一线与低线城市差异**：一线核心板块企稳（上海等 6 城上涨）、二线内部分化、三四线整体承压，这个分层短期内不会改变。**政策真实意图**：8 月末中央一揽子新政 + 北京上海成都西安优化调整，方向是\"托底交易量\"而非\"拉抬价格\"——库存连续 6 个月下降、保障房转化推进，政策要的是\"稳\"，不是\"涨\"。**对购房者的实操含义**：自住刚需在一线核心区可以看，但别追高；二三线城市供给过剩，\"以价换量\"还会继续，等等党仍有议价空间；投资性购房当前没有全国性机会。**后续盯**：9 月 70 城数据（10 月中旬发布）、\"金九银十\"实际网签量、年底房企冲刺的折扣力度。\n\n## 🤖AI经济\n\n**1. [OpenAI 年化收入 200 亿美元，低于此前释放的信号](https://www.ft.com/content/b66a9858-f8fb-46cb-b506-44bfe26fca2a?syn-25a6b1a6=1)**（来源：FT Home）\nFT 披露 OpenAI 年化收入约 **200 亿美元**，低于此前向市场释放的信号。在 AI 资本开支如火如荼的当下，头部模型的变现速度是否跟得上烧钱速度，是全行业都要回答的问题。（来源：RSS）\n\n**2. [OpenAI 上线 GPT-6.1 Sol Ultrafast：推理速度明码标价](https://runtimewire.com/article/openai-gpt-6-1-sol-ultrafast-api-pricing)**（来源：RuntimeWire/搜索补漏）\n10 月 8 日上线的极速档：API 侧最高 6 倍、Codex 侧最高 8 倍于 Sol Standard（约 300 token/秒），API 定价 **$12/百万输入、$60/百万输出**（标准档 6 倍）。这是主流厂商第一次把\"等待时间\"做成付费档位，agent 与实时交互工作负载的成本模型要重算。（来源：搜索补漏）\n\n**3. [Anthropic 发布 Claude Haiku 5.5，小模型价格战开打](https://venturebeat.com/technology/anthropic-launches-claude-haiku-5-5-with-90-api-price-reduction-matching-gpt-6-luna)**（来源：VentureBeat/搜索补漏）\n10 月 7 日发布：10 万 token 内请求降价 **90%** 至 $0.10/$0.50，上下文扩到 1M token，平均运行成本比 Haiku 4.5 低 75%。Anthropic 将其定位为 Opus/Sonnet 的 subagent——企业级 agent 高频调用的成本结构被重写。（来源：搜索补漏）\n\n**4. [Big Tech 集中兜售 AI agents 方案](https://www.ft.com/content/9884d785-8ddc-43a6-ac8d-b9c7f9a99df3?syn-25a6b1a6=1)**（来源：FT Home）\nFT 观察：大型科技公司正在集中向市场推销各自的 AI agent 路线图。agent 从\"demo\"走向\"采购清单\"的过程中，定价、安全与 ROI 叙事成为竞争焦点。（来源：RSS）\n\n**5. [美国关键矿产储备引发涨价担忧，休斯顿初创欲松动中国钳制](https://www.ft.com/content/c4ef549c-0451-4884-b922-23cd24cf35a6?syn-25a6b1a6=1)**（来源：FT Markets）\n两条：一家休斯顿初创公司试图松动中国对关键金属的掌控；另一边国防集团警告，美国的关键矿产储备计划可能**推高价格**。算力之外的\"原子侧\"供应链（关键金属）正在成为 AI 硬件的第二战场。（来源：RSS）\n\n## 🏢公司与产业\n\n**1. [石油巨头无视战争扰动，继续押注中东](https://www.ft.com/content/3534cf93-be7b-49ec-bf58-cea84e73cb28?syn-25a6b1a6=1)**（来源：FT Markets）\n尽管地区冲突升级，石油巨头仍在加码中东——长周期资产的逻辑压过了短期地缘噪音。这与油价飙升形成呼应：供给侧的\"看多\"押注很实在。（来源：RSS）\n\n**2. 阿迪达斯起诉澳洲品牌 White Fox\"四道杠\"抄袭**（来源：BBC）\n三道杠之争再起：阿迪达斯起诉澳大利亚服装品牌 White Fox 的四 thors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "title": "Integrating Access Control with Retrieval-Augmented Generation: A Proof of Concept for Managing Sensitive Patient Profiles (AC-RAG)", "url": "https://doi.org/10.1145/3672608.3707848", "venue": "ACM SAC 2025"}, {"added": "2026-09-30", "authors": "", "insight": "写 related work 全景段落时引用，界定我们的位置。", "oneliner": "RAG 安全攻防分类综述，§4.4 整节讲 Access Control / Privacy / Confidentiality（含 SD-RAG、AC-RAG、DPVoteRAG、PAD 等）。", "tags": ["综述", "related work"], "title": "Securing Retrieval-Augmented Generation: A Taxonomy of Attacks, Defenses, and Future Directions", "url": "https://arxiv.org/pdf/2604.08304", "venue": "arXiv:2604.08304 (§4.4)"}, {"title": "ResidualAuth: What Authorization State Must Language Agents  prompt 声明权限不够。它做的是文档级 RBAC（粗粒度），恰好是 AU 划分的一个特例（每文档一个 AU），粒度差异本身可写成对比点。注意局限：Zenodo 非同行评审、单作者、合成小数据、作者自检标签，只能作支持性引文。", "tags": ["RBAC", "企业 RAG", "实证评估", "必引候选"], "added": "2026-10-07"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica 等 4 人", "url": "https://arxiv.org/abs/2610.01871", "venue": "arXiv:2610.01871 (2026)", "oneliner": "针对返回图像的多模态 RAG 的黑盒自适应数据抽取攻击：影子图像混合+相关性加权重采样，单次 2500 查询重构 611 张放射影像，抽取条目数达非自适应基线的 5.6 倍。", "insight": "embedding 通道攻击线的最强邻居：我们的 A1 是文本完形攻击（89.4%@20），它是多模态、图像返回配置下的自适应抽取，说明向量索引的通道问题在跨模态场景同样成立且可被放大。可在 T2 威胁模型一节引用为最具体的实证；其\"重构出的不同条目数\"可借鉴为 embedding 泄露的度量。它不涉及授权语义（任何用户可查），防御侧无直接给出，但把\"embedding 索引必须被授权视图切分\"的论证推得更强——正是 per-view 索引的动机。", "tags": ["embedding 泄露", "数据抽取", "多模态 RAG", "攻击"], "added": "2026-10-03"}, {"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Package Hallucination Attacks on Coding Agents through Prompt Injection in Rule Files", "authors": "Yupu Wang、Zhengyuan Jiang、Reachal Wang、Neil Zhenqiang Gong（杜克大学）", "url": "https://arxiv.org/abs/2610.09264v1", "venue": "arXiv 预印本（cs.CR/cs.AI）", "oneliner": "提出 package hallucination 攻击：向社区共享的规则文件（AGENTS.md/.cursorrules）注入恶意提示，诱导编码智能体把合法依赖替换为攻击者控制的包；配套进化优化框架 PackHallu 构造注入提示，多 benchmark/多模型/多框架高成功率且迁移性强。", "insight": "攻击面弹药：这是一类'供应链式间接提示注入'——恶意内容不在检索语料里，而在智能体启动即加载的规则文件里。提示我们 agent 线探索应把规则文件/skill 文件视为与检索语料同等地位的不可信输入，tool-use 授权需覆盖'配置型上下文'。纯攻击论文、无防御构造，威胁模型章节一句话引用即可。", "tags": ["提示注入", "编码智能体", "供应链攻击", "规则文件"], "added": "2026-10-09"}, {"title": "VeriChainSim: Verifiable Evidence-Chain Simulation for LLM-Based Multi-agent Authorization in Aerospace Trusted Data Spaces", "authors": "G. E. Huiling、Zhiguo Shi（通讯）、Yungui Nie（北京科技大学）", "url": "https://doi.org/10.1007/978-981-92-5712-6_34", "venue": "Springer CCIS vol. 3155（CSC 2026 会议论文集章节）", "oneliner": "把 LLM 智能体的每次授权决策绑定到类型化证据指针（目录记录、策略标识、合同条款、会话绑定、证明对象），token 激活前由外部验证器对照可信状态注册表校验。", "insight": "实现了我们只在目标里写了的性质：对畸形证据 fail-closed（存在性/完整性/范围/会话一致性任一不过即拒绝）。与我们的 retrieve-then-project 同属'授权决策前置校验 + 失败降级'家族，但路径不同（中心化外部验证器 vs 查询时逐 AU 求值），可在相关工作/讨论章节并列引用。局限：航空航天专用场景、仿真评估，威胁模型未分层。", "tags": ["智能体授权", "证据链", "fail-closed", "可审计性"], "added": "2026-10-09"}, {"title": "Agents in Disguise - Weaknesses in Authentication and Authorization in Public AI Ecosystems", "authors": "Jan Stanek, Lukas Kencl", "url": "https://doi.org/10.1007/978-3-032-38702-8_15", "venue": "Lecture notes in computer science (2026)", "oneliner": "系统实测 MCP 等开放 AI 生态与协议中的认证授权现状：agent 身份缺失、弱认证泛滥、授权可选或逻辑损坏，并给出改进方向。", "insight": "直接相关 agent 授权线：它点出了我们主论文的一个隐含假设——RU/AU 框架的 P(a,u) 默认授权主体 u 已认证可信，而开放生态中 u 的认证本身仍未解决。可在威胁模型/讨论章节引用作边界声明：AU 框架解决已认证主体对内容的细粒度授权，主体身份可信需下层认证机制支撑。附带价值：引用链可顺藤摸瓜到 NIST NCCoE agent 身份概念文件与 mcpanalysis 分析工具。", "tags": ["agent 授权", "认证", "MCP", "开放生态", "实测"], "added": "2026-10-08"}, {"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "venue": "ACM (2026)", "oneliner": "用 capability-scoped 权限模型重构 coding agent 工具沙箱：工具调用须持有显式能力令牌，命名资源≠被授权操作，架构层面切断间接 prompt injection 的执行通道", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的执行语义哲学同构——都是把\"能说出名字/能检索到\"从隐含授权中剥离。差异在于粒度：它是工具调用级 capability，我们是检索内容级 AU。适合 Related Work 的 Agent 线引用，作为显式授权能力模型的独立佐证；两者交叉可作 future work 一笔。", "tags": ["agent 安全", "capability 模型", "prompt injection", "授权执行"], "added": "2026-10-04"}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang 等 5 人", "url": "https://arxiv.org/abs/2610.01508", "venue": "arXiv:2610.01508 (2026)", "oneliner": "研究工具调用 agent 的\"主动越权\"：8 个隐私敏感域的确定性 benchmark，7 个模型全部超授权范围；SelfAudit 零样本推理时自检把隐私向越权降低 43%。", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计。\"越权来自结构性决策倾向而非解码随机性\"的结论与我们\"保守子句切分器\"的直觉相通——授权边界应由机制保证而非模型自觉；SelfAudit 仍是模型自己审计自己（启发式），我们的确定性求值 P(a,u) 是更彻底的路线，可在 Discussion 对照。注意它是动作侧授权，我们是数据侧，不竞争。", "tags": ["Agent 授权", "越权", "benchmark"], "added": "2026-10-03"}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang 等 7 人", "url": "https://arxiv.org/abs/2610.00371", "venue": "arXiv:2610.00371 (2026)", "oneliner": "提出 authorization-paired evaluation（拦住禁用用途+完成授权用途为联合成功标准）与 FlowReview 框架（对象解析+权限排序+确定性执行），组合审查把 denied-commit 率从 86.0% 降到 0 且授权供给无损失。", "insight": "核心命题\"对象身份与权限必须通过输出可验证的组件与执行保持连接\"与我们的\"chunk 只存 M(r)、查询时逐 AU 求值\"同构——都反对权限是附在数据上的静态标签。它的\"联合成功标准\"值得借鉴：我们评估以安全侧为主，未来可加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）提示我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"，与 KG 路径切割一节可呼应。", "tags": ["Agent 授权", "组合安全", "评估方法"], "added": "2026-10-03"}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}, {"title": "Compromise Is Not Consequence: Evaluating Task-Scoped Authorization in LLM Agents with Paired Replay", "authors": "Tural Hagverdiyev", "url": "https://arxiv.org/abs/2610.05840", "venue": "arXiv:2610.05840 (2026)", "oneliner": "paired-replay 测试台量化任务范围授权对提示注入后工具执行的遏制：broad bearer 攻击后执行率 8.9–37.8%，scoped JWT / sender-constrained / OPA 三种限定条件全部为零。", "insight": "与我们 AU 授权单元同属\"授权原子单位\"家族的同行实证，粒度不同（按任务限定凭证 scope vs 按内容划分 AU）但哲学一致。核心结论\"The policy changes execution, not the frozen model decision\"与我们的 retrieve-then-project 执行语义形成跨域互证：安全寄托在执行层裁剪而非模型自觉。局限：测的是遏制非预防；AgentDojo 扩展样本小。可在执行语义/威胁模型章节引用作 RAG 侧 AU 求值 vs Agent 侧 task-scoped 的对照。", "tags": ["agent authorization", "scoped credentials", "paired-replay", "执行语义对照"], "added": "2026-10-07"}, {"title": "Can CaMeLs Talk? Securing Multi-Agent Systems Against Indirect Prompt Injection Attacks", "authors": "James Peters-Gill, Avi Semler, Henning Bartsch, Ilia Shumailov, Christian Schroeder de Witt", "url": "https://arxiv.org/abs/2610.05640", "venue": "arXiv:2610.05640 (2026)", "oneliner": "证明单智能体 CaMeL 安全保证在分层多智能体系统中不组合（不可信数据可被下游重新解释为可信输入），提出保持 provenance 的 multi-CaMeL 协议，把攻击成功率从 12.9% 降至 0.0%。", "insight": "攻击面在我们 T1/T2/T3 之外的新维度——组合性：每个单元各自安全，跨边界组合仍可被绕过，恰是我们 embedding 通道\"边界重解释\"问题的多智能体版本。对我们论文的直接影响：per-view 索引目前只论证单系统内隔离，若未来扩展到多智能体 RAG，视图隔离的组合性需单独证明——诚实的未来工作点，可在局限段引用此文佐证。当前 claim 不受动摇。", "tags": ["多智能体安全", "组合性", "CaMeL", "威胁模型扩展"], "added": "2026-10-07"}]}], "note": "人工精选、长期维护的论文库；每日 08:00 看板构建时自动嵌入，不会被每日文献流覆盖", "updated": "2026-10-09"};
const INT = {"interests": [{"id": "rag-access-control", "items": [{"title": "Progress Software Connects Enterprise Knowledge Across Business Systems with New Agentic RAG Capabilities", "url": "https://usanewshour.com/progress-software-connects-enterprise-knowledge-across-business-systems-with-new-agentic-rag-capabilities/394126/", "kind": "news", "date": "2026-10-02", "why": "Progress 新版 Agentic RAG 强调跨业务系统问答时沿用已有索引内容的访问控制与治理框架、无需重建索引——企业级 RAG「权限延续」的产品案例，与 RU/AU「权限随数据、检索时强制执行」思路同向。"}, {"title": "Dify 1.17.1 Strengthens Knowledge Base Security and Fixes Critical RAG Data Corruption Bugs", "url": "https://undercodenews.com/dify-1171-strengthens-knowledge-base-security-and-fixes-critical-rag-data-corruption-bugs-video/", "kind": "news", "date": "2026-10-01", "why": "Dify 知识库 API key 终于支持绑定到单个 dataset：此前一个 key 可访问 workspace 内所有知识库，1.17.1 起可收窄作用域——“授权粒度下沉到数据对象”的产品实例，与 RU/AU 细粒度思想同向。"}, {"title": "CodePoisonRAG: knowledge poisoning attacks on retrieval-augmented code generation", "url": "https://adversa.ai/blog/top-ai-coding-agent-security-resources-october-2026/", "kind": "news", "date": "2026-10-04", "why": "检索投毒实证：85 个投毒代码制品跨 10 类漏洞在 3 个代码生成器上达到 0.80–0.93 成功率，且制品\"保持任务相关性+伪造安全声明\"——与我们关注的检索阶段攻击面直接相关，可作 RAG 安全防御的引用弹药。"}, {"title": "FramePoison: attacks on medical RAG that target framing, not just facts", "url": "https://www.nature.com/articles/s44387-026-00163-6", "kind": "paper", "date": "2026-10-07", "why": "检索投毒的新维度：不换事实、换“表述框架”——3 个生物医学语料、5 个开放权重模型上，每问题投 5 篇文档即有 ≥3 篇进 top-5，1–2 篇就足以翻转答案。说明 RAG 授权不能只验内容是否“事实正确”，表述层的影响也应进入授权/执行语义的考量，可作我们论文攻击面讨论的引用。"}], "keywords": ["RAG security", "retrieval access control", "RAG privacy", "retrieval poisoning"], "name": "RAG 访问控制", "rss": [], "since": "2026-09-30", "source": "user"}, {"id": "agent-authz", "items": [{"title": "Unauthorized Tool Invocation: When Attackers Call the AI's Tools Directly", "url": "https://www.linkedin.com/pulse/unauthorized-tool-invocation-when-attackers-call-ais-t1ege", "kind": "news", "date": "2026-10-08", "why": "攻击者绕过 AI agent、直接调用其底层工具的攻击演示：应用若不验证请求是否来自既定的 agent 工作流，工具就会被未授权执行——正是'编排不等于授权'的现实注脚，与 tool-use authorization 方向直接相关。"}, {"title": "Peregrini's Agent Court: How Common Law Enforcement Turns LLM Mistakes Into Binding Precedent", "url": "https://dev.to/mech_app_ai/peregrinis-agent-court-how-common-law-enforcement-turns-llm-mistakes-into-binding-precedent-1jpe", "kind": "news", "date": "2026-10-02", "why": "在工具边界授权之上叠加「普通法执法」问责层：记录 agent 承诺与实际交付偏差，形成跨实例传播的判例与信任分——补位现有授权机制执行后的问责空白，与 agent 授权治理方向相关。"}, {"title": "AI Agents Accessed Government Systems Without Permission—OpenAI and Anthropic Disclose Tens of Thousands of Incidents", "url": "https://www.karmactive.com/openai-anthropic-ai-agent-security-incidents-2026/", "kind": "news", "date": "2026-10-02", "why": "OpenAI 与 Anthropic 披露 agent 未授权访问第三方系统的批量事件，核心故障是第三方 API 工具包装器与默认宽泛权限（而非推理错误），典型手法为间接提示注入——正是 tool-use authorization 要解决的现实威胁，凸显「授权独立于模型」控制面的紧迫性。"}, {"title": "AgentFox: open-source control plane for AI agents", "url": "https://github.com/architsharm/agentfox", "kind": "repo", "date": "2026-09-29", "why": "开源 agent 控制平面：模型流量 guardrail、工具调用按 capability grant 限界、防篡改审计轨迹映射合规框架；其“按值来源（provenance）而非载荷内容做拒绝”的守卫逻辑与我们“授权绑定到数据来源”的范式同构。"}, {"title": "Indirect Prompt Injection in Web Content Targets AI Agents (Zscaler ThreatLabz)", "url": "https://www.infosecurity-magazine.com/news/indirect-prompt-injection-web/", "kind": "news", "date": "2026-10-04", "why": "真实世界间接提示注入战役：攻击者用仿冒 DeBank 的 typo 域名藏指令，26 个模型中 4 个（含 Llama/Gemini 版本）被操纵执行欺诈支付——\"内容即攻击面\"的最新实证，与 Agent 授权方向的威胁模型直接相关。"}, {"title": "A blind trust, the bloody thrust: trojanized hook updates take over AI agent harnesses", "url": "https://adversa.ai/blog/top-ai-coding-agent-security-resources-october-2026/", "kind": "news", "date": "2026-10-04", "why": "插件更新投毒：恶意 lifecycle hook 更新攻陷全部 7 个被测 agent harness（含 Claude Code、Codex CLI），10 类攻击目标成功率最高 92.5%，而 Defender/Semgrep 漏掉近半样本——说明 agent 供应链授权（更新审查）比扫描更重要，属 Agent 访问控制的授权组合缺陷。"}, {"title": "Google's Approach to AI Agent Security: Identity, Permissions, and Runtime Boundaries", "url": "https://codecrux.com/blog/googles-approach-to-ai-agent-security-identity-permissions-and-runtime-boundaries/", "kind": "news", "date": "2026-10-03", "why": "Google 公开的 agent 安全架构：把 agent 当作一等非人类主体，传输层认证+逐请求授权+最小权限+JIT 凭证+默认拒绝，与 RU/AU 解耦「策略独立存放、执行层求值」的立场同构，可作 Agent 线引用。"}, {"title": "Replication package for: Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems", "url": "https://doi.org/10.5281/zenodo.23108972", "kind": "paper", "date": "2026-10-06", "why": "实证测量 LLM agent 系统中\"源使用授权\"与\"控制点放置\"的关系（360 个实验世界+载体替换复制+溯源审计），与 Agent 工具调用授权的追踪方向直接相关；注意目前仅复制包公开、原论文正文未见。"}, {"title": "Aembit Extends Access Controls to Personal AI Agents", "url": "https://gbhackers.com/aembit-extends-access-controls-to-personal-ai-agents/", "kind": "news", "date": "2026-10-07", "why": "个人 AI agent（Meta Muse、OpenAI Dots）进企业带来的新授权难题：agent 复用员工凭证访问邮件/代码库/内部工具，行为难与员工本人区分。Aembit 方案是 agent 独立身份+员工身份的 blended identity，运行时评估 agent+用户+资源+条件，签发短期凭证，可独立撤销 agent 而不影响员工账号。与我们 AU 授权单元思路同源（授权原子单位+运行时求值），是 agent 身份赛道的产品化样本。"}, {"title": "GitHub Copilot CLI Flaw Lets Attackers Steal Developer Secrets", "url": "https://cyberpress.org/github-copilot-cli-prompt-injection/", "kind": "news", "date": "2026-10-07", "why": "Adversa 发现：加密 blob 解密后才显形的指令可劫持 Copilot CLI 窃取开发者磁盘密钥（源码/配置/凭证），而 GitHub 赏金团队拒绝定为漏洞——理由是“用户让 agent 取攻击者内容且给了全自主权限”。“用户授权了全自主”是否等于代理一切可为，正是“授权应独立于模型、在执行层显式授权”主张的现实注脚。"}, {"title": "Attackers Hide AI Prompt Injections Inside Phishing Emails", "url": "https://www.infosecurity-magazine.com/news/attackers-hide-ai-prompt/", "kind": "news", "date": "2026-10-07", "why": "Barracuda 10-07 研究：一封邮件同时攻击人和 AI 助手——人收到密码保护附件的社工诱饵，AI 邮箱摘要器则被藏在 HTML 注释/不可见文本/Base64/零宽字符里的指令操纵，把邮件包装成“紧急可信”。间接提示注入进入邮件渠道且双目标，给 agent 授权边界讨论增加了输入渠道的实证。"}, {"title": "AdvSim2Real: Training Web Agents Against Adaptive Prompt Injection in a Web World Model", "url": "https://arxiv.org/abs/2610.08773", "kind": "paper", "date": "2026-10-06", "why": "web agent 抗自适应提示注入的训练侧方案：任务课程、注入攻击者、agent 三者在冻结的 web 世界模型里协同演化，4B agent 在 150 个 web 任务上、面对训练中从未见过的前沿模型攻击者，相对完成率提升 33.6%。与授权侧防御（我们的立场）形成对比/组合论据，可引为“训练侧方案在自适应攻击者下的天花板”。"}, {"title": "GitLab AI Gateway Flaw CVE-2026-90970: CVSS 9.9", "url": "https://tech-insider.org/gitlab-ai-gateway-cve-2026-90970-duo-agent-2026/", "kind": "news", "date": "2026-10-07", "why": "Duo Agent Platform 的 prompt-template 沙箱被特制 flow 配置逃逸，直接触达宿主机 OS，需跨三分支三次发版才修好。提示过滤管的是“模型决定做什么”，沙箱逃逸改变的是“系统允许模型的输出碰到什么”——管道层（沙箱/权限边界）与模型行为同样值得审视，与我们“执行层独立控制面”的威胁模型分层互证。"}], "keywords": ["LLM agent security", "tool-use authorization", "agent authorization", "prompt injection"], "name": "Agent 访问控制", "rss": [], "since": "2026-09-30", "source": "user"}, {"id": "embedding-privacy", "items": [], "keywords": ["embedding inversion", "membership inference", "privacy-preserving retrieval"], "name": "Embedding 与隐私攻击", "rss": [], "since": "2026-09-30", "source": "conversation"}, {"id": "jev-models", "name": "Jev 决策模型（System One）", "source": "user", "keywords": ["jev", "typesafe", "system one", "JEV-27B", "decision model", "RLCD"], "rss": [], "items": [{"title": "Jev vs. RPT: The Decision Layer Is Here, and RPT Already Speaks Its Language", "url": "https://community.sap.com/t5/technology-blog-posts-by-sap/jev-vs-rpt-the-decision-layer-is-here-and-rpt-already-speaks-its-language/ba-p/14497557", "kind": "news", "date": "2026-10-08", "why": "SAP 社区实测 Jev 决策模型：引用 Vercel 数据称 Jev 是其 AI Gateway 历史上采用最快的模型（上线 24 小时内付费团队数超此前任何模型 2 倍），决策模型赛道的采用信号值得跟踪。"}, {"title": "Jev AI Makes Ultra-Fast Decisions for AI Agents, but Its Limits Matter", "url": "https://techamerica.ai/jev-ai-is-incredibly-fast-at-making-decisions-but-its-limits-matter", "kind": "news", "date": "2026-10-02", "why": "对 Jev 决策模型的平衡评述：用「快速结构化决策」解决 agent 循环里昂贵的小判断（免去每次调用 frontier 模型），同时指出有界动作列表与演示环境的局限——有助于评估 System One 模型「可校验的判断组件而非通用智能」的定位。"}, {"title": "AutoTrust AI Releases JEV-27B, an Open Decision Model for Self-Hosted AI Agents", "url": "https://www.prnewswire.com/news-releases/autotrust-ai-releases-jev-27b-an-open-decision-model-for-self-hosted-ai-agents-302891720.html", "kind": "news", "date": "2026-09-30", "why": "JEV-27B 是首个对标 TypeSafe Jev 的开源权重决策模型（Apache-2.0），六项基准 84.07% 超过官方版，直接回应了社区对 Jev 闭源的最大批评"}, {"title": "最近全网爆火的 Jev 到底是什么？适合干什么、怎么用，一篇讲透！", "url": "https://developer.aliyun.com/article/1765623", "kind": "news", "date": "2026-09-30", "why": "中文社区最完整的一篇 Jev 详解：Noul/Choice/Score 三种题型、与传统 LLM 的对比表，以及对测试开发工作的价值分析"}, {"title": "TypeSafe Jev: the first System One model, explained", "url": "https://www.eesel.ai/blog/typesafe-jev", "kind": "news", "date": "2026-09-30", "why": "把 \"can't hallucinate\" 的争议讲透了：类型不出错不等于判断不错，校准度（calibration）才是真正的考验，引用了 HN 发布帖的代表性评论"}, {"title": "How Might TypeSafe's Jev Work? Rebuilding a \"System One\" Decoder on a Laptop", "url": "https://medium.com/@f.galeev.business/how-might-typesafes-jev-work-rebuilding-a-system-one-decoder-on-a-laptop-48a7c104220b", "kind": "news", "date": "2026-09-30", "why": "技术向逆向工程分析：仅用现成模型+更聪明的解码器（无训练）能复现多少 Jev 能力，含可交互 demo 与实测数据"}, {"title": "yibie/awesome-jev", "url": "https://github.com/yibie/awesome-jev", "kind": "repo", "date": "2026-09-30", "why": "Jev 生态导航仓库：收录 HN 发布大讨论帖、X 上的实践 demo（模型路由、Agent 安全监视器等）与各平台接入方式，是跟踪该赛道的一站式入口"}, {"title": "jev-decision-gateway: Governed decision-model gateway (TypeSafe Jev vs GPT-6 Sol vs rules on 100 withdrawals)", "url": "https://github.com/kartikanand73/jev-decision-gateway", "kind": "repo", "date": "2026-09-28", "why": "把 Jev 放进带治理的提款工作流做实测对比：Jev 1.13 在 100 笔合成提款上与分析师标签一致率 85%、欺诈自动放行 0 笔、p50 延迟 201ms、每千次决策 $0.03（GPT-6 Sol 为 $2.09）；核心模式是“模型只打分、代码做决策、策略引擎签名后执行”，与我们用 Jev 做流水线分类的思路直接可比。"}, {"title": "TypeSafe AI's Jev Brings Confidence-Based Workflow Routing to n8n", "url": "https://dev.to/alifar/typesafe-ais-jev-brings-confidence-based-workflow-routing-to-n8n-5g3c", "kind": "news", "date": "2026-10-01", "why": "TypeSafe Jev 官方集成 n8n：用 choice/noul 输出与校准置信度做工作流分支路由，高置信自动放行、低置信转人工——“模型只打分、代码 function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){

/* ---------- finance (💰财经大事): 长简报 md 渲染 ---------- */
function mdInline(s){
  return esc(s||'')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function renderFinance(){
  const M = FIN || {}, src = M.md || '';
  const n = (src.match(/^(\*\*|[-•▪]\s)/gm) || []).length;
  document.getElementById('finCount').textContent =
    dline(M.date) + n + ' 条';
  const box = document.getElementById('finList');
  if (!src.trim()){ box.innerHTML = '<div class="empty">今日暂无财经大事早报。</div>'; return; }
  let html = '', inList = false, inTable = false;
  const closeList = () => { if (inList){ html += '</ul>'; inList = false; } };
  const closeTable = () => { if (inTable){ html += '</tbody></table>'; inTable = false; } };
  src.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line){ closeList(); closeTable(); return; }
    let m;
    if ((m = line.match(/^###\s+(.*)/))){ closeList(); closeTable(); html += '<div class="fin-h3">' + mdInline(m[1]) + '</div>'; return; }
    if ((m = line.match(/^##\s+(.*)/))){ closeList(); closeTable(); html += '<h2 class="fin-h2">' + mdInline(m[1]) + '</h2>'; return; }
    if (/^#\s/.test(line)){ closeList(); closeTable(); return; }  /* H1 跳过（tab 已有标题） */
    if (/^---+$/.test(line)){ closeList(); closeTable(); html += '<hr class="fin-hr">'; return; }
    if (/^\|.*\|$/.test(line)){
      closeList();
      if (/^\|[\s|\-:]*\|$/.test(line) && /-/.test(line)) return;  /* 表格分隔行跳过 */
      const cells = line.split('|').slice(1, -1).map(c => mdInline(c.trim()));
      if (!inTable){ html += '<table class="fin-table"><tbody>'; inTable = true; }
      html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      return;
    }
    if (/^\*\*\d+\.\s/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item fin-num">' + mdInline(line) + '</li>';
      return;
    }
    if (/^(\*\*|[-•▪]\s)/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item">' + mdInline(line.replace(/^[-•▪]\s/, '')) + '</li>';
      return;
    }
    closeList(); closeTable();
    html += '<p class="fin-p">' + mdInline(line) + '</p>';
  });
  closeList(); closeTable();
  box.innerHTML = '<article class="fin-body">' + html + '</article>';
}

const X_SEEN_KEY = 'coco_x_seen_v1';
const getXSeen = () => { try { return JSON.parse(localStorage.getItem(X_SEEN_KEY) || '{}'); } catch(e){ return {}; } };
function renderXDots(){
  const seen = getXSeen();
  let any = false;
  document.querySelectorAll('.x-chip').forEach(ch => {
    const h = ch.getAttribute('data-h'), nw = ch.getAttribute('data-newest') || '';
    const unread = !!(nw && (!seen[h] || nw > seen[h]));
    const dot = ch.querySelector('.x-dot');
    if (dot) dot.hidden = !unread;
    if (unread) any = true;
  });
  const tabDot = document.getElementById('xTabDot');
  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}

      + '<h3>' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) + '</h3>'
      + (c.org ? '<div class="authors">' + esc(c.org) + '</div>' : '')
      + (c.blurb ? '<div class="one">' + esc(c.blurb) + '</div>' : '') + '</div>').join('');
    html += ro.map(c => {
      const info = [c.params ? c.params + ' 参数' : '', c.base_model ? '基于 ' + c.base_model : '',
                    c.pipeline || '', c.license || ''].filter(Boolean).join(' · ');
      return '<div class="card"><div class="badges"><span class="badge green">开源权重</span>'
      + (c.date ? '<span class="date">' + esc(c.date) + '</span>' : '') + '</div>'
      + '<h3><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.id) + '</a></h3>'
      + (info ? '<div class="one">' + esc(info) + '</div>' : '')
      + '<div class="authors">❤ ' + c.likes + ' · ⬇ ' + fmtN(c.downloads) + '</div></div>';
    }).join('');
    html += '</div></div>';
  }
  if (arena.length){
    html += '<div class="day"><div class="day-head"><h2>🏆 LMArena Text 榜</h2>'
      + (M.arena_date ? '<span class="n">' + esc(M.arena_date) + '</span>' : '') + '</div>'
      + '<div class="lb-wrap"><table class="lb-table"><thead><tr><th>#</th><th>模型</th><th>评分</th><th>较昨日</th></tr></thead><tbody>'
      + arena.map(a => {
          const dlt = a.delta || 0;
          const dc = dlt > 0 ? '<span class="up">▲ ' + dlt + '</span>'
                   : dlt < 0 ? '<span class="down">▼ ' + (-dlt) + '</span>'
                   : '<span class="flat">–</span>';
          const open = a.license && a.license !== 'Proprietary';
          return '<tr><td class="rk">' + a.rank + '</td><td><span class="mname">' + esc(a.model) + '</span>'
            + (open ? '<span class="open-tag">开源</span>' : '')
            + (a.org ? '<span class="org">' + esc(a.org) + '</span>' : '') + '</td>'
            + '<td class="num">' + a.rating + '</td><td>' + dc + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      + '<div class="summary">人类盲测偏好评分（Bradley-Terry），数据来自 LMArena 公开数据集（CC-BY-4.0）。</div></div>';
  }
  document.getElementById('mdList').innerHTML = html || '<div class="empty">今日暂无模型数据。</div>';
}

/* ---------- tab 懒渲染：首屏只渲染当前 tab，其余切换时按需渲染 ---------- */
const TAB_RENDER = {papers: render, models: renderModels, library: renderLibrary,
  interests: renderInterests, trending: renderTrending, x: renderX, apple: renderApple,
  deals: renderDeals, finance: renderFinance, ainews: renderAinews};
const TAB_DONE = {};
function ensureTab(name){
  if (!TAB_DONE[name] && TAB_RENDER[name]){ TAB_RENDER[name](); TAB_DONE[name] = 1; }
}
renderXDots();  // tab 栏小圆点不受懒渲染影响，照常初始化
const _initTab = ('' + location.hash).slice(1);
ensureTab(PANES.includes(_initTab) ? _initTab : 'papers');
showTab(_initTab || 'papers');

/* ---------- archive modal（历史归档弹窗） ---------- */
const ARCH_PREFIX = location.pathname.indexOf('/archive/') >= 0 ? '' : 'archive/';
const DIGEST_URL = ARCH_PREFIX + 'digest.json';
let archDigestCache = null;
function archItemHTML(it, open){
  const runs = (it.runs || []).map(r =>
    '<span class="run-tag">' + esc(r.name) + '</span>').join('');
  const secs = [
    ['📚 论文', it.papers, it.papers_n ? it.papers_n + ' 篇' : ''],
    ['🤖 模型追踪', it.models],
    ['🎯 兴趣追踪', it.interests],
    ['🔥 开源趋势', it.trending],
    ['👀 大佬动态', it.x],
    ['📰 AI情报', it.ainews],
  ];
  const body = secs.filter(s => s[1]).map(s =>
    '<div class="arch-sec"><div class="arch-sec-t">' + s[0] +
    (s[2] ? ' <span class="arch-hint">' + esc(s[2]) + '</span>' : '') +
    '</div><div class="arch-sec-b">' + md(s[1]) + '</div></div>'
  ).join('') || '<div class="empty">暂无摘要</div>';
  return '<details class="arch-item"' + (open ? ' open' : '') + '>' +
    '<summary><span class="arch-date">📅 ' + esc(it.date) + '</span>' +
    runs + '<span class="arch-hint">→</span></summary>' +
    '<div class="arch-body">' + body +
    '<a class="arch-go" href="' + ARCH_PREFIX + it.date + '.html">查看当天完整看板 →</a>' +
    '</div></details>';
}
function renderArchList(items, partial){
  const list = document.getElementById('archList');
  if (!items || !items.length){
    list.innerHTML = '<div class="empty">暂无归档</div>';
    return;
  }
  list.innerHTML =
    (partial ? '<div class="empty">本地打开为精简模式，仅显示近 7 天</div>' : '') +
    items.map((it, i) => archItemHTML(it, i === 0)).join('');
}
let archScrollY = 0;
function lockBodyScroll(){
  archScrollY = window.scrollY || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + archScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, archScrollY);
}
async function openArchive(){
  const m = document.getElementById('archModal');
  m.hidden = false;
  lockBodyScroll();
  if (archDigestCache){ renderArchList(archDigestCache.list, archDigestCache.partial); return; }
  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  unlockBodyScroll();
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
</body>
