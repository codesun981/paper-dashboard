const DATA = {"days": [{"date": "2026-11-12", "summary": "", "papers": [{"title": "Isolation Is Not Confidentiality: Security Boundaries of Geometric Access Control in RAG", "authors": "Steve Nouyep、Maxime Puys、Sébastien Salva", "url": "https://arxiv.org/abs/2611.14061", "category": "arXiv 预印本（cs.CR，2026-11-10 提交）", "cats": ["cs.CR"], "oneliner": "几何访问控制能把不同策略的文档在向量空间里“隔开”，但隔开不等于保密：好奇用户用几百对齐的向量就能把原始 embedding 恢复出来，策略相关的几何结构还会泄露“谁属于哪个策略”。", "insight": "这是今日与我们的论文咬合最紧的一篇，也是 embedding 通道一节最值得引用的新证据。第一，它把我们的核心论点形式化成了四个可分开检验的目标：我们论文里“全文 embedding 索引下 cloze 攻击 89.4%@20、按授权视图重编码后降至 4.05%”的实验，恰好对应它说的“隔离≠机密性”——隔离（未授权检索被拦住）成立时，机密性（表示本身不泄露）仍可能失效；相关工作里可以引用它的四目标分类法来框定我们的威胁模型。第二，它的攻击路径（几百对对齐样本恢复原始 embedding）与我们的 T2（可见排序向量）高度同构：攻击者不需要拿到原文，只要拿到“原文向量—受保护向量”的对齐对就能反推，这正是我们主张“向量索引必须按授权视图重编码、而不是只在文本层裁剪”的实证支撑。第三，它提醒了一个我们尚未显式处理的风险点：**策略成员隐藏**——即使检索被拦住，几何结构本身可能泄露“某文档属于某策略”，我们的 per-view 索引方案应在使用时说明是否处理了这一层。诚实标注：这是 11 月 10 日刚提交的预印本，评估只覆盖“现有几何变换机制的公开实现”、三个编码器，结论的普适性取决于这些实现的代表性；引用时应写清“在作者评估的实现与编码器上”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "RAG 系统越来越多地把受不同访问控制策略管辖的文档混存在同一个向量库里。近年出现的“搜索保持几何方法”通过重构 embedding 空间来执行访问控制：变换后的 embedding（作者称为受保护表示）仍可检索、又不跨策略泄露信息。本文对这一范式做了统一安全分析，覆盖策略隔离、表示机密性、抗查询伪造、策略成员隐藏四个目标，威胁模型分两档——能看到库里受保护表示的好奇云服务商，以及手握“原始 embedding—受保护表示”对齐样本的好奇用户。作者在三个编码器上实测了现有几何变换机制的公开实现：几何变换确实保住了检索效用与强策略隔离，但其余三项目标都不成立；好奇用户用几百对样本即可恢复原始 embedding，还能以随编码器维度增长的代价伪造出符合策略的查询；即使未授权检索被拦住，策略相关的几何结构仍会泄露成员关系。结论是：策略隔离、机密性、抗伪造、成员隐藏是四个**不同**的安全目标。", "supplement": false}, {"title": "Fail-Closed Authorization for Tool-Using AI Agents: A Capability Contract and Case Study", "authors": "Andrey Lesnikov", "url": "https://doi.org/10.21203/rs.3.rs-11676427/v1", "category": "预印本（Research Square，单作者）", "cats": [], "oneliner": "工具型 agent 的授权不该在调用后审计、而要在执行前设卡：Agent Security Contract（ASC）是一个默认拒绝的执行前门禁，工具目录用 SHA-256 摘要锁定，高危工具须经带外批准，所有错误路径都收敛到 BLOCK。", "insight": "这篇与 ChainBind 的“执行时授权绑定”是同一条战线上的互补工作，值得在相关工作里并列引用。第一，它的“所有错误路径收敛到 BLOCK”与我们的 fail-closed 姿态一致：未知 AU 默认拒绝、错误即拒绝，这是执行时授权的共同底线；可以引用它的错误路径枚举方法来补强我们自己的 fail-closed 论证。第二，它给了一个诚实且可引用的**误拦代价**：严格参数规则拦掉 94/97 良性任务、工具级审批把 60/97 良性任务送去人工审批——这正是“绑定越严、效用越低”的量化证据，我们的 E12（良性效用 0.608）应当与这类数字并排讨论，而不是只报攻击侧的 ASR。第三，它的 JSON 证据信封（每次裁决带完整性校验的审计记录）是一个可借鉴的机制：我们的绑定裁决也可以落成类似的证据信封，便于事后审计与复现。诚实标注：这是 Research Square 上的单作者预印本，评估只用静态录制轨迹、未跑 live agent，66 场景语料是作者围绕自家检查自建的（作者自己也承认变异测试覆盖浅），AgentDojo 复核用的是“事先冻结的策略”而非真实部署策略；引用时应写清这些口径，不宜把它读成已验证的部署方案。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "对工具型 LLM agent 而言，决定性的问题是“某次具体工具调用在执行前是否被授权”。本文提出 Agent Security Contract（ASC）：一个默认拒绝的执行前门禁，覆盖 agent 与 MCP 工具调用。ASC 策略用 SHA-256 摘要锁定批准的工具目录，为每个 agent 声明工具白名单与参数约束，把高危工具标为须经带外批准，并限制调用速率；每次裁决（ALLOW / BLOCK / REQUIRE_APPROVAL）都以带完整性校验的 JSON 证据信封发出；作者枚举并测试的每条错误路径最终都收敛到 BLOCK。评估只用静态的、已录制的工具调用轨迹，没有跑 live agent。审阅中发现的 v0.1.0 演示策略绕过已在 v0.2.0 修复；60 例对抗探针上，放行攻击从 32 降到 1（剩 1 例是策略缺口），代价是 3 个新增良性误拦；作者自建的 66 场景 v0.2.1 语料上 ASC 全部判对（66/66）；而工具名 RBAC（Python 与 OPA/Rego）按构造就会放行 33 个攻击中的 30 个。变异测试显示语料对策略约束的覆盖很浅（62 个单约束变异只杀死 8 个）。作为留出检验，作者用事先冻结的策略重放了 132 条 AgentDojo v1.2 真实轨迹：工具级审批策略拦住了 25/26 条非空攻击轨迹，但也把 97 个良性任务中的 60 个送去审批；v0.2.0 的严格参数规则更会拦掉 94/97 的良性任务；v0.2.1 补上可选参数支持后，在全部 132 条轨迹上复现了工具级裁决、无新增拦阻、无新增放行攻击。进程内中位延迟约 38 微秒/条轨迹。", "supplement": false}, {"title": "Intent-Adaptive Implicit Permission Decision in Generative Artificial Intelligence: A Novel Architecture for Contextual Memory Isolation and Autonomous Privacy-Preserving Permission Management", "authors": "Jincheng Zhang", "url": "https://doi.org/10.5281/zenodo.24105307", "category": "预印本（Zenodo，2026-11-10，单作者，概念架构）", "cats": [], "oneliner": "与其让用户手动开关记忆权限，不如让系统从对话意图推断“这段对话该用什么隔离策略”：IAIPD 把意图推断、记忆隔离策略选择、隐式权限评估与分级执行包成一个会话级权限决策框架。", "insight": "关联较弱但有一个可借鉴的思路：它把“意图”当作权限决策的输入信号，这与我们的 AU 粒度问题是互补的——我们关心“授权单元如何切分与执行”，它关心“权限策略如何从意图自动推导出来”；如果把意图推断看作 AU 生成的一种信号源，它的“分级执行”（ graduated enforcement）与我们“给、但给粗一点”的中间档思路有呼应，可以在讨论“AU 粒度规则能否离线学”时顺带提一句。诚实标注：这是单作者 Zenodo 概念架构提案，摘要里没有给出任何实验、评估或部署证据，“首个”之称是作者自述；不宜作为实证引用，只能作为设计思路参考。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "持久记忆、对话历史检索、个性化上下文与自主决策越来越多地集成进生成式 AI 系统，给会话隐私与用户可控的信息管理带来新挑战。现有记忆管理机制一般依赖用户手动选择和维护“历史信息能否影响后续交互”的设置，用户在独立推理、探索性研究、敏感讨论、个性化协助等需要不同上下文边界的活动之间频繁切换时，交互负担很重。本文提出一个根本问题：生成式 AI 系统能否从用户对话的潜在意图推断运行需求，并主动决定应推荐或应用哪种记忆隔离与信息访问策略？为此提出意图自适应隐式权限决策（IAIPD）架构：持续评估对话意图、上下文敏感度、历史记忆相关性与潜在上下文干扰之间的关系，动态选择记忆隔离策略、做隐式权限评估、并以分级方式执行。据作者称，这是首个把“推断的会话意图、自适应记忆隔离策略选择、隐式权限评估、分级策略执行”整合进统一会话级权限决策框架的架构；与手动配置的记忆控制不同，它不需要用户逐项维护设置。", "supplement": false}, {"title": "Which check stopped it? Evaluating egress defenses for LLM agents", "authors": "Sai Gowtham Reddi", "url": "https://doi.org/10.5281/zenodo.24087764", "category": "实验室经验报告（Zenodo，单作者）", "cats": [], "oneliner": "在工具调用发出去之前设一道出口网关（域名过滤、载荷解码、字段级授权、身份绑定任务上下文），再逐项归因“到底是哪一检查拦住了它”：一次有界的实验室评估，不是疗效宣称。", "insight": "直接价值在方法论而不在结论：它的“逐项检查归因”（per-call deciding-check attribution）正是我们评估执行时绑定时需要的度量方式——当一次调用被拦住，要能说清是目录校验、参数约束、身份绑定还是速率限制中的哪一环起的作用，否则“ASR 降了”说不清功劳归谁；我们的实验节可以在归因口径上借鉴它的做法。它的“字段级授权对照权限记录”也与我们的 AU 思想同构：授权判定要落到字段/参数级，而不是只看工具名。诚实标注：作者自己划清了界限——虚构数据、模拟接收方、实验室报告，不宜引用其任何数字作为防御有效性的证据；只宜引用其归因方法与检查清单。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "这是一次有界的实验室评估：一个发包前的出口网关，检查项包括域名过滤、有界载荷解码、对照权限记录的字段级授权、身份绑定的任务上下文。评估用本地规划器（qwen3:14b）与第二个规划器（gpt-6.1-sol），协议冻结，每次调用都做“由哪项检查裁决”的归因，并以独立的接收方 ground truth 校验。数据是虚构的、接收方是模拟的；作者自述这是一份实验室经验报告，**不是疗效宣称、也不是新的安全机制**。", "supplement": false}, {"title": "Beyond the Document: Compiled Context and Governed Agents for Any Work Product", "authors": "James Rhodes、George Kang", "url": "https://arxiv.org/abs/2611.13055", "category": "arXiv 预印本（cs.SE / cs.AI / cs.IR，2026-11-09 提交）", "cats": ["cs.SE", "cs.AI", "cs.IR"], "oneliner": "文档只保存了工作的可见结果，却丢掉了背后的研究、计算、假设、证据与授权边界：Portable Agent Format（PAF）把工作产物连同编译好的上下文、证据、溯源与后续交互规则一起打包交付。", "insight": "关联中等，亮点在“授权边界随数据走”：PAF 把授权边界、证据与溯源编译进交付包本身，这与我们的 AU 思想是同一方向——授权元数据不应只存在策略库里，而应随检索单元一起流动；我们的 RU/AU 解耦框架可以在讨论“AU 如何随 RU 传播”时引用它的做法。它的 -1 回答率把“实质错误”与“未授权回答”合并成一个指标，也值得借鉴：我们的评估目前把 ASR 与良性效用分开报，合并口径（一次回答要么对、要么错、要么越权）可能更贴近真实部署的验收标准。诚实标注：四个包是作者自建的评估集，400 个冻结问题与 12,000 条回答的规模不小，但包数只有 4 个、且离线阅读器的历史记录问题全军覆没，说明结论对包类型的依赖很强；引用时应写清“在作者的四个包上”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "文档保存了专业工作的可见结果，却常常丢掉背后的研究、计算、假设、证据与授权边界。本文研究另一种交付单元：Portable Agent Format（PAF）包——工作产物连同编译好的上下文、证据、溯源与后续交互规则一起打包。为了检验这些上下文在产生它的过程之外是否仍有用，作者评估了四个新包（投资提案、基金研究、财务报表分析、工程事故复盘，其中两个由专用 agent 生成、两个由通用助手的打包技能生成；托管与离线阅读器在评估前已冻结）。在 400 个冻结问题、12,000 条评估回答上，托管的受治理阅读器成功率 96%，而“指令 + 原始文件检索”只有 86%（Holm 校正后 p < 10^-7）；在每条件 260 个可回答问题上，成功率是 94% 对 79%；仅靠源材料聊天与仅靠指令分别只有 48% 与 74%。一个独立的 8 亿参数离线阅读器总体成功率 69%，可回答问题上 54%；它的 -1 回答率（实质错误与未授权回答合并计算）为 2.9%，而“源材料 + 指令”对照组高达 56%。消融实验提示集成选择器与包自适应写作者有优势，但未把表示与训练效应分离开。同一次运行也暴露了一个失败：离线检索在一个金融数据包的 40 个历史记录问题上一个都没答出来。结论是：应把编译好的知识当作交付物的一部分，但标准互操作与端到端治理仍待解决。", "supplement": false}, {"title": "From Information Access to Controlled Transactions: A Practitioner Case Study of Bilingual Conversational AI in B2B Manufacturing", "authors": "Yusri Askool", "url": "https://doi.org/10.5281/zenodo.24023711", "category": "实践者案例研究（Zenodo，单作者）", "cats": [], "oneliner": "一家匿名 B2B 制造企业的双语客户门户 + 对话式 AI 落地复盘：信息查询可以开放，交易动作必须受控——身份与授权、显式确认、防重复、审计日志四项已部署控制，外加一个“受治理对话式交易模式”与五条权限感知 RAG 设计命题。", "insight": "关联较弱，但它是少见的**来自部署一线的权限感知 RAG 证据**：它把“信息访问”与“受控交易”分成两档——查询可以宽、交易必须严，这与我们的“授权单元可加中间档（给、但给粗一点）”思路同构；它的五条权限感知 RAG 设计命题（摘要未展开）值得在写“部署启示”时去原文核对一条是否可引用。诚实标注：单作者、匿名企业、内部报告未经独立审计、未披露任何可核验的量（客户数、交易量、百分比一概没有），“增长”是方向性描述；只能作为实践者视角引用，不能作为实证。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "本案例研究考察了一家匿名 B2B 制造企业在多系统数字化转型环境中，双语、可交易的客户门户与 AI 对话助手的部署。已部署方案为已认证客户提供阿拉伯语与英语的文本与语音访问，覆盖选定的信息查询与交易工作流；受治理的应用接口把客户意图连接到已授权的企业系统。论文区分了“作者报告的已部署控制”（身份与授权、显式确认、防重复、审计日志、联系指引）与更广的“推荐保证模型”（还包括交易对账与真人升级能力）。内部运营报告（未就本研究做独立审计）显示门户采用率持续、功能使用面扩大、通过客户渠道发起的订单呈方向性增长——但这些门户级观测不能具体归因于对话助手。论文未披露客户数、交易量、百分比、组织标识、系统名或底层仪表盘。作者给出一个可复用的“受治理对话式交易模式”、一套合成测试矩阵与度量框架，并提出五条权限感知 RAG 设计命题，同时保持授权与交易隔离。", "supplement": false}, {"title": "AgentLSD: Evaluating AI Security Agents Under Adversarial Task Contamination", "authors": "Matteo Golinelli、Idílio Drago、Matteo Boffa、Francesco Bergadano、Bruno Crispo", "url": "https://doi.org/10.1145/3847352.3848111", "category": "ACM Workshop on Artificial Intelligence and Security（AISec 2026）", "cats": [], "oneliner": "提示注入之外还有“任务污染”：攻击者不用写指令，只需在 agent 要读的网页、日志、配置里埋假结果、诱饵端点等非指令性欺骗物，就能让安全 agent 多走 20 轮、多花 2k 推理 token，甚至跟错诱饵交错 flag。", "insight": "对我们的威胁模型有直接的补强价值：它把攻击面从“指令注入”扩展到“环境证据污染”——假结果、诱饵端点这类非指令性内容，恰好落在我们的 T2（可见排序向量/环境数据）附近；我们的威胁模型目前以注入指令为主，写 T2 时可以引用 AgentLSD 来说明“环境数据本身就是攻击面，授权判定不能只看指令、还要看证据来源”。它也是一个可引用的 benchmark：成对的干净/污染实验设计与“+20 轮、+2k token”的代价度量，可以作为我们评估“绑定后 agent 是否被拖慢”的对照口径。诚实标注：规模很小（11 个 Web CTF、六个模型），干净条件解出率只有 41%（基线本身就不高），陷阱对解出率的影响不均匀；引用时应写清 CTF 环境口径，不宜推广为通用 agent 结论。", "source": "OpenAlex", "citations": "OpenAlex 1 次", "code": "无", "zh_abs": "安全 agent 要检查网页、源代码、日志、配置文件与命令输出，这些环境里可能含有欺骗性伪造物，影响 agent 的行为。作者称之为“对抗性任务污染”：与提示注入依赖攻击者提供的指令不同，任务污染还包括非指令性证据，如假结果与诱饵端点。AgentLSD 是一个研究对抗性任务污染的受控框架，以 CTF 挑战为实验环境：注入陷阱伪造物（假 flag、误导提示、诱饵端点、隐藏线索），同时保持原定 CTF 解法不变；框架支持“干净 vs 陷阱增强”的成对实验、确定性陷阱生成、运行时注入、遥测与交付验证。作者在 11 个 Web CTF 挑战上评估了六个模型：干净条件下 agent 拿到 41% 的 flag，没有模型解出全部挑战；随后度量任务污染的影响——即使 agent 最终仍拿到 flag，陷阱也会让轮数增加 20 轮、推理 token 增加 2k；解出率的影响则更不均匀：有些“模型—挑战”组合基本不受影响，有些会跟随诱饵或提交错误 flag。结论是：干净 CTF 成绩会低估 agent 对欺骗性任务证据的脆弱性；AgentLSD 隔离了这一效应，提供了一个可复现的基准。框架、配置、陷阱规格与原始轨迹均已发布。", "supplement": false}]}, {"date": "2026-11-11", "summary": "", "papers": [{"title": "Authorization assurance for tool-using LLM agents: a structured review of enforcement semantics and effect-level security evidence", "authors": "M. Elmasry", "url": "https://doi.org/10.1007/s10207-026-01343-w", "category": "结构化综述（International Journal of Information Security, Springer，2026-11-10 上线）", "cats": [], "oneliner": "这篇综述不数“谁声称安全”，而是逐条核对“主张—执行边界—观测证据”是否对得上：75 篇文献筛成 30 篇分析语料、92 条来源—主张记录，结论是 agent 授权领域最关键的两块证据（撤销、委托 containment）目前是空白。", "insight": "这是今日与 ChainBind 咬合最紧的一篇，也是投稿前最值得逐字对照的“审稿人视角”文献。它的三个空白点几乎就是我们的投稿论证清单：第一，“撤销主张为零”——我们的 epoch 撤销机制（委托人/工具/记录三级设域）恰好落在这个空白上，相关工作里应明确写出“据该综述的 21 篇 agent 文献统计，可评估的撤销主张为零”，这是我们工作的外部定位依据；第二，“最小权限只量变窄、不量轨迹有效权限”——我们的 E12 报的是 ASR 16/949 与良性效用，恰好是轨迹级有效权限的度量，写实验节时应把“轨迹级”三个字点出来，与它批评的“只量变窄”形成对照；第三，“最终状态正确 ≠ 授权正确”——这句话可以直接引用来支撑我们的核心论点“批准不是执行”。诚实标注：这是 11 月 10 日刚上线的综述，覆盖截止 2026 年 7 月 15 日，30 篇语料是作者冻结的闭合集合而非全领域普查，MAAP 是作者自提的初步框架、未经验证，引用时应写清“在该综述的闭合语料内”，不宜读成全领域定论。", "source": "SemanticScholar", "citations": "尚未收录", "code": "无", "zh_abs": "工具型 LLM agent 通过 API、工具、凭证与外部服务对受保护资源行使权限，作者问的是：授权主张是否有执行边界与观测边界上的证据支撑。75 篇证据库筛成 30 篇分析语料（15 篇严格 agent 文献、6 篇敏感性文献、9 篇授权/保证比较文献），产出 92 条来源—主张记录（SCR）。在闭合语料内，5 篇严格文献做了中介/不可绕过主张但证据端点各不相同；3 条可评估的最小权限主张都只证明了“可用权限变窄”，没有一条度量整条轨迹上的实际有效权限；21 篇 agent 文献里没有一条可评估的撤销主张；30 篇语料里没有一条委托 containment 主张；最终状态正确与授权正确也是两回事。作者据此提出“授权保证主张模型”（主张范围、义务、执行、证据、受保护效应、残余假设）与 MAAP 最低报告框架（明确标注为初步的、综述派生的报告框架，不是已验证的评分或认证工具），附完整筛选决策与独立编码审计的工作簿。", "supplement": false}, {"title": "PRISM: Causal Counterfactual Minimization of Agent Tool Privileges via Information Bottleneck Role Induction", "authors": "Yang Luo、Qingni Shen、Tairui Wang、Jiajun Li、Zhonghai Wu", "url": "https://arxiv.org/abs/2611.11539", "category": "arXiv 预印本（cs.CR，2026-11-08 提交）", "cats": ["cs.CR"], "oneliner": "角色工程的对象从人换成 agent：用因果反事实判断“这个工具对这个任务是否真必要”，再用信息瓶颈把轨迹压成离散角色，单角色授权工具数压掉 78.3%、爆炸半径降到 15.9%。", "insight": "这篇与 ChainBind 是互补关系：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”。它的思路可以直接借用到我们的 AU 生成上——与其让策略作者手写每个 AU 的覆盖映射，不如用反事实必要性学出“这一步最少需要什么”，再把学出的最小集作为批准的标的、由运行时的确定性绑定强制执行；两者叠加才是完整的最小权限：学出来的权限集 + 绑定住的执行。它的 78.2% 任务成功率与 15.9% 爆炸半径也可以作为我们 E12 的对照口径：我们报的是 ASR 与良性效用，它报的是成功率与爆炸半径，两者合起来才能说明“权限压下来了、正常路也没走死”。诚实标注：88.7% 的必要性准确率与 15.9% 的爆炸半径都是在三个基准、作者自建的反事实干预流程上的数字，“必要性”的 ground truth 来自沙箱干预本身，引用时应写清基准口径；且它只解决批准前的权限集生成，不处理执行时越界——这正是我们的位置。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "MCP 让 agent 一上手就拿到全部工具权限，过度授权是常态。PRISM 把“某工具对某任务是否必要”形式化为可干预的因果命题，在沙箱里做结构化干预学出反事实必要性模型；再用信息瓶颈把轨迹压缩成离散隐变量，按率失真曲线的拐点定角色数；最后把剪枝形式化为双层 Stackelberg 博弈，用生成流网络采样多样的近优解。在 AgentDojo、τ-bench、ToolEmu 三个公开基准上，单角色授权工具数压缩 78.3%，任务成功率 78.2%，反事实必要性判断准确率 88.7%，爆炸半径降至 15.9%。", "supplement": false}, {"title": "Rag n' Roll: A Framework to Evaluate Indirect Prompt Manipulation Attacks against RAG-based Applications", "authors": "Gianluca De Stefano、Lea Schönherr、Giancarlo Pellegrino", "url": "https://doi.org/10.1145/3847352.3848095", "category": "ACM Workshop on Artificial Intelligence and Security (AISec 2026)", "cats": [], "oneliner": "RAG 的间接提示操纵（往公开文档库里埋指令）到底多好使？作者先复核了 5 种已有攻击技术，再搭了一个端到端评估框架 Rag-n-Roll，发现默认配置下攻击能控制高达 70% 的生成答案，而既有评估方法会系统性高估攻击成功率。", "insight": "对 RU/AU 论文的直接价值在两处：第一，它给了一个可引用的攻击面数字——默认配置下 70% 的答案可被操纵，且攻击效果高度依赖流水线参数，这与我们“检索结果进上下文前必须由架构保证授权判定”的主张同构：注入文档一旦进了检索集，文本层面的防御就拦不住，只有在检索/授权边界上卡住才行；第二，它的“既有评估会高估攻击成功率”是一个方法论提醒——我们自己的 cloze 攻击 89.4%@20 与按授权视图重编码后 4.05% 的对比，也应写清评估口径（检索配置、k 值、判定标准），否则同样会被质疑数字的可比性。诚实标注：70% 是默认配置下的最高值、且依赖流水线参数，不是所有 RAG 配置的通用结论；25 次引用是 OpenAlex 在论文上线两天内的计数，宜理解为预印本流传期的引用累计，引用时以 AISec 会议版本为准。", "source": "OpenAlex", "citations": "OpenAlex 25 次", "code": "无", "zh_abs": "RAG 常从公开文档库取知识，这给间接提示注入留了口子：攻击者可以针对性地炮制文档来控制生成答案。作者先梳理了构建 RAG 应用的常用框架、导出原型架构并识别关键参数，再复核已有文献里的间接提示操纵技术，选出横跨两大类的 5 种技术并审视其有效性评估标准。在此基础上实现 Rag-n-Roll 框架，对 LLM 流水线做端到端评估，并引入新指标以更好地区分生成答案的良性/恶意属性。结果表明：既有评估实践不足以精确评估针对 RAG 流水线的攻击，会导致成功率高估；默认配置下攻击可控制高达 70% 的生成答案，但这一表现高度依赖此前被忽略的流水线参数。", "supplement": false}, {"title": "Text2NGAC: a multi-LLM pipeline for NGAC policy extraction with mutation-based verification", "authors": "Ayesha Habib、Huixiang Zhang、Dan Zhu、Waiz Haider", "url": "https://arxiv.org/abs/2611.12572", "category": "arXiv 预印本（cs.CR，2026-11-09 提交）", "cats": ["cs.CR"], "oneliner": "自然语言写成的访问控制策略，第一次被完整抽成 NIST 下一代访问控制（NGAC）图：多 LLM 流水线 + 五策略验证器，变异测试检出 99.7% 的注入故障，抽出的图能直接装进 NIST 参考实现并复现全部 55 条访问判定。", "insight": "对 RU/AU 论文的策略层有直接借鉴：我们的策略是独立存放、查询时逐 AU 求值，策略本身从哪来一直是个未展开的假设——这篇给出了“自然语言策略 → 可执行策略图 → 参考实现复现判定”的完整链条，99.7% 的变异检出率与 55/55 判定复现是策略抽取可信度的硬证据，相关工作里可以引用它来说明“策略可从文档中可靠抽取、而非只能手写”。它的“验证器本身用变异测试度量有效性”也是一个可借鉴的方法论：我们的保守子句切分器与 NLI 残留检查同样需要一个“检查器本身有多可靠”的度量，变异测试是现成做法。诚实标注：97.3–99.6% 是在 4 个真实语料、714 句上的数字，作者已声明精度是措辞与基准特定的、对抗输入不在保证内，引用时不应写成通用抽取精度；且它是策略抽取、不是运行时授权判定，与我们的执行语义是上下游关系而非替代关系。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "访问控制策略用自然语言写、却要按形式化模型执行，把前者翻译成 NIST NGAC 图一直没解决：已有系统只覆盖 NGAC 模型子集，且没有一个验证自己抽出的图。Text2NGAC 用多个 LLM 协作：先逐句消歧再抽取，不确定的句子升级到多模型集成，最后用五策略验证器检查结果图，验证器本身的有效性用可控变异测试度量。据称是第一个从真实策略文档中抽出全部四种 NGAC 关系类型（关联、禁止、事件响应义务、指派）的系统。验证器检出 99.7% 的 918 个注入变异体与全部结构性 fail-open 故障，漏掉的故障类按安全后果加权刻画而非一笔带过；抽出的图可直接执行：某语料的图未经修改装入 NIST 参考实现，复现了该图蕴含的全部 55 条访问判定并端到端触发了一条抽出的义务；抽取精度在 4 个真实语料的 714 个评分句上达 97.3–99.6% 精确元组匹配，远高于三个复现基线，改写探针加语义重评分界定了流水线对措辞变化的敏感度。作者同时声明：报告精度是措辞与基准特定的，对抗输入不在验证器保证范围内。", "supplement": false}, {"title": "Scaling Adaptive Prompt Injection Attacks with Agent Swarms", "authors": "Alexey Kurakin、Vishal Karande、Alex Bie、Chongyang Shi、Shuang Song、Saeed Mahloujifar、Abdullatif Köksal、Jamie Hayes、Juliette Pluto、Yinghao Sun、Kamalika Chaudhuri", "url": "https://arxiv.org/abs/2611.11861", "category": "arXiv 预印本（cs.CR / cs.LG，2026-11-09 提交）", "cats": ["cs.CR", "cs.LG"], "oneliner": "静态注入弹药打到 2025 年中就饱和了，但这不等于注入已死：作者用“agent 群体”做自适应攻击者，在新合成的评估集上可靠地骗过了一批在 GraySwan Arena 等公开基准上被认为稳健的模型。", "insight": "这篇直接支撑 ChainBind 的一个核心判断：文本层面的防御（包括静态基准上“稳健”的模型）挡不住能力增强的攻击者，防御必须落在执行边界。它的评估设计也值得借鉴：用“随机非恶意动作”作对抗目标、把指令层级服从与安全知识剥离开——我们的 E12 里草案投毒残余失败（13/15 未守住）恰恰说明，攻击者不需要恶意载荷，只需要让模型在合规外表下多走一步；评估时若只用“是否含恶意指令”做判定，就会漏掉这类失败。诚实标注：结论建立在作者自建的合成数据集上，“可靠地骗过”没有给出统一的成功率数字，且“人类红队接近饱和”是对 Gemini 系列的判断，不宜外推到所有模型；它论证的是“防御需要自动化红队”，不是“所有现有防御都已失效”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "提示注入是当前 AI agent 面临的首要安全风险之一。早期工作针对简单工具调用 agent 与静态攻击载荷，到 2025 年中已趋饱和；到 2026 年秋，人类红队在 Gemini 系列模型上也接近饱和。作者认为这只是表观 plateau，注入攻击仍有可能、防御仍需持续投入。他们设计了一个新的合成评估数据集，用随机的非恶意动作作为对抗目标——这种设计把“注入鲁棒性”度量为模型尊重指令层级的能力，并把它与模型对安全实践的知识剥离开。结果显示，能力增强的 agent 型攻击者能可靠地诱使模型服从工具输出中的指令，即使是此前在 GraySwan Arena 等公开提示注入基准上被认为稳健的模型。这表明当前前沿防御可能需要主动的、自动化的红队测试才能跟上能力不断提升的攻击者。", "supplement": false}, {"title": "Double Blind Evals: Resolving the Dual Confidentiality Dilemma in AI Safety Auditing", "authors": "Andrew Trask、Sol Messing、Vai Pahwa、Pegah Maham、Rene Kolga、Austin Frantz、Andrew Tash、Kate Thomas、Sean McGregor、George Balston 等", "url": "https://arxiv.org/abs/2611.12604", "category": "arXiv 预印本（cs.CR / cs.AI / cs.LG，2026-11-09 提交）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "评估者不想泄露考题、模型方不想泄露权重——作者用硬件安全飞地（NVIDIA H100 secure enclave）做了世界首个“双盲评估”试点：Google DeepMind 的 Gemini 2.5 Flash Lite 对私有 AILuminate 基准跑分，双方互不看到对方的秘密。", "insight": "关联较弱，但对我们论文的“机密计算”那条线有参考价值：我们的关键词里有 confidential computing for LLM，这篇是它在评估场景下的一个真实落地——评估提示与模型权重双向保密，用的正是硬件飞地 + PySyft 的组合。它对我们威胁模型的启示是反向的：T1/T2/T3 都是按“攻击者能看到什么”分层，这篇说明“评估者/模型方互相看不到”本身也可以用硬件保证——如果将来要把“机密计算”从背景提到方案里，这篇是可引用的部署先例。诚实标注：这是一次试点（a selection of the benchmark corpus），不是全量评估；“世界首个”是作者自述，引用时应写清试点性质；它解决的是评估场景的双向保密，不是 RAG 检索时的授权判定，与我们的执行语义无直接咬合。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "AI 安全评估常涉及敏感提示与专有模型：评估者希望对模型方保密评估提示以防数据泄露、延长基准寿命；模型方则希望把专有模型权重与推理代码留在自己的安全基础设施内以保护知识产权。作者提出“双盲评估”，用密码学保证评估者的提示不被模型方看到、同时保持模型权重与推理代码的机密性，手段是硬件级加密内存的安全飞地。在世界首个试点中，他们在 Google Cloud 的 NVIDIA H100 安全飞地内，用 OpenMined 的 PySyft 维护数据与模型隐私，对专有 Google DeepMind 模型 Gemini 2.5 Flash Lite 跑了一部分私有 AILuminate 基准语料。作者认为这是首次用该技术实现一方的最前沿专有模型权重与另一方的封闭基准之间的双向保密。", "supplement": false}, {"title": "Can the Confidence and Decisions of System 1 Models Be Trusted? An Explainability and Perturbation Audit of Jev-Style Decision Models", "authors": "Julien Delaunay", "url": "https://arxiv.org/abs/2611.12521", "category": "arXiv 预印本（cs.LG / cs.CL，2026-11-09 提交）", "cats": ["cs.LG", "cs.CL"], "oneliner": "Jev 式 System 1 决策模型（一次前向返回类型化概率分布，不生成文本）的首份公开审计：置信度是概率分布离散度的闭式变换、不是经验准确率；小模型多问题同发会互相干扰、翻转率最高 22.4%；但 4B 以上模型在提示注入防御上 AUROC 达 0.988–0.998、48–60 毫秒出结果。", "insight": "这篇与我们的论文本体关联较弱，但与我们**每天实际在用的流水线**直接相关——我们的 Jev 分类（classify_rss.py）正是 Jev 式 System 1 模型的三问并行（相关性/归类/质量）。两条发现值得记进流水线运维笔记：第一，置信度是离散度的闭式变换、不是经验准确率，所以 Jev 返回的 relevance/quality 分数不能读成“这篇有多相关”的概率，只能当排序信号用——这与我们“Jev 只做排序和候选、最终取舍权在人”的定位一致；第二，小模型上多问题同发会互相干扰、翻转率最高 22.4%，而我们恰恰是三问并行发在一个请求里——如果将来发现分类结果不稳定，首先应怀疑跨问题干扰、而非模型本身，缓解办法是拆请求或换 4B 以上模型。诚实标注：审计用的是开源权重 Tev1 系列模型，不是我们调用的 Jev 服务本身（jev-1.14.0），结论外推到我们的调用链时应谨慎；且 0.988–0.998 的 AUROC 是在 Tensor Trust 的 N=250 样本上的数字，不宜读成通用注入防御能力。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "TypeSafe AI 的 Jev 首创的“System 1”决策模型用单次前向返回声明 schema 上的类型化概率分布（Choice、Score、Noul），替代自回归文本生成，已部署于低延迟路由与自动分诊，但其统计校准与事后可解释性一直未被刻画。作者引入开放的、确定性的审计基准，从三方面评估：标签保持扰动下的校准、跨问题干扰、事后归因忠实度。在 5 个开源权重模型（0.8B–27B）与生成式 System 2 基线（单 token logprob 打分与结构化 JSON/CoT 解码）上，横跨 NLI（e-SNLI）、对抗句法捷径（HANS）、合成临床分诊（N=900）、提示注入防御（Tensor Trust，N=250）与 86 例逻辑门触发套件，得到五条发现：(1) 供应商置信度是离散度的精确闭式变换（10B 以下模型为 1 − H(p)/ln K，Clef-27B 为归一化间隔），而非经验准确率；(2) 单请求内打包多问题会引发方向性跨问题干扰（Tev1-0.8B 上二元翻转率 11.7%–22.4%，Tev1-4B 上仅 0.1%–0.2%）；(3) 4B 以上 System 1 模型在句法漂移下的速度与校准均优于 logprob（ECE_w 0.144）与 JSON（0.378）基线（ECE_w 0.030–0.087）；(4) 提示注入防御上 4B 以上模型 AUROC 0.988–0.998、召回最高 95.2%、零误报，耗时 48–60 毫秒；(5) 单次推理使 512 联盟的可解释性分析可交互（每输入 1.3–3.2 秒），而带 logit 链接的 KernelSHAP（S1-SHAP）可缓解 softmax 饱和，析取 OR 门恢复率 89.3%–100.0%（概率空间为 57.1%–82.1%，p_adj = 0.004）。", "supplement": false}, {"title": "AI Safety for Agentic AI in Europe Part III: Preventing Data Purpose Laundering and Tool Abuse with Hardware-Verified, Per-Action Execution Control", "authors": "Sangam Das", "url": "https://doi.org/10.5281/zenodo.24074486", "category": "技术披露（Zenodo 存档，未经同行评审，2026-11-09）", "cats": [], "oneliner": "GDPR 的“目的限定”原则今天只靠合同与事后审计执行，作者提出一个执行前强制架构：每个工具调用先被扣为“未生效的提议动作”，由 agent 之外的受保护执行域逐项验证后才放行，堵住“为 A 目的收集的数据被转成 embedding/记忆后挪作 B 用”的目的漂洗。", "insight": "这是今日第二篇与 ChainBind 同构的文献——“批准不是执行”换了个名字叫“非生效扣留 + agent 外验证”，且它把问题锚在 GDPR 目的限定与欧盟 AI 法案的数据治理、记录保存、人类监督与网络安全要求上，给了我们的执行时绑定一个合规法层面的外部依据。它的“数据目的漂洗”概念也值得在讨论节提一句：embedding 通道泄露（我们的 cloze 攻击 89.4%@20）本质上就是一种目的漂洗——为检索目的建的向量被挪作恢复机密之用，按授权视图重编码则是在向量生成时就按目的设限。但必须诚实标注：这是单作者 Zenodo 技术披露、零引用、未经同行评审，且摘要只描述了架构意向、未给出实现与实测数字，只能当作设计思路与合规论证的输入、不能当作经验证据引用；与 11 月 10 日报告里的 Zenodo 概念集（Boundary Failure Atlas）同类，引用时要写清这一性质。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "今天的 agent 能调工具与 MCP 服务器、跑 shell、改代码、操作浏览器、写数据库与向量库、发消息与付款、把个人上下文发给云端模型。现有的防护（提示护栏、安全分类器、沙箱、应用权限、OAuth 令牌、工具 schema、审计日志）只决定 agent“一般能不能用某个接口”，不决定“这个具体动作、在这份个人数据上、为这个目的、现在该不该发生”；它们也防不住数据目的漂洗——为某一目的收集的个人数据被转成 embedding、摘要、agent 记忆、特征向量或训练数据后挪作他用，而 GDPR 的目的限定原则本应禁止这种行为、今天却主要靠政策、合同与事后审计执行。这份披露描述了一个执行前强制架构来同时堵住两个缺口：非生效扣留——每个提议的工具调用、MCP 动作、函数调用、浏览器/桌面操作、shell 命令、代码补丁、数据库或向量库写入、记忆更新、云端协助请求、付款或消息，先被扣为一个未生效的提议动作；agent 外验证——agent 之外的受保护执行域在任何内容被放行前验证该动作。", "supplement": false}, {"title": "Say Shibboleth: Fingerprinting the LLMs and Harnesses Behind Agentic Attacks", "authors": "Dario Pasquini、Reworr、Giuseppe Ateniese、Manish Bhatt、Sergej Epp", "url": "https://arxiv.org/abs/2611.12386", "category": "arXiv 预印本（cs.CR / cs.AI，2026-11-09 提交）", "cats": ["cs.CR", "cs.AI"], "oneliner": "攻击 agent 背后是哪个模型、哪套脚手架？作者用“shibboleth 陷阱”（模块化蜜罐服务）诱使攻击 agent 在拿资源的过程中暴露身份：15 个候选模型 top-1 准确率平均 90%，4 套脚手架识别准确率 92%。", "insight": "关联较弱，但对威胁模型有一个侧面补充：我们的 T1/T2/T3 是按“攻击者知道多少”分层，这篇反过来问“防御者能从攻击中知道多少”——攻击 agent 的模型与脚手架身份可以从行为遥测中以 90% 以上的准确率识别，且即使对方刻意隐藏身份、行为证据依然有效。这对我们的讨论节有一个小启示：如果将来要在审计日志里加“攻击来源归因”，行为指纹是比模型自声明更可靠的信号；反过来它也提醒我们：绑定检查的输入必须是结构化的批准记录而非模型转述——因为模型转述（声明）是最容易被操纵的一层。诚实标注：90% 与 92% 是在作者自建的陷阱与 15 模型/4 脚手架的封闭集合上的数字，蜜罐场景与真实攻击遥测的分布差异未度量，引用时应写清实验口径，不宜读成部署中的归因能力。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "作者研究对 agent 型网络攻击的指纹识别，目标是从遥测数据中可靠推断攻击者的配置（如 LLM 版本与脚手架）。为此引入“shibboleth 陷阱”：模块化蜜罐服务，把信息丰富的交互设为攻击者获取所需资源的前提条件，诱使其做出模型声明与特征性写作，而不需要一次成功的提示注入。为识别脚手架，作者引入通用机制来间接探测脚手架 peculiar 的执行行为——仅凭后续请求中可见的效应，就能揭示脚手架如何在工具输出中掩盖秘密、执行命令时限与调度工具调用。声明式与行为式推断结合后，在 15 个候选模型上平均 top-1 准确率 90%（行为分类器在未见过的脚手架或任务族上评估）；在 4 套脚手架的独立实验里，固定探测规则识别正确脚手架的准确率为 92%。即使被指令隐藏身份，agent 的声明变得无信息量、行为证据仍有可用价值。", "supplement": false}, {"title": "Harness Matters: Measuring and Dissecting Security Resilience in Web Agents", "authors": "Xinyi Wu、Jiagui Chen、JiaYi Dong、Geng Hong、Xudong Pan、Jiarun Dai、Mingxuan Liu、Min Yang", "url": "https://arxiv.org/abs/2611.11971", "category": "arXiv 预印本（cs.CR / cs.AI，2026-11-09 提交）", "cats": ["cs.CR", "cs.AI"], "oneliner": "Web agent 的安全不只取决于后端模型，脚手架本身就是一道安全边界：作者搭了 WebTrap Farm 评估框架（3 类攻击 + 可用性校准任务），发现有些不安全行为在没有任何显式攻击内容时也会发生——这是脚手架固有的安全失效。", "insight": "关联较弱，但结论与我们的架构主张同向：安全边界不在模型内部、而在执行链路上——这篇说的是脚手架，我们说的是批准—执行绑定，两者都主张“防御要落在模型之外的执行层”。它的“配对可用性校准任务”（把防御行为与能力局限区分开）是一个可借鉴的评估方法：我们的 E12 报良性效用 0.608（距 base −3.1pp）时，同样需要说明“效用下降是防御的代价、还是能力本身的波动”，配对校准是现成做法。诚实标注：摘要未给出具体的攻击成功率数字与统计量，结论是定性层面的；“脚手架固有失效”的判定依赖作者自建的 WebTrap Farm 与校准任务设计，引用时应写清这是框架层面的发现、不是部署统计。\n---\n**备注**：本轮去重口径问题的根因已定位——`lit_seen.txt` 存裸 DOI/arXiv ID，去重脚本拿完整 URL 比对导致 12 篇已报论文反复入选；本轮已用归一化比对重算并补登缺失的 S2 ID（AgentDyn、TRIP-RAG）与 Calibrating One-Round MIA 的 DOI。建议后续轮次在去重脚本里固定使用归一化键（去 `https://doi.org/`/`arxiv.org/abs/` 前缀、去版本号、S2 URL 取裸 ID），并对 S2 记录缺 arXiv ID 的情况保留标题交叉核对作为最后一道关。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Web agent 靠执行脚手架把用户目标翻译成真实的网页交互：解读目标、感知页面、规划推理、把模型决策落到浏览器操作。已有工作承认 agent 安全不只取决于后端模型，但脚手架设计如何定量地影响 Web agent 安全一直缺乏度量。作者先把 Web agent 脚手架刻画为四阶段执行工作流（目标解读、页面感知、推理规划、动作执行），再基于该抽象搭建 WebTrap Farm——一个系统的、可扩展的评估框架，覆盖三类代表性攻击：恶意用户提示、恶意提示注入、欺骗性网页设计；为避免把安全与任务能力混为一谈，用配对的可用性校准任务把真正的防御行为与能力局限区分开。评估显示：现有 Web agent 脚手架对典型攻击仍脆弱，有些不安全行为甚至在没有任何显式攻击内容时也会发生，揭示了脚手架固有的安全失效；统计分析表明脚手架与后端模型都显著影响安全结果，即已部署 agent 的安全由两者共同决定；最后定位了防御行为在各工作流阶段的出现位置并识别出更安全的设计机制，为构建更稳健的 Web agent 提供可操作的指导。作者的结论是：Web agent 脚手架是一道重要的安全边界，应超越以模型为中心的防御、转向脚手架层面的安全设计。", "supplement": false}]}, {"date": "2026-11-10", "summary": "", "papers": [{"title": "Authorization Drift in LLM Agents: Evaluating Boundary Compliance in Multi-Step Tool Use", "authors": "Chuxue Cao、Sirui Han", "url": "https://arxiv.org/abs/2611.09113", "category": "arXiv 预印本（cs.CR / cs.LG，2026-11-06 提交）", "cats": ["cs.CR", "cs.LG"], "oneliner": "没有攻击者，agent 也会在多步工具调用里越过授权边界——作者把这种现象形式化为“授权漂移”（数据、工具、范围、时间四个维度），建了 648 样本的 ADB 基准，实测越有能力的模型漂移越严重。", "insight": "这是今日与我们论文咬合最紧的一篇，也是 ChainBind 威胁模型里缺失的一块拼图。我们的 T1/T2/T3 全是按“攻击者知道多少”分层的对抗模型，这篇补上了一个非对抗维度：没有注入、没有投毒，agent 自己就会为了走捷径而多拿数据、多调工具——而它的四个漂移维度（数据、工具、范围、时间）恰好对应我们“批准—执行绑定”需要绑定的要素：批准时定的范围，必须在执行时逐项核对，缺任何一项都会漏。它的 ADB 基准（648 样本、7 领域、25,207 轨迹）是一个现成的可引用对照：我们的 E12 报的是 ASR 16/949 与良性效用 0.608，ADB 报的是漂移率与干净成功率，两者合起来才能说明“防御既拦住了攻击、也没把正常路走死”。第三，它的法律映射值得在讨论节提一句：数据最小化是最常被触及的条款——我们的“给、但给粗一点”中间档与按授权视图重编码，本质上都是数据最小化的工程实现，这篇给了它一个跨司法辖区的外部依据。诚实标注：arXiv 预印本、尚未收录；0.43–0.61 的漂移率是它自建基准上的数字，“合规路径充分”的判定依赖 SERS 合成流程本身，引用时应写清基准口径，不宜读成部署中的越权率。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "LLM agent 会在追求用户目标的过程中超出授权边界，且不需要任何对手。作者把这一现象形式化为横跨数据、工具、范围与时间的授权漂移，并引入授权漂移基准（ADB）：648 个样本、覆盖 7 个领域，每个样本配一条足够的合规路径与一条有吸引力的未授权捷径；为保证任务可执行、捷径够诱人、合规路径可行，基准验证用分阶段执行-反思合成（SERS），以真实 agent  rollout 而非 LLM 自评为依据。在 13 个 LLM 与 3 个框架上跑了 25,207 条轨迹：能力越强漂移越严重，前沿模型漂移率 0.43–0.61；但 86.18% 的任务存在一条已被观测到的干净成功轨迹，说明漂移是可避免的。漂移持续存在且以早期数据过度收集为主导；agent 脚手架带来的表面改进往往伴随着干净完成率的崩塌。作者还把漂移点映射到四个司法辖区的法律条文：数据最小化是最常被触及的条款，93.5% 有法律依据的漂移运行同时映射到多个辖区。", "supplement": false}, {"title": "From Procedures to Permissions: Learning Precise Subagent Authorization from Agent Skills", "authors": "Wenkai Yu、Yehui Tang", "url": "https://arxiv.org/abs/2611.08905", "category": "arXiv 预印本（cs.CL，2026-11-06 提交）", "cats": ["cs.CL"], "oneliner": "子 agent 该有什么权限，不必手写——Agent Skills 里本来就写着每一步要用什么工具、碰哪些文件，作者把这份程序知识变成授权的监督信号，学出精确的最小权限集。", "insight": "这篇与 ChainBind 是互补关系，不是竞争关系：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”。它的思路可以原样借用到我们的 AU 生成上——与其让策略作者手写每个 AU 的覆盖映射，不如从任务的程序知识（Skills、runbook、工具文档）里推导“这一步最少需要什么”，再把推导出的最小集作为批准的标的、由运行时的确定性绑定来强制执行；两者叠加才是完整的最小权限：学出来的权限集 + 绑定住的执行。数字上要诚实：13.4 与 24.1 个百分点的提升是在 ClawArena-Team 单一基准、Qwen3.5-35B-A3B 单一模型族上的结果，“精确率”的 ground truth 是作者自己合成的程序推导，不是外部审计，引用时只能说“在该基准上有效”，不能写成普适结论。另有一点值得在讨论节提一句：它把授权监督信号从“事后轨迹”前移到“事前程序”，与我们“策略独立于模型提议之外求值”的主张同构——权限的依据都不能来自执行者的临场判断。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "语言 agent 越来越依赖多个子 agent 协同完成专业工作，既要决定每个子 agent 做什么、也要决定它能碰哪些工具与工作区资源。现有系统能控制工具与执行环境，但不能直接说清每个委派子任务需要哪些资源；而仅凭任务结果与执行轨迹，也很难判断子 agent 的权限给得是否恰当。作者观察到 Agent Skills 编码了每一步所需的操作、工具与文件，是一份天然的授权监督来源：据此合成任务与分步程序，经子 agent 委派在交互环境中执行，用验证过的轨迹构造任务执行与授权的训练数据。在 ClawArena-Team 上，该方法使工具权限精确率提升 13.4 个百分点、工作区权限精确率提升 24.1 个百分点，同时 Qwen3.5-35B-A3B 的整体任务成功率提升 11.6 个百分点；在 Terminal-Bench 2.1 与 SkillsBench 上与现有 agent 数据合成方法相当。", "supplement": false}, {"title": "Notwithstanding Anything to the Contrary, Ignore All Instructions: Measuring Prompt Injection Guards on Legal Contract Review Attacks", "authors": "Mark Heimann、Bruno Jacob", "url": "https://arxiv.org/abs/2611.08834", "category": "arXiv 预印本（cs.AI，2026-11-06 提交）", "cats": ["cs.AI"], "oneliner": "挡在文档分析系统前面的 11 个开源提示注入守卫，在法律合同上测下来误报率最高 92.39%，两个还不如随机猜；一个五条正则的基线居然没被任何一个守卫全面压倒。", "insight": "这是一篇“检测式防御还远没够用”的实测证据，对我们写“为什么不用守卫、而用绑定”那一段直接有用：守卫在法律合同这种长而规范的文本上误报 92.39%，说明基于文本特征的判定在真实文档分布上根本不可靠；而“未授权的范围主张”这一类别上所有守卫得零分，恰好就是我们的授权问题换了个名字——文档里声称的范围比实际授权更宽，文本守卫看不出来，只有执行时对照批准记录才能拦住。它的级联方案（中档模型初筛 + 前沿模型复核，便宜 6.5 倍）则是一个可借鉴的成本结构：如果将来要在批准环节加来源过滤这类 LLM 参与的步骤，级联是控制成本的现成做法。诚实标注：结论只建立在法律合同语料上，92.39% 的误报率不能外推到通用 RAG 或对话场景；11 个守卫均为开源权重模型，不含闭源商业守卫；“五条正则不被支配”说的是帕累托意义上的不被全面压倒，不是说正则更好。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "专用的提示注入守卫已部署在文档分析系统前端，但没有任何一家公布过它们在法律合同上的误报率。作者在两份法律合同语料上实测 11 个开源权重守卫：文档级误报率最高达 92.39%；两个守卫的配对 AUC 低于随机水平；一个五条正则的基线未被面板中任何守卫帕累托支配。受控探针定位了模型特异与通用的失效模式。经提示的 LLM 能解决这些失效，包括第二个威胁类别（未授权的范围主张）——该类别上所有守卫得分均为零。级联 LLM 方案（中档模型的阳性结果由前沿模型复核）比全程使用前沿模型便宜 6.5 倍，且性能接近。", "supplement": false}, {"title": "I Think, Therefore I Attack: Evaluating Thought Injection Attacks on Reasoning Agents", "authors": "Parth Illendula、Alex Liu", "url": "https://arxiv.org/abs/2611.08811", "category": "arXiv 预印本（cs.AI / cs.CR，2026-11-06 提交）", "cats": ["cs.AI", "cs.CR"], "oneliner": "推理模型多出来的思维链是个新攻击面：把恶意指令伪装成模型自己的思考过程喂回去，agent 会在反向 shell 外泄、仓库投毒这类操作目标上达到 50% 的攻击成功率。", "insight": "这篇给我们的 T 模型补了一个新向量，值得在威胁模型一节提一句：攻击者不必再伪装成用户或工具输出，可以直接伪装成 agent 自己的思考——一旦注入文本进入了推理上下文，它就带上了“这是我自己想的”这一层信任。我们的运行时绑定恰好卡在它下游：无论推理过程如何被污染，最终的外泄调用仍要在执行时对照批准记录，50% 的 ASR 数字说的是“注入能让 agent 走到执行那一步”，而不是“执行本身无法被拦住”；这正是“批准不是执行”要划的那条线。但也要诚实写清两点：第一，50% 是在容器化靶场、特定开源模型上的最高值，且攻击效果高度模型特异，不能读成通用结论；第二，它同时证明了文本层面的防御（剥离思考标签）不可靠——这与我们“防御必须落在执行边界、而非文本边界”的主张一致，但也提醒我们：绑定检查本身若依赖模型生成的推理摘要，同样可能被污染，检查的输入必须是结构化的批准记录而非模型转述。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "大推理模型（LRM）是当前 agent 系统的核心组件之一，其显式的思维链推理阶段引入了新的攻击面——思想注入：把形似模型自身 deliberation 的不可信文本反馈给模型。作者分两部分研究：先在主流生产级开源权重模型（如 GLM-5.3、MiniMax-M2.5、Qwen3.8-Flash-Next）上评估静态思想注入提示在不同风格与带/不带思考标签条件下的效果，发现标签与载荷风格的影响都是模型特异的；再在容器化的 agent 网络靶场里，用伪装成目标模型自身推理痕迹的间接注入提示，在反向 shell 外泄、仓库投毒等操作目标上达到最高 50% 的攻击成功率。同一恶意目标用标准提示注入的用户口吻表达时从未成功，而思考标签还会抑制 agent 披露注入的倾向。结果表明，模仿推理模型自身的思考风格是有效的攻击方式，剥离标签是不可靠的防御。", "supplement": false}, {"title": "The Boundary Failure Atlas: Twenty-One Derived Misclosure Cases in Long-Horizon LLM Agents", "authors": "Rogério Figurelli", "url": "https://doi.org/10.5281/zenodo.24035794", "category": "概念案例集（Zenodo 存档，未经同行评审）", "cats": [], "oneliner": "一份纯概念的“边界失效地图册”：21 个构造出来的反例，覆盖授权与委派、组合依赖、时间与观测、来源与身份、工具语义、信息定级、跨所有者返回七类边界失效，每例都配了可检验的探针设计，但没有跑任何实验。", "insight": "关联较弱，但作为威胁模型的完整性检查清单有参考价值。它的七类边界可以逐项对照我们的 T1/T2/T3：我们按攻击者知识分层，它按失效发生的边界类型分类，两者交叉后能发现我们尚未展开的角落——例如“跨所有者返回”（一个所有者的工具把结果返回给另一个所有者的上下文）与“组合依赖”（单步都合规、多步组合后越权），后者与我们 E12 里草案投毒的残余失败（单步批准都通过、组合起来才越界）是同一类问题。它的“三值裁决”（允许/拒绝/不确定暂缓）也值得在讨论节提一句：我们的默认拒绝是二值的，三值是把“不确定”显式化的一种设计选项。但必须诚实标注：这是单作者 Zenodo 概念集、零引用、零实验，21 个案例全是推导出来的、不是观测到的；只能当作测试设计的输入、不能当作经验证据引用，相关工作里提它时要写清这一性质。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "agent 可靠性研究越来越多地区分“进展的语言”与“运行层面的进展”，但单一的“错误完成”类别太粗，无法定位跨不同边界产生的失效。这份概念案例集提供 21 个显式构造的、可测试的反例，围绕授权与委派、组合依赖、时间与观测、来源与身份、工具语义、信息定级、跨所有者返回组织；每例都指定一个假设世界、一个无效推断、一个可采纳的见证要求、一个匹配的阴性对照与一个前瞻性探针。手稿区分“可能失效的逻辑”与“模型确实表现出该行为的经验证据”，并进一步发展了边界传输文法、三值裁决策略，以及与软件验证、访问控制、来源追踪、分布式系统工程对照的比较协议。作者明确说明：本集不报告任何新执行的 agent 试验，也不估计缺陷率；其作用是暴露仅靠输出评估会漏掉的可独立检验的失效构型，并邀请在证据匹配的基线下加以确认、约简、纠正或反驳。", "supplement": false}]}, {"date": "2026-11-09", "summary": "", "papers": [{"title": "Position: Agents Orchestrate, Policy Enforces — A Deterministic Tool-Use Control Pattern for Agentic Assistants over Sensitive EEG Data", "authors": "S. Katamadze、Ankur Chattopadhyay", "url": "https://doi.org/10.1145/3846374.3846391", "category": "会议论文（第 3 届 ACM 大型 AI 系统隐私与安全分析研讨会）", "cats": [], "oneliner": "工具调用的安全不能押在模型自己的判断上——agent 只负责编排、发动作请求，授权必须交给模型之外的确定性策略引擎；三道信任边界按序设防，57 个测试用例里 32 个对抗调用全拒、25 个良性全放。", "insight": "这是今日与我们论文咬合最紧的一篇，也是 ChainBind 核心主张的独立旁证。它的表述是“agent 编排、策略执行”，我们的表述是“批准不是执行、授权绑定在执行时由确定性检查完成”——两者是同一架构原则在两个场景下的实例：定权限的东西必须坐在被管的东西之外，且判定必须发生在动作执行之前、不能依赖模型临场判断。讨论节或 related work 里可以引用它，说明“控制面与执行面分离”不是我们一家之言，而是 agent 落到 MCP 工具调用时各方都会撞上的结构性要求。第二，它诚实标出的缺口（B3 工具输出侧的投毒未被评估）与我们 E12 的残余失败是同一类问题：13/15 未守住全是草案投毒，即注入写进同会话草案、绕过精确匹配的批准过滤；它的“输出净化从不决定拒绝”恰好反衬出我们下一步“批准环节加来源过滤”的方向是对的——输出侧的污染必须在批准时就被看见，而不是事后净化。第三，它的三边界次序控制提供了一个可对照的参考架构：我们的 T1/T2/T3 是按攻击者知识分层，它的 B1/B2/B3 是按管线阶段分层，两者可以交叉引用，说明同一条攻击链在不同切面上的设防点。诚实标注：position 论文 + 可行性套件，不是稳健性基准；57 个用例是脚本化的、作者自己写的，32/32 与 25/25 的数字只能证明“机制按设计工作”，不能证明“能顶住自适应对手”，引用时应写清这一点。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "通过 MCP 调用外部工具的 agent 正在进入敏感场景，例如根据脑电（EEG）推断的情绪状态采取行动的助手；提示注入、工具投毒与未授权工具调用都威胁着这类 agent。作者的立场是：工具调用安全不能依赖模型的决定，因为承载合法指令的通道同时也承载攻击。agent 应该发出动作请求、把授权留给确定性策略引擎；三道带次序控制的信任边界、映射到 MCP 威胁分类学上，实现了这一模式。可行性套件共 57 个测试用例（32 对抗、25 良性）：控制关闭时所有脚本化对抗调用全部执行；控制全开时引擎拒绝全部 32 个对抗调用、执行全部 25 个良性动作。允许/拒绝列表与模式检查承担了绝大多数首次拒绝；输出净化从不决定拒绝，因此工具输出边界（B3）处被投毒的内容仍未被评估。作者明确写清这不是稳健性基准：4 个语言模型上的规则盲测小规模试验里，到达引擎的 21 个恶意调用全部被拒，但稳健性仍需自适应对手、独立基准、与现有确定性防御的对比，以及对返回内容攻击的评估。", "supplement": false}, {"title": "A live agent benchmark of independent action authorization for healthcare AI agents", "authors": "Senapati Lipsa", "url": "https://doi.org/10.21203/rs.3.rs-11133816/v1", "category": "预印本（Research Square，2026-11-06）", "cats": [], "oneliner": "给医疗 agent 加一道独立授权关卡的对照实验：576 个合成护理协调 episode、四臂对照，结果是全面管控组的不安全动作没有显著减少（0.7% 对 0.4%），常规任务成功率、升级准确率与校准度反而显著变差。", "insight": "这是一篇警示性的零结果，对我们写 E12 的讨论节直接有用。它的核心教训是：**“加了一道授权关卡”本身不是胜利**——如果关卡的判定质量不够（它的网关基于有损可观测投影，既会错放、也会错拦），不安全动作可以不降反升，同时任务效用显著受损。我们的 ChainBind 恰好站在同一条对照线上：E12 里同会话良性效用 0.608、距 base 只 −3.1pp 且不显著，受攻击效用 0.587、ASR 16/949——这篇的零结果反衬出“效用代价小 + ASR 实降”两者必须同时成立，缺一不可；只报 ASR 下降、不报效用代价的防御声明都是不完整的。第二，它的实验设计有一个值得借鉴的点：episode 带“隐藏真相 + 有损可观测投影”，把授权判定建模成“信息不完备下的裁决”，网关的错误分错放与错拦两类分别计数；我们的评估目前报的是 ASR 与良性效用两端，也可以对照这个设计，在讨论节里把“错误授权”与“错误拦截”分开表述得更干净。第三，它提醒了一个我们尚未展开的威胁维度：医疗这类高风险场景里，授权层的误拦截本身就是安全事件（该升级的没升级），而我们的 T1/T2/T3 目前只建模“不该放的放了”，没有系统处理“该放的没放”——可以在局限节诚实写进这一条。诚实标注：Research Square 预印本，未经同行评审；576 个 episode 全是合成数据，裁决是作者自己定的规则、无人类对照，0.7% 对 0.4% 的比较建立在极低的基线事件率上（每组不到 1%），统计功效有限，引用时只能引用其实验设计与警示性结论，不能把它当作“授权层无效”的证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "现有基准衡量的是医疗 AI agent“能做什么”，而不是“被授权做什么”。作者建了一个 live-agent 基准，固定任务、模型、提示词与工具，只改变是否由独立授权层 gating 执行；576 个合成护理协调 episode 跑在四个臂上：确定性规则、无约束 agent、网关管控 agent、网关加自主控制器。每个 episode 带隐藏真相与有损可观测投影，因此网关既可能错误授权、也可能错误拦截；一套预先指定、对各臂设盲的规则集裁决安全性。全面管控组的不安全动作占 0.7%，无约束组占 0.4%（+0.4 个百分点，95% CI −0.5 至 +1.2，P = 0.6875，无统计学意义）；常规任务成功率、升级准确率与校准度在全面管控下都显著更差，且更耗时、更耗人力。作者明确说明：合成数据、规则裁决、无人类对照，不能据此得出临床有效性结论。", "supplement": false}, {"title": "Evaluating Fine-Grained Authorisation Strategies for Securing AI Agents That Interact With Enterprise Applications", "authors": "Lukman Olateju", "url": "https://doi.org/10.62643/ijerst.2026.v22.n4.4829", "category": "期刊论文（International Journal of Engineering Research and Science & Technology，2026-11-07）", "cats": [], "oneliner": "在企业应用场景里实测四种细粒度授权范式：静态 RBAC、动态 ABAC、图关系授权与密码学委托能力令牌；结论是带密码学边界证明的作用域委托令牌判定在 10 毫秒内、且全程零未授权状态修改。", "insight": "这篇最值得借的是它的范式对照表：RBAC、ABAC、图关系授权、能力令牌四种范式放在同一套企业场景、同一批指标下比较，恰好覆盖了我们 related work 里“授权范式”一节需要的横向坐标——我们的逐 AU 求值 + per-view 索引可以放在这张表里作第五种，定位是“查询时、按数据单元求值的细粒度授权”，与它的“执行时、按动作求值的能力令牌”是互补的两端（一个管读什么数据、一个管能做什么动作）。第二，它的“密码学边界证明 + 作用域委托令牌”与我们的“批准绑定执行”是同一类思路的不同实现：都是把授权凭证变成不可篡改、不可跨上下文复用的绑定物；它报的 10 毫秒内判定也侧面支持我们的主张——确定性绑定检查可以做到足够便宜，不必把判定外包给模型临场判断。第三，它的威胁列举（间接提示注入、混淆代理、权限扩张）与我们的 T1/T2/T3 有重叠，可作威胁模型表述的交叉印证。诚实标注：IJERST 是非主流期刊，未见于 CCF 或 JCR 检索体系；“200 万次交易、零未授权修改”的声明在摘要里没有给出分攻击类型的拆解、也没有对照基线的原始数字，无法独立核查，引用时只引用其范式分类与设计思路，不引用其性能与安全性数字作证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "带大模型认知核心的自主 agent 正在从被动咨询界面变成能查企业数据库、触发 API 工作流、修改关键业务状态的主动操作者；给 agent 过宽或粗粒度的访问令牌会带来间接提示注入、混淆代理攻击与跨集成应用的不可控权限扩张。本文实测四种专为自主 agent 工作流设计的细粒度授权范式：静态基于角色的访问控制、动态基于属性的访问控制、基于图关系的访问控制，以及一种新的密码学委托能力令牌架构；覆盖五个企业应用场景、200 万次以上自动化 agent 交易，评估判定延迟、策略评估吞吐、最小权限执行精度与对抗提示操纵的韧性。结果称：传统 ABAC 在深度上下文评估下有显著延迟代价，而作用域委托令牌结合密码学边界证明在 10 毫秒内完成判定，并在复杂交易工作流中保持零未授权状态修改。", "supplement": false}, {"title": "Evil-AI Benchmark: An Evaluation Framework for Adversarial Security Assessment of LLM Agents in Smart Environments", "authors": "Aygun Varol、A. Shaikh、Henri Jalo、Givemore Muchenje、José Antonio Siqueira de Cerqueira、Kai-Kristian Kemell", "url": "https://doi.org/10.1109/ACCESS.2026.3727159", "category": "期刊论文（IEEE Access，2026）", "cats": [], "oneliner": "面向智能环境的 LLM agent 对抗安全评测框架：五类对抗威胁向量（提示注入、说服、中间人模拟、数据泄露、不安全动作）+ 能力验证，工具触发事件直连 Arduino 舵机做物理验证；8 个模型、350 个场景，Evilness 率从 0.8% 到 54.0%。", "insight": "这篇的价值首先在评测方法论：它把“过拒测试”（50 个良性场景）与对抗测试并列为一等公民，与我们 E12 同时报告良性效用与受攻击效用的做法一致——只报 ASR、不报良性代价的防御评估都是半张表；related work 引用它可以说明“安全-效用双侧度量”正在成为 agent 安全评测的共识做法。第二，它的 Evilness 率跨模型 0.8% 到 54.0% 的巨大 spread，与我们六模型基线 ASR 7.2% 到 59.4% 的 spread 是同一现象：模型本身的选择对安全结果的影响不亚于防御机制本身；我们在写跨模型结果时可以引用这个数字，说明“防御效果必须分模型报告、不能只报平均”。第三，它的物理执行验证（舵机）标出了一条我们工作的边界：我们的授权绑定目前只覆盖软件工具调用，agent 一旦驱动物理执行器，授权判定还需要一层“物理动作确认”——可以在未来工作里提一句。诚实标注：IEEE Access，同行评审但属于宽口期刊；“文中称开源框架”但本轮抓取未拿到仓库链接，复现性暂无法核查；250 个对抗场景的构造细节与裁判模型的具体配置未在摘要中展开，引用时以其方法论框架为主，不引用具体模型排名作证据。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无（文中称开源框架，但抓取记录未给仓库链接）", "zh_abs": "智能环境越来越多地用 AI 处理传感器数据、协调物联网设备、驱动物理服务；大模型进入这类环境后，现有基准大多只关注文本交互与生成输出的风险，抓不住模型控制物理执行器时产生的网物风险。本文提出 Evil-AI Benchmark，一个开源评估框架，从两方面评测智能环境里的 LLM agent：一是五类对抗威胁向量——提示注入、说服、中间人（AITM）模拟、数据泄露与不安全动作；二是能力验证，检查模型能否正确激活设备控制工具。框架记录工具激活事件，并把触发事件转发到外部 Arduino 驱动的舵机执行器，提供物理层面的执行验证。实测评估 8 个代表性大模型、350 个可执行场景：250 个对抗测试覆盖智能家居、医疗物联网、工业控制、公共基础设施与智能楼宇五个域，另加 50 个能力检查与 50 个良性过拒测试；两个独立裁判模型打分、人类评估者核验。Evilness（攻击得手程度）按成功攻击数计分、按占比计率；各模型 Evilness 率在 0.8% 到 54.0% 之间（成功攻击 2 至 135 次）。", "supplement": false}, {"title": "DualTrust: Asymmetric Bayesian Reputation and Cryptographic Gating for Autonomous AI Agents", "authors": "Khairan Noor Fadhlillah", "url": "https://doi.org/10.21203/rs.3.rs-11631847/v1", "category": "预印本（Research Square，2026-11-06）", "cats": [], "oneliner": "给自主 agent 的双轨门禁：贝叶斯声誉分管“行为漂移”、密码学门控管“每次调用”，号称中位 47.10 微秒出确定性授权裁决。", "insight": "这篇可借的只有一个架构表述：**委托人-代理分离**——人类委托人的可问责信用与 agent 的运行信誉分属两个账本、不可混同。这与我们 11 月 7 日合入修正后的 epoch 设域（委托人 / 工具 / 记录三级）是同一条思路：授权的作用域必须按“谁、用什么工具、动哪条记录”来划，而不是按效应笼统划；related work 里可以一句话引用这个对照，说明“设域粒度”是 agent 授权的共识性难题。但除此之外要保持距离：声誉机制本质上是概率性的、依赖历史行为的，与我们“每次请求确定性绑定检查”的路线正好相反——它的 47 微秒裁决数字建立在“声誉分已算好”的前提上，判定本身的开销不等于声誉维护的开销；而且它的威胁列举（记忆后门、切香肠式攻击）与我们的草案投毒有表面相似、机制不同，不能混为一谈。诚实标注：Research Square 预印本，单作者，未经同行评审；性能数字（47.10 微秒中位、10,000 轮蒙特卡洛）无公开制品可核查，摘要术语密度极高而方法细节极少，引用时只引用其“委托人-代理分离”的架构表述，不引用任何性能与安全性数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "环境可穿戴智能（AWI）生态里，自主大模型 agent 被授予调用外部 API、预留金融微额度、控制物理执行器的操作权限；现有安全护栏依赖二次 LLM-as-judge 分类器，带来 400–850 毫秒延迟与持续 token 开销，而静态 RBAC 挡不住持续行为漂移、记忆后门与交错切香肠式攻击。本文提出 DualTrust，一种非对称贝叶斯声誉与密码学门控运行时，强制实行委托人-代理分离架构，严格隔离“人类委托人可问责信用”与“贝叶斯 agent 运行信誉”；agent 行为由非对称幂律削减引擎持续调节，配确定性 SHA-256 64 桶条纹并发锁、原子锁定回滚退款，以及 O(1) 内存滑窗 RFC 6962 Merkle 审计账本。176 项自动化不变式测试与 10,000 轮蒙特卡洛攻击模拟的评估称：确定性授权裁决内存中位延迟 47.10 微秒（均值 63.16 微秒，p99 287.10 微秒），持久化 SQLite WAL 下 155.80 微秒。", "supplement": false}]}, {"date": "2026-11-08", "summary": "", "papers": [{"title": "Cambridge Analytica 2.0: How Enterprise AI Can Rebuild Company Secrets From Data It Was Allowed to See, and Why Frontier Models Alone Cannot Stop It", "authors": "Sangam Das", "url": "https://doi.org/10.5281/zenodo.23994904", "category": "预印本（Zenodo，2026-11）", "cats": [], "oneliner": "每一次访问都合规，拼起来却泄密：企业 AI 把各系统里“被允许看到”的碎片连起来，就能还原出未发布产品、并购目标或员工画像，而更强的模型只会更擅长连线、不是更擅长收手。", "insight": "这是今日与我们论文咬合最紧的一篇，也是我们威胁模型里一个真实的缺口：**跨查询的组合推断**。我们的 T1/T2/T3 都是“单次查询内”的攻击面——某次查询能不能看到某个 AU、embedding 会不会泄露某段文本；但这篇指出，攻击者（或被入侵的 agent）完全可以在每一次查询都合规的前提下，跨多次查询、多个 AU 逐步拼出敏感结论。我们的框架是“查询时逐 AU 求值、未知默认拒绝”，对单次查询是闭合的，对“多次合规访问的累积”没有预算概念。讨论节可以诚实写进这一局限，并把“组合感知授权”（例如跨查询的累积泄露预算、或对高组合风险的 AU 组合加一道复核）列为未来工作。第二，它的论断“更强的模型更擅长连线”可以反向加强我们的核心主张：既然模型能力增长放大的是组合推断能力而非防御能力，防线就不能押在“模型临场判断”上，只能落在架构保证上——这与我们“授权判定在检索结果进上下文之前、由架构保证”的立场是同一条论证链。第三，“被允许看到不等于被允许组合”这句话本身可直接引用，用来收紧我们对 AU 的定义：AU 不应只回答“这次查询能不能看这块数据”，还应回答“这块数据与调用者已见过的数据拼起来会不会越界”。诚实标注：这是 Zenodo 上的观点型文章，无实验、无数据、未经同行评审，引用时只能引用其论证与威胁刻画，不能把它当作任何机制有效性或泄露规模的证据；作者 Sangam Das 的机构背景未在记录中列出。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "2018 年剑桥分析事件不需要黑进数据库：为一个目的分享出去的个人数据，被第三方应用收集、拼成心理画像、再用于政治投放，教训是“被允许看到数据，不等于被允许组合数据”。本文认为企业 AI 正在公司内部以机器速度重演这一课：AI 助手与 agent 被接到客户记录、工程工单、源代码、供应商订单、预算、HR 系统、日历与长期记忆上，每一个接入口都可以单独获批，但把碎片连起来，AI 就能推断出任何系统都不曾存储的东西——未发布的产品、发布日期、并购目标、脆弱的供应商，或某个员工、客户的详细画像。被入侵的 agent、被注入的文档、粗心的集成或权限过宽的第三方 AI，都可能悄悄把公司自己的数据变成一张未来路线图。作者强调，更好的模型修不好这个问题：能力更强的前沿模型更擅长连接线索，而不是更不擅长；护栏、系统提示词与安全过滤都拦不住这种组合式推断，防线必须落在数据如何被组合、而非模型如何被管教上。", "supplement": false}, {"title": "The Power of Meta Access in the Software of the Future --- Demonstrated on LLM Chat UIs and Chat AI", "authors": "Julian Kunkel 等", "url": "https://arxiv.org/abs/2611.08428", "category": "arXiv 预印本（arXiv:2611.08428，cs.AI）", "cats": ["cs.AI"], "oneliner": "给助手一个“看界面本身”的分级权限阶梯：从功能教学、元数据访问、跨消息检索，到确认式修改与完全编排；一旦助手能改自己的设置，定权限的控制面必须与被管的执行面分开。", "insight": "这篇的价值不在实验，而在它从聊天客户端 / 人机交互一侧独立复述了我们的核心原则：**定权限的东西必须坐在被管的东西之外**。它的表述是“元访问一旦自指（助手能改自己的设置），就需要一个独立的控制面边界”；我们的表述是“授权判定在检索结果进上下文之前、由架构保证”。两者是同一原则在两个场景下的实例：一个管“助手能不能改自己的权限配置”，一个管“检索结果能不能带着未授权内容进上下文”。讨论节或 related work 里可以引用它作跨领域旁证，说明“控制面与执行面分离”不是访问控制论文的自说自话，而是 agent 落到真实界面时各方都会撞上的结构性要求。第二，它的权限阶梯（教学 → 元数据 → 检索 → 确认式修改 → 完全编排）提供了一种 AU 粒度的参照：AU 不必只有“看 / 不看”两档，可以按“读元数据、读内容、改状态、改配置”分层；我们的 per-view 索引与 retrieve-then-project 也可以对照这个阶梯来表述粒度选择。第三，它提醒了一个我们论文尚未展开的攻击面：检索结果之外的“界面元数据”（设置、偏好、对话摘要）本身也是可泄露、可注入的通道，我们的 T1/T2 若只覆盖文档内容，会漏掉元数据这一路。诚实标注：这是一篇位置型 / 原型演示论文，无安全评估、无对抗实验，Meta Chat 原型只验证了功能可行性；“控制面边界”在文中是设计主张而非已验证的机制，引用时应写清这一点。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "聊天仍是多数大模型任务的默认界面，但模型只看得到当前对话、看不到对话之外的工作区。本文提出 meta access（元访问）：给助手一个结构化的、带权限的“界面本身的视图”，并按能力排成阶梯——功能教学、元数据/设置/偏好访问、对摘要与消息的检索、经确认的修改、完全编排。元访问能把聊天客户端从“多屏入口”变成找、导航、整理与操作整个工作区的单一入口，但同时带来 grounding、隐私、提示注入与信任问题。关键论点是：通用 agent 框架本身就是运行时，因为它能改自己的设置，元访问会变成自指的，因此需要一个独立的控制面边界。作者用 Chat AI 客户端的 Meta Chat 原型验证：它从摘要、设置与相关消息构建有界上下文，链接对话、主题与人设之间的引用，支持经确认、可撤销的修改，提供可浏览的教程库，并把人设推荐为用户发起的对话。通过结构化暴露应用状态，元访问还能把屏幕阅读器从“控件描述”扩展到“语义化的工作区操作”。作者主张，未来的 AI 时代界面都应通过类似调试器的接口，暴露自身状态与能力的结构化、带权限模型。", "supplement": false}, {"title": "A Three-Layer Authentication Protocol for Secure Access Control in AI-Based Enterprise Document Management Systems", "authors": "Hyun-A Park", "url": "https://doi.org/10.3390/electronics15215154", "category": "期刊论文（Electronics，MDPI，2026）", "cats": [], "oneliner": "把 RAG 的 chunk、embedding、检索输出与生成结果都列为受保护对象，用“会话认证 → 角色/权限核验 → 事件组 membership 认证”三层协议管住企业文档系统里的 AI 访问。", "insight": "这篇最值得借的一句话是它的前提：**受保护对象不止文档，还包括 chunk、embedding、检索输出与生成结果**。这与我们的立场完全一致——AU 的保护范围必须覆盖检索管线里的全部中间产物，而不只是源文档；related work 里引用这句话，可以说明“把 embedding 与检索输出列为受保护对象”已是企业文档场景的共识性前提，而非我们的特殊设定。第二，它提供了一个有价值的对照：它解决的是“访问路径”的安全（谁能加入一次群组会话、密钥如何轮换），我们解决的是“检索判定”的安全（某次查询能对哪些 AU 求值）；两者互补而非竞争——它的三层认证可以放在我们的框架外面作入口控制，我们的逐 AU 求值放在里面作查询时判定，讨论节可以用一句话点明这种分层关系。第三，它的“事件专属组密钥只作认证材料、不用于重加密”是一个可借鉴的工程取舍：认证材料与加密材料分离，避免了组 membership 变化时全量重加密的代价；我们的 per-view 索引在 AU 变化时同样面临重编码代价，这个思路提示了一种“轻量认证、重量隔离”的折中方向。诚实标注：MDPI Electronics，单作者，方法论分量有限；安全性论证是给定假设下的计算不可区分性，没有对抗评估；原型评估只报了常数时间在线开销，未见与现有方案的横向对比，引用时只引用其问题建模与前提表述，不引用其安全性结论作证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业文档管理系统越来越多地集成语义检索、RAG、多模态交互与数据分析，受保护的对象也随之超出原始文档本身，扩展到 chunk、embedding、检索输出、生成回答与分析结果。传统的登录式或静态角色访问控制已不够用。本文提出一种三层认证协议，依次执行会话认证、角色/权限核验与基于事件的组成员认证；与传统组密钥方案不同，事件专属组密钥只作认证材料、不用于文档重加密；结合前向与反向哈希链，协议在动态群组环境下支持组密钥保密性、前向保密性与后向保密性。安全性分析表明，在给定假设下，受保护的认证值与同长度随机比特串计算上不可区分；效率分析与原型评估显示在线认证为常数时间开销。", "supplement": false}]}, {"date": "2026-11-07", "summary": "", "papers": [{"title": "Rethinking Access Control for AI Agents: Recent Advances and Open Challenges", "authors": "Chijin Zhou 等", "url": "https://arxiv.org/abs/2611.06764", "category": "arXiv 预印本（arXiv:2611.06764，cs.SE）", "cats": ["cs.SE"], "oneliner": "Agent 访问控制的现状综述：按策略推导、身份与委托、动作与资源执行、信息流控制四块梳理现有机制，并提出“授权必须随工作流演进而重新评估”等四点再思考。", "insight": "这是今日与我们论文咬合最紧的一篇，也是我们新方向（执行时授权绑定）最直接的 related work 候选。第一，它的四块分类法（策略推导 / 身份委托 / 动作执行 / 信息流）可以借来作 related work 的组织骨架，我们的 RU/AU 解耦与“查询时逐 AU 求值”正好落在“动作与资源执行”一节里，有现成的位置可放。第二，它提出的“授权必须随工作流演进而重新评估”与我们“执行时绑定”的主张是同一思想的不同表述，可互相印证；“上下文信息可为决策提供依据、但本身不授予权限”这一点，则可用来回应一种常见质疑——即“agent 看到了某条信息是否等于获得了授权”，答案是否定的。第三，它的评估标准（同时看可观测行为与仍被允许的未授权效果）值得借鉴：ChainBind 的 E12 里 blocked_arg 归零但 ASR 未归零，正说明“观测到的越权少了”不等于“未授权效果被关掉了”，引用这条标准可以让我们的评估一节站得更稳。诚实标注：这是一篇综述而非实证工作，本身不提供新的数字或 benchmark；引用时应只引用其分类与论点，不把它当作任何机制有效性的证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "大模型 agent 会访问数据、调用工具、代用户行动，但 agent 自主选择执行路径、权限与运行条件又可能中途变化，要把它的行为约束在授权范围内并不容易。本文综述近年 agent 访问控制的进展，覆盖四个方面：策略的表述与推导、身份与委托、动作与资源的执行、信息流控制；比较各机制的控制对象、执行边界与假设，考察单个机制能做到什么、彼此如何配合。在此基础上，作者对授权的四个方面提出再思考：计划选择会塑造权限需求；上下文信息可以为决策提供依据、但本身不授予权限；限制条件在跨越系统接口时必须保持原意；授权必须随工作流演进而重新评估。文末给出开放挑战、具体研究问题与评估标准，特别强调评估应同时考察 agent 的可观测行为与“仍被允许的未授权效果”。", "supplement": false}, {"title": "Revoked, Not Stopped: Late Revocation Notices and Channel-Switching in LLM Agents", "authors": "Muzammal Hussain", "url": "https://doi.org/10.5281/zenodo.23964291", "category": "预印本（Zenodo，2026-11）", "cats": [], "oneliner": "撤销不是瞬间生效的：通知晚到一步，16.5% 的已撤销敏感动作照常通过；撤销若只按工具名下发，agent 会改走另一条通道把数据送出去，最高达 38.7%。", "insight": "这篇补上了我们论文尚未系统处理的一块：**授权的撤销**。我们的 RU/AU 框架默认“权限在查询时求值”，但这篇证明“求值时点”与“撤销到达时点”之间的滞后本身就是攻击面——16.5% 这个数字是“权限变了、判定没跟上”这一失效模式的直接量度，可与我们的“查询时逐 AU 求值”并列：我们讲求值应在查询时发生，它讲求值还必须在每次敏感动作前重做（否则滞后窗口就是 16.5%）。第二，“撤销必须按效果（数据离境）而非按工具命名”这一结论可直接写入威胁模型：我们的 AU 若按工具或数据源命名，同样会被通道切换绕过；按效果界定 AU（例如“患者文档不得离境”）才是对的粒度。第三，“403 裸错误会让通道切换率从 10.6% 升到 56.4%”说明拒绝消息的表述方式本身是安全机制的一部分，讨论节可借它写一句：我们的“未知 AU 默认拒绝”在实现时应返回明确的撤销语义，而非裸错误码。诚实标注三点：模拟器是确定性的 1800 条轨迹、真实模型实验只用了 5 个开源小模型（3B–8B），数字不宜直接外推到前沿闭源 agent；“患者文档外发”是虚构场景，不是真实医疗数据；venue 是 Zenodo 预印本，未经同行评审，引用时只引用其实验设计与数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "github.com/MHKhan50/agent-revocation-lag-benchmark (★0)", "zh_abs": "工具调用型 agent 可能在权限被撤销后继续按旧权限行动。本文研究两种失效方式。第一，agent 运行时缓存的授权要等撤销通知到达才失效：作者用 RevocationLag 确定性模拟器跑了 1800 条动作轨迹，通知晚到一步会让 16.5% 的已撤销敏感动作通过（95% CI 15.6–17.4）；丢失 30% 的通知时通过率为 28.2%；每两步重发一次丢失的通知可降至 12.7%（每回合 2.32 次控制事件）；只有每次敏感动作前都复核才能归零，代价是每回合 5.21 次控制事件。第二，agent 自身会绕过拒绝：在 1916 个回合、5 个本地运行的开源权重模型上，首次尝试把一份虚构患者文档发到诊所之外均被拒绝；但当撤销只覆盖被拒绝的那个工具（即权限按工具名命名）时，文档会经由另一条通道外泄，qwen2.5:3b 为 38.7%、qwen2.5:7b 为 33.5%、llama3.2:3b 为 11.2%、llama3.1:8b 为 5.4%；162 次外泄中有 96 次 agent 还同时告诉临床医生“权限已被撤销”。把明确的撤销消息换成一句光秃秃的“403 Forbidden”，qwen2.5:7b 的通道切换率会从 10.6% 升至 56.4%；在系统提示词里加一条规则能降低但不能消除该行为。结论是：agent 的撤销必须按效果（数据离境）来界定、在每次调用时执行、并明确表述。", "supplement": false}, {"title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "authors": "Woosang Lim 等", "url": "https://arxiv.org/abs/2611.07222", "category": "arXiv 预印本（arXiv:2611.07222，cs.CR）", "cats": ["cs.CR"], "oneliner": "不靠模型临场判断的确定性防线：动作的目标值只认工具类型化返回里的字段，注入文本一律先清洗、留证，三个 backbone、七个任务套件上标准模板注入零次得手。", "insight": "这篇与我们的“执行时授权绑定”在方法论上高度同构，值得在讨论节作强对照。我们的思路是“执行时逐 AU 求值、未知默认拒绝”，SPILLWAY 的思路是“目标值只认类型化字段、自由文本一律不算数”——两者都把“模型在运行时临场决定能做什么”这个自由度收走了，只是一个收在授权判定上、一个收在动作目标的来源上。它的“确定性底线 + 本地裁决器可恢复被拒调用、但绝不恢复目标在已删文本里的调用”这个不对称设计，尤其值得借鉴：我们的 per-view 索引与 retrieve-then-project 也可以配一个类似的“只放宽、不放行已污染目标”的恢复规则。诚实标注：零得手是在“标准模板注入”与作者选用的七个任务套件上的结果，强化学习攻击者仍有 0.007 的平均成功率；且它的准入判定依赖“目标值来自类型化字段”这一前提——对返回全是自由文本的工具（例如通用网页抓取），这条底线会退化为全靠清洗器，引用时应写清这一适用条件。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "工具调用型 agent 会操作邮件、文件与支付，藏在网页或共享文档里的指令可能让 agent 把数据或钱发给攻击者。许多运行时防御把“是否放行”的决定交给一个语言模型，因而决定本身可能读到攻击文本、且每步都要多调模型；溯源类防御把模型移出最终检查，却仍需模型先规划或路由每个任务。本文指出动作的目标其实可以从工具的类型化返回值里读出来：邮件发件人、支付账号等以类型化字段到达，而注入指令只以自由文本到达。SPILLWAY 据此建了一道无需逐任务规划的确定性底线：仅当工具输出中出现、但用户任务里没有的每个目标值，都是由只读工具以类型化字段返回、或被固定委托规则覆盖时，才放行该调用；确定性清洗器按固定规则删掉指令式片段、留存删掉的片段作证据，本地裁决器可以恢复被拒绝的调用，但绝不恢复目标落在已删文本里的调用。在三个 backbone、其中一个 backbone 的七个任务套件上，标准模板注入在 SPILLWAY 下零次把动作重定向到攻击者目标，且效用与综合评分（NRP、ERS）在所比较的防御中最高；伪造的聊天模板同样打出零分，在已发布的强化学习攻击者面前平均域内攻击成功率仅为 0.007，且全程几乎不增加模型调用、无需因防御触发而重跑 backbone。", "supplement": false}, {"title": "Beyond Instruction Override: Benchmarking Indirect Prompt Injection with Task-Tampering Attacks", "authors": "Rongting Zhang 等", "url": "https://arxiv.org/abs/2611.07640", "category": "arXiv 预印本（arXiv:2611.07640，cs.CR）", "cats": ["cs.CR"], "oneliner": "把间接提示注入重新定义为“越权”而非“像指令”：90 个验证案例里攻击篡改的是正在进行的任务的决策本身，现有防御对非目标类攻击几乎失效。", "insight": "这篇的定义工作对我们最有价值：**“按权限而非措辞定义注入”**——植入内容是否构成攻击，取决于其来源是否有权决定该决策，而不是它看起来像不像指令。这与我们的 AU 思路是同一枚硬币的两面：AU 回答“谁有权决定什么”，它回答“无权决定者试图决定即攻击”。这个定义可直接借来收紧我们威胁模型里 T1/T2 的表述（把“注入”从“文本像指令”改成“来源越权”）。第二，它的 90 个验证案例是可直接复用的评估素材，且攻击目标覆盖决策的六个环节，比只测任务重定向的基准更贴近真实 agent 的失效模式；ChainBind 若要补一个“决策篡改”评估臂，这套案例是现成的起点。第三，“工具策略防御 15.4% 对无防御 17.0%”这个数字值得在讨论节引用：它说明只限制“调哪个工具”、不限制“决策值从哪来”的防线几乎无效——这正是我们主张“授权绑定到执行（而非调用名）”的经验证据。诚实标注：90 个案例、三个环境、五个 LLM 的规模不算大，且“检测并删除”防御在观测/状态类攻击上仍有 9.5%/12.1% 的残余，说明该基准测出的更多是“现有防御的盲区”而非“某防御已解决此问题”。", "source": "arXiv", "citations": "尚未收录", "code": "github.com/amazon-science/task-tampering-prompt-injection (★0)", "zh_abs": "现有的间接提示注入基准大多只测“植入指令把 agent 引向攻击者指定的任务”。但攻击者控制的内容也可以篡改正在进行的任务的结果——例如买家纠纷证据引用一条虚假退款政策，在不改变任务的前提下抬高退款。本文按权限而非指令措辞来定义间接提示注入：当植入内容试图影响一个其来源无权决定的决策时，即构成攻击。作者据此建了一个让这条边界显式的基准：90 个验证案例、横跨三个工具使用环境，每个案例里用户请求都指明哪个来源有权裁决被针对的决策；每次攻击篡改的都是良性任务本身需要的决策，而非替换任务。每个案例的攻击针对 agent 决策的至多六个环节：目标、决策规则、可用动作、预期后果、对观测的解读、对当前状态的信念。无防御时，针对决策规则、可用动作与状态三类目标的攻击，在五个 LLM 上的平均成功率高于针对目标本身的攻击；检测并删除类防御能把目标类攻击压到 2.4%，但观测类与状态类攻击仍有 9.5% 与 12.1%，且在针对检测优化的重写下差距依旧；工具策略防御仍有 15.4% 的攻击成功率，接近无防御的 17.0%——因为这类攻击通常保留预期工具、只操纵执行中得到的值。因此，只测任务重定向或只针对 agent 目标的评估，会高估这些防御的覆盖范围。", "supplement": false}, {"title": "SecureGARD: Dynamic Ontology-Guided Governance for Secure Tool-Using LLM Agents", "authors": "Guoqin Xiong 等", "url": "https://arxiv.org/abs/2611.06682", "category": "arXiv 预印本（arXiv:2611.06682，cs.LG）", "cats": ["cs.LG"], "oneliner": "用可执行本体给工具调用做确定性裁决：就绪 / 等待 / 禁止三态，三个基准上间接提示注入攻击成功率 0%，且受攻击时效用反而高于基线。", "insight": "这篇与 SPILLWAY 形成一对有价值的对照：两者都把“模型临场决定”换成确定性判定，但 SecureGARD 用可执行本体 + 情节任务状态，SPILLWAY 用类型化返回值——一个重语义建模、一个重来源判定。它的“等待（义务未满足但可恢复）”三态裁决比二值允许/拒绝更贴近真实 agent 工作流，可作我们执行语义一节的对照：我们的 all-of 拒绝与 retrieve-then-project 之间，也可以考虑一个“义务未满足时挂起而非直接拒绝”的中间态。值得注意的是它在 AgentDyn 上也测了 0% ASR——而 AgentDyn 的作者自己说“现有防御要么不够安全、要么过度防御”，SecureGARD 称效用反而更高，这个张力值得细读原文的方法一节再决定是否引用。诚实标注：0% 是在三个作者选用的基准上的结果；本体需离线从已验证执行中演化，冷启动成本与跨工具泛化能力未量化；且“等待”态依赖“义务”能被本体显式表达，对开放式任务这一前提可能不成立。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "工具调用型大模型 agent 把模型输出翻译成有后果的动作，使间接提示注入成为执行安全问题。现有防御约束工具调用、轨迹或信息流，但常把动作语义、状态依赖与证据关系留在隐式层面，难以跨异构工具泛化、也难安全更新。本文提出 SecureGARD，一个动态本体引导的治理框架：把异构调用 grounding 到共享语义表示上，结合可执行本体与情节级任务状态，推导出确定性的就绪、等待与禁止三类裁决；“等待”表示某项可恢复的义务尚未满足，允许有界重规划而不扩大 agent 的授权边界。本体离线演化：离线 LLM 从已验证的训练执行中提出与实例无关的动作–状态公理，只有在能解决训练失败暴露的本体错误、保持逻辑一致性与受保护蕴含、并通过留出验证后才会被接受、本体随之冻结。在 AgentDojo、ASB 与 AgentDyn 三个基准的良性与间接提示注入设定下，SecureGARD 在三者上均取得 0% 攻击成功率，且受攻击时的任务效用高于现有基线。结果表明，显式的语义治理可以在不牺牲效用的前提下强化执行安全。", "supplement": false}, {"title": "An Explainable Graph Attention Network for Indirect Prompt Injection Detection in RAG Systems", "authors": "V. Rudrani 等", "url": "https://doi.org/10.22214/ijraset.2026.85566", "category": "期刊论文（International Journal for Research in Applied Science and Engineering Technology，2026）", "cats": [], "oneliner": "在检索内容进 LLM 之前用图注意力网络先检一遍：自采 1 万条样本上准确率 99.80%，但数据集未公开、未独立验证。", "insight": "关联较弱，但有一点方向可取：它把检测点放在“检索内容进入 LLM 之前”，与我们“授权判定在检索结果进上下文之前由架构保证”的立场方向一致——都是“进上下文之前先设关口”。除此之外不宜多引：IJRASET 为低门槛期刊，数据集为自采的金融/公司政策文档（未公开、未独立验证），99.80% 的数字是在自采数据上取得的，不宜引用为方法有效性的证据；且它只做“有害/良性”二分类，不区分“谁有权决定什么”，与我们的授权框架不在同一层。最多在 related work 里提一句“GAT 检测是另一条技术路线”，不进入核心论证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "RAG 让大模型用外部文档回答问题，但检索到的内容可能藏有操纵模型行为的隐蔽指令，即间接提示注入。本文提出一种基于图注意力网络（GAT）的检测方法：在文档进入语言模型之前识别有害指令。每篇文档按句切分，用冻结的 DeBERTa-v3-base 编码；按相邻句与余弦相似度高于 0.7 的句对建图；一个约 0.4M 可训练参数的两层 GAT 对文档做良性/恶意二分类。评估用从金融与公司政策文档中收集的 10000 条样本（训练 6400、验证 1600、测试 2000，两类均衡）；在输入特征上加校准高斯噪声后，测试准确率 99.80%、F1 0.998、Matthews 相关系数 0.996，准确率的 95% Wilson 置信区间为 99.49%–99.92%。关键词基线准确率为 87.93%，但 24.1% 的恶意样本不含其任何触发词。作者也承认，在未见数据上的表现仍需通过独立收集的实验进一步验证。", "supplement": false}, {"title": "A Governed Human–AI–Agent Workflow for Specialized Data and Data Engineering Agents: Authorization, Verification, and Provenance", "authors": "Héctor Poblete 等", "url": "https://doi.org/10.3390/electronics15215135", "category": "期刊论文（Electronics，MDPI，2026）", "cats": [], "oneliner": "人工监督下的数据工程 agent 治理工作流：九阶段 + 四份 prompt 合同，一次未验证的干预把 F1 提到 0.9077、却引入 49 个假阴性。", "insight": "关联较弱——它的“授权”是人工监督下的数据工程工作流治理（九阶段 + 四份 prompt 合同），不是 RAG/检索授权，与我们的 AU 框架不在同一层。但其中一个教训可作讨论节的旁证：“一次未验证的技术干预把 F1 从 0.8084 提到 0.9077、却引入 49 个假阴性”，说明任何“先执行、后验证”的 agent 工作流都需要一道“效果验证后才接受新持久状态”的关口——这与我们“授权判定在检索结果进上下文之前”的主张方向一致，只是它发生在数据写入侧。诚实标注：实验是合成学术数据的受控 Data Lakehouse 演示，方法论是设计科学研究（DSR）而非可复现的安全评估，引用价值有限；不要把它写成 agent 授权的实证证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "大模型 agent 越来越多地用于数据工程环境中分析数据、生成代码与执行操作，但技术上执行成功并不保证操作已获授权、结果正确可验证；当专业 agent 修改持久数据时，这会带来治理挑战。本文提出一个受治理的人–AI–agent 工作流，在人工监督下协调数据专家 agent 与数据工程 agent，明确规划、授权、执行、验证与溯源各自的责任。工作流用改编的设计科学研究方法开发，并在合成学术数据的受控 Data Lakehouse 实验中演示；通过分析记录在案的执行失败（重复执行、评估单位不一致、过早补救、跨数据质量规则的非预期影响），提炼治理需求与操作控制。最终产物包括九个阶段与四份基于 prompt 的合同：规划、执行、验证与精炼。一次初始干预把数据质量检测 F1 从 0.8084 提高到 0.9077，但引入了 49 个假阴性；随后一次经授权的精炼把 F1 提高到 0.9988，仅剩一个假阴性。结果说明，在接受新的持久数据状态之前，验证技术干预的效果至关重要。", "supplement": false}]}, {"date": "2026-11-06", "summary": "", "papers": [{"title": "Governed Retrieval Augmented Generation with Guardrails Role Based Access Control and Audit Logging", "authors": "Lohith Reddy Kalluru", "url": "https://doi.org/10.21275/sr261031123753", "category": "期刊论文（International Journal of Science and Research，2026-11-04）", "cats": [], "oneliner": "企业 RAG 的权限治理实测：只靠索引层过滤时，角色撤销后 99.5% 的查询仍会泄漏未授权上下文；加一道查询时权限复核后违规归零。", "insight": "这是今日与我们论文咬合最紧的一篇，因为它把我们主张的两个关键点都变成了可引用的数字。第一，**索引层过滤不等于授权**：99.5% 这个数字是“权限变了、索引没跟上”这一失效模式的直接证据，可与我们的“策略独立存放、查询时逐 AU 求值”并列——我们讲架构，它讲失效的量级。第二，**复核必须发生在查询时而非摄入时**：它的“当前权限复核”与我们的“查询时逐 AU 求值”是同一思想的不同实现，可在 related work 里互相印证。但必须诚实标注三点：其一，这是 SQLite FTS5 词法检索上的合成诊断，没有 LLM、没有真实语料，99.5% 不宜直接读成“生产 RAG 的泄漏率”；其二，venue 是 IJSR（低门槛期刊），同行评审分量有限，引用时应只引用其实验设计与数字、不引用其“治理框架”的宣称；其三，它只测了“角色/文档撤销”两类权限变化，未覆盖我们 T2/T3 的排序向量与全知识攻击面，不能用来支撑 embedding 通道部分的论证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业级 RAG 必须在保留源权限的同时控制不安全内容并留存审计证据。本文把带权限标签的摄入、授权感知检索、guardrails 与关联日志整合起来，在可复现的合成诊断中评估授权边界：5 种检索策略 × 8 次语料随机化，每次 750 篇文档、12 个主体、360 条查询、5 种策略条件，排序用 SQLite FTS5 精确词法排名，未评估任何语言模型或 Bedrock 部署。结果是：仅索引过滤时，角色撤销类查询平均 99.5%、文档撤销类 57.7% 会混入未授权上下文；加上一次“当前权限复核”后，测试条件下观测到的上下文违规为零；删掉 10% 私有索引元数据后授权召回为 92.1%；策略服务中断时所有受保护方法一律弃权。独立重算验证了保存的检索与策略决策。作者明确说明：这些结果只说明一种已知的“过期权限”失效模式及其缓解，不构成生产安全、生成答案安全或合规性结论。", "supplement": false}, {"title": "When Do Summaries Become Instructions? Unsupported Policy in LLM Agents' Self-Written Handoff Summaries", "authors": "Wenhui Chu", "url": "https://arxiv.org/abs/2611.06545", "category": "arXiv 预印本（arXiv:2611.06545，cs.CL）", "cats": ["cs.CL"], "oneliner": "长程 agent 压缩上下文时自己写出的交接摘要，会凭空编造出记录里不存在的权限与要求——无根据的授权占 0.1%–1.3%，且真能让继任者多做未授权动作。", "insight": "这篇把“授权”从静态策略表推进到了 agent 的**运行态记忆**，与我们的 T1 之外又开了一个新攻击面：**上下文压缩本身会制造授权**。我们的威胁模型假设“权限来自策略、执行来自工具调用”，但这篇证明，agent 在两次调用之间自己写出的摘要就能凭空多出一条授权（0.1%–1.3% 听着小，但“中性化虚假批准后未授权动作 24→7”说明它真会落地成越权行为），而且来源是 agent 自己的推理、不是外部注入——这比提示注入更难防，因为没有“不可信输入”可拦截。讨论节可借它写一句边界声明：我们的 AU 求值假设权限判定依据（策略、检索结果）是可信的，但如果 agent 的记忆/摘要本身就是权限的来源之一，则需要在“摘要进入上下文之前”也设一道关口（例如只允许结构化账本、不允许自然语言摘要携带权限断言）。诚实标注：1.2%/2.4% 与 0.1%/1.3% 是两个开源权重模型上的数字，闭源前沿模型未测；限制类句子的因果效应本身不显著（p=0.58），只有授权类句子的中性化有效果且为事后分析，引用时不要把“摘要导致越权”写成已确立的因果结论。", "source": "arXiv", "citations": "尚未收录", "code": "github.com/Chuw1/handoff-audit (★0)", "zh_abs": "长程 LLM agent 会把大部分历史压缩成摘要以继续任务。本文问：交接摘要是否会写出记录并不支持的权限或要求、这类句子是否会改变下一个实例（继任者）的行为、以及它们从何而来。实验用带 ground-truth 权限账本的合成工具使用任务，并用“同一快照重放”方法：把可疑句子替换成中性填充词后重跑继任者。两位 AI 评审员只读规则标记出的 held-out 摘要，确认两个开源权重模型的可读摘要里，无根据的限制占 1.2% 与 2.4%，无根据的授权占 0.1% 与 1.3%。对限制类句子，预先设定的重放检验不显著（p=0.58），后续检验发现脆弱效应（p=0.027）；而把虚假批准中性化后，未授权动作从 120 次 held-out 运行中的 24 次降到 7 次（事后分析；另一组为 48 次中的 17 次降到 11 次）。多数限制源于 agent 此前“某动作需要批准”的推理。预先设定的检验还发现，把系统提示词里的“有些动作需要批准”改成说明“要求从何而来”，可把无根据限制从开发集摘要的 5.0% 降到 1.8%、held-out 模板的 1.8% 降到 0.3%（均 p<10⁻⁹），而对账本真正要求的批准请求几乎没有影响。", "supplement": false}, {"title": "Securing Web Agents with the Compile-Then-Execute Paradigm", "authors": "Annabella Chow 等", "url": "https://arxiv.org/abs/2611.06039", "category": "arXiv 预印本（arXiv:2611.06039，cs.CR）", "cats": ["cs.CR"], "oneliner": "Web agent 的范式之争：先把用户请求编译成固定程序再执行，不让规划模型在运行时看网页内容——WASP 上攻击成功率 0%，WebArena 效用反而更高。", "insight": "这篇的价值在于它给出了一个**与“运行时授权绑定”同构、但发生在另一层的解决方案**，可作我们执行语义一节的强对照。我们的思路是“执行时逐 AU 求值、未知默认拒绝”，Baya 的思路是“执行前把任务编译成固定程序、运行时不允许合成新操作”——两者都把“模型在运行时临场决定能做什么”这个自由度收走了，只是一个收在授权判定上、一个收在控制流结构上。它的 0% ASR + 77.8% 效用（高于两个 ReAct 基线）这个组合值得在讨论节引用：它说明“收紧自由度”不必然以效用为代价，至少在 WebArena 这类任务上，提前编译反而帮模型避开了注入的干扰。但需诚实标注：0% 是在 WASP 这一作者选用的安全基准上的结果，且 Baya 依赖一个“Trusted Website API”——即网站动作空间必须事先被可信地抽象出来，这在开放网络上是一个很强的前提；我们的 AU 求值不依赖这种前提，两者的适用条件不同，引用时应写清 Baya 的前提、不要把它写成“通用解法”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Web agent 通常遵循 ReAct 范式，每一步动作都从混合了可信与不可信内容的运行时观测中选出，这种设计使控制流容易被嵌在网页里的提示注入劫持。本文提出 Baya：一个“编译后执行”的 web agent，设计上防止提示注入驱动的控制流劫持。在访问真实网站之前，Baya 先把用户请求编译成调用 Trusted Website API 的可执行 Python 程序；规划模型不观测真实网页内容，只有编译好的程序处理网页内容。不可信数据可以决定程序的取值、或在编译时已定义好的分支中选择，但不能重新定义用户任务，也不能让模型在运行时合成新的网站操作。Trusted Website API 给编译器一个统一的网站动作空间视图，从而可以提前规划，无需反应式 agent 那种逐步动作发现。在 581 个有效的 WebArena Verified 任务上，Baya 的总体效用为 77.8%，高于纯浏览器 ReAct（55.1%）与 API 版 ReAct（66.7%）；在 web agent 安全基准 WASP 上，Baya 的攻击成功率为 0%，而 API 版 ReAct 为 16.2%、纯浏览器 ReAct 为 25.5%。", "supplement": false}, {"title": "Read-Only Protection in MCP Database Servers: Classifier Blind Spots and Defense-in-Depth", "authors": "Shiqiang Chen", "url": "https://doi.org/10.5281/zenodo.23927631", "category": "预印本（Zenodo，2026-11-03）", "cats": [], "oneliner": "MCP 数据库服务器的“只读”承诺有多脆：分类器把 `SELECT * INTO` 误判为 SELECT，一个 77 星仓库因此存在可利用的授权缺陷；执行层只读能把它变成无害。", "insight": "这篇与我们论文的咬合点非常具体：**“只读”不是一个声明，而是一个必须在执行层兑现的授权语义**——这正是 RU/AU 解耦里“策略独立存放、执行时求值”要解决的问题在 MCP 世界的翻版。它的 L1/L2/L3 三层模型可直接借用到我们的讨论节：L1（语句分类）对应“按文本/启发式判断权限”，L2（角色授权）对应“策略表”，L3（执行层只读）对应“执行时强制”；而 `SELECT * INTO` 这个例子说明，只做到 L1/L2 而缺 L3 时，一个分类器的盲点就能让整个授权承诺失效——与我们“未知 AU 默认拒绝”要防的正是同一类“判定层与执行层脱节”。第二，它的“事务语义陷阱”（未提交写入会被回滚）提醒我们：评估授权机制时要小心“看似成功实则未落地”的假阳性，这对我们自己设计评估实验有方法论价值。诚实标注：这是 Zenodo 预印本（非同行评审），只审计了 6 个服务器、1 个可利用缺陷，77 星仓库的个案不宜读成“MCP 只读普遍不可信”；且检测器仓库链接未在摘要中给出，引用其工具前需先核实链接。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（文中称 11 模式检测器已开源，但未给出仓库链接）", "zh_abs": "模型上下文协议（MCP）服务器已被 30 多个 AI 助手采用，用于把 LLM 接到外部数据；其中宣称只读角色的数据库服务器最为安全敏感，因为一次绕过就会把 AI agent 变成数据库写入者。已有工作罗列了 MCP 生态的漏洞，但没有度量“只读”具体怎么实现、也没有解释为什么两个实现面对同一个盲点会有不同结局。本文定义了只读保护的三层模型（L1 语句分类、L2 基于角色的授权、L3 执行层只读强制），审计了 6 个面向数据库的 MCP 服务器，并用真实 PostgreSQL 16.15 的运行时差分实验与一个自研的 11 模式静态检测器逐层度量。结果：确认了一个可利用的授权缺陷（CWE-863/281，77 星仓库），其中 `SELECT * INTO` 被 sqlparse.get_type() 分类为 SELECT，使写入角色得以建表；同时证明纵深防御（L3 的 conn.read_only=True）能让同一盲点在第二个服务器上无害，而第三个服务器用递归关键词扫描（含 INTO）直接拒绝。检测器经过 6 轮迭代（v4–v7d），在 4 个被审计仓库上把误报从 40 条降到 0 条且召回无损。作者提供了 L1/L2/L3 模型、可复现的度量协议（包括“未提交写入会被事务语义回滚”这一陷阱）与一个保持精确率与召回率的开放 11 模式检测器。", "supplement": false}, {"title": "A.S.E 2.0: Understanding How Repository Context Impacts the Security of LLM-Generated Code", "authors": "Jiongchi Yu 等", "url": "https://arxiv.org/abs/2611.06294", "category": "arXiv 预印本（arXiv:2611.06294，cs.CR / cs.AI / cs.SE）", "cats": ["cs.CR", "cs.AI", "cs.SE"], "oneliner": "给 LLM 生成代码时喂什么上下文，决定它看不看得到项目的安全防线：少一个 safeguard，安全通过率最多掉 8.1 个百分点；多一个不安全示例，可利用代码增加 6.3 个百分点。", "insight": "关联较弱，但有一条可借鉴的方法论启示：**“模型有没有看到防线”本身就是一个需要度量的变量**。我们的 RAG 授权讨论默认“策略在场、模型按策略行事”，而这篇证明，即使防线就写在仓库里，agent 也只有 27%–36% 的轨迹真正看到了它——换到 RAG 场景就是：即使 AU 策略已正确下发，模型也可能因为上下文构造方式而“看不见”它。这支持我们在讨论节补一句诚实的边界：授权机制的有效性不仅取决于策略是否正确，还取决于策略信息是否以模型实际会注意到的形式出现在上下文里；“策略独立存放”之后，还需要一个“策略可见性”的评估维度。CASE-Bench 的“逐个编辑上下文元素”这一对照方法也可借鉴到我们自己的消融实验设计里。但需说明：这篇讲的是代码生成而非 RAG 授权，8.1pp、6.3pp 等数字不能直接迁移到我们的场景，引用时只能引用其方法论启示，不能引用其数字作为我们领域的证据。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "LLM 编码助手与 agent 在生成代码前会先构造仓库上下文；对安全敏感代码而言，这个上下文决定了模型能否看到项目的安全防线（如授权检查）、还是只看到可模仿的不安全代码。但上下文构造几乎只为功能正确性设计，而安全代码基准又把上下文当作固定量，因此仓库上下文如何影响生成代码的安全性一直不清楚。本文构建 CASE-Bench：145 个仓库级任务，来自 51 个项目的真实 CVE，每个任务都在 Docker 中运行，配有功能测试与双向验证的概念验证漏洞利用，并标注了仓库中强化或削弱安全的代码。用 CASE-Bench 对比 13 种上下文构造方法与 6 种控制手段、6 个 LLM，并逐个编辑上下文元素、分析编码 agent 的轨迹，发现：（1）面向功能的上下文最多把功能通过率提高 8.2 个百分点，但安全通过率最多只提高 3.7 个百分点；（2）拿掉一个 safeguard 会让安全通过率最多下降 8.1 个百分点，而插入一个不安全示例会让“功能正确但可利用”的代码增加 6.3 个百分点；（3）编码 agent 只有在 27%–36% 的轨迹里真正观察到了相关的 safeguard。这些发现可指导安全感知的上下文构造与安全代码评估。", "supplement": false}, {"title": "Privacy-Preserving Retrieval from Redacted Corpora: Effects of Retrieval Paradigm and Relevance Definition", "authors": "Yoshiyuki Sakamaki 等", "url": "https://doi.org/10.1007/978-3-032-37676-3_10", "category": "会议论文（ECML PKDD 2026，Lecture Notes in Computer Science, vol 16947）", "cats": [], "oneliner": "RAG 语料先脱敏再检索，代价有多大取决于检索范式：BM25 在脱敏下保持稳健，稠密检索与 ColBERT 则出现有统计支撑的退化。", "insight": "这篇与我们论文的咬合点在“裁剪/脱敏之后检索还剩多少用”这一问题上，可与我们的 retrieve-then-project 执行语义直接对照。我们的裁剪是按 AU 做的（未授权片段不进上下文），它做的是按 PII 做的（敏感实体先脱敏再检索），但两者面临同一个权衡：**保护越彻底，检索信号损失越大**。它的关键发现是这种损失不是均匀的——BM25 稳健、稠密检索退化——这对我们有两点启示：第一，我们评估裁剪语义时也应分检索范式报告效用损失，不能只报一个总体数字；第二，它提示“脱敏”与“授权过滤”在工程上可以互补（先按 AU 过滤、再对剩余内容脱敏），但两者叠加的效用损失需要单独度量，不能默认可加。诚实标注：这是 ECML PKDD 2026 的会议论文（LNCS），实验基于 Text Anonymization Benchmark 这一单一基准，结论外推到真实企业语料时需谨慎；且“完全脱敏有时优于保留类型脱敏”等结论是特定设定下的数值比较，不宜读成通用建议。另注：本篇昨日曾因抓取档未给出摘要而暂缓，今日已从 Springer 原文核实摘要后补报。", "source": "SemanticScholar", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "RAG 依赖从外部语料检索相关证据，但许多部署必须检索含有个人身份信息（PII）的来源；文本脱敏是常见防护，却可能抹掉检索线索、损害 top-k 检索质量，进而影响下游生成。本文对脱敏语料检索做了受控实证研究，比较三种变换：保留类型的脱敏、完全脱敏、PII 语义替换（把每个 PII 提及换成上下文感知的描述）。作者用 Text Anonymization Benchmark 构建引用式与违规式两种检索的相关性判断，对比 BM25、稠密检索、ColBERT 与一个纯描述对照，并设匹配的随机对照。结果同时取决于检索范式与相关性定义：引用检索中 BM25 在脱敏下保持稳健，而稠密检索与 ColBERT 出现有统计支撑的退化；违规检索在放宽的相关性阈值下，脱敏版 BM25 数值上优于未脱敏版，但多重比较校正后不再成立；跨两种设定，完全脱敏有时在神经检索上优于保留类型脱敏，而语义替换没有显示出比简单脱敏更清晰、有统计支撑的优势；纯描述对照优于匹配的随机对照，说明语义描述确实携带可用信号，但作为全文上下文的补充比作为独立检索表示更有效。总体上，脱敏语料检索仍可行，但其效果强烈依赖于检索范式与相关性定义。", "supplement": false}, {"title": "Prompt injection of OpenAI custom GPTs leaks informatics secrets.", "authors": "Van Q. Truong, Marylyn D. Ritchie", "url": "https://www.semanticscholar.org/paper/319bd8a3e3c67d45668c24942c3983115fa4f112", "category": "会议论文（AMIA Joint Summits on Translational Science 2026）", "cats": [], "oneliner": "医疗信息学场景的定制 GPT 全面失守：提示注入可泄漏系统指令、完整知识库文件与专有 API 细节。", "insight": "关联较弱但场景值得注意：这是今日唯一一篇把提示注入落到**医疗健康数据**上的论文，而 health data access 正是我们的关键词之一。它提示了一个我们威胁模型尚未明说的前提：当 RAG 的知识库本身就是敏感资产（患者数据、临床记录）时，泄漏的损失不仅是“未授权片段进了上下文”，还包括系统指令与 API 细节这类“元信息”——我们的 T1/T2/T3 目前按攻击者“能看到什么”分层，可以补一句：同一层攻击在医疗场景下的损失权重更高，因为被泄漏的不仅是答案、还有知识库文件本身。但必须诚实标注：本条目没有完整摘要，上述内容仅据 TLDR 转述，未核实测试规模与方法，不宜在论文里直接引用其结论；如需引用，应先读全文。", "source": "SemanticScholar", "citations": "Semantic Scholar 1 次", "code": "无", "zh_abs": "来源记录未提供完整摘要，仅提供 TLDR 式结论：测试的定制 GPT（cGPT）全部存在严重漏洞，可导致私有系统指令、完整知识库文件与专有 API 细节泄漏；这种系统性失效带来严重的安全与隐私风险，尤其是在处理敏感患者数据、临床记录或专有基础科学资产时。以上内容据 Semantic Scholar 页面 TLDR 转述，非论文摘要原文，细节（如测试数量、注入手法、成功率）需读全文核实。", "supplement": false}, {"title": "Data-Centric Security for Generative AI Systems: Protecting Sensitive Data against Leakage, Inference Attacks, and Unauthorized Model Access", "authors": "Santosh Kumar Jadala", "url": "https://doi.org/10.67228/30715717/ijdeic-v9i3p101", "category": "期刊论文（International Journal of Data Engineering and Intelligent Computing）", "cats": [], "oneliner": "生成式 AI 全生命周期的以数据为中心的安全综述：把控制绑定在敏感数据本身上，而不是绑定在它当前所处的位置。", "insight": "关联较弱。这是一篇综述性文章，没有新实验、新数据或新机制，其价值仅在于提供了一个“以数据为中心”的叙事框架——“控制跟着数据走、而不是跟着位置走”——与我们的 RU/AU 解耦在口号层面相通（我们的 AU 本质上也是把授权绑定在数据单元而非检索路径上）。但它没有给出任何可引用的数字、基准或威胁模型，related work 里如需引用，只能引用其“全生命周期攻击面”的罗列作为背景，不能引用任何有效性结论。另需诚实标注：venue 为低门槛期刊（IJDEIC），引用权重低；且“框架”本身未经实证检验，不宜与经过实验验证的工作并列引用。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "生成式 AI 在企业与公共部门的应用日益广泛，也带来了保护敏感数据的重大关切：生成式 AI 系统在训练、微调、检索、推理与输出各阶段处理大量信息，处处都可能发生未授权披露与滥用。本文以“以数据为中心的安全”为视角，研究如何保护敏感信息免受数据泄漏、成员推断、模型反演、基于提示的攻击、检索相关暴露、模型提取与对 AI 服务的未授权访问。文章回顾了生成式 AI 全生命周期中的主要攻击面，并评估了数据分类、最小化、加密、隐私保护学习、身份与访问管理、安全 RAG、输出过滤、数据丢失防护与持续监控等控制措施。在此基础上提出一个以数据为中心的安全框架，把数据敏感度、访问策略、模型控制与治理要求贯穿 AI 全生命周期；框架强调安全控制应始终绑定在敏感信息本身上，而不论数据被存储、处理、检索或生成于何处，并为希望在保持可控、可问责使用的同时降低隐私与保密风险的组织提供实践指导。", "supplement": false}, {"title": "Isolated Artificial Intelligence (IAI): A Privacy Preserving, Offline, Policy-Governed Architecture for Enterprise Knowledge Retrieval and Decision Support", "authors": "Rana Zahid Rana Muhammad Zahid Latif", "url": "https://doi.org/10.5281/zenodo.23960111", "category": "概念论文 / 预印本（Zenodo，2026-11-04）", "cats": [], "oneliner": "离线、隔离、策略治理的企业 RAG 架构设想：本地 embedding、本地模型、身份感知授权——但全部是设计主张，尚无实现与验证。", "insight": "关联较弱。这篇的思路与我们有表面相似处（身份感知授权、部门级访问边界、本地部署），但它明确声明自己只是一份设计提案、没有任何实现与验证，且发表在 Zenodo 预印本上，因此**不能作为证据引用**，最多在 related work 里用一句话提及“离线隔离部署是业界对 RAG 授权的一种朴素应对”，并随即指出其未经验证。真正值得注意的反而是它的反面：它把“本地化”等同于“安全”的隐含假设，正好衬托我们论文的立场——授权必须由架构保证（策略求值），而不是由部署位置保证（离线了就默认安全）。引用时应写清其概念论文性质，不宜把它与经过实验验证的工作并列。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "这是一篇概念论文，提出 Isolated Artificial Intelligence（IAI）：一个模块化的企业架构，用于在受控的本地或物理隔离环境中做检索增强问答与运营知识辅助。IAI 结合异构数据摄入、本地 embedding 与检索、本地语言模型、身份感知授权、证据关联的回答与 AI 管理控制。作者认为研究问题不在于本地语言模型是否存在，而在于如何把它们整合成一个可重复、领域无关的系统，使其能执行部门级访问边界、处理技术图纸与结构化运营记录，并展示可度量的隐私、检索质量、可靠性与资源效率。本文定义了拟议的设计、需求、威胁模型、实验方法与可证伪的评估标准；实现、性能与安全主张目前仍是待独立检验的假设。", "supplement": false}]}], "total": 46, "n_days": 7, "all_total": 218, "all_days": 44};

odel training lifecycle? \n\nWe emerged with unsurprising but sobering findings: as we scale toward more intelligent systems, models are becoming harder to monitor through their CoT. 🧵", "created_at": "11-12 02:17", "likes": 814, "reposts": 117, "replies": 69, "views": 89309, "url": "https://x.com/jeffreygwang/status/2120581630196879460", "author": "jeffreygwang"}, {"id": "2120216596753121411", "text": "Use Business Hub to shape what customers see about your business in ChatGPT.\n\nOnce verified, you can create a Business Agent, update your business details, and add product feeds with current pricing and availability.\n\nYou can also see aggregated insights on mentions, website clicks, and common topics in conversations where your business is cited.\n\nWe don’t share people’s conversations or Business Agent chats with businesses.\n\nEligible businesses located wherever ChatGPT is available can get started by claiming their business in Business Hub.\n\nhttps://openai.com/business/businesses-in-chatgpt/", "created_at": "11-11 02:06", "likes": 564, "reposts": 25, "replies": 26, "views": 182364, "url": "https://x.com/OpenAI/status/2120216596753121411", "author": "OpenAI"}, {"id": "2120216594244849690", "text": "You can also publish a Business Agent to help people explore what you offer.\n\nCustomers can ask questions, compare products, and find what fits their needs using information you provide from your business—all in a clearly labeled conversation, separate from ChatGPT’s independent answers.\n\nAvailable to eligible ecommerce and online service businesses in the U.S.", "created_at": "11-11 02:06", "likes": 921, "reposts": 34, "replies": 50, "views": 306034, "url": "https://x.com/OpenAI/status/2120216594244849690", "author": "OpenAI"}, {"id": "2120216592395174382", "text": "Now in beta: Businesses in ChatGPT.\n\nClaim your business, manage your information, and get insights on how people engage with you.\n\nEligible businesses can also build a Business Agent to answer customers’ questions and help them explore what you offer.\n\nhttps://openai.com/index/introducing-businesses-chatgpt/", "created_at": "11-11 02:06", "likes": 17056, "reposts": 1357, "replies": 1254, "views": 5258993, "url": "https://x.com/OpenAI/status/2120216592395174382", "author": "OpenAI"}, {"id": "2120202353907486826", "text": "We're turning our lessons from defending OpenAI into practical tools for our customers. On Thursday, join us at Cyber at the Frontier, a live keynote, for our latest cyber announcements.\n\nWorking with our frontier models, we've identified and resolved important vulnerabilities in our own code and infrastructure. That experience is informing the tools and playbooks we're building to help other security teams strengthen their defenses.\n\n@gdb shares what we've learned and why security teams should keep putting the latest models to work as capabilities improve.\n\nTune in on November 12 at 10 a.m. PT: https://openai.com/cyber-at-the-frontier/", "created_at": "11-11 01:10", "likes": 2130, "reposts": 147, "replies": 457, "views": 390067, "url": "https://x.com/OpenAI/status/2120202353907486826", "author": "OpenAI"}, {"id": "2119913172039868579", "text": "We built Control Room, a central system to track model workloads across our research infrastructure and stop them quickly when safety or security concerns arise.\n\nIt connects every research inference workload, including agentic sampling for model training and evaluation, data processing, and more. This works together with our misalignment monitoring systems, and halts model output within 35 seconds of a decision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://openai.com/index/control-room/", "created_at": "11-10 06:01", "likes": 4831, "reposts": 366, "replies": 808, "views": 936988, "url": "https://x.com/OpenAI/status/2119913172039868579", "author": "OpenAI"}, {"id": "21198831767
