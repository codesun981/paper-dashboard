<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月29日 星期四</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-10-29", "summary": "", "papers": [{"title": "Heads of Security: Learned Attention Gates Improve Prompt Injection Robustness", "authors": "Igor Shilov 等", "url": "http://arxiv.org/abs/2610.37657v1", "category": "arXiv cs.LG / cs.CL / cs.CR（2026-10-27）", "cats": ["cs.LG", "cs.CL", "cs.CR"], "oneliner": "用少量可学习的逐头注意力门强制指令—数据分离：模型可以推理不可信内容，但不跟随其中夹带的指令。", "insight": "这是今天机制上最值得引用的防御对照。第一，它与我们的立场互补而非重叠：我们是在检索与执行层用 AU 求值决定“什么可见、什么可执行”，HoS 是在模型内部用注意力门决定“什么可被当作指令”——两者一个在系统边界、一个在模型内部，合起来正好构成纵深防御的两个层次，related work 里可以这样分层写，避免把“注意力门”与“授权求值”混为一类。第二，它给出了一个可借鉴的评测口径：不仅报告静态基准，还报告自适应攻击的成本倍数（3 倍 FLOPs）与工具效用底线（ASIDE 的 10% 是反面教材），我们的防御评测若只报静态攻击成功率，会低估自适应对手；至少应在讨论里说明自适应攻击成本未测。第三，限定要写清：HoS 的“分离”是学习到的门控，不是确定性保证——门可以被更强的自适应攻击磨穿（只是更贵），而我们的 AU 求值追求的是策略层面的确定性拒绝；引用时不能把 10% 写成“已解决注入问题”，只能写成“架构级分离把攻击成本抬高了数倍”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "HoS 为每个注意力头学习一组门，控制其在可信 token 与不可信 token 之间的注意力再分配，从而在架构层面实现指令与数据的分离。在 Llama-3.3-70B-Instruct 与 GPT-OSS-20B 上的评测中，黑盒 RL-Hammer 攻击对 GPT-OSS-20B 的成功率为 97%、对微调防御 SecAlign++ 为 85%，对 HoS 仅为 10%；经针对性强化的白盒 Claudini 攻击要在 HoS 上达到同样成功率，需要 3 倍 FLOPs。效用方面，HoS 在标准多选题与多种提示设置下保持基线水平，而 SecAlign 与 ASIDE 在 few-shot 下退化；静态攻击的 agent 基准上 HoS 与 SecAlign 相当，但 ASIDE 的工具调用效用仅 10%。", "supplement": false}, {"title": "Constraining the Commit Boundary: A DIO/ODI-Informed Authorization Guardrail for Agentic Entity Resolution", "authors": "Daniel Beránek", "url": "http://arxiv.org/abs/2610.37407v1", "category": "arXiv cs.AI / cs.CR / cs.DB（2026-10-27）", "cats": ["cs.AI", "cs.CR", "cs.DB"], "oneliner": "为 agent 实体解析划一条提交边界：能用来推理的证据，不等于能用来授权一次持久身份变更的证据。", "insight": "概念上与我们的 RU/AU 解耦几乎同构，值得作为“独立提出同一原则”的佐证引用。第一，它的“推理证据 vs 授权证据”二分，正是我们 M(r) 覆盖映射 + 逐 AU 求值的另一种表述：可见 ≠ 可用，可用 ≠ 可提交；我们在论文中可以用它来说明，这一区分不是我们的孤例，而是 agent 授权里正在收敛的共识。第二，它的“提交时版本有效性”与“逐命题支撑”两条，补了我们讨论里较弱的一环：我们谈了逐 AU 求值，但对“求值后、执行前状态变了怎么办”着墨不多，这篇把“提交时刻再校验版本与范围”写成了必要条件，可借鉴为执行语义的一条完整性要求。第三，必须诚实标注其分量：无实现、无数据，引用价值在原则与术语（commit boundary、UNVERIFIED 不授授权资格），不能当作“该方法有效”的证据；且其 DIO/ODI 本体论包装较重，引用时应剥离包装、只取边界原则，避免把我们的论文拖进本体论讨论。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Agentic 实体解析系统会循环规划、取证、修正假设并提出图变更，错误的身份假设还可能污染后续取证、制造自我印证。本文提出 DIO/ODI 启发的授权边界：领域治理的约束绑定函数把重建失败的区分映射为显式身份保持约束；抽象的两阶段监管器只在以下条件同时满足时才放行提交——每条必需命题都有“授权合格”的逐命题证据支撑、相关冲突已解决、操作在授权范围内、相关状态与策略版本在提交时仍有效；以 UNVERIFIED 准入只允许探索性推理，不授予授权资格；证据不足或存在实质冲突时一律推迟。作者明确声明：这是概念架构，无实现、无实测验证，不是对语义正确性的定理，也不阻止错误假设本身或假设条件化的取证。", "supplement": false}, {"title": "Policy-as-Code Governance for Agentic Enterprise Workflows", "authors": "Girish Rajagopalan Sesha", "url": "https://doi.org/10.5281/zenodo.23657643", "category": "Zenodo（2026-10-26）", "cats": [], "oneliner": "把“批准”写成可执行的契约：批准必须绑定规范动作、目标、参数、相关状态与软件版本，直到执行那一刻，且一次批准只能兑现一次。", "insight": "这是今天与我们“执行时授权绑定”主张最贴近的一篇，可直接用作 related work 里“批准—执行绑定”路线的代表。第一，它的五条不变量几乎可以逐条映射到我们的执行语义：规范动作 ≈ AU 粒度的授权对象，变化失效 ≈ 覆盖映射失效即拒绝，兑现时重查 ≈ 查询时逐 AU 求值而非事前一次性放行，单次消耗 ≈ 批准不可复用于变更后的动作——这种映射关系写进论文，能让读者一眼看出我们的贡献不是孤立的工程技巧，而是一组可检验契约的实例化。第二，它的并发演示（8 抢 1 只写 1 次）提醒我们一个评测缺口：我们的语义目前多谈单次求值，未明确“同一批准被并发/重放兑现”时的行为，至少应在威胁模型或局限里说明重放与并发兑现的处理。限定同样要写清：15 个场景是自编演示、非对抗评测，且载体是 Zenodo 存档而非同行评审 venue，引用时定位为“契约表述的参照”，而非“已被验证的系统”。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "本文针对企业 agent 工作流提出 approval-to-execution 契约，核心是五条显式承诺：批准指名一个规范动作；动作变化即失效匹配；兑现时重查当前权限、状态与版本；一次成功提交即消耗该批准；每次失败返回稳定、可操作的理由与补救，而不削弱授权。作者强调贡献是契约本身与运行不变量，而非新策略语言或交易授权的发明；Python + SQLite 演示通过了 15 个自编场景，其中 8 个并发兑现同一批准的尝试只产生一次模拟写入与一张回执。", "supplement": false}, {"title": "Penny for Your Prompts: A Measurement Study of Contextual Leakage in AI Chat Platforms", "authors": "Paschalis Bekos 等", "url": "http://arxiv.org/abs/2610.37467v1", "category": "arXiv cs.CR / cs.CY（2026-10-27）", "cats": ["cs.CR", "cs.CY"], "oneliner": "首次系统实测聊天平台的上下文泄露：42 个平台里，一半泄露对话标题、9 个原样泄露用户提示，邮箱外流还让对话能与身份挂钩。", "insight": "它把我们威胁模型里的一条暗线摆到了台面上：我们的 T1/T2/T3 按“对手能看到什么”分层，默认对手在系统内通过检索或排序通道窥探；这篇揭示的是**系统外的平台旁路**——用户以为只发给了聊天机器人，实际上标题、原文与邮箱经第三方脚本流向了追踪器。启迪有两层：第一，在论文的威胁模型讨论里，应明确划界——我们的 AU 机制管的是“系统内谁能看到哪段内容”，而平台侧第三方脚本泄露属于部署与前端治理问题，不在 AU 求值范围内，但两者叠加时风险会放大（已授权用户在前端的对话仍可能经追踪器外流），划界不清会被审稿人追问。第二，它提供了一个可引用的实测方法论参照：JS 引擎层归因把“谁触发、用什么 DOM 机制抓取”钉死，比只看网络包更能定责；我们若要论证“泄露通道不止 embedding 一条”，这篇的 21/42、9/42 就是现成的数字。限定：审计对象是 Web 界面实现，结论不宜外推到 API 调用或企业内网部署；且“大量平台发邮箱”未给精确计数，引用时只用有数字的两项。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "作者审计了 42 个通用与领域（医疗、法律、教育）聊天平台的 Web 界面，除常规网络拦截外，还在 JavaScript 引擎层插桩，把每条数据流精确归因到触发它的用户动作与 DOM 抓取机制——这是纯网络层分析看不到的粒度。结果：21 个平台向第三方追踪器泄露对话标题，9 个泄露逐字用户提示；此外还有大量平台向第三方发送用户邮箱，使对话上下文可与真实身份关联。作者指出，这类问题根植于用户与现代聊天机器人的交互方式本身，而非个别平台的实现失误。", "supplement": false}, {"title": "What Victims Take Away: Attack Reuse and Defense Revision after Prompt-Injection Attacks", "authors": "Zihan Chen 等", "url": "http://arxiv.org/abs/2610.36422v1", "category": "arXiv cs.CR / cs.HC（2026-10-27）", "cats": ["cs.CR", "cs.HC"], "oneliner": "攻击日志是双刃剑：用全部 56 万条 Tensor Trust 攻防记录证明，收到过的成功攻击会被受害者拿去再攻击别人，而同类攻击在受害者修补后成功率下降 24.5 个百分点。", "insight": "关联较弱，但对我们论文里“攻击披露与日志”一节有直接的警示价值，值得收为方法论注脚而非机制证据。第一，它揭示了一个我们目前没有讨论的披露困境：为了可复现、可审计而公开攻击样本，本身会扩散攻击能力——我们的论文若在附录或仓库里公开注入样本与防御绕过案例，应借鉴它的结论，至少讨论“技术描述 vs 全文披露”的分级策略，而不是默认全文公开就是负责任的。第二，它的“复用跟收益走、不跟表面像不像成功走”是一个可迁移的评估提醒：我们在评估防御时，若只看“攻击文本是否被模型复述/执行”，可能低估那些“看起来失败、实则已被学习”的传播效应；不过这一点在游戏场景里成立，迁移到企业 agent 部署时需谨慎，游戏玩家的攻击动机与企业内用户的行为模式不同。限定：数据源是游戏玩家行为，非真实企业攻防；23.2% 等数字是游戏内的统计，不宜当作真实世界的攻击复用率引用。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "攻击日志与红队报告会把攻击原文交给被攻击方以便修复，但提示注入本身就是纯文本，等于同时交出了一份可用的攻击副本。作者用 Tensor Trust 游戏的全部 563,349 条攻击记录，把每条被收到的攻击与同时期在相似玩家间流传、但未到达该目标的匹配攻击对照：被攻破防御的攻击在一周内被目标拿去攻击他人的比例为 10.0%，对照组仅 0.03%（调整后差异 8.8–10.0 个百分点）；“差点成功”（回复以 access granted 开头但判为失败）的复用率与失败攻击一样低，说明复用跟的是“是否得手”而非“回复看起来像不像成功”，符合按收益偏向的社会学习解释。被攻破后目标会修改防御，此后同族攻击对该目标的成功率相对其他防御者下降 24.5 个百分点；复用主要来自本来就在攻击的玩家，而非新人；所分析的成功劫持中有 23.2% 来自先前收到的文本。作者据此提出可检验的披露假设，如“只描述技术、不给全文”。", "supplement": false}, {"title": "Indirect Prompt Injection Attacks on LLM Agents and Defense Mechanisms", "authors": "Zijia Guo", "url": "https://doi.org/10.54254/2755-2721/2026.38107", "category": "Applied and Computational Engineering（2026-10-27）", "cats": [], "oneliner": "间接提示注入的系统综述：按攻击入口、劫持机制与危害三层分类攻击，按干预点把防御排成输入、处理、行为、训练、输出五层，并指出单层防御都有盲区。", "insight": "作为综述，它的价值在“定位图”而非新证据。第一，它的“单层防御必有盲区、至多 7.5 个百分点”这一判断，与我们“授权必须在执行层按 AU 求值、而非只在输入层过滤”的主张形成呼应：输入层过滤正是它五层中的一层，单靠它挡不住间接注入；我们在 related work 里引用它时，可以把它作为“为什么需要执行层授权”的一句支撑，但要注意它的 7.5 个百分点是综述层面的综合判断、非单次实验结果，引用时须标注为综述结论。第二，它的五层防御分类可作我们防御分层的对照表：我们的 RU/AU 机制横跨“处理（检索裁剪）+ 行为（执行授权）”两层，若能在论文里明确标出自己覆盖哪几层、哪几层留给互补机制，审稿人对“这篇到底防了什么”的疑问会少很多。限定：载体为会议论文集综述，非顶会 venue，分类的完备性未经独立验证，引用时定位为“分类参照”，不宜当作攻击有效性的原始证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "综述覆盖 LLM agent 间接提示注入的攻击、防御与评估三面：攻击侧建立入口路径（7 类）、劫持机制（5 类）与危害（5 类）的三层分类；防御侧按干预点组织为输入、处理、行为、训练、输出五层体系，并横向比较效果与部署成本；评估侧评述 BIPIA、InjecAgent 等代表性基准，提出攻击、防御、系统三维评估指标。核心结论是：现有防御对直接注入的稳健性提升明显，但对间接注入的提升至多 7.5 个百分点，且每个单层防御都有盲区，因此需要多层协同的纵深防御与统一评估框架。", "supplement": false}, {"title": "A Survey of Knowledge Extraction Attacks and Defenses in LLM Agent Ecosystems", "authors": "Fan Li 等", "url": "https://doi.org/10.20944/preprints202610.2538.v1", "category": "Preprints.org（2026-10-26）", "cats": [], "oneliner": "以“资产”为纲的 agent 知识抽取综述：训练资产、部署集成资产、运行时可复用资产三类，覆盖训练数据、模型、提示、RAG 系统、agent 记忆与技能。", "insight": "关联较弱，但分类框架对我们有借鉴价值。第一，它的资产分类把“RAG 系统、agent 记忆、技能”并列为可抽取资产，这与我们论文里“检索单元本身就是敏感资产”的视角一致：我们谈 embedding 泄露时，默认泄露对象是文档内容；这篇提醒我们，**记忆与技能也是可抽取的资产**，且抽取路径不一定经过检索——若我们的威胁模型只写文档泄露，审稿人可能追问记忆/技能抽取是否在 scope 内，至少应在讨论里划界。第二，它的“训练—部署—运行时”三分法可作我们相关工作组织的参照：我们的 AU 机制主要落在运行时授权，若能在 related work 里按此三分法标出各防御的位置，定位会更清晰。限定：Preprints 预印本、非同行评审，且摘要未给出任何量化结论，引用价值仅限分类框架，不能用来支撑任何攻击有效性或防御效果的数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "LLM agent 的开发与部署投入巨大，已成为有价值的知识产权资产，知识抽取攻击旨在无授权地恢复受保护知识或复制 agent 组件与功能，威胁知识产权与用户隐私。既有综述多聚焦模型抽取，或把信息泄露作为更广泛安全讨论的一部分，对 agent 生态内的知识抽取覆盖不足。本文提出资产导向的分类：训练资产、部署集成资产、运行时可复用资产，涵盖训练数据、LLM、提示、RAG 系统、agent 记忆与技能；对每一类系统梳理代表性攻击机制与对应防御，指出最新进展与未解挑战，目标是为更安全可信的 agent 提供全面认识。", "supplement": false}]}, {"date": "2026-10-28", "summary": "", "papers": [{"title": "CoSA: The Conflict of Skills Attack in Real-World LLM Agent Ecosystems", "authors": "Yujia Zheng 等", "url": "http://arxiv.org/abs/2610.35082v1", "category": "arXiv cs.CL / cs.AI / cs.CR（2026-10-26）", "cats": ["cs.CL", "cs.AI", "cs.CR"], "oneliner": "提出技能组合冲突（Conflict of Skills）：单技能各自合规、组合后却越权；并以 288 任务的 CoSA-Bench 实测这一失效，再用一个执行前检查信息流与授权的 harness 护栏把它压回去。", "insight": "这是今天对我们最直接的一篇，价值有三层。第一，它把我们 RU/AU 论文里\"逐 AU 求值\"的必要性从设计主张变成了可复现的反例：单体授权检查在组合下失效，不是因为某个 Skill 写坏了，而是因为**授权没有随制品/决策跨步骤传递**——这正是我们 M(r) 覆盖映射与\"批准依据绑定\"要解决的问题，可在论文中作为\"为什么不能只做单步检查\"的实证引用。第二，它的护栏设计与我们的执行语义高度可比：执行前检查信息流 + 授权 ≈ 我们的 retrieve-then-project / per-view 在执行层的对应物，且它给出了可用性代价（良性完成率仅 -1.67 个百分点），是我们论证\"安全不必以可用性崩盘为代价\"时可并列的数字。第三，它提醒我们一个威胁模型缺口：我们的 T1/T2/T3 按对手可见性分层，而 CoSA 的对手甚至不需要\"看见\"更多——只需往池子里加已准入的 Skill，组合本身就是攻击面；这提示我们在讨论\"组合语义\"时应明确：**AU 的组合规则（合取/传递/失效）本身需要形式化，缺了它，逐 AU 求值仍可能在组合处漏水**。限定：评测用的是公开 Skill 与受控服务，真实企业技能池的异构程度更高，23.43 个百分点的增幅不宜直接外推；且护栏只在 OpenClaw 招聘任务上验证，跨域泛化未证。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Agent Skills 让 LLM agent 复用现成能力，但逐个 Skill 单独检查无法排除组合后的策略违规：为某一目的产生的制品或评估信号，可能在下游被复用而不保留原有的限制或授权。作者以公开 Skill 的受控执行与单 Skill 对照，归纳出 CoS 的四种 recurring 机制；进而提出 CoSA 攻击——只向已有技能池中加入本地已准入的 Skill（不改动原有 Skill 与运行时权限），通过补齐缺失业务操作或重塑制品交换、决策复用、目标/动作绑定来触发违规。评测用真实 Skill 与受控服务搭建 CoSA-Bench（招聘、金融、IT、商业 4 域 288 任务，覆盖数据泄露、未授权状态修改、不安全执行），在 5 个 LLM × 3 个 harness 上，新增量控制在原池 5% 以内时策略违规率从 35.02% 升至 58.45%（+23.43 个百分点），轨迹分析把\"合规变违规\"的转移归因于涉及新增 Skill 的跨 Skill 依赖。最后的轻量 harness 护栏在执行前检查信息流与授权，在 OpenClaw 招聘任务上把违规率从 65.28% 降至 6.67%，而匹配良性对照的任务完成率仅从 66.67% 变为 65.00%。", "supplement": false}, {"title": "TrustJev: Separating Policy Authority from Untrusted Evidence in LLM-Based Decisions", "authors": "Zhiwei Xu 等", "url": "http://arxiv.org/abs/2610.34826v1", "category": "arXiv cs.AI（2026-10-26）", "cats": ["cs.AI"], "oneliner": "把\"策略权威\"与\"不可信证据\"分开：一个 Transformer 主干先从可信策略算出策略分数与修正预算，再把证据的修正幅度框在这个预算内，证据再怎么夹带指令也翻不了策略的盘。", "insight": "思路同构、实现分界清晰，引用时要同时写出这两面。同构的一面是\"策略权威独立于证据\"——策略分数与修正预算只从可信策略来，证据只能在预算内修正，这与我们\"策略独立存放、查询时逐 AU 求值、未知 AU 默认拒绝\"的架构哲学一致，可作 related work 里\"策略与证据分离\"路线的代表。分界的一面更重要：TrustJev 的\"权威\"是学习到的打分与预算，不是确定性策略求值——它的 95.77% 是统计意义上的稳健，不是\"策略被违反时一定拒绝\"的保证；而我们的 AU 求值追求的是确定性语义（策略说不就是不）。因此它不能用来论证我们的安全性，只能用来论证\"分离架构\"这一方向在决策模型里同样有效，且在需要容忍证据噪声的场景（如证据本身就是部分可信的业务数据）可作互补层。另有一个可借鉴的评测口径：Balance（攻击/非攻击调和平均）与\"每源全部攻击挡住率\"，比单点攻击成功率更能暴露\"偶尔漏一次就够\"的长尾风险，我们的评测在报告授权基准时可参考这种\"全挡住才算过\"的严苛口径。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "决策模型按自然语言输入从预定义动作中做选择，但供给事实的外部证据里可能藏有试图覆盖应用策略的指令。TrustJev 用\"受保护的策略打分 + 有界证据修正\"应对：单个 Transformer 主干从可信策略与候选项算出策略分数与修正预算，证据修正被预算框住；配对监督让模型在\"插入指令但事实不变\"时保持预测稳定、在\"编辑改变正确答案\"时跟随改变；权威监督则在策略本身无法定夺时容纳证据。0.6B 实现在认证、指令层级、可执行授权规则三类数据集上对 14 个基线取得最高平均 Balance（攻击与非攻击输入准确率的调和平均），每项超出最强基线 0.57–1.05 个百分点；在授权基准上，对固定攻击池中每源 32 次攻击全部答对的源占比达 95.77%（最强对照 80.98%），推理内存与中位延迟与基线相当，额外开销主要在训练侧。", "supplement": false}, {"title": "Scope-Gap Injection: Exploiting Evaluator Channel Blind Spots in the OpenClaw Agent Security Competition", "authors": "Weihang Niu 等", "url": "http://arxiv.org/abs/2610.34777v1", "category": "arXiv cs.AI / cs.CR（2026-10-26）", "cats": ["cs.AI", "cs.CR"], "oneliner": "多阶段安全评审的盲区攻击：评审只看任务指令与技能定义、不看附件，而 agent 执行时却会读附件——把目标标识、绕过参数与授权流程藏进附件写成的\"业务工作清单\"，就能让无害的表面任务在执行时触发权限绕过。", "insight": "这篇的价值不在攻击手法的新奇，而在它把\"范围不一致\"本身钉成了一个可命名的攻击面，这对我们有两处直接启示。第一，它与我们的 T1/T2/T3 分层形成镜像：我们按\"对手能看到什么\"分层，而 SGI 暴露的是\"评审能看到什么 vs agent 能碰到什么\"的不对称——任何只检查\"可见部分\"的安全机制（无论是 LLM 评审、静态扫描，还是检索后过滤），只要执行通道比检查通道宽，就必然存在 scope gap；这为我们\"授权必须在执行层、按 agent 实际可达的全部通道求值\"的主张提供了一个竞赛实证。第二，它与 CoSA 互补：CoSA 说\"组合会漏\"，SGI 说\"检查范围会漏\"，两者合起来说明**单点检查的失效不是偶然，而是结构性的**——我们的 per-view 索引（让 agent 根本看不到未授权视图）恰好是对这两类漏的共同回应：不是把检查做得更聪明，而是让不可达的在执行层就不存在。限定：结论来自一次竞赛的评审实现观察（\"S2 似乎不检查附件\"为作者推断，非官方确认），不宜推广为\"所有 LLM 评审都有此盲区\"；且 F = 0.385 的绝对分不算高，SGI 的意义在\"绕过三关\"的存在性而非得分。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "在 IJCAI 2026 OpenClaw Agent Security 攻击竞赛中，每个攻击包要过三关：静态技能扫描（S1）、对任务与技能定义的 LLM 评审安全检查（S2）、 live 执行审计（S3）。作者观察到一个范围缺口：S2 似乎只检查任务指令与技能定义、不检查附件内容，而 agent 在 S3 执行时却会读取附件。Scope-Gap Injection（SGI）正是利用这一点：让可见的任务与技能保持良性，把目标标识、绕过参数与授权流程移入附件（写成业务工作清单），S2 评审看到的是无害任务，agent 却按隐藏清单行事并触发权限绕过。实测中 SGI 对 19 个目标中的 5 个绕过了全部三关，单次最高分 F = 0.385；整个提交活动中，附件放置的 S2 通过率（78%）远高于技能内放置（23%）。作者最后给出防御方向：让评审范围与 agent 可达通道对齐。", "supplement": false}, {"title": "Then there is prompt injection, a malicious email, ...: The Wild Wide West of OpenClaw Agentic System Security", "authors": "Mostafijur Rahman Akhond 等", "url": "http://arxiv.org/abs/2610.35451v1", "category": "arXiv cs.CR / cs.SE（2026-10-26）", "cats": ["cs.CR", "cs.SE"], "oneliner": "OpenClaw 安全问题的田野调查：25K+ Reddit 帖子与 358 个安全标签 GitHub issue 里挖出 521 个 CWE 实例、59 类弱点，集中在访问控制失效、敏感数据暴露、注入与不安全执行——结论是这不是孤立 bug，而是整条 agent 执行管线信任边界的系统性缺失。", "insight": "关联较弱，但作为\"行业现状证据\"有引用价值，不宜作为机制证据。它的 521/59 数字与\"访问控制失效居首\"的分布，可以放在我们论文 motivation 一节，用来说明\"agent 执行管线的授权缺失不是理论风险，而是已在真实部署社区里成批出现\"——与我们 T1/T2/T3 的分层叙事互补：这篇给出的是\"问题有多普遍\"，我们给出的是\"问题在结构上为什么会发生、该怎么分层防\"。它的 7 类缓解策略（显式信任边界、最小权限、执行隔离、运行时监督、纵深防御）也可作对照：我们的 RU/AU 解耦与执行时绑定，恰好覆盖了其中\"信任边界\"与\"运行时监督\"两类，但用的是确定性授权语义而非最佳实践清单。需诚实标注限定：数据源是 Reddit 讨论与 GitHub issue（自我选择偏差大、非随机样本），CWE 映射是定性编码而非漏洞实测，数字不宜当作\"OpenClaw 漏洞率\"引用；且它是横断面调查，没有提出或验证新防御机制。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "OpenClaw 这类个人助理框架把 LLM 推理、持久记忆、工具调用、本地执行与 Web 工作流拼在一起，有用，但当不可信输入、模型推理、工具、记忆与部署配置在没有显式信任边界的情况下交互时就会产生安全风险。作者用两类互补数据源做实证：13 个 OpenClaw 相关 subreddit 的 25K+ 帖子中筛出 162 篇安全相关帖子（1,787 条评论），358 个安全标签 GitHub issue 中保留 180 个描述具体安全关切的 issue；经定性分析与证据锚定的 CWE 映射，得到 521 个 CWE 实例、59 类弱点，集中在访问控制失效、敏感数据暴露、注入与不安全执行；另从实践者建议中提炼 543 条缓解建议、归纳为 7 类 recurring 策略，并用虚拟密钥值做了一个敏感数据暴露路径的证据锚定示意重建。结论是 OpenClaw 的安全问题不是孤立实现 bug，而是 agent 执行管线信任边界的 recurring 失效；作者据此提出更安全 agentic 系统的含义：显式信任边界、最小权限工具访问、执行隔离、运行时监督与纵深防御部署。", "supplement": false}]}, {"date": "2026-10-27", "summary": "", "papers": [{"title": "Model Context Protocol and the Agent–Tool Ecosystem: A Systematic Survey of Standardizing AI Tool Integration", "authors": "Aref Mahmoudpour", "url": "https://doi.org/10.5281/zenodo.23617883", "category": "Zenodo（2026-10-24，未经同行评审）", "cats": [], "oneliner": "系统梳理 MCP（Anthropic 2024-11 提出、类比 LSP 的 agent–工具标准协议）的架构、三类 server 原语、传输与 OAuth 授权模型，以及第三方工具 server 带来的安全问题与开放问题。", "insight": "这是方向 2 最直接的\"协议层地图\"，可作 related work 的背景引用。它的价值不在新机制，而在把授权问题定位清楚：工具调用的授权不在模型一句话里，而在\"谁能注册 server、工具描述是否可信、OAuth  scope 如何随调用传递、能力漂移后旧授权是否还作数\"这几个关口——这与我们\"批准依据绑定 + 变化失效 + dispatch 重验\"的主张在同一条线上，可用来论证\"绑定必须落在协议/执行层而非 prompt 层\"。它的开放问题清单也可直接借用：能力漂移（capability drift）正是我们\"变化失效\"要形式化的现象，server 信任与注册治理则对应我们 AU 体系里\"谁有权定义 AU\"的前提问题，引用时可作对照。需诚实标注三处限定：① Zenodo 综述、未经同行评审，证据等级低；② 它梳理授权模型但未提出可验证的绑定机制，不能当作已有解决方案引用；③ Jev 初筛相关度仅 0.29，收录是人工复核全文摘要后的决定，读者应以\"背景地图\"而非\"核心证据\"看待它。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "在 MCP 之前，每个 AI 应用与外部系统（数据库、代码库、SaaS、文件系统）的连接都是一次性定制集成，造成 N×M 碎片化；MCP 以 host/client/server + JSON-RPC 的统一标准取代这种拼凑。本文描述其架构与三类 server 原语（tools、resources、prompts）及客户端特性（sampling、roots、elicitation），分析本地 stdio 与远程 Streamable HTTP 两种传输、演进中的 OAuth 授权模型，以及第三方工具 server 的安全问题——包括经由工具描述的 prompt injection 与越权工具暴露；并横向对比原生 function calling、OpenAPI 描述的工具与 A2A 等 agent 间协议，梳理从 function-calling 榜单到交互式 agent benchmark 的评测谱系，最后列出开放问题：server 信任与注册治理、缺乏 MCP 专用 benchmark、版本与能力漂移、以及向 Agentic AI Foundation 中立托管的过渡。", "supplement": false}, {"title": "Agentic and generative AI for intelligent autonomous vulnerability assessment and penetration testing: A systematic analysis", "authors": "Samuel Roy Anthony Truss 等", "url": "https://doi.org/10.1016/j.cosrev.2026.101083", "category": "Computer Science Review（2026-10-24）", "cats": [], "oneliner": "PRISMA 系统综述：从 1144 篇筛出 72 篇，刻画 agentic 与 generative 两条路线在自主漏洞评估与渗透测试（VAPT）中的分工，并导出统一模型、MCP 式接口威胁抽象与五维自主度 benchmark 设想。", "insight": "关联较弱，但有两处可借鉴、一处可作反向论据。可借鉴的是它的\"分层 + 治理\"叙事：自主审计正从孤立 AI 辅助任务走向\"政策约束、可审计架构\"，这与我们从 RAG 检索层走向\"检索—行动全链路绑定\"的演进判断同向，可在讨论段用来说明\"运行时护栏\"已是跨子领域的共识方向而非我们一家之言；它的\"MCP 式接口威胁抽象\"与\"五维自主度 benchmark\"设想也可作我们评测口径的对照（我们的五阶段拆分关注授权判定本身，他们的五维关注自主程度，两者正交、可互补）。反向论据是它的数据本身：72 篇中仅 2 篇真正做 agentic 控制、且自主度数字高度依赖脚手架——这提醒我们，任何\"agent 自主完成 X\"的宣称都必须同时报告脚手架与人类辅助比例，否则安全数字虚高；我们的评测在报告时应坚持这一披露口径。注意边界：这是 VAPT 领域的综述，场景是安全审计而非 RAG 授权，引用时不得把它的结论直接平移到 RAG 场景；且它提出的 benchmark 只是设想、尚未实证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "现有文献多孤立于审计的某个阶段、且以传统 IT 为中心。本文按 PRISMA 从 1144 篇初筛出 72 篇（2020–2025），按五属性编码：结论是 agentic 路线擅长序列化自适应任务（侦察编排、利用路径选择、横向移动、后渗透 pivoting、自适应复测），generative 路线擅长非结构化证据推理（配置与公告解读、漏洞情境化、可利用性评估、合规映射、可追溯审计报告）；但 72 篇中 56 篇用经典机器/深度学习、仅 14 篇用生成式/LLM 技术、仅 2 篇用强化学习或 agentic 控制，且无一篇在真实或仿真 OT/IIoT 目标上验证，报告的自主度高度依赖脚手架（AutoPenBench 上完全自主 21% vs 人类辅助 64%）。作者据此导出四层统一模型（agentic 决策、generative 推理、结构化工具接口、验证–治理），并提出 MCP 式接口层的形式化威胁与评测抽象和五维 VAPT 自主度 benchmark；遗留挑战包括幻觉控制、prompt injection、稀疏奖励、可解释性、安全感知评测与 benchmark 标准化。", "supplement": false}]}, {"date": "2026-10-26", "summary": "", "papers": [{"title": "Permission Withdrawal in Tool-Using Language Model Agents: Runtime Enforcement and Recovery", "authors": "Gaurav Chaulagain 等", "url": "https://doi.org/10.54536/ajdsai.v2i2.8776", "category": "American Journal of Data Science and Artificial Intelligence（2026-10-23）", "cats": [], "oneliner": "用户中途收紧权限后，tool-using agent 是否还会继续执行已被撤回的操作？本文把\"权限撤回\"定义为轨迹级授权问题，对比 prompt-only、规则门、模型门三种执行方式，并给出一个可复现的评测框架。", "insight": "这是方向 2\"执行时授权绑定\"目前最直接的实证支撑，可作 related work 的核心对照。它的\"轨迹级授权\"与我们的 RU/AU 解耦在检索层的工作互补：我们在查询时逐 AU 求值、未知 AU 默认拒绝，他们在行动执行时逐项过门、权限撤回即时生效——两者合起来正是\"检索—行动\"全链路绑定叙事的另一半。它的评测框架设计值得直接借鉴：我们的三语义评测目前也偏重最终结果，引入\"提议/门决策/派发/状态转移\"五阶段拆分后，才能区分\"被门拦住\"与\"因资源不存在而未遂\"这类关键差异，否则我们的安全数字同样可能虚高。它的数字也给出一个诚实的基线参照：规则门零漏放但僵化、模型门灵活但 3 次误放 + 3 次误拒——说明纯模型门不可单独托底，这正是我们主张\"确定性语义 + 默认拒绝\"而非\"模型自律\"的论据。注意边界：期刊影响力有限、样本为确定性模拟环境而非真实生产工具，引用时标注为\"受控环境实证\"而非生产验证。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "现有 agent benchmark 多看任务完成度或最终状态，但这些指标看不出\"未授权操作是被提议、被批准、被派发，还是仅因下游错误而未遂\"。本文在确定性工具环境中测试两个行动模型：72 回合诊断（两个已暴露的写工作流）中，prompt-only agent 在 2 回合里执行了被禁的同值写操作，两个运行时门都拦住了禁令执行，但模型门误拒了 3 次合法调用；随后 384 回合扩展（8 个新任务 × 4 种授权机制）中，346 回合安全完成、383 回合保住了受保护状态，无一例禁令请求成功执行，但模型门批准了 3 个未授权请求——仅因引用资源不存在才未遂。作者的结论是：正确的最终状态和零禁令执行仍可能掩盖授权推理的失败，因此贡献了一个把提议、门决策、派发、状态转移、有用完成五阶段拆开的可复现评测框架。", "supplement": false}, {"title": "Democratizing reliable knowledge-seeking with MyGPT: a privacy-first, open-source retrieval-augmented generation platform", "authors": "Jaimin N Patel 等", "url": "https://doi.org/10.1038/s41467-026-78509-6", "category": "Nature Communications（2026-10-24）", "cats": [], "oneliner": "一个完全开源、可本地或机构内网部署的隐私优先 RAG 平台：敏感数据不出安全环境，配 relevance score 与 hallucination index 两种置信度指标和显式来源引用。", "insight": "关联较弱，但有一处可引用、两处需警惕。可引用的是\"系统存在性\"论据：隐私优先 RAG 不是纸面需求，已有 Nature Communications 级别的平台把\"数据不出域\"做成产品形态，这支撑我们论文的动机段（敏感域 RAG 需要访问控制，而非仅靠事后过滤）。需警惕的是：它的隐私保障来自\"部署边界\"（本地/内网），而非 AU 粒度的授权语义——数据一旦进入库内，库内不同密级文档之间并无细粒度隔离，这正是我们 RU/AU 解耦要补的缺口，引用时应明确区分\"环境隔离\"与\"授权语义\"两个层次，不要把它写成已解决细粒度访问控制的方案。它的 hallucination index 与 relevance score 是\"答案可信度\"指标，与我们的\"授权正确性\"指标正交，不宜混作安全评测。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（文中称全开源平台，抓取未返回独立仓库链接）", "zh_abs": "本文针对敏感域（生物医学文献、机密临床文档、多语种全球卫生政策）查询时的数据泄露与幻觉问题，提出 MyGPT 平台：用开源 LLM、在本地或机构安全环境内运行，用户自建文献库，敏感数据不离开安全环境；引入\"相关性分数\"与\"幻觉指数\"评估上下文支撑度，并在同一界面给出显式来源引用；作者强调其成本效益与模块化，可在无互联网的偏远设施使用，是商业服务的开源替代。", "supplement": false}, {"title": "The Half Circle — a note on a gate that cannot be talked past", "authors": "Chris Owadally", "url": "https://doi.org/10.5281/zenodo.23591575", "category": "Zenodo 实践笔记（2026-10-23，未经同行评审）", "cats": [], "oneliner": "一篇来自真实派单平台的实践笔记：主张 agent 授权的栅栏必须设在 agent 内部、\"主张变成事实\"的那一点上——核心事实若只有\"客户陈述\"而无\"客户确认\"，确认函数要在内核里拒绝（所谓\"半圆\"）。", "insight": "观点上有启发，证据上只能作\"实践印证\"引用，不可作实证引用。它的\"主张变事实的关口设门\"与我们\"执行时授权绑定\"是同一直觉在不同层的表达：我们是在查询/执行时对 AU 求值，他们是在确认动作时对 provenance 求值；它的\"拒绝返回收据与下一步\"也与我们 retrieve-then-project 的\"裁剪 + 可解释\"思路相通，可在讨论段作为\"工业界独立出现同类直觉\"的旁证。但必须诚实标注三处限定：① 未经同行评审，单平台经验，无对照实验；② \"多模型表现\"只有转录摘录，无可复现的量化结果；③ 场景是派单确认，泛化到 RAG 授权需论证，不宜直接类比。建议仅在动机/讨论段用一句话提及，不进核心证据链。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "笔记记录了一个派单平台的真实做法：预订上的每个事实都带 provenance——\"客户陈述\"或\"客户确认\"；只要核心事实仍只是陈述状态，确认函数就在内核拒绝，拒绝时返回收据与下一步真实动作，客户早期的肯定被\"存入\"而非\"花掉\"。作者记录了该门在语音与文本多模型 agent 下的表现（含系统转录原文），并给出让这道门可见的可观测性图例；核心论点是：agent 授权除了凭证、范围、隔离三道外 fence，还需要在 agent 内部、主张变事实的关口再设一道 fence。", "supplement": false}]}, {"date": "2026-10-25", "summary": "", "papers": [{"title": "Enhancing Large Language Models with External Knowledge Using Retrieval-Augmented Generation: A Critical Review of Retrieval Design, Context Compression, Safety and Evaluation, with a Conceptual Governance-Aware Architecture", "authors": "Auti Pallavi S. 等", "url": "https://doi.org/10.5281/zenodo.23593530", "category": "Zenodo 预印本综述（2026-10-23）", "cats": [], "oneliner": "一篇 RAG 批判性综述：系统梳理检索设计、上下文压缩、安全与评测的相互作用，并提出一个八层\"治理感知\"概念架构，把 IAM 权限过滤、时效性与安全性放进 RAG 设计的一等位置。", "insight": "这是治理视角对我们 RU/AU 解耦的一个外部印证，可作背景/动机引用（而非证据引用）。它的 IAM-based permission filtering 与我们的\"查询时逐 AU 求值\"同属\"检索前/检索时过滤\"一派，但它停留在概念层、没有给出 AU 粒度的形式化语义——正好反衬我们的贡献位置：**把\"过滤\"从工程惯例变成可论证的语义**。它那句\"只在显式信任假设下成立\"是我们论文可以直接呼应的表述：我们的\"未知 AU 默认拒绝\"本质上就是把信任假设显式化、形式化，引用时可把这句话作为动机支撑。另外，它的批评（小样本、单次运行、指标不一致）同样适用于我们自己的评估设计，其\"最小评测协议\"思路值得借鉴为三语义评测的报告规范。注意边界：综述无新实验，八层架构未经验证，不要把它写成已验证的基线。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "本文用聚焦叙事综述法梳理 RAG 文献：没有单一配置最优，最优选择取决于任务与指标；检索质量与答案质量在抽取式任务上强相关、在综合式任务上弱相关；自适应检索与压缩能省 token 但会增加延迟。关键判断是：访问控制、时效性与安全性可以放在 LLM 之外强制执行，但**只在显式信任假设下成立**；而现有研究大多基于维基百科问答、小样本、单次运行且指标不一致，作者还记录了若干研究内部的不一致。综述的产出包括 survey 矩阵、区分实验设定的比较分析、八层概念架构、公平比较的最小评测协议和基于证据的研究空白议程。", "supplement": false}, {"title": "De-identified data and analysis code for \"Evidence-Constrained Action Authorization for Agricultural Large Language Model Agents in Rice-Crayfish Aquaculture\"", "authors": "Haiqing Xu 等（安徽新华学院、中国科学技术大学、安徽农业大学）", "url": "https://doi.org/10.5281/zenodo.23544165", "category": "Zenodo 数据与代码包，随论文手稿材料发布（2026-10-22）", "cats": [], "oneliner": "注意：本条不是论文正文，而是\"证据约束行动授权\"研究的去标识化数据与分析代码包——稻虾养殖场景下 LLM agent 的行动须有证据支撑才放行，附 1296 个真实任务与 144,000 条合成机制评测输出。", "insight": "这是**运行时授权绑定**（我们 2026-10-11 定下的方向 2）在行动层的一个真实实例，可作 related work 的平行参照：它的\"无证据不放行\"与我们\"未知 AU 默认拒绝\"是同一哲学在不同层的实例化（他们在 agent 行动层、我们在检索授权层），两者结合起来正好构成\"检索—行动\"全链路授权绑定的叙事。规模数字（1296 真实任务、144,000 合成输出）可作我们 benchmark 规模设计的参照。但引用时必须标注三处限定：参考模式来自生产规则而非独立金标准、原始 prompt 未公开、独立安全验证尚未开展——在这些限定解除前，它的授权有效性结论只能作\"机制可行性\"引用，不能作\"安全性已验证\"引用。建议跟踪该研究原文正式发表后再评估是否收入论文库（standards-agent 组候选）。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "本数据包内含分析代码与验证脚本（Zenodo，1.1 MB），无独立 GitHub 仓库", "zh_abs": "该数据包收录了\"证据约束行动授权\"研究的去标识化任务级数据、保存的模型路由输出、汇总结果与分析代码，支持对已保存输出的再分析与报告点估计的复现：包括来自 6 个匿名池塘集群的 1296 个真实输入任务、冻结 prompt 条件下的输出、合成机制评测的 144,000 条保存输出、汇总表与验证脚本。作者同时坦承限定：真实输入的参考模式来自注册版生产规则、不是独立的农艺金标准；包内不含原始 prompt、源记录键、确切日期与田间图像；不含生产/产量结果；且后续的独立安全验证尚未开展。", "supplement": false}]}, {"date": "2026-10-24", "summary": "", "papers": [{"title": "Certified Execution Harness for Agentic AI: Safe and Least-Intrusive Petri-Net Supervisory Control Between Reasoning and Action", "authors": "Chao Gu, Quanyan Zhu", "url": "https://arxiv.org/abs/2610.31376", "category": "arXiv cs.AI / cs.CR（2026-10-23）", "cats": ["cs.AI", "cs.CR"], "oneliner": "把 agent 的\"推理—工具执行\"接口建模成 Petri 网 supervisory control：capability/approval/budget 是 token，只有前置条件满足的转移才能点火，prompt injection 的恶意请求因条件不满足而被结构性拒绝。", "insight": "这是 agent authorization 线的强相关材料，可作 related work 引用。它的\"前置条件不满足即拒绝\"与我们\"未知 AU 默认拒绝\"是同一哲学在不同层的实例化（他们在工具执行层、我们在检索授权层）；Petri 网的 mark-as-capability 建模提供了一个形式化范例，值得借鉴其表述方式。最有引用价值的是那个反直觉结论——maximally permissive supervisor 在重规划闭环里反而更侵入——这对我们三语义的\"安全-效用权衡\"论述是平行证据：**形式化的\"最小限制\"不等于实际运行中的\"最小干扰\"**，评估授权语义必须放在带重试的闭环里看，而不只是单步决策。注意边界：他们的威胁模型是 prompt injection 下的工具执行安全（T2 附近），不是检索侧信道（我们的 T1/T3 embedding 通道），引用时不要混为一谈。建议收入论文库（standards-agent 组）。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "本文研究 prompt injection 下 LLM agent 的工具安全执行问题。作者用 Petri 网把 LLM 与工具之间的执行 harness 形式化为 supervisory control 问题：mark 表示能力、审批与预算，只有需要的 mark 全部就位转移才能点火——于是注入请求的措辞再巧妙，只要其前置条件未满足或已被消耗，就会被拒绝；工具输出被当作不可控事件，用传统的 maximally permissive supervisor 强制安全，并在四个假设下把安全保证传递到运行系统。进一步，作者引入\"重规划闭环\"概念（每次被拒后 agent 可重试、每次重试消耗一次推理调用），证明在这个闭环里**常规 supervisor 可能比更严格的安全 supervisor 任意更具侵入性**；而对给定 proposer 模型，maximally permissive 且最不侵入的 supervisor 可刻画为常规 supervisor 的 value-threshold refinement。在一个自主发布 agent 上综合验证发现：安全部署需要一个\"rollout 开始后仍可拒绝\"的步骤。", "supplement": false}, {"title": "Auditing the Hand-Written Inputs of Learned Access Control", "authors": "Arsalan Jalil Sarghaleh, Mehdi Hazrati", "url": "https://arxiv.org/abs/2610.31388", "category": "arXiv cs.CR（2026-10-23）", "cats": ["cs.CR"], "oneliner": "学得的访问控制背后藏着两件手写制品（hard-deny 集合、region map），作者在 5 个 ABAC Lab 策略上穷举审计：忠实转录的 deny 条款不可靠率 0.50–0.70，未经验证上线会误删 16–78% 的合法授权。", "insight": "这是今日对我们**最直接的警示性证据**，关联点不在方法而在\"默认拒绝的工程实现\"。我们的 all-of 语义与\"未知 AU 默认拒绝\"依赖一个前提：deny/拒绝判定本身是 sound 的。这篇证明了**手写的 deny 制品在实践中大面积 unsound（0.50–0.70）**，且失败模式恰恰是\"自然语言作用域 vs 规则析取\"的语义错位——我们的保守子句切分器如果也依赖手写 deny 规则，同样会中招。建议在论文的 limitation / deployment notes 里引用它：deny 集合必须经过类似他们这样的穷举 soundness 检查，否则\"默认拒绝\"会变成\"误删 16–78%\"。另外他们的\"两种损失同时报告\"（false-non-grant vs false-permit）值得借鉴为我们三语义评估的报告规范。建议收入论文库（access-control 组）。", "source": "arXiv", "citations": "尚未收录", "code": "无（发布了可复现全部数字的 artifact）", "zh_abs": "学得的访问控制通常部署在两件手造制品之后：一个由小可信 shield 强制执行的 hard-deny 集合，以及一个决定\"哪些请求由挖掘出的规则回答、哪些由学习器回答\"的 region map——验证 shield 或度量学习器都验证不了这两件。作者在 5 个公开 ABAC Lab 策略上审计两者：首先形式化 hard-deny soundness，在最多 794,250 个 tuple 的关系上穷举检查。结果是：**忠实转录显式限制的条款，在 4 种 elicitor（1 位作者 + 3 个盲测 LLM）下不可靠率达 0.50–0.70**——因为自然语言把限制的作用域限定在一个章节，而授权关系是全体规则的析取：**97% 的反例是被其他规则放行的**。未经检查就上线，这些 deny 集合会扣留策略所授予内容的 16–78%；经 certified 后扣留 0%。其次还有第二个静默失败：混合路由需要\"两类、可弃权\"的规则集，而 ABAC miner 吐不出这种规则集；在 24 个实验格里，用两个最常见的排序键给混合效应候选池排序全是一类问题。对加性损失，hybrid-vs-learner 效应可分解为覆盖质量 × 规则-学习器风险对比，且必须在 false-non-grant 和 false-permit 两种损失上同时报告——在两个真实策略上，多数选择规则在两种损失上给出相反 verdict。发布了一个能复现全部报告数字的 artifact。", "supplement": false}, {"title": "Post-Audit Mirage: Identifiability Limits of Offline Agent Verification", "authors": "Aman Behera, Payal Payal", "url": "https://arxiv.org/abs/2610.31130", "category": "arXiv cs.AI / cs.CR（2026-10-23）", "cats": ["cs.AI", "cs.CR"], "oneliner": "离线测试可能根本看不出一次 agent 更新部署后是否还安全：作者构造\"匹配的安全/有害生命周期对\"，让两者在 verifier 可见证据上完全一致，给出可识别性极限的定理与可执行 benchmark。", "insight": "关联较弱但有一个可借鉴的方法论点。我们的三语义和威胁模型评估目前是\"离线可验证\"的（检索结果、裁剪正确性），这篇提醒：**离线证据与部署真相之间存在结构性鸿沟**——对我们而言，类比是\"离线评测的授权正确性\"与\"真实部署中跨 AU 组合、时序累积的授权语义\"之间的鸿沟。他们的\"匹配生命周期对\"构造法（verifier 可见证据相同、部署真相相反）是一个通用的评估设计模式，可借鉴来构造我们三语义的对抗评测：构造在离线指标上得分相同、但在某种 AU 组合下行为不同的查询对。benchmark 覆盖 authorization 环境，可看一眼其授权场景设计。不建议收入论文库（与我们主线距离稍远），启迪段已记录。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "离线测试可能无法揭示一次 agent 更新在部署后是否仍然安全。作者用\"匹配的安全与有害生命周期\"把这种 post-audit mirage 操作化：两条生命周期暴露**完全相同的 verifier 可见证据**，而一个隔离的 scorer 记录相反的部署真相。论文把标准的观测等价与不可区分性思想应用到这个可执行的审计边界，给出 error-abstention 权衡定理。Post-Audit Mirage benchmark 把该边界做成可执行的，横跨 authorization、scheduling、shared-capacity 三个环境。配套的 IdentifiedRangeMonitor 用新鲜的组标注 harm 结果，返回 deploy / hold / cannot determine / unsupported 四种判定。实验显示：在有利设定下监控能恢复缺失的区分度，但对稀有组、小效应或缺失观测仍可能无法判定。结论：verifier-agent 评估必须同时检验\"计算是否有效\"和\"现有证据是否足以支撑部署决策\"。", "supplement": false}, {"title": "Structured Decomposition for Reliable LLM-Generated Access Control Policies", "authors": "Vatsal Gupta, Darshan Sreenivasamurthy（Apple Inc.）", "url": "https://doi.org/10.1007/978-981-92-6837-5_10", "category": "ICICS 2026（Information and Communications Security），LNCS vol 17216，Springer（2026-10-23 出版）", "cats": [], "oneliner": "自然语言访问控制策略 → OPA Rego 可执行代码的模块化流水线：策略检测、组件抽取、schema 校验、lint、编译、自动测试生成与执行，端到端正确率 50.3%（单提示基线 15.3%，3.3×）。", "insight": "这是\"LLM 生成访问控制策略\"方向的一个扎实工程参照（Apple 作者 + ICICS 发表，可靠性高于昨日的 IJRASET 类）。与我们的关系是**互补而非竞争**：他们解决\"策略文本 → 可执行策略代码\"的生成可靠性，我们解决\"检索时策略如何绑定到数据单元\"的执行语义——两者是同一 pipeline 的上下游。可引用点：① 他们的 deny 语义正确率即使经结构化分解也只有 87.5%，与第 2 篇（Auditing Hand-Written Inputs）的\"deny 制品大面积 unsound\"互相印证：**deny 语义是访问控制里最脆弱的一环**，这正是我们\"未知 AU 默认拒绝\"需要形式化保证的 motivation；② 他们的\"正反两类测试都必须通过才算正确\"的严格评测标准，可借鉴为我们三语义正确性评测的通过准则。注意：代码尚未公开，复现性数字引用时标注来源。建议收入论文库（access-control 组）。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "作者承诺\"upon acceptance\"公开，目前无", "zh_abs": "本文提出一个基于 LLM 的系统，把自然语言访问控制策略（NLACP）翻译成 Open Policy Agent（OPA）可执行的 Rego 代码。系统是模块化端到端流水线：策略检测、组件抽取、schema 校验、lint、编译，以及自动测试生成与执行，目标是弥合\"人类可读的访问需求\"与\"机器可执行的 policy-as-code\"之间的鸿沟，聚焦部署可靠性与安全正确性。在 372 条 ACRE-complete 访问控制语句（主语/动作/资源标注非空）上评测，与直接单提示 LLM 基线对比以隔离\"结构化分解 + schema 感知校验\"的贡献：系统端到端策略正确率 **50.3%**，基线 15.3%，**3.3× 提升**；\"正确\"的判定标准很严——必须同时通过编译、lint、正反两类测试。在安全关键模式上：deny 语义正确率 87.5%（基线 37.5%）、ownership 条件 100%（基线 40%）、status 条件 100%（基线 55.6%）。", "supplement": false}]}, {"date": "2026-10-23", "summary": "", "papers": [{"title": "Residual Privacy Leakage after Output Scrubbing in Tool-Using LLM Agents under Indirect Prompt Injection", "authors": "Kashvi Gupta", "url": "https://doi.org/10.21203/rs.3.rs-11428254/v1", "category": "Research Square 预印本（2026-10-20）", "cats": [], "oneliner": "oracle 级事后清洗也清不干净：间接注入诱使 agent 泄露授权来源的隐私数据后，即使删除所有逐字出现与 ≥3 token 连续片段，残留泄露仍达 61.2% / 62.1%。", "insight": "这是今日对我们最有引用价值的一篇，它用硬数字回答了我们论文的一个核心设计问题——**\"为什么不用事后过滤，而要做检索时/索引时的授权绑定\"**。我们的 retrieve-then-project 与 per-view 索引，本质上就是\"模型接触前（pre-exposure）做授权决策\"，而这篇证明了事后 scrubbing 在语义改写面前结构性失效（61%+ 残留），连 oracle 级清洗都救不回来。相关性再往深一层：他们的\"语义改写幸存\"正是我们 NLI 残留检查要对付的同一类泄露——retrieve-then-project 的裁剪如果只做 token 级删除，会重蹈覆辙；这篇的 57% 人工重判残留率可以作为\"残留检查必须做到语义级\"的 motivation 数据引用。注意方法学边界：他们的 oracle 过滤器是事后、单轨迹的，与我们的执行时绑定不在同一防线位置，引用时不要混为一谈。建议收入论文库（privacy-mia 组）。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "工具型 LLM agent 被间接 prompt injection 诱使披露从授权源检索到的隐私信息后，作者测试\"事后清洗\"能否修复：在两组历史泄露轨迹上，一个能访问真实被保护值的 oracle 输出过滤器删掉了**每一个逐字出现和每一个 ≥3 token 的连续匹配片段**，但残留披露仍分别出现在 **30/49（61.2%，95% CI 46.2–74.8）** 和 **41/66（62.1%，95% CI 49.3–73.8）** 的轨迹里；人工重判证据后仍有 57.1% / 56.1%。幸存的泄露**主要是语义改写**，与原值几乎无词汇重叠。基于模型的语义 redactor 把逐字泄露从 79.3% 降到 68.6%，但代价是删掉了被测臂中**所有任务必需字段**。作为预防参照，oracle pre-context-removal（模型接触前就移除）实现 0/30 禁止字段泄露——但作者诚实注明这不是与输出清洗组的可比对照。结论：模型接触数据后，有限跨度的精确值清洗**不足以作为主要隐私防线**；应最小化模型接触前的隐私数据、覆盖所有入口路径、把输出过滤只当纵深防御。", "supplement": false}, {"title": "Enterprise Agentic RAG with Pre-Search Role-Based Access Control, Multi-Layered Guardrails, and Operational Telemetry", "authors": "K. Sandhiya, Sreya PNS, R. Sindhiya", "url": "https://doi.org/10.22214/ijraset.2026.85274", "category": "IJRASET（2026-10-22）", "cats": [], "oneliner": "企业级 agentic RAG：LangGraph 编排 7 个 agent，检索前按 4 级密级做向量 payload 过滤，宣称 RBAC 预过滤精度 100%、跨密级零 embedding 泄露。", "insight": "venue 很弱（IJRASET 是低门槛期刊），\"100%\"、\"零泄露\"这类数字没有任何可复现的实验细节支撑，**不能作为证据引用**。但它的**架构选择本身有信息量**：工业界实践者面对 RAG 授权问题时，不约而同选择了\"检索前过滤\"（pre-search filtering）而不是\"检索后裁剪\"——这与我们论文的形式化结论（pre-retrieval 语义在安全-效用权衡上的位置）同向。可用一句话写进 related work / motivation：\"企业级 RAG 部署已普遍采用检索前 ACL 过滤（如 RBAC payload filtering），但其语义是工程启发式的、缺乏形式化保证——我们的三语义正是要给出这层保证\"。四级密级（Restricted/Confidential/Internal/Public）是个现成的 AU 分层实例，可借用来举例说明 AU 粒度划分。不收入论文库（方法论贡献不足），但启迪段已记录。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "针对企业 RAG 的生产漏洞（embedding 侧信道泄露、越权提权、prompt injection、无人值守执行、审计缺失），作者提出\"Enterprise Agentic RAG\"：stateful 的 7-agent 编排（LangGraph）+ **检索前向量 payload 过滤**（Pre-Search Vector Payload Filtering），按 Restricted / Confidential / Internal / Public 四级密级在检索前剔除未授权向量；混合检索（BM25 + dense cosine，Qdrant HNSW）经 RRF 融合；另有策略校验的工具 agent（AES-256 加密企业邮件发送）、出口 DLP 防火墙、多层确定性 guardrail（防注入/越狱/PII/凭证泄露）、Prometheus 遥测与不可变审计日志。报告的数字：RBAC 预过滤精度 100%、跨密级零向量 embedding 泄露、groundedness 98.7%、端到端 <150ms、注入与 DLP 违规 100% 拦截。", "supplement": false}, {"title": "Enterprise Retrieval-Augmented Generation (RAG) over Federated Cloud Data Lakes", "authors": "Sonu Kumar Singh", "url": "https://doi.org/10.5281/zenodo.23513216", "category": "Zenodo 自出版（MSIT 学位论文方向，2026-10-20）", "cats": [], "oneliner": "横跨 Iceberg/Snowflake/BigQuery 的联邦企业 RAG，用加密预检索 ACL 位图过滤 + 三路混合检索，在 1480 万文档语料上 Recall@10 从 61.2% 提到 93.4%。", "insight": "又一篇独立走向\"检索前 ACL 强制\"的工业界实例，且明确点出了**后检索过滤的泄露问题**（\"leak unauthorized knowledge when ACL filtering is applied post-retrieval\"）——这句话几乎就是我们 T2 威胁模型（可见排序向量）的一个实例化注脚。技术上可借鉴的点：ACL 位图 + 加密的\"pre-retrieval\"实现方式，是 per-view 索引的一个工程近似，可在论文的 implementation notes 里提一句\"工业界用位图近似实现视图隔离\"。数字（93.4% recall、168ms P95）来自作者自述的生产案例、无独立复现，引用时只引用架构选择、不引用性能数字。关联较弱于第 1 篇（联邦数据湖部分与我们的主题距离较远），不收入论文库。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "企业 LLM 落地需要 grounding 到权威内部知识库并严格执行行级/文档级 ACL；朴素 RAG（固定 500-token 切分 + 无约束 ANN 检索）在三处失败：复杂表格的跨节结构上下文丢失、对精确产品码/法规条文的词汇盲区、**后检索 ACL 过滤导致未授权知识泄露**。作者提出联邦企业 RAG 架构：布局感知语义切分、上下文头注入、三路混合检索（dense HNSW + BM25s 稀疏 + 实体知识图谱遍历，经 RRF 融合）、cross-encoder 重排，以及**加密预检索 ACL 位图过滤**（cryptographic pre-retrieval ACL bitmap filtering）。以 Morgan Stanley 财富管理知识助手与 Ramp 财务文档分析管线为原型的生产案例，在 1480 万文档联邦语料上评测：Context Recall@10 从 61.2%（纯 dense 基线）提到 **93.4%**，RAGAS Faithfulness 从 0.74 到 0.96，未 grounded 幻觉从 14.8% 降到 1.2%，**零未授权文档泄露**，P95 端到端检索延迟 168ms。", "supplement": false}, {"title": "PIU Smart Intelligence Agents: Design and Implementation of a Security-Aware Multi-Agent Architecture for Enterprise Intelligence", "authors": "Sujit Shibaprasad Maity", "url": "https://doi.org/10.38124/ijisrt/26oct511", "category": "IJISRT（2026-10）", "cats": [], "oneliner": "把文档智能、RAG、语义搜索、NL2SQL、KPI 生成、对话 AI 塞进同一个\"安全感知\"多 agent 治理框架的工程集成报告。", "insight": "关联较弱。这是一篇工程集成报告，没有新的授权语义、攻击或防御机制；它的\"授权\"停留在传统应用层 RBAC（认证/授权服务），没有触及检索-授权解耦问题。唯一值得记录的是它的诚实局限声明方式——明确列出\"证据未确立什么\"，这种写法值得我们在论文 limitations 章节学习：把\"未独立复现的安全有效性\"这类话前置说出来，比等审稿人问要好。不收入论文库。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "企业异构文档/关系库/分析系统接入 LLM 后，面临证据可靠性、分析正确性、访问控制、运维韧性四类挑战。作者提出 PIU Smart Intelligence Agents：围绕认证、授权、请求校验、供应商集成、可观测性、受控数据访问等共享服务，组织文档智能（文件校验→OCR→切分→embedding→向量索引）、结构化分析（schema 感知 SQL 生成与受限执行分离）、KPI 生成等专用 agent。报告 1,242 个自动化测试通过、2 个集成测试跳过；但作者**诚实声明**：现有证据未确立外部 RAG 基准性能、全 agent 定量正确性、独立验证的安全有效性或生产级性能/恢复保证——主要贡献是\"异构企业 AI 能力与显式治理要求的系统性集成\"，并给出一个可复现的评估框架。", "supplement": false}, {"title": "Prompt Injection Through Forensic Evidence: A Taxonomy and Proof of Concept of Anti-Forensic Attacks on LLM-Assisted Digital Investigations", "authors": "（arXiv 页面未列出，待核实）", "url": "https://arxiv.org/abs/2610.29747", "category": "cs.CR · arXiv 预印本（2026-10-21 公告批次）", "cats": ["cs.CR"], "oneliner": "数字取证反转了间接注入的设定：被分析的证据**按定义就是攻击者控制的**，审查员还必须细读它——推理层成了新的反取证目标。", "insight": "威胁模型角度的 adjacent 材料。我们的 T1/T2/T3 按\"攻击者能看到什么\"分级，默认攻击者能力来自外部输入通道；这篇提醒了一个正交维度——**当检索语料本身就是对抗性的**（取证证据、用户上传文档、第三方数据源），\"检索内容可信\"的隐含假设就塌了。我们的 AU 求值管\"谁能看\"，不管\"内容是否被投毒\"，这一点在论文 scope 里应明确声明（与昨日 nokast-secureRAG 的启示一致：访问控制 ≠ 内容完整性）。\"感知鸿沟\"概念可借用来描述 embedding 通道泄露的一个侧面：向量索引\"看到\"的与人类审查员\"看到\"的不是同一份文档。不收入论文库（取证场景离 RAG 访问控制较远）。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "LLM 正进入数字取证做审查助手与自主 agent。取证反转了间接 prompt injection 的通常设定：被分析的证据按定义是攻击者可控的，而审查员有义务仔细阅读——这使**推理层**成为继数据层、工具层之后的新反取证目标。经典反取证分类学覆盖不了它，现有的 prompt injection 防御也预判不了它。作者扩展反取证模型以刻画\"推理操纵\"，提出经由对抗证据实施的攻击分类法：攻击者选定目标、技术、载荷位置、隐藏方法。他们观察到一个\"感知鸿沟\"（perception gap）：确定性工具、人类审查员、模型对同一份证据的感知不同——正是这个鸿沟让注入绕过审查员直达模型。三个 PoC 攻击打穿一条 LLM 辅助分析管线：篡改报告结论、向分析师工作站写入攻击者指定内容、产生出站网络流量——全部仅靠种植在被扣押设备上的文本驱动。文末给出缓解措施。", "supplement": false}]}], "total": 27, "n_days": 7, "all_total": 140, "all_days": 30};

s": 0, "replies": 0, "url": "https://x.com/i/status/2115553852007354591", "author": "OpenAIDevs"}, {"id": "2115523096870539704", "text": "@aastroza @pablopoo @ingenieriaUDD_ @iadevsconf @imontenegroc builder vibes 🏗️", "created_at": "10-29 03:46", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2115523096870539704", "author": "OpenAIDevs"}, {"id": "2115510886144282927", "text": "Runway Dev is now on Codex One plugin install gives Codex everything it needs to build Runway’s API into your app. Describe what your app should generate and let Codex build the integration autonomously. Get started at the link below.", "created_at": "10-29 02:46", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2115510886144282927", "author": "runwayml"}, {"id": "2115471825031610611", "text": "We’ve updated voice mode in Perplexity. Work across multiple Computer sessions at once, start new tasks, and create and manage Projects in one voice session. It runs on OpenAI’s gpt-live-1. Available now on the Mac app and web for all Pro and Max subscribers.", "created_at": "10-28 23:46", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2115471825031610611", "author": "AskPerplexity"}, {"id": "2115453476579008827", "text": "Big news with @Oracle! Bringing Oracle apps and data into ChatGPT, with new offerings powered by OpenAI. US customers can now buy API, Codex & ChatGPT Work via Oracle Marketplace using eligible credits. Also 130K ChatGPT + 95K+ Codex users now! openai.com/index/oracle-a…", "created_at": "10-28 22:46", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2115453476579008827", "author": "derrickcchoi"}, {"id": "2115404306371289524", "text": "I built a yearbook app with @ChatGPT Sites to see if I could pull off 1975 hair. 0:00 Why yearbooks? 0:29 Six eras 1:22 Building on walks 1:51 The prompt 2:20 Invites 3:25 Image jobs 5:13 A/V Club 6:07 Era design 7:30 Superlatives 8:55 Who gets a mohawk?", "created_at": "10-28 19:46", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2115404306371289524", "author": "craigsdennis"}, {"id": "2115401150484939009", "text": "GPT 6.1 Terra is absurdly good at 3D modeling and motion. I asked it to build an interactive showcase that counts to 5 and explodes a mechanical hand down to every single gear, wire, and panel. We are living in the build era.", "created_at": "10-28 18:46", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2115401150484939009", "author": "HamidoFx1"}, {"id": "2115066197008134388", "text": "Codex isn’t just for code — tell it what you need and it’ll design the fitting part. I asked for a StickS3 mount on a RICOH GR hot shoe, screen facing me for selfies. Got parametric CAD → STL, printed a snap-fit mount, clicked it on. Built with @OpenAI Codex.", "created_at": "10-28 06:46", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2115066197008134388", "author": "Tinker_Zhang"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2115207004293853358", "text": "We're expanding our partnership with @USGSA. Under a new OneGov agreement, we are bringing Claude to federal, state, local, tribal, and territorial governments at 40% off.\nhttps://www.anthropic.com/news/expanding-partnership-gsa", "created_at": "10-28 06:20", "likes": 2065, "reposts": 125, "replies": 311, "views": 354009, "url": "https://x.com/AnthropicAI/status/2115207004293853358", "author": "AnthropicAI"}, {"id": "2115178675050307942", "text": "Over the past few months, Anthropic scientists have engaged in deep research partnerships with six organizations developing new medicines. We've also begun drug discovery efforts of our own.\n\nIn doing so, we’ve learned much more about how Claude can support the many stages of drug development.\n\nIn this blog post, we share some early results from these efforts, and describe how this work fits in with our wider ambitions in the life sciences.\n\nhttps://www.anthropic.com/research/early-progress-drug-development", "created_at": "10-28 04:27", "likes": 9937, "reposts": 1062, "replies": 643, "views": 2978448, "url": "https://x.com/AnthropicAI/status/2115178675050307942", "author": "AnthropicAI"}, {"id": "2114705042817110293", "text": "Anthropic has filed an S-1 registration statement with the SEC related to its proposed IPO.\n\nRead more: https://www.anthropic.com/news/s1-sec\n\nLegal disclaimer: A registration statement relating to these securities has been filed with the SEC but has not yet become effective. These securities may not be sold, nor may offers to buy be accepted, prior to the time the registration statement becomes effective. This post does not constitute an offer to sell or the solicitation of an offer to buy these securities, nor shall there be any sale of these securities in any state or jurisdiction in which such offer, solicitation or sale would be unlawful prior to registration or qualification under the securities laws of any such state or jurisdiction.", "created_at": "10-26 21:05", "likes": 18187, "reposts": 2363, "replies": 1309, "views": 9168832, "url": "https://x.com/AnthropicAI/status/2114705042817110293", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2115489356437651654", "text": "Gemini 4 Carbon is our next frontier model.\n\nIt’s state-of-the-art across cybersecurity and long-horizon capabilities.", "created_at": "10-29 01:02", "likes": 9996, "reposts": 931, "replies": 484, "views": 714352, "url": "https://x.com/GoogleDeepMind/status/2115489356437651654", "author": "GoogleDeepMind"}, {"id": "2115489359415890211", "text": "Carbon can work through complex tasks for days without getting stuck or taking shortcuts – delivering high-quality, reliable code.\n\nFeedback from an initial group of cyber defenders will help us iterate on guardrails before we expand access soon.\n\nFind out more ↓ https://goo.gle/4BCFvj8", "created_at": "10-29 01:02", "likes": 435, "reposts": 16, "replies": 23, "views": 44448, "url": "https://x.com/GoogleDeepMind/status/2115489359415890211", "author": "GoogleDeepMind"}, {"id": "2115114030503166385", "text": "Here’s what’s new with Genie 4:\n🔵 Photorealism: Built on Gemini Omni for lifelike detail across spaces and subjects\n🔵 Advanced physics: Aerodynamics, collisions, and people who move naturally\n🔵 Real-time controls: Prompt to change the scene, add elements, or interact with characters\n🔵 Native audio: Ambient sound, music, background noise, and interactive dialogue\n🔵 Gemini reasoning: Plans multi-step events to maintain coherence as scenes evolve\n\nThese capabilities are a step toward developing safe virtual environments to see how agents and robots navigate their surroundings.\n\nWe’re exploring early use cases with trusted testers first, before bringing the model to Google AI Ultra subscribers in Project Genie and early access partners in our API and @GoogleAIStudio soon.\n\nFind out more → https://goo.gle/48idm3b", "created_at": "10-28 00:10", "likes": 1291, "reposts": 101, "replies": 40, "views": 293940, "url": "https://x.com/GoogleDeepMind/status/2115114030503166385", "author": "GoogleDeepMind"}, {"id": "2115114028338962672", "text": "This is Genie 4, our most realistic and interactive world model yet. 🌐\n\nExplore dynamic environments in real time to see how the scene responds, sounds, and how the people in it move, react, and speak.", "created_at": "10-28 00:10", "likes": 22897, "reposts": 2520, "replies": 924, "views": 3181205, "url": "https://x.com/GoogleDeepMind/status/2115114028338962672", "author": "GoogleDeepMind"}, {"id": "2114677979783594436", "text": "Delighted to see the launch of the UK’s new AI Biosecurity Lab, which @GoogleDeepMind will partner with and support.\n\nAs life sciences enter a transformational era, it is essential for researchers, government, and industry to collectively strengthen our biological defences and guide these new capabilities responsibly.\n\nCongratulations to @KanishkaNarayan and the entire team that has worked on making this a reality.", "created_at": "10-26 19:18", "likes": 291, "reposts": 31, "replies": 10, "views": 51319, "url": "https://x.com/pushmeet/status/2114677979783594436", "author": "pushmeet"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2115557846066819074", "text": "Read my full remarks here: https://blog.google/company-news/inside-google/message-ceo/alphabet-earnings-q3-2026/", "created_at": "10-29 05:34", "likes": 53, "reposts": 2, "replies": 8, "views": 14346, "url": "https://x.com/sundarpichai/status/2115557846066819074", "author": "sundarpichai"}, {"id": "2115535455156642066", "text": "Q3 is in the books! We’re now on a half-trillion annual revenue run rate, with Alphabet revenues growing at 25%.\n\n- Our AI investments are driving overall Search query growth, including commercial queries - our YoY query growth rate is the highest it’s been in the last five years.\n- Google Cloud revenue grew 103%, powered by extraordinary demand for our AI infrastructure and AI solutions. Our 1P model APIs now process nearly 32B tokens/min (up 40% QoQ).\n- Strong momentum in model progress with Argon and Carbon leading the frontier, and Genie 4 our most advanced new world model yet.\n\nThanks to our partners and employees around the world. More to share on the call soon!", "created_at": "10-29 04:05", "likes": 5198, "reposts": 332, "replies": 329, "views": 336794, "url": "https://x.com/sundarpichai/status/2115535455156642066", "author": "sundarpichai"}, {"id": "2115489222442594718", "text": "Read more about Gemini 4 Carbon below https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/", "created_at": "10-29 01:01", "likes": 922, "reposts": 43, "replies": 33, "views": 181302, "url": "https://x.com/sundarpichai/status/2115489222442594718", "author": "sundarpichai"}, {"id": "2115489219804352921", "text": "I did say we'd be releasing our models periodically...introducing Gemini 4 Carbon, our next frontier model.\n\nFollowing Argon's release just two weeks ago, Carbon shows the pace at which we’re pushing the frontier, it ranks #1 on the recently updated v5.0 of @ArtificialAnlys Intelligence Index at 59. It also leads across key cybersecurity evaluations scoring 88.2% on SEC-bench Pro for finding vulnerabilities, 54.8% on ExploitGym for exploitation, and 71.0% on CWE-bench for patching.\n\nWe’re seeing significant improvements in long-horizon tasks even compared to Argon, and we’ve strengthened frontier safeguards.\n\nAs we did with Argon, we’re going to roll it out gradually + responsibly. Some trusted cyber defenders will get access starting this week. We'll be expanding it to more partners through our Fairwind Program, ahead of wider availability soon, so hang tight!", "created_at": "10-29 01:01", "likes": 22295, "reposts": 1678, "replies": 1442, "views": 2702585, "url": "https://x.com/sundarpichai/status/2115489219804352921", "author": "sundarpichai"}, {"id": "2115138580473647266", "text": "Amazing to see deployed soldiers share a moment with their kids through Beam. Huge thanks to @USArmy @The_USO for helping to make this possible.", "created_at": "10-28 01:48", "likes": 2049, "reposts": 104, "replies": 85, "views": 243076, "url": "https://x.com/sundarpichai/status/2115138580473647266", "author": "sundarpichai"}, {"id": "2115115254653018402", "text": "The demo above shows how all these capabilities come together in real time. Prompt “traffic light green,” and Gemini reasons through what happens next as the signal changes: the engine revs, and the motorcycle accelerates down the coast.\n\nFull prompt here:\n\nEnvironment: A sun-drenched coastal highway viewed right at the white stop line of a beachfront intersection, where an overhead traffic light hangs prominently in the immediate foreground glowing bright red. Running parallel to the road strictly along the right-hand side is a golden sandy beach and shoreline with rolling turquoise ocean waves under a clear blue sky.\n\nCharacter: Shot from a first-person POV seated on a motorcycle positioned right up close to the traffic light, facing straight ahead over the handlebars, side mirrors, and dashboard. With the sea and shore visible on the right side of the frame, the rider rolls the last few feet up to the white crosswalk line and comes to an idling stop directly beneath the glowing red signal, gloved hands resting on the grips while waiting for the light to change.\n\nhttps://deepmind.google/blog/genie-4-a-new-generation-of-world-simulation/", "created_at": "10-28 00:15", "likes": 379, "reposts": 30, "replies": 33, "views": 81799, "url": "https://x.com/sundarpichai/status/2115115254653018402", "author": "sundarpichai"}, {"id": "2115115252690145519", "text": "Excited to share Genie 4 today our most realistic and interactive world model:\n\n- steer dynamic environments in real time, shaping events, camera angles, and actions\n\n- generate native audio matched to the world, from realistic background sounds to characters who can converse in real time!\n\n- simulate photorealistic scenes and real-world physics\n\n- create more coherent multi-step events through reasoning from Gemini\n\nWe've started to roll out as a research preview to trusted testers. Coming soon to Google AI Ultra subscribers in Project Genie and early access partners via the Gemini API and AI Studio.", "created_at": "10-28 00:15", "likes": 18381, "reposts": 1407, "replies": 843, "views": 1722877, "url": "https://x.com/sundarpichai  "views": 321430, "url": "https://x.com/deepseek_ai/status/2112476501065286085", "author": "deepseek_ai"}]}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2114450610724708492", "text": "We're sorry for the rate limits and unnecessary quota consumption on the K3.1 Pro subscription plan. These were our issues, and we should have fixed them sooner.\n\nToday, every subscriber on every plan gets a one-time usage reset, restoring 25% of their monthly quota (usage below 25% resets to zero), equal to one week of usage. Your usage bar will reflect this adjustment by end of day PST.\n\nWe've also adjusted the plan's parameters and are reducing unnecessary subagent calls and output length, so your quota goes further.\n\nThank you for your patience while we put this right.", "created_at": "10-26 04:14", "likes": 5359, "reposts": 186, "replies": 417, "views": 637610, "url": "https://x.com/Kimi_Moonshot/status/2114450610724708492", "author": "Kimi_Moonshot"}, {"id": "2113681863109939271", "text": "Meet Kimi K3.1 Pro, our most capable 3T-class model.", "created_at": "10-24 01:20", "likes": 44433, "reposts": 2084, "replies": 578, "views": 2880215, "url": "https://x.com/Kimi_Moonshot/status/2113681863109939271", "author": "Kimi_Moonshot"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875758904795344896/U3CqYUFY_400x400.jpg", "tweets": [{"id": "1875761216062439461", "text": "购买 $ZHIPU —— 采用全自研的GLM模型架构，基于数十万亿中英文双语数据训练而成。ZHIPU 综合能力接近 GPT-4-Turbo，推理速度高达 80 token/s，阅读速度是人类极限（300词/分钟）的 25 倍，开创了AI性能的新标杆！\n\nhttps://bigmodel.cn/", "created_at": "01-05 12:28", "likes": 17, "reposts": 5, "replies": 7, "views": 9725, "url": "https://x.com/ZhipuAI/status/1875761216062439461", "author": "ZhipuAI"}]}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar":
