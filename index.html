/* ---------- finance (💰财经大事): 长简报 md 渲染 ---------- */
function mdInline(s){
  return esc(s||'')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function renderFinance(){
  const M = FIN || {}, src = M.md || '';
  const n = (src.match(/^▪ /gm) || []).length;
  document.getElementById('finCount').textContent =
    (M.date ? M.date + ' 更新 · ' : '') + n + ' 条';
  const box = document.getElementById('finList');
  if (!src.trim()){ box.innerHTML = '<div class="empty">今日暂无财经大事早报。</div>'; return; }
  let html = '', inList = false, inTable = false;
  const closeList = () => { if (inList){ html += '</ul>'; inList = false; } };
  const closeTable = () => { if (inTable){ html += '</tbody></table>'; inTable = false; } };
  src.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line){ closeList(); closeTable(); return; }
    let m;
    if ((m = line.match(/^###\s+(.*)/))){ closeList(); closeTable(); html += '<div class="fin-h3">' + mdInline(m[1]) + '</div>'; return; }
    if ((m = line.match(/^##\s+(.*)/))){ closeList(); closeTable(); html += '<h2 class="fin-h2">' + mdInline(m[1]) + '</h2>'; return; }
    if (/^#\s/.test(line)){ closeList(); closeTable(); return; }  /* H1 跳过（tab 已有标题） */
    if (/^---+$/.test(line)){ closeList(); closeTable(); html += '<hr class="fin-hr">'; return; }
    if (/^\|.*\|$/.test(line)){
      closeList();
      if (/^\|[\s|\-:]*\|$/.test(line) && /-/.test(line)) return;  /* 表格分隔行跳过 */
      const cells = line.split('|').slice(1, -1).map(c => mdInline(c.trim()));
      if (!inTable){ html += '<table class="fin-table"><tbody>'; inTable = true; }
      html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      return;
    }
    if (/^▪\s?/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item">' + mdInline(line.replace(/^▪\s?/, '')) + '</li>';
      return;
    }
    closeList(); closeTable();
    html += '<p class="fin-p">' + mdInline(line) + '</p>';
  });
  closeList(); closeTable();
  box.innerHTML = '<article class="fin-body">' + html + '</article>';
}

  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}
function toggleXAcc(btn){
  const g = btn.getAttribute('data-g'), h = btn.getAttribute('data-h');
  markXSeen(h);
  const det = document.getElementById('xd-' + g);
  const wasOpen = btn.classList.contains('open');
  det.parentElement.querySelectorAll('.x-chip.open').forEach(c => c.classList.remove('open'));
  if (wasOpen){ det.innerHTML = ''; return; }
  btn.classList.add('open');
  const a = XW.accounts[h];
  det.innerHTML = '<div class="x-detail-head">' + avatar(a, h, 'x-av-lg')
    + '<div><div class="x-acc-name">' + esc(a.name || h) + '</div>'
    + '<div class="x-acc-sub">@' + esc(h) + (a.label ? ' · ' + esc(a.label) : '')
    + '</div></div></div>' + twArticles(h);
  if (det.scrollIntoView) det.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function renderX(){
  const accs = XW.accounts || {};
  const handles = Object.keys(accs).filter(h => (accs[h].tweets || []).length);
  let total = 0;
  handles.forEach(h => { total += accs[h].tweets.length; });
  document.getElementById('xCount').textContent =
    (XW.date ? XW.date + ' 更新 · ' : '') + total + ' 条';
  const box = document.getElementById('xList');
  let html = '';
  if (XW.summary) {
    html += '<div class="x-summary"><div class="x-sum-t">📌 今日要点</div>'
      + '<div class="x-sum-b">' + md(XW.summary) + '</div></div>';
  }
  const gs = XW.group_summaries || {};
  const groups = XW.groups || [{key: 'other', label: '🌐 其他'}];
  html += groups.map(gr => {
    const hs = handles.filter(h => (accs[h].group || 'other') === gr.key);
    if (!hs.length) return '';
    const n = hs.reduce((s, h) => s + accs[h].tweets.length, 0);
    const chips = hs.map(h => {
      const a = accs[h];
      const newest = a.tweets.reduce((m, t) => (t.created_at && t.created_at > m) ? t.created_at : m, '');
      return '<button class="x-chip" data-g="' + esc(gr.key) + '" data-h="' + esc(h)
        + '" data-newest="' + esc(newest) + '" onclick="toggleXAcc(this)">'
        + avatar(a, h, 'x-av-chip', true)
        + '<div class="x-chip-name">' + esc(a.name || h) + '</div>'
        + '<div class="x-chip-sub">@' + esc(h) + ' · ' + a.tweets.length + '条</div></button>';
    }).join('');
    return '<section class="x-group"><div class="x-group-head"><div class="x-group-title">'
      + esc(gr.label) + '</div><div class="x-group-n">' + n + ' 条</div></div>'
      + (gs[gr.key] ? '<div class="x-group-sum">' + md(gs[gr.key]) + '</div>' : '')
      + '<div class="x-chips">' + chips + '</div>'
      + '<div class="x-detail" id="xd-' + esc(gr.key) + '"></div></section>';
  }).join('');
  box.innerHTML = html || '<div class="empty">今日暂无大佬动态数据。</div>';
}

/* ---------- models ---------- */
function renderModels(){
  const M = MODELS || {};
  const ro = M.releases_open || [], rc = M.releases_closed || [], arena = M.arena || [];
  const sp = M.spotlight || [];
  const nRel = ro.length + rc.length;
  document.getElementById('mdCount').textContent =
    (M.date ? M.date + ' 更新' : '') + (M.arena_date ? ' · 榜单 ' + M.arena_date : '');
  let html = '';
  if (M.summary) html += colSummary('📌 今日模型要点', M.summary);
  if (sp.length){
    html += '<div class="day"><div class="day-head"><h2>🔍 值得关注</h2><span class="n">' + sp.length + '</span></div><div class="grid">';
    html += sp.map(c => '<div class="card"><div class="badges"><span class="badge amber">精选</span></div>'
      + '<h3>' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) + '</h3>'
      + (c.why ? '<div class="one">' + md(c.why) + '</div>' : '') + '</div>').join('');
    html += '</div></div>';
  }
  if (nRel){
    html += '<div class="day"><div class="day-head"><h2>🆕 新发布</h2><span class="n">' + nRel + '</span></div><div class="grid">';
    html += rc.map(c => '<div class="card"><div class="badges"><span class="badge cat">闭源</span>'
      + (c.date ? '<span class="date">' + esc(c.date) + '</span>' : '') + '</div>'
      + '<h3>' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) + '</h3>'
      + (c.org ? '<div class="authors">' + esc(c.org) + '</div>' : '')
      + (c.blurb ? '<div class="one">' + esc(c.blurb) + '</div>' : '') + '</div>').join('');
    html += ro.map(c => {
      const info = [c.params ? c.params + ' 参数' : '', c.base_model ? '基于 ' + c.base_model : '',
                    c.pipeline || '', c.license || ''].filter(Boolean).join(' · ');
      return '<div class="card"><div class="badges"><span class="badge green">开源权重</span>'
      + (c.date ? '<span class="date">' + esc(c.date) + '</span>' : '') + '</div>'
      + '<h3><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.id) + '</a></h3>'
      + (info ? '<div class="one">' + esc(info) + '</div>' : '')
      + '<div class="authors">❤ ' + c.likes + ' · ⬇ ' + fmtN(c.downloads) + '</div></div>';
    }).join('');
    html += '</div></div>';
  }
  if (arena.length){
    html += '<div class="day"><div class="day-head"><h2>🏆 LMArena Text 榜</h2>'
      + (M.arena_date ? '<span class="n">' + esc(M.arena_date) + '</span>' : '') + '</div>'
      + '<div class="lb-wrap"><table class="lb-table"><thead><tr><th>#</th><th>模型</th><th>评分</th><th>较昨日</th></tr></thead><tbody>'
      + arena.map(a => {
          const dlt = a.delta || 0;
          const dc = dlt > 0 ? '<span class="up">▲ ' + dlt + '</span>'
                   : dlt < 0 ? '<span class="down">▼ ' + (-dlt) + '</span>'
                   : '<span class="flat">–</span>';
          const open = a.license && a.license !== 'Proprietary';
          return '<tr><td class="rk">' + a.rank + '</td><td><span class="mname">' + esc(a.model) + '</span>'
            + (open ? '<span class="open-tag">开源</span>' : '')
            + (a.org ? '<span class="org">' + esc(a.org) + '</span>' : '') + '</td>'
            + '<td class="num">' + a.rating + '</td><td>' + dc + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      + '<div class="summary">人类盲测偏好评分（Bradley-Terry），数据来自 LMArena 公开数据集（CC-BY-4.0）。</div></div>';
  }
  document.getElementById('mdList').innerHTML = html || '<div class="empty">今日暂无模型数据。</div>';
}

/* ---------- tab 懒渲染：首屏只渲染当前 tab，其余切换时按需渲染 ---------- */
const TAB_RENDER = {papers: render, models: renderModels, library: renderLibrary,
  interests: renderInterests, trending: renderTrending, x: renderX, apple: renderApple,
  deals: renderDeals, finance: renderFinance};
const TAB_DONE = {};
function ensureTab(name){
  if (!TAB_DONE[name] && TAB_RENDER[name]){ TAB_RENDER[name](); TAB_DONE[name] = 1; }
}
renderXDots();  // tab 栏小圆点不受懒渲染影响，照常初始化
const _initTab = ('' + location.hash).slice(1);
ensureTab(PANES.includes(_initTab) ? _initTab : 'papers');
showTab(_initTab || 'papers');

/* ---------- archive modal（历史归档弹窗） ---------- */
const ARCH_PREFIX = location.pathname.indexOf('/archive/') >= 0 ? '' : 'archive/';
const DIGEST_URL = ARCH_PREFIX + 'digest.json';
let archDigestCache = null;
function archItemHTML(it, open){
  const runs = (it.runs || []).map(r =>
    '<span class="run-tag">' + esc(r.name) + '</span>').join('');
  const secs = [
    ['📚 论文', it.papers, it.papers_n ? it.papers_n + ' 篇' : ''],
    ['🤖 模型追踪', it.models],
    ['🎯 兴趣追踪', it.interests],
    ['🔥 开源趋势', it.trending],
    ['👀 大佬动态', it.x],
  ];
  const body = secs.filter(s => s[1]).map(s =>
    '<div class="arch-sec"><div class="arch-sec-t">' + s[0] +
    (s[2] ? ' <span class="arch-hint">' + esc(s[2]) + '</span>' : '') +
    '</div><div class="arch-sec-b">' + md(s[1]) + '</div></div>'
  ).join('') || '<div class="empty">暂无摘要</div>';
  return '<details class="arch-item"' + (open ? ' open' : '') + '>' +
    '<summary><span class="arch-date">📅 ' + esc(it.date) + '</span>' +
    runs + '<span class="arch-hint">→</span></summary>' +
    '<div class="arch-body">' + body +
    '<a class="arch-go" href="' + ARCH_PREFIX + it.date + '.html">查看当天完整看板 →</a>' +
    '</div></details>';
}
function renderArchList(items, partial){
  const list = document.getElementById('archList');
  if (!items || !items.length){
    list.innerHTML = '<div class="empty">暂无归档</div>';
    return;
  }
  list.innerHTML =
    (partial ? '<div class="empty">本地打开为精简模式，仅显示近 7 天</div>' : '') +
    items.map((it, i) => archItemHTML(it, i === 0)).join('');
}
let archScrollY = 0;
function lockBodyScroll(){
  archScrollY = window.scrollY || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + archScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, archScrollY);
}
async function openArchive(){
  const m = document.getElementById('archModal');
  m.hidden = false;
  lockBodyScroll();
  if (archDigestCache){ renderArchList(archDigestCache.list, archDigestCache.partial); return; }
  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  unlockBodyScroll();
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
