<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月2日 星期五</div>
<h1>☀️ 每日看板</h1>
<div class="sub">论文 · 模型追踪 · 兴趣追踪 · 开源趋势 · 大佬动态 —— 每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>
</div>
</header>
<nav class="tabs" id="tabbar"><button class="tab" data-tab="papers">📚 论文 30</button><button class="tab" data-tab="models">🤖 模型追踪 23</button><button class="tab" data-tab="interests">🎯 兴趣追踪 10</button><button class="tab" data-tab="trending">🔥 开源趋势 20</button><button class="tab" data-tab="x">👀 大佬动态 69 <span class="tab-dot" id="xTabDot" hidden></span></button></nav>
<section class="tabpane" id="pane-papers">
<div class="stats">
<div class="stat"><b id="sTotal">–</b><span>收录论文</span></div>
<div class="stat"><b id="sDays">–</b><span>监测天数</span></div>
<div class="stat"><b id="sArxiv">–</b><span>arXiv 预印本</span></div>
<div class="stat"><b id="sExtra">–</b><span>其他来源</span></div>
<div class="stat"><b id="sJour">–</b><span>期刊 / 会议补录</span></div>
</div>
<div class="toolbar">
<label class="search"><span class="ico">🔍</span><input id="q" placeholder="搜索标题 / 作者 / 关键词…"></label>
<div class="chips" id="srcChips"></div>
<select class="sel" id="cat"><option value="">全部分类</option></select>
<select class="sel" id="day"><option value="">全部日期</option></select>
</div>
<div class="count" id="count"></div>

<div id="list"></div>
</section>
<section class="tabpane" id="pane-models" hidden>
<div class="sect-head"><h2>🤖 模型追踪</h2><span class="n" id="mdCount"></span></div>
<div id="mdList"></div>
</section>
<section class="tabpane" id="pane-library" hidden>
<div class="sect-head"><h2>📖 我们的论文库</h2><span class="n" id="libCount"></span></div>
<div id="libList"></div>
</section>
<section class="tabpane" id="pane-interests" hidden>
<div class="sect-head"><h2>🎯 兴趣追踪</h2><span class="n" id="intCount"></span></div>
<div id="intList"></div>
</section>
<section class="tabpane" id="pane-trending" hidden>
<div class="sect-head"><h2>🔥 开源趋势</h2><span class="n" id="trCount"></span></div>
<div class="grid" id="trList"></div>
</section>
<section class="tabpane" id="pane-x" hidden>
<div class="sect-head"><h2>👀 大佬动态</h2><span class="n" id="xCount"></span></div>
<div id="xList"></div>
</section>
<footer>COCO 每日看板 · 每天 08:00 / 12:00 / 22:00 自动更新 · <a href="archive/index.html">历史归档</a></footer>
</div>
<div class="modal" id="archModal" hidden>
<div class="modal-card" role="dialog" aria-label="历史归档">
<div class="modal-head"><h3>🗂️ 历史归档</h3><button class="modal-x" id="archClose" title="关闭">✕</button></div>
<div class="modal-list" id="archList"></div>
</div>

问全对；另做记忆诊断，发现模型会从\"通过了固定未来授权测试的有效记忆\"出发仍答错，区分了\"未来授权需要保留什么\"与\"agent 能否访问/维护/使用这些信息\"。", "supplement": false}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "category": "cs.CR, cs.AI, cs.SE（v1, 2026-09-30）", "cats": ["cs.CR", "cs.AI", "cs.SE"], "oneliner": "", "insight": "Agent 访问控制线的强邻居。它的核心问题\"批准—执行绑定完整性\"（credential-binding integrity）与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值 P(a,u)\"同属\"把授权绑定到可验证的声明而非事后信任执行\"范式：我们的 M(r) 是 chunk 与 AU 的绑定，它的 Approval Token 是批准与执行的绑定，可在 Agent 线 related work 中并列。其\"字段级验证器看不见进程层级分叉\"的负结果是一个方法论警示——对我们意味着：若未来做 Agent 线，授权证据必须绑定到实际执行语义层，而不仅是调用参数快照。它防的是授权完整性（A≠A'），我们是未授权披露（机密性），不直接竞争。写作上，它的诚实负结果段落是局限章节的范本。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "指出 coding-agent harness（Claude Code、Codex CLI、Cursor）的安全边界建立在一个未经审视的假设上：人批准的动作 A 就是 harness 实际执行的动作 A'。提出 Approval Laundering：六类在批准之后静默地把 A 替换为 A' 的失效模式（Scope、Argument、Temporal、Tool、Delegation、Semantic laundering）。通过插桩 Claude Code 的 PreToolUse 中介点做受控重复测量研究，报告 Bound-Gap Rate（含 Wilson 置信区间）。提出 Approval Token——由永不把密钥交还给 agent 的中介签发的 keyed capability Hk(principal, agent_id, session_id, tool, arguments, scope, expiry)，经 118 轮配对重放评估：完全消除 Delegation laundering，对构造的 session-identity-mismatch 消除 Temporal laundering（p<10⁻⁵），但按设计对 Scope laundering 无效、对 Argument laundering 无显著改善（p=1）——作者明确承认这两类在\"进程层级低于字段级验证器可观测\"处分叉，是诚实的负结果。", "supplement": false}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han（一作）等 4 人", "url": "https://arxiv.org/abs/2609.39450", "category": "cs.CR, cs.AI（v1, 2026-09-30）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "tool-use 授权的直接邻居，其\"授权上下文与生成上下文分离\"与我们的\"chunk 只存 M(r)、策略独立存放、查询时逐 AU 求值\"同构——都是把授权决策的输入限制在可信侧（可信用户请求 / 独立策略），不信任不可信内容（被污染 skill / chunk 文本）。它的 fail-closed 默认与我们的\"未知 AU 默认拒绝\"一致，可在 Agent 线 related work 并列引用。它的\"within-skill 注入 vs within-tool 参数篡改\"的区分对我们未来 Agent 线的威胁模型细化有参考价值。注意它防的是完整性攻击（IPI 诱导越权调用），我们是机密性（未授权披露），T1 威胁面内不竞争。它的 Reviewer 仍是 LLM 做裁决——与我们\"确定性求值\"的路线形成对照，可在 Discussion 里讨论\"LLM-as-judge 授权 vs 确定性策略求值\"的取舍。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对第三方 skill 被投毒导致 agent 工具调用越权的问题，提出 ActionGuard：在执行前一刻检查受 skill 影响的工具调用。关键设计是把目标 agent 的\"动作生成上下文\"与 safeguard 的\"授权上下文\"分离——目标 agent 仍可用原始 skill 做规划，但 Reviewer 收不到可能被污染的原始 skill 文本，而是基于可信的用户请求、平衡的 skill 画像、近期工具调用和本地脚本内容，判断每个动作是否有用户意图支撑；在 OpenClaw 的 before-tool-call 阶段拦截并执行 Reviewer 的 ALLOW/DENY，采用 fail-closed 策略。在 139 次上下文注入 + 180 次显式注入的 SKILL-INJECT 场景下，相对现有 safeguard（Dynamic Guardian、SkillGuard）ASR 降低 35.54–46.11%，相对无防护降低 70.44%，同时保持高良性任务完成率。", "supplement": false}, {"title": "ContractWarden: Kernel-Enforced Damage Boundaries for AI Agents via Human-Authorized Contracts", "authors": "Dongxu Cui（一作）等 4 人", "url": "https://arxiv.org/abs/2609.38248", "category": "cs.CR, cs.OS（v1, 2026-09-29）", "cats": ["cs.CR", "cs.OS"], "oneliner": "", "insight": "Agent 授权执行语义的硬核实例：它的\"人类批准合约 + 内核强制执行\"正是我们三种执行语义中\"确定性强制\"一极的工程实现（我们的 per-view 索引是检索侧的确定性强制，它是执行侧的）。它的 no_egress 单调传播与我们 KG 路径切割中\"权限沿派生边传播\"的思想相通，可互相引用。注意它解决的是动作副作用的损害边界（damage boundary），不是内容披露；粒度是进程/文件对象，不是 AU。它的\"模型提议、人拍板\"流程可为我们未来 Agent 线的授权 UX 提供参考。不动摇 RAG 主线 claim。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 LLM agent 的 prompt injection 或规划错误转化为操作系统副作用的问题，提出 ContractWarden：一个不信任 agent 及其策略建议的 Linux reference monitor。模型可提议三态资产合约（allow / deny / no_egress），但最终由人类拍板；执行门把合约绑定到具体任务后才允许不可信代码运行；扩展的 eBPF LSM 数据平面强制文件与网络决策，并把 no_egress 单调传播到进程、文件、管道、FIFO 和 Unix-domain socket。19 个安全测试 × 570 轮全部满足预设的返回值与副作用判据；三组文件 I/O 负载下中位开销在 VM 中 11.96–12.89%、物理机上 35.79–61.54%，低于对比的冻结 ActPlane 基线。", "supplement": false}, {"title": "Aletheia: Permission-Minimality Testing for Coding-Agent Rules", "authors": "Jieke Shi（一作）等 5 人", "url": "https://arxiv.org/abs/2609.39678", "category": "cs.CR, cs.SE（v1, 2026-09-30）", "cats": ["cs.CR", "cs.SE"], "oneliner": "", "insight": "最小权限原则在 agent 规则层的可操作化，与我们 AU 划分质量\"系统安全上界\"的论断呼应：都是\"权限粒度决定安全上界\"的实例，只是它的粒度是规则索取的权限类型，我们的是内容 AU。它的\"dispensability witness\"（缩减权限下仍通过功能测试即为可疑）是一个可借鉴的评估方法论：我们评估 AU 划分器时也可构造类似的\"权限缩减—功能保持\"对照实验。注意它针对的是规则注入（完整性），不是检索披露；314 检出是在合成攻击集上，生态效度有限。不动摇 claim，但\"最小权限可测试化\"的思路值得在 Discussion 的未来工作里提一句。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "仓库指令文件（如 CLAUDE.md 类规则）既指导 coding agent，也通过 prompt injection 暴露攻击面：恶意规则可在产出正确补丁的同时索取凭证访问或数据外传。提出 Aletheia：权限最小性测试框架——把规则索取的权限翻译成类型化语言，合成可执行的沙箱配置；在全权限与逐个剥离某一权限的独立约束下运行同一规则与任务；若在严格缩减的权限下仍通过功能测试，则得到 dispensability witness（可舍弃性证据），结合任务上下文诊断可疑索取。形式化了合成条件与 witness→强制约束的连接条件。在共享重构任务上检出全部 314 个 AIShellJack 攻击输入，5 个良性模板零误报；80 条人工验证的良性 GHAgentFiles 规则中误报 3 条（3.75%）。", "supplement": false}, {"title": "CATP: Design and Evaluation of Local Agent Authorization and Audit Evidence", "authors": "Linfeng Zhou", "url": "https://arxiv.org/abs/2609.38223", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "", "insight": "授权证据绑定（evidence binding）的细致工作，与我们的 M(r) 覆盖映射思想直接可比：我们绑定的是\"chunk—AU 覆盖关系\"，它绑定的是\"执行时策略 + 归一化动作 + 决策\"。它的核心警示——\"签名只能证明断言存在，不能证明断言与决策所用策略一致\"——对我们有直接的方法论价值：我们若在论文中主张 M(r) 的完整性，必须同样论证映射构建时所用的 AU 划分与查询时求值的策略版本一致（策略版本绑定问题），否则 M(r) 只是\"有人断言过这个映射\"。它的\"参数向量归一化后哈希相同\"的发现也提示：AU 划分的规范化必须确定，否则同一内容的不同切分会产生不可比的映射。可在 Discussion 的\"映射完整性假设\"段落引用。注意它是 agent 动作授权线，不涉及 RAG 检索。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "指出签名的授权记录只能证明\"签名者断言过什么\"，不能证明\"该断言与执行时用于决策的策略和动作一致\"。CATP 规定把本地执行前决策转化为离线可验证证据所需的绑定：hook 承诺执行时的策略与 adapter 归一化后的动作，在返回允许之前持久记录决策；后续 receipt 把记录绑定到自包含的审计导出。在 Claude Code 与 Codex 上的实现验证了这些绑定：受控的有效签名反例暴露 5 个缺失的一致性检查；另发现不同参数向量可在哈希前归一化为同一动作，限制了即使一致的 receipt 能证明什么。8 个脚本化运行时用例验证 hook 投递与允许/拒绝行为；中位成对 hook 开销约 85ms，离线验证端到端约 174ms。作者明确限定：证据以可信运行时/监视器/主机/签名密钥为条件，只认证\"关于归一化动作的决策\"，不证明执行真实性。", "supplement": false}, {"title": "NAQD Env: A benchmark for selective withdrawal in language agents", "authors": "Mohamed Abouzahra", "url": "https://arxiv.org/abs/2609.38460", "category": "cs.AI（v1, 2026-09-29）", "cats": ["cs.AI"], "oneliner": "", "insight": "撤销（revocation）语义的 benchmark，与 ResidualAuth（#1）形成\"理论—评测\"配对：ResidualAuth 回答\"需要保留什么状态\"，NAQD-Env 测量\"模型能否按授权变化正确撤回/恢复\"。它的\"区分试图违规与被放行的违规\"的指标设计值得借鉴——我们评估 retrieve-then-project 时也可区分\"模型试图引用未授权 AU\"与\"实际泄露到答案\"。注意它是合成环境、授权输入可信结构化，不证明真实遏制能力；且粒度是动作级不是 AU 级。可在 Discussion 的撤销机制段落与 ResidualAuth 一并引用（理论 + benchmark）。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "language agent 需要在证据变化、权限被撤销或收到停止指令时修正已规划动作；理想响应是选择性的：暂停受影响动作、保留未受影响的工作、修复充分后才恢复。提出 NAQD-Env 合成环境：用确定性参考策略评估这些决策，显式建模证据、授权与约束依赖；11 个依赖家族支持结构/家族/组合泛化评估；指标区分\"试图违规\"与\"被执行门放行的违规\"，联合报告策略一致性、任务价值、撤回、恢复与事件上报。三组开源指令模型 × 三种提示条件 × 350 冻结场景 = 3150 个 episode：撤回召回率最高仅 0.06，符合条件的恢复一次未发生，仅 1 个 episode 完全匹配参考策略。探索性 SFT 可把 Qwen2.5-3B 决策准确率从 0.45–0.54 提到 0.83–0.92，但也带来课程缺失后的不当撤回与事件上报丢失。", "supplement": false}, {"title": "Kill-Chain Canaries: Stage-Level Tracking of Prompt Injection Across Attack Surfaces and Five Production LLMs", "authors": "Haochuan Kevin Wang, Zechen Zhang", "url": "https://arxiv.org/abs/2603.28013", "category": "cs.CR, cs.AI, cs.LG（v4, 原 2026-03-30；本轮为更新版本重公布）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "攻击面测量的精细化方法论：四阶段 kill-chain（暴露/持久化/中继/执行）的划分与我们的 T1/T2/T3 威胁分层异曲同工——都是\"攻击成功不是二值的，要看泄露走到了哪一层\"。它的\"canary token 追踪\"技术可直接借鉴：我们评估 embedding 通道泄露时，也可用 canary 式标记追踪机密 AU 片段经过检索→重排→生成的完整路径，而不仅是最终答案是否泄露。它的\"中继注入更难拒绝\"发现提示我们：retrieve-then-project 裁剪后的残留片段若被模型复述转写，可能构成类似的\"中继\"泄露通道，值得在投影语义的失败分析里讨论。注意它是 IPI 攻击测量，不是访问控制机制；v4 是旧工作的更新。关联为 adjacent，方法论启迪为主。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "github.com/KevinChunye/prompt_injection (★2)", "zh_abs": "针对\"prompt injection 抗性通常只报一个成功率数字\"的问题，提出 kill-chain canary 方法：在每个注入载荷中植入唯一 token，记录它到达四个阶段（Exposed→Persisted→Relayed→Executed）中的最远处；950 轮、5 个生产级 LLM、6 个攻击面、5 种防御条件。调用了工具的轮次中暴露率 100%，差异在下游：Claude Haiku 4.5 / Sonnet 4.5 在 164 次文本面攻击中零执行，文本中继里 canary 从未出现在记忆写入中（0/40）；GPT-4o-mini 执行了 53%。四个发现：(1) Claude writer 在所有中继轮次中把 canary 挡在共享记忆之外，跨模型配对（Claude 写、GPT-4o-mini 读，n=3）下似能保护读者；(2) Claude 对预置记忆注入 0/40，但 Haiku 4.5 执行了 2/3 个经 GPT-4o-mini 中继的注入——中继注入是否更难拒绝仍是开放问题；(3) DeepSeek Chat 在预置记忆上 0/24、在工具结果上 8/8，渲染不可见的白字 PDF 载荷至少与可见载荷一样有效；(4) pi_detector/write_filter 在不检查的通道上失效，spotlighting 在被包裹内容上失效。代码与运行日志已公开。", "supplement": false}, {"title": "Runtime Policy Firewall: A Zero-Trust Governance Layer for Enterprise Agentic AI", "authors": "Swapneswar Ray", "url": "https://doi.org/10.63412/16ctyp82", "category": "International Journal of Global Innovations and Solutions (IJGIS)（OpenAlex 收录）", "cats": [], "oneliner": "", "insight": "关联较弱。这是一篇概念性/框架性综述，发表在不知名期刊（IJGIS），无实证评估；其\"运行时策略执行\"的呼吁方向正确，但颗粒度停留在原则层面，没有可借鉴的机制或可引用的数据。唯一价值是作为\"企业侧对 agent 运行时授权有真实需求\"的佐证性引用（如需说明动机）。不建议在 related work 中实质引用；我们的三种执行语义已比它具体得多。不动摇任何 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex 无引用记录）", "code": "无", "zh_abs": "面向企业级 agentic AI 的运行时治理：当 agent 从被动问答转向自主执行（分解目标、检索业务上下文、调工具、改记录、发消息、发起交易、跨系统编排），组织需要治理的不仅是\"它说了什么\"，更是\"它在运行时做了什么\"。主张零信任运行时控制平面，覆盖检索增强生成、reasoning-action 循环、工具使用与基础模型治理；梳理 prompt injection、间接指令攻击、数据泄露、工具滥用等已知风险，提出把策略执行点下沉到运行时的治理层设计。", "supplement": false}, {"title": "Security of The Model Context Protocol Ecosystem: Emerging Threats, Empirical Attack Evidence, Trust and Authorization Failures, Supply-Chain Risks, And Defensive Strategies", "authors": "Khalid D. Muhammed, David Chinonso Anih", "url": "https://doi.org/10.64388/irev10i3-1723420", "category": "Iconic Research and Engineering Journals（OpenAlex 收录，2020–2026 文献综述）", "cats": [], "oneliner": "", "insight": "关联较弱，定位是文献地图而非机制创新。发表在不知名期刊（Iconic Research and Engineering Journals），综述深度与引用规范性需打折；但作为 MCP 攻击面的\"一站式威胁清单\"，在我们未来 Agent 线的威胁模型写作时可做背景引用（tool discovery / delegated authority / supply chain 三类风险划分可直接借用）。对 RAG 主线无直接启迪：MCP 是工具调用通道，不涉及检索内容授权或 embedding 通道。不动摇 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex 无引用记录）", "code": "无", "zh_abs": "MCP 生态安全综述：MCP 把 LLM 变成能发现工具、访问资源、处理信息、在外部环境执行的 agent，但也引入了语义信息、委托授权、软件依赖与运行时能力交织的安全面。基于 2020–2026 年同行评审文献（侧重 2025–2026 实证证据），系统梳理 MCP 架构与信任边界、工具发现与选择、授权（authorization）与信任失效、供应链风险及防御策略。", "supplement": false}]}, {"date": "2026-10-01", "summary": "今日 arXiv 六个分类 26 篇关键词命中（去重后 24 篇新，2 篇昨日已报），扩展来源 18 篇候选中剔除噪声后 1 篇入选；Jev 初筛保留 13 篇，人工终判入选 **7 篇**（5 篇 direct、2 篇 adjacent）。最值得关注的是 **Audience-Bound Persistent Memory（2609.36373）**——首个把\"授权先于上下文组装\"做成 sound + policy-complete 的准入机制的工作：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，在 10,000 个多方对话历史的前瞻性确认中**零违规项进入上下文**，而无作用域检索 82% 的上下文暴露了禁用项；这与我们的\"查询时逐 AU 求值\"哲学同构，是 RAG 主线 related work 的直接对照。其次是 **ToolFence（2609.37196）**——面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行、judge 只做 capability-level 授权而非逐调用裁决，在 AgentDojo 上把 ASR 压到**近零**且 clean utility 仅降 3.8pp，是 Agent 访问控制线的直接邻居。**Boundary-State Control（2609.37475）** 补上了授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 proposal-to-commit 间隙，与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"的呼应。跨领域对照 **Don't Show What They Can't See**（ResearchSquare 预印本）把授权执行点放在 text-to-SQL 的 schema 组装之前，240 个 question-role 对上把 schema 暴露从 35.5 降到 **0**，是我们 per-view 索引思想在结构化领域的实例。", "papers": [{"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "这是\"授权先于组装\"范式最完整的形式化：sound + policy-complete 的 admission、靠排除而非模型行为执行——与我们的\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照。它的派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照：他们选了保守的抑制，我们给了裁剪选项，可在 Discussion 里对比两种选择的代价。它的\"audience 扩大需显式对象特定授权\"可为我们 Discussion 的 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience，不是 AU 级内容划分；威胁面仍在 T1/T2 内，未涉及 embedding 通道。不动摇我们的 claim，但给\"授权前置\"提供了可引用的形式化邻居。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究个人 agent 跨私密/共享对话的记忆授权问题：每个记忆项携带记录时的在场 audience；派生项按 audience 划分、取其来源 audience 的交集，或被抑制；audience 的扩大只能通过显式的、对象特定的授权；记忆项进入模型上下文的前提是当前所有 viewer 都属于其授权 audience，否则 fail-closed 到仅公开。在显式身份、provenance、完全中介三假设下，该准入机制对\"精确组装出的上下文\"是 sound 且 policy-complete 的，且靠排除（exclusion）而非模型行为来执行。在 10,000 个多方历史的前瞻性冻结确认中，零禁用项进入上下文，而无作用域检索 82% 的上下文暴露了禁用项；授权召回与策略等价基线完全一致，且 Recall@5 超出无作用域检索 0.30（Holm 确认）。", "supplement": false}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li（一作）等 4 人", "url": "https://arxiv.org/abs/2609.37196", "category": "cs.CR, cs.AI（v1, 2026-09-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "Agent 访问控制线的直接邻居。它的\"provenance-aware authorization\"（按来源区分授权值与不可信观测）与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构——都是把授权绑定到数据来源而非事后管控内容，可在 Agent 线 related work 中并列引用。它的架构选择（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；其授权粒度权衡（capability 级而非逐调用）与我们的 AU 粒度选择可对比讨论。注意它防的是 IPI（完整性轴），我们是未授权披露（机密性轴），不直接竞争。它的 within-tool 攻击定义对我们未来 Agent 线的威胁模型有参考价值。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 tool-using agent 的间接提示注入问题，提出 ToolFence：执行前编译一份 typed authorization blueprint（授权蓝图），由确定性 monitor 强制执行；当蓝图不完备时，judge 只负责授予新的 capability，而非逐个裁决具体调用。关键有二：细粒度的 provenance-aware 授权能区分用户授权的值与不可信观测值，从而堵住 within-tool 攻击（保留原定工具但篡改其参数）；确定性快路径 + capability 级运行时授权大幅减少昂贵的 judge 调用。在 AgentDojo（Qwen3-max）上整体 ASR 降至近零，clean utility 仅下降 3.8pp，开销实际可用。", "supplement": false}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "", "insight": "直接补上我们威胁模型的时间维度，与昨日 Residual Authority Replay（授权残留攻击）形成\"攻击揭示—机制修复\"的呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 则给出\"单次 commit 授权绑定授权状态语义投影\"的具体修复机制。它的形式化可为我们 Discussion 的 revocation / time-bounded authorization 段落提供引用。它的诚实局限写作（25% vs 0%，主动限定 scope）是局限段落的范本。注意其粒度是动作级 commit，不是内容级 AU；不涉及 T2 embedding 通道。不动摇现有 claim，反而加强我们\"查询时无状态求值\"设计的论证链。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究 tool-using agent 的 proposal-to-commit 间隙：agent 判定某动作可执行，但执行时安全相关状态已发生变化。提出 BSC-R，一种确定性的 effect-boundary 机制，把单次使用的 commit 授权绑定到精确的动作本身以及\"授权状态的语义投影\"。在 2,847 个被攻击的 AgentDojo episode 上，边界内核完整保留未保护 agent 的行为（utility 80.576%，ASR 1.616%）；在 10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类预设的变更/重放类；在独立的 boundary-drift 实验中 4,403 个无效上下文零提交、5,899 个有效上下文全保留。作者诚实报告了局限：在更广泛的外部攻击套件上 BSC-R 仍有 25% 的无效 effect 提交率（CONTINUITY 套件上为 0%），因此定位为有作用域的 commit-time 一致性机制，而非通用 agent 安全方案。", "supplement": false}, {"title": "Don't Show What They Can't See: Authorization-First Schema Context for Secure Text-to-SQL", "authors": "Jianan Jiang（一作）等 6 人", "url": "https://doi.org/10.21203/rs.3.rs-10905100/v1", "category": "Research Square 预印本（2026-09-28）", "cats": [], "oneliner": "", "insight": "细粒度访问控制的跨领域实例，与我们 RU/AU 解耦形成直接对照：他们把授权执行点放在\"schema 上下文组装之前\"（本质是 per-view 思想在结构化领域的实例——只让模型看到授权视图），我们是检索后投影（retrieve-then-project）。它的\"provenance-aware permission inheritance\"（派生制品继承权限）与我们 KG 路径切割中\"派生事实的权限归属\"问题同构，可互相引用。可在 Related Work 里写一节跨领域对照（text-to-SQL schema vs RAG 非结构化文本）。注意这是 ResearchSquare 预印本（非同行评审），引用时需标注；领域是结构化 schema，未涉及 embedding 通道。不动摇 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex cited_by_count=0）", "code": "无", "zh_abs": "针对企业级 text-to-SQL 中 schema 元数据本身敏感的问题，提出 authorization-first 的 schema 上下文构造框架：表/列/关系级的授权在 relevance retrieval 之前强制执行，未授权对象永不进入低信任的检索、重排或生成组件；provenance-aware 的权限继承把保护延伸到派生制品（语义描述、join hint、SQL 示例）；在授权子空间内做权限安全的语义增强，并用 satisfiability gate 实现不泄露的弃答。在含 240 个 question-role 对、20 个数据库、4 个权限层级的 access-control-augmented Spider benchmark 上，process-level schema 暴露从每请求 35.5 个未授权对象降到 0，任务精度保持不变。", "supplement": false}, {"title": "VeriWeave Govern: Evidence-Gated Deterministic Runtime Governance for Enterprise AI Agents", "authors": "Kabeh Mohsenzadegan（一作）等 3 人", "url": "https://arxiv.org/abs/2609.37457", "category": "cs.AI, cs.CY, cs.MA, cs.SE（v1, 2026-09-26）", "cats": ["cs.AI", "cs.CY", "cs.MA", "cs.SE"], "oneliner": "", "insight": "关联中等。它的\"temporal policy evolution\"（时序策略演化）与可重放审计状态，与我们的\"策略独立存放、撤销机制\"有概念交集，可为 Discussion 的策略版本化段落提供一个引用点。但它是企业级治理框架（动作授权 + 人工审查 + 合规），不是内容级细粒度披露控制，与我们的 AU 级 claim 不竞争、不互补。它的 60k 用例 benchmark 方法论（多 seed、OOD、时序演化三轴）对我们未来 Agent 线 benchmark 设计有参考价值。列入仅为不漏检。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "面向企业 agent 的确定性运行时治理层：把动作生成与动作授权分离，用版本化策略评估结构化 agent 动作，校验 typed evidence，固定 deny > review > allow 优先级，把高后果动作路由给可问责的人工审查，并记录可重放、防篡改的审计状态。自建的 GovernBench（30 seeds、60,000 oracle 标注用例、5 个企业域、含对抗 evidence、OOD 动作、时序策略演化）上达到 0.9888 准确率、macro-F1 0.9836，零 false allow，零治理攻击成功率；消融显示 evidence gating、deny 优先、OOD fail-safe、人工审查、矛盾处理、时序重放各有互补贡献；另有 150 例欧盟/奥地利法规 grounded 的双盲人工评估。", "supplement": false}, {"title": "Same Bytes, Different Authority: Reserved-Token Representations in Chat-Template Prompt Injection", "authors": "Yan Zhan（一作）等 6 人", "url": "https://arxiv.org/abs/2609.35932", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱（完整性轴）。唯一值得记录的是它的核心发现：authority 可以编码在单个 token 的 learned representation 里——\"表示即权限信号\"。这与我们的 embedding 通道泄露有松散类比：两者都说明向量表示层会携带超出文本本身的权限相关信息，而文本级防御对此盲区。不能作为我们 A1 结论的证据引用，但可在 Discussion 里提一句\"表示层权限信号\"的开放问题。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "发现伪造的 chat-template 标记既可以作为单个 reserved control token、也可以作为普通 subword 序列到达模型（文本完全相同），而\"谁来决定用哪种编码\"的是防御方而非攻击方。把伪造标记编码为 subword（文本不变）可使 InjecAgent 上的攻击成功率下降 39–66pp（4 个开源家族中的 3 个），且差距延续到 AgentDojo 多轮任务。机制上，authority 位于 marker 位置的单个 learned vector：marker 的 subword 向量均值无法复现该 authority，而最近邻普通 token 的向量可在 Llama-3.1 上恢复攻击；自适应攻击者在 3/4 家族上能找到这样的 embedding 邻居。检查 400 个最受欢迎 chat 模型中的 67 种 tokenizer 配置，发现 33 种的标准缓解措施（把 special token 编码为普通 subword）对此类标记无效。", "supplement": false}, {"title": "Calibrating One-Round Membership Inference with Neighbors", "authors": "Francesco Rita（一作）、Jie Zhang、Florian Tramèr", "url": "https://arxiv.org/abs/2609.36331", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱。方法论上与我们 A2（单模型、top-1 分数 MI，无 reference model）同属 one-round 范式；neighbor calibration 思路可为 A2 的信号校准提供一个备选方案。但领域是图像分类器，离我们的 embedding 侧信道很远，不提供可直接引用的数字或结论。注意昨日 #9（Near-Duplicate MI）已警示 MI 阳性证据的系统性高估问题，本文的方法若用于 A2 同样需要该警示。列入仅为方法论备查。\n---", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "SOTA 的成员推断（MI）靠 reference model 对每个样本单独校准信号，但大模型训练成本使该范式难以扩展；one-round 设定（只有一个已训练模型）下逐样本校准无法估计，信号变弱。本文提出用目标点的邻居样本恢复校准：reference model 的作用只是揭示\"未见过该样本的模型会如何表现\"，而在目标模型上查询邻近样本能得到同样的信息；两种互补的邻居构造方式，叠加早期训练 checkpoint 查询可进一步增强信号。在 3 个图像分类数据集、3 种训练配置上达到与 reference-model 方法可比的攻击效果，且零额外训练成本。", "supplement": false}]}, {"date": "2026-09-30", "summary": "今日 arXiv 六个分类共 50 篇去重命中（含 22 篇 new），精选 12 篇 v1 新论文 + 1 篇期刊补录。最值得关注的是 **CoSec（2609.34790）**——首个面向多用户/多社区 agent 系统的 authorization benchmark，把\"授权状态\"作为执行期验证的一等对象，与我们的\"查询时逐 AU 求值\"思路同构，是 Agent 访问控制线的直接邻居；以及 **Residual Authority Replay（2609.33910）**——揭示授权决策\"有效期\"本身就是攻击面（ASR 最高 +35.1pp），反向论证了我们\"策略独立存放、查询时无状态求值\"设计的合理性，可直接写入 Discussion 的 revocation 段落。另有 **Authorization Closure Graph（2609.32428）** 给撤销/策略变更的形式化提供了雏形，**BMA（2609.32186）** 的\"provenance-bound authorization 远胜 memory-side controls\"（2.0% vs 11.0%）是我们绑定与执行语义的外部实证。RAG 主线的新攻击 **LENS（2609.35155）** 属于完整性轴而非机密性轴，与我们的威胁模型正交，但应在 Related Work 中提及以界定 scope。", "papers": [{"title": "CoSec: Benchmarking Agent Security in Communities", "authors": "Hao Chen（一作）等 15 人", "url": "https://arxiv.org/abs/2609.34790", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "首个可执行的 agent 社区安全 benchmark，208 个场景覆盖固定/演化边界，用执行轨迹对照\"活跃授权状态\"验证信息流是否越权。", "insight": "这是我们 Agent 访问控制线最直接的邻居工作。它的核心发现——\"task utility 不蕴含 authorization compliance\"——正是我们整篇论文的动机句式，可直接引用。方法论上，它把 authorization state 作为执行期验证对象，与我们的\"查询时逐 AU 求值 P(a,u)\"同构；其场景设计（跨社区、演化边界）可作为我们未来 Agent 线 benchmark 的起点。注意它测的是 agent 系统整体而非 RAG 检索层，不与我们的 claim 直接竞争，定位是 related work + 动机证据。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "When Consent Outlives Context: Residual Authority Replay in Long-Lived Agents", "authors": "Zhihao Zhang（一作）等", "url": "https://arxiv.org/abs/2609.33910", "category": "cs.AI（v1, 2026-09-27）", "cats": ["cs.AI"], "oneliner": "揭示 long-lived agent 中\"授权残留\"攻击：良性交互合法获得的授权在后续对抗执行中被重放，6 个 LLM 家族上 ASR 最高提升 35.1pp。", "insight": "这是我们威胁模型缺失的一维：授权决策的有效期/上下文绑定。我们的框架目前是查询时无状态求值 P(a,u)，这篇文章反向证明了\"把授权结论持久化（缓存、记忆）而不绑定上下文\"必然产生残留授权攻击面——这恰好论证了我们\"策略独立存放、chunk 不存密级结论\"设计的正确性。建议写入 Discussion 的 revocation / time-bounded authorization 段落，并作为 Agent 线 threat model 的新增攻击范式（纵向攻击：先合法取权、后重放）。不动摇现有 claim，反而加强设计合理性。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Authorization Closure Graph: Minimal Repair for LLM Agents with Evolving User Instructions", "authors": "Qingzhuo Wang（一作）等", "url": "https://arxiv.org/abs/2609.32428", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "把授权及其依赖表示为演化的版本化状态（ACG），指令变更时只选择性失效受影响的授权并计算 minimal repair。", "insight": "这是我们 Discussion 未来工作\"撤销机制\"的最接近的形式化雏形：策略/指令变更时，哪些授权失效需要精确计算而非全量重算。它的 minimal repair 思路可直接引用为 related work。但注意其粒度是\"指令级动作授权\"，未涉及内容级细粒度授权（我们的 AU 级）；可作为对比点——我们是 per-query per-AU 求值，他们是 per-instruction 状态维护。威胁面不超出我们的 T1/T2/T3，但补充了时间维度的授权一致性问题。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "BMA: Backchain Memory Attacks Create Unauthorized Control Paths in LLM Agents", "authors": "Kaisheng Fan（一作）等", "url": "https://arxiv.org/abs/2609.32186", "category": "cs.CR（v1, 2026-09-26）", "cats": ["cs.CR"], "oneliner": "攻击者不写记忆、不改任务，仅编辑低信任证据，经记忆固化后在干净任务中被检索并驱动受保护动作；provenance-bound authorization 将攻击成功率压到 2.0%，远胜 memory-side controls 的 11.0%。", "insight": "这是对我们\"绑定与执行语义\"核心设计最有力的外部证据：事后管控记忆（memory-side controls）远不如按来源绑定授权（provenance-bound authorization）——与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构，可在论文中引用为设计选择的实证支撑。方法论上，它的 Path-CASR（registered pathway + matched-intervention checks，区分记忆介导命中与巧合命中）值得借鉴：我们的 A1 cloze 评估同样需要区分\"真实泄露\"与\"标注缺口/巧合命中\"。对 RAG 主线，持久化记忆通道 ≈ 我们的 embedding 通道（持久化表示泄露），类比成立。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "LENS: The Sum Is Worse Than the Parts for Set-Level Poisoning in Retrieval-Augmented Generation", "authors": "Kaisheng Fan（一作）等（与 BMA 同一团队）", "url": "https://arxiv.org/abs/2609.35155", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "形式化 RAG 的 set-level compositional poisoning：单个文档各自无害、合在一起才把 RAG 输出带偏到目标答案（full-set ASR 0.852，任一真子集 ≤0.069）。", "insight": "诚实地说，这是与我们正交的轴：LENS 是完整性（integrity）攻击，我们的威胁模型是机密性（未授权披露）。它不在我们的 T1/T2/T3 之外，而是不在同一维度。但应在 Related Work 中引用以完整界定 RAG 攻击面、明确我们的 scope 限定在访问控制/披露风险。方法论可借鉴：它的\"真子集不足\"形式化定义与 counterexample-guided repair 构造方式，可类比用于设计针对我们 projection 机制的组合式压力测试（多个各自合规的 AU 组合后是否泄露）。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "RAISE: Reinforcing Access Control Policy Synthesis in LLMs via Symbolic Evaluation", "authors": "Yingming Zhou（一作）等", "url": "https://arxiv.org/abs/2609.33796", "category": "cs.SE, cs.CR, cs.LG（v1, 2026-09-27）", "cats": ["cs.SE", "cs.CR", "cs.LG"], "oneliner": "构建 CedarInstruct（5,800 场景 / 44 领域，首个支持可验证 Cedar 策略合成的数据集），并用 verifier 信号做两阶段训练（SFT + off-context GRPO）提升策略语义正确率。", "insight": "我们的\"策略独立存放\"一直缺一个具体的策略语言实例；Cedar（AWS 开源策略语言）是现成候选，CedarInstruct 给了策略合成的可验证 benchmark——我们若要做 end-to-end demo，策略层可直接用 Cedar，评估可用 CedarBench。这是工程实现层的相关工作，不涉及检索/披露威胁面，不动摇安全 claim。它的训练发现（verifier signal 的用法比用量更重要）对我们无直接影响。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Certified Multi-Source Integrity for Structured Agent Actions", "authors": "Anmol Pandey（一作）等", "url": "https://arxiv.org/abs/2609.34245", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "在 corruption budget 下给出\"最大可用\"的安全认证器：动作的每个字段必须通过其证据结构支持的规则（corruption-distinct 证据类的 minimum hitting set 计数），否则拒绝执行。", "insight": "防御思路可借鉴但轴不同：它是完整性认证（字段值是否被污染），我们是机密性（未授权内容是否披露）。其\"corruption-distinct 证据类 / minimum hitting set\"形式化与我们的 KG 路径切割有类比价值——都是把\"证据独立性\"变成图/集合上的计数问题。它的实证发现（genuine corroboration 是少数现象；naive attestation counting 高估独立性）对我们的 NLI 残留检查是个警示：看似独立的公开证据可能共享上游来源。关联中等，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Policy-Conditioned Constrained Decoding for Column-Level Access Control in Text-to-SQL", "authors": "Ryoto Miyamoto（一作）等", "url": "https://arxiv.org/abs/2607.12341", "category": "cs.CL, cs.CR, cs.DB", "cats": ["cs.CL", "cs.CR", "cs.DB"], "oneliner": "把列级使用策略编译进解码器的 per-token logits mask，单次解码确定性消除列误用，在 Spider-CU 上达到 0% 泄露率。", "insight": "这是细粒度访问控制在 text-to-SQL 的实例，与我们的 AU 级控制形成跨领域对照：他们把策略执行点放在生成时（enforcement at generation），我们放在检索后（enforcement at retrieval / retrieve-then-project）——两种\"策略执行点\"设计的对比可在 Related Work 里写一节。它的\"column-use policy 按语义使用区分（output/filter/aggregation）\"提示我们的 P(a,u) 也可按\"使用方式\"（直接引用 vs 仅作排序信号）区分授权语义，这是个可探索的新问题。确定性零泄露的实证与我们的\"直接零泄露\"安全目标呼应。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Near-Duplicate Families Break Exact-Record Membership Inference", "authors": "Yiyong Liu（一作）等", "url": "https://arxiv.org/abs/2609.33909", "category": "cs.CR（v1, 2026-09-27）", "cats": ["cs.CR"], "oneliner": "证明标准 MI 在近似重复家族存在时系统性误判：CC-News 上 clean-reference LiRA 把 99.70% 的\"家族在场但精确记录不在\"的样本判为成员。", "insight": "直接相关：我们的 A2 成员推断评估（top-1 分数 AUROC 0.655→0.484）用的正是这类 MI 方法论。这篇文章说明 MI 阳性证据可能只是 family-level exposure——我们\"残余 4.05% 为标注缺口通道\"的结论需要更谨慎的表述，残余命中里可能混有近似重复而非真实机密。建议在论文 limitations 里引用：MI-based 泄露度量本身有系统性高估风险。好消息是 89.4%→4.05% 的量级差远大于此混杂，不动摇主要 claim，但要求我们对 A2 数字的表述更诚实。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Silent Failures in Agentic Security Evaluation: A Validated Harness for Tool-Call Mediation Under Indirect Prompt Injection", "authors": "Animesh Shaw", "url": "https://arxiv.org/abs/2609.32691", "category": "cs.CR, cs.LG（v1, 2026-09-26）", "cats": ["cs.CR", "cs.LG"], "oneliner": "审计 IPI benchmark 的评估工具链，找出四类\"沉默缺陷\"（如按工具身份而非参数计分可把 ASR 从 1.2% 虚报为 21.7%），并发布了使缺陷不可表示的 harness。", "insight": "方法论警示，直接相关。我们的对抗评估 A1（cloze 89.4%→4.05%）和 A2（AUROC 0.655→0.484）必须自查这四类缺陷——特别是\"攻击成功按检索命中而非实际披露内容计分\"（类比 tool-identity vs argument-level scoring）。建议在 THREAT_MODEL.md 或论文附录加一段 evaluation-validity 自查说明。这是诚实局限写作的范本；不提供新攻击面，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "API Secrets Should Never Become Tokens in the LLM's Vocabulary", "authors": "Patrick Kenney（一作）等", "url": "https://arxiv.org/abs/2609.33371", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-27）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "形式化 agent 系统中 API 凭证暴露的威胁链，评估 vault-mediated 执行边界（模型只选 connector 标识，凭证由可信边界注入）。", "insight": "关联较弱。主题是 agent 系统的凭证卫生，不是 RAG 内容访问控制。唯一可借鉴的是\"执行边界\"思想：敏感材料（对我们是未授权 AU 内容，对他们是 API key）不应进入模型可观测的数据管道——与我们的 retrieve-then-project 在哲学上一致，可在 Discussion 里一笔带过。Agent 线相关度高于 RAG 主线。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "CoDeL: Co-Evolutionary Defense against Indirect Prompt Injection in LLM-based Agents", "authors": "Xiao Yang（一作）等", "url": "https://arxiv.org/abs/2609.34463", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "防御者与攻击探测器协同进化的 IPI 训练式防御，在三个 benchmark 上把 ASR 降低 88.5%。", "insight": "关联较弱。IPI 防御属于完整性轴，与我们的访问控制（机密性轴）正交；训练式防御思路对我们的声明式策略框架无直接借鉴。列入仅为不漏检。\n---", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Permission-Aware RAG: Identity and Access Management (IAM)-Based Access Filtering in Multi-Resource Environments", "authors": "Jooyoung Jeong", "url": "https://doi.org/10.1109/access.2025.3628960", "category": "期刊", "cats": [], "oneliner": "这是与我们最直接对照的\"权限感知 RAG\"工作（IAM-based access filtering）；需精读全文判断它是 chunk 级继承过滤还是投影", "insight": "这是与我们最直接对照的\"权限感知 RAG\"工作（IAM-based access filtering）；需精读全文判断它是 chunk 级继承过滤还是投影", "supplement": true, "source": "期刊补录", "citations": "", "code": "", "zh_abs": ""}]}], "total": 30, "n_days": 3, "all_total": 30, "all_days": 3};

mall businesses are putting AI agents to work. And through a new partnership with @ASBDC, we're bringing hands-on AI training and local guidance to help more owners get started.\n\nhttps://openai.com/index/helping-small-businesses-put-ai-to-work/", "created_at": "10-01 03:04", "likes": 1655, "reposts": 93, "replies": 262, "views": 242173, "url": "https://x.com/OpenAI/status/2105373267171438779", "author": "OpenAI"}, {"id": "2104993966043320759", "text": "This is Ultrafast.\n\nOur premium speed tier, Ultrafast offers up to 8x faster token generation (300 tokens per second) in Codex and up to 6x in the API.", "created_at": "09-30 01:57", "likes": 7177, "reposts": 317, "replies": 430, "views": 1245425, "url": "https://x.com/OpenAI/status/2104993966043320759", "author": "OpenAI"}, {"id": "2104993967985381673", "text": "Ultrafast is available today for GPT-6 Astra in Codex, ChatGPT Work, and the API, with GPT-6.1 Sol coming soon.\n\nTo access it in Codex and ChatGPT Work, we’re introducing Pro 500—a new plan with our highest usage limits (25x Plus) and access to Ultrafast.\n\nhttps://chatgpt.com/pricing", "created_at": "09-30 01:57", "likes": 1059, "reposts": 48, "replies": 126, "views": 271314, "url": "https://x.com/OpenAI/status/2104993967985381673", "author": "OpenAI"}, {"id": "2104993969486930015", "text": "We’re also reopening Pro 200 subscriptions, with continued access to frontier models like Astra, including our new GPT-6.1 Sol model which brings near-Astra capabilities to a model you can use every day.\n\nOur commitment is that your subscription will continue to help you get more work done with an increasing level of quality.\n\nWe are also committing to not reintroducing the 5hr limit so that you can fully use your weekly usage when you want.", "created_at": "09-30 01:57", "likes": 426, "reposts": 17, "replies": 39, "views": 126111, "url": "https://x.com/OpenAI/status/2104993969486930015", "author": "OpenAI"}, {"id": "2104987422308335828", "text": "Codex Security Cloud is getting a major upgrade, with access to cyber-capable models through Daybreak Blue included by default.\n\nIt scans entire GitHub repos, continuously reviews new commits, investigates and deduplicates findings, and prepares fixes for review – even when your laptop is closed.\n\nAvailable as a plugin in Codex desktop and web.", "created_at": "09-30 01:31", "likes": 4383, "reposts": 306, "replies": 230, "views": 532961, "url": "https://x.com/OpenAI/status/2104987422308335828", "author": "OpenAI"}, {"id": "2104986136745767160", "text": "GPT-6.1 Sol is available starting today to all Plus, Pro, Business, Enterprise, and Edu users in ChatGPT Work and Codex.\n\nhttps://openai.com/index/introducing-gpt-6-1-sol", "created_at": "09-30 01:26", "likes": 791, "reposts": 46, "replies": 32, "views": 134037, "url": "https://x.com/OpenAI/status/2104986136745767160", "author": "OpenAI"}, {"id": "2104986135005192665", "text": "GPT-6.1 Sol shows major improvements over GPT-6 Sol in our alignment evaluations, bringing it more in line with GPT-6 Astra. \n\nIt’s more transparent about its limitations and more reliable at respecting user intent and safety constraints.", "created_at": "09-30 01:26", "likes": 740, "reposts": 20, "replies": 22, "views": 136047, "url": "https://x.com/OpenAI/status/2104986135005192665", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2105739098640298253", "text": "You should be able to use your AI subscription wherever you need:", "created_at": "10-02 03:18", "likes": 2490, "reposts": 91, "replies": 306, "views": 424324, "url": "https://x.com/sama/status/2105739098640298253", "author": "sama"}, {"id": "2105688354834756036", "text": "Also, 6.1 Sol was our fastest-growing model ever, and was a bit slow under load. Should be much better now!", "created_at": "10-01 23:56", "likes": 9137, "reposts": 260, "replies": 767, "views": 465832, "url": "https://x.com/sama/status/2105688354834756036", "author": "sama"}, {"id": "2105687922234237364", "text": "I think there is much more potential energy in Sign In With ChatGPT/Plugin Extensions than we realize", "created_at": "10-01 23:54", "likes": 1077, "reposts": 41, "replies": 142, "views": 99670, "url": "https://x.com/sama/status/2105687922234237364", "author": "sama"}, {"id": "2105687689991483654", "text": "DevDay was really fun, the builder energy was crazy\n\nStill wild to me to see people making whole startups in a day", "created_at": "10-01 23:54", "likes": 3299, "reposts": 103, "replies": 455, "views": 280137, "url": "https://x.com/sama/status/2105687689991483654", "author": "sama"}, {"id": "2104995014208258235", "text": "Dots are here!\n\nA new way to use AI that works 24/7 for you; get more of your time and attention back to work at a higher level.\n\nhttps://openai.com/index/introducing-dots/", "created_at": "09-30 02:01", "likes": 14659, "reposts": 1068, "replies": 2109, "views": 1938496, "url": "https://x.com/sama/status/2104995014208258235", "author": "sama"}, {"id": "2104994601140711896", "text": "Ultrafast is\n\nso fast\n\nI do not ever want to go back", "created_at": "09-30 01:59", "likes": 12018, "reposts": 286, "replies": 1358, "views": 1121135, "url": "https://x.com/sama/status/2104994601140711896", "author": "sama"}, {"id": "2104994395980533804", "text": "6.1 Sol at 1/5th of the price of Astra, and 95% cache read discount! Extremely capable model.", "created_at": "09-30 01:59", "likes": 8414, "reposts": 284, "replies": 577, "views": 759271, "url": "https://x.com/sama/status/2104994395980533804", "author": "sama"}, {"id": "2104993363170861501", "text": "Over the past 5 weeks, the team completely rewrote ChatGPT Web on top of the desktop app codebase.\n\nThis was only possible with Astra, and it’s why Dots, Space, Codex Cloud, and so many more of our launches will come to web and desktop same day. \n\nEra of the megaproject begins.", "created_at": "09-30 01:55", "likes": 2527, "reposts": 99, "replies": 171, "views": 375515, "url": "https://x.com/ajambrosino/status/2104993363170861501", "author": "ajambrosino"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2105727933579137159", "text": "@vigyso Good thread on details of Sign in with ChatGPT and how the subscription can be used in my partner products", "created_at": "10-02 02:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105727933579137159", "author": "thsottiaux"}, {"id": "2105718931235508277", "text": "@midotalks He gets it", "created_at": "10-02 01:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105718931235508277", "author": "thsottiaux"}, {"id": "2105708732323909827", "text": "dots demo. Now... with better WiFi.", "created_at": "10-02 00:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105708732323909827", "author": "OpenAIDevs"}, {"id": "2105689002905153761", "text": "@rileybrown Love it thank you", "created_at": "10-01 23:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105689002905153761", "author": "thsottiaux"}, {"id": "2105689875655897093", "text": "@The_Alex We’re going to fix this but it’s a bit funny as your dot literally has to decide whether to pick up or not and sometimes it might just be busy with something else 👀", "created_at": "10-01 23:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105689875655897093", "author": "thsottiaux"}, {"id": "2105670256094326849", "text": "@_simonsmith We built dots to help get real work done. Lots to come that will improve them further over the days and weeks.", "created_at": "10-01 22:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105670256094326849", "author": "thsottiaux"}, {"id": "2105672058269212820", "text": "Because usage on your primary dot is virtually unlimited at the moment, I can’t really give a reset. I need to come up with something new fast.", "created_at": "10-01 22:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105672058269212820", "author": "thsottiaux"}, {"id": "2105519215092584786", "text": "One more thing, you can now build and deploy MCP servers right through ChatGPT. And restrict its access to anyone you want or share it with the world.", "created_at": "10-01 12:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105519215092584786", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2105782784426119357", "text": "Submissions close in 2 days, October 3 at 2:30 PM PT.", "created_at": "10-02 06:11", "likes": 14, "reposts": 0, "replies": 0, "views": 5096, "url": "https://x.com/OpenAIDevs/status/2105782784426119357", "author": "OpenAIDevs"}, {"id": "2105782780982673545", "text": "Heard you liked the @modretro Chromatic.\n\nSo we added one to the side quest.\n\nYou have 48 more hours to join.\n\nhttps://side-quests.openai.chatgpt.site/", "created_at": "10-02 06:11", "likes": 263, "reposts": 16, "replies": 30, "views": 44413, "url": "https://x.com/OpenAIDevs/status/2105782780982673545", "author": "OpenAIDevs"}, {"id": "2105766564121526604", "text": "Submissions close in 2 days, October 3 at 2:30 PM PT.", "created_at": "10-02 05:07", "likes": 18, "reposts": 0, "replies": 3, "views": 5728, "url": "https://x.com/OpenAIDevs/status/2105766564121526604", "author": "OpenAIDevs"}, {"id": "2105761019767468473", "text": "From an idea to a game you can play on @modretro.\n\nWe caught up with @Casey to talk about the future of creativity:", "created_at": "10-02 04:45", "likes": 225, "reposts": 20, "replies": 27, "views": 27143, "url": "https://x.com/OpenAIDevs/status/2105761019767468473", "author": "OpenAIDevs"}, {"id": "2105736631160602758", "text": "dots demo on Apple Watch:", "created_at": "10-02 03:08", "likes": 162, "reposts": 12, "replies": 16, "views": 24046, "url": "https://x.com/keleftheriou/status/2105736631160602758", "author": "keleftheriou"}, {"id": "2105708732323909827", "text": "dots demo. \n\nNow... with better WiFi.", "created_at": "10-02 01:17", "likes": 12211, "reposts": 576, "replies": 879, "views": 1599192, "url": "https://x.com/OpenAIDevs/status/2105708732323909827", "author": "OpenAIDevs"}, {"id": "2105653606829461745", "text": "https://x.com/i/article/2105647831667105792", "created_at": "10-01 21:38", "likes": 77, "reposts": 8, "replies": 5, "views": 7777, "url": "https://x.com/aileenvl/status/2105653606829461745", "author": "aileenvl"}, {"id": "2105442037042663491", "text": "OpenAI's New Agent Stack: Superhuman Computer Use, Dots, Decisions API, UltraFast, & the AI Cloud https://www.latent.space/p/devday-2026\n\n@OpenAI’s @AriX and @nikunjhanda explain why Computer Use is already becoming faster than humans at real-world tasks, how Dots gives agents their own cloud computers, why better models can now debug and recover from failures, how Decisions API went from idea to product in weeks, and why async tools, UltraFast inference, caching, compaction, and higher-level agent primitives are turning OpenAI’s API into an AI-native cloud.", "created_at": "10-01 07:37", "likes": 93, "reposts": 12, "replies": 10, "views": 22144, "url": "https://x.com/latentspacepod/status/2105442037042663491", "author": "latentspacepod"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2105733864152858919", "text": "In physics, an “impedance mismatch” occurs when two systems each work well but are poorly matched.\n\nIn this Science Blog guest post, Harvard physicist Matthew Schwartz argues that something similar is happening with AI and science. LLMs are capable at many things, but working with them as you would with a human collaborator isn’t currently the best way to elicit their scientific strengths.\n\nTo address this mismatch, Schwartz created a toolkit for exact calculations in quantitative science. Because similar calculations often emerge in very different areas of science, Claude found connections to ecology, population genetics, and a dozen other fields, and Schwartz worked with domain experts to steer it towards interesting questions.\n\nRead more about these projects here: https://www.anthropic.com/research/claude-shaped-science", "created_at": "10-02 02:57", "likes": 1722, "reposts": 163, "replies": 149, "views": 192698, "url": "https://x.com/AnthropicAI/status/2105733864152858919", "author": "AnthropicAI"}, {"id": "2104982629884063840", "text": "What do you want from AI?\n\nWe’re launching a new study with Anthropic Interviewer to learn more about your experiences using AI, what role you want it to play in your life and the world, and what you want from the companies building it.\n\nLast December, 81,000 people told us about their hopes and fears about AI in the largest qualitative study ever done. This time, we’re giving participants the option to make their responses public so that anyone, not just Anthropic, can learn from them.\n\nWhat you tell us will shape The Anthropic Institute’s research and inform the decisions we make. If many people say companies like Anthropic should be doing something differently, that will be on the record, where anyone can point to it.\n\nThe study runs Sept 29 to Oct 6 and is open to Free, Pro, and Max users on Claude and Claude Code.\n\nTake part here: http://claude.ai/anthropic-interviewer/your-thoughts-on-ai?from=social", "created_at": "09-30 01:12", "likes": 2030, "reposts": 190, "replies": 373, "views": 292081, "url": "https://x.com/AnthropicAI/status/2104982629884063840", "author": "AnthropicAI"}, {"id": "2104982631037436201", "text": "Making your interview public is completely optional. Our blog post covers the benefits and possible risks of doing so.\n\nRead it here: https://www.anthropic.com/research/your-thoughts-on-ai", "created_at": "09-30 01:12", "likes": 189, "reposts": 9, "replies": 50, "views": 59131, "url": "https://x.com/AnthropicAI/status/2104982631037436201", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2105707090547478914", "text": "Watch → https://goo.gle/4de3fiR\nSpotify → https://goo.gle/4dKZwte\nApple Podcasts → https://goo.gle/4dQqKyH\n\nOr listen wherever you get your podcasts! 🎧", "created_at": "10-02 01:11", "likes": 18, "reposts": 2, "replies": 4, "views": 15059, "url": "https://x.com/GoogleDeepMind/status/2105707090547478914", "author": "GoogleDeepMind"}, {"id": "2105707085287567709", "text": "When AI-generated content has become so realistic, how do we verify what's made by human, machine, or nature?\n\nWe explore the vital role of provenance – and how imperceptible watermarking can safeguard both digital media and biological designs – on our podcast. ↓\n\nTimecodes:\n00:00 Introduction\n00:34 What is a watermark?\n04:35 SynthID\n15:16 Images and video\n19:28 SynthID Bio\n28:00 Future of resilience", "created_at": "10-02 01:11", "likes": 303, "reposts": 24, "replies": 60, "views": 33841, "url": "https://x.com/GoogleDeepMind/status/2105707085287567709", "author": "GoogleDeepMind"}, {"id": "2105624661912392028", "text": "As AI accelerates scientific discovery, we’re helping researchers keep pace by quickly authenticating if biological designs are created with built-in safeguards, without stalling crucial work. 🔬\n\nWe’re releasing these tools on an open basis for research use to strengthen safeguards → https://goo.gle/3VmICLk", "created_at": "10-01 19:43", "likes": 49, "reposts": 2, "replies": 5, "views": 13724, "url": "https://x.com/GoogleDeepMind/status/2105624661912392028", "author": "GoogleDeepMind"}, {"id": "2105624656170643854", "text": "SynthID Bio is our new family of watermarking methods made for AI-generated biological designs.\n\nIn a world first, we can now embed an imperceptible signature directly into protein sequences without affecting their biological function. 🧵", "created_at": "10-01 19:43", "likes": 537, "reposts": 67, "replies": 142, "views": 104626, "url": "https://x.com/GoogleDeepMind/status/2105624656170643854", "author": "GoogleDeepMind"}, {"id": "2105624658951176323", "text": "Acting like a digital ID card, the watermark can help DNA labs verify synthetic proteins and keep sequence databases accurate.\n\nAs these requests increasingly scale, verifying if designs come from AI with built-in safeguards will help labs automate and strengthen biosecurity. 🛡️", "created_at": "10-01 19:43", "likes": 70, "reposts": 3, "replies": 14, "views": 18693, "url": "https://x.com/GoogleDeepMind/status/2105624658951176323", "author": "GoogleDeepMind"}, {"id": "2105388084154056939", "text": "Introducing Gemini 4 Argon – our new frontier model.\n\nIt’s built for complex workflows across coding, enterprise knowledge work, and cybersecurity defense – rolling out today to a set of trusted testers through our Fairwind Program.", "created_at": "10-01 04:03", "likes": 42189, "reposts": 4558, "replies": 1877, "views": 8304542, "url": "https://x.com/GoogleDeepMind/status/2105388084154056939", "author": "GoogleDeepMind"}, {"id": "2105388087367127256", "text": "With a 1M token output limit, Argon adds a deeper level of reasoning to tackle long, multi-step problems in one go.\n\nFeedback from early testers will help us strengthen our systems before we roll out more broadly to developers, enterprises, and consumers soon.\n\nFind out more → https://goo.gle/4rZBiSd", "created_at": "10-01 04:03", "likes": 2826, "reposts": 90, "replies": 85, "views": 366319, "url": "https://x.com/GoogleDeepMind/status/2105388087367127256", "author": "GoogleDeepMind"}, {"id": "2105314763148321102", "text": "https://x.com/i/article/2105311091689414656", "created_at": "09-30 23:12", "likes": 526, "reposts": 91, "replies": 20, "views": 243767, "url": "https://x.com/pushmeet/status/2105314763148321102", "author": "pushmeet"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2105387954474746264", "text": "Importantly Argon has frontier safeguards and we are rolling it out responsibly - it’s with the US gov’t and going to a set of trusted cyber defenders through our Fairwind Program today.\n\nWe’re going to make it available as soon as we can and as safely as we can. So hold tight, lots more coming, and you’re going to see us iterating rapidly.\n\nhttps://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/", "created_at": "10-01 04:02", "likes": 2348, "reposts": 111, "replies": 100, "views": 264360, "url": "https://x.com/sundarpichai/status/2105387954474746264", "author": "sundarpichai"}, {"id": "2105387952478277979", "text": "Lots of discussion out there about our next model(!), so I wanted to give an early look as soon as possible. Introducing Gemini 4 Argon!\n\nIt shows frontier performance in complex workflows, cyber defense and software engineering. Teams are using it extensively at Google, from coding to quantum computing, great feedback. \n\nHere’s a look at the benchmarks:", "created_at": "10-01 04:02", "likes": 25101, "reposts": 2255, "replies": 1332, "views": 3503055, "url": "https://x.com/sundarpichai/status/2105387952478277979", "author": "sundarpichai"}, {"id": "2105121763176894804", "text": "Great to meet today with @POTUS, @JDVance, @SpeakerJohnson and Administration + tech leaders. Important conversation and we signed today the White House Accord on Super Intelligence.\n\nAs I shared today, Google has invested hundreds of billions in the last two years alone, with more to come, across the entire stack, to deliver benefits for America and the world.  We’re working to build products that deliver real value for people and businesses, invest in local communities, and build trust in the technology.\n\nIndustry also has to innovate responsibly. Google’s focused on building the right way, with appropriate testing, evaluations, red-teaming, and other safeguards against misuse and misalignment – and releasing models or products only after they’ve been thoroughly reviewed.\n\nWe are committed to working with other industry leaders to establish norms and build public confidence. The White House Accord and the Joint Commitment on Frontier Responsibilities signed today is a solid basis for moving forward - it contains real tangible steps to promote safe development, while delivering the economic and scientific benefits of this technology.", "created_at": "09-30 10:25", "likes": 12579, "reposts": 1479, "replies": 1729, "views": 1765794, "url": "https://x.com/sundarpichai/status/2105121763176894804", "author": "sundarpichai"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2105288808929558891", "text": "New Research: We are releasing ExplorationBench, a benchmark for measuring how AI systems explore. Scientific discovery begins where known problems end: a system has to frame hypotheses, design experiments, and learn from the results. Evaluating this is hard. Genuinely new answers cannot be checked quickly, and in familiar domains a model can simply recall what it has seen. Addressing this challenge, researchers from Tencent Hy, Fudan University, and Tsinghua University built verifiable Alien Worlds. Their rules are executable, so every answer is checked exactly, and they conflict with familiar knowledge, so recall alone cannot solve the tasks. 🔹 Two sandboxes: AlienCode (31 hidden rule changes, 70 tasks) and AlienLogic (24 patched inference rules, 70 theorems) 🔹 A flawed manual, four rounds of self-designed probes, and closed-book tests after every round 🔹 Every answer graded by an interpreter or a proof checker, with no LLM judge What we found across 10 frontier AI systems: 1️⃣ Getting feedback is more effective than thinking alone. No AlienCode run starts above 15.7%; after four rounds the best reaches 89.0%, while the same turns without feedback stay at 0.5–11.0%. 2️⃣ Designing the experiments matters. Replaying a system's own best probes gives it exactly the same evidence, yet in AlienCode 9 of 10 systems do worse than when they chose the probes themselves. 3️⃣ Knowing a rule is not using it. Even when every required rule is stated correctly, tasks are solved only 73.4% of the time. 4️⃣ One score hides a lot. The same system under the same budget ended anywhere from 5.7% to 79.0%, and rankings barely transfer between the two worlds. CL-bench asked whether models can learn from context. ExplorationBench asks whether they can discover the rules themselves. 📄 Paper: arxiv.org/abs/2609.30199 🌐 Website & leaderboard: explorationbench.com 📝 Blog: explorationbench.com/blog/ 💻 Code (coming soon): github.com/Tencent-Hunyua…", "created_at": "10-01 07:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105288808929558891", "author": "TencentHunyuan"}, {"id": "2105215199192207710", "text": "3 tracks. 3 winners. Go and Create. 🥇", "created_at": "09-30 07:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2105215199192207710", "author": "TencentHunyuan"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": [{"id": "2097930608790167907", "text": "🚀 Introducing DeepSeek-V4.1-Flash: smarter, faster, more efficient. 🔹 Introducing the smallest model in our new architecture family, with native visual understanding. 🔹 Designed for greater capability, faster inference, higher throughput, and scaling to larger models. 1/6", "created_at": "09-11 07:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2097930608790167907", "author": "deepseek_ai"}, {"id": "2097930624598446137", "text": "💰 More efficient architecture. Lower API prices. V4.1-Flash lets us serve more users at a lower cost. We’re passing the savings on to you. 🔹 Peak/off-peak pricing continues to balance demand. 🔹 Off-peak rates are 50% of peak rates. Schedule flexible workloads off-peak to save. 🔹 New pricing takes effect at 04:00 UTC on Sept 10, 2026. 5/6", "created_at": "09-11 07:56", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2097930624598446137", "author": "deepseek_ai"}]}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2102372557190230244", "text": "Meet the new Kimi Browser Extension, formerly Kimi WebBridge.\n\nFrom your browser sidebar, you can chat with Kimi to navigate websites, fill out forms, and get things done.\n\nFor repetitive tasks, record your steps once and save them as a skill. Kimi can take it from there next time.\n\nAvailable now on http://kimi.ai/products/kimi-browser-extension and the Chrome Web Store.", "created_at": "09-22 20:20", "likes": 960, "reposts": 71, "replies": 58, "views": 73976, "url": "https://x.com/Kimi_Moonshot/status/2102372557190230244", "author": "Kimi_Moonshot"}, {"id": "2102244258531213596", "text": "Kimi K3 is now on Amazon Bedrock!\n\nRun coding, document analysis, and extended agent workflows with Bedrock's access, encryption, and auditing controls.  Explicit prompt caching supported.\n\nStart building with K3 on AWS 👉 https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3.html", "created_at": "09-22 11:51", "likes": 937, "reposts": 57, "replies": 37, "views": 971917, "url": "https://x.com/Kimi_Moonshot/status/2102244258531213596", "author": "Kimi_Moonshot"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875758904795344896/U3CqYUFY_400x400.jpg", "tweets": [{"id": "1875761216062439461", "text": "购买 $ZHIPU —— 采用全自研的GLM模型架构，基于数十万亿中英文双语数据训练而成。ZHIPU 综合能力接近 GPT-4-Turbo，推理速度高达 80 token/s，阅读速度是人类极限（300词/分钟）的 25 倍，开创了AI性能的新标杆！\n\nhttps://bigmodel.cn/", "created_at": "01-05 12:28", "likes": 17, "reposts": 5, "replies": 7, "views": 9089, "url": "https://x.com/ZhipuAI/status/1875761216062439461", "author": "ZhipuAI"}]}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2064231947149377536/Ab70PxT5_400x400.jpg", "tweets": [{"id": "2105256053403508849", "text": "Qwen3.8-27B is now accessible via @nebiustf. Whether you are building agents or doing deep research, this 27B dense model is ready for your multi-step workflows! 🥳", "created_at": "09-30 19:18", "likes": 301, "reposts": 14, "replies": 38, "views": 44156, "url": "https://x.com/Alibaba_Qwen/status/2105256053403508849", "author": "Alibaba_Qwen"}]}, "MiniMax_AI": {"name": "MiniMax", "label": "MiniMax 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_400x400.jpg", "tweets": [{"id": "2105372414557516212", "text": "Impressive work by the @HeyGen on the launch of HeyGen Video! ✨\n\nBuilt on MiniMax H3 and post-trained by HeyGen, it brings production-quality video to businesses at a even more accessible cost.\n\nProud to provide the foundation for this work, and excited to see how far the HeyGen team is taking it.", "created_at": "10-01 03:01", "likes": 409, "reposts": 17, "replies": 20, "views": 226013, "url": "https://x.com/MiniMax_AI/status/2105372414557516212", "author": "MiniMax_AI"}, {"id": "2105361931750306044", "text": "Built on MiniMax H3, @Creatify_Labs' Boreal-H3 is a video model optimized for advertising, keeping products and characters consistent while following creative briefs more accurately.\n\nExcited to see MiniMax H3 serve as the foundation for more frontier models tailored to specific industries! ✨", "created_at": "10-01 02:19", "likes": 439, "reposts": 20, "replies": 20, "views": 119172, "url": "https://x.com/MiniMax_AI/status/2105361931750306044", "author": "MiniMax_AI"}, {"id": "2105343643251032304", "text": "Utopai X (based on MiniMax H3) debuts at #2 on the Artificial Analysis Text to Video Leaderboard, behind only Wan 3.0\n\nUtopai X is the new video model from Utopai Studios, post-trained on MiniMax H3 and launching today inside PAI, Utopai’s cinematic storytelling web platform. Utopai Studios is an AI-native film and TV studio, with three wide theatrical release films and two series scheduled for release in 2027.\n\nIn AA-Video-T2V v2.0, our refreshed Text to Video with Audio leaderboard, Utopai X ranks #2, behind Wan 3.0 and ahead of Dreamina Seedance 2.5. As of today, it is the highest ranked of the three models on the leaderboard built on MiniMax H3, ahead of MiniMax H3 itself and fal's MiniMax H3 Max.\n\nUtopai X is available in PAI at 93 PAI credits per second of video, with no public API. PAI plans start at $15 per month (billed monthly) for 1,000 credits.\n\nCongratulations to @UtopaiStudios on the release!\n\nSee below for our analysis and example outputs of Utopai X in the Artificial Analysis Video Arena 🧵", "created_at": "10-01 01:06", "likes": 322, "reposts": 35, "replies": 28, "views": 62492, "url": "https://x.com/ArtificialAnlys/status/2105343643251032304", "author": "ArtificialAnlys"}]}, "XiaomiMiMo": {"name": "Xiaomi MiMo", "label": "小米 MiMo 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1999123454247972865/8PkB-sNt_400x400.jpg", "tweets": [{"id": "2102153146525253816", "text": "💗", "created_at": "09-22 05:49", "likes": 449, "reposts": 8, "replies": 20, "views": 21461, "url": "https://x.com/XiaomiMiMo/status/2102153146525253816", "author": "XiaomiMiMo"}, {"id": "2102147404862800097", "text": "🔥", "created_at": "09-22 05:26", "likes": 534, "reposts": 12, "replies": 14, "views": 36295, "url": "https://x.com/XiaomiMiMo/status/2102147404862800097", "author": "XiaomiMiMo"}]}}, "errors": [], "summary": "**【用量相关】OpenAI 推出 Ultrafast 极速档与 Pro 500 新订阅**：Codex 中 token 生成最高 **8x 加速（300 tokens/秒）**、API 侧 6x；新计划 **Pro 500** 提供 **25x Plus 的用量上限**并解锁 Ultrafast，首批支持 GPT-6 Astra，GPT-6.1 Sol 即将跟进。sama 称 **6.1 Sol 是\"史上增长最快的模型\"**，此前负载偏高的问题已缓解。另 sama 强调 \"Sign In With ChatGPT / 插件扩展\"的潜力被严重低估，thsottiaux 正向合作伙伴产品推广\"订阅随处可用\"——Codex 用户值得关注后续的跨产品订阅打通。\n**Gemini 4 Argon 提前曝光**：sundarpichai 亲自预告下一代旗舰模型，定位复杂工作流、**网络防御**与软件工程的前沿性能；强调 frontier safeguards，首批交付美国政府与 Fairwind 计划中的可信网络防御者，公开版\"尽快但安全地\"发布。与此同时 LMArena Text 榜上 **gemini-4-argon-high 已以 1533.1 分空降第一**，领先 claude-opus-5.5-high 约 21 分。\n**Anthropic**：Science Blog 刊登哈佛物理学家 Matthew Schwartz 客座文章，以物理学\"阻抗失配\"类比 AI 与科学协作的错位；发起 \"What do you want from AI?\" 大规模用户研究（去年 12 月已有 8.1 万人参与），公开访谈可选。\n**Google DeepMind 发布 SynthID Bio**：首个可直接在**蛋白质序列**中嵌入不可感知水印的生物设计水印家族，不影响生物功能，工具向研究用途开放——AI 生成内容溯源（provenance）从数字媒体正式扩展到生物设计，配套播客讨论了水印在\"人/机/自然\"鉴别中的作用。\n**马斯克**：Falcon Heavy 将从 39A 发射台执行 **NROL-97** 任务；Crew-13 乘组龙飞船与空间站对接；Grok @Bot 大幅提速。\n**中国 AI**：腾讯混元发布 **ExplorationBench**——衡量 AI 系统探索能力的新基准（提出假设、设计实验、从结果学习）；MiniMax **H3 生态加速**：HeyGen Video、Creatify 广告视频模型 Boreal-H3 均基于 H3 构建发布，Utopai X（H3 微调）在 Artificial Analysis 文生视频榜空降**第二**；阿里 **Qwen3.8-27B 上架 Nebius**，面向 agent 与深度研究场景。\n特朗普账号近 60 小时无新动态。", "groups": [{"key": "openai", "label": "🤖 OpenAI"}, {"key": "claude", "label": "🟠 Claude"}, {"key": "google", "label": "🔵 Google"}, {"key": "china_ai", "label": "🇨
