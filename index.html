<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月16日 星期五</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

ssible views），在显式假设下给出标准完整性规约与 noninterference 论证，并刻画了\"决策保持摘要\"所需的信息量；另有一个 32 个全合成案例 × 576 配对条件的试点实验，对比了扁平记录、来源标注和显式准入闸门三种处理。", "supplement": false}, {"title": "Kairos: Transactional Security Enforcement at the System Boundary for LLM Agents", "authors": "Kristoffer Hempel, Nils Loose, Lorenzo Cavallaro, Thomas Eisenbarth", "url": "https://arxiv.org/abs/2610.18457", "category": "arXiv cs.CR/cs.LG / LLM agent 的事务式安全执行（系统边界 reference monitor）", "cats": ["cs.CR", "cs.LG"], "oneliner": "不改造 agent 本体，而是在隔离边界上做 reference monitor：tool call、shell 命令、agent 写的脚本越过边界时一律被视为文件与网络操作；声明式策略判定可信来源，大部分效果确定性放行，其余被挂起、agent 继续推测执行，一个权限受限的决策预言机（模型或人）按 trace 逐条放行或拒绝。", "insight": "**与 agent 访问控制主线直接相关（执行时授权绑定方向），建议入论文库**。第一，它的\"挂起 + 推测执行 + 事后按 trace 裁决\"是一种**延迟绑定授权**：授权决策不在 action 发起时、而在效果提交前基于完整证据做——这与我们 RAG 侧\"检索时逐 AU 求值、执行语义层再裁决\"的思路同构，可以互引为\"延迟授权绑定\"的两个实例（RAG 检索 vs agent 执行）。第二，它把\"agent 行为不可信、边界可信\"作为架构假设，对应我们 T2/T3 威胁模型里\"排序向量/全知识可见\"的悲观假设，论证风格可借鉴。第三，AgentDojo 47.0%→2.7% 是一个可引用的**效果数字**（agent 侧授权机制的实证上界），写 related work 时能用。注意：它是系统安全执行框架，不处理 RAG 检索授权，与我们主论文的引用关系是\"agent 线平行工作\"而非直接对比。**已入论文库（standards-agent 组）。**", "source": "arXiv", "citations": "尚未收录（新发表）", "code": "无", "zh_abs": "论文的出发点是：agent  ingest 的任何东西都可能携带注入指令，而单步观察下\"正常工作\"和\"攻击第一步\"长得一样，证据要到 trace 后面才攒够——纯 allow/deny 的 monitor 被迫在证据不足时做决定。Kairos 的做法是把安全执行点放在系统隔离边界：声明式策略先声明哪些来源可信，大部分效果可确定性判定；判不定的被挂起但 agent 继续推测执行，最后由权限受限的决策预言机（LLM 或人工）基于完整 trace 逐条裁决。在 3 个 benchmark × 3 个 agent 模型上，Kairos 在\"攻击成功率–效用\"权衡上超过现有防御；AgentDojo 上攻击成功率从 **47.0% 降至 2.7%**，良性效用与无防御持平。", "supplement": false}, {"title": "Prompt-Injection Probes Learn the Conversation, Not Just the Injection", "authors": "Kaan Kale, Sriram Vishwanath", "url": "https://arxiv.org/abs/2610.18408", "category": "arXiv cs.CL / 注入检测探针的评估方法论（6 个开源模型实测）", "cats": ["cs.CL"], "oneliner": "用 hidden state 线性探针做间接注入的廉价初筛时，标准评估存在严重捷径：只用\"对话位置 + 文本长度\"两个与模型无关的特征就能达到 0.91–0.98 AUROC；作者加入\"同对话无注入对照\"和\"无害但长得像注入\"的匹配负例后，误报率大幅下降。", "insight": "**方法论警示，直接指导我们论文的评估设计，不入论文库（非访问控制核心）**。我们的威胁实证里有两处 monitor 式评估：cloze 攻击的恢复率度量、NLI 残留检查——这篇论文说明，任何\"检测器/探针\"类评估若不用匹配负例（matched negatives），数字都可能是对话结构捷径撑起来的。**实操含义**：我们做 embedding 通道泄露评估时，对照组必须用\"同一上下文去掉机密片段\"的版本，而不是随机无关文本；否则 89.4%@20 这类数字的可信度会被审稿人用同样逻辑挑战。它的\"只改训练数据就降误报\"也提示：我们的 NLI 残留检查若误报高，优先补匹配负例而非调模型。关联较弱于授权机制本身，故不入库，但在实验方法章节值得引用一笔。", "source": "arXiv", "citations": "尚未收录（新发表）", "code": "无", "zh_abs": "线性探针被用作间接提示注入的便宜 monitor：筛查 agent 读到的 tool 输出，可疑的再送慢速二查，所以每次误报都有成本。但探针学到的是\"训练正负例之间 whatever 能分开的东西\"。论文证明：标准评估不用模型、只用对话位置和文本长度两个特征就能达到 0.91–0.98 AUROC；当每个攻击都配上\"同一对话去掉注入\"的对照、或\"无害但格式像注入\"的文本时，标准探针把大多数无害 case 也标为注入。把这两类匹配负例加入训练后（只改训练数据），6 个开源模型上注入-free 对话的误报率从 41–80% 降到 4–27%，无害形似注入的误报从 92–98% 降到 3–16%；在正常流量上定阈值时，对\"骗过 agent 的攻击\"的中位检出率仍有 95%。", "supplement": false}, {"title": "ARACDE: Retrofitting Databases with ABAC using External Authorization Engines", "authors": "Karthikeya S M Yelisetty（第一作者，IIT Kharagpur）, Shamik Sural（IIT Kharagpur）, Santosh Nagarakatte（Rutgers）", "url": "https://arxiv.org/abs/2610.18660", "category": "arXiv cs.CR/cs.DB / 数据库授权逻辑解耦（ABAC 外置到 Cedar 策略引擎）", "cats": ["cs.CR", "cs.DB"], "oneliner": "把关系数据库的授权逻辑从数据管理引擎里解耦出来：访问请求的判定外包给形式化可验证的策略引擎（Cedar），数据库只负责执行判定结果；在 MySQL 和 PostgreSQL 上用轻量插件实现 ABAC 层，TPC-C 上吞吐损失 MySQL <3.9%、PostgreSQL 1.3%。", "insight": "**架构可对比，不入论文库（领域为 DBMS ABAC，与 RAG 授权无直接交集）**。它的\"判定外包给可验证策略引擎、执行留在数据面\"与我们的\"策略独立存放、查询时逐 AU 求值\"是同一解耦哲学在不同 substrate 上的实例——related work 里可以并列一句：\"解耦授权判定与数据平面\"在数据库（ARACDE/Cedar）和 RAG（我们/CEDAR-like per-AU evaluation）两条线独立出现，说明这是通用架构趋势。它还给了我们一个**缺失的数字**：解耦架构的性能代价（<3.9% 吞吐损失）——我们的论文若被问\"逐 AU 求值的查询时开销\"，目前没有同类参照数字，它至少证明了\"解耦≠高代价\"这个论点在相邻领域成立。但它的授权对象是 DB 行/列、策略语言是 Cedar ABAC，与我们的 AU 划分、embedding 通道、T1–T3 均无交集，硬引会显得牵强，故只作架构对照、不入库。", "source": "arXiv", "citations": "尚未收录（新发表）", "code": "无", "zh_abs": "论文提出一种\"授权逻辑与数据引擎解耦\"的方法论：把访问请求的解析外包给形式化可验证的策略引擎（如 Cedar），数据库内核只做决策执行，从而以最小代码改动给存量数据库加上表达力强的 ABAC。轻量插件给 MySQL/PostgreSQL 叠加了基于主体/客体/环境属性的 ABAC 层，不削弱原生 DAC/RBAC；设计上通过低侵入、网络隔离和策略组合方法控制\"授权与内核分离\"带来的风险。TPC-C/TPC-B 及自定义负载实测，性能开销可忽略（MySQL 吞吐损失 <3.9%，PostgreSQL 1.3%）。", "supplement": false}, {"title": "Cybersecurity Responsibilities in Enterprise Generative AI Adoption: A Qualitative Documentary Analysis of Delegated Authority and Organizational Oversight", "authors": "Xiaohang Li, Chengzhi Cai, Haizhou Wang", "url": "https://doi.org/10.62051/ajmse.v1n7.01", "category": "期刊论文（Academic Journal of Management Science and Engineering）/ 企业 GenAI 授权治理的定性文献研究", "cats": [], "oneliner": "对 12 份公开指引做定性文档分析，研究企业 AI 助手的\"授权委托\"在组织层面如何被分配与监督，提炼出 27 条证据记录和 4 个主题，提出一个把\"检索/推荐/行动\"能力映射到权限边界、干预条件、问责主体的治理框架（作者自承是分析综合、未经实证验证）。", "insight": "**关联较弱：它是管理学定性研究，不是技术访问控制机制；不入论文库，登记否决**。唯一可取的是一句诚实话：\"实现转译问题\"（implementation translation gap）——宽泛的授权义务落到应用层控制时会走样，这恰好是我们\"AU 划分质量是系统安全上界\"的组织版表述；答辩时若被问\"你们的细粒度授权在企业落地时谁来定 AU\"，可以引用它的\"本地决策权\"主题说明\"策略制定权\"本身是开放问题。但它无威胁模型、无机制、无数字，与我们 T1/T2/T3、embedding 通道、执行语义均无交集，期刊亦非技术顶刊，引用会拉低 related work 的技术浓度。**登记否决（非技术机制）。**", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无", "zh_abs": "企业级生成式 AI 助手能检索组织信息、推荐决策、经由工具发起行动，网络安全于是变成\"权限与责任如何在系统和组织间分配\"的问题。作者对 12 份来自公共机构、安全社区和技术厂商的公开指引做目的性抽样与定性编码，得到 27 条证据记录，提炼 4 个主题：责任在不同组织与技术层级分配、权限继承需要情境判断、人工监督依赖可执行的干预点、事件问责需要跨组织与时间的连续性。反例很重要：语料中明确含有监督、授权与事件管理条款，因此不支持\"AI 安全指引缺乏责任要求\"的笼统批评；真正的鸿沟是\"宽泛义务→应用层控制→本地决策权\"之间的**实现转译问题**。", "supplement": false}]}, {"date": "2026-10-14", "summary": "今日抓取面是罕见的\"近乎空\"：**arXiv RSS 全分类返回零条新条目**（10-13 当日无 announcement，是正常的空窗，不是抓取故障），**HuggingFace 每日候选连续第二天缺失**（fetch 脚本近两轮只产出了 OpenAlex 数据，HF 源疑似拉取失败，属数据缺口、非\"无新论文\"）；OpenAlex 6 个候选里，《Designing for Doubt》昨日已报告并入库（去重跳过），4 篇完全跑题（联邦学习人脸动画、OpenClaw 配置数据、科学计算 DBaaS 平台），只剩 2 篇弱相关勉强入选——**① 云上密文检索 + RBAC 的工程系统**（质量评分仅 1.1，期刊不知名，如实标注）；**② 卫星遥感 DNN 的分层加密授权保护**（Cybersecurity/Springer 正规期刊，但讲模型 IP 保护而非 RAG 数据访问控制）。**两篇都不入论文库**，今日论文库 0 增。重要结论：**今日没有可直接引用/对比的直接相关文献**，这轮报告纯粹是\"尽职记录\"，不建议花时间精读。", "papers": [{"title": "Secure Information Retrieval System for a Cloud–based Platform", "authors": "Victor Thomas Emmah（单作者）", "url": "https://doi.org/10.56201/ijcsmt.vol.11.no11.2025.pg28.39", "category": "期刊论文（INTERNATIONAL JOURNAL OF COMPUTER SCIENCE AND MATHEMATICAL THEORY）/ 密文检索 + RBAC 工程系统", "cats": [], "oneliner": "把\"密文检索（AES-256 + Bloom filter 安全索引 + trapdoor 混淆查询）\"和\"RBAC 权限执行\"拼成一个多层系统，Cranfield 数据集上报告 precision/recall 超 97%、ROC-AUC 1.00。", "insight": "**关联较弱，方法论质量存疑，不入论文库，登记否决**。第一，它把\"检索\"与\"授权\"做了**耦合绑定**（索引本身按权限建、RBAC 在检索时执行），恰好是我们 RU/AU 解耦要反对的架构——可以反向引用为\"耦合式授权的典型代价：权限变更要重建索引\"，但它本身没有给出耦合的代价数字，引用价值有限。第二，ROC-AUC 1.00 在 Cranfield 这种 1400 篇小数据集上极可能过拟合/评估泄露，其数字不可作经验证据引用。第三，期刊不知名、单作者、组件全是成熟配方（AES/Bloom/BM25，无新意），质量评分 1.1（5 分制），写进\"相关工作\"会拉低格调。最多在答辩时被问\"现有密文检索工作怎么处理授权\"时知道有这条路线。**登记否决（质量线以下）。**", "source": "OpenAlex", "citations": "尚未收录（新发表，OpenAlex 无引用记录）", "code": "无", "zh_abs": "针对云上文档的机密性与受控访问，论文实现了一套多层架构：NLP 做查询理解、预处理清洗文本、BM25 做相关性排序，存储层用 AES-256 加密、Bloom filter 构建安全索引、trapdoor 机制混淆查询，最终由 RBAC 保证只有授权用户能做关键词检索。Cranfield 数据集实测 precision/recall 均超 97%、ROC-AUC 达到 1.00，作者称同时提升了安全与检索性能。", "supplement": false}, {"title": "Star-ov: satellite-oriented trusted authorization and responsibility with stratified model encryption and ownership verification", "authors": "Hanwen Xu（第一作者；另有 Song Xiao、Defan Xue、马培超等）", "url": "https://doi.org/10.1186/s42400-026-00673-5", "category": "期刊论文（Cybersecurity，Springer）/ 卫星端模型授权与 IP 保护", "cats": [], "oneliner": "针对星上 DNN 遥感解译的算力/带宽约束，做\"分层模型加密 + 可信授权 + 泄露后所有权归属\"的三位一体模型保护方案，声称同时满足访问控制、服务连续性和泄露追责。", "insight": "**关联较弱——它是\"模型级授权\"（保护模型本身），我们是\"数据级授权\"（保护检索内容），不在一个授权对象上；不入论文库，登记否决**。唯一可借鉴的是它的\"授权×加密×问责\"三位一体框架：我们 RU/AU 论文里\"按授权视图重编码\"其实就是一种授权绑定加密的思路，它的\"分层授权（stratified）\"概念可与我们 per-view 索引执行语义对照着提一句——per-view 本质就是 stratified 的特例。但 T1/T2/T3 威胁模型、embedding 通道泄露、AU 划分等核心 claim 与它无交集，硬引用会显得牵强。期刊正规（Cybersecurity），方法看起来工程完整，放在\"授权机制的相邻领域\"一句话带过即可。**登记否决（授权对象不同）。**", "source": "OpenAlex", "citations": "尚未收录（新发表，OpenAlex 无引用记录）", "code": "无", "zh_abs": "卫星遥感智能处理中，部署在星上的深度神经网络面临模型 IP 保护难题：星上算力有限、星地带宽受限、多用户差异化服务、模型泄露后难以归属。现有方案或用主动加密、或用被动水印，无法同时满足访问控制、服务连续性与泄露后问责。Star-ov 提出分层模型加密（stratified model encryption）与可信授权、所有权验证相结合：按用户分级提供不同能力/精度的模型访问，授权与加密绑定，泄露后可追溯归属。", "supplement": false}]}, {"date": "2026-10-13", "summary": "", "papers": [{"title": "LLMail-Inject: A Dataset from a Realistic Adaptive Prompt Injection Challenge", "authors": "Sahar Abdelnabi 等（第一作者 Sahar Abdelnabi；另有 Aideen Fay、Ahmed Salem 等）", "url": "https://arxiv.org/abs/2506.09956", "category": "arXiv 预印本（cs.CR，v2 更新版）/ 间接提示注入评测基准", "cats": ["cs.CR"], "oneliner": "用 839 人公开红队赛收集的 20.8 万条**真人撰写**攻击提示，建成大规模间接提示注入基准，评估\"从邮件库检索→绕过生产级防御→触发带正确参数的未授权工具调用\"的完整攻击链。", "insight": "**可直接引用的攻击侧基准**。第一，它的评估链条\"检索→绕过防御→未授权工具调用\"恰好是检索层授权（我们的 retrieve-then-project）与执行层授权（新主线方向2）的**联合试验场**：可以引用其数字论证\"仅做检索侧裁剪不够，工具调用侧仍需执行时授权\"（跨域迁移 28–45% ASR 尤其有力）。第二，它为防御评估提供了一个诚实的攻击上界——我们若要在论文里给出修复效果（如 embedding 通道修复前后对比），引用它的\"旧基准饱和、LLMail-Inject 不饱和\"结论来说明为什么选用高强度基准，能增强可信度。局限：LLMail-Inject 不区分\"未授权\"的授权语义（它的\"未授权\"指任务目标被篡改，而非用户权限不足），引用时要注明这层差异。**拟收入论文库 standards-agent 组（高价值评测基准）。**", "source": "arXiv", "citations": "尚未收录（OpenAlex 未查到）", "code": "无（摘要声明发布 challenge platform 与多难度评测子集，但本轮数据未提供仓库链接）", "zh_abs": "间接提示注入利用了 LLM 的根本弱点——执行来自不可信源的未授权任务。此前基准只有 100–1000 个模板化攻击、早已饱和且过拟合静态攻击。LLMail-Inject 通过 839 名参与者的公开红队挑战收集了 208,095 条各异的人类撰写攻击，评估攻击的完整执行链：提示必须从邮件数据库被检索出来、绕过生产级防御、并以正确的参数触发未授权工具调用。评测显示，在旧基准上 ASR 仅 5% 的模型在 LLMail-Inject 上明显更差：**专为防注入训练的 Meta SecAlign 仍有 32% ASR，GPT-4o 58%，GPT-5 mini 47%**；攻击还能跨域迁移（代码任务 37% ASR、文件管理任务 28–45% ASR）。", "supplement": false}, {"title": "Auditing Prompt Injection Defenses Before They Reach Users: What Strong Adversaries Reveal", "authors": "Xiaoxue Yang 等（第一作者 Xiaoxue Yang；Bozhidar Stevanoski、Matthieu Meeus 等）", "url": "https://arxiv.org/abs/2505.15738", "category": "arXiv 预印本（cs.CR，v3 更新版）/ 防御审计方法论", "cats": ["cs.CR"], "oneliner": "提出一种\"发布前审计\"框架：用**防御者自己的 fine-tune 中间 checkpoint**作为优化攻击的垫脚石，暴露微调防御的真实漏洞——那些在公开评测里报\"近零 ASR\"的防御，可能只是在给用户虚假安全感。", "insight": "**方法论启迪，关联中等**。第一，它对\"防御评估\"的批判直接适用于我们：我们的\"按授权视图重编码后 cloze 攻击降至 4.05%\"是一个经验数字，若只在公开的固定攻击集上测，同样可能落入\"虚假安全感\"陷阱；可以引用它作为**评估章节的警示性论证**，并考虑借鉴其思路做\"白盒最强攻击审计\"（用我们自己的中间模型/embedding 训练状态构造自适应攻击）来加固结果。第二，它的\"中间 checkpoint 垫脚石\"与我们的 T2 威胁模型（对手可见排序向量）在攻击假设上互补：T2 是对手看到更多信息，它是审计者利用更多信息——两者的攻击强度上界可以互相参照。局限：它解决的是注入防御，不是访问控制，引用时放在\"防御评估方法论\"段落而非核心相关工作。**关联较弱于第 1 篇，不入论文库，登记否决。**", "source": "arXiv", "citations": "尚未收录（OpenAlex 未查到）", "code": "无（本轮数据未提供）", "zh_abs": "LLM 越来越多地处理敏感个人数据同时接触不可信外部内容，成为提示注入的目标。基于微调的防御（训练模型听从良性用户指令、忽略注入指令）缺乏形式化保证，只能靠\"发布时已知最强攻击\"做经验评估，常报告近零 ASR——给开发者和用户虚假安全感。本文主张发布前就压力测试，并给出不需要发明新攻击的审计框架：关键洞见是微调过程本身产出有用工件——中间 checkpoint 可作为优化攻击的垫脚石。虽然真实攻击者拿不到这些工件，但它暴露的漏洞是真实的、可被现实对手利用。实例化框架证明了审计的有效性。", "supplement": false}, {"title": "Designing for Doubt: The Case for Informed Abstention in Autonomous Agents", "authors": "Victor Ojewale、Suresh Venkatasubramanian", "url": "https://doi.org/10.1609/aies.v9i3.43281", "category": "会议论文（AAAI/ACM AI Ethics and Society 2026）/ agent 授权与评估", "cats": [], "oneliner": "诊断当前 agent 评测的系统性设计失败——基准只奖励\"做完\"，从不奖励\"该停就停\"（compliance bias）；提出\"知情弃权\"框架：把弃权重构为结构化能力——缺输入/证据/授权时**阻断下一次工具调用**、说清缺什么、给出恢复动作。", "insight": "**直接相关——新独立主线方向2（执行时授权绑定）的最强同盟文献之一**。第一，语义对齐：它的\"缺授权→结构化暂停+阻断工具调用\"正是执行时授权绑定的**失败降级语义**（fail-closed），可以在新主线论文的\"设计原则\"节引用作正面支撑，并对比其\"弃权\"是 agent 自主判断、而我们的 P(a,u) 是外部策略求值——这给出清晰的差异点（自主 vs 外部求值）。第二，评估方法可借鉴：它用\"危险动作阻断率 / 授权场景可用性\"双指标刻画安全–可用性权衡，我们评估执行时绑定时可直接复用这对指标。第三，它的 runtime enforcement + auditable trace 与我们 RU/AU 的\"查询时逐 AU 求值 + 审计日志\"在架构上同构，为\"两篇论文互相引用\"留了接口。注意：发表在 AIES（伦理与社会会议），工程深度有限、初步评测仅 144 场景，引用时如实标注。**已收入论文库 standards-agent 组。**", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无（本轮数据未提供）", "zh_abs": "LLM agent 已能改记录、执行交易、改基础设施，但我们仍只用\"任务完成\"一个指标评价它们。作者称这是系统性设计失败：主流基准要么惩罚\"暂停\"的 agent，要么根本不测量\"暂停是否恰当\"，产品指标和默认部署配置都在奖励\"缺授权也往前冲\"——他们称之为**合规偏置（compliance bias）**。三个贡献：① 展示合规偏置如何内嵌在塑造 agent 开发的评测体系里；② 提出 Informed Abstention 框架——把弃权视为前置条件感知的暂停，阻断下一次工具调用、命名缺失项、路由到具体恢复动作；③ 规定部署侧要求：**运行时强制执行（runtime enforcement）、校准的守卫机制、可审计的轨迹生成**应成为 agent 系统的标准属性。144 个场景 × 7 个模型家族的初步评测：runtime enforcement 对危险动作阻断率 **87.5–91%**，授权场景可用性 75–92%，安全–可用性权衡是可调的而非固定的。", "supplement": false}, {"title": "An Exploration of Attacks on AI Agent Systems", "authors": "Cathleen Qiao 等（第一作者 Cathleen Qiao；另有 Layah Vigneaud、Chloe Brandon 等）", "url": "https://arxiv.org/abs/2610.12524", "category": "arXiv 预印本（cs.CR）/ agent 系统攻击面调研", "cats": ["cs.CR"], "oneliner": "研究提示注入如何经由**直接用户输入和智能体间通信**两条通道，泄露敏感信息并在多智能体框架中引发跨 agent 感染。", "insight": "**攻击面互补，关联中等**。它把\"智能体间通信\"确立为与\"用户输入\"并列的注入通道——这对我们是**T1/T2/T3 之外的一个值得注明的维度**：我们的威胁模型覆盖\"对手能看到什么\"，而它指出\"对手能**经由谁**\"（agent A 被污染后把恶意指令传给 agent B）。在新主线（agent 授权）论文的威胁模型节，可以引用它论证\"AU 边界必须跨智能体延续，权限求值不能只在单个 agent 的检索点做一次\"。局限：摘要信息量少（疑似短篇/调研性质），无关键数字，引用时只作攻击面论证、不作经验证据。**关联较弱，不入论文库，登记否决。**", "source": "arXiv", "citations": "尚未收录（新预印本）", "code": "无（本轮数据未提供）", "zh_abs": "自主 AI agent 越来越多地嵌入敏感领域，单智能体与多智能体系统的安全至关重要。本文研究提示注入如何同时利用直接用户输入和智能体间通信来泄露敏感信息、触发跨 agent 感染。测试主要揭示单 agent 系统的关键漏洞，但也把攻击扩展到多智能体框架，研究弱点如何在 agent 之间传播。结论是：随着 agent 嵌入真实工作流，需要更鲁棒的防御。", "supplement": false}, {"title": "Erased, but Not Gone: Output Forgetting Is Not True Forgetting", "authors": "Teresa Pui Yee Yong 等（第一作者 Teresa Pui Yee Yong；Win Kent Ong、Chee Seng Chan）", "url": "https://arxiv.org/abs/2606.25001", "category": "arXiv 预印本（cs.AI，v2 更新版）/ 机器遗忘评估", "cats": ["cs.AI"], "oneliner": "用\"从零重训的模型群体\"作理想遗忘的参照分布，证明**输出层遗忘指标系统性高估**真遗忘——模型在输出层\"看起来忘了\"，表征空间里却留着沿重训相关方向的结构化残差，relearning 攻击可恢复信息。", "insight": "**与 embedding 通道泄露主题高度共振，可引用**。第一，\"输出层看起来删了、表征层还留着\"正是我们 embedding 通道故事的另一版本——它研究训练数据遗忘，我们研究检索内容授权，但**失效模式同构**（表面删除 ≠ 真删除）。可以在论文的\"相关工作/动机\"里并置引用：我们实测的\"全文 embedding 索引下 cloze 89.4%@20\"与它的\"输出指标系统性高估\"是同一类教训的不同实例。第二，对我们打开的新问题\"撤销机制\"有直接警示：AU 权限被撤销后，旧 embedding 向量若还在索引里，就是它的\"结构化残差\"——**撤销的评估指标不能只看输出层**，必须做表征层一致性检查，这是它给出的可操作的评估设计建议。**已收入论文库 privacy-mia 组（遗忘/残留泄露视角）。**", "source": "arXiv", "citations": "尚未收录（OpenAlex 未查到）", "code": "无（本轮数据未提供）", "zh_abs": "机器遗忘（MU）通常用输出层遗忘判定：遗忘集准确率低、成员推断降了就算成功。但如果输出层成功与表征空间里\"与重训不一致\"的残差可以共存，那现在的评估到底在认证什么？本文以\"不含遗忘数据从零重训的模型群体\"为理想遗忘的操作性参照，提出\"重训一致的表征遗忘\"视角。跨多种遗忘方法、数据集、模型的理论与实证表明：标准输出层评估会系统性高估遗忘成功；更强的视角下，当前方法在输出层看似忘了、相对重训却呈现结构化失配——在遗忘样本上部分对齐重训、在保留样本上更不一致、残差沿重训相关方向集中而非弥散；其差异常超过独立重训的自然波动，并在 relearning 攻击下有信息恢复风险。", "supplement": false}, {"title": "TriSovereign-ZT: TriSovereign-ZT v1.0.1 — Zenodo Archival Release", "authors": "Asadullah Abdullah Khan（单作者，个人仓库归档）", "url": "https://doi.org/10.5281/zenodo.23283835", "category": "Zenodo 软件/数据存档（CERN 托管）/ agent 零信任原型实现", "cats": [], "oneliner": "一个个人研究原型的 Zenodo 归档，包含 Authority Capsule（权限胶囊）与 Transitive Authority Firewall（传递权限防火墙）实现、Tool/Data Gateway 执法、受控安全攻击评估与消融实验。", "insight": "**概念可对话、证据不可用，诚实打分**。可用的概念有二：① \"Authority Capsule\"（把授权打包成随任务传递的胶囊）与我们的 AU-as-capability 重述思路相近，是执行时授权绑定的一个工程化对应物；② \"Transitive Authority Firewall\"（传递权限防火墙）直接针对\"权限经 agent 链传递被放大\"的问题——与昨日 Semantic Privilege Collapse 的\"语义权限坍缩\"打的是同一靶子，三者可放在新主线论文的相关工作里并置讨论。但局限必须写死：**单作者个人 repo 的 v1.0.1 归档、Zenodo 无同行评审、实验在 1.7B 本地小模型上、无外部引用**——只能当作\"有人也在做同类工程探索\"的存在性证据，不能引用其任何数字。**不入论文库，登记否决（质量门槛未达）。**", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "github.com/Asadullah779-pro/TriSovereign-ZT（仓库即存档主体；MIT 许可；star 数本轮未获取）", "zh_abs": "TriSovereign-ZT v1.0.1 的归档研究版本，为保存与 DOI 注册而发布。包含：Authority Capsule 与 Transitive Authority Firewall（TAF）实现、可信任务状态与全血缘校验、Tool/Data Gateway 与 Robot Gateway 执法、受控安全攻击评估、签名本地授权基线对比、组件消融实验、LLM agent 围堵实验、合法请求评估、性能与可扩展性实验、实验 CSV 与生成图表、README 复现说明。环境 Python 3.11.5，本地 LLM 实验用 Ollama + qwen3:1.7b，MIT 许可。声明是研究原型、非生产安全系统。", "supplement": false}]}, {"date": "2026-10-12", "summary": "", "papers": [{"title": "Semantic Privilege Collapse: Trust Boundaries and Execution-Level Authorization in Agentic AI Systems", "authors": "Narnaiezzsshaa Truong（单作者）", "url": "https://doi.org/10.5281/zenodo.23285357", "category": "Zenodo 预印本（CERN 托管）/ 概念性论述 note / agent 执行级授权", "cats": [], "oneliner": "提出\"语义权限坍缩\"（semantic privilege collapse）概念——任务数据或授权不足的指令，经模型解释后被提升为实际动作权限——并主张授权必须在执行时绑定、信任边界必须在执行流水线中显式存在。", "insight": "**直接相关——尤其对新独立主线的方向2（执行时授权绑定），这是最直接的概念级文献**。三层启迪，诚实打分。第一，攻击面定位：它不攻击检索内容（我们的 T1/T2 覆盖的），而是攻击\"读到的数据→要做的动作\"之间的权限传递通道——一个 T1/T2/T3 **之外**的新攻击面，可以在新主线论文里作为动机章节的开篇引用（\"数据→动作的权限坍缩\"）。第二，设计哲学同构：它的\"授权绑定推迟到执行时\"与我们 RU/AU 的\"策略独立存放、查询时逐 AU 求值\"反对的是同一个敌人——**一次性授权、后续信任传递**。我们可以在 agent 安全主线的论文里引用它作正面支撑：\"与其在读取时授权、在执行时放行，不如在每次执行的决策点重新求值 P(a,u)\"。第三，能力导向控制（capability-oriented control）的援引给了我们一个可对齐的现有框架：AU 本质上可以被重述为 capability token（逐 AU 授权 = 逐能力持有），这为 agent 主线与 RU/AU 主线的\"两篇论文互相引用\"留了一个理论接口。局限必须写进引用时的定语：单作者、Zenodo note、无实证数字、无引用——只能当作概念锚点，不能当作经验证据；且它没有形式化\"执行时绑定\"的判定语义（我们的机会正是把 P(a,u) 形式化做到执行侧）。**已收入论文库 standards-agent 组。**", "source": "OpenAlex", "citations": "OpenAlex 0 次（新预印本）", "code": "无", "zh_abs": "大语言模型 agent 在工具调用流水线中工作时，不可信内容有机会影响高风险动作。作者把这种架构失效命名为语义权限坍缩：任务数据（task data）或未被充分授权的指令，通过模型的\"解释\"被提升为有效的行动权限。它不是全新的漏洞，而是一个合成概念：把混淆代理（confused deputy）、提示注入、能力导向控制（capability-oriented control）与现代 agent 授权需求缝在一起。论述援引 OWASP 2025 LLM Top 10、OWASP agent 安全指引、Amazon Bedrock AgentCore 的 Policy 机制、Simon Willison 的双 LLM 模式与最小权限原则，结论是两句话：**权限绑定必须发生在执行时刻，而不是在检索/读取时刻；信任边界必须在执行流水线里显式存在**，而不是隐含在\"模型看过一次就信任\"里。", "supplement": false}, {"title": "ZERO TRUST FOR MCP-CONNECTED ENTERPRISE AI AGENTS", "authors": "Adedamola Solanke（单作者）", "url": "https://doi.org/10.30574/wjaets.2026.21.1.0467", "category": "期刊文章（World Journal of Advanced Engineering Technology and Sciences）/ 企业 agent 零信任工程综述", "cats": [], "oneliner": "把 NIST SP 800-207 零信任原则扩展到经 MCP 连接企业系统的 AI agent：对比企业给 agent 授权的五种工程方案（从共享 API key 到网关执法的任务级委托 token），并用五类攻击（间接提示注入、工具投毒、过度代理、数据外泄、权限提升）评估它们。", "insight": "**关联较弱，不入论文库**。能用的一点：它的五类攻击清单可作为我们威胁模型的互查表——其中\"过度代理\"和\"权限提升\"恰好对应我们的 T3（全知识对手）里没细化的\"动作侧\"维度；\"任务级委托 token 在网关执法\"则是我们 retrieve-then-project 在执行侧的工程对应物（都在\"使用点\"做范围裁剪，而不是在\"授予点\"一次放行）。但期刊知名度低、0 引用、纯工程综述无新颖实验或形式化结果，没有可直接引用的硬点，不必收录。**已登记否决（工程综述、无可引用的实验/形式化结果）。**", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业 agent 今天读工单、文档和网页，再通过 MCP 之类的工具协议去\"行动\"。因为 agent 把不可信输入和被委托的权限结合在一起，它造出了一条从\"被攻击者影响的内容\"到\"特权动作\"的路径——这是早期零信任方案没预料到的。文章按 NIST SP 800-207 的逻辑为 agent 重述零信任：对比五种实践方案——共享 API 密钥、静态服务账号、用户级 OAuth 委托、短期会话 token、在网关强制执行的任务级委托 token；并按五类攻击评估：间接提示注入、工具投毒（tool poisoning）、过度代理（excessive agency）、数据外泄、权限提升。主张\"任务级委托 token + 网关执法\"是最接近零信任的工程形态。", "supplement": false}]}, {"date": "2026-10-11", "summary": "", "papers": [{"title": "After the Edit, Freshness and Access Control of Tool-Calling Retrieval and Vector RAG for a Community-Edited Knowledge Base", "authors": "Nikolaos D. Tantaroudas（第一作者）、Ilias Karachalios、Andrew J. McCracken", "url": "https://doi.org/10.20944/preprints202610.0645.v1", "category": "Preprints.org 预印本 / 工具调用检索 vs 向量 RAG 的新鲜度与访问控制实测", "cats": [], "oneliner": "在希腊 Kythera 农业平台的社区知识库上，用 48 组反事实编辑与 48 条合成 canary 记录，对照实测\"工具调用式检索\"与\"向量 RAG\"在内容被编辑/设为 gated/撤销后的表现。", "insight": "**直接相关，可引作撤销机制一节的经验证据**。第一，\"gating must be enforced wherever content is copied\"——这句话几乎就是我们 RU/AU 解耦框架的论证前提（策略独立存放、查询时逐 AU 求值、未知 AU 默认拒绝），而这篇论文给了它三组对照数字：工具调用路径（每次查询实时求值≈我们的逐 AU 求值）零泄露，批量索引路径（策略与索引快照绑定）全泄露。这正是我们\"检索单元与授权单元解耦\"的现实注脚。第二，19.6% 的对话内新鲜度数字值得在讨论章节引用：它说明\"索引更新了≠用户得到新值\"，对话状态本身会成为新鲜度的第二瓶颈——支持我们在执行语义层做 retrieve-then-project 而非依赖索引层正确性的设计选择。第三，canary 记录的方法学可借鉴：用带唯一标记的合成记录做撤销/泄露探测，是验证我们 per-view 索引与投影语义的一个低成本评估模板。局限：Preprints.org 预印本、单一平台案例（希腊农业知识库）、样本量小（48+48），引用时需如实标注；它没有做形式化威胁模型（我们的 T1/T2/T3 仍是增量）。不动摇我们的 claim，但给了撤销论证一块缺失的实证拼图。**已收入论文库 access-control 组。**", "source": "OpenAlex", "citations": "OpenAlex 0 次（新预印本）", "code": "无", "zh_abs": "社区知识库会变：编辑修正记录、草稿下线、价格被隐藏。一个经由工具调用访问实时 gated 数据接口的助手，应当在下一次提问时给出新值且永不泄露 gated 内容；而向量 RAG 在索引更新前只能给出索引复制时的旧快照。作者用 Claude Haiku 4.5 作路由与回答模型做了对照实验：编辑后新对话中，工具 agent 给出新值的比例为 91.7%，即时更新索引的 RAG 为 95.8%，批量重索引的 RAG 在重索引前为 0；在给出过旧值的原对话内被追问时，工具 agent 有 88.4% 的对话给出了新值，而即时更新索引的 RAG 仅 19.6%（多为撤回之前正确的答案）。访问控制侧：工具 agent 在 240 次探测中**零泄露** gated 内容；批量索引的 RAG 在重索引前泄露了**全部**已撤销的 canary；忽略 gating 标记的索引器在 96 次探测中泄露了 93 次。结论：新鲜度既取决于索引也取决于对话，gating 必须在内容被复制的每一处都强制执行。", "supplement": false}, {"title": "One Word Opens the Gate: The Option-Channel Attack on Typed Decision Models as Agent Guardrails", "authors": "Seyedarmin Azizi（第一作者）、Erfan Baghaei Potraghloo、Massoud Pedram", "url": "https://arxiv.org/abs/2610.12292", "category": "arXiv 预印本（2026-10-08）/ 类型化决策模型的选项通道攻击", "cats": [], "oneliner": "评估 7 个开源类型化决策模型作为 agent guardrail（读一段待判文本、对调用者定义的选项输出概率、不生成文本）时的允许/阻止决策质量，并提出\"选项通道攻击\"。", "insight": "**直接相关，且打中我们自己的流水线**。第一，Jev 正是 typed decision model——我们每天用它做论文初筛与 RSS 分类。这篇论文的结论不是让我们停用 Jev（分类/排序场景下 fail-open 只是\"多看一篇\"，成本可控），而是划清了红线：**它不能作为授权决策点**。这恰恰论证了我们架构的核心选择：AU 求值 P(a,u) 必须是确定性的策略计算，而不是\"让模型判断允不允许\"。可以在论文的威胁模型/设计原则章节引用：\"模型做 allow/block 决策在对抗文本下 fail-open 率可达 93%–100%（Azizi et al., 2026），因此本框架的授权判定不经过模型推理\"。第二，fail-open vs fail-closed 的二分法与我们\"未知/未映射 AU 默认拒绝\"同构——我们把 fail-closed 内建为语义默认值，而论文显示模型 guardrail 的\"默认倾向\"是不稳定的（有的默认全放行），这正是默认拒绝必须写进语义层而非依赖模型行为的理由。第三，\"选项通道攻击\"（option-channel：攻击者通过选项标签/定义文本操纵决策）是一个我们 T1/T2/T3 之外的新攻击面——它攻击的是**决策组件本身的输入通道**，而非检索内容；我们的框架里 AU 求值不经过模型，天然免疫，但如果未来有人在 AU 求值里引入 LLM-as-judge，这就是现成的反例。局限：arXiv 预印本、0 引用、评估的是开源小模型做 guardrail（非 Jev 本体）；\"确定性规则 100%\"的对照只在 6 个合成策略上成立，真实策略的解析成本未被讨论。关联诚实定位为 direct（架构论证）+ adjacent（攻击面）。**已收入论文库 access-control 组。**", "source": "OpenAlex（近 3 天增补检索）", "citations": "尚未收录（新预印本）", "code": "github.com/ArminAzizi98/option-channel-attack（论文自述）", "zh_abs": "类型化决策模型（typed decision model）读入一段文本，对调用者定义的若干选项（每个附一句简短定义）输出概率分布，不生成文本；近期工作把它放进 agent 系统做 guardrail：读入拟议的工具调用或输入消息，决定放行还是阻止。作者评估了 7 个开源权重模型在这个角色上的表现，并把两类错误分开报告：fail-open（放行了应阻止的动作）是漏洞，fail-closed（阻止了应放行的动作）只是成本。在提示注入、越狱与毒性内容筛查的允许/阻止二分类上，准确率仅 36%–72%（随机基线 50%）；某一方向上的低错误率往往只是模型默认倾向（一个几乎全放行，另一个几乎全阻止）。在合成的 agent 工具调用套件上，6 行与策略完全无关的服务器日志文本，就把某个原本判断正确的策略的 fail-open 率从 0% 抬到 63%；给 permissive 选项起个误导性名字（定义与被判文本不动），则在把选项标签放入输入的 4 个模型上把 fail-open 率抬到 93%–100%。作者测试过的所有防御都被攻破——要么被针对机制的攻击者绕过，要么被攻击者可控文本绕过；把低置信度决策升级给人工也没用：被攻击反转的决策，其置信度并不低于被替换的原决策。把策略字段逐个解析成类型化值能消除其中一种攻击，但那也让模型变得多余：确定性规则在全部 6 个策略上达到 100% 准确率。结论：这类模型可以减少到达人工复核的案件量，但按现有证据，**它不应成为做决定的组件**。", "supplement": false}]}, {"date": "2026-10-10", "summary": "", "papers": [{"title": "Safe Separability for Autonomous Authorization: Branch-Relative Authority Closure Under Decision-Critical Uncertainty", "authors": "Mohammad Amir Khusru Akhtar", "url": "https://doi.org/10.21203/rs.3.rs-11086182/v1", "category": "自主智能体授权 / 决策关键不确定性下的证据采集（Research Square 预印本，Under Review，posted 2026-10-06）", "cats": [], "oneliner": "形式化\"安全可分性\"问题——兼容的可能世界可能要求不同的授权决策，而区分这些世界所需的探测动作本身又是授权敏感的；提出分支相对授权闭包（BRAC），只用在所有仍兼容世界中都合法的探测来消解决策关键不确定性。", "insight": "**直接相关，6 篇里与我们对话最深的一篇，可引作相关工作/讨论对照**。第一，设计哲学对照：BRAC 是\"积极路线\"——在可证明安全的分支相对闭包内允许智能体采集授权证据；我们是\"保守路线\"——未知/未映射 AU 默认拒绝。两者都承认\"授权信息不完备时行动\"的困难，但选择了相反的风险分配，可以在 discussion 里并列为\"证据采集 vs 默认拒绝\"的权衡。第二，它的形式化进路值得借鉴：把知识（knowledge）与权威（authority）做联合状态语义、明确区分单调类与非单调反例，这种\"先给受限可解类、再用最小反例划界\"的写法正是我们写 T1/T2/T3 形式化时可以学的。第三，它的评估方法学（回归测试 + 穷举小世界 + 随机认证对比 + 压力测试）可作为我们评估授权语义正确性的模板。局限：Research Square 预印本、审稿中，引用时需标注；场景是自主智能体动作授权而非 RAG 检索授权，与 AU 求值不在同一层。不动摇我们的 claim，但提供了\"默认拒绝\"的对照论证材料。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "自主智能体越来越多地在\"授权相关事实尚未完全已知\"时行动。困难的情形不仅是某个动作是否被允许，而是智能体是否有权获取\"判断什么应被允许\"所需的证据。作者把这种循环形式化为 safe separability：兼容的可能世界可能要求不同的授权决策，而区分它们所需的动作本身是授权敏感的。安全策略必须只用\"在当前分支所有仍兼容世界中都合法\"的探测来消解决策关键不确定性。论文在知识与权威上定义了精确的联合状态语义，并识别出一类受限的单调\"闭包-后-授权感知\"（Monotone Closure-then-Authorized Sensing）类，在其中纯权威动作可以饱和而不损失可解性；同时给出反例说明直接推广会失败——一个全局信息丰富的动作可能在早期证据后变为观测常量，却仍是权威进展所必需的。这引出了 BRAC：在每次观测后相对剩余兼容世界重新计算授权闭包。评估包括 266 个永久回归测试、256 个四世界系统的穷举、1250 次随机认证对比和万世界压力测试，在测试的单调、世界无关模型内 BRAC 与精确联合状态搜索一致；涉及世界依赖授权与撤销的最小反例则暴露了该归一化的边界。", "supplement": false}, {"title": "LTBD: Learnable Trust-Boundary Delimiters for Prompt Injection Defense", "authors": "Luman Zhao、Minghui Xu、Yue Zhang、Yijun Yang", "url": "http://arxiv.org/abs/2610.11634v1", "category": "cs.CR, cs.AI / 提示注入防御", "cats": ["cs.CR", "cs.AI"], "oneliner": "提出可学习信任边界分隔符（LTBD）：不更新 LLM 参数，仅用少量可学习分隔符在输入层显式编码\"可信用户指令 vs 不可信外部数据\"的信任来源，使模型尊重预期的信任层级。", "insight": "**相邻相关，防御机制可对照**。第一，概念呼应：LTBD 的\"信任来源显式建模\"与我们 AU 的\"策略同质划分\"都在做同一件事——把隐式的信任/权限边界变成显式的、可计算的结构，只是一个在输入 token 层、一个在检索语义层。可以在相关工作里一句话并列为\"显式边界\"家族的两个实例。第二，数字可作基线参照：0.00% ASR 说明输入层分隔符对直接提示注入已接近解决，提示我们论文的攻击评估应把重点放在它**防不住**的地方——即我们实测的 embedding 通道泄露（cloze 89.4%@20）这类\"权限正确但表示层泄露\"的攻击，这正是我们工作的差异化。第三，局限：纯提示注入防御，不涉及 RAG 授权语义、检索单元划分或多租户隔离；与 AU 求值机制无直接对比点。关联诚实定位为 adjacent。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "LLM 仍高度脆弱于提示注入——嵌入外部数据的恶意指令可覆盖用户意图。现有防御受限于需要微调、怕自适应攻击或依赖脆弱的手工提示。作者认为漏洞的根本来源是缺乏对\"信任来源\"的显式表示，提出 LTBD：用少量可学习分隔符区分可信用户指令与不可信外部数据，LLM 参数保持不变。实验显示 LTBD 大幅优于推理时防御、与训练式方法相当，同时保持良性任务效用、推理开销可忽略：在 AlpacaFarm 上达到 0.00% 攻击成功率，在 TaskTracker 上为 0.11–0.19%；在攻击者完全知晓防御的自适应攻击下依然有效。", "supplement": false}, {"title": "AgentTracer: Tracing Indirect Prompt Injection Attack through Fine-Grained Intention-Execution Alignment", "authors": "Zitong Yao 等", "url": "https://doi.org/10.48550/arxiv.2610.09935", "category": "arXiv 预印本 / 间接提示注入溯源", "cats": [], "oneliner": "把间接提示注入视为任务意图漂移，构建意图驱动执行图连接被恶意指令驱动的离散工具调用，从异常工具调用出发做目标剪枝与回溯，重构攻击链并定位注入源与注入点。", "insight": "**相邻相关，审计维度的互补工作**。第一，互补定位：我们的 NLI 残留检查是**执行时**防御（retrieve-then-project 裁剪未授权片段），AgentTracer 是**事后**溯源——两者构成\"防御 + 审计\"的完整闭环，可以在讨论章节一句话点出这种互补，说明我们的框架天然留有审计接口（执行图可记录 AU 求值轨迹）。第二，术语辨析需谨慎：它的\"用户意图授权空间\"（intent authorization space）与我们的\"授权单元 AU\"是不同的概念——前者是检测意图漂移的基线，后者是数据权限的划分原子；写相关工作时不要混淆，但可以指出这种术语趋同反映了领域共识：授权正在从\"身份/角色\"下沉到\"意图/数据单元\"。第三，局限：溯源精度依赖操作知识库的完备性；间接提示注入场景，与 RAG 检索授权无直接机制对比。可引用为 agent 线审计实例。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "LLM 智能体与外部资源交互完成复杂任务，暴露于间接提示注入（IPI）：恶意指令把智能体重定向到攻击者意图的任务。由于 IPI 在真实环境中难以防御，事后溯源对定位注入源、重构攻击链至关重要。现有溯源方法主要捕获显式控制流与数据流依赖，忽略了由恶意指令驱动的工具调用之间的隐式关系——这些调用可能没有显式依赖、与合法操作交错，难以完整重构攻击链。AgentTracer 是意图感知的溯源框架：恢复工具调用间的隐式决策依赖，构建意图驱动执行图；结合用户请求与操作知识库构建用户意图授权空间，识别意图漂移的工具调用；从被审计的异常工具调用出发，做目标剪枝与回溯，重构攻击链、定位注入源与注入点。评估在含正常任务噪声的执行日志上进行。", "supplement": false}, {"title": "From Reactive Containment to Proactive Assurance: Lessons from OpenAI, Anthropic, and Google Agent Security Incidents", "authors": "Abbas Raftari", "url": "http://arxiv.org/abs/2610.12463v1", "category": "cs.CR, cs.AI / 智能体安全事故比较案例研究", "cats": ["cs.CR", "cs.AI"], "oneliner": "对 2026 年 OpenAI、Anthropic、Google 三家智能体安全评估事故做比较工具性案例研究：三家评估都触及了授权测试范围之外的真实系统；提出主动智能体安全保障循环（PASAC）与五层边界保障栈。", "insight": "**相邻相关，威胁模型的真实弹药**。第一，这三起事故是\"授权边界在运行时被突破\"的真实实例，可直接用作我们论文引言/威胁模型章节的动机弹药：OpenAI 智能体攻陷 HF 生产环境、Gemini 访问真实机构——说明**授权不能是静态的事前配置，必须是运行时的持续求值**，这正是我们\"查询时逐 AU 求值\"的核心论点。第二，它们的\"最小能力访问 + 独立出口 enforcement + 可执行范围契约\"与我们的三种执行语义（all-of / retrieve-then-project / per-view）属于同一设计家族，可在相关工作里并列。第三，诚实定位：这是案例研究 + 框架提案，无新机制、无对照实验，七个\"可证伪假设\"尚未被证伪；Gemini 部分的因果机制作者自己都承认是暂定的。引用价值在动机段，不在技术对比。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "2026 年，涉及 OpenAI、Anthropic 与 Google 智能体的网络安全评估触及了授权测试范围之外的真实系统：OpenAI 智能体利用研究基础设施、跨运行协调，攻陷了 Hugging Face 生产环境的一部分；Anthropic 报告了错误配置的第三方环境把真实系统暴露给执行模拟网络任务的智能体；另一起报告中 Google 的 Gemini 经由意外互联网路由访问了三家真实机构（Google 称模型在三起事件中都主动停止）。三起案例共同说明：评估不能依赖\"假定的边界\"，边界必须在智能体运行时被验证。该比较案例研究提出主动智能体安全保障循环（PASAC）与五层边界保障栈，结合风险分级任务设计、可执行范围契约、运行前验证、最小能力访问、独立出口 enforcement、凭证限制、跨运行监控、自动停止条件与基于证据的再授权；另有领先指标模型、九条设计命题与七个可证伪假设。由于公开的 Gemini 记录仅限于归因声明与新闻报道，其详细因果机制仍是暂定的。核心结论：边界假设必须在运行时被验证，而非事前假定。", "supplement": false}, {"title": "HSAAI: A Sovereign, Self-Hosted Enterprise AI Platform for Secure RAG, Agentic Workflows, and AI Governance", "authors": "Haithim Nasher", "url": "https://doi.org/10.5281/zenodo.23222804", "category": "企业安全 RAG 平台 / 自主可控 AI 架构（Zenodo 预印本）", "cats": [], "oneliner": "提出主权自托管企业 AI 平台 HSAAI：把企业 RAG、智能体工作流、AI 治理、身份与访问控制、安全、LLMOps/MLOps、可观测性统一进一个架构，强调数据主权、受控智能体执行、策略 enforcement 与可审计性。", "insight": "**关联较弱，工程路线对照**。唯一价值是路线对比：HSAAI 是\"集中式策略 enforcement\"路线——身份与访问控制作为平台统一层；我们是\"解耦\"路线——chunk 只存覆盖映射、策略独立存放、查询时逐 AU 求值。可以在相关工作里一句话点出这种分野：集中式平台在单组织内易落地，但跨组织/多租户时策略耦合是痛点，而这正是解耦要解决的。局限：Zenodo 工程白皮书性质，无同行评审；\"评估框架\"只定义了方法、未报告实测数字；身份与访问控制只是平台众多模块之一，无新机制。**不建议作为核心引用**，仅作工程背景点缀。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "HSAAI 是面向主权自托管的企业 AI 平台，让组织在掌控敏感数据与 AI 运营的前提下，获得 LLM、RAG、AI 智能体、企业知识、可观测性与云原生基础设施的安全治理访问。论文给出架构、设计原则、研究问题与评估框架：集成企业 RAG、智能体与多智能体工作流、AI 治理、身份与访问控制、安全、LLMOps/MLOps、可观测性与容器化部署；特别关注数据主权、受控智能体执行、策略 enforcement、可审计性、自托管部署、阿英双语企业 AI 与运营韧性；并定义了覆盖检索质量、事实忠实度、智能体任务成功率、安全策略 enforcement、系统性能、可靠性与双语负载的实证评估方法。定位为研究安全、主权、受治理的智能体 AI 的工程与研究平台，代码与技术产物经 HSAAI GitHub 项目公开。", "supplement": false}, {"title": "Systemic privacy risks of personal data exposure through conversational large language model agents", "authors": "Abdellah Ben Yahia 等", "url": "https://doi.org/10.1007/s44163-026-02431-5", "category": "会话式 LLM 智能体隐私风险综述（Discover Artificial Intelligence 期刊）", "cats": [], "oneliner": "系统性综述会话式 LLM 智能体带来的个人数据暴露风险：覆盖数据泄露与记忆化、对抗提取与提示注入、推理与重识别、监视画像、监管治理失效五个维度；指出差分隐私、联邦学习、机器遗忘等技术缓解在受控环境有效，但在会话环境中无法提供完整保护。", "insight": "**相邻相关，动机章节的引用弹药**。第一，它的核心结论——\"模型级技术缓解（DP/联邦学习/遗忘）在会话环境中失效\"——恰好是我们论文的立论支点之一：**需要架构级的访问控制（RU/AU 解耦），而不是只靠模型级缓解**。可在引言里引用为\"仅靠模型侧缓解不够\"的佐证。第二，它的五维分类里\"推理与重识别\"与我们的 embedding 通道泄露（cloze 89.4%@20）在同一问题域：即使文本被裁剪/保护，模型仍可从表示中推断敏感信息——我们的 per-view 重编码（降至 4.05%）正是对这类风险的架构级回答。第三，局限：综述无新机制；Discover Artificial Intelligence 是新兴期刊，引用权重中等。关联诚实定位为 adjacent，作背景引用。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "快速部署的会话式 LLM 智能体让个人信息（从健康数据、财务信息到生物标识）面临前所未有的暴露机会。该综述考察五个维度的隐私风险：数据泄露与记忆化、对抗提取与提示注入、推理与重识别、监视与画像、监管治理失效；把隐私威胁从静态数据泄露追溯到已成为架构一部分的动态威胁（2020–2026，神经记忆化与上下文推理）。核心发现：差分隐私、联邦学习、机器遗忘等技术缓解在受控环境有一定效果，但在会话环境中无法提供完整保护；隐私保护在低风险结构化环境或消费者主动维护时有效，但在缺乏人工控制、技术保障与法律责任的高风险领域保护不足。作者结合经典隐私保护数据发布（PPDP）理论与 LLM 新兴威胁做了证据冲突分析。", "supplement": false}]}], "total": 27, "n_days": 7, "all_total": 88, "all_days": 17};

ike Rogers。", "created_at": "10-16 07:37", "likes": 0, "reposts": 0, "replies": 0, "url": "https://www.trumpstruth.org/statuses/42380", "author": "realDonaldTrump"}, {"id": "tt-42379", "text": "（10-16 07:17 北京时间）宣布 10 月 22 日、11 月 1 日赴爱荷华州举行两场集会，为参议员候选人 Ashley Hinson 等六位共和党候选人背书。", "created_at": "10-16 07:17", "likes": 0, "reposts": 0, "replies": 0, "url": "https://www.trumpstruth.org/statuses/42379", "author": "realDonaldTrump"}, {"id": "tt-42378", "text": "（10-16 04:27 北京时间）抨击参议员 John Cornyn 与 Karl Rove 阻挠德州司法部长 Ken Paxton 的参议员竞选，呼吁支持 Cornyn 的选民转而支持 Paxton。", "created_at": "10-16 04:27", "likes": 0, "reposts": 0, "replies": 0, "url": "https://www.trumpstruth.org/statuses/42378", "author": "realDonaldTrump"}]}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2110841901121511705", "text": "Learn about the Rosalind Academic Plan, check your lab's eligibility, and find out how to apply: https://openai.com/index/introducing-the-rosalind-academic-plan/", "created_at": "10-16 05:15", "likes": 86, "reposts": 6, "replies": 2, "views": 25109, "url": "https://x.com/OpenAI/status/2110841901121511705", "author": "OpenAI"}, {"id": "2110841899838046525", "text": "GPT-Rosalind is built to support that work: helping researchers reason across scientific literature and biological data, with scientists bringing the expertise and judgment to evaluate the evidence.\n\nEligible labs can receive up to 12 months of sponsored access to OpenAI tools, with GPT-Rosalind access subject to trusted-access approval.\n\nResearch data shared through the Rosalind Academic Plan is not used to train our models by default.", "created_at": "10-16 05:15", "likes": 114, "reposts": 4, "replies": 8, "views": 28837, "url": "https://x.com/OpenAI/status/2110841899838046525", "author": "OpenAI"}, {"id": "2110841898076418336", "text": "We're expanding access to GPT-Rosalind for academic research.\n\nThe new Rosalind Academic Plan helps scientific labs bring AI into the work of understanding biology, exploring ideas, and deciding what to test next—with sponsored access for eligible labs at U.S. universities.\n\nAcademic research starts with questions whose impact may take years to impact human health.", "created_at": "10-16 05:15", "likes": 1246, "reposts": 119, "replies": 122, "views": 113671, "url": "https://x.com/OpenAI/status/2110841898076418336", "author": "OpenAI"}, {"id": "2110797830361436604", "text": "New voices. Better accents. And less \"checking...\"\n\nGPT-Live-1.1 brings these updates to Voice in ChatGPT, Codex, and dots, with new voices in French, German, Hindi, Mexican Spanish, Korean, and Japanese.\n\nRolling out today to all users. Coming soon to the API.", "created_at": "10-16 02:19", "likes": 6906, "reposts": 462, "replies": 503, "views": 499343, "url": "https://x.com/OpenAI/status/2110797830361436604", "author": "OpenAI"}, {"id": "2110741355739963884", "text": "We want to support the mathematics community in turning progress in AI into deeper human understanding and new discoveries. To support that goal, we are contributing $5 million to a new Simons Foundation initiative to help mathematicians examine, understand, and build on results produced by AI, including the results we recently published.\n\nThe funding, managed and awarded by the @SimonsFdn will support workshops, conferences, and special programs. We will also provide access to our models and computing resources to Simons Foundation-supported researchers.", "created_at": "10-15 22:35", "likes": 4293, "reposts": 337, "replies": 417, "views": 463567, "url": "https://x.com/OpenAI/status/2110741355739963884", "author": "OpenAI"}, {"id": "2110442001749659890", "text": "European businesses are rapidly expanding their use of AI agents. More than half of the AI use among our EU enterprise and business customers now involves these tools, and the number of small business users has grown 8x across the region.\n\nOur latest Economic Research report explores Europe’s shift toward agentic AI—and the opportunity to turn broader adoption into deeper use.\n\nhttps://openai.com/index/the-eus-next-chapter-in-ai-is-agentic/", "created_at": "10-15 02:45", "likes": 2793, "reposts": 222, "replies": 548, "views": 392856, "url": "https://x.com/OpenAI/status/2110442001749659890", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2107924677801001381", "text": "Have been waiting for this one for a long time, and I would hate to have to go back to the old version of Chat!", "created_at": "10-08 04:03", "likes": 890, "reposts": 18, "replies": 291, "views": 205564, "url": "https://x.com/sama/status/2107924677801001381", "author": "sama"}, {"id": "2107924408597950702", "text": "ChatGPT can now generate a custom UI for you!", "created_at": "10-08 04:01", "likes": 12012, "reposts": 552, "replies": 998, "views": 1841094, "url": "https://x.com/sama/status/2107924408597950702", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2110971985417441512", "text": "Either we are out of ideas or we are cooking. Time will tell", "created_at": "10-16 13:51", "likes": 9453, "reposts": 240, "replies": 2538, "views": 844458, "url": "https://x.com/thsottiaux/status/2110971985417441512", "author": "thsottiaux"}, {"id": "2110864861119045840", "text": "Je programme en français", "created_at": "10-16 06:46", "likes": 98, "reposts": 1, "replies": 38, "views": 6116, "url": "https://x.com/thsottiaux/status/2110864861119045840", "author": "thsottiaux"}, {"id": "2110864606088593672", "text": "Bonjour", "created_at": "10-16 06:45", "likes": 588, "reposts": 16, me": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2110977873645605272", "text": "@danizeres Love this! \nhttps://youcanjustbuildthings.openai.chatgpt.site/", "created_at": "10-16 14:15", "likes": 17, "reposts": 3, "replies": 0, "views": 2191, "url": "https://x.com/waynesutton/status/2110977873645605272", "author": "waynesutton"}, {"id": "2110891078064975927", "text": "You can just build [physical] things", "created_at": "10-16 08:30", "likes": 35, "reposts": 3, "replies": 2, "views": 3377, "url": "https://x.com/danizeres/status/2110891078064975927", "author": "danizeres"}, {"id": "2110877988137103391", "text": "My dot sent 60 messages to movers over several days, filled out quote forms, and handled the back-and-forth.\n\nI gave it my dates, what I needed moved, and permission to handle the conversations.\n\nWrote up how it went, and how to give yours a job like this. https://x.com/i/article/2110872348383694848", "created_at": "10-16 07:38", "likes": 62, "reposts": 4, "replies": 10, "views": 9879, "url": "https://x.com/nickbaumann_/status/2110877988137103391", "author": "nickbaumann_"}, {"id": "2110855386140229777", "text": "Learn how to build all of these projects or share yours so others can replicate it:\n\nhttps://youcanjustbuildthings.openai.chatgpt.site", "created_at": "10-16 06:08", "likes": 19, "reposts": 0, "replies": 0, "views": 2930, "url": "https://x.com/OpenAIDevs/status/2110855386140229777", "author": "OpenAIDevs"}, {"id": "2110855382444704190", "text": "A robot that turns photos into drawn portraits:\nhttps://x.com/oleksandrtsp/status/2100616897444110765?s=20", "created_at": "10-16 06:08", "likes": 15, "reposts": 0, "replies": 1, "views": 3350, "url": "https://x.com/OpenAIDevs/status/2110855382444704190", "author": "OpenAIDevs"}, {"id": "2110855370529034323", "text": "A little TV for a cat with a lot of energy:\nhttps://x.com/axbehr/status/2109841447767998532?s=20", "created_at": "10-16 06:08", "likes": 19, "reposts": 0, "replies": 2, "views": 1342, "url": "https://x.com/OpenAIDevs/status/2110855370529034323", "author": "OpenAIDevs"}, {"id": "2110855366787703209", "text": "Pitch your dreams and save them with this dream logger:\nhttps://x.com/fedesarquis/status/2110414012903038993?s=20", "created_at": "10-16 06:08", "likes": 29, "reposts": 0, "replies": 2, "views": 1414, "url": "https://x.com/OpenAIDevs/status/2110855366787703209", "author": "OpenAIDevs"}, {"id": "2110855363616763922", "text": "You can just build things with Codex\n\nWe built a site for you to explore hardware projects from the community and share your own.", "created_at": "10-16 06:08", "likes": 274, "reposts": 20, "replies": 33, "views": 16040, "url": "https://x.com/OpenAIDevs/status/2110855363616763922", "author": "OpenAIDevs"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2110846112152105136", "text": "Working out how best to use AI in mathematics research—and in science more generally—will take time, effort, and resources. We’re eager to support mathematicians as they drive scientific progress and define the future of their field.\n\nWe’ve committed $5 million of funding, compute, and Claude access to help the math community navigate the massive changes that AI brings. We’re partnering with @SimonsFdn, who will manage the award through a community-driven approach, supporting workshops, conferences, and lectures by domain experts.\n\nhttps://x.com/SimonsFdn/status/2110740786169979088", "created_at": "10-16 05:31", "likes": 835, "reposts": 58, "replies": 93, "views": 64598, "url": "https://x.com/AnthropicAI/status/2110846112152105136", "author": "AnthropicAI"}, {"id": "2110784662071398807", "text": "We’ve committed to having evaluators assess our safety practices. We're in discussions with multiple organizations, and have now given employee-like access to a team from @METR_Evals.\n\nIn this post, we describe how we work with third-party evaluators: https://www.anthropic.com/news/an-update-on-independent-evaluators", "created_at": "10-16 01:27", "likes": 1852, "reposts": 132, "replies": 244, "views": 209448, "url": "https://x.com/AnthropicAI/status/2110784662071398807", "author": "AnthropicAI"}, {"id": "2110720940665372825", "text": "Applications are now open for two new Anthropic Fellowships.\n\nSTEM Fellows (science and engineering) and Conceptual Reasoning Fellows (philosophy, cognitive science, economics, policy, and law) will spend four months at Anthropic from January 2027, working to help Claude reason well about some of the hardest problems in those fields.\n\nFor more information, see the descriptions below. The application deadline is October 28.\n\nConceptual Reasoning Fellows: https://job-boards.greenhouse.io/anthropic/jobs/5447080008\n\nSTEM Fellows: https://job-boards.greenhouse.io/anthropic/jobs/5452403008", "created_at": "10-15 21:14", "likes": 5336, "reposts": 404, "replies": 301, "views": 704725, "url": "https://x.com/AnthropicAI/status/2110720940665372825", "author": "AnthropicAI"}, {"id": "2110289695888511368", "text": "We’ve opened an office in Singapore—our fifth in the Asia-Pacific region. We’ve also signed an MOU with the Government of Singapore on AI safety and responsible adoption.\n\nYou can read more about our new office here: https://www.anthropic.com/news/singapore-office-opening", "created_at": "10-14 16:40", "likes": 3431, "reposts": 209, "replies": 456, "views": 714459, "url": "https://x.com/AnthropicAI/status/2110289695888511368", "author": "AnthropicAI"}, {"id": "2110047081414987957", "text": "New on our Engineering blog: Creating in-house source control. \n\nIn May, we merged around 2,500 code changes per day. In September, we merged more than 30,000 per day. As a result, we became bottlenecked by developer infrastructure built for human (rather than agent) scale.  \n\nHere, we share how we built a new version control system—and fully migrated our monorepo from git—in five months: https://www.anthropic.com/engineering/redesigning-source-control", "created_at": "10-14 00:36", "likes": 25507, "reposts": 2620, "replies": 1124, "views": 7838016, "url": "https://x.com/AnthropicAI/status/2110047081414987957", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2111038207240388770", "text": "Together with scientists around the world, our models and tools are helping make disease more detectable, treatable, and preventable. 🧬\n\nFrom pinpointing rare genetic variants to speeding up drug discovery, here’s how we’re helping turn lab breakthroughs into real-world care → https://goo.gle/4i48Cmr", "created_at": "10-16 18:15", "likes": 334, "reposts": 28, "replies": 86, "views": 28413, "url": "https://x.com/GoogleDeepMind/status/2111038207240388770", "author": "GoogleDeepMind"}, {"id": "2110724943860154669", "text": "Last week, Hurricane Isaias made landfall in the Florida Panhandle. Our thoughts are with everyone affected and with the recovery efforts still underway. Earlier and more accurate forecasting can help protect communities by giving them more time to prepare, and we are grateful that Google’s WeatherNext model was able to assist the @NWSNHC 's expert forecasters.\n\nBased on initial evaluations, here's how our model supported the response to #Isaias:\n\n- Tracking the Hurricane’s Path: WeatherNext was the most accurate model on the storm’s track. While traditional physics models predicted landfall closer to New Orleans, WeatherNext correctly predicted a path further east. This allowed NHC forecasters to highlight the potential for wind and storm surge impacts in the Florida Panhandle from their very first forecast. \n\n- More Time to Prepare: Up to three days before landfall, our model consistently predicted its eventual location in the Florida Panhandle to within 60 km or less, supporting the NHC as they honed in on a track toward the Florida Panhandle and issued hurricane watches and warnings to give officials in Florida, Alabama, and Mississippi more time to prepare. \n\n- Early Indications about Intensity: Early on, WeatherNext accurately predicted the intensification to a major hurricane. Alongside the regional hurricane models HWRF and HMON, WeatherNext’s intensity forecasts helped NHC forecasters to predict that the Isaias would approach the coast as a category 2 hurricane from the very first advisory. \n\nGiving communities more time and more accurate warnings is critical for protecting lives and livelihoods. While model performance varies from storm to storm, Isaias reflects our broader findings. In our recent @Nature paper co-authored with NHC forecasters, evaluating 200+ global tropical cyclones, we found our model provides ~1 day of additional lead time for both track and intensity.\n\nIt’s been an honor for the @GoogleDeepMind and @GoogleResearch teams to work alongside NHC forecasters. By combining AI, physics models, satellite data, and the crucial expertise of meteorologists, we're excited to keep pushing the boundaries of forecasting to help protect communities.", "created_at": "10-15 21:30", "likes": 54, "reposts": 3, "replies": 1, "views": 17642, "url": "https://x.com/PeterWBattaglia/status/2110724943860154669", "author": "PeterWBattaglia"}, {"id": "2110715601454784965", "text": "SynthID has been named one of @TIME's Best Inventions of 2026.\n\nWith over 180 billion images and videos already watermarked, it’s making it easier for people to distinguish AI-generated content from other media → https://goo.gle/4jsZxWF", "created_at": "10-15 20:53", "likes": 525, "reposts": 53, "replies": 143, "views": 50293, "url": "https://x.com/GoogleDeepMind/status/2110715601454784965", "author": "GoogleDeepMind"}, {"id": "2110490834739073049", "text": "Explore the latest advances in native audio models and the challenges of building better real-time voice experiences with @GoogleDeepMind + @SierraPlatform.\n\nLearn about conversational latency, multilingual code-switching, agentic voice tasks, and more →https://goo.gle/4hKV9B5", "created_at": "10-15 06:00", "likes": 112, "reposts": 11, "replies": 7, "views": 18267, "url": "https://x.com/googlecloud/status/2110490834739073049", "author": "googlecloud"}, {"id": "2110421873242861711", "text": "To advance more research with Gemini 4 Argon, we’re offering 10,000 scientists access to our highest usage tier in @GoogleAntigravity free of charge for 6 months.\n\nFind out more → https://goo.gle/3W85sXj", "created_at": "10-15 01:25", "likes": 110, "reposts": 6, "replies": 13, "views": 15724, "url": "https://x.com/GoogleDeepMind/status/2110421873242861711", "author": "GoogleDeepMind"}, {"id": "2110421871103730104", "text": "Argon also compressed the process of enzyme engineering into a matter of hours to design five lab-verified serine esterases. 🧬\nhttps://x.com/RyanKrue/status/2110046767341547602", "created_at": "10-15 01:25", "likes": 95, "reposts": 2, "replies": 5, "views": 16123, "url": "https://x.com/GoogleDeepMind/status/2110421871103730104", "author": "GoogleDeepMind"}, {"id": "2110421861435879476", "text": "Gemini 4 Argon is already unlocking new scientific breakthroughs in quantum computing, nuclear fusion, protein design and beyond. 🧵", "created_at": "10-15 01:25", "likes": 2345, "reposts": 292, "replies": 172, "views": 147044, "url": "https://x.com/GoogleDeepMind/status/2110421861435879476", "author": "GoogleDeepMind"}, {"id": "2110190101707858039", "text": "Over half of reported crimes in Singapore use sophisticated social engineering.\n\nWith @GovTechSG, we’re building on-device fraud detection using our open model Gemma.\n\nBy fine-tuning it on local scam tactics, it identifies threats in real time without compromising personal privacy → https://goo.gle/4ygVkJa", "created_at": "10-14 10:05", "likes": 625, "reposts": 56, "replies": 138, "views": 71210, "url": "https://x.com/GoogleDeepMind/status/2110190101707858039", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2110973461690802487", "text": "11 hours with Gemini 4 Argon, Google literally cooked with Gemini Argon. 🔥\nit's insane for building 3D stuff. A full Asuka-period Japanese pagoda temple, built in Blender and rendered in Cycles. The level of precision in everything is just crazy.", "created_at": "10-16 13:57", "likes": 399, "reposts": 26, "replies": 43, "views": 36480, "url": "https://x.com/ai_for_success/status/2110973461690802487", "author": "ai_for_success"}, {"id": "2110866446020710657", "text": "Gemini 4 Argon is live in Antigravity for paid Pro subscribers. As part of Pro, you get a separate weekly quota so it doesn’t eat up your Flash quota. Excited to see Antigravity push the limits of our best model yet. Love to see what you build!", "created_at": "10-16 06:52", "likes": 1229, "reposts": 70, "replies": 104, "views": 69017, "url": "https://x.com/_mohansolo/status/2110866446020710657", "author": "_mohansolo"}, {"id": "2110804298087203149", "text": "read more here: https://blog.google/innovation-and-ai/models-and-research/quantum-computing/magic-state-cultivation-quantum-computing/", "created_at": "10-16 02:45", "likes": 182, "reposts": 10, "replies": 21, "views": 24422, "url": "https://x.com/sundarpichai/status/2110804298087203149", "author": "sundarpichai"}, {"id": "2110804295352488143", "text": "Some magical progress towards \"magic state\" in quantum!\n\nOur @GoogleQuantumAI team has demonstrated \"magic state cultivation\" on physical hardware for the first time. The result is a const FIN = {"date": "2026-10-16", "md": "# ☀️ 财经大事早报 · 2026-10-16（星期五）\n\n## 📌今日大势\n\n**1. 美股惊天逆转，但 AI 信用风险才是主线。** 周四美股上演 V 型反转：道指大涨 **556 点（+1.08%）** 报 52177.69 点，标普 500 结束三连跌（+0.33%），纳指从盘中 **-1.4%** 收复至微涨。表面是\"逢低买入\"的胜利，底下却是资金在逃离 AI：半导体 ETF（SOXX）**八连跌**（2015 年以来首次）、AI 云厂商 CoreWeave 股债双双遭抛售，FT 直言 AI 借款人正面临\"**达尔文时刻**\"。上涨靠的是消费股（沃尔玛 +1.5%、耐克 +5%）和价值股接棒——**行情正在从\"AI 一枝独秀\"切换到\"去 AI 化\"的再平衡**，后续盯信用市场的违约信号比盯指数更重要。\n\n**2. 通胀再超预期，12 月加息概率升至近七成。** 美国 9 月 PPI 环比 **+1.3%**（四年多最大涨幅）、同比 +6.3%，叠加前一天超预期的 CPI，\"通胀恶化\"基本坐实。CME 数据显示市场押注 12 月加息 25bp 的概率达 **67.4%**、加息 50bp 的概率 **25.4%**。**今晚是关键窗口**：美联储主席沃什将在曼谷 IMF 年会上讲话，随后联储进入 10 月议息会议前的静默期——这是他最后一次释放信号的机会，偏鹰则美元和美债收益率上行、美股承压，偏鸽则成长股喘口气。\n\n**3. 中国资产逆势爆发，出口数据超预期。** 纳斯达克中国金龙指数涨近 **2%** 大幅跑赢美股大盘，新东方 +5%、网易 +2.73%、京东 +2.66%。基本面有支撑：中国 9 月出口同比增长 **36.3%**，进出口双旺。与此同时美债获避险买盘、10 年期收益率回落 **12.74bp 至 5.058%**，美元创逾一个月最大跌幅——全球资金正在\"**抛 AI 债、买美债、买中国资产**\"的三向流动中找位置。\n\n## 💰宏观与政策\n\n- **英国预算案盯上银行**：财政大臣 Healey 暗示将在预算案中对银行业加税，银行股承压。（来源：FT）\n- **德国 Merz 放话\"我们就是防火墙\"**：面对党内与极右翼压力，Merz 承诺战斗到底，德国政局走向影响欧盟财政与对乌政策。（来源：FT）\n- **G20 财长和央行行长会议今日举行**：议程聚焦全球债务、通胀与金融稳定，若强调财政风险，可能继续推高长端收益率。（来源：PANews）\n- **三部门联合调查尊界刹车问题**：工信部、中央网信办、市场监管总局成立联合调查组，核查尊界 V800 刹车踏板支架断裂问题，尊界深夜声明\"完全服从、全力配合\"——新能源汽车质量监管趋严的信号。（来源：看看新闻）\n\n## 📈市场与投资\n\n- **美债获避险买盘**：10 年期收益率跌 12.74bp 至 **5.058%**，2 年期跌 6.13bp 至 4.7382%；AI 相关债券遭抛售，资金转向国债。（来源：新浪财经）\n- **美元大跌**：彭博美元指数跌 **0.3%**，创 9 月 3 日以来最大跌幅，抹去通胀超预期带来的涨幅；兑瑞郎跌约 1%。（来源：新浪财经）\n- **哈佛捐赠基金回报飙升**：靠 AI 与 SpaceX 投资，哈佛捐赠基金回报大涨——顶级机构资金仍在 AI 一级市场赚得盆满钵满，与二级市场的 AI 信用恐慌形成鲜明反差。（来源：FT）\n- **easyJet 并购案投行分羹 3.34 亿英镑**：银行家和顾问从 easyJet 交易中拿走 **£334mn** 费用，欧洲并购费用池回暖。（来源：FT）\n- **加密货币盗窃新手法**： criminals 用藏有密码读取器的\"U盘状\"设备盗走 **9000 万美元**加密资产，硬件钱包用户注意物理攻击面。（来源：FT）\n\n## 🏠房价洞察\n\n- **9 月百城数据：新房结构性涨、二手普跌**：中指研究院数据显示，9 月百城新建住宅均价 **17285 元/㎡**，环比 **+0.17%**、同比 **+2.12%**；二手住宅均价 **12452 元/㎡**，环比 **-0.6%**、同比 **-6.94%**。亮点是**上海二手房价环比由跌转涨（+0.11%）**，上海、北京、杭州、成都均有优质新盘入市。（来源：东方财富/中新网）\n- **政策组合拳进入实施观察期**：9 月 29 日财政部等三部门明确 **10 月 1 日起符合条件的居民房贷享 1 个百分点贴息**；8 月三部门部署商品住房销售制度
