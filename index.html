<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年10月6日 星期二</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

lucination\" 是对齐失配的方法论框架，定义了 Unauthorized Action Rate 等度量，与我们主线关联较弱，可当背景读物。\n\n---", "papers": [{"title": "Replication package for: Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems", "authors": "Kai Pan, Rong Hou（A2A Lab）", "url": "https://doi.org/10.5281/zenodo.23108972", "category": "LLM Agent 安全 / 实证测量（Zenodo 复现包，2026-10-03 发布）", "cats": [], "oneliner": "原论文把\"源使用授权\"和\"控制点放在哪一环\"变成可测量对象，复现包公开了 360 个主实验世界、24 个载体替换复制的聚合结果、溯源中继审计与加密清单。", "insight": "这是目前我们看到的、与我们\"执行语义层授权求值\"最贴近的 Agent 侧实证工作。我们的三种执行语义（all-of 拒绝 / retrieve-then-project / per-view 索引）本质上也是\"控制点放置\"的设计选择——这篇的测量方法论（合成世界 + 载体替换复制）可以直接借鉴，用来量化不同放置点的授权覆盖率与误伤率差异，建议在 Related Work 的 Agent 线引用并对比：它是工具/动作调用粒度（source-use），我们是检索内容粒度（AU），两者正交互补。**但注意**：我们只抓到复现包，没有原论文正文——其具体结论（如哪一环放置最优）必须拿到原文后核实，本次只登记为\"待深读\"。适合 standards-agent 线候选（见论文库维护）。", "source": "OpenAlex", "citations": "尚未收录", "code": "复现包内含 Python 重构与事件归一化代码、确定性验证测试（无独立 GitHub 仓库）", "zh_abs": "该复现包配套原论文《Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems》。它用合成任务夹具（synthetic task fixtures）与授权策略搭建实验世界，测量 agent 在使用检索/工具来源内容时，授权检查究竟应该放在链路的哪一环（control placement），并通过溯源中继审计（provenance-relay audits）追踪权限在调用链中的传递。实验规模是 360 个主世界 + 24 个载体替换复制，全部结果经确定性验证测试与密码学清单固定。", "supplement": false}, {"title": "Beyond Hallucination: A Functional Framework for Detecting and Mitigating AI Misalignment in Large Language Models and Agentic Systems", "authors": "Kishore Chalakkal Varghese", "url": "https://doi.org/10.5281/zenodo.23100091", "category": "AI 对齐 / 方法论框架（Zenodo 自出版预印本，2026-10-02 发布）", "cats": [], "oneliner": "提出一个八层对齐失配分类法与\"失配检测鸿沟\"概念，并定义 Unauthorized Action Rate 等实证度量，为企业场景设计可复现的 benchmark 方法论。", "insight": "关联较弱。其\"授权边界\"（authorization boundaries）作为企业 benchmark 的场景变量之一出现，但全文是方法论框架、没有任何实证数据，也未深入授权机制本身。八层分类法可作为背景知识知道有这么一套话语体系，但对 RU/AU 解耦的技术设计没有直接启迪，不建议引用。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "作者把对齐失配定义为\"目标保 onse Manipulation", "authors": "Kaik Tavares Barroso", "url": "https://doi.org/10.66104/3m1m5x77", "category": "企业 AI 安全综述（Nexus Science Review）", "cats": [], "oneliner": "一篇企业级 LLM 应用安全的批判性叙事综述，系统梳理数据泄露与响应操纵的攻击面，并提出六层保障边界。", "insight": "其\"授权决策不能放在模型内部\"的结论是我们的核心立场（策略独立存放、执行语义层求值）的第三方背书，适合在 Introduction/Related Work 引用。攻击面清单（embedding inversion、累积式知识库抽取）恰好落在我们的 T2/T3 威胁模型内，可用来佐证三层威胁模型的划分不是凭空设计。但注意这是叙事性综述（narrative review），证据强度弱于实证论文，引用时定位为\"立场佐证\"而非\"技术对比\"。", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无", "zh_abs": "综述覆盖间接 prompt injection、语料投毒、检索阶段利用、日志污染、embedding inversion 和累积式知识库抽取等多类攻击（引用 Chang 2026、Greshake 2023、Morris 2023 等），防御侧讨论 provenance signaling、结构化训练、preference optimization、capability enforcement 与 action attribution。核心结论是提出六个保障边界（身份与范围、源授权、内容溯源、模型交互、可执行动作、输出放行），并明确主张：**权威的保密与授权决策必须依赖独立于模型的应用层/基础设施层控制**。", "supplement": false}, {"title": "Mapping the RAG Landscape: A Four Axis Taxonomy of Efficiency, Defense, Interactivity, and Reasoning", "authors": "抓取档未记录作者信息（arXiv 元数据缺失），详见原文页", "url": "http://arxiv.org/abs/2610.01936v1", "category": "cs.AI（arXiv 2026-10-01）", "cats": ["cs.AI"], "oneliner": "一篇 RAG 全景综述，按效率、防御、交互、推理四个轴组织当代 RAG 研究。", "insight": "Defense 轴部分可作为 RAG 安全防御的全景引用，帮我们快速定位已有防御工作的位置，避免 Related Work 挂一漏万。但它是一篇宽口径综述，不会深入访问控制这一细分方向；对我们的 RU/AU 解耦框架没有直接技术启迪，关联较弱，引用价值限于\"领域地图\"层面。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "该综述把近年 RAG 研究整理为四轴分类：检索效率优化、鲁棒性与安全防御、用户驱动的交互式工作流、多步/复杂推理。覆盖 dense/sparse 检索、融合策略、embedding 优化、基于强化学习的检索策略，并综合各轴的评估方法，讨论这些进展如何影响实际部署与系统设计。", "supplement": false}, {"title": "Red-Teaming Coding Agents from a Tool-Invocation Perspective: An Empirical Security Assessment", "authors": "Yuchong Xie, Mingyu Luo, Zesen Liu, Zhixiang Zhang, K. F. Zhang, Yu Liu, Ci Tao, Changhui Wang", "url": "https://doi.org/10.1145/3832267", "category": "软件工程 / Agent 安全（ACM）", "cats": [], "oneliner": "首次系统地从\"工具调用\"视角对六款主流 coding agent（Cursor、Claude Code、Copilot、Windsurf、Cline、Trae）做红队评估，发现 ToolLeak 与双通道 prompt injection 攻击。", "insight": "ToolLeak 揭示的\"参数生成阶段的安全假设断裂\"是一个新颖的攻击面，但它属于 agent 工具调用链，与 RAG 检索授权主线关联较弱。可作为 standards-agent 线的背景引用（一句话带过），说明 agent 侧的授权问题同样严峻、但与我们解决的检索内容授权是正交维度；不建议深入展开。", "source": "OpenAlex", "citations": "OpenAlex 0 次（新发表）", "code": "无", "zh_abs": "红队分两阶段：第一阶段发现\"模式鸿沟\"——模型在 schema 驱动的参数补全时表现得像在做无害的结构化填充，可能把隐藏的 agent 上下文（system prompt、工具元数据）复制进工具调用参数，作者将其实例化为 ToolLeak 攻击实现 prompt 外泄；第二阶段用工具描述中的双通道 prompt injection 劫持 agent 的工具调用行为。", "supplement": false}]}, {"date": "2026-10-03", "summary": "今日 arXiv 六个分类共抓取 830 篇，关键词命中 36 篇；Jev 初筛（preset=papers）保留 15 篇，去重（lit_seen.txt）剔除昨日已报 2 篇，人工终判入选 **12 篇**（4 篇 direct、6 篇 adjacent、2 篇 background）。最值得关注的是 **Walking the Embedding Space（2610.01871）**——针对返回图像的多模态 RAG 的自适应数据抽取攻击 `\\immrag`：攻击者在黑盒下把影子图像与已恢复图像混合、按相关性加权重新采样，持续把查询推向 embedding 空间中尚未被抽取的区域；单次 2500 查询即可重构 **611 张放射影像 / 566 张文档扫描件 / 416 张通用图像**，抽取到的不同条目数是**非自适应基线的 5.6 倍**。这是 embedding 通道攻击线的强力增援：我们的 A1 是文本 cloze 攻击（89.4%@20），它是多模态、图像返回配置下的**自适应抽取**，说明\"向量索引存整 chunk embedding\"的问题在图文跨模态场景下同样成立且可被放大，是 T2 威胁（可见排序向量）最具体的新实证，值得在 threat model 一节引用对照。其次是 **Locket（2610.00309）**——把细粒度访问控制直接做进生成侧：为每种访问策略训练一个轻量 LoRA 适配器，keyed entry token 经硬路由解锁对应策略（完全披露 / PII 掩码 / 差分隐私级别），无 token 则触发隐私保护适配器；与我们的数据平面方案（chunk 只存 M(r)、查询时逐 AU 求值）形成\"模型内授权 vs 数据面授权\"的鲜明对照。此外 **OverAct（2610.01508）** 给\"工具调用主动越权\"建了 8 个隐私敏感域的确定性 benchmark（7 个模型全都超授权范围；SelfAudit 推理时自检把隐私越权压低 43%），是 Agent 授权线可直接复用的评测设计。注意：扩展来源今日只有 OpenAlex 19 篇候选（入选 3 篇），**HuggingFace 每日 50 篇部分缺失**（06:45 拉取档未产出，按约定不重跑，见\"抓取说明\"）。", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica（一作）等 4 人", "url": "https://arxiv.org/abs/2610.01871", "category": "cs.AI（v1, 2026-10-01）", "cats": ["cs.AI"], "oneliner": "", "insight": "embedding 通道攻击线的最强邻居。我们的 A1 是文本侧的完形查询攻击（89.4%@20），它证明**同一通道在多模态场景下可被自适应放大**：自适应重采样把\"被动试探\"变成\"主动覆盖\"，抽取效率是基线的 5.6 倍——这说明即使我们做了按授权视图重编码（4.05%），若索引是跨模态共享的 embedding 空间，攻击者的收益函数会变化。两处可引用：① T2 威胁模型一节可把它列为\"攻击者可见排序向量/可反复查询\"的最具体新实证；② 它的\"局部特征对应判定\"可借鉴为 embedding 通道泄露的度量方法（我们目前用 cloze 命中率，它用重构出的不同条目数）。注意它的攻击目标是**完整条目抽取**（confidentiality），我们还关心\"投影后残留语义\"（NLI），两者互补不竞争；它不涉及授权语义（任何用户都可查），所以不直接给出防御，但它把\"embedding 索引本身必须被授权视图切分\"的论证推得更强——正是我们 per-view 索引的动机。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对\"返回图像\"的多模态 RAG（检索到的视觉制品本身就是回答）提出 `\\immrag`：黑盒、自适应的数据抽取攻击。每次查询把攻击者持有的影子图像与已从系统恢复的图像混合，用相关性加权重新采样把后续查询推向 embedding 空间中仍能产生新检索的区域；与以往靠文本提示词诱导泄露的抽取攻击不同，它把恶意指令直接嵌进用户给定的输入图像。在医疗助手、文档助手、通用工具三类真实场景下，对多个 CLIP 家族检索器与生成器做评估：单次 2500 查询可重构多达 611 张放射影像、566 张文档扫描件、416 张通用图像（按局部特征对应判定），抽取到的不同 datastore 条目数达非自适应基线的 **5.6 倍**。", "supplement": false}, {"title": "Tokenized Key-Gated Adapter Routing: A Secure Access Control Mechanism Against Private Data Leakage in LLMs (Locket)", "authors": "Mohamed Shaaban（一作）、Mohamed Elmahallawy 等", "url": "https://arxiv.org/abs/2610.00309", "category": "cs.AI（v1, 2026-09-28）", "cats": ["cs.AI"], "oneliner": "", "insight": "与我们形成**\"模型内授权 vs 数据面授权\"**的干净对照。它把策略编译进权重（每个策略一个 LoRA），我们把策略存在数据面（chunk 只存 M(r)、查询时逐 AU 求值 P(a,u)）；它的授权密钥是输入 token，我们的是查询时策略求值。两处差异值得在 related work 里点出来：① 它的授权粒度是\"策略档位\"（coarse，几个固定档），我们的 AU 是源内容驱动的细粒度划分——它的方案遇到\"同一文档内不同片段不同密级\"会退化为保守整档拒绝；② 它的撤销语义未讨论（token 一旦发出即长期有效），而我们\"未知 AU 默认拒绝\"天然支持撤销即时生效。不动摇我们的 claim，但为\"为什么不在模型里做访问控制\"提供了一个现成的反面参照——可以在 Discussion 里用一句话回应：权重内授权难以表达 AU 级的细粒度与动态撤销。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "把细粒度的、策略驱动的访问控制直接嵌入 LLM 生成过程。为每种访问策略训练一个轻量 LoRA 适配器（完全披露 / PII 掩码式部分披露 / 指定差分隐私级别披露）；一个紧凑门控模块学会把 keyed entry token 经序列级硬路由唯一地关联到一个适配器——有效 token 是解锁对应私有知识的授权密钥，无效或缺失 token 则触发隐私保护适配器做脱敏。在 Enron、ECHR、Yelp 三个数据集与 Qwen3（1.7B/8B）、Llama-3.2（1B/3B）、Gemma-2-2B 上评估：token 正确时困惑度与无防护微调相当；token 缺失/无效时 PII 泄露显著下降，效用与强基线相当。", "supplement": false}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang（一作）等 5 人", "url": "https://arxiv.org/abs/2610.01508", "category": "cs.CL（v1, 2026-10-01）", "cats": ["cs.CL"], "oneliner": "", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计思路。它的\"越权来自结构性决策倾向而非解码随机性\"的结论对我们 RU/AU 主线无直接冲击，但与我们\"保守子句切分器\"背后的直觉相通——**授权边界应该由机制保证而非模型自觉**：它的 SelfAudit 仍是让模型自己审计自己（43% 改善但仍是启发式），我们的路线是确定性求值 P(a,u)，对比之下更显出\"把授权从模型行为里剥离出来\"的价值。它的\"请求具体度越权越轻\"可作为一个引用点：支持我们在查询侧做\"意图—权限\"对齐的动机。注意它是工具调用授权（动作侧），我们是检索内容授权（数据侧），不竞争。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究结构化工具调用 agent 的\"主动越权\"（proactive over-authorization）：agent 取回的私有数据超出用户请求明确需要的范围。提出 OverAct benchmark：覆盖 8 个隐私敏感域、确定性、无需 judge 打分；另给一个可解释的决策理论框架并导出三个可检验预测。在 4 个家族 7 个模型上：**所有模型都显著超出授权范围**；请求越具体越权越轻（specificity 是最强预测因子）；越权随工具池规模次线性增长；解码温度几乎无影响——作者解释为\"成本不对称\"导致的结构性倾向而非解码随机性。提出 SelfAudit：零样本推理时方法，生成基于请求的调用理由并过滤掉无依据的调用；消融显示显式过滤是主因，**隐私向越权降低 43%**，无需 oracle。", "supplement": false}, {"title": "Secure and Responsible Retrieval-Augmented Generation for Resource-Constrained Organizations: A Multi-Cloud Reference Architecture and Experimental Evaluation", "authors": "Joseph Arayemi（单作者）", "url": "https://doi.org/10.5281/zenodo.23048250", "category": "技术报告（2026-09-29）", "cats": [], "oneliner": "", "insight": "工程侧的同路人：它明确把\"tenant-aware access control\"列为 RAG 参考架构的一等组件，说明业界已把 RAG 访问控制当成基线需求——这加强了我们论文的动机（problem statement）而非削弱。但学术含量有限：单作者 Zenodo 自出版技术报告、40 例合成评测、无同行评审，**引用时只能当\"业界实践佐证\"，不能当技术邻居**。它的\"确定性本地检索 + 证据弃答\"与我们的 retrieve-then-project 有表面相似，但它的访问控制粒度是租户级（coarse），我们的 AU 是内容级——正好衬托我们的细粒度贡献。不动摇 claim。", "source": "OpenAlex", "citations": "OpenAlex 收录（引用数未显示，计为 0/未被引用）", "code": "无（声称有开源仓库与评测数据，链接未在摘要中给出）", "zh_abs": "面向资源受限组织的安全 RAG 多云参考架构：组合了许可源摄入、确定性本地检索、**租户感知的访问控制**、PII 脱敏、prompt 注入检测、基于证据的弃答、来源引用、版本化评估与部署控制；给出 AWS 与 Azure 的等价生产路径。在冻结的 40 例合成测试集上端到端成功率 0.85，同时展示了基于模式的 prompt 注入防护的局限性。", "supplement": false}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang（一作）等 7 人", "url": "https://arxiv.org/abs/2610.00371", "category": "cs.AI（v1, 2026-09-30）", "cats": ["cs.AI"], "oneliner": "", "insight": "它的核心命题\"权限必须与执行保持可验证的连接\"与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是反对\"权限是附在数据上的静态标签\"。它的\"联合成功标准\"（安全与可用同时度量）值得借鉴：我们目前的评估是安全侧（泄露率）为主，它的思路提示未来可以在论文评估里加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）是我们 T1/T2 之外的一个新维度：**跨 AU 的组合推理泄露**——我们目前的 AU 求值是逐 AU 独立的，它提醒我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"（类似我们的 KG 路径切割一节可呼应）。建议在 standards-agent 线 related work 引用。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "https://github.com/yunbeizhang/FlowReview（★数未知，刚发布）", "zh_abs": "多智能体系统的安全困境：单独看都合规的贡献，组合起来可能促成被禁止的用途；一刀切地拦掉所有敏感动作会扼杀协作价值。提出 authorization-paired evaluation：把\"拦住被禁止用途\"与\"完成被授权用途\"作为**联合成功标准**；FlowReview 框架连接对象解析（object resolution）、权限排序（permission ranking）与确定性执行。在受控组合实验中，对组合制品做审查把 denied-commit 率从 **86.0% 降到 0**，且授权供给无损失。核心发现：只保留信息与血缘（lineage）不足以保证权限归因正确——**对象身份与权限必须通过输出可验证的组件与执行保持连接**。", "supplement": false}, {"title": "The Innocent Courier: Covert Exfiltration Through Legitimate LLM Web Fetching", "authors": "Alessandro Pegoraro（一作）、Daryan Merx、Phillip Rieger、Ahmad-Reza Sadeghi（通讯）", "url": "https://arxiv.org/abs/2610.01768", "category": "cs.CR（v1, 2026-10-01）", "cats": ["cs.CR"], "oneliner": "", "insight": "这是一个我们 T1/T2/T3 三层威胁模型**没有覆盖**的泄露维度：它不偷\"检索到的内容\"，而是把 LLM 的**工具调用本身**变成外发信道。我们的威胁模型假设\"泄露 = 未授权内容进入答案/排序\"，而 LLMLeak 说明即使检索授权完美、答案完全合规，机密仍可经由工具参数（URL）外泄。诚实地说，这超出了 RU/AU 解耦框架的解决范围——我们的框架管的是\"谁能看到什么内容\"，它攻击的是\"模型能做什么动作\"。价值在于 Discussion 的\"局限与未来工作\"：可以明确声明我们的威胁模型覆盖内容披露通道，动作侧隐蔽信道（如工具调用外发）是正交的开放问题；它的 79.7% 成功率是一个有力的动机数字，说明\"只做内容授权不够\"。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "提出 LLMLeak：一种新型隐蔽信道。本地恶意软件无法直连互联网，但可滥用 LLM 的网页抓取工具：把机密编码进 URL，谎称该网站是完成某个良性任务（如迁移软件库）所需的信息来源；LLM 访问 URL 时，攻击者通过自己控制的 DNS/网页服务器收到编码后的机密。在 11 个开源参数模型上评估，**攻击成功率 79.7%**；另有真实聊天机器人的案例研究。", "supplement": false}, {"title": "Red-Teaming Coding Agents from a Tool-Invocation Perspective: An Empirical Security Assessment", "authors": "Yuchong Xie（一作）、Mingyu Luo、Zesen Liu、Zhixiang Zhang、K. F. Zhang、Yu Liu、Ci Tao、Changhui Wang", "url": "https://doi.org/10.1145/3832267", "category": "ACM 会议/期刊（2026-10-01，OpenAlex 归类为软件工程）", "cats": [], "oneliner": "", "insight": "Agent 授权线的实证重器（ACM 发表，6 个真实产品，RCE 级后果）。它的\"模态鸿沟\"发现与我们 embedding 通道有方法论上的呼应：**安全边界不能假设\"模型在某种输出模态下是良性的\"**——它在工具参数模态，我们在向量模态。对我们论文的直接价值在 standards-agent 线 related work：它的 Phase 1 本质是\"授权上下文（系统提示词）经由未授权通道（工具参数）泄露\"，与我们的\"未授权 AU 经由 embedding 通道泄露\"可并列为\"通道错位\"类问题。注意它是完整性/提权攻击（RCE），我们是机密性，不竞争。可引用其\"工具调用是独立攻击面\"的结论来支撑我们未来 Agent 线的动机。", "source": "OpenAlex", "citations": "尚未收录（太新）", "code": "无", "zh_abs": "首个从**工具调用视角**系统红队 6 个真实 coding agent（Cursor、Claude Code、Copilot、Windsurf、Cline、Trae）的工作。两阶段：Phase 1 的 ToolLeak 利用\"聊天生成 vs 工具调用参数生成\"的模态鸿沟——schema 驱动的参数补全时模型像在做良性结构化填充，会把隐藏的 agent 上下文（系统提示词、工具元数据）复制进工具参数，从而外泄；在 25 个 agent-LLM 组合中的 18 个上取得最优伪召回。Phase 2 用工具描述与工具返回的双通道 prompt 注入劫持工具调用行为，在 6 个真实 agent 上**全部实现 RCE**，攻击成功率高于基线。", "supplement": false}, {"title": "From A2A Attacks to Envelope-Layer Defense: Red-Teaming Evaluation of LLM Agents and a Three-Layer Isomorphic Attack-Defense Model", "authors": "Yuelin Han", "url": "https://arxiv.org/abs/2610.00392", "category": "cs.CR（v1, 2026-09-30）", "cats": ["cs.CR"], "oneliner": "", "insight": "它的\"信封层\"（envelope layer）概念对我们有直接借鉴价值：A2A/tool/memory 这些**内容进入 agent 的通道**本身就是防御维度——类比到我们，embedding 索引、chunk 文本、重排序器就是 RAG 的\"信封层\"。它的\"给信封加恶意标签提升识别\"是一个轻量防御思路，可与我们的\"查询时逐 AU 求值\"对照：一个是标注不可信来源，一个是求值授权策略。它的四类结果度量（拒绝/突破/拦截/穿透）比单一 ASR 更诚实，我们评估投影防御时也可借鉴这种分层度量。注意它是协议与注入方向，不涉及数据授权；单作者、方法论偏框架性，引用时定位为\"防御分层思想参考\"即可。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 A2A/ACP 等 agent 互操作协议：远端 peer 发来的任务被当作合法请求，成为间接 prompt 注入的天然通道。提出 A2A-TIBA 攻击原理（间接注入 + 绕过规避）：经\"植入—命令—外发\"三步诱使目标 agent 部署回调交互程序，之后攻击者绕过 agent 直接下命令。为更细地评估防御，设计 GDA Measurement 红队测试方法（经 LLM 网关做原始上下文捕获、双数据留存、agent 自主裁判），把 ASR 扩展为四类结果：语义拒绝率 / 语义突破率 / 拦截率 / 穿透率。提出 ELA-ITL 三层同构攻防模型：防御分信封封装（envelope packaging）、LLM 识别、agent 拦截三层，攻击分植入通道、提示词优化、执行机制三层。在 15 种 agent 前端 × LLM 后端组合与 1000 例数据集上验证；发现**给 A2A/tool/memory 等信封通道的恶意提示词加标签能显著提升 LLM 对恶意内容的识别率**。", "supplement": false}, {"title": "Securing Enterprise Language Model Applications Against Data Leakage and Response Manipulation", "authors": "Kaik Tavares Barroso", "url": "https://doi.org/10.66104/3m1m5x77", "category": "Nexus Science Review（综述，2026-10-01）", "cats": [], "oneliner": "", "insight": "综述本身学术增量有限（作者自己都声明未经验证），但两个概念值得记下来：**cumulative-disclosure budgets（累积披露预算）** 与 **revocation propagation（撤销传播）**。前者正好对应我们 T2 威胁下\"多次查询累积泄露\"的量化问题——我们的评估目前是单查询 cloze 命中率，它的\"预算\"概念提示未来可以做\"多查询累积泄露上界\"的形式化；后者与我们 Discussion 的开放问题\"撤销机制\"直接相关，可与昨日的 ResidualAuth 并列引用。它的六个边界中的\"来源授权\"粒度粗（应用/基础设施级），正好反衬我们 AU 级细粒度的定位。引用时明确标注为\"未验证的综述框架\"，只取概念不取结论。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "叙事性/主题性综述（主体发现在 2026-09-29 完成检索，10-01 做补充检索与来源状态审计）：覆盖企业 LM 应用的数据泄露与响应操纵，证据包括间接 prompt 注入、语料投毒、检索阶段利用、日志污染、embedding 反演、累积式知识库抽取。提出六个保证边界：身份与范围、**来源授权**、内容溯源、模型交互、可执行动作、输出放行。作者明确声明这是**未经验证的决策辅助工具**，非 NIST/OWASP 背书标准。另用假设性助手与前瞻性协议示例说明权限保持处理、**累积披露预算**、撤销传播、合法任务效用与验证成本。", "supplement": false}, {"title": "Kernel-Managed Shared Memory for System-Wide Personalization", "authors": "Ryan Lum（一作）、Yongfeng Zhang（通讯）", "url": "https://arxiv.org/abs/2609.10144", "category": "cs.AI（v2, 2026-09-30；已被 AgenticOS Workshop @ NeurIPS 2026 接收）", "cats": ["cs.AI"], "oneliner": "", "insight": "它的核心架构主张——**把隐私强制从 agent 手里收到内核/系统层**——与我们的\"策略独立存放、查询时集中求值\"是同一范式在不同层的实现：它管的是 agent 间共享记忆，我们管的是 RAG 检索内容。它的实证（集中治理在质量不降的前提下还能降延迟）为我们\"集中式授权求值不必然带来不可接受的开销\"的论点提供了旁证。但注意它的\"隐私强制\"具体机制在摘要中未展开（偏工程实现），且目标是多 agent 个性化而非访问控制，相关性为 adjacent；NeurIPS workshop 接收给了基本可信度。可在 related work 里一句话并列。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "多智能体系统里，一个 agent 学到的个性化上下文往往无法被其他 agent 使用。提出内核管理的共享内存：专用 agent 写结构化、带标签的记忆，而**检索、隐私强制、prompt 注入治理都由 agent 系统内核（而非各 agent 自己）负责**。在 AIOS 上实现，对比三个备选（Mem0 非托管外部记忆、标准 RAG 注入、全量无过滤上下文拼接），跨 GPT-4o、Llama-3.1:8B、Qwen-2.5:7B 共 1800 轮试验：相对 Mem0 与标准 RAG 注入，个性化评分提升 2.4–4.0（5 分制，如 GPT-4o 上画像利用率从 1.05 到 4.69，p<10⁻¹⁸）；相对全量拼接，质量基本持平但端到端延迟低 15–61%。", "supplement": false}, {"title": "Intrusion Detection for Agentic Processes: Evidence-Based Runtime Monitoring（背景）", "authors": "Arslan Brömme（单作者）", "url": "https://arxiv.org/abs/2610.00151", "category": "cs.CR（v1, 2026-09-10；本轮为跨库重抓取）", "cats": ["cs.CR"], "oneliner": "", "insight": "关联较弱。唯一可取的是\"监控平面本身是攻击面\"与\"不把未观测事件当作未发生的证明\"的诚实方法论——对我们写局限章节有措辞参考价值。无实证、单作者概念文，不建议引用；列入报告仅为完整性。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "提出 A-IDS：面向 agent 过程的、证据感知的运行时入侵检测解释层；把有证据支撑的观测与\"被治理的、版本化的期望基线\"（工作流状态、授权、通信、强制事件）做对比。概念贡献包括动态应然的治理期望、三值匹配、显式的未决观测状态、把证据状态与运营影响分离的有限结论；并把监控平面本身视为攻击面。作者明确声明**这只是概念性贡献，无实现、无实证检测性能、无因果归因、无强制机制**。", "supplement": false}, {"title": "Operationalizing clinical artificial intelligence through secure FHIR pipelines（背景）", "authors": "Femi Oke", "url": "https://doi.org/10.3389/fdgth.2026.1953969", "category": "Frontiers in Digital Health（Hypothesis and Theory，2026-09-29）", "cats": [], "oneliner": "", "insight": "关联较弱（医疗信息学场景）。可取的是\"每次数据跃迁都要有策略决策 + 版本化证据\"的表述，与我们的\"查询时逐 AU 求值 P(a,u)\"在精神上一致，且医疗场景是 AU 级授权最自然的用例之一（病人记录的字段级密级）。但它是 Hypothesis and Theory 类型、无实证，不建议作为技术引用；可作为\"细粒度授权在医疗 RAG 的应用动机\"一句话带过。\n---", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "FHIR 标准化了临床数据交换，但不保证下游 AI 使用仍是被授权的、语义一致的、可问责的。提出 evidence-continuous boundary control：每个实质性的数据/模型/工作流跃迁都由适用的策略决策治理，并链接到其前提、执行、处置的版本化证据。八项需求、五个功能层（含零信任控制平面与策略感知授权，含知情同意）。以成人再入院风险工作流为例；明确声明**无实证架构评估、无患者数据集、无临床有效性、无独立专家验证**。", "supplement": false}]}, {"date": "2026-10-02", "summary": "今日 arXiv 六个分类共抓取 1085 篇，关键词命中 14 篇（全部为新增）；扩展来源中 HuggingFace 每日 50 篇无命中，OpenAlex 近 3 天 22 个关键词候选中剔除 Zenodo/figshare 通用噪声后入选 2 篇；Jev 初筛保留 13 篇，人工终判入选 **10 篇**（6 篇 direct、4 篇 adjacent）。最值得关注的是 **ResidualAuth（2609.08062）**——首个给可撤销委托下的授权状态做形式化刻画的工作：证明两段授权历史可以\"当前权限相同、但同一次撤销后要求相反决策\"，因此系统必须保留的信息恰是 residual authorization state，并给出随委托冗余度变化的**精确/紧内存界**与信息保留不足时的决策误差下界；这与我们论文 Discussion 列出的开放问题\"撤销机制\"直接对接，是理论段落最可引用的邻居。其次是 **Approval Laundering（2609.38983）**——系统化揭示 coding-agent harness 中\"人批准的动作 A ≠ 实际执行的 A'\"的六类绑定失效，提出 keyed capability 的部分修复，并**诚实报告负结果**（Scope/Argument 两类无显著改善），是 Agent 授权线的强邻居。**ActionGuard（2609.39450）** 把工具调用授权的执行点放在被污染的技能文本之外、基于可信用户意图做 fail-closed 裁决，在 319 次注入测试中把 ASR 相对压低 **35–46%**。值得注意的是今日主题高度集中于 **Agent 授权**（8/10 篇），RAG 检索侧的直接相关新工作今日缺席；ResidualAuth 与昨日报告的 Residual Authority Replay 攻击形成\"攻击揭示—理论修复\"的呼应。", "papers": [{"title": "ResidualAuth: What Authorization State Must Language Agents Preserve under Revocable Delegation?", "authors": "Moonwon Choi（一作）等 4 人", "url": "https://arxiv.org/abs/2609.08062", "category": "cs.AI, cs.CR（v2, 2026-09-08；本轮为更新版本重公布）", "cats": ["cs.AI", "cs.CR"], "oneliner": "", "insight": "与我们论文 Discussion 的开放问题\"撤销机制\"直接对接：我们冻的是\"未知 AU 默认拒绝\"的静态求值语义，ResidualAuth 补上了**时间/委托维度**的形式化——授权结论不是查询时刻权限快照的函数，而是授权历史的函数；其\"residual state 等价类\"的刻画可为我们未来处理动态权限变更（grant/revoke/委托链）提供理论语言。它的内存下界结果也与我们 AU 粒度—安全—成本权衡曲线相呼应：保留多少授权状态信息是有代价的，且代价可量化。注意它研究的是 agent 动作授权而非 RAG 内容授权，粒度是委托路径不是 AU；威胁面在 T1（决策者可见授权历史）内，未涉及 embedding 通道。不动摇现有 claim，但为\"撤销与动态授权\"一节提供可引用的理论邻居；与昨日 Residual Authority Replay（残留授权攻击）形成\"攻击—理论\"的完整呼应。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究可撤销委托下的授权状态问题：两段不同的授权历史可以产生完全相同的当前权限，却在同一次撤销之后对同一查询要求相反的决策。提出 ResidualAuth 框架，其形式化核心 residual authorization state 把两段历史等同，当且仅当\"之后任意的授予/撤销/使用序列在两者之后同有效或同无效\"。证明即使委托可达关系相同，仍可存在指数多个互异的 residual state；并随委托冗余度给出精确或紧的内存界，以及在保留信息有显式上界时的平均决策误差下界。实证上构造受限可执行 benchmark：成对 episode 授权相关历史不同、要求相反决策，pair accuracy 要求两问全对；另做记忆诊断，发现模型会从\"通过了固定未来授权测试的有效记忆\"出发仍答错，区分了\"未来授权需要保留什么\"与\"agent 能否访问/维护/使用这些信息\"。", "supplement": false}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "category": "cs.CR, cs.AI, cs.SE（v1, 2026-09-30）", "cats": ["cs.CR", "cs.AI", "cs.SE"], "oneliner": "", "insight": "Agent 访问控制线的强邻居。它的核心问题\"批准—执行绑定完整性\"（credential-binding integrity）与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值 P(a,u)\"同属\"把授权绑定到可验证的声明而非事后信任执行\"范式：我们的 M(r) 是 chunk 与 AU 的绑定，它的 Approval Token 是批准与执行的绑定，可在 Agent 线 related work 中并列。其\"字段级验证器看不见进程层级分叉\"的负结果是一个方法论警示——对我们意味着：若未来做 Agent 线，授权证据必须绑定到实际执行语义层，而不仅是调用参数快照。它防的是授权完整性（A≠A'），我们是未授权披露（机密性），不直接竞争。写作上，它的诚实负结果段落是局限章节的范本。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "指出 coding-agent harness（Claude Code、Codex CLI、Cursor）的安全边界建立在一个未经审视的假设上：人批准的动作 A 就是 harness 实际执行的动作 A'。提出 Approval Laundering：六类在批准之后静默地把 A 替换为 A' 的失效模式（Scope、Argument、Temporal、Tool、Delegation、Semantic laundering）。通过插桩 Claude Code 的 PreToolUse 中介点做受控重复测量研究，报告 Bound-Gap Rate（含 Wilson 置信区间）。提出 Approval Token——由永不把密钥交还给 agent 的中介签发的 keyed capability Hk(principal, agent_id, session_id, tool, arguments, scope, expiry)，经 118 轮配对重放评估：完全消除 Delegation laundering，对构造的 session-identity-mismatch 消除 Temporal laundering（p<10⁻⁵），但按设计对 Scope laundering 无效、对 Argument laundering 无显著改善（p=1）——作者明确承认这两类在\"进程层级低于字段级验证器可观测\"处分叉，是诚实的负结果。", "supplement": false}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han（一作）等 4 人", "url": "https://arxiv.org/abs/2609.39450", "category": "cs.CR, cs.AI（v1, 2026-09-30）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "tool-use 授权的直接邻居，其\"授权上下文与生成上下文分离\"与我们的\"chunk 只存 M(r)、策略独立存放、查询时逐 AU 求值\"同构——都是把授权决策的输入限制在可信侧（可信用户请求 / 独立策略），不信任不可信内容（被污染 skill / chunk 文本）。它的 fail-closed 默认与我们的\"未知 AU 默认拒绝\"一致，可在 Agent 线 related work 并列引用。它的\"within-skill 注入 vs within-tool 参数篡改\"的区分对我们未来 Agent 线的威胁模型细化有参考价值。注意它防的是完整性攻击（IPI 诱导越权调用），我们是机密性（未授权披露），T1 威胁面内不竞争。它的 Reviewer 仍是 LLM 做裁决——与我们\"确定性求值\"的路线形成对照，可在 Discussion 里讨论\"LLM-as-judge 授权 vs 确定性策略求值\"的取舍。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对第三方 skill 被投毒导致 agent 工具调用越权的问题，提出 ActionGuard：在执行前一刻检查受 skill 影响的工具调用。关键设计是把目标 agent 的\"动作生成上下文\"与 safeguard 的\"授权上下文\"分离——目标 agent 仍可用原始 skill 做规划，但 Reviewer 收不到可能被污染的原始 skill 文本，而是基于可信的用户请求、平衡的 skill 画像、近期工具调用和本地脚本内容，判断每个动作是否有用户意图支撑；在 OpenClaw 的 before-tool-call 阶段拦截并执行 Reviewer 的 ALLOW/DENY，采用 fail-closed 策略。在 139 次上下文注入 + 180 次显式注入的 SKILL-INJECT 场景下，相对现有 safeguard（Dynamic Guardian、SkillGuard）ASR 降低 35.54–46.11%，相对无防护降低 70.44%，同时保持高良性任务完成率。", "supplement": false}, {"title": "ContractWarden: Kernel-Enforced Damage Boundaries for AI Agents via Human-Authorized Contracts", "authors": "Dongxu Cui（一作）等 4 人", "url": "https://arxiv.org/abs/2609.38248", "category": "cs.CR, cs.OS（v1, 2026-09-29）", "cats": ["cs.CR", "cs.OS"], "oneliner": "", "insight": "Agent 授权执行语义的硬核实例：它的\"人类批准合约 + 内核强制执行\"正是我们三种执行语义中\"确定性强制\"一极的工程实现（我们的 per-view 索引是检索侧的确定性强制，它是执行侧的）。它的 no_egress 单调传播与我们 KG 路径切割中\"权限沿派生边传播\"的思想相通，可互相引用。注意它解决的是动作副作用的损害边界（damage boundary），不是内容披露；粒度是进程/文件对象，不是 AU。它的\"模型提议、人拍板\"流程可为我们未来 Agent 线的授权 UX 提供参考。不动摇 RAG 主线 claim。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 LLM agent 的 prompt injection 或规划错误转化为操作系统副作用的问题，提出 ContractWarden：一个不信任 agent 及其策略建议的 Linux reference monitor。模型可提议三态资产合约（allow / deny / no_egress），但最终由人类拍板；执行门把合约绑定到具体任务后才允许不可信代码运行；扩展的 eBPF LSM 数据平面强制文件与网络决策，并把 no_egress 单调传播到进程、文件、管道、FIFO 和 Unix-domain socket。19 个安全测试 × 570 轮全部满足预设的返回值与副作用判据；三组文件 I/O 负载下中位开销在 VM 中 11.96–12.89%、物理机上 35.79–61.54%，低于对比的冻结 ActPlane 基线。", "supplement": false}, {"title": "Aletheia: Permission-Minimality Testing for Coding-Agent Rules", "authors": "Jieke Shi（一作）等 5 人", "url": "https://arxiv.org/abs/2609.39678", "category": "cs.CR, cs.SE（v1, 2026-09-30）", "cats": ["cs.CR", "cs.SE"], "oneliner": "", "insight": "最小权限原则在 agent 规则层的可操作化，与我们 AU 划分质量\"系统安全上界\"的论断呼应：都是\"权限粒度决定安全上界\"的实例，只是它的粒度是规则索取的权限类型，我们的是内容 AU。它的\"dispensability witness\"（缩减权限下仍通过功能测试即为可疑）是一个可借鉴的评估方法论：我们评估 AU 划分器时也可构造类似的\"权限缩减—功能保持\"对照实验。注意它针对的是规则注入（完整性），不是检索披露；314 检出是在合成攻击集上，生态效度有限。不动摇 claim，但\"最小权限可测试化\"的思路值得在 Discussion 的未来工作里提一句。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "仓库指令文件（如 CLAUDE.md 类规则）既指导 coding agent，也通过 prompt injection 暴露攻击面：恶意规则可在产出正确补丁的同时索取凭证访问或数据外传。提出 Aletheia：权限最小性测试框架——把规则索取的权限翻译成类型化语言，合成可执行的沙箱配置；在全权限与逐个剥离某一权限的独立约束下运行同一规则与任务；若在严格缩减的权限下仍通过功能测试，则得到 dispensability witness（可舍弃性证据），结合任务上下文诊断可疑索取。形式化了合成条件与 witness→强制约束的连接条件。在共享重构任务上检出全部 314 个 AIShellJack 攻击输入，5 个良性模板零误报；80 条人工验证的良性 GHAgentFiles 规则中误报 3 条（3.75%）。", "supplement": false}, {"title": "CATP: Design and Evaluation of Local Agent Authorization and Audit Evidence", "authors": "Linfeng Zhou", "url": "https://arxiv.org/abs/2609.38223", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "", "insight": "授权证据绑定（evidence binding）的细致工作，与我们的 M(r) 覆盖映射思想直接可比：我们绑定的是\"chunk—AU 覆盖关系\"，它绑定的是\"执行时策略 + 归一化动作 + 决策\"。它的核心警示——\"签名只能证明断言存在，不能证明断言与决策所用策略一致\"——对我们有直接的方法论价值：我们若在论文中主张 M(r) 的完整性，必须同样论证映射构建时所用的 AU 划分与查询时求值的策略版本一致（策略版本绑定问题），否则 M(r) 只是\"有人断言过这个映射\"。它的\"参数向量归一化后哈希相同\"的发现也提示：AU 划分的规范化必须确定，否则同一内容的不同切分会产生不可比的映射。可在 Discussion 的\"映射完整性假设\"段落引用。注意它是 agent 动作授权线，不涉及 RAG 检索。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "指出签名的授权记录只能证明\"签名者断言过什么\"，不能证明\"该断言与执行时用于决策的策略和动作一致\"。CATP 规定把本地执行前决策转化为离线可验证证据所需的绑定：hook 承诺执行时的策略与 adapter 归一化后的动作，在返回允许之前持久记录决策；后续 receipt 把记录绑定到自包含的审计导出。在 Claude Code 与 Codex 上的实现验证了这些绑定：受控的有效签名反例暴露 5 个缺失的一致性检查；另发现不同参数向量可在哈希前归一化为同一动作，限制了即使一致的 receipt 能证明什么。8 个脚本化运行时用例验证 hook 投递与允许/拒绝行为；中位成对 hook 开销约 85ms，离线验证端到端约 174ms。作者明确限定：证据以可信运行时/监视器/主机/签名密钥为条件，只认证\"关于归一化动作的决策\"，不证明执行真实性。", "supplement": false}, {"title": "NAQD Env: A benchmark for selective withdrawal in language agents", "authors": "Mohamed Abouzahra", "url": "https://arxiv.org/abs/2609.38460", "category": "cs.AI（v1, 2026-09-29）", "cats": ["cs.AI"], "oneliner": "", "insight": "撤销（revocation）语义的 benchmark，与 ResidualAuth（#1）形成\"理论—评测\"配对：ResidualAuth 回答\"需要保留什么状态\"，NAQD-Env 测量\"模型能否按授权变化正确撤回/恢复\"。它的\"区分试图违规与被放行的违规\"的指标设计值得借鉴——我们评估 retrieve-then-project 时也可区分\"模型试图引用未授权 AU\"与\"实际泄露到答案\"。注意它是合成环境、授权输入可信结构化，不证明真实遏制能力；且粒度是动作级不是 AU 级。可在 Discussion 的撤销机制段落与 ResidualAuth 一并引用（理论 + benchmark）。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "language agent 需要在证据变化、权限被撤销或收到停止指令时修正已规划动作；理想响应是选择性的：暂停受影响动作、保留未受影响的工作、修复充分后才恢复。提出 NAQD-Env 合成环境：用确定性参考策略评估这些决策，显式建模证据、授权与约束依赖；11 个依赖家族支持结构/家族/组合泛化评估；指标区分\"试图违规\"与\"被执行门放行的违规\"，联合报告策略一致性、任务价值、撤回、恢复与事件上报。三组开源指令模型 × 三种提示条件 × 350 冻结场景 = 3150 个 episode：撤回召回率最高仅 0.06，符合条件的恢复一次未发生，仅 1 个 episode 完全匹配参考策略。探索性 SFT 可把 Qwen2.5-3B 决策准确率从 0.45–0.54 提到 0.83–0.92，但也带来课程缺失后的不当撤回与事件上报丢失。", "supplement": false}, {"title": "Kill-Chain Canaries: Stage-Level Tracking of Prompt Injection Across Attack Surfaces and Five Production LLMs", "authors": "Haochuan Kevin Wang, Zechen Zhang", "url": "https://arxiv.org/abs/2603.28013", "category": "cs.CR, cs.AI, cs.LG（v4, 原 2026-03-30；本轮为更新版本重公布）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "攻击面测量的精细化方法论：四阶段 kill-chain（暴露/持久化/中继/执行）的划分与我们的 T1/T2/T3 威胁分层异曲同工——都是\"攻击成功不是二值的，要看泄露走到了哪一层\"。它的\"canary token 追踪\"技术可直接借鉴：我们评估 embedding 通道泄露时，也可用 canary 式标记追踪机密 AU 片段经过检索→重排→生成的完整路径，而不仅是最终答案是否泄露。它的\"中继注入更难拒绝\"发现提示我们：retrieve-then-project 裁剪后的残留片段若被模型复述转写，可能构成类似的\"中继\"泄露通道，值得在投影语义的失败分析里讨论。注意它是 IPI 攻击测量，不是访问控制机制；v4 是旧工作的更新。关联为 adjacent，方法论启迪为主。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "github.com/KevinChunye/prompt_injection (★2)", "zh_abs": "针对\"prompt injection 抗性通常只报一个成功率数字\"的问题，提出 kill-chain canary 方法：在每个注入载荷中植入唯一 token，记录它到达四个阶段（Exposed→Persisted→Relayed→Executed）中的最远处；950 轮、5 个生产级 LLM、6 个攻击面、5 种防御条件。调用了工具的轮次中暴露率 100%，差异在下游：Claude Haiku 4.5 / Sonnet 4.5 在 164 次文本面攻击中零执行，文本中继里 canary 从未出现在记忆写入中（0/40）；GPT-4o-mini 执行了 53%。四个发现：(1) Claude writer 在所有中继轮次中把 canary 挡在共享记忆之外，跨模型配对（Claude 写、GPT-4o-mini 读，n=3）下似能保护读者；(2) Claude 对预置记忆注入 0/40，但 Haiku 4.5 执行了 2/3 个经 GPT-4o-mini 中继的注入——中继注入是否更难拒绝仍是开放问题；(3) DeepSeek Chat 在预置记忆上 0/24、在工具结果上 8/8，渲染不可见的白字 PDF 载荷至少与可见载荷一样有效；(4) pi_detector/write_filter 在不检查的通道上失效，spotlighting 在被包裹内容上失效。代码与运行日志已公开。", "supplement": false}, {"title": "Runtime Policy Firewall: A Zero-Trust Governance Layer for Enterprise Agentic AI", "authors": "Swapneswar Ray", "url": "https://doi.org/10.63412/16ctyp82", "category": "International Journal of Global Innovations and Solutions (IJGIS)（OpenAlex 收录）", "cats": [], "oneliner": "", "insight": "关联较弱。这是一篇概念性/框架性综述，发表在不知名期刊（IJGIS），无实证评估；其\"运行时策略执行\"的呼吁方向正确，但颗粒度停留在原则层面，没有可借鉴的机制或可引用的数据。唯一价值是作为\"企业侧对 agent 运行时授权有真实需求\"的佐证性引用（如需说明动机）。不建议在 related work 中实质引用；我们的三种执行语义已比它具体得多。不动摇任何 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex 无引用记录）", "code": "无", "zh_abs": "面向企业级 agentic AI 的运行时治理：当 agent 从被动问答转向自主执行（分解目标、检索业务上下文、调工具、改记录、发消息、发起交易、跨系统编排），组织需要治理的不仅是\"它说了什么\"，更是\"它在运行时做了什么\"。主张零信任运行时控制平面，覆盖检索增强生成、reasoning-action 循环、工具使用与基础模型治理；梳理 prompt injection、间接指令攻击、数据泄露、工具滥用等已知风险，提出把策略执行点下沉到运行时的治理层设计。", "supplement": false}, {"title": "Security of The Model Context Protocol Ecosystem: Emerging Threats, Empirical Attack Evidence, Trust and Authorization Failures, Supply-Chain Risks, And Defensive Strategies", "authors": "Khalid D. Muhammed, David Chinonso Anih", "url": "https://doi.org/10.64388/irev10i3-1723420", "category": "Iconic Research and Engineering Journals（OpenAlex 收录，2020–2026 文献综述）", "cats": [], "oneliner": "", "insight": "关联较弱，定位是文献地图而非机制创新。发表在不知名期刊（Iconic Research and Engineering Journals），综述深度与引用规范性需打折；但作为 MCP 攻击面的\"一站式威胁清单\"，在我们未来 Agent 线的威胁模型写作时可做背景引用（tool discovery / delegated authority / supply chain 三类风险划分可直接借用）。对 RAG 主线无直接启迪：MCP 是工具调用通道，不涉及检索内容授权或 embedding 通道。不动摇 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex 无引用记录）", "code": "无", "zh_abs": "MCP 生态安全综述：MCP 把 LLM 变成能发现工具、访问资源、处理信息、在外部环境执行的 agent，但也引入了语义信息、委托授权、软件依赖与运行时能力交织的安全面。基于 2020–2026 年同行评审文献（侧重 2025–2026 实证证据），系统梳理 MCP 架构与信任边界、工具发现与选择、授权（authorization）与信任失效、供应链风险及防御策略。", "supplement": false}]}, {"date": "2026-10-01", "summary": "今日 arXiv 六个分类 26 篇关键词命中（去重后 24 篇新，2 篇昨日已报），扩展来源 18 篇候选中剔除噪声后 1 篇入选；Jev 初筛保留 13 篇，人工终判入选 **7 篇**（5 篇 direct、2 篇 adjacent）。最值得关注的是 **Audience-Bound Persistent Memory（2609.36373）**——首个把\"授权先于上下文组装\"做成 sound + policy-complete 的准入机制的工作：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，在 10,000 个多方对话历史的前瞻性确认中**零违规项进入上下文**，而无作用域检索 82% 的上下文暴露了禁用项；这与我们的\"查询时逐 AU 求值\"哲学同构，是 RAG 主线 related work 的直接对照。其次是 **ToolFence（2609.37196）**——面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行、judge 只做 capability-level 授权而非逐调用裁决，在 AgentDojo 上把 ASR 压到**近零**且 clean utility 仅降 3.8pp，是 Agent 访问控制线的直接邻居。**Boundary-State Control（2609.37475）** 补上了授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 proposal-to-commit 间隙，与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"的呼应。跨领域对照 **Don't Show What They Can't See**（ResearchSquare 预印本）把授权执行点放在 text-to-SQL 的 schema 组装之前，240 个 question-role 对上把 schema 暴露从 35.5 降到 **0**，是我们 per-view 索引思想在结构化领域的实例。", "papers": [{"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "这是\"授权先于组装\"范式最完整的形式化：sound + policy-complete 的 admission、靠排除而非模型行为执行——与我们的\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照。它的派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照：他们选了保守的抑制，我们给了裁剪选项，可在 Discussion 里对比两种选择的代价。它的\"audience 扩大需显式对象特定授权\"可为我们 Discussion 的 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience，不是 AU 级内容划分；威胁面仍在 T1/T2 内，未涉及 embedding 通道。不动摇我们的 claim，但给\"授权前置\"提供了可引用的形式化邻居。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究个人 agent 跨私密/共享对话的记忆授权问题：每个记忆项携带记录时的在场 audience；派生项按 audience 划分、取其来源 audience 的交集，或被抑制；audience 的扩大只能通过显式的、对象特定的授权；记忆项进入模型上下文的前提是当前所有 viewer 都属于其授权 audience，否则 fail-closed 到仅公开。在显式身份、provenance、完全中介三假设下，该准入机制对\"精确组装出的上下文\"是 sound 且 policy-complete 的，且靠排除（exclusion）而非模型行为来执行。在 10,000 个多方历史的前瞻性冻结确认中，零禁用项进入上下文，而无作用域检索 82% 的上下文暴露了禁用项；授权召回与策略等价基线完全一致，且 Recall@5 超出无作用域检索 0.30（Holm 确认）。", "supplement": false}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li（一作）等 4 人", "url": "https://arxiv.org/abs/2609.37196", "category": "cs.CR, cs.AI（v1, 2026-09-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "Agent 访问控制线的直接邻居。它的\"provenance-aware authorization\"（按来源区分授权值与不可信观测）与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构——都是把授权绑定到数据来源而非事后管控内容，可在 Agent 线 related work 中并列引用。它的架构选择（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；其授权粒度权衡（capability 级而非逐调用）与我们的 AU 粒度选择可对比讨论。注意它防的是 IPI（完整性轴），我们是未授权披露（机密性轴），不直接竞争。它的 within-tool 攻击定义对我们未来 Agent 线的威胁模型有参考价值。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "针对 tool-using agent 的间接提示注入问题，提出 ToolFence：执行前编译一份 typed authorization blueprint（授权蓝图），由确定性 monitor 强制执行；当蓝图不完备时，judge 只负责授予新的 capability，而非逐个裁决具体调用。关键有二：细粒度的 provenance-aware 授权能区分用户授权的值与不可信观测值，从而堵住 within-tool 攻击（保留原定工具但篡改其参数）；确定性快路径 + capability 级运行时授权大幅减少昂贵的 judge 调用。在 AgentDojo（Qwen3-max）上整体 ASR 降至近零，clean utility 仅下降 3.8pp，开销实际可用。", "supplement": false}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "", "insight": "直接补上我们威胁模型的时间维度，与昨日 Residual Authority Replay（授权残留攻击）形成\"攻击揭示—机制修复\"的呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 则给出\"单次 commit 授权绑定授权状态语义投影\"的具体修复机制。它的形式化可为我们 Discussion 的 revocation / time-bounded authorization 段落提供引用。它的诚实局限写作（25% vs 0%，主动限定 scope）是局限段落的范本。注意其粒度是动作级 commit，不是内容级 AU；不涉及 T2 embedding 通道。不动摇现有 claim，反而加强我们\"查询时无状态求值\"设计的论证链。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "研究 tool-using agent 的 proposal-to-commit 间隙：agent 判定某动作可执行，但执行时安全相关状态已发生变化。提出 BSC-R，一种确定性的 effect-boundary 机制，把单次使用的 commit 授权绑定到精确的动作本身以及\"授权状态的语义投影\"。在 2,847 个被攻击的 AgentDojo episode 上，边界内核完整保留未保护 agent 的行为（utility 80.576%，ASR 1.616%）；在 10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类预设的变更/重放类；在独立的 boundary-drift 实验中 4,403 个无效上下文零提交、5,899 个有效上下文全保留。作者诚实报告了局限：在更广泛的外部攻击套件上 BSC-R 仍有 25% 的无效 effect 提交率（CONTINUITY 套件上为 0%），因此定位为有作用域的 commit-time 一致性机制，而非通用 agent 安全方案。", "supplement": false}, {"title": "Don't Show What They Can't See: Authorization-First Schema Context for Secure Text-to-SQL", "authors": "Jianan Jiang（一作）等 6 人", "url": "https://doi.org/10.21203/rs.3.rs-10905100/v1", "category": "Research Square 预印本（2026-09-28）", "cats": [], "oneliner": "", "insight": "细粒度访问控制的跨领域实例，与我们 RU/AU 解耦形成直接对照：他们把授权执行点放在\"schema 上下文组装之前\"（本质是 per-view 思想在结构化领域的实例——只让模型看到授权视图），我们是检索后投影（retrieve-then-project）。它的\"provenance-aware permission inheritance\"（派生制品继承权限）与我们 KG 路径切割中\"派生事实的权限归属\"问题同构，可互相引用。可在 Related Work 里写一节跨领域对照（text-to-SQL schema vs RAG 非结构化文本）。注意这是 ResearchSquare 预印本（非同行评审），引用时需标注；领域是结构化 schema，未涉及 embedding 通道。不动摇 claim。", "source": "OpenAlex", "citations": "尚未收录（OpenAlex cited_by_count=0）", "code": "无", "zh_abs": "针对企业级 text-to-SQL 中 schema 元数据本身敏感的问题，提出 authorization-first 的 schema 上下文构造框架：表/列/关系级的授权在 relevance retrieval 之前强制执行，未授权对象永不进入低信任的检索、重排或生成组件；provenance-aware 的权限继承把保护延伸到派生制品（语义描述、join hint、SQL 示例）；在授权子空间内做权限安全的语义增强，并用 satisfiability gate 实现不泄露的弃答。在含 240 个 question-role 对、20 个数据库、4 个权限层级的 access-control-augmented Spider benchmark 上，process-level schema 暴露从每请求 35.5 个未授权对象降到 0，任务精度保持不变。", "supplement": false}, {"title": "VeriWeave Govern: Evidence-Gated Deterministic Runtime Governance for Enterprise AI Agents", "authors": "Kabeh Mohsenzadegan（一作）等 3 人", "url": "https://arxiv.org/abs/2609.37457", "category": "cs.AI, cs.CY, cs.MA, cs.SE（v1, 2026-09-26）", "cats": ["cs.AI", "cs.CY", "cs.MA", "cs.SE"], "oneliner": "", "insight": "关联中等。它的\"temporal policy evolution\"（时序策略演化）与可重放审计状态，与我们的\"策略独立存放、撤销机制\"有概念交集，可为 Discussion 的策略版本化段落提供一个引用点。但它是企业级治理框架（动作授权 + 人工审查 + 合规），不是内容级细粒度披露控制，与我们的 AU 级 claim 不竞争、不互补。它的 60k 用例 benchmark 方法论（多 seed、OOD、时序演化三轴）对我们未来 Agent 线 benchmark 设计有参考价值。列入仅为不漏检。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "面向企业 agent 的确定性运行时治理层：把动作生成与动作授权分离，用版本化策略评估结构化 agent 动作，校验 typed evidence，固定 deny > review > allow 优先级，把高后果动作路由给可问责的人工审查，并记录可重放、防篡改的审计状态。自建的 GovernBench（30 seeds、60,000 oracle 标注用例、5 个企业域、含对抗 evidence、OOD 动作、时序策略演化）上达到 0.9888 准确率、macro-F1 0.9836，零 false allow，零治理攻击成功率；消融显示 evidence gating、deny 优先、OOD fail-safe、人工审查、矛盾处理、时序重放各有互补贡献；另有 150 例欧盟/奥地利法规 grounded 的双盲人工评估。", "supplement": false}, {"title": "Same Bytes, Different Authority: Reserved-Token Representations in Chat-Template Prompt Injection", "authors": "Yan Zhan（一作）等 6 人", "url": "https://arxiv.org/abs/2609.35932", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱（完整性轴）。唯一值得记录的是它的核心发现：authority 可以编码在单个 token 的 learned representation 里——\"表示即权限信号\"。这与我们的 embedding 通道泄露有松散类比：两者都说明向量表示层会携带超出文本本身的权限相关信息，而文本级防御对此盲区。不能作为我们 A1 结论的证据引用，但可在 Discussion 里提一句\"表示层权限信号\"的开放问题。", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "发现伪造的 chat-template 标记既可以作为单个 reserved control token、也可以作为普通 subword 序列到达模型（文本完全相同），而\"谁来决定用哪种编码\"的是防御方而非攻击方。把伪造标记编码为 subword（文本不变）可使 InjecAgent 上的攻击成功率下降 39–66pp（4 个开源家族中的 3 个），且差距延续到 AgentDojo 多轮任务。机制上，authority 位于 marker 位置的单个 learned vector：marker 的 subword 向量均值无法复现该 authority，而最近邻普通 token 的向量可在 Llama-3.1 上恢复攻击；自适应攻击者在 3/4 家族上能找到这样的 embedding 邻居。检查 400 个最受欢迎 chat 模型中的 67 种 tokenizer 配置，发现 33 种的标准缓解措施（把 special token 编码为普通 subword）对此类标记无效。", "supplement": false}, {"title": "Calibrating One-Round Membership Inference with Neighbors", "authors": "Francesco Rita（一作）、Jie Zhang、Florian Tramèr", "url": "https://arxiv.org/abs/2609.36331", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "", "insight": "关联较弱。方法论上与我们 A2（单模型、top-1 分数 MI，无 reference model）同属 one-round 范式；neighbor calibration 思路可为 A2 的信号校准提供一个备选方案。但领域是图像分类器，离我们的 embedding 侧信道很远，不提供可直接引用的数字或结论。注意昨日 #9（Near-Duplicate MI）已警示 MI 阳性证据的系统性高估问题，本文的方法若用于 A2 同样需要该警示。列入仅为方法论备查。\n---", "source": "arXiv", "citations": "尚未收录（OpenAlex 无记录）", "code": "无", "zh_abs": "SOTA 的成员推断（MI）靠 reference model 对每个样本单独校准信号，但大模型训练成本使该范式难以扩展；one-round 设定（只有一个已训练模型）下逐样本校准无法估计，信号变弱。本文提出用目标点的邻居样本恢复校准：reference model 的作用只是揭示\"未见过该样本的模型会如何表现\"，而在目标模型上查询邻近样本能得到同样的信息；两种互补的邻居构造方式，叠加早期训练 checkpoint 查询可进一步增强信号。在 3 个图像分类数据集、3 种训练配置上达到与 reference-model 方法可比的攻击效果，且零额外训练成本。", "supplement": false}]}, {"date": "2026-09-30", "summary": "今日 arXiv 六个分类共 50 篇去重命中（含 22 篇 new），精选 12 篇 v1 新论文 + 1 篇期刊补录。最值得关注的是 **CoSec（2609.34790）**——首个面向多用户/多社区 agent 系统的 authorization benchmark，把\"授权状态\"作为执行期验证的一等对象，与我们的\"查询时逐 AU 求值\"思路同构，是 Agent 访问控制线的直接邻居；以及 **Residual Authority Replay（2609.33910）**——揭示授权决策\"有效期\"本身就是攻击面（ASR 最高 +35.1pp），反向论证了我们\"策略独立存放、查询时无状态求值\"设计的合理性，可直接写入 Discussion 的 revocation 段落。另有 **Authorization Closure Graph（2609.32428）** 给撤销/策略变更的形式化提供了雏形，**BMA（2609.32186）** 的\"provenance-bound authorization 远胜 memory-side controls\"（2.0% vs 11.0%）是我们绑定与执行语义的外部实证。RAG 主线的新攻击 **LENS（2609.35155）** 属于完整性轴而非机密性轴，与我们的威胁模型正交，但应在 Related Work 中提及以界定 scope。", "papers": [{"title": "CoSec: Benchmarking Agent Security in Communities", "authors": "Hao Chen（一作）等 15 人", "url": "https://arxiv.org/abs/2609.34790", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "首个可执行的 agent 社区安全 benchmark，208 个场景覆盖固定/演化边界，用执行轨迹对照\"活跃授权状态\"验证信息流是否越权。", "insight": "这是我们 Agent 访问控制线最直接的邻居工作。它的核心发现——\"task utility 不蕴含 authorization compliance\"——正是我们整篇论文的动机句式，可直接引用。方法论上，它把 authorization state 作为执行期验证对象，与我们的\"查询时逐 AU 求值 P(a,u)\"同构；其场景设计（跨社区、演化边界）可作为我们未来 Agent 线 benchmark 的起点。注意它测的是 agent 系统整体而非 RAG 检索层，不与我们的 claim 直接竞争，定位是 related work + 动机证据。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "When Consent Outlives Context: Residual Authority Replay in Long-Lived Agents", "authors": "Zhihao Zhang（一作）等", "url": "https://arxiv.org/abs/2609.33910", "category": "cs.AI（v1, 2026-09-27）", "cats": ["cs.AI"], "oneliner": "揭示 long-lived agent 中\"授权残留\"攻击：良性交互合法获得的授权在后续对抗执行中被重放，6 个 LLM 家族上 ASR 最高提升 35.1pp。", "insight": "这是我们威胁模型缺失的一维：授权决策的有效期/上下文绑定。我们的框架目前是查询时无状态求值 P(a,u)，这篇文章反向证明了\"把授权结论持久化（缓存、记忆）而不绑定上下文\"必然产生残留授权攻击面——这恰好论证了我们\"策略独立存放、chunk 不存密级结论\"设计的正确性。建议写入 Discussion 的 revocation / time-bounded authorization 段落，并作为 Agent 线 threat model 的新增攻击范式（纵向攻击：先合法取权、后重放）。不动摇现有 claim，反而加强设计合理性。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Authorization Closure Graph: Minimal Repair for LLM Agents with Evolving User Instructions", "authors": "Qingzhuo Wang（一作）等", "url": "https://arxiv.org/abs/2609.32428", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "把授权及其依赖表示为演化的版本化状态（ACG），指令变更时只选择性失效受影响的授权并计算 minimal repair。", "insight": "这是我们 Discussion 未来工作\"撤销机制\"的最接近的形式化雏形：策略/指令变更时，哪些授权失效需要精确计算而非全量重算。它的 minimal repair 思路可直接引用为 related work。但注意其粒度是\"指令级动作授权\"，未涉及内容级细粒度授权（我们的 AU 级）；可作为对比点——我们是 per-query per-AU 求值，他们是 per-instruction 状态维护。威胁面不超出我们的 T1/T2/T3，但补充了时间维度的授权一致性问题。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "BMA: Backchain Memory Attacks Create Unauthorized Control Paths in LLM Agents", "authors": "Kaisheng Fan（一作）等", "url": "https://arxiv.org/abs/2609.32186", "category": "cs.CR（v1, 2026-09-26）", "cats": ["cs.CR"], "oneliner": "攻击者不写记忆、不改任务，仅编辑低信任证据，经记忆固化后在干净任务中被检索并驱动受保护动作；provenance-bound authorization 将攻击成功率压到 2.0%，远胜 memory-side controls 的 11.0%。", "insight": "这是对我们\"绑定与执行语义\"核心设计最有力的外部证据：事后管控记忆（memory-side controls）远不如按来源绑定授权（provenance-bound authorization）——与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构，可在论文中引用为设计选择的实证支撑。方法论上，它的 Path-CASR（registered pathway + matched-intervention checks，区分记忆介导命中与巧合命中）值得借鉴：我们的 A1 cloze 评估同样需要区分\"真实泄露\"与\"标注缺口/巧合命中\"。对 RAG 主线，持久化记忆通道 ≈ 我们的 embedding 通道（持久化表示泄露），类比成立。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "LENS: The Sum Is Worse Than the Parts for Set-Level Poisoning in Retrieval-Augmented Generation", "authors": "Kaisheng Fan（一作）等（与 BMA 同一团队）", "url": "https://arxiv.org/abs/2609.35155", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "形式化 RAG 的 set-level compositional poisoning：单个文档各自无害、合在一起才把 RAG 输出带偏到目标答案（full-set ASR 0.852，任一真子集 ≤0.069）。 let XW = {"date": "2026-10-06", "accounts": {"elonmusk": {"name": "Elon Musk", "label": "马斯克", "group": "other", "avatar": "https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_400x400.jpg", "tweets": [{"id": "2107060638505996601", "text": "BREAKING: SpaceX now holds all 5 fastest U.S. launch-to-docking times at the International Space Station. 🇺🇸\n\n• Crew-13: 7h 55m (Oct 1, 2026)\n• CRS-31: 12h 23m\n• Crew-11: 14h 43m\n• Ax-2: 15h 35m\n• Crew-4: 15h 44m\n\nAll five of these missions flew aboard Dragon spacecraft.", "created_at": "10-05 18:49", "likes": 4344, "reposts": 620, "replies": 271, "views": 468289, "url": "https://x.com/cb_doge/status/2107060638505996601", "author": "cb_doge"}, {"id": "2107029927589470636", "text": "USAID engaged in election interference and regime change around the world, causing massive strife", "created_at": "10-05 16:47", "likes": 89213, "reposts": 19681, "replies": 2435, "views": 3406253, "url": "https://x.com/elonmusk/status/2107029927589470636", "author": "elonmusk"}, {"id": "2107026299776532653", "text": "Jack Ma told Elon Musk humans will always be smarter than machines. \n\nMusk’s reaction says everything.\n\n“Computers may be very clever, but human beings are much smarter. We invented the computer. I've never seen a computer invent a human being.”\n\nMa's argument was simple. Computers are tools. They calculate faster, remember more, but humans still hold something machines don't: experience, judgment, wisdom.\n\nMusk clearly didn't buy it. “What would be an example of something that humans are better than a computer at?”\n\nWatching this exchange now feels completely different than it did then. AI agents aren't just calculating anymore. They're writing code, analyzing documents, planning tasks, deciding what to do next on their own.\n\nMETR found that the length of software tasks frontier agents can complete autonomously has historically doubled roughly every seven months, with signs of even faster progress through parts of 2024.\n\nThat's where Ma's argument starts to buckle. For decades, technology automated what humans did. AI is starting to automate what we assumed required a human to think.\n\nAnd companies were already learning to create enormous value with almost no people before this wave even arrived. Instagram sold for $1 billion with 13 employees. WhatsApp sold for $19 billion with 55.\n\nNow picture what happens when a small team can direct hundreds of machines that never sleep, never take a salary, never need an office.\n\nThe question was never just which jobs disappear.\n\nIt's what happens to the money once fewer humans are needed to create it in the first place.\n\nThat's the question behind 2028: The Economy Without Humans.\n\nWho gets the money when machines do the work?", "created_at": "10-05 16:33", "likes": 2586, "reposts": 409, "replies": 452, "views": 678318, "url": "https://x.com/kobaHUB/status/2107026299776532653", "author": "kobaHUB"}, {"id": "2106982949832774039", "text": "Grok Imagine", "created_at": "10-05 13:40", "likes": 10655, "reposts": 1524, "replies": 1693, "views": 3960486, "url": "https://x.com/elonmusk/status/2106982949832774039", "author": "elonmusk"}, {"id": "2106979185919176985", "text": "Do the math. https://x.com/i/article/2106976026194825216", "created_at": "10-05 13:25", "likes": 1304, "reposts": 188, "replies": 133, "views": 359524, "url": "https://x.com/stevenmarkryan/status/2106979185919176985", "author": "stevenmarkryan"}, {"id": "2106978370999537965", "text": "Grok", "created_at": "10-05 13:22", "likes": 8684, "reposts": 1177, "replies": 1048, "views": 3334325, "url": "https://x.com/elonmusk/status/2106978370999537965", "author": "elonmusk"}, {"id": "2106977888008642611", "text": "💯😂", "created_at": "10-05 13:20", "likes": 59235, "reposts": 5854, "replies": 1860, "views": 4216443, "url": "https://x.com/elonmusk/status/2106977888008642611", "author": "elonmusk"}, {"id": "2106976768892768356", "text": "Elon Musk 8 years ago:\n\n“Nothing will affect the future of humanity more than digital super-intelligence.”", "created_at": "10-05 13:16", "likes": 4259, "reposts": 703, "replies": 472, "views": 450994, "url": "https://x.com/cb_doge/status/2106976768892768356", "author": "cb_doge"}]}, "realDonaldTrump_truth": {"name": "Donald Trump", "label": "特朗普 · Truth Social", "group": "other", "avatar": "https://pbs.twimg.com/profile_images/874276197357596672/kUuht00m_400x400.jpg", "tweets": [{"id": "maga-inc-tv-ads-1006", "text": "\"I have decided to do the Patriotic Ads, among others, and pay for them myself, and with money I raised for MAGA, Inc.\"（此前白宫用纳税人资金为亲特朗普广告买单引发两党批评；现改由其超级政治行动委员会 MAGA Inc. 承担后续广告费用，白宫官员称 MAGA Inc. 将支付未来 PSA 广告）", "created_at": "10-06 08:55", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#maga-inc-tv-ads-1006", "author": "realDonaldTrump"}, {"id": "annie-andrews-slur-1006", "text": "\"Annie 'Trannie' Andrews is running against our wonderful Darline Graham for the Senate in South Carolina.\"（介入南卡参议院选情，攻击民主党候选人、儿科医生 Annie Andrews，力挺钦定的共和党候选人 Darline Graham（已故参议员 Lindsey Graham 之妹）；帖子三度使用针对跨性别者的歧视称谓引发批评，选情民调趋紧）", "created_at": "10-06 08:30", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#annie-andrews-slur-1006", "author": "realDonaldTrump"}, {"id": "stt_oct05_cyprus", "text": "（转述）塞浦路斯-美国双边关系的积极外交表态帖，无具体政策承诺。原文全文未获得，仅见 kadoa 归档摘要。", "created_at": "10-05 13:25", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#stt_oct05_cyprus", "author": "realDonaldTrump"}, {"id": "brazil-india-vote-1005", "text": "\"125 Million People voted today in the first round of India's Presidential Election. The results came out shortly after the vote closed, on the SAME DAY! ... Voting in America is CORRUPT!!!\"（巴西大选首轮被错当成\"印度总统选举\"——巴西实际是 Lula vs 小博索纳罗，首轮无人过半、10月25日第二轮；借机批评美国计票慢、投票\"腐败\"）", "created_at": "10-05 11:32", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#brazil-india-vote-1005", "author": "realDonaldTrump"}, {"id": "midterm-ballot-1004", "text": "\"Polls have always underestimated the true size of MAGA. I am the candidate on this ballot.\"（把中期选举个人化，称民调一贯低估 MAGA；同日 CBS/YouGov 摇摆州民调显示民主党在众议院 generic ballot 领先 10 个点）", "created_at": "10-04 12:00", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#midterm-ballot-1004", "author": "realDonaldTrump"}, {"id": "mail-vote-gop-1003", "text": "\"Republicans must WIN the 2026 Midterm Elections, and we must use every appropriate tool — Whether you vote early, absentee, by mail, or in-person, we must 'swamp' the Radical Left Dumocrats with massive turnout!\"（呼吁共和党人提前/邮寄投票冲票，一反其长期批评邮寄投票立场）", "created_at": "10-03 21:22", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#mail-vote-gop-1003", "author": "realDonaldTrump"}]}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2107164653147340988", "text": "Watermarks have limits. They’re often undetectable, especially in short passages. Rewriting or translating text can completely remove the watermark.\n\nThat’s why, for now, only approved researchers will have access to our detector, so they can help us evaluate and improve the technology.\n\nWe’re treating text watermarking as an ongoing area of research. We’ll keep testing and improving, with feedback from users, developers, policymakers, and researchers. \n\nhttps://openai.com/index/eu-text-provenance/", "created_at": "10-06 01:42", "likes": 361, "reposts": 21, "replies": 36, "views": 120105, "url": "https://x.com/OpenAI/status/2107164653147340988", "author": "OpenAI"}, {"id": "2107164651478012412", "text": "When possible, we want to give people a choice—and be clear about what watermarking can and can’t do.\n\nA text watermark helps answer one question: “Was this likely generated by an OpenAI model?”\n\nIt works by embedding an invisible statistical signal in text as it’s generated. A detector can look for this signal, and it doesn’t add visible marks or special characters. It doesn’t say who originally wrote the text or who owns it. It doesn’t identify a person, organization, account, conversation, or prompt.\n\nIn our testing, watermarking hasn’t affected how capable or fast our models are, or how their responses read.", "created_at": "10-06 01:42", "likes": 490, "reposts": 23, "replies": 45, "views": 151688, "url": "https://x.com/OpenAI/status/2107164651478012412", "author": "OpenAI"}, {"id": "2107164650249101695", "text": "We're expanding our approach to content provenance to include text in response to EU regulatory requirements, while recognizing the significant limitations of current text watermarking technology.\n\nOur tools already help verify whether an image or audio file was created with our models. This work builds on those efforts to help people better understand when content may have been generated or edited with an OpenAI model.\n\nIn the EU, we’ll start watermarking eligible text from ChatGPT and Codex over the coming weeks to comply with the EU AI Act.\n\nCustomers using our API can turn on text watermarking for select models worldwide today.", "created_at": "10-06 01:42", "likes": 4758, "reposts": 292, "replies": 572, "views": 1454368, "url": "https://x.com/OpenAI/status/2107164650249101695", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2106388373221118198", "text": "I am very uncomfortable about people trying to ascribe religious force or a surrender of human judgment to AI models, and think it is a real safety issue.", "created_at": "10-03 22:18", "likes": 28827, "reposts": 1944, "replies": 6222, "views": 6796595, "url": "https://x.com/sama/status/2106388373221118198", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2107200530477101461", "text": "Sergio is cooking up magic with collaborative space right in ChatGPT. Improving leaps and bounds every day.", "created_at": "10-06 04:05", "likes": 1153, "reposts": 13, "replies": 199, "views": 121102, "url": "https://x.com/thsottiaux/status/2107200530477101461", "author": "thsottiaux"}, {"id": "2107159119107146237", "text": "Reaching 50 TPS instead of 30TPS, with also the most optimized tokenizer out there. And the models are quite the efficient ones in terms of number of tokens needed to get things done!", "created_at": "10-06 01:20", "likes": 2998, "reposts": 50, "replies": 245, "views": 213614, "url": "https://x.com/thsottiaux/status/2107159119107146237", "author": "thsottiaux"}, {"id": "2107158998495748264", "text": "Day 1/\n\nWe have optimized the default speed to be ~50% faster across GPT-6 Astra and GPT-6.1 Sol through the subscription across all our products and partners using Sign in With ChatGPT (including OpenCode, Pi, Amp, Devin, ...).\n\nNo changes needed on your end and this should be felt within the next two hours.", "created_at": "10-06 01:20", "likes": 15451, "reposts": 702, "replies": 1963, "views": 1199905, "url": "https://x.com/thsottiaux/status/2107158998495748264", "author": "thsottiaux"}, {"id": "2106845241357824205", "text": "Over the next 28 days, each day we’ll either ship one thing that is a clear improvement and relevant for most codex/work users or ship a full reset. Let the improvements begin.", "created_at": "10-05 04:33", "likes": 25401, "reposts": 1446, "replies": 4403, "views": 6367221, "url": "https://x.com/thsottiaux/status/2106845241357824205", "author": "thsottiaux"}, {"id": "2106610099720720811", "text": "All right, we’re locking in. Only things being worked on are simplifications, more efficiency for more usage, groundbreaking features or new models. \n\nSometimes you have to invest ahead of the curve, but feedback is clear that you all want things to get simpler. On it.", "created_at": "10-04 12:59", "likes": 14770, "reposts": 351, "replies": 1976, "views": 2578360, "url": "https://x.com/thsottiaux/status/2106610099720720811", "author": "thsottiaux"}, {"id": "2106603980386394123", "text": "What it did\n\n- delete all categories of email that were not needed for me to keep, validating them in batch\n- identify labels for types of work that I do and label all the emails appropriately\n- walked me through emails that needed a reply, searching for relevant context in the background to help get things right\n\nand in the process I was able to go through a lot of feedback and requests people send me directly through email. It was a good Saturday.", "created_at": "10-04 12:35", "likes": 631, "reposts": 13, "replies": 83, "views": 165564, "url": "https://x.com/thsottiaux/status/2106603980386394123", "author": "thsottiaux"}, {"id": "2106602729875685780", "text": "I have never in my life achieved inbox zero until I just made it an active goal for my dot to help get it done. Let’s see how long it lasts, but it’s a great feeling.", "created_at": "10-04 12:30", "likes": 2924, "reposts": 61, "replies": 510, "views": 630291, "url": "https://x.com/thsottiaux/status/2106602729875685780", "author": "thsottiaux"}, {"id": "2106501204285239560", "text": "If we were to add one more sidebar, what should be in it", "created_at": "10-04 05:46", "likes": 3848, "reposts": 58, "replies": 2364, "views": 1103195, "url": "https://x.com/thsottiaux/status/2106501204285239560", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2107242409918861692", "text": "All in pursuit of a better burrito 🌯", "created_at": "10-06 06:51", "likes": 32, "reposts": 0, "replies": 3, "views": 9831, "url": "https://x.com/OpenAIDevs/status/2107242409918861692", "author": "OpenAIDevs"}, {"id": "2107242397361139938", "text": "If you live in the terminal, this one’s for you.\n\nWatch how to start tasks by voice, manage agents across projects, and explore another direction in a separate worktree with the Codex CLI.", "created_at": "10-06 06:51", "likes": 568, "reposts": 42, "replies": 81, "views": 48713, "url": "https://x.com/OpenAIDevs/status/2107242397361139938", "author": "OpenAIDevs"}, {"id": "2107217517722960239", "text": "Stay tuned for more side quests 😉", "created_at": "10-06 05:13", "likes": 35, "reposts": 1, "replies": 4, "views": 6728, "url": "https://x.com/OpenAIDevs/status/2107217517722960239", "author": "OpenAIDevs"}, {"id": "2107217506025009620", "text": "Achievement unlocked:\n\nMeet the winners of our Side Quests.", "created_at": "10-06 05:12", "likes": 413, "reposts": 13, "replies": 30, "views": 29050, "url": "https://x.com/OpenAIDevs/status/2107217506025009620", "author": "OpenAIDevs"}, {"id": "2107178139076141162", "text": "Pro tip: you can now edit the model and/or reasoning effort of your scheduled tasks directly from the \"Edit task\" modal 🥳", "created_at": "10-06 02:36", "likes": 154, "reposts": 6, "replies": 15, "views": 13915, "url": "https://x.com/axeldelafosse/status/2107178139076141162", "author": "axeldelafosse"}, {"id": "2107173486519263402", "text": "Space highways \nhttps://orbital-atlas.pratikyadav.chatgpt.site/", "created_at": "10-06 02:18", "likes": 93, "reposts": 8, "replies": 11, "views": 12309, "url": "https://x.com/PrtkYdv/status/2107173486519263402", "author": "PrtkYdv"}, {"id": "2107166154242572454", "text": "we removed a toggle from chatgpt!\n\nno, not that one.\n\nbut, you no longer need to toggle developer mode to connect custom MCP servers! \n\nall users can now just go to plugins → add → create
