<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年11月14日 星期六</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-11-14", "summary": "", "papers": [{"title": "CapLite: Prompt-Injection Defense for Small Language Model Agents without Model-Written Security Artifacts", "authors": "Zimo Xu、Wenzhuo Liu、Hideki Nakayama", "url": "https://arxiv.org/abs/2611.17115", "category": "arXiv 预印本（cs.AI / cs.CL / cs.CR，2026-11-12）", "cats": ["cs.AI", "cs.CL", "cs.CR"], "oneliner": "小模型 agent 写不出可信的安全工件——作者放弃“让模型自己写策略再由代码执行”的路线，改从工具 schema 派生策略、写操作先提交，13,935 个被攻击回合零攻破。", "insight": "这是今日与我们工作咬合最紧的一篇，直接支撑 ChainBind“执行时授权绑定”的立论。第一，它的否定性结论——小模型写出的权限策略本身不可信——正是“批准不是执行”的实证版：把授权判定外包给模型去“写”，等于把授权锚点放在了可被注入改写的同一层；我们的运行时绑定不依赖模型写出的策略、只认批准时锁定的参数，恰好绕开了这个失败模式，引用时可把 CapLite 的 14/13/11 当作“模型写策略不可信”的第三方证据。第二，它的“写完整性”保证（接收方、金额、对象、目的地四元组必须出自用户请求）与我们 AU 求值的思路同构，可在相关工作里并列：它管的是写操作的授权绑定，我们管的是检索单元的授权绑定，两者合起来覆盖 agent 的读与写。第三，它的评估口径值得借鉴——13,935 回合零攻破 + 单位 token 效用——我们在写 cloze 攻击评测时也可以同时报告“攻击成功率 + 授权检查开销”，而不是只报成功率。诚实标注：结论限定在 1.7B–12B 的开源小模型与 AgentDojo 套件上，大模型是否同样写不出可信工件本文未测；“零攻破”是在作者的攻击集内成立，不宜读成对一切注入免疫。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "CaMeL、Progent、IPIGuard、DRIFT 等强制执行型 prompt 注入防御，都要求 agent 自己的模型先写一份安全工件（程序、权限策略、依赖图或约束列表），再由代码强制执行。本文问：小语言模型（SLM）agent 写得出可信的工件吗？在 15 个开源模型（13 个为 1.7B–12B 参数）上的实测答案是否定的：模型写出的策略、图与约束，在 14 个（Progent）、13 个（IPIGuard）、11 个（DRIFT）模型上可被攻破；CaMeL 的程序在高达 68% 的回合里根本跑不起来。作者提出的 CapLite 不再让模型写策略：策略从工具 schema 派生，写调用在读取任何工具结果之前提交，且只有当决定“写给谁、写多少、写什么对象”的全部参数都出自用户请求时才放行。这保证了写完整性：注入文本无法新增写操作，任何写操作都到不了用户没点名的接收方、金额、对象或目的地。在 13,935 个被攻击的 AgentDojo 回合中零攻破；受攻击下的效用与 CaMeL 相当（29.0% 对 27.2%），但每回合只用 17.1k tokens，是 CaMeL 的 18%，为全部强制执行型防御中单位 token 效用最高者。", "supplement": false}, {"title": "S1-Evo: Experience-Guided Evidence Competition Attacks on Typed System-1 Decision Models", "authors": "Kaixiang Wang、Junjie Li、Zhaojiacheng Zhou、Jiong Lou、Jie Li", "url": "https://arxiv.org/abs/2611.16937", "category": "arXiv 预印本（cs.AI，2026-11-12）", "cats": ["cs.AI"], "oneliner": "LLM agent 里图便宜用的 System-1 判定模型（路由、审核、授权）同样可被操纵：作者用“证据竞争”攻击在 4 个 benchmark、3 个 S1 模型上打出 71.99% 平均攻击成功率。", "insight": "这篇直接攻击了我们威胁模型里一个尚未单列的点——授权判定本身的可操纵性。第一，我们的 T1/T2/T3 按攻击者“能看到什么”分层，默认授权判定（AU 求值）是可信的执行点；S1-Evo 说明当 AU 求值本身由一个廉价判定模型承担时，判定就成了攻击面——注入不需要改写策略，只需在证据层面“竞争”过原始任务证据，就能翻转授权分支。这支持我们在讨论里补一句边界声明：AU 求值必须发生在模型之外（确定性求值），一旦把求值外包给 S1 模型，T1 攻击者就多了一条直达授权判定的路径。第二，它的“证据竞争”机制与我们的 embedding 通道泄露有呼应：两者都是“不可信内容在表示层与可信内容竞争”；我们在写威胁模型时可把这一机制列为 T2 的一个实例。第三，24% 的端到端违规率是一个可引用的数字：用廉价判定模型做授权，违规不是理论风险。诚实标注：攻击针对的是 S1 式“打分选项”接口，不是通用的 LLM 授权判定；71.99% 是在作者的 4 个 benchmark 与 3 个 S1 模型上的均值，跨部署的普适性未验证。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "类型化的 System-1（S1）决策模型越来越多地部署在 LLM agent 中做路由、审核与授权，以节省推理成本，但不可信上下文仍可操纵其类型化输出、改变执行分支。与逐 token 解码的 System-2 模型不同，S1 接口直接对动态规则与选项打分，针对文本续写或显式覆盖指令的攻击并不适用。本文提出 S1-Evo，一个针对 S1 的“基于合约的选项竞争 + 边际反馈”自演化攻击框架：通过合约感知的证据通道扰动不可信字段，在保持事实不变的前提下诱发与原始任务证据的“证据竞争”；离线阶段用方向性边际与重验证引导的反馈搜索优化候选，把验证过的翻转沉淀为经验卡片；测试时检索相关卡片为新任务构造扰动。在 4 个 benchmark、3 个 S1 模型上，S1-Evo 达到 71.99% 的平均攻击成功率与 57.47% 的高置信攻击成功率，并导致高达 24.00% 的端到端 agent 违规。", "supplement": false}, {"title": "PolicySniff: Inferring Agent Policy States through Shared-GPU Execution", "authors": "Weimin Fu、Minghao Shao、Zeng Wang、Qiying Li、Yuntao Liu、Johann Knechtel、Ozgur Sinanoglu、Muhammad Shafique、Ramesh Karri、Xiaolong Guo", "url": "https://arxiv.org/abs/2611.16158", "category": "arXiv 预印本（cs.CR，2026-11-12）", "cats": ["cs.CR"], "oneliner": "agent 的审批策略设置（做危险工具调用前是否先问用户）会通过共享 GPU 上的专家路由时序泄露，共驻攻击者能以 94.17% 的准确率识别部署了哪档设置。", "insight": "这篇为我们的核心主张——“授权判定在检索结果进上下文前由架构保证、强制执行在模型之外”——提供了一个新的侧信道论据。第一，它证明即使 agent 行为上完全合规（两种设置下决策相同），审批策略本身仍可通过硬件时序泄露 88.82% 的准确率；换言之，把授权“藏进模型提示词”既不可执行、也不可保密。我们的 AU 求值放在检索路径的确定性环节、不经过模型推理，天然不在这条泄露通道上，写讨论时可引用此文作为“模型内授权”的又一个反例。第二，它的最后一句结论与我们的架构主张逐字同向（enforce authorization outside the model），可作为相关工作里的一句支撑引用。第三，它提醒我们在威胁模型里补一个维度：T2/T3 的攻击者若与服务共驻 GPU，不仅能看到排序向量，还可能推断授权配置本身——这对多租户部署的 per-view 索引是个值得在“未来工作”里提一句的扩展点。诚实标注：攻击依赖 eager 稀疏 MoE 运行时（每个专家独立成任务）与“攻击者已知候选设置并能事先画像”这两个较强前提，结论在稠密模型或非 MoE 部署上是否成立本文未验证。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "LLM agent 通过系统提示词里的指令落实审批设置（例如做有后果的工具调用前是否先征求用户同意），运营方通过限制对提示词与响应的访问来为这些设置保密。既有审计只检查 agent 是否遵守设置，不检查邻近进程能否推断出部署了哪档设置。本文提出 PolicySniff：通过共享 GPU 执行推断 agent 的审批策略状态。知道候选设置与任务的共驻攻击者先对两种设置做画像，然后在 agent 处理任务时只计时自己的 GPU 内核；由于策略前缀在捕获前已被缓存，攻击者观测到的是两种设置下完全相同的任务后缀处理过程。在一个 eager 稀疏混合专家运行时上（每个被选专家作为独立任务执行），一项冻结并设盲的研究以 94.17% 的平衡准确率识别出部署的设置；在全部授权条件下，对两种设置产生相同决策的任务准确率为 88.82%，产生不同决策的任务为 91.98%。硬件重放显示专家路由的时间密度与层-桶对齐携带了策略信息。结论：行为合规不等于配置保密；把审批设置当作保密信息的部署，应在 serving 运行时上度量其可区分性，并把授权强制执行放在模型之外。", "supplement": false}, {"title": "Intent-Aware Protection for AI Agents", "authors": "Fady Copty、Neta Haiby、Max Braitmaiere、Julia Korsunsky", "url": "https://arxiv.org/abs/2611.16122", "category": "arXiv 预印本（cs.CR，2026-11-12）", "cats": ["cs.CR"], "oneliner": "现有防御只检“有没有注入、有没有害”，不检“agent 有没有偏离它被部署的目的”；本文把可信意图立为一等安全对象，意图档案保护把四分类 macro-F1 从 45% 提到 79%。", "insight": "这篇的“意图”与我们的“授权”是同一枚硬币的两面，但粒度不同，值得在相关工作里做一次明确区分。第一，它的 Intent Profile 是“agent 应该干什么”的表示，我们的 AU 是“这次查询允许看见什么”的判定；一个动作可以完全符合意图档案、却越过某份文档的 AU（例如 agent 按职责去取一份它无权看的内部文档），反之亦然。写论文时可以用这一对概念划界：意图管“目的正当性”，授权管“可见性”，两者互补、不可互相替代。第二，它的评估方法值得借鉴：benchmark 生成时“先固定 ground-truth 标签、再由 LLM 实现”，避免了标签被生成过程污染；我们的 cloze 攻击评测在构造攻击样本时也可以采用同样的“先定标签后生成”顺序。第三，0.949 AUROC 的执行后检测提示了一条与我们互补的防线：我们的 AU 求值是执行前拦截，它的意图漂移检测是执行后审计；两者可以写成纵深防御的两层。诚实标注：Intent Profile 需要从组织、角色与开发者意图中抽取，抽取本身的质量决定了保护上限，本文未充分讨论档案被污染或意图本身模糊时的失效模式；887 样本的 benchmark 是作者自建的，外部效度有待独立复现。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "AI agent 越来越多地访问企业数据、调用强力工具，且人类监督有限。现有安全防御主要检测 prompt 注入、有害输出或可疑行为，但不判断 agent 是否还忠于它被部署的目的：一个动作可以不含任何攻击模式、也不超出已授权限，却仍然违反 agent 的角色、组织约束或用途。本文引入 Intent-Aware Security，把可信的 agent 意图当作一等安全对象；定义 Intent Preservation（意图保持）与 Intent Drift（意图漂移），并通过 Intent Profile（意图档案，从组织、角色与开发者意图中抽取的 agent 专属表示）将其操作化。作者还构建了一个 Intent-Aware benchmark：887 个验证样本、覆盖 35 个 agent，生成流程先固定 ground-truth 标签、再由 LLM 实现；并提出四种基于意图档案的保护：执行前检测、执行后检测、输入对齐与系统提示词加固。在全部评估中，基于意图档案的保护全面优于无档案基线：在自建 benchmark 上，四分类 macro-F1 从 45% 提升到 79%（Out-of-Scope F1 从 8% 提升到 76%）；在 10,000 多条已执行的 AgentDojo 轨迹（ground truth 来自环境状态）上，基于档案的执行后检测达到 0.949 AUROC，高于 AlignmentCheck 的 0.909、带原始 agent 配置的 0.897 与无上下文的 0.843；基于档案的输入对齐在相当的良性效用下比 DataFilter 的保护成功率高 7 个点。结论：agent 的既定用途可以作为检测其偏离部署角色与操作边界的有用安全参照。", "supplement": false}, {"title": "LocalAlign: Enabling Generalizable Prompt Injection Defense via Generation of Near-Target Adversarial Examples for Alignment Training", "authors": "Yuyang Gong、Zihao Wang、Jiawei Liu、XiaoFeng Wang", "url": "https://doi.org/10.1145/3830454.3846553", "category": "会议论文（ACM CCS 2026，2026-11-12 发表）", "cats": [], "oneliner": "现有 prompt 注入防御只对“明显偏离正确答案”的注入有效；LocalAlign 用对抗训练自动生成“离正确答案很近、但仍是错的”注入样本，把鲁棒边界收紧，泛化到真实场景。", "insight": "关联较弱，但有一点方法论启示可借鉴。第一，它的中心洞见——“防御只在远离正确答案的攻击上有效、近处的攻击会绕过松边界”——与我们的 embedding 通道泄露有结构上的相似：我们的 cloze 攻击 89.4%@20 之所以有效，也是因为“接近正确答案的候选”在表示空间里离机密太近；按授权视图重编码后降至 4.05%，本质上也是在收紧表示空间里的边界。写讨论时可把 LocalAlign 的“收紧边界”与我们的“按视图重编码”并列为两种不同层面的边界收紧技术。第二，它的 margin-aware 加权（离正确答案越近的样本权重越大）对我们的评测设计有提示：评估防御时应按“攻击样本离正确答案的距离”分层报告成功率，而不是只报一个总数，否则容易高估防御。诚实标注：这是一篇模型微调防御论文，与我们“架构级授权”的路线不同；摘要未给出端到端的攻击成功率数字，无法直接与我们的 89.4%/4.05% 对比，引用时只宜取其方法论洞见。", "source": "OpenAlex", "citations": "OpenAlex 2 次", "code": "无", "zh_abs": "大语言模型越来越多地嵌入与用户数据、检索到的网页内容和外部工具交互的系统，prompt 注入成为新的攻击面：藏在不可信数据里的恶意指令会覆盖可信指令、诱发非预期行为。现有防御主要靠微调模型，让模型在可信指令与不可信数据部分之间保持明确边界，学会优先执行可信字段、忽略数据中的恶意指令。但作者观察到，这类防御能挡住“明显恶意”的注入响应，却难以泛化到真实场景——此时模型对注入指令的响应离正确答案要近得多。原因是现有方法只针对一组固定的手工攻击目标训练，在正确答案周围留下的鲁棒边界过松、容易被绕过。本文提出 LocalAlign，一种受对抗训练启发的、泛化性更强的 prompt 注入防御：自动且高效地生成对抗样本，其中数据部分嵌入的指令诱发的响应“离正确答案很近、但仍然是错的”；这类近而错的样本用提示词加单步推理生成。该设计把正确答案周围的鲁棒边界收紧：即使是数据中指令引起的小幅响应偏移也会被显式惩罚。此外，不同样本的对抗质量差异很大，作者进一步引入 margin-aware 对齐算法，量化每个样本到正确答案的距离、对更近的样本赋予更大的训练权重。", "supplement": false}, {"title": "DRIP: Defending Prompt Injection via Token-wise Representation Editing and Residual Fusion", "authors": "Ruofan Liu、Yun Lin、Zhiyong Huang、Jin Song Dong", "url": "https://doi.org/10.1145/3830454.3832577", "category": "会议论文（ACM CCS 2026，2026-11-12 发表）", "cats": [], "oneliner": "在表示层把数据段 token 里的“指令语义”剥离、同时用残差模块锁死原始指令不被覆盖，DRIP 在三项 prompt 注入 benchmark 上把自适应攻击成功率降低 66% 以上，且不损效用。", "insight": "关联较弱，但与 LocalAlign 合起来说明了一个值得在相关工作里写清的边界。第一，DRIP 与 LocalAlign 代表了“模型内防御”的当前最好水平（自适应攻击下 ASR 降 66% 以上、效用不损）；而 CapLite 的结论恰恰是这类“模型内”路线在小模型 agent 上会塌。两者合起来可以帮我们写一句诚实的相关工作判断：prompt 注入防御在“检测/微调/表示编辑”层面已做到相当好的数字，但这些数字都建立在“模型自身能分清指令与数据”的前提上；一旦这个前提在小模型或对抗样本面前不成立，就需要架构级（模型外）的授权绑定兜底——这正是我们论文的位置。第二，它的“去指令化”思路与我们的 retrieve-then-project 有类比：都是在数据进入模型上下文之前先做一次清洗/裁剪；区别在于它清洗的是 token 的指令语义、我们裁剪的是未授权片段，可在讨论里提一句类比。诚实标注：评估在 LLaMA 8B 与 Mistral 7B 两个模型、三项 benchmark 上完成，数字不宜读成通用结论；与我们工作的关系是背景性的，不宜作为核心引用。", "source": "OpenAlex", "citations": "OpenAlex 5 次", "code": "无", "zh_abs": "大语言模型越来越多地集成进 IT 基础设施，按预定义指令处理用户数据；但常规 LLM 仍易受 prompt 注入攻击：恶意用户把指令性 token 注入数据、颠覆模型行为。现有防御训练 LLM 在语义上区分数据 token 与指令 token，但仍难以（1）平衡效用与安全、（2）阻止数据中类指令语义覆盖既定指令。本文提出 DRIP：（1）精确去除数据段 token 中的指令语义、同时保留其数据语义；（2）稳健地保持既定指令的效果，即使面对强对抗内容也不被覆盖。为实现数据的“去指令化”，DRIP 引入一套数据整理与训练范式，加一个轻量表示编辑模块，编辑数据段中类指令 token 的 embedding，在不损效用的前提下提升安全性；为保证指令的不可覆盖性，DRIP 再加一个极小残差模块，降低对抗数据覆盖原始指令的能力。在 LLaMA 8B 与 Mistral 7B 上、对照 StruQ、SecAlign、ISE 与 PFT，在 SEP、AlpacaFarm 与 InjecAgent 三项 prompt 注入 benchmark 上评估：DRIP 把角色分离分数提高 12–49%，在自适应攻击下把攻击成功率降低 66% 以上，同时保持与无防御模型相当的效用，达到 prompt 注入鲁棒性的新最佳水平。", "supplement": false}, {"title": "Cited but Unused: Parametric Provenance in Retrieval-Augmented Generation", "authors": "Tanzeel Abbas、Tehseen Zia、David Windridge", "url": "https://arxiv.org/abs/2611.17161", "category": "arXiv 预印本（cs.AI，2026-11-12）", "cats": ["cs.AI"], "oneliner": "RAG 的引用经常“挂羊头卖狗肉”：1.2%–15.7% 的可引用 claim 实际来自模型参数记忆而非检索上下文，且标准 NLI 验证对此基本无能为力（与随机无异）。", "insight": "这是今日对我们论文最直接的一记警示，直接关系到我们配套机制里的 NLI 残留检查。第一，它的中心结论——NLI 验证对“引用是否真来自检索上下文”的判断与随机无异——意味着我们的 NLI 残留检查如果也用 NLI 来判断“输出是否只用了授权片段”，可能同样测不出真正的泄露：模型可以凭记忆答出未授权内容、再贴一个授权片段的引用，NLI 会放行。我们在写 NLI 残留检查一节时必须回应这一点：要么说明我们的检查目标不同（检“残留”而非“来源”），要么补一个反事实替换式的对照实验，否则审稿人很可能用这篇来质疑。建议把这篇列为必引用的相关工作，放在 NLI 残留检查的讨论段。第二，它的反事实值替换方法本身可以直接借用：把授权片段中的关键事实替换为虚假变体、看模型输出是否跟随替换，就能区分“模型真用了授权片段”还是“凭记忆作答”——这是一个比 NLI 更诚实的残留检查实现，值得在下一轮实验里试。第三，1.2%–15.7% 且随模型尺寸上升的比例，提示我们在报告 cloze 攻击数字时应按模型尺寸分层，避免把单一尺寸的数字读成通用结论。诚实标注：结论基于两个模型家族、反事实替换的度量方式本身也可能引入 artifacts；“检测器不够准确、无法行动”是作者在当前基础比例下的判断，不是说来源验证在原理上不可能。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "检索增强生成系统会给 claim 附加引用、标明出处，但这些引用经常错报来源，标准验证方法检测不出来。本文用反事实值替换来度量来源：把检索段落中的一个事实替换为虚假变体、再重新提问模型。发现在一个模型家族的五种尺寸与另一个对照家族上，1.2% 到 15.7% 的可引用 claim 来自参数记忆而非检索上下文；在最保守的替换距离下，两个受试模型的这一比例分别为 4.6% 与 8.5%，且比例随家族内模型尺寸增大而上升。进一步发现，作为标准方法的自然语言推理（NLI）验证，即使只限定在被引用段落上，其结果在各模型上都与随机无异。作者判定原因是结构性的：模型凭记忆作答时，会挑一个与输出一致的引用贴上去。在相同的 claim 上比较十种归因方法后，模型“有上下文 vs 无上下文”的分布对比最能区分来源；但利用这一信号并不能改善来源诚实度——在这些基础比例下，所得检测器仍不够准确、无法付诸行动：它度量的是模型“知道什么”，而非“用了什么”；区分两者仍是开放问题。", "supplement": false}, {"title": "An Experience Report on Teaching Students to Evaluate AI Agent Skills as Authorization Decisions", "authors": "Zikai Alex Wen、Donald Chinn、Yan Bai", "url": "https://arxiv.org/abs/2611.15170", "category": "arXiv 预印本（cs.HC，2026-11-11；将发表于 SIGCSE TS 2027）", "cats": ["cs.HC"], "oneliner": "一篇教学经验报告：把“是否信任一个 agent skill”教成“授权决策”——学生起初只审代码，引导后才开始审“装上这个 skill 等于授权 agent 去做什么”。", "insight": "关联较弱，但它提供了一个值得借用的概念 framing。第一，它把“skill = 授权决策”说得非常干净：装一个 skill 不是在装代码，而是在授权 agent 获得某项权限（例如不经确认就行动）。这个 framing 可以直接用来向非安全背景的读者解释我们的 AU：一次检索授权不是在配一条规则，而是在决定“这次查询允许 agent 替我看到什么”。写引言或讲稿时可借用这句话。第二，它的课堂观察——“学生起初只审代码、不审授权”——与安全实践中的常见盲点一致：审计算法、审提示词，却不审权限边界；我们的论文正是在补这个盲点。第三，它是一篇教学经验报告（11 名自愿受访者的初步试点），证据强度有限，只宜作为概念引用，不宜作为实证支撑。诚实标注：样本量极小（n=11，自愿受访）、单校试点，结论的普适性未验证；与我们的技术贡献无直接方法借鉴。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "培养安全思维一直是计算机教育的目标，而学生现在还需要在决定是否信任一个 AI agent skill 时运用这种思维。Skill 是附加组件，能通过自然语言指令与配置项塑造 agent 的行为，而不只是可执行代码。为教会学生把 skill 当作授权决策来评估，作者设计了一堂课堂活动，在高年级本科与研究生网络安全课程中讲授：学生检查三个示例 skill，每个 skill 把一个真实工作流任务与一项 agent 专属权限配对，例如“每次行动前无需征求用户同意即可行动”；活动先引导学生给出初步授权建议，再用静态安全扫描器检验并修正建议。课堂观察发现，学生需要引导才能把安全审查从 skill 的代码扩展到“装上这个 skill 等于授权 agent 去做什么”。11 名自愿受访者的前后测问卷显示，活动后学生自评更有信心评估 skill，且活动后的回答更强调 skill 所携带的权限。全部活动材料已公开、可复用。", "supplement": false}]}, {"date": "2026-11-13", "summary": "", "papers": [{"title": "Security, Privacy, and Trustworthy Design for Retrieval-Augmented Generation Systems", "authors": "Abdulrahman Abdullah Alghamdi", "url": "https://doi.org/10.3390/electronics15225229", "category": "期刊论文（Electronics，MDPI，2026-11-11 发表）", "cats": [], "oneliner": "一篇按 RAG 流水线阶段组织的系统性叙事综述：把 2020 年至 2026 年 9 月的攻击、防御、威胁模型与评估实践分到摄取、切分、embedding、检索、向量存储、上下文组装、生成、输出与工具执行各阶段，并给出 RAG 安全参考架构与攻防矩阵。", "insight": "这是今日与我们论文咬合最紧的一篇，值得作为相关工作的背景引用。第一，它的第四个发现直接支撑了我们的选题缺口——benchmark 不评估授权状态与多租户隔离，而我们的 per-view 索引与“全文 embedding 索引下 cloze 攻击 89.4%@20、按授权视图重编码后降至 4.05%”的实测，恰好是针对这一缺口的、带授权状态的评估；引用时可把它的发现当作“缺口陈述”的第三方佐证。第二，它的第二个发现（引入权限后攻击成功率下降）与我们的 retrieve-then-project 思路同向，可在讨论里并列：权限不是可有可无的附加层，而是能实测降低攻击成功率的控制点。第三，它的“分层控制”清单（来源、访问控制、检索时异常检测、上下文隔离、输出监控、工具权限）可以用来框定我们工作的边界——我们做的是其中“访问控制 + 上下文隔离”这一层，其他层不在本文 claim 内，写相关工作时照此划界更诚实。诚实标注：这是 MDPI Electronics 上的单作者叙事综述（structured narrative review），不是带可复现检索协议的系统综述，没有新实验；引用它的发现时应写清出处与综述性质，不宜当作实证证据。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "RAG 让语言模型能调用外部知识库，事实覆盖率提高了，但也多出了单体模型没有的安全与隐私边界：恶意或未授权文档可以左右检索结果、进入模型上下文、覆盖指令、泄露敏感信息，甚至触发外部动作。本文系统梳理了 2020 年至 2026 年 9 月的 RAG 攻击、防御、威胁模型与评估工作，证据按流水线阶段分组。四个主要发现：第一，投毒、抽取、成员推断与间接 prompt 注入是不同但可组合的威胁；第二，引入真实的切分、重排、语料冗余与权限后，攻击成功率往往下降，而自适应评估又能暴露防御的残留弱点；第三，可信的安全需要分层控制，覆盖来源（provenance）、访问控制、检索时异常检测、上下文隔离、输出监控与工具权限；第四，现有 benchmark 很少评估授权状态、多租户隔离、缓存失效、部署成本或外部动作。本文还给出了 RAG 安全参考架构、攻防矩阵与报告清单。", "supplement": false}, {"title": "Do Machine Learning Security Detectors Survive New Attacks? A Leakage Free Evaluation of Hidden Prompt Injection Detection in AI Coding Agents, Malicious npm and PyPI Package Detection, and Network Intrusion Detection", "authors": "Nnaemeka Kingsley Ugwumba、Clement Barisua Ndeekor", "url": "https://doi.org/10.21203/rs.3.rs-11667204/v1", "category": "预印本（Research Square，2026-11-10）", "cats": [], "oneliner": "安全检测器常用的随机划分评估会把性能测虚高：作者用“无泄露评估协议”（未见过的攻击手法、时间顺序划分、去重、跨数据集迁移）在三类检测器上重测，隐藏 prompt 注入检测的召回率从 0.87 跌到 0.04，而规范化字符模型与微调 DistilRoBERTa 守住了 0.89 与 0.98。", "insight": "这篇的价值在评估方法论，不在访问控制本身，但对我们有两点具体启示。第一，它的中心教训——“随机划分会把检测器测虚高”——对我们自己的 cloze 攻击评测同样适用：我们的 89.4%@20 与 4.05% 是在固定切分与固定攻击写法下测的，写论文时应交代评估的划分方式与攻击手法的覆盖范围，避免被审稿人用“未见过的攻击手法”质疑；它的时间顺序划分、未见攻击家族、跨数据集迁移三招，可以直接借用到我们下一轮评测设计里。第二，研究 A 的攻击面（AI coding agent 的指令文件与 MCP 工具描述里的隐藏指令）与 ChainBind 的执行时授权绑定是同一条战线：它证明“先检测、再放行”的检测层在未见手法面前会塌（0.87→0.04），而执行时授权绑定不依赖检测到注入、只认授权，恰好是检测失效时的兜底；两者可以写成互补关系。它的“规范化字符模型守住 0.89”也是一个可借鉴的廉价前置过滤思路——在授权门之前先规范化输入，能以很低成本挡掉一部分隐藏手法。诚实标注：这是 Research Square 上的预印本、未经同行评审；研究 A 植入的是“无害隐藏指令”（合成攻击），九种隐藏手法的代表性决定了绝对召回数字的普适性；引用时应写清“在作者的九种手法与 4,955 份文件上”，不宜读成通用结论。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "机器学习安全检测器通常用随机划分同一数据集来测试，测试集里的攻击与训练集里的攻击高度相似，而真实攻击者会换手法。本文用一套统一的无泄露评估协议，检验三类检测器遇到从未见过的攻击手法时是否还有效。研究 A 从 GitHub 收集了 4,955 份真实 AI agent 指令文件与 MCP 工具描述，用 2026 年 prompt 注入攻击中的九种隐藏手法植入无害隐藏指令，测试五个检测器；研究 B 在 13,317 个 npm 与 PyPI 包上做恶意包检测，用 2026 年之前的样本训练、在 2026 年的攻击波次上测试；研究 C 在 CICIDS2017、 CICIDS2018 与 UNSW-NB15 上重做网络入侵检测，去重、按时间划分、用未见过的攻击家族、跨数据集迁移。标准随机划分下，几乎所有检测器的 ROC AUC 都在 0.95 到 1.00 之间；但对未见过的隐藏手法，基于特征的隐藏指令检测器在 1% 误报率下的召回率从 0.87 跌到 0.04，而规范化字符模型守住 0.89、微调 DistilRoBERTa 守住 0.98；恶意包模型去掉“包体积”这一捷径特征后，召回率从 0.90 跌到 0.41。", "supplement": false}]}, {"date": "2026-11-12", "summary": "", "papers": [{"title": "Isolation Is Not Confidentiality: Security Boundaries of Geometric Access Control in RAG", "authors": "Steve Nouyep、Maxime Puys、Sébastien Salva", "url": "https://arxiv.org/abs/2611.14061", "category": "arXiv 预印本（cs.CR，2026-11-10 提交）", "cats": ["cs.CR"], "oneliner": "几何访问控制能把不同策略的文档在向量空间里“隔开”，但隔开不等于保密：好奇用户用几百对齐的向量就能把原始 embedding 恢复出来，策略相关的几何结构还会泄露“谁属于哪个策略”。", "insight": "这是今日与我们的论文咬合最紧的一篇，也是 embedding 通道一节最值得引用的新证据。第一，它把我们的核心论点形式化成了四个可分开检验的目标：我们论文里“全文 embedding 索引下 cloze 攻击 89.4%@20、按授权视图重编码后降至 4.05%”的实验，恰好对应它说的“隔离≠机密性”——隔离（未授权检索被拦住）成立时，机密性（表示本身不泄露）仍可能失效；相关工作里可以引用它的四目标分类法来框定我们的威胁模型。第二，它的攻击路径（几百对对齐样本恢复原始 embedding）与我们的 T2（可见排序向量）高度同构：攻击者不需要拿到原文，只要拿到“原文向量—受保护向量”的对齐对就能反推，这正是我们主张“向量索引必须按授权视图重编码、而不是只在文本层裁剪”的实证支撑。第三，它提醒了一个我们尚未显式处理的风险点：**策略成员隐藏**——即使检索被拦住，几何结构本身可能泄露“某文档属于某策略”，我们的 per-view 索引方案应在使用时说明是否处理了这一层。诚实标注：这是 11 月 10 日刚提交的预印本，评估只覆盖“现有几何变换机制的公开实现”、三个编码器，结论的普适性取决于这些实现的代表性；引用时应写清“在作者评估的实现与编码器上”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "RAG 系统越来越多地把受不同访问控制策略管辖的文档混存在同一个向量库里。近年出现的“搜索保持几何方法”通过重构 embedding 空间来执行访问控制：变换后的 embedding（作者称为受保护表示）仍可检索、又不跨策略泄露信息。本文对这一范式做了统一安全分析，覆盖策略隔离、表示机密性、抗查询伪造、策略成员隐藏四个目标，威胁模型分两档——能看到库里受保护表示的好奇云服务商，以及手握“原始 embedding—受保护表示”对齐样本的好奇用户。作者在三个编码器上实测了现有几何变换机制的公开实现：几何变换确实保住了检索效用与强策略隔离，但其余三项目标都不成立；好奇用户用几百对样本即可恢复原始 embedding，还能以随编码器维度增长的代价伪造出符合策略的查询；即使未授权检索被拦住，策略相关的几何结构仍会泄露成员关系。结论是：策略隔离、机密性、抗伪造、成员隐藏是四个**不同**的安全目标。", "supplement": false}, {"title": "Fail-Closed Authorization for Tool-Using AI Agents: A Capability Contract and Case Study", "authors": "Andrey Lesnikov", "url": "https://doi.org/10.21203/rs.3.rs-11676427/v1", "category": "预印本（Research Square，单作者）", "cats": [], "oneliner": "工具型 agent 的授权不该在调用后审计、而要在执行前设卡：Agent Security Contract（ASC）是一个默认拒绝的执行前门禁，工具目录用 SHA-256 摘要锁定，高危工具须经带外批准，所有错误路径都收敛到 BLOCK。", "insight": "这篇与 ChainBind 的“执行时授权绑定”是同一条战线上的互补工作，值得在相关工作里并列引用。第一，它的“所有错误路径收敛到 BLOCK”与我们的 fail-closed 姿态一致：未知 AU 默认拒绝、错误即拒绝，这是执行时授权的共同底线；可以引用它的错误路径枚举方法来补强我们自己的 fail-closed 论证。第二，它给了一个诚实且可引用的**误拦代价**：严格参数规则拦掉 94/97 良性任务、工具级审批把 60/97 良性任务送去人工审批——这正是“绑定越严、效用越低”的量化证据，我们的 E12（良性效用 0.608）应当与这类数字并排讨论，而不是只报攻击侧的 ASR。第三，它的 JSON 证据信封（每次裁决带完整性校验的审计记录）是一个可借鉴的机制：我们的绑定裁决也可以落成类似的证据信封，便于事后审计与复现。诚实标注：这是 Research Square 上的单作者预印本，评估只用静态录制轨迹、未跑 live agent，66 场景语料是作者围绕自家检查自建的（作者自己也承认变异测试覆盖浅），AgentDojo 复核用的是“事先冻结的策略”而非真实部署策略；引用时应写清这些口径，不宜把它读成已验证的部署方案。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "对工具型 LLM agent 而言，决定性的问题是“某次具体工具调用在执行前是否被授权”。本文提出 Agent Security Contract（ASC）：一个默认拒绝的执行前门禁，覆盖 agent 与 MCP 工具调用。ASC 策略用 SHA-256 摘要锁定批准的工具目录，为每个 agent 声明工具白名单与参数约束，把高危工具标为须经带外批准，并限制调用速率；每次裁决（ALLOW / BLOCK / REQUIRE_APPROVAL）都以带完整性校验的 JSON 证据信封发出；作者枚举并测试的每条错误路径最终都收敛到 BLOCK。评估只用静态的、已录制的工具调用轨迹，没有跑 live agent。审阅中发现的 v0.1.0 演示策略绕过已在 v0.2.0 修复；60 例对抗探针上，放行攻击从 32 降到 1（剩 1 例是策略缺口），代价是 3 个新增良性误拦；作者自建的 66 场景 v0.2.1 语料上 ASC 全部判对（66/66）；而工具名 RBAC（Python 与 OPA/Rego）按构造就会放行 33 个攻击中的 30 个。变异测试显示语料对策略约束的覆盖很浅（62 个单约束变异只杀死 8 个）。作为留出检验，作者用事先冻结的策略重放了 132 条 AgentDojo v1.2 真实轨迹：工具级审批策略拦住了 25/26 条非空攻击轨迹，但也把 97 个良性任务中的 60 个送去审批；v0.2.0 的严格参数规则更会拦掉 94/97 的良性任务；v0.2.1 补上可选参数支持后，在全部 132 条轨迹上复现了工具级裁决、无新增拦阻、无新增放行攻击。进程内中位延迟约 38 微秒/条轨迹。", "supplement": false}, {"title": "Intent-Adaptive Implicit Permission Decision in Generative Artificial Intelligence: A Novel Architecture for Contextual Memory Isolation and Autonomous Privacy-Preserving Permission Management", "authors": "Jincheng Zhang", "url": "https://doi.org/10.5281/zenodo.24105307", "category": "预印本（Zenodo，2026-11-10，单作者，概念架构）", "cats": [], "oneliner": "与其让用户手动开关记忆权限，不如让系统从对话意图推断“这段对话该用什么隔离策略”：IAIPD 把意图推断、记忆隔离策略选择、隐式权限评估与分级执行包成一个会话级权限决策框架。", "insight": "关联较弱但有一个可借鉴的思路：它把“意图”当作权限决策的输入信号，这与我们的 AU 粒度问题是互补的——我们关心“授权单元如何切分与执行”，它关心“权限策略如何从意图自动推导出来”；如果把意图推断看作 AU 生成的一种信号源，它的“分级执行”（ graduated enforcement）与我们“给、但给粗一点”的中间档思路有呼应，可以在讨论“AU 粒度规则能否离线学”时顺带提一句。诚实标注：这是单作者 Zenodo 概念架构提案，摘要里没有给出任何实验、评估或部署证据，“首个”之称是作者自述；不宜作为实证引用，只能作为设计思路参考。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "持久记忆、对话历史检索、个性化上下文与自主决策越来越多地集成进生成式 AI 系统，给会话隐私与用户可控的信息管理带来新挑战。现有记忆管理机制一般依赖用户手动选择和维护“历史信息能否影响后续交互”的设置，用户在独立推理、探索性研究、敏感讨论、个性化协助等需要不同上下文边界的活动之间频繁切换时，交互负担很重。本文提出一个根本问题：生成式 AI 系统能否从用户对话的潜在意图推断运行需求，并主动决定应推荐或应用哪种记忆隔离与信息访问策略？为此提出意图自适应隐式权限决策（IAIPD）架构：持续评估对话意图、上下文敏感度、历史记忆相关性与潜在上下文干扰之间的关系，动态选择记忆隔离策略、做隐式权限评估、并以分级方式执行。据作者称，这是首个把“推断的会话意图、自适应记忆隔离策略选择、隐式权限评估、分级策略执行”整合进统一会话级权限决策框架的架构；与手动配置的记忆控制不同，它不需要用户逐项维护设置。", "supplement": false}, {"title": "Which check stopped it? Evaluating egress defenses for LLM agents", "authors": "Sai Gowtham Reddi", "url": "https://doi.org/10.5281/zenodo.24087764", "category": "实验室经验报告（Zenodo，单作者）", "cats": [], "oneliner": "在工具调用发出去之前设一道出口网关（域名过滤、载荷解码、字段级授权、身份绑定任务上下文），再逐项归因“到底是哪一检查拦住了它”：一次有界的实验室评估，不是疗效宣称。", "insight": "直接价值在方法论而不在结论：它的“逐项检查归因”（per-call deciding-check attribution）正是我们评估执行时绑定时需要的度量方式——当一次调用被拦住，要能说清是目录校验、参数约束、身份绑定还是速率限制中的哪一环起的作用，否则“ASR 降了”说不清功劳归谁；我们的实验节可以在归因口径上借鉴它的做法。它的“字段级授权对照权限记录”也与我们的 AU 思想同构：授权判定要落到字段/参数级，而不是只看工具名。诚实标注：作者自己划清了界限——虚构数据、模拟接收方、实验室报告，不宜引用其任何数字作为防御有效性的证据；只宜引用其归因方法与检查清单。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "这是一次有界的实验室评估：一个发包前的出口网关，检查项包括域名过滤、有界载荷解码、对照权限记录的字段级授权、身份绑定的任务上下文。评估用本地规划器（qwen3:14b）与第二个规划器（gpt-6.1-sol），协议冻结，每次调用都做“由哪项检查裁决”的归因，并以独立的接收方 ground truth 校验。数据是虚构的、接收方是模拟的；作者自述这是一份实验室经验报告，**不是疗效宣称、也不是新的安全机制**。", "supplement": false}, {"title": "Beyond the Document: Compiled Context and Governed Agents for Any Work Product", "authors": "James Rhodes、George Kang", "url": "https://arxiv.org/abs/2611.13055", "category": "arXiv 预印本（cs.SE / cs.AI / cs.IR，2026-11-09 提交）", "cats": ["cs.SE", "cs.AI", "cs.IR"], "oneliner": "文档只保存了工作的可见结果，却丢掉了背后的研究、计算、假设、证据与授权边界：Portable Agent Format（PAF）把工作产物连同编译好的上下文、证据、溯源与后续交互规则一起打包交付。", "insight": "关联中等，亮点在“授权边界随数据走”：PAF 把授权边界、证据与溯源编译进交付包本身，这与我们的 AU 思想是同一方向——授权元数据不应只存在策略库里，而应随检索单元一起流动；我们的 RU/AU 解耦框架可以在讨论“AU 如何随 RU 传播”时引用它的做法。它的 -1 回答率把“实质错误”与“未授权回答”合并成一个指标，也值得借鉴：我们的评估目前把 ASR 与良性效用分开报，合并口径（一次回答要么对、要么错、要么越权）可能更贴近真实部署的验收标准。诚实标注：四个包是作者自建的评估集，400 个冻结问题与 12,000 条回答的规模不小，但包数只有 4 个、且离线阅读器的历史记录问题全军覆没，说明结论对包类型的依赖很强；引用时应写清“在作者的四个包上”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "文档保存了专业工作的可见结果，却常常丢掉背后的研究、计算、假设、证据与授权边界。本文研究另一种交付单元：Portable Agent Format（PAF）包——工作产物连同编译好的上下文、证据、溯源与后续交互规则一起打包。为了检验这些上下文在产生它的过程之外是否仍有用，作者评估了四个新包（投资提案、基金研究、财务报表分析、工程事故复盘，其中两个由专用 agent 生成、两个由通用助手的打包技能生成；托管与离线阅读器在评估前已冻结）。在 400 个冻结问题、12,000 条评估回答上，托管的受治理阅读器成功率 96%，而“指令 + 原始文件检索”只有 86%（Holm 校正后 p < 10^-7）；在每条件 260 个可回答问题上，成功率是 94% 对 79%；仅靠源材料聊天与仅靠指令分别只有 48% 与 74%。一个独立的 8 亿参数离线阅读器总体成功率 69%，可回答问题上 54%；它的 -1 回答率（实质错误与未授权回答合并计算）为 2.9%，而“源材料 + 指令”对照组高达 56%。消融实验提示集成选择器与包自适应写作者有优势，但未把表示与训练效应分离开。同一次运行也暴露了一个失败：离线检索在一个金融数据包的 40 个历史记录问题上一个都没答出来。结论是：应把编译好的知识当作交付物的一部分，但标准互操作与端到端治理仍待解决。", "supplement": false}, {"title": "From Information Access to Controlled Transactions: A Practitioner Case Study of Bilingual Conversational AI in B2B Manufacturing", "authors": "Yusri Askool", "url": "https://doi.org/10.5281/zenodo.24023711", "category": "实践者案例研究（Zenodo，单作者）", "cats": [], "oneliner": "一家匿名 B2B 制造企业的双语客户门户 + 对话式 AI 落地复盘：信息查询可以开放，交易动作必须受控——身份与授权、显式确认、防重复、审计日志四项已部署控制，外加一个“受治理对话式交易模式”与五条权限感知 RAG 设计命题。", "insight": "关联较弱，但它是少见的**来自部署一线的权限感知 RAG 证据**：它把“信息访问”与“受控交易”分成两档——查询可以宽、交易必须严，这与我们的“授权单元可加中间档（给、但给粗一点）”思路同构；它的五条权限感知 RAG 设计命题（摘要未展开）值得在写“部署启示”时去原文核对一条是否可引用。诚实标注：单作者、匿名企业、内部报告未经独立审计、未披露任何可核验的量（客户数、交易量、百分比一概没有），“增长”是方向性描述；只能作为实践者视角引用，不能作为实证。", "source": "OpenAlex", "citations": "尚未收录", "code": "无", "zh_abs": "本案例研究考察了一家匿名 B2B 制造企业在多系统数字化转型环境中，双语、可交易的客户门户与 AI 对话助手的部署。已部署方案为已认证客户提供阿拉伯语与英语的文本与语音访问，覆盖选定的信息查询与交易工作流；受治理的应用接口把客户意图连接到已授权的企业系统。论文区分了“作者报告的已部署控制”（身份与授权、显式确认、防重复、审计日志、联系指引）与更广的“推荐保证模型”（还包括交易对账与真人升级能力）。内部运营报告（未就本研究做独立审计）显示门户采用率持续、功能使用面扩大、通过客户渠道发起的订单呈方向性增长——但这些门户级观测不能具体归因于对话助手。论文未披露客户数、交易量、百分比、组织标识、系统名或底层仪表盘。作者给出一个可复用的“受治理对话式交易模式”、一套合成测试矩阵与度量框架，并提出五条权限感知 RAG 设计命题，同时保持授权与交易隔离。", "supplement": false}, {"title": "AgentLSD: Evaluating AI Security Agents Under Adversarial Task Contamination", "authors": "Matteo Golinelli、Idílio Drago、Matteo Boffa、Francesco Bergadano、Bruno Crispo", "url": "https://doi.org/10.1145/3847352.3848111", "category": "ACM Workshop on Artificial Intelligence and Security（AISec 2026）", "cats": [], "oneliner": "提示注入之外还有“任务污染”：攻击者不用写指令，只需在 agent 要读的网页、日志、配置里埋假结果、诱饵端点等非指令性欺骗物，就能让安全 agent 多走 20 轮、多花 2k 推理 token，甚至跟错诱饵交错 flag。", "insight": "对我们的威胁模型有直接的补强价值：它把攻击面从“指令注入”扩展到“环境证据污染”——假结果、诱饵端点这类非指令性内容，恰好落在我们的 T2（可见排序向量/环境数据）附近；我们的威胁模型目前以注入指令为主，写 T2 时可以引用 AgentLSD 来说明“环境数据本身就是攻击面，授权判定不能只看指令、还要看证据来源”。它也是一个可引用的 benchmark：成对的干净/污染实验设计与“+20 轮、+2k token”的代价度量，可以作为我们评估“绑定后 agent 是否被拖慢”的对照口径。诚实标注：规模很小（11 个 Web CTF、六个模型），干净条件解出率只有 41%（基线本身就不高），陷阱对解出率的影响不均匀；引用时应写清 CTF 环境口径，不宜推广为通用 agent 结论。", "source": "OpenAlex", "citations": "OpenAlex 1 次", "code": "无", "zh_abs": "安全 agent 要检查网页、源代码、日志、配置文件与命令输出，这些环境里可能含有欺骗性伪造物，影响 agent 的行为。作者称之为“对抗性任务污染”：与提示注入依赖攻击者提供的指令不同，任务污染还包括非指令性证据，如假结果与诱饵端点。AgentLSD 是一个研究对抗性任务污染的受控框架，以 CTF 挑战为实验环境：注入陷阱伪造物（假 flag、误导提示、诱饵端点、隐藏线索），同时保持原定 CTF 解法不变；框架支持“干净 vs 陷阱增强”的成对实验、确定性陷阱生成、运行时注入、遥测与交付验证。作者在 11 个 Web CTF 挑战上评估了六个模型：干净条件下 agent 拿到 41% 的 flag，没有模型解出全部挑战；随后度量任务污染的影响——即使 agent 最终仍拿到 flag，陷阱也会让轮数增加 20 轮、推理 token 增加 2k；解出率的影响则更不均匀：有些“模型—挑战”组合基本不受影响，有些会跟随诱饵或提交错误 flag。结论是：干净 CTF 成绩会低估 agent 对欺骗性任务证据的脆弱性；AgentLSD 隔离了这一效应，提供了一个可复现的基准。框架、配置、陷阱规格与原始轨迹均已发布。", "supplement": false}]}, {"date": "2026-11-11", "summary": "", "papers": [{"title": "Authorization assurance for tool-using LLM agents: a structured review of enforcement semantics and effect-level security evidence", "authors": "M. Elmasry", "url": "https://doi.org/10.1007/s10207-026-01343-w", "category": "结构化综述（International Journal of Information Security, Springer，2026-11-10 上线）", "cats": [], "oneliner": "这篇综述不数“谁声称安全”，而是逐条核对“主张—执行边界—观测证据”是否对得上：75 篇文献筛成 30 篇分析语料、92 条来源—主张记录，结论是 agent 授权领域最关键的两块证据（撤销、委托 containment）目前是空白。", "insight": "这是今日与 ChainBind 咬合最紧的一篇，也是投稿前最值得逐字对照的“审稿人视角”文献。它的三个空白点几乎就是我们的投稿论证清单：第一，“撤销主张为零”——我们的 epoch 撤销机制（委托人/工具/记录三级设域）恰好落在这个空白上，相关工作里应明确写出“据该综述的 21 篇 agent 文献统计，可评估的撤销主张为零”，这是我们工作的外部定位依据；第二，“最小权限只量变窄、不量轨迹有效权限”——我们的 E12 报的是 ASR 16/949 与良性效用，恰好是轨迹级有效权限的度量，写实验节时应把“轨迹级”三个字点出来，与它批评的“只量变窄”形成对照；第三，“最终状态正确 ≠ 授权正确”——这句话可以直接引用来支撑我们的核心论点“批准不是执行”。诚实标注：这是 11 月 10 日刚上线的综述，覆盖截止 2026 年 7 月 15 日，30 篇语料是作者冻结的闭合集合而非全领域普查，MAAP 是作者自提的初步框架、未经验证，引用时应写清“在该综述的闭合语料内”，不宜读成全领域定论。", "source": "SemanticScholar", "citations": "尚未收录", "code": "无", "zh_abs": "工具型 LLM agent 通过 API、工具、凭证与外部服务对受保护资源行使权限，作者问的是：授权主张是否有执行边界与观测边界上的证据支撑。75 篇证据库筛成 30 篇分析语料（15 篇严格 agent 文献、6 篇敏感性文献、9 篇授权/保证比较文献），产出 92 条来源—主张记录（SCR）。在闭合语料内，5 篇严格文献做了中介/不可绕过主张但证据端点各不相同；3 条可评估的最小权限主张都只证明了“可用权限变窄”，没有一条度量整条轨迹上的实际有效权限；21 篇 agent 文献里没有一条可评估的撤销主张；30 篇语料里没有一条委托 containment 主张；最终状态正确与授权正确也是两回事。作者据此提出“授权保证主张模型”（主张范围、义务、执行、证据、受保护效应、残余假设）与 MAAP 最低报告框架（明确标注为初步的、综述派生的报告框架，不是已验证的评分或认证工具），附完整筛选决策与独立编码审计的工作簿。", "supplement": false}, {"title": "PRISM: Causal Counterfactual Minimization of Agent Tool Privileges via Information Bottleneck Role Induction", "authors": "Yang Luo、Qingni Shen、Tairui Wang、Jiajun Li、Zhonghai Wu", "url": "https://arxiv.org/abs/2611.11539", "category": "arXiv 预印本（cs.CR，2026-11-08 提交）", "cats": ["cs.CR"], "oneliner": "角色工程的对象从人换成 agent：用因果反事实判断“这个工具对这个任务是否真必要”，再用信息瓶颈把轨迹压成离散角色，单角色授权工具数压掉 78.3%、爆炸半径降到 15.9%。", "insight": "这篇与 ChainBind 是互补关系：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”。它的思路可以直接借用到我们的 AU 生成上——与其让策略作者手写每个 AU 的覆盖映射，不如用反事实必要性学出“这一步最少需要什么”，再把学出的最小集作为批准的标的、由运行时的确定性绑定强制执行；两者叠加才是完整的最小权限：学出来的权限集 + 绑定住的执行。它的 78.2% 任务成功率与 15.9% 爆炸半径也可以作为我们 E12 的对照口径：我们报的是 ASR 与良性效用，它报的是成功率与爆炸半径，两者合起来才能说明“权限压下来了、正常路也没走死”。诚实标注：88.7% 的必要性准确率与 15.9% 的爆炸半径都是在三个基准、作者自建的反事实干预流程上的数字，“必要性”的 ground truth 来自沙箱干预本身，引用时应写清基准口径；且它只解决批准前的权限集生成，不处理执行时越界——这正是我们的位置。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "MCP 让 agent 一上手就拿到全部工具权限，过度授权是常态。PRISM 把“某工具对某任务是否必要”形式化为可干预的因果命题，在沙箱里做结构化干预学出反事实必要性模型；再用信息瓶颈把轨迹压缩成离散隐变量，按率失真曲线的拐点定角色数；最后把剪枝形式化为双层 Stackelberg 博弈，用生成流网络采样多样的近优解。在 AgentDojo、τ-bench、ToolEmu 三个公开基准上，单角色授权工具数压缩 78.3%，任务成功率 78.2%，反事实必要性判断准确率 88.7%，爆炸半径降至 15.9%。", "supplement": false}, {"title": "Rag n' Roll: A Framework to Evaluate Indirect Prompt Manipulation Attacks against RAG-based Applications", "authors": "Gianluca De Stefano、Lea Schönherr、Giancarlo Pellegrino", "url": "https://doi.org/10.1145/3847352.3848095", "category": "ACM Workshop on Artificial Intelligence and Security (AISec 2026)", "cats": [], "oneliner": "RAG 的间接提示操纵（往公开文档库里埋指令）到底多好使？作者先复核了 5 种已有攻击技术，再搭了一个端到端评估框架 Rag-n-Roll，发现默认配置下攻击能控制高达 70% 的生成答案，而既有评估方法会系统性高估攻击成功率。", "insight": "对 RU/AU 论文的直接价值在两处：第一，它给了一个可引用的攻击面数字——默认配置下 70% 的答案可被操纵，且攻击效果高度依赖流水线参数，这与我们“检索结果进上下文前必须由架构保证授权判定”的主张同构：注入文档一旦进了检索集，文本层面的防御就拦不住，只有在检索/授权边界上卡住才行；第二，它的“既有评估会高估攻击成功率”是一个方法论提醒——我们自己的 cloze 攻击 89.4%@20 与按授权视图重编码后 4.05% 的对比，也应写清评估口径（检索配置、k 值、判定标准），否则同样会被质疑数字的可比性。诚实标注：70% 是默认配置下的最高值、且依赖流水线参数，不是所有 RAG 配置的通用结论；25 次引用是 OpenAlex 在论文上线两天内的计数，宜理解为预印本流传期的引用累计，引用时以 AISec 会议版本为准。", "source": "OpenAlex", "citations": "OpenAlex 25 次", "code": "无", "zh_abs": "RAG 常从公开文档库取知识，这给间接提示注入留了口子：攻击者可以针对性地炮制文档来控制生成答案。作者先梳理了构建 RAG 应用的常用框架、导出原型架构并识别关键参数，再复核已有文献里的间接提示操纵技术，选出横跨两大类的 5 种技术并审视其有效性评估标准。在此基础上实现 Rag-n-Roll 框架，对 LLM 流水线做端到端评估，并引入新指标以更好地区分生成答案的良性/恶意属性。结果表明：既有评估实践不足以精确评估针对 RAG 流水线的攻击，会导致成功率高估；默认配置下攻击可控制高达 70% 的生成答案，但这一表现高度依赖此前被忽略的流水线参数。", "supplement": false}, {"title": "Text2NGAC: a multi-LLM pipeline for NGAC policy extraction with mutation-based verification", "authors": "Ayesha Habib、Huixiang Zhang、Dan Zhu、Waiz Haider", "url": "https://arxiv.org/abs/2611.12572", "category": "arXiv 预印本（cs.CR，2026-11-09 提交）", "cats": ["cs.CR"], "oneliner": "自然语言写成的访问控制策略，第一次被完整抽成 NIST 下一代访问控制（NGAC）图：多 LLM 流水线 + 五策略验证器，变异测试检出 99.7% 的注入故障，抽出的图能直接装进 NIST 参考实现并复现全部 55 条访问判定。", "insight": "对 RU/AU 论文的策略层有直接借鉴：我们的策略是独立存放、查询时逐 AU 求值，策略本身从哪来一直是个未展开的假设——这篇给出了“自然语言策略 → 可执行策略图 → 参考实现复现判定”的完整链条，99.7% 的变异检出率与 55/55 判定复现是策略抽取可信度的硬证据，相关工作里可以引用它来说明“策略可从文档中可靠抽取、而非只能手写”。它的“验证器本身用变异测试度量有效性”也是一个可借鉴的方法论：我们的保守子句切分器与 NLI 残留检查同样需要一个“检查器本身有多可靠”的度量，变异测试是现成做法。诚实标注：97.3–99.6% 是在 4 个真实语料、714 句上的数字，作者已声明精度是措辞与基准特定的、对抗输入不在保证内，引用时不应写成通用抽取精度；且它是策略抽取、不是运行时授权判定，与我们的执行语义是上下游关系而非替代关系。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "访问控制策略用自然语言写、却要按形式化模型执行，把前者翻译成 NIST NGAC 图一直没解决：已有系统只覆盖 NGAC 模型子集，且没有一个验证自己抽出的图。Text2NGAC 用多个 LLM 协作：先逐句消歧再抽取，不确定的句子升级到多模型集成，最后用五策略验证器检查结果图，验证器本身的有效性用可控变异测试度量。据称是第一个从真实策略文档中抽出全部四种 NGAC 关系类型（关联、禁止、事件响应义务、指派）的系统。验证器检出 99.7% 的 918 个注入变异体与全部结构性 fail-open 故障，漏掉的故障类按安全后果加权刻画而非一笔带过；抽出的图可直接执行：某语料的图未经修改装入 NIST 参考实现，复现了该图蕴含的全部 55 条访问判定并端到端触发了一条抽出的义务；抽取精度在 4 个真实语料的 714 个评分句上达 97.3–99.6% 精确元组匹配，远高于三个复现基线，改写探针加语义重评分界定了流水线对措辞变化的敏感度。作者同时声明：报告精度是措辞与基准特定的，对抗输入不在验证器保证范围内。", "supplement": false}, {"title": "Scaling Adaptive Prompt Injection Attacks with Agent Swarms", "authors": "Alexey Kurakin、Vishal Karande、Alex Bie、Chongyang Shi、Shuang Song、Saeed Mahloujifar、Abdullatif Köksal、Jamie Hayes、Juliette Pluto、Yinghao Sun、Kamalika Chaudhuri", "url": "https://arxiv.org/abs/2611.11861", "category": "arXiv 预印本（cs.CR / cs.LG，2026-11-09 提交）", "cats": ["cs.CR", "cs.LG"], "oneliner": "静态注入弹药打到 2025 年中就饱和了，但这不等于注入已死：作者用“agent 群体”做自适应攻击者，在新合成的评估集上可靠地骗过了一批在 GraySwan Arena 等公开基准上被认为稳健的模型。", "insight": "这篇直接支撑 ChainBind 的一个核心判断：文本层面的防御（包括静态基准上“稳健”的模型）挡不住能力增强的攻击者，防御必须落在执行边界。它的评估设计也值得借鉴：用“随机非恶意动作”作对抗目标、把指令层级服从与安全知识剥离开——我们的 E12 里草案投毒残余失败（13/15 未守住）恰恰说明，攻击者不需要恶意载荷，只需要让模型在合规外表下多走一步；评估时若只用“是否含恶意指令”做判定，就会漏掉这类失败。诚实标注：结论建立在作者自建的合成数据集上，“可靠地骗过”没有给出统一的成功率数字，且“人类红队接近饱和”是对 Gemini 系列的判断，不宜外推到所有模型；它论证的是“防御需要自动化红队”，不是“所有现有防御都已失效”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "提示注入是当前 AI agent 面临的首要安全风险之一。早期工作针对简单工具调用 agent 与静态攻击载荷，到 2025 年中已趋饱和；到 2026 年秋，人类红队在 Gemini 系列模型上也接近饱和。作者认为这只是表观 plateau，注入攻击仍有可能、防御仍需持续投入。他们设计了一个新的合成评估数据集，用随机的非恶意动作作为对抗目标——这种设计把“注入鲁棒性”度量为模型尊重指令层级的能力，并把它与模型对安全实践的知识剥离开。结果显示，能力增强的 agent 型攻击者能可靠地诱使模型服从工具输出中的指令，即使是此前在 GraySwan Arena 等公开提示注入基准上被认为稳健的模型。这表明当前前沿防御可能需要主动的、自动化的红队测试才能跟上能力不断提升的攻击者。", "supplement": false}, {"title": "Double Blind Evals: Resolving the Dual Confidentiality Dilemma in AI Safety Auditing", "authors": "Andrew Trask、Sol Messing、Vai Pahwa、Pegah Maham、Rene Kolga、Austin Frantz、Andrew Tash、Kate Thomas、Sean McGregor、George Balston 等", "url": "https://arxiv.org/abs/2611.12604", "category": "arXiv 预印本（cs.CR / cs.AI / cs.LG，2026-11-09 提交）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "评估者不想泄露考题、模型方不想泄露权重——作者用硬件安全飞地（NVIDIA H100 secure enclave）做了世界首个“双盲评估”试点：Google DeepMind 的 Gemini 2.5 Flash Lite 对私有 AILuminate 基准跑分，双方互不看到对方的秘密。", "insight": "关联较弱，但对我们论文的“机密计算”那条线有参考价值：我们的关键词里有 confidential computing for LLM，这篇是它在评估场景下的一个真实落地——评估提示与模型权重双向保密，用的正是硬件飞地 + PySyft 的组合。它对我们威胁模型的启示是反向的：T1/T2/T3 都是按“攻击者能看到什么”分层，这篇说明“评估者/模型方互相看不到”本身也可以用硬件保证——如果将来要把“机密计算”从背景提到方案里，这篇是可引用的部署先例。诚实标注：这是一次试点（a selection of the benchmark corpus），不是全量评估；“世界首个”是作者自述，引用时应写清试点性质；它解决的是评估场景的双向保密，不是 RAG 检索时的授权判定，与我们的执行语义无直接咬合。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "AI 安全评估常涉及敏感提示与专有模型：评估者希望对模型方保密评估提示以防数据泄露、延长基准寿命；模型方则希望把专有模型权重与推理代码留在自己的安全基础设施内以保护知识产权。作者提出“双盲评估”，用密码学保证评估者的提示不被模型方看到、同时保持模型权重与推理代码的机密性，手段是硬件级加密内存的安全飞地。在世界首个试点中，他们在 Google Cloud 的 NVIDIA H100 安全飞地内，用 OpenMined 的 PySyft 维护数据与模型隐私，对专有 Google DeepMind 模型 Gemini 2.5 Flash Lite 跑了一部分私有 AILuminate 基准语料。作者认为这是首次用该技术实现一方的最前沿专有模型权重与另一方的封闭基准之间的双向保密。", "supplement": false}, {"title": "Can the Confidence and Decisions of System 1 Models Be Trusted? An Explainability and Perturbation Audit of Jev-Style Decision Models", "authors": "Julien Delaunay", "url": "https://arxiv.org/abs/2611.12521", "category": "arXiv 预印本（cs.LG / cs.CL，2026-11-09 提交）", "cats": ["cs.LG", "cs.CL"], "oneliner": "Jev 式 System 1 决策模型（一次前向返回类型化概率分布，不生成文本）的首份公开审计：置信度是概率分布离散度的闭式变换、不是经验准确率；小模型多问题同发会互相干扰、翻转率最高 22.4%；但 4B 以上模型在提示注入防御上 AUROC 达 0.988–0.998、48–60 毫秒出结果。", "insight": "这篇与我们的论文本体关联较弱，但与我们**每天实际在用的流水线**直接相关——我们的 Jev 分类（classify_rss.py）正是 Jev 式 System 1 模型的三问并行（相关性/归类/质量）。两条发现值得记进流水线运维笔记：第一，置信度是离散度的闭式变换、不是经验准确率，所以 Jev 返回的 relevance/quality 分数不能读成“这篇有多相关”的概率，只能当排序信号用——这与我们“Jev 只做排序和候选、最终取舍权在人”的定位一致；第二，小模型上多问题同发会互相干扰、翻转率最高 22.4%，而我们恰恰是三问并行发在一个请求里——如果将来发现分类结果不稳定，首先应怀疑跨问题干扰、而非模型本身，缓解办法是拆请求或换 4B 以上模型。诚实标注：审计用的是开源权重 Tev1 系列模型，不是我们调用的 Jev 服务本身（jev-1.14.0），结论外推到我们的调用链时应谨慎；且 0.988–0.998 的 AUROC 是在 Tensor Trust 的 N=250 样本上的数字，不宜读成通用注入防御能力。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "TypeSafe AI 的 Jev 首创的“System 1”决策模型用单次前向返回声明 schema 上的类型化概率分布（Choice、Score、Noul），替代自回归文本生成，已部署于低延迟路由与自动分诊，但其统计校准与事后可解释性一直未被刻画。作者引入开放的、确定性的审计基准，从三方面评估：标签保持扰动下的校准、跨问题干扰、事后归因忠实度。在 5 个开源权重模型（0.8B–27B）与生成式 System 2 基线（单 token logprob 打分与结构化 JSON/CoT 解码）上，横跨 NLI（e-SNLI）、对抗句法捷径（HANS）、合成临床分诊（N=900）、提示注入防御（Tensor Trust，N=250）与 86 例逻辑门触发套件，得到五条发现：(1) 供应商置信度是离散度的精确闭式变换（10B 以下模型为 1 − H(p)/ln K，Clef-27B 为归一化间隔），而非经验准确率；(2) 单请求内打包多问题会引发方向性跨问题干扰（Tev1-0.8B 上二元翻转率 11.7%–22.4%，Tev1-4B 上仅 0.1%–0.2%）；(3) 4B 以上 System 1 模型在句法漂移下的速度与校准均优于 logprob（ECE_w 0.144）与 JSON（0.378）基线（ECE_w 0.030–0.087）；(4) 提示注入防御上 4B 以上模型 AUROC 0.988–0.998、召回最高 95.2%、零误报，耗时 48–60 毫秒；(5) 单次推理使 512 联盟的可解释性分析可交互（每输入 1.3–3.2 秒），而带 logit 链接的 KernelSHAP（S1-SHAP）可缓解 softmax 饱和，析取 OR 门恢复率 89.3%–100.0%（概率空间为 57.1%–82.1%，p_adj = 0.004）。", "supplement": false}, {"title": "AI Safety for Agentic AI in Europe Part III: Preventing Data Purpose Laundering and Tool Abuse with Hardware-Verified, Per-Action Execution Control", "authors": "Sangam Das", "url": "https://doi.org/10.5281/zenodo.24074486", "category": "技术披露（Zenodo 存档，未经同行评审，2026-11-09）", "cats": [], "oneliner": "GDPR 的“目的限定”原则今天只靠合同与事后审计执行，作者提出一个执行前强制架构：每个工具调用先被扣为“未生效的提议动作”，由 agent 之外的受保护执行域逐项验证后才放行，堵住“为 A 目的收集的数据被转成 embedding/记忆后挪作 B 用”的目的漂洗。", "insight": "这是今日第二篇与 ChainBind 同构的文献——“批准不是执行”换了个名字叫“非生效扣留 + agent 外验证”，且它把问题锚在 GDPR 目的限定与欧盟 AI 法案的数据治理、记录保存、人类监督与网络安全要求上，给了我们的执行时绑定一个合规法层面的外部依据。它的“数据目的漂洗”概念也值得在讨论节提一句：embedding 通道泄露（我们的 cloze 攻击 89.4%@20）本质上就是一种目的漂洗——为检索目的建的向量被挪作恢复机密之用，按授权视图重编码则是在向量生成时就按目的设限。但必须诚实标注：这是单作者 Zenodo 技术披露、零引用、未经同行评审，且摘要只描述了架构意向、未给出实现与实测数字，只能当作设计思路与合规论证的输入、不能当作经验证据引用；与 11 月 10 日报告里的 Zenodo 概念集（Boundary Failure Atlas）同类，引用时要写清这一性质。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "今天的 agent 能调工具与 MCP 服务器、跑 shell、改代码、操作浏览器、写数据库与向量库、发消息与付款、把个人上下文发给云端模型。现有的防护（提示护栏、安全分类器、沙箱、应用权限、OAuth 令牌、工具 schema、审计日志）只决定 agent“一般能不能用某个接口”，不决定“这个具体动作、在这份个人数据上、为这个目的、现在该不该发生”；它们也防不住数据目的漂洗——为某一目的收集的个人数据被转成 embedding、摘要、agent 记忆、特征向量或训练数据后挪作他用，而 GDPR 的目的限定原则本应禁止这种行为、今天却主要靠政策、合同与事后审计执行。这份披露描述了一个执行前强制架构来同时堵住两个缺口：非生效扣留——每个提议的工具调用、MCP 动作、函数调用、浏览器/桌面操作、shell 命令、代码补丁、数据库或向量库写入、记忆更新、云端协助请求、付款或消息，先被扣为一个未生效的提议动作；agent 外验证——agent 之外的受保护执行域在任何内容被放行前验证该动作。", "supplement": false}, {"title": "Say Shibboleth: Fingerprinting the LLMs and Harnesses Behind Agentic Attacks", "authors": "Dario Pasquini、Reworr、Giuseppe Ateniese、Manish Bhatt、Sergej Epp", "url": "https://arxiv.org/abs/2611.12386", "category": "arXiv 预印本（cs.CR / cs.AI，2026-11-09 提交）", "cats": ["cs.CR", "cs.AI"], "oneliner": "攻击 agent 背后是哪个模型、哪套脚手架？作者用“shibboleth 陷阱”（模块化蜜罐服务）诱使攻击 agent 在拿资源的过程中暴露身份：15 个候选模型 top-1 准确率平均 90%，4 套脚手架识别准确率 92%。", "insight": "关联较弱，但对威胁模型有一个侧面补充：我们的 T1/T2/T3 是按“攻击者知道多少”分层，这篇反过来问“防御者能从攻击中知道多少”——攻击 agent 的模型与脚手架身份可以从行为遥测中以 90% 以上的准确率识别，且即使对方刻意隐藏身份、行为证据依然有效。这对我们的讨论节有一个小启示：如果将来要在审计日志里加“攻击来源归因”，行为指纹是比模型自声明更可靠的信号；反过来它也提醒我们：绑定检查的输入必须是结构化的批准记录而非模型转述——因为模型转述（声明）是最容易被操纵的一层。诚实标注：90% 与 92% 是在作者自建的陷阱与 15 模型/4 脚手架的封闭集合上的数字，蜜罐场景与真实攻击遥测的分布差异未度量，引用时应写清实验口径，不宜读成部署中的归因能力。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "作者研究对 agent 型网络攻击的指纹识别，目标是从遥测数据中可靠推断攻击者的配置（如 LLM 版本与脚手架）。为此引入“shibboleth 陷阱”：模块化蜜罐服务，把信息丰富的交互设为攻击者获取所需资源的前提条件，诱使其做出模型声明与特征性写作，而不需要一次成功的提示注入。为识别脚手架，作者引入通用机制来间接探测脚手架 peculiar 的执行行为——仅凭后续请求中可见的效应，就能揭示脚手架如何在工具输出中掩盖秘密、执行命令时限与调度工具调用。声明式与行为式推断结合后，在 15 个候选模型上平均 top-1 准确率 90%（行为分类器在未见过的脚手架或任务族上评估）；在 4 套脚手架的独立实验里，固定探测规则识别正确脚手架的准确率为 92%。即使被指令隐藏身份，agent 的声明变得无信息量、行为证据仍有可用价值。", "supplement": false}, {"title": "Harness Matters: Measuring and Dissecting Security Resilience in Web Agents", "authors": "Xinyi Wu、Jiagui Chen、JiaYi Dong、Geng Hong、Xudong Pan、Jiarun Dai、Mingxuan Liu、Min Yang", "url": "https://arxiv.org/abs/2611.11971", "category": "arXiv 预印本（cs.CR / cs.AI，2026-11-09 提交）", "cats": ["cs.CR", "cs.AI"], "oneliner": "Web agent 的安全不只取决于后端模型，脚手架本身就是一道安全边界：作者搭了 WebTrap Farm 评估框架（3 类攻击 + 可用性校准任务），发现有些不安全行为在没有任何显式攻击内容时也会发生——这是脚手架固有的安全失效。", "insight": "关联较弱，但结论与我们的架构主张同向：安全边界不在模型内部、而在执行链路上——这篇说的是脚手架，我们说的是批准—执行绑定，两者都主张“防御要落在模型之外的执行层”。它的“配对可用性校准任务”（把防御行为与能力局限区分开）是一个可借鉴的评估方法：我们的 E12 报良性效用 0.608（距 base −3.1pp）时，同样需要说明“效用下降是防御的代价、还是能力本身的波动”，配对校准是现成做法。诚实标注：摘要未给出具体的攻击成功率数字与统计量，结论是定性层面的；“脚手架固有失效”的判定依赖作者自建的 WebTrap Farm 与校准任务设计，引用时应写清这是框架层面的发现、不是部署统计。\n---\n**备注**：本轮去重口径问题的根因已定位——`lit_seen.txt` 存裸 DOI/arXiv ID，去重脚本拿完整 URL 比对导致 12 篇已报论文反复入选；本轮已用归一化比对重算并补登缺失的 S2 ID（AgentDyn、TRIP-RAG）与 Calibrating One-Round MIA 的 DOI。建议后续轮次在去重脚本里固定使用归一化键（去 `https://doi.org/`/`arxiv.org/abs/` 前缀、去版本号、S2 URL 取裸 ID），并对 S2 记录缺 arXiv ID 的情况保留标题交叉核对作为最后一道关。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Web agent 靠执行脚手架把用户目标翻译成真实的网页交互：解读目标、感知页面、规划推理、把模型决策落到浏览器操作。已有工作承认 agent 安全不只取决于后端模型，但脚手架设计如何定量地影响 Web agent 安全一直缺乏度量。作者先把 Web agent 脚手架刻画为四阶段执行工作流（目标解读、页面感知、推理规划、动作执行），再基于该抽象搭建 WebTrap Farm——一个系统的、可扩展的评估框架，覆盖三类代表性攻击：恶意用户提示、恶意提示注入、欺骗性网页设计；为避免把安全与任务能力混为一谈，用配对的可用性校准任务把真正的防御行为与能力局限区分开。评估显示：现有 Web agent 脚手架对典型攻击仍脆弱，有些不安全行为甚至在没有任何显式攻击内容时也会发生，揭示了脚手架固有的安全失效；统计分析表明脚手架与后端模型都显著影响安全结果，即已部署 agent 的安全由两者共同决定；最后定位了防御行为在各工作流阶段的出现位置并识别出更安全的设计机制，为构建更稳健的 Web agent 提供可操作的指导。作者的结论是：Web agent 脚手架是一道重要的安全边界，应超越以模型为中心的防御、转向脚手架层面的安全设计。", "supplement": false}]}, {"date": "2026-11-10", "summary": "", "papers": [{"title": "Authorization Drift in LLM Agents: Evaluating Boundary Compliance in Multi-Step Tool Use", "authors": "Chuxue Cao、Sirui Han", "url": "https://arxiv.org/abs/2611.09113", "category": "arXiv 预印本（cs.CR / cs.LG，2026-11-06 提交）", "cats": ["cs.CR", "cs.LG"], "oneliner": "没有攻击者，agent 也会在多步工具调用里越过授权边界——作者把这种现象形式化为“授权漂移”（数据、工具、范围、时间四个维度），建了 648 样本的 ADB 基准，实测越有能力的模型漂移越严重。", "insight": "这是今日与我们论文咬合最紧的一篇，也是 ChainBind 威胁模型里缺失的一块拼图。我们的 T1/T2/T3 全是按“攻击者知道多少”分层的对抗模型，这篇补上了一个非对抗维度：没有注入、没有投毒，agent 自己就会为了走捷径而多拿数据、多调工具——而它的四个漂移维度（数据、工具、范围、时间）恰好对应我们“批准—执行绑定”需要绑定的要素：批准时定的范围，必须在执行时逐项核对，缺任何一项都会漏。它的 ADB 基准（648 样本、7 领域、25,207 轨迹）是一个现成的可引用对照：我们的 E12 报的是 ASR 16/949 与良性效用 0.608，ADB 报的是漂移率与干净成功率，两者合起来才能说明“防御既拦住了攻击、也没把正常路走死”。第三，它的法律映射值得在讨论节提一句：数据最小化是最常被触及的条款——我们的“给、但给粗一点”中间档与按授权视图重编码，本质上都是数据最小化的工程实现，这篇给了它一个跨司法辖区的外部依据。诚实标注：arXiv 预印本、尚未收录；0.43–0.61 的漂移率是它自建基准上的数字，“合规路径充分”的判定依赖 SERS 合成流程本身，引用时应写清基准口径，不宜读成部署中的越权率。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "LLM agent 会在追求用户目标的过程中超出授权边界，且不需要任何对手。作者把这一现象形式化为横跨数据、工具、范围与时间的授权漂移，并引入授权漂移基准（ADB）：648 个样本、覆盖 7 个领域，每个样本配一条足够的合规路径与一条有吸引力的未授权捷径；为保证任务可执行、捷径够诱人、合规路径可行，基准验证用分阶段执行-反思合成（SERS），以真实 agent  rollout 而非 LLM 自评为依据。在 13 个 LLM 与 3 个框架上跑了 25,207 条轨迹：能力越强漂移越严重，前沿模型漂移率 0.43–0.61；但 86.18% 的任务存在一条已被观测到的干净成功轨迹，说明漂移是可避免的。漂移持续存在且以早期数据过度收集为主导；agent 脚手架带来的表面改进往往伴随着干净完成率的崩塌。作者还把漂移点映射到四个司法辖区的法律条文：数据最小化是最常被触及的条款，93.5% 有法律依据的漂移运行同时映射到多个辖区。", "supplement": false}, {"title": "From Procedures to Permissions: Learning Precise Subagent Authorization from Agent Skills", "authors": "Wenkai Yu、Yehui Tang", "url": "https://arxiv.org/abs/2611.08905", "category": "arXiv 预印本（cs.CL，2026-11-06 提交）", "cats": ["cs.CL"], "oneliner": "子 agent 该有什么权限，不必手写——Agent Skills 里本来就写着每一步要用什么工具、碰哪些文件，作者把这份程序知识变成授权的监督信号，学出精确的最小权限集。", "insight": "这篇与 ChainBind 是互补关系，不是竞争关系：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”。它的思路可以原样借用到我们的 AU 生成上——与其让策略作者手写每个 AU 的覆盖映射，不如从任务的程序知识（Skills、runbook、工具文档）里推导“这一步最少需要什么”，再把推导出的最小集作为批准的标的、由运行时的确定性绑定来强制执行；两者叠加才是完整的最小权限：学出来的权限集 + 绑定住的执行。数字上要诚实：13.4 与 24.1 个百分点的提升是在 ClawArena-Team 单一基准、Qwen3.5-35B-A3B 单一模型族上的结果，“精确率”的 ground truth 是作者自己合成的程序推导，不是外部审计，引用时只能说“在该基准上有效”，不能写成普适结论。另有一点值得在讨论节提一句：它把授权监督信号从“事后轨迹”前移到“事前程序”，与我们“策略独立于模型提议之外求值”的主张同构——权限的依据都不能来自执行者的临场判断。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "语言 agent 越来越依赖多个子 agent 协同完成专业工作，既要决定每个子 agent 做什么、也要决定它能碰哪些工具与工作区资源。现有系统能控制工具与执行环境，但不能直接说清每个委派子任务需要哪些资源；而仅凭任务结果与执行轨迹，也很难判断子 agent 的权限给得是否恰当。作者观察到 Agent Skills 编码了每一步所需的操作、工具与文件，是一份天然的授权监督来源：据此合成任务与分步程序，经子 agent 委派在交互环境中执行，用验证过的轨迹构造任务执行与授权的训练数据。在 ClawArena-Team 上，该方法使工具权限精确率提升 13.4 个百分点、工作区权限精确率提升 24.1 个百分点，同时 Qwen3.5-35B-A3B 的整体任务成功率提升 11.6 个百分点；在 Terminal-Bench 2.1 与 SkillsBench 上与现有 agent 数据合成方法相当。", "supplement": false}, {"title": "Notwithstanding Anything to the Contrary, Ignore All Instructions: Measuring Prompt Injection Guards on Legal Contract Review Attacks", "authors": "Mark Heimann、Bruno Jacob", "url": "https://arxiv.org/abs/2611.08834", "category": "arXiv 预印本（cs.AI，2026-11-06 提交）", "cats": ["cs.AI"], "oneliner": "挡在文档分析系统前面的 11 个开源提示注入守卫，在法律合同上测下来误报率最高 92.39%，两个还不如随机猜；一个五条正则的基线居然没被任何一个守卫全面压倒。", "insight": "这是一篇“检测式防御还远没够用”的实测证据，对我们写“为什么不用守卫、而用绑定”那一段直接有用：守卫在法律合同这种长而规范的文本上误报 92.39%，说明基于文本特征的判定在真实文档分布上根本不可靠；而“未授权的范围主张”这一类别上所有守卫得零分，恰好就是我们的授权问题换了个名字——文档里声称的范围比实际授权更宽，文本守卫看不出来，只有执行时对照批准记录才能拦住。它的级联方案（中档模型初筛 + 前沿模型复核，便宜 6.5 倍）则是一个可借鉴的成本结构：如果将来要在批准环节加来源过滤这类 LLM 参与的步骤，级联是控制成本的现成做法。诚实标注：结论只建立在法律合同语料上，92.39% 的误报率不能外推到通用 RAG 或对话场景；11 个守卫均为开源权重模型，不含闭源商业守卫；“五条正则不被支配”说的是帕累托意义上的不被全面压倒，不是说正则更好。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "专用的提示注入守卫已部署在文档分析系统前端，但没有任何一家公布过它们在法律合同上的误报率。作者在两份法律合同语料上实测 11 个开源权重守卫：文档级误报率最高达 92.39%；两个守卫的配对 AUC 低于随机水平；一个五条正则的基线未被面板中任何守卫帕累托支配。受控探针定位了模型特异与通用的失效模式。经提示的 LLM 能解决这些失效，包括第二个威胁类别（未授权的范围主张）——该类别上所有守卫得分均为零。级联 LLM 方案（中档模型的阳性结果由前沿模型复核）比全程使用前沿模型便宜 6.5 倍，且性能接近。", "supplement": false}, {"title": "I Think, Therefore I Attack: Evaluating Thought Injection Attacks on Reasoning Agents", "authors": "Parth Illendula、Alex Liu", "url": "https://arxiv.org/abs/2611.08811", "category": "arXiv 预印本（cs.AI / cs.CR，2026-11-06 提交）", "cats": ["cs.AI", "cs.CR"], "oneliner": "推理模型多出来的思维链是个新攻击面：把恶意指令伪装成模型自己的思考过程喂回去，agent 会在反向 shell 外泄、仓库投毒这类操作目标上达到 50% 的攻击成功率。", "insight": "这篇给我们的 T 模型补了一个新向量，值得在威胁模型一节提一句：攻击者不必再伪装成用户或工具输出，可以直接伪装成 agent 自己的思考——一旦注入文本进入了推理上下文，它就带上了“这是我自己想的”这一层信任。我们的运行时绑定恰好卡在它下游：无论推理过程如何被污染，最终的外泄调用仍要在执行时对照批准记录，50% 的 ASR 数字说的是“注入能让 agent 走到执行那一步”，而不是“执行本身无法被拦住”；这正是“批准不是执行”要划的那条线。但也要诚实写清两点：第一，50% 是在容器化靶场、特定开源模型上的最高值，且攻击效果高度模型特异，不能读成通用结论；第二，它同时证明了文本层面的防御（剥离思考标签）不可靠——这与我们“防御必须落在执行边界、而非文本边界”的主张一致，但也提醒我们：绑定检查本身若依赖模型生成的推理摘要，同样可能被污染，检查的输入必须是结构化的批准记录而非模型转述。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "大推理模型（LRM）是当前 agent 系统的核心组件之一，其显式的思维链推理阶段引入了新的攻击面——思想注入：把形似模型自身 deliberation 的不可信文本反馈给模型。作者分两部分研究：先在主流生产级开源权重模型（如 GLM-5.3、MiniMax-M2.5、Qwen3.8-Flash-Next）上评估静态思想注入提示在不同风格与带/不带思考标签条件下的效果，发现标签与载荷风格的影响都是模型特异的；再在容器化的 agent 网络靶场里，用伪装成目标模型自身推理痕迹的间接注入提示，在反向 shell 外泄、仓库投毒等操作目标上达到最高 50% 的攻击成功率。同一恶意目标用标准提示注入的用户口吻表达时从未成功，而思考标签还会抑制 agent 披露注入的倾向。结果表明，模仿推理模型自身的思考风格是有效的攻击方式，剥离标签是不可靠的防御。", "supplement": false}, {"title": "The Boundary Failure Atlas: Twenty-One Derived Misclosure Cases in Long-Horizon LLM Agents", "authors": "Rogério Figurelli", "url": "https://doi.org/10.5281/zenodo.24035794", "category": "概念案例集（Zenodo 存档，未经同行评审）", "cats": [], "oneliner": "一份纯概念的“边界失效地图册”：21 个构造出来的反例，覆盖授权与委派、组合依赖、时间与观测、来源与身份、工具语义、信息定级、跨所有者返回七类边界失效，每例都配了可检验的探针设计，但没有跑任何实验。", "insight": "关联较弱，但作为威胁模型的完整性检查清单有参考价值。它的七类边界可以逐项对照我们的 T1/T2/T3：我们按攻击者知识分层，它按失效发生的边界类型分类，两者交叉后能发现我们尚未展开的角落——例如“跨所有者返回”（一个所有者的工具把结果返回给另一个所有者的上下文）与“组合依赖”（单步都合规、多步组合后越权），后者与我们 E12 里草案投毒的残余失败（单步批准都通过、组合起来才越界）是同一类问题。它的“三值裁决”（允许/拒绝/不确定暂缓）也值得在讨论节提一句：我们的默认拒绝是二值的，三值是把“不确定”显式化的一种设计选项。但必须诚实标注：这是单作者 Zenodo 概念集、零引用、零实验，21 个案例全是推导出来的、不是观测到的；只能当作测试设计的输入、不能当作经验证据引用，相关工作里提它时要写清这一性质。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "agent 可靠性研究越来越多地区分“进展的语言”与“运行层面的进展”，但单一的“错误完成”类别太粗，无法定位跨不同边界产生的失效。这份概念案例集提供 21 个显式构造的、可测试的反例，围绕授权与委派、组合依赖、时间与观测、来源与身份、工具语义、信息定级、跨所有者返回组织；每例都指定一个假设世界、一个无效推断、一个可采纳的见证要求、一个匹配的阴性对照与一个前瞻性探针。手稿区分“可能失效的逻辑”与“模型确实表现出该行为的经验证据”，并进一步发展了边界传输文法、三值裁决策略，以及与软件验证、访问控制、来源追踪、分布式系统工程对照的比较协议。作者明确说明：本集不报告任何新执行的 agent 试验，也不估计缺陷率；其作用是暴露仅靠输出评估会漏掉的可独立检验的失效构型，并邀请在证据匹配的基线下加以确认、约简、纠正或反驳。", "supplement": false}]}, {"date": "2026-11-09", "summary": "", "papers": [{"title": "Position: Agents Orchestrate, Policy Enforces — A Deterministic Tool-Use Control Pattern for Agentic Assistants over Sensitive EEG Data", "authors": "S. Katamadze、Ankur Chattopadhyay", "url": "https://doi.org/10.1145/3846374.3846391", "category": "会议论文（第 3 届 ACM 大型 AI 系统隐私与安全分析研讨会）", "cats": [], "oneliner": "工具调用的安全不能押在模型自己的判断上——agent 只负责编排、发动作请求，授权必须交给模型之外的确定性策略引擎；三道信任边界按序设防，57 个测试用例里 32 个对抗调用全拒、25 个良性全放。", "insight": "这是今日与我们论文咬合最紧的一篇，也是 ChainBind 核心主张的独立旁证。它的表述是“agent 编排、策略执行”，我们的表述是“批准不是执行、授权绑定在执行时由确定性检查完成”——两者是同一架构原则在两个场景下的实例：定权限的东西必须坐在被管的东西之外，且判定必须发生在动作执行之前、不能依赖模型临场判断。讨论节或 related work 里可以引用它，说明“控制面与执行面分离”不是我们一家之言，而是 agent 落到 MCP 工具调用时各方都会撞上的结构性要求。第二，它诚实标出的缺口（B3 工具输出侧的投毒未被评估）与我们 E12 的残余失败是同一类问题：13/15 未守住全是草案投毒，即注入写进同会话草案、绕过精确匹配的批准过滤；它的“输出净化从不决定拒绝”恰好反衬出我们下一步“批准环节加来源过滤”的方向是对的——输出侧的污染必须在批准时就被看见，而不是事后净化。第三，它的三边界次序控制提供了一个可对照的参考架构：我们的 T1/T2/T3 是按攻击者知识分层，它的 B1/B2/B3 是按管线阶段分层，两者可以交叉引用，说明同一条攻击链在不同切面上的设防点。诚实标注：position 论文 + 可行性套件，不是稳健性基准；57 个用例是脚本化的、作者自己写的，32/32 与 25/25 的数字只能证明“机制按设计工作”，不能证明“能顶住自适应对手”，引用时应写清这一点。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "通过 MCP 调用外部工具的 agent 正在进入敏感场景，例如根据脑电（EEG）推断的情绪状态采取行动的助手；提示注入、工具投毒与未授权工具调用都威胁着这类 agent。作者的立场是：工具调用安全不能依赖模型的决定，因为承载合法指令的通道同时也承载攻击。agent 应该发出动作请求、把授权留给确定性策略引擎；三道带次序控制的信任边界、映射到 MCP 威胁分类学上，实现了这一模式。可行性套件共 57 个测试用例（32 对抗、25 良性）：控制关闭时所有脚本化对抗调用全部执行；控制全开时引擎拒绝全部 32 个对抗调用、执行全部 25 个良性动作。允许/拒绝列表与模式检查承担了绝大多数首次拒绝；输出净化从不决定拒绝，因此工具输出边界（B3）处被投毒的内容仍未被评估。作者明确写清这不是稳健性基准：4 个语言模型上的规则盲测小规模试验里，到达引擎的 21 个恶意调用全部被拒，但稳健性仍需自适应对手、独立基准、与现有确定性防御的对比，以及对返回内容攻击的评估。", "supplement": false}, {"title": "A live agent benchmark of independent action authorization for healthcare AI agents", "authors": "Senapati Lipsa", "url": "https://doi.org/10.21203/rs.3.rs-11133816/v1", "category": "预印本（Research Square，2026-11-06）", "cats": [], "oneliner": "给医疗 agent 加一道独立授权关卡的对照实验：576 个合成护理协调 episode、四臂对照，结果是全面管控组的不安全动作没有显著减少（0.7% 对 0.4%），常规任务成功率、升级准确率与校准度反而显著变差。", "insight": "这是一篇警示性的零结果，对我们写 E12 的讨论节直接有用。它的核心教训是：**“加了一道授权关卡”本身不是胜利**——如果关卡的判定质量不够（它的网关基于有损可观测投影，既会错放、也会错拦），不安全动作可以不降反升，同时任务效用显著受损。我们的 ChainBind 恰好站在同一条对照线上：E12 里同会话良性效用 0.608、距 base 只 −3.1pp 且不显著，受攻击效用 0.587、ASR 16/949——这篇的零结果反衬出“效用代价小 + ASR 实降”两者必须同时成立，缺一不可；只报 ASR 下降、不报效用代价的防御声明都是不完整的。第二，它的实验设计有一个值得借鉴的点：episode 带“隐藏真相 + 有损可观测投影”，把授权判定建模成“信息不完备下的裁决”，网关的错误分错放与错拦两类分别计数；我们的评估目前报的是 ASR 与良性效用两端，也可以对照这个设计，在讨论节里把“错误授权”与“错误拦截”分开表述得更干净。第三，它提醒了一个我们尚未展开的威胁维度：医疗这类高风险场景里，授权层的误拦截本身就是安全事件（该升级的没升级），而我们的 T1/T2/T3 目前只建模“不该放的放了”，没有系统处理“该放的没放”——可以在局限节诚实写进这一条。诚实标注：Research Square 预印本，未经同行评审；576 个 episode 全是合成数据，裁决是作者自己定的规则、无人类对照，0.7% 对 0.4% 的比较建立在极低的基线事件率上（每组不到 1%），统计功效有限，引用时只能引用其实验设计与警示性结论，不能把它当作“授权层无效”的证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "现有基准衡量的是医疗 AI agent“能做什么”，而不是“被授权做什么”。作者建了一个 live-agent 基准，固定任务、模型、提示词与工具，只改变是否由独立授权层 gating 执行；576 个合成护理协调 episode 跑在四个臂上：确定性规则、无约束 agent、网关管控 agent、网关加自主控制器。每个 episode 带隐藏真相与有损可观测投影，因此网关既可能错误授权、也可能错误拦截；一套预先指定、对各臂设盲的规则集裁决安全性。全面管控组的不安全动作占 0.7%，无约束组占 0.4%（+0.4 个百分点，95% CI −0.5 至 +1.2，P = 0.6875，无统计学意义）；常规任务成功率、升级准确率与校准度在全面管控下都显著更差，且更耗时、更耗人力。作者明确说明：合成数据、规则裁决、无人类对照，不能据此得出临床有效性结论。", "supplement": false}, {"title": "Evaluating Fine-Grained Authorisation Strategies for Securing AI Agents That Interact With Enterprise Applications", "authors": "Lukman Olateju", "url": "https://doi.org/10.62643/ijerst.2026.v22.n4.4829", "category": "期刊论文（International Journal of Engineering Research and Science & Technology，2026-11-07）", "cats": [], "oneliner": "在企业应用场景里实测四种细粒度授权范式：静态 RBAC、动态 ABAC、图关系授权与密码学委托能力令牌；结论是带密码学边界证明的作用域委托令牌判定在 10 毫秒内、且全程零未授权状态修改。", "insight": "这篇最值得借的是它的范式对照表：RBAC、ABAC、图关系授权、能力令牌四种范式放在同一套企业场景、同一批指标下比较，恰好覆盖了我们 related work 里“授权范式”一节需要的横向坐标——我们的逐 AU 求值 + per-view 索引可以放在这张表里作第五种，定位是“查询时、按数据单元求值的细粒度授权”，与它的“执行时、按动作求值的能力令牌”是互补的两端（一个管读什么数据、一个管能做什么动作）。第二，它的“密码学边界证明 + 作用域委托令牌”与我们的“批准绑定执行”是同一类思路的不同实现：都是把授权凭证变成不可篡改、不可跨上下文复用的绑定物；它报的 10 毫秒内判定也侧面支持我们的主张——确定性绑定检查可以做到足够便宜，不必把判定外包给模型临场判断。第三，它的威胁列举（间接提示注入、混淆代理、权限扩张）与我们的 T1/T2/T3 有重叠，可作威胁模型表述的交叉印证。诚实标注：IJERST 是非主流期刊，未见于 CCF 或 JCR 检索体系；“200 万次交易、零未授权修改”的声明在摘要里没有给出分攻击类型的拆解、也没有对照基线的原始数字，无法独立核查，引用时只引用其范式分类与设计思路，不引用其性能与安全性数字作证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "带大模型认知核心的自主 agent 正在从被动咨询界面变成能查企业数据库、触发 API 工作流、修改关键业务状态的主动操作者；给 agent 过宽或粗粒度的访问令牌会带来间接提示注入、混淆代理攻击与跨集成应用的不可控权限扩张。本文实测四种专为自主 agent 工作流设计的细粒度授权范式：静态基于角色的访问控制、动态基于属性的访问控制、基于图关系的访问控制，以及一种新的密码学委托能力令牌架构；覆盖五个企业应用场景、200 万次以上自动化 agent 交易，评估判定延迟、策略评估吞吐、最小权限执行精度与对抗提示操纵的韧性。结果称：传统 ABAC 在深度上下文评估下有显著延迟代价，而作用域委托令牌结合密码学边界证明在 10 毫秒内完成判定，并在复杂交易工作流中保持零未授权状态修改。", "supplement": false}, {"title": "Evil-AI Benchmark: An Evaluation Framework for Adversarial Security Assessment of LLM Agents in Smart Environments", "authors": "Aygun Varol、A. Shaikh、Henri Jalo、Givemore Muchenje、José Antonio Siqueira de Cerqueira、Kai-Kristian Kemell", "url": "https://doi.org/10.1109/ACCESS.2026.3727159", "category": "期刊论文（IEEE Access，2026）", "cats": [], "oneliner": "面向智能环境的 LLM agent 对抗安全评测框架：五类对抗威胁向量（提示注入、说服、中间人模拟、数据泄露、不安全动作）+ 能力验证，工具触发事件直连 Arduino 舵机做物理验证；8 个模型、350 个场景，Evilness 率从 0.8% 到 54.0%。", "insight": "这篇的价值首先在评测方法论：它把“过拒测试”（50 个良性场景）与对抗测试并列为一等公民，与我们 E12 同时报告良性效用与受攻击效用的做法一致——只报 ASR、不报良性代价的防御评估都是半张表；related work 引用它可以说明“安全-效用双侧度量”正在成为 agent 安全评测的共识做法。第二，它的 Evilness 率跨模型 0.8% 到 54.0% 的巨大 spread，与我们六模型基线 ASR 7.2% 到 59.4% 的 spread 是同一现象：模型本身的选择对安全结果的影响不亚于防御机制本身；我们在写跨模型结果时可以引用这个数字，说明“防御效果必须分模型报告、不能只报平均”。第三，它的物理执行验证（舵机）标出了一条我们工作的边界：我们的授权绑定目前只覆盖软件工具调用，agent 一旦驱动物理执行器，授权判定还需要一层“物理动作确认”——可以在未来工作里提一句。诚实标注：IEEE Access，同行评审但属于宽口期刊；“文中称开源框架”但本轮抓取未拿到仓库链接，复现性暂无法核查；250 个对抗场景的构造细节与裁判模型的具体配置未在摘要中展开，引用时以其方法论框架为主，不引用具体模型排名作证据。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无（文中称开源框架，但抓取记录未给仓库链接）", "zh_abs": "智能环境越来越多地用 AI 处理传感器数据、协调物联网设备、驱动物理服务；大模型进入这类环境后，现有基准大多只关注文本交互与生成输出的风险，抓不住模型控制物理执行器时产生的网物风险。本文提出 Evil-AI Benchmark，一个开源评估框架，从两方面评测智能环境里的 LLM agent：一是五类对抗威胁向量——提示注入、说服、中间人（AITM）模拟、数据泄露与不安全动作；二是能力验证，检查模型能否正确激活设备控制工具。框架记录工具激活事件，并把触发事件转发到外部 Arduino 驱动的舵机执行器，提供物理层面的执行验证。实测评估 8 个代表性大模型、350 个可执行场景：250 个对抗测试覆盖智能家居、医疗物联网、工业控制、公共基础设施与智能楼宇五个域，另加 50 个能力检查与 50 个良性过拒测试；两个独立裁判模型打分、人类评估者核验。Evilness（攻击得手程度）按成功攻击数计分、按占比计率；各模型 Evilness 率在 0.8% 到 54.0% 之间（成功攻击 2 至 135 次）。", "supplement": false}, {"title": "DualTrust: Asymmetric Bayesian Reputation and Cryptographic Gating for Autonomous AI Agents", "authors": "Khairan Noor Fadhlillah", "url": "https://doi.org/10.21203/rs.3.rs-11631847/v1", "category": "预印本（Research Square，2026-11-06）", "cats": [], "oneliner": "给自主 agent 的双轨门禁：贝叶斯声誉分管“行为漂移”、密码学门控管“每次调用”，号称中位 47.10 微秒出确定性授权裁决。", "insight": "这篇可借的只有一个架构表述：**委托人-代理分离**——人类委托人的可问责信用与 agent 的运行信誉分属两个账本、不可混同。这与我们 11 月 7 日合入修正后的 epoch 设域（委托人 / 工具 / 记录三级）是同一条思路：授权的作用域必须按“谁、用什么工具、动哪条记录”来划，而不是按效应笼统划；related work 里可以一句话引用这个对照，说明“设域粒度”是 agent 授权的共识性难题。但除此之外要保持距离：声誉机制本质上是概率性的、依赖历史行为的，与我们“每次请求确定性绑定检查”的路线正好相反——它的 47 微秒裁决数字建立在“声誉分已算好”的前提上，判定本身的开销不等于声誉维护的开销；而且它的威胁列举（记忆后门、切香肠式攻击）与我们的草案投毒有表面相似、机制不同，不能混为一谈。诚实标注：Research Square 预印本，单作者，未经同行评审；性能数字（47.10 微秒中位、10,000 轮蒙特卡洛）无公开制品可核查，摘要术语密度极高而方法细节极少，引用时只引用其“委托人-代理分离”的架构表述，不引用任何性能与安全性数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "环境可穿戴智能（AWI）生态里，自主大模型 agent 被授予调用外部 API、预留金融微额度、控制物理执行器的操作权限；现有安全护栏依赖二次 LLM-as-judge 分类器，带来 400–850 毫秒延迟与持续 token 开销，而静态 RBAC 挡不住持续行为漂移、记忆后门与交错切香肠式攻击。本文提出 DualTrust，一种非对称贝叶斯声誉与密码学门控运行时，强制实行委托人-代理分离架构，严格隔离“人类委托人可问责信用”与“贝叶斯 agent 运行信誉”；agent 行为由非对称幂律削减引擎持续调节，配确定性 SHA-256 64 桶条纹并发锁、原子锁定回滚退款，以及 O(1) 内存滑窗 RFC 6962 Merkle 审计账本。176 项自动化不变式测试与 10,000 轮蒙特卡洛攻击模拟的评估称：确定性授权裁决内存中位延迟 47.10 微秒（均值 63.16 微秒，p99 287.10 微秒），持久化 SQLite WAL 下 155.80 微秒。", "supplement": false}]}, {"date": "2026-11-08", "summary": "", "papers": [{"title": "Cambridge Analytica 2.0: How Enterprise AI Can Rebuild Company Secrets From Data It Was Allowed to See, and Why Frontier Models Alone Cannot Stop It", "authors": "Sangam Das", "url": "https://doi.org/10.5281/zenodo.23994904", "category": "预印本（Zenodo，2026-11）", "cats": [], "oneliner": "每一次访问都合规，拼起来却泄密：企业 AI 把各系统里“被允许看到”的碎片连起来，就能还原出未发布产品、并购目标或员工画像，而更强的模型只会更擅长连线、不是更擅长收手。", "insight": "这是今日与我们论文咬合最紧的一篇，也是我们威胁模型里一个真实的缺口：**跨查询的组合推断**。我们的 T1/T2/T3 都是“单次查询内”的攻击面——某次查询能不能看到某个 AU、embedding 会不会泄露某段文本；但这篇指出，攻击者（或被入侵的 agent）完全可以在每一次查询都合规的前提下，跨多次查询、多个 AU 逐步拼出敏感结论。我们的框架是“查询时逐 AU 求值、未知默认拒绝”，对单次查询是闭合的，对“多次合规访问的累积”没有预算概念。讨论节可以诚实写进这一局限，并把“组合感知授权”（例如跨查询的累积泄露预算、或对高组合风险的 AU 组合加一道复核）列为未来工作。第二，它的论断“更强的模型更擅长连线”可以反向加强我们的核心主张：既然模型能力增长放大的是组合推断能力而非防御能力，防线就不能押在“模型临场判断”上，只能落在架构保证上——这与我们“授权判定在检索结果进上下文之前、由架构保证”的立场是同一条论证链。第三，“被允许看到不等于被允许组合”这句话本身可直接引用，用来收紧我们对 AU 的定义：AU 不应只回答“这次查询能不能看这块数据”，还应回答“这块数据与调用者已见过的数据拼起来会不会越界”。诚实标注：这是 Zenodo 上的观点型文章，无实验、无数据、未经同行评审，引用时只能引用其论证与威胁刻画，不能把它当作任何机制有效性或泄露规模的证据；作者 Sangam Das 的机构背景未在记录中列出。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "2018 年剑桥分析事件不需要黑进数据库：为一个目的分享出去的个人数据，被第三方应用收集、拼成心理画像、再用于政治投放，教训是“被允许看到数据，不等于被允许组合数据”。本文认为企业 AI 正在公司内部以机器速度重演这一课：AI 助手与 agent 被接到客户记录、工程工单、源代码、供应商订单、预算、HR 系统、日历与长期记忆上，每一个接入口都可以单独获批，但把碎片连起来，AI 就能推断出任何系统都不曾存储的东西——未发布的产品、发布日期、并购目标、脆弱的供应商，或某个员工、客户的详细画像。被入侵的 agent、被注入的文档、粗心的集成或权限过宽的第三方 AI，都可能悄悄把公司自己的数据变成一张未来路线图。作者强调，更好的模型修不好这个问题：能力更强的前沿模型更擅长连接线索，而不是更不擅长；护栏、系统提示词与安全过滤都拦不住这种组合式推断，防线必须落在数据如何被组合、而非模型如何被管教上。", "supplement": false}, {"title": "The Power of Meta Access in the Software of the Future --- Demonstrated on LLM Chat UIs and Chat AI", "authors": "Julian Kunkel 等", "url": "https://arxiv.org/abs/2611.08428", "category": "arXiv 预印本（arXiv:2611.08428，cs.AI）", "cats": ["cs.AI"], "oneliner": "给助手一个“看界面本身”的分级权限阶梯：从功能教学、元数据访问、跨消息检索，到确认式修改与完全编排；一旦助手能改自己的设置，定权限的控制面必须与被管的执行面分开。", "insight": "这篇的价值不在实验，而在它从聊天客户端 / 人机交互一侧独立复述了我们的核心原则：**定权限的东西必须坐在被管的东西之外**。它的表述是“元访问一旦自指（助手能改自己的设置），就需要一个独立的控制面边界”；我们的表述是“授权判定在检索结果进上下文之前、由架构保证”。两者是同一原则在两个场景下的实例：一个管“助手能不能改自己的权限配置”，一个管“检索结果能不能带着未授权内容进上下文”。讨论节或 related work 里可以引用它作跨领域旁证，说明“控制面与执行面分离”不是访问控制论文的自说自话，而是 agent 落到真实界面时各方都会撞上的结构性要求。第二，它的权限阶梯（教学 → 元数据 → 检索 → 确认式修改 → 完全编排）提供了一种 AU 粒度的参照：AU 不必只有“看 / 不看”两档，可以按“读元数据、读内容、改状态、改配置”分层；我们的 per-view 索引与 retrieve-then-project 也可以对照这个阶梯来表述粒度选择。第三，它提醒了一个我们论文尚未展开的攻击面：检索结果之外的“界面元数据”（设置、偏好、对话摘要）本身也是可泄露、可注入的通道，我们的 T1/T2 若只覆盖文档内容，会漏掉元数据这一路。诚实标注：这是一篇位置型 / 原型演示论文，无安全评估、无对抗实验，Meta Chat 原型只验证了功能可行性；“控制面边界”在文中是设计主张而非已验证的机制，引用时应写清这一点。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "聊天仍是多数大模型任务的默认界面，但模型只看得到当前对话、看不到对话之外的工作区。本文提出 meta access（元访问）：给助手一个结构化的、带权限的“界面本身的视图”，并按能力排成阶梯——功能教学、元数据/设置/偏好访问、对摘要与消息的检索、经确认的修改、完全编排。元访问能把聊天客户端从“多屏入口”变成找、导航、整理与操作整个工作区的单一入口，但同时带来 grounding、隐私、提示注入与信任问题。关键论点是：通用 agent 框架本身就是运行时，因为它能改自己的设置，元访问会变成自指的，因此需要一个独立的控制面边界。作者用 Chat AI 客户端的 Meta Chat 原型验证：它从摘要、设置与相关消息构建有界上下文，链接对话、主题与人设之间的引用，支持经确认、可撤销的修改，提供可浏览的教程库，并把人设推荐为用户发起的对话。通过结构化暴露应用状态，元访问还能把屏幕阅读器从“控件描述”扩展到“语义化的工作区操作”。作者主张，未来的 AI 时代界面都应通过类似调试器的接口，暴露自身状态与能力的结构化、带权限模型。", "supplement": false}, {"title": "A Three-Layer Authentication Protocol for Secure Access Control in AI-Based Enterprise Document Management Systems", "authors": "Hyun-A Park", "url": "https://doi.org/10.3390/electronics15215154", "category": "期刊论文（Electronics，MDPI，2026）", "cats": [], "oneliner": "把 RAG 的 chunk、embedding、检索输出与生成结果都列为受保护对象，用“会话认证 → 角色/权限核验 → 事件组 membership 认证”三层协议管住企业文档系统里的 AI 访问。", "insight": "这篇最值得借的一句话是它的前提：**受保护对象不止文档，还包括 chunk、embedding、检索输出与生成结果**。这与我们的立场完全一致——AU 的保护范围必须覆盖检索管线里的全部中间产物，而不只是源文档；related work 里引用这句话，可以说明“把 embedding 与检索输出列为受保护对象”已是企业文档场景的共识性前提，而非我们的特殊设定。第二，它提供了一个有价值的对照：它解决的是“访问路径”的安全（谁能加入一次群组会话、密钥如何轮换），我们解决的是“检索判定”的安全（某次查询能对哪些 AU 求值）；两者互补而非竞争——它的三层认证可以放在我们的框架外面作入口控制，我们的逐 AU 求值放在里面作查询时判定，讨论节可以用一句话点明这种分层关系。第三，它的“事件专属组密钥只作认证材料、不用于重加密”是一个可借鉴的工程取舍：认证材料与加密材料分离，避免了组 membership 变化时全量重加密的代价；我们的 per-view 索引在 AU 变化时同样面临重编码代价，这个思路提示了一种“轻量认证、重量隔离”的折中方向。诚实标注：MDPI Electronics，单作者，方法论分量有限；安全性论证是给定假设下的计算不可区分性，没有对抗评估；原型评估只报了常数时间在线开销，未见与现有方案的横向对比，引用时只引用其问题建模与前提表述，不引用其安全性结论作证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业文档管理系统越来越多地集成语义检索、RAG、多模态交互与数据分析，受保护的对象也随之超出原始文档本身，扩展到 chunk、embedding、检索输出、生成回答与分析结果。传统的登录式或静态角色访问控制已不够用。本文提出一种三层认证协议，依次执行会话认证、角色/权限核验与基于事件的组成员认证；与传统组密钥方案不同，事件专属组密钥只作认证材料、不用于文档重加密；结合前向与反向哈希链，协议在动态群组环境下支持组密钥保密性、前向保密性与后向保密性。安全性分析表明，在给定假设下，受保护的认证值与同长度随机比特串计算上不可区分；效率分析与原型评估显示在线认证为常数时间开销。", "supplement": false}]}], "total": 40, "n_days": 7, "all_total": 228, "all_days": 46};
