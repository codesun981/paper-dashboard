ch"}, {"id": "2117887087815139440", "text": "Introducing Hy4", "created_at": "11-04 15:50", "likes": 1054, "reposts": 77, "replies": 29, "views": 41407, "url": "https://x.com/TencentHunyuan/status/2117887087815139440", "author": "TencentHunyuan"}, {"id": "2117881921061757221", "text": "Guess folks still love high-performing open-weight models 👀 We are taking a cautious approach to release the weights.\n\nGive it a spin and let us know what you think!", "created_at": "11-04 15:29", "likes": 168, "reposts": 6, "replies": 7, "views": 8205, "url": "https://x.com/YonglongT/status/2117881921061757221", "author": "YonglongT"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": [{"id": "2117256196227019194", "text": "Your Harness. You Define It.\n\nMeet Creator Mode in DeepSeek Harness. \n\nTurn ideas into plugins that you can use, from a design workspace to a sandbox game or a 3D LLM visualizer. \n\nWhat will you create?", "created_at": "11-02 22:03", "likes": 25009, "reposts": 2088, "replies": 719, "views": 2392382, "url": "https://x.com/DeepSeekHarness/status/2117256196227019194", "author": "DeepSeekHarness"}]}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2118025552963493935", "text": "Day 0 support: Kimi K3.1 Pro on AMD Instinct MI355X\n\n2.8T params, 1M context, open weights. Runs on 8x MI355X with ATOM and vLLM.\n\nRecipes, kernels and benchmarks: https://www.amd.com/en/developer/resources/technical-articles/2026/kimi-k3-1-pro-on-amd-instinct-gpus.html?utm_campaign=thallosocial&utm_source=twitter&utm_medium=organic_social&utm_content=kimi+day+0", "created_at": "11-05 01:00", "likes": 70, "reposts": 7, "replies": 6, "views": 11015, "url": "https://x.com/AIatAMD/status/2118025552963493935", "author": "AIatAMD"}, {"id": "2118023422248669547", "text": "Kimi K3.1 Pro lands on Nebius Token Factory from day 0.\n\nMoonshot’s latest open-weight model delivers coding performance close to Opus 5.5 on Terminal-Bench 4.0.\n\nBuild the app you’ve been imagining. Turn financial reports into a working model. Bring an interactive 3D world to life.\n\nBuild with Kimi K3.1 Pro → https://tokenfactory.nebius.com/?modals=endpoint-details&model-id=moonshotai/Kimi-K3.1-Pro", "created_at": "11-05 00:51", "likes": 180, "reposts": 12, "replies": 13, "views": 25333, "url": "https://x.com/nebiustf/status/2118023422248669547", "author": "nebiustf"}, {"id": "2118020769141678260", "text": "Today we're introducing Verda Inference, in preview, with day-0 access to Kimi K3.1 Pro, in partnership with @Kimi_Moonshot 🧵\n\nFrontier open-weight models through one API, engineered for every request, from a single prompt to long-horizon agents.\n\nhttps://verda.com/blog/verda-inference-in-preview?utm_source=x&utm_medium=social&utm_campaign=inference&utm_content=preview_announcement", "created_at": "11-05 00:41", "likes": 19, "reposts": 7, "replies": 2, "views": 1247, "url": "https://x.com/verdacloud/status/2118020769141678260", "author": "verdacloud"}, {"id": "2118010528123773297", "text": "Releasing the model weights of Kimi K3.1 Pro: https://huggingface.co/moonshotai/Kimi-K3.1-Pro\nWe'll keep advancing open intelligence.", "created_at": "11-05 00:00", "likes": 5605, "reposts": 586, "replies": 270, "views": 299211, "url": "https://x.com/Kimi_Moonshot/status/2118010528123773297", "author": "Kimi_Moonshot"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875758904795344896/U3CqYUFY_400x400.jpg", "tweets": [{"id": "1875761216062439461", "text": "购买 $ZHIPU —— 采用全自研的GLM模型架构，基于数十万亿中英文双语数据训练而成。ZHIPU 综合能力接近 GPT-4-Turbo，推理速度高达 80 token/s，阅读速度是人类极限（300词/分钟）的 25 倍，开创了AI性能的新标杆！\n\nhttps://bigmodel.cn/", "created_at": "01-05 12:28", "likes": 16, "reposts": 5, "replies": 7, "views": 9872, "url": "https://x.com/ZhipuAI/status/1875761216062439461", "author": "ZhipuAI"}]}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2064231947149377536/Ab70PxT5_400x400.jpg", "tweets": [{"id": "2109633089211416820", "text": "QwenGyre addresses two challenges of XLong-horizon agentic RL.", "created_at": "10-15 06:48", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2109633089211416820", "author": "Alibaba_Qwen"}, {"id": "2109633085658808515", "text": "Introducing QwenGyre, bringing elastic RL to extreme-long-horizon (XLong) agent training. ✨ It launches with two core designs: 🥳 - Elastic Scheduler: reallocates GPUs between rollout & training as demand shifts—live executions never interrupted. Up to 1.85× speedup over Colocate, 1.78× over Async. - Trajectory Processor: turns branching executions (compaction, sub-agents, retries) into prefix-shared trajectory trees with bounded, deduplicated training samples. Partial progress after timeout still gets scored. Scaled to Qwen3.8-2.4T-A95B with ~700K tokens per rollout, QwenGyre lifts NL2RepoBench from 52.5% to 58.5% in 48 steps, cutting end-to-end training time by ~44% vs Async. 🔗 Read the paper: arxiv.org/abs/2609.33848", "created_at": "10-15 06:48", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2109633085658808515", "author": "Alibaba_Qwen"}]}, "MiniMax_AI": {"name": "MiniMax", "label": "MiniMax 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_400x400.jpg", "tweets": [{"id": "2116996123164569606", "text": "MiniMax M3.1 Flash, on more of your hardware.\n\nQuantizing a 428B model opens up more ways to run it locally. Lower-bit weights reduce the memory needed to load the model and the weight data moved during decoding. Making those savings useful takes careful calibration, efficient low-bit kernels, and hardware-aware placement of experts across GPU and system RAM.\n\nThank you to the builders doing that work:\n\n• @UnslothAI @danielhanchen — 2-bit Dynamic GGUF weights at 143.9 GB, with calibration and fidelity testing across coding, tool use and other workloads.\n• @ViC305 — SAGE-EXL3, token-level fidelity measurements and a single-DGX-Spark recipe.\n• @PeasantSmith — Project Maya quants and expert offloading for local coding and tool use.\n• @MiaAI_lab — EXL3-EAQ quantization work.\n• @jundotkim + mlx-community — oQ quants and DSpark-powered decoding through oMLX on Apple Silicon.\n• @AIatAMD — Quark MXFP4 adapted for AMD Instinct.\n• @atomic_chat_hq — GGUFs for local desktop workflows.\n• @superalesha — custom inference work combining quantized weights, expert caching and system RAM on 4× RTX 3090.\nEvery shared quant, kernel, measurement and recipe gives the next builder a better starting point. Thank you.", "created_at": "11-02 04:49", "likes": 738, "reposts": 53, "replies": 87, "views": 54584, "url": "https://x.com/MiniMax_AI/status/2116996123164569606", "author": "MiniMax_AI"}, {"id": "2115594466581254539", "text": "⏳ 72 hours left for AI City Remix.\n\nMiniature skylines. Pixel streets. Your city, your way.\n\nBuild with @MiniMax_AI M3.1 Flash on SandBase.\n\nFree credits daily. A $3,000 grand prize in platform credits.\n\nPut your city on our radar. 👇", "created_at": "10-29 08:00", "likes": 241, "reposts": 36, "replies": 2, "views": 15061, "url": "https://x.com/SandbaseAI/status/2115594466581254539", "author": "SandbaseAI"}]}, "XiaomiMiMo": {"name": "Xiaomi MiMo", "label": "小米 MiMo 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1999123454247972865/8PkB-sNt_400x400.jpg", "tweets": [{"id": "2110944071875485925", "text": "MiMo V2.6 Pro ranks #1 on the Agent Arena open-model leaderboard, while both Pro and Flash land on the performance-cost Pareto frontier. 🚀", "created_at": "10-16 12:01", "likes": 267, "reposts": 16, "replies": 1 const FIN = {"date": "2026-11-05", "md": "# ☀️财经大事早报 · 2026-11-05\n\n## 📌今日大势\n\n**1. 美国中期选举尘埃落定，民主党夺回两院，美股创 8 月以来最佳单日表现。** 11 月 3 日投票、11 月 4 日开票结果确认民主党夺回参众两院，政治不确定性消退成为市场反弹的第一推力。FT 称美股创下 8 月以来最佳单日表现；据钜亨网转述的盘中数据，道指盘中涨超 1177 点，标普 500 涨约 1.13%、纳指涨约 1.15%，10 年期美债收益率回落至约 4.91%–4.92%，美元指数跌至约 101.35。市场逻辑并不复杂：分立政府被解读为“重大政策转向受限”，加上选举前集中建立的对冲头寸在结果明朗后解除，风险溢价压缩。但这波反弹的成色需要打折——开票夜纳指期货一度跌超 2%，说明市场先是对“民主党议会 + 更严 AI 监管”做了定价，之后才被“不确定性消退”盖过去。**后续盯什么**：新国会明年 1 月就职前，债务上限问题（德银分析提示明年二季度可能成为政策风险点）与州一级的数据中心监管动向，哪个先兑现。（来源：FT、钜亨网）\n\n**2. 油价跌破 100 美元，和平预期与柴油短缺同时出现，能源线出现罕见的分裂信号。** FT 报道油价在选后和平希望推动下跌破 100 美元，WTI 盘中跌约 3%。但同一天的另一条 FT 消息是反向的：特朗普与俄罗斯的柴油交易遇阻，而美国燃油供应已降至 20 年低点。也就是说，原油价格在跌，成品油（柴油）的供应却在紧——价格信号与实物信号打架。副总统万斯把共和党中期选举惨败归咎于伊朗战争，伊朗首席谈判代表则称“美国人投票反对战争”，政治叙事与能源价格正在互相印证“战争溢价消退”。**后续盯什么**：柴油库存与裂解价差是否继续恶化（那会先于原油价格传导到通胀与运输成本），以及中东停火谈判是否有可验证的进展，而非仅停留在选举语言层面。（来源：FT、BBC）\n\n**3. AI 板块内部大分化：超大规模云厂商涨、芯片与数据中心跌，选民给数据中心热潮“降了温”。** FT 的标题说得很直白：超大规模厂商（hyperscalers）上涨、芯片厂商下跌，投资者在押注“AI 热潮中的赢家与输家”；亚马逊盘中涨 6.3%，Meta 与 Alphabet 同样收涨，而费城半导体指数盘中跌近 1.4%。另一篇 FT 评论的标题是“选民给美国数据中心热潮泼了一盆有益的冷水”：高盛分析估计，民主党在州与地方层面的胜利可能带来短期数据中心建设暂停，影响约 45% 的美国计划新增产能；得州新当选州长表态在更全面的监管框架出台前不解除建设许可冻结。**为什么重要**：AI 基建的瓶颈正在从“钱和芯片”转向“选址许可与地方政治”，这对 AI 资本开支的节奏、电力与土地成本、以及芯片订单的兑现速度都有直接传导。**后续盯什么**：得州、佐治亚等关键数据中心州的许可冻结是否落地为正式政策，以及下一批芯片厂商财报里的数据中心订单变化。（来源：FT、钜亨网/TradingView 转述高盛分析）\n\n## 💰宏观与政策\n\n- [美国中期选举后，民主党内部讨论“对特朗普的斗争打到什么程度”](https://www.ft.com/content/1b492f63-85b4-472c-9bbd-f741a1dfdb0b?syn-25a6b1a6=1)（来源：FT Home）——夺回两院只是开始，民主党内部对斗争烈度的分歧将决定未来两年立法议程的实际形状，分立政府不等于政策真空，调查权与预算权是更现实的战场。\n- [共和党在惨败后互相指责，特朗普阵营与党内建制派的裂痕公开化](https://www.ft.com/content/83a46027-3cde-41fa-8c55-405f40c6fa82?syn-25a6b1a6=1)（来源：FT Home）——FT 连发多篇分析指出共和党内部已出现互相追责，年轻共和党人对结果的反思尤为尖锐，这对 2028 年党内路线之争是前置信号。\n- [默多克媒体帝国对特朗普降温](https://www.ft.com/content/ead0309f-537a-4cc1-9d65-a3b9de01e69d7?syn-25a6b1a6=1)（来源：FT Home）——特朗普本人在 Truth Social 上称福克斯收视率下滑 27% 并抨击其请白思豪上节目，媒体盟友关系的变化值得作为“政治风向”的辅助指标看，但收视率数字为特朗普单方说法，引用时须标注来源。\n- [中期选举已让马斯克身家缩水近 300 亿美元](https://www.ft.com/content/9a8d4922-74dd-4149-bb28-a15f719ca836)（来源：FT Home）——FT 测算的账面损失主要来自特斯拉与 SpaceX 相关资产在选后监管预期变化下的重估，属市场波动而非现金损失，读数时不要与“马斯克亏了 300 亿现金”混淆。\n- [美国 10 月 ADP 新增就业 8.6 万人，高于预期的 6.7 万人](https://news.cnyes.com/news/id/6646809)（来源：钜亨网，搜索补漏）——就业数据好于预期，与“政治不确定性消退”共同支撑了风险资产反弹，但 ADP 与官方非农口径不同，单月数据不宜过度解读为趋势反转。\n\n## 📈市场与投资\n\n- [美股创 8 月以来最佳单日表现，民主党横扫中期选举](https://www.ft.com/content/a0b18705-3bd8-4886-992c-b6062fdec6ea?syn-25a6b1a6=1)（来源：FT Home）——道指、标普与纳指齐涨，股债齐扬、美元走弱，属典型的“不确定性消退”交易，持续性取决于后续政策兑现而非选举日本身。\n- [“蓝色浪潮”把市场带回常态](https://www.ft.com/content/fc404189-8dde-4dfe-8da7-0df8e92effd2?syn-25a6b1a6=1)（来源：FT Markets）——FT Markets 的判断是市场正在从“选举押注”回到“基本面定价”，但 AI 监管分化说明“常态”里仍嵌着结构性分歧。\n- [中国出手护盘股市，意在重振 AI 热潮](https://www.ft.com/content/b86cc3e7-e638-4b58-8d4d-4516c13c45f5?syn-25a6b1a6=1)（来源：FT Markets）——FT 称中国方面加强了对股市的维护，目标直指 AI 板块信心的修复；结合近期 AI 模型密集发布看，政策护盘与产业新闻正在同一方向发力，但护盘力度与持续性未在报道中量化。\n- [Solvay 达成稀土交易，有望降低全球对中国的依赖](https://www.ft.com/content/7479802b-7071-4ab7-a7a0-bbebc20010e3?syn-25a6b1a6=1)（来源：FT Markets）——稀土是 AI 算力与新能源供应链的上游卡点之一，这类“去依赖”交易即使规模不大，也值得作为供应链重构的风向标跟踪，后续看交付量与价格条款是否披露。\n- [Anthropic 是重新思考 IPO 规则的契机](https://www.ft.com/content/5083bad9-2a6e-4dc8-9627-1d41f9aa5b5b)（来源：FT Markets）——FT 的评论文章借 Anthropic 讨论 IPO 规则改革，属观点而非 Anthropic 上市消息本身，不要误读为“Anthropic 已提交上市申请”。\n- [特朗普媒体科技集团（DJT）早盘跌 7.90%，至每股 5.48 美元](https://news.cnyes.com/news/id/6646809)（来源：钜亨网，搜索补漏）——与大盘上涨反向，说明“特朗普概念股”与“特朗普政策预期”正在脱钩，选举结果对关联资产是利空而非利好。\n\n## 🏠房价洞察\n\n- [9 月 70 城房价：一线二手连涨七个月，上海涨 0.5% 领跑全国](https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html)（来源：证券日报，搜索补漏，转述国家统计局 10 月 19 日发布数据）——9 月一线新建商品住宅环比涨 0.1%，连续两个月上涨；一线二手环比涨 0.2%，涨幅比上月扩大 0.1 个百分点，**自 3 月以来连续七个月上涨**，北京、广州、深圳分别涨 0.1%、0.1%、0.2%，上海以 0.5% 领跑 70 城；70 城中二手环比上涨城市从上月的 3 个增至 9 个，新建环比上涨城市 17 个、比上月增加 2 个；二线新建环比由降转平，三线新建环比降 0.2%、降幅持平。\n- [10 月百城价格指数：新建均价 17316 元/平方米，环比涨 0.18%、同比涨 2.02%；二手均价 12376 元/平方米，环比跌 0.61%、同比跌 6.72%](https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html)（来源：中指研究院，搜索补漏）——新房与二手继续背离：新房价格指数在核心城市优质项目带动下微涨，二手价格仍在探底；50 城住宅平均租金 33.87 元/平方米/月，环比跌 0.28%、同比跌 2.02%，租售关系尚未修复。\n- [“金九银十”收官：重点 20 城二手 10 月成交量同比涨 20%，增速较 9 月明显抬升](https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html)（来源：证券日报，搜索补漏）——中指数据显示 9 月百城新房销售面积同比降约 7%，但一线城市逆势增长约 10%，北京、上海同比分别增约两成和 22%；20 城二手 9 月成交 11.9 万套、环比增 5.6%、同比增 7.4%，10 月同比增速进一步抬升至 20%，成交韧性主要来自二手而非新房。\n- [购房贷款贴息政策满月：9 月 29 日出台、10 月 1 日实施，已有购房者可在银行系统查询到具体贴息金额](https://www.cenr.com.cn/cyjj/fc/2026/11/02/236064.html)（来源：证券日报，搜索补漏）——贴息为贷款本金年化 1 个百分点的财政补贴，三四线城市覆盖率可达 44% 以上；10 月 20 日国家发展改革委发布会进一步提出“及时推出务实管用的增量政策”，并点名降低抵押补充贷款利率、增加再贷款额度、居民购房贷款贴息等增量政策要尽快落地见效。\n- [商品住房销售制度改革进入细则密集落地期，公积金政策同步松动](https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html)（来源：中指研究院，搜索补漏）——武汉、天津、杭州、深圳、宁波、十堰、温州、苏州、合肥、成都、长沙、西安、南京等城市陆续出台实施意见，北京、上海、广州等地国庆前已落地现房销售；深圳、天津、杭州、东莞新增装修、物业费提取，杭州将多孩家庭贷款额度上浮比例由 50% 提高至 60%、上限提高至 324 万元；上海印发《城市更新三年行动计划（2026–2028 年）》，明确 70 万平方米旧住房成套改造、约 2400 万平方米老旧小区改造。\n\n**🔍深度分析**：本轮楼市的关键词是**分化，而且是三层分化**。第一层是城市分化：一线二手已连涨七个月、上海单月 0.5% 领跑，而二三线新房仍在持平或下跌，全国性“回暖”叙事不成立。第二层是新房与二手分化：百城新房均价环比微涨、二手均价环比跌 0.61%，说明价格指数的上涨更多来自核心城市优质新盘的结构效应，而非全市场普涨；成交的韧性同样来自二手（20 城 10 月同比 +20%），新房销售面积仍同比下滑。第三层是政策分化：中央层面同时在推两件性质不同的事——一是**制度重塑**（商品房销售制度改革、现房销售细则），二是**需求托底**（购房贴息、公积金提取扩围、多孩额度上浮），前者改的是交易规则与交付风险，后者降的是刚需的上车门槛；两者叠加不等于“刺激投机”，9 月 20 日修订后的住房公积金管理条例生效、贴息覆盖三四线超 44% 的设计，都指向刚需而非投资客。**对购房者的实操含义**：一线核心区的好房子仍有抢手逻辑，但要把“价格指数涨”与“自己看的盘涨”分开核对；三四线城市先问清贴息覆盖的房源范围与银行落地进度——政策已出台不等于每套房、每家银行都已能办；年底房企推盘促销与核心城市优质项目入市会对新房成交形成支撑，但中指的判断仍是“整体延续筑底态势”，不宜把单月成交同比高增长读成趋势反转。**后续盯什么**：10 月 70 城数据（约 11 月中旬发布）能否延续“二手上涨城市个数增加”的势头；贴息在各家银行的系统落地是否从“可查询”走向“足额到账”；以及现房销售细则在更多城市落地后，期房交付风险溢价是否真正收窄。\n\n## 🤖AI经济\n\n- [选民给美国数据中心热潮泼了一盆有益的冷水](https://www.ft.com/content/b7d0761f-e5fb-4746-924f-b15420a57844?syn-25a6b1a6=1)（来源：FT Home）——地方选举结果可能转化为建设许可冻结，高盛分析估计影响约 45% 的美国计划新增产能；AI 基建的资本开支节奏，未来要先看地方许可、再看芯片订单。\n- [中国出手护盘股市，意在重振 AI 热潮](https://www.ft.com/content/b86cc3e7-e638-4b58-8d4d-4516c13c45f5?syn-25a6b1a6=1)（来源：FT Markets）——政策护盘与 AI 产业新闻同向，但报道未量化护盘规模，效果有待股价与成交量验证。\n- [超大规模厂商涨、芯片厂商跌，AI 热潮内部的赢家与输家正在分化](https://www.ft.com/content/a0b18705-3bd8-4886-992c-b6062fdec6ea?syn-25a6b1a6=1)（来源：FT Home）——亚马逊盘中涨 6.3% 的同时费城半导体指数盘中跌近 1.4%，说明市场开始区分“AI 应用变现”与“AI 硬件供给”，而非整体押注 AI。\n- [Anthropic 是重新思考 IPO 规则的契机](https://www.ft.com/content/5083bad9-2a6e-4dc8-9627-1d41f9aa5b5b)（来源：FT Markets）——头部 AI 公司的一级市场估值与公开市场规则之间的张力正在成为政策议题，属观点讨论，不代表 Anthropic 有上市时间表。\n\n## 🏢公司与产业\n\n- [Solvay 达成稀土交易，有望降低全球对中国的依赖](https://www.ft.com/content/7479802b-7071-4ab7-a7a0-bbebc20010e3?syn-25a6b1a6=1)（来源：FT Markets）——稀土供应链重构的又一落点，关键看后续交付量与长期协议价格是否公开。\n- [特朗普与俄罗斯的柴油交易遇阻，美国燃油供应降至 20 年低点](https://www.ft.com/content/f66ebf48-6d09-4a91-9af5-8bf7adca65ba?syn-25a6b1a6=1)（来源：FT Markets）——能源外交承诺与国内实物供应脱节，柴油短缺若持续，将先于原油价格影响物流与通胀读数。\n- [中期选举已让马斯克身家缩水近 300 亿美元](https://www.ft.com/content/9a8d4922-74dd-4149-bb28-a15f719ca836)（来源：FT Home）——特斯拉与 SpaceX 相关资产在选后监管预期下的重估，属账面波动；同日钜亨网亦记录特斯拉股价下跌，显示市场对 AI 基建监管的担忧同样作用于马斯克系资产。\n- [亚马逊盘中涨 6.3%，Meta 与 Alphabet 同样收涨](https://news.cnyes.com/news/id/6646809)（来源：钜亨网，搜索补漏）——超大规模厂商成为选后反弹的领涨力量，与芯片与数据中心股的承压形成对照，板块轮动而非全面牛市。\n\n## 🌍全球大事\n\n- [乌克兰称随身摄像机视频显示俄军“二次打击”式轰炸致人死亡](https://www.bbc.co.uk/news/articles/c98rz6penv86o?at_medium=RSS&at_campaign=rss)（来源：BBC World）——乌克兰方面公布的视频证据指向针对救援人员的二次打击，若属实将是战争法层面的严重指控，BBC 报道本身为乌方说法，俄方回应有待后续核对。\n- [以色列总统在选举僵局后开始与各党磋商组阁](https://www.bbc.co.uk/news/articles/c6z98z5z91ppo?at_medium=RSS&at_campaign=rss)（来源：BBC World）——以色列议会选举后无政党单独过半，总统磋商是组阁程序的起点，后续看反对党联盟能否拼出多数，而非仅看总统接见顺序。\n- [伊朗首席谈判代表称“美国人投票反对战争”](https://www.bbc.co.uk/news/articles/c6d934npl9y8o?at_medium=RSS&at_campaign=rss)（来源：BBC World）——伊朗方面把美国中期选举结果解读为反战民意，并以此作为谈判叙事；这是伊朗单方表态，不等于美伊谈判有实质进展，油价下跌中的“和平溢价消退”与此叙事同向但证据链不同。\n- [美国中期选举结果让加拿大人看到关税减压希望](https://www.bbc.co.uk/news/articles/cqev3mw3e0kdo?at_medium=RSS&at_campaign=rss)（来源：BBC World）——加拿大方面将民主党夺回国会解读为关税压力可能缓解的信号，但关税政策属行政权范畴，国会易手不直接等于关税取消，属“希望”而非政策变化。\n- [德里空气质量在排灯节前恶化，烟花限制措施已生效](https://www.bbc.co.uk/news/articles/c699z8792n7ro?at_medium=RSS&at_campaign=rss)（来源：BBC World）——排灯节前夕的空气污染是印度每年重复出现的公共卫生议题，烟花限制的效果要看节日期间的实测浓度，而非政策文本。\n- 另据 BBC 11 月 4 日世界版：法国血库受冷柜黑客攻击事件的责任猜测仍在发酵、匈牙利公开了共产主义倒台 37 年后的秘密警察档案、南非执政党非国大面临扭转颓势的压力——三条均为区域性重要动态，但对全球市场的直接传导有限，简报中仅作记录、不展开。\n\n## 📅今日前瞻\n\n- **美国**：新国会明年 1 月就职前的债务上限谈判动向、州一级数据中心许可冻结是否落地为正式政策、以及芯片厂商下一批财报里的数据中心订单变化——三者共同决定选后反弹是“不确定性消退”还是“趋势反转”。\n- **中国**：10 月 70 城房价数据（约 11 月中旬发布）能否延续二手上涨城市个数增加的势头；购房贴息在各家银行从“可查询”走向“足额到账”的进度；商品房销售制度改革细则在更多城市的落地节奏。\n- **中东与欧洲**：以色列总统指定组阁人选的日程与反对党联盟谈判走向；美伊之间“反战叙事”是否有谈判层面的实质跟进，还是仅停留在选举语言；乌克兰前线视频证据的独立核查与各方回应。\n- **市场**：10 年期美债收益率能否守住约 4.9% 一线、美元指数在 101.35 附近的走向、以及油价跌破 100 美元后柴油裂解价差是否继续走阔——后者是比原油价格更灵敏的通胀前置指标。\n\n## 📎来源清单\n\n- RSS 抓取：FT Home 14 条、FT Markets 23 条、经济学人金融经济 3 条（finance 分区合计 40 条）、BBC World 23 条（world 分区）；本期实际引用以 11 月 4 日中期选举相关条目为主，近 3 天窗口内无更早的同等权重财经条目可替代。\n- 搜索补漏（3 轮）：财经轮——钜亨网中期选举后美股盘中数据、ADP 就业、DJT 与亚马逊个股表现；国际轮——BBC 世界版条目交叉核对；中国房地产轮——中指研究院 10 月百城价格指数、证券日报“金九银十”收官与贴息满月观察（均转述国家统计局 10 月 19 日发布的 9 月 70 城数据）。\n- 未使用来源说明：WSJ 的 feeds.a.dj.com 系列内容冻结在 2025-01、财新 RSS 被 403 拦截、路透新旧 feed 均失效，本期均未使用；个别搜索结果来自低权威转载站（如转载 70 城数据的镜像站）时，本期只引用中指研究院与证券日报的原始口径，未直接链接转载站。\n"};
