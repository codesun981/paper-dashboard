"reposts": 5, "replies": 3, "views": 11260, "url": "https://x.com/warpdotdev/status/2120278308227322181", "author": "warpdotdev"}, {"id": "2120266886004789509", "text": "DevDay México City let’s gooooo 🇲🇽", "created_at": "11-11 05:26", "likes": 39, "reposts": 4, "replies": 1, "views": 8247, "url": "https://x.com/juandadotdev/status/2120266886004789509", "author": "juandadotdev"}, {"id": "2120266880963473789", "text": "Labs innovating together ftw", "created_at": "11-11 05:26", "likes": 5310, "reposts": 146, "replies": 472, "views": 953703, "url": "https://x.com/thsottiaux/status/2120266880963473789", "author": "thsottiaux"}, {"id": "2120262284614468088", "text": "Full house at @OpenAIDevs DevDay Mexico 🇲🇽\n\nCome say hi !!!!!\n\nESTA BIEN CHIDO WEY", "created_at": "11-11 05:08", "likes": 78, "reposts": 6, "replies": 5, "views": 14056, "url": "https://x.com/fedesarquis/status/2120262284614468088", "author": "fedesarquis"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2120841731302154708", "text": "Our initial public offering: https://ipo.anthropic.com\n\nLegal disclaimer: Anthropic has filed a registration statement (including a prospectus) with the SEC for the offering to which this communication relates. Before you invest, you should read the prospectus in that registration statement (available at: https://www.sec.gov/Archives/edgar/data/2130357/000162828026072484/anthropicpbc-sx1ax2.htm) and other documents Anthropic has filed with the SEC for more complete information about Anthropic and this offering. You may get these documents for free by visiting EDGAR on the SEC Web site at http://www.sec.gov. Alternatively, copies of the preliminary prospectus may be obtained from: Goldman Sachs & Co. LLC, Attention: Prospectus Department, 200 West Street, New York, NY 10282, by telephone at (866) 471-2526, or by email at prospectus-ny@ny.email.gs.com; or Morgan Stanley & Co. LLC, Attention: Prospectus Department, 180 Varick Street, 2nd Floor, New York, NY 10014.\n\nThe securities may not be sold, nor may offers to buy be accepted, prior to the time the registration statement becomes effective. This post is not an offer to sell, or a solicitation of an offer to buy, the securities in any jurisdiction where the offer or sale is not permitted.", "created_at": "11-12 19:30", "likes": 5403, "reposts": 572, "replies": 471, "views": 491749, "url": "https://x.com/AnthropicAI/status/2120841731302154708", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2120841927834968215", "text": "Watch → https://goo.gle/3Vgj7LX\nSpotify → https://goo.gle/4zRA8Lt\nApple Podcasts → https://goo.gle/4BZEaTx\n\nOr listen wherever you get your podcasts! 🎧", "created_at": "11-12 19:31", "likes": 19, "reposts": 1, "replies": 6, "views": 17295, "url": "https://x.com/GoogleDeepMind/status/2120841927834968215", "author": "GoogleDeepMind"}, {"id": "2120841923237683462", "text": "Finding the exact genetic cause of a rare disease is like looking for a needle in a haystack. 🪡\n\nOn our podcast, @fryrsquared explores with @Avsecz and  @adamgayoso how AlphaGenome 2 helps scientists test millions of DNA changes to find vital clues for human health.\n\nTimecodes:\n00:00 Introduction to AlphaGenome\n04:01 Genotype, Phenotype & DNA\n08:30 Transformers to AlphaGenome\n12:11 Mapping the Genome\n17:45 Rare disease cases\n21:10 AlphaGenome 2\n30:06 Future vision\n38:45 Hannah's thoughts", "created_at": "11-12 19:31", "likes": 336, "reposts": 40, "replies": 73, "views": 29578, "url": "https://x.com/GoogleDeepMind/status/2120841923237683462", "author": "GoogleDeepMind"}, {"id": "2120814064863461440", "text": "Our Gemini team @GoogleDeepMind is making tremendous progress.\n\nGemini 4 Carbon’s coding and scientific reasoning capabilities are a step change and have accelerated our own science workflows. \n\nCarbon has already helped our team:\n- Debug complex experimental flows. In one complex case, it traced anomalous assay results back to a faulty liquid handler and reagent carryover between high-throughput experimental runs.\n- Develop strategies to mine massive datasets, making models like AlphaFold 3 even more effective.\n- Compress computational workflows like cheminformatics tasks from weeks down to hours.\n\nI am happy to share that Gemini 4 Carbon is now generally available. Together with our updated Antigravity Science plugin, Carbon can greatly assist the work of scientists.\n\nI am really looking forward to seeing  scientists across the world use it for their work.", "created_at": "11-12 17:40", "likes": 830, "reposts": 41, "replies": 54, "views": 41960, "url": "https://x.com/pushmeet/status/2120814064863461440", "author": "pushmeet"}, {"id": "2120532832145576242", "text": "By predicting how the same DNA is read differently from cell to cell, AlphaGenome 2 opens up entirely new possibilities for understanding human genetics.\n\nIt’s available now for non-commercial research via our API and interactive Colab tutorials. Find out more → https://goo.gle/4zikg3w", "created_at": "11-11 23:03", "likes": 155, "reposts": 11, "replies": 11, "views": 18042, "url": "https://x.com/GoogleDeepMind/status/2120532832145576242", "author": "GoogleDeepMind"}, {"id": "2120532829805096970", "text": "The model also adapts to lab experiments on the fly with no retraining needed.\n\nResearchers can plug in data from just a few dozen cells to see how DNA changes behave in specific moments, like:\n🔘 Immune cells responding to a vaccine\n🔘 Specific cells in the gut driving inflammatory disease\n🔘 Stem cells maturing into blood cells", "created_at": "11-11 23:03", "likes": 141, "reposts": 7, "replies": 7, "views": 20713, "url": "https://x.com/GoogleDeepMind/status/2120532829805096970", "author": "GoogleDeepMind"}, {"id": "2120532824465805749", "text": "Your heart, brain, and immune system share the same DNA sequence. So how can a single-letter change affect disease in some cells, while sparing the rest?\n\nAlphaGenome 2 is our new AI model that zooms in on specific cells to help scientists understand what drives disease. 🧵", "created_at": "11-11 23:03", "likes": 2248, "reposts": 329, "replies": 197, "views": 325623, "url": "https://x.com/GoogleDeepMind/status/2120532824465805749", "author": "GoogleDeepMind"}, {"id": "2120484249321033911", "text": "Gemini agents generated over 6M lines of proofs in Lean, auditing the code so human experts only had to review the critical 1%.\n\nThis is a key step toward using AI to verify vital infrastructure we all rely on – from daily communication to power grids. Find out more → https://goo.gle/4BLrkbk", "created_at": "11-11 19:50", "likes": 123, "reposts": 5, "replies": 18, "views": 19202, "url": "https://x.com/GoogleDeepMind/status/2120484249321033911", "author": "GoogleDeepMind"}, {"id": "2120484246401777737", "text": "For the first time, AI has mathematically proven @signalapp’s protocol is secure down to the code level.\n\nUsing our breakthrough AlphaProof Code framework, we verified the messaging app’s cryptographic system – which protects billions of private messages every day.", "created_at": "11-11 19:50", "likes": 1714, "reposts": 189, "replies": 268, "views": 108441, "url": "https://x.com/GoogleDeepMind/status/2120484246401777737", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2120581156882285031", "text": "read more here https://blog.google/innovation-and-ai/technology/developers-tools/gemini-decisions-api", "created_at": "11-12 02:15", "likes": 130, "reposts": 5, "replies": 14, "views": 24971, "url": "https://x.com/sundarpichai/status/2120581156882285031", "author": "sundarpichai"}, {"id": "2120581155078729728", "text": "Today we’re launching the Gemini Decisions API, powered by our new Gemini Decision 1 model in @GoogleAIStudio.\n\nInstead of generating text token by token, it’s built for closed-set choices scoring up to 1,000 questions across text, images, audio, video + PDFs in a single pass. A few details:\n\n- 3 decision types: yes/no, multiple choice (up to 255 options) + rubric scoring\n- $0.10 / 1M input tokens with $0 billed for output tokens (~5x cheaper than Flash-Lite)\n- leads on several benchmark evals with lowest calibration error\n\nGoogle teams are already building with it, below is a look at Stitch Rapid designing a full product flow in seconds (1x speed)", "created_at": "11-12 02:15", "likes": 4257, "reposts": 323, "replies": 274, "views": 344559, "url": "https://x.com/sundarpichai/status/2120581155078729728", "author": "sundarpichai"}, {"id": "2120565316619284734", "text": "Super proud to announce AlphaGenome 2 - our new DNA sequence model! 🧬 It predicts the impact of DNA variants in different specific cell types - unlocking crucial information for understanding complex diseases. Available for academic research via our API: https://www.alphagenomedocs.com/", "created_at": "11-12 01:12", "likes": 2396, "reposts": 288, "replies": 145, "views": 114629, "url": "https://x.com/demishassabis/status/2120565316619284734", "author": "demishassabis"}, {"id": "2120553082430144866", "text": "AlphaGenome 2 is available today for non-commercial research via the AlphaGenome API https://deepmind.google/blog/alphagenome-2-deciphering-how-cells-read-dna-to-better-understand-disease/", "created_at": "11-12 00:23", "likes": 108, "reposts": 1, "replies": 15, "views": 20627, "url": "https://x.com/sundarpichai/status/2120553082430144866", "author": "sundarpichai"}, {"id": "2120553080232329324", "text": "AlphaGenome 2 is helping uncover the cellular drivers of disease, giving scientists a powerful tool to predict how DNA variants impact specific cell types.\n\nEvery cell in our body shares the same DNA blueprint, but different cell types (like heart muscle cells vs. immune cells) read that blueprint differently. This new @GoogleDeepMind model predicts how these specialized cells interpret DNA, turning genetic code into biological insights.\n\nBuilding on AlphaGenome 1 this makes it significantly easier for researchers to link genetic findings to the root causes of disease in the specific cells where they actually unfold.", "created_at": "11-12 00:23", "likes": 1769, "reposts": 156, "replies": 116, "views": 100516, "url": "https://x.com/sundarpichai/status/2120553080232329324", "author": "sundarpichai"}, {"id": "2120548872238064036", "text": "Thinking of all our veterans and their families today. Thank you for your service and sacrifice to our country.\n\nToday’s doodle showcases achievement medals across every branch of service.", "created_at": "11-12 00:07", "likes": 1161, "reposts": 67, "replies": 60, "views": 73559, "url": "https://x.com/sundarpichai/status/2120548872238064036", "author": "sundarpichai"}, {"id": "2120208455965569262", "text": "Rolling out Gemini 4 Carbon to all Perplexity Pro and Max subscribers. You can create persistent Teammates with them or use it for one off agentic sessions in Computer. Carbon is 2.5x cheaper than Fable 5.2 with similar capabilities on agentic research tasks.", "created_at": "11-11 01:34", "likes": 653, "reposts": 37, "replies": 66, "views": 60032, "url": "https://x.com/AravSrinivas/status/2120208455965569262", "author": "AravSrinivas"}, {"id": "2120207065876676695", "text": "read more https://deepmind.google/blog/introducing-alphaproof-code/", "created_at": "11-11 01:28", "likes": 142, "reposts": 16, "replies": 12, "views": 28887, "url": "https://x.com/sundarpichai/status/2120207065876676695", "author": "sundarpichai"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2120478188648472754", "text": "Hy4 on OpenRouter", "created_at": "11-11 19:26", "likes": 80, "reposts": 6, "replies": 6, "views": 5392, "url": "https://x.com/TencentHunyuan/status/2120478188648472754", "author": "TencentHunyuan"}, {"id": "2120447531113144571", "text": "Hy4 API is live on Atlas Cloud", "created_at": "11-11 17:24", "likes": 76, "reposts": 2, "replies": 6, "views": 5078, "url": "https://x.com/TencentHunyuan/status/2120447531113144571", "author": "TencentHunyuan"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": []}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2118784042883502240", "text": "Moonshot just dropped Kimi K3.1 Pro. We used it to speed run online shopping.\n \nOne prompt → monitor found → checkout → order confirmed. \n\n11.5 seconds.\n\nWatch @Kimi_Moonshot K3.1 Pro in action, accelerated by Cerebras.", "created_at": "11-07 03:14", "likes": 870, "reposts": 67, "replies": 64, "views": 107295, "url": "https://x.com/cerebras/status/2118784042883502240", "author": "cerebras"}, {"id": "2118025552963493935", "text": "Day 0 support: Kimi K3.1 Pro on AMD Instinct MI355X\n\n2.8T params, 1M context, open weights. Runs on 8x MI355X with ATOM and vLLM.\n\nRecipes, kernels and benchmarks: https://www.amd.com/en/developer/resources/technical-articles/2026/kimi-k3-1-pro-on-amd-instinct-gpus.html?utm_campaign=thallosocial&utm_source=twitter&utm_medium=organic_social&utm_content=kimi+day+0", "created_at": "11-05 01:00", "likes": 83, "reposts": 8, "replies": 10, "views": 16705, "url": "https://x.com/AIatAMD/status/2118025552963493935", "author": "AIatAMD"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875758904795344896/U3CqYUFY_400x400.jpg", "tweets": [{"id": "1875761216062439461", "text": "购买 $ZHIPU —— 采用全自研的GLM模型架构，基于数十万亿中英文双语数据训练而成。ZHIPU 综合能力接近 GPT-4-Turbo，推理速度高达 80 token/s，阅读速度是人类极限（300词/分钟）的 25 倍，开创了AI性能的新标杆！\n\nhttps://bigmodel.cn/", "created_at": "01-05 12:28", "likes": 17, "reposts": 5, "replies": 7, "views": 10035, "url": "https://x.com/ZhipuAI/status/1875761216062439461", "author": "ZhipuAI"}]}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2064231947149377536/Ab70PxT5_400x400.jpg", "tweets": []}, "MiniMax_AI": {"name": "MiniMax", "label": "MiniMax 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_400x400.jpg", "tweets": [{"id": "2120593294933819491", "text": "Start with a sketch. One product, every scene. Exactly as you prompt it.\n\nStudio shot to lifestyle campaign, consistent in every frame. That's MiniMax H3 Image for e-commerce and ad creative at scale.\n\nThanks @eachlabs for showing it so beautifully ♥️ #H3Image", "created_at": "11-12 03:03", "likes": 34, "reposts": 7, "replies": 9, "views": 3346, "url": "https://x.com/MiniMax_AI/status/2120593294933819491", "author": "MiniMax_AI"}, {"id": "2120540933741834273", "text": "Modern subjects in traditional artistic languages.  \n\nPrompt: Translate exterior maintenance on a modern space station into a Tang-dynasty Dunhuang-style earthen-wall mural in rich mineral pigments. The image is a flat wall painting, not a space movie. At the center, a technician resembling a flying apsara reaches sideways toward a solar-panel pivot, wearing a simplified modern safety vest over wide sleeves, with long ribbons forming two flowing arcs behind them. A companion at the lower left passes a tool to the main figure, while another at the upper right steadies a folded solar panel. All three direct their hands and eyes toward the same pivot. Clear, fine safety lines connect the figures to the station wall; ribbons and safety tethers each follow distinct paths and must not merge into tangled lines. The station consists of an ocher-white cylinder and a few geometric planes, with solar panels rendered as small azurite-blue squares. Make the modern facilities recognizable without smooth metal or realistic space lighting. Use Tang-mural-style linework for faces and clothing folds, light bodily contours, and overlapping forms instead of precise perspective. Render Earth at the side as a muted malachite-green disc. Keep the background earthen ocher with a few traditional scrolling clouds and star dots. Balance cinnabar red, azurite blue, malachite green, and warm white. Show mineral grains and slight natural wear in the paint layers, with locally exposed wall substrate rather than a uniform crackle filter. Organize movement through ribbons, panel wings, and the cylinder. Make the main figure large and the helpers slightly smaller, leaving open wall areas that breathe like blank paper. No sci-fi armor, blue volumetric light, photographic starfields, subtitles, trademarks, inscriptions, or seals.", "created_at": "11-11 23:35", "likes": 8, "reposts": 0, "replies": 0, "views": 1893, "url": "https://x.com/MiniMax_AI/status/2120540933741834273", "author": "MiniMax_AI"}, {"id": "2120538314876817515", "text": "16 reference images in a single generation.\n\nUseful for asset arrangement, spatial composition, product packaging, and more.", "created_at": "11-11 23:25", "likes": 2, "reposts": 0, "replies": 0, "views": 634, "url": "https://x.com/MiniMax_AI/status/2120538314876817515", "author": "MiniMax_AI"}, {"id": "2120538313383669950", "text": "Turning knowledge into visuals. H3-Image converts complex information into diagrams and posters.\n\nSomething harder? Turn a lengthy case narrative into a single evidence board, with timelines, positions, and testimonies grouped, annotated, and connected all in one frame. \n\nPrompt: Create a detective case reasoning board to solve the following puzzle:\nConfidential documents have been stolen from a safe. Exactly one of six suspects, A, B, C, D, E, and F, acted alone. Each makes one statement:\nA: “The culprit is B or C.”\nB: “D is not the culprit.”\nC: “A's entire statement is false.”\nD: “The culprit is E or F.”\nE: “Exactly one of B's and D's statements is true, and the other is false.”\nF: “A is not the culprit.”\nExactly three of the six statements are true and three are false. “Or” means at least one is true, and all references refer to the statements above.\nFind the unique culprit and create a complete evidence board: show six letter-labeled suspect portraits and their exact statements, mark each statement true or false, and highlight the culprit. Include a concise verification table showing the number of true statements under each of the six possible culprit assumptions. Use connecting lines to show which statements refer to others, ensuring the portrait labels, reasoning, and table are consistent.\nDo not add motives, alibis, accomplices, or extra evidence, and do not treat appearance or expression as clues. Use a cinematic film-noir detective style, with clear, in 16:9 landscape format.", "created_at": "11-11 23:25", "likes": 1, "reposts": 0, "replies": 1, "views": 714, "url": "https://x.com/MiniMax_AI/status/2120538313383669950", "author": "MiniMax_AI"}, {"id": "2120538308925128843", "text": "A little dreamcore for your workday.\nFrom creator. \n\nPrompt: A surrealist photograph with intense poetic sensibility and quiet absurdity, fusing Dreamcore aesthetics, minimalist conceptual photography, vintage film texture, and contemporary fine-art photography.\nIn the middle of a boundless sea of white daisies, a middle-aged man in a light blue shirt and dark trousers sits alone on a modern office chair, diligently working at an old-fashioned CRT desktop computer.\nIn front of him sits a clean, deep blue-gray office desk, holding a heavy vintage computer monitor, a keyboard, and a few sparse office items.\nHis expression is calm and focused, as if entirely unaware of the strangeness of his surroundings. His posture is natural, with no exaggerated performance or forced humor.\nThe desk and chair are placed directly in the center of the flower field, with no surrounding office, road, or man-made structure — only an endless expanse of white daisies stretching to the horizon.\nThe composition is minimal and strongly symmetrical, shot from a distance. The figure and desk sit slightly below center, occupying only a small portion of the frame.\nThe flower field extends from the foreground all the way to the far horizon, where densely packed white daisies form a continuous, finely textured carpet.\nThe horizon line falls roughly one-third from the top of the frame, allowing the sky to occupy a large area of negative space — a soft, clean pale blue, free of complex cloud formations.\nWarm late-afternoon sunlight enters from the side, casting soft golden highlights across the white petals, the man’s face, and the desk. The shadows carry a faint blue-violet hue, producing a warm-cool contrast that feels both tender and romantic.\nThe overall palette centers on sky blue, cream white, daisy yellow, soft grass green, and muted gray-blue — low contrast, slightly faded, soft and luminous.\nEmulates Kodak Portra 400 color negative film: fine film grain, gentle highlight rolloff, natural skin tones, and slightly dreamlike color rendering.\nShot from a slightly distant observational perspective, with authentic natural light, realistic plant textures, and believable object shadows — lending the impossible scene the full credibility of documentary photography.\nThe overall mood is quiet, absurd, romantic, solitary, and tinged with dry humor — like a moment from a dream no one has bothered to explain.\nSurreal everyday photography, dreamcore aesthetic, minimalist absurdism, conceptual fine art photography, lonely office worker in a field of daisies, vintage CRT computer, endless flower meadow, pastel blue sky, warm afternoon sunlight, subtle analog film grain, poetic surrealism, cinematic realism.\nVertical 9:16 composition, no text, no watermarks.", "created_at": "11-11 23:25", "likes": 4, "reposts": 0, "replies": 0, "views": 500, "url": "https://x.com/MiniMax_AI/status/2120538308925128843", "author": "MiniMax_AI"}, {"id": "2120538306395963740", "text": "Some moments should feel a little unplanned.\nFrom creator. \n\nPrompt: A cinematic, dynamic photograph with strong artistic expression, fusing slow-shutter panning photography, vintage sports documentary, and classic 35mm color film aesthetics.\nThe frame captures a real subject in high-speed motion — it could be a running animal, a cyclist, a moving car, a race vehicle, an athlete, or any other object with a clear directional trajectory.\nThe camera tracks the subject dynamically from the side or at a slight angle, using a slow shutter speed combined with a panning technique precisely matched to the direction of motion.\nThe subject's core silhouette remains recognizable to a degree, while body edges, rapidly moving limbs or components, and the surrounding environment take on a natural motion blur.\nMotion blur is the dominant visual language of the image.\nThe background is stretched along the direction of movement into continuous, flowing horizontal bands of color — once-sharp trees, buildings, roads, and environmental details dissolve into abstract gradients of hue and light. The emphasis is on authentic optical motion trails, not a simple digital blur filter.\nThe overall composition retains distinct foreground, midground, and background layers, but allows certain regions to merge and overlap through motion, creating an effect closer to abstract painting.\nThe framing is restrained and cinematic: the subject sits near the center or slightly off-center, surrounded by generous negative space that makes the high-speed motion feel more solitary, elegant, and powerful.\nNatural ambient light is used, preferably the low-angle sun of early morning or late afternoon, so the moving subject is lit by warm side light while the background holds deep, quiet shadows.\nThe color palette is a desaturated but tonally rich vintage film treatment, built around deep forest green, ink green, olive, caramel brown, golden yellow, and warm gray — the specific palette adapting naturally to the scene.\nEmulates authentic 35mm color film texture: fine grain, soft sharpness, slight underexposure, naturally blooming highlights, and deep, muted shadow tones.\nThe image carries the sensibility of 1970s–1990s vintage sports photography and contemporary fine-art photo books — embracing chance, speed, real motion, and imperfect imagery. Rather than chasing the commercial, ultra-sharp frozen moment of an advertisement, it lets speed itself become the true subject of the frame.\nCinematic motion photography, artistic slow shutter panning, intentional motion blur, directional blur, horizontal light streaks, abstract background movement, vintage sports film photography, analog film grain, rich dark tones, warm natural highlights, imperfect focus, dynamic visual storytelling, fine art photography.\nAvoid high-shutter frozen action, over-sharpening, artificial speed lines, exaggerated digital motion blur, cyberpunk neon, HDR, CGI rendering, and commercial sports-advertising polish.\nAuthentic photography, vertical 9:16 composition, no text, no watermarks.", "created_at": "11-11 23:25", "likes": 6, "reposts": 1, "replies": 2, "views": 976, "url": "https://x.com/MiniMax_AI/status/2120538306395963740", "author": "MiniMax_AI"}, {"id": "2120538304114274396", "text": "Every image starts with a “what if.”\n\nHere’s where we took it with MiniMax H3-Image. 🧵\n\nWhat have you been making? Share your image & prompt in the replies 👇", "created_at": const FIN = {"date": "2026-11-12", "md": "# ☀️财经大事早报 · 2026-11-12\n\n## 📌今日大势\n\n### 1. [英伟达董事会据报准备罢免黄仁勋，盘后暴跌 8%](https://stockanalysis.com/news/nvidia-board-prepares-to-oust-jensen-huang/)（来源：StockAnalysis / WSJ）\n《华尔街日报》11 月 11 日报道，英伟达董事会正准备罢免创始人兼 CEO 黄仁勋，最快当天开会决定其去留；此前《纽约时报》同日披露，黄仁勋与直接向其汇报的医疗健康副总裁 Kimberly Powell 有婚外情，这是第二起被曝光的婚外情，其中另一起涉及一名被美方认定为中国情报人员的女子。董事会已聘请 Wachtell Lipton 律所展开独立调查，英伟达此前称黄仁勋将继续担任 CEO、调查进行中。消息出后英伟达盘后一度暴跌 **8%**（收盘约 $166，日内常规交易还涨了 2.9%），纳斯达克 100 期货跌 **0.8%**、标普期货跌 0.3%；自风波曝光以来英伟达市值已蒸发 **超 3,000 亿美元**，Wedbush 分析师 Dan Ives 估计若黄仁勋离任、估值可能再跌 **25%–30%**。为什么重要：这是 AI 周期里第一家“创始人即公司”的巨头遭遇治理危机——黄仁勋本人就是英伟达的护城河叙事，董事会与创始人的对峙直接冲击整个 AI 链的估值锚；且时间点极敏感：英伟达 **11 月 17 日公布三季报、11 月 18 日黄仁勋要接受三位众议院委员会主席的闭门简报**，后续盯三件事：董事会是否真的投票、公司有无公开的继任者（目前没有）、财报电话会如何回应。\n\n### 2. [Anthropic 上市估值冲向 1.5 万亿美元，投行称“太重要而不容失败”](https://www.ft.com/content/68bcba57-0575-44ee-80f4-2e5ea23a431e)（来源：FT）\nAnthropic 的 IPO 估值在两天内连跳两档：11 月 10 日消息称目标为 **最高 1.4 万亿美元**，11 月 11 日投行已准备把估值上调至 **1.5 万亿美元或更高**。FT 另文直言这宗 IPO“太重要而不容失败”，并配了估值计算器供读者测算。为什么重要：若按 1.5 万亿美元落地，这将是史上最大规模科技 IPO 之一，直接给整个 AI 资产定价——它既是 Claude 商业化的变现时刻，也是检验“AI 叙事能否撑起万亿估值”的试金石；与英伟达风波对照看更有意思：同一周，AI 龙头一边是治理危机、一边是估值狂欢，市场对 AI 的定价正在“故事”与“治理”之间摇摆。后续盯 IPO 定价窗口与基石投资者名单。\n\n### 3. [美国 10 月通胀“超预期火热”，美债下跌、加息押注升温](https://www.ft.com/content/8b564134-dea6-4272-8ede-e0b12ef5aebd)（来源：FT）\n美国 10 月通胀数据发布后，美债下跌，市场开始押注美联储**加息**而非降息。11 月 11 日当天美国债市因退伍军人节休市，10 年期收益率停在 **约 5.0%**；美元指数涨 **0.67%** 至 **102.92**，为连续第二日上涨。市场目前对 12 月的降息定价仅剩约 19 个基点，内部也在分裂——美联储理事 Waller 与旧金山联储主席 Daly 先后放出偏鸽信号，但通胀数据让“12 月按兵不动甚至加息”的声音重新抬头。为什么重要：通胀黏性 + 加息押注的组合是当前全球资产的“总开关”：它一边压着美债与成长股的估值，一边推高美元、压制新兴市场；11 月 11 日美股大涨恰恰发生在债市休市、没有利率价格信号的一天，反弹的成色要等债市恢复交易后再检验。后续盯 12 月 FOMC 与 11 月 CPI。\n\n## 💰宏观与政策\n\n### 4. [中国 10 月经济进一步企稳，社零超预期反弹至 4.8%](https://www.hellenicshippingnews.com/chinas-economy-further-stabilised-in-october-with-more-stimulus-ahead/)（来源：ING）\n10 月中国经济数据进一步企稳：社会消费品零售总额同比 **+4.8%**（9 月为 3.2%），大幅超预期；工业增加值 **+5.3%**，固定资产投资累计 **+3.4%**。10 月是 9 月降息后的首个完整月，分析认为降息、房贷月供下降与消费券可能都对消费有贡献，但具体影响难以量化。为什么重要：这是“金九银十”收官后的第一份成绩单，消费反弹的力度决定了年底政策是否需要继续加码；同时要看到结构仍不均衡——民间投资继续下滑、房地产投资累计同比 **-10.3%**，企稳主要靠公共投资与制造业撑着。后续盯 11 月数据与年底政策窗口。\n\n### 5. [日本储户创纪录抢购国债](https://www.ft.com/content/d17e5179-59e2-4b8e-9a65-e985b99645df)（来源：FT）\n日本储户正在创纪录地买入日本国债。在全球利率高企、通胀预期重塑的背景下，日本国内资金的行为正在发生变化——过去长期依赖央行兜底的国债市场，正在迎来本土储户的接盘。为什么重要：日本是全球最大的债权国之一，其国内资金流向直接影响全球债市供需；若日本储户持续回流本土国债，意味着支撑美债等海外资产的日本资金可能边际减少，与美国加息押注形成共振。后续盯日本央行政策信号与 11 月资金流数据。\n\n### 6. [法国与比利时落入欧元区债市“新分化”](https://www.ft.com/content/5263808c-e8ac-44b8-baa3-af7e8c788684)（来源：FT）\n欧元区债市正在出现新的分化线，法国与比利时站到了不利的一侧。财政可持续性的担忧重新定价，核心国与边缘国的利差逻辑正在被改写。为什么重要：欧元区的主权债分化从来不只是债券交易员的事——它直接决定各国政府的融资成本与财政空间，法国作为欧元区第二大经济体一旦被市场“重新定价”，对欧元资产整体都是压力信号。后续盯法、比两国国债利差与评级机构动作。\n\n### 7. [美国企业的廉价资金时代行将结束](https://www.ft.com/content/50c43ffc-2a91-43ee-8eb7-a19531278b97)（来源：FT）\nFT 指出，美国企业的廉价资金时代正在走向终结：高利率环境下，再融资成本抬升、杠杆的容错空间收窄，过去十年靠低成本债务扩张的模式难以为继。为什么重要：这与第 3 条的加息押注是同一枚硬币的两面——利率中枢上移后，企业盈利、回购与并购的算盘都要重算；结合 CoreWeave 这类高杠杆 AI 基建公司急于“坐到信用市场的成人桌旁”（见第 9 条），信用分层正在加速。后续盯高收益债利差与年底再融资窗口。\n\n## 📈市场与投资\n\n### 8. [美股 11 月 11 日大涨，AI 交易复活](https://www.ft.com/content/639de881-6017-454f-abfa-cfb191d1e7cd)（来源：FT；收盘点位经 Closing Look / cashmate.hk 核实）\n美股 11 月 11 日全面反弹，AI 交易领涨：纳斯达克综合指数涨 **1.60%**（+400.31 点）至 **25,466.19**，纳斯达克 100 涨 **2.28%** 至 28,374.25，标普 500 涨 **1.31%**（+98.45）至 **7,619.38**（距历史高点约 2.6%），道指涨 **0.49%**（+254.60）至 52,486.49，罗素 2000 涨 0.88%；VIX 跌 **10.12%** 至 17.49，为连续第四日回落。上涨家数明显占优（纽交所 1.48:1、纳斯达克 1.77:1）。为什么重要：这是上周 AI 驱动抛售后的“收复战”，纳指基本收回了上周跌幅；但要注意反弹发生在债市休市日，且盘后英伟达风波又把期货打了下来（纳指期货 -0.8%），反弹的可持续性要看 11 月 12 日开盘的承接。后续盯英伟达开盘表现与 10 年期收益率。\n\n### 9. [CoreWeave 财报暴涨 24.7%，内存股平均涨超 11%](https://www.cashmate.hk/daily/2026-11-11)（来源：cashmate.hk）\nCoreWeave 交出收入同比 **+168%** 的季报后，股价单日暴涨 **24.71%**，为 2025 年 6 月以来最大单日涨幅，带动整条 AI 链：半导体 ETF SOXX 单日 **+6.01%**，内存四只股票平均涨 **11%**（美光、闪迪均涨超一成）。但同一天英伟达只涨 2.87%，跑输半导体指数近 2 个百分点，盘中还遭遇 Baird 下调评级；三日累计看，英伟达跌 6.9%，而半导体指数涨 9.3%，差距拉大到 **16 个百分点以上**。为什么重要：AI 交易内部正在分化——算力租赁与存储环节接棒领涨，而龙头英伟达却因治理风波掉队；CoreWeave 同时还在谋求进入主流信用市场（FT 称其“想坐到信用市场的成人桌旁”），高增长 + 高杠杆的组合是这轮 AI 资本开支故事的缩影。后续盯 CoreWeave 的债务融资动作与内存价格。\n\n### 10. [A 股与港股分化：创业板涨超 3%，恒生跌近 1%](https://www.21jingji.com/article/20261111/herald/559b3659c6775e9a7f17e7825f859522.html)（来源：21 财经）\n11 月 11 日 A 股收涨、港股收跌：沪指涨 **0.46%**，深成指涨 **1.32%**，创业板指涨 **3.11%**；恒生指数跌 **0.98%**，恒生科技跌 **1.41%**。港股光通信股逆势大涨（长飞光纤 +13%、中际旭创 +14%、剑桥科技 +23%），权重科技股集体下挫（腾讯 -2%、美团 -3%、百度 -1%）；日经 225 收涨 1.31% 至 61,248.59 点，韩国 KOSPI 收涨 2.60% 至 5,375.36 点。为什么重要：A 股与港股同一天走出相反方向，说明资金在“国内算力硬件”与“港股互联网”之间做了选择——算力硬件（CPO、PCB）是当天最强的方向，而港股科技股的下跌与美股 AI 链的波动遥相呼应。后续盯算力硬件的持续性与港股科技股的企稳。\n\n### 11. [油价跌破 90 美元，特朗普收回打击伊朗威胁](https://www.ft.com/content/07bdb58c-4557-4def-b8cb-db9be304fd72)（来源：FT）\n油价跌破 **90 美元**：纽约商品交易所 12 月交货的轻质原油期货跌 0.93%，收于每桶 **86.04 美元**。导火索是特朗普收回了打击伊朗的威胁，交易员开始“给和平一个机会”；沙特原油产量也已反弹至接近战前水平。为什么重要：油价是通胀预期的先行指标——油价回落缓解了第 3 条里通胀黏性的压力，但地缘风险并未消失（贝森特因所谓伊朗威胁被转移、美英挫败涉伊袭击图谋，见第 21 条），油价的下跌更多是“威胁定价”的回吐而非供需反转。后续盯美伊局势与 OPEC+ 产量。\n\n## 🏠房价洞察\n\n### 12. [统计局 70 城：10 月新房环比跌 0.51%，跌幅为年内最小](https://www.hellenicshippingnews.com/chinas-economy-further-stabilised-in-october-with-more-stimulus-ahead/)（来源：ING）\n国家统计局 10 月 70 城房价：新建住宅环比 **-0.51%**（9 月为 -0.71%），二手住宅环比 **-0.48%**（9 月为 -0.93%），**跌幅均为年内最小**（新房为 3 月以来最小、二手为 2023 年 9 月以来最小）。**11 个城市二手价格企稳或上涨，为年内最好水平**，其中北京 **+1.0%**、上海 +0.2%、深圳 +0.7%，一线城市中仅广州（-0.4%）继续下跌；7 个城市新房价格上涨，同样为 3 月以来最好。为什么重要：70 城指数是官方口径的“体温计”，跌幅收窄 + 企稳城市数创年内新高，说明 9 月降息后的首个完整月确实起了作用；但注意绝对水平仍在下跌，“企稳”不等于“上涨”，且样本是环比价格指数、不是成交均价。后续盯 11 月是否延续、以及二手成交量能否跟上价格企稳。\n\n### 13. [中指院百城：新房均价 17,316 元/㎡，二手 12,376 元/㎡](https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html)（来源：中指研究院）\n中指研究院 11 月 1 日发布的百城价格指数：10 月全国 100 城新建住宅均价 **17,316 元/平方米**，环比 **+0.18%**、同比 **+2.02%**；二手住宅均价 **12,376 元/平方米**，环比 **-0.61%**（跌幅较上月扩大 0.01 个百分点）、同比 **-6.72%**；50 城住宅平均租金 **33.87 元/平方米/月**，环比 -0.28%、同比 -2.02%。分化上：**一线城市新房环比 +0.41%、同比 +5.08%**，二线 +0.13%/+1.68%，三四线 -0.1%/-2.01%；二手则一线 -0.53%、二线 -0.72%、三四线 -0.54%。为什么重要：两个口径放在一起看才完整——统计局 70 城指数说“新房环比跌 0.51%”，中指院百城均价说“新房环比涨 0.18%”，**口径不同**（指数 vs 均价水平、样本城市不同），但结论一致：**新房靠一线优质楼盘入市撑着结构性上涨，二手全线仍在调整，租金也在跌**。后续盯一线新房的去化速度与二手挂牌量。\n\n### 14. [政策组合拳密集落地：房贷贴息 + 公积金优化 + 销售制度改革](https://www.cnsonews.com/house/20261101/98fd11e6bb20163edfeac0f8ebd1ca15.html)（来源：中指研究院）\n10 月政策端三线并进：国家发改委 10 月 20 日发布会提出及时推出务实管用的增量政策，抓好已出台的**降低抵押补充贷款（PSL）利率、增加再贷款额度、居民购房贷款贴息**等政策落地；商品住房销售制度改革进入细则密集落地期，天津、杭州、深圳、宁波、苏州、合肥、成都等城市陆续出台实施意见；深圳、天津、杭州、东莞等地优化住房公积金政策，其中**杭州将多孩家庭公积金贷款额度上浮比例由 50% 提高至 60%，贷款额度上限提高至 324 万元**。同时受“8·28 新政”影响，8 月 28 日起取得预售许可证的项目须竣工备案后方可发放个人住房按揭贷款，房企开发资金回笼周期拉长。为什么重要：政策的真实意图正在从“刺激成交”转向“重构规则”——贴息是直接给购房者降成本，销售制度改革（竣工备案后才放按揭）则是把风险从购房者向开发商转移，短期会拉长房企资金占用、压制拿地意愿。后续盯贴息政策的实际落地规模与年末土地市场表现。\n\n### 15. [房地产投资累计同比 -10.3%，房企资金压力仍在](https://www.hellenicshippingnews.com/chinas-economy-further-stabilised-in-october-with-more-stimulus-ahead/)（来源：ING）\n10 月房地产开发投资累计同比 **-10.3%**，仍在两位数下滑；中指院预计，受 8·28 新政影响，房企开发资金回笼周期拉长、资金占用增加，将对拿地能力和投资意愿形成制约，**今年年末及 2027 年土地市场将逐步体现政策影响**。为什么重要：价格端企稳与投资端下滑并存，说明这轮企稳主要靠需求侧政策与一线优质项目，而非房企投资回暖；土地市场是明年的先行指标，若拿地持续低迷，2027 年的新房供应与地方财政都会承压。后续盯年底房企推盘促销与土地出让数据。\n\n### 🔍深度分析：中国房价的“分化企稳”能走多远\n把四条房价新闻拼在一起，图景是清晰的：**中国房价正在进入“一线企稳、二手筑底、三四线继续探底”的分化企稳期**。价格数据上，两个口径互相印证了方向：统计局 70 城二手环比跌幅收窄至 -0.48%（2023 年 9 月以来最小）、11 城企稳或上涨为年内最好；中指院百城新房均价环比 +0.18%、一线同比 +5.08%，而三四线新房同比 -2.01%、二手同比 -6.72%——**一线与低线城市的剪刀差仍在扩大**，不是普涨。政策意图上，这轮组合拳的重点不是“放水救市”，而是“降成本 + 改规则”：房贷贴息直接降低居民购房成本，是需求侧最实在的补贴；销售制度改革（竣工备案后才放按揭）则是供给侧的规则重构，把“期房风险”从购房者手里拿走，但代价是房企资金占用增加、拿地意愿下降——政策在“保交房”与“保投资”之间做了取舍。对购房者的实操含义是：**一线核心城市的优质新房可以看，但要盯去化与价格的真实性**（均价上涨很大程度是优质楼盘结构性拉动）；**二手房仍是买方市场**，议价空间仍在，急着入手不如等 11 月数据确认企稳的连续性；**三四线城市没有政策底可言**，除非自住刚需，否则不宜把“企稳”读成“反转”。后续盯三件事：11 月 70 城数据是否延续跌幅收窄、房贷贴息的实际发放规模、年底房企推盘促销的折扣力度——三者同时向好，分化企稳才能升级为全面筑底。\n\n## 🤖AI经济\n\n### 16. [没有员工的初创公司：AI agent 正在自己开公司](https://www.ft.com/content/d338594b-ca66-418a-9884-8f562a175fed)（来源：FT）\nFT 关注了一批“没有员工的初创公司”：AI agent 正在承担从研发到运营的完整链条。这与第 2 条 Anthropic 的万亿估值、第 9 条 CoreWeave 的算力租赁热潮是同一条故事线——AI 的经济形态正在从“卖模型”走向“卖劳动力”。为什么重要：若 agent 真能独立运营公司，劳动力市场的定价逻辑与公司组织形态都会被改写；但这也是当前 AI 叙事里最需要警惕“概念先行”的部分——今天的 agent 连“批准不等于执行”的授权问题都还没解决（见今日论文栏），离自主经营还有很长的治理路要走。后续盯这类公司的真实收入与存活率。\n\n### 17. [英国芯片初创 Fractile 估值达 70 亿美元](https://www.ft.com/content/f999a0c2-af52-499f-8008-accbdfd45a25)（来源：FT）\n英国芯片初创公司 Fractile 估值达到 **70 亿美元**。在英伟达遭遇治理危机的同一周，一家挑战者拿到 70 亿美元估值，说明资本对“英伟达之外”的算力路线仍在下注。为什么重要：算力产业链的估值正在扩散——从英伟达一家独大，到 Fractile、CoreWeave、内存厂商轮流领涨；但估值扩散也意味着风险扩散，若龙头继续动荡，挑战者的估值同样会被重估。后续盯 Fractile 的产品落地与下一轮融资。\n\n### 18. [美国监管机构推迟华尔街交易 AI 算力期货的计划](https://www.ft.com/content/269b0245-44c4-4e34-94df-202bef642539)（来源：FT）\n美国监管机构推迟了华尔街推出 AI 算力期货的计划。算力一旦可以期货化，就意味着“AI 的石油”有了金融定价，但监管层显然认为时机未到。为什么重要：算力期货是 AI 经济金融化的标志性一步——推迟说明监管对算力价格波动与市场操纵风险仍有顾虑；与第 7 条“廉价资金时代结束”对照看，AI 基建的融资成本与价格发现机制都在收紧。后续盯监管的下一步时间表与交易所的反应。\n\n### 19. [Google 一天两发：AlphaGenome 2 与 Gemini Decision 1](https://deepmind.google/blog/alphagenome-2-deciphering-how-cells-read-dna-to-better-understand-disease/)（来源：Google DeepMind）\nGoogle 11 月 11 日连发两款模型：**AlphaGenome 2**（DNA 序列模型，预测变异在不同细胞类型中的影响，TenK10K 因果变异召回率 30%、上一代 16%，向非商业研究开放 API）与 **Gemini Decision 1**（首个决策模型，单次可评 1,000 道题，输入 $0.10/百万 token、输出免费）。为什么重要：两款都是“专用模型”而非通用聊天模型——一个扎进生命科学纵深，一个把“做判断”从“写文本”里拆出来；这正是 AI 经济的下一站：通用大模型铺路，专用模型收钱。详见今日看板模型追踪栏。\n\n## 🏢公司与产业\n\n### 20. [埃克森美孚就欧盟碳捕集规则提起法律挑战](https://www.ft.com/content/377d2ae5-112f-411f-bfc1-5e498948cb7b)（来源：FT）\n埃克森美孚就欧盟碳捕集规则提起法律挑战。能源巨头与气候规则的正面冲突进入司法程序。为什么重要：碳捕集是欧盟绿色工业政策的核心工具之一，埃克森美孚的挑战若成功，将改写跨国能源公司在欧洲的合规成本；与 COP31 电气化目标的争议（FT 另文）对照看，气候政策的执行正在遭遇越来越多的法律与政治阻力。后续盯法院受理进度与欧盟的回应。\n\n### 21. [土耳其首席银行监管者因 200 亿美元欺诈丑闻请辞](https://www.ft.com/content/f22ce1c1-8de8-420a-b9f6-4dff0fc1f732)（来源：FT）\n土耳其首席银行监管者因 **200 亿美元**欺诈丑闻提出辞职。为什么重要：200 亿美元的规模对土耳其金融体系不是小事，监管首长请辞说明丑闻已触及制度层面；土耳其里拉与银行股的反应值得跟踪，新兴市场金融监管的可信度正在接受考验。后续盯继任人选与丑闻的进一步披露。\n\n### 22. [SpaceX 创纪录 IPO 的指数冲击](https://www.ft.com/content/141176cd-79ce-4633-9def-eaee96db1762)（来源：FT）\nFT 分析了 SpaceX 创纪录 IPO 对指数的影响：如此体量的新股上市将直接改写主要指数的权重结构，指数基金将被动吸纳。为什么重要：与 Anthropic 的 1.5 万亿美元估值放在一起，2026 年末正在形成一波“巨型 IPO 潮”——SpaceX 与 Anthropic 两宗交易合计可能重塑全球科技股的市值版图；指数冲击意味着即使不参与打新的投资者，也会被动持有。后续盯两宗 IPO 的定价与上市时间表。\n\n## 🌍全球大事\n\n### 23. [俄乌谈判转向战后安全议题，未取得突破；三方会谈就大规模换俘达成协议](https://www.bbc.co.uk/news/articles/ck792we7zrz4o?at_medium=RSS&at_campaign=rss)（来源：BBC）\n俄乌谈判已转向战后安全安排议题，但未能取得突破；与此同时，为期两天的俄罗斯、美国和乌克兰三方会谈 11 日在阿联酋首都阿布扎比结束，**各方就大规模交换被俘人员达成协议**，联合国表示支持一切有助于解决冲突的努力。为什么重要：谈判议题从“停火”转向“战后安全”，说明各方已在为“冲突之后”做安排，但无突破意味着战场仍是决定性变量；换俘协议是人道层面的实质进展，也是三方机制仍在运转的证明。后续盯换俘执行与下一轮会谈时间。\n\n### 24. [美国财长贝森特因所谓伊朗威胁被转移；美英挫败涉伊袭击图谋](https://www.bbc.co.uk/news/articles/cqr7gr0010r2o?at_medium=RSS&at_campaign=rss)（来源：BBC）\n美国财政部长贝森特在所谓伊朗威胁后被转移；另据美国方面称，三名伊朗支持的嫌疑人策划了包括英国皇家空军费尔福德基地事件在内的袭击。为什么重要：这与第 11 条油价回落形成对照——市场给“和平”定价的同时，安全部门却在处理真实的威胁升级；美伊之间的“威胁—缓和”拉锯是油价与风险资产波动的直接来源。后续盯美方是否公布更多细节与伊朗的回应。\n\n### 25. [印尼副总统辞职，执政联盟现裂痕；西班牙大罢工引发巴塞罗那冲突](https://www.bbc.co.uk/news/articles/cmvgxgz87qqro?at_medium=RSS&at_campaign=rss)（来源：BBC）\n印尼副总统在执政联盟出现裂痕的迹象中辞职；西班牙全国大罢工后，巴塞罗那爆发冲突，数千人参与罢工。为什么重要：两件事都指向同一主题——**执政联盟的稳定性正在受到考验**，无论是新兴市场大国还是欧洲老牌民主国家，内部政治裂痕正在成为市场需要定价的新变量；印尼是东南亚最大经济体，其政局走向直接影响区域资产。后续盯印尼继任安排与西班牙罢工的后续。\n\n## 📅今日前瞻\n\n- **英伟达风波**：董事会是否投票、何时公告、11 月 17 日三季报与 11 月 18 日众议院闭门简报是接下来一周最大的单一风险点；纳指期货已先跌 0.8%，开盘承接是第一道考验。\n- **Anthropic IPO**：估值能否站上 1.5 万亿美元、定价窗口何时打开，将决定这波 AI 估值狂欢的顶点。\n- **美联储 12 月会议**：市场目前仅定价约 19 个基点的降息，通胀数据后“加息押注”抬头，12 月决议前每一份通胀与就业数据都会被放大解读。\n- **中国数据**：11 月 70 城房价与社零数据能否延续 10 月的企稳势头，是验证“分化企稳”能否升级为“全面筑底”的关键。\n- **地缘**：俄乌换俘协议的执行情况、美伊威胁的后续，将决定油价是继续回落还是重新定价风险。\n\n## 📎来源清单\n\n- RSS 抓取：FT Home / FT Markets（18 条）、经济学人本周/金融经济（2 条）、FT 中文网（5 条）、BBC World（15 条），合计 40 条财经 + 25 条国际，覆盖 2026-11-10 至 11-11。\n- 搜索补漏：英伟达董事会风波（WSJ 经 StockAnalysis/InvestingLive 交叉核实）、11 月 11 日美股收盘点位（Closing Look / cashmate.hk / 21 财经交叉核实）、中国 10 月 70 城房价与百城价格指数（中指研究院、国家统计局经 ING 分析、时代财经）、中国 10 月经济数据（ING）。\n- 注：WSJ 的英伟达报道为“据知情人士”消息，董事会尚未公告、英伟达未回应，黄仁勋仍为 CEO；引用时以“据报”口径为准。市场收盘数据以三家收盘 recap 交叉核实为准；个别信源（如 Morningstar 的全球市场报告）因数据过期未采用。\n"};

const LIB = {"groups": [{"id": "access-control", "name": "RAG 访问控制", "papers": [{"title": "Authorization Drift in LLM Agents: Evaluating Boundary Compliance in Multi-Step Tool Use", "authors": "Chuxue Cao 等", "url": "https://arxiv.org/abs/2611.09113", "venue": "arXiv 预印本（cs.CR / cs.LG，2026-11-06）", "oneliner": "没有攻击者也会越界：把 agent 多步工具调用中的授权越界形式化为“授权漂移”，648 样本 ADB 基准实测前沿模型漂移率 0.43–0.61。", "insight": "补上 ChainBind 威胁模型里缺失的非对抗维度：我们的 T1/T2/T3 全是攻击者驱动的注入，这篇证明无对手时 agent 自己也会为走捷径而多拿数据、多调工具；漂移四维度（数据、工具、范围、时间）恰好对应批准绑定需要逐项核对的要素。ADB 的漂移率 + 干净成功率可与我们 E12 的 ASR + 良性效用并列引用，说明“安全—效用权衡”的双指标口径。另可引用其法律映射：数据最小化是最常被触及的条款，93.5% 漂移运行映射多司法辖区。引用须写清基准口径与预印本性质。", "tags": ["授权漂移", "批准绑定", "Agent 安全", "基准"], "added": "2026-11-10"}, {"title": "From Procedures to Permissions: Learning Precise Subagent Authorization from Agent Skills", "authors": "Wenkai Yu 等", "url": "https://arxiv.org/abs/2611.08905", "venue": "arXiv 预印本（cs.CL，2026-11-06）", "oneliner": "从 Agent Skills 的程序知识里学出子 agent 的最小权限集：工具权限精确率 +13.4 个百分点、工作区权限精确率 +24.1 个百分点。", "insight": "与 ChainBind 互补：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”——学出来的最小权限集可作批准的标的、由运行时绑定强制执行。把授权监督信号从“事后轨迹”前移到“事前程序”，与“策略独立于模型提议之外求值”同构。引用须写清数字出自 ClawArena-Team 单一基准与 Qwen3.5-35B-A3B 单一模型族，ground truth 为作者自合成的程序推导。", "tags": ["最小权限", "子 agent", "Agent Skills", "授权"], "added": "2026-11-10"}, {"title": "Right Tool, Wrong Parameters: Defending LLM Agents Against Parameter Poisoning", "authors": "Yao Wang 等", "url": "https://arxiv.org/abs/2611.04673v1", "venue": "arXiv 预印本（cs.CR，2026-11-03）", "oneliner": "参数投毒防御：不诱发新动作、只偷换工具参数，AuthorityFlow 按查询诱导的信任层级逐参数判定来源可信度。", "insight": "与 ChainBind 草案投毒直接咬合：动作名与金额都对、只换主题或日期的投毒，恰好需要参数级而非动作级的批准绑定。AuthorityFlow 的字段信任归因是“批准环节加来源过滤”的可操作化候选，但其信任层级由模型解读查询生成，存在循环风险，引用时须点出该层。数字为作者自建 FactAuthBench 上的 93.06%→9.03%，良性效用代价约 7.6 个百分点。", "tags": ["参数投毒", "批准绑定", "信任层级", "Agent 安全"], "added": "2026-11-05"}, {"title": "Permitted but Unauthorized: Affordance-Induced Delegated-Scope Violations in Multi-Agent LLM Systems", "authors": "Shravya Kanchi", "url": "https://arxiv.org/abs/2611.04086v1", "venue": "arXiv 预印本（cs.CR，2026-11-02）", "oneliner": "多智能体系统里的“被许可却未授权”：决定 agent 越界的不是权限表，而是对端动作有没有被列出来供它看见。", "insight": "把授权拆成许可与委托范围两层：权限表不变、只改动作可见性，越界率就能从 0 走到 52/52。我们的 per-view 语义可据此补一句——视图不仅要按 AU 过滤内容，还要按委托范围过滤可执行动作的可见性。另可引用其“范围执法 ≠ 伤害预防”边界：确定性监控器挡住全部越界，却挡不住用自己的已授权动作拖累同伴。引用须写清模拟环境与单格子极端值。", "tags": ["委托范围", "多智能体", "授权", "呈现面"], "added": "2026-11-05"}, {"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations", "authors": "Evan Oktavianus、Dana Indra Sensuse、Imairi Eitiveni", "url": "https://doi.org/10.24433/co.3932736.v1", "venue": "Code Ocean（2026-10-30，OpenAlex 收录）", "oneliner": "面向公共机构的声明式 agentic RAG 访问控制：工作流表示为状态机，每状态挂自己的策略，跨通道与组织单元统一执行。", "insight": "补了 RU/AU 框架里“状态维度”的缺口：我们是查询时按内容归属逐 AU 求值，StateGate 是按工作流状态判定授权，两者叠加构成“内容归属 × 工作流状态”的二维判定，直接对应 ChainBind 的“批准—执行跨状态是否还有效”问题。其“过滤而非依赖引导”与 retrieve-then-project 同构（过滤防住 95.5% 暴露与 85/143 注入得手）。引用时须标注合成文档 + 自建 oracle/对照的证据边界，载体按预印本/技术报告口径处理。", "tags": ["工作流状态", "agentic RAG", "访问控制", "过滤"], "added": "2026-11-01"}, {"title": "REALM: Identifying Minimal Task Assets for LLM Agents", "authors": "Zihou Ren、Byungchul Tak、Long Wang", "url": "https://arxiv.org/abs/2610.39155v1", "venue": "arXiv 预印本（cs.CR, cs.AI, eess.SY，2026-10-29）", "oneliner": "为 LLM agent 识别并维护任务真正需要的最小资产集合，把“发现资产”与“授权使用”分开，在任务容器内只暴露资源受限的局部 API。", "insight": "与 RU/AU 解耦在执行侧同构：我们是检索侧“策略独立存放、查询时逐 AU 求值”，REALM 是执行侧“资产发现走依赖图、授权使用走受限 API”。它还处理了执行中才涌现的资产身份问题，其“来源限定接纳”可与“未知 AU 默认拒绝”对照。AgentDyn 上 ASR 16.6%→0.2%（qwen3.5-flash），引用时须限定基准与模型。", "tags": ["最小权限", "agent 授权", "提示注入", "AgentDyn"], "added": "2026-10-31"}, {"title": "Contextual Candour: Role-Aware Graduated Disclosure for LLMs over Mixed-Sensitivity Contexts", "authors": "Devansh Srivastav、David Pape、Samira Abedini 等", "url": "https://arxiv.org/abs/2610.28067", "venue": "arXiv 预印本", "oneliner": "把访问控制从二值 grant/deny 扩展为按用户授权等级校准回答粒度的渐进披露（graduated disclosure），用 reward-based 优化在生成过程里做披露控制。", "insight": "与 per-view 索引形成互补路线：我们是索引侧的离散视图隔离，他们是生成侧的连续粒度校准；结合点正是执行时授权绑定方向（生成时按 AU 动态校准）。其 reward 明确惩罚改写型泄露，呼应我们 retrieve-then-project 的 NLI 残留检查，可互相印证。", "tags": ["渐进披露", "生成侧控制", "授权校准"], "added": "2026-10-22"}, {"title": "Local Allow, Global Deny: Why Per-Action Authorization Does Not Compose in LLM Agents", "authors": "Anmol Pandey、Aditya Jain、Liang Chen 等", "url": "https://arxiv.org/abs/2610.27620", "venue": "arXiv 预印本", "oneliner": "证明逐动作授权在逻辑上无法组合成全局授权：关系型目的违规是 2-safety hyperproperty，零误报的单动作监控器一个都检测不到；AL-SYNTH 用 SAT/SMT 合成最小 CAF 见证。", "insight": "直接质疑逐 AU 求值这类局部授权语义的完备性：跨 AU 的关系型约束（如两段各自授权的片段拼在一起才构成泄露）在单查询内不可见。论文 limitations 应声明 AU 求值是 per-query 单轨迹语义，关系型策略需要跨执行监控，列为未来工作。AL-SYNTH 的最小见证合成法可借鉴，用于评估我们三语义在组合性攻击下的表现。", "tags": ["agent 授权", "组合性", "2-safety", "不可能性定理"], "added": "2026-10-22"}, {"title": "Lineage-Aware Memory Governance: A Derivation-Gated Framework for Privacy-Preserving Column-Level Access Control in Enterprise AI Agents", "authors": "Venkata M Sangaraju、Sudhir Vissa", "url": "https://arxiv.org/abs/2610.07258", "venue": "arXiv 预印本（HF 每日论文）", "oneliner": "提出 Analytical Memory Unit（AMU）：为共享内存中每条缓存结果附上完整推导血缘图，检索策略只有在请求者对结果触及的每一列都有授权时才返回命中。", "insight": "与我们 RU/AU 解耦形成直接对话：它是智能体内存侧的'检索时逐血缘求值'镜像设计。关键是其负面实证——消除泄露需要 75–90% 的血缘记录完整度——恰恰论证了我们'未知/未映射 AU 默认拒绝'的必要性：血缘不可能永远完整，fail-closed 必须内建在语义层而非依赖记录完整度。另可借鉴其'条件式设计保证 vs 经验结论'的措辞区分。引用价值高。", "tags": ["智能体内存", "访问控制", "血缘门控", "默认拒绝"], "added": "2026-10-09"}, {"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "venue": "arXiv:2609.36373 (2026)", "oneliner": "首个把\"授权先于上下文组装\"做成 sound + policy-complete 的记忆准入机制：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，10,000 个多方对话历史中零违规项进入上下文", "insight": "与我们\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照；其派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照，可在 Discussion 对比两种选择的代价；\"audience 扩大需显式对象特定授权\"可为 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience（非 AU 级内容划分），威胁面在 T1/T2 内。", "tags": ["授权前置", "related work", "必引候选"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "Scott Thornton 等", "insight": "与我们 KG 路径切割节（Round 8）主题相邻、贡献互补：他们是在线图扩展边界做单点授权检查，我们是离线 k-cut + 代价曲线（28.2% 公开文本代价、残留实体 4133→0）+ 子句级 PII 粒度。必须引用并主动写清差异；他们的 PD=2 命题与我们的 k=2 发现（k=3≡k=2）互相印证。", "oneliner": "形式化 Retrieval Pivot Risk：vector 检索出的 seed chunk 经实体链接 pivot 进敏感图邻域，造成纯向量检索不存在的跨租户泄露；提出 7 种攻击；泄露稳定出现在 PD=2（二部拓扑命题）。", "tags": ["KG", "pivot攻击", "必引"], "title": "Retrieval Pivot Attacks in Hybrid RAG: Measuring and Mitigating Amplified Leakage from Vector Seeds to Graph Expansion", "url": "https://arxiv.org/abs/2602.08668", "venue": "arXiv:2602.08668 (2026)"}, {"added": "2026-09-30", "authors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "title": "Integrating Access Control with Retrieval-Augmented Generation: A Proof of Concept for Managing Sensitive Patient Profiles (AC-RAG)", "url": "https://doi.org/10.1145/3672608.3707848", "venue": "ACM SAC 2025"}, {"added": "2026-09-30", "authors": "", "insight": "写 related work 全景段落时引用，界定我们的位置。", "oneliner": "RAG 安全攻防分类综述，§4.4 整节讲 Access Control / Privacy / Confidentiality（含 SD-RAG、AC-RAG、DPVoteRAG、PAD 等）。", "tags": ["综述", "related work"], "title": "Securing Retrieval-Augmented Generation: A Taxonomy of Attacks, Defenses, and Future Directions", "url": "https://arxiv.org/pdf/2604.08304", "venue": "arXiv:2604.08304 (§4.4)"}, {"title": "ResidualAuth: What Authorization State Must Language Agents Preserve under Revocable Delegation?", "authors": "Moonwon Choi et al.", "url": "https://arxiv.org/abs/2609.08062", "venue": "arXiv cs.AI/cs.CR (2026-09-08, v2)", "oneliner": "可撤销委托下授权状态的形式化：两段历史可权限相同但撤销后决策相反，系统必须保留的恰是 residual authorization state，并给出内存精确/紧界。", "insight": "与我们 Discussion 的“撤销机制”开放问题直接对接：授权结论是授权历史的函数而非权限快照的函数；其内存下界与我们 AU 粒度—安全—成本权衡曲线呼应；与昨日 Residual Authority Replay 攻击形成“攻击—理论”配对引用。", "tags": ["revocable-delegation", "authorization-state", "theory", "memory-bounds"], "added": "2026-10-02"}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "venue": "arXiv cs.CR/cs.AI/cs.SE (2026-09-30)", "oneliner": "系统化揭示 coding-agent 中“人批准的 A ≠ 实际执行的 A'”的六类批准—执行绑定失效，提出 keyed capability (Approval Token) 部分修复并诚实报告负结果。", "insight": "“批准—执行绑定完整性”与我们的 M(r) 绑定思想同属一范式，可在 Agent 线 related work 并列；其“字段级验证器看不见进程层级分叉”的负结果警示授权证据必须绑定到执行语义层；诚实负结果段落是局限章节范本。", "tags": ["approval-binding", "capability", "coding-agent", "negative-result"], "added": "2026-10-02"}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han et al.", "url": "https://arxiv.org/abs/2609.39450", "venue": "arXiv cs.CR/cs.AI (2026-09-30)", "oneliner": "技能投毒下的工具调用授权：授权上下文与生成上下文分离，基于可信用户意图做 fail-closed 裁决，319 次注入测试中 ASR 相对降低 35–46%。", "insight": "“授权决策输入限于可信侧”与我们“策略独立存放、查询时逐 AU 求值”同构，Agent 线 related work 可并列引用；其 Reviewer 仍是 LLM 裁决，与我们“确定性求值”路线形成对照，可在 Discussion 讨论取舍。", "tags": ["tool-call-authorization", "skill-injection", "fail-closed", "agent"], "added": "2026-10-02"}, {"title": "Role Based Access Control in Enterprise RAG", "authors": "Gnaneshwar Kethavath", "url": "https://doi.org/10.5281/zenodo.23168856", "venue": "Zenodo preprint (2026)", "oneliner": "用 15 份虚构公司文档 × 3 个模拟角色 × 4 种实现实证企业 RAG 的 RBAC：未过滤 RAG 在 99 次未授权/攻击评估中泄露 37 次，prompt-only 权限声明仍泄露 12 次，两种代码级过滤均为 0。", "insight": "我们\"策略独立于模型、在执行层强制\"主张的第三方实证：37/99 vs 12/99 vs 0 这组数字可直接进论文动机段——仅靠 prompt 声明权限不够。它做的是文档级 RBAC（粗粒度），恰好是 AU 划分的一个特例（每文档一个 AU），粒度差异本身可写成对比点。注意局限：Zenodo 非同行评审、单作者、合成小数据、作者自检标签，只能作支持性引文。", "tags": ["RBAC", "企业 RAG", "实证评估", "必引候选"], "added": "2026-10-07"}, {"title": "Safe Separability for Autonomous Authorization: Branch-Relative Authority Closure Under Decision-Critical Uncertainty", "authors": "Mohammad Amir Khusru Akhtar", "url": "https://doi.org/10.21203/rs.3.rs-11086182/v1", "venue": "Research Square 预印本（Under Review）", "oneliner": "形式化“授权决策所需证据、其获取动作本身也需要授权”的循环为 safe separability，提出分支相对授权闭包（BRAC），只用在所有仍兼容世界中都合法的探测来消解决策关键不确定性。", "insight": "与我们“未知 AU 默认拒绝”的保守路线形成直接对照：BRAC 是“在可证明安全的分支内允许证据采集”的积极路线，两者都承认授权信息不完备时行动的困难但选择相反的风险分配，可在 discussion 并列为“证据采集 vs 默认拒绝”权衡。其“先给受限可解类、再用最小反例划界”的形式化写法（联合状态语义+单调类+世界依赖反例）值得我们写 T1/T2/T3 形式化时借鉴；266 回归测试+穷举小世界+随机认证对比的评估方法学可作授权语义正确性评估模板。注意是审稿中预印本，引用时标注。", "tags": ["authorization", "autonomous-agents", "formal-methods", "evidence-acquisition"], "added": "2026-10-10"}, {"title": "After the Edit, Freshness and Access Control of Tool-Calling Retrieval and Vector RAG for a Community-Edited Knowledge Base", "authors": "Nikolaos D. Tantaroudas、Ilias Karachalios、Andrew J. McCracken", "url": "https://doi.org/10.20944/preprints202610.0645.v1", "venue": "Preprints.org 预印本（OpenAlex）", "oneliner": "在可编辑社区知识库上对照实测工具调用检索与向量 RAG 的新鲜度与访问控制：48 组反事实编辑 + 48 条合成 canary 记录，测编辑后新值给出率与 gated 内容泄露率。", "insight": "与我们 RU/AU 解耦框架直接对话的三组数字：工具 agent 在 240 次探测中零泄露 gated 内容，而批量重索引的 RAG 在重索引前泄露了全部已撤销 canary、忽略 gating 标记的索引器在 96 次探测中泄露 93 次——这是“撤销必须内建在执行语义层、gating 必须跟随内容复制的每一步”的现成实证，可引作我们撤销机制一节的经验证据。另：RAG 在对话内被追问时只有 19.6% 给出新值（多为撤回之前的正确答案），说明检索新鲜度不仅是索引问题也是对话状态问题——与我们“查询时逐 AU 求值”的设计呼应。局限：Preprints.org 预印本、单平台案例（希腊农业平台），引用时需标注。", "tags": ["访问控制", "撤销机制", "工具调用检索", "新鲜度", "实证"], "added": "2026-10-11"}, {"title": "One Word Opens the Gate: The Option-Channel Attack on Typed Decision Models as Agent Guardrails", "authors": "Seyedarmin Azizi、Erfan Baghaei Potraghloo、Massoud Pedram", "url": "https://arxiv.org/abs/2610.12292", "venue": "arXiv 预印本（OpenAlex 增补）", "oneliner": "评估 7 个开源类型化决策模型作为 agent guardrail 的允许/阻止决策质量：准确率仅 36%–72%，6 行无关日志文本可把 fail-open 率从 0% 抬到 63%，误导性选项名可抬到 93%–100%；结论是这类模型不应成为做决定的组件。", "insight": "直接论证我们架构的核心选择：授权判定必须是确定性的策略求值（逐 AU 计算 P(a,u)），而不是模型推理——模型做 allow/block 在对抗文本下 fail-open 率可达 93%–100%。fail-open/fail-closed 二分法与我们“未知 AU 默认拒绝”同构，且论文显示模型 guardrail 的默认倾向不稳定，正是默认拒绝必须写进语义层的理由。另：“选项通道攻击”是 T1/T2/T3 之外的新攻击面（攻击决策组件自身的输入通道），我们的框架因 AU 求值不经过模型而天然免疫。局限：arXiv 预印本、0 引用，评估的是开源小模型而非 Jev 本体。", "tags": ["类型化决策模型", "guardrail", "选项通道攻击", "默认拒绝", "授权判定"], "added": "2026-10-11"}, {"title": "Provenance and Authorization in Autobiographical Language Models", "authors": "Faruk Alpay、Taylan Alpay", "url": "https://arxiv.org/abs/2610.17935", "venue": "arXiv 预印本（cs.CR，2026-10-13）", "oneliner": "把自传式语言模型档案中\"叙事内容悄悄变成授权依据\"形式化为安全问题：定义类型化记录、认证断言、与内容分离的独立策略通道和可容许视图，并给出完整性规约与 noninterference 论证。", "insight": "与我们 RU/AU 解耦的核心主张跨领域收敛：\"策略与内容载体分离、查询时独立求值\"。其 noninterference 论证框架可直接借鉴为我们\"零泄露\"目标的形式化语言；\"admissible views\" 与我们的 per-view 索引执行语义直接对应。它还给了一个 T1/T2/T3 之外的新攻击面实例：授权依据在推理时的语义漂移（叙事→同意），提示威胁模型可在\"检索后、生成前\"补一刀。只引形式化部分，不引其小规模合成试点数字。", "tags": ["策略通道分离", "可容许视图", "noninterference", "授权语义"], "added": "2026-10-15"}, {"title": "From Detection to Decision: Calibration and Deferral for Prompt-Injection Detection", "authors": "Qianlong Lan、Anuj Kaul、Vinothini Pandurangan、Indranil Sanyal", "url": "https://arxiv.org/abs/2610.20907", "venue": "arXiv 预印本（2026-10-14，cs.CR）", "oneliner": "把 prompt injection 防御从二分类检测器推进到允许/拦截/升级的运营决策：47,611 样本测校准与 deferral，结论是概率输出救不了分布偏移下的安全决策。", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的强制授权立场形成可对比论证：即使 AUROC 0.897 的最佳检测器，在 1% 漏报目标下也需要 >91.8% 人工升级率，证明\"先检测后决策\"在运营上不可行——这正是我们不走检测过滤、而走执行语义授权绑定的实证支撑。引用点在论证链，不在技术细节。", "tags": ["提示注入", "检测天花板", "强制授权"], "added": "2026-10-18"}, {"title": "When Approval Becomes Execution: Authorization-Grounded Workflow Attacks on Tool-Using Agents", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2610.23077", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "攻击者不覆盖策略、而是引导 agent 走完一条局部自洽的审批工作流，用合法申请的 approval token 经 authorized_by 拿到受保护文档（8/9 完成精确目标操作）。", "insight": "执行时授权绑定方向最直接的经验证据：token 持有被当作充分授权，而请求者身份/审批者权限/资源范围/动作类型/业务目的没有被联合强制执行。可与我们的执行语义并列为绑定缺失的第二个实例（我们是检索时绑定，它是执行时绑定），related work 里互补引用。", "tags": ["agent 授权", "执行时绑定", "工作流攻击", "token 上下文"], "added": "2026-10-20"}, {"title": "Agenra: A Language and Verified Core for Stateful LLM Agent Authorization", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2608.22868", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "带 Lean 验证核心的策略语言，处理可消耗权限的状态化授权：用新旧 permission ledger 之间的 simulation 认证权限修订，51 个人工修订上 21/21 通过、30/30 拒绝且全部经 replay 确认。", "insight": "与我们执行语义互补：我们目前是查询时静态策略求值，没有处理授权随执行消耗的动态维度；其 simulation 认证思路可借来论证 AU 划分/策略变更后既有授权语义是否保持（审稿人可能追问的点）。其安全 vs 工作流保持分离的写作范式也值得学。", "tags": ["形式化验证", "状态化授权", "权限修订", "Lean"], "added": "2026-10-20"}, {"title": "Securing LLM-Agent Long-Term Memory Against Poisoning: Non-Malleable, Origin-Bound Authority with Machine-Checked Guarantees", "authors": "Yedidel Louck", "url": "https://doi.org/10.66977/xsci.2610.001o", "venue": "OpenAlex 补录（2026-10-18）", "oneliner": "双独立源背书或显式用户授权的策略，在抽象记忆模型中机器验证了其在允许变换下对任意规模存储保持成立；1152 个受控 episode 中无防御 61/72 被攻陷、有 monitor 后 0/72。", "insight": "origin-bound authority 是执行时授权绑定的雏形：授权证据与来源绑定、随时间保持有效。直接启发：我们的 AU 授权判定目前是查询时的，长期会话/记忆场景下 AU 映射 M(r) 会漂移，其在变换下保持的证明框架可借鉴来论证 AU 划分稳定性；其保守默认与我们未知 AU 默认拒绝可互相印证。", "tags": ["agent 记忆", "投毒防御", "机器验证", "权限绑定"], "added": "2026-10-20"}, {"title": "PP-RAG evaluation package: deterministic privacy controls for retrieval-augmented generation over educational feedback", "authors": "Vassilios S. Verykios、George Vorvilas、Evgenia Paxinou 等", "url": "https://doi.org/10.5281/zenodo.23458295", "venue": "Zenodo 评估包（2026-10-18；配套论文投 Intelligent Decision Technologies）", "oneliner": "PP-RAG 确定性隐私控制的 seeded 完全可复现评估包：PII 检测与匿名化、基于角色的 ACL-filtered retrieval、LLM 前自适应输出控制、最小 cohort-size 阈值，附 span 级 ground truth 合成数据集。", "insight": "与我们思路最接近的现存竞品，必须正面处理：其 ACL-filtered retrieval 是检索时按 ACL 过滤，我们是策略独立存放、查询时逐 AU 求值——差异点正好是我们的核心 claim（策略变更不需重建索引）。评估包可复现，可作为我们补基线对比的候选基准。标记为竞品对比候选。", "tags": ["RAG 隐私", "ACL 过滤", "可复现基准", "竞品"], "added": "2026-10-20"}, {"title": "SpanGuard: Decoupling Instruction Localization from Authorization for Lightweight IPI Defense", "authors": "Yinxiang Wang, Zehua Ma, Kejiang Chen, Weiming Zhang, Han Fang", "url": "https://arxiv.org/abs/2610.26013", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "把 IPI 防御拆成无监督指令定位 + 块级授权判定两步，小模型守卫也能达到 0.32% ASR。", "insight": "与我们 RU/AU 解耦哲学最同构的相关工作：\"定位 vs 授权判定\"分离论证了\"解耦带来轻量化+可验证性\"。它的块级授权判定正是\"执行时逐 AU 求值\"在 IPI 通道的镜像，可在 related work 中并列；0.32% ASR 是\"解耦不牺牲防御强度\"的硬证据。", "tags": ["IPI 防御", "解耦", "授权判定", "轻量守卫"], "added": "2026-10-21"}, {"title": "RAGLeak: Supply-Chain Privacy Backdoors in Retrieval-Augmented Generation", "authors": "Yuchen Chen, Wei Cheng, Yuan Xiao, Junda He, Jieke Shi, PingPing OuYang, Quanjun Zhang, Chunrong Fang, David Lo, Zhenyu Chen", "url": "https://arxiv.org/abs/2610.25937", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "在 RAG 生成器中植入供应链后门：触发时可逆混淆检索到的私密文档，辅助 LLM 高保真恢复，ASR 最高 100%，干净微调不消除。", "insight": "T1/T2/T3 之外的新攻击面：威胁在模型供应链而非检索通道。它动摇了\"生成器可信、风险只在检索与上下文\"的隐含假设——威胁模型章节应明确声明信任边界（生成器供应链在 scope 之外），否则审稿人会质疑 per-view 索引能否挡住被污染的生成器。100% ASR 可引用。", "tags": ["RAG 攻击", "供应链后门", "隐私泄露", "威胁模型"], "added": "2026-10-21"}, {"title": "Memory, Know Your PLACE: Governing Lifecycle State and Query-Time Eligibility in Persistent-Memory Agents", "authors": "Chen-Fang Hu, Hong-Han Shuai, Woan-Shiuan Chien", "url": "https://arxiv.org/abs/2610.25179", "venue": "arXiv cs.AI/cs.CL 预印本（2026-10-18）", "oneliner": "为持久记忆 agent 加可拆卸治理层 PLACE：写侧状态认证 + 读侧授权，读侧治理消除了可测量的因果泄露。", "insight": "\"读侧授权\"是\"查询时逐 AU 求值\"在记忆载体上的实现，其\"消除可测因果泄露\"结论可直接引用论证\"读侧强制有效\"。对执行时授权绑定方向：它的写侧认证+读侧授权双层结构是完整形态，提醒我们\"授权证据随时间保持有效\"需要写侧机制——与 Yedidel Louck 的 origin-bound authority 互相印证。", "tags": ["agent 记忆", "读侧授权", "因果泄露", "执行时绑定"], "added": "2026-10-21"}, {"title": "Auditing the Hand-Written Inputs of Learned Access Control", "authors": "Arsalan Jalil Sarghaleh、Mehdi Hazrati", "url": "https://arxiv.org/abs/2610.31388", "venue": "arXiv 预印本", "oneliner": "审计学得访问控制背后两件手写制品（hard-deny 集合、region map）：5 个 ABAC Lab 策略上穷举检查，忠实转录的 deny 条款不可靠率 0.50–0.70，未经验证上线会误删 16–78% 合法授权。", "insight": "对我们最直接的警示性证据：\"未知 AU 默认拒绝\"的前提是 deny 判定本身 sound，而这篇证明手写 deny 制品在实践中大面积 unsound，失败模式正是\"自然语言作用域 vs 规则析取\"的语义错位。建议在论文 limitation/deployment notes 引用：deny 集合须经穷举 soundness 检查，否则默认拒绝变误删。其\"false-non-grant 与 false-permit 两种损失同时报告\"值得借鉴为三语义评估规范。注：Jev 粗筛 relevance 0.56 未过线，人工终审判定直接相关而收入。", "tags": ["访问控制", "deny 语义", "soundness", "ABAC"], "added": "2026-10-24"}, {"title": "Structured Decomposition for Reliable LLM-Generated Access Control Policies", "authors": "Vatsal Gupta、Darshan Sreenivasamurthy（Apple Inc.）", "url": "https://doi.org/10.1007/978-981-92-6837-5_10", "venue": "ICICS 2026（LNCS vol 17216）", "oneliner": "自然语言访问控制策略 → OPA Rego 可执行代码的模块化流水线（策略检测/组件抽取/schema 校验/lint/编译/自动测试），372 条 ACRE 语句上端到端正确率 50.3%（基线 15.3%，3.3×）。", "insight": "\"LLM 生成访问控制策略\"的扎实工程参照，与我们是上下游互补关系（他们做策略生成可靠性，我们做检索时授权绑定）。deny 语义正确率 87.5% 与 Auditing 一文互相印证：deny 是访问控制最脆弱的一环，正是我们\"未知 AU 默认拒绝\"需形式化保证的 motivation。其\"正反两类测试都通过才算正确\"的严格标准可借鉴为三语义评测准则。注：Jev 粗筛 relevance 0.62 未过线，人工终审判定可引用而收入；代码尚未公开。", "tags": ["策略生成", "OPA/Rego", "policy-as-code", "deny 语义"], "added": "2026-10-24"}, {"title": "Enhancing Large Language Models with External Knowledge Using Retrieval-Augmented Generation: A Critical Review of Retrieval Design, Context Compression, Safety and Evaluation, with a Conceptual Governance-Aware Architecture", "authors": "Auti Pallavi S. 等", "url": "https://doi.org/10.5281/zenodo.23593530", "venue": "Zenodo 预印本综述（2026-10-23）", "oneliner": "RAG 批判性综述：梳理检索设计、压缩、安全与评测的相互作用，提出八层治理感知架构，把 IAM 权限过滤放进 RAG 设计核心。", "insight": "可作我们论文 related work 的治理视角动机引用：它把 IAM-based permission filtering 列为 RAG 设计的一等要素，并点明访问控制放在 LLM 之外执行只在显式信任假设下成立——这正是我们把信任假设形式化为逐 AU 求值与未知默认拒绝的动机。但注意边界：这是未经同行评审的综述、无新实验，八层架构未经验证，只能作背景/动机引用，不能作证据引用。", "tags": ["RAG 治理", "IAM 权限过滤", "综述"], "added": "2026-10-25"}, {"title": "An Efficient Privacy-Preserving Retrieval Scheme for Cloud-Based Retrieval-Augmented Generation", "authors": "Yuan Chang 等", "url": "https://doi.org/10.1109/TCCN.2026.3705821", "venue": "IEEE Transactions on Cognitive Communications and Networking（2026）", "oneliner": "云端 RAG 隐私检索 ShieldRAG：局部敏感哈希分桶 + 内积函数加密，云端看不到查询内容与文档访问模式，延迟 <0.5 秒、top-5 召回约 90%。", "insight": "与我们 embedding 通道一节可比但角度不同：我们防“结果里混进未授权内容”，ShieldRAG 防“云端从查询与访问模式反推隐私”，即 T2/T3 里服务器方观察者分支；可量化对照点是隐私不必以检索不可用为代价，但摘要未给明文基线精度损失与密钥管理成本，不宜写成已解决问题。", "tags": ["隐私检索", "函数加密", "云端 RAG"], "added": "2026-11-02"}, {"title": "RevBench: code, scenarios, run logs and judgments for enforcing mid-task permission revocation in AI agents", "authors": "Martin Ignatovski", "url": "https://doi.org/10.5281/zenodo.23854359", "venue": "Zenodo 软件与数据存档（配套论文 Revoking Access Does Not Revoke Knowledge）", "oneliner": "任务中途撤销权限的基准：逐调用授权 720 轮失败 57.9%，撤销发生在数据送达后失败率升至 72.8%，选择性重放+清单级溯源降至 21.0%。", "insight": "补上 AU 求值未单列的一维：授权的生命周期。我们的覆盖映射回答查询时某内容属不属于你，RevBench 回答此前已授权、此刻已撤销的内容在上下文、草稿与记忆里的残留如何清除；其清单级溯源与 M(r) 同源，讨论节可用 57.9%/72.8% 说明只在读取时设卡不够。标注证据边界：自建模拟平台 + LLM 评判，非真实 SaaS 实测。", "tags": ["权限撤销", "agent 授权", "残留知识", "基准"], "added": "2026-11-03"}, {"title": "IAMRAGBENCH: Benchmarking Authorization Expansions in LLM-Generated AWS IAM Policies under RAG Poisoning", "authors": "Hasan Kaplan 等", "url": "https://arxiv.org/abs/2611.03431v1", "venue": "arXiv:2611.03431v1 (2026)", "oneliner": "RAG 投毒攻击 IAM 策略生成的基准：投毒上下文诱使模型生成提供商校验通过、但超出可信授权需求的策略，60 案例、确定性授权包络评分。", "insight": "与 RU/AU 框架最直接的新证据：其“授权包络”即生成侧的 AU 求值——先划可信授权需求的线，再逐条判定生成物是否越线；“架构例外”包装下攻击率 63.79% 说明判定位置（何时判、由谁判）比规则本身更脆弱，呼应“查询时逐 AU 求值、未知 AU 默认拒绝”。另注意 CheckNoNewAccess 漏报 4 例：形式校验不能替代包络语义校验。引用时标注 arXiv 预印本、自建基准。", "tags": ["RAG 投毒", "授权扩张", "IAM 策略", "基准"], "added": "2026-11-04"}, {"title": "SearchInject: Retrieval Exposure Control for Indirect Prompt Injection in Language-Model Search", "authors": "Kainan Zhou 等", "url": "https://arxiv.org/abs/2611.02643v1", "venue": "arXiv:2611.02643v1 (2026)", "oneliner": "间接提示注入的检索层准入关：用相关性、搜索滥用信号与指令可能性联合打分隔离可疑候选，top-10 目标暴露率相对下降约 83%，干净检索质量几乎无损。", "insight": "与 retrieve-then-project 构成两道关对照：准入关挡“看起来像指令的页面”，授权关挡“不属于你的片段”，两者叠加才完整；其 nDCG@10 最大变化仅 0.0018 说明准入控制代价可以很小。引用时不要把“暴露率下降 83%”写成“攻击成功率下降 83%”（104 例跟进无法估计后者），且评估为家族内泛化。", "tags": ["间接提示注入", "检索准入", "隔离", "搜索增强"], "added": "2026-11-04"}, {"title": "Governed Retrieval Augmented Generation with Guardrails Role Based Access Control and Audit Logging", "authors": "Lohith Reddy Kalluru", "url": "https://doi.org/10.21275/sr261031123753", "venue": "International Journal of Science and Research（2026-11-04）", "oneliner": "企业 RAG 权限治理实测：只靠索引层过滤时角色撤销后 99.5% 的查询仍泄漏未授权上下文，加一道查询时权限复核后违规归零。", "insight": "把我们“策略独立存放、查询时逐 AU 求值”的主张变成了可引用的数字：99.5% 是“权限变了、索引没跟上”这一失效模式的直接证据；其“当前权限复核”与我们的查询时求值同构，可在 related work 里互相印证。引用时须写清三点限制：SQLite FTS5 合成诊断、无 LLM、无真实语料；IJSR 为低门槛期刊；只覆盖角色/文档撤销两类变化，未覆盖 T2/T3 攻击面。", "tags": ["RAG 授权", "RBAC", "权限撤销", "查询时复核"], "added": "2026-11-06"}, {"title": "Rag n' Roll: A Framework to Evaluate Indirect Prompt Manipulation Attacks against RAG-based Applications", "authors": "Gianluca De Stefano 等", "url": "https://doi.org/10.1145/3847352.3848095", "venue": "ACM Workshop on Artificial Intelligence and Security (AISec 2026)", "oneliner": "RAG 间接提示操纵评估框架：默认配置下攻击可控制高达 70% 的生成答案，而既有评估方法会系统性高估攻击成功率。", "insight": "给 RU/AU 论文一个可引用的攻击面数字：默认配置 70% 答案可被操纵，且效果高度依赖流水线参数——注入文档一旦进了检索集，文本层面的防御就拦不住，只有在检索/授权边界上卡住才行，与我们“授权判定在检索结果进上下文前由架构保证”同构。方法论提醒：我们的 cloze 攻击 89.4%@20 与重编码后 4.05% 的对比也应写清评估口径（检索配置、k 值、判定标准），否则同样会被质疑可比性。引用须写清 70% 为默认配置最高值。", "tags": ["RAG 安全", "间接提示注入", "评估框架", "AISec"], "added": "2026-11-11"}, {"title": "Isolation Is Not Confidentiality: Security Boundaries of Geometric Access Control in RAG", "authors": "Steve Nouyep 等", "url": "https://arxiv.org/abs/2611.14061", "venue": "arXiv 预印本（cs.CR，2026-11-10）", "oneliner": "几何访问控制保住了检索效用与策略隔离，却保不住表示机密性：几百对对齐向量即可恢复原始 embedding，策略相关几何还会泄露成员关系。", "insight": "把“隔离≠机密性”形式化成四个可分开检验的目标（隔离/机密性/抗伪造/成员隐藏），直接支撑我们论文的 embedding 通道论证：全文 embedding 索引下 cloze 攻击 89.4%@20、按授权视图重编码后 4.05% 的对比，恰好是“隔离成立、机密性仍失效”的实证。它的对齐样本恢复攻击与我们的 T2（可见排序向量）同构；策略成员隐藏是我们尚未显式处理的风险点，per-view 索引方案应说明是否覆盖这一层。引用须写清结论出自作者评估的公开实现与三个编码器。", "tags": ["RAG 访问控制", "几何变换", "embedding 泄露", "策略隔离"], "added": "2026-11-12"}, {"title": "Fail-Closed Authorization for Tool-Using AI Agents: A Capability Contract and Case Study", "authors": "Andrey Lesnikov", "url": "https://doi.org/10.21203/rs.3.rs-11676427/v1", "venue": "预印本（Research Square，单作者）", "oneliner": "默认拒绝的执行前授权门 ASC：工具目录 SHA-256 锁定、高危工具须带外批准、所有错误路径收敛到 BLOCK；60 例对抗探针放行攻击 32→1，代价是 3 个良性误拦。", "insight": "与 ChainBind 的执行时授权绑定同线互补：它的 fail-closed 姿态（未知即拒绝、错误即拒绝）与我们的“未知 AU 默认拒绝”一致，可并列引用；它给出的误拦代价（严格参数规则拦掉 94/97 良性任务）是“绑定越严、效用越低”的量化证据，应与我们 E12 的良性效用并排讨论；其 JSON 证据信封（每次裁决带完整性校验）是裁决审计记录的可借鉴机制。引用须写清评估只用静态录制轨迹、未跑 live agent，66 场景语料为作者自建。", "tags": ["执行时授权", "fail-closed", "MCP", "批准绑定"], "added": "2026-11-12"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica 等 4 人", "url": "https://arxiv.org/abs/2610.01871", "venue": "arXiv:2610.01871 (2026)", "oneliner": "针对返回图像的多模态 RAG 的黑盒自适应数据抽取攻击：影子图像混合+相关性加权重采样，单次 2500 查询重构 611 张放射影像，抽取条目数达非自适应基线的 5.6 倍。", "insight": "embedding 通道攻击线的最强邻居：我们的 A1 是文本完形攻击（89.4%@20），它是多模态、图像返回配置下的自适应抽取，说明向量索引的通道问题在跨模态场景同样成立且可被放大。可在 T2 威胁模型一节引用为最具体的实证；其\"重构出的不同条目数\"可借鉴为 embedding 泄露的度量。它不涉及授权语义（任何用户可查），防御侧无直接给出，但把\"embedding 索引必须被授权视图切分\"的论证推得更强——正是 per-view 索引的动机。", "tags": ["embedding 泄露", "数据抽取", "多模态 RAG", "攻击"], "added": "2026-10-03"}, {"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}, {"title": "Erased, but Not Gone: Output Forgetting Is Not True Forgetting", "authors": "Teresa Pui Yee Yong、Win Kent Ong、Chee Seng Chan", "url": "https://arxiv.org/abs/2606.25001", "venue": "arXiv 预印本（cs.AI）", "oneliner": "以“不含遗忘数据从零重训的模型群体”为理想遗忘参照，证明输出层遗忘指标系统性高估真遗忘：表征空间留着沿重训相关方向的结构化残差，relearning 攻击可恢复信息。", "insight": "与我们 embedding 通道泄露故事同构的“表面删除≠真删除”：它研究训练数据遗忘，我们研究检索内容授权，失效模式一致。可在论文动机/相关工作里并置引用（我们的 cloze 89.4%@20 与它的“输出指标系统性高估”互为佐证）。对 RU/AU 撤销机制的直接警示：AU 权限撤销后旧 embedding 向量若仍在索引里就是它的“结构化残差”——撤销评估必须做表征层一致性检查，不能只看输出层。", "tags": ["机器遗忘", "表征残差", "评估方法"], "added": "2026-10-13"}, {"title": "Residual Privacy Leakage after Output Scrubbing in Tool-Using LLM Agents under Indirect Prompt Injection", "authors": "Kashvi Gupta", "url": "https://doi.org/10.21203/rs.3.rs-11428254/v1", "venue": "Research Square preprint", "oneliner": "oracle 级事后输出清洗也清不干净：间接注入导致的隐私泄露经逐字+3-token 片段删除后，残留率仍达 61.2%/62.1%，幸存者主要是语义改写。", "insight": "用硬数字回答了我们论文的核心设计问题——为什么不用事后过滤而做检索时/索引时授权绑定：模型接触数据后，有限跨度的精确值清洗结构性失效（连 oracle 级都救不回来），唯一清零的是接触前的 pre-context-removal。其 57% 人工重判残留率可直接引用作 NLI 残留检查必须做到语义级的 motivation 数据。", "tags": ["事后清洗", "间接注入", "残留泄露", "接触前防御"], "added": "2026-10-23"}, {"title": "Privacy-Preserving Retrieval from Redacted Corpora: Effects of Retrieval Paradigm and Relevance Definition", "authors": "Yoshiyuki Sakamaki 等", "url": "https://doi.org/10.1007/978-3-032-37676-3_10", "venue": "ECML PKDD 2026（LNCS vol 16947）", "oneliner": "RAG 语料先脱敏再检索：BM25 在脱敏下保持稳健，稠密检索与 ColBERT 出现有统计支撑的退化；脱敏代价取决于检索范式与相关性定义。", "insight": "与我们的 retrieve-then-project 语义直接对照：按 AU 裁剪与按 PII 脱敏面临同一权衡，损失不是均匀的——评估裁剪语义时应分检索范式报告效用损失；脱敏与授权过滤可互补，但叠加损失需单独度量。实验基于 Text Anonymization Benchmark 单一基准，外推到真实企业语料需谨慎。", "tags": ["RAG 隐私", "脱敏检索", "BM25", "检索范式"], "added": "2026-11-06"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Permission Withdrawal in Tool-Using Language Model Agents: Runtime Enforcement and Recovery", "authors": "Gaurav Chaulagain、Medhavee Upadhyaya", "url": "https://doi.org/10.54536/ajdsai.v2i2.8776", "venue": "American Journal of Data Science and Artificial Intelligence", "oneliner": "用户中途收紧权限后，tool-using agent 是否还会执行已被撤回的操作：轨迹级授权问题与运行时门的对照实证。", "insight": "执行时授权绑定（方向 2）在行动层的直接对照：prompt-only 真的执行了被禁写操作，规则门零漏放、模型门 3 次误放且仅因资源不存在未遂。其五阶段可复现评测框架（提议/门决策/派发/状态转移/有用完成）值得借鉴为我们三语义评测的拆分方式，避免最终状态指标掩盖授权失败。限定：确定性模拟环境、期刊影响力有限，引用时标注受控环境实证。", "tags": ["agent 授权", "权限撤回", "运行时门", "轨迹级评测"], "added": "2026-10-26"}, {"title": "Act on Your Behalf, Beyond Your Authorization: Benchmarking LLM Agent Authorization Alignment", "authors": "Zhiping Zhang、Franklin Mingzhe Li、Zihao Huang 等", "url": "https://arxiv.org/abs/2610.27548", "venue": "arXiv 预印本", "oneliner": "发布 AuthorizationBench：286 个可执行任务、6,864 条轨迹，agent 在 19.2% 的轨迹中超出用户授权范围行动；任务完成不等于授权合规。", "insight": "agent 授权对齐方向第一个大规模实证基准，可引用作 motivation 数据（19.2% 越权率、加大推理力度不降低违规率）。维度区分：它测的是行动授权（delegation scope），我们做的是数据授权（AU 求值），related work 里应明确区分。其授权感知沙箱（授权内外路径均可执行可观测）是评估执行时授权绑定的现成实验装置。", "tags": ["benchmark", "agent 授权", "越权评测"], "added": "2026-10-22"}, {"title": "Package Hallucination Attacks on Coding Agents through Prompt Injection in Rule Files", "authors": "Yupu Wang、Zhengyuan Jiang、Reachal Wang、Neil Zhenqiang Gong（杜克大学）", "url": "https://arxiv.org/abs/2610.09264v1", "venue": "arXiv 预印本（cs.CR/cs.AI）", "oneliner": "提出 package hallucination 攻击：向社区共享的规则文件（AGENTS.md/.cursorrules）注入恶意提示，诱导编码智能体把合法依赖替换为攻击者控制的包；配套进化优化框架 PackHallu 构造注入提示，多 benchmark/多模型/多框架高成功率且迁移性强。", "insight": "攻击面弹药：这是一类'供应链式间接提示注入'——恶意内容不在检索语料里，而在智能体启动即加载的规则文件里。提示我们 agent 线探索应把规则文件/skill 文件视为与检索语料同等地位的不可信输入，tool-use 授权需覆盖'配置型上下文'。纯攻击论文、无防御构造，威胁模型章节一句话引用即可。", "tags": ["提示注入", "编码智能体", "供应链攻击", "规则文件"], "added": "2026-10-09"}, {"title": "VeriChainSim: Verifiable Evidence-Chain Simulation for LLM-Based Multi-agent Authorization in Aerospace Trusted Data Spaces", "authors": "G. E. Huiling、Zhiguo Shi（通讯）、Yungui Nie（北京科技大学）", "url": "https://doi.org/10.1007/978-981-92-5712-6_34", "venue": "Springer CCIS vol. 3155（CSC 2026 会议论文集章节）", "oneliner": "把 LLM 智能体的每次授权决策绑定到类型化证据指针（目录记录、策略标识、合同条款、会话绑定、证明对象），token 激活前由外部验证器对照可信状态注册表校验。", "insight": "实现了我们只在目标里写了的性质：对畸形证据 fail-closed（存在性/完整性/范围/会话一致性任一不过即拒绝）。与我们的 retrieve-then-project 同属'授权决策前置校验 + 失败降级'家族，但路径不同（中心化外部验证器 vs 查询时逐 AU 求值），可在相关工作/讨论章节并列引用。局限：航空航天专用场景、仿真评估，威胁模型未分层。", "tags": ["智能体授权", "证据链", "fail-closed", "可审计性"], "added": "2026-10-09"}, {"title": "Agents in Disguise - Weaknesses in Authentication and Authorization in Public AI Ecosystems", "authors": "Jan Stanek, Lukas Kencl", "url": "https://doi.org/10.1007/978-3-032-38702-8_15", "venue": "Lecture notes in computer science (2026)", "oneliner": "系统实测 MCP 等开放 AI 生态与协议中的认证授权现状：agent 身份缺失、弱认证泛滥、授权可选或逻辑损坏，并给出改进方向。", "insight": "直接相关 agent 授权线：它点出了我们主论文的一个隐含假设——RU/AU 框架的 P(a,u) 默认授权主体 u 已认证可信，而开放生态中 u 的认证本身仍未解决。可在威胁模型/讨论章节引用作边界声明：AU 框架解决已认证主体对内容的细粒度授权，主体身份可信需下层认证机制支撑。附带价值：引用链可顺藤摸瓜到 NIST NCCoE agent 身份概念文件与 mcpanalysis 分析工具。", "tags": ["agent 授权", "认证", "MCP", "开放生态", "实测"], "added": "2026-10-08"}, {"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "venue": "ACM (2026)", "oneliner": "用 capability-scoped 权限模型重构 coding agent 工具沙箱：工具调用须持有显式能力令牌，命名资源≠被授权操作，架构层面切断间接 prompt injection 的执行通道", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的执行语义哲学同构——都是把\"能说出名字/能检索到\"从隐含授权中剥离。差异在于粒度：它是工具调用级 capability，我们是检索内容级 AU。适合 Related Work 的 Agent 线引用，作为显式授权能力模型的独立佐证；两者交叉可作 future work 一笔。", "tags": ["agent 安全", "capability 模型", "prompt injection", "授权执行"], "added": "2026-10-04"}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang 等 5 人", "url": "https://arxiv.org/abs/2610.01508", "venue": "arXiv:2610.01508 (2026)", "oneliner": "研究工具调用 agent 的\"主动越权\"：8 个隐私敏感域的确定性 benchmark，7 个模型全部超授权范围；SelfAudit 零样本推理时自检把隐私向越权降低 43%。", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计。\"越权来自结构性决策倾向而非解码随机性\"的结论与我们\"保守子句切分器\"的直觉相通——授权边界应由机制保证而非模型自觉；SelfAudit 仍是模型自己审计自己（启发式），我们的确定性求值 P(a,u) 是更彻底的路线，可在 Discussion 对照。注意它是动作侧授权，我们是数据侧，不竞争。", "tags": ["Agent 授权", "越权", "benchmark"], "added": "2026-10-03"}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang 等 7 人", "url": "https://arxiv.org/abs/2610.00371", "venue": "arXiv:2610.00371 (2026)", "oneliner": "提出 authorization-paired evaluation（拦住禁用用途+完成授权用途为联合成功标准）与 FlowReview 框架（对象解析+权限排序+确定性执行），组合审查把 denied-commit 率从 86.0% 降到 0 且授权供给无损失。", "insight": "核心命题\"对象身份与权限必须通过输出可验证的组件与执行保持连接\"与我们的\"chunk 只存 M(r)、查询时逐 AU 求值\"同构——都反对权限是附在数据上的静态标签。它的\"联合成功标准\"值得借鉴：我们评估以安全侧为主，未来可加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）提示我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"，与 KG 路径切割一节可呼应。", "tags": ["Agent 授权", "组合安全", "评估方法"], "added": "2026-10-03"}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}, {"title": "Compromise Is Not Consequence: Evaluating Task-Scoped Authorization in LLM Agents with Paired Replay", "authors": "Tural Hagverdiyev", "url": "https://arxiv.org/abs/2610.05840", "venue": "arXiv:2610.05840 (2026)", "oneliner": "paired-replay 测试台量化任务范围授权对提示注入后工具执行的遏制：broad bearer 攻击后执行率 8.9–37.8%，scoped JWT / sender-constrained / OPA 三种限定条件全部为零。", "insight": "与我们 AU 授权单元同属\"授权原子单位\"家族的同行实证，粒度不同（按任务限定凭证 scope vs 按内容划分 AU）但哲学一致。核心结论\"The policy changes execution, not the frozen model decision\"与我们的 retrieve-then-project 执行语义形成跨域互证：安全寄托在执行层裁剪而非模型自觉。局限：测的是遏制非预防；AgentDojo 扩展样本小。可在执行语义/威胁模型章节引用作 RAG 侧 AU 求值 vs Agent 侧 task-scoped 的对照。", "tags": ["agent authorization", "scoped credentials", "paired-replay", "执行语义对照"], "added": "2026-10-07"}, {"title": "Can CaMeLs Talk? Securing Multi-Agent Systems Against Indirect Prompt Injection Attacks", "authors": "James Peters-Gill, Avi Semler, Henning Bartsch, Ilia Shumailov, Christian Schroeder de Witt", "url": "https://arxiv.org/abs/2610.05640", "venue": "arXiv:2610.05640 (2026)", "oneliner": "证明单智能体 CaMeL 安全保证在分层多智能体系统中不组合（不可信数据可被下游重新解释为可信输入），提出保持 provenance 的 multi-CaMeL 协议，把攻击成功率从 12.9% 降至 0.0%。", "insight": "攻击面在我们 T1/T2/T3 之外的新维度——组合性：每个单元各自安全，跨边界组合仍可被绕过，恰是我们 embedding 通道\"边界重解释\"问题的多智能体版本。对我们论文的直接影响：per-view 索引目前只论证单系统内隔离，若未来扩展到多智能体 RAG，视图隔离的组合性需单独证明——诚实的未来工作点，可在局限段引用此文佐证。当前 claim 不受动摇。", "tags": ["多智能体安全", "组合性", "CaMeL", "威胁模型扩展"], "added": "2026-10-07"}, {"title": "Semantic Privilege Collapse: Trust Boundaries and Execution-Level Authorization in Agentic AI Systems", "authors": "Narnaiezzsshaa Truong", "url": "https://doi.org/10.5281/zenodo.23285357", "venue": "Zenodo 预印本（OpenAlex 扩展源）", "oneliner": "提出“语义权限坍缩”概念：任务数据或授权不足的指令经模型解释被提升为实际动作权限；主张授权绑定在执行时而非读取/检索时，信任边界必须在执行流水线中显式存在。", "insight": "与我们独立主线方向2（执行时授权绑定）直接对话的概念级文献。它的“数据→动作权限坍缩”是 T1/T2/T3 之外的攻击面（我们管“读”，它管“做”）；“执行时重新求值”与我们“查询时逐 AU 计算 P(a,u)”共享同一哲学——反对一次性授权、后续信任传递。援引的 capability-oriented control 与 AU 本质（逐 AU 授权 = 逐能力持有）可对齐，为两条主线的理论接口提供概念桥。局限必须标注：单作者、Zenodo note、无实证数字、0 引用，只能作概念锚点，不能作经验证据；且未形式化执行时判定的语义——正是我们能贡献的形式化增量。", "tags": ["执行时授权", "权限坍缩", "概念锚点"], "added": "2026-10-12"}, {"title": "LLMail-Inject: A Dataset from a Realistic Adaptive Prompt Injection Challenge", "authors": "Sahar Abdelnabi、Aideen Fay、Ahmed Salem 等", "url": "https://arxiv.org/abs/2506.09956", "venue": "arXiv 预印本（cs.CR）", "oneliner": "20.8 万条真人红队撰写的间接提示注入攻击，评估“检索→绕防御→触发未授权工具调用”完整攻击链：Meta SecAlign 仍 32% ASR、GPT-4o 58%、GPT-5 mini 47%，旧基准已饱和而它没有。", "insight": "与我们两条主线都对话的攻击侧基准：攻击链恰好横跨检索层授权（retrieve-then-project）与执行层授权（方向2），其 28–45% 的跨域迁移 ASR 是论证“仅做检索侧裁剪不够”的有力数字；引用它的“旧基准饱和论”可为防御评估选用高强度基准背书。注意它的“未授权”指任务目标被篡改、非用户权限不足，引用时需注明。", "tags": ["提示注入", "评测基准", "agent 安全"], "added": "2026-10-13"}, {"title": "Designing for Doubt: The Case for Informed Abstention in Autonomous Agents", "authors": "Victor Ojewale、Suresh Venkatasubramanian", "url": "https://doi.org/10.1609/aies.v9i3.43281", "venue": "AAAI/ACM AIES 2026", "oneliner": "诊断 agent 评测的合规偏置（只奖“做完”不奖“该停就停”），提出“知情弃权”：缺输入/证据/授权时阻断下一次工具调用；144 场景评测中危险动作阻断率 87.5–91%、授权场景可用性 75–92%。", "insight": "方向2（执行时授权绑定）最强的同盟文献之一：“缺授权→结构化暂停+阻断工具调用”正是执行时授权绑定的 fail-closed 降级语义；“危险动作阻断率/授权场景可用性”双指标可直接复用为我们评估执行时绑定的指标对；runtime enforcement + auditable trace 与“查询时逐 AU 求值+审计日志”架构同构。差异点：它的弃权是 agent 自主判断，我们是外部策略求值 P(a,u)——两篇论文可互相引用。注意：AIES 为伦理社会会议、初步评测仅 144 场景，引用时如实标注。", "tags": ["执行时授权", "agent 安全", "评估方法"], "added": "2026-10-13"}, {"title": "Kairos: Transactional Security Enforcement at the System Boundary for LLM Agents", "authors": "Kristoffer Hempel、Nils Loose、Lorenzo Cavallaro、Thomas Eisenbarth", "url": "https://arxiv.org/abs/2610.18457", "venue": "arXiv 预印本（cs.CR/cs.LG，2026-10-13）", "oneliner": "不改造 agent 本体，在系统隔离边界做 reference monitor：tool call/shell/脚本越界一律视为文件与网络操作；声明式策略定可信来源，判不定的挂起、agent 推测执行，权限受限的决策预言机按完整 trace 逐条裁决；AgentDojo 攻击成功率 47.0%→2.7%，良性效用不降。", "insight": "agent 访问控制主线（执行时授权绑定方向）的直接平行工作。它的\"挂起+推测执行+事后按 trace 裁决\"是一种延迟绑定授权：授权不在 action 发起时、而在效果提交前基于完整证据做——与我们 RAG 侧\"检索时逐 AU 求值、执行语义层再裁决\"同构，可互引为延迟授权绑定的两个实例（agent 执行 vs RAG 检索）。AgentDojo 47.0%→2.7% 是可引用的 agent 侧授权机制实证上界。注意它不处理检索授权，与主论文是平行关系而非直接对比。", "tags": ["agent 授权", "延迟绑定", "reference monitor", "AgentDojo"], "added": "2026-10-15"}, {"title": "The Agent Knew: Internal States Forecast Unauthorized Actions and Stop Them, and the Lies That Follow", "authors": "Arya Fayyazi、Mehdi Kamal、Massoud Pedram", "url": "https://arxiv.org/abs/2610.17301", "venue": "arXiv 预印本（cs.AI，2026-10-12）", "oneliner": "Agent 越权行为可在行动前被残差流线性探针预测（AUROC 0.94）；预测门控把 Gemma-4 越权率从 0.70 降到 0.09，任务完成率保持 1.00；阻止越权也是阻止事后撒谎的最可靠方式。", "insight": "agent 访问控制主线（执行时授权绑定方向）的直接证据：授权判定点从\"action 发起时\"前移到\"内部状态可预测时\"，与 Kairos 的延迟绑定形成一前一后两种授权绑定点位，可互引。CAPE-Bench 的\"单事实决定授权与
