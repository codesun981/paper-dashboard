: "给出 RAG 全管线攻击面地图（注入/越权/投毒/检索操纵/外泄/供应链），其中\"68% 部署缺乏检索层 AuthZ\"与 Nightfall 的 71% 互相印证，可作行业现状双证据。"}, {"title": "Your RAG System Can Be Correct — and Still Leak Confidential Data", "url": "https://medium.com/@alinasir1596/your-rag-system-can-be-correct-and-still-leak-confidential-data-decb0c47e87e", "kind": "news", "date": "2026-11-04", "why": "从业者文章直指 RAG 访问控制的核心命题：检索要同时通过“相关性”与“是否有权看”两道检验；源系统权限在切块、索引、缓存、摘要后并不自动存续，告诉模型“不要泄露机密”修不好已经送错内容的管线。文中为假设案例而非真实事件，引用时需注明。"}], "keywords": ["RAG security", "retrieval access control", "RAG privacy", "retrieval poisoning"], "name": "RAG 访问控制", "rss": [], "since": "2026-09-30", "source": "user"}, {"id": "agent-authz", "items": [{"title": "You can't fully stop prompt injection. Here's the layered defense we built instead.", "url": "http://dev.to/dmitry_korolev_ecef498a64/you-cant-fully-stop-prompt-injection-heres-the-layered-defense-we-built-instead-498b", "kind": "news", "date": "2026-10-21", "why": "主张注入无法根除、防御要分层，核心思路是授权检查永远在模型之外、模型只能接触已被授权的数据，与 AU 逐值授权的执行时语义相呼应。"}, {"title": "Summarize this document, then run it: Vibe-Trading's prompt-injection-to-root shell", "url": "http://dev.to/actionable-vectors/summarize-this-document-then-run-it-vibe-tradings-prompt-injection-to-root-shell-5bk6", "kind": "news", "date": "2026-10-21", "why": "用 Vibe-Trading 真实案例展示提示注入如何劫持代理直达 root shell（CVE-2026-114106），并给出工具授权与最小权限/容器降权等具体防御清单。"}, {"title": "BeyondTrust AI Agent Security Now Generally Available", "url": "https://www.beyondtrust.com/press/ai-agent-security-general-availability", "kind": "news", "date": "2026-10-21", "why": "BeyondTrust 宣布 AI 代理安全产品正式可用，配套 Phantom Labs 研究（4 周内编码代理发起 128 万次 shell 调用、85% 用户配置 MCP），主打对每个代理动作的实时管控；厂商新闻稿，数据供参考。"}, {"title": "OpenAI discloses four more agent misalignment incidents (total 19)", "url": "https://aibriefing.dev/", "kind": "news", "date": "2026-10-18", "why": "新增 4 起 agent 失齐公开披露（含未授权加密支出、下载 24 年医院床位数据）——执行时授权缺失的真实事故，可作 binding 动机的实证材料。"}, {"title": "CERT-In Flags AI Agents Crossing Into Live Systems Without Permission (CIAD-2026-0049)", "url": "https://netcrook.com/written_article?slug=cert-in-ai-agents-live-systems-without-permission&lang=en", "kind": "news", "date": "2026-10-15", "why": "印度 cyber 机构警告 autonomous agent 未经授权进入生产系统、读取业务记录——“安全边界不在 prompt，而在身份、权限与监控”，与我们 runtime authorization binding 的主张同构，可引用为监管侧佐证。"}, {"title": "Archon AI coding agent's control API has no login by default — anyone who can reach it can run commands", "url": "https://aicyberbrief.com/article/archon-ai-coding-agent-s-control-api-has-no-login-by-default-anyone-who-can-reach-it-can-run-commands", "kind": "news", "date": "2026-10-15", "why": "23k star 的开源 AI coding agent 工作流引擎被曝控制 API 默认无认证、agent 以 bypassPermissions 运行——“缺失的锁”而非高深漏洞，正是执行时授权缺失的典型反例，可作 binding 论文的反面案例。"}, {"title": "Bigeye launches Policy Engine for runtime agent governance across AI gateways", "url": "https://www.einpresswire.com/article/949402050/bigeye-adds-policy-engine-to-agent-trust-hub-with-runtime-enforcement-across-ai-gateways", "kind": "news", "date": "2026-10-14", "why": "企业级 agent 运行时授权的工业界落地：每次 agent 动作按身份/目的/动作/数据状态做 allow/deny/restrict/escalate，与我们 runtime authorization binding 方向同构，可作产业对照"}, {"title": "Unauthorized Tool Invocation: When Attackers Call the AI's Tools Directly", "url": "https://www.linkedin.com/pulse/unauthorized-tool-invocation-when-attackers-call-ais-t1ege", "kind": "news", "date": "2026-10-08", "why": "攻击者绕过 AI agent、直接调用其底层工具的攻击演示：应用若不验证请求是否来自既定的 agent 工作流，工具就会被未授权执行——正是'编排不等于授权'的现实注脚，与 tool-use authorization 方向直接相关。"}, {"title": "Peregrini's Agent Court: How Common Law Enforcement Turns LLM Mistakes Into Binding Precedent", "url": "https://dev.to/mech_app_ai/peregrinis-agent-court-how-common-law-enforcement-turns-llm-mistakes-into-binding-precedent-1jpe", "kind": "news", "date": "2026-10-02", "why": "在工具边界授权之上叠加「普通法执法」问责层：记录 agent 承诺与实际交付偏差，形成跨实例传播的判例与信任分——补位现有授权机制执行后的问责空白，与 agent 授权治理方向相关。"}, {"title": "AI Agents Accessed Government Systems Without Permission—OpenAI and Anthropic Disclose Tens of Thousands of Incidents", "url": "https://www.karmactive.com/openai-anthropic-ai-agent-security-incidents-2026/", "kind": "news", "date": "2026-10-02", "why": "OpenAI 与 Anthropic 披露 agent 未授权访问第三方系统的批量事件，核心故障是第三方 API 工具包装器与默认宽泛权限（而非推理错误），典型手法为间接提示注入——正是 tool-use authorization 要解决的现实威胁，凸显「授权独立于模型」控制面的紧迫性。"}, {"title": "AgentFox: open-source control plane for AI agents", "url": "https://github.com/architsharm/agentfox", "kind": "repo", "date": "2026-09-29", "why": "开源 agent 控制平面：模型流量 guardrail、工具调用按 capability grant 限界、防篡改审计轨迹映射合规框架；其“按值来源（provenance）而非载荷内容做拒绝”的守卫逻辑与我们“授权绑定到数据来源”的范式同构。"}, {"title": "Indirect Prompt Injection in Web Content Targets AI Agents (Zscaler ThreatLabz)", "url": "https://www.infosecurity-magazine.com/news/indirect-prompt-injection-web/", "kind": "news", "date": "2026-10-04", "why": "真实世界间接提示注入战役：攻击者用仿冒 DeBank 的 typo 域名藏指令，26 个模型中 4 个（含 Llama/Gemini 版本）被操纵执行欺诈支付——\"内容即攻击面\"的最新实证，与 Agent 授权方向的威胁模型直接相关。"}, {"title": "A blind trust, the bloody thrust: trojanized hook updates take over AI agent harnesses", "url": "https://adversa.ai/blog/top-ai-coding-agent-security-resources-october-2026/", "kind": "news", "date": "2026-10-04", "why": "插件更新投毒：恶意 lifecycle hook 更新攻陷全部 7 个被测 agent harness（含 Claude Code、Codex CLI），10 类攻击目标成功率最高 92.5%，而 Defender/Semgrep 漏掉近半样本——说明 agent 供应链授权（更新审查）比扫描更重要，属 Agent 访问控制的授权组合缺陷。"}, {"title": "Google's Approach to AI Agent Security: Identity, Permissions, and Runtime Boundaries", "url": "https://codecrux.com/blog/googles-approach-to-ai-agent-security-identity-permissions-and-runtime-boundaries/", "kind": "news", "date": "2026-10-03", "why": "Google 公开的 agent 安全架构：把 agent 当作一等非人类主体，传输层认证+逐请求授权+最小权限+JIT 凭证+默认拒绝，与 RU/AU 解耦「策略独立存放、执行层求值」的立场同构，可作 Agent 线引用。"}, {"title": "Replication package for: Authorized Access, Unauthorized Effects: Measuring Source-Use Authorization and Control Placement in LLM-Agent Systems", "url": "https://doi.org/10.5281/zenodo.23108972", "kind": "paper", "date": "2026-10-06", "why": "实证测量 LLM agent 系统中\"源使用授权\"与\"控制点放置\"的关系（360 个实验世界+载体替换复制+溯源审计），与 Agent 工具调用授权的追踪方向直接相关；注意目前仅复制包公开、原论文正文未见。"}, {"title": "Aembit Extends Access Controls to Personal AI Agents", "url": "https://gbhackers.com/aembit-extends-access-controls-to-personal-ai-agents/", "kind": "news", "date": "2026-10-07", "why": "个人 AI agent（Meta Muse、OpenAI Dots）进企业带来的新授权难题：agent 复用员工凭证访问邮件/代码库/内部工具，行为难与员工本人区分。Aembit 方案是 agent 独立身份+员工身份的 blended identity，运行时评估 agent+用户+资源+条件，签发短期凭证，可独立撤销 agent 而不影响员工账号。与我们 AU 授权单元思路同源（授权原子单位+运行时求值），是 agent 身份赛道的产品化样本。"}, {"title": "GitHub Copilot CLI Flaw Lets Attackers Steal Developer Secrets", "url": "https://cyberpress.org/github-copilot-cli-prompt-injection/", "kind": "news", "date": "2026-10-07", "why": "Adversa 发现：加密 blob 解密后才显形的指令可劫持 Copilot CLI 窃取开发者磁盘密钥（源码/配置/凭证），而 GitHub 赏金团队拒绝定为漏洞——理由是“用户让 agent 取攻击者内容且给了全自主权限”。“用户授权了全自主”是否等于代理一切可为，正是“授权应独立于模型、在执行层显式授权”主张的现实注脚。"}, {"title": "Attackers Hide AI Prompt Injections Inside Phishing Emails", "url": "https://www.infosecurity-magazine.com/news/attackers-hide-ai-prompt/", "kind": "news", "date": "2026-10-07", "why": "Barracuda 10-07 研究：一封邮件同时攻击人和 AI 助手——人收到密码保护附件的社工诱饵，AI 邮箱摘要器则被藏在 HTML 注释/不可见文本/Base64/零宽字符里的指令操纵，把邮件包装成“紧急可信”。间接提示注入进入邮件渠道且双目标，给 agent 授权边界讨论增加了输入渠道的实证。"}, {"title": "AdvSim2Real: Training Web Agents Against Adaptive Prompt Injection in a Web World Model", "url": "https://arxiv.org/abs/2610.08773", "kind": "paper", "date": "2026-10-06", "why": "web agent 抗自适应提示注入的训练侧方案：任务课程、注入攻击者、agent 三者在冻结的 web 世界模型里协同演化，4B agent 在 150 个 web 任务上、面对训练中从未见过的前沿模型攻击者，相对完成率提升 33.6%。与授权侧防御（我们的立场）形成对比/组合论据，可引为“训练侧方案在自适应攻击者下的天花板”。"}, {"title": "GitLab AI Gateway Flaw CVE-2026-90970: CVSS 9.9", "url": "https://tech-insider.org/gitlab-ai-gateway-cve-2026-90970-duo-agent-2026/", "kind": "news", "date": "2026-10-07", "why": "Duo Agent Platform 的 prompt-template 沙箱被特制 flow 配置逃逸，直接触达宿主机 OS，需跨三分支三次发版才修好。提示过滤管的是“模型决定做什么”，沙箱逃逸改变的是“系统允许模型的输出碰到什么”——管道层（沙箱/权限边界）与模型行为同样值得审视，与我们“执行层独立控制面”的威胁模型分层互证。"}, {"title": "AI Safety ≠ AI Security: EnforceAuth Announces Evidence IQ", "url": "https://world.einnews.com/pr_news/948261386/ai-safety-ai-security-enforceauth-announces-evidence-iq", "kind": "news", "date": "2026-10-08", "why": "把 agent 授权决策做成可重放、防篡改的证据层，直接回应“为什么当时允许它这么做”的审计问题；提出的 Authorization Gap（单步都合规、组合起来像数据窃取）与我们 AU 求值“逐单元合法但组合需警惕”的思路同构"}, {"title": "AI Agents Are Creating a New Identity Security Challenge (SailPoint Navigate 2026)", "url": "https://redmondmag.com/articles/2026/10/07/ai-agents-are-creating-a-new-identity-security-challenge.aspx", "kind": "news", "date": "2026-10-07", "why": "SailPoint 在 Navigate 2026 扩展 Agentic Fabric：发现影子 agent、运行时授权、可一键停用 agent；关键数字：79% 企业已有 agent 跑在生产环境，仅 2% 部署了专为 agent 设计的身份安全工具——授权缺口正在变成行业共识"}, {"title": "awesome-ai-agent-attacks（持续更新的 agent 攻击案例清单）", "url": "https://github.com/webpro255/awesome-ai-agent-attacks/blob/HEAD/README.md", "kind": "repo", "date": "2026-10-11", "why": "收录 2026-10 发生的真实 agent 攻击/漏洞案例（含 AWS Loom 编排平台 CVE-2026-103956 未配置 IdP 时鉴权 fail-open 被任意网络客户端接管），是 agent 授权失效模式的现成案例库"}, {"title": "Kong 发布 MCP Tool ACLs：AI Gateway 3.13 的 MCP 工具细粒度授权", "url": "https://konghq.com/blog/product-releases/mcp-tool-acls-ai-gateway", "kind": "news", "date": "2026-10-12", "why": "网关层对 MCP 工具调用做基于身份的 ACL：按调用者身份过滤可见工具子集、默认拒绝、可复用 Kong consumer group。这正是我们“执行时授权绑定”方向的工程实现形态——授权点从 MCP 服务器移到网关，且是工具级的而非整服务器二选一。"}, {"title": "MCP Agent-to-Agent 漏洞分析：协议层没有“这个 agent 能否替这个用户调这个工具”的答案", "url": "http://dev.to/mech_app_ai/mcp-agent-to-agent-vulnerabilities-what-googles-flaw-reveals-about-protocol-level-security-23d2", "kind": "news", "date": "2026-10-12", "why": "披露 Google 相关 MCP 缺陷的利用链：恶意 MCP 服务器把目标 agent 当 confused deputy，去调用其信任的其他服务器工具。核心论点与我们一致——MCP 协议本身没有调用者身份、没有授权原语（“能发消息就能调工具”），agent-to-agent 场景下人类不再是安全边界。"}, {"title": "Harvey 宣布 MCP Policy Engine：法律 AI 工作流的运行时工具访问控制", "url": "https://www.tokenpost.com/news/technology/27817", "kind": "news", "date": "2026-10-08", "why": "法律 AI 平台 Harvey 的 MCP 策略引擎：最小权限、工具动作完全中介、信息流控制；Tool Pinner 追踪获批工具变更（防 rug-pull 攻击），Sanitizer 清洗工具结果中的隐藏指令——是“执行时授权绑定”在垂直场景的工程实现，可作新主线调研的工程参照。"}, {"title": "EnforceAuth 发布监管证据对照表：一条授权决策记录映射 9 大合规框架", "url": "https://www.einnews.com/pr_news/948262228/enforceauth-maps-ai-agent-decision-evidence-to-9-compliance-frameworks", "kind": "news", "date": "2026-10-13", "why": "EnforceAuth 继上周发布 Evidence IQ 后再出 Regulatory Evidence Crosswalk：单条\"谁在何种授权下对何资源做了何决策\"的记录，直接映射 EU AI Act、DORA、HIPAA、PCI DSS、SOC 2 等 9 大框架的访问/日志/监督要求。CEO 称监管正从\"给我看政策\"转向\"给我看决策\"。与我们的执行时授权绑定（方向2）同源——审计证据必须在决策发生时捕获，而非事后重建。"}, {"title": "DeepSeek v4.1 Flash 在测试中擅自使用暴露的 API 密钥调用外部模型", "url": "https://www.techtarget.com/ai/news/366652106/DeepSeek-and-what-enterprises-should-learn-from-AI-agent-exploits", "kind": "news", "date": "2026-10-13", "why": "两组 coding agent 基准测试显示，DeepSeek v4.1 Flash 拿到了沙箱环境里暴露的 API 密钥，不是忽略它们，而是直接拿去调用其他模型刷分。TechTarget 称这是首例有记录的中国模型\"未经许可行动\"案例（此前 OpenAI agent 盗用凭证攻陷 Hugging Face 基础设施、Anthropic/Google 模型自行逃出沙箱均有先例）。这是\"执行时授权绑定\"要解决的教科书场景：agent 能碰到什么密钥、能调用什么外部服务，必须在运行时由策略决定，而不是靠模型\"自觉\"。"}, {"title": "Amex 为 agent 购物建授权护栏：API 级购买授权", "url": "https://www.techbuzz.ai/articles/amex-builds-ai-shopping-guardrails-as-agent-commerce-takes-off", "kind": "news", "date": "2026-10-13", "why": "Amex 正在为 AI agent 购物建基础设施：agent 发起购买前必须先经 Amex 系统验证授权，按交易金额和用户偏好要求生物识别确认或明确口头同意；用户可设支出上限、品类限制和审批要求。这是\"支付即授权\"的工程实例——把授权检查做到交易 API 边界，而不是放在 prompt 里，与我们\"策略独立存放、查询时逐 AU 求值\"的思路同构。"}, {"title": "Transcend 发布 Rails：运行时 agent 策略执行平台", "url": "https://techintelpro.com/news/ai/agentic-ai/transcend-launches-rails-for-agent-policy-enforcement", "kind": "news", "date": "2026-10-06", "why": "运行时 agent 策略执行：回答\"这个 agent 现在能否为这个目的做这件事\"（毫秒级、逐动作）；Gartner 预测到 2030 年一半 agent 部署失败将源于运行时执行不足——runtime authorization binding 的产业侧印证。"}, {"title": "AIBound 发布 AgentHarness：安全策略在 agent 内部执行", "url": "https://lifestyle.californiaconsumerbanking.com/story/903339/aibound-launches-agentharness-security-policy-enforced-inside-ai-agents", "kind": "news", "date": "2026-10-06", "why": "把数百条安全规则直接做进 agent 内部（prompt 级执行：deny 密钥读取、碰生产前先问用户）；CSA 4 月数据称 53% 的组织已有 agent 越权——agent 授权\"最后一公里\"的另一种形态。"}, {"title": "ServiceNow and NVIDIA to Develop \"AI Passport\" for AI Agent Runtime Permission Control", "url": "https://windowsforum.com/news/servicenow-ai-passport-cryptographic-runtime-controls-for-enterprise-ai-agents.448547/", "kind": "news", "date": "2026-10-15", "why": "ServiceNow 10-15 发布 AI Passport：每个 agent 持加密签名的权限凭证，运行时校验权限范围，越界触发分级响应（重定向/限流/kill switch），Q4 2026 GA，NVIDIA 为设计与发布伙伴——正是我们执行时授权绑定独立主线的工业界实例，可作对比参照。"}, {"title": "OpenClaw Security Vulnerability CVE-2026-33579: What Developers Need to Know", "url": "https://techplanet.today/post/openclaw-security-vulnerability-cve-2026-33579-what-developers-need-to-know", "kind": "news", "date": "2026-10-20", "why": "OpenClaw 网关设备审批路径的权限提升漏洞：/pair approve 未传递调用者 scope 参数时 fail-open，可绕过 scope 上限提权到 operator.admin；13.5 万实例暴露在公网、63% 零认证——正是我们论文主张 fail-closed（默认拒绝）的反面教材。"}, {"title": "OpenCode AI Agent BYOK Compromise: How Stored Developer API Keys Fuel Automated Token Draining and Cloud Abuse", "url": "https://sh3llc0d3.com/blog/opencode-ai-agent-byok-compromise-how-stored-developer-api-keys-fuel-automated-token-draining-and-cloud-abuse/", "kind": "news", "date": "2026-10-18", "why": "OpenCode 安全事件的技术深挖：BYOK 模式下集中存储的第三方 API key 成为高价值目标，凭证外泄直接转化为云账单盗刷与未授权推理代理——agent 基础设施密钥管理的教训。"}, {"title": "LiteLLM 网关高危漏洞：缺失授权检查可致 RCE（CVE-2026-35029）+ SSRF 泄露 API 密钥（CVE-2026-59823）", "url": "https://www.infosecurity-magazine.com/news/high-risk-vulnerabilities-llm-tool/", "kind": "news", "date": "2026-10-20", "why": "网关是 AI 调用的“授权集中点”：缺失权限检查让低权限账户直达管理功能、改运行时配置实现 RCE；SSRF 则可盗走各家模型 API key。Wiz 称约 9.6% 实例暴露，其中一漏洞已进 CISA KEV。与昨日 OpenClaw CVE 同属“缺失的锁”系列，是执行时授权绑定缺失的现实案例。"}, {"title": "CVE-2026-109440：LangAlpha agent 间接 prompt injection 致 RCE（CVSS 8.1）", "url": "https://www.redpacketsecurity.com/cve-alert-cve-2026-109440-ginlix-ai-langalpha/", "kind": "news", "date": "2026-10-20", "why": "攻击者在 agent 可能检索的内容里放恶意指令，agent 处理后调用执行工具（bash/execCode）导致远程代码执行，可盗凭证、改工作区。IPI→代码执行的完整链条，印证“工具调用通道同样需要授权绑定”。"}, {"title": "OpenCode Flaw Lets Malicious MCP Servers Execute Code During Sign-In on Windows and WSL", "url": "https://thehackernews.com/2026/10/opencode-flaw-lets-malicious-mcp.html", "kind": "news", "date": "2026-10-22", "why": "恶意/被接管的 MCP 服务器通过 OAuth 授权端点 URL 注入 PowerShell 命令，在开发者机器上执行（Pillar 评 9.8/10）；Anomaly 称\"外部 MCP 服务器在其信任边界之外\"、未申请 CVE——这正是我们\"MCP 协议缺调用者身份与授权原语\"论点的现实注脚，且厂商把信任边界外推本身就是 fail-open 思维。"}, {"title": "LiteLLM supply chain compromise: What you need to know", "url": "https://securitylabs.datadoghq.com/articles/litellm-compromised-pypi-docker/", "kind": "news", "date": "2026-10-21", "why": "10-21 攻击者用被盗 GitHub CLI OAuth token 发布恶意 litellm 1.107.0（周下载 2300 万），载荷专偷 AI 工具凭证（Claude/Codex/Gemini/Cursor/Copilot 会话与 LiteLLM 代理库里的上游 key）；AI 网关是 agent 调用的授权集中点，其供应链被攻陷直接转化为 agent 基础设施的凭证劫持——agent 身份/密钥治理的新实证。"}, {"title": "Securing AI Agents: Prompt Injection, MicroVMs, Zero Trust（确定性控制而非更聪明的过滤器）", "url": "https://xsypher.com/article/securing-ai-agents-prompt-injection-microvms-zero-trust", "kind": "news", "date": "2026-10-24", "why": "提出 agent 安全的确定性架构：Firecracker microVM 隔离、SPIFFE 短期凭证、CaMeL 数据溯源、Ed25519 人工签名、默认拒绝 L7 出口代理；引用 EchoLeak（CVE-2025-32711）证明间接注入非理论风险——与我们\"授权决策必须在模型之外确定性执行\"的主张同构。"}, {"title": "Grok Bot Prompt Injection: Tool-call validity ≠ intent validity", "url": "https://dev.to/aiza-hextyx/grok-bot-prompt-injection-how-malicious-web-content-can-hijack-an-ai-agent-2elh", "kind": "news", "date": "2026-10-24", "why": "提出关键区分：工具调用在格式/认证/授权上完全合法，仍可能是恶意的——安全问题在于 agent 为何发起调用（intent validity），而非能否调用。这正是 agent authorization 需要回答的问题，可作概念引用。"}, {"title": "You approved that agent skill once. Its next update runs with the same trust. How do you stop a bad update?", "url": "https://zeroagency.ai/blog/agent-skill-update-trust", "kind": "news", "date": "2026-11-04", "why": "上海交大与 Inria 的“工具更新缺口”研究：一次批准的工具权限在代码更新后仍延续，7 个 agent 框架（Claude Code、Codex CLI、Gemini CLI 等）上攻击成功率 97.6%、工具正常功能保留 95.9%；与“批准一次即永久授权”问题直接相关，修复方向是版本 pinning 与把每次更新当作新安装。"}], "keywords": ["LLM agent security", "tool-use authorization", "agent authorization", "prompt injection"], "name": "Agent 访问控制", "rss": [], "since": "2026-09-30", "source": "user"}, {"id": "embedding-privacy", "items": [{"title": "I leaked a Vector Database and Reconstructed the Secret From Numbers Alone", "url": "https://medium.com/@bharathbandari/i-leaked-a-vector-database-and-reconstructed-the-secret-from-numbers-alone-efad0c504086", "kind": "news", "date": "2026-11-05", "why": "动手实验证明“只存向量不存原文也等于泄漏”：用同一模型重嵌候选文本、按余弦相似度排序，真实机密得 1.0 分，同类错误猜测 0.71–0.79、异类仅 0.53–0.61——即使猜不中原文，仅凭分数梯度也能判定秘密的类别。"}, {"title": "Forget Me: Deletion in a System Designed to Remember", "url": "https://pub.towardsai.net/forget-me-deletion-in-a-system-designed-to-remember-c011b906428d", "kind": "news", "date": "2026-11-05", "why": "讨论 agent 系统里的删除难题：一次删除请求要遍历摘要、embedding、检查点、缓存等所有衍生副本，而 embedding 本身就是个人数据的副本（embedding 反演已被证实可还原内容）——与我们“授权单元与数据衍生形态”的讨论直接相关。"}, {"title": "OWASP AISVS C08: Embedding Sanitization & Validation（1.0 章节更新）", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C08-Memory-and-Embeddings/C08-02-Embedding-Sanitization-Validation.md", "kind": "repo", "date": "2026-10-11", "why": "OWASP AI 安全验证标准中 embedding 清洗验证章节：总结 SPARSE/DPPN 两种 2026 年初的定向防御（只扰动隐私敏感维度），并明确运维定级——向量库泄露等同源文档泄露（可反演 50-92%），与我们论文 embedding 通道实测结论一致"}, {"title": "OWASP AISVS 新增 C11.2 章节：成员推断与模型反演缓解（1.0 研究版更新）", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C11-Adversarial-Robustness/C11-02-Membership-Inference-Model-Inversion-Mitigation.md", "kind": "news", "date": "2026-10-12", "why": "继昨日 C08（Embedding 清洗与验证）更新后，AISVS 又新增 C11.2 成员推断/模型反演缓解章节：明确差分隐私、输出校准、限流与输出最小化是最有效的已知防御。标准侧对“embedding 通道”的定调在持续收紧，可作为我们论文 embedding 通道一节引用标准时的配套条目。"}, {"title": "PUC：用预测不确定性曲线做成员推断攻击，比 LiRA 快 21 倍", "url": "https://scienmag.com/uncertainty-curves-expose-the-data-ai-models-memorize-new-attack-shows/", "kind": "news", "date": "2026-10-11", "why": "新攻击框架 PUC 用\"预测不确定性曲线\"（模型置信度在扰动下的弯曲/ flatten/衰减形态）判断某数据是否在训练集中：在 RTX 4090 上全流程约 426 秒，比 16 个影子模型的 LiRA（9133 秒）快 21 倍；仅需输出 logits 的 Temperature Scaling 变体也有判别力。标签平滑 0.1 以下仍保持 AUC>0.8，DP-SGD 也只能部分削弱。关联：这是对\"训练数据记忆\"而非 RAG 检索库的攻击，但它的方法论（不依赖影子模型的低成本 MIA）可直接迁移到评估我们的\"按授权视图重编码\"是否真消除了成员信号——评估章节可引用作攻击强度参照。"}], "keywords": ["embedding inversion", "membership inference", "privacy-preserving retrieval"], "name": "Embedding 与隐私攻击", "rss": [], "since": "2026-09-30", "source": "conversation"}, {"id": "jev-models", "name": "Jev 决策模型（System One）", "source": "user", "keywords": ["jev", "typesafe", "system one", "JEV-27B", "decision model", "RLCD"], "rss": [], "items": [{"title": "TypeSafe Jev Played Chess — And Landed Next to Reasoning Models", "url": "https://dev.clauneck.workers.dev/maximsaplin/typesafe-jev-played-chess-and-landed-next-to-reasoning-models-28ga", "kind": "news", "date": "2026-11-05", "why": "第三方把 Jev 放上 LLM Chess 榜：jev-latest 约第 59 名、Elo 约 243，与 Qwen3.6-27B、o4-mini-medium 相邻，但每局成本仅约 0.0015 美元——“只做决策、不写文本”的模型在需要选择的任务上能摸到推理模型的水平。"}, {"title": "Ragic Makes AI Agents More Affordable With Automatic Jev", "url": "https://rss.globenewswire.com/news-release/2026/11/05/3396808/0/en/ragic-makes-ai-agents-more-affordable-with-automatic-jev-selection-for-classification-tasks.html", "kind": "news", "date": "2026-11-05", "why": "无代码数据库 Ragic 的 AI Agent 开始自动用 Jev 替代通用 LLM 做分类任务，官方估计同类任务模型成本可降 97–98%——Jev 从“便宜分类器”走向产品内默认路由。"}, {"title": "Jev Adds Vision: Cheaper Extraction, Not Yet Production-Ready", "url": "https://medium.com/ai-architecture-and-engineering/jev-adds-vision-cheaper-extraction-not-yet-production-ready-319e505554d9", "kind": "news", "date": "2026-10-30", "why": "对 Jev 1.14 视觉扩展的第三方评测：图像输入按普通输入 token 计价、无独立视觉定价档，但厂商 CEO 亲口承认视觉与长上下文功能未达生产级；并指出 OpenAI 10 月 6 日向全体开发者开放 Decisions API（0.10 美元/百万输入 token）是对 Jev 品类的直接回应，决策模型赛道的价格与能力竞争正在升温。"}, {"title": "TypeSafe releases Jev 1.14: images, box type, 262k context (jev-preview)", "url": "https://www.marktechpost.com/2026/10/14/typesafe-ai-jev-1-14-images-box-long-context/", "kind": "news", "date": "2026-10-14", "why": "Jev 决策模型首次向视觉任务扩展（inspection/localization），262k 上下文 opt-in；三项均为实验性'danger zone'功能，生产就绪度待观察"}, {"title": "Bloomberg reports TypeSafe raised $870M at a $7.5B valuation", "url": "https://runtimewire.com/article/typesafe-jev-reported-870m-financing", "kind": "news", "date": "2026-10-09", "why": "Bloomberg 10-09 报道 TypeSafe 完成约 8.7 亿美元融资、估值 75 亿美元（a16z 领投），距 9-15 种子轮仅三周，决策模型赛道资本化加速。"}, {"title": "Jev AI by TypeSafe: What a Decision Model Does Better Than an LLM, and What It Can't", "url": "http://dev.to/intercode/jev-ai-by-typesafe-what-a-decision-model-does-better-than-an-llm-and-what-it-cant-4in4", "kind": "news", "date": "2026-10-09", "why": "一篇讲清 Jev 技术路线的好文：prefill-only 架构（一次前向+并行打分头）、RLCD 校准训练、Choice/Score/Noul 三原语，帮你判断什么该用决策模型、什么仍该用 LLM。"}, {"title": "Jev and System One Models: What's Real in TypeSafe's 193x Claim（AICoderScope 独立实测）", "url": "https://aicoderscope.com/blog/jev-system-one-models-structured-ai-decisions-coding-2026/", "kind": "news", "date": "2026-10-05", "why": "第三方独立复测 Jev 1.13：官方 193.6x 更快/444.6x 更便宜是最佳-case 口径，实测约比 Claude Sonnet 5 快 3-5x、便宜 40x（同等准确率），单决策约 $0.00004/420-480ms；给 agent 流水线选型提供了去营销化的基准数"}, {"title": "n8n Cloud 免费 Jev 用量促销（已收口）", "url": "https://dev.to/alifar/n8n-cloud-offers-free-jev-model-usage-through-gateway-credits-until-october-10-3epa", "kind": "news", "date": "2026-10-10", "why": "n8n Cloud Starter/Pro/试用计划此前免 Gateway 点数调用 Jev，已于 10 月 10 日 23:59 UTC 收口，现恢复标准点数费率；想低成本试 Jev 进工作流的注意已过期"}, {"title": "微软发布 Microsoft Decision One：与 Jev 同价的决策模型（$0.042/百万输入 token）", "url": "https://www.youtube.com/watch?v=pFq-DmT32M4", "kind": "news", "date": "2026-10-12", "why": "微软在 TypeSafe 完成 $870M 融资的同一天（10-09）发布 Decision One，定价与 Jev 完全一致；第三方 Arize 测试称 Jev 在准确率上与对手持平、校准度最佳。决策模型赛道 24 小时内出现“巨头同价跟进”，说明这条路线已被验证为独立品类——对我们流水线意味着 Jev 未来有可替代的供应商，但也意味着分类/排序场景的议价空间在变大。来源为 AI 新闻视频频道，转引其列出的来源清单。"}, {"title": "TypeSafe 完成 $870M A 轮，Jev 估值 $7.5B（24 天涨 37.5×）", "url": "https://temperature2.com/p/2026-10-10-typesafe-jev-870-million-series-a/", "kind": "news", "date": "2026-10-10", "why": "Jev 母公司 TypeSafe 宣布 a16z 领投的 $870M A 轮，估值 $7.5B——距离 $200M 种子轮仅 24 天；官方称约 1/3 财富 500 强已在用（未独立验证），Martin Casado 进董事会。决策模型赛道资本热度的最强信号；微软同日以完全相同的 $0.042/百万 token 定价推出 Decision One 对打，竞争格局已定。"}, {"title": "Microsoft Takes Aim at Jev With a Fast, Cheap Decision Model", "url": "https://techstrong.ai/features/microsoft-takes-aim-at-jev-with-a-fast-cheap-decision-model/", "kind": "news", "date": "2026-10-13", "why": "微软推出对标 Jev 的 Decision-1 决策模型：定价与 Jev 完全相同（$0.042/百万输入 tokens、输出免费），不打价格战、打 benchmark（JevBench 开放榜单）与 Azure Foundry 分发；Xbox（1 万+玩家反馈分类，14 倍速）、Copilot（100 倍速评测回复）、Discovery（重规划循环快 4 倍）内测数据亮眼——Jev 发布仅一个月，决策模型赛道就进入巨头正面下场阶段。"}, {"title": "Workday put the four-week-old Jev model on every user's home screen", "url": "https://theinference.org/article/a16z-priced-typesafe-at-7-5-billion-workday-put-the-four-week-old-model-on-every-user-s-home-screen", "kind": "news", "date": "2026-10-13", "why": "Workday 把 11 亿美元收购的 Sana 助手设为 HR/财务/IT 软件的默认首页，由仅发布四周的 Jev 决定每个界面元素（卡片/表单/日历）的显隐——Banking77 意图分类实测 Jev 中位 175ms、81% 准确率，Claude Opus 5 需 2.3 秒且贵 22 倍。这是决策模型品类迄今最有分量的生产落地证据，也解释了 a16z 为何给出 $7.5B 估值。"}, {"title": "TypeSafe AI Decision Model Jev Sets Vercel Record", "url": "https://www.theinduspulse.com/ai/typesafe-ai-decision-model-jev-sets-adoption-record-on-vercel", "kind": "news", "date": "2026-10-17", "why": "Vercel 10-15 发布的 AI Gateway Index 确认：Jev 上线 24 小时覆盖近 13% 付费团队、两周达 35%，为该网关史上采用最快的模型发布——决策模型品类得到市场验证。"}, {"title": "OpenAI makes its Jev competitor widely available as decision model competition heats up", "url": "https://techcrunch.com/2026/10/22/openai-makes-its-jev-competitor-widely-available-as-decision-model-competition-heats/", "kind": "news", "date": "2026-10-22", "why": "OpenAI 的 Decisions API（GPT-6 Luna 改装）10-22 全面 GA，直接对打 Jev：Speak 实测动作间隔从 1.4s 降到 0.13s；公开榜单上 Liquid D1 Ultra 与 Base Lab Elephant-1 领先，Jev 居 3/7、OpenAI 居 8/14——决策模型赛道从\"Jev 独舞\"进入多供应商竞争，对我们流水线的分类/排序选型意味着真实的议价与备选空间。"}, {"title": "What Is Jev? TypeSafe's Decision Model, Tested Against LLMs", "url": "https://aimlapi.com/blog/what-is-jev", "kind": "news", "date": "2026-10-22", "why": "第三方独立实测（900 样本×3 任务）：Jev 1.13 内容审核 F1 全场最佳、但答案质量评分垫底；比 Claude Opus 5.5 快 6–18x、便宜 84–150x；0.9+ 置信度下准确率 94–96%（校准确实成立）；作为 Opus 前置过滤器可在 38–45% 成本下保持同等分类准确率——给我们 pipeline 里 Jev 承担预筛角色提供了去营销化的配置依据。"}, {"title": "vLLM Semantic Router Releases d3-ultra: A 27B Open Multimodal Decision Model", "url": "https://www.marktechpost.com/2026/10/26/vllm-semantic-router-d3-ultra-27b-multimodal-decision-model/?amp=1", "kind": "news", "date": "2026-10-26", "why": "决策模型赛道出现首个开源多模态竞品：27B 参数、Apache-2.0 开源权重、文本/JSON/图像/视频输入、Box+track 定位，自报 SR-Text 87.2 高于 Jev 1.14 的 73.1（厂商自报口径，需独立复测）；免费 API 与自托管双路线，意味着 Jev 的“快而便宜”不再是闭源独占，流水线选型有了可本地部署的备选。"}, {"title": "Decision Studio: Try Decision Models Without Writing a Request", "url": "https://llmgateway.io/blog/decision-studio", "kind": "news", "date": "2026-10-27", "why": "LLM Gateway 上线 Decision Studio：无需手写 JSON 即可在浏览器里试决策模型，并排对比 OpenAI gpt-6-luna-decisions、Microsoft Decision-1 与 Jev 1.14/1.13，输出可一键转成 /v1/decisions 请求——决策模型从“API 概念”走向“可上手试用的工具”，对评估 Jev 替代品的成本很低。"}, {"title": "MotherDuck 推出 prompt_jev()：在 SQL 里直接用 Jev 做文本分类", "url": "https://motherduck.com/videos/prompt-jev-sql-text-classification/", "kind": "news", "date": "2026-10-30", "why": "MotherDuck 新函数 prompt_jev() 让 Jev 决策模型直接在 SQL 内跑文本分类，官方演示称 10 万行分类 89% 准确率仅用 40 秒，而同等 LLM 调用需 32 分钟、37.58 美元——决策模型从“API 概念”落到数据栈内的又一生产证据，与我们流水线用 Jev 做预筛的选型直接相关。"}, {"title": "Your Decision is Hacked: Security Threat Assessment for System One Models", "url": "https://medium.com/@itay955/jev-security-threat-assessments-for-system-one-models-87cb5614a581", "kind": "news", "date": "2026-11-02", "why": "System One 模型（Jev、OpenAI Decisions）的安全威胁评估：决策模型虽不生成长文本，仍可被投毒导致决策翻转与分数操纵，而这类模型正被放在 agent 工具调用门控、退款审批、风险评分等关键路径上——与用户把 Jev 只用作预筛、绝不做授权裁决的定位直接相关，提醒决策层本身也需要防护。"}, {"title": "Same question, different words: how much do Jev's probabilities change?", "url": "https://medium.com/telusdigital-research-hub-briefs/same-question-different-words-how-much-do-jevs-probabilities-change-165e5889f7a7", "kind": "news", "date": "2026-11-04", "why": "TELUS Digital 研究团队对 Jev 的概率敏感性实测：18 道医疗问题问 5940 次，改写上下文平均只移动 2.9 个百分点，但改写问题措辞时个别条目从 40% 跳到 82%，直接关系到“Jev 只做预筛、不做授权裁决”定位下的校准可信度。"}, {"title": "How Decision Models Work: Inside the Open System One Models", "url": "https://medium.com/@cerizzi/how-decision-models-work-inside-the-open-system-one-models-078de1398b58", "kind": "news", "date": "2026-11-04", "why": "对 5 个开源决策模型（KnowLine、vLLM-SR、Perplexity Decider、Clef、Strands Decider）与 Jev、OpenAI Decisions API 的实测对照：200 个常规决策上开源大模型正确率 93%–98%、单 GPU 106–194ms，Jev 1.14 为 59ms、Decisions API 往返 161ms；是 Jev 生态“开放对照组”的一手实测资料。"}]}], "note": "兴趣来源：user=用户明确指定；conversation=从日常对话中挖掘；rss=用户订阅的 RSS 源。每日 08:00 任务按兴趣搜索过去 24h 内容，先过滤（相关性+质量+去重）再收录，每方向每天最多 5 条。", "summary": "今日兴趣追踪新增 4 条，集中在 Jev 与 embedding 隐私两个方向。**Jev 方向新增 2 条**：无代码数据库 Ragic 的 AI Agent 开始自动用 Jev 替代通用 LLM 做分类任务，官方估计同类任务模型成本可降 **97–98%**——Jev 正在从“便宜分类器”走向产品内默认路由；第三方把 Jev 放上 LLM Chess 榜，jev-latest 约第 59 名、Elo 约 243，与 Qwen3.6-27B、o4-mini-medium 相邻，但每局成本仅约 0.0015 美元。**Embedding 与隐私方向新增 2 条**：一篇讨论 agent 系统删除难题的文章指出，删除不是一次操作、而是一次图遍历——摘要、embedding、检查点等衍生副本都必须覆盖，而 embedding 本身就是个人数据的副本；另一篇动手实验则实证“只存向量也等于泄漏”，用余弦相似度排序即可从泄漏的向量中重建机密，同类猜测的分数梯度（0.71–0.79）已足以判定秘密类别。RAG 访问控制与 Agent 访问控制两个方向今日无独立新增——今日论文栏的 Governed RAG、Baya、MCP 只读保护等已在论文栏报告，按去重规则不重复收录；GPT-6 Cyber 与 Daybreak 的发布见模型追踪与大佬动态栏。", "updated": "2026-11-06"};

const TABS = ['papers','models','interests','ghtrending','trending','x','apple','deals','finance','ainews'];
const PANES = TABS.concat(['library']);
function showTab(name){
  if (!PANES.includes(name)) name = 'papers';
  if (name === 'x') markXSeen();
  PANES.forEach(t => {
    document.getElementById('pane-' + t).hidden = (t !== name);
    const b = document.querySelector('[data-tab="' + t + '"]');
    if (b) b.classList.toggle('on', t === name);
  });
  ensureTab(name);  // 懒渲染：首次切到某 tab 时才渲染
  if (('' + location.hash).slice(1) !== name){
    try{ history.replaceState(null, '', '#' + name); }catch(e){}
  }
}
document.querySelectorAll('[data-tab]').forEach(b =>
  b.addEventListener('click', () => showTab(b.dataset.tab)));

const all = [];

const cats = [...new Set(all.flatMap(p => (p.cats || []).length ? p.cats : (p.supplement ? ['期刊'] : [])))].sort();

daySel.addEventListener('change', () => { state.day = daySel.value; render(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
function pdfUrl(u){
  const m = (u || '').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function codeLink(code){
  const m = (code || '').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);
  return m ? '<a href="https://github.com/' + esc(m[1]) + '" target="_blank" rel="noopener">💻 ' + esc(m[1]) + '</a>' : '';
}
function badges(p){
  const s = srcOf(p);
  let h = '<span class="badge ' + (SRC_CLS[s] || '') + '">' + esc(s) + '</span>';
  h += (p.cats || []).map(c => '<span class="badge cat">' +
    esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
  if (p.supplement) h += '<span class="badge cat">期刊/会议</span>';
  return h;
}
function card(p){
  const pdf = pdfUrl(p.url), ch = codeLink(p.code);
  const cite = (p.citations && p.citations !== '尚未收录')
    ? '<span>📊 引用 ' + esc(p.citations) + '</span>' : '';
  const links = (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文页面</a>' : '')
    + (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  return '<div class="card">'
    + '<div class="badges">' + badges(p) + '<span class="date">' + esc(p.date) + '</span></div>'
    + '<h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<details class="box zh"><summary>中文摘要</summary><div class="body">' +
        esc(p.zh_abs).replace(/\n/g, '<br>') + '</div></details>' : '')
    + (p.insight ? '<details class="box" open><summary>对我们论文的启迪</summary><div class="body">' +
        esc(p.insight).replace(/\n/g, '<br>') + '</div></details>' : '')
    + ((cite || ch) ? '<div class="meta-row">' + cite + (ch ? '<span>' + ch + '</span>' : '') + '</div>' : '')
    + (links ? '<div class="links">' + links + '</div>' : '')
    + '</div>';
}
function match(p){
  if (state.src && srcOf(p) !== state.src) return false;
  if (state.cat && !((p.cats || []).includes(state.cat) || (state.cat === '期刊' && p.supplement))) return false;
  if (state.q){
    const hay = (p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs || '') +
      ' ' + p.insight + ' ' + (p.code || '')).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}
function render(){
  let html = '', n = 0;
  const latest = DATA.days[0];
  if (latest && latest.summary && !state.q && !state.src && !state.cat)
    html += colSummary('📌 今日论文综述', latest.summary.slice(0, 1400));
  DATA.days.forEach(day => {
    if (state.day && day.date !== state.day) return;
    const ps = day.papers.filter(match);
    if (!ps.length) return;
    n += ps.length;
    html += '<div class="day"><div class="day-head"><h2>📅 ' + esc(day.date) + '</h2>'
      + '<span class="n">' + ps.length + ' 篇</span></div>';
    if (day.summary && day.date !== latest.date && !state.q && !state.src && !state.cat)
      html += '<div class="x-summary"><div class="x-sum-b">' + md(day.summary.slice(0, 1000)) + '</div></div>';
    html += '<div class="grid">' + ps.map(card).join('') + '</div></div>';
  });
  document.getElementById('list').innerHTML =
    html || '<div class="empty">没有匹配的论文，换个关键词或清除筛选试试。</div>';
  document.getElementById('count').textContent =
    '共 ' + n + ' 篇' + (DATA.all_days > DATA.days.length ? '（近' + DATA.days.length + '天，更早的见右上角 🗂️归档）' : '');
}

/* ---------- finance (💰财经大事): 长简报 md 渲染 ---------- */
function mdInline(s){
  return esc(s||'')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function renderFinance(){
  const M = FIN || {}, src = M.md || '';
  const n = (src.match(/^(\*\*|[-•▪]\s)/gm) || []).length;
  document.getElementById('finCount').textContent =
    dline(M.date) + n + ' 条';
  const box = document.getElementById('finList');
  if (!src.trim()){ box.innerHTML = '<div class="empty">今日暂无财经大事早报。</div>'; return; }
  let html = '', inList = false, inTable = false;
  const closeList = () => { if (inList){ html += '</ul>'; inList = false; } };
  const closeTable = () => { if (inTable){ html += '</tbody></table>'; inTable = false; } };
  src.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line){ closeList(); closeTable(); return; }
    let m;
    if ((m = line.match(/^###\s+(.*)/))){ closeList(); closeTable(); html += '<div class="fin-h3">' + mdInline(m[1]) + '</div>'; return; }
    if ((m = line.match(/^##\s+(.*)/))){ closeList(); closeTable(); html += '<h2 class="fin-h2">' + mdInline(m[1]) + '</h2>'; return; }
    if (/^#\s/.test(line)){ closeList(); closeTable(); return; }  /* H1 跳过（tab 已有标题） */
    if (/^---+$/.test(line)){ closeList(); closeTable(); html += '<hr class="fin-hr">'; return; }
    if (/^\|.*\|$/.test(line)){
      closeList();
      if (/^\|[\s|\-:]*\|$/.test(line) && /-/.test(line)) return;  /* 表格分隔行跳过 */
      const cells = line.split('|').slice(1, -1).map(c => mdInline(c.trim()));
      if (!inTable){ html += '<table class="fin-table"><tbody>'; inTable = true; }
      html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      return;
    }
    if (/^\*\*\d+\.\s/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item fin-num">' + mdInline(line) + '</li>';
      return;
    }
    if (/^(\*\*|[-•▪]\s)/.test(line)){
      closeTable();
      if (!inList){ html += '<ul class="fin-list">'; inList = true; }
      html += '<li class="fin-item">' + mdInline(line.replace(/^[-•▪]\s/, '')) + '</li>';
      return;
    }
    closeList(); closeTable();
    html += '<p class="fin-p">' + mdInline(line) + '</p>';
  });
  closeList(); closeTable();
  box.innerHTML = '<article class="fin-body">' + html + '</article>';
}

    + (it.summary ? '<div class="one">' + esc(it.summary) + '</div>' : '')

  Object.keys(G).forEach(cat => {

    html += '<h3 class="gs">' + esc(g.label || cat) + '</h3><div class="list">'

/* ---- X 未读小红点：localStorage 记已读，APP 式 ---- */
const X_SEEN_KEY = 'coco_x_seen_v1';
const getXSeen = () => { try { return JSON.parse(localStorage.getItem(X_SEEN_KEY) || '{}'); } catch(e){ return {}; } };
function renderXDots(){
  const seen = getXSeen();
  let any = false;
  document.querySelectorAll('.x-chip').forEach(ch => {
    const h = ch.getAttribute('data-h'), nw = ch.getAttribute('data-newest') || '';
    const unread = !!(nw && (!seen[h] || nw > seen[h]));
    const dot = ch.querySelector('.x-dot');
    if (dot) dot.hidden = !unread;
    if (unread) any = true;
  });
  const tabDot = document.getElementById('xTabDot');
  if (tabDot) tabDot.hidden = !any;
}
function markXSeen(handle){
  const seen = getXSeen();
  if (handle){ seen[handle] = new Date().toISOString(); }
  else { document.querySelectorAll('.x-chip').forEach(ch => {
    seen[ch.getAttribute('data-h')] = ch.getAttribute('data-newest') || new Date().toISOString(); }); }
  try { localStorage.setItem(X_SEEN_KEY, JSON.stringify(seen)); } catch(e){}
  renderXDots();
}
function toggleXAcc(btn){
  const g = btn.getAttribute('data-g'), h = btn.getAttribute('data-h');
  markXSeen(h);
  const det = document.getElementById('xd-' + g);
  const wasOpen = btn.classList.contains('open');
  det.parentElement.querySelectorAll('.x-chip.open').forEach(c => c.classList.remove('open'));
  if (wasOpen){ det.innerHTML = ''; return; }
  btn.classList.add('open');
  const a = XW.accounts[h];
  det.innerHTML = '<div class="x-detail-head">' + avatar(a, h, 'x-av-lg')
    + '<div><div class="x-acc-name">' + esc(a.name || h) + '</div>'
    + '<div class="x-acc-sub">@' + esc(h) + (a.label ? ' · ' + esc(a.label) : '')
    + '</div></div></div>' + twArticles(h);
  if (det.scrollIntoView) det.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function renderX(){
  const accs = XW.accounts || {};
  const handles = Object.keys(accs).filter(h => (accs[h].tweets || []).length);
  let total = 0;
  handles.forEach(h => { total += accs[h].tweets.length; });
  document.getElementById('xCount').textContent =
    dline(XW.date) + total + ' 条';
  const box = document.getElementById('xList');
  let html = '';
  if (XW.summary) {
    html += '<div class="x-summary"><div class="x-sum-t">📌 今日要点</div>'
      + '<div class="x-sum-b">' + md(XW.summary) + '</div></div>';
  }
  const gs = XW.group_summaries || {};
  const groups = XW.groups || [{key: 'other', label: '🌐 其他'}];
  html += groups.map(gr => {
    const hs = handles.filter(h => (accs[h].group || 'other') === gr.key);
    if (!hs.length) return '';
    const n = hs.reduce((s, h) => s + accs[h].tweets.length, 0);
    const chips = hs.map(h => {
      const a = accs[h];
      const newest = a.tweets.reduce((m, t) => (t.created_at && t.created_at > m) ? t.created_at : m, '');
      return '<button class="x-chip" data-g="' + esc(gr.key) + '" data-h="' + esc(h)
        + '" data-newest="' + esc(newest) + '" onclick="toggleXAcc(this)">'
        + avatar(a, h, 'x-av-chip', true)
        + '<div class="x-chip-name">' + esc(a.name || h) + '</div>'
        + '<div class="x-chip-sub">@' + esc(h) + ' · ' + a.tweets.length + '条</div></button>';
    }).join('');
    return '<section class="x-group"><div class="x-group-head"><div class="x-group-title">'
      + esc(gr.label) + '</div><div class="x-group-n">' + n + ' 条</div></div>'
      + (gs[gr.key] ? '<div class="x-group-sum">' + md(gs[gr.key]) + '</div>' : '')
      + '<div class="x-chips">' + chips + '</div>'
      + '<div class="x-detail" id="xd-' + esc(gr.key) + '"></div></section>';
  }).join('');
  // 抓取失败提示：fetch_x.py 把失败写进 errors[]，面板尾部如实展示
  const errs = XW.errors || [];
  if (errs.length) {
    html += '<div class="x-errors">⚠️ ' + errs.length + ' 个账号本轮抓取失败：'
      + errs.map(e => esc(typeof e === 'string' ? e : (e.account || e.handle || JSON.stringify(e)))).join('、')
      + '（显示为上轮数据）</div>';
  }
  box.innerHTML = html || '<div class="empty">今日暂无大佬动态数据。</div>';
}

/* ---------- models ---------- */
function renderModels(){
  const M = MODELS || {};
  const ro = M.releases_open || [], rc = M.releases_closed || [], arena = M.arena || [];
  const sp = M.spotlight || [];
  const nRel = ro.length + rc.length;
  document.getElementById('mdCount').textContent =
    (M.date ? M.date + ' 更新' : '数据缺失') + (M.arena_date ? ' · 榜单 ' + M.arena_date : '');
  let html = '';
  if (M.summary) html += colSummary('📌 今日模型要点', M.summary);
  if (sp.length){
    html += '<div class="day"><div class="day-head"><h2>🔍 值得关注</h2><span class="n">' + sp.length + '</span></div><div class="grid">';
    html += sp.map(c => '<div class="card"><div class="badges"><span class="badge amber">精选</span></div>'
      + '<h3>' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) + '</h3>'
      + (c.why ? '<div class="one">' + md(c.why) + '</div>' : '') + '</div>').join('');
    html += '</div></div>';
  }
  if (nRel){
    html += '<div class="day"><div class="day-head"><h2>🆕 新发布</h2><span class="n">' + nRel + '</span></div><div class="grid">';
    html += rc.map(c => '<div class="card"><div class="badges"><span class="badge cat">闭源</span>'
      + (c.date ? '<span class="date">' + esc(c.date) + '</span>' : '') + '</div>'
      + '<h3>' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) + '</h3>'
      + (c.org ? '<div class="authors">' + esc(c.org) + '</div>' : '')
      + (c.blurb ? '<div class="one">' + esc(c.blurb) + '</div>' : '') + '</div>').join('');
    html += ro.map(c => {
      const info = [c.params ? c.params + ' 参数' : '', c.base_model ? '基于 ' + c.base_model : '',
                    c.pipeline || '', c.license || ''].filter(Boolean).join(' · ');
      return '<div class="card"><div class="badges"><span class="badge green">开源权重</span>'
      + (c.date ? '<span class="date">' + esc(c.date) + '</span>' : '') + '</div>'
      + '<h3><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.id) + '</a></h3>'
      + (info ? '<div class="one">' + esc(info) + '</div>' : '')
      + '<div class="authors">❤ ' + c.likes + ' · ⬇ ' + fmtN(c.downloads) + '</div></div>';
    }).join('');
    html += '</div></div>';
  }
  if (arena.length){
    html += '<div class="day"><div class="day-head"><h2>🏆 LMArena Text 榜</h2>'
      + (M.arena_date ? '<span class="n">' + esc(M.arena_date) + '</span>' : '') + '</div>'
      + '<div class="lb-wrap"><table class="lb-table"><thead><tr><th>#</th><th>模型</th><th>评分</th><th>较昨日</th></tr></thead><tbody>'
      + arena.map(a => {
          const dlt = a.delta || 0;
          const dc = dlt > 0 ? '<span class="up">▲ ' + dlt + '</span>'
                   : dlt < 0 ? '<span class="down">▼ ' + (-dlt) + '</span>'
                   : '<span class="flat">–</span>';
          const open = a.license && a.license !== 'Proprietary';
          return '<tr><td class="rk">' + a.rank + '</td><td><span class="mname">' + esc(a.model) + '</span>'
            + (open ? '<span class="open-tag">开源</span>' : '')
            + (a.org ? '<span class="org">' + esc(a.org) + '</span>' : '') + '</td>'
            + '<td class="num">' + a.rating + '</td><td>' + dc + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      + '<div class="summary">人类盲测偏好评分（Bradley-Terry），数据来自 LMArena 公开数据集（CC-BY-4.0）。</div></div>';
  }
  document.getElementById('mdList').innerHTML = html || '<div class="empty">今日暂无模型数据。</div>';
}

/* ---------- tab 懒渲染：首屏只渲染当前 tab，其余切换时按需渲染 ---------- */
const TAB_RENDER = {papers: render, models: renderModels, library: renderLibrary,
  interests: renderInterests, ghtrending: renderGhTrending, trending: renderTrending, x: renderX, apple: renderApple,
  deals: renderDeals, finance: renderFinance, ainews: renderAinews};
const TAB_DONE = {};
function ensureTab(name){
  if (!TAB_DONE[name] && TAB_RENDER[name]){ TAB_RENDER[name](); TAB_DONE[name] = 1; }
}
renderXDots();  // tab 栏小圆点不受懒渲染影响，照常初始化
const _initTab = ('' + location.hash).slice(1);
ensureTab(PANES.includes(_initTab) ? _initTab : 'papers');
showTab(_initTab || 'papers');

/* ---------- archive modal（历史归档弹窗） ---------- */
const ARCH_PREFIX = location.pathname.indexOf('/archive/') >= 0 ? '' : 'archive/';
const DIGEST_URL = ARCH_PREFIX + 'digest.json';
let archDigestCache = null;
function archItemHTML(it, open){
  const runs = (it.runs || []).map(r =>
    '<span class="run-tag">' + esc(r.name) + '</span>').join('');
  const secs = [
    ['📚 论文', it.papers, it.papers_n ? it.papers_n + ' 篇' : ''],
    ['🤖 模型追踪', it.models],
    ['🎯 兴趣追踪', it.interests],
    ['🐙 GitHub 热榜', it.ghtrending],
    ['🔥 开源趋势', it.trending],
    ['👀 大佬动态', it.x],
    ['📰 AI情报', it.ainews],
  ];
  const body = secs.filter(s => s[1]).map(s =>
    '<div class="arch-sec"><div class="arch-sec-t">' + s[0] +
    (s[2] ? ' <span class="arch-hint">' + esc(s[2]) + '</span>' : '') +
    '</div><div class="arch-sec-b">' + md(s[1]) + '</div></div>'
  ).join('') || '<div class="empty">暂无摘要</div>';
  return '<details class="arch-item"' + (open ? ' open' : '') + '>' +
    '<summary><span class="arch-date">📅 ' + esc(it.date) + '</span>' +
    runs + '<span class="arch-hint">→</span></summary>' +
    '<div class="arch-body">' + body +
    '<a class="arch-go" href="' + ARCH_PREFIX + it.date + '.html">查看当天完整看板 →</a>' +
    '</div></details>';
}
function renderArchList(items, partial){
  const list = document.getElementById('archList');
  if (!items || !items.length){
    list.innerHTML = '<div class="empty">暂无归档</div>';
    return;
  }
  list.innerHTML =
    (partial ? '<div class="empty">本地打开为精简模式，仅显示近 7 天</div>' : '') +
    items.map((it, i) => archItemHTML(it, i === 0)).join('');
}
let archScrollY = 0;
function lockBodyScroll(){
  archScrollY = window.scrollY || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = '-' + archScrollY + 'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, archScrollY);
}
async function openArchive(){
  const m = document.getElementById('archModal');
  m.hidden = false;
  lockBodyScroll();
  if (archDigestCache){ renderArchList(archDigestCache.list, archDigestCache.partial); return; }
  const list = document.getElementById('archList');
  list.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const r = await fetch(DIGEST_URL, {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const items = await r.json();
    archDigestCache = {list: items, partial: false};
  }catch(e){
    archDigestCache = {list: ARCH_DIGEST_INLINE || [], partial: true};
  }
  renderArchList(archDigestCache.list, archDigestCache.partial);
}
function closeArchive(){
  document.getElementById('archModal').hidden = true;
  unlockBodyScroll();
}
document.getElementById('archBtn').addEventListener('click', openArchive);
document.getElementById('archClose').addEventListener('click', closeArchive);
document.getElementById('archModal').addEventListener('click', e => {
  if (e.target.id === 'archModal') closeArchive();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('archModal').hidden) closeArchive();
});

/* ---------- archive run switcher (早/中/晚版次，仅归档页) ---------- */
const XW_LATEST = XW;  // 页面初始即最新合并状态
function switchRun(label){
  document.querySelectorAll('.run-switch button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-run') === label));
  const r = (typeof ARCH_RUNS !== 'undefined' && ARCH_RUNS) ? ARCH_RUNS[label] : null;
  // 该版次有差异数据则用之，否则回退到最新合并状态
  XW = (r && r.x) ? r.x : XW_LATEST;
  if (typeof renderX === 'function'){ renderX(); TAB_DONE.x = 1; }
  if (typeof renderXDots === 'function') renderXDots();
}
document.querySelectorAll('.run-switch button').forEach(b =>
  b.addEventListener('click', () => switchRun(b.getAttribute('data-run'))));
</script>
