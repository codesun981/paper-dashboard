<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>访问控制 × AI 安全 · 文献看板</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2333;--mut:#68707f;--line:#e6e9ef;--acc:#2456d6;--acc-bg:#eaf0fe}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;min-width:130px}
.stat b{font-size:22px;display:block}.stat span{color:var(--mut);font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap}
.bar input,.bar select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bar input{flex:1;min-width:200px}
.day{margin:26px 0 8px}.day h2{font-size:17px;margin:0 0 4px}
.summary{background:var(--acc-bg);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:#2a3a5f;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:15px;margin:0;line-height:1.5}
.card h3 a{color:var(--ink);text-decoration:none}.card h3 a:hover{color:var(--acc)}
.meta{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{background:var(--acc-bg);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:11.5px;white-space:nowrap}
.badge.j{background:#e9f7ef;color:#1c7a3d}
.badge.hf{background:#fff7e6;color:#b26a00}
.badge.oa{background:#f1eafe;color:#6a3ec1}
.zhabs{font-size:13px;color:#3c4454;background:#f6f8ff;border:1px solid #dfe7fb;border-radius:8px;padding:8px 10px}
.zhabs b{color:var(--acc)}
.xtra{font-size:12px;color:var(--mut)}
.xtra a{color:var(--acc);text-decoration:none}
.one{font-size:13.5px}.insight{font-size:13px;color:#3c4454;background:#fafbfc;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.insight b{color:var(--acc)}.authors{font-size:12.5px;color:var(--mut)}
.link a{font-size:12.5px;color:var(--acc);text-decoration:none;word-break:break-all}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.count{font-size:12.5px;color:var(--mut);margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 访问控制 × AI 安全 · 文献看板</h1>
<div class="sub">每日自动监测 arXiv / HuggingFace / OpenAlex / 顶会期刊 · 按关键词筛选 · 含对 RU/AU 解耦论文的启迪分析</div>
<div class="stats">
<div class="stat"><b id="sTotal">–</b><span>收录论文</span></div>
<div class="stat"><b id="sDays">–</b><span>监测天数</span></div>
<div class="stat"><b id="sArxiv">–</b><span>arXiv 预印本</span></div>
<div class="stat"><b id="sExtra">–</b><span>其他来源</span></div>
<div class="stat"><b id="sJour">–</b><span>期刊/会议补录</span></div>
</div>
<div class="bar">
<input id="q" placeholder="搜索标题 / 作者 / 关键词…">
<select id="cat"><option value="">全部分类</option></select>
<select id="src"><option value="">全部来源</option></select>
<select id="day"><option value="">全部日期</option></select>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
</div>
<script>
const DATA = {"days": [{"date": "2026-09-30", "summary": "今日 arXiv 六个分类共 50 篇去重命中（含 22 篇 new），精选 12 篇 v1 新论文 + 1 篇期刊补录。最值得关注的是 **CoSec（2609.34790）**——首个面向多用户/多社区 agent 系统的 authorization benchmark，把\"授权状态\"作为执行期验证的一等对象，与我们的\"查询时逐 AU 求值\"思路同构，是 Agent 访问控制线的直接邻居；以及 **Residual Authority Replay（2609.33910）**——揭示授权决策\"有效期\"本身就是攻击面（ASR 最高 +35.1pp），反向论证了我们\"策略独立存放、查询时无状态求值\"设计的合理性，可直接写入 Discussion 的 revocation 段落。另有 **Authorization Closure Graph（2609.32428）** 给撤销/策略变更的形式化提供了雏形，**BMA（2609.32186）** 的\"provenance-bound authorization 远胜 memory-side controls\"（2.0% vs 11.0%）是我们绑定与执行语义的外部实证。RAG 主线的新攻击 **LENS（2609.35155）** 属于完整性轴而非机密性轴，与我们的威胁模型正交，但应在 Related Work 中提及以界定 scope。", "papers": [{"title": "CoSec: Benchmarking Agent Security in Communities", "authors": "Hao Chen（一作）等 15 人", "url": "https://arxiv.org/abs/2609.34790", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "首个可执行的 agent 社区安全 benchmark，208 个场景覆盖固定/演化边界，用执行轨迹对照\"活跃授权状态\"验证信息流是否越权。", "insight": "这是我们 Agent 访问控制线最直接的邻居工作。它的核心发现——\"task utility 不蕴含 authorization compliance\"——正是我们整篇论文的动机句式，可直接引用。方法论上，它把 authorization state 作为执行期验证对象，与我们的\"查询时逐 AU 求值 P(a,u)\"同构；其场景设计（跨社区、演化边界）可作为我们未来 Agent 线 benchmark 的起点。注意它测的是 agent 系统整体而非 RAG 检索层，不与我们的 claim 直接竞争，定位是 related work + 动机证据。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "When Consent Outlives Context: Residual Authority Replay in Long-Lived Agents", "authors": "Zhihao Zhang（一作）等", "url": "https://arxiv.org/abs/2609.33910", "category": "cs.AI（v1, 2026-09-27）", "cats": ["cs.AI"], "oneliner": "揭示 long-lived agent 中\"授权残留\"攻击：良性交互合法获得的授权在后续对抗执行中被重放，6 个 LLM 家族上 ASR 最高提升 35.1pp。", "insight": "这是我们威胁模型缺失的一维：授权决策的有效期/上下文绑定。我们的框架目前是查询时无状态求值 P(a,u)，这篇文章反向证明了\"把授权结论持久化（缓存、记忆）而不绑定上下文\"必然产生残留授权攻击面——这恰好论证了我们\"策略独立存放、chunk 不存密级结论\"设计的正确性。建议写入 Discussion 的 revocation / time-bounded authorization 段落，并作为 Agent 线 threat model 的新增攻击范式（纵向攻击：先合法取权、后重放）。不动摇现有 claim，反而加强设计合理性。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Authorization Closure Graph: Minimal Repair for LLM Agents with Evolving User Instructions", "authors": "Qingzhuo Wang（一作）等", "url": "https://arxiv.org/abs/2609.32428", "category": "cs.AI（v1, 2026-09-26）", "cats": ["cs.AI"], "oneliner": "把授权及其依赖表示为演化的版本化状态（ACG），指令变更时只选择性失效受影响的授权并计算 minimal repair。", "insight": "这是我们 Discussion 未来工作\"撤销机制\"的最接近的形式化雏形：策略/指令变更时，哪些授权失效需要精确计算而非全量重算。它的 minimal repair 思路可直接引用为 related work。但注意其粒度是\"指令级动作授权\"，未涉及内容级细粒度授权（我们的 AU 级）；可作为对比点——我们是 per-query per-AU 求值，他们是 per-instruction 状态维护。威胁面不超出我们的 T1/T2/T3，但补充了时间维度的授权一致性问题。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "BMA: Backchain Memory Attacks Create Unauthorized Control Paths in LLM Agents", "authors": "Kaisheng Fan（一作）等", "url": "https://arxiv.org/abs/2609.32186", "category": "cs.CR（v1, 2026-09-26）", "cats": ["cs.CR"], "oneliner": "攻击者不写记忆、不改任务，仅编辑低信任证据，经记忆固化后在干净任务中被检索并驱动受保护动作；provenance-bound authorization 将攻击成功率压到 2.0%，远胜 memory-side controls 的 11.0%。", "insight": "这是对我们\"绑定与执行语义\"核心设计最有力的外部证据：事后管控记忆（memory-side controls）远不如按来源绑定授权（provenance-bound authorization）——与我们的\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"完全同构，可在论文中引用为设计选择的实证支撑。方法论上，它的 Path-CASR（registered pathway + matched-intervention checks，区分记忆介导命中与巧合命中）值得借鉴：我们的 A1 cloze 评估同样需要区分\"真实泄露\"与\"标注缺口/巧合命中\"。对 RAG 主线，持久化记忆通道 ≈ 我们的 embedding 通道（持久化表示泄露），类比成立。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "LENS: The Sum Is Worse Than the Parts for Set-Level Poisoning in Retrieval-Augmented Generation", "authors": "Kaisheng Fan（一作）等（与 BMA 同一团队）", "url": "https://arxiv.org/abs/2609.35155", "category": "cs.CR（v1, 2026-09-28）", "cats": ["cs.CR"], "oneliner": "形式化 RAG 的 set-level compositional poisoning：单个文档各自无害、合在一起才把 RAG 输出带偏到目标答案（full-set ASR 0.852，任一真子集 ≤0.069）。", "insight": "诚实地说，这是与我们正交的轴：LENS 是完整性（integrity）攻击，我们的威胁模型是机密性（未授权披露）。它不在我们的 T1/T2/T3 之外，而是不在同一维度。但应在 Related Work 中引用以完整界定 RAG 攻击面、明确我们的 scope 限定在访问控制/披露风险。方法论可借鉴：它的\"真子集不足\"形式化定义与 counterexample-guided repair 构造方式，可类比用于设计针对我们 projection 机制的组合式压力测试（多个各自合规的 AU 组合后是否泄露）。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "RAISE: Reinforcing Access Control Policy Synthesis in LLMs via Symbolic Evaluation", "authors": "Yingming Zhou（一作）等", "url": "https://arxiv.org/abs/2609.33796", "category": "cs.SE, cs.CR, cs.LG（v1, 2026-09-27）", "cats": ["cs.SE", "cs.CR", "cs.LG"], "oneliner": "构建 CedarInstruct（5,800 场景 / 44 领域，首个支持可验证 Cedar 策略合成的数据集），并用 verifier 信号做两阶段训练（SFT + off-context GRPO）提升策略语义正确率。", "insight": "我们的\"策略独立存放\"一直缺一个具体的策略语言实例；Cedar（AWS 开源策略语言）是现成候选，CedarInstruct 给了策略合成的可验证 benchmark——我们若要做 end-to-end demo，策略层可直接用 Cedar，评估可用 CedarBench。这是工程实现层的相关工作，不涉及检索/披露威胁面，不动摇安全 claim。它的训练发现（verifier signal 的用法比用量更重要）对我们无直接影响。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Certified Multi-Source Integrity for Structured Agent Actions", "authors": "Anmol Pandey（一作）等", "url": "https://arxiv.org/abs/2609.34245", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "在 corruption budget 下给出\"最大可用\"的安全认证器：动作的每个字段必须通过其证据结构支持的规则（corruption-distinct 证据类的 minimum hitting set 计数），否则拒绝执行。", "insight": "防御思路可借鉴但轴不同：它是完整性认证（字段值是否被污染），我们是机密性（未授权内容是否披露）。其\"corruption-distinct 证据类 / minimum hitting set\"形式化与我们的 KG 路径切割有类比价值——都是把\"证据独立性\"变成图/集合上的计数问题。它的实证发现（genuine corroboration 是少数现象；naive attestation counting 高估独立性）对我们的 NLI 残留检查是个警示：看似独立的公开证据可能共享上游来源。关联中等，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Policy-Conditioned Constrained Decoding for Column-Level Access Control in Text-to-SQL", "authors": "Ryoto Miyamoto（一作）等", "url": "https://arxiv.org/abs/2607.12341", "category": "cs.CL, cs.CR, cs.DB", "cats": ["cs.CL", "cs.CR", "cs.DB"], "oneliner": "把列级使用策略编译进解码器的 per-token logits mask，单次解码确定性消除列误用，在 Spider-CU 上达到 0% 泄露率。", "insight": "这是细粒度访问控制在 text-to-SQL 的实例，与我们的 AU 级控制形成跨领域对照：他们把策略执行点放在生成时（enforcement at generation），我们放在检索后（enforcement at retrieval / retrieve-then-project）——两种\"策略执行点\"设计的对比可在 Related Work 里写一节。它的\"column-use policy 按语义使用区分（output/filter/aggregation）\"提示我们的 P(a,u) 也可按\"使用方式\"（直接引用 vs 仅作排序信号）区分授权语义，这是个可探索的新问题。确定性零泄露的实证与我们的\"直接零泄露\"安全目标呼应。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Near-Duplicate Families Break Exact-Record Membership Inference", "authors": "Yiyong Liu（一作）等", "url": "https://arxiv.org/abs/2609.33909", "category": "cs.CR（v1, 2026-09-27）", "cats": ["cs.CR"], "oneliner": "证明标准 MI 在近似重复家族存在时系统性误判：CC-News 上 clean-reference LiRA 把 99.70% 的\"家族在场但精确记录不在\"的样本判为成员。", "insight": "直接相关：我们的 A2 成员推断评估（top-1 分数 AUROC 0.655→0.484）用的正是这类 MI 方法论。这篇文章说明 MI 阳性证据可能只是 family-level exposure——我们\"残余 4.05% 为标注缺口通道\"的结论需要更谨慎的表述，残余命中里可能混有近似重复而非真实机密。建议在论文 limitations 里引用：MI-based 泄露度量本身有系统性高估风险。好消息是 89.4%→4.05% 的量级差远大于此混杂，不动摇主要 claim，但要求我们对 A2 数字的表述更诚实。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Silent Failures in Agentic Security Evaluation: A Validated Harness for Tool-Call Mediation Under Indirect Prompt Injection", "authors": "Animesh Shaw", "url": "https://arxiv.org/abs/2609.32691", "category": "cs.CR, cs.LG（v1, 2026-09-26）", "cats": ["cs.CR", "cs.LG"], "oneliner": "审计 IPI benchmark 的评估工具链，找出四类\"沉默缺陷\"（如按工具身份而非参数计分可把 ASR 从 1.2% 虚报为 21.7%），并发布了使缺陷不可表示的 harness。", "insight": "方法论警示，直接相关。我们的对抗评估 A1（cloze 89.4%→4.05%）和 A2（AUROC 0.655→0.484）必须自查这四类缺陷——特别是\"攻击成功按检索命中而非实际披露内容计分\"（类比 tool-identity vs argument-level scoring）。建议在 THREAT_MODEL.md 或论文附录加一段 evaluation-validity 自查说明。这是诚实局限写作的范本；不提供新攻击面，不动摇 claim。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "API Secrets Should Never Become Tokens in the LLM's Vocabulary", "authors": "Patrick Kenney（一作）等", "url": "https://arxiv.org/abs/2609.33371", "category": "cs.CR, cs.AI, cs.LG（v1, 2026-09-27）", "cats": ["cs.CR", "cs.AI", "cs.LG"], "oneliner": "形式化 agent 系统中 API 凭证暴露的威胁链，评估 vault-mediated 执行边界（模型只选 connector 标识，凭证由可信边界注入）。", "insight": "关联较弱。主题是 agent 系统的凭证卫生，不是 RAG 内容访问控制。唯一可借鉴的是\"执行边界\"思想：敏感材料（对我们是未授权 AU 内容，对他们是 API key）不应进入模型可观测的数据管道——与我们的 retrieve-then-project 在哲学上一致，可在 Discussion 里一笔带过。Agent 线相关度高于 RAG 主线。", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "CoDeL: Co-Evolutionary Defense against Indirect Prompt Injection in LLM-based Agents", "authors": "Xiao Yang（一作）等", "url": "https://arxiv.org/abs/2609.34463", "category": "cs.CR, cs.AI（v1, 2026-09-28）", "cats": ["cs.CR", "cs.AI"], "oneliner": "防御者与攻击探测器协同进化的 IPI 训练式防御，在三个 benchmark 上把 ASR 降低 88.5%。", "insight": "关联较弱。IPI 防御属于完整性轴，与我们的访问控制（机密性轴）正交；训练式防御思路对我们的声明式策略框架无直接借鉴。列入仅为不漏检。\n---", "source": "arXiv", "citations": "", "code": "", "zh_abs": "", "supplement": false}, {"title": "Permission-Aware RAG: Identity and Access Management (IAM)-Based Access Filtering in Multi-Resource Environments", "authors": "Jooyoung Jeong", "url": "https://doi.org/10.1109/access.2025.3628960", "category": "期刊", "cats": [], "oneliner": "这是与我们最直接对照的\"权限感知 RAG\"工作（IAM-based access filtering）；需精读全文判断它是 chunk 级继承过滤还是投影", "insight": "这是与我们最直接对照的\"权限感知 RAG\"工作（IAM-based access filtering）；需精读全文判断它是 chunk 级继承过滤还是投影", "supplement": true, "source": "期刊补录", "citations": "", "code": "", "zh_abs": ""}]}], "total": 13, "n_days": 1};
const CAT_LABEL = {"cs.CR": "安全", "cs.CL": "NLP/RAG", "cs.AI": "AI/LLM", "cs.DB": "数据管理", "cs.MA": "多智能体", "cs.HC": "人机交互", "cs.SE": "软件工程", "cs.LG": "机器学习"};
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const all = [];
DATA.days.forEach(d => d.papers.forEach(p => all.push({...p, date: d.date})));
document.getElementById('sTotal').textContent = all.length;
document.getElementById('sDays').textContent = DATA.days.length;
document.getElementById('sArxiv').textContent = all.filter(p=>(p.source||'arXiv')==='arXiv' && !p.supplement).length;
document.getElementById('sExtra').textContent = all.filter(p=>!p.supplement && (p.source||'arXiv')!=='arXiv').length;
document.getElementById('sJour').textContent = all.filter(p=>p.supplement).length;
const srcs = [...new Set(all.map(p=>p.supplement ? '期刊补录' : (p.source||'arXiv')))].sort();
const srcSel = document.getElementById('src');
srcs.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; srcSel.appendChild(o); });
function srcOf(p){ return p.supplement ? '期刊补录' : (p.source||'arXiv'); }
const cats = [...new Set(all.flatMap(p => (p.cats||[]).length ? p.cats : (p.supplement ? ['期刊'] : [])))].sort();
const catSel = document.getElementById('cat');
cats.forEach(c => { const o = document.createElement('option'); o.value = c;
  o.textContent = (CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c; catSel.appendChild(o); });
const daySel = document.getElementById('day');
DATA.days.forEach(d => { const o = document.createElement('option'); o.value = d.date; o.textContent = d.date; daySel.appendChild(o); });
function badge(p){
  const s = srcOf(p);
  const cls = s === 'HuggingFace' ? 'badge hf' : (s === 'OpenAlex' ? 'badge oa' : (s === '期刊补录' ? 'badge j' : 'badge'));
  let h = '<span class="' + cls + '">' + esc(s) + '</span>';
  if (p.supplement) return h;
  return h + (p.cats||[]).map(c => '<span class="badge">' + esc((CAT_LABEL[c] ? CAT_LABEL[c] + ' · ' : '') + c) + '</span>').join('');
}
function codeHtml(code){
  const m = (code||'').match(/github\.com\/([\w.\-]+\/[\w.\-]+)/);
  if (m) return '<a href="https://github.com/' + esc(m[1]) + '" target="_blank" rel="noopener">💻 ' + esc(m[1]) + '</a>';
  return '';
}
function pdfUrl(u){
  const m = (u||'').match(/arxiv\.org\/abs\/([\d.]+)/);
  return m ? 'https://arxiv.org/pdf/' + m[1] + '.pdf' : '';
}
function card(p){
  const pdf = pdfUrl(p.url);
  const links = (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">原文页面</a>' : '')
    + (pdf ? ' · <a href="' + esc(pdf) + '" target="_blank" rel="noopener">PDF 直链</a>' : '');
  const ch = codeHtml(p.code);
  const xtra = ((p.citations && p.citations !== '尚未收录') ? '<span>📊 引用 ' + esc(p.citations) + '</span>' : '')
    + (ch ? '<span>' + ch + '</span>' : '');
  return '<div class="card"><h3><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a></h3>'
    + '<div class="meta">' + badge(p) + '<span>' + esc(p.date) + '</span></div>'
    + (p.authors ? '<div class="authors">' + esc(p.authors) + '</div>' : '')
    + (p.oneliner ? '<div class="one">' + esc(p.oneliner) + '</div>' : '')
    + (p.zh_abs ? '<div class="zhabs"><b>中文摘要</b><br>' + esc(p.zh_abs).replace(/\n/g,'<br>') + '</div>' : '')
    + (p.insight ? '<div class="insight"><b>对我们论文的启迪</b><br>' + esc(p.insight).replace(/\n/g,'<br>') + '</div>' : '')
    + (xtra ? '<div class="xtra">' + xtra + '</div>' : '')
    + (links ? '<div class="link">' + links + '</div>' : '')
    + '</div>';
}
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const c = catSel.value, s = srcSel.value, d = daySel.value;
  let html = '', n = 0;
  DATA.days.forEach(day => {
    if (d && day.date !== d) return;
    const ps = day.papers.filter(p => {
      if (c && !((p.cats||[]).includes(c) || (c === '期刊' && p.supplement))) return false;
      if (s && srcOf(p) !== s) return false;
      if (q && !((p.title + ' ' + p.authors + ' ' + p.oneliner + ' ' + (p.zh_abs||'') + ' ' + p.insight + ' ' + (p.code||'')).toLowerCase().includes(q))) return false;
      return true;
    });
    if (!ps.length) return;
    n += ps.length;
    html += '<div class="day"><h2>📅 ' + esc(day.date) + '（' + ps.length + ' 篇）</h2>';
    if (day.summary && !q && !c && !s) html += '<div class="summary">' + esc(day.summary).slice(0, 600) + '</div>';
    html += '<div class="grid">' + ps.map(card).join('') + '</div></div>';
  });
  document.getElementById('list').innerHTML = html || '<div class="empty">没有匹配的论文，换个关键词试试。</div>';
  document.getElementById('count').textContent = '共 ' + n + ' 篇';
}
['q','cat','src','day'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script>
