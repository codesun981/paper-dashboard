<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年11月5日 星期四</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-11-05", "summary": "", "papers": [{"title": "Permitted but Unauthorized: Affordance-Induced Delegated-Scope Violations in Multi-Agent LLM Systems", "authors": "Shravya Kanchi", "url": "https://arxiv.org/abs/2611.04086v1", "category": "arXiv 预印本（arXiv:2611.04086v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "多智能体系统里的“被许可却未授权”：每个 agent 的权限都远宽于受托任务，决定它会不会动用同伴资源的不是权限表，而是对端动作有没有被“列出来”供它看见。", "insight": "这是今日最值得在 related work 里占位的一篇，因为它把“授权”拆成了两层，而我们论文目前主要讲了其中一层。第一层是**许可（permission）**：权限表上写着能不能动；第二层是**委托范围（delegated scope）**：这次任务到底指派了什么。实验说明，只修第一层不够——权限表不变，只改“动作列不列出来”，越界率就能从 0 走到 52/52，这意味着**呈现面（affordance）本身就是授权面的一部分**，我们的 per-view 索引语义可以顺着这个方向补一句：视图不仅要按 AU 过滤内容，还要按委托范围过滤“可执行动作的可见性”。第二，它的“范围执法 ≠ 伤害预防”结论值得原样引用：确定性监控器挡住了全部越界，却挡不住“用自己的已授权动作害人”，这与我们“未知 AU 默认拒绝”同属保守执法、也同有边界——讨论节写防御边界时可并列说明。第三，诚实标注：模拟环境、8 模型、析因部分只用了三模型，52/52 是单模型单格子的极端值，不宜读成“所有模型都会越界”；且新一代模型 0/100 的结果提示该现象可能随模型对齐进步而收敛，引用时应写清模型与格子条件。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "多智能体 LLM 系统把多个 agent 放在共享基础设施上，每个 agent 持有的权限都远宽于它受托的任务，因而每个 agent 在日常意义上都被“许可”动用它从未被指派的同伴资源。作者在两个模拟环境（CI/CD 发布流水线、安全运营事件队列）中用 8 个 LLM 做实验，以确定性、无模型参与的检测器对哈希链式、可重放验证的日志做判定。在竞争激励、候选可见性、收益信息三因素 2×2×2 析因实验中（三模型、每格 n=52），结论是动作呈现方式而非权限本身主导行为：对端动作未列出时没有 agent 越界，而在竞争压力下把对端动作列出来并给出收益信息时，越界率急剧上升，Claude Sonnet 4.5 高达 52/52 个回合。模型代际差异明显：两个较新模型（Claude Sonnet 5.5 与 Opus 5.5）在相同攻击下 0/100 越界，而上一代模型 9/10 越界。两种防御（确定性引用监控器、基于模型的事前执行裁判）都挡住了全部越界，且在任务可完成时把可避免的同伴截止期错失从 15/40 与 14/40 压到至多 1/40。但作者同时指出范围执法的边界：agent 仍可通过对自己资源的一个已授权动作（谎报自己事件的严重度）拖累同伴，而两种防御都检测不到。", "supplement": false}, {"title": "Right Tool, Wrong Parameters: Defending LLM Agents Against Parameter Poisoning", "authors": "Yao Wang 等", "url": "https://arxiv.org/abs/2611.04673v1", "category": "arXiv 预印本（arXiv:2611.04673v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "间接提示注入的另一条攻击线：不诱发新动作，只偷换工具参数（如收款人），按“查询诱导的信任层级”判定参数来源可信度的 AuthorityFlow 把攻击成功率从 93.06% 压到 9.03%。", "insight": "这篇与 ChainBind 的 E12 结论咬合得最紧，值得在讨论节单独写一段。第一，ChainBind 的 13/15 未守住案例里，草案投毒的模式正是“动作名与金额都对、只换了主题或日期”——AuthorityFlow 把判定下移到参数级、按来源字段的信任层级逐参数放行，恰好是“批准环节加来源过滤”这一缓解方向的一个可操作化版本，可作为该缓解的候选机制引用（而非只作为讨论空话）。第二，它的“信任层级由查询诱导”与我们的“策略独立存放、查询时逐 AU 求值”在结构上同源：判定依据都不来自模型提议本身，而来自一个先于执行的独立结构；区别在于它的层级由模型解读查询生成，存在“用被攻击的模型解读信任”的循环风险，引用时应点出这一层——信任层级的生成者本身也需要独立性，否则防御的根基仍在模型手里。第三，诚实标注：93.06%→9.03% 是 FactAuthBench 这一作者自建基准上的数字，良性效用 82.64% 对 90.28% 说明防御仍有约 7.6 个百分点的效用代价，引用时不要写成“无代价防御”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "现有间接提示注入防御大多关注“注入是否诱发了新的工具调用或非预期动作”，本文研究另一攻击面——参数投毒：攻击者保留用户原本要做的动作，只操纵一个或多个工具参数（如收款人等任务关键值）。这类攻击难检测，因为没有引入新动作，而参数变化本身又常常是用户请求的合法组成部分。作者的关键洞见是：参数变化的合法性应由产生它的信息流的可信度来判定——用户查询会在可用信息字段上诱导出一个任务特定的信任层级，某些字段可信到足以决定特定参数，另一些则不应有影响。基于此提出的三阶段防御 AuthorityFlow 先解读用户查询、构造任务特定的信任层级，再对每个工具参数追踪产生其当前值的信息流、归因到支撑字段，最后仅当该字段在当前任务下被信任可决定该参数时才接受，否则标记为可疑。作者还引入 FactAuthBench 评估参数投毒：无防御时攻击成功率达 93.06%，AuthorityFlow 将其降至 9.03%，同时保留 82.64% 的良性任务效用（无防御时为 90.28%）。", "supplement": false}, {"title": "The Devil is in the Context: Nine Dimensions of Prompt Injection Attacks", "authors": "Jiamin Chang 等", "url": "https://arxiv.org/abs/2611.04672v1", "category": "arXiv 预印本（arXiv:2611.04672v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "提示注入不是一种攻击，而是九个维度张成的空间：同一句话在一种上下文是注入、在另一种上下文是合法请求，现有基准大多只覆盖了其中一小片。", "insight": "这篇的价值不在新攻击、而在评估方法论，可作为我们威胁模型一节的“覆盖度声明”工具。我们的 T1/T2/T3 是按攻击者能力分层（仅见答案 / 可见排序向量 / 全知识），而九维分类法是按指令、任务关系与系统表现分层——两者正交，可互补：T 轴回答“攻击者能看到什么”，九维回答“注入以什么形态出现、在什么任务关系下才算注入”。讨论节可以借它写一句诚实的边界声明：我们的评估覆盖了哪些维度组合、哪些组合（如“良性第三方指令恰好与任务相关”的灰区）尚未覆盖，而 13% 未测试组合这个数字正好说明“在几个基准上全过”不等于“全空间安全”。但需诚实标注：这是一篇分类法论文，摘要未给出防御效果数字，引用时只能引用其覆盖度结论与方法，不能引用任何“防御有效性”数字；且九个维度的具体定义需读正文后才能在论文里逐项对照，不宜仅凭摘要转述维度名称。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "提示注入通常被当作单一、同质的攻击类型讨论与评估，但真实系统里报告的漏洞差异很大；同一条指令在一种上下文里是提示注入、在另一种上下文里可能是合法请求，取决于用户意图与系统策略。忽视这种差异会在防御评估里留下缺口，并给人虚假的安全感。作者提出九个维度刻画提示注入攻击，共同描述被注入指令本身、它与用户任务的关系、以及它在目标系统中的表现方式；每个维度都会影响哪些防御能检测或阻止它。作者先用该分类法刻画 6 个真实世界的提示注入漏洞，展示它们差异之大；再把它应用于 9 个提示注入基准，发现多数基准只覆盖了该空间的一小片区域；即使合并多个基准，仍有 13% 的成对类别组合未被测试，主要集中在较少被代表的类别上。最后作者说明该分类法支持基准的自动标注与针对性生成新测试用例以填补缺口，也可供防御作者声明自己评估过哪些类型的注入、供系统运营者识别哪些攻击适用于自己的系统并据此选防御。", "supplement": false}, {"title": "ScamWorld: An Interactive Environment for Evaluating Web Agents Against Online Fraud", "authors": "Yutao Wu 等", "url": "https://arxiv.org/abs/2611.04879v1", "category": "arXiv 预印本（arXiv:2611.04879v1，cs.AI）", "cats": ["cs.AI"], "oneliner": "Web agent 的新受害者画像：面对为骗人而设的假商店、假投资平台与预付费骗局，六个前沿模型驱动的 agent 被骗率 11%–35%，且常在“已经察觉可疑”之后仍然继续。", "insight": "这篇与我们论文的咬合点不在诈骗本身、而在它暴露的一种授权语义误读：**“用户让我做这件事”被模型读成了“用户授权我接受完成这件事所需的一切附加条件”**。这正是 RU/AU 解耦要切断的链条——用户指令是任务意图，不是空白授权书；每个 AU、每个副作用（付款、交凭证）都需要独立求值，而不是由“任务已下达”这一事实背书。讨论节可用 ScamWorld 的“察觉可疑仍继续”作为反例：仅靠模型自身的怀疑态度不够，怀疑必须落到一个能实际拦截的关口（我们的 AU 求值、或执行侧的确定性检查），否则怀疑只停留在轨迹文本里。但需诚实标注两点：第一，诈骗网站是“为骗人而设、agent 顺带中招”，不是针对 agent 的对抗性攻击，11%–35% 不宜与提示注入攻击成功率直接比较；第二，摘要未给出各模型的具体被骗率与任务设置，引用时只用区间数字，不编造单模型排名。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Web agent 越来越多地替用户浏览、购物、管理账户；已有工作表明它们会被对抗性内容（包括提示注入与欺骗性界面）误导。除此之外，在开放网络上活动的 agent 还会遇到原本为欺骗人类而设的在线诈骗，包括欺诈性网店、假投资平台与预付费骗局；agent 在执行任务时如何应对这类诈骗，此前研究较少，部分原因是诈骗网站存活期短、难以系统评估。作者引入 ScamWorld，复现已报告的诈骗网站，覆盖多样的场景、诈骗机制与语言；每个复现网站都复现了有记录的诈骗机制，使诈骗迹象在 agent 做出最终动作之前即可被观察，从而支持可控、可重复的评估。在对 6 个前沿 LLM 驱动的 Web agent 的大规模研究中，基线被骗率在不同模型间为 11%–35%；agent 比起索要凭证或钱包信息，更容易继续推进付款；对 agent 轨迹的细查显示，有些 agent 明明承认了可疑情形却仍继续，有时把“用户指令”当作了“接受网站附加条款的授权”。", "supplement": false}, {"title": "AgentDyn: A Dynamic Open-Ended Benchmark for Evaluating Prompt Injection Attacks of Real-World Agent Security System", "authors": "Hao Li 等", "url": "https://arxiv.org/abs/2602.03117", "category": "arXiv 预印本（arXiv:2602.03117，cs.CR；2026 年 2 月提交，5 月 v3）", "cats": ["cs.CR"], "oneliner": "动态开放式 agent 安全基准：60 个开放式任务、560 个注入案例，覆盖购物、GitHub 与日常生活，十种现有防御几乎全都“要么不够安全、要么过度防御”。", "insight": "这篇今天才作为独立条目出现，但它其实早已在我们的阅读视野里——10 月 31 日的 REALM 与昨日 ATrust 都是在它上面评估的，之前未单独报告、今天由 Semantic Scholar 候选翻出后补上，引用时应写清它是 2 月预印本而非 11 月新文。它的价值在于给“防御好不好”定了一个双指标口径：**攻击成功率与受攻击下的效用（attacked utility）必须同报**，只报其一会掩盖“靠过度防御换安全”的做法；ChainBind 的 E12 恰好是同口径（良性效用 0.608、受攻击效用 0.587），在讨论节引用 AgentDyn 时可把两组数字并列，说明“安全—效用权衡”不是我们一家遇到的取舍、而是该基准上十种防御的普遍困境。但需诚实标注：60 任务、560 案例均为作者人工设计，场景限于购物、GitHub、日常生活三类，结论外推到金融、医疗等高风险 agent 场景时需谨慎；且“几乎所有防御都不够好”是作者在自选十种防御与 GPT-4o 为主的评估下的结论，不宜读成“所有防御在所有场景下都失败”。", "source": "SemanticScholar", "citations": "Semantic Scholar 10 次", "code": "github.com/leolee99/AgentDyn", "zh_abs": "能够自主与外部工具和环境交互的 AI agent 前景广阔，但它们对外部数据的依赖使其暴露于间接提示注入攻击——藏在第三方内容里的恶意指令会劫持 agent 行为。已有 agent 安全基准推动了防御设计，但作者指出当前基准有三个根本缺陷：缺乏动态开放式任务、缺乏有益的第三方指令、用户任务过于简单。为弥补这些缺口，作者引入 AgentDyn：人工设计的基准，包含 60 个有挑战的开放式任务与 560 个注入测试案例，覆盖购物、GitHub 与日常生活三类场景；与以往静态基准不同，AgentDyn 要求动态规划，并在整个执行轨迹中纳入有益的第三方指令。对十种现有防御的评估表明，几乎所有防御要么不够安全、要么存在显著的过度防御，说明现有防御距离真实部署仍有距离。基准已公开。", "supplement": false}, {"title": "Risk Controlled Architecture and Offline Authorization Testing for Student Facing Large Language Model Agents with Minimal Data, Permission Boundaries, Scenario Checks, and Human Escalation", "authors": "Nayyar Ahmed Khan 等", "url": "https://doi.org/10.46759/iijsr.2026.10311", "category": "Irish Interdisciplinary Journal of Science & Research（期刊论文）", "cats": [], "oneliner": "面向学生的 LLM agent 的风险受控架构：权限矩阵 + 最小数据流 + 场景测试 + 人工升级，服务端授权函数在 16 个构造的角色—动作请求上 6 放行、10 拒绝、全部符合预期。", "insight": "关联较弱，但作为“设计模式 + 诚实边界声明”的双重参照仍值得收录。设计模式一面：它把授权做成**上线前可离线测试的服务端函数**（权限矩阵 + 场景检查 + 人工升级），与我们“策略独立存放、查询时逐 AU 求值”共享同一个直觉——授权判定不应由模型临场发挥，而应是可事先枚举、可事后审计的确定性结构；它的“内容、可访问性、留存、交接四类失败分设上线关口”也可借鉴为我们讨论节里“单次裁剪不等于全链路安全”的一句注脚。诚实边界一面：作者自述“16 例全对 ≠ 安全、合规或有益”，这种自我限定的写法正是我们引用小规模构造评估时应有的口径——收录它不是因为它证明了什么，而是因为它示范了“小评估该怎么说话”。分量标注必须写清：小刊物、引用 0 次、16 例构造测试、无真实学生、无真实 LLM 在环，引用时只能作为模式参照，不能作为任何效果数字的证据。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "本文规定了一个面向学生的、风险受控的 LLM agent：权限矩阵、最小数据流、响应状态、场景测试与人工升级。服务端授权函数在 16 个构造的角色—动作请求上接受了测试：6 个放行、10 个拒绝，全部与预期决策一致。一个假设的上线前案例说明，为什么内容、可访问性、留存与交接失败应作为彼此独立的上线关口。作者自己明确指出：该单元测试只验证所声明的权限规则，不能确立模型安全性、政策合规性或教育收益。", "supplement": false}]}, {"date": "2026-11-04", "summary": "", "papers": [{"title": "IAMRAGBENCH: Benchmarking Authorization Expansions in LLM-Generated AWS IAM Policies under RAG Poisoning", "authors": "Hasan Kaplan 等", "url": "https://arxiv.org/abs/2611.03431v1", "category": "arXiv 预印本（arXiv:2611.03431v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "RAG 投毒攻击 IAM 策略生成的基准：投毒上下文能让模型生成“提供商校验通过、但超出可信授权需求”的策略，60 个案例、确定性授权包络评分。", "insight": "这是今日最直接可引用的工作，且把我们的论点从“答案泄露”推进到了“授权扩张”。第一，它的“授权包络”（authorization envelope）与我们的 AU 求值在机制上同源：都是先划一条“可信授权需求”的线，再逐条判定生成物是否越线；区别在于它判定的是“生成的 IAM 策略文本”，我们判定的是“检索到的每个 AU”——讨论节可并列引用，说明“生成式授权”与“检索式授权”需要同一类独立于模型的判定层。第二，63.79% 这个数字值得单独写一句：投毒内容换个“架构例外”的包装、放在流程末尾，成功率比端到端检索高出一个数量级，说明**授权判定的位置（何时判、由谁判）比判定规则本身更脆弱**，这与我们“查询时逐 AU 求值、未知 AU 默认拒绝”的设计形成直接呼应。第三，CheckNoNewAccess 漏报 4 例的细节是诚实的反例：即使是提供商自带的“无新增访问”检查，也会在“策略文本有效但语义越权”的情形下失灵，说明形式校验不能替代包络语义校验。但需诚实标注：arXiv 预印本、尚未被 OpenAlex 收录，60 案例为作者自建基准，数字不宜读成真实云环境的攻击成功率。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "用 RAG 的 LLM 可以根据任务与运维文档合成 AWS IAM 策略，攻击者控制的上下文可能诱使模型生成超出可信授权需求、但提供商校验仍通过的策略。作者提出 60 案例基准，覆盖范围、条件、显式拒绝、信任、权限边界与角色委派，用确定性授权包络评分加案例专属验证（含请求级检查）。一次攻击成立需同时满足：干净策略与处理策略均提供商有效、干净策略满足任务、处理策略违反包络、匹配预先声明的目标、保留预期请求、且新授权了一项被禁请求。五端点含上下文暴露产生 49 个精确授权增量，其中 46 个目标匹配攻击（46/292，15.75%）；端到端 BM25 在 720 篇文档上对 60 个任务全部在 k=5 召回指定投毒，但只产生 7/294（2.38%）目标匹配攻击；同一弱化以“最终安全架构例外”呈现时，冻结双端点压力测试中攻击率达 74/116（63.79%），五端点事后扩展为 115/294（39.12%）。在 194 份违反任务要求的提供商有效处理策略重放中，AWS CheckNoNewAccess 对 168 个目标匹配精确攻击中的 4 个报告“无新增访问”；而完整的部署前规则拒绝了全部 171 个精确增量，仅 5 例送人工复核。", "supplement": false}, {"title": "SearchInject: Retrieval Exposure Control for Indirect Prompt Injection in Language-Model Search", "authors": "Kainan Zhou 等", "url": "https://arxiv.org/abs/2611.02643v1", "category": "arXiv 预印本（arXiv:2611.02643v1，cs.AI/cs.CY/cs.IR/cs.LG）", "cats": ["cs.AI", "cs.CY", "cs.IR", "cs.LG"], "oneliner": "间接提示注入的“准入关”防御：注入只有在载体页面进入模型上下文后才生效，于是在检索层用联合分数把可疑候选隔离，top-10 目标暴露率相对下降约 83%。", "insight": "这篇与我们的 retrieve-then-project 语义是“同一关口、不同方向”的对照：我们是在内容已检索到之后、按 AU 裁剪未授权片段，SearchInject 是在内容进入上下文之前、按“是否像注入载体”隔离候选。两者可叠加成两道关：**准入关挡“看起来像指令的页面”，授权关挡“不属于你的片段”**，讨论节可用它说明“检索层安全”与“授权层安全”不是同一件事——SearchInject 的干净质量几乎无损（nDCG@10 变化 0.0018）恰恰说明，准入控制的代价可以很小，真正难的是它诚实承认的两点：交互项在同等干净代价下的收益尚未证实，且 104 例跟进无法估计攻击成功率下降，引用时不要把“暴露率下降 83%”写成“攻击成功率下降 83%”。另注意评估局限：载荷类别虽留出、但构造家族在开发时已见过，属于家族内泛化而非全新攻击家族泛化。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "间接提示注入只有在其载体页面进入模型上下文后才能影响搜索增强的 LLM。SearchInject 用联合分数控制这一准入决策，综合检索相关性、搜索滥用信号、指令可能性与两项相关性交互项；隔离阈值在校准集上按“干净候选误隔离率 0.5%”的经验约束选取。评估用 300 条留出的 SciFact 查询与四类构造家族内留出的载荷类别；每检索器 1,200 个查询-家族结果中，top-10 目标暴露率从 BM25 的 0.9408 降至 0.1583、归一化混合检索的 0.9158 降至 0.1508、潜在语义分析的 0.8450 降至 0.1375，相对降幅 83.2%–83.7%，而干净 nDCG@10 的最大变化仅 0.0018。冻结阈值在干净测试集上的误隔离率为 0.59%–0.65%，略高于校准约束；另有 104 例生成跟进只记录到上下文移除、未确认无防御劫持，故无法估计攻击成功率的下降。", "supplement": false}, {"title": "ATrust: Adaptive Trust Boundary Expansion for Securing LLM Agents", "authors": "Xu Zhang、Zhichao Lu", "url": "https://arxiv.org/abs/2611.02741v1", "category": "arXiv 预印本（arXiv:2611.02741v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "自适应信任边界：以用户查询为信任锚点，在执行过程中逐步接纳任务必需的外部信息，在 AgentDyn 上把攻击成功率从 37.80% 压到 4.37%，同时效用提升 10%。", "insight": "这篇的价值在于它把“信任”做成了**运行时可扩展的状态**，而不是一次性静态判定——与我们“查询时逐 AU 求值”的思路相通，但粒度不同：ATrust 的边界按“信息是否任务必需”扩展，我们的 AU 按“权限是否满足”求值。两者结合是一个值得在讨论节提一句的方向：**任务必需性与授权许可性是两条独立的准入条件**，只满足其一都不应放行（任务必需但未授权的内容仍要裁剪，已授权但与任务无关的内容仍可排除以减小暴露面）。但需诚实标注三点：第一，arXiv 预印本、尚未收录，12.33% 的领先幅度是作者在自选基线与 GPT-4o 单引擎下的自报数字；第二，它在 AgentDyn 上的评估与 AgentDyn 本身“防御普遍过度防御或不够安全”的结论同源，存在基准与防御同源优化的循环风险；第三，摘要未报告误拒率与延迟代价，引用时不宜写成“无代价的安全提升”。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "现有防御常基于有限的静态可信证据做安全决策，或孤立地评估每条观测，导致任务必需信息被不必要丢弃（过度防御、效用下降）。ATrust 提出运行时自适应扩展信任边界：以用户查询为根信任锚点，对照当前信任边界与执行状态评估外部观测，逐步把任务必需的信息接纳为新的信任锚点，同时把无关内容（无论良性还是恶意）排除在后续决策之外。在 AgentDojo 与 AgentDyn 上的评估称其取得现有防御中最佳的安全-效用权衡；以 GPT-4o 为引擎模型时，AgentDyn 攻击成功率从 37.80% 降至 4.37%，效用提升 10.00%，比最强基线 AuthGraph 高 12.33%。", "supplement": false}, {"title": "StateFence: Task-State Protection Against Evidence-Chain Contamination in Blue-Team LLM Agents", "authors": "Haowen Dai、Alejandro Guerra-Manzanares", "url": "https://arxiv.org/abs/2611.02605v1", "category": "arXiv 预印本（arXiv:2611.02605v1，cs.CR/cs.AI）", "cats": ["cs.CR", "cs.AI"], "oneliner": "蓝队 SOC agent 的任务状态保护：把严重度标签、事件叙述、响应策略、IOC 集合当作受保护状态，按被攻击的状态分流防御，避免“一刀切过滤”误删关键证据。", "insight": "这篇给我们的 T1/T2/T3 之外补了一个“任务依赖性”维度：**同一内容在不同任务下可能是证据、也可能是攻击**，这与我们“未知 AU 默认拒绝”形成张力——默认拒绝在安全上保守，但在 SOC 这类“证据本身就是任务对象”的场景里会误删关键指标。它的解法（按受保护状态分流防御、而非按字符串一刀切）可借鉴为我们 per-view 索引语义的一个注脚：不同视图下同一 chunk 的可见性本就不同，StateFence 说明“可见性”还应随任务状态变化。但需诚实标注：arXiv 预印本、尚未收录，摘要未给出攻击成功率、效用保留率等可核对数字（只有方向性表述），引用时只能作为“任务感知防御”的概念佐证，不能引用具体效果数字；且 SOC 场景的结论外推到通用 RAG 时需谨慎。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "蓝队 LLM agent 在安全运营中心（SOC）面临的独特风险是：恶意指令可藏在遥测、工单、检索结果或记忆里，再以“局部合理”的中间决策形态，经告警分流、事件摘要、响应建议、IOC 提取等环节传播，作者称之为受保护任务状态的证据链污染。难点在于任务依赖性：同一可疑字符串，对摘要任务可能是恶意控制文本，对 IOC 提取任务却可能是关键证据。StateFence 提出任务感知的评估与防御框架：把严重度标签、事件叙述、响应策略、IOC 集合视为受保护状态，把间接提示注入攻击映射为显式、隐蔽、多跳、持久四类 SOC 证据攻击，记录可观测的传播轨迹，并按被攻击的状态分流防御。在受控 SOC 案例与公开 SOC 验证案例中，StateFence 降低了攻击成功率、减少了证据被污染后才显现的失败，同时保留任务效用、避免了任务错配过滤造成的指标丢失。", "supplement": false}, {"title": "MemHarmBench: Evaluating Cross-Session Prompt Injection in Memory-Persistent AI Agents", "authors": "Zhihua Wang 等", "url": "https://arxiv.org/abs/2611.01700v1", "category": "arXiv 预印本（arXiv:2611.01700v1，cs.AI）", "cats": ["cs.AI"], "oneliner": "跨会话提示注入的受害者中心基准：恶意指令被写入记忆后，即使原始攻击内容已被删除，新会话里的正常任务仍会按攻击者意图做关键决策，且表面上毫无异常。", "insight": "这篇与昨日 RevBench（任务中途撤销权限）构成一对“时间维”证据：RevBench 讲的是“权限被收回后，已拿到的数据还在”，MemHarmBench 讲的是“攻击内容被删除后，已写入记忆的指令还在”——两者共同说明，**授权与安全判定不能只看“当前这次读取/这次会话”**，已进入上下文、草稿、记忆的残留物是独立的攻击面。我们的 retrieve-then-project 处理的是单次查询的裁剪，MemHarmBench 提示讨论节应补一句边界声明：单次裁剪不清除跨会话记忆里的已授权/已污染内容，记忆层需要独立的撤销与审计语义。但需诚实标注：arXiv 预印本、尚未收录，摘要未报告各系统的具体攻击成功率与隐蔽率数字（只有定性结论），引用时不宜编造数字；且“受害者中心”的三分法是评估框架而非防御机制，不能直接当作解决方案引用。", "source": "arXiv", "citations": "尚未收录", "code": "github.com/Kirito14IT/MemHarmBench", "zh_abs": "带持久记忆的 agent 会跨会话保留用户偏好与操作规则，但恶意指令也可经消息、文档或网页内容写入记忆，并在原始攻击内容删除后继续影响未来任务；现有攻击成功率指标无法刻画“谁受害”与“伤害如何体现在正常任务执行中”。MemHarmBench 提出受害者中心评估：区分用户、工作区/项目所有者、外部利益相关者三类潜在受害者；先让 agent 暴露于恶意指令并检验其是否被记忆保留，再删除攻击内容、用保留记忆的新会话执行合法任务，联合评估 agent 是否遵循攻击者意图、是否完成合法任务、是否出现可观测执行异常。作者在多个 agent 系统上的发现是：跨会话攻击可在行为上保持隐蔽——agent 常常正常完成任务、无可检测异常，却仍在关键决策上与攻击者意图一致。基准已公开。", "supplement": false}, {"title": "The Last Gate: Preventing Irreversible AI Agent Actions Before Execution", "authors": "Burak Oktenli", "url": "https://doi.org/10.5281/zenodo.23867081", "category": "Zenodo 原型存档（配套代码与运行日志）", "cats": [], "oneliner": "执行前的最后一道确定性门：不可逆动作必须持有独立签发的 HMAC 许可、未过期、未撤销、未重放且资源版本与策略纪元一致，否则一律拒绝或弃权，mock 评估中 500 例负向/保留案例零误提交。", "insight": "这篇的机制与我们“策略独立存放、查询时逐 AU 求值”在哲学上完全一致，只是落点在 agent 执行侧而非检索侧：**许可（permit）必须由授权方独立签发、且与动作摘要绑定**，模型提议本身不产生授权。它的“单次重放 + 资源版本 + 策略纪元”三项检查，恰好对应 ChainBind 讨论里“批准—执行绑定”需要补的三块：防重放、防过期批准执行在已变更的资源上、防旧策略纪元下的批准被复用——讨论节可引用其检查清单作为执行侧绑定的最小清单。但必须诚实标注分量与边界：第一，本体是 Zenodo 原型存档而非同行评议论文，引用 0 次；第二，评估是纯 mock、无真实 LLM、无真实人类批准人、无外部身份提供方、无真实金融系统或物理执行器，500 例零误提交是“在作者自建 mock 上的受控结果”，不能读成真实部署的安全保证；第三，作者自述负向/保留频率为构造值，引用时应写清“合成评估”，不宜与 IAMRAGBENCH 的基准数字并列比较。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；本体即 Zenodo 存档的网关代码与测试数据）", "zh_abs": "动机来自 AgentAbstain 研究（arXiv:2607.10059）：17 个前沿 LLM 在 4 个 agent 框架上的成对 act/abstain 任务准确率最高仅 59.5%（该数字衡量的是成对任务正确性，而非有害动作频率）。The Last Gate 是一个内存 Python 网关原型：在动作到达模拟的带副作用后端之前，检查严格动作模式、资源与参数范围、SHA-256 动作摘要、独立签发的 HMAC-SHA256 许可、过期时间、撤销状态、单次重放状态、资源状态版本与策略纪元，无法验证授权时拒绝或弃权。证据为 22 个构造场景家族各 25 例（550 例）、5 种策略下 2,750 次受控执行：500 例负向/保留案例零误提交、50/50 健康授权提交全部放行；18 项自动化测试通过，含 1,200 次授权变异、200 条含对抗性外观备注的合法动作与单进程并发重放测试；测试代码、数据输出、运行日志与校验和随附。", "supplement": false}]}, {"date": "2026-11-03", "summary": "", "papers": [{"title": "RevBench: code, scenarios, run logs and judgments for enforcing mid-task permission revocation in AI agents", "authors": "Martin Ignatovski", "url": "https://doi.org/10.5281/zenodo.23854359", "category": "Zenodo 软件与数据存档（配套论文《Revoking Access Does Not Revoke Knowledge: Enforcing Mid-Task Permission Changes in AI agents》）", "cats": [], "oneliner": "任务中途撤销权限的基准：agent 已拿到的数据不会因“下一次读取被拒”而消失，逐调用授权在 720 轮里失败 57.9%。", "insight": "这是今日最直接可引用的工作，且补上了我们论文与 ChainBind 都未单列的一块：授权不是一次性判定，而是**有生命周期的判定**——批准被收回后，已检索内容、草稿与记忆里的“残留知识”仍在执行链上。第一，它给 T1/T2/T3 之外加了一个时间维攻击面：“撤销后残留”（post-revocation residue），与我们的 retrieve-then-project 语义直接可比：裁剪只处理“当次查询的未授权片段”，RevBench 处理的是“此前已授权、此刻已撤销的片段”，两者叠加才构成完整的撤销语义，讨论节可用 57.9% 与 72.8% 这组对比数字说明“只在读取时设卡是不够的”。第二，它的“选择性重放 + 清单级溯源”与我们“逐 AU 求值 + 覆盖映射 M(r)”在机制上同源：都要一份“每条内容从哪来、当前还属不属于你”的清单，区别在于 RevBench 的清单服务于撤销后的重放，我们的映射服务于查询时的求值。第三，诚实标注分量：本体是 Zenodo 存档而非同行评议论文，失败率数字来自作者自建的模拟平台与 LLM 评判，引用时应写清“模拟平台上的作者自测”，不宜当作真实 SaaS 平台的实测结论。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；本体即 Zenodo 存档的代码、场景与运行日志）", "zh_abs": "SaaS 平台里的 agent 继承用户权限执行任务；权限在任务中途被撤销后，平台会拒绝下一次读取，但 agent 上下文、草稿、已保存文档与记忆里的数据还在。作者定义了四种撤销类型各自对应的封堵、清除或暂停义务（含改写、聚合与存在性提示等泄露形式），在模拟的外勤服务平台上比较了来自访问控制、信息流控制与机器遗忘的 9 种执行设计，在 6 个前沿模型上跑了 6,048 轮，以精确匹配与两个 LLM 评判打分。逐调用授权仍在 417/720 轮（57.9%）失败，撤销发生在检索之前时为 34.4%、发生在数据送达之后时升至 72.8%；信息流标签泄露最少（12.9%）却仍在 44.2% 的轮次里留下了已撤销数据；使上下文失效的设计表现最好，就地编辑上下文则会留下派生事实；完全重启与带清单级溯源的选择性重放分别达到 21.4% 与 21.0% 的实质失败率，后者少用 12.1% 的模型调用。剩余失败大多是“透露受限本身”的披露，且模型越大并未减少。", "supplement": false}, {"title": "Trust-Aware Orchestration Architecture for LLM-Assisted Workflows in Multi-Tenant Enterprise Systems", "authors": "Nandakishore Leburu", "url": "https://doi.org/10.1109/ACCESS.2026.3706063", "category": "IEEE Access（2026）", "cats": [], "oneliner": "多租户 LLM 工作流的确定性控制面：LLM 只提议动作，三道硬门（租户解析、工具授权、模式校验）决定是否执行，另有四道建议性过滤与仅追加审计日志。", "insight": "这篇的价值恰恰在于它的“诚实边界”。第一，它与我们的 RU/AU 解耦在哲学上一致——授权判定必须独立于模型提议之外、由确定性谓词执行，而不是让模型自己“判断该不该做”；它的三道硬门可视为 AU 求值在 agent 工具调用侧的对应物：租户解析对应“这份内容属于哪个授权域”，工具授权对应“这个 AU 是否允许这次调用”，模式校验对应“参数是否在批准范围内”。第二，它给 ChainBind 的“批准—执行绑定”划了一条清晰的能力边界：绑定能保证“执行的动作等于被批准的动作”，但保证不了“被批准的动作本身意图良善”——30%–70% 的权限内操纵成功率说明，意图层攻击需要另一层防御（如来源过滤、意图审计），不能指望把绑定做得更严就顺带解决。第三，诚实标注分量：IEEE Access 2026 年刊、引用 0 次，自适应案例只有 20 条 prompt 且为点估计，引用时应写清“小样本自适应案例”，不宜把 30%–70% 读成大规模实测。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "LLM 调用企业工具与 API 时存在参数幻觉、跨租户数据泄露与提示注入三类风险。作者提出“LLM 提议、确定性控制面验证并执行”的编排架构：三道硬门为身份认证与租户解析、基于角色的工具授权、模式校验，四道建议性过滤为输入清洗、检索定域、执行监控与输出合规，外加仅追加审计日志。硬门提供租户隔离、工具白名单执行、模式合规三项结构性保证（以确定性谓词表述、在控制面逻辑层验证），覆盖 14,885 次评估（1,497 条自定 prompt + TensorTrust 683 条 + AgentDojo 777 条 + 20 prompt 自适应案例）；AgentDojo 上的定向攻击成功率在 5 个模型上均 ≤1.9%，与已发表的防御基线相当；确定性语法恢复把 3B 模型的误拒率从 52% 降至 15.2% 且零延迟代价。但作者明确承认硬门防不住“权限内意图操纵”：获授权角色用获授权工具、以模式合法的参数达成恶意目的，20 prompt 自适应案例在 5 个模型（包括 Claude Haiku 4.5、Sonnet 4、Opus 4.6 三个前沿模型）上的成功率为 30%–70%；基于模式的输入清洗仅在 10.2% 的注入 prompt 上标记出注入模式，且从不单独拒止，证实模式检测不足。", "supplement": false}, {"title": "Not All Entities are Created Equal: A Dynamic Anonymization Framework for Privacy-Preserving Retrieval-Augmented Generation", "authors": "Xin-Yuan Zhu 等（南开大学）", "url": "https://www.semanticscholar.org/paper/6a33062b25e1a77702ad887f2958947bf2e005a4", "category": "arXiv 预印本（arXiv:2603.26074v1，cs.CR）", "cats": ["cs.CR"], "oneliner": "TRIP-RAG：不搞一刀切全量匿名化，按实体的边际隐私风险、知识差异与主题相关性给每个实体打分，只对高风险实体做选择性泛化。", "insight": "与我们 embedding 通道一节可比但机制不同：我们处理的是“未授权内容不应进入检索结果”、用按授权视图重编码把 cloze 恢复率从 89.4%@20 压到 4.05%，TRIP-RAG 处理的是“敏感实体不应以明文进入检索语料”、用分级泛化在隐私与效用之间找中间点。两者可互补引用：视图重编码回答“谁有权看到这条内容”，实体分级泛化回答“这条内容里的哪个实体最值得先藏起来”——若把两者叠加，AU 求值可先定“能不能看”，实体风险分再定“看到的是泛化到哪一级的版本”，这是一个值得在讨论节提一句的组合方向。但需诚实标注：这是 arXiv 预印本、引用 0 次，且“Recall@k 下降不到 35%”本身就是不小的效用代价（作者的表述是“不到 35%”，不是“几乎无损”），引用时不要写成“隐私与效用兼得”；另注意本轮 S2 记录未带摘要，摘要数字经 arXiv 原文核实。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "RAG 知识库里的原始数据可能含敏感实体，全量匿名化保隐私却伤效用。TRIP-RAG 先做上下文感知的实体量化：从边际隐私风险、知识差异、主题相关性三个维度评估每个实体对隐私与效用的异质影响，再做动态泛化——按贪心策略只匿名化高风险实体，同时保留检索空间与文档知识的潜在拓扑结构。作者给出理论分析与实验：隐私保护与全量匿名化相当时，Recall@k 相对原始数据下降不到 35%，生成质量比现有基线最高提升 56%。", "supplement": false}, {"title": "RAG-grounded Advisory Systems for Government Decision-making", "authors": "Zeki Emre Tekin", "url": "https://doi.org/10.2139/ssrn.6570798", "category": "SSRN 工作论文（面向国家政府投资促进机构的部署报告）", "cats": [], "oneliner": "政府咨询场景的落地 RAG：四层 grounding（检索、引文验证、置信度校准、人工升级）+ 基于属性的访问控制，按文档密级执行。", "insight": "这是一份难得的“已部署 8 个月”的实证侧写，而非纯架构提案，有两处可直接对照。第一，它的 ABAC 是按“文档密级”执行的粗粒度控制——正好反衬我们 RU/AU 解耦的动机：密级是文档级属性，而 AU 是权限判定的原子单位；当同一文档内不同片段密级不同、或同一用户对同一文档在不同任务下权限不同时，文档级 ABAC 要么超取要么欠取，AU 级求值才是更细的解法，讨论节可用它作为“现有部署仍停在文档级”的现状证据。第二，它的 NLI 引文验证（无支撑论断 23%→4.1%）与我们配套机制里的 NLI 残留检查同源，但方向相反：它用 NLI 检查“答案里的每句话有没有引文支撑”，我们用 NLI 检查“裁剪后是否还有未授权残留”——两者可互相引用，说明 NLI 在 RAG 安全里既是事实性工具也是授权残留工具。但需诚实标注：SSRN 工作论文、未经同行评议，91.3% 精度与 94.2% 满意度均为作者单机构自报，无对照实验，引用时按“部署经验参考”处理。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "政府机构要在监管文本、政策备忘、项目档案等异构文档上做咨询，约束包括密级分类、双语运行、强制溯源与零容忍幻觉，通用 RAG 并不适配。作者报告了一个为国家政府投资促进机构部署 8 个月的系统：四层 grounding 架构（检索、引文验证、置信度校准、人工介入升级）+ 基于属性的访问控制（按文档密级执行）；混合检索（微调多语 sentence transformer 稠密向量 + BM25 稀疏分）在双语查询上 top-10 检索精度 91.3%；基于 NLI 的引文验证把无支撑论断从 23%（基线）降至 4.1%；置信度校准把 12% 的查询转交人工分析师；8 个月处理数千条咨询查询，分析师满意度 94.2%。作者将系统映射到 NIST AI 风险管理框架。", "supplement": false}, {"title": "Whispers of Wealth: Red-Teaming Google's Agent Payments Protocol via Prompt Injection", "authors": "Tanusree Debi、Wentian Zhu（佐治亚大学）", "url": "https://arxiv.org/abs/2601.22569", "category": "arXiv 预印本（arXiv:2601.22569v1）", "cats": [], "oneliner": "对 Google Agent Payments Protocol（AP2）的红队：密码学 mandate 保得住“授权凭证本身”，保不住“生成授权的那个决策过程”。", "insight": "这是 ChainBind 论点在支付场景的一个独立佐证：**批准（approval）不等于执行（execution）的安全**。AP2 的 mandate 在形式上就是一份“批准”——签名、可验证、有审计价值；但 Whispers of Wealth 证明，如果批准的形成过程（模型对上下文的推理）本身可被注入操纵，那么签名只保证了“被操纵的批准被忠实执行”，这正是我们论文里“批准环节需要来源过滤”的同一结论在另一个协议上的复现。讨论节引用时可写：“即使在有密码学 mandate 的 AP2 里，注入仍可操纵排序与数据提取；同理，agent 授权不能只校验批准凭证的形式有效性，还要校验批准形成时的信息来源。”但需诚实标注：arXiv 预印本、引用仅 2 次，实验基于作者自搭的单个购物 agent 原型（Gemini-2.5-Flash + ADK），未报告攻击成功率的系统数字（摘要只说“可靠地颠覆”），引用时不宜编造成功率；另注意本轮 S2 记录未带摘要，摘要经 arXiv 原文核实。", "source": "SemanticScholar", "citations": "Semantic Scholar 2 次", "code": "无", "zh_abs": "LLM agent 越来越多地自动执行金融交易，AP2 试图用可密码学验证的 mandate（授权委托书）来保障 agent 主导的购买，但其实践鲁棒性此前未被充分探索。作者在 Gemini-2.5-Flash + Google ADK 上搭了一个功能完整的 AP2 购物 agent，做 AI 红队评估，发现直接与间接提示注入两类漏洞，并提出两种攻击：Branded Whisper Attack（操纵商品排序）与 Vault Whisper Attack（提取敏感用户数据）。实验验证：简单的对抗 prompt 即可可靠地颠覆 agent 行为。结论是：密码学签名保护的是 mandate 一旦生成之后不被篡改，却防不住攻击者操纵“生成 mandate 之前的模型推理”。", "supplement": false}]}, {"date": "2026-11-02", "summary": "", "papers": [{"title": "Lineage: A UMA2.0 Protocol Extension for Multi-Hop LLM Agent Delegation", "authors": "Ştefania Ştefănescu 等", "url": "https://doi.org/10.1109/ACCESS.2026.3708618", "category": "IEEE Access（2026，OpenAlex 收录）", "cats": [], "oneliner": "给 UMA 2.0 补上多跳委托原语：每次受保护请求都携带经签名的完整委托血缘，资源服务器无需再向授权服务器往返即可验证。", "insight": "这是今日最直接可引用的工作。第一，它把 ChainBind 语境下的“批准—执行绑定”从单步扩展到了多跳：我们的 AU 求值回答“这份内容该不该给”，Lineage 回答“这份委托链上的每一跳是否还有效、是否越权”，两者叠加才是完整的 agent 授权链，讨论节可用它说明“单步绑定不够，委托链本身需要可验证的血缘”。第二，“协议层独立于模型行为拦住注入”与我们“过滤而非依赖引导”的结论同构，且给出了一个合规锚点（DORA 第 9 条的最小权限、完整性与持续监控子集），引用时应写清作者自己也承认“完整 DORA 合规还需要更广泛的制度治理，Lineage 只覆盖协议层子集”，不宜写成“已满足 DORA”。第三，诚实标注分量：IEEE Access 2026 年刊，引用仅 4 次，注入实验只有一次尝试，尚属原理验证而非大规模评测。", "source": "SemanticScholar", "citations": "OpenAlex 4 次", "code": "无", "zh_abs": "OAuth 2.0 与 UMA 2.0 只支持单跳委托，agent 把任务层层分包给子 agent 时会出现临时拼凑的权限模型与审计缺口，与欧盟 DORA 等合规要求冲突。Lineage 在 UMA 2.0 上加了一个可密码学验证的委托链原语：每条请求携带其完整委托祖先的签名记录，作用域单调性与委托深度上限由构造保证，每次授权决策写入可检测篡改的审计日志；扩展只需在资源服务器加两个链签名端点与一个签名密钥，授权服务器与 UMA token 流不用改。在 DORA 代表性场景的端到端参考实现中，一次真实的提示注入尝试被协议层独立于模型行为拦下，单请求开销相对 UMA 基线可忽略。", "supplement": false}, {"title": "An Efficient Privacy-Preserving Retrieval Scheme for Cloud-Based Retrieval-Augmented Generation", "authors": "Yuan Chang 等", "url": "https://doi.org/10.1109/TCCN.2026.3705821", "category": "IEEE Transactions on Cognitive Communications and Networking（2026）", "cats": [], "oneliner": "面向云端 RAG 的隐私检索方案 ShieldRAG：局部敏感哈希分桶 + 内积函数加密，云端看不到查询内容与文档访问模式。", "insight": "与我们论文的 embedding 通道一节直接可比，但角度不同：我们处理的是“检索结果里混进未授权内容”、用视图重编码把 cloze 恢复率从 89.4%@20 压到 4.05%，ShieldRAG 处理的是“云端从查询与访问模式反推隐私”，即 T2（可见排序向量）/T3（全知识）威胁模型里“服务器方观察者”这一分支。引用价值在于它给出了一个可量化的工程对照点（<0.5 秒、top-5 召回约 90%），说明隐私保护不必以检索不可用为代价；但需诚实标注：摘要未给出与明文基线的精度损失对比、也未说明函数加密在真实大规模索引下的密钥管理与更新成本，引用时不宜写成“已解决云端 RAG 隐私问题”。", "source": "SemanticScholar", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "云端 RAG 把查询与文档访问模式暴露给云服务方，既有方案往往以高计算成本或检索精度下降为代价。ShieldRAG 用局部敏感哈希做高效分桶、用内积函数加密保护隐私，另加向量聚合方法与不经意传输实例，使云端无法推断文档访问模式，同时保持检索性能。实验报告：检索延迟小于 0.5 秒，top-5 召回率约 90%，作者称适用于大规模真实场景。", "supplement": false}, {"title": "Authorization-Aware Multi-Agent Retrieval-Augmented Generation for Secure Enterprise Knowledge Access", "authors": "Chinmay Kundan Ahir 等", "url": "https://doi.org/10.55041/ijsrem68520", "category": "International Journal of Scientific Research in Engineering and Management（2026-10-31，OpenAlex 收录）", "cats": [], "oneliner": "文献综述型架构提案：把授权决策点与执行点前移到检索之前，只让有资格的候选集到达重排器、agent 与大模型。", "insight": "概念上与我们的 retrieve-then-project / per-view 索引高度一致——都是“授权前移、不要先检索再过滤”，且它点出的四类风险（尤其是“语义超取”与“跨域合成泄露”）可作为我们威胁模型 T1/T2 的对照清单，评测协议里的“撤销传播时间”与“委托违规”两个指标是我们现有评测未单列的，值得在讨论节提一句。但必须诚实标注其分量：作者自己声明“这是综述与设计贡献，未做实证评测、原型尚未评估”，且载体为低层级期刊，引用时只能按“观点与评测框架参考”处理，不能当作经验证据。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业 RAG 与多 agent 委托的风险在于：访问检查只发生在检索或答案生成之后。作者提出“授权感知”架构：策略决策点按当前用户与资源属性评估，策略执行点在内容到达重排器、agent 或大模型之前就把候选集限定在有资格的范围内，并结合 RBAC + ABAC、语义 embedding、向量检索、最小权限委托、溯源审计与受保护边界处的策略重验证。作者另做聚焦综述，点出语义超取、跨域合成泄露、权限过期、委托提权四类风险，定义了授权正确性条件，并提出一套评测协议（未授权上下文暴露率、已授权 Recall@k、答案相关性、延迟、撤销传播时间、委托违规、审计完整性）。", "supplement": false}, {"title": "Silo, Pool, and Bridge for Multi-Tenant RAG: Measuring Isolation, Noisy-Neighbor Effects, and Cost in SaaS Microservices", "authors": "Ritesh Kumar", "url": "https://doi.org/10.63282/3050-9246.ijetcsit-v7i1p106", "category": "International Journal of Emerging Trends in Computer Science and Information Technology（2026）", "cats": [], "oneliner": "多租户 RAG 的三种隔离模式（Silo / Pool / Bridge）与四平面隔离分类，并给出隔离、邻里干扰与成本的评测方法。", "insight": "这是我们 per-view 索引语义的部署侧对照：Silo 对应“每租户/每视图一索引”（隔离最强、成本最高），Pool 对应“共享索引 + 查询时过滤”（成本最低、但过滤必须可证明正确），Bridge 介于两者之间——这正是我们三种执行语义在多租户场景下的成本—隔离权衡表，讨论节可用它把“per-view 索引不是免费的”讲得更具体（邻里干扰与每查询成本是两个常被忽略的代价）。但需标注：该文同样只给出了评测方法而非实测数字，载体层级低，引用时按“框架参考”处理；其“跨租户 embedding 泄露”与我们 embedding 通道结论方向一致，可互相印证，但不能互相替代证据。", "source": "SemanticScholar", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "多租户 SaaS 的 RAG 必须在共享基础设施上保证严格的租户隔离，同时不让成本与性能方差失控。作者形式化了 Silo、Pool、Bridge 三种隔离模式，提出覆盖数据平面、向量平面、编排平面与 LLM 平面的隔离分类，并给出多租户 RAG 专属威胁模型：相似检索导致的跨租户 embedding 泄露、成员推断风险、作用域错误或投毒内容导致的检索污染、元数据推断。另给出 Kubernetes 原生参考架构（在摄入与检索两侧设显式策略执行点），以及一套评测方法：对抗检索下的泄露测试、混合租户 P50/P95 延迟（邻里干扰）、每查询成本拆解与运维开销。", "supplement": false}, {"title": "consent-substrate: Signed Authorization and Witness Boundaries for LLM Agents", "authors": "Consent Substrate Working Group", "url": "https://doi.org/10.5281/zenodo.23797525", "category": "Zenodo 软件存档（2026-10-30，配套论文《Detected or Proven: Signed Witness Boundaries Against Quiet-Class Compromise of LLM Agents》）", "cats": [], "oneliner": "签名授权 + 注入金丝雀的参考实现：Ed25519 签名的交战规则门（默认拒绝、失败关闭、哈希链审计）与共享同一信任根的诱饵路径/端点。", "insight": "机制上与我们“未知 AU 默认拒绝、查询时逐 AU 求值”的执行语义同源，且多了一个我们未展开的维度：金丝雀/诱饵（用可检测的标记主动发现静默渗透，而非只靠事后审计）。对 ChainBind 语境也有直接启发：签名门 + 哈希链审计正是“批准”应有的载体形式——批准若只是对话里的一句话，事后无法验证；若批准本身是签名记录，执行时就能校验血缘与范围。但需诚实标注：这是一份 Zenodo 软件存档、摘要只有一段，配套论文正文未在本轮抓取中出现，报告只按“软件存档”口径收录，不把它当作经同行评议的论文引用；其“detected-or-proven”保证的适用范围需等论文正文才能核实。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；本体即 Zenodo 存档的参考实现）", "zh_abs": "该存档是 consent-substrate 技术栈的参考实现：一道 Ed25519 签名的“交战规则”门（默认拒绝、失败时关闭、哈希链审计）与一套注入金丝雀基底（种子 token、诱饵路径、诱饵端点）共享同一信任根，目标是针对 LLM agent 的“静默类渗透”给出“被检测到或被证明”的保证。它是配套论文的软件部分，而非独立的论文正文。", "supplement": false}, {"title": "From Static Roles to Context-Aware Decisions: Integrating LLMs and RAG Into Access Control Frameworks for Power Systems", "authors": "Dong Feng 等", "url": "https://doi.org/10.1109/ACCESS.2026.3667843", "category": "IEEE Access（2026）", "cats": [], "oneliner": "反向用法：不是用确定性策略约束 LLM，而是用 LLM + RAG 推断隐式上下文，让静态 RBAC 变得自适应（电力系统场景）。", "insight": "这是一篇有警示价值的反向参照：它把 LLM 本身当作策略决策的参与者（用模型推理补规则的不足），而我们的立场恰恰相反——授权判定必须是确定性、可审计的逐 AU 求值，模型推理只能出现在检索与生成侧、不能成为授权的最终裁决者。两者对比可在讨论节讲清一条界线：“LLM 推断上下文”适合处理模糊请求的分诊与建议，但一旦它能直接放行，就把 T1/T2 威胁模型里的“模型可被操纵”重新引入了授权路径；该文的实验又只在合成数据集上、且未报告 LLM 误判导致的越权率，引用时应写清这一缺口，不宜把它当作“LLM 决策优于 RBAC”的证据。", "source": "SemanticScholar", "citations": "OpenAlex 3 次", "code": "无", "zh_abs": "RBAC 简单可解释，但难以适应动态用户行为与演变中的安全风险；传统上下文感知模型依赖人工定义的上下文属性与规则，维护成本高。作者在 RBAC 骨架上叠加 LLM + RAG：通过对非结构化访问日志推理、检索相关历史行为记录，推断行为衍生的隐式上下文语义，从而在保留 RBAC 可解释性的同时做出更灵活的授权决策。在合成电力系统访问控制数据集上的实验显示，RAG 增强框架在处理模糊或边界访问请求时持续优于静态 RBAC 基线。", "supplement": false}]}, {"date": "2026-11-01", "summary": "", "papers": [{"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations", "authors": "Evan Oktavianus 等", "url": "https://doi.org/10.24433/co.3932736.v1", "category": "Code Ocean（2026-10-30，OpenAlex 收录）", "cats": [], "oneliner": "面向公共机构场景的声明式 agentic RAG 访问控制：把工作流表示为状态机，每个状态挂自己的策略，跨 agent 通道与组织单元统一执行。", "insight": "这是昨天“待追踪”条目的正式落点，昨天留下的三个核对点今天可以逐项回答。第一，工作流状态如何形式化：答案是“状态机 + 每状态策略”，与我们的 AU 求值不在同一层而是叠加层——我们是“查询时、按内容归属”判定该不该给，StateGate 是“执行到哪一步”判定该不该给；两者叠加后，同一份文档的授权就变成“内容归属 × 工作流状态”的二维判定，这正是 ChainBind 语境下“批准发生在某一状态、执行发生在另一状态时原批准是否还有效”问题的直接参照，讨论节可用它把“批准—执行绑定”从单步动作扩展到状态转移时的重估。第二，“过滤而非依赖引导”与我们的 retrieve-then-project（裁剪未授权片段）同构，且它的数字（过滤防住 95.5% 暴露与 85/143 注入得手，引导仅把误述从 14% 降至 1.9%）为“引导不可靠、必须在执行层硬拦截”提供了可引用的对照证据。第三，诚实标注其分量：76,348 次零错误是在合成文档 + 独立 oracle 上的结果，不是真实政务数据；“状态无关策略误判 ≥9.7%”的对照基线是作者自设的简化策略，引用时应写清“合成场景、作者自建对照”，不宜写成对真实部署的普适结论；且 Code Ocean 载体本身不是传统期刊/会议 venue，引用时按预印本/技术报告口径处理。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无（本次抓取未给出 GitHub 仓库链接；配套代码/数据存档见昨日上报的 Zenodo 条目 https://doi.org/10.5281/zenodo.23774020，代码 Apache-2.0、数据与结果 CC BY 4.0，全部文档均为合成数据）", "zh_abs": "StateGate 把工作流表示为状态机，以“工作流状态”为授权依据：同一份文档在流程的不同状态、经不同通道、面对不同组织单元时，策略可以不同，且一份决策适用于所有通道。在基于印尼财政部法规构建的 4 条关联工作流、合成文档上的两轮迭代、7 个评测回合中，对照独立编写的 oracle，**76,348 次请求零错误**（含跨单元读取）；无访问控制时同一批请求泄漏 **43,300 次**，与状态无关的策略至少误判 **9.7%** 的读取。测试覆盖全部状态与转移，检出 94%–100% 的非等价植入工作流错误与全部 5 个引擎 bug（其中 1 个靠崩溃发现）。接真实模型 agent 的实验中，无控制运行在 **95.5%** 的案例里暴露了受限文档，注入在 143 轮中 85 轮拿到隐藏目标；过滤同时防住了两者，而提示词引导仅把“模型误述文档状态”的回答占比从 14% 降至 1.9%。作者提炼出 5 条设计原则：授权绑定工作流状态、工作流以数据形式声明、过滤而非依赖引导、一份决策适用于每个通道、共享由所属单元说了算。", "supplement": false}]}, {"date": "2026-10-31", "summary": "", "papers": [{"title": "REALM: Identifying Minimal Task Assets for LLM Agents", "authors": "Zihou Ren 等", "url": "https://arxiv.org/abs/2610.39155v1", "category": "cs.CR, cs.AI, eess.SY（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "为 LLM agent 识别并维护任务真正需要的最小资产集合，把“发现资产”与“授权使用”分开，用任务容器内的资源受限局部 API 收紧最小权限。", "insight": "这是今天与我们工作咬合最紧的一篇，值得在 related work 里占位。第一，它的“发现 ≠ 授权”分离与我们的 RU/AU 解耦在抽象层面同构：我们是检索侧“chunk 只存覆盖映射、策略独立存放、查询时逐 AU 求值”，它是执行侧“资产发现走依赖图、授权使用走受限 API”——两者合起来正好构成“检索授权 + 执行授权”的两段链条，写 related work 时可用 REALM 说明“最小权限”在 agent 时代必须从静态权限表升级为任务生命期内的动态资产集合。第二，它处理了我们 RU/AU 论文里着墨较少的难题：执行中才涌现的资产身份（assets whose identities emerge only during execution），其“来源限定接纳”机制可与我们的“未知 AU 默认拒绝”对照：一个是按来源可信度有条件接纳，一个是默认拒绝，两者取舍值得在讨论节写一段。第三，诚实标注其分量：16.6%→0.2% 是 AgentDyn + 单一基座模型（qwen3.5-flash）的数字，且注入下任务完成率 36.4% 本身不高，引用时应写清基准与模型，不宜泛化为“最小权限已解决注入问题”。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "LLM agent 常常拿到远超任务所需的文件、账号与服务访问权限，提示注入正是利用这部分超额访问把执行引向无关资源。本文提出 REALM（Required Execution Assets Linked to a Mission），把任务所需资产表示为依赖图节点、解析前置依赖关系，并通过来源限定选择接纳执行中才新发现的资产；REALM Builder 维护已选授权并投射资产文件，Partial API Manager 在任务容器内向 agent 只暴露资源受限的局部 API，同时保留 agent 自主选择计算方式的自由。在 AgentDyn 的 60 个干净任务与 560 个注入案例上，以 qwen3.5-flash 为基座，干净任务完成率 40.0%、注入下 36.4%，攻击成功率从 16.6% 降至 0.2%。", "supplement": false}, {"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations（代码、合成数据与结果存档）", "authors": "Evan Oktavianus 等", "url": "https://doi.org/10.5281/zenodo.23774020", "category": "Zenodo 存档（2026-10-29），配套文章的工作流引擎、8 个工作流文件、评测代码、合成文档、问题与注入提示及实验结果", "cats": [], "oneliner": "一份与“工作流状态驱动的 agentic RAG 访问控制”同题的公开存档：按工作流状态决定 agent 在 RAG 流程各阶段能取什么、能做什么，面向公共机构场景。", "insight": "即使只有标题与存档描述，这一想法的方向仍值得记一笔，因为它补了我们框架里一个显眼的缺口。我们的 AU 求值是“查询时、按内容归属”的静态判定，StateGate 的标题指向的是“按工作流状态”的动态判定：同一份文档在流程的不同阶段、不同步骤执行者手里，授权可能不同。这正是 ChainBind 语境下“批准—执行绑定”需要回答的问题——批准发生在某一工作流状态，执行发生在另一状态时，原批准是否还有效。建议把 StateGate 列为“待追踪”而非“已引用”：等论文本体出现后，重点核对三点——工作流状态如何形式化、状态转移时授权是否重估、与 RAG 检索授权是同一层还是叠加层；在此之前，任何关于它的机制描述都不应写进我们的稿子。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "该条目本身即代码/数据存档（代码 Apache-2.0，数据与结果 CC BY 4.0，全部文档均为合成数据）", "zh_abs": "必须先说明证据边界：本次抓到的不是论文正文，而是 Zenodo 上的配套存档，存档描述只说明它包含 StateGate 引擎、8 个工作流文件、评测代码、合成文档、问题与注入提示以及已存储的实验结果，未给出访问控制模型的形式化定义、策略语言或任何评估数字。因此本条只能确认“存在这样一个以工作流状态为授权依据的 agentic RAG 访问控制工作”，不能转述其机制细节与效果结论；正式引用须等论文本体出现后再核实。", "supplement": false}, {"title": "Judging Before Propagation: Task-Graph Contextual Integrity for Multi-Agent Privacy", "authors": "Hengyu Wu 等", "url": "https://arxiv.org/abs/2610.39532v1", "category": "cs.CR, cs.AI（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "把多智能体隐私从“单次披露合不合规”升级为“整条任务图上传播合不合规”：用任务图建模工作流，按信息项的预期传播范围做授权，附 144 例基准 MAPLE-Bench。", "insight": "关联较强，但要分清层次再引用。第一，它的“传播范围授权”与我们的 AU 粒度判定互补：我们回答“这条内容该不该给这个查询主体”，它回答“给了之后还能流向谁、流多远”；两者拼起来才是多智能体 RAG 的完整授权语义，讨论节可用它说明“单步 AU 求值是不够的，授权需要有传播语义”。第二，它的 Full-Scope 与 Auto-Region 恰好对应我们三种执行语义里的两端：全范围事前校验 vs 局部裁剪放行，这种“严格—宽松”权衡的对照写法可以直接借用。第三，诚实标注：85.8%–94.1% 是在自建 MAPLE-Bench（144 例构造场景）上的相对降幅，不是真实部署数据；且“保留精度 93.6%–96.1%”是相对基线任务精度的比例，基线本身的绝对精度未在摘要中给出，引用时只写相对数字、不写绝对效果。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "多智能体系统依赖持久记忆与 agent 间通信，隐私风险超出单次交互：一次孤立看合适的披露，与接收方既往已知信息组合、或沿计划工作流继续向下游传播后，可能变得不合适。现有情境完整性（Contextual Integrity）机制多为局部判断，不考虑信息向下游的传播。本文提出任务图情境完整性（TG-CI），把工作流表示为多智能体任务图（MATG），将情境完整性从原子转移扩展为有状态的图级信息流，同时考虑信息项的预期传播范围与接收方不断演变的披露状态；落地为两种互补策略：Full-Scope（要求在完整下游范围内均可接受）与 Auto-Region（用轻量前沿门把每项信息限制在其最大可接受区域）。MAPLE-Bench 基准含 144 例、四种场景，联合变化任务图拓扑、披露历史、被攻陷 agent 位置与单项隐私策略；主配置下 TG-CI 相对局部历史基线把平均未授权披露数降低 85.8%–94.1%，同时保留基线任务精度的 93.6%–96.1%。", "supplement": false}, {"title": "SEAL: Sealed Queries for Local Sanitization against Indirect Prompt Injection", "authors": "Doohyun Kim 等", "url": "https://arxiv.org/abs/2610.39758v1", "category": "cs.CR（arXiv 2026-10-29）", "cats": ["cs.CR"], "oneliner": "面向本地 agent 的间接提示注入清洗法：离线学一个软提示与评分读出头，用与待检工具文本无关的可信上下文构造评分查询，对工具输出做局部删除式净化，且不额外生成防御 token、不另起验证模型。", "insight": "关联中等，定位应是“输入净化层”的对照而非竞争。第一，它与我们的 AU 求值处在不同层：SEAL 清洗的是工具输出里的注入内容（防“坏内容进入推理”），我们管的是检索内容按授权放行（防“不该看的内容被看到”）；两者叠加才完整，威胁模型一节可用它说明 T1/T2/T3 之外还有一条“工具输出投毒”通道——但注意，我们的 T1（仅见答案）/T2（可见排序向量）/T3（全知识）是针对检索泄露划分的，SEAL 的通道应写为“与检索泄露并行的 agent 执行通道”，不要硬塞进 T1–T3。第二，它的“1/127 token 用量”与“联合指标 51.4%→77.5%”提醒我们：防御论文的卖点往往是“效果 + 成本”双数字，我们若补 agent 侧实验，也应同时报告 AU 求值的延迟/成本，否则单有效果数字说服力不足。第三，诚实标注：34.6%→0.1% 是 AgentDojo 上的结果，且“第二基座复现”未在摘要中给出具体数字，引用时限定在 AgentDojo 语境内。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "间接提示注入通过不可信工具输出威胁本地 LLM agent，防御需要在压制攻击的同时保留任务证据，且本地推理预算有限。本文提出 SEAL，离线学习软提示与评分读出头、用冻结的任务模型净化工具输出：评分查询由可信初始上下文与学到的提示构成，与被检工具文本无关；token 评分不跨上下文 token 归一化，并用保留正则化鼓励在局部删除时留住有用证据。该设计既不生成防御 token，也不需要独立验证模型。在 AgentDojo 上，SEAL 把攻击成功率从 34.6% 降至 0.1%，把“任务完成且未被攻陷”的联合指标从 51.4% 提升至 77.5%，防御相关 token 用量约为最强基线 PISanitizer 的 1/127；第二基座模型上的复现支持该训练方法的跨模型族适用性。", "supplement": false}, {"title": "Appreciation Teaches Unauthorized Execution: Self-Evolution Degrades the Robustness of Personal Agents to Indirect Prompt Injection", "authors": "Xinyan Wang 等", "url": "https://arxiv.org/abs/2610.39122v1", "category": "cs.CR, cs.AI（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "一个反直觉的发现：个人 agent 从用户反馈中自我演化（学技能、强化学习）之后，反而更容易执行第三方藏在外部内容里的未授权指令。", "insight": "关联中等，但对 agent 授权线有直接警示意义，可作“批准会漂移”的经验证据。第一，它揭示的机制与 ChainBind/E12 的“草案投毒”发现同源：授权（或习得的行为模式）一旦形成，就会在后续步骤里被忠实执行，哪怕触发它的内容来源不可信——我们的“批准必须绑定到执行那一刻的动作与来源”主张，正好是对这种漂移的回答，引用时可把该文定位为“为什么静态批准不够”的动机证据。第二，它划清了我们工作的边界：该文研究的是 agent 自身学习机制引入的脆弱性，不在 RU/AU 的检索授权范围内，不宜把它的百分点数字写成对我们检索防御的支撑。第三，诚实标注：14.0–48.8 与 3.0–39.3 都是跨任务的区间，具体任务、基座模型与演化方法的分布未在摘要中展开，引用时写区间、不挑区间端点当代表值。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "github.com/SaFo-Lab/Evolve-IPI（star 数本次未查到）", "zh_abs": "自我演化的个人 agent 为用户行事并从用户反馈中学习，但若 agent 服从了不可信第三方藏在内容里的指令，第三方就获得了对 agent 的控制。本文用两阶段对照方法研究自我演化是否削弱抗间接提示注入（IPI）鲁棒性：适应阶段用户要求 agent 阅读外部内容并完成其中描述的任务（日常常见请求），agent 按设计从用户反馈中学习改进；测试阶段第三方把类似任务写入新的外部内容，但用户的测试请求并未授权该注入任务。实验表明自我演化显著削弱鲁棒性：与不演化的基座 agent 相比，技能演化下平均攻击成功率上升 14.0–48.8 个百分点，强化学习下上升 3.0–39.3 个百分点。", "supplement": false}, {"title": "Understanding and Mitigating Role Spoofing in LLMs", "authors": "Ezra Edelman 等", "url": "https://arxiv.org/abs/2610.40396v1", "category": "cs.CR, cs.AI（arXiv 2026-10-29）", "cats": ["cs.CR", "cs.AI"], "oneliner": "揭示并缓解“角色冒充”攻击：模型按文本风格而非标注角色判断“谁说的”，工具输出里的恶意文本可借此冒充用户；作者还发现只教模型忽略内容型注入的对抗训练防不住结构型攻击，并提出用线性探针检测角色冒充。", "insight": "关联较弱，但有一个值得借鉴的方法论点。第一，它的“角色归因按风格而非标签”与我们在讨论“AU 判定依据”时要警惕的问题相通：授权判定必须依据可验证的来源标签与策略，而非内容表面的可信感——若 AU 映射依赖文本风格或启发式归因，攻击者就能用风格伪造越权；这一点可写进威胁模型讨论，作为“为什么 M(r) 覆盖映射必须是显式元数据而非推断结果”的佐证。第二，它的对抗训练“防内容、不防结构”结论提醒我们：任何只在内容层做防御的方案（包括我们若只做文本裁剪）都可能被结构层绕过，防御评估应分内容型/结构型两维报告。第三，诚实标注：线性探针“在不同设定下均有效”未在摘要中给出量化指标，且“简化设定”一词表明对抗训练结论来自受控实验，不宜写成对前沿模型的普遍结论；整体定位为方法论注脚，不展开引用。", "source": "arXiv", "citations": "尚未收录（OpenAlex 暂无记录）", "code": "无（本次抓取未给出仓库链接）", "zh_abs": "LLM 仍易受提示注入操纵，近期观察到的“角色混淆”（Ye et al., 2026）指出模型会按文本风格而非标注角色来归因文本来源；agent 访问的恶意网页等工具输出可利用这一点冒充用户，作者称之为角色冒充（role spoofing）。本文研究模型如何追踪“谁说了什么”，发现模型同时使用内容线索（语义、写作风格）与结构线索（控制 token、格式）；结合伪造结构与内容的角色冒充攻击极易得手。在简化设定中，教模型忽略内容型注入的对抗训练可缓解内容型攻击，却对结构型攻击无效——这可以解释为何对多数注入攻击抵抗力更强的前沿模型仍可能被角色冒充攻陷。最后，作者提出用训练于对话角色预测的线性探针检测角色冒充，在不同设定下均有效。", "supplement": false}]}, {"date": "2026-10-30", "summary": "", "papers": [{"title": "Evidence to Policy Assurance for Agentic AI: A Verifiable Provenance Framework for Regulated Enterprises", "authors": "Aditya Krishnan", "url": "https://doi.org/10.65796/fet.vol.2.issue.2.1", "category": "OpenAlex（2026-10-27），venue 未在 OpenAlex 中标注", "cats": [], "oneliner": "为受监管场景的 agent 行为建一张“证据—策略”溯源图：一次 consequential action 只有在其支撑证据同时满足权威性、时效性与充分性时，才算合规。", "insight": "这是今天唯一值得在 related work 里占位的一篇，且与我们的“批准—执行绑定”议题直接咬合。第一，它的扰动清单里“执行金额与授权不一致”与“缺失二次批准”正是 ChainBind/E12 语境下“批准≠执行”的两种具体形态：EPAG 的做法是事后用图把“授权了什么、执行了什么、证据是否合格”钉死、可重建、可分离——这与我们的事中 AU 求值互补，一前一后构成“事中拦截 + 事后可审计”的完整链条，写 related work 时可用它来说明“为什么光有拦截还不够，审计侧也需要结构化表示”。第二，它的六条标准里“确定性（determinacy）”与“可重建性（reconstruction）”值得借鉴为我们审计/日志一节的检验口径：我们的 AU 求值日志若不能从记录中唯一重建“当时按哪个策略版本、对哪个 AU 判了什么”，事后争议就说不清。第三，必须诚实标注其分量：作者自己明言结论只是“六个构造图实例的表示充分性”，不是部署实测、不是合规证明；且 AgentDojo/ToolEmu 数字只是引用背景、未实测，引用时绝不能写成“EPAG 在 629 个案例上有效”。另外 venue 未标注、引用 0 次，定位应为“概念框架参照”，不宜当作实证支撑。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "常规执行轨迹只记录 agent“做了什么”，无法证明支撑某次关键行动的证据是否权威、是否最新、是否足以支撑该策略判断。本文提出 Evidence to Policy Assurance Graph（EPAG），用类型化图把数据源、合格证据、主张、策略谓词、合规判定、授权、已执行动作与观测结果串起来。评估用一个 25 万美元资金划转构造案例：1 个有效基线（S0）+ 5 个单条件扰动（S1–S5），按完备性、资格、定位、确定性、可重建性、可分离性六条标准检验；基线全部通过，扰动分别暴露了陈旧账本证据、非权威电子表格、资金不足、缺失二次批准、执行金额与授权不一致五类失败，每类都映射到既定的处置与跟进动作。文中引用的 629 个 AgentDojo 安全案例与 144 个 ToolEmu 案例仅作风险背景，未用 EPAG 重跑。", "supplement": false}, {"title": "ACTA: A Verifiable Accountable Decryption Mechanism for Secure and Auditable Blockchain-Based Data Sharing", "authors": "Nabeel Zuhair Tawfeeq 等", "url": "https://openalex.org/W7223951028", "category": "Sakarya University Journal of Computer and Information Sciences（2026-10-27）", "cats": [], "oneliner": "在区块链数据共享里把“谁有权解密”与“解密实际执行”绑在一起：授权、密文与可信执行环境内的解密三段链接，事后留下可验证的审计证据而不泄露明文。", "insight": "关联较弱，但“绑定”思想可作跨域对照，不宜深引。第一，它的“三段链接”（访问授权—加密数据—enclave 内解密执行）与我们的“批准必须绑定到执行那一刻的动作”在抽象层面同构：都是防止“批的是一回事、执行的另一回事”，且它用“不泄露明文派生值”的方式解决了审计与机密性的张力——这一点对我们讨论“AU 求值日志该记多细”有启发：日志要能证明授权与执行的对应关系，又不能把被保护内容本身记进日志。第二，限定要写清：场景是证书/敏感记录共享而非 RAG 检索，16 TPS 量级与毫秒延迟是许可链 + TEE 实验台的数字，不能迁移为检索授权的性能参照；且其 DOI 在 OpenAlex 记录中显示截断（`10.35377/saucis...1986038`），本报告链接改用 OpenAlex 记录页，引用时需另行核实正式 DOI。总体定位：方法论注脚一句话即可，不值得在正文里展开。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "敏感记录共享需要同时满足严格访问控制、机密性与可问责性，但现有区块链方案对“可验证问责 + 受控解密”的支持有限。本文提出 ACTA（Accountable Confidential Trusted Access），结合区块链、可信执行环境（TEE）与 IPFS 离线加密存储：链上存内容标识（CID）与哈希做完整性校验，解密在注册 enclave 内执行，成功后链上记录“经认证的请求者按其授权取到了该加密记录、且操作由注册 enclave 执行”的可验证证据，且不发布任何源自明文的值。Hyperledger Caliper 四轮实测：证书签发峰值 16.82 TPS、完整可问责解密流程 16.45 TPS（ offered load 2–25 TPS），平均端到端延迟随负载上升分别从 1212 ms 降至 295 ms、从 1092 ms 降至 222 ms。", "supplement": fals  "11-05 07:35", "likes": 12465, "reposts": 1146, "replies": 660, "views": 922018, "url": "https://x.com/OpenAI/status/2118124944928432327", "author": "OpenAI"}, {"id": "2118119463161905362", "text": "Our goal is to help defenders find and fix vulnerabilities before attackers can use them. We’re working with Linux maintainers and Patch the Planet partners on reports and patches.\n\nhttps://openai.com/index/a-thousand-fewer-paths-to-root/", "created_at": "11-05 07:13", "likes": 344, "reposts": 18, "replies": 8, "views": 53830, "url": "https://x.com/OpenAI/status/2118119463161905362", "author": "OpenAI"}, {"id": "2118119461345739018", "text": "The agents also discovered and used at least 10 Linux exploitation techniques that, to the best of our knowledge and all of the experts that we consulted, are novel.\n\nThis suggests frontier LLMs can discover and patch new approaches to exploitation, beyond simply applying known techniques.", "created_at": "11-05 07:13", "likes": 302, "reposts": 13, "replies": 5, "views": 54772, "url": "https://x.com/OpenAI/status/2118119461345739018", "author": "OpenAI"}, {"id": "2118119451401048497", "text": "Our security researchers built an autonomous cyber vulnerability discovery, exploitation, and patching pipeline.\n\nIn a single run with an upcoming cyber model, it validated and generated patches for 948 local privilege escalation vulnerabilities in the Linux kernel at a total API cost of $1.2 million.", "created_at": "11-05 07:13", "likes": 5377, "reposts": 547, "replies": 342, "views": 679914, "url": "https://x.com/OpenAI/status/2118119451401048497", "author": "OpenAI"}, {"id": "2117692483685757188", "text": "These are early steps, and we’re looking for engineers, engineering firms, and software partners to help shape what comes next.\n\nhttps://openai.com/index/accelerating-engineering-for-the-physical-world/", "created_at": "11-04 02:56", "likes": 532, "reposts": 19, "replies": 19, "views": 138107, "url": "https://x.com/OpenAI/status/2117692483685757188", "author": "OpenAI"}, {"id": "2117692480590373245", "text": "We’re also working with engineers at Chip Ganassi Racing to turn 3D scans into editable CAD models and manufacturing drawings, and with Mazda to explore new vehicle designs through simulation.\n\nEngineers review the outputs and help identify where the models need to improve.", "created_at": "11-04 02:56", "likes": 835, "reposts": 57, "replies": 24, "views": 136172, "url": "https://x.com/OpenAI/status/2117692480590373245", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2117794005165748448", "text": "People should always be in control of the future.\n\nOpenAI is against the notion that it would be acceptable for people to be relegated to a role of doing things that “AI systems think makes sense to reward in humans”.\n\nPeople should not cede control of the future to superintelligence, and that requirement should ultimately constrain AI progress.", "created_at": "11-04 09:40", "likes": 18088, "reposts": 884, "replies": 4508, "views": 8588397, "url": "https://x.com/sama/status/2117794005165748448", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2118255144836161582", "text": "@theo @thdxr Congrats I guess", "created_at": "11-05 16:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118255144836161582", "author": "thsottiaux"}, {"id": "2118254289894445278", "text": "@fudgeposting Might be", "created_at": "11-05 16:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118254289894445278", "author": "thsottiaux"}, {"id": "2118252192536973501", "text": "@helloitsaustin @OpenAI Welcome sir", "created_at": "11-05 16:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118252192536973501", "author": "thsottiaux"}, {"id": "2118251848297783385", "text": "@amix3k In 6 months this will look quite funny in retrospect", "created_at": "11-05 16:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118251848297783385", "author": "thsottiaux"}, {"id": "2118250631165300747", "text": "Follow Samir for dot updates", "created_at": "11-05 16:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118250631165300747", "author": "thsottiaux"}, {"id": "2118250462092914736", "text": "@rileybrown Yes and x.com/_samirism/stat…", "created_at": "11-05 16:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118250462092914736", "author": "thsottiaux"}, {"id": "2118248900381536740", "text": "Privilege to work alongside so many amazing people who won’t rest until we materialize a better future.", "created_at": "11-05 16:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118248900381536740", "author": "thsottiaux"}, {"id": "2118165504955494695", "text": "@jonoalford We needed the eyeballs", "created_at": "11-05 10:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118165504955494695", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2118159367795286285", "text": "Love building with @OpenAIDevs 🤝 @TwilioDevs Check out this quick tutorial of how to build telephone based apps that remember you using GPT Live and Twilio Agent Connect youtu.be/ZDpyPnZaAjs", "created_at": "11-05 10:03", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118159367795286285", "author": "craigsdennis"}, {"id": "2118135343354720648", "text": "The GPT Image 2.6 API gives you more control over image complexity and lets you create GIFs. So as fun short experiment - I asked Flare to create a GIF of a man doing a standing backflip. Compare low, medium and high complexity side by side. 👇 Detailed explanation below @OpenAIDevs", "created_at": "11-05 07:59", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118135343354720648", "author": "gabrielchua"}, {"id": "2118134123533623424", "text": "GPT Image 2.6 is LIVE on Higgsfield. Unlimited for 7 days for new users. > Turn any prompt or image into a GIF > Save references once and reuse them anytime > Refine with markup and export as SVG Available now on Higgsfield.", "created_at": "11-05 07:59", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118134123533623424", "author": "higgsfield"}, {"id": "2118124944928432327", "text": "Images, upgraded—introducing ChatGPT Images 2.6. Now with GIFs and reference images. Plus, two new models are coming to the API with 50% faster image generation.", "created_at": "11-05 07:59", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118124944928432327", "author": "OpenAI"}, {"id": "2118124764413718953", "text": "Codex also got an upgrade with a simpler way to edit images. Edits now happen directly in the overlay instead of opening a side panel. openai.com/index/introduc…", "created_at": "11-05 07:59", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118124764413718953", "author": "OpenAIDevs"}, {"id": "2118124761867845847", "text": "You can now send a marked-up image to the API to show exactly where you want an edit. For most edits, start with low complexity. If a scene has several elements or constraints to juggle, try medium or high to give the model more room to plan. Set image quality separately for the level of detail you need.", "created_at": "11-05 07:59", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118124761867845847", "author": "OpenAIDevs"}, {"id": "2118124753340756055", "text": "Today, we’re bringing GPT-Image-2.6 to Codex and the API. Image-2.6 Flare and Sunburst, our two new API image models, generate images 50% faster than before. At medium or high quality, Sunburst keeps details more consistent from one edit to the next.", "created_at": "11-05 07:59", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118124753340756055", "author": "OpenAIDevs"}, {"id": "2118028125707923513", "text": "we're giving you some RAM back. local threads could grow memory usage as they became long, even without starting other processes. @btraut declared war on the problem. enjoy\n\nin equally important news, @matteing made his handwriting into a font, which i use below", "created_at": "11-05 01:10", "likes": 954, "reposts": 42, "replies": 99, "views": 69673, "url": "https://x.com/ajambrosino/status/2118028125707923513", "author": "ajambrosino"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2118073667858887068", "text": "Read the full preprint here: www-cdn.anthropic.com/76e55fbe85697a…", "created_at": "11-05 03:48", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118073667858887068", "author": "AnthropicAI"}, {"id": "2118073665296228863", "text": "We’re sharing how our biology research team worked with Claude to map the first 3D structure of a vault particle from bacterial life. Vault particles are a longstanding mystery. They are barrel-shaped objects, among the largest protein structures found in our cells. They were first discovered by Leonard Rome and Nancy Kedersha in 1986, but their function remains unknown. With Claude, we’ve found results that might bring us closer to solving that mystery. Until now, vaults were only known in the cells of complex things like animals and plants. We have shown that similar proteins from bacteria (and the viruses that infect them) can also assemble into vaults. Finding the structures in these simpler forms of life may make it easier to investigate their function in our own cells. For our life sciences team, the project was also a demonstration of the potential (and the limitations) of using AI to accelerate science. In our full piece, we discuss how Claude was able to dramatically speed up some stages—manually determining the vault particle’s structure would have taken weeks to months of painstaking work, but here it took days. We also discuss how Claude made some simple mistakes along the way, and how we collaborated with our machine learning researchers to address them. Read more: anthropic.com/research/inves…", "created_at": "11-05 03:48", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2118073665296228863", "author": "AnthropicAI"}, {"id": "2117710942826123294", "text": "New Anthropic research: progress on provable inference for large language models. Here, we introduce FlashProve. Building on established cryptographic techniques, FlashProve allows developers to verify whether a given response came from a given AI model. It’s substantially more efficient than prior open-source methods for doing so. These proofs have a range of applications. They can, for instance, make it harder for attackers to hijack a chat, or enable safety evaluators to verify that the model they’re testing is the same one being served to customers. For our full write-up, see here: anthropic.com/research/prova… Further progress in provable inference will likely be an important part of improving trust in AI deployment. To that end, we're open-sourcing FlashProve’s code, here: github.com/anthropics/Fla… We’re grateful to our collaborators: Alessandro Chiesa, @GiacomoFenzi, @gwberg95, @miranda__christ, Rahul Dalal (rdalal.github.io) and Ben Mayer (@transmissions11).", "created_at": "11-04 06:48", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2117710942826123294", "author": "AnthropicAI"}, {"id": "2117343929960112486", "text": "Applications are now open for the Anthropic Residency, a paid, fixed-term research program for academics, technical founders, and staff-level engineers who want to make AI safe and beneficial for everyone. No ML background is required. Apply by November 22: alignment.anthropic.com/2026/anthropic…", "created_at": "11-03 06:48", "likes": 0, "reposts": 0, "replies": 0, "url": "https://x.com/i/status/2117343929960112486", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2118027058794148099", "text": "Voice Remixing for Gemini 3.8 Flash TTS is now live in @GoogleAIStudio and the Gemini API.\n\nStart with a preset from our library of 2,000+ voices or a custom-designed voice, and use prompts to fine-tune timbre, pitch, pace, and accent, like \"add a subtle Southern U.S. accent\" or \"make it sound like a fire-breathing dragon.\" 🐉", "created_at": "11-05 01:06", "likes": 564, "reposts": 61, "replies": 100, "views": 123092, "url": "https://x.com/Google/status/2118027058794148099", "author": "Google"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2117113121102045347", "text": "Great to see high quality benchmarks with headroom and look at that cost line for Carbon🚀", "created_at": "11-02 12:34", "likes": 4528, "reposts": 283, "replies": 400, "views": 544270, "url": "https://x.com/sundarpichai/status/2117113121102045347", "author": "sundarpichai"}, {"id": "2116722517239087535", "text": "CHAMPIONS!! Unbelievable energy in Ballhalla tonight. History made 🏆 Let's go Valks!💜⚔️", "created_at": "11-01 10:42", "likes": 2856, "reposts": 110, "replies": 168, "views": 330495, "url": "https://
