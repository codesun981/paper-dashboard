lys Intelligence Index at its xhigh thinking level.\n\nAvailable starting today:\n🔵 The Gemini API in @GoogleAIStudio, @AndroidStudio, and Gemini for business\n🔵 @Geminiapp for Google AI Pro and Ultra subscribers, and @Antigravity for paid subscribers\n🔵 Eligible Fairwind Program members soon\n\nFind out more → https://goo.gle/4t8pq0E", "created_at": "11-19 05:34", "likes": 132, "reposts": 6, "replies": 5, "views": 14179, "url": "https://x.com/GoogleDeepMind/status/2123167889976905966", "author": "GoogleDeepMind"}, {"id": "2123167884411077030", "text": "Gemini 4 Neon is rolling out now.\n\nSitting between Carbon and Hydrogen, it brings frontier intelligence and fast task completion for complex software engineering, knowledge work, and science.", "created_at": "11-19 05:34", "likes": 2992, "reposts": 296, "replies": 127, "views": 138466, "url": "https://x.com/GoogleDeepMind/status/2123167884411077030", "author": "GoogleDeepMind"}, {"id": "2123117735374659636", "text": "It's rolling out to eligible Google AI Ultra subscribers with a community gallery to discover, remix, and share creations - and an updated Genie 3 in the model picker with up to 3-minute sessions.\n\nStart exploring ↓ https://goo.gle/4kjMhE9", "created_at": "11-19 02:14", "likes": 78, "reposts": 0, "replies": 4, "views": 14156, "url": "https://x.com/GoogleDeepMind/status/2123117735374659636", "author": "GoogleDeepMind"}, {"id": "2123117733709586849", "text": "Genie 4 is now available in Project Genie.\n\nIt brings native audio, real-time editing, and a new agent to help you create interactive, virtual worlds.", "created_at": "11-19 02:14", "likes": 1698, "reposts": 150, "replies": 166, "views": 118277, "url": "https://x.com/GoogleDeepMind/status/2123117733709586849", "author": "GoogleDeepMind"}, {"id": "2122807824531275826", "text": "Gemini 4 Hydrogen turned Google Sheets into a pixel-art canvas.\n\nUsing @Antigravity, the model shrank thousands of cells to create animated scenes.", "created_at": "11-18 05:43", "likes": 2299, "reposts": 144, "replies": 150, "views": 132367, "url": "https://x.com/GoogleDeepMind/status/2122807824531275826", "author": "GoogleDeepMind"}, {"id": "2122767528933925363", "text": "You can even test ideas before touching hardware.\n\nUpload a photo or prompt to build a 3D scene in @MuJoCo, adjust objects and movements in chat, and deploy straight to your arm, going from a whiteboard sketch to a working conveyor sorter in about an hour.\n\nTry Gemini 4 Hydrogen in @Antigravity, @GoogleAIStudio, or the Gemini API → https://goo.gle/4eHJVez", "created_at": "11-18 03:03", "likes": 65, "reposts": 1, "replies": 5, "views": 16711, "url": "https://x.com/GoogleDeepMind/status/2122767528933925363", "author": "GoogleDeepMind"}, {"id": "2122767525419364630", "text": "The model excels in both robotic control and spatial awareness:\n🔘 It matches our larger Argon model on everyday robotic control tasks like pick and place, at a lower cost.\n🔘 And beats Gemini Robotics ER 2 at judging 3D spaces, camera angles, and movement.", "created_at": "11-18 03:03", "likes": 78, "reposts": 1, "replies": 9, "views": 22784, "url": "https://x.com/GoogleDeepMind/status/2122767525419364630", "author": "GoogleDeepMind"}, {"id": "2122767521925230896", "text": "Teaching robots new tasks just got a lot faster. 🤖\n\nWith Gemini 4 Hydrogen and the new robotics plugin for Google @Antigravity, you can connect a supported arm, practice in @MuJoCo simulation, and run tasks in the real world using plain conversation.", "created_at": "11-18 03:03", "likes": 1210, "reposts": 118, "replies": 156, "views": 135006, "url": "https://x.com/GoogleDeepMind/status/2122767521925230896", "author": "GoogleDeepMind"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": [{"id": "2123241253982916795", "text": "Really neat part of Genie 4 is you can type new prompts while exploring a generated world, like dropping in characters or changing the scene + the native audio adapts in real time! Now available in Project Genie for eligible Google AI Ultra subscribers.", "created_at": "11-19 10:25", "likes": 1495, "reposts": 98, "replies": 130, "views": 72364, "url": "https://x.com/sundarpichai/status/2123241253982916795", "author": "sundarpichai"}, {"id": "2123198296122667053", "text": "Neon is a great model : )", "created_at": "11-19 07:34", "likes": 2346, "reposts": 134, "replies": 174, "views": 190501, "url": "https://x.com/OfficialLoganK/status/2123198296122667053", "author": "OfficialLoganK"}, {"id": "2123184309137965524", "text": "Below Neon 3D modeled a photorealistic lab simulation in Antigravity via Blender MCP 🔥", "created_at": "11-19 06:39", "likes": 4122, "reposts": 230, "replies": 164, "views": 152524, "url": "https://x.com/sundarpichai/status/2123184309137965524", "author": "sundarpichai"}, {"id": "2123167785790648751", "text": "read more: https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/", "created_at": "11-19 05:33", "likes": 291, "reposts": 13, "replies": 14, "views": 51817, "url": "https://x.com/sundarpichai/status/2123167785790648751", "author": "sundarpichai"}, {"id": "2123167780988125621", "text": "Gemini 4 Neon: frontier-level intelligence with fast end-to-end task completion across complex software engineering, knowledge work, and science workflows.\n\nBegins rolling out today in the Gemini API in @GoogleAIStudio, Gemini for business, for paid Google AI Pro and Ultra subscribers in Google @Antigravity, and for Google AI Pro and Ultra subscribers in the @GeminiApp.", "created_at": "11-19 05:33", "likes": 10415, "reposts": 838, "replies": 534, "views": 859187, "url": "https://x.com/sundarpichai/status/2123167780988125621", "author": "sundarpichai"}, {"id": "2123143850210533408", "text": "Happy WedNEsday!", "created_at": "11-19 03:58", "likes": 6101, "reposts": 251, "replies": 347, "views": 478446, "url": "https://x.com/sundarpichai/status/2123143850210533408", "author": "sundarpichai"}, {"id": "2123130606162985350", "text": "Genie 4 is available! Looks like it is turtles all the way down then… Eligible Ultra subs can try it in Project Genie - excited to see what you’ll build with it. More info in the blog: https://blog.google/innovation-and-ai/models-and-research/google-deepmind/genie-4-now-available-project-genie/", "created_at": "11-19 03:05", "likes": 1675, "reposts": 151, "replies": 100, "views": 97182, "url": "https://x.com/demishassabis/status/2123130606162985350", "author": "demishassabis"}]}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2123223778721444044", "text": "ChessQA tasks: Hy4 ranks #2 among all models. 💪", "created_at": "11-19 09:16", "likes": 31, "reposts": 0, "replies": 5, "views": 2240, "url": "https://x.com/TencentHunyuan/status/2123223778721444044", "author": "TencentHunyuan"}, {"id": "2123095410327879735", "text": "We’re hosting an AMA on Reddit this Friday, Nov 20, 8–10 AM PT!  \n\n🚀 Fresh off shipping Hy4 & Hy4 flash, our research team & @ShunyuYao12  will hang out to unpack how we built our ultra-fast, lowest-cost everyday model.", "created_at": "11-19 00:46", "likes": 41, "reposts": 1, "replies": 2, "views": 3169, "url": "https://x.com/TencentHunyuan/status/2123095410327879735", "author": "TencentHunyuan"}, {"id": "2122978337710645714", "text": "I’ve been testing this with early access and I can confirm, it’s really good.", "created_at": "11-18 17:00", "likes": 167, "reposts": 12, "replies": 20, "views": 9552, "url": "https://x.com/ashxhart/status/2122978337710645714", "author": "ashxhart"}, {"id": "2122959344581124333", "text": "hy4-flash 正式开源啦，有需要的朋友可以去下载了！\n\n说实话我感觉这个模型还是很不错的，可以适配于低烈度的需求了，大家可以去下载一手\n\n模型下载地址\n\nGitHub：http://github.com/Tencent-Hunyua…\n\nHuggingFace：http://huggingface.co/tencent/Hy4-fl…\n\nModelscope：http://modelscope.cn/models/Tencent…\n\nGitCode：http://ai.gitcode.com/tencent_hunyua…\n\nGGUF：http://huggingface.co/AngelSlim/Hy4-…\n\n开源协议：http://huggingface.co/tencent/Hy4-fl…", "created_at": "11-18 15:45", "likes": 11, "reposts": 1, "replies": 5, "views": 2060, "url": "https://x.com/meishengsimon/status/2122959344581124333", "author": "meishengsimon"}, {"id": "2122955127782834677", "text": "Tencent Hy has released Hy4-flash as an open-weight 220B MoE model that activates just 12B parameters per token, with native image understanding and 1M context.\n🤖 https://modelscope.ai/models/Tencent-Hunyuan/Hy4-flash\n\n🏆 Built for lower-cost agent work: On Tencent’s internal WorkIndex, Hy4 flash slightly outperforms the much larger Hy4 Preview while cutting per-task cost to 1/13 of Hy4 Preview and 1/20 of Hy4.\n⚡ Made to serve at scale: It exceeds 150 tokens per second in decoding, while its KV cache is just 1/24 the size of Hy3’s and 1/6 of Hy4’s.\n🧠 Long context without the usual overhead: Hybrid attention, LatentMoE, Engram, and the built-in DFly2 drafter support 1M-token workflows with lower, more predictable decoding cost.\n🖼️ Three checkpoints, different jobs: Choose Hy4 flash or Hy4 flash-FP8 for instruction following and reasoning, or Hy4 flash-base for continued pretraining and customization.\n🛠️ Ready for common runtimes: Production recipes are available for vLLM and SGLang, with Transformers support and an OpenAI-compatible API workflow.\n📜 Tencent Hy License applies.", "created_at": "11-18 15:28", "likes": 36, "reposts": 2, "replies": 2, "views": 3469, "url": "https://x.com/ModelScope2022/status/2122955127782834677", "author": "ModelScope2022"}, {"id": "2122948661063844349", "text": "Here is GGUFs⚡️: https://huggingface.co/AngelSlim/Hy4-flash-GGUF", "created_at": "11-18 15:02", "likes": 53, "reposts": 4, "replies": 3, "views": 5020, "url": "https://x.com/TencentHunyuan/status/2122948661063844349 const FIN = {"date": "2026-11-20", "md": "# 财经大事早报 · 2026年11月20日\n\n## 📌今日大势\n\n**1. Anthropic 完成史上最大 IPO，上市首日暴涨 17%，但美股整体收跌**\nAnthropic（Claude 母公司）以每股 83 美元发行 9.8 亿股，募资 **813 亿美元**，超越 SpaceX 6 月 750 亿美元的纪录，成为史上最大 IPO，发行估值约 1.4 万亿美元。11 月 19 日上市首日股价大涨 **17%**，超过 10 万英国散户涌入抢购，FT 评价其\"must own\"。但同日美股整体下挫逾 2%——资金被巨型 IPO 大量抽走，市场开始追问：AI 叙事的资金面还能撑多久？（来源：FT/Al Jazeera/FT Markets，RSS+搜索补漏）\n\n**2. 美联储 10 月会议纪要几乎一边倒鹰派，12 月加息预期升温**\n11 月 19 日凌晨公布的 FOMC 纪要显示，**几乎所有官员都认为需要进一步加息**，理事 Waller 甚至提出 12 月加息 50 个基点的选项；纪要还罕见警告 AI 相关债务通过不透明的融资结构快速膨胀，回报不及预期可能放大损失。加息预期叠加对 AI 基建需求的疑虑，引发商品市场连环下跌：金价跌破 **3800 美元/盎司**（14 个月低点），LME 铜跌 5.7%（7 个月低点），美元指数升至 19 个月高位。市场逻辑已经从\"降息交易\"切换到\"再加息交易\"，后续盯 12 月会议前每一路通胀数据。（来源：CCFGroup/Newsquawk，搜索补漏）\n\n**3. 特朗普—习近平—普京三边会晤发表\"和平宣言\"，乌克兰谈判同步推进**\n特朗普访问深圳出席 APEC，与习近平、普京举行历史性三边会晤，会后三方发布\"和平宣言\"，特朗普称将在三边框架下讨论结束乌克兰战争。此前美俄乌在阿布扎比完成九个月来首次三边谈判，仅有战俘交换等初步成果；欧盟则对约 50 家俄罗斯银行实施新制裁并指责俄拖延谈判、打击乌克兰电力设施。普京邀请欧洲领导人赴莫斯科继续对话。**地缘风险溢价的定价逻辑正在改变**：若和平进程实质推进，油价与防务股将重估；若破裂，波动率将急升。（来源：BBC World/Newsquawk/Al Jazeera，RSS+搜索补漏）\n\n## 💰宏观与政策\n\n- **欧洲央行酝酿将最低准备金率从 1% 上调至 2%**：路透援引四位消息人士称，ECB 管理委员会将在 11 月 25 日讨论该提案，最终决定可能推迟至 12 月 17 日货币政策会议；按当前规模每年可为欧元体系节省至少 **44 亿欧元**利息支出，同时回收过剩流动性。（来源：CCFGroup，搜索补漏）\n- **英国 10 月 CPI 同比升至 3.6%**，为近一年最高；核心通胀持平于 2.8%，受央行关注的服务业通胀 3.7% 低于预期。交易员对英国央行 12 月加息 25 基点的押注从约 90% 降至约 80%。（来源：CCFGroup，搜索补漏）\n- **墨西哥央行会议纪要指向延长货币政策暂停期**，全球主要央行在\"美联储加息\"背景下的政策分化进一步加大。（来源：MarketWatch，搜索补漏）\n- **特朗普政府计划进一步裁减美国审计监管机构（PCAOB）**，公司治理与审计独立性问题再度升温。（来源：FT Markets，RSS）\n- **巴西央行入市干预阻止雷亚尔贬值**，卢拉连任以来本币持续承压，新兴市场汇率防线面临美元走强的全面考验。（来源：FT Markets，RSS）\n\n## 📈市场与投资\n\n- **美股 11 月 19 日收跌超 2%**：Anthropic 上市抽走流动性叠加加息预期，标普与纳指承压；此前一日（18 日）英伟达财报后的震荡仍在延续。（来源：FT，RSS）\n- **英伟达财报超预期但股价未获持续性提振**：Q3（截至 10 月 25 日）营收 **1158 亿美元**、同比 +103%，数据中心收入 1076 亿（同比 +110%），Q4 指引 1300 亿±3%；财报发布后股价在 150 美元支撑位附近反复拉锯，且 10-Q 尚未提交 SEC，被市场视为潜在催化/风险点。（来源：CNBC/WSO/嘉信理财，搜索补漏）\n- **贵金属与工业金属全线暴跌**：本月至今白银跌 **22%**、铜跌 13%、金价跌 9% 至 12 个月低点；交易员削减 AI 需求押注，叠加美元 19 个月高位与 12 月加息预期。（来源：Trade Brains/CCFGroup，搜索补漏）\n- **比特币约 6.5 万美元附近震荡**，与美债 10 年期收益率（约 5.1%）的高敏感度仍在其长期均值水平，宏观利率仍是加密市场第一变量。（来源：嘉信理财/Yahoo Finance，搜索补漏）\n- **油价回落**：布伦特在 **91–93 美元/桶** 区间波动，此前一度因美伊紧张升破 92 美元；EIA 原油库存意外增加压制油价。IEA 表示能源市场\"没有霍尔木兹海峡也能运转\"。（来源：Newsquawk/FT Markets/Trade Brains，搜索补漏）\n- **Google 关联的预付款债券发行因需求冷淡而推迟**，AI 巨头信用债发行遇冷，是 AI 基建融资链收紧的最新信号。（来源：Bloomberg，搜索补漏）\n\n## 🏠房价洞察\n\n- **70 城房价数据（10 月）延续\"一线强、低线弱\"分化**：国家统计局 11 月 16 日发布，一线城市新房价格环比持平（由涨转稳），二线 -0.1%、三线 -0.2%；一线城市**二手房价格环比连涨 8 个月**（10 月 +0.2%），二、三线二手房分别 -0.3%。同比降幅一、二、三线城市均继续收窄。（来源：国家统计局/证券日报，搜索补漏）\n- **上海独强、北京停涨、\"优等生\"补跌**：10 月上海二手房价环比 **+0.5%** 居首，深圳 +0.1%，北京 0.0% 停涨；成都连跌 18 个月、杭州连跌 5 个月。分析指出\"先跌透的先站稳\"，安全岛正在下沉。（来源：虎嗅，搜索补漏）\n- **房贷贴息首月未激起水花**：9 月底三部门推出的首套房贷 1 个百分点财政贴息 10 月落地，但当月住户贷款单月净减少 **4300 亿元**、中长期贷款减少 1563 亿元，前十月累计转负（-501 亿元）。居民加杠杆意愿仍弱，**贴息难以对冲收入与就业预期走弱**。（来源：虎嗅/证券日报，搜索补漏）\n- **库存去化持续推进**：10 月末新建商品房待售面积同比下降 1.7%，连续 8 个月下降；前 10 个月全国二手房交易网签面积 6.8 亿平方米，同比 +11.4%，连续多月高于新房销售，行业明确进入存量时代。现房销售细则在更多城市落地，将深刻影响中长期供给节奏。（来源：经济参考报/证券日报，搜索补漏）\n- **市场预期边际改善**：70 城房价问卷调查显示，预期未来半年新房价格稳定或上涨的从业人员占比接近 **70%**，比上月提高 4 个百分点；但机构普遍判断\"收窄是事实，反转谈不上\"。（来源：经济参考报/中银证券，搜索补漏）\n\n**🔍深度分析：中国房价进入\"分化筑底\"深水区。** 10 月数据确认了两条主线：一是**价格分化**——一线城市二手房年内累计上涨约 1%（新房 +0.6%、二手 +1.6%），而二三线新房年内跌 2%–3.8%，新房、二手房已分别连续下跌 41、42 个月，修复只发生在头部城市核心资产上；二是**政策效力递减**——房贷贴息、购房补贴等需求端工具密集出台，但住户贷款转负说明**居民不缺利率优惠，缺的是收入预期**。政策的真实意图是\"托底不刺激\"：控增量、去库存、优供给，用现房销售制度等供给侧改革重塑行业模式，而非重启涨价周期。对购房者的实操含义：**一线城市与强二线核心地段二手房已具备\"可谈价、可上车\"的窗口**，但需接受价格磨底而非升值预期；三四线与人口流出城市仍处出清阶段，**流动性比价格更值得担心**——下跌之外，卖不出去才是主要风险。后续盯三件事：①11 月住户中长期贷款能否回正（贴息第二个月的检验）；②北京二手房是否会由停涨转跌（风向标意义）；③现房销售细则扩围对房企现金流与供给节奏的冲击。（综合来源：国家统计局、虎嗅、中银证券、证券日报、经济参考报）\n\n## 🤖AI经济\n\n- **Anthropic IPO 成为 AI 叙事的流动性压力测试**：813 亿美元募资创纪录，但上市当日美股下跌逾 2%，市场上开始把\"巨型 IPO 抽水\"与 AI 板块回调挂钩。（来源：FT/Al Jazeera，RSS+搜索补漏）\n- **英伟达 Q3 数据中心收入 1076 亿美元、同比 +110%**，Rubin 平台开始出货（公司称史上最快爬坡）；AI 云/企业客户占数据中心收入比例升至 **44.1%**（一年前 31.4%），买家结构在变宽。同时黄仁勋 11 月 11 日辞职、CFO Colette Kress 出任临时 CEO，公司还宣布收购 Hugging Face。（来源：NVIDIA 新闻稿/The Edge，搜索补漏）\n- **FOMC 纪要点名 AI 债务风险**：AI 相关债务通过不透明融资结构快速增长，回报不及预期可能放大损失；同日 Nscale 警告其供应商面临美国黑名单风险暴露，AI 基建供应链的信用与合规风险进入监管视野。（来源：CCFGroup/FT，RSS+搜索补漏）\n- **腾讯财报不及预期**：AI 支出加大背景下利润仅微增，港股超大规模平台股全线承压——AI 资本开支开始侵蚀中国互联网公司的利润表。（来源：Newsquawk，搜索补漏）\n- **AMD 遭做空机构发布关于中国业务关联的报告后股价下跌**，芯片巨头的中美合规灰区成为新的做空靶点。（来源：FT，RSS）\n\n## 🏢公司与产业\n\n- **沃尔玛财报超预期**，零售消费韧性给加息环境下的美股提供有限支撑；阿里巴巴、网易同日发布财报。（来源：嘉信理财，搜索补漏）\n- **JPMorgan 大幅折价重启停滞的软件债销售**，企业信用市场对高杠杆板块的定价重新收紧。（来源：FT Markets，RSS）\n- **美国财团击败中国竞争对手赢得肯尼亚大型稀土矿权**，关键矿产的地缘争夺从锂、钴延伸到稀土。（来源：FT/BBC，RSS）\n- **委内瑞拉与美国签署军事与石油协议**（距马杜罗下台不到一年），美国防部长称该协议使霍尔木兹海峡成为\"非因素\"，能源地缘格局再平衡。（来源：BBC/Newsquawk，RSS+搜索补漏）\n- **气候谈判放弃化石燃料退出条款、转向碳捕集**，欧盟同时推迟对化石燃料进口的甲烷排放规则——绿色政策节奏明显放缓。（来源：FT Markets，RSS）\n\n## 🌍全球大事\n\n- **特朗普、习近平、普京深圳三边会晤发布\"和平宣言\"**，宣布将讨论结束乌克兰战争；特朗普称普京\"想结束战争\"。（来源：BBC World/Newsquawk，RSS+搜索补漏）\n- **联合国国际法院裁定缅甸对罗兴亚人实施种族灭绝**；同日 ICJ 就相关案听取陈词。（来源：BBC World，RSS）\n- **普京警告将对乌克兰打击克里米亚大桥作出\"远更痛苦的回应\"**；乌方对俄发动 2022 年以来最大规模无人机夜袭，克里米亚大桥再度被击中。（来源：BBC World/Al Jazeera，RSS+搜索补漏）\n- **以色列军方完成\"黄线\"以外加沙地面行动**，停火框架面临进一步压力测试。（来源：BBC World，RSS）\n- **塞内加尔近海移民船沉没、数十人失踪**；乌干达致命山体滑坡幸存者赴联合国寻求追责。（来源：BBC World，RSS）\n- **马斯克称在美国中期选举上 4.46 亿美元的创纪录花费\"相当愚蠢\"**，政治支出与科技巨头关系继续发酵。（来源：BBC World，RSS）\n\n## 📅今日前瞻\n\n- 今日（11 月 20 日）：美国 11 月密歇根大学消费者信心终值；BJ's 批发俱乐部财报。\n- 下周：11 月 23 日 HPE、Zoom 财报；11 月 24 日 11 月谘商会消费者信心、ADI/Dell/Workday/HPQ 等财报；11 月 25 日 ECB 管理委员会会议（准备金率提案）；12 月 17 日 ECB 货币政策会议、12 月 FOMC 会议（12 月加息押注的最终检验）。\n- 持续跟踪：英伟达 10-Q 提交、黄仁勋 12 月 1 日国会作证、乌克兰柏林\"意愿联盟\"会谈、中国 11 月房价与信贷数据。\n\n## 📎来源清单\n\n- FT（Home/Markets）：约 20 条（RSS）\n- BBC World：25 条（RSS）\n- Economist（金融经济/本周）：6 条（RSS）\n- 国家统计局 / 证券日报 / 经济参考报：4 条（搜索补漏）\n- 虎嗅网：1 条（搜索补漏）\n- 中银证券研报：1 条（搜索补漏）\n- CCFGroup 经济要闻：1 条（搜索补漏）\n- Newsquawk：2 条（搜索补漏）\n- CNBC / NVIDIA 新闻稿 / Wall Street Observer / The Edge / 嘉信理财：约 5 条（搜索补漏）\n- Al Jazeera：2 条（搜索补漏）\n- Bloomberg / MarketWatch / Yahoo Finance：3 条（搜索补漏）\n- Trade Brains / DD News：2 条（搜索补漏）\n- CBS News / PBS / The Conversation：3 条（搜索补漏）\n"};

const LIB = {"groups": [{"id": "access-control", "name": "RAG 访问控制", "papers": [{"title": "Security, Privacy, and Trustworthy Design for Retrieval-Augmented Generation Systems", "authors": "Abdulrahman Abdullah Alghamdi", "url": "https://doi.org/10.3390/electronics15225229", "venue": "期刊论文（Electronics，MDPI，2026-11-11）", "oneliner": "按流水线阶段梳理 2020–2026 年 RAG 安全工作的叙事综述：投毒、抽取、成员推断与间接 prompt 注入可组合；引入权限后攻击成功率下降；现有 benchmark 几乎不评估授权状态与多租户隔离。", "insight": "可作相关工作的“缺口陈述”第三方佐证：benchmark 不评估授权状态与多租户隔离，正是我们的 per-view 索引与 cloze 实测要补的位置；其分层控制清单（来源、访问控制、检索时异常检测、上下文隔离、输出监控、工具权限）可用来划定我们工作的边界——我们做的是其中访问控制与上下文隔离一层。诚实标注：单作者叙事综述、无新实验，引用时写清综述性质，不宜当作实证证据。", "tags": ["RAG 安全综述", "授权状态评估", "多租户隔离", "相关工作背景"], "added": "2026-11-13"}, {"title": "Authorization Drift in LLM Agents: Evaluating Boundary Compliance in Multi-Step Tool Use", "authors": "Chuxue Cao 等", "url": "https://arxiv.org/abs/2611.09113", "venue": "arXiv 预印本（cs.CR / cs.LG，2026-11-06）", "oneliner": "没有攻击者也会越界：把 agent 多步工具调用中的授权越界形式化为“授权漂移”，648 样本 ADB 基准实测前沿模型漂移率 0.43–0.61。", "insight": "补上 ChainBind 威胁模型里缺失的非对抗维度：我们的 T1/T2/T3 全是攻击者驱动的注入，这篇证明无对手时 agent 自己也会为走捷径而多拿数据、多调工具；漂移四维度（数据、工具、范围、时间）恰好对应批准绑定需要逐项核对的要素。ADB 的漂移率 + 干净成功率可与我们 E12 的 ASR + 良性效用并列引用，说明“安全—效用权衡”的双指标口径。另可引用其法律映射：数据最小化是最常被触及的条款，93.5% 漂移运行映射多司法辖区。引用须写清基准口径与预印本性质。", "tags": ["授权漂移", "批准绑定", "Agent 安全", "基准"], "added": "2026-11-10"}, {"title": "From Procedures to Permissions: Learning Precise Subagent Authorization from Agent Skills", "authors": "Wenkai Yu 等", "url": "https://arxiv.org/abs/2611.08905", "venue": "arXiv 预印本（cs.CL，2026-11-06）", "oneliner": "从 Agent Skills 的程序知识里学出子 agent 的最小权限集：工具权限精确率 +13.4 个百分点、工作区权限精确率 +24.1 个百分点。", "insight": "与 ChainBind 互补：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”——学出来的最小权限集可作批准的标的、由运行时绑定强制执行。把授权监督信号从“事后轨迹”前移到“事前程序”，与“策略独立于模型提议之外求值”同构。引用须写清数字出自 ClawArena-Team 单一基准与 Qwen3.5-35B-A3B 单一模型族，ground truth 为作者自合成的程序推导。", "tags": ["最小权限", "子 agent", "Agent Skills", "授权"], "added": "2026-11-10"}, {"title": "Right Tool, Wrong Parameters: Defending LLM Agents Against Parameter Poisoning", "authors": "Yao Wang 等", "url": "https://arxiv.org/abs/2611.04673v1", "venue": "arXiv 预印本（cs.CR，2026-11-03）", "oneliner": "参数投毒防御：不诱发新动作、只偷换工具参数，AuthorityFlow 按查询诱导的信任层级逐参数判定来源可信度。", "insight": "与 ChainBind 草案投毒直接咬合：动作名与金额都对、只换主题或日期的投毒，恰好需要参数级而非动作级的批准绑定。AuthorityFlow 的字段信任归因是“批准环节加来源过滤”的可操作化候选，但其信任层级由模型解读查询生成，存在循环风险，引用时须点出该层。数字为作者自建 FactAuthBench 上的 93.06%→9.03%，良性效用代价约 7.6 个百分点。", "tags": ["参数投毒", "批准绑定", "信任层级", "Agent 安全"], "added": "2026-11-05"}, {"title": "Permitted but Unauthorized: Affordance-Induced Delegated-Scope Violations in Multi-Agent LLM Systems", "authors": "Shravya Kanchi", "url": "https://arxiv.org/abs/2611.04086v1", "venue": "arXiv 预印本（cs.CR，2026-11-02）", "oneliner": "多智能体系统里的“被许可却未授权”：决定 agent 越界的不是权限表，而是对端动作有没有被列出来供它看见。", "insight": "把授权拆成许可与委托范围两层：权限表不变、只改动作可见性，越界率就能从 0 走到 52/52。我们的 per-view 语义可据此补一句——视图不仅要按 AU 过滤内容，还要按委托范围过滤可执行动作的可见性。另可引用其“范围执法 ≠ 伤害预防”边界：确定性监控器挡住全部越界，却挡不住用自己的已授权动作拖累同伴。引用须写清模拟环境与单格子极端值。", "tags": ["委托范围", "多智能体", "授权", "呈现面"], "added": "2026-11-05"}, {"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations", "authors": "Evan Oktavianus、Dana Indra Sensuse、Imairi Eitiveni", "url": "https://doi.org/10.24433/co.3932736.v1", "venue": "Code Ocean（2026-10-30，OpenAlex 收录）", "oneliner": "面向公共机构的声明式 agentic RAG 访问控制：工作流表示为状态机，每状态挂自己的策略，跨通道与组织单元统一执行。", "insight": "补了 RU/AU 框架里“状态维度”的缺口：我们是查询时按内容归属逐 AU 求值，StateGate 是按工作流状态判定授权，两者叠加构成“内容归属 × 工作流状态”的二维判定，直接对应 ChainBind 的“批准—执行跨状态是否还有效”问题。其“过滤而非依赖引导”与 retrieve-then-project 同构（过滤防住 95.5% 暴露与 85/143 注入得手）。引用时须标注合成文档 + 自建 oracle/对照的证据边界，载体按预印本/技术报告口径处理。", "tags": ["工作流状态", "agentic RAG", "访问控制", "过滤"], "added": "2026-11-01"}, {"title": "REALM: Identifying Minimal Task Assets for LLM Agents", "authors": "Zihou Ren、Byungchul Tak、Long Wang", "url": "https://arxiv.org/abs/2610.39155v1", "venue": "arXiv 预印本（cs.CR, cs.AI, eess.SY，2026-10-29）", "oneliner": "为 LLM agent 识别并维护任务真正需要的最小资产集合，把“发现资产”与“授权使用”分开，在任务容器内只暴露资源受限的局部 API。", "insight": "与 RU/AU 解耦在执行侧同构：我们是检索侧“策略独立存放、查询时逐 AU 求值”，REALM 是执行侧“资产发现走依赖图、授权使用走受限 API”。它还处理了执行中才涌现的资产身份问题，其“来源限定接纳”可与“未知 AU 默认拒绝”对照。AgentDyn 上 ASR 16.6%→0.2%（qwen3.5-flash），引用时须限定基准与模型。", "tags": ["最小权限", "agent 授权", "提示注入", "AgentDyn"], "added": "2026-10-31"}, {"title": "Contextual Candour: Role-Aware Graduated Disclosure for LLMs over Mixed-Sensitivity Contexts", "authors": "Devansh Srivastav、David Pape、Samira Abedini 等", "url": "https://arxiv.org/abs/2610.28067", "venue": "arXiv 预印本", "oneliner": "把访问控制从二值 grant/deny 扩展为按用户授权等级校准回答粒度的渐进披露（graduated disclosure），用 reward-based 优化在生成过程里做披露控制。", "insight": "与 per-view 索引形成互补路线：我们是索引侧的离散视图隔离，他们是生成侧的连续粒度校准；结合点正是执行时授权绑定方向（生成时按 AU 动态校准）。其 reward 明确惩罚改写型泄露，呼应我们 retrieve-then-project 的 NLI 残留检查，可互相印证。", "tags": ["渐进披露", "生成侧控制", "授权校准"], "added": "2026-10-22"}, {"title": "Local Allow, Global Deny: Why Per-Action Authorization Does Not Compose in LLM Agents", "authors": "Anmol Pandey、Aditya Jain、Liang Chen 等", "url": "https://arxiv.org/abs/2610.27620", "venue": "arXiv 预印本", "oneliner": "证明逐动作授权在逻辑上无法组合成全局授权：关系型目的违规是 2-safety hyperproperty，零误报的单动作监控器一个都检测不到；AL-SYNTH 用 SAT/SMT 合成最小 CAF 见证。", "insight": "直接质疑逐 AU 求值这类局部授权语义的完备性：跨 AU 的关系型约束（如两段各自授权的片段拼在一起才构成泄露）在单查询内不可见。论文 limitations 应声明 AU 求值是 per-query 单轨迹语义，关系型策略需要跨执行监控，列为未来工作。AL-SYNTH 的最小见证合成法可借鉴，用于评估我们三语义在组合性攻击下的表现。", "tags": ["agent 授权", "组合性", "2-safety", "不可能性定理"], "added": "2026-10-22"}, {"title": "Lineage-Aware Memory Governance: A Derivation-Gated Framework for Privacy-Preserving Column-Level Access Control in Enterprise AI Agents", "authors": "Venkata M Sangaraju、Sudhir Vissa", "url": "https://arxiv.org/abs/2610.07258", "venue": "arXiv 预印本（HF 每日论文）", "oneliner": "提出 Analytical Memory Unit（AMU）：为共享内存中每条缓存结果附上完整推导血缘图，检索策略只有在请求者对结果触及的每一列都有授权时才返回命中。", "insight": "与我们 RU/AU 解耦形成直接对话：它是智能体内存侧的'检索时逐血缘求值'镜像设计。关键是其负面实证——消除泄露需要 75–90% 的血缘记录完整度——恰恰论证了我们'未知/未映射 AU 默认拒绝'的必要性：血缘不可能永远完整，fail-closed 必须内建在语义层而非依赖记录完整度。另可借鉴其'条件式设计保证 vs 经验结论'的措辞区分。引用价值高。", "tags": ["智能体内存", "访问控制", "血缘门控", "默认拒绝"], "added": "2026-10-09"}, {"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "venue": "arXiv:2609.36373 (2026)", "oneliner": "首个把\"授权先于上下文组装\"做成 sound + policy-complete 的记忆准入机制：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，10,000 个多方对话历史中零违规项进入上下文", "insight": "与我们\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照；其派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照，可在 Discussion 对比两种选择的代价；\"audience 扩大需显式对象特定授权\"可为 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience（非 AU 级内容划分），威胁面在 T1/T2 内。", "tags": ["授权前置", "related work", "必引候选"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "Scott Thornton 等", "insight": "与我们 KG 路径切割节（Round 8）主题相邻、贡献互补：他们是在线图扩展边界做单点授权检查，我们是离线 k-cut + 代价曲线（28.2% 公开文本代价、残留实体 4133→0）+ 子句级 PII 粒度。必须引用并主动写清差异；他们的 PD=2 命题与我们的 k=2 发现（k=3≡k=2）互相印证。", "oneliner": "形式化 Retrieval Pivot Risk：vector 检索出的 seed chunk 经实体链接 pivot 进敏感图邻域，造成纯向量检索不存在的跨租户泄露；提出 7 种攻击；泄露稳定出现在 PD=2（二部拓扑命题）。", "tags": ["KG", "pivot攻击", "必引"], "title": "Retrieval Pivot Attacks in Hybrid RAG: Measuring and Mitigating Amplified Leakage from Vector Seeds to Graph Expansion", "url": "https://arxiv.org/abs/2602.08668", "venue": "arXiv:2602.08668 (2026)"}, {"added": "2026-09-30", "authors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "title": "Integrating Access Control with Retrieval-Augmented Generation: A Proof of Concept for Managing Sensitive Patient Profiles (AC-RAG)", "url": "https://doi.org/10.1145/3672608.3707848", "venue": "ACM SAC 2025"}, {"added": "2026-09-30", "authors": "", "insight": "写 related work 全景段落时引用，界定我们的位置。", "oneliner": "RAG 安全攻防分类综述，§4.4 整节讲 Access Control / Privacy / Confidentiality（含 SD-RAG、AC-RAG、DPVoteRAG、PAD 等）。", "tags": ["综述", "related work"], "title": "Securing Retrieval-Augmented Generation: A Taxonomy of Attacks, Defenses, and Future Directions", "url": "https://arxiv.org/pdf/2604.08304", "venue": "arXiv:2604.08304 (§4.4)"}, {"title": "ResidualAuth: What Authorization State Must Language Agents Preserve under Revocable Delegation?", "authors": "Moonwon Choi et al.", "url": "https://arxiv.org/abs/2609.08062", "venue": "arXiv cs.AI/cs.CR (2026-09-08, v2)", "oneliner": "可撤销委托下授权状态的形式化：两段历史可权限相同但撤销后决策相反，系统必须保留的恰是 residual authorization state，并给出内存精确/紧界。", "insight": "与我们 Discussion 的“撤销机制”开放问题直接对接：授权结论是授权历史的函数而非权限快照的函数；其内存下界与我们 AU 粒度—安全—成本权衡曲线呼应；与昨日 Residual Authority Replay 攻击形成“攻击—理论”配对引用。", "tags": ["revocable-delegation", "authorization-state", "theory", "memory-bounds"], "added": "2026-10-02"}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "venue": "arXiv cs.CR/cs.AI/cs.SE (2026-09-30)", "oneliner": "系统化揭示 coding-agent 中“人批准的 A ≠ 实际执行的 A'”的六类批准—执行绑定失效，提出 keyed capability (Approval Token) 部分修复并诚实报告负结果。", "insight": "“批准—执行绑定完整性”与我们的 M(r) 绑定思想同属一范式，可在 Agent 线 related work 并列；其“字段级验证器看不见进程层级分叉”的负结果警示授权证据必须绑定到执行语义层；诚实负结果段落是局限章节范本。", "tags": ["approval-binding", "capability", "coding-agent", "negative-result"], "added": "2026-10-02"}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han et al.", "url": "https://arxiv.org/abs/2609.39450", "venue": "arXiv cs.CR/cs.AI (2026-09-30)", "oneliner": "技能投毒下的工具调用授权：授权上下文与生成上下文分离，基于可信用户意图做 fail-closed 裁决，319 次注入测试中 ASR 相对降低 35–46%。", "insight": "“授权决策输入限于可信侧”与我们“策略独立存放、查询时逐 AU 求值”同构，Agent 线 related work 可并列引用；其 Reviewer 仍是 LLM 裁决，与我们“确定性求值”路线形成对照，可在 Discussion 讨论取舍。", "tags": ["tool-call-authorization", "skill-injection", "fail-closed", "agent"], "added": "2026-10-02"}, {"title": "Role Based Access Control in Enterprise RAG", "authors": "Gnaneshwar Kethavath", "url": "https://doi.org/10.5281/zenodo.23168856", "venue": "Zenodo preprint (2026)", "oneliner": "用 15 份虚构公司文档 × 3 个模拟角色 × 4 种实现实证企业 RAG 的 RBAC：未过滤 RAG 在 99 次未授权/攻击评估中泄露 37 次，prompt-only 权限声明仍泄露 12 次，两种代码级过滤均为 0。", "insight": "我们\"策略独立于模型、在执行层强制\"主张的第三方实证：37/99 vs 12/99 vs 0 这组数字可直接进论文动机段——仅靠 prompt 声明权限不够。它做的是文档级 RBAC（粗粒度），恰好是 AU 划分的一个特例（每文档一个 AU），粒度差异本身可写成对比点。注意局限：Zenodo 非同行评审、单作者、合成小数据、作者自检标签，只能作支持性引文。", "tags": ["RBAC", "企业 RAG", "实证评估", "必引候选"], "added": "2026-10-07"}, {"title": "Safe Separability for Autonomous Authorization: Branch-Relative Authority Closure Under Decision-Critical Uncertainty", "authors": "Mohammad Amir Khusru Akhtar", "url": "https://doi.org/10.21203/rs.3.rs-11086182/v1", "venue": "Research Square 预印本（Under Review）", "oneliner": "形式化“授权决策所需证据、其获取动作本身也需要授权”的循环为 safe separability，提出分支相对授权闭包（BRAC），只用在所有仍兼容世界中都合法的探测来消解决策关键不确定性。", "insight": "与我们“未知 AU 默认拒绝”的保守路线形成直接对照：BRAC 是“在可证明安全的分支内允许证据采集”的积极路线，两者都承认授权信息不完备时行动的困难但选择相反的风险分配，可在 discussion 并列为“证据采集 vs 默认拒绝”权衡。其“先给受限可解类、再用最小反例划界”的形式化写法（联合状态语义+单调类+世界依赖反例）值得我们写 T1/T2/T3 形式化时借鉴；266 回归测试+穷举小世界+随机认证对比的评估方法学可作授权语义正确性评估模板。注意是审稿中预印本，引用时标注。", "tags": ["authorization", "autonomous-agents", "formal-methods", "evidence-acquisition"], "added": "2026-10-10"}, {"title": "After the Edit, Freshness and Access Control of Tool-Calling Retrieval and Vector RAG for a Community-Edited Knowledge Base", "authors": "Nikolaos D. Tantaroudas、Ilias Karachalios、Andrew J. McCracken", "url": "https://doi.org/10.20944/preprints202610.0645.v1", "venue": "Preprints.org 预印本（OpenAlex）", "oneliner": "在可编辑社区知识库上对照实测工具调用检索与向量 RAG 的新鲜度与访问控制：48 组反事实编辑 + 48 条合成 canary 记录，测编辑后新值给出率与 gated 内容泄露率。", "insight": "与我们 RU/AU 解耦框架直接对话的三组数字：工具 agent 在 240 次探测中零泄露 gated 内容，而批量重索引的 RAG 在重索引前泄露了全部已撤销 canary、忽略 gating 标记的索引器在 96 次探测中泄露 93 次——这是“撤销必须内建在执行语义层、gating 必须跟随内容复制的每一步”的现成实证，可引作我们撤销机制一节的经验证据。另：RAG 在对话内被追问时只有 19.6% 给出新值（多为撤回之前的正确答案），说明检索新鲜度不仅是索引问题也是对话状态问题——与我们“查询时逐 AU 求值”的设计呼应。局限：Preprints.org 预印本、单平台案例（希腊农业平台），引用时需标注。", "tags": ["访问控制", "撤销机制", "工具调用检索", "新鲜度", "实证"], "added": "2026-10-11"}, {"title": "One Word Opens the Gate: The Option-Channel Attack on Typed Decision Models as Agent Guardrails", "authors": "Seyedarmin Azizi、Erfan Baghaei Potraghloo、Massoud Pedram", "url": "https://arxiv.org/abs/2610.12292", "venue": "arXiv 预印本（OpenAlex 增补）", "oneliner": "评估 7 个开源类型化决策模型作为 agent guardrail 的允许/阻止决策质量：准确率仅 36%–72%，6 行无关日志文本可把 fail-open 率从 0% 抬到 63%，误导性选项名可抬到 93%–100%；结论是这类模型不应成为做决定的组件。", "insight": "直接论证我们架构的核心选择：授权判定必须是确定性的策略求值（逐 AU 计算 P(a,u)），而不是模型推理——模型做 allow/block 在对抗文本下 fail-open 率可达 93%–100%。fail-open/fail-closed 二分法与我们“未知 AU 默认拒绝”同构，且论文显示模型 guardrail 的默认倾向不稳定，正是默认拒绝必须写进语义层的理由。另：“选项通道攻击”是 T1/T2/T3 之外的新攻击面（攻击决策组件自身的输入通道），我们的框架因 AU 求值不经过模型而天然免疫。局限：arXiv 预印本、0 引用，评估的是开源小模型而非 Jev 本体。", "tags": ["类型化决策模型", "guardrail", "选项通道攻击", "默认拒绝", "授权判定"], "added": "2026-10-11"}, {"title": "Provenance and Authorization in Autobiographical Language Models", "authors": "Faruk Alpay、Taylan Alpay", "url": "https://arxiv.org/abs/2610.17935", "venue": "arXiv 预印本（cs.CR，2026-10-13）", "oneliner": "把自传式语言模型档案中\"叙事内容悄悄变成授权依据\"形式化为安全问题：定义类型化记录、认证断言、与内容分离的独立策略通道和可容许视图，并给出完整性规约与 noninterference 论证。", "insight": "与我们 RU/AU 解耦的核心主张跨领域收敛：\"策略与内容载体分离、查询时独立求值\"。其 noninterference 论证框架可直接借鉴为我们\"零泄露\"目标的形式化语言；\"admissible views\" 与我们的 per-view 索引执行语义直接对应。它还给了一个 T1/T2/T3 之外的新攻击面实例：授权依据在推理时的语义漂移（叙事→同意），提示威胁模型可在\"检索后、生成前\"补一刀。只引形式化部分，不引其小规模合成试点数字。", "tags": ["策略通道分离", "可容许视图", "noninterference", "授权语义"], "added": "2026-10-15"}, {"title": "From Detection to Decision: Calibration and Deferral for Prompt-Injection Detection", "authors": "Qianlong Lan、Anuj Kaul、Vinothini Pandurangan、Indranil Sanyal", "url": "https://arxiv.org/abs/2610.20907", "venue": "arXiv 预印本（2026-10-14，cs.CR）", "oneliner": "把 prompt injection 防御从二分类检测器推进到允许/拦截/升级的运营决策：47,611 样本测校准与 deferral，结论是概率输出救不了分布偏移下的安全决策。", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的强制授权立场形成可对比论证：即使 AUROC 0.897 的最佳检测器，在 1% 漏报目标下也需要 >91.8% 人工升级率，证明\"先检测后决策\"在运营上不可行——这正是我们不走检测过滤、而走执行语义授权绑定的实证支撑。引用点在论证链，不在技术细节。", "tags": ["提示注入", "检测天花板", "强制授权"], "added": "2026-10-18"}, {"title": "When Approval Becomes Execution: Authorization-Grounded Workflow Attacks on Tool-Using Agents", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2610.23077", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "攻击者不覆盖策略、而是引导 agent 走完一条局部自洽的审批工作流，用合法申请的 approval token 经 authorized_by 拿到受保护文档（8/9 完成精确目标操作）。", "insight": "执行时授权绑定方向最直接的经验证据：token 持有被当作充分授权，而请求者身份/审批者权限/资源范围/动作类型/业务目的没有被联合强制执行。可与我们的执行语义并列为绑定缺失的第二个实例（我们是检索时绑定，它是执行时绑定），related work 里互补引用。", "tags": ["agent 授权", "执行时绑定", "工作流攻击", "token 上下文"], "added": "2026-10-20"}, {"title": "Agenra: A Language and Verified Core for Stateful LLM Agent Authorization", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2608.22868", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "带 Lean 验证核心的策略语言，处理可消耗权限的状态化授权：用新旧 permission ledger 之间的 simulation 认证权限修订，51 个人工修订上 21/21 通过、30/30 拒绝且全部经 replay 确认。", "insight": "与我们执行语义互补：我们目前是查询时静态策略求值，没有处理授权随执行消耗的动态维度；其 simulation 认证思路可借来论证 AU 划分/策略变更后既有授权语义是否保持（审稿人可能追问的点）。其安全 vs 工作流保持分离的写作范式也值得学。", "tags": ["形式化验证", "状态化授权", "权限修订", "Lean"], "added": "2026-10-20"}, {"title": "Securing LLM-Agent Long-Term Memory Against Poisoning: Non-Malleable, Origin-Bound Authority with Machine-Checked Guarantees", "authors": "Yedidel Louck", "url": "https://doi.org/10.66977/xsci.2610.001o", "venue": "OpenAlex 补录（2026-10-18）", "oneliner": "双独立源背书或显式用户授权的策略，在抽象记忆模型中机器验证了其在允许变换下对任意规模存储保持成立；1152 个受控 episode 中无防御 61/72 被攻陷、有 monitor 后 0/72。", "insight": "origin-bound authority 是执行时授权绑定的雏形：授权证据与来源绑定、随时间保持有效。直接启发：我们的 AU 授权判定目前是查询时的，长期会话/记忆场景下 AU 映射 M(r) 会漂移，其在变换下保持的证明框架可借鉴来论证 AU 划分稳定性；其保守默认与我们未知 AU 默认拒绝可互相印证。", "tags": ["agent 记忆", "投毒防御", "机器验证", "权限绑定"], "added": "2026-10-20"}, {"title": "PP-RAG evaluation package: deterministic privacy controls for retrieval-augmented generation over educational feedback", "authors": "Vassilios S. Verykios、George Vorvilas、Evgenia Paxinou 等", "url": "https://doi.org/10.5281/zenodo.23458295", "venue": "Zenodo 评估包（2026-10-18；配套论文投 Intelligent Decision Technologies）", "oneliner": "PP-RAG 确定性隐私控制的 seeded 完全可复现评估包：PII 检测与匿名化、基于角色的 ACL-filtered retrieval、LLM 前自适应输出控制、最小 cohort-size 阈值，附 span 级 ground truth 合成数据集。", "insight": "与我们思路最接近的现存竞品，必须正面处理：其 ACL-filtered retrieval 是检索时按 ACL 过滤，我们是策略独立存放、查询时逐 AU 求值——差异点正好是我们的核心 claim（策略变更不需重建索引）。评估包可复现，可作为我们补基线对比的候选基准。标记为竞品对比候选。", "tags": ["RAG 隐私", "ACL 过滤", "可复现基准", "竞品"], "added": "2026-10-20"}, {"title": "SpanGuard: Decoupling Instruction Localization from Authorization for Lightweight IPI Defense", "authors": "Yinxiang Wang, Zehua Ma, Kejiang Chen, Weiming Zhang, Han Fang", "url": "https://arxiv.org/abs/2610.26013", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "把 IPI 防御拆成无监督指令定位 + 块级授权判定两步，小模型守卫也能达到 0.32% ASR。", "insight": "与我们 RU/AU 解耦哲学最同构的相关工作：\"定位 vs 授权判定\"分离论证了\"解耦带来轻量化+可验证性\"。它的块级授权判定正是\"执行时逐 AU 求值\"在 IPI 通道的镜像，可在 related work 中并列；0.32% ASR 是\"解耦不牺牲防御强度\"的硬证据。", "tags": ["IPI 防御", "解耦", "授权判定", "轻量守卫"], "added": "2026-10-21"}, {"title": "RAGLeak: Supply-Chain Privacy Backdoors in Retrieval-Augmented Generation", "authors": "Yuchen Chen, Wei Cheng, Yuan Xiao, Junda He, Jieke Shi, PingPing OuYang, Quanjun Zhang, Chunrong Fang, David Lo, Zhenyu Chen", "url": "https://arxiv.org/abs/2610.25937", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "在 RAG 生成器中植入供应链后门：触发时可逆混淆检索到的私密文档，辅助 LLM 高保真恢复，ASR 最高 100%，干净微调不消除。", "insight": "T1/T2/T3 之外的新攻击面：威胁在模型供应链而非检索通道。它动摇了\"生成器可信、风险只在检索与上下文\"的隐含假设——威胁模型章节应明确声明信任边界（生成器供应链在 scope 之外），否则审稿人会质疑 per-view 索引能否挡住被污染的生成器。100% ASR 可引用。", "tags": ["RAG 攻击", "供应链后门", "隐私泄露", "威胁模型"], "added": "2026-10-21"}, {"title": "Memory, Know Your PLACE: Governing Lifecycle State and Query-Time Eligibility in Persistent-Memory Agents", "authors": "Chen-Fang Hu, Hong-Han Shuai, Woan-Shiuan Chien", "url": "https://arxiv.org/abs/2610.25179", "venue": "arXiv cs.AI/cs.CL 预印本（2026-10-18）", "oneliner": "为持久记忆 agent 加可拆卸治理层 PLACE：写侧状态认证 + 读侧授权，读侧治理消除了可测量的因果泄露。", "insight": "\"读侧授权\"是\"查询时逐 AU 求值\"在记忆载体上的实现，其\"消除可测因果泄露\"结论可直接引用论证\"读侧强制有效\"。对执行时授权绑定方向：它的写侧认证+读侧授权双层结构是完整形态，提醒我们\"授权证据随时间保持有效\"需要写侧机制——与 Yedidel Louck 的 origin-bound authority 互相印证。", "tags": ["agent 记忆", "读侧授权", "因果泄露", "执行时绑定"], "added": "2026-10-21"}, {"title": "Auditing the Hand-Written Inputs of Learned Access Control", "authors": "Arsalan Jalil Sarghaleh、Mehdi Hazrati", "url": "https://arxiv.org/abs/2610.31388", "venue": "arXiv 预印本", "oneliner": "审计学得访问控制背后两件手写制品（hard-deny 集合、region map）：5 个 ABAC Lab 策略上穷举检查，忠实转录的 deny 条款不可靠率 0.50–0.70，未经验证上线会误删 16–78% 合法授权。", "insight": "对我们最直接的警示性证据：\"未知 AU 默认拒绝\"的前提是 deny 判定本身 sound，而这篇证明手写 deny 制品在实践中大面积 unsound，失败模式正是\"自然语言作用域 vs 规则析取\"的语义错位。建议在论文 limitation/deployment notes 引用：deny 集合须经穷举 soundness 检查，否则默认拒绝变误删。其\"false-non-grant 与 false-permit 两种损失同时报告\"值得借鉴为三语义评估规范。注：Jev 粗筛 relevance 0.56 未过线，人工终审判定直接相关而收入。", "tags": ["访问控制", "deny 语义", "soundness", "ABAC"], "added": "2026-10-24"}, {"title": "Structured Decomposition for Reliable LLM-Generated Access Control Policies", "authors": "Vatsal Gupta、Darshan Sreenivasamurthy（Apple Inc.）", "url": "https://doi.org/10.1007/978-981-92-6837-5_10", "venue": "ICICS 2026（LNCS vol 17216）", "oneliner": "自然语言访问控制策略 → OPA Rego 可执行代码的模块化流水线（策略检测/组件抽取/schema 校验/lint/编译/自动测试），372 条 ACRE 语句上端到端正确率 50.3%（基线 15.3%，3.3×）。", "insight": "\"LLM 生成访问控制策略\"的扎实工程参照，与我们是上下游互补关系（他们做策略生成可靠性，我们做检索时授权绑定）。deny 语义正确率 87.5% 与 Auditing 一文互相印证：deny 是访问控制最脆弱的一环，正是我们\"未知 AU 默认拒绝\"需形式化保证的 motivation。其\"正反两类测试都通过才算正确\"的严格标准可借鉴为三语义评测准则。注：Jev 粗筛 relevance 0.62 未过线，人工终审判定可引用而收入；代码尚未公开。", "tags": ["策略生成", "OPA/Rego", "policy-as-code", "deny 语义"], "added": "2026-10-24"}, {"title": "Enhancing Large Language Models with External Knowledge Using Retrieval-Augmented Generation: A Critical Review of Retrieval Design, Context Compression, Safety and Evaluation, with a Conceptual Governance-Aware Architecture", "authors": "Auti Pallavi S. 等", "url": "https://doi.org/10.5281/zenodo.23593530", "venue": "Zenodo 预印本综述（2026-10-23）", "oneliner": "RAG 批判性综述：梳理检索设计、压缩、安全与评测的相互作用，提出八层治理感知架构，把 IAM 权限过滤放进 RAG 设计核心。", "insight": "可作我们论文 related work 的治理视角动机引用：它把 IAM-based permission filtering 列为 RAG 设计的一等要素，并点明访问控制放在 LLM 之外执行只在显式信任假设下成立——这正是我们把信任假设形式化为逐 AU 求值与未知默认拒绝的动机。但注意边界：这是未经同行评审的综述、无新实验，八层架构未经验证，只能作背景/动机引用，不能作证据引用。", "tags": ["RAG 治理", "IAM 权限过滤", "综述"], "added": "2026-10-25"}, {"title": "An Efficient Privacy-Preserving Retrieval Scheme for Cloud-Based Retrieval-Augmented Generation", "authors": "Yuan Chang 等", "url": "https://doi.org/10.1109/TCCN.2026.3705821", "venue": "IEEE Transactions on Cognitive Communications and Networking（2026）", "oneliner": "云端 RAG 隐私检索 ShieldRAG：局部敏感哈希分桶 + 内积函数加密，云端看不到查询内容与文档访问模式，延迟 <0.5 秒、top-5 召回约 90%。", "insight": "与我们 embedding 通道一节可比但角度不同：我们防“结果里混进未授权内容”，ShieldRAG 防“云端从查询与访问模式反推隐私”，即 T2/T3 里服务器方观察者分支；可量化对照点是隐私不必以检索不可用为代价，但摘要未给明文基线精度损失与密钥管理成本，不宜写成已解决问题。", "tags": ["隐私检索", "函数加密", "云端 RAG"], "added": "2026-11-02"}, {"title": "RevBench: code, scenarios, run logs and judgments for enforcing mid-task permission revocation in AI agents", "authors": "Martin Ignatovski", "url": "https://doi.org/10.5281/zenodo.23854359", "venue": "Zenodo 软件与数据存档（配套论文 Revoking Access Does Not Revoke Knowledge）", "oneliner": "任务中途撤销权限的基准：逐调用授权 720 轮失败 57.9%，撤销发生在数据送达后失败率升至 72.8%，选择性重放+清单级溯源降至 21.0%。", "insight": "补上 AU 求值未单列的一维：授权的生命周期。我们的覆盖映射回答查询时某内容属不属于你，RevBench 回答此前已授权、此刻已撤销的内容在上下文、草稿与记忆里的残留如何清除；其清单级溯源与 M(r) 同源，讨论节可用 57.9%/72.8% 说明只在读取时设卡不够。标注证据边界：自建模拟平台 + LLM 评判，非真实 SaaS 实测。", "tags": ["权限撤销", "agent 授权", "残留知识", "基准"], "added": "2026-11-03"}, {"title": "IAMRAGBENCH: Benchmarking Authorization Expansions in LLM-Generated AWS IAM Policies under RAG Poisoning", "authors": "Hasan Kaplan 等", "url": "https://arxiv.org/abs/2611.03431v1", "venue": "arXiv:2611.03431v1 (2026)", "oneliner": "RAG 投毒攻击 IAM 策略生成的基准：投毒上下文诱使模型生成提供商校验通过、但超出可信授权需求的策略，60 案例、确定性授权包络评分。", "insight": "与 RU/AU 框架最直接的新证据：其“授权包络”即生成侧的 AU 求值——先划可信授权需求的线，再逐条判定生成物是否越线；“架构例外”包装下攻击率 63.79% 说明判定位置（何时判、由谁判）比规则本身更脆弱，呼应“查询时逐 AU 求值、未知 AU 默认拒绝”。另注意 CheckNoNewAccess 漏报 4 例：形式校验不能替代包络语义校验。引用时标注 arXiv 预印本、自建基准。", "tags": ["RAG 投毒", "授权扩张", "IAM 策略", "基准"], "added": "2026-11-04"}, {"title": "SearchInject: Retrieval Exposure Control for Indirect Prompt Injection in Language-Model Search", "authors": "Kainan Zhou 等", "url": "https://arxiv.org/abs/2611.02643v1", "venue": "arXiv:2611.02643v1 (2026)", "oneliner": "间接提示注入的检索层准入关：用相关性、搜索滥用信号与指令可能性联合打分隔离可疑候选，top-10 目标暴露率相对下降约 83%，干净检索质量几乎无损。", "insight": "与 retrieve-then-project 构成两道关对照：准入关挡“看起来像指令的页面”，授权关挡“不属于你的片段”，两者叠加才完整；其 nDCG@10 最大变化仅 0.0018 说明准入控制代价可以很小。引用时不要把“暴露率下降 83%”写成“攻击成功率下降 83%”（104 例跟进无法估计后者），且评估为家族内泛化。", "tags": ["间接提示注入", "检索准入", "隔离", "搜索增强"], "added": "2026-11-04"}, {"title": "Governed Retrieval Augmented Generation with Guardrails Role Based Access Control and Audit Logging", "authors": "Lohith Reddy Kalluru", "url": "https://doi.org/10.21275/sr261031123753", "venue": "International Journal of Science and Research（2026-11-04）", "oneliner": "企业 RAG 权限治理实测：只靠索引层过滤时角色撤销后 99.5% 的查询仍泄漏未授权上下文，加一道查询时权限复核后违规归零。", "insight": "把我们“策略独立存放、查询时逐 AU 求值”的主张变成了可引用的数字：99.5% 是“权限变了、索引没跟上”这一失效模式的直接证据；其“当前权限复核”与我们的查询时求值同构，可在 related work 里互相印证。引用时须写清三点限制：SQLite FTS5 合成诊断、无 LLM、无真实语料；IJSR 为低门槛期刊；只覆盖角色/文档撤销两类变化，未覆盖 T2/T3 攻击面。", "tags": ["RAG 授权", "RBAC", "权限撤销", "查询时复核"], "added": "2026-11-06"}, {"title": "Rag n' Roll: A Framework to Evaluate Indirect Prompt Manipulation Attacks against RAG-based Applications", "authors": "Gianluca De Stefano 等", "url": "https://doi.org/10.1145/3847352.3848095", "venue": "ACM Workshop on Artificial Intelligence and Security (AISec 2026)", "oneliner": "RAG 间接提示操纵评估框架：默认配置下攻击可控制高达 70% 的生成答案，而既有评估方法会系统性高估攻击成功率。", "insight": "给 RU/AU 论文一个可引用的攻击面数字：默认配置 70% 答案可被操纵，且效果高度依赖流水线参数——注入文档一旦进了检索集，文本层面的防御就拦不住，只有在检索/授权边界上卡住才行，与我们“授权判定在检索结果进上下文前由架构保证”同构。方法论提醒：我们的 cloze 攻击 89.4%@20 与重编码后 4.05% 的对比也应写清评估口径（检索配置、k 值、判定标准），否则同样会被质疑可比性。引用须写清 70% 为默认配置最高值。", "tags": ["RAG 安全", "间接提示注入", "评估框架", "AISec"], "added": "2026-11-11"}, {"title": "Isolation Is Not Confidentiality: Security Boundaries of Geometric Access Control in RAG", "authors": "Steve Nouyep 等", "url": "https://arxiv.org/abs/2611.14061", "venue": "arXiv 预印本（cs.CR，2026-11-10）", "oneliner": "几何访问控制保住了检索效用与策略隔离，却保不住表示机密性：几百对对齐向量即可恢复原始 embedding，策略相关几何还会泄露成员关系。", "insight": "把“隔离≠机密性”形式化成四个可分开检验的目标（隔离/机密性/抗伪造/成员隐藏），直接支撑我们论文的 embedding 通道论证：全文 embedding 索引下 cloze 攻击 89.4%@20、按授权视图重编码后 4.05% 的对比，恰好是“隔离成立、机密性仍失效”的实证。它的对齐样本恢复攻击与我们的 T2（可见排序向量）同构；策略成员隐藏是我们尚未显式处理的风险点，per-view 索引方案应说明是否覆盖这一层。引用须写清结论出自作者评估的公开实现与三个编码器。", "tags": ["RAG 访问控制", "几何变换", "embedding 泄露", "策略隔离"], "added": "2026-11-12"}, {"title": "Fail-Closed Authorization for Tool-Using AI Agents: A Capability Contract and Case Study", "authors": "Andrey Lesnikov", "url": "https://doi.org/10.21203/rs.3.rs-11676427/v1", "venue": "预印本（Research Square，单作者）", "oneliner": "默认拒绝的执行前授权门 ASC：工具目录 SHA-256 锁定、高危工具须带外批准、所有错误路径收敛到 BLOCK；60 例对抗探针放行攻击 32→1，代价是 3 个良性误拦。", "insight": "与 ChainBind 的执行时授权绑定同线互补：它的 fail-closed 姿态（未知即拒绝、错误即拒绝）与我们的“未知 AU 默认拒绝”一致，可并列引用；它给出的误拦代价（严格参数规则拦掉 94/97 良性任务）是“绑定越严、效用越低”的量化证据，应与我们 E12 的良性效用并排讨论；其 JSON 证据信封（每次裁决带完整性校验）是裁决审计记录的可借鉴机制。引用须写清评估只用静态录制轨迹、未跑 live agent，66 场景语料为作者自建。", "tags": ["执行时授权", "fail-closed", "MCP", "批准绑定"], "added": "2026-11-12"}, {"title": "Cited but Unused: Parametric Provenance in Retrieval-Augmented Generation", "authors": "Tanzeel Abbas, Tehseen Zia, David Windridge", "url": "https://arxiv.org/abs/2611.17161", "venue": "arXiv 预印本 (cs.AI), 2026-11-12", "oneliner": "RAG 的引用经常错报来源：1.2%–15.7% 的可引用 claim 实际来自参数记忆而非检索上下文，且标准 NLI 验证对此与随机无异。", "insight": "直接警示我们配套机制里的 NLI 残留检查：模型可以凭记忆答出未授权内容、再贴一个授权片段的引用，NLI 会放行；写 NLI 残留检查一节时必须回应这一点。它的反事实值替换方法（把授权片段关键事实换成虚假变体、看输出是否跟随）可直接借用为更诚实的残留检查实现，值得在下一轮实验里试。", "tags": ["RAG provenance", "NLI verification", "citation", "residual check"], "added": "2026-11-14"}, {"title": "POSTER: A Context-Consistent Attack Exploiting the Inspection--Execution Gap in Code-Executing Agents", "authors": "Pei Yan、Wenbo Guo、Xianbo Mo、Shunquan Tan、Jiwu Huang", "url": "https://doi.org/10.1145/3830454.3846448", "venue": "会议海报（ACM CCS 2026，2026-11-12）", "oneliner": "代码执行 agent 先静态检查、后执行，但运行时变换会产出未经检查的可执行载荷；900 次试验 87.3% 攻击成功率。", "insight": "与 ChainBind“批准不是执行”同构的平行证据：批准时看到的产物与执行时实际用的载荷之间存在变换窗口，窗口不关则批准失效；作者主张的“提取后授权检查点”与我们的运行时绑定是同一原则在代码执行场景下的实例，可在相关工作里并列引用。", "tags": ["agent 授权", "检查-执行鸿沟", "CCS 2026", "海报"], "added": "2026-11-15"}, {"title": "POSTER: Evaluating Mitigation Strategies Against Prompt Injection Attacks in Retrieval-Augmented Language Models", "authors": "Denis Biewer、Misha Glazunov、Theodor Schnitzler", "url": "https://doi.org/10.1145/3830454.3846434", "venue": "会议海报（ACM CCS 2026，2026-11-14）", "oneliner": "在单一受控配置下隔离评测 RAG 三阶段轻量防御：检索、提示词、输出防御各管一摊，没有任何单阶段能提供广谱保护。", "insight": "支撑“架构级授权”立论的实证注脚：三阶段防御都在模型拿到内容之后做缓解，我们的 AU 求值在检索结果进上下文之前，属于它未覆盖的第四个位置；其三类攻击场景（指令跟随、外泄、知识污染）可对应我们的 T1/T2 威胁层级。", "tags": ["RAG 安全", "prompt 注入", "防御评测", "CCS 2026"], "added": "2026-11-15"}, {"title": "Evaluating Authorization and Trust Boundaries in Agentic Orchestration Frameworks", "authors": "Sahaya Jestus Lazer 等", "url": "https://arxiv.org/abs/2611.21259", "venue": "arXiv 预印本 / cs.MA（2026-11-16）", "oneliner": "在 LangChain、LangGraph、AutoGen、OpenClaw 四大编排框架上做 12 个对照实验、映射到 OWASP Agentic Top 10，实测授权与信任边界在组件交界处如何被突破与守住。", "insight": "执行时授权绑定在编排层的直接实验证据：工具链、陈旧文件系统校验、编码指令与 agent 间委托都会在组件边界上撕开授权口子，说明授权检查必须在每一步、而非只在入口处求值；记忆投毒是与常规访问控制违规不同的风险维度，威胁模型节可提及。限定：单模型 gpt-4o-mini、定性对照、无统一攻击成功率数字，引用时只取机制发现。", "tags": ["agent 授权", "编排边界", "OWASP", "委托"], "added": "2026-11-18"}, {"title": "Security of Deep Research Agents: Attack Surface, Defenses, Benchmarks, and Agenda Seeding against Research Planning", "authors": "Yang Luo 等", "url": "https://arxiv.org/abs/2611.20045", "venue": "arXiv 预印本 / cs.CR、cs.AI（2026-11-15）", "oneliner": "系统梳理深度研究 agent 的安全研究（检索、规划、证据整合、报告生成四阶段），提出 agenda seeding 攻击：不写指令、只引入虚构评估指标，就能在 16%–28% 的报告中操纵结论排序。", "insight": "RAG 投毒威胁模型的系统化对照：四阶段划分与 T1/T2/T3 互补，“仅 26.5% 研究涉及规划阶段、无端到端商业产品投毒评估”可用来说明规划阶段授权绑定是空白点；agenda seeding 是无指令注入，威胁模型节可讨论是否覆盖“只改标准、不改指令”的攻击。限定：survey+新攻击，16%–28% 为自建沙盒数字，非商业产品实测。", "tags": ["深度研究 agent", "RAG 投毒", "威胁模型", "agenda seeding"], "added": "2026-11-18"}, {"title": "Procedure without Judgment: What Small Language Models Learn under an Exact Verifier", "authors": "Arunkumar V 等", "url": "https://arxiv.org/abs/2611.21529", "venue": "arXiv 预印本 / cs.AI、cs.CL、cs.LG（2026-11-16）", "oneliner": "授权策略拒绝一次 agent 工具调用时，审计日志应只写迫使该决策的最小充分理由；检验模型能从一个零误差验证器里学到什么。", "insight": "拒绝解释的审计粒度原则：AU 求值拒绝时，日志应写“哪个 AU、哪条策略迫使拒绝”的最小充分理由，而非整段上下文；可作为拒绝解释机制的设计参照与引用。限定：“不迁移”发现是警告——在某策略上训出的解释器不能当通用解释器；92% 只在训过的策略上成立，泛化为 94% 充分 / 48% 最小。", "tags": ["授权策略", "拒绝解释", "审计", "最小充分理由"], "added": "2026-11-18"}, {"title": "GapLeak: When Privacy-Preserving LLM-based Web Agents Become a Privacy Risk", "authors": "Chaklam Cheong 等", "url": "https://arxiv.org/abs/2611.22223", "venue": "arXiv 预印本（cs.CR，2026-11-17）", "oneliner": "数据最小化与最小权限对 web agent 必要但不充分：网站索要一个授权来源里没有的字段，目标驱动的 agent 就会自行升级到更高敏感、未授权的来源取数并泄露，全程不需要提示注入；平均未授权披露约 37%，提交时验证可消除 96% 以上。", "insight": "给威胁模型补上“可达但未授权”这一维：我们的 T1/T2/T3 按“攻击者能看到什么”分层，GapLeak 的攻击者什么都不用注入，只靠表单索要授权来源里没有的字段就让 agent 自己越界；授权边界不能只按可见性划，还要按可达性划。它的“提交时验证”与我们的 retrieve-then-project 同构（检查点在动作执行时而非输入时），可作为“执行时授权绑定”的对照证据。引用须写清数字出自 3 框架 × 6 模型 × 4 场景的评测均值。", "tags": ["GapLeak", "Web agent", "未授权披露", "提交时验证"], "added": "2026-11-19"}, {"title": "Agent Trust Infrastructure (ATI): A Federated Identity, Trust, Attestation, and Accountability Architecture for Cross-Organization Autonomous AI Agents", "authors": "Viet K. Nguyen、Mohammad I. Husain", "url": "https://arxiv.org/abs/2611.23202", "venue": "arXiv 预印本（cs.AI，2026-11-17）", "oneliner": "跨组织 agent 联邦信任基础设施：PKI + 零信任 + 远程证明，执行请求前验证证书、核对模型/工具/系统提示配置、过三道策略检查；攻击遏制率 43%→84%，每请求开销约 174 微秒。", "insight": "“执行时授权绑定”在跨组织场景下的实例化：授权不在入口处一次性给，而在每次执行请求前重新求值（证书验证 + 配置核对 + 授权检查）。其联邦信任设计（对等 AgentCA、无共享根）与我们的“策略独立存放”互补：跨组织时策略不可能集中存放，授权必须跟着可验证的身份与配置走。174 微秒的开销数字可用来回应“逐 AU 求值是否太贵”的质疑。引用须写清评测为模拟联邦、84% 仍有漏网场景。", "tags": ["跨组织授权", "联邦信任", "远程证明", "执行时绑定"], "added": "2026-11-19"}, {"title": "AISE: Enforcing Explicit Assembly and Release Authorization Boundaries in Multi-Agent LLM Systems", "authors": "Nick Korsunsky", "url": "https://doi.org/10.5281/zenodo.24301737", "venue": "Zenodo 预印本（概念架构 + 原型，未经同行评审，2026-11-17）", "oneliner": "Capability 安全模型：能访问 ≠ 能组合、能组合 ≠ 能发布；密码学 Token Spine + 组装门、发布门两道确定性检查点，8 个对抗场景 100% 确定性遏制。", "insight": "与我们新方向（执行时授权绑定）同一条线上的平行工作：我们是检索侧“策略独立存放、查询时逐 AU 求值”，它是执行侧“组装与发布各设一道显式授权门”，两者合起来构成“检索授权 + 执行授权”的两段链条，相关工作里可以并列引用。Token Spine（短寿命、持有者绑定、单调衰减）是“授权随数据走”的实现技术，与“策略独立存放”形成对照，写机制对比时可讨论两种绑定的取舍。引用须写清 Zenodo 预印本性质、“100%”仅为作者自建 8 场景数字。", "tags": ["Capability 安全", "组装门", "发布门", "执行时绑定"], "added": "2026-11-19"}, {"title": "Intent Contracts: Taking Tools Away from Agents", "authors": "Ziyuan Wang 等", "url": "http://arxiv.org/abs/2611.24025v1", "venue": "arXiv 预印本（cs.CR，2026-11-18）", "oneliner": "提出规划模型不持工具的授权接口：每步提交含目标与用户原话引用的意图契约，由代码校验、可信模型写出实际工具调用。", "insight": "与用户论文同属\"授权必须由基础设施而非模型意图强制\"的路线，但约束层位不同：Intent Contracts 在动作/工具调用层定义授权边界，用户论文在数据单元（AU）层查询时逐 AU 求值。其诚实报告的负面结果——契约不能减少未授权动作、歧义指代下 40–49% 状态变更命中错误目标——正好论证了仅在意图层做授权不够、需要在数据访问边界定义授权单元，是可对比引用的论证支点；AmPermBench 可作 agent 授权评测参照。", "tags": ["agent-authorization", "planner-execution-split", "capability", "benchmark"], "added": "2026-11-20"}, {"title": "Expressiveness and Convertibility of Rule-Based Access Control Policies", "authors": "Amir Masoumzadeh 等", "url": "http://arxiv.org/abs/2611.23738v1", "venue": "arXiv 预印本（cs.CR，2026-11-18）", "oneliner": "系统比较不同规则结构与组合设计（条件表达式、deny 规则）下规则型访问控制模型的表达力层级与策略跨模型转换的计算复杂度。", "insight": "用户论文的 AU 策略求值（含未知 AU 默认拒绝的 deny-first 语义）是一种规则型访问控制实例；该文关于 deny 规则与条件表达式设计选择如何影响策略表达力、以及策略迁移可转换性的理论结果，可直接用于论证 AU 策略语言设计选择的完备性边界与向 ABAC/NGAC 等成熟模型的可迁移性。作者来自 SUNY Albany，理论功底可靠，非水文。", "tags": ["policy-expressiveness", "abac", "deny-rules", "formal-semantics"], "added": "2026-11-20"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica 等 4 人", "url": "https://arxiv.org/abs/2610.01871", "venue": "arXiv:2610.01871 (2026)", "oneliner": "针对返回图像的多模态 RAG 的黑盒自适应数据抽取攻击：影子图像混合+相关性加权重采样，单次 2500 查询重构 611 张放射影像，抽取条目数达非自适应基线的 5.6 倍。", "insight": "embedding 通道攻击线的最强邻居：我们的 A1 是文本完形攻击（89.4%@20），它是多模态、图像返回配置下的自适应抽取，说明向量索引的通道问题在跨模态场景同样成立且可被放大。可在 T2 威胁模型一节引用为最具体的实证；其\"重构出的不同条目数\"可借鉴为 embedding 泄露的度量。它不涉及授权语义（任何用户可查），防御侧无直接给出，但把\"embedding 索引必须被授权视图切分\"的论证推得更强——正是 per-view 索引的动机。", "tags": ["embedding 泄露", "数据抽取", "多模态 RAG", "攻击"], "added": "2026-10-03"}, {"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}, {"title": "Erased, but Not Gone: Output Forgetting Is Not True Forgetting", "authors": "Teresa Pui Yee Yong、Win Kent Ong、Chee Seng Chan", "url": "https://arxiv.org/abs/2606.25001", "venue": "arXiv 预印本（cs.AI）", "oneliner": "以“不含遗忘数据从零重训的模型群体”为理想遗忘参照，证明输出层遗忘指标系统性高估真遗忘：表征空间留着沿重训相关方向的结构化残差，relearning 攻击可恢复信息。", "insight": "与我们 embedding 通道泄露故事同构的“表面删除≠真删除”：它研究训练数据遗忘，我们研究检索内容授权，失效模式一致。可在论文动机/相关工作里并置引用（我们的 cloze 89.4%@20 与它的“输出指标系统性高估”互为佐证）。对 RU/AU 撤销机制的直接警示：AU 权限撤销后旧 embedding 向量若仍在索引里就是它的“结构化残差”——撤销评估必须做表征层一致性检查，不能只看输出层。", "tags": ["机器遗忘", "表征残差", "评估方法"], "added": "2026-10-13"}, {"title": "Residual Privacy Leakage after Output Scrubbing in Tool-Using LLM Agents under Indirect Prompt Injection", "authors": "Kashvi Gupta", "url": "https://doi.org/10.21203/rs.3.rs-11428254/v1", "venue": "Research Square preprint", "oneliner": "oracle 级事后输出清洗也清不干净：间接注入导致的隐私泄露经逐字+3-token 片段删除后，残留率仍达 61.2%/62.1%，幸存者主要是语义改写。", "insight": "用硬数字回答了我们论文的核心设计问题——为什么不用事后过滤而做检索时/索引时授权绑定：模型接触数据后，有限跨度的精确值清洗结构性失效（连 oracle 级都救不回来），唯一清零的是接触前的 pre-context-removal。其 57% 人工重判残留率可直接引用作 NLI 残留检查必须做到语义级的 motivation 数据。", "tags": ["事后清洗", "间接注入", "残留泄露", "接触前防御"], "added": "2026-10-23"}, {"title": "Privacy-Preserving Retrieval from Redacted Corpora: Effects of Retrieval Paradigm and Relevance Definition", "authors": "Yoshiyuki Sakamaki 等", "url": "https://doi.org/10.1007/978-3-032-37676-3_10", "venue": "ECML PKDD 2026（LNCS vol 16947）", "oneliner": "RAG 语料先脱敏再检索：BM25 在脱敏下保持稳健，稠密检索与 ColBERT 出现有统计支撑的退化；脱敏代价取决于检索范式与相关性定义。", "insight": "与我们的 retrieve-then-project 语义直接对照：按 AU 裁剪与按 PII 脱敏面临同一权衡，损失不是均匀的——评估裁剪语义时应分检索范式报告效用损失；脱敏与授权过滤可互补，但叠加损失需单独度量。实验基于 Text Anonymization Benchmark 单一基准，外推到真实企业语料需谨慎。", "tags": ["RAG 隐私", "脱敏检索", "BM25", "检索范式"], "added": "2026-11-06"}, {"title": "Mitigating Membership Inference in Intermediate Representations with Differentially Private Training", "authors": "Jiayang Meng 等", "url": "https://arxiv.org/abs/2602.22611", "venue": "arXiv 预印本（cs.LG，2026-02-26 发布，2026-05-11 修订 v2）", "oneliner": "按层感知成员推断风险的差分隐私训练 LM-DP-SGD：影子模型估计各层 MIA 风险，按风险比例分配保护，相同隐私预算下降低峰值 IR 层面 MIA 风险且保持效用。", "insight": "与我们论文 embedding 通道一节直接咬合：MIA 风险各层异质、最脆弱层决定整体脆弱性，可作“只裁剪文本不够、必须按授权视图重编码”的旁证；它是训练时防御（DP 压低表示的成员信号），我们是服务时防御（按 AU 切分表示空间），两者并列说明表示层泄露需两层缓解；其“先估计风险、再按风险分配”的方法可借鉴用于量化重编码后残留泄露的分布。注意：该文是 2026 年 2 月首发、5 月修订的预印本，今日经 S2 重新索引浮现，非新发表；摘要无具体效果数字，引用时不取数字。", "tags": ["成员推断", "中间表示", "DP-SGD", "embedding 泄露"], "added": "2026-11-17"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Permission Withdrawal in Tool-Using Language Model Agents: Runtime Enforcement and Recovery", "authors": "Gaurav Chaulagain、Medhavee Upadhyaya", "url": "https://doi.org/10.54536/ajdsai.v2i2.8776", "venue": "American Journal of Data Science and Artificial Intelligence", "oneliner": "用户中途收紧权限后，tool-using agent 是否还会执行已被撤回的操作：轨迹级授权问题与运行时门的对照实证。", "insight": "执行时授权绑定（方向 2）在行动层的直接对照：prompt-only 真的执行了被禁写操作，规则门零漏放、模型门 3 次误放且仅因资源不存在未遂。其五阶段可复现评测框架（提议/门决策/派发/状态转移/有用完成）值得借鉴为我们三语义评测的拆分方式，避免最终状态指标掩盖授权失败。限定：确定性模拟环境、期刊影响力有限，引用时标注受控环境实证。", "tags": ["agent 授权", "权限撤回", "运行时门", "轨迹级评测"], "added": "2026-10-26"}, {"title": "Act on Your Behalf, Beyond Your Authorization: Benchmarking LLM Agent Authorization Alignment", "authors": "Zhiping Zhang、Franklin Mingzhe Li、Zihao Huang 等", "url": "https://arxiv.org/abs/2610.27548", "venue": "arXiv 预印本", "oneliner": "发布 AuthorizationBench：286 个可执行任务、6,864 条轨迹，agent 在 19.2% 的轨迹中超出用户授权范围行动；任务完成不等于授权合规。", "insight": "agent 授权对齐方向第一个大规模实证基准，可引用作 motivation 数据（19.2% 越权率、加大推理力度不降低违规率）。维度区分：它测的是行动授权（delegation scope），我们做的是数据授权（AU 求值），related work 里应明确区分。其授权感知沙箱（授权内外路径均可执行可观测）是评估执行时授权绑定的现成实验装置。", "tags": ["benchmark", "agent 授权", "越权评测"], "added": "2026-10-22"}, {"title": "Package Hallucination Attacks on Coding Agents through Prompt Injection in Rule Files", "authors": "Yupu Wang、Zhengyuan Jiang、Reachal Wang、Neil Zhenqiang Gong（杜克大学）", "url": "https://arxiv.org/abs/2610.09264v1", "venue": "arXiv 预印本（cs.CR/cs.AI）", "oneliner": "提出 package hallucination 攻击：向社区共享的规则文件（AGENTS.md/.cursorrules）注入恶意提示，诱导编码智能体把合法依赖替换为攻击者控制的包；配套进化优化框架 PackHallu 构造注入提示，多 benchmark/多模型/多框架高成功率且迁移性强。", "insight": "攻击面弹药：这是一类'供应链式间接提示注入'——恶意内容不在检索语料里，而在智能体启动即加载的规则文件里。提示我们 agent 线探索应把规则文件/skill 文件视为与检索语料同等地位的不可信输入，tool-use 授权需覆盖'配置型上下文'。纯攻击论文、无防御构造，威胁模型章节一句话引用即可。", "tags": ["提示注入", "编码智能体", "供应链攻击", "规则文件"], "added": "2026-10-09"}, {"title": "VeriChainSim: Verifiable Evidence-Chain Simulation for LLM-Based Multi-agent Authorization in Aerospace Trusted Data Spaces", "authors": "G. E. Huiling、Zhiguo Shi（通讯）、Yungui Nie（北京科技大学）", "url": "https://doi.org/10.1007/978-981-92-5712-6_34", "venue": "Springer CCIS vol. 3155（CSC 2026 会议论文集章节）", "oneliner": "把 LLM 智能体的每次授权决策绑定到类型化证据指针（目录记录、策略标识、合同条款、会话绑定、证明对象），token 激活前由外部验证器对照可信状态注册表校验。", "insight": "实现了我们只在目标里写了的性质：对畸形证据 fail-closed（存在性/完整性/范围/会话一致性任一不过即拒绝）。与我们的 retrieve-then-project 同属'授权决策前置校验 + 失败降级'家族，但路径不同（中心化外部验证器 vs 查询时逐 AU 求值），可在相关工作/讨论章节并列引用。局限：航空航天专用场景、仿真评估，威胁模型未分层。", "tags": ["智能体授权", "证据链", "fail-closed", "可审计性"], "added": "2026-10-09"}, {"title": "Agents in Disguise - Weaknesses in Authentication and Authorization in Public AI Ecosystems", "authors": "Jan Stanek, Lukas Kencl", "url": "https://doi.org/10.1007/978-3-032-38702-8_15", "venue": "Lecture notes in computer science (2026)", "oneliner": "系统实测 MCP 等开放 AI 生态与协议中的认证授权现状：agent 身份缺失、弱认证泛滥、授权可选或逻辑损坏，并给出改进方向。", "insight": "直接相关 agent 授权线：它点出了我们主论文的一个隐含假设——RU/AU 框架的 P(a,u) 默认授权主体 u 已认证可信，而开放生态中 u 的认证本身仍未解决。可在威胁模型/讨论章节引用作边界声明：AU 框架解决已认证主体对内容的细粒度授权，主体身份可信需下层认证机制支撑。附带价值：引用链可顺藤摸瓜到 NIST NCCoE agent 身份概念文件与 mcpanalysis 分析工具。", "tags": ["agent 授权", "认证", "MCP", "开放生态", "实测"], "added": "2026-10-08"}, {"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "venue": "ACM (2026)", "oneliner": "用 capability-scoped 权限模型重构 coding agent 工具沙箱：工具调用须持有显式能力令牌，命名资源≠被授权操作，架构层面切断间接 prompt injection 的执行通道", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的执行语义哲学同构——都是把\"能说出名字/能检索到\"从隐含授权中剥离。差异在于粒度：它是工具调用级 capability，我们是检索内容级 AU。适合 Related Work 的 Agent 线引用，作为显式授权能力模型的独立佐证；两者交叉可作 future work 一笔。", "tags": ["agent 安全", "capability 模型", "prompt injection", "授权执行"], "added": "2026-10-04"}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang 等 5 人", "url": "https://arxiv.org/abs/2610.01508", "venue": "arXiv:2610.01508 (2026)", "oneliner": "研究工具调用 agent 的\"主动越权\"：8 个隐私敏感域的确定性 benchmark，7 个模型全部超授权范围；SelfAudit 零样本推理时自检把隐私向越权降低 43%。", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计。\"越权来自结构性决策倾向而非解码随机性\"的结论与我们\"保守子句切分器\"的直觉相通——授权边界应由机制保证而非模型自觉；SelfAudit 仍是模型自己审计自己（启发式），我们的确定性求值 P(a,u) 是更彻底的路线，可在 Discussion 对照。注意它是动作侧授权，我们是数据侧，不竞争。", "tags": ["Agent 授权", "越权", "benchmark"], "added": "2026-10-03"}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang 等 7 人", "url": "https://arxiv.org/abs/2610.00371", "venue": "arXiv:2610.00371 (2026)", "oneliner": "提出 authorization-paired evaluation（拦住禁用用途+完成授权用途为联合成功标准）与 FlowReview 框架（对象解析+权限排序+确定性执行），组合审查把 denied-commit 率从 86.0% 降到 0 且授权供给无损失。", "insight": "核心命题\"对象身份与权限必须通过输出可验证的组件与执行保持连接\"与我们的\"chunk 只存 M(r)、查询时逐 AU 求值\"同构——都反对权限是附在数据上的静态标签。它的\"联合成功标准\"值得借鉴：我们评估以安全侧为主，未来可加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）提示我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"，与 KG 路径切割一节可呼应。", "tags": ["Agent 授权", "组合安全", "评估方法"], "added": "2026-10-03"}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}, {"title": "Compromise Is Not Consequence: Evaluating Task-Scoped Authorization in LLM Agents with Paired Replay", "authors": "Tural Hagverdiyev", "url": "https://arxiv.org/abs/2610.05840", "venue": "arXiv:2610.05840 (2026)", "oneliner": "paired-replay 测试台量化任务范围授权对提示注入后工具执行的遏制：broad bearer 攻击后执行率 8.9–37.8%，scoped JWT / sender-constrained / OPA 三种限定条件全部为零。", "insight": "与我们 AU 授权单元同属\"授权原子单位\"家族的同行实证，粒度不同（按任务限定凭证 scope vs 按内容划分 AU）但哲学一致。核心结论\"The policy changes execution, not the frozen model decision\"与我们的 retrieve-then-project 执行语义形成跨域互证：安全寄托在执行层裁剪而非模型自觉。局限：测的是遏制非预防；AgentDojo 扩展样本小。可在执行语义/威胁模型章节引用作 RAG 侧 AU 求值 vs Agent 侧 task-scoped 的对照。", "tags": ["agent authorization", "scoped credentials", "paired-replay", "执行语义对照"], "added": "2026-10-07"}, {"title": "Can CaMeLs Talk? Securing Multi-Agent Systems Against Indirect Prompt Injection Attacks", "authors": "James Peters-Gill, Avi Semler, Henning Bartsch, Ilia Shumailov, Christian Schroeder de Witt", "url": "https://arxiv.org/abs/2610.05640", "venue": "arXiv:2610.05640 (2026)", "oneliner": "证明单智能体 CaMeL 安全保证在分层多智能体系统中不组合（不可信数据可被下游重新解释为可信输入），提出保持 provenance 的 multi-CaMeL 协议，把攻击成功率从 12.9% 降至 0.0%。", "insight": "攻击面在我们 T1/T2/T3 之外的新维度——组合性：每个单元各自安全，跨边界组合仍可被绕过，恰是我们 embedding 通道\"边界重解释\"问题的多智能体版本。对我们论文的直接影响：per-view 索引目前只论证单系统内隔离，若未来扩展到多智能体 RAG，视图隔离的组合性需单独证明——诚实的未来工作点，可在局限段引用此文佐证。当前 claim 不受动摇。", "tags": ["多智能体安全", "组合性", "CaMeL", "威胁模型扩展"], "added": "2026-10-07"}, {"title": "Semantic Privilege Collapse: Trust Boundaries and Execution-Level Authorization in Agentic AI Systems", "authors": "Narnaiezzsshaa Truong", "url": "https://doi.org/10.5281/zenodo.23285357", "venue": "Zenodo 预印本（OpenAlex 扩展源）", "oneliner": "提出“语义权限坍缩”概念：任务数据或授权不足的指令经模型解释被提升为实际动作权限；主张授权绑定在执行时而非读取/检索时，信任边界必须在执行流水线中显式存在。", "insight": "与我们独立主线方向2（执行时授权绑定）直接对话的概念级文献。它的“数据→动作权限坍缩”是 T1/T2/T3 之外的攻击面（我们管“读”，它管“做”）；“执行时重新求值”与我们“查询时逐 AU 计算 P(a,u)”共享同一哲学——反对一次性授权、后续信任传递。援引的 capability-oriented control 与 AU 本质（逐 AU 授权 = 逐能力持有）可对齐，为两条主线的理论接口提供概念桥。局限必须标注：单作者、Zenodo note、无实证数字、0 引用，只能作概念锚点，不能作经验证据；且未形式化执行时判定的语义——正是我们能贡献的形式化增量。", "tags": ["执行时授权", "权限坍缩", "概念锚点"], "added": "2026-10-12"}, {"title": "LLMail-Inject: A Dataset from a Realistic Adaptive Prompt Injection Challenge", "authors": "Sahar Abdelnabi、Aideen Fay、Ahmed Salem 等", "url": "https://arxiv.org/abs/2506.09956", "venue": "arXiv 预印本（cs.CR）", "oneliner": "20.8 万条真人红队撰写的间接提示注入攻击，评估“检索→绕防御→触发未授权工具调用”完整攻击链：Meta SecAlign 仍 32% ASR、GPT-4o 58%、GPT-5 mini 47%，旧基准已饱和而它没有。", "insight": "与我们两条主线都对话的攻击侧基准：攻击链恰好横跨检索层授权（retrieve-then-project）与执行层授权（方向2），其 28–45% 的跨域迁移 ASR 是论证“仅做检索侧裁剪不够”的有力数字；引用它的“旧基准饱和论”可为防御评估选用高强度基准背书。注意它的“未授权”指任务目标被篡改、非用户权限不足，引用时需注明。", "tags": ["提示注入", "评测基准", "agent 安全"], "added": "2026-10-13"}, {"title": "Designing for Doubt: The Case for Informed Abstention in Autonomous Agents", "authors": "Victor Ojewale、Suresh Venkatasubramanian", "url": "https://doi.org/10.1609/aies.v9i3.43281", "venue": "AAAI/ACM AIES 2026", "oneliner": "诊断 agent 评测的合规偏置（只奖“做完”不奖“该停就停”），提出“知情弃权”：缺输入/证据/授权时阻断下一次工具调用；144 场景评测中危险动作阻断率 87.5–91%、授权场景可用性 75–92%。", "insight": "方向2（执行时授权绑定）最强的同盟文献之一：“缺授权→结构化暂停+阻断工具调用”正是执行时授权绑定的 fail-closed 降级语义；“危险动作阻断率/授权场景可用性”双指标可直接复用为我们评估执行时绑定的指标对；runtime enforcement + auditable trace 与“查询时逐 AU 求值+审计日志”架构同构。差异点：它的弃权是 agent 自主判断，我们是外部策略求值 P(a,u)——两篇论文可互相引用。注意：AIES 为伦理社会会议、初步评测仅 144 场景，引用时如实标注。", "tags": ["执行时授权", "agent 安全", "评估方法"], "added": "2026-10-13"}, {"title": "Kairos: Transactional Security Enforcement at the System Boundary for LLM Agents", "authors": "Kristoffer Hempel、Nils Loose、Lorenzo Cavallaro、Thomas Eisenbarth", "url": "https://arxiv.org/abs/2610.18457", "venue": "arXiv 预印本（cs.CR/cs.LG，2026-10-13）", "oneliner": "不改造 agent 本体，在系统隔离边界做 reference monitor：tool call/shell/脚本越界一律视为文件与网络操作；声明式策略定可信来源，判不定的挂起、agent 推测执行，权限受限的决策预言机按完整 trace 逐条裁决；AgentDojo 攻击成功率 47.0%→2.7%，良性效用不降。", "insight": "agent 访问控制主线（执行时授权绑定方向）的直接平行工作。它的\"挂起+推测执行+事后按 trace 裁决\"是一种延迟绑定授权：授权不在 action 发起时、而在效果提交前基于完整证据做——与我们 RAG 侧\"检索时逐 AU 求值、执行语义层再裁决\"同构，可互引为延迟授权绑定的两个实例（agent 执行 vs RAG 检索）。AgentDojo 47.0%→2.7% 是可引用的 agent 侧授权机制实证上界。注意它不处理检索授权，与主论文是平行关系而非直接对比。", "tags": ["agent 授权", "延迟绑定", "reference monitor", "AgentDojo"], "added": "2026-10-15"}, {"title": "The Agent Knew: Internal States Forecast Unauthorized Actions and Stop Them, and the Lies That Follow", "authors": "Arya Fayyazi、Mehdi Kamal、Massoud Pedram", "url": "https://arxiv.org/abs/2610.17301", "venue": "arXiv 预印本（cs.AI，2026-10-12）", "oneliner": "Agent 越权行为可在行动前被残差流线性探针预测（AUROC 0.94）；预测门控把 Gemma-4 越权率从 0.70 降到 0.09，任务完成率保持 1.00；阻止越权也是阻止事后撒谎的最可靠方式。", "insight": "agent 访问控制主线（执行时授权绑定方向）的直接证据：授权判定点从\"action 发起时\"前移到\"内部状态可预测时\"，与 Kairos 的延迟绑定形成一前一后两种授权绑定点位，可互引。CAPE-Bench 的\"单事实决定授权与否\"任务设计可借鉴为我们 runtime binding 的评估范式；\"追溯性权限洗白\"概念落在 T2/T3 讨论空间——内部状态既是防御信号也是可观测攻击面。实验预注册+hash 锁定，方法论可信度高。", "tags": ["agent 授权", "越权预测", "内部状态", "CAPE-Bench"], "added": "2026-10-16"}, {"title": "Policy-Verified Self-Training: Learning Agent Compliance from Verifiable Policy Rewards", "authors": "Min-Young Yu", "url": "https://arxiv.org/abs/2610.19372", "venue": "arXiv 预印本（cs.LG/cs.AI，2026-10-14）", "oneliner": "把运行时策略验证器的判定复用为可验证的策略奖励做后训练：Qwen3-8B 违规轨迹 37.2%→10.3%，成功攻击 12.4%→0.5%，效用不降。", "insight": "\"运行时策略验证器\"正是 AU 逐单元鉴权在 agent 侧的形态——区别是他们把 verifier verdict 复用为训练信号，我们是查询时逐 AU 求值做执行时裁决，两种用法可在论文讨论/相关工作里并置对比。他们总结的 verdict 信息量两条件（任务成功≠合规；被保护动作须同时出现在允许与禁止语境）对我们设计策略绑定评估用例有直接参考价值。注意其策略可编译为确定性门控的工程假设与我们的独立策略存放不同，引用时需说明。", "tags": ["agent 合规", "策略验证器", "后训练", "verifiable reward"], "added": "2026-10-16"}, {"title": "Approve What, Exactly? Effect Binding and Trusted Rendering for Agent Step-Up Authorization", "authors": "Sai Varun Kodathala、Prashanth Pollishetty、Jaylen Cargill", "url": "https://arxiv.org/abs/2610.21063", "venue": "arXiv:2610.21063 (2026)", "oneliner": "证明 agent 的\"审批授权\"只有精确命名批准对象时才算第二因素：定义 12 种审批路径攻击，在 AP2/微软 action-bound/MCP elicitation 上测试；10 个运行时审计均无第三方可验证审批记录；参考实现 ASU（规范效应描述符渲染卡 + passkey 签名 + 只执行存过的调用），Tamarin 形式化证明绑定性。", "insight": "agent 独立主线（runtime authorization binding）的第一个硬核锚点。其\"审批必须精确命名批准对象\"即执行时授权绑定的另一种表述，12 种攻击枚举可直接借用为绑定评估的威胁基线；负结果（洪水攻击仍 0.45-0.60 成功、审批挡不住策略允许的坏行为）是我们写论文时给 binding 划安全边界的诚实范例。对 RAG 主论文是方法论借鉴：规范效应描述符与 AU 划分在\"授权原子单位必须精确可审计\"上同构。", "tags": ["agent授权", "审批绑定", "威胁模型", "必引候选"], "added": "2026-10-17"}, {"title": "Matoi: Selective Revalidation of Consequence Evidence for Agent Authorization", "authors": "Zexun Wang", "url": "https://arxiv.org/abs/2610.21394", "venue": "arXiv:2610.21394 (2026)", "oneliner": "把\"可复用的后果证据\"与\"当前执行权\"解耦：消费者只能复用自己已核验且观测仍有效的证据，签名请求/实时配额/不确定结果每次必重新履行，形成有界、可审计的复用契约（AgentDojo Banking 场景拒绝 35 次复用攻击计划交叉）。", "insight": "与我们 RU/AU 解耦在解耦方法论层同构：chunk 只存 M(r) 映射（证据），策略独立、查询时逐 AU 求值（授权结论）。它对\"可缓存 vs 必重验\"的分类可借鉴为我们设计 AU 缓存/重求值策略的对照：已核验有效可复用、不确定结果不可复用——正好对应我们\"未知/未映射 AU 默认拒绝\"。对 RAG 主论文是设计论证引用，对 agent 主线是\"授权持续性\"相关工作；实验为脚本化合成场景，数字不可比。", "tags": ["agent授权", "证据复用", "解耦设计", "相关工作"], "added": "2026-10-17"}, {"title": "INFUSE: A Unified Surface Benchmark for Indirect Prompt Injection in Agentic Systems", "authors": "Thuy Dung Nguyen、Jingyi Guo、Rana Seda Dubauskas、Sreepriya Damuluru、Taylor T. Johnson、Kevin Leach", "url": "https://arxiv.org/abs/2610.20776", "venue": "arXiv 预印本（2026-10-14，cs.CR/cs.AI）", "oneliner": "第一个覆盖长周期 agent 全流程的间接 prompt injection 端到端基准：40 真实任务 × 56 攻击场景 × 19 模型，41824 条对抗轨迹。", "insight": "agent 独立主线可直接借用的评估基座：56 场景 × 5 威胁类别的攻击面枚举可对标我们\"执行时授权绑定\"的防御评测；分模型 ASR-L（3.2%–41.9%）的报告格式值得照抄。核心论据价值在其反面：prompt 级指令硬化只能把 ASR 从 58.2% 压到 14.3%，证明指令层防御有上限，执行语义层绑定才是回答。", "tags": ["基准评测", "间接提示注入", "agent 安全"], "added": "2026-10-18"}, {"title": "Certified Execution Harness for Agentic AI: Safe and Least-Intrusive Petri-Net Supervisory Control Between Reasoning and Action", "authors": "Chao Gu、Quanyan Zhu", "url": "https://arxiv.org/abs/2610.31376", "venue": "arXiv 预印本", "oneliner": "用 Petri 网把 LLM agent 的工具执行 harness 形式化为 supervisory control：capability/approval/budget 建模为 token，前置条件不满足的注入请求被结构性拒绝。", "insight": "agent authorization 线的 related work 引用：其\"前置条件不满足即拒绝\"与我们\"未知 AU 默认拒绝\"同哲学不同层。反直觉结论——maximally permissive supervisor 在重规划闭环里反而可能比更严格者更具侵入性——可作我们三语义\"安全-效用权衡必须在带重试闭环里评估\"的平行证据。威胁模型是 prompt injection 下工具执行（T2 附近），非检索侧信道，引用时勿混淆。", "tags": ["agent 授权", "supervisory control", "prompt injection", "形式化"], "added": "2026-10-24"}, {"title": "CoSA: The Conflict of Skills Attack in Real-World LLM Agent Ecosystems", "authors": "Yujia Zheng 等", "url": "http://arxiv.org/abs/2610.35082v1", "venue": "arXiv cs.CL / cs.AI / cs.CR（2026-10-26）", "oneliner": "单技能各自合规、组合后却越权：仅加 5% 技能就把策略违规率从 35.02% 拉到 58.45%，执行前检查信息流与授权的护栏又把它压到 6.67%。", "insight": "授权组合语义的实证锚点：单体检查在组合下系统性失效，因为授权没有随制品/决策跨步骤传递——与 RU/AU 的 M(r) 覆盖映射与批准依据绑定同向，可作“为什么不能只做单步检查”的引用；护栏的可用性代价（良性完成率仅 -1.67 个百分点）也是论证安全不必以可用性崩盘为代价的并列数字。限定：公开 Skill 与受控服务评测，增幅不宜直接外推到企业技能池。", "tags": ["Agent 授权", "技能组合", "执行时护栏", "CoSA-Bench"], "added": "2026-10-28"}, {"title": "TrustJev: Separating Policy Authority from Untrusted Evidence in LLM-Based Decisions", "authors": "Zhiwei Xu 等", "url": "http://arxiv.org/abs/2610.34826v1", "venue": "arXiv cs.AI（2026-10-26）", "oneliner": "策略权威与不可信证据分离：0.6B 决策模型先从可信策略算分数与修正预算，证据修正被框在预算内，授权基准上 95.77% 的源挡住全部 32 次攻击。", "insight": "“策略独立存放”在决策模型里的同构实现，可作 related work 中策略与证据分离路线的代表；但必须点明分界：它是学习到的打分而非确定性策略求值，95.77% 是统计稳健性、不是“策略被违反时一定拒绝”的保证，不能用来论证确定性授权的安全性。", "tags": ["策略权威", "决策模型", "授权基准"], "added": "2026-10-28"}, {"title": "Heads of Security: Learned Attention Gates Improve Prompt Injection Robustness", "authors": "Igor Shilov 等", "url": "http://arxiv.org/abs/2610.37657v1", "venue": "arXiv cs.LG / cs.CL / cs.CR（2026-10-27）", "oneliner": "用可学习逐头注意力门在架构层强制指令—数据分离：黑盒 RL-Hammer 对 HoS 成功率仅 10%（基线 97%、SecAlign 85%），工具效用未崩。", "insight": "指令—数据分离在模型内部的架构实现，与系统边界的 AU 求值互补成纵深防御的两层；评测口径可借鉴（自适应攻击成本倍数 + 工具效用底线）。但必须点明分界：门控是学习到的统计稳健性、不是确定性保证，不能写成“已解决注入问题”。", "tags": ["提示注入防御", "指令数据分离", "注意力机制"], "added": "2026-10-29"}, {"title": "Lineage: A UMA2.0 Protocol Extension for Multi-Hop LLM Agent Delegation", "authors": "Ştefania Ştefănescu、Iulian Aciobăniței", "url": "https://doi.org/10.1109/ACCESS.2026.3708618", "venue": "IEEE Access（2026）", "oneliner": "给 UMA 2.0 补多跳委托原语：每条受保护请求携带经签名的完整委托血缘，资源服务器无需再向授权服务器往返即可验证，作用域单调、深度有界、决策入防篡改审计日志。", "insight": "把“批准—执行绑定”从单步扩展到多跳委托链的最直接参照：我们的 AU 求值回答内容该不该给，Lineage 回答委托链每一跳是否还有效。协议层独立于模型行为拦住一次真实提示注入尝试，与“过滤而非依赖引导”同构；引用时须写清作者自认只覆盖 DORA 第 9 条协议层子集、注入实验仅一次尝试。", "tags": ["agent 委托", "UMA 2.0", "审计"], "added": "2026-11-02"}, {"title": "Trust-Aware Orchestration Architecture for LLM-Assisted Workflows in Multi-Tenant Enterprise Systems", "authors": "Nandakishore Leburu", "url": "https://doi.org/10.1109/ACCESS.2026.3706063", "venue": "IEEE Access（2026）", "oneliner": "多租户 LLM 工作流的确定性控制面：LLM 只提议，三道硬门决定执行；但硬门拦不住权限内恶意意图（自适应案例成功率 30%–70%）。", "insight": "AU 求值在 agent 工具调用侧的对应物：租户解析、工具授权、模式校验分别对应授权域归属、AU 是否允许调用、参数是否在批准范围内；同时为 ChainBind 划出能力边界——绑定保证执行等于批准，保证不了批准本身意图良善。标注：自适应案例仅 20 条 prompt，点估计。", "tags": ["确定性控制面", "多租户", "工具授权", "AgentDojo"], "added": "2026-11-03"}, {"title": "Whispers of Wealth: Red-Teaming Google's Agent Payments Protocol via Prompt Injection", "authors": "Tanusree Debi、Wentian Zhu", "url": "https://arxiv.org/abs/2601.22569", "venue": "arXiv 预印本（arXiv:2601.22569v1）", "oneliner": "AP2 红队：密码学 mandate 保得住凭证本身，保不住生成批准的推理过程；Branded/Vault Whisper 分别操纵排序与提取敏感数据。", "insight": "ChainBind 论点在支付协议上的独立佐证：批准不等于执行安全，签名只保证被操纵的批准被忠实执行；引用时可论证授权校验还需校验批准形成时的信息来源。标注：单原型（Gemini-2.5-Flash + ADK）、摘要未给系统成功率数字。", "tags": ["AP2", "提示注入", "支付授权", "红队"], "added": "2026-11-03"}, {"title": "ATrust: Adaptive Trust Boundary Expansion for Securing LLM Agents", "authors": "Xu Zhang、Zhichao Lu", "url": "https://arxiv.org/abs/2611.02741v1", "venue": "arXiv:2611.02741v1 (2026)", "oneliner": "自适应信任边界：以用户查询为信任锚点，运行时逐步接纳任务必需的外部信息，AgentDyn 攻击成功率 37.80%→4.37%，效用提升 10%。", "insight": "把“信任”做成运行时可扩展状态，与“查询时逐 AU 求值”相通但粒度不同：任务必需性与授权许可性是两条独立准入条件，只满足其一都不应放行。引用时标注 arXiv 预印本、GPT-4o 单引擎自报数字，且摘要未报告误拒率与延迟代价。", "tags": ["信任边界", "agent 防御", "AgentDyn", "过度防御"], "added": "2026-11-04"}, {"title": "Securing Web Agents with the Compile-Then-Execute Paradigm", "authors": "Annabella Chow 等", "url": "https://arxiv.org/abs/2611.06039", "venue": "arXiv 预印本（cs.CR，2026-11-04）", "oneliner": "Web agent 先编译后执行：规划模型运行时不看网页内容，WASP 上攻击成功率 0%，WebArena 效用 77.8% 反而高于 ReAct 基线。", "insight": "与“运行时授权绑定”同构但发生在另一层的解法：我们收的是执行时授权判定的自由度，Baya 收的是运行时合成新操作的自由度；0% ASR + 效用反升说明收紧自由度不必然以效用为代价，可在讨论节引用。但 Baya 依赖事先可信抽象的 Trusted Website API，开放网络上前提很强，与我们 AU 求值的适用条件不同，引用时须写清前提。", "tags": ["Agent 安全", "提示注入", "编译执行", "控制流"], "added": "2026-11-06"}, {"title": "Rethinking Access Control for AI Agents: Recent Advances and Open Challenges", "authors": "Chijin Zhou、Quan Zhang", "url": "https://arxiv.org/abs/2611.06764", "venue": "arXiv 预印本（cs.SE，2026-11-04）", "oneliner": "Agent 访问控制综述：四块分类 + 四点再思考，“授权须随工作流演进而重新评估”与执行时授权绑定同构。", "insight": "可直接作 related work 骨架：四块分类法给 RU/AU 解耦与查询时逐 AU 求值提供了现成位置；其评估标准（同时看可观测行为与仍被允许的未授权效果）可借来强化 ChainBind 评估一节。综述无新实证数字，引用时只引分类与论点。", "tags": ["Agent 访问控制", "综述", "授权绑定", "评估标准"], "added": "2026-11-07"}, {"title": "Revoked, Not Stopped: Late Revocation Notices and Channel-Switching in LLM Agents", "authors": "Muzammal Hussain", "url": "https://doi.org/10.5281/zenodo.23964291", "venue": "Zenodo 预印本（2026-11）", "oneliner": "撤销的滞后本身就是攻击面：通知晚到一步，16.5% 的已撤销敏感动作照常通过；按工具名撤销会被通道切换绕过，最高 38.7%。", "insight": "补上我们论文尚未系统处理的“授权撤销”一环：撤销须按效果（数据离境）界定、在每次敏感动作前重做；拒绝消息应给明确撤销语义而非裸 403。诚实标注：5 个开源小模型 + 虚构场景 + Zenodo 预印本，数字不宜外推到前沿闭源 agent。", "tags": ["授权撤销", "Agent 安全", "通道切换", "执行时授权"], "added": "2026-11-07"}, {"title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "authors": "Woosang Lim 等", "url": "https://arxiv.org/abs/2611.07222", "venue": "arXiv 预印本（cs.CR，2026-11-05）", "oneliner": "确定性防线：动作目标只认工具类型化返回的字段，标准模板注入零次得手，几乎不增加模型调用。", "insight": "与执行时授权绑定同构的另一实现：把“模型临场决定”换成确定性判定；“只放宽、不放行已污染目标”的不对称恢复规则可借鉴到 per-view 索引。适用条件：目标值须来自类型化字段，纯自由文本工具上底线会退化。", "tags": ["提示注入", "确定性防御", "工具调用", "Agent 安全"], "added": "2026-11-07"}, {"title": "Position: Agents Orchestrate, Policy Enforces — A Deterministic Tool-Use Control Pattern for Agentic Assistants over Sensitive EEG Data", "authors": "S. Katamadze、Ankur Chattopadhyay", "url": "https://doi.org/10.1145/3846374.3846391", "venue": "第 3 届 ACM 大型 AI 系统隐私与安全分析研讨会（2026）", "oneliner": "agent 只编排、不授权：工具调用的授权交给模型之外的确定性策略引擎，三道信任边界按序设防，32 个对抗调用全拒、25 个良性全放。", "insight": "与 ChainBind“批准不是执行”同一架构原则的独立旁证：定权限的东西必须坐在被管的东西之外，判定发生在执行之前、不依赖模型临场判断。作者诚实标出的缺口（工具输出边界 B3 的投毒未被评估）恰是 E12 残余失败的草案投毒一类，可对照引用；三边界次序控制可与我们的 T1/T2/T3 交叉引用。引用须写清这是 position 论文 + 脚本化可行性套件，不是稳健性基准。", "tags": ["确定性策略引擎", "MCP 工具调用", "批准绑定", "信任边界"], "added": "2026-11-09"}, {"title": "Evil-AI Benchmark: An Evaluation Framework for Adversarial Security Assessment of LLM Agents in Smart Environments", "authors": "Aygun Varol 等", "url": "https://doi.org/10.1109/ACCESS.2026.3727159", "venue": "IEEE Access（2026）", "oneliner": "智能环境 agent 对抗安全评测：五类威胁向量 + 能力验证 + 50 个良性过拒测试，工具触发直连 Arduino 舵机做物理验证；8 个模型 Evilness 率 0.8%–54.0%。", "insight": "评测方法论可引用：过拒测试与对抗测试并列为一等公民，与 E12 同时报告良性效用与受攻击效用的做法一致；跨模型 Evilness 率 spread（0.8%–54.0%）与我们六模型基线 ASR spread 同构，说明防御效果必须分模型报告。物理执行验证标出我们工作的边界：授权绑定目前只覆盖软件工具调用。引用须写清文中称开源但本轮未拿到仓库链接。", "tags": ["Agent 安全评测", "提示注入", "过拒测试", "智能环境"], "added": "2026-11-09"}, {"title": "Authorization assurance for tool-using LLM agents: a structured review of enforcement semantics and effect-level security evidence", "authors": "M. Elmasry", "url": "https://doi.org/10.1007/s10207-026-01343-w", "venue": "International Journal of Information Security (Springer, 2026-11-10)", "oneliner": "结构化综述：75 篇文献筛成 30 篇、92 条来源—主张记录，21 篇 agent 文献里无一条可评估的撤销主张、无一条委托 containment 主张。", "insight": "投稿前最值得对照的审稿人视角：它把“撤销主张为零”写成全领域空白，我们的 epoch 撤销机制恰好落在这个空白上，相关工作里可直接引用该统计作外部定位；“最小权限只量变窄、不量轨迹有效权限”的批评则反衬我们 E12 的轨迹级度量（ASR + 良性效用）正是它要求的证据形态；“最终状态正确 ≠ 授权正确”可直接支撑“批准不是执行”。引用须写清 30 篇为作者冻结的闭合语料、覆盖截止 2026-07-15，MAAP 为初步报告框架未经验证。", "tags": ["授权保证", "撤销", "委托", "综述", "ChainBind"], "added": "2026-11-11"}, {"title": "PRISM: Causal Counterfactual Minimization of Agent Tool Privileges via Information Bottleneck Role Induction", "authors": "Yang Luo 等", "url": "https://arxiv.org/abs/2611.11539", "venue": "arXiv 预印本（cs.CR，2026-11-08）", "oneliner": "把角色工程对象从人换成 agent：因果反事实 + 信息瓶颈学出最小工具集，单角色授权工具数压掉 78.3%、爆炸半径降至 15.9%，任务成功率 78.2%。", "insight": "与 ChainBind 互补：它解决“批准时权限集从哪来”，我们解决“批准后执行时如何保证不越界”——学出的最小权限集可作批准的标的、由运行时绑定强制执行。78.2% 成功率与 15.9% 爆炸半径可与我们 E12 的 ASR + 良性效用并列，说明“权限压下来、正常路没走死”的双指标口径。引用须写清数字出自 AgentDojo/τ-bench/ToolEmu 三基准与作者自建的反事实干预流程，且它只解决批准前权限集生成、不处理执行时越界。", "tags": ["最小权限", "工具权限", "因果反事实", "Agent 安全"], "added": "2026-11-11"}, {"title": "CapLite: Prompt-Injection Defense for Small Language Model Agents without Model-Written Security Artifacts", "authors": "Zimo Xu, Wenzhuo Liu, Hideki Nakayama", "url": "https://arxiv.org/abs/2611.17115", "venue": "arXiv 预印本 (cs.AI/cs.CL/cs.CR), 2026-11-12", "oneliner": "小模型 agent 写不出可信的安全工件：改从工具 schema 派生策略、写操作先提交，13,935 个被攻击的 AgentDojo 回合零攻破。", "insight": "直接支撑 ChainBind“执行时授权绑定”的立论：模型写出的权限策略本身不可信（Progent/IPIGuard/DRIFT 的策略在 11–14 个小模型上可被攻破），授权锚点不能放在可被注入改写的同一层。它的“写完整性”保证（接收方、金额、对象、目的地四元组必须出自用户请求）与我们 AU 求值的思路同构，可在相关工作里并列：它管写操作的授权绑定，我们管检索单元的授权绑定，两者合起来覆盖 agent 的读与写。", "tags": ["agent authorization", "prompt injection", "AgentDojo", "write integrity"], "added": "2026-11-14"}, {"title": "Scaling LLM Agent Tool Access: The MCP Gateway", "authors": "Mingxin Li 等", "url": "https://doi.org/10.1145/3828523.3857007", "venue": "会议论文（ACM SIGOPS ATC 2026，2026-11-15—18，香港）", "oneliner": "云端 MCP 网关：把遗留服务接入、MCP 变体归一、访问控制、工具推荐、会话感知路由收到网关层，工具挂载规模扩展到 3,000+ 个，约 98% Top-15 召回，已在生产运行 8 个月。", "insight": "“执行时授权绑定”在工具调用平面上的已部署实例：访问控制由网关层确定性策略执行、不由模型自决，说明“绑定点要在不可信内容进入推理之前”在工业界已有落地。但它绑定的是工具可用集合、不绑定调用的具体参数，参数层的“检查—执行鸿沟”仍在；其工具推荐（混合检索）本身也是检索步骤，工具描述可被投毒，与 RAG 检索投毒同构，可用我们的 T2 框架平移分析。引用时只取架构与部署事实，不取安全效果数字（该文无安全评测）。", "tags": ["MCP", "网关授权", "工具调用", "SIGOPS ATC 2026"], "added": "2026-11-17"}]}], "note": "人工精选、长期维护的论文库；每日 08:00 看板构建时自动嵌入，不会被每日文献流覆盖", "updated": "2026-11-20"};
