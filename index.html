const FIN = {"date": "2026-10-29", "md": "# ☀️财经大事早报 · 2026-10-29\n\n## 📌今日大势\n\n**1. 美联储按兵不动，悬念全部推给 12 月。** 美联储 10 月议息会议决定把基准利率维持在 **3.75%–4.00%** 区间，表决结果为 10 票赞成、2 票反对。决议本身符合市场预期——会前市场押注维持利率不变的概率约九成、加息概率仅约一成；真正的悬念在措辞与 12 月路径：9 月美国 CPI 同比上涨 3.7%、高于 8 月的 3.4%，核心 CPI 三个月年化增速从 2.0% 升至 3.4%，通胀压力未消，而高盛、摩根大通等机构的主流预期是 12 月再加息 25 个基点后结束本轮紧缩。后续盯三点：主席沃什在记者会上的措辞是否给 12 月留口子、能源价格是否继续推高通胀、以及 12 月会议前公布的 CPI 与就业数据。（来源：路透经 TradingView、FT、每日经济新闻）\n\n- [美联储决议后，全球股市维持涨势，油价跳涨](https://tw.tradingview.com/news/reuters.com,2026:newsml_L3T46E26J:0/)\n- [Fed holds fire on interest rates despite intensifying inflation](https://www.ft.com/content/f31fccd8-e9b6-4b01-989d-790ca6bb4d29?syn-25a6b1a6=1)\n\n**2. Alphabet 交出“史上最强、也最烧钱”的一季：营收 1276 亿美元、云翻倍、自由现金流转负。** Alphabet Q3 营收 **1275.77 亿美元、同比增长 25%**，为连续第 13 个季度两位数增长，经营利润 405.76 亿美元、同比增长 30%，经营利润率 31.8%；但净利润 261.7 亿美元、摊薄每股收益 2.12 美元，同比下滑，拖累项是一笔 86.64 亿美元的股权证券净亏损。分项看，Google Cloud 营收 **307.09 亿美元、同比增长 103%**，经营利润 111.2 亿美元；搜索及其他收入 634 亿美元、同比增长 12%，Pichai 称搜索查询同比增速为近五年最高。另一面是资本开支 **514 亿美元、同比增长 114%**，自由现金流为 **-90.7 亿美元**，为连续第二个季度转负。Pichai 在财报夜称公司已进入“半年 5000 亿美元收入 run rate”，模型 API 每分钟处理近 320 亿 token、环比增长 40%。这组数字把 AI 叙事推向了下一阶段的拷问：收入与云增长能否跑赢资本开支曲线——市场当晚的反应是盘后股价下跌，而非庆祝破纪录的营收。后续盯：管理层对 Q4 资本开支的指引、云毛利率是否被 TPU 外售摊薄、以及自由现金流何时回正。（来源：Alphabet 财报经 Securities.io、TickerRoast、Pichai 帖文）\n\n- [Alphabet Q3 Revenue Rises 25% as Google Cloud Revenue Jumps 103%](https://www.securities.io/alphabet-q3-revenue-rises-25-as-google-cloud-revenue-jumps-103/)\n- [Google Cloud Doubles to $30.7 Billion, but $51 Billion of Capex Pushes Alphabet's Free Cash Flow Negative](https://tickerroast.com/alphabet-q3-2026-google-cloud-doubles-capex-negative-free-cash-flow/)\n- [Alphabet Q3 财报 CEO 讲话全文](https://blog.google/company-news/inside-google/message-ceo/alphabet-earnings-q3-2026/)\n\n**3. 英国首份 Healey 预算：向银行与房东征税，给 2000 万家庭每户发 100 英镑。** 英国财政大臣 Healey 公布上任后首份预算，核心是一次“取之于银行、用之于账单”的再分配：银行利润附加税上调 3 个百分点至 **6%**，自明年 1 月起实施 15 个月；同时对博彩、房东与储户收入加税，并收紧线上市场增值税规则。支出端最显眼的是 **26 亿英镑能源账单支持**：约 2000 万户低估值住房（市政税 A–D 档）今冬每户获 100 英镑直接入账，另取消燃气账单固定收费（2300 万户平均每年省 45 英镑）、燃油税冻结延至 2027 年 7 月。FT 的评价是“安抚了市场、但推迟了硬抉择”：OBR 预测 2026 年 GDP 增长 1.2%（较 3 月预测上调）、2027 年却从 1.6% 下调至 1.0%，财政缓冲到 2029/30 年度降至 150 亿英镑（3 月预测为 240 亿英镑）。后续盯：英国央行下周的利率决定（市场定价加息至 4.00% 的概率约九成）、30 年期国债收益率（目前 5.89%，10 月 7 日曾触 6.04%）以及银行股是否把附加税转嫁给储户。（来源：FT、路透经 BusinessDay、Politico 经 Daily Guardian）\n\n- [Healey hits banks and savers to fund modest Budget handout](https://www.ft.com/content/5ec57ee9-4eb9-4889-82f0-df402185b147?syn-25a6b1a6=1)\n- [Chancellor's Budget placates markets but delays crunch decisions](https://www.ft.com/content/165e3954-19cc-469e-9eab-1557953bbb19?syn-25a6b1a6=1)\n- [Healey announces help for UK households, lowers GDP forecast](https://www.businessday.co.za/world/europe/2026-10-28-healey-announces-help-for-uk-households-lowers-gdp-forecast/)\n\n## 💰宏观与政策\n\n- **美联储维持利率不变，但通胀仍是悬顶之剑。** FT 标题即判断：尽管通胀加剧，美联储仍按兵不动；9 月 CPI 同比 3.7% 高于 8 月 3.4%，是 12 月是否加息的关键变量。（来源：FT）\n- [Fed holds fire on interest rates despite intensifying inflation](https://www.ft.com/content/f31fccd8-e9b6-4b01-989d-790ca6bb4d29?syn-25a6b1a6=1)\n- **英国预算的加税清单比标题更长。** 除银行附加税外，HMRC 还新列 **200 名亿万富翁重点征税名单**，并准备对自雇人士实施 **13 亿英镑**的税收收紧；主权财富基金在英国的房地产投资也将被征税。FT 同时指出，英国央行“能够从容消化这份预算”，尽管赤字削减进度出现滑坡。（来源：FT）\n- [HMRC creates list of 200 billionaires in tax crackdown on UK's wealthiest](https://www.ft.com/content/c8c12f19-6e23-4e43-926a-463ba0bcc9d0?syn-25a6b1a6=1)\n- [Bank of England able to take UK Budget in its stride despite slippage in deficit reduction](https://www.ft.com/content/4fe7b495-a682-4f69-a385-a02c892db0d7)\n- **英国预算未引发债市动荡，但代价是缓冲变薄。** FT 称这是一份“波澜不惊”的首份预算，未引发债市波动；但 OBR 的财政缓冲预测已从 3 月的 240 亿英镑降至 2029/30 年度的 150 亿英镑，硬抉择只是被推迟、而非消失。（来源：FT）\n- [Healey avoids bond market wobble with 'uneventful' first Budget](https://www.ft.com/content/d7788234-ffaf-49a5-9528-cff0a1685fe9?syn-25a6b1a6=1)\n- **预算案的另一面：企业并不领情。** FT 报道，Healey 在预算演讲中称赞了企业，但企业的感受并非如此；预算责任办公室下调 2027 年增长预测，说明“全球经济风暴”（海湾冲突、贸易紧张、乌克兰战争）仍是财政大臣口中的主因。（来源：FT）\n- [Healey praised business. The feeling was not mutual](https://www.ft.com/content/1c9a9c4d-5f84-40e7-bd2f-fe55e9e0d3a7?syn-25a6b1a6=1)\n\n## 📈市场与投资\n\n- **微软财季：营收 922.8 亿美元，资本开支几乎翻倍。** 微软 2027 财年一季报营收 **922.8 亿美元**（上年同期 776.7 亿美元），经营利润 459.2 亿美元；但资本开支从 193.9 亿美元增至 **393.7 亿美元**，自由现金流从 256.6 亿美元降至 186.3 亿美元——与 Alphabet 同款剧本：AI 投入先行、现金流后置。（来源：财报汇总 Quantara Insights）\n- [Alphabet Microsoft Earnings: Q3 2026 Results And AI](https://quantarainsights.com/alphabet-microsoft-earnings-q3-2026-cloud-ai/)\n- **欧洲天然气价格突破每兆瓦时 100 欧元。** FT 报道，欧洲天然气价格因市场担忧伊朗战争升级而跳涨至 **100 欧元以上**；同一逻辑下，伊朗威胁韩国航运集团的霍尔木兹海峡通行，能源与航运的战争溢价正在同步抬升。（来源：FT）\n- [European gas prices jump above €100 on fears of Iran war escalation](https://www.ft.com/content/afe6e244-8433-4371-a26f-7aacbc9b8dcd?syn-25a6b1a6=1)\n- [Iran threatens South Korean shipping group over Hormuz transits](https://www.ft.com/content/171ffdaa-e3e7-41b9-a4c6-09c9ace3f719?syn-25a6b1a6=1)\n- **存储板块成为 AI 交易的新外溢：SK 海力士称 DRAM 与 HBM 产能售罄至 2029 年。** SK 海力士 CEO 表示未来三年 DRAM 与 HBM 产能“近乎售罄”，在谈订单落地概率很高；存储、光通信股随之集体上涨，闪迪、美光盘前涨超 4%。这是 AI 资本开支向上传导到存储环节的明确信号，值得与 Alphabet、微软的资本开支数字对照着看。（来源：每日经济新闻盘前汇总）\n- [美股盘前：美联储决议凌晨公布；SK 海力士称产能售罄至 2029 年](https://www.mrjjxw.com/articles/2026-10-28/4624042.html)\n- **JetBlue 在“毫不留情”的债市面前示好。** FT 报道 JetBlue 正试图安抚一个不宽容的债券市场，说明高收益债发行人在利率高位环境下的融资压力并未缓解。（来源：FT）\n- [JetBlue tries to sweet-talk an unforgiving bond market](https://www.ft.com/content/0713e1f0-770d-438e-b330-b5279f2f98af?syn-25a6b1a6=1)\n\n## 🏠房价洞察\n\n- **9 月 70 城：一线二手连涨 7 个月，上海首个同比转正。** 国家统计局 10 月 19 日发布的数据显示，9 月一线城市二手住宅销售价格环比上涨 **0.2%**，涨幅比上月扩大 0.1 个百分点，自今年 3 月以来已连续 7 个月上涨；其中上海二手环比上涨 **0.5%**、领跑 70 城，同比上涨 0.8%，为首个二手房价同比转正的城市。一线新建商品住宅环比上涨 0.1%、连续两个月上涨，但北京下降 0.2%；二线新建住宅环比由降转平，三线下降 0.2%。9 月新建住宅环比上涨城市 17 个（比上月 +2 个），二手环比上涨城市 9 个（比上月 +6 个）。（来源：21 世纪经济报道）\n- [一线城市二手房价格连涨 7 个月，稳楼市政策效应有待进一步释放](https://www.21jingji.com/article/20261019/herald/35aebf60abe6a8faca4e14bf824ffaaf.html)\n- [一线城市二手房销售价格连续 7 个月上涨](https://www.21jingji.com/article/20261019/herald/fd0b55531976e7c08318dff064c5967b.html)\n- **存量时代的分野：新房靠优质新盘结构性上涨，二手仍在普跌。** 中指研究院数据显示，9 月百城新建住宅均价 **17285 元/平方米**、环比上涨 0.17%、同比上涨 2.12%；二手住宅均价 **12452 元/平方米**、环比下跌 0.6%（跌幅比 8 月扩大 0.15 个百分点）、同比下跌 6.94%，100 城中仅 3 城二手环比上涨、97 城下跌。统计局口径同步印证：前三季度全国新建商品房销售面积 5.65 亿平方米、同比下降 13.2%，二手房网签面积 6.17 亿平方米、同比增长 10.7%——二手成交量已超过新房，楼市正式迈入存量时代。（来源：中指研究院经万维读者网、21 世纪经济报道）\n- [中国百城二手房价跌幅扩大](https://news.creaders.net/china/2026/10/02/3053975.html)\n- **政策组合拳：从“降利率、降首付”转向财政直接贴息。** 8 月 28 日住建部等多部门推行商品住房现房销售制度；9 月 29 日财政部等多部门明确，自 10 月 1 日起对符合条件的居民首套购房贷款给予年化 **1 个百分点**、最长 5 年的财政贴息，实施期暂定 1 年、资金总规模不设上限；同期 LPR 报价连续 16 个月保持不变（1 年期 3.0%、5 年期以上 3.5%）；国务院常务会议则提出要研究出台稳定房地产市场等政策措施。国庆假期苏州、郑州、武汉等多地新房、二手房到访量与成交量同步回暖，刚需与置换改善是主力。（来源：金融界、中房网）\n- [贴息、现房、公积金加码 国庆假期多地楼市活跃度提升](https://24h.jrj.com.cn/2026/10/08062658629463.shtml)\n- [全国房地产政策变动监测报告（2026年9月）](http://www.fangchan.com/data/133/2026-10-23/7519233876141871501.html)\n\n**🔍深度分析：分化才是 9 月数据的关键词，政策的真实意图是“托住交易量、而不是托住价格”。** 一线与低线城市的走势已经分叉：一线二手连涨 7 个月、上海同比转正，说明核心城市的流动性与置换需求先修复；但二三线新房持平或下跌、百城二手 97 城下跌，说明全国层面的价格底并未到来。更值得注意的是新房与二手的结构背离：百城新房均价上涨靠的是上海、北京、成都等重点城市优质新盘入市拉动，属于结构性上涨；而二手普跌 + 网签量超过新房，说明真实的交易重心已转向存量房——“以价换量”仍是大多数城市的现实。政策意图也随之清晰：现房销售制度重构定价逻辑（期房的杠杆与烂尾风险被制度性压低），首套房贷财政贴息则是中央财政首次直接补贴商业性个人住房贷款利息，支持逻辑从“降利率、降首付”转向“财政直接给钱”，且不设资金总规模上限，信号意义大于单户补贴额（年化 1 个百分点）。**对购房者的实操含义**：一线核心区二手可结合贴息窗口与置换需求谈价，不必追高；低线城市仍以价换量为主，持有等待政策进一步加码比抢跑更稳妥；新房要盯现房销售制度下的交付确定性，而非只看备案价涨幅。**后续盯什么**：11 月中发布的 10 月 70 城数据（验证一线连涨能否延续）、首套贴息在各地的落地细则与银行执行口径、国常会“研究出台”的稳定房地产市场政策是否在四季度落地。\n\n## 🤖AI经济\n\n- **Alphabet 的资本开支曲线就是 AI 经济的晴雨表。** Q3 资本开支 **514 亿美元、同比增长 114%**，自由现金流转负 90.7 亿美元；与此同时云收入翻倍至 307 亿美元、模型 API 每分钟处理近 320 亿 token（环比 +40%）。收入在涨、现金流在烧——这是本轮 AI 基建周期最核心的张力，也是微软（资本开支 393.7 亿美元、自由现金流下滑）同步印证的同一剧本。（来源：Alphabet 财报经 Securities.io、TickerRoast）\n- [Alphabet Q3 Revenue Rises 25% as Google Cloud Revenue Jumps 103%](https://www.securities.io/alphabet-q3-revenue-rises-25-as-google-cloud-revenue-jumps-103/)\n- **Google 一周两模型：Carbon 接棒 Argon，世界模型 Genie 4 同步推进。** DeepMind 10-29 发布 **Gemini 4 Carbon**：主打网络安全与长程任务，在新版 Artificial Analysis 指数上排名第一（59 分），SEC-bench Pro 88.2%、ExploitGym 54.8%、CWE-bench 71.0%，初期先向网络防御者开放；10-27 的 **Genie 4** 则是实时交互世界模型 + 原生音频，场景一致性约 2 分钟，现为受邀测试者研究预览。两周内连发两款前沿模型，说明 Google 已把“模型发布节奏”本身当作竞争武器。（来源：Google DeepMind、Pichai 帖文）\n- [Introducing Gemini 4 Carbon](https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/)\n- **存储环节的 AI 外溢：DRAM 与 HBM 产能售罄至 2029 年。** SK 海力士称未来三年 DRAM 与 HBM 产能近乎售罄，存储股随之走强；结合 Alphabet 与微软的资本开支数字，AI 基建的瓶颈正从算力芯片向存储与电力等配套环节扩散，相关环节的涨价与排单值得持续跟踪。（来源：每日经济新闻盘前汇总）\n- [美股盘前：SK 海力士称 DRAM 和 HBM 产能售罄至 2029 年](https://www.mrjjxw.com/articles/2026-10-28/4624042.html)\n- **TPU 外售成为 Alphabet 云增长的新变量。** 财报前瞻曾指出 Alphabet 正在瞄准 1000 亿美元量级的 TPU 市场机会；Q3 云收入翻倍的背后，既有 AI 基础设施需求，也有 TPU 外售对云收入结构的改变——后续要看 TPU 外售对云毛利率是拉升还是摊薄。（来源：TradingView/Benzinga 前瞻）\n- [Google Cloud Revenue Surges: Alphabet Focuses on $100 Billion TPU Opportunity](https://www.tradingview.com/news/benzinga:25b1123ca094b:0-google-cloud-revenue-surges-alphabet-focuses-on-100-billion-tpu-opportunity-ahead-of-q3-earnings/)\n\n## 🏢公司与产业\n\n- **美国律所巨头 Weil 领导层建议解散公司。** FT 报道，Weil 领导层已告知合伙人公司应当解散——这是华尔街律所格局变动的罕见信号，具体拆分路径与客户去向仍待披露。（来源：FT）\n- [Weil leadership tells partners firm should be dissolved](https://www.ft.com/content/0476f216-0060-475c-962f-61d73d7d660b?syn-25a6b1a6=1)\n- **Sidley Austin 聘请银行家领衔业务组，华尔街罕见之举。** FT 报道，Sidley Austin 聘请一名银行家来领导一个业务组，在华尔街律所中属于罕见操作，反映律所与投行之间的人才争夺正在加剧。（来源：FT）\n- [Law firm Sidley Austin hires banker to lead practice group in Wall Street rarity](https://www.ft.com/content/84da55e7-f544-4c80-81fc-02fa166454fa0?syn-25a6b1a6=1)\n- **Mubadala Capital 交易员单飞设基金。** FT 报道，Mubadala Capital 的一名交易员将创立自己的风险基金，说明中东主权资本背景的投资人正在向独立基金管理人扩散。（来源：FT）\n- [Mubadala Capital dealmaker to launch his own venture fund](https://www.ft.com/content/e9827543-51c9-451b-b180-e7e2276aa957?syn-25a6b1a6=1)\n- **豪华邮轮乘客因燃料成本飙升滞留柬埔寨。** BBC 报道，豪华邮轮乘客因燃料成本飙升而滞留柬埔寨——能源价格上涨正在从大宗商品市场传导到旅游与消费端，是“能源溢价”的一个微观注脚。（来源：BBC）\n- [Luxury cruise passengers stranded in Cambodia due to soaring fuel costs](https://www.bbc.co.uk/news/articles/cwj342k62exyo?at_medium=RSS&at_campaign=rss)\n\n## 🌍全球大事\n\n- **西班牙高铁相撞至少 68 人死亡，安全系统失效成调查焦点。** BBC 报道，西班牙高速列车相撞已造成至少 68 人死亡；据当地报道披露，事故前一段约 63 公里铁路的安全系统因电脑故障失效、多列列车自动停驶，但马德里控制中心随后批准其中一列在红灯仍亮的情况下恢复行驶，行驶约 25 公里后撞上前方停驶列车。西班牙交通部长称控制中心的决定“令人难以理解”，正式责任仍待调查；这是欧洲高铁安全程序与人工调度机制的一次严重警示。（来源：BBC、北美资讯在线）\n- [High-speed train crash kills at least 68 people in Spain](https://www.bbc.co.uk/news/articles/c6p3g84kjqjlo?at_medium=RSS&at_campaign=rss)\n- [西班牙高铁事故死亡人数升至68人 当局披露重大安全疑点](https://sdctnews.com/%E5%9C%8B%E9%9B%BD/121758/)\n- **以色列大选：内塔尼亚胡阵营领先但未过半，组阁僵局在即。** BBC 报道，部分计票结果显示内塔尼亚胡阵营领先、但未达到组阁所需的多数席位，组阁谈判可能持续数周；投票率创 50 多年来新高，反映这场 2023 年 10 月以来首次大选的高度动员。无论谁组阁，对伊朗的强硬基调预计不会松动，但组阁僵局本身会让中东局势在未来数周保持高度不确定。（来源：BBC、新浪国际）\n- [Netanyahu's bloc leading Israel election but short of majority, partial results show](https://www.bbc.co.uk/news/articles/cmdx3knq1xexo?at_medium=RSS&at_campaign=rss)\n- [How could Israel break election deadlock? Here are four scenarios](https://www.bbc.co.uk/news/articles/cm62y46d97wwo?at_medium=RSS&at_campaign=rss)\n- **巴西前总统之子否认逃往美国。** BBC 报道，弗拉维奥·博索纳罗在抵达迈阿密后否认自己逃离巴西；结合特朗普同期在 Truth Social 上的催票动作，美国中期选举前的政治动员正在升温。（来源：BBC）\n- [Flávio Bolsonaro denies fleeing Brazil after landing in Miami](https://www.bbc.co.uk/news/articles/c6kglwe4lxwzo?at_medium=RSS&at_campaign=rss)\n- **乌克兰赫尔松地区停火延长。** BBC 报道，乌克兰赫尔松地区的停火已延长，停火能否从局部向更广范围扩散，仍是俄乌局势的关键变量。（来源：BBC）\n- [Ceasefire extended across Ukraine's Kherson region, officials say](https://www.bbc.co.uk/news/articles/c6lye1w9p2l8o?at_medium=RSS&at_campaign=rss)\n- **伊朗—霍尔木兹海峡风险同步抬升能源价格。** 除欧洲天然气价格突破 100 欧元外，FT 还报道伊朗威胁韩国航运集团的霍尔木兹海峡通行；能源与航运的战争溢价正在相互强化，是今日大势中英国预算“全球经济风暴”说法的现实注脚。（来源：FT）\n- [Iran threatens South Korean shipping group over Hormuz transits](https://www.ft.com/content/171ffdaa-e3e7-41b9-a4c6-09c9ace3f719?syn-25a6b1a6=1)\n\n## 📅今日前瞻\n\n- **美联储决议的消化期**：市场将继续定价 12 月是否加息，今晚至明日的美债收益率与美元走势是第一风向标；周四还有美国 GDP 与核心 PCE 数据待公布。\n- **科技财报接力**：Alphabet 电话会后，市场将盯紧其 Q4 资本开支指引；亚马逊财报也在本周盘后登场，与微软、Alphabet 共同构成“AI 资本开支是否花得值”的完整拼图。\n- **英国央行下周决议**：市场定价英国央行下周加息至 4.00% 的概率约九成，Healey 预算后的债市与英镑反应值得对照观察。\n- **11 月 3 日美国中期选举**：以色列组阁僵局与美国中期选举的叠加，可能共同决定美以对伊朗政策的下一步走向；俄克拉荷马州提前投票截至 10 月 31 日。\n- **能源与航运**：欧洲天然气价格与霍尔木兹海峡通行风险是否进一步发酵，是油价与欧洲通胀预期的短期变量。\n\n## 📎来源清单\n\n- RSS 拉取：FT Home / FT Markets、经济学人、FT 中文网、BBC World（finance 分区 40 条、world 分区 25 条，近 3 天）；本期实际引用 FT 约 12 条、BBC 约 7 条。\n- 搜索补漏：路透经 TradingView（美联储决议）、Securities.io / TickerRoast / Quantara Insights（Alphabet、微软财报）、21 世纪经济报道（70 城房价）、中指研究院经万维读者网（百城房价）、金融界 / 中房网（楼市政策）、BusinessDay / Politico 经 Daily Guardian（英国预算细节）、北美资讯在线（西班牙事故细节）、每日经济新闻盘前汇总（SK 海力士、美联储前瞻）。\n- 未采用：WSJ feeds.a.dj.com 系列（内容冻结在 2025-01）、财新 RSS（403 拦截）、路透新旧 feed（失效），均未引用。\n"};
