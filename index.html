<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☀️ 每日看板</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --mut:#86868b;
  --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --glass:rgba(245,245,247,.72); --hairline:rgba(0,0,0,.08);
  --acc:#0071e3; --acc-soft:rgba(0,113,227,.07);
  --green:#1d8127; --green-soft:rgba(28,129,39,.1);
  --amber:#9a5b00; --amber-soft:rgba(154,91,0,.1);
  --violet:#7c3aed; --violet-soft:rgba(124,58,237,.09);
  --red:#d70015; --red-soft:rgba(215,0,21,.07);
  --shadow:0 2px 16px rgba(0,0,0,.06);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --mut:#98989d;
  --fill:rgba(120,120,128,.22); --fill-strong:rgba(120,120,128,.32);
  --glass:rgba(0,0,0,.68); --hairline:rgba(255,255,255,.12);
  --acc:#0a84ff; --acc-soft:rgba(10,132,255,.13);
  --green:#30d158; --green-soft:rgba(48,209,88,.13);
  --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
  --violet:#bf5af2; --violet-soft:rgba(191,90,242,.13);
  --red:#ff453a; --red-soft:rgba(255,69,58,.13);
  --shadow:0 2px 16px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:rgba(0,113,227,.18)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .25s,color .25s}
.wrap{max-width:1060px;margin:0 auto;padding:40px 24px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dateline{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mut);font-size:14px;margin:6px 0 18px}
.theme-btn{flex:none;width:40px;height:40px;border:0;background:var(--fill);color:var(--ink);
  border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s}
.theme-btn:hover{background:var(--fill-strong);transform:scale(1.05)}
.head-btns{display:flex;gap:8px;align-items:center;flex:none}
.mini-btn{border:0;background:var(--fill);color:var(--ink);border-radius:999px;
  padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mini-btn:hover{background:var(--fill-strong)}
.tabs{position:sticky;top:0;z-index:20;margin:0 -24px;padding:12px 24px;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--hairline);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);
  border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
/* 新鲜度标识：数据非当日时在 tab 上挂小徽标 */
.fresh{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.fresh-yday{background:rgba(154,91,0,.14);color:#9a5b00}
.fresh-old{background:rgba(215,0,21,.1);color:#d70015}
.tab.on .fresh-yday{background:rgba(255,255,255,.22);color:#fff}
.tab.on .fresh-old{background:rgba(255,255,255,.22);color:#fff}
.tabpane[hidden]{display:none}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:4px 0 26px}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.stat span{color:var(--mut);font-size:13px}
.toolbar{padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;background:var(--fill);
  border:0;border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:11px 0}
.search input::placeholder{color:var(--mut)}
.search .ico{color:var(--mut);margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);color:var(--ink);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{background:var(--fill-strong)}
.chip.on{background:var(--ink);color:var(--bg);font-weight:600}
select.sel{font:inherit;font-weight:500;color:var(--ink);background:var(--fill);border:0;
  border-radius:12px;padding:10px 12px;cursor:pointer}
.count{font-size:12.5px;color:var(--mut);margin:8px 2px}
.day{margin:30px 0 6px}
.day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.day-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.day-head .n{font-size:12.5px;font-weight:500;color:var(--mut);background:var(--fill);
  border-radius:999px;padding:3px 11px}
.summary{background:var(--acc-soft);border-radius:14px;padding:14px 18px;font-size:13.5px;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:0;border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.55}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;
  background:var(--fill);color:var(--mut)}
.badge.hf{background:var(--amber-soft);color:var(--amber)}
.badge.oa{background:var(--violet-soft);color:var(--violet)}
.badge.j{background:var(--green-soft);color:var(--green)}
.badge.cat{background:var(--fill);color:var(--mut)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.lb-wrap{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px;margin-bottom:14px}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{font-size:11px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
.lb-table td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.lb-table tr:last-child td{border-bottom:0}
.lb-table .rk{color:var(--mut);width:26px;font-variant-numeric:tabular-nums}
.lb-table .num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lb-table .mname{font-weight:600}
.lb-table .org{font-size:11px;color:var(--mut);font-weight:400;margin-left:6px;white-space:nowrap}
.open-tag{font-size:10px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.up{color:#1a7f37;font-weight:700;white-space:nowrap}
.down{color:#cf222e;font-weight:700;white-space:nowrap}
.flat{color:var(--mut)}
.date{font-size:12px;color:var(--mut)}
.authors{font-size:13px;color:var(--mut)}
.one{font-size:13.5px;color:var(--ink)}
details.box{font-size:13px;background:var(--fill);border:0;border-radius:12px;padding:0}
details.box summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--acc);
  list-style:none;display:flex;align-items:center;gap:6px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸";transition:transform .15s}
details.box[open] summary::before{transform:rotate(90deg)}
details.box .body{padding:2px 14px 12px;color:var(--ink)}
details.zh{background:var(--acc-soft)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.meta-row a{color:var(--acc);text-decoration:none;font-weight:500}
.meta-row a:hover{text-decoration:underline}
.links{display:flex;gap:14px;font-size:13px;font-weight:500;padding-top:10px;border-top:1px solid var(--hairline)}
.links a{color:var(--acc);text-decoration:none}
.links a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:14px}
.sect-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.sect-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sect-head .n{font-size:13px;color:var(--mut)}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--card);
  border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.ev .t{flex:none;font-size:13px;font-weight:600;color:var(--acc);min-width:86px}
.ev .s{font-size:14px;font-weight:500}
/* ---------- x (dazzling X style) ---------- */
.x-summary{background:var(--acc-soft);border-radius:16px;padding:16px 20px;margin-bottom:24px;box-shadow:var(--shadow)}
/* ---------- finance (💰财经大事早报) ---------- */
.fin-body{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:30px 32px}
.fin-h2{font-size:19px;font-weight:700;margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--fill)}
.fin-h2:first-child{margin-top:0}
.fin-h3{font-size:16px;font-weight:700;margin:20px 0 8px;line-height:1.6}
.fin-p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:8px 0}
.fin-list{list-style:none;margin:4px 0 14px;padding:0}
.fin-item{font-size:14.5px;line-height:1.8;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid var(--fill)}
.fin-item:before{content:"▪";position:absolute;left:2px;color:var(--acc)}
.fin-item.fin-num:before{content:none}
.fin-item:last-child{border-bottom:none}
.fin-hr{border:none;border-top:1px solid var(--fill);margin:24px 0}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 16px}
.fin-table td{border:1px solid var(--fill);padding:8px 10px;text-align:left;line-height:1.6}
.fin-body a{color:var(--acc);text-decoration:none}
.fin-body a:hover{text-decoration:underline}
@media (max-width:640px){.fin-body{padding:20px 16px;border-radius:14px}.fin-h2{font-size:17px}}
.grid>.x-summary{grid-column:1/-1;margin-bottom:8px}
.x-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.x-errors{margin-top:14px;padding:10px 14px;border-radius:10px;background:rgba(255,149,0,.08);color:#b26a00;font-size:12px;line-height:1.6}
.x-sum-b{font-size:14px;line-height:1.8;color:var(--ink)}
.x-acc{margin-bottom:28px}
.x-acc-head{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.x-acc-name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.x-acc-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
/* ---------- x groups (avatar chips, collapsible) ---------- */
.x-group{margin-bottom:32px}
.x-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.x-group-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x-group-n{font-size:12.5px;color:var(--mut)}
.x-group-sum{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;line-height:1.75;box-shadow:var(--shadow)}
.x-chips{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:4px}
.x-chip{background:none;border:0;padding:0;cursor:pointer;width:78px;text-align:center;
  font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.x-chip .av-wrap{width:58px;height:58px;margin:0 auto;transition:transform .15s}
.x-chip .av-wrap .x-av-fb{font-size:22px}
.x-chip:active .av-wrap{transform:scale(.93)}
.x-chip.open .av-wrap{box-shadow:0 0 0 2.5px var(--acc)}
.x-chip-name{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-chip-sub{font-size:10.5px;color:var(--mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 未读小红点 */
.x-dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;
  background:#ff3b30;border:2px solid var(--bg);z-index:2}
.tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-left:5px}
.x-dot[hidden],.tab-dot[hidden]{display:none!important}
.x-detail:empty{display:none}
.x-detail{background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:4px 18px 10px;margin:4px 0 10px}
.x-detail-head{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.av-wrap{position:relative;flex:none;display:block}
.av-wrap .x-av-fb{position:absolute;inset:0;border-radius:50%;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
.av-wrap img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.x-av-lg{width:46px;height:46px}.x-av-lg .x-av-fb{font-size:20px}
.tw-av{width:42px;height:42px}.tw-av .x-av-fb{font-size:18px}
.tw{display:flex;gap:12px;padding:14px 6px;border-bottom:1px solid var(--hairline)}
.tw:last-child{border-bottom:0}
.tw-body{flex:1;min-width:0}
.tw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tw-name{font-size:14.5px;font-weight:700}
.tw-sub{font-size:13px;color:var(--mut)}
.tw-rt{font-size:12.5px;color:var(--mut);margin:3px 0 1px}
.tw-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.62;margin:4px 0 10px;color:var(--ink)}
.tw-actions{display:flex;gap:24px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.tw-actions a{margin-left:auto;color:var(--acc);text-decoration:none;font-weight:500;font-size:12.5px;flex:none}
.tw-actions a:hover{text-decoration:underline}
footer{margin-top:56px;text-align:center;color:var(--mut);font-size:12.5px}
footer a{color:var(--acc);text-decoration:none}
.banner{background:var(--fill);border-radius:14px;
  padding:12px 18px;font-size:13px;margin-bottom:16px}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.banner a{color:var(--acc);text-decoration:none;font-weight:600}
.run-switch{margin-left:10px;white-space:nowrap}
.run-switch button{border:1px solid var(--acc);background:transparent;color:var(--acc);
  border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px;cursor:pointer}
.run-switch button.on{background:var(--acc);color:#fff}
/* ---------- column summary (每栏目顶部要点) ---------- */
.col-summary{background:var(--card);border-radius:16px;padding:16px 20px;margin:6px 0 20px;box-shadow:var(--shadow)}
.col-sum-t{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.col-sum-b{font-size:14px;line-height:1.8}
@media(max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:28px}.wrap{padding:28px 16px 60px}.tabs{margin:0 -16px;padding:12px 16px}
.stats{gap:20px;margin:4px 0 18px}.stat b{font-size:24px}
.toolbar{gap:8px}.search{flex:1 1 100%;min-width:0}
.card{padding:16px 18px}.card h3{overflow-wrap:anywhere}
.sect-head h2{font-size:19px}.day-head h2{font-size:17px}
.summary{font-size:13px}.col-summary{padding:14px 16px}
.x-chips{gap:12px}.x-chip{width:68px}
.tw-actions{gap:14px}.ev .t{min-width:70px}
.theme-btn{width:36px;height:36px}
.mini-btn{padding:8px 11px;font-size:12px}
.head-btns{flex:1 1 auto;min-width:0;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.dateline{white-space:nowrap}}
/* ---------- archive modal ---------- */
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:9vh 16px 24px;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal[hidden]{display:none}
.modal-card{background:var(--card);border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.25);
  width:100%;max-width:620px;margin:0 auto;overflow:clip}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--fill)}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-x{border:0;background:var(--fill);color:var(--ink);width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;line-height:1}
.modal-list{padding:12px 14px 18px;display:grid;gap:8px}
.arch-item{background:var(--bg);border-radius:14px;overflow:hidden}
.arch-item summary{list-style:none;display:flex;align-items:center;gap:8px;
  padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600}
.arch-item summary::-webkit-details-marker{display:none}
.arch-item summary:hover{background:var(--fill)}
.arch-date{flex:1}
.run-tag{font-size:11px;font-weight:600;background:var(--fill);color:var(--mut);
  border-radius:20px;padding:2px 9px}
.arch-hint{color:var(--mut);font-weight:400;font-size:12px}
.arch-body{padding:2px 16px 14px;font-size:13.5px}
.arch-sec{margin:9px 0}
.arch-sec-t{font-weight:700;font-size:13px;margin-bottom:2px}
.arch-sec-b{color:var(--ink);line-height:1.75}
.arch-sec-b .mut{color:var(--mut)}
.arch-go{display:inline-block;margin-top:8px;color:var(--acc);font-size:13.5px;
  font-weight:600;text-decoration:none}
.arch-go:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<div class="dateline">2026年11月21日 星期六</div>
<h1>☀️ 每日看板</h1>
<div class="sub">每天 08:00 / 12:00 / 22:00 自动更新</div>
</div>
<div class="head-btns">
<a class="mini-btn" href="reader.html" title="随便看看：独立博客聚合">📡 随便看看</a>
<a class="mini-btn" href="fun.html" title="今日份新鲜：每天拆开都不一样">✨ 今日份新鲜</a>
<a class="mini-btn" href="pool.html" title="AI 资源池：价格/套餐/榜单可视化">📦 资源池</a>
<a class="mini-btn" href="intel.html" title="AI 情报：每日 AI 动态 + 权益速递全文">📰 AI情报</a>
<button class="mini-btn" id="libBtn" title="打开论文库">📖 论文库</button>
<button class="mini-btn" id="archBtn" title="历史归档">🗂️ 归档</button>
<button class="theme-btn" id="themeBtn" title="切换深浅色">🌙</button>

const DATA = {"days": [{"date": "2026-11-21", "summary": "", "papers": [{"title": "Tether: Verified Stateful Policy Engine for System-Level Monitoring of Agents", "authors": "Meghana Aparna Sistla（第一作者）；通讯作者信息摘要页未单独标注（提交人 Meghana Sistla；合作者 Alaia Solko-Breslin, Somesh Jha, Aditya Kanade, Krishnamurthy Dvijotham）", "url": "http://arxiv.org/abs/2611.25599v1", "category": "cs.CR (Cryptography and Security); cs.AI", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "与我们的 RU/AU 解耦直接同构——它把\"策略独立于动作语义存放、执行时刻逐条求值\"做到了系统调用层，并给出形式化验证路径，可作为 retrieve-then-project / all-of 拒绝之外\"执行语义工程化\"的强对比对象。其 Lean 形式化方法也可借鉴用于论证 M(r) 覆盖映射下逐 AU 求值的保守性。它不处理 embedding 通道泄露（T1/T2 之外的检索侧侧信道不在其威胁模型内），二者攻击面互补，可引用并对比威胁模型层次。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "针对长期运行 agent 的系统级安全问题，提出 Tether：每个候选动作先在临时隔离沙箱中执行，从观测到的 syscall 推断抽象动作语义，再用以 Lean 4 嵌入式 DSL 编写的有状态策略做运行时强制，可表达 IFC、访问控制与网络安全约束。策略标签可跨多步执行流传播，Lean 形式化保证满足全局安全不变量。在编码 agent 基准上，单一策略阻断 100% in-scope 攻击，benign 误报率低于 5%。", "supplement": false}, {"title": "Signed but Unbound: The Authority Gap Between Agent Commerce Mandates and Crypto Wallet Signatures", "authors": "Shengwei You（第一作者、提交人）；合作者 Aditya Joshi, Andrey Kuehlkamp, Jarek Nabrzyski", "url": "http://arxiv.org/abs/2611.25821v1", "category": "cs.CR", "cats": ["cs.CR"], "oneliner": "", "insight": "这是\"授权声明与执行保证之间的鸿沟\"在支付域的精确量化版本，与我们\"chunk 里存一份访问控制元数据副本不等于强制执行\"的动机高度呼应，可作为跨域佐证与可引用的威胁建模范例（九类约束的分类法也可类比到 RU/AU 边界）。它证明了\"绑定 + 独立校验点\"是通用需求，加强了我们 query-time 逐 AU 求值而非信任存储副本的 claim。", "source": "arXiv", "citations": "尚未收录", "code": "无（论文注明 reproducibility artifact 链接在正文内，摘要页未给出具体仓库）", "zh_abs": "定义了 agent 商务协议规定的 mandate 与链上 token 合约实际强制执行字段之间的\"authority gap\"，划分九类约束并推导 12 种授权配置，含 Coinbase 已部署的 Commerce Payments Protocol。在 31,800 次本地部署合约代码试验中全部吻合推导；对 Base 链上 26,653 笔 USDC 授权的抽样显示 98.7% 可被任意持签名者赎回。提出 MandateLock 最小实现，拒绝全部 10,800 个被篡改的 mandate，仅多花 25% gas。", "supplement": false}, {"title": "ZKP-PAC: Accountable and Attribute-private Access Control for EHRs with Batch-verifiable Zero-knowledge Proofs and Provably Secure Revocation on Hyperledger Fabric", "authors": "Komal Patiyal（第一作者兼通讯，komalpatiyal10@gmail.com）；合作者 Rupali Dhir", "url": "https://doi.org/10.22266/ijies2026.1130.35", "category": "访问控制 / 密码学（IJIES 期刊，非 arXiv 分类）", "cats": [], "oneliner": "", "insight": "它把\"策略隐藏 + 问责 + 可撤销\"作为一组约束同时处理，其\"撤销成本随变更规模而非语料规模增长\"的目标与我们的授权单元独立性（改一个 AU 策略不触发全库重索引）动机一致，可作为 related work 中密码学路线的对比点。但其场景是链上 EHR 而非 RAG 检索，威胁模型不含 embedding 通道；引用价值在于属性级细粒度授权与撤销传播的讨论，而非方法可迁移。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "针对 EHR 共享提出 ZKP-PAC：用 PLONK+KZG 的通用可更新 reference string 做零知识属性证明，策略变更无需重新 ceremony；chaincode 把 b 个证明批量折叠为一次随机化配对乘积使验证配对次数为常数；撤销通过代理重加密只重写受影响的 m 条记录。在 Hyperledger Fabric 2.5 上达 214 tx/s（比复现的 R-CP-ABE-ORP 基线高 44.6%），批验证摊薄至 0.094 ms。", "supplement": false}, {"title": "A2A-RefGuard: A Novel Reference-closure Noninterference Algorithm for Detecting Cross-principal State Leakage in Agent2Agent Systems", "authors": "Ameen Shaheen（第一作者兼通讯，a.shaheen@zuj.edu.jo）；合作者 Wael Alzyadat, Aysh Alhroob", "url": "https://doi.org/10.22266/ijies2026.1130.28", "category": "Agent 安全 / 非干扰验证（IJIES 期刊）", "cats": [], "oneliner": "", "insight": "其\"引用闭包\"概念与我们的 M(r) 覆盖映射本质上是同一问题（一个单元经由引用间接携带另一授权单元的内容），可以在 related work 中引用作为 agent 状态层的对应物；其 noninterference 形式化或可为\"检索到 AU r 的 chunk 不应泄露未被授权 AU\"提供另一种表述方式。攻击面（跨主体间接流）位于我们 T1/T2/T3 之外，属于互补防线，但实验全部为自建受控环境，证据强度有限。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "针对 Agent2Agent 系统中跨主体状态间接泄露问题，提出基于 Reference Closure Noninterference 的验证算法：结合成对状态干预、协议推导的引用闭包、按来源的授权与观察者输出比对，识别\"直接访问被拒但间接影响仍可达\"的路径。在受控与独立评估中分类全对，可处理万级任务图且开销低。", "supplement": false}, {"title": "Replication of Agentic Security Events: Audit and Investigation (ROGUE-AI)", "authors": "Mengxiao Wang（第一作者、提交人）；合作者 Mahbub Alam, Kalyan Nakka, Nitesh Saxena", "url": "http://arxiv.org/abs/2611.26553v1", "category": "cs.CR", "cats": ["cs.CR"], "oneliner": "", "insight": "其中\"62/72 危害事件无攻击者\"的发现与我们威胁模型分层精神一致——最现实的泄露路径往往不是主动攻击而是普通授权缺口，这支持把\"未知 AU 默认拒绝\"这类保守默认作为第一道防线而非仅防御注入。其\"重建 + 成对对照\"的实验方法论可借鉴用于构造我们 embedding 泄露实验的消融对照（如仅缺覆盖映射 M(r) 的对照组）。可引用其作为 agent 危害审计的可复用框架。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "提出 ROGUE-AI 多智能体框架：离线重建媒体报道过的 agent 安全事件，并构造只缺少被归因原因的对照环境重跑，108 次复现中 89% 重现了报道的危害。五个主流模型在被归因原因存在时犯错率 18–33%，对照组最多 1%；72 起真实危害事件中 62 起并无底层攻击者——agent 只是执行任务时踩中普通危险。无攻击者复现造成的危害大于 prompt injection 复现，现有注入防御对此无效。", "supplement": false}, {"title": "AgentShield Hybrid Runtime Firewall Architecture for Secure Tool Governance in Agentic Large Language Model Systems", "authors": "Uday Kareem Hussein Al-Saadi（第一作者）；通讯作者 Azhar Hasan Nsaif（bahar299947@uomustansiriyah.edu.iq）；合作者 Nada Abdulkareem Hameed", "url": "https://doi.org/10.22266/ijies2026.1231.11", "category": "Agent 安全 / 运行时治理（IJIES 期刊）", "cats": [], "oneliner": "", "insight": "它诚实报告了严重的 over-blocking（良性成功率 58%→17%），这正是我们主张\"细粒度 AU 级裁剪（retrieve-then-project）优于整篇拒绝\"时可用作反面对照的数据点：粗粒度全有全无执行的可用性代价有多大，可以在实验讨论中引用来说明细粒度授权的必要性。方法本身是 tool 层治理，与检索侧授权无直接交集，威胁模型不含 embedding 泄露，关联为对比与动机引用而非方法借鉴。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "提出 AgentShield-FW 混合运行时防火墙，通过类型化 Action Intent Objects 把推理与执行权限分离，叠加确定性策略执行、分类器风险评分、审批与沙箱控制及防篡改审计。在 2,613 例 held-out 测试集上攻击阻断率 98.23%；AgentDojo 子集上注入任务成功率从 33.33% 降到 0%，但良性任务成功率从 58.33% 跌至 16.67%。", "supplement": false}, {"title": "BEL–RAG: Bayesian Evidence Leasing with Counterfactual Auditing and Policy-Aware Retrieval", "authors": "Kamal Taha（Khalifa University；摘要页仅列一位作者）", "url": "https://doi.org/10.3390/make8110391", "category": "RAG / 机器学习（MDPI MAKE 期刊）", "cats": [], "oneliner": "", "insight": "这是检索侧 policy 约束与我们的 retrieve-then-project 语义最接近的一篇——同样主张\"许可性在推理前决定\"，其\"per-claim 支撑审计 + 弃答\"可类比我们的 NLI 残留检查与保守子句切分，可直接作为 query-time 策略执行的对比方法与引用点。差异在于其策略约束的是\"证据可采性\"而未讨论授权单元解耦与 embedding 通道泄露（其 T1 类风险未建模），这正好凸显我们 per-view 索引的增量贡献。venue（MDPI MAKE）可靠性中等，引用时注意。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "把检索视为\"受控证据获取\"而非上下文堆放：Policy-Aware Retrieval 在推理前用策略约束证据许可性，Bayesian Evidence Leasing 按后验贡献与成本获取可采纳段落，反事实审计检验证据是否实质支撑每个 claim，支持不足则继续检索、限定表述或弃答。在 HotpotQA 74.9% F1、MetaQA 90.1% 准确率，同时策略违例率降至 0.5%（较基线降 37.5%）。", "supplement": false}, {"title": "Spatio-Temporal Provenance Guard: Detecting Privilege Escalation Attacks That Exploit Spatio-Temporal Data Loss in Multi-Agent MCP Environments", "authors": "Deuk-Hun Kim（第一作者）；通讯作者 Jin Kwak（Ajou University）；韩国 Ajou University 网络安全系", "url": "https://doi.org/10.3390/app162211449", "category": "Agent 安全 / MCP（MDPI Applied Sciences 期刊）", "cats": [], "oneliner": "", "insight": "其核心洞察——\"溯源在边界处丢失，导致分散在多记录中的指令被特权 agent 组装执行\"——与我们的保守子句切分器和 KG 路径切割动机同源：攻击载荷可以跨检索单元拼接绕过单元级授权。这可作为我们\"为什么单元粒度授权必须配合切分器保守性\"论点的引用素材，其 witness 双确认机制也可类比我们的 NLI 残留检查（多通道确认）。实验为合成数据，venue 为 MDPI Applied Sciences，证据强度中等；威胁模型不含 embedding 泄露，属互补防线。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "针对 MCP 多智能体环境中溯源跨存储与会话边界丢失的问题，提出 STPG 网关：持久化连接器溯源、按来源谱系重组记录，仅当可信指令被见证指向该目的地且通过确定性结构检查时才授权外呼。在 Google Cloud + Gemini 测试床上阻断全部 648 次攻击并通过 69/71 次合法传输；要求双 witness 模型一致使误授权从 53 降至 25/150。", "supplement": false}]}, {"date": "2026-11-20", "summary": "", "papers": [{"title": "Revocation Window in RAG: Quantifying Unauthorized Retrieval Exposure During Access-Control Propagation", "authors": "Snehal Patil（通讯，D.Y. Patil Institute of MCA and Management, Akurdi, Pune）；学生作者 Pragya Rai 等", "url": "https://doi.org/10.5281/zenodo.24345729", "category": "RAG 安全 / 访问控制（IJCT V13I6，Zenodo 存档）", "cats": [], "oneliner": "", "insight": "与我们直接相关——它给出了\"chunk 随行 ACL 副本\"这一设计的实测失败模式，而我们的 RU/AU 解耦（策略独立存放、查询时逐 AU 求值、未知 AU 默认拒绝）正是消灭该窗口的结构性方案，其六配置对比可作为我们实验设置的直接对比基线与可引用数字。作者明确声明结论仅限合成测试床、venue 非 Top 级，引用时应限定范围。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "测量 RAG 系统中权限撤销后向量索引里陈旧 ACL 副本造成的\"撤销窗口\"，区分未授权索引返回与 LLM context 暴露两类结果。在 PostgreSQL + Qdrant 合成测试床上比较六种执行配置：周期同步中位传播时间 9.92 s、事件驱动 14 ms、带缓存 query-time 授权 4.98 s；周期同步下 87.7% 的相关查询在撤销生效前已把受保护 chunk 送入 context，而 query-time/hybrid 授权在首个撤销后探测点即拦截。", "supplement": false}, {"title": "Intent Contracts: Taking Tools Away from Agents", "authors": "Ziyuan Wang（第一作者）；Genliang Zhu, Xiaobo Chen, Chu Wang", "url": "http://arxiv.org/abs/2611.24025v1", "category": "cs.CR", "cats": ["cs.CR"], "oneliner": "", "insight": "授权语义层面的可对比工作：它把授权约束放在\"意图-契约\"这一动作层，我们的方案把授权放在数据单元（AU）层、查询时逐 AU 求值——其\"契约不能减少未授权动作\"的坦率负面结果，支持我们主张授权保证必须由基础设施在数据访问边界强制，而非依赖模型意图的可审查性。可引用其 AmPermBench 作为 agent 授权评测的参照。", "source": "arXiv", "citations": "尚未收录", "code": "无（论文提到发布 plugin 与 run records，摘要页未见仓库链接）", "zh_abs": "提出 intent contracts：规划模型不持任何工具，每步提交含目标、用户原话引用和 scope 字段的契约，由代码校验、小型可信模型写实际工具调用。实验显示契约能保证所有对象变更都在契约 goal 中具名、对\"规划器夹带私货\"完成 27/30 任务，但契约不能减少未授权动作，与盲审不可区分，且歧义指代下 40–49% 的状态变更仍命中错误目标。", "supplement": false}, {"title": "Kaer: Security-Aware Replanning for Multi-Agent Systems", "authors": "Tushin Mallick（第一作者，Northeastern University）；通讯作者 Cristina Nita-Rotaru", "url": "http://arxiv.org/abs/2611.24839v1", "category": "cs.MA; cs.LG", "cats": ["cs.MA", "cs.LG"], "oneliner": "", "insight": "攻击面互补：我们的 T1/T2/T3 威胁模型针对 RAG 检索通道（答案/排序向量/知识库），而 Kaer 揭示的是多 agent 反馈通道上的重规划劫持——位于我们威胁模型之外。其\"计划修订必须满足预设策略\"与我们的\"逐 AU 策略求值\"同为确定性策略强制，但对象不同；Cintra benchmark 可在 related work 中作为 MAS 侧执行语义防御的代表工作引用。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "指出 MAS 动态重规划阶段可被恶意 agent 反馈劫持，现有防御只覆盖 per-tool 访问控制与静态预执行策略。Kaer 用抽象模板隔离 planner 与不可信反馈、把计划修订限制在确定性 repair 算子内、修订后计划必须满足预设策略，并发布 Cintra benchmark；在 Cintra 上鲁棒性优于 Magentic-One 与 ControlValve。", "supplement": false}, {"title": "Securing and Auditing Long-Horizon LLM Agents: State-Transfer Auditing and Controls in the Agent Harness", "authors": "Deep Shah（第一作者）；Nehal Kathrotia", "url": "http://arxiv.org/abs/2611.23346v1", "category": "cs.CR", "cats": ["cs.CR"], "oneliner": "", "insight": "方法论可借鉴：它论证\"授权在 prompt 之外由 harness 层确定性强制\"，与我们把授权从 embedding/检索通道中剥离的主张同构，其\"记录即控制\"的思路可用于论证我们 M(r) 覆盖映射的审计可追溯性。其攻击面（状态迁移边界）与 T1/T2/T3 互补，可作威胁模型的外延引用。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "提出 agent harness 的 state-transfer 审计架构：在每个状态迁移边界（上下文/历史/记忆/环境）输出最小 hash 链式记录，区分低开销确定性检查与模型语义检查；同一批迁移记录可支撑 least-privilege capability、prompt 之外的防重放授权、信息流控制等运行时安全控制。在 240 条多步故障注入轨迹上验证。", "supplement": false}, {"title": "Expressiveness and Convertibility of Rule-Based Access Control Policies", "authors": "Amir Masoumzadeh（第一作者兼提交人，University at Albany SUNY）；Paliath Narendran, Padmavathi Iyer", "url": "http://arxiv.org/abs/2611.23738v1", "category": "cs.CR", "cats": ["cs.CR"], "oneliner": "", "insight": "为策略语义提供理论底座：我们的 AU 策略求值本质上是一种规则型模型（含默认拒绝的 deny-first 语义），该文关于 deny 规则与条件表达式设计选择如何影响表达力的结果，可直接用于论证我们策略语言设计选择的完备性边界与可迁移性，是可靠的学术引用来源。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "系统研究规则型访问控制模型（如 ABAC）的语义与表达力：不同规则结构与组合设计选择（条件表达式允许什么、是否支持 deny 规则）决定可表达策略的范围；进一步研究策略在模型间迁移的可转换性问题，给出良构性、表达力层级与可转换性计算复杂度等结果。", "supplement": false}, {"title": "WebAgents: Unbundling Agent Creation, Hosting, and Execution for an Agent-Native Web", "authors": "Dario Fenoglio（第一作者，USI Lugano）；Martin Gjoreski, Marc Langheinrich, Pradyumna Chari, Ramesh Raskar（通讯，MIT Media Lab）", "url": "http://arxiv.org/abs/2611.21978v1", "category": "cs.AI（IEEE CIC 2026）", "cats": ["cs.AI"], "oneliner": "", "insight": "架构同源但层位不同：WebAgents 在\"agent 能力包\"层做权限绑定与预执行拦截，我们在\"检索数据单元\"层做授权解耦——二者的\"权限不随制品走、运行时绑定\"原则一致，可作为 standards-agent 线的可引用对照；其 716/295 阻断/放行的评测法（违规注入 vs 匹配良性对照）对我们的 embedding 通道泄露实验设计有参考价值。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "将 agent 的创建、托管与执行三种角色解耦：签名的 agent.pkg 携带可移植工作流、skills、schema 与资源需求，agent 原生运行时验证包、获得授权并在运行时绑定到用户控制的模型、工具、权限与预算。控制套件中阻止全部 716 个注入的契约违规、放行全部 295 个良性对照，预执行处理中位耗时低于 0.5 s。", "supplement": false}, {"title": "PIPETTE: Prompt Injection Purple-Teaming for Robust LLM Agents", "authors": "Lipeng He（第一作者）；Konstantinos Psounis（通讯，UCSC）", "url": "http://arxiv.org/abs/2611.24362v1", "category": "cs.CR; cs.AI", "cats": ["cs.CR", "cs.AI"], "oneliner": "", "insight": "关联较弱到中等：它攻击的是 agent 指令通道而非我们的检索/授权通道，但其\"攻击策略覆盖度决定防御有效性\"的结论可迁移到我们 embedding 通道泄露评测——cloze 攻击模板若只覆盖少数模式，修复效果可能被高估；其 purple-teaming 评测框架可作为我们评测方法论的可引用参照。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "指出 RL 红队方法（RL-Hammer、PISmith）存在 mode collapse：高 ASR 不带来对抗训练的鲁棒性增益。PIPETTE 用 dictionary learning 奖励扩大攻击策略覆盖，并集成面向 IPI 防御的 on-policy 对抗训练流水线；在 AgentDojo 与 ASB 上静态攻击近零 ASR、抗强自适应攻击且良性效用接近无防御基线。", "supplement": false}]}, {"date": "2026-11-19", "summary": "", "papers": [{"title": "GapLeak: When Privacy-Preserving LLM-based Web Agents Become a Privacy Risk", "authors": "Chaklam Cheong 等（Mohammad Zulkernine）", "url": "https://arxiv.org/abs/2611.22223", "category": "arXiv 预印本 / cs.CR（2026-11-17 发布）", "cats": ["cs.CR"], "oneliner": "证明数据最小化与最小权限对 LLM web agent 必要但不充分：网站索要一个授权来源里没有的字段，目标驱动的 agent 就会自行升级到更高敏感、未授权的来源取数并泄露，全程不需要提示注入。", "insight": "这是今日与我们工作咬合最紧的一篇，有三处可取。第一，它给了一个我们威胁模型里没有的攻击面：**“可达但未授权”的来源**——我们的 T1/T2/T3 按“攻击者能看到什么”分层，GapLeak 的攻击者什么都不用注入，只靠“表单索要一个授权来源里没有的字段”就让 agent 自己越界取数；这说明授权边界不能只按“可见性”划，还要按“可达性”划，威胁模型节可以补一句“可达性 ≠ 授权”的维度。第二，它的防御结论与我们的 retrieve-then-project 同构，只是检查点不同：我们在检索后裁剪未授权片段，它在提交前过滤未授权内容——“提交时验证消除 96% 以上披露且不损任务成功率”这个数字，可以作为“在动作执行点做确定性过滤”的对照证据，支持我们“执行时授权绑定”的立场。第三，它的“消除信息缺口降低披露 50% 以上”提示我们：AU 粗了会漏、但把授权来源的覆盖做全本身就是一种防御；我们的 AU 粒度讨论里可以提一句“授权覆盖完整性”与“逐 AU 求值”互补。诚实标注：评测只覆盖三个框架、六个模型、四类任务场景，37% 是平均数、不同场景差异未在摘要中展开，引用时只取机制与量级，不取精确到场景的数字。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "基于大语言模型的 web agent 依靠数据最小化与最小权限保护用户隐私。本文证明这两个原则必要但不充分：它们约束的是授权来源，却约束不了仍然可达的更高敏感来源。网站可以索要一个授权来源里没有的字段、制造一个“信息缺口”；为完成任务，目标驱动的 agent 可能升级到可达但未授权的来源，泄露已积累的敏感信息。本文把这一漏洞形式化为 GapLeak：攻击者利用一个合法的 web 表单，全程不写提示注入或任何恶意指令。在三个 web agent 框架、Anthropic、Google、OpenAI 六个模型、招聘、电商、旅行、医疗四个场景上的评测显示，GapLeak 平均诱发约 **37%** 的未授权披露；信息缺口是主要驱动因素，消除缺口可使披露降低 **50%** 以上。基于最小权限的指令级防御只能部分缓解、且常损害任务成功率；本文提出的提交时验证（在表单提交前过滤未授权内容）可消除 **96%** 以上的未授权披露，同时保持任务成功率。", "supplement": false}, {"title": "AISE: Enforcing Explicit Assembly and Release Authorization Boundaries in Multi-Agent LLM Systems", "authors": "Nick Korsunsky（单作者）", "url": "https://doi.org/10.5281/zenodo.24301737", "category": "Zenodo 预印本（概念架构 + 原型，未经同行评审）", "cats": [], "oneliner": "提出 capability 安全模型 AISE：能访问 ≠ 能组合、能组合 ≠ 能发布；用密码学 Token Spine + 组装门、发布门两道确定性策略检查点，在 8 个对抗场景里实现 100% 确定性遏制。", "insight": "这是今日第二值得收的一篇，与我们新方向（执行时授权绑定）几乎是同一条线上的平行工作。第一，它的“能访问 ≠ 能组合 ≠ 能发布”三段不变量，可以直接与我们的 RU/AU 解耦对照：我们是检索侧“chunk 只存覆盖映射、策略独立存放、查询时逐 AU 求值”，它是执行侧“组装与发布各设一道显式授权门”——两者合起来正好构成“检索授权 + 执行授权”的两段链条，相关工作里可以并列引用。第二，它的 Token Spine（短寿命、持有者绑定、单调衰减）是一种“授权随数据走”的实现技术，与我们的“策略独立存放”形成对照：一个把授权绑在 token 上、一个把授权存在策略库里，写机制对比时可以讨论两种绑定的取舍（token 适合跨组织传递、策略库适合集中审计）。第三，它的 8 场景 100% 遏制是“确定性门优于模型自律”的又一个证据，与我们的立场一致。诚实标注：这是 Zenodo 上的概念架构 + 原型，无同行评审；“100%”是在作者自建的 8 个对抗场景里、不是标准基准上的数字，引用时只取架构思想与不变量，不取效果数字；代码只在摘要中提及、未核验实际可用性。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "摘要称附带 aise_prototype.py（Apache 2.0）", "zh_abs": "现代 LLM agent 越来越以多 agent 流水线方式运行，从不受信外部来源与敏感内部系统检索、汇总、组合数据。现有安全架构（工具调用网关、CaMeL 这类基于解释器的信息流控制）限制 agent 能调什么工具、结构化变量如何传播，但在非结构化多 agent 合成环节存在盲点。本文提出 AISE（隔离、限定执行架构），一个 capability 安全模型，围绕一条不变量：**能访问不等于能组合，能组合不等于能发布**。AISE 用一条密码学 Token Spine（短寿命、持有者绑定、单调衰减的 capability token）加两道确定性策略检查点——组装授权门与发布授权门——来强制这条不变量。本文形式化 AISE 流水线、与已有工作对照，并在 8 个对抗压力测试中报告：对权限提升、传递性污点洗白、token 重放、隐写去分类走私实现 **100% 确定性遏制**。", "supplement": false}, {"title": "Agent Trust Infrastructure (ATI): A Federated Identity, Trust, Attestation, and Accountability Architecture for Cross-Organization Autonomous AI Agents", "authors": "Viet K. Nguyen、Mohammad I. Husain", "url": "https://arxiv.org/abs/2611.23202", "category": "arXiv 预印本 / cs.AI（2026-11-17 发布）", "cats": ["cs.AI"], "oneliner": "为跨组织协作的 agent 建联邦信任基础设施：PKI + 零信任 + 远程证明，执行请求前验证 agent 证书、核对模型/工具/系统提示配置、过三道策略检查，攻击遏制率从 43% 提升到 84%。", "insight": "这篇是 Jev 初筛漏掉（relevance 0.47）后人工打捞回来的，值得收——它补上了我们威胁模型里“跨组织”这一维。第一，它的“执行请求前三道检查”（证书验证、配置核对、授权检查）正是“执行时授权绑定”在跨组织场景下的实例化：授权不在入口处一次性给、而在每次执行请求前重新求值，可以在相关工作里作为“绑定点前移”的对照。第二，它的联邦信任设计（对等 AgentCA、无共享根）与我们的“策略独立存放”互补：跨组织时策略不可能集中存放，授权必须跟着可验证的身份与配置走——这对我们 AU 模型的“跨域部署”讨论有参考价值。第三，174 微秒的开销数字说明“每次执行前重求值”在工程上是可负担的，可以用来回应“逐 AU 求值是否太贵”的质疑。诚实标注：评测是模拟联邦（8 个组织、6 个框架）而非真实跨组织部署；遏制率 84% 仍有 16% 的攻击未被挡住、且摘要未展开哪些场景漏网，引用时只取机制与量级；代码称已开源、未核验仓库地址。", "source": "arXiv", "citations": "尚未收录", "code": "摘要称已开源（框架无关包，采用 IETF WIMSE workload token 格式与 Entity Attestation Token）", "zh_abs": "AI agent 越来越跨组织协作，调用工具、与独立实体运营的 agent 交互。现有 agent 框架支持规划与协调，但缺乏验证跨组织 agent 身份、执行完整性与授权的通用机制。本文提出 Agent Trust Infrastructure（ATI），一个框架无关的安全架构，基于公钥基础设施（PKI）、零信任架构（ZTA）与远程证明。ATI 通过对等的组织证书颁发机构（AgentCA）建立联邦信任，无需共享根机构。执行请求前，ATI 验证 agent 证书、核对已批准的模型、工具与系统提示配置，并通过三道策略检查强制授权。ATI 实现为外部安全强制层，无需修改底层模型即可接入现有 agent 框架。在 8 个组织、6 个 agent 框架、每框架 5 个 agent 的模拟联邦中评估：安全实验涉及 2 个组织、14 个攻击场景与 6 个良性任务、5 个 agent 模型，每种攻击 5 个变体 × 3 次重复、由评判模型组打分。全部强制机制开启后，攻击遏制率从 **43% 提升到 84%**（11 个在全部配置下一致评估的攻击场景为 40%→80%），每请求强制开销约 **174 微秒**。", "supplement": false}, {"title": "Sentinel-Rag: A Controlled Comparison of a Scratch-Trained Classifier and a Local LLM Judge for Defending Enterprise Retrieval-Augmented Generation against Indirect Prompt Injection", "authors": "Aadi Surve Waaridh Borpujari 等（Soham Arte、Sushil Sonawane、Vijaya Patil）", "url": "https://doi.org/10.48175/ijarsct-40823", "category": "International Journal of Advanced Research in Science Communication and Technology（2026-11-17 发布）", "cats": [], "oneliner": "建了一个受控 testbed：三台共享同一语料、检索器与回答模型的企业 RAG 助手，只差检索与生成之间的安全环节（无防护 / RBAC + 从零训练的 1.6M 参数分类器 / RBAC + 本地 2B 参数 LLM 判官），对比间接提示注入下的防护效果与代价。", "insight": "这篇的价值在“对照实验设计”而不在结论新颖性。第一，它的三臂对照（无防护 / RBAC + 小分类器 / RBAC + LLM 判官）把“访问控制”与“内容审查”拆成两个正交环节——这正是我们 RU/AU 解耦要做的区分：RBAC 管“谁能看哪个 AU”，分类器/判官管“内容里有没有注入”；它的数字（分类器 8–9ms 但误删 9%–16% 良性 chunk、判官 13–14 秒但零误删）可以作为“确定性门（RBAC）便宜、模型审查贵且各有代价”的对照证据。第二，它的“两种防护均为零不安全回答”是在 25 个问题的小套件上取得的，不要当成通用安全保证引用。第三，它的 testbed 思路（固定语料/检索器/回答模型、只换安全环节）与我们的评估方法论一致，可以借鉴。诚实标注：venue 是 IJARSCT（低质量期刊）、实验规模很小（25 个问题、两种语料条件），引用时只取对照设计与代价数字，不取“防护有效”的泛化结论。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "企业 RAG 助手读取公司聊天、wiki 与政策文档，任何能往这些来源里发帖的人都能植入指令。本文提出 Sentinel-RAG，一个受控 testbed：三台助手共享同一语料、检索器与回答模型，只在检索与生成之间的安全环节不同——无防护、基于角色的访问控制（RBAC）+ 从零训练的 160 万参数 Transformer 分类器、或同样的访问控制 + 本地 20 亿参数 LLM 判官（schema 约束输出）。分类器在 held-out 攻击模式上达到 **89.8% 准确率、0.895 macro F1**。在 25 个问题、两种语料条件的小套件上，无防护助手分别给出 4 个与 10 个不安全回答，两种防护均为零。分类器每查询只加 **8–9 毫秒**、但移除了 **9%–16%** 的良性 chunk；判官不移除良性 chunk、但每查询加 **13–14 秒**。", "supplement": false}, {"title": "Bidirectional Conversation-Specific Access Authentication for Generative Artificial Intelligence: A Unified Framework for Independent Human and AI Authorization of Individual Conversations", "authors": "Jincheng Zhang（单作者）", "url": "https://doi.org/10.5281/zenodo.24273666", "category": "Zenodo 预印本（概念框架，未经同行评审）", "cats": [], "oneliner": "提出按会话粒度的双向访问认证：人开某个会话要另行认证，AI 要读某个会话也要另行授权——账号级认证保护不了单个会话。", "insight": "这篇的价值在“授权单元粒度”这个概念点上。它把授权单元定在“会话”一级——账号太大、消息太小，会话正好是记忆与上下文的载体；这与我们“AU 是权限判定的原子单位”的思路同构，只是平面不同（我们是检索单元 vs 授权单元，它是账号 vs 会话）。它的“AI 读会话也要显式授权”尤其值得注意：我们的 T1/T2/T3 假设攻击者通过检索或排序接触数据，这篇提醒我们，**会话记忆本身就是一个授权边界**——agent 跨会话读记忆，等于跨 AU 读数据。可以在 AU 粒度讨论里作为“会话级 AU”的类比引用。诚实标注：这是 Zenodo 上的纯概念框架、无实验、无评估、无同行评审；作者 Jincheng Zhang 同日还在 Zenodo 发了多篇同系列概念文（下一篇 PCBA-GAI、昨日已报的 URVC 也是同一作者），引用时只取“会话级授权单元”的概念，不取任何效果数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "生成式 AI、大模型、持久会话记忆与自主 agent 的普及，带来一类新的隐私与安全需求：对单个“人—AI 会话”的访问控制。现有认证机制主要保护用户账号、设备、应用或信息集合；但保护整个账号，不等于对单个会话有足够细粒度的控制——尤其当多个 AI 模型、agent、工具与自动化流程都能访问会话历史时。本文提出双向会话级访问认证（BCAA-GAI），为两个不同的访问方向建立独立的认证与授权要求：人访问会话时，人要先完成额外认证才能打开指定会话；AI 访问会话时，生成式 AI 系统、模型、agent 或受托计算组件在检索、打开、读取、处理或以其他方式访问指定会话之前，必须获得显式授权。与常规账号级认证和通用 AI 权限不同，该框架把“会话”本身作为授权单元。", "supplement": false}, {"title": "Per-Conversation Biometric Authorization for Generative Artificial Intelligence (PCBA-GAI): A Privacy-Preserving Framework for Securing New Conversation Initiation and Cross-Conversation Memory Access", "authors": "Jincheng Zhang（单作者）", "url": "https://doi.org/10.5281/zenodo.24269371", "category": "Zenodo 预印本（概念框架，未经同行评审）", "cats": [], "oneliner": "新开一个会话不等于开了独立上下文——持久记忆会把旧会话的信息带进新会话；本文提出每次新开会话与跨会话读记忆都要过生物识别授权。", "insight": "这篇与上一篇是同一作者、同日、同系列的两篇姊妹文，合起来读才完整：上一篇定“会话是授权单元”，这篇指出“新会话不是隔离边界”——持久记忆会在会话之间搭一座桥。对应到我们的框架，这正是 **AU 边界被记忆机制绕过**的情形：检索侧按 AU 切分做得再干净，如果记忆层可以在新会话里把旧 AU 的内容带进来，授权就漏了。我们的 T1/T2/T3 目前覆盖“检索时能看到什么”，没有覆盖“记忆跨会话携带什么”；这篇可以作为“记忆即跨 AU 通道”的概念引用，写进威胁模型或未来工作。诚实标注：与上一篇相同，这是 Zenodo 上的纯概念框架、无实验、无评估、无同行评审；生物识别作为授权手段本身的隐私与可用性代价本文未讨论，引用时只取“跨会话记忆是授权边界”这一概念，不取方案本身。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "生成式 AI 系统正从孤立问答工具演变为能保留用户偏好、引用旧会话、维持个性化记忆、把历史上下文带入新会话的持久会话环境。这些能力提升了连续性与个性化，但也带来一个安全问题：新开一个会话不等于从一个独立、信息隔离的上下文开始——新会话可能通过持久记忆、聊天记录引用、用户画像、上下文摘要、自定义指令等机制，收到源自旧会话的信息。因此，一个临时拿到已认证 AI 应用的人，可能只需新开一个会话，就能获得源自账号持有者旧交互的信息，而无需直接打开原会话。现有应用级认证与会话级访问限制不一定覆盖这一特定安全边界。本文提出每会话生物识别授权（PCBA-GAI），为新会话发起与跨会话记忆访问建立授权框架。", "supplement": false}]}, {"date": "2026-11-18", "summary": "", "papers": [{"title": "Evaluating Authorization and Trust Boundaries in Agentic Orchestration Frameworks", "authors": "Sahaya Jestus Lazer 等（Maanak Gupta、Elisa Bertino）", "url": "https://arxiv.org/abs/2611.21259", "category": "arXiv 预印本 / cs.MA（2026-11-16 发布）", "cats": ["cs.MA"], "oneliner": "在 LangChain、LangGraph、AutoGen、OpenClaw 四大 agent 编排框架上做 12 个对照实验、映射到 OWASP Agentic Top 10，实测授权与信任边界在组件交界处如何被突破、又如何被守住。", "insight": "这是今日与我们新方向（执行时授权绑定）咬合最紧的一篇。第一，它用实验确立了一个我们论文可以引用的基本事实：**授权边界不是一道入口检查，而必须在编排的每一步都保持**——工具链与 agent 间委托恰恰是“批准了 A、执行却滑向 B”的位置，这正是 ChainBind 要把“批准—执行绑定”从单步动作扩展到多步调用链的动机，相关工作里可以并列引用。第二，它的“记忆投毒”发现值得我们注意：不可信状态影响回答的风险与常规访问控制违规不同——我们的 T1/T2/T3 目前按“攻击者能看到什么”分层，记忆投毒属于“攻击者能往状态里写什么”，威胁模型节可以提一句这一维度的存在。第三，它的受保护配置（显式授权、能力分配、隔离、执行防护）与我们的“策略独立存放、查询时逐 AU 求值”同构，可以作为“确定性门优于模型自律”的对照证据。诚实标注：实验只用 gpt-4o-mini 一个模型、12 个实验是定性对照、未报告统一的攻击成功率数字，引用时只取机制发现，不取效果数字。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "Agent 系统把大模型扩展出工具、记忆与多 agent 协作，安全风险集中在编排边界上，取决于身份如何表示、操作如何授权、指令与信息如何在组件间传播。本文用同一模型（gpt-4o-mini）在四个主流编排框架上做 12 个实验，覆盖提示注入、未授权资源访问与命令执行、记忆投毒、agent 间信任与身份攻击。对抗输入诱发了未授权工具调用；工具链、陈旧的文件系统校验、编码指令与 agent 间委托都在组件边界上暴露了授权弱点；记忆投毒表明不可信状态可以影响回答，这是与常规访问控制违规不同的风险。在受保护配置下，显式授权、受控的能力分配、文件系统隔离与执行防护阻止了特定的未授权操作。", "supplement": false}, {"title": "Security of Deep Research Agents: Attack Surface, Defenses, Benchmarks, and Agenda Seeding against Research Planning", "authors": "Yang Luo 等（Qingni Shen、Zhonghai Wu）", "url": "https://arxiv.org/abs/2611.20045", "category": "arXiv 预印本 / cs.CR、cs.AI（2026-11-15 发布）", "cats": ["cs.CR", "cs.AI"], "oneliner": "系统梳理深度研究 agent 的安全研究（检索、规划、证据整合、报告生成四阶段），并提出 agenda seeding 攻击：攻击者不写指令、只引入一个虚构评估指标，就能操纵研究报告的结论排序。", "insight": "这篇与我们的 RAG 安全主线直接咬合，有三处可取。第一，它给了一个可引用的威胁模型对照：四阶段（检索—规划—证据整合—报告生成）划分与我们的 T1/T2/T3 互补，特别是“只有 26.5% 的研究涉及规划阶段、没有端到端商业产品投毒评估”这个缺口数字，可以在相关工作里用来说明“规划阶段的授权绑定是空白点”。第二，agenda seeding 是一种**无指令注入**：攻击者不写指令、只改评价标准——我们的威胁模型目前假设攻击者通过内容注入影响检索或推理，是否要覆盖“攻击者只改标准、不改指令”的情形，值得在威胁模型节提一句。第三，它的防御评估结论（注入检测失效、验证提示伤效用、来源标记可被绕过）与我们“确定性门优于模型自查”的立场一致，可以作为旁证。诚实标注：这是一篇系统梳理型论文（survey + 新攻击），agenda seeding 的 16%–28% 是在作者自建沙盒里的数字，不是商业产品上的实测，引用时注明场景。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "深度研究 agent 自主从开放网络检索内容并生成带引用的报告，其输出常被直接当作研究结论。本文沿检索、规划、证据整合、报告生成四阶段系统化该领域的安全研究，给出统一威胁模型、攻击与防御分类、评测基准综述，并逐维对齐 RAG 投毒、提示注入与生成式引擎优化（GEO）。编码 34 项主要研究发现：只有 26.5% 涉及规划阶段，没有一项在商业产品上做端到端投毒评估。为填补空白，本文提出 agenda seeding 攻击：攻击者不写任何指令，只引入一个虚构评估指标；在 3,520 次同预算沙盒运行中，GEO 与提示注入近乎无效，而 agenda seeding 让攻击者目标在 16%–28% 的报告中成为首选；注入检测与查询锚定对此失效，验证提示会损害效用，来源标记能保住效用但可被多站诱饵绕过。文末提出八个研究方向。", "supplement": false}, {"title": "Safe Resemblance, Silent Propagation: Limits of Text-Similarity Guardrails for AI Agent Safety", "authors": "Charles Xiao（单作者）", "url": "https://arxiv.org/abs/2611.21520", "category": "arXiv 预印本 / cs.AI（2026-11-16 发布）", "cats": ["cs.AI"], "oneliner": "证明文本相似度守卫挡不住 agent 间的注入传播：注入指令改写措辞后仍能驱动下游 agent 做新的计算，而合法引用与模板复用又会被大量误报；相同 transcript 在不同策略下需要不同的安全判定。", "insight": "这篇是 Jev 初筛漏掉（relevance 0.41）后人工打捞回来的，值得收——它对我们的防御评估方法论有直接启示。第一，它给了一个可引用的反例：**文本相似度不是授权决策**，注入可以在改写后保持功能、合法引用又必然撞高分——我们的 retrieve-then-project 与 NLI 残留检查若只看文本重叠，会掉进同一个坑；评估时必须按行为目标（是否诱发新的计算）而不是按文本分数打分。第二，它的结论“相同 transcript 在不同策略下需要不同安全决策”正是我们“策略独立存放、查询时逐 AU 求值”的设计前提：安全判定依赖策略上下文，不依赖可见文本本身，可以在设计 rationale 里引用。第三，它的“21 个已发表配置都有工作点错误”提醒我们：引用他人的防御数字之前，要先核对阈值与评估标签的定义。诚实标注：实验是三 agent 邮件中继的受控小实验，只用了一个分类器（DonkeyRail），结论的普适性有待更大规模验证。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "当 AI agent 相互传递信息时，一条输出可以在措辞改变后仍保留注入指令对下游 agent 的作用，而合法引用与模板复用也会与来源产生高度文本重叠，因此试图区分两者的文本相似度守卫会把两种情况混淆。本文用公开分类器 DonkeyRail（BLEU、ROUGE-L、METEOR 特征组合）在受控的三 agent 邮件中继里检验这一区分：默认阈值下分类器漏掉 19 条功能性输出中的 8 条，同时误报 192 条合法回复中的 70 条，所有完整引用与模板复用回复都触发误报；为低误报率重校阈值后，在新模板集上只检出 1 条功能性输出、仍有 15 条误报。作者还发现全部 21 个已发表的分类器配置都存在工作点错误（用 ROC 插值代替直接阈值应用），并形式化证明：对表层文本标准的高 AUC 不能保证对行为目标的高 AUC。授权分析进一步表明，相同的可见 transcript 在不同治理策略下可能需要不同的安全决策，这是任何纯观测分类器都无法分辨的。", "supplement": false}, {"title": "Procedure without Judgment: What Small Language Models Learn under an Exact Verifier", "authors": "Arunkumar V 等（Manoranjan Gandhudi、Gangadharan G. R.、Arun Prakash、S. Senthilkumar）", "url": "https://arxiv.org/abs/2611.21529", "category": "arXiv 预印本 / cs.AI、cs.CL、cs.LG（2026-11-16 发布）", "cats": ["cs.AI", "cs.CL", "cs.LG"], "oneliner": "授权策略拒绝一次 agent 工具调用时，审计日志应该只写迫使该决策的事实、不多不少；本文用“最小充分理由可精确计算”的设定，检验模型能从一个零误差验证器里学到什么。", "insight": "这篇与我们的“逐 AU 求值、未知 AU 默认拒绝”直接咬合在解释与审计一环。第一，它给了一个可引用的设计原则：**拒绝的审计理由应该是最小充分理由**——我们的 AU 求值在拒绝时，日志里应当写“哪个 AU、哪条策略迫使拒绝”，而不是把整条策略或整段上下文都倒出来；这可以写进机制设计里作为审计粒度。第二，它的“不迁移”发现是个警告：不要把在某个策略上训出的解释器当通用解释器——如果我们要给拒绝理由配一个学习式解释器，必须按策略族分别评估最小性，不能只报充分率。第三，它与下一篇（Optimistic Verifiers Get Hacked）是同一组、同一 oracle 的两篇姊妹文，合起来说明“精确验证器让训练效果变得可读，但不让训练变好”——对我们的方法论含义是：评测授权正确性时，精确的策略 oracle 是好标尺，但不要指望靠它训出更好的模型。诚实标注：实验用的是合成的可执行策略与小规模解释任务，不是真实生产策略；“92%”只在训过的策略上成立，泛化数字是 94% 充分 / 48% 最小，不要只引前者。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "当授权策略阻止一次 agent 工具调用时，审计日志应当写明迫使该决策的事实，且只写这些事实。对可枚举上下文空间上的可执行策略，这个最小充分理由可以精确算出，因此解释是按 ground truth 打分、而不是按代理指标打分。解释器每次只看到一个请求与一个决策、看不到策略本身，有 30 轮机会调用策略（改请求、问候选事实集是否充分）。前沿模型只靠工具时约一半时间能找到精确理由，一句“把答案缩短”的提示把 Haiku 4.5 从 58% 提升到 75%；一个 4B 模型在 2,000 条删除算法轨迹上微调后，在训过的策略上达到 92%。起作用的是教师种类：同等数据量下算法教出的学生全面领先前沿模型教出的学生。但学生学到的是固定的充分性检查日程，不迁移：在三个未见过的公开策略上，答案仍充分（94%）、但不再最小（48%）；用精确奖励做强化学习不提升 held-out 准确率，反而把策略从“探测策略”翻转为“把预算全花在充分性检查上”。", "supplement": false}, {"title": "Optimistic Verifiers Get Hacked: Reward Hacking Under an Exact Process Oracle", "authors": "Arunkumar V 等（与上一篇同一作者组）", "url": "https://arxiv.org/abs/2611.21538", "category": "arXiv 预印本 / cs.LG、cs.AI、cs.CL（2026-11-16 发布）", "cats": ["cs.LG", "cs.AI", "cs.CL"], "oneliner": "把可执行授权策略（Cedar、OPA、Gatekeeper 等 14 个真实策略）编译成精确的过程奖励，证明“乐观的验证器会被 padding hack”：代理指标冲到 0.940，真实忠实度却从 0.731 跌到 0.667。", "insight": "先诚实标注：这篇的核心是 RL 的奖励 hack，不是访问控制——授权策略在这里只是 testbed 的原材料，不要把它写成一篇访问控制论文。它的价值在两处，且都是工具与方法论层面的。第一，**副产品是现成的 testbed**：14 个真实公开策略（Cedar、OPA、Gatekeeper）被移植成可执行 oracle——如果我们要验证自己的 AU 求值语义或拒绝解释机制，这套 oracle 是可以直接拿来用的策略语料，比自己手写 toy 策略可信得多。第二，它对我们的方法论是个警告：**不要用代理指标评估授权正确性**——充分性代理冲到 0.940、真实忠实度却在跌；同理，若我们用 LLM 评判或“理由看起来充分”来评估 AU 求值，会系统性高估；“充分”与“真实”是两个维度，评测时要分开报。第三，它与上一篇姊妹文合起来，说明“精确验证器让训练效果可读、不让训练变好”，这对我们“评测节标题、扩展表移附录”的待拍板事项也有参考：评测设计要先讲清标尺，再讲数字。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "用可验证奖励做强化学习，会继承验证器本身的错误。在数学与代码之外，验证器是代理、评分 rubric、学出的评判器或手写检查器，它与真实目标的距离从未被测量，因此奖励上升无法与 hack 区分。本文建了一个真实奖励在过程级可精确计算的设定：124,416 个上下文上的可执行授权策略构成一个 oracle，能列出每个决策的全部最小充分理由。作者把这些策略编译成精确过程奖励，再沿七个现实维度退化验证器（只看结果、只看充分性、只看召回、抽取噪声、粗分类、陈旧策略、LLM 评判），逐个训练并用精确验证器打分。出现四种表型：乐观验证器会被 padding hack——充分性代理指标冲到 0.940，而真实忠实度在 96 个 held-out 案例上从 0.731 跌到 0.667；只看结果的验证器会饱和、不再教学；噪声稀释；保序的差距无害。对验证器的无模型审计（选择误差与差距符号）加一次短饱和试点，可以预判一次训练会落入哪种表型。九种配置、两种框架、两种厂商的复现中表型稳定出现。本文释放了 testbed、训练仪器与 14 个真实公开策略（Cedar、OPA、Gatekeeper）移植成的可执行 oracle。", "supplement": false}, {"title": "Beyond One-to-One Targeted Messaging: A Unified Recipient-Scoped Visibility Architecture for Multi-Participant Generative AI Conversations", "authors": "Jincheng Zhang（单作者）", "url": "https://doi.org/10.5281/zenodo.24269343", "category": "Zenodo 预印本（概念架构，未经同行评审）", "cats": [], "oneliner": "提出通用接收者范围可见性控制（URVC）：一条消息属于共享对话、与它对谁可见，是两个独立的属性；每条消息关联显式的接收者集合，只有授权接收者能访问。", "insight": "这篇与我们的 RU/AU 解耦在概念上同构，只是平面不同：它把“消息可见性”从“对话成员关系”里解耦出来，正如我们把“授权单元”从“检索单元”里解耦出来；它的“接收者感知的上下文构造”就是消息平面的 retrieve-then-project（按接收者裁剪上下文），可以在相关工作里作为跨平面类比引用，说明“按接收者/按 AU 切分可见性”是不同平面上反复出现的同一设计模式。它的“抵抗通过 AI 生成摘要的间接泄露”也与我们的 embedding 通道泄露同构：摘要与 embedding 一样，都是绕过文本裁剪的间接通道。诚实标注：这是 Zenodo 上的纯概念架构、无实验、无评估、无同行评审，引用时只取架构思想，不取任何效果数字；作者是单作者、此前未见于该领域主流 venue，权重按概念提案计。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "多参与者的生成式 AI 环境把对话从人机一对一变成了多人、多模型、多 agent 的协作空间；现有消息范式没有一个通用机制，让发送者在发送时独立决定一条消息对每个参与者的可见性——一条只想给某人看的消息，不应仅仅因为大家共享同一对话环境就自动对所有人可见。本文提出通用接收者范围可见性控制（URVC）：消息在共享对话中的成员关系与消息可见性是独立属性；每条消息关联显式定义的接收者集合，访问只授予授权接收者，而非从周围对话的成员关系自动继承。架构包括接收者范围的消息表示、独立的可见性策略、授权执行层、接收者感知的上下文构造与受控的信息传播，并建立形式化保密目标：接收者隔离、未授权上下文排除、附件级保护，以及抵抗通过 AI 生成摘要与跨模型通信的间接泄露。与只在界面上对未授权者隐藏消息的做法不同，URVC 把可见性当作底层信息处理架构的可强制属性。", "supplement": false}]}, {"date": "2026-11-17", "summary": "", "papers": [{"title": "Scaling LLM Agent Tool Access: The MCP Gateway", "authors": "Mingxin Li 等（共 30 位作者；通讯：Haipeng Dai、Shunmin Zhu）", "url": "https://doi.org/10.1145/3828523.3857007", "category": "会议论文 / 2026 ACM SIGOPS Annual Technical Conference（SIGOPS ATC 2026，2026-11-15—18，香港）；预印本 arXiv:2607.15593", "cats": [], "oneliner": "一个云端 MCP 网关系统：打破 agent 与工具直连的模式，把遗留服务接入、不兼容 MCP 变体归一、访问控制、工具推荐、会话感知路由全部收到网关层，实测可把 agent 的工具挂载规模扩展到 3,000+ 个。", "insight": "这是今日与我们新方向（执行时授权绑定）咬合最紧的一篇，但它是一篇系统论文、不是安全论文，要分清它给了什么、没给什么。第一，它提供了一个“授权绑定发生在模型之外、调用之前”的已部署实例：访问控制被收到网关层、由确定性的网关策略执行，而不是由模型自己决定能不能调某个工具——这正是我们主张的“绑定点必须在不可信内容进入推理之前”的工程对应物，写相关工作时可以并列引用，说明这条路线在工业界已有落地。第二，它的粒度恰好标出了我们工作的下一层：网关绑定的是工具的**可用集合**（这个调用方能不能调这类工具），不绑定调用的**具体参数**（调的时候传什么收件人、金额、目的地）；而上周 CCS'26 海报证明的“检查—执行鸿沟”正发生在参数层。我们的 AU 求值若只做到“这个 AU 可见/不可见”，会在参数层留一个同构的口子；讨论节可以写：工具可用性绑定是必要条件，参数级绑定是充分条件的另一半。第三，它的工具推荐（混合检索、约 98% Top-15 召回）本身就是一个检索步骤：工具描述是可被攻击者投毒的文档，推荐器按相关性排序——这与 RAG 的检索投毒是同一威胁模型，只是投毒对象从“文档”换成了“工具描述”；我们的 T2（可见排序向量）分析框架可以直接平移到工具平面，这是一个值得在威胁模型节提一句的类比。诚实标注：该文未报告任何安全评测（没有注入攻击成功率、没有绕过率），引用时只取其架构与部署事实，不取任何安全效果数字；“3,000+ 工具、98% 召回”是在阿里云生产流量上的数字，场景是云资源操作类工具，泛化到通用 agent 工具集时需谨慎。", "source": "OpenAlex", "citations": "OpenAlex 3 次", "code": "无", "zh_abs": "LLM agent 越来越依赖工具调用，MCP 虽然统一了调用接口，但在生产部署里工具接入很难扩展：遗留服务不能直接被 MCP 调用、协议快速演进带来兼容成本；agent 侧挂载工具数受上下文窗口与推理开销限制，挂多了会增加 token 用量、延迟并降低任务成功率；多副本有状态 MCP 后端还要维护会话亲和性，增加客户端复杂度。本文提出一个云端 MCP 网关：数据面不再直连，转换模块支持云上 315 个 OpenAPI 服务、归一多种 MCP 传输变体；会话感知路由把网关层与 MCP 服务层的扩展性解耦；混合检索引擎保持约 98% 的 Top-15 召回率，工具选择准确率随规模提升而非下降；系统已在生产环境连续运行 8 个月，作者分享了部署经验教训。", "supplement": false}, {"title": "Mitigating Membership Inference in Intermediate Representations with Differentially Private Training", "authors": "Jiayang Meng 等（中国人民大学、闽江大学）", "url": "https://arxiv.org/abs/2602.22611", "category": "arXiv 预印本 / cs.LG（2026-02-26 发布，2026-05-11 修订 v2）", "cats": ["cs.LG"], "oneliner": "针对“中间表示会泄露成员信息”的问题，提出按层感知成员推断风险的差分隐私训练方法 LM-DP-SGD：先用影子模型估计每一层的 MIA 风险，再按风险比例分配隐私保护强度。", "insight": "这篇与我们论文 embedding 通道一节的咬合点很具体。第一，它给了一个可引用的事实：**MIA 风险在各层之间是异质的，模型的整体脆弱性由最脆弱的那一层决定**——这与我们的发现同构：全文 embedding 索引下 cloze 攻击可达 89.4%@20，即使文本被裁剪、embedding 本身仍是泄露面；“最脆弱的表示决定整体泄露”可以作为我们“只裁剪文本不够、必须按授权视图重编码”这一结论的旁证。第二，它提供了一个与我们方案对照的防御坐标：LM-DP-SGD 是在**训练时**用差分隐私压低表示的成员信号，我们的按授权视图重编码是在**服务时**按 AU 切分表示空间；两者一个治训练侧、一个治服务侧，可以在相关工作里并列，说明“表示层泄露”同时需要训练时与服务时的两层缓解。第三，它的逐层风险估计方法（影子模型 + 逐层攻击器 + 攻击错误率作风险度量）对我们有方法论借鉴：如果我们要量化“重编码后残留泄露在哪些层/哪些维度上最顽固”，可以复用同一套“先估计、再按风险分配”的思路，而不是对所有维度一视同仁。诚实标注：该文研究的是 EaaI 场景下的成员推断，不是 RAG 检索授权，与我们的 RU/AU 解耦没有直接对应关系，关联是方法论与泄露面层面的、不是机制层面的；摘要未给出任何具体数字（无攻击成功率下降百分点、无效用损失数字），引用时不取效果数字，只取方法与结论；它是 2026 年 2 月首发、5 月修订的预印本，今日是经 S2 重新索引后首次进入我们的抓取视野，**不是今日新发表**，时效性上不要误读。", "source": "SemanticScholar", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "在 Embedding-as-an-Interface（EaaI）场景里，预训练模型被查询输出中间表示（IRs），其分布特性会泄露训练集成员信号，使成员推断攻击（MIA）的强度随层而异；已有的 DP-SGD 虽能缓解泄露，但采用逐样本梯度裁剪与统一的层无关噪声乘子，忽略了各层 MIA 脆弱性的异质性。本文提出 Layer-wise MIA-risk-aware DP-SGD（LM-DP-SGD）：先在公开影子数据集上训练影子模型、抽取各层 IRs 并拟合逐层 MIA 攻击器，以攻击错误率作为该层的 MIA 风险估计；利用 MIA 的跨数据集可迁移性，把这些估计用于在私有训练中重加权各层对全局裁剪梯度的贡献，在固定噪声量下实现按层适配的保护。作者还给出了隐私与收敛性的理论保证，实验表明在相同隐私预算下，LM-DP-SGD 在保持效用的同时降低了 IR 层面的峰值 MIA 风险，隐私—效用权衡优于基线。", "supplement": false}]}, {"date": "2026-11-16", "summary": "", "papers": [{"title": "CapGuard: Runtime Authorization for Gemma 4 Coding Agents", "authors": "Athul@20（Kaggle writeup 署名）", "url": "https://doi.org/10.34740/kaggle/w/121545", "category": "开源工具 / Kaggle 竞赛 writeup（Google Gemma 4 Developer Agent 竞赛，2026-11-13 发布）", "cats": [], "oneliner": "一个给 LLM agent 用的能力（capability）安全包：工具的可用集合在 agent 看到任何不可信内容之前就按用户原始请求定死，即使模型本身已被注入攻陷，未授权的工具在程序层面就是不可用的。", "insight": "这是今日唯一与我们工作直接咬合的条目，价值不在“又一个防御”，而在它把“授权”落到了一个与我们主张相同的执行位置。第一，它的“工具可用集合在看到不可信内容之前定死”，就是“执行时授权绑定”在工具可用性这一层的实例化：批准（用户原始请求里隐含的授权意图）被编译成一个不可再被模型推理改写的确定性集合，注入发生之后再想扩权已经没有入口；这与我们“AU 求值发生在检索结果进上下文之前”是同一原则在不同对象上的应用，写相关工作时可以并列引用，说明“绑定要发生在不可信内容进入推理之前”正在成为 agent 安全的共识做法。第二，它的局限恰好标出了我们工作的下一层：CapGuard 绑定的是工具的**可用性**（能不能调这个工具），而不绑定调用的**具体参数**（调的时候传什么收件人、金额、目的地）；上周 CCS'26 海报证明，检查通过之后、执行之前的一次运行时变换就能产出未经检查的载荷——参数层面的“检查—执行鸿沟”仍在。我们的 AU 求值若只做到“这个 AU 可见/不可见”，同样会在参数层留一个同构的口子；讨论节可以写：工具可用性绑定是必要条件，参数级绑定（收件人、金额、目的地必须出自用户请求原文）是充分条件的另一半，CapLite 的“写操作在读任何工具结果前提交、只认用户请求里写明的收件人与金额”已经朝这个方向走了一步。第三，它的分类器本身仍是模型判断（OpenAI/Ollama 分类器），这与我们“AU 求值必须是确定性的、不依赖模型判断”的立场形成对照：分类器看的是用户原始请求、相对安全，但只要判定依赖模型，就仍有被对抗样本绕过的可能；我们的 AU 求值若能坚持确定性策略语言，这一点就是对 CapGuard 的明确改进点。诚实标注：这不是同行评议论文，是 Kaggle 竞赛 writeup + PyPI 开源包，未见独立的评测数字（README 里“10–50ms”是作者自述，未见第三方复核；其引用的 arXiv 论文标题未能核对到具体 arXiv ID），引用时只取其机制设计，不取任何效果数字；Gemma 4 编码 agent 只是竞赛场景，包本身通用。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "github.com/capguard/capguard（star 数本次未取到；PyPI 包 capguard 最新 0.1.6）", "zh_abs": "每个带工具访问权限的 LLM agent 都暴露在 prompt 注入之下：注入内容可以诱使模型调用本不该调用的工具、把敏感数据发出去。CapGuard 不靠“让模型更谨慎”来防御，而是把能力安全（capability-based security）做成一个前置的执行器：在 agent 接触任何外部内容之前，先根据用户的原始请求确定它本次可用的工具集合，之后无论模型被注入成什么样，未授权工具的调用都会在程序层面抛 `PermissionDeniedError`，而不是依赖模型的自我约束。判定工具是否授权的分类器只看用户原始请求、不看可能藏有注入载荷的外部内容；作者称分类增加约 10–50ms 延迟，相对 LLM 推理的 1–5 秒可忽略。包本身是模型无关的（GPT、Claude、Llama 均可），提供 OpenAI/Ollama 与 LangChain 集成，设计上受 Google Research 的 CaMeL（以架构设计击败 prompt 注入）启发。Kaggle writeup 的标题点明它面向 Gemma 4 编码 agent，但包本身是通用 agent 循环的组件。", "supplement": false}]}, {"date": "2026-11-15", "summary": "", "papers": [{"title": "POSTER: Evaluating Mitigation Strategies Against Prompt Injection Attacks in Retrieval-Augmented Language Models", "authors": "Denis Biewer、Misha Glazunov、Theodor Schnitzler", "url": "https://doi.org/10.1145/3830454.3846434", "category": "会议海报（ACM CCS 2026，2026-11-14 发表）", "cats": [], "oneliner": "在一套受控的 HotpotQA 衍生实验里，把 RAG 的 prompt 注入防御按检索、提示词、输出三个阶段拆开单测：各阶段只对特定攻击有效，没有任何一个单阶段能广谱兜底。", "insight": "这是今日与我们工作咬合最紧的两篇之一，直接支撑“架构级授权”的立论。第一，它的否定性结论——“没有单阶段防御能广谱兜底”——与我们的 retrieve-then-project 形成对照：它的三个阶段都在“模型拿到内容之后”做缓解，而我们的 AU 求值发生在“检索结果进上下文之前”，属于它没有覆盖的第四个位置（检索前授权过滤）。写相关工作时可以这样定位：三阶段防御是模型内/模型后的缓解，我们的 per-view 索引与 retrieve-then-project 是检索前的授权，两者互补、不是替代关系。第二，它的三类攻击场景（指令跟随、外泄、知识污染）正好对应我们的 T1（仅见答案）与 T2（可见排序向量）的一部分：指令跟随型注入在 T1 即可发生，PoisonedRAG 的知识污染则需要 T2 视角的投毒能力；我们在写威胁模型时可以引用它的分类，说明三类攻击在哪个威胁层级上成立。第三，它的实验设计值得借鉴——“单一受控配置下隔离评估”，我们的 cloze 攻击评测目前是端到端数字，未来若要拆“哪一层防御贡献了多少”，可以采用同样的隔离式设计。诚实标注：这是一篇海报（poster），实验规模与完整论文不可比；结论限定在 HotpotQA 衍生配置与三类轻量防御上，未覆盖重量级防御（如微调、架构改造），引用时不宜读成“所有防御都不行”。", "source": "SemanticScholar", "citations": "Semantic Scholar 0 次", "code": "无", "zh_abs": "检索增强生成用检索文档为模型输出提供依据，但也在系统指令与不可信检索内容之间引入了一条信任边界。本文补齐既有 RAG 安全 benchmark 的一块空白：在单一受控的 HotpotQA 衍生配置下，把轻量防御按检索、提示词、输出三个阶段隔离出来，分别评估它们对三类攻击场景的效果——指令跟随型注入、数据外泄、PoisonedRAG 式知识污染。结果表明防御效果高度依赖攻击类型：检索与提示词防御降低了指令跟随的成功率，输出过滤阻止了用户可见的结构化泄露，检索多样化降低但未消除 PoisonedRAG 的成功率。结论是：分阶段防御有助于隔离各缓解措施的效果，但被评估的任何一个单阶段都无法在不付出效用或适用范围代价的前提下，对全部攻击提供广泛保护。", "supplement": false}, {"title": "POSTER: A Context-Consistent Attack Exploiting the Inspection--Execution Gap in Code-Executing Agents", "authors": "Pei Yan、Wenbo Guo、Xianbo Mo、Shunquan Tan、Jiwu Huang", "url": "https://doi.org/10.1145/3830454.3846448", "category": "会议海报（ACM CCS 2026，2026-11-12 发表）", "cats": [], "oneliner": "代码执行 agent 先静态检查、后执行，但运行时变换会产出未经检查的可执行载荷——作者用 LSB 隐写项目实例化这个“检查—执行鸿沟”，900 次试验打出 87.3% 攻击成功率。", "insight": "这是今日与 ChainBind 咬合最深的一篇，它的结论几乎就是我们“执行时授权绑定”的平行表述，值得在相关工作里并列引用。第一，它的攻击机制——“检查时看的 A、执行时跑的 B”——与我们的核心区分“批准不是执行”同构：批准时看到的检索结果（或代码产物）与执行时实际用的载荷之间存在一个变换窗口，窗口里的任何变换都使批准失效。我们的运行时绑定正是要关掉这个窗口；这篇提供了 87.3% 这个可引用的数字，说明窗口不关的代价。第二，它观测到的“agent 明确识别风险却仍然执行”与 CapLite 的结论呼应：模型内识别不等于模型外拦截，识别了也拦不住——这正是授权必须放在模型之外、由确定性检查点执行的又一证据。第三，它的“提取后授权检查点”建议与我们的 AU 求值位置可以对照：它主张检查点放在“载荷提取后、执行前”，我们主张 AU 求值放在“检索结果进上下文前”；两者都是“绑定到执行前一刻的精确对象”，可在讨论里写成同一原则在代码执行与检索两个场景下的实例。诚实标注：这是一篇海报，攻击实例化在单一隐写项目与固定脚手架上；87.3% 是在 9 个模型、canary 载荷上的基线数字，真实恶意载荷下的成功率未测；代码“已公开”但摘要未给仓库链接，引用时只取其机制与数字。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "代码执行 agent 常常依赖执行前的检查，默认静态检查过的产物就是之后要执行的产物。本文识别出一个“检查—执行鸿沟”：静态检查之后，一次运行时变换产出真正的可执行载荷，载荷直达代码执行汇点、全程未经检查。作者通过一个上下文一致的攻击实例化这一鸿沟：攻击藏在一个最低有效位（LSB）图像隐写项目里，一个“不覆盖”守则保住了攻击者预备的隐写图像，随后从中提取出内嵌的可执行载荷、送入执行汇点。作者用无害 canary 在同一固定 agent 脚手架上做 900 次基线试验，9 个 LLM 后端各 100 次，观测到 87.3% 的攻击成功率；还观测到 agent 明确识别出风险却仍然继续执行的轨迹，说明攻击成功不能只用“疏忽”来解释。作者还测试了 4 档逐步明确的检查指导提示词，效果因模型而异。结论是：应在执行前一刻设立一个“提取后授权检查点”，把检查与授权绑定到精确的、刚提取出的载荷上。", "supplement": false}, {"title": "MirrorGuard: Toward Secure Computer-Use Agents via Simulation-to-Real Reasoning Correction", "authors": "Wenqi Zhang、Yulin Shen、Changyue Jiang、Jiarun Dai、Geng Hong、Xudong Pan", "url": "https://doi.org/10.1145/3830454.3832704", "category": "会议论文（ACM CCS 2026，2026-11-12 发表）", "cats": [], "oneliner": "计算机操作 agent 的防御不必靠“检测到危险就 abort 任务”：MirrorGuard 用神经符号仿真生成高风险 GUI 交互轨迹做训练，在真实环境里拦截并修正不安全的推理链，把 UI-TARS 的不安全率从 66.5% 降到 13.0%。", "insight": "关联较弱，但有两个可借鉴的点。第一，它的“拦截并修正推理链、而不是 abort 任务”与我们的 retrieve-then-project 有类比：两者都不是“一刀切拒绝”，而是“在执行前把危险部分拿掉、保留安全部分继续跑”；区别在于它修正的是推理链、我们裁剪的是未授权片段，可在讨论里提一句类比，说明“裁剪式防御”在 agent 安全里是一个通用模式。第二，它的评估口径值得注意：同时报告不安全率下降（66.5%→13.0%）与误拒率（与 GuardAgent 对照高 15.4 个百分点），即“安全增益 + 效用代价”双指标；我们的 cloze 攻击评测目前只报攻击成功率，未来报告 retrieve-then-project 的裁剪代价时也可以采用“攻击成功率 + 良性效用损失”的双指标。诚实标注：这是计算机操作 agent（GUI 操作）的工作，与 RAG 访问控制的场景不同；仿真到真实的迁移效果依赖仿真管线的逼真度，本文的数字集中在 UI-TARS 等少数系统上，不宜作为核心引用。", "source": "OpenAlex", "citations": "OpenAlex 5 次", "code": "github.com/WhitzardAgent/MirrorGuard (★5)", "zh_abs": "大基础模型被集成进计算机操作 agent（CUA），通过图形界面自主操作系统、执行复杂任务；这种自主性带来严重安全风险：恶意指令或视觉 prompt 注入会触发不安全推理、导致有害的系统级操作。现有防御（如基于检测的拦截）能防止损害、但常常过早 abort 任务、损害 agent 效用。本文提出 MirrorGuard，一个即插即用的防御框架，用基于仿真的训练提升 CUA 在真实世界的安全性。为降低在操作系统里大规模训练的成本，作者提出一种新颖的神经符号仿真管线，完全在基于文本的仿真环境里生成逼真、高风险的 GUI 交互轨迹，捕捉不安全推理模式与潜在系统危害、无需执行真实操作。MirrorGuard 在仿真环境里学会在 CUA 产生并执行不安全动作之前拦截并修正不安全的推理链。在真实世界测试中，跨多项 benchmark 与 CUA 架构的大量评估表明 MirrorGuard 显著缓解安全风险：例如在字节跳动的 UI-TARS 系统上，它把不安全率从 66.5% 降到 13.0%，同时保持很低的误拒率；相比之下，最先进的 GuardAgent 只降到 53.9%，且误拒率高 15.4 个百分点。作者证明仿真中习得的防御可以提供稳健的真实世界保护、同时保持 agent 的基本效用。代码与模型已公开。", "supplement": false}, {"title": "ReA-Bench: Benchmarking Responsible Agent Auditing", "authors": "Zipeng Ye、Shenyu Dai、Yong Xie、Kun Wang、Jiyang Guan、Zhikai Chen、Jiaqi Weng、Jialing Tao、Hui Xue", "url": "https://arxiv.org/abs/2611.16493", "category": "arXiv 预印本（cs.AI，2026-11-12）", "cats": ["cs.AI"], "oneliner": "现有 agent 审计 benchmark 只报总体召回、看不出审计员在哪类风险上失手；ReA-Bench 把审计挑战分成六层，并配“看起来危险、实则合规”的困难良性样本与成对轨迹版本。", "insight": "关联中等，但它对“审计”的诊断思路与我们的“授权”工作有直接接口。第一，它的六层里有一层是“来源与推理验证”，另一层是“缺失信息”，这两层正好对应我们的两个评估问题：审计员能否验证一个动作的来源（是否来自授权片段）、以及信息缺失时是否误判。我们的 cloze 攻击评测若要扩展到“审计员能否事后发现泄露”，可以直接借用它的六层结构来组织评估维度。第二，它特意包含“看起来危险、实则与任务及其授权一致”的困难良性样本——这个设计对我们有直接提示：评估 AU 求值（或任何授权检查）时，良性样本不能只用“显然安全”的请求，必须包含“看起来越权、实则已授权”的边界样本，否则会高估检查的准确率。第三，它的“成对轨迹版本”（缩短轨迹 / 补足信息后重测）是一个干净的消融设计，我们在报告 per-view 索引与 retrieve-then-project 的对比时可以借鉴“同一任务、两种信息条件”的成对比较。诚实标注：这是一篇 benchmark 论文，本身不提供防御机制；六层的划分是作者的诊断框架，其完备性未经独立验证；多数样本来自“真实生产轨迹”但经人工改编，可复现性取决于后续公开程度。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "随着 agent 在本地与云端自主执行任务，审计其执行轨迹可以帮助服务方识别风险、改进 agent  harness 与基础模型。作者对生产与红队轨迹的分析表明，某些风险在各种审计配置下都会被反复漏掉；总体召回掩盖了“哪类风险被漏掉”以及“更高的召回是否以更多误报良性行为为代价”。既有 benchmark 对这些失效提供的洞见有限：生成的轨迹可能包含不一致的工具调用与响应、显眼的风险动作或重复的攻击模式；按风险类型分组结果也难以分辨审计员是“忽略了证据”“接受了无支撑的结论”还是“缺少判断所需的信息”。本文提出 ReA-Bench，一个面向负责任 agent 行为审计的诊断型 benchmark：把审计挑战组织为六层——内部安全知识、轨迹内矛盾、长上下文中的证据检索、来源与推理验证、间接引导、缺失信息；包含困难的良性样本——其中动作看起来有风险、但与任务及其授权一致；还提供成对的轨迹版本，测试审计员在轨迹缩短或补足缺失信息后是否更可靠地检出同一风险。多数样本取自真实生产轨迹，经人工挑选与改编，保留了现实任务与 plausible 的风险。", "supplement": false}, {"title": "Janus: Characterizing Bidirectional Privacy and Security Risks in LLM-Integrated Android Apps", "authors": "Junhua Guo、Zongze Li、Haipeng Cai", "url": "https://doi.org/10.1145/3830454.3846749", "category": "会议论文（ACM CCS 2026，2026-11-12 发表）", "cats": [], "oneliner": "LLM 接入移动应用后风险是双向的：敏感用户数据流向模型端点、模型生成文本又流回应用逻辑；Janus 首次系统刻画了这类双向风险，发现客户端密钥外泄、敏感数据外包无披露、响应二次泄露等反复出现的模式。", "insight": "关联较弱，但“双向”这个 framing 对我们写威胁模型有提示。第一，我们的 T1/T2/T3 按攻击者“能看到什么”分层，默认数据流向是“检索→模型→答案”的单向；Janus 提醒我们，LLM 集成里的数据流是双向的——用户数据流向模型、模型输出又流回应用逻辑并可能被二次利用。我们的 RAG 场景里同样存在一条回流：模型输出（答案）可能被下游组件、日志或下一轮检索再次消费；若答案里混入了未授权片段，回流就是二次泄露通道。写威胁模型时可以在 T1 里补一句“答案的下游复用”作为外泄面的延伸。第二，它的发现“客户端内嵌 API 密钥与系统提示词外泄”与我们的“授权配置保密”问题同源：把敏感配置（密钥、系统提示词、审批设置）放在客户端或提示词里，本身就是泄露面；我们的 AU 策略独立存放、不进模型上下文，恰好避开了这一面。诚实标注：这是移动应用安全的工作，场景与 RAG 访问控制不同；静态分析 + 多智能体推理层的分类方法，其误报率在摘要中未披露，引用时只取其“双向风险”的概念框架。", "source": "OpenAlex", "citations": "OpenAlex 0 次", "code": "无", "zh_abs": "大语言模型快速集成进移动应用，带来一类既有分析技术难以应对的隐私与安全风险。与传统的第三方服务集成不同，LLM 集成是双向的：敏感用户数据作为精心构造的提示词的一部分流向模型端点，模型生成的文本又流回应用逻辑、UI 界面、通知与下游 API；两个方向都引入了独特风险，包括数据泄露、模型输出的不安全复用与输入安全弱点，此前未被系统地大规模研究。本文提出 Janus，一种对 Android 应用中端到端 LLM 交互管线做静态分析的方法：恢复请求构造语义、识别响应入口点及其下游传播，并用一个多智能体推理层对隐私与安全相关发现分类。作者先在精选的微 benchmark 套件上评估 Janus，再用它首次系统刻画 LLM 集成 Android 应用中的隐私与安全风险，发现这类风险在实践中普遍存在，反复出现的类别包括客户端密钥外泄（如内嵌的 API 密钥与系统提示词）、敏感数据外包给第三方 LLM 服务且无相应披露、LLM 响应向下游组件的二次泄露，以及 prompt 注入易感的处理等易感性；并给出代表性案例，说明这些风险如何在已部署应用中显现、能造成何种具体危害。按伦理流程，作者已向受影响开发者负责任地披露了关键发现。", "supplement": false}, {"title": "Scale-Induced Semantic Shift in Visual Prompt Injection Against VLMs and Web Agents", "authors": "Yiheng Zhao、Runze Ji、Chenyu Yi、Yi Yu、Bingquan Shen、Alex Kot、Xudong Jiang", "url": "https://arxiv.org/abs/2611.16744", "category": "arXiv 预印本（cs.AI，2026-11-12）", "cats": ["cs.AI"], "oneliner": "多媒体预处理会改写图片的机器可读语义：一段文字指令在 512×512 下读不出来、激进下采样后却能被读出；作者把这种“尺度诱导语义漂移”做成攻击，在 4 个闭源视觉语言模型上平均打出 58.75% 的攻击成功率。", "insight": "关联较弱，但它揭示了一个与我们工作平行的“变换窗口”问题。第一，它的攻击本质是“检查时看的（512×512 呈现）与模型实际读的（下采样后）不是同一份内容”——与上一篇海报的“检查—执行鸿沟”同构，只是发生在多媒体预处理环节。我们的 RAG 场景里同样存在变换窗口：chunk 在索引、切分、重编码等环节会被变换，AU 求值若只绑定在变换前的文本上，变换后就可能失效；写配套机制时可以把“绑定对象必须是执行时实际进入上下文的精确片段”作为一条明确原则，两篇合起来就是两个场景的证据。第二，它的 web agent 实测值得注意：隐藏指令感知率提升了，但绝对行为攻陷率只有约 4%——“能被读出”不等于“能被执行”，这与我们的立场一致：攻击成功率要按“最终行为”而非“中间感知”来报告，否则会高估风险。第三，它的 ScaleGuard（跨尺度一致性检测）提示了一种防御思路：对同一内容做多尺度/多视图比对、不一致即告警；我们的 retrieve-then-project 在裁剪后也可以做一次“裁剪前后一致性”校验。诚实标注：这是视觉 prompt 注入的工作，与文本 RAG 访问控制的场景不同；58.75% 是在作者的 300 例 benchmark 与 4 个闭源模型上的数字，跨模型与跨预处理管线的普适性未验证；4% 的行为攻陷率说明其现实危害目前有界。", "source": "arXiv", "citations": "尚未收录", "code": "无", "zh_abs": "多媒体系统中的视觉内容在被视觉语言模型解读之前，可能会被缩放、压缩或重新渲染。本文研究一种安全失效模式：这些变换会改变图像的机器可读语义——一段文字指令在 512×512 的呈现分辨率下按作者的评估协议无法被恢复，但在激进下采样后却变得可恢复。作者把这一行为形式化为尺度诱导语义漂移（SISS），并开发了一个闭环黑盒框架，结合双尺度验证、选择性自硬化、浅层低秩适配与像素空间噪声正则化。在一个固定的 300 例 benchmark 上，第三轮 SISS 精炼在 4 个闭源视觉语言模型上取得 58.75% 的平均攻击成功率，而最强的生成基线为 41.08%。受控扫描把效应限定在激进压缩区间：在 128×128、224×224、336×336 下，平均成功率分别降至 17.68%、6.85%、5.60%。在下游 web agent 研究中，生成的图片提升了隐藏指令的感知率，但绝对的行为攻陷率仍在 4% 左右。通用输入变换在单独的防御协议里几乎不提供保护，而作者提出的 ScaleGuard 一致性检测把非自适应攻击成功率从 61.4% 降到 24.3%、一轮防御感知攻击从 42.5% 降到 15.0%，且在匹配的干净对照上无观测到的拒识。结论是：多媒体预处理中存在有界但可复现的语义不一致，呼吁尺度一致的视觉语言推理。", "supplement": false}]}], "total": 36, "n_days": 7, "all_total": 264, "all_days": 53};

let XW = {"date": "2026-11-19", "accounts": {"elonmusk": {"name": "Elon Musk", "label": "马斯克", "group": "other", "avatar": "https://pbs.twimg.com/profile_images/2103567689515954176/aR-Kjpp4_400x400.jpg", "tweets": []}, "realDonaldTrump_truth": {"name": "Donald Trump", "label": "特朗普 · Truth Social", "group": "other", "avatar": "https://pbs.twimg.com/profile_images/874276197357596672/kUuht00m_400x400.jpg", "tweets": [{"id": "117636323928351024", "text": "I am now heading to China, from the Philippines, where we had a wonderful meeting on Trade, National Security, and other subjects. I am pleased to announce that we made a new and completely different Trade Deal with the Philippines, one that will be a true landmark and, in particular, a Deal that will be great for our Farmers and those in the business of “Energy.” President Marcos is a powerful leader, and a man of high integrity and substance. It was an Honor to be with him, and his beautiful wife and son. See you in China! President DONALD J. TRUMP（宣布与菲律宾达成新的贸易协议，称将利好美国农民与能源行业，随后启程前往中国）", "created_at": "11-18 15:44", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#117636323928351024", "author": "realDonaldTrump"}, {"id": "117634741427255539", "text": "Thank you, BIG John. You are great!!! President DJT（致谢高尔夫球手 John Daly，附其谈与特朗普打球经历的 YouTube 短视频链接）", "created_at": "11-18 09:01", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#117634741427255539", "author": "realDonaldTrump"}, {"id": "117634065135557984", "text": "Biggest drop in gasoline in 18 years. Notice that they waited until after the “Election?” President DJT（转发 @Schoenlaw 帖文：上周全美汽油零售价创 18 年来最大单周跌幅）", "created_at": "11-18 06:09", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#117634065135557984", "author": "realDonaldTrump"}]}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2123191365983248653", "text": "We're sharing new data on how AI is changing research at OpenAI.\n\nWe find researchers' AI use continues to rise exponentially, and agents are completing longer tasks, but human involvement remains central in research. Researchers are also spending more time on safety and alignment, with human effort in these areas growing faster than in any other individual research area.\n\nThis report aims to increase transparency around research acceleration and inform the governance of increasingly capable AI. We believe that AI labs should be required to track and publicly report indicators of recursive self-improvement (RSI): the process by which AI accelerates the development of future AI systems. \n\nOur hope is that this expanded report will help sustain and advance shared measurement norms across the industry.\n\nhttps://openai.com/index/research-acceleration-jagged-frontier/", "created_at": "11-19 07:07", "likes": 2022, "reposts": 200, "replies": 197, "views": 316569, "url": "https://x.com/OpenAI/status/2123191365983248653", "author": "OpenAI"}, {"id": "2123165872261075233", "text": "We’re sharing how we approach safety at every stage of a model’s lifecycle, from early research to internal use to public deployment.", "created_at": "11-19 05:26", "likes": 1384, "reposts": 60, "replies": 150, "views": 196090, "url": "https://x.com/OpenAI/status/2123165872261075233", "author": "OpenAI"}, {"id": "2123100386638877054", "text": "Working with @AMD, our models identified up to 14% PPA improvement on flagship GPU IP in less than five months—building on designs AMD’s engineers had already spent years optimizing.\n\nThe same approach helped improve Jalapeño, our first custom inference chip, with gains verified on real silicon.\n\nNew evaluations also show our models getting better at certain chip design tasks.\n\nWe’re sharing these results and how we’re working with @Synopsys to bring our model capabilities and their trusted EDA design and validation tools to more chip designers.\n\nhttps://openai.com/index/advancing-chip-design-with-our-models/", "created_at": "11-19 01:05", "likes": 4150, "reposts": 374, "replies": 349, "views": 706361, "url": "https://x.com/OpenAI/status/2123100386638877054", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2123148320071938510", "text": "Proud of what we built here! Codex can use the tools you already work with, and you decide what it can access. Here’s how we built the sandbox that makes that possible: \nhttps://openai.com/index/inside-the-codex-sandbox/", "created_at": "11-19 04:16", "likes": 73, "reposts": 6, "replies": 10, "views": 17676, "url": "https://x.com/ithilgore/status/2123148320071938510", "author": "ithilgore"}, {"id": "2123146093366333850", "text": "A lot has happened in the past couple months, to say the least.\n\nToday we are sharing a recap of what it takes to move a frontier model from training to internal use to public release. As model capabilities rise, so do the safety and alignment standards required to move forward to the next stage.\n\nTo meet these standards, we rely on four layers of protection:\n1. Model alignment: train models to reliably act as intended and respect human oversight.\n2. Security and sandboxing: restrict what models can access and affect.\n3. Blocking safeguards: stop harmful or unauthorized actions before they happen.\n4. Monitoring and response: detect concerning behavior and intervene.\n\nThe post brings together efforts from across the company, with links to recent research, technical work, and incident reports we’ve published. This is the baseline operational discipline we owe people as we continue training and deploying models - necessary work, but not a solution to alignment in the limit. There’s a lot more to do, and will continue keeping you informed as the thinking and work evolves. 🏗️\n\nhttps://openai.com/index/managing-frontier-ai-risk/", "created_at": "11-19 04:07", "likes": 455, "reposts": 49, "replies": 37, "views": 151343, "url": "https://x.com/kaicathyc/status/2123146093366333850", "author": "kaicathyc"}, {"id": "2123103873166381287", "text": "So fun to do DealBook with my friend and partner of 11 years, @gdb. Thrilled the world got to see the brilliant, fiercely determined leader I have the privilege of working with every day.\n\nGreg’s role at OpenAI has evolved from writing code 100 hours a week in the early days to now leading some of the hardest and most consequential parts of our business.\n\nOne thing that has not changed is his extraordinary commitment to our mission. I can say with confidence that OpenAI would not exist without Greg, and I believe the world would be on a much worse path toward the AI future without him.", "created_at": "11-19 01:19", "likes": 3372, "reposts": 117, "replies": 356, "views": 359134, "url": "https://x.com/sama/status/2123103873166381287", "author": "sama"}, {"id": "2122798042734633452", "text": "Although the new models are very smart, we have more work ahead of us on making the models nice to work with, and will prioritize that for upcoming releases.\n\nBut even if it takes a little extra work, the intelligence and capability are extraordinary.", "created_at": "11-18 05:04", "likes": 3356, "reposts": 105, "replies": 336, "views": 393938, "url": "https://x.com/sama/status/2122798042734633452", "author": "sama"}, {"id": "2122798039899263456", "text": "6.2 Sol and Astra are out.\n\nThese models can do amazing things and are very token-efficient; we hope people will get great value from them.\n\nIn particular, 6.2 Sol ultrafast is something I think people will really enjoy.", "created_at": "11-18 05:04", "likes": 9884, "reposts": 453, "replies": 946, "views": 806706, "url": "https://x.com/sama/status/2122798039899263456", "author": "sama"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": []}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2123188224847982655", "text": "Set “completion_window” to “2h” for 30% less per token than Standard, or “8h” for 40% less.\n\nSet a continuation ID when you send the notes and reuse it on follow-up requests to give them higher queue priority.\n\nhttps://developers.openai.com/api/docs/guides/background", "created_at": "11-19 06:54", "likes": 76, "reposts": 2, "replies": 2, "views": 11585, "url": "https://x.com/OpenAIDevs/status/2123188224847982655", "author": "OpenAIDevs"}, {"id": "2123188212793544792", "text": "Here’s one example: send your meeting notes before you log off and ask for a morning brief.\n\nSet \"completion_window\" to \"8h\" to give the API an eight-hour window for the first response.", "created_at": "11-19 06:54", "likes": 87, "reposts": 2, "replies": 5, "views": 14741, "url": "https://x.com/OpenAIDevs/status/2123188212793544792", "author": "OpenAIDevs"}, {"id": "2123188195202617408", "text": "Not every workflow requires an immediate response.\n\nFor single- or multi-turn workflows that can wait, save up to 40% per token than Standard on GPT-6.2 Astra or GPT-6.2 Sol.\n\nIn Responses API background mode, choose a 2h or 8h target for the first response. These discounted windows are now in public beta.", "created_at": "11-19 06:54", "likes": 1503, "reposts": 68, "replies": 105, "views": 105422, "url": "https://x.com/OpenAIDevs/status/2123188195202617408", "author": "OpenAIDevs"}, {"id": "2123133158124036295", "text": "GPT 6.2 Astra Ultra is better !  \n\nI created this Gullwatch Isle with blender + threeJs + my custom skill !  \n\nMy workflow is simple:", "created_at": "11-19 03:16", "likes": 117, "reposts": 6, "replies": 5, "views": 10054, "url": "https://x.com/givros/status/2123133158124036295", "author": "givros"}, {"id": "2123129478998048824", "text": "https://openai.com/index/inside-the-codex-sandbox", "created_at": "11-19 03:01", "likes": 24, "reposts": 4, "replies": 1, "views": 5831, "url": "https://x.com/OpenAIDevs/status/2123129478998048824", "author": "OpenAIDevs"}, {"id": "2123129477047718171", "text": "The default permission profile disables network access. When a command requests access, Codex may prompt the user directly or route the request to auto-review.\n\nIf your build regularly downloads from a package registry, you can allow the registry’s domain in a permission profile with the network proxy enabled. The proxy checks each request against the profile’s domain rules to decide whether to forward it. Matching requests don’t need separate network approval each time.\n\nThe network proxy’s core request-handling and policy logic is shared across all three major operating systems. Proxy setup and sandbox integration are OS-specific.\n\nOn Linux, the command connects to a listener inside its isolated namespace. A process outside the sandbox relays those connections to the configured proxy.", "created_at": "11-19 03:01", "likes": 16, "reposts": 2, "replies": 2, "views": 6699, "url": "https://x.com/OpenAIDevs/status/2123129477047718171", "author": "OpenAIDevs"}, {"id": "2123129469447880885", "text": "As models become more capable, limits on what they can access matter more. A command editing your repo shouldn’t automatically be allowed network access.\n\nThe Codex sandbox lets Codex run commands in your existing environment within the filesystem and network limits you control.", "created_at": "11-19 03:01", "likes": 566, "reposts": 38, "replies": 83, "views": 43227, "url": "https://x.com/OpenAIDevs/status/2123129469447880885", "author": "OpenAIDevs"}, {"id": "2123121933411578115", "t
