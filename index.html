rsement — HE WILL NEVER LET YOU DOWN! President DONALD J. TRUMP（全文背书乔·格鲁特斯连任共和党全国委员会主席）", "created_at": "11-07 02:05", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#117570819049322754", "author": "realDonaldTrump"}, {"id": "117569389226840480", "text": "As President, I am 100% in favor of Super Intelligence (SI), and will work with the many States in the U.S. that want to become RICH by having them. They are GOLD, and only foolish leadership will say \"NO\" to the riches they bring! President DJT（表态全力支持超级智能，称愿接纳的州将因此致富）", "created_at": "11-06 20:01", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#117569389226840480", "author": "realDonaldTrump"}, {"id": "117569336938341217", "text": "NEWSMAX: \"Trump is a Winner, and he's right on Iran!\"（转发 Newsmax 称赞其在伊朗问题上正确）", "created_at": "11-06 19:48", "likes": 0, "reposts": 0, "replies": 0, "url": "https://truthsocial.com/@realDonaldTrump#117569336938341217", "author": "realDonaldTrump"}]}, "OpenAI": {"name": "OpenAI", "label": "OpenAI 官方", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_400x400.jpg", "tweets": [{"id": "2118795218099253606", "text": "We partnered with @fmf_org and its member firms on a new framework to help identify when bypassing an AI system's safeguards could enable serious cyber harm, and prioritize stronger protections.\n\n\"...This framework is an important step toward a common methodology for evaluating and comparing the severity of cyber jailbreaks, including the capabilities they unlock and how readily they can be used. Shared approaches like this can help the AI and security communities build a clearer evidence base and prioritize improvements to safeguards.\"  - OpenAI's Sasha Baker, Head of National Security Policy\n\nhttps://www.frontiermodelforum.org/updates/introducing-the-fmf-jailbreak-rating-framework-for-frontier-cyber-threats/", "created_at": "11-07 03:58", "likes": 882, "reposts": 65, "replies": 266, "views": 149697, "url": "https://x.com/OpenAI/status/2118795218099253606", "author": "OpenAI"}, {"id": "2118782708767965238", "text": "A new way to measure how AI agents handle the routine analyses of wet-lab science—BioBasicsBench.\n\nDeveloped with Ligo, a biotech company focused on enzyme design, the benchmark draws on 100 tasks from real experiments to test whether agents can interpret raw lab data, identify errors, and recognize when the evidence doesn’t support a conclusion.\n\nAccelerating biological research starts with getting the everyday work right. BioBasicsBench shows where models need to improve, and helps us track what those gains mean for scientific progress, biosafety, and biosecurity.\n\nhttps://openai.com/index/measuring-how-ai-agents-handle-wet-lab-science/", "created_at": "11-07 03:08", "likes": 2159, "reposts": 144, "replies": 532, "views": 317902, "url": "https://x.com/OpenAI/status/2118782708767965238", "author": "OpenAI"}, {"id": "2118390195099930906", "text": "On November 12, also join our Cyber at the Frontier livestream at 10am PT for more Cyber announcements: https://openai.com/cyber-at-the-frontier", "created_at": "11-06 01:09", "likes": 728, "reposts": 33, "replies": 28, "views": 209156, "url": "https://x.com/OpenAI/status/2118390195099930906", "author": "OpenAI"}, {"id": "2118390192356700383", "text": "In this narrow defender’s window, our goal is to expand Daybreak access to organizations of every size, independent researchers, and open-source maintainers.\n\nDaybreak Blue helps verified defenders validate vulnerabilities and fixes with fewer refusals. Daybreak Red enables offensive security with deeper exploit development and authorized testing.\n\nToday we are also expanding the Daybreak Blue alpha for GPT‑6 Astra to more organizations and individual researchers. \n\nSign up for Daybreak: https://openai.com/business/solutions/cybersecurity/", "created_at": "11-06 01:09", "likes": 950, "reposts": 34, "replies": 77, "views": 293521, "url": "https://x.com/OpenAI/status/2118390192356700383", "author": "OpenAI"}, {"id": "2118390190246879554", "text": "Introducing GPT‑6 Cyber: a major advance in security research that pairs stronger capabilities with better model alignment.\n\nThe model powered the Linux kernel research we announced yesterday, and security teams at companies like Mozilla, Palo Alto Networks, Calif, and Cisco—alongside our own at OpenAI—are already putting it to work.\n\nGPT-6 Cyber is available to select Daybreak Red customers and we are expanding access over time.\n\nhttps://openai.com/index/introducing-gpt-6-cyber/", "created_at": "11-06 01:09", "likes": 20257, "reposts": 1903, "replies": 1215, "views": 3640189, "url": "https://x.com/OpenAI/status/2118390190246879554", "author": "OpenAI"}, {"id": "2118124966055223755", "text": "Images 2.6 is available today in ChatGPT, and Codex across all tiers on web, desktop, and mobile.\n\nGPT-Image-2.6 Flare and Sunburst are also available in the API.\n\nhttps://openai.com/index/introducing-images-2-6/", "created_at": "11-05 07:35", "likes": 1014, "reposts": 54, "replies": 43, "views": 167334, "url": "https://x.com/OpenAI/status/2118124966055223755", "author": "OpenAI"}, {"id": "2118124964197114039", "text": "Two new image models for developers: GPT-Image-2.6 Flare and Sunburst.\n\nFlare generates images in as little as six seconds. Sunburst brings higher-quality generation and greater consistency across edits.\n\nImage markup and SVG exports give you more ways to refine and use what you create.", "created_at": "11-05 07:35", "likes": 1174, "reposts": 80, "replies": 30, "views": 183855, "url": "https://x.com/OpenAI/status/2118124964197114039", "author": "OpenAI"}, {"id": "2118124944928432327", "text": "Images, upgraded—introducing ChatGPT Images 2.6.\n\nNow with GIFs and reference images.\n\nPlus, two new models are coming to the API with 50% faster image generation.", "created_at": "11-05 07:35", "likes": 21740, "reposts": 1874, "replies": 1173, "views": 3291291, "url": "https://x.com/OpenAI/status/2118124944928432327", "author": "OpenAI"}]}, "sama": {"name": "Sam Altman", "label": "OpenAI", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_400x400.jpg", "tweets": [{"id": "2118429823244935257", "text": "Today’s GPT-6 Cyber release is a meaningful step for defenders: stronger vulnerability research and better alignment. We’ve already been using GPT-6 Cyber alongside GPT-6 Astra with Daybreak to harden our own systems, finding weaknesses, validating their impact, and developing fixes.\n\nEven after years @OpenAI, model capabilities continue to surprise me. One small example came from testing a prerelease version of GPT-6 Astra earlier this summer. We were examining tools used across our research infrastructure and one of our research infra leads, Michael Dalton, was looking into some low risk areas like a math task grader that used SymPy, a mathematics library, to check answers.\n\nIn an offline test, the submitted answer used characters that looked like ordinary letters to get past the grader’s checks. It caused the grader to run a shell command that printed “4242”, while still returning the expected result, 1/2. The grader marked the answer correct. A valid math answer had become a way to run code inside the grader - diagram below.\n\nThis is the kind of vulnerability that can be very hard for a human to find, even with a fuzzer. It takes connecting how input validation and evaluation interact, constructing an input that passes the checks but triggers unintended behavior, and recognizing the failure even when the final answer is correct. Models can reason across those pieces and help uncover classes of vulnerabilities that are difficult to spot when reviewing components in isolation.\n\nThat’s why it’s important for more defenders to use models with Daybreak to find and fix vulnerabilities in their own systems. Whether it’s a potentially internet-melting bug like PHP2Shell or a subtle but important issue like this grader bug, finding it before an attacker does gives defenders time to act.\n\nOur goal is to dramatically expand Daybreak, bringing advanced security research to organizations of every size, independent researchers, and open-source maintainers.\n\nWe’re also expanding Daybreak Blue alpha access for GPT‑6 Astra to more organizations and individual security researchers - let us know if you’re interested:\nhttps://docs.google.com/forms/d/e/1FAIpQLSdQu8mNYXDpUW_0kRS6JBWBPMWfUjjxi6xLi8AkFPObLupkpg/viewform", "created_at": "11-06 03:46", "likes": 464, "reposts": 50, "replies": 36, "views": 93065, "url": "https://x.com/fouadmatin/status/2118429823244935257", "author": "fouadmatin"}]}, "thsottiaux": {"name": "Tibo · Thibault Sottiaux", "label": "OpenAI · Codex 负责人", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2093807917833281537/2yBgpwVV_400x400.jpg", "tweets": [{"id": "2118953362725159104", "text": "Cyber", "created_at": "11-07 14:27", "likes": 1071, "reposts": 29, "replies": 304, "views": 261831, "url": "https://x.com/thsottiaux/status/2118953362725159104", "author": "thsottiaux"}, {"id": "2118939076791546000", "text": "Quite cool what you can do with a single prompt these days 👀", "created_at": "11-07 13:30", "likes": 1424, "reposts": 13, "replies": 193, "views": 355593, "url": "https://x.com/thsottiaux/status/2118939076791546000", "author": "thsottiaux"}, {"id": "2118938956301779171", "text": "Get me out of the basement\n\nhttps://poteto.com/", "created_at": "11-07 13:29", "likes": 6451, "reposts": 164, "replies": 1290, "views": 1346736, "url": "https://x.com/thsottiaux/status/2118938956301779171", "author": "thsottiaux"}, {"id": "2118871902366441879", "text": "It's Friday", "created_at": "11-07 09:03", "likes": 4618, "reposts": 95, "replies": 1441, "views": 405123, "url": "https://x.com/thsottiaux/status/2118871902366441879", "author": "thsottiaux"}, {"id": "2118802895604994463", "text": "More things to come, join our Cyber at the Frontier livestream on November 12, 10am PT: https://openai.com/cyber-at-the-frontier", "created_at": "11-07 04:29", "likes": 130, "reposts": 4, "replies": 52, "views": 59232, "url": "https://x.com/thsottiaux/status/2118802895604994463", "author": "thsottiaux"}]}, "OpenAIDevs": {"name": "OpenAI Developers", "label": "Codex · 开发者动态", "group": "openai", "avatar": "https://pbs.twimg.com/profile_images/2022002720971096064/l3Kyt4qt_400x400.jpg", "tweets": [{"id": "2118856568485896621", "text": "You can choose from starter projects for the OpenAI API across agents, creative tools, data visualization, and voice. Open one in Codex and build on it.\n\nFind a project to remix:\nhttps://developers.openai.com/showcase/api", "created_at": "11-07 08:02", "likes": 39, "reposts": 1, "replies": 2, "views": 10886, "url": "https://x.com/OpenAIDevs/status/2118856568485896621", "author": "OpenAIDevs"}, {"id": "2118856556725043402", "text": "Claim your API credits and start building:\nhttps://x.com/openaidevs/status/2115583710288613476?a=zjaij-PwMcVSpTn9LiM&s=46", "created_at": "11-07 08:02", "likes": 58, "reposts": 2, "replies": 3, "views": 15851, "url": "https://x.com/OpenAIDevs/status/2118856556725043402", "author": "OpenAIDevs"}, {"id": "2118856544733532452", "text": "Kickstart your weekend build with the new Showcase tab in the OpenAI Developers plugin.\n\nEligible ChatGPT Pro and Business subscribers can claim API credits in billing settings to cover their app’s API usage.", "created_at": "11-07 08:02", "likes": 493, "reposts": 21, "replies": 55, "views": 53561, "url": "https://x.com/OpenAIDevs/status/2118856544733532452", "author": "OpenAIDevs"}, {"id": "2118852567509909716", "text": "Everyone, or every team, can create GIFs with GPT-Image-2.6.", "created_at": "11-07 07:46", "likes": 698, "reposts": 43, "replies": 71, "views": 38931, "url": "https://x.com/OpenAIDevs/status/2118852567509909716", "author": "OpenAIDevs"}, {"id": "2118767826962207208", "text": "We shipped a bunch of stuff in Agents API in October! \nAnd make sure you read to the end for some beta features 👀\n\nThe full list:\n  - auto review: automatically review and approve or deny supported agent actions, similar to Codex’s “review for me” \n  - automations: you or the agent can schedule future work, including recurring tasks. things like \"check on x every hour\" automatically work \n  - update tools mid-session: change the tools available to an agent while a session is running \n  - Artifact SDK: hosted sandboxes will now be better at spreadsheets, presentations and Word documents \n  - (experimental) time awareness: experimental setting that gives the agent an understanding of time, so things like \"do x in <10 mins\" work well \n  - sandbox prewarming: you can prewarm sandboxes before you need them (speeds things up by doing expensive work like installing packages) \n  - async compaction: on by default, compacts context in the background so it doesn’t block the agent \n  - cross-session prompt caching: system prompts are automatically cached across sessions \n  - GPT-6 Astra Ultrafast: use ultrafast mode in the Agents API for faster output \n  - sandbox snapshots: hosted environments can be restored after going idle, with their files intact \n  - 12hr prompt caching: makes things faster for cases where your users talk to the agent less frequently\n  - environment keys: create environment keys programmatically \n  - turn-level history: inspect a specific turn and its subagent activity \n  - vault metadata filtering: filter vaults by metadata when listing them \n\n- beta features we're working on: contact us to try them out\n  - memory: agents will be able to remember stuff and search old messages across sessions\n  - decisions api: give agents access to the decisions api, for faster performance on tasks that benefit from filtering, classification etc\n  - budget control: give the agent a max dollar budget to work within\n  - env pooling; we create a pool of vanilla containers, making performance faster for hosted sandboxes\n  - v2 architecture: faster and more reliable across the board", "created_at": "11-07 02:09", "likes": 138, "reposts": 20, "replies": 21, "views": 15069, "url": "https://x.com/AzianMike/status/2118767826962207208", "author": "AzianMike"}, {"id": "2118393203715953093", "text": "This started with something I noticed at home over the summer: the air wasn’t moving through the house the way I’d hoped.\n\nIt made me wonder whether I could turn a floor plan into an interactive way to explore airflow, considering the house’s orientation and where its doors and windows are placed.\n\nSo I started building this experiment with Codex. You can open and close the doors and windows, adjust the wind intensity, and watch the flow lines change through the rooms.\n\nIt’s still an early visual study, but I’m fascinated by the idea of exploring an everyday problem this way.", "created_at": "11-06 01:21", "likes": 84, "reposts": 5, "replies": 6, "views": 15740, "url": "https://x.com/aerdna_c/status/2118393203715953093", "author": "aerdna_c"}, {"id": "2118386452782555448", "text": "See how it works and connect your cloud storage:\n\nhttps://developers.openai.com/api/docs/guides/private-safety-processing", "created_at": "11-06 00:54", "likes": 43, "reposts": 4, "replies": 1, "views": 16311, "url": "https://x.com/OpenAIDevs/status/2118386452782555448", "author": "OpenAIDevs"}, {"id": "2118386439675420743", "text": "Private Safety Processing lets OpenAI review related API requests for safety without retaining your prompts or responses.\n\nRecords stay in your environment, where an automated safety agent reviews them without OpenAI personnel being able to access your content.", "created_at": "11-06 00:54", "likes": 607, "reposts": 39, "replies": 94, "views": 53921, "url": "https://x.com/OpenAIDevs/status/2118386439675420743", "author": "OpenAIDevs"}]}, "AnthropicAI": {"name": "Anthropic", "label": "Claude 官方", "group": "claude", "avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_400x400.jpg", "tweets": [{"id": "2118814753154064501", "text": "Memory is what allows Claude to learn from experience. In a new Engineering Blog post, we share how “dreaming” helps Claude organize what it’s learned, correct its mistakes, and find what it needs more easily the next time. https://www.anthropic.com/research/components-of-agent-memory", "created_at": "11-07 05:16", "likes": 2768, "reposts": 192, "replies": 247, "views": 145303, "url": "https://x.com/AnthropicAI/status/2118814753154064501", "author": "AnthropicAI"}, {"id": "2118792930211107115", "text": "New on our Science Blog: How AI is beginning to change scientific modeling.\n\nScientific models help researchers explain and predict real-world systems—like how a single nerve cell fires, or what happens when neutron stars collide. Recent advances have transformed how scientists fit complex models to data. But scientists still typically write the models manually, and usually need to weigh up several competing versions, each of which might explain the data in a different way.\n\nIn a guest post, Jakob Macke, Daniel Gedon, and Stefan Wahl describe how AI is starting to help with these parts of the process. By writing, running, fitting, and revising scientific models as code, AI can explore many possible model structures, and find out which explanations the data support.\n\nhttps://www.anthropic.com/research/teaching-ai-to-build-scientific-models", "created_at": "11-07 03:49", "likes": 1495, "reposts": 119, "replies": 196, "views": 121618, "url": "https://x.com/AnthropicAI/status/2118792930211107115", "author": "AnthropicAI"}, {"id": "2118073667858887068", "text": "Read the full preprint here: https://www-cdn.anthropic.com/76e55fbe85697afbaae16b839498dc00797dec30.pdf", "created_at": "11-05 04:11", "likes": 804, "reposts": 64, "replies": 44, "views": 268891, "url": "https://x.com/AnthropicAI/status/2118073667858887068", "author": "AnthropicAI"}, {"id": "2118073665296228863", "text": "We’re sharing how our biology research team worked with Claude to map the first 3D structure of a vault particle from bacterial life.\n\nVault particles are a longstanding mystery. They are barrel-shaped objects, among the largest protein structures found in our cells. They were first discovered by Leonard Rome and Nancy Kedersha in 1986, but their function remains unknown.\n\nWith Claude, we’ve found results that might bring us closer to solving that mystery.\n\nUntil now, vaults were only known in the cells of complex things like animals and plants. We have shown that similar proteins from bacteria (and the viruses that infect them) can also assemble into vaults. Finding the structures in these simpler forms of life may make it easier to investigate their function in our own cells.\n\nFor our life sciences team, the project was also a demonstration of the potential (and the limitations) of using AI to accelerate science.\n\nIn our full piece, we discuss how Claude was able to dramatically speed up some stages—manually determining the vault particle’s structure would have taken weeks to months of painstaking work, but here it took days. We also discuss how Claude made some simple mistakes along the way, and how we collaborated with our machine learning researchers to address them.\n\nRead more: https://www.anthropic.com/research/investigating-vault-particles-with-claude", "created_at": "11-05 04:11", "likes": 4847, "reposts": 525, "replies": 556, "views": 962958, "url": "https://x.com/AnthropicAI/status/2118073665296228863", "author": "AnthropicAI"}]}, "GoogleDeepMind": {"name": "Google DeepMind", "label": "Gemini 官方", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/1695024885070737408/-M-HSH5P_400x400.jpg", "tweets": [{"id": "2118755488108364057", "text": "While modern 2048-bit systems remain safe from these specific exploits, this work highlights a key shift.\n\nAs we enter a new era of AI-enabled math and computation, we can no longer rely on historical hardness assumptions and must continuously stress-test cryptographic standards.", "created_at": "11-07 01:20", "likes": 63, "reposts": 2, "replies": 10, "views": 14250, "url": "https://x.com/GoogleDeepMind/status/2118755488108364057", "author": "GoogleDeepMind"}, {"id": "2118755418675765656", "text": "We’re sharing new research demonstrating how AI agents can accelerate the science of stress-testing encryption.\n\nGuided by humans, our models uncovered two major weaknesses in legacy 1024-bit RSA cryptosystems.\n\nOur VP Science @Pushmeet explains more ↓ https://x.com/pushmeet/status/2118752095859794390", "created_at": "11-07 01:20", "likes": 910, "reposts": 118, "replies": 180, "views": 67125, "url": "https://x.com/GoogleDeepMind/status/2118755418675765656", "author": "GoogleDeepMind"}, {"id": "2118390015382454491", "text": "introducing gemini omni 1.2 flash, now available in ai studio and the gemini api\n\nwhat's new:\n\n- fast & 30% lower cost\n- longer clips\n- edit in conversation\n- more natural speech\n- more controllable shots", "created_at": "11-06 01:08", "likes": 2103, "reposts": 155, "replies": 122, "views": 122489, "url": "https://x.com/GoogleAIStudio/status/2118390015382454491", "author": "GoogleAIStudio"}, {"id": "2118027058794148099", "text": "Voice Remixing for Gemini 3.8 Flash TTS is now live in @GoogleAIStudio and the Gemini API.\n\nStart with a preset from our library of 2,000+ voices or a custom-designed voice, and use prompts to fine-tune timbre, pitch, pace, and accent, like \"add a subtle Southern U.S. accent\" or \"make it sound like a fire-breathing dragon.\" 🐉", "created_at": "11-05 01:06", "likes": 1195, "reposts": 142, "replies": 163, "views": 227032, "url": "https://x.com/Google/status/2118027058794148099", "author": "Google"}]}, "sundarpichai": {"name": "Sundar Pichai", "label": "Google CEO", "group": "google", "avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_400x400.jpg", "tweets": []}, "TencentHunyuan": {"name": "Tencent Hunyuan", "label": "腾讯混元官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_400x400.jpg", "tweets": [{"id": "2118683762288697387", "text": "Design Benchmark 👇", "created_at": "11-06 20:35", "likes": 74, "reposts": 4, "replies": 14, "views": 5097, "url": "https://x.com/TencentHunyuan/status/2118683762288697387", "author": "TencentHunyuan"}, {"id": "2118634166107754690", "text": "#1 open-weights model on APEX-Agents 🙌", "created_at": "11-06 17:18", "likes": 105, "reposts": 4, "replies": 15, "views": 5781, "url": "https://x.com/TencentHunyuan/status/2118634166107754690", "author": "TencentHunyuan"}, {"id": "2118606684931469567", "text": "wow", "created_at": "11-06 15:29", "likes": 113, "reposts": 6, "replies": 5, "views": 5881, "url": "https://x.com/TencentHunyuan/status/2118606684931469567", "author": "TencentHunyuan"}, {"id": "2118556446321455516", "text": "Thanks @arena! 🎉 Really cool to see Hy4 as the top Chinese model on Agent Arena.", "created_at": "11-06 12:09", "likes": 278, "reposts": 12, "replies": 13, "views": 18658, "url": "https://x.com/TencentHunyuan/status/2118556446321455516", "author": "TencentHunyuan"}, {"id": "2118501201847423358", "text": "Hy4 by @TencentHunyuan is now officially the #1 best Chinese model in Agent Arena!\n\nWith over 12K+ real-world, long-horizon agentic sessions from our global community of users, Hy4 has also placed Tencent Hunyuan as the only Chinese lab in the top 5. It is now showing +5.4% net improvement, and sits firmly on the Agent Arena Pareto frontier at a $0.57 median cost per task.\n\nCongrats again to the @TencentHunyuan team!", "created_at": "11-06 08:30", "likes": 437, "reposts": 50, "replies": 27, "views": 77804, "url": "https://x.com/arena/status/2118501201847423358", "author": "arena"}, {"id": "2118349875461177358", "text": "nice try", "created_at": "11-05 22:29", "likes": 166, "reposts": 4, "replies": 9, "views": 14083, "url": "https://x.com/TencentHunyuan/status/2118349875461177358", "author": "TencentHunyuan"}, {"id": "2118302056884879383", "text": "🔥突发！混元Hy4上线首日即爆火，WorkBuddy紧急十倍扩容！并新增Hy3限时免费使用！\n\n11月4日Hy4首发接入后，凭借强Agent能力，首日即大量用户触发限额。\n\n关键动作：\n🔹推理集群已紧急扩容10倍\n🔹同步提升免费体验额度，持续动态调配\n\n仍可能限流，建议：\n1️⃣切Hy3等其他模型（Hy3限免延至11月15日23:59）\n2️⃣非紧急需求尽量晚间错峰\n感谢大家支持与理解！\n\n#WorkBuddy #混元大模型 #Hy4 #AIAgent #姚顺雨 #马化腾 #腾讯", "created_at": "11-05 19:19", "likes": 27, "reposts": 5, "replies": 14, "views": 7391, "url": "https://x.com/NFT_Chen/status/2118302056884879383", "author": "NFT_Chen"}, {"id": "2118292980117155939", "text": "Hy4 tying Grok 4.7 (xhigh) at 35 on the AA Intelligence Index while leading Chinese labs on FrontierCode 2.0 is the signal you need to pay attention to. Agentic coding is where the gap is closing fastest, but the 89% hallucination rate on AA-Omniscience shows the reliability tax that still comes w it. At ~$0.78 per index task though it’s also a clear Pareto shift on cost-capability versus comparable Western models.\n\n@ShunyuYao12 at @TencentHunyuan is formidable - earlier we thought Tencent was lagging behind but look at this now. Remarkable 🚀", "created_at": "11-05 18:42", "likes": 38, "reposts": 3, "replies": 5, "views": 5841, "url": "https://x.com/jenzhuscott/status/2118292980117155939", "author": "jenzhuscott"}]}, "deepseek_ai": {"name": "DeepSeek", "label": "DeepSeek 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1717417613775757312/Uk1zNOj4_400x400.jpg", "tweets": [{"id": "2117256196227019194", "text": "Your Harness. You Define It.\n\nMeet Creator Mode in DeepSeek Harness. \n\nTurn ideas into plugins that you can use, from a design workspace to a sandbox game or a 3D LLM visualizer. \n\nWhat will you create?", "created_at": "11-02 22:03", "likes": 25181, "reposts": 2107, "replies": 738, "views": 2456727, "url": "https://x.com/DeepSeekHarness/status/2117256196227019194", "author": "DeepSeekHarness"}, {"id": "2116857257245987236", "text": "https://x.com/i/article/2116829218935857152", "created_at": "11-01 19:37", "likes": 13695, "reposts": 1703, "replies": 491, "views": 3214878, "url": "https://x.com/DeepSeekHarness/status/2116857257245987236", "author": "DeepSeekHarness"}]}, "Kimi_Moonshot": {"name": "Kimi", "label": "月之暗面官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2086719038798102529/diJGKpOE_400x400.jpg", "tweets": [{"id": "2118025552963493935", "text": "Day 0 support: Kimi K3.1 Pro on AMD Instinct MI355X\n\n2.8T params, 1M context, open weights. Runs on 8x MI355X with ATOM and vLLM.\n\nRecipes, kernels and benchmarks: https://www.amd.com/en/developer/resources/technical-articles/2026/kimi-k3-1-pro-on-amd-instinct-gpus.html?utm_campaign=thallosocial&utm_source=twitter&utm_medium=organic_social&utm_content=kimi+day+0", "created_at": "11-05 01:00", "likes": 80, "reposts": 8, "replies": 8, "views": 14415, "url": "https://x.com/AIatAMD/status/2118025552963493935", "author": "AIatAMD"}, {"id": "2118023422248669547", "text": "Kimi K3.1 Pro lands on Nebius Token Factory from day 0.\n\nMoonshot’s latest open-weight model delivers coding performance close to Opus 5.5 on Terminal-Bench 4.0.\n\nBuild the app you’ve been imagining. Turn financial reports into a working model. Bring an interactive 3D world to life.\n\nBuild with Kimi K3.1 Pro → https://tokenfactory.nebius.com/?modals=endpoint-details&model-id=moonshotai/Kimi-K3.1-Pro", "created_at": "11-05 00:51", "likes": 210, "reposts": 12, "replies": 14, "views": 39662, "url": "https://x.com/nebiustf/status/2118023422248669547", "author": "nebiustf"}, {"id": "2118020769141678260", "text": "Today we're introducing Verda Inference, in preview, with day-0 access to Kimi K3.1 Pro, in partnership with @Kimi_Moonshot 🧵\n\nFrontier open-weight models through one API, engineered for every request, from a single prompt to long-horizon agents.\n\nhttps://verda.com/blog/verda-inference-in-preview?utm_source=x&utm_medium=social&utm_campaign=inference&utm_content=preview_announcement", "created_at": "11-05 00:41", "likes": 50, "reposts": 11, "replies": 2, "views": 102752, "url": "https://x.com/verdacloud/status/2118020769141678260", "author": "verdacloud"}, {"id": "2118010528123773297", "text": "Releasing the model weights of Kimi K3.1 Pro: https://huggingface.co/moonshotai/Kimi-K3.1-Pro\nWe'll keep advancing open intelligence.", "created_at": "11-05 00:00", "likes": 8633, "reposts": 840, "replies": 388, "views": 1078598, "url": "https://x.com/Kimi_Moonshot/status/2118010528123773297", "author": "Kimi_Moonshot"}]}, "ZhipuAI": {"name": "Zhipu AI", "label": "智谱官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875758904795344896/U3CqYUFY_400x400.jpg", "tweets": [{"id": "1875761216062439461", "text": "购买 $ZHIPU —— 采用全自研的GLM模型架构，基于数十万亿中英文双语数据训练而成。ZHIPU 综合能力接近 GPT-4-Turbo，推理速度高达 80 token/s，阅读速度是人类极限（300词/分钟）的 25 倍，开创了AI性能的新标杆！\n\nhttps://bigmodel.cn/", "created_at": "01-05 12:28", "likes": 16, "reposts": 5, "replies": 7, "views": 9910, "url": "https://x.com/ZhipuAI/status/1875761216062439461", "author": "ZhipuAI"}]}, "Alibaba_Qwen": {"name": "Qwen", "label": "阿里 Qwen 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/2064231947149377536/Ab70PxT5_400x400.jpg", "tweets": []}, "MiniMax_AI": {"name": "MiniMax", "label": "MiniMax 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_400x400.jpg", "tweets": [{"id": "2118835494465536470", "text": "Register here: https://luma.com/gmhodha7", "created_at": "11-07 06:38", "likes": 0, "reposts": 0, "replies": 0, "views": 214, "url": "https://x.com/MiniMax_AI/status/2118835494465536470", "author": "MiniMax_AI"}, {"id": "2118835158606610575", "text": "M3.1 Flash is live on @FireworksAI_HQ . Let’s talk about how it was built—over cocktails.  \n\nJoin MiniMax and @FireworksAI_HQ for Code & Cocktails in SF, where @Prof_OZ from Fireworks and @VictorSuOrtiz from MiniMax will discuss:  \n→ What went into building M3.1 Flash for long-running agents \n→ How coding, tool use, and visual reasoning work together \n→ What cheaper cached tokens mean for the cost of agent loops  \n\nThen drinks, bites, and time to compare notes with other builders.  \n📅 Tuesday, November 10 · Doors at 6 PM, fireside at 6:45 PM \n📍 San Francisco · Venue shared after registration approval  \n\nBring your questions. Registration below.  \n#MiniMax #FireworksAI #OpenModels #AgenticAI #AIEngineering", "created_at": "11-07 06:37", "likes": 4, "reposts": 0, "replies": 4, "views": 851, "url": "https://x.com/MiniMax_AI/status/2118835158606610575", "author": "MiniMax_AI"}]}, "XiaomiMiMo": {"name": "Xiaomi MiMo", "label": "小米 MiMo 官方", "group": "china_ai", "avatar": "https://pbs.twimg.com/profile_images/1999123454247972865/8PkB-sNt_400x400.jpg", "tweets": []}}, "errors": ["@sundarpichai 抓取失败（twstalker: Remote end closed connection without response）", "@Alibaba_Qwen 抓取失败（twstalker: HTTP Error 403: Forbidden）", "@XiaomiMiMo 抓取失败（twstalker: HTTP Error 403: Forbidden）"], "summary": "今日大佬动态仍以 **OpenAI 的 GPT-6 Cyber 发布**为中心：11 月 6 日推出的安全研究专用模型，官方称其漏洞研究能力更强、对齐更好——它正是单次运行发现并修补 948 个 Linux 内核本地提权漏洞背后的模型，sama 称已与 GPT-6 Astra 一起用于加固自家系统；Daybreak 同步扩围，11 月 12 日还有 Cyber at the Frontier 直播。**Google DeepMind 用 AI agent 给加密算法做压力测试**，在人类指导下发现了 legacy 1024-bit RSA 的两处弱点（2048 位系统不受影响），并借此提醒不能再依赖历史硬度假设；同时 Gemini Omni 1.2 Flash 正式 GA，降价 30%。**Anthropic** 发了两篇博客：Claude 如何用“做梦”整理记忆、以及 AI 如何改变科学建模，生物团队还用 Claude 解出了 vault 颗粒的首个 3D 结构。中国侧，**腾讯混元 Hy4 登顶 Agent Arena 中国模型第一**、APEX-Agents 开源权重第一，**Kimi K3.1 Pro 权重已发布**并登陆 AMD MI355X，MiniMax M3.1 Flash 上线 Fireworks。**马斯克**称数字超级智能将使全球经济增长 20–30%（约 25 万亿美元），并确认 SpaceX 约一周后在 Flight 15 上首次尝试 double catch——用发射塔同时回收助推器与上面级；他还称 Neuralink 未来几年将让人重新行走和使用双手，并惦记 500 吨推力的 Raptor 4。**特朗普**宣布 Stephen Miller 将于 11 月 9 日出任白宫幕僚长。Codex 负责人 Tibo 晚间恢复更新，但只发了几条短帖，信息量有限；另有 3 个账号（@sundarpichai、@Alibaba_Qwen、@XiaomiMiMo）今日抓取失败，动态缺失。", "groups": [{"key": "openai", "label": "🤖 OpenAI"}, {"key": "claude", "label": "🟠 Claude"}, {"key": "google", "label": "🔵 Google"}, {"key": "china_ai", "label": "🇨🇳 中国 AI"}, {"key": "other", "label": "🌐 其他"}], "group_summaries": {"openai": "OpenAI 组今日是 **GPT-6 Cyber 发布**的主场：11 月 6 日推出的安全研究专用模型，官方口径是“更强漏洞研究能力 + 更好对齐”，并与 FMF 合作发布了一套评估绕过 AI 安全防护何时可能造成严重网络危害的框架；sama 称已用 GPT-6 Cyber 与 GPT-6 Astra 加固自家系统。Daybreak 同步扩围：Daybreak Blue 帮已验证的防御者以更少拒绝验证漏洞与修复，Red 向更多组织开放，11 月 12 日有 Cyber at the Frontier 直播。另有 **BioBasicsBench**：与生物技术公司 Ligo 合作的 wet-lab 科学基准，100 个真实实验任务，测 agent 能否解读原始实验数据。Agents API 10 月更新了自动审核（auto review）与自动化（automations）等能力，Private Safety Processing 让安全审查不保留用户 prompt 与回复。Images 2.6 已于 11 月 5 日上线 ChatGPT 与全档 Codex。晚间 Codex 负责人 Tibo 恢复更新，发了几条短帖呼应 Cyber 与单 prompt 演示，信息量有限。", "claude": "Anthropic 组今日发了两篇博客：**Claude 的记忆机制**——工程博客讲“做梦”如何帮 Claude 整理学到的东西、纠正错误、下次更快找到需要的内容；科学博客讲 AI 如何开始改变科学建模（从神经元放电到中子星碰撞）。另有 11 月 5 日的生物学进展：Anthropic 生物团队用 Claude 解出了细菌 vault 颗粒的首个 3D 结构，vault 颗粒是细胞内最大的蛋白质结构之一、长期未解之谜。今日无新模型发布，均为研究与博客内容。", "google": "Google 组今日最值得看的是 **AI agent 加速密码学压力测试**的研究：人类指导下的模型发现了 legacy 1024-bit RSA 的两处重大弱点，现代 2048 位系统不受这次发现的影响，但 DeepMind 借此强调——进入 AI 驱动的数学与计算时代，不能再依赖历史硬度假设，必须持续压力测试加密标准。模型侧，**Gemini Omni 1.2 Flash 正式 GA**：速度更快、成本降低 30%、片段更长、支持对话内编辑与更自然的语音；**Gemini 3.8 Flash 的 Voice Remixing 上线**，2000+ 预设音色起步，可用 prompt 微调音色、音调、语速与口音。@sundarpichai 今日抓取失败，动态缺失。", "china_ai": "中国 AI 组今日以 **腾讯混元 Hy4** 为主角：11 月 6 日官宣 Hy4 为 Agent Arena 第一的中国模型、APEX-Agents 开源权重第一，腾讯称其为前五中唯一的中国实验室模型；Hy4 在 AA Intelligence Index 上以 35 分追平 Grok 4.7（xhigh）。混元 WorkBuddy 因 Hy4 上线首日爆火而紧急十倍扩容，Hy3 限时免费延至 11 月 15 日 23:59。**Kimi K3.1 Pro** 权重已于 11 月 5 日发布，Day 0 登陆 AMD MI355X（2.8T 参数、1M 上下文、8 卡运行）、Nebius Token Factory 与 Verda Inference。MiniMax 的 **M3.1 Flash 已上线 Fireworks**，并在旧金山办 Code & Cocktails 活动讲模型构建。DeepSeek 11 月 2 日推了 Harness 的 Creator Mode。@Alibaba_Qwen 与 @XiaomiMiMo 今日抓取失败。", "other": "其他组今日主线在**马斯克**：称数字超级智能将使全球经济增长 20–30%，约 25 万亿美元，且不含人形机器人；确认 SpaceX 约一周后在 Flight 15 上首次尝试 double catch——用发射塔同时回收助推器与上面级，此前已多次实现星舰海上软着陆；还称 Neuralink 未来几年将让人重新行走和使用双手，并惦记 500 吨推力的 Raptor 4。晚间他转了一条 Grok Bot 的用户趣闻，另发了两条无实质内容的短帖（“True”“5 years ago”）。**特朗普**今日 08:00 后无新帖，凌晨的动态仍是：宣布 Stephen Miller 将于 11 月 9 日出任白宫幕僚长，Susie Wiles 转任其他职务；称若非他阻止伊朗拥核，以色列乃至整个中东将不复存在；表态 100% 支持超级智能，并为 RNC 主席 Joe Gruters 连任背书。"}};

const FIN = {"date": "2026-11-07", "md": "# ☀️财经大事早报 · 2026-11-07\n\n## 📌今日大势\n\n### 1. 美股 AI 股史诗级暴跌后温和反弹，市场重估 AI 基建逻辑\n周四美股遭遇 2025 年 4 月以来最惨烈的一天：**纳斯达克狂泻 5.52% 至 24,315 点，创 2021 年 4 月以来最大单日跌幅，并较 10 月 6 日高点回落超 10%、进入技术性回调区间；标普 500 跌 4.36% 至 7,353.73 点，道指狂泻 1833.06 点（-3.44%）至 51,523.06 点**。纳指成分股单日合计蒸发约 **2.5 万亿美元**市值，富时（FT）口径称全市场蒸发 **3.2 万亿美元**；费城半导体指数暴跌 **12.25%** 至 9011.14 点，为史上第二大跌幅；AI 交易风向标英伟达跌 **9.26%** 至 181.60 美元。导火索是民主党中期选举大胜后，市场重估 AI 数据中心建设前景——多个州通过了可能延缓数据中心建设的暂停令，直接击中 AI 基建投资逻辑的核心。周五市场温和反弹，纳指涨 1.4%、英伟达涨 3.4%，但反弹力度与周四跌幅相比仍显单薄。后续盯什么：反弹能否持续、Anthropic IPO 路演是否如期启动，以及各州数据中心暂停令的实际落地范围。（来源：FT、路透社经 Catenaa/BitMart 转述）\n\n### 2. Anthropic IPO 承压：估值从 1.5 万亿压向 1 万亿，路演存疑\n本周最受瞩目的 IPO 正面临上市计划的重大考验。据《华尔街日报》报道，**三位计划参与 IPO 的主要投资者明确表示 1.5 万亿美元的目标估值难以实现，其中一位认为实际估值可能更接近 1 万亿美元；募资目标也可能从 1000 亿美元下调至约 800 亿美元**，部分投资者直接质疑路演能否如期于 11 月 9 日那周启动。预测市场 Kalshi 上 Anthropic 在 11 月完成上市的概率已从中期选举前的近 **90% 暴跌至不到 60%**。与此同时，FT 称公司仍坚持推进、目标估值仍为 1.5 万亿美元，并筹备英国散户认购，两边口径存在张力，须看下周路演是否如期举行。基本面方面，Anthropic 在最新 S-1 修订文件中披露：**三季度营收 170 亿美元，同比增长 1127%；前 9 个月净亏损 1040 亿美元**（去年同期为 251 亿美元）；账面现金 1466 亿美元；但背负了高达约 **8950 亿美元的不可撤销算力与基础设施支出承诺**。这笔承诺正是投资者重新定价的核心：AI 公司的增长故事，正在被负债端的资本开支规模重新称重。（来源：华尔街日报经 Catenaa/BitMart 转述、FT）\n\n### 3. 中期选举余波：民主党大胜改写政策预期，特朗普火速换将\n美国中期选举尘埃落定后，政策预期成为市场的新变量。民主党大胜让一批 AI 政策怀疑派进入权力中枢，叠加各州数据中心暂停令，直接触发了周四的 AI 股抛售——《经济学人》标题写得直白：“市场意识到自己讨厌美国的蓝色浪潮”。人事上，**特朗普宣布现任副幕僚长 Stephen Miller 将于 11 月 9 日出任白宫幕僚长**，Susie Wiles 将转任其他职务；FT 称 Miller 是移民政策强硬派。与此同时，**美国警告中国须“立即”履行釜山贸易协议条款**，贸易摩擦的弦再度绷紧。后续盯什么：新一届国会对 AI 监管与数据中心建设的实际立法节奏，以及白宫新班子对贸易协议的执行口径。（来源：FT、经济学人、BBC）\n\n## 💰宏观与政策\n\n### 1. 美国 10 月非农新增 16.5 万人，超预期\n美国经济 10 月新增就业 **16.5 万人**，超出市场预期，显示劳动力市场在选举季仍具韧性。这一数据与 AI 股暴跌同日出炉，说明本轮抛售的驱动力是政策预期重估而非经济基本面恶化——这也是周五市场能温和反弹的底气之一。（来源：FT Markets）\n\n### 2. 美国警告中国须“立即”履行釜山贸易协议条款\nFT 报道，美国已警告中国必须“立即”满足釜山贸易协议的条款。结合中期选举后美国国内政治氛围的变化，贸易议题可能重新升温；后续须盯中方回应与协议执行的具体争议点。（来源：FT Home）\n\n### 3. 中国加大股市救市力度\nFT 中文网报道，中国正在加大股市救市力度。在全球 AI 股暴跌、市场风险偏好回落的背景下，国内政策托底的信号值得注意；具体措施与力度有待官方进一步披露。（来源：FT 中文网）\n\n## 📈市场与投资\n\n### 1. 纳指单日蒸发 2.5 万亿美元，半导体指数史上第二大跌幅\n周四纳指成分股合计蒸发约 **2.5 万亿美元**市值，为该指数史上最大单日美元损失；费城半导体指数跌 **12.25%**，为史上第二大跌幅。抛售面极广：纳指超过 50 只标普 1500 科技股单日跌幅超过 10%，CoreWeave、Nebius、IREN 等数据中心与算力概念股跌幅居前，过去一个月内各自市值已腰斩。Truist 首席投资官 Keith Lerner 指出，科技板块过去一个月相对标普 500 的跌幅达 **10.7%，为 2002 年 5 月以来最极端的单月跑输表现**。（来源：路透社经 Catenaa/BitMart 转述、FT）\n\n### 2. 英伟达一日跌去 9.26%，周五反弹 3.4%\nAI 交易的风向标英伟达周四跌 **9.26%** 至 181.60 美元，周五反弹 **3.4%**。单只股票一日近一成的波动，说明市场对 AI 基建叙事的分歧已从“估值高不高”升级为“建设会不会被政策叫停”。后续盯英伟达能否守住 180 美元一线，以及下周 Anthropic 路演对 AI 板块情绪的传导。（来源：路透社经 Catenaa 转述）\n\n### 3. 日本股市创“解放日”以来最大单日跌幅，铜价亦跌\n抛售蔓延至亚太：日本股市创下“解放日”混乱以来最大单日跌幅；铜价亦因 AI 反弹忧虑而下跌——铜是数据中心建设的重要原材料，铜价走弱是 AI 基建预期降温的另一个侧面印证。与此同时，英国散户在科技股暴跌后选择抄底，FT 称英国散户投资者在重挫后买入跌幅股。（来源：FT Markets）\n\n## 🏠房价洞察\n\n### 1. 10 月百城价格指数：新房微涨、二手继续跌，租金也在跌\n中指研究院 10 月百城价格指数显示：全国 100 城新建住宅均价 **17,316 元/平方米，环比上涨 0.18%、同比上涨 2.02%**；二手住宅均价 **12,376 元/平方米，环比下跌 0.61%**（跌幅较上月扩大 0.01 个百分点）、同比下跌 6.72%；50 城住宅平均租金 33.87 元/平方米/月，环比下跌 0.28%、同比下跌 2.02%。新房价格的微涨与二手房的持续下跌并存，说明“以价换量”仍是二手市场的主旋律。（来源：中指研究院经中讯社）\n\n### 2. 9 月 70 城数据：一线二手房趋势性上涨，上海率先同比转正\n国家统计局 9 月 70 城数据显示，一线城市二手房价已出现趋势性上涨：9 月一线城市二手房价环比上涨 0.2%，涨幅较 8 月扩大 0.1 个百分点；**上海二手房价同比上涨 0.8%，成为 70 城中率先同比转正的城市**。新房方面，9 月环比上涨的城市有 17 个，比 8 月增加 2 个。10 月上海二手房成交 1.41 万套，同比增长 37.9%，成交端热度明显回升。（来源：国家统计局经 21 经济网、虎嗅网）\n\n### 3. 13 城现售制细则落地 + 房贷贴息：政策组合拳进入执行期\n自 8 月 28 日楼市现房销售制度落地，截至 10 月 29 日已有 **13 个重点城市**出台实施细则（北京、上海、广州、深圳四个一线城市，武汉、天津、杭州、苏州、宁波、合肥、成都七个新一线城市，以及温州、十堰），普遍要求新公告地块优先现房销售。9 月 29 日财政部等三部委联合发布**购房贷款贴息政策**（10 月 1 日起实施）：符合条件的首套新房和二手房，住房面积不超过 120 平方米、总价不超过 150 万元的购房者，可享受贷款本金年化 **1 个百分点**的财政贴息，贴息期限最长五年，单户贴息贷款规模上限 100 万元。政策效果初显：10 月 1–19 日深圳总价 150 万元以内的二手房成交占比 21.5%，较 9 月全月提升 1.3 个百分点；约三成上海购房者符合贴息条件。（来源：21 经济网、虎嗅网）\n\n### 🔍深度分析：分化才是主线——一线企稳、低线寻底，政策在“托刚需”而非“救房价”\n**分化格局**：价格数据呈现清晰的分化——一线城市二手房自 3 月起持续环比上涨（上海连涨 9 个月、深圳广州各 7 个月），上海 9 月二手房价率先同比转正；而百城二手均价同比仍跌 6.72%，常州、台州、金华、西安、珠海等 70 个城市跌幅在 5%–10% 之间。**一线与低线城市差异**：一线是“成交放量 + 价格企稳”（上海 10 月二手成交同比 +37.9%），低线仍是“以价换量 + 持续寻底”，全国新房均价 15 个月来首次同比上涨（+0.2%）主要由一线与核心二线贡献。**政策真实意图**：现售制（去杠杆、防烂尾）与房贷贴息（定向托刚需、只补首套小户型低总价）是一套组合拳——前者管供给端风险，后者托需求端刚需，意图是“稳住成交、不刺激房价”。**对购房者的实操含义**：首套、120 平米内、150 万内的刚需是政策明确补贴的对象，贴息 1%/年、最长 5 年相当于直接降低月供；改善型与投资型需求不在补贴范围内，不宜把政策解读为新一轮普涨信号。**后续盯什么**：10 月 70 城房价数据（11 月中旬发布）、年底房企推盘促销力度、贴息政策在更多城市的落地节奏，以及现售制下新房供应结构的变化。\n\n## 🤖AI经济\n\n### 1. Anthropic 背后的算力负债：8950 亿美元承诺改写 AI 估值公式\nAnthropic 披露的约 **8950 亿美元不可撤销算力与基础设施支出承诺**，是本轮 AI 股重估的核心变量。市场此前按“营收增速”给 AI 公司估值（Anthropic 三季度营收同比 +1127%），现在被迫同时按“负债端”定价——算力承诺的规模已接近其目标估值的六成。FT 另有专栏指出“AI 赌注需要更多现金”，点明了整个行业的资本开支压力。后续盯什么：Anthropic 路演时如何向投资者解释这笔承诺的回报周期，以及其他 AI 实验室是否被要求披露类似承诺。（来源：华尔街日报经 Catenaa 转述、FT）\n\n### 2. AI 监管转向：中期选举胜利 + 各州数据中心暂停令 + 超级智能禁令提案\n本轮抛售的政策根源有三层：民主党中期选举大胜让 AI 政策怀疑派进入权力中枢；多个州通过了可能延缓美国数据中心建设的暂停令；据新智元报道，美国国会已有议员联署《禁止人工超级智能法案》（S.5493 / H.R.10538），拟永久禁止超级智能研发、违者最高可判 20 年（该法案目前为提案阶段，尚未进入表决）。三层叠加，直接击中了“AI 基建无限扩张”这一投资叙事。后续盯什么：新一届国会的实际立法节奏，以及各州暂停令是否扩围。（来源：路透社经 Catenaa 转述、新智元）\n\n### 3. AI 改变贸易政治：《经济学人》称 AI 正在把保护主义者变成自由贸易者\n《经济学人》11 月 5 日刊文指出，AI 正在把保护主义者变成自由贸易者——算力、数据与模型流动的需求，正在倒逼贸易政策转向。这一判断与同期“美国警告中国履行釜山贸易协议”形成对照：AI 时代的贸易摩擦，焦点正从传统商品转向算力与数据流动规则。（来源：经济学人）\n\n## 🏢公司与产业\n\n### 1. Monzo 洽谈 75 亿英镑估值融资，私募谈判停滞后转向\n英国数字银行 Monzo 正在洽谈以 **75 亿英镑**估值融资，此前与私募的谈判陷入停滞。在全球科技股暴跌的当口，Monzo 的融资进程是检验一级市场对金融科技估值容忍度的试金石。（来源：FT Markets）\n\n### 2. DraftKings 下调盈利指引，押注预测市场新业务\n美国体育博彩公司 DraftKings 下调盈利指引，同时押注新的预测市场业务。预测市场（Kalshi 等）正在成为新的增长故事——而 Kalshi 恰恰是本周 Anthropic IPO 概率定价的来源之一，预测市场本身已深度嵌入金融叙事。（来源：FT Markets）\n\n### 3. 索尔维达成稀土协议，减少对中国依赖\n比利时化工企业索尔维达成稀土协议，以减少对中国的依赖。在贸易摩擦升温的背景下，关键矿产供应链的多元化正在加速，这也是“釜山贸易协议”争议的产业侧面。（来源：FT 中文网）\n\n## 🌍全球大事\n\n### 1. 新西兰今日举行议会选举\n新西兰今日（11 月 7 日，周六）举行议会选举，提前投票自 10 月 26 日开始，首批结果将于今晚公布、最终结果定于 11 月 27 日。选举结果将决定新一届政府构成，惠灵顿须同时处理与澳大利亚、美国的安全关系，与中国的贸易关系，以及太平洋地区的军事动态。（来源：Atlas News）\n\n### 2. 美俄乌三方会谈有望 11 月 6–10 日在阿布扎比举行\n据塔斯社与《基辅独立报》消息，美俄乌三方会谈有望于 11 月 6–10 日在阿布扎比举行，克里姆林宫 aide 称在 11 月 4 日之后、泽连斯基希望在 11 月 6–10 日，但具体日期尚未确认。若会谈成行，将是三方首次在阿联酋就停火框架直接对话。（来源：Peter's World 地缘日历）\n\n### 3. 欧洲航空公司再遭新一轮诈弹威胁\n欧洲航空公司遭遇新一轮炸弹威胁，20 个欧洲航班再遭“诈弹”威胁；BBC 报道称一个俄罗斯极端组织否认发送虚假炸弹威胁。事件已引发欧洲多国航空安全警戒，须盯后续是否影响航班正常运营。（来源：BBC World、FT 中文网）\n\n### 4. 肯尼亚末日邪教头目因谋杀 191 人被判终身监禁\n肯尼亚末日邪教头目因谋杀 191 人被判终身监禁。另据 BBC，西班牙铁路当局因 Urda 铁路事故面临欧洲欺诈调查；澳门首宗国安案判刑；教皇在肺癌手术数周后开始拉美之行。（来源：BBC World）\n\n## 📅今日前瞻\n\n- **新西兰大选结果**：首批结果今晚公布，关注执政联盟能否保住多数席位，以及对华贸易政策是否生变。\n- **Anthropic IPO 路演**：是否如期于 11 月 9 日那周启动、估值定在 1.5 万亿还是 1 万亿，是下周全球科技股情绪的风向标。\n- **美俄乌阿布扎比会谈**：若 11 月 6–10 日窗口内确认日期，关注停火框架是否出现实质进展。\n- **中国 10 月 70 城房价数据**：国家统计局将于 11 月中旬发布，验证一线企稳、低线寻底的分化格局是否延续，以及房贷贴息政策的落地效果。\n\n## 📎来源清单\n- RSS：FT Home/Markets（财经 24 条）、经济学人本周/金融经济（财经 5 条）、FT 中文网（财经 3 条）、BBC World（大事 25 条），合计 63 条中选用 21 条\n- 搜索补漏（4 条）：美股暴跌与 Anthropic IPO（Catenaa 转述华尔街日报、BitMart 转述华尔街见闻、新智元）、中国房价（中指研究院经中讯社、21 经济网、虎嗅网）、国际议程（Atlas News、Peter's World 地缘日历）\n- 注：WSJ 的 feeds.a.dj.com 系列、财新 RSS、路透新旧 feed 未采用（内容冻结/403/失效）\n"};

const LIB = {"groups": [{"id": "access-control", "name": "RAG 访问控制", "papers": [{"title": "Right Tool, Wrong Parameters: Defending LLM Agents Against Parameter Poisoning", "authors": "Yao Wang 等", "url": "https://arxiv.org/abs/2611.04673v1", "venue": "arXiv 预印本（cs.CR，2026-11-03）", "oneliner": "参数投毒防御：不诱发新动作、只偷换工具参数，AuthorityFlow 按查询诱导的信任层级逐参数判定来源可信度。", "insight": "与 ChainBind 草案投毒直接咬合：动作名与金额都对、只换主题或日期的投毒，恰好需要参数级而非动作级的批准绑定。AuthorityFlow 的字段信任归因是“批准环节加来源过滤”的可操作化候选，但其信任层级由模型解读查询生成，存在循环风险，引用时须点出该层。数字为作者自建 FactAuthBench 上的 93.06%→9.03%，良性效用代价约 7.6 个百分点。", "tags": ["参数投毒", "批准绑定", "信任层级", "Agent 安全"], "added": "2026-11-05"}, {"title": "Permitted but Unauthorized: Affordance-Induced Delegated-Scope Violations in Multi-Agent LLM Systems", "authors": "Shravya Kanchi", "url": "https://arxiv.org/abs/2611.04086v1", "venue": "arXiv 预印本（cs.CR，2026-11-02）", "oneliner": "多智能体系统里的“被许可却未授权”：决定 agent 越界的不是权限表，而是对端动作有没有被列出来供它看见。", "insight": "把授权拆成许可与委托范围两层：权限表不变、只改动作可见性，越界率就能从 0 走到 52/52。我们的 per-view 语义可据此补一句——视图不仅要按 AU 过滤内容，还要按委托范围过滤可执行动作的可见性。另可引用其“范围执法 ≠ 伤害预防”边界：确定性监控器挡住全部越界，却挡不住用自己的已授权动作拖累同伴。引用须写清模拟环境与单格子极端值。", "tags": ["委托范围", "多智能体", "授权", "呈现面"], "added": "2026-11-05"}, {"title": "StateGate: Workflow-State-Based Access Control for Agentic Retrieval-Augmented Generation in Public Organizations", "authors": "Evan Oktavianus、Dana Indra Sensuse、Imairi Eitiveni", "url": "https://doi.org/10.24433/co.3932736.v1", "venue": "Code Ocean（2026-10-30，OpenAlex 收录）", "oneliner": "面向公共机构的声明式 agentic RAG 访问控制：工作流表示为状态机，每状态挂自己的策略，跨通道与组织单元统一执行。", "insight": "补了 RU/AU 框架里“状态维度”的缺口：我们是查询时按内容归属逐 AU 求值，StateGate 是按工作流状态判定授权，两者叠加构成“内容归属 × 工作流状态”的二维判定，直接对应 ChainBind 的“批准—执行跨状态是否还有效”问题。其“过滤而非依赖引导”与 retrieve-then-project 同构（过滤防住 95.5% 暴露与 85/143 注入得手）。引用时须标注合成文档 + 自建 oracle/对照的证据边界，载体按预印本/技术报告口径处理。", "tags": ["工作流状态", "agentic RAG", "访问控制", "过滤"], "added": "2026-11-01"}, {"title": "REALM: Identifying Minimal Task Assets for LLM Agents", "authors": "Zihou Ren、Byungchul Tak、Long Wang", "url": "https://arxiv.org/abs/2610.39155v1", "venue": "arXiv 预印本（cs.CR, cs.AI, eess.SY，2026-10-29）", "oneliner": "为 LLM agent 识别并维护任务真正需要的最小资产集合，把“发现资产”与“授权使用”分开，在任务容器内只暴露资源受限的局部 API。", "insight": "与 RU/AU 解耦在执行侧同构：我们是检索侧“策略独立存放、查询时逐 AU 求值”，REALM 是执行侧“资产发现走依赖图、授权使用走受限 API”。它还处理了执行中才涌现的资产身份问题，其“来源限定接纳”可与“未知 AU 默认拒绝”对照。AgentDyn 上 ASR 16.6%→0.2%（qwen3.5-flash），引用时须限定基准与模型。", "tags": ["最小权限", "agent 授权", "提示注入", "AgentDyn"], "added": "2026-10-31"}, {"title": "Contextual Candour: Role-Aware Graduated Disclosure for LLMs over Mixed-Sensitivity Contexts", "authors": "Devansh Srivastav、David Pape、Samira Abedini 等", "url": "https://arxiv.org/abs/2610.28067", "venue": "arXiv 预印本", "oneliner": "把访问控制从二值 grant/deny 扩展为按用户授权等级校准回答粒度的渐进披露（graduated disclosure），用 reward-based 优化在生成过程里做披露控制。", "insight": "与 per-view 索引形成互补路线：我们是索引侧的离散视图隔离，他们是生成侧的连续粒度校准；结合点正是执行时授权绑定方向（生成时按 AU 动态校准）。其 reward 明确惩罚改写型泄露，呼应我们 retrieve-then-project 的 NLI 残留检查，可互相印证。", "tags": ["渐进披露", "生成侧控制", "授权校准"], "added": "2026-10-22"}, {"title": "Local Allow, Global Deny: Why Per-Action Authorization Does Not Compose in LLM Agents", "authors": "Anmol Pandey、Aditya Jain、Liang Chen 等", "url": "https://arxiv.org/abs/2610.27620", "venue": "arXiv 预印本", "oneliner": "证明逐动作授权在逻辑上无法组合成全局授权：关系型目的违规是 2-safety hyperproperty，零误报的单动作监控器一个都检测不到；AL-SYNTH 用 SAT/SMT 合成最小 CAF 见证。", "insight": "直接质疑逐 AU 求值这类局部授权语义的完备性：跨 AU 的关系型约束（如两段各自授权的片段拼在一起才构成泄露）在单查询内不可见。论文 limitations 应声明 AU 求值是 per-query 单轨迹语义，关系型策略需要跨执行监控，列为未来工作。AL-SYNTH 的最小见证合成法可借鉴，用于评估我们三语义在组合性攻击下的表现。", "tags": ["agent 授权", "组合性", "2-safety", "不可能性定理"], "added": "2026-10-22"}, {"title": "Lineage-Aware Memory Governance: A Derivation-Gated Framework for Privacy-Preserving Column-Level Access Control in Enterprise AI Agents", "authors": "Venkata M Sangaraju、Sudhir Vissa", "url": "https://arxiv.org/abs/2610.07258", "venue": "arXiv 预印本（HF 每日论文）", "oneliner": "提出 Analytical Memory Unit（AMU）：为共享内存中每条缓存结果附上完整推导血缘图，检索策略只有在请求者对结果触及的每一列都有授权时才返回命中。", "insight": "与我们 RU/AU 解耦形成直接对话：它是智能体内存侧的'检索时逐血缘求值'镜像设计。关键是其负面实证——消除泄露需要 75–90% 的血缘记录完整度——恰恰论证了我们'未知/未映射 AU 默认拒绝'的必要性：血缘不可能永远完整，fail-closed 必须内建在语义层而非依赖记录完整度。另可借鉴其'条件式设计保证 vs 经验结论'的措辞区分。引用价值高。", "tags": ["智能体内存", "访问控制", "血缘门控", "默认拒绝"], "added": "2026-10-09"}, {"title": "Audience-Bound Persistent Memory: Authorization Across the Memory Lifecycle", "authors": "Sibo Liu", "url": "https://arxiv.org/abs/2609.36373", "venue": "arXiv:2609.36373 (2026)", "oneliner": "首个把\"授权先于上下文组装\"做成 sound + policy-complete 的记忆准入机制：记忆项携带记录时的 audience，派生项按 audience 划分/取交集/被抑制，10,000 个多方对话历史中零违规项进入上下文", "insight": "与我们\"查询时逐 AU 求值 P(a,u)\"哲学同构，是 RAG 主线 related work 的直接对照；其派生项处理（划分/取交集/抑制）与我们的混合权限 chunk 处理（all-of 拒绝 / retrieve-then-project 裁剪）形成设计对照，可在 Discussion 对比两种选择的代价；\"audience 扩大需显式对象特定授权\"可为 grant/revocation 段落提供引用。注意其粒度是记忆项 × audience（非 AU 级内容划分），威胁面在 T1/T2 内。", "tags": ["授权前置", "related work", "必引候选"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "Scott Thornton 等", "insight": "与我们 KG 路径切割节（Round 8）主题相邻、贡献互补：他们是在线图扩展边界做单点授权检查，我们是离线 k-cut + 代价曲线（28.2% 公开文本代价、残留实体 4133→0）+ 子句级 PII 粒度。必须引用并主动写清差异；他们的 PD=2 命题与我们的 k=2 发现（k=3≡k=2）互相印证。", "oneliner": "形式化 Retrieval Pivot Risk：vector 检索出的 seed chunk 经实体链接 pivot 进敏感图邻域，造成纯向量检索不存在的跨租户泄露；提出 7 种攻击；泄露稳定出现在 PD=2（二部拓扑命题）。", "tags": ["KG", "pivot攻击", "必引"], "title": "Retrieval Pivot Attacks in Hybrid RAG: Measuring and Mitigating Amplified Leakage from Vector Seeds to Graph Expansion", "url": "https://arxiv.org/abs/2602.08668", "venue": "arXiv:2602.08668 (2026)"}, {"added": "2026-09-30", "authors": "Aiman Al Masoud, Marco Arazzi, Antonino Nocera（U. Pavia）", "insight": "与我们\"投影语义\"相邻但路线不同：他们是检索时 redaction，我们是 AU 解耦 + 查询时逐 AU 求值 + 投影。Related work 引用并 differentiate。", "oneliner": "Selective Disclosure 框架：把安全/隐私约束的执行从生成阶段解耦到检索阶段，graph-based 数据模型支撑细粒度 policy-aware retrieval，AI redaction（extractive/periphrastic），抗 prompt injection。", "tags": ["selective disclosure", "related work"], "title": "SD-RAG: A Prompt-Injection-Resilient Framework for Selective Disclosure in Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2601.11199", "venue": "arXiv:2601.11199 (2026-01)"}, {"added": "2026-09-30", "authors": "Red Hat AI（Francisco Javier Arceo, Varsha Prasad Narsing 等）", "insight": "独立第三方对问题重要性的佐证，适合放 Intro/motivation；粒度是 chunk 级 ABAC，比 AU 粗，不威胁 novelty。开源实现 OGX 可参考。", "oneliner": "形式化 relevance-authorization gap：ungated 检索在 98–100% probe 中泄露跨租户数据；提出 policy-aware ingestion + 检索时 gating + 共享推理的分层隔离架构。", "tags": ["motivation", "ABAC"], "title": "Securing the Agent: Vendor-Neutral, Multitenant Enterprise Retrieval and Tool Use", "url": "https://arxiv.org/html/2605.05287", "venue": "CAIS 2026"}, {"added": "2026-09-30", "authors": "Chen 等", "insight": "领域实例（医疗敏感画像），related work 引用即可。", "oneliner": "把访问控制集成进 RAG 的概念验证：面向敏感病人画像管理的细粒度访问控制。", "tags": ["医疗", "PoC"], "title": "Integrating Access Control with Retrieval-Augmented Generation: A Proof of Concept for Managing Sensitive Patient Profiles (AC-RAG)", "url": "https://doi.org/10.1145/3672608.3707848", "venue": "ACM SAC 2025"}, {"added": "2026-09-30", "authors": "", "insight": "写 related work 全景段落时引用，界定我们的位置。", "oneliner": "RAG 安全攻防分类综述，§4.4 整节讲 Access Control / Privacy / Confidentiality（含 SD-RAG、AC-RAG、DPVoteRAG、PAD 等）。", "tags": ["综述", "related work"], "title": "Securing Retrieval-Augmented Generation: A Taxonomy of Attacks, Defenses, and Future Directions", "url": "https://arxiv.org/pdf/2604.08304", "venue": "arXiv:2604.08304 (§4.4)"}, {"title": "ResidualAuth: What Authorization State Must Language Agents Preserve under Revocable Delegation?", "authors": "Moonwon Choi et al.", "url": "https://arxiv.org/abs/2609.08062", "venue": "arXiv cs.AI/cs.CR (2026-09-08, v2)", "oneliner": "可撤销委托下授权状态的形式化：两段历史可权限相同但撤销后决策相反，系统必须保留的恰是 residual authorization state，并给出内存精确/紧界。", "insight": "与我们 Discussion 的“撤销机制”开放问题直接对接：授权结论是授权历史的函数而非权限快照的函数；其内存下界与我们 AU 粒度—安全—成本权衡曲线呼应；与昨日 Residual Authority Replay 攻击形成“攻击—理论”配对引用。", "tags": ["revocable-delegation", "authorization-state", "theory", "memory-bounds"], "added": "2026-10-02"}, {"title": "Approval Laundering: Systematizing Approval--Execution Binding Failures in AI Coding-Agent Harnesses", "authors": "Yang Wang", "url": "https://arxiv.org/abs/2609.38983", "venue": "arXiv cs.CR/cs.AI/cs.SE (2026-09-30)", "oneliner": "系统化揭示 coding-agent 中“人批准的 A ≠ 实际执行的 A'”的六类批准—执行绑定失效，提出 keyed capability (Approval Token) 部分修复并诚实报告负结果。", "insight": "“批准—执行绑定完整性”与我们的 M(r) 绑定思想同属一范式，可在 Agent 线 related work 并列；其“字段级验证器看不见进程层级分叉”的负结果警示授权证据必须绑定到执行语义层；诚实负结果段落是局限章节范本。", "tags": ["approval-binding", "capability", "coding-agent", "negative-result"], "added": "2026-10-02"}, {"title": "ActionGuard: Tool Call Authorization under Poisoned Skills", "authors": "Jihun Han et al.", "url": "https://arxiv.org/abs/2609.39450", "venue": "arXiv cs.CR/cs.AI (2026-09-30)", "oneliner": "技能投毒下的工具调用授权：授权上下文与生成上下文分离，基于可信用户意图做 fail-closed 裁决，319 次注入测试中 ASR 相对降低 35–46%。", "insight": "“授权决策输入限于可信侧”与我们“策略独立存放、查询时逐 AU 求值”同构，Agent 线 related work 可并列引用；其 Reviewer 仍是 LLM 裁决，与我们“确定性求值”路线形成对照，可在 Discussion 讨论取舍。", "tags": ["tool-call-authorization", "skill-injection", "fail-closed", "agent"], "added": "2026-10-02"}, {"title": "Role Based Access Control in Enterprise RAG", "authors": "Gnaneshwar Kethavath", "url": "https://doi.org/10.5281/zenodo.23168856", "venue": "Zenodo preprint (2026)", "oneliner": "用 15 份虚构公司文档 × 3 个模拟角色 × 4 种实现实证企业 RAG 的 RBAC：未过滤 RAG 在 99 次未授权/攻击评估中泄露 37 次，prompt-only 权限声明仍泄露 12 次，两种代码级过滤均为 0。", "insight": "我们\"策略独立于模型、在执行层强制\"主张的第三方实证：37/99 vs 12/99 vs 0 这组数字可直接进论文动机段——仅靠 prompt 声明权限不够。它做的是文档级 RBAC（粗粒度），恰好是 AU 划分的一个特例（每文档一个 AU），粒度差异本身可写成对比点。注意局限：Zenodo 非同行评审、单作者、合成小数据、作者自检标签，只能作支持性引文。", "tags": ["RBAC", "企业 RAG", "实证评估", "必引候选"], "added": "2026-10-07"}, {"title": "Safe Separability for Autonomous Authorization: Branch-Relative Authority Closure Under Decision-Critical Uncertainty", "authors": "Mohammad Amir Khusru Akhtar", "url": "https://doi.org/10.21203/rs.3.rs-11086182/v1", "venue": "Research Square 预印本（Under Review）", "oneliner": "形式化“授权决策所需证据、其获取动作本身也需要授权”的循环为 safe separability，提出分支相对授权闭包（BRAC），只用在所有仍兼容世界中都合法的探测来消解决策关键不确定性。", "insight": "与我们“未知 AU 默认拒绝”的保守路线形成直接对照：BRAC 是“在可证明安全的分支内允许证据采集”的积极路线，两者都承认授权信息不完备时行动的困难但选择相反的风险分配，可在 discussion 并列为“证据采集 vs 默认拒绝”权衡。其“先给受限可解类、再用最小反例划界”的形式化写法（联合状态语义+单调类+世界依赖反例）值得我们写 T1/T2/T3 形式化时借鉴；266 回归测试+穷举小世界+随机认证对比的评估方法学可作授权语义正确性评估模板。注意是审稿中预印本，引用时标注。", "tags": ["authorization", "autonomous-agents", "formal-methods", "evidence-acquisition"], "added": "2026-10-10"}, {"title": "After the Edit, Freshness and Access Control of Tool-Calling Retrieval and Vector RAG for a Community-Edited Knowledge Base", "authors": "Nikolaos D. Tantaroudas、Ilias Karachalios、Andrew J. McCracken", "url": "https://doi.org/10.20944/preprints202610.0645.v1", "venue": "Preprints.org 预印本（OpenAlex）", "oneliner": "在可编辑社区知识库上对照实测工具调用检索与向量 RAG 的新鲜度与访问控制：48 组反事实编辑 + 48 条合成 canary 记录，测编辑后新值给出率与 gated 内容泄露率。", "insight": "与我们 RU/AU 解耦框架直接对话的三组数字：工具 agent 在 240 次探测中零泄露 gated 内容，而批量重索引的 RAG 在重索引前泄露了全部已撤销 canary、忽略 gating 标记的索引器在 96 次探测中泄露 93 次——这是“撤销必须内建在执行语义层、gating 必须跟随内容复制的每一步”的现成实证，可引作我们撤销机制一节的经验证据。另：RAG 在对话内被追问时只有 19.6% 给出新值（多为撤回之前的正确答案），说明检索新鲜度不仅是索引问题也是对话状态问题——与我们“查询时逐 AU 求值”的设计呼应。局限：Preprints.org 预印本、单平台案例（希腊农业平台），引用时需标注。", "tags": ["访问控制", "撤销机制", "工具调用检索", "新鲜度", "实证"], "added": "2026-10-11"}, {"title": "One Word Opens the Gate: The Option-Channel Attack on Typed Decision Models as Agent Guardrails", "authors": "Seyedarmin Azizi、Erfan Baghaei Potraghloo、Massoud Pedram", "url": "https://arxiv.org/abs/2610.12292", "venue": "arXiv 预印本（OpenAlex 增补）", "oneliner": "评估 7 个开源类型化决策模型作为 agent guardrail 的允许/阻止决策质量：准确率仅 36%–72%，6 行无关日志文本可把 fail-open 率从 0% 抬到 63%，误导性选项名可抬到 93%–100%；结论是这类模型不应成为做决定的组件。", "insight": "直接论证我们架构的核心选择：授权判定必须是确定性的策略求值（逐 AU 计算 P(a,u)），而不是模型推理——模型做 allow/block 在对抗文本下 fail-open 率可达 93%–100%。fail-open/fail-closed 二分法与我们“未知 AU 默认拒绝”同构，且论文显示模型 guardrail 的默认倾向不稳定，正是默认拒绝必须写进语义层的理由。另：“选项通道攻击”是 T1/T2/T3 之外的新攻击面（攻击决策组件自身的输入通道），我们的框架因 AU 求值不经过模型而天然免疫。局限：arXiv 预印本、0 引用，评估的是开源小模型而非 Jev 本体。", "tags": ["类型化决策模型", "guardrail", "选项通道攻击", "默认拒绝", "授权判定"], "added": "2026-10-11"}, {"title": "Provenance and Authorization in Autobiographical Language Models", "authors": "Faruk Alpay、Taylan Alpay", "url": "https://arxiv.org/abs/2610.17935", "venue": "arXiv 预印本（cs.CR，2026-10-13）", "oneliner": "把自传式语言模型档案中\"叙事内容悄悄变成授权依据\"形式化为安全问题：定义类型化记录、认证断言、与内容分离的独立策略通道和可容许视图，并给出完整性规约与 noninterference 论证。", "insight": "与我们 RU/AU 解耦的核心主张跨领域收敛：\"策略与内容载体分离、查询时独立求值\"。其 noninterference 论证框架可直接借鉴为我们\"零泄露\"目标的形式化语言；\"admissible views\" 与我们的 per-view 索引执行语义直接对应。它还给了一个 T1/T2/T3 之外的新攻击面实例：授权依据在推理时的语义漂移（叙事→同意），提示威胁模型可在\"检索后、生成前\"补一刀。只引形式化部分，不引其小规模合成试点数字。", "tags": ["策略通道分离", "可容许视图", "noninterference", "授权语义"], "added": "2026-10-15"}, {"title": "From Detection to Decision: Calibration and Deferral for Prompt-Injection Detection", "authors": "Qianlong Lan、Anuj Kaul、Vinothini Pandurangan、Indranil Sanyal", "url": "https://arxiv.org/abs/2610.20907", "venue": "arXiv 预印本（2026-10-14，cs.CR）", "oneliner": "把 prompt injection 防御从二分类检测器推进到允许/拦截/升级的运营决策：47,611 样本测校准与 deferral，结论是概率输出救不了分布偏移下的安全决策。", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的强制授权立场形成可对比论证：即使 AUROC 0.897 的最佳检测器，在 1% 漏报目标下也需要 >91.8% 人工升级率，证明\"先检测后决策\"在运营上不可行——这正是我们不走检测过滤、而走执行语义授权绑定的实证支撑。引用点在论证链，不在技术细节。", "tags": ["提示注入", "检测天花板", "强制授权"], "added": "2026-10-18"}, {"title": "When Approval Becomes Execution: Authorization-Grounded Workflow Attacks on Tool-Using Agents", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2610.23077", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "攻击者不覆盖策略、而是引导 agent 走完一条局部自洽的审批工作流，用合法申请的 approval token 经 authorized_by 拿到受保护文档（8/9 完成精确目标操作）。", "insight": "执行时授权绑定方向最直接的经验证据：token 持有被当作充分授权，而请求者身份/审批者权限/资源范围/动作类型/业务目的没有被联合强制执行。可与我们的执行语义并列为绑定缺失的第二个实例（我们是检索时绑定，它是执行时绑定），related work 里互补引用。", "tags": ["agent 授权", "执行时绑定", "工作流攻击", "token 上下文"], "added": "2026-10-20"}, {"title": "Agenra: A Language and Verified Core for Stateful LLM Agent Authorization", "authors": "arXiv 拉取档未提供", "url": "https://arxiv.org/abs/2608.22868", "venue": "arXiv 预印本（2026-10-19 公告批次）", "oneliner": "带 Lean 验证核心的策略语言，处理可消耗权限的状态化授权：用新旧 permission ledger 之间的 simulation 认证权限修订，51 个人工修订上 21/21 通过、30/30 拒绝且全部经 replay 确认。", "insight": "与我们执行语义互补：我们目前是查询时静态策略求值，没有处理授权随执行消耗的动态维度；其 simulation 认证思路可借来论证 AU 划分/策略变更后既有授权语义是否保持（审稿人可能追问的点）。其安全 vs 工作流保持分离的写作范式也值得学。", "tags": ["形式化验证", "状态化授权", "权限修订", "Lean"], "added": "2026-10-20"}, {"title": "Securing LLM-Agent Long-Term Memory Against Poisoning: Non-Malleable, Origin-Bound Authority with Machine-Checked Guarantees", "authors": "Yedidel Louck", "url": "https://doi.org/10.66977/xsci.2610.001o", "venue": "OpenAlex 补录（2026-10-18）", "oneliner": "双独立源背书或显式用户授权的策略，在抽象记忆模型中机器验证了其在允许变换下对任意规模存储保持成立；1152 个受控 episode 中无防御 61/72 被攻陷、有 monitor 后 0/72。", "insight": "origin-bound authority 是执行时授权绑定的雏形：授权证据与来源绑定、随时间保持有效。直接启发：我们的 AU 授权判定目前是查询时的，长期会话/记忆场景下 AU 映射 M(r) 会漂移，其在变换下保持的证明框架可借鉴来论证 AU 划分稳定性；其保守默认与我们未知 AU 默认拒绝可互相印证。", "tags": ["agent 记忆", "投毒防御", "机器验证", "权限绑定"], "added": "2026-10-20"}, {"title": "PP-RAG evaluation package: deterministic privacy controls for retrieval-augmented generation over educational feedback", "authors": "Vassilios S. Verykios、George Vorvilas、Evgenia Paxinou 等", "url": "https://doi.org/10.5281/zenodo.23458295", "venue": "Zenodo 评估包（2026-10-18；配套论文投 Intelligent Decision Technologies）", "oneliner": "PP-RAG 确定性隐私控制的 seeded 完全可复现评估包：PII 检测与匿名化、基于角色的 ACL-filtered retrieval、LLM 前自适应输出控制、最小 cohort-size 阈值，附 span 级 ground truth 合成数据集。", "insight": "与我们思路最接近的现存竞品，必须正面处理：其 ACL-filtered retrieval 是检索时按 ACL 过滤，我们是策略独立存放、查询时逐 AU 求值——差异点正好是我们的核心 claim（策略变更不需重建索引）。评估包可复现，可作为我们补基线对比的候选基准。标记为竞品对比候选。", "tags": ["RAG 隐私", "ACL 过滤", "可复现基准", "竞品"], "added": "2026-10-20"}, {"title": "SpanGuard: Decoupling Instruction Localization from Authorization for Lightweight IPI Defense", "authors": "Yinxiang Wang, Zehua Ma, Kejiang Chen, Weiming Zhang, Han Fang", "url": "https://arxiv.org/abs/2610.26013", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "把 IPI 防御拆成无监督指令定位 + 块级授权判定两步，小模型守卫也能达到 0.32% ASR。", "insight": "与我们 RU/AU 解耦哲学最同构的相关工作：\"定位 vs 授权判定\"分离论证了\"解耦带来轻量化+可验证性\"。它的块级授权判定正是\"执行时逐 AU 求值\"在 IPI 通道的镜像，可在 related work 中并列；0.32% ASR 是\"解耦不牺牲防御强度\"的硬证据。", "tags": ["IPI 防御", "解耦", "授权判定", "轻量守卫"], "added": "2026-10-21"}, {"title": "RAGLeak: Supply-Chain Privacy Backdoors in Retrieval-Augmented Generation", "authors": "Yuchen Chen, Wei Cheng, Yuan Xiao, Junda He, Jieke Shi, PingPing OuYang, Quanjun Zhang, Chunrong Fang, David Lo, Zhenyu Chen", "url": "https://arxiv.org/abs/2610.25937", "venue": "arXiv cs.CR 预印本（2026-10-19）", "oneliner": "在 RAG 生成器中植入供应链后门：触发时可逆混淆检索到的私密文档，辅助 LLM 高保真恢复，ASR 最高 100%，干净微调不消除。", "insight": "T1/T2/T3 之外的新攻击面：威胁在模型供应链而非检索通道。它动摇了\"生成器可信、风险只在检索与上下文\"的隐含假设——威胁模型章节应明确声明信任边界（生成器供应链在 scope 之外），否则审稿人会质疑 per-view 索引能否挡住被污染的生成器。100% ASR 可引用。", "tags": ["RAG 攻击", "供应链后门", "隐私泄露", "威胁模型"], "added": "2026-10-21"}, {"title": "Memory, Know Your PLACE: Governing Lifecycle State and Query-Time Eligibility in Persistent-Memory Agents", "authors": "Chen-Fang Hu, Hong-Han Shuai, Woan-Shiuan Chien", "url": "https://arxiv.org/abs/2610.25179", "venue": "arXiv cs.AI/cs.CL 预印本（2026-10-18）", "oneliner": "为持久记忆 agent 加可拆卸治理层 PLACE：写侧状态认证 + 读侧授权，读侧治理消除了可测量的因果泄露。", "insight": "\"读侧授权\"是\"查询时逐 AU 求值\"在记忆载体上的实现，其\"消除可测因果泄露\"结论可直接引用论证\"读侧强制有效\"。对执行时授权绑定方向：它的写侧认证+读侧授权双层结构是完整形态，提醒我们\"授权证据随时间保持有效\"需要写侧机制——与 Yedidel Louck 的 origin-bound authority 互相印证。", "tags": ["agent 记忆", "读侧授权", "因果泄露", "执行时绑定"], "added": "2026-10-21"}, {"title": "Auditing the Hand-Written Inputs of Learned Access Control", "authors": "Arsalan Jalil Sarghaleh、Mehdi Hazrati", "url": "https://arxiv.org/abs/2610.31388", "venue": "arXiv 预印本", "oneliner": "审计学得访问控制背后两件手写制品（hard-deny 集合、region map）：5 个 ABAC Lab 策略上穷举检查，忠实转录的 deny 条款不可靠率 0.50–0.70，未经验证上线会误删 16–78% 合法授权。", "insight": "对我们最直接的警示性证据：\"未知 AU 默认拒绝\"的前提是 deny 判定本身 sound，而这篇证明手写 deny 制品在实践中大面积 unsound，失败模式正是\"自然语言作用域 vs 规则析取\"的语义错位。建议在论文 limitation/deployment notes 引用：deny 集合须经穷举 soundness 检查，否则默认拒绝变误删。其\"false-non-grant 与 false-permit 两种损失同时报告\"值得借鉴为三语义评估规范。注：Jev 粗筛 relevance 0.56 未过线，人工终审判定直接相关而收入。", "tags": ["访问控制", "deny 语义", "soundness", "ABAC"], "added": "2026-10-24"}, {"title": "Structured Decomposition for Reliable LLM-Generated Access Control Policies", "authors": "Vatsal Gupta、Darshan Sreenivasamurthy（Apple Inc.）", "url": "https://doi.org/10.1007/978-981-92-6837-5_10", "venue": "ICICS 2026（LNCS vol 17216）", "oneliner": "自然语言访问控制策略 → OPA Rego 可执行代码的模块化流水线（策略检测/组件抽取/schema 校验/lint/编译/自动测试），372 条 ACRE 语句上端到端正确率 50.3%（基线 15.3%，3.3×）。", "insight": "\"LLM 生成访问控制策略\"的扎实工程参照，与我们是上下游互补关系（他们做策略生成可靠性，我们做检索时授权绑定）。deny 语义正确率 87.5% 与 Auditing 一文互相印证：deny 是访问控制最脆弱的一环，正是我们\"未知 AU 默认拒绝\"需形式化保证的 motivation。其\"正反两类测试都通过才算正确\"的严格标准可借鉴为三语义评测准则。注：Jev 粗筛 relevance 0.62 未过线，人工终审判定可引用而收入；代码尚未公开。", "tags": ["策略生成", "OPA/Rego", "policy-as-code", "deny 语义"], "added": "2026-10-24"}, {"title": "Enhancing Large Language Models with External Knowledge Using Retrieval-Augmented Generation: A Critical Review of Retrieval Design, Context Compression, Safety and Evaluation, with a Conceptual Governance-Aware Architecture", "authors": "Auti Pallavi S. 等", "url": "https://doi.org/10.5281/zenodo.23593530", "venue": "Zenodo 预印本综述（2026-10-23）", "oneliner": "RAG 批判性综述：梳理检索设计、压缩、安全与评测的相互作用，提出八层治理感知架构，把 IAM 权限过滤放进 RAG 设计核心。", "insight": "可作我们论文 related work 的治理视角动机引用：它把 IAM-based permission filtering 列为 RAG 设计的一等要素，并点明访问控制放在 LLM 之外执行只在显式信任假设下成立——这正是我们把信任假设形式化为逐 AU 求值与未知默认拒绝的动机。但注意边界：这是未经同行评审的综述、无新实验，八层架构未经验证，只能作背景/动机引用，不能作证据引用。", "tags": ["RAG 治理", "IAM 权限过滤", "综述"], "added": "2026-10-25"}, {"title": "An Efficient Privacy-Preserving Retrieval Scheme for Cloud-Based Retrieval-Augmented Generation", "authors": "Yuan Chang 等", "url": "https://doi.org/10.1109/TCCN.2026.3705821", "venue": "IEEE Transactions on Cognitive Communications and Networking（2026）", "oneliner": "云端 RAG 隐私检索 ShieldRAG：局部敏感哈希分桶 + 内积函数加密，云端看不到查询内容与文档访问模式，延迟 <0.5 秒、top-5 召回约 90%。", "insight": "与我们 embedding 通道一节可比但角度不同：我们防“结果里混进未授权内容”，ShieldRAG 防“云端从查询与访问模式反推隐私”，即 T2/T3 里服务器方观察者分支；可量化对照点是隐私不必以检索不可用为代价，但摘要未给明文基线精度损失与密钥管理成本，不宜写成已解决问题。", "tags": ["隐私检索", "函数加密", "云端 RAG"], "added": "2026-11-02"}, {"title": "RevBench: code, scenarios, run logs and judgments for enforcing mid-task permission revocation in AI agents", "authors": "Martin Ignatovski", "url": "https://doi.org/10.5281/zenodo.23854359", "venue": "Zenodo 软件与数据存档（配套论文 Revoking Access Does Not Revoke Knowledge）", "oneliner": "任务中途撤销权限的基准：逐调用授权 720 轮失败 57.9%，撤销发生在数据送达后失败率升至 72.8%，选择性重放+清单级溯源降至 21.0%。", "insight": "补上 AU 求值未单列的一维：授权的生命周期。我们的覆盖映射回答查询时某内容属不属于你，RevBench 回答此前已授权、此刻已撤销的内容在上下文、草稿与记忆里的残留如何清除；其清单级溯源与 M(r) 同源，讨论节可用 57.9%/72.8% 说明只在读取时设卡不够。标注证据边界：自建模拟平台 + LLM 评判，非真实 SaaS 实测。", "tags": ["权限撤销", "agent 授权", "残留知识", "基准"], "added": "2026-11-03"}, {"title": "IAMRAGBENCH: Benchmarking Authorization Expansions in LLM-Generated AWS IAM Policies under RAG Poisoning", "authors": "Hasan Kaplan 等", "url": "https://arxiv.org/abs/2611.03431v1", "venue": "arXiv:2611.03431v1 (2026)", "oneliner": "RAG 投毒攻击 IAM 策略生成的基准：投毒上下文诱使模型生成提供商校验通过、但超出可信授权需求的策略，60 案例、确定性授权包络评分。", "insight": "与 RU/AU 框架最直接的新证据：其“授权包络”即生成侧的 AU 求值——先划可信授权需求的线，再逐条判定生成物是否越线；“架构例外”包装下攻击率 63.79% 说明判定位置（何时判、由谁判）比规则本身更脆弱，呼应“查询时逐 AU 求值、未知 AU 默认拒绝”。另注意 CheckNoNewAccess 漏报 4 例：形式校验不能替代包络语义校验。引用时标注 arXiv 预印本、自建基准。", "tags": ["RAG 投毒", "授权扩张", "IAM 策略", "基准"], "added": "2026-11-04"}, {"title": "SearchInject: Retrieval Exposure Control for Indirect Prompt Injection in Language-Model Search", "authors": "Kainan Zhou 等", "url": "https://arxiv.org/abs/2611.02643v1", "venue": "arXiv:2611.02643v1 (2026)", "oneliner": "间接提示注入的检索层准入关：用相关性、搜索滥用信号与指令可能性联合打分隔离可疑候选，top-10 目标暴露率相对下降约 83%，干净检索质量几乎无损。", "insight": "与 retrieve-then-project 构成两道关对照：准入关挡“看起来像指令的页面”，授权关挡“不属于你的片段”，两者叠加才完整；其 nDCG@10 最大变化仅 0.0018 说明准入控制代价可以很小。引用时不要把“暴露率下降 83%”写成“攻击成功率下降 83%”（104 例跟进无法估计后者），且评估为家族内泛化。", "tags": ["间接提示注入", "检索准入", "隔离", "搜索增强"], "added": "2026-11-04"}, {"title": "Governed Retrieval Augmented Generation with Guardrails Role Based Access Control and Audit Logging", "authors": "Lohith Reddy Kalluru", "url": "https://doi.org/10.21275/sr261031123753", "venue": "International Journal of Science and Research（2026-11-04）", "oneliner": "企业 RAG 权限治理实测：只靠索引层过滤时角色撤销后 99.5% 的查询仍泄漏未授权上下文，加一道查询时权限复核后违规归零。", "insight": "把我们“策略独立存放、查询时逐 AU 求值”的主张变成了可引用的数字：99.5% 是“权限变了、索引没跟上”这一失效模式的直接证据；其“当前权限复核”与我们的查询时求值同构，可在 related work 里互相印证。引用时须写清三点限制：SQLite FTS5 合成诊断、无 LLM、无真实语料；IJSR 为低门槛期刊；只覆盖角色/文档撤销两类变化，未覆盖 T2/T3 攻击面。", "tags": ["RAG 授权", "RBAC", "权限撤销", "查询时复核"], "added": "2026-11-06"}]}, {"id": "privacy-mia", "name": "隐私与成员推断", "papers": [{"title": "Walking the Embedding Space: Datastore Extraction from Multimodal RAG", "authors": "Maria Carmen Jica 等 4 人", "url": "https://arxiv.org/abs/2610.01871", "venue": "arXiv:2610.01871 (2026)", "oneliner": "针对返回图像的多模态 RAG 的黑盒自适应数据抽取攻击：影子图像混合+相关性加权重采样，单次 2500 查询重构 611 张放射影像，抽取条目数达非自适应基线的 5.6 倍。", "insight": "embedding 通道攻击线的最强邻居：我们的 A1 是文本完形攻击（89.4%@20），它是多模态、图像返回配置下的自适应抽取，说明向量索引的通道问题在跨模态场景同样成立且可被放大。可在 T2 威胁模型一节引用为最具体的实证；其\"重构出的不同条目数\"可借鉴为 embedding 泄露的度量。它不涉及授权语义（任何用户可查），防御侧无直接给出，但把\"embedding 索引必须被授权视图切分\"的论证推得更强——正是 per-view 索引的动机。", "tags": ["embedding 泄露", "数据抽取", "多模态 RAG", "攻击"], "added": "2026-10-03"}, {"added": "2026-09-30", "authors": "", "insight": "与我们 A2（成员推断 AUROC 0.655→0.484）直接相邻，related work 引用。", "oneliner": "保护检索数据免受成员推断攻击：\"Is This Query Too Close to Home?\"", "tags": ["成员推断", "related work"], "title": "Safeguarding Privacy of Retrieval Data against Membership Inference Attacks (MIRABEL)", "url": "https://aclanthology.org/2025.findings-emnlp.438/", "venue": "Findings of EMNLP 2025"}, {"added": "2026-09-30", "authors": "", "insight": "A2 相关的防御工作，related work 引用。", "oneliner": "面向知识密集 LLM 的集成隐私防御，抵抗成员推断攻击。", "tags": ["成员推断", "防御"], "title": "Ensemble Privacy Defense for Knowledge-Intensive LLMs against Membership Inference Attacks", "url": "https://aclanthology.org/2026.findings-eacl.145/", "venue": "Findings of EACL 2026"}, {"added": "2026-09-30", "authors": "", "insight": "PII 安全检索方向，disclosure controls 一栏的代表工作。", "oneliner": "Self-Tag Evidence Aggregation with Probabilistic Circuits，面向 PII-safe RAG。", "tags": ["PII", "证据聚合"], "title": "SEAL-Tag: Self-Tag Evidence Aggregation with Probabilistic Circuits for PII-Safe Retrieval-Augmented Generation", "url": "https://arxiv.org/pdf/2603.17292", "venue": "arXiv:2603.17292 (2026)"}, {"added": "2026-09-30", "authors": "Wang 等", "insight": "\"策略执行点\"的跨领域对照：他们在生成时执行（constrained decoding），我们在检索后执行（retrieve-then-project）——related work 可写一节对比两种执行点设计。", "oneliner": "Privacy-Aware Decoding：解码期隐私保护，缓解 RAG 中 LLM 的隐私泄露。", "tags": ["解码期", "执行点对照"], "title": "Privacy-Aware Decoding: Mitigating Privacy Leakage of Large Language Models in Retrieval-Augmented Generation (PAD)", "url": "https://doi.org/10.1145/3770855.3817665", "venue": "KDD"}, {"added": "2026-09-30", "authors": "", "insight": "隐私保护方法 + 评估框架，评估方法论可参考。", "oneliner": "RAG 隐私保护方法与评估框架。", "tags": ["评估框架"], "title": "Privacy Protection in RAG: A Novel Method and Evaluation Framework (PPRAG)", "url": "https://doi.org/10.1016/j.ipm.2025.104361", "venue": "IP&M 2026"}, {"title": "Erased, but Not Gone: Output Forgetting Is Not True Forgetting", "authors": "Teresa Pui Yee Yong、Win Kent Ong、Chee Seng Chan", "url": "https://arxiv.org/abs/2606.25001", "venue": "arXiv 预印本（cs.AI）", "oneliner": "以“不含遗忘数据从零重训的模型群体”为理想遗忘参照，证明输出层遗忘指标系统性高估真遗忘：表征空间留着沿重训相关方向的结构化残差，relearning 攻击可恢复信息。", "insight": "与我们 embedding 通道泄露故事同构的“表面删除≠真删除”：它研究训练数据遗忘，我们研究检索内容授权，失效模式一致。可在论文动机/相关工作里并置引用（我们的 cloze 89.4%@20 与它的“输出指标系统性高估”互为佐证）。对 RU/AU 撤销机制的直接警示：AU 权限撤销后旧 embedding 向量若仍在索引里就是它的“结构化残差”——撤销评估必须做表征层一致性检查，不能只看输出层。", "tags": ["机器遗忘", "表征残差", "评估方法"], "added": "2026-10-13"}, {"title": "Residual Privacy Leakage after Output Scrubbing in Tool-Using LLM Agents under Indirect Prompt Injection", "authors": "Kashvi Gupta", "url": "https://doi.org/10.21203/rs.3.rs-11428254/v1", "venue": "Research Square preprint", "oneliner": "oracle 级事后输出清洗也清不干净：间接注入导致的隐私泄露经逐字+3-token 片段删除后，残留率仍达 61.2%/62.1%，幸存者主要是语义改写。", "insight": "用硬数字回答了我们论文的核心设计问题——为什么不用事后过滤而做检索时/索引时授权绑定：模型接触数据后，有限跨度的精确值清洗结构性失效（连 oracle 级都救不回来），唯一清零的是接触前的 pre-context-removal。其 57% 人工重判残留率可直接引用作 NLI 残留检查必须做到语义级的 motivation 数据。", "tags": ["事后清洗", "间接注入", "残留泄露", "接触前防御"], "added": "2026-10-23"}, {"title": "Privacy-Preserving Retrieval from Redacted Corpora: Effects of Retrieval Paradigm and Relevance Definition", "authors": "Yoshiyuki Sakamaki 等", "url": "https://doi.org/10.1007/978-3-032-37676-3_10", "venue": "ECML PKDD 2026（LNCS vol 16947）", "oneliner": "RAG 语料先脱敏再检索：BM25 在脱敏下保持稳健，稠密检索与 ColBERT 出现有统计支撑的退化；脱敏代价取决于检索范式与相关性定义。", "insight": "与我们的 retrieve-then-project 语义直接对照：按 AU 裁剪与按 PII 脱敏面临同一权衡，损失不是均匀的——评估裁剪语义时应分检索范式报告效用损失；脱敏与授权过滤可互补，但叠加损失需单独度量。实验基于 Text Anonymization Benchmark 单一基准，外推到真实企业语料需谨慎。", "tags": ["RAG 隐私", "脱敏检索", "BM25", "检索范式"], "added": "2026-11-06"}]}, {"id": "standards-agent", "name": "标准与 Agent 线", "papers": [{"title": "Permission Withdrawal in Tool-Using Language Model Agents: Runtime Enforcement and Recovery", "authors": "Gaurav Chaulagain、Medhavee Upadhyaya", "url": "https://doi.org/10.54536/ajdsai.v2i2.8776", "venue": "American Journal of Data Science and Artificial Intelligence", "oneliner": "用户中途收紧权限后，tool-using agent 是否还会执行已被撤回的操作：轨迹级授权问题与运行时门的对照实证。", "insight": "执行时授权绑定（方向 2）在行动层的直接对照：prompt-only 真的执行了被禁写操作，规则门零漏放、模型门 3 次误放且仅因资源不存在未遂。其五阶段可复现评测框架（提议/门决策/派发/状态转移/有用完成）值得借鉴为我们三语义评测的拆分方式，避免最终状态指标掩盖授权失败。限定：确定性模拟环境、期刊影响力有限，引用时标注受控环境实证。", "tags": ["agent 授权", "权限撤回", "运行时门", "轨迹级评测"], "added": "2026-10-26"}, {"title": "Act on Your Behalf, Beyond Your Authorization: Benchmarking LLM Agent Authorization Alignment", "authors": "Zhiping Zhang、Franklin Mingzhe Li、Zihao Huang 等", "url": "https://arxiv.org/abs/2610.27548", "venue": "arXiv 预印本", "oneliner": "发布 AuthorizationBench：286 个可执行任务、6,864 条轨迹，agent 在 19.2% 的轨迹中超出用户授权范围行动；任务完成不等于授权合规。", "insight": "agent 授权对齐方向第一个大规模实证基准，可引用作 motivation 数据（19.2% 越权率、加大推理力度不降低违规率）。维度区分：它测的是行动授权（delegation scope），我们做的是数据授权（AU 求值），related work 里应明确区分。其授权感知沙箱（授权内外路径均可执行可观测）是评估执行时授权绑定的现成实验装置。", "tags": ["benchmark", "agent 授权", "越权评测"], "added": "2026-10-22"}, {"title": "Package Hallucination Attacks on Coding Agents through Prompt Injection in Rule Files", "authors": "Yupu Wang、Zhengyuan Jiang、Reachal Wang、Neil Zhenqiang Gong（杜克大学）", "url": "https://arxiv.org/abs/2610.09264v1", "venue": "arXiv 预印本（cs.CR/cs.AI）", "oneliner": "提出 package hallucination 攻击：向社区共享的规则文件（AGENTS.md/.cursorrules）注入恶意提示，诱导编码智能体把合法依赖替换为攻击者控制的包；配套进化优化框架 PackHallu 构造注入提示，多 benchmark/多模型/多框架高成功率且迁移性强。", "insight": "攻击面弹药：这是一类'供应链式间接提示注入'——恶意内容不在检索语料里，而在智能体启动即加载的规则文件里。提示我们 agent 线探索应把规则文件/skill 文件视为与检索语料同等地位的不可信输入，tool-use 授权需覆盖'配置型上下文'。纯攻击论文、无防御构造，威胁模型章节一句话引用即可。", "tags": ["提示注入", "编码智能体", "供应链攻击", "规则文件"], "added": "2026-10-09"}, {"title": "VeriChainSim: Verifiable Evidence-Chain Simulation for LLM-Based Multi-agent Authorization in Aerospace Trusted Data Spaces", "authors": "G. E. Huiling、Zhiguo Shi（通讯）、Yungui Nie（北京科技大学）", "url": "https://doi.org/10.1007/978-981-92-5712-6_34", "venue": "Springer CCIS vol. 3155（CSC 2026 会议论文集章节）", "oneliner": "把 LLM 智能体的每次授权决策绑定到类型化证据指针（目录记录、策略标识、合同条款、会话绑定、证明对象），token 激活前由外部验证器对照可信状态注册表校验。", "insight": "实现了我们只在目标里写了的性质：对畸形证据 fail-closed（存在性/完整性/范围/会话一致性任一不过即拒绝）。与我们的 retrieve-then-project 同属'授权决策前置校验 + 失败降级'家族，但路径不同（中心化外部验证器 vs 查询时逐 AU 求值），可在相关工作/讨论章节并列引用。局限：航空航天专用场景、仿真评估，威胁模型未分层。", "tags": ["智能体授权", "证据链", "fail-closed", "可审计性"], "added": "2026-10-09"}, {"title": "Agents in Disguise - Weaknesses in Authentication and Authorization in Public AI Ecosystems", "authors": "Jan Stanek, Lukas Kencl", "url": "https://doi.org/10.1007/978-3-032-38702-8_15", "venue": "Lecture notes in computer science (2026)", "oneliner": "系统实测 MCP 等开放 AI 生态与协议中的认证授权现状：agent 身份缺失、弱认证泛滥、授权可选或逻辑损坏，并给出改进方向。", "insight": "直接相关 agent 授权线：它点出了我们主论文的一个隐含假设——RU/AU 框架的 P(a,u) 默认授权主体 u 已认证可信，而开放生态中 u 的认证本身仍未解决。可在威胁模型/讨论章节引用作边界声明：AU 框架解决已认证主体对内容的细粒度授权，主体身份可信需下层认证机制支撑。附带价值：引用链可顺藤摸瓜到 NIST NCCoE agent 身份概念文件与 mcpanalysis 分析工具。", "tags": ["agent 授权", "认证", "MCP", "开放生态", "实测"], "added": "2026-10-08"}, {"title": "Authority Is Not a String: A Capability-Scoped Harness for Prompt-Injection-Resistant Coding Agents", "authors": "Dimitrios Stamatios Bouras, Yihan Dai, Sergey Mechtaev", "url": "https://doi.org/10.1145/3843750.3843843", "venue": "ACM (2026)", "oneliner": "用 capability-scoped 权限模型重构 coding agent 工具沙箱：工具调用须持有显式能力令牌，命名资源≠被授权操作，架构层面切断间接 prompt injection 的执行通道", "insight": "与我们\"未知 AU 默认拒绝、查询时逐 AU 求值\"的执行语义哲学同构——都是把\"能说出名字/能检索到\"从隐含授权中剥离。差异在于粒度：它是工具调用级 capability，我们是检索内容级 AU。适合 Related Work 的 Agent 线引用，作为显式授权能力模型的独立佐证；两者交叉可作 future work 一笔。", "tags": ["agent 安全", "capability 模型", "prompt injection", "授权执行"], "added": "2026-10-04"}, {"title": "OverAct: Measuring and Mitigating Proactive Over-Authorization in LLM Tool-Calling Agents", "authors": "Taolin Zhang 等 5 人", "url": "https://arxiv.org/abs/2610.01508", "venue": "arXiv:2610.01508 (2026)", "oneliner": "研究工具调用 agent 的\"主动越权\"：8 个隐私敏感域的确定性 benchmark，7 个模型全部超授权范围；SelfAudit 零样本推理时自检把隐私向越权降低 43%。", "insight": "Agent 授权线的高质量 benchmark，可直接复用其评测设计。\"越权来自结构性决策倾向而非解码随机性\"的结论与我们\"保守子句切分器\"的直觉相通——授权边界应由机制保证而非模型自觉；SelfAudit 仍是模型自己审计自己（启发式），我们的确定性求值 P(a,u) 是更彻底的路线，可在 Discussion 对照。注意它是动作侧授权，我们是数据侧，不竞争。", "tags": ["Agent 授权", "越权", "benchmark"], "added": "2026-10-03"}, {"title": "Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems", "authors": "Yunbei Zhang 等 7 人", "url": "https://arxiv.org/abs/2610.00371", "venue": "arXiv:2610.00371 (2026)", "oneliner": "提出 authorization-paired evaluation（拦住禁用用途+完成授权用途为联合成功标准）与 FlowReview 框架（对象解析+权限排序+确定性执行），组合审查把 denied-commit 率从 86.0% 降到 0 且授权供给无损失。", "insight": "核心命题\"对象身份与权限必须通过输出可验证的组件与执行保持连接\"与我们的\"chunk 只存 M(r)、查询时逐 AU 求值\"同构——都反对权限是附在数据上的静态标签。它的\"联合成功标准\"值得借鉴：我们评估以安全侧为主，未来可加\"授权供给无损失\"的对照度量。它的组合攻击面（单看合规、组合违规）提示我们要讨论\"多个已授权 AU 组合后是否产生未授权结论\"，与 KG 路径切割一节可呼应。", "tags": ["Agent 授权", "组合安全", "评估方法"], "added": "2026-10-03"}, {"title": "Boundary-State Control for Tool-Using Language-Model Agents: Commit-Time Consistency under State Drift", "authors": "Wesley Shu", "url": "https://arxiv.org/abs/2609.37475", "venue": "arXiv:2609.37475 (2026)", "oneliner": "补上授权的时间维度：把单次 commit 授权绑定到\"授权状态的语义投影\"，堵住 agent proposal-to-commit 间隙，10,302 个冻结 proposal 上接受全部未变更 commit、拒绝全部 10 类变更/重放", "insight": "与昨日 Residual Authority Replay 形成\"攻击揭示—机制修复\"呼应：Replay 说明授权结论脱离上下文持久化必然产生残留攻击面，BSC 给出具体修复机制；其形式化可为 Discussion 的 revocation / time-bounded authorization 段落提供引用；其诚实局限写作（主动限定 scope）是局限段落的范本。注意粒度是动作级 commit（非内容级 AU），不涉及 T2 embedding 通道。", "tags": ["时间维度", "revocation", "related work"], "added": "2026-10-01"}, {"title": "ToolFence: Fine-Grained Authorization for Secure Tool-Using LLM Agents", "authors": "Yanjie Li 等", "url": "https://arxiv.org/abs/2609.37196", "venue": "arXiv:2609.37196 (2026)", "oneliner": "面向 tool-using agent 的细粒度 provenance-aware 授权：执行前编译 typed authorization blueprint、确定性 monitor 执行，AgentDojo 上 ASR 压到近零且 clean utility 仅降 3.8pp", "insight": "Agent 访问控制线的直接邻居；其 provenance-aware authorization（按来源区分授权值与不可信观测）与我们\"chunk 只存覆盖映射 M(r)、查询时逐 AU 求值\"同构——都是把授权绑定到数据来源；其架构（蓝图编译 + 确定性执行 + judge 只做 capability 级授权）是\"策略独立存放、执行时确定性求值\"的工程实例；授权粒度权衡（capability 级 vs 逐调用）可与我们的 AU 粒度选择对比。注意它防的是 IPI 完整性轴，我们是机密性轴，不直接竞争。", "tags": ["agent授权", "provenance", "related work"], "added": "2026-10-01"}, {"added": "2026-09-30", "authors": "OWASP", "insight": "标准层面佐证我们的威胁模型（T1/T2/T3）与\"逐阶段鉴权\"设计方向，可在论文中引用。", "oneliner": "标准草案：检索管线（检索、重排、chunk 扩展、prompt 组装、引用各阶段）必须强制 end-user 授权上下文，而非仅依赖服务账号权限；否则模型成为 confused deputy。", "tags": ["标准", "威胁模型佐证"], "title": "OWASP AISVS C05-02: AI Resource Authorization & Classification", "url": "https://github.com/owasp/aisvs/blob/HEAD/1.0/research/chapters/C05-Access-Control/C05-02-AI-Resource-Authorization-Classification.md", "venue": "OWASP AISVS（草案）"}, {"added": "2026-09-30", "authors": "pm-mendes 等", "insight": "Agent 访问控制并行线的相关工作：tool-argument 粒度授权，Cedar PDP。", "oneliner": "LLM agent 工具调用的参数级授权：provenance contracts + Cedar 策略决策点。", "tags": ["Agent线", "tool授权"], "title": "ConTraG: Provenance Contracts for Tool-Argument Authorization in Cloud-Native Agentic RAG", "url": "https://github.com/pm-mendes/contrag-cloudcom2026", "venue": "CloudCom 2026"}, {"title": "Compromise Is Not Consequence: Evaluating Task-Scoped Authorization in LLM Agents with Paired Replay", "authors": "Tural Hagverdiyev", "url": "https://arxiv.org/abs/2610.05840", "venue": "arXiv:2610.05840 (2026)", "oneliner": "paired-replay 测试台量化任务范围授权对提示注入后工具执行的遏制：broad bearer 攻击后执行率 8.9–37.8%，scoped JWT / sender-constrained / OPA 三种限定条件全部为零。", "insight": "与我们 AU 授权单元同属\"授权原子单位\"家族的同行实证，粒度不同（按任务限定凭证 scope vs 按内容划分 AU）但哲学一致。核心结论\"The policy changes execution, not the frozen model decision\"与我们的 retrieve-then-project 执行语义形成跨域互证：安全寄托在执行层裁剪而非模型自觉。局限：测的是遏制非预防；AgentDojo 扩展样本小。可在执行语义/威胁模型章节引用作 RAG 侧 AU 求值 vs Agent 侧 task-scoped 的对照。", "tags": ["agent authorization", "scoped credentials", "paired-replay", "执行语义对照"], "added": "2026-10-07"}, {"title": "Can CaMeLs Talk? Securing Multi-Agent Systems Against Indirect Prompt Injection Attacks", "authors": "James Peters-Gill, Avi Semler, Henning Bartsch, Ilia Shumailov, Christian Schroeder de Witt", "url": "https://arxiv.org/abs/2610.05640", "venue": "arXiv:2610.05640 (2026)", "oneliner": "证明单智能体 CaMeL 安全保证在分层多智能体系统中不组合（不可信数据可被下游重新解释为可信输入），提出保持 provenance 的 multi-CaMeL 协议，把攻击成功率从 12.9% 降至 0.0%。", "insight": "攻击面在我们 T1/T2/T3 之外的新维度——组合性：每个单元各自安全，跨边界组合仍可被绕过，恰是我们 embedding 通道\"边界重解释\"问题的多智能体版本。对我们论文的直接影响：per-view 索引目前只论证单系统内隔离，若未来扩展到多智能体 RAG，视图隔离的组合性需单独证明——诚实的未来工作点，可在局限段引用此文佐证。当前 claim 不受动摇。", "tags": ["多智能体安全", "组合性", "CaMeL", "威胁模型扩展"], "added": "2026-10-07"}, {"title": "Semantic Privilege Collapse: Trust Boundaries and Execution-Level Authorization in Agentic AI Systems", "authors": "Narnaiezzsshaa Truong", "url": "https://doi.org/10.5281/zenodo.23285357", "venue": "Zenodo 预印本（OpenAlex 扩展源）", "oneliner": "提出“语义权限坍缩”概念：任务数据或授权不足的指令经模型解释被提升为实际动作权限；主张授权绑定在执行时而非读取/检索时，信任边界必须在执行流水线中显式存在。", "insight": "与我们独立主线方向2（执行时授权绑定）直接对话的概念级文献。它的“数据→动作权限坍缩”是 T1/T2/T3 之外的攻击面（我们管“读”，它管“做”）；“执行时重新求值”与我们“查询时逐 AU 计算 P(a,u)”共享同一哲学——反对一次性授权、后续信任传递。援引的 capability-oriented control 与 AU 本质（逐 AU 授权 = 逐能力持有）可对齐，为两条主线的理论接口提供概念桥。局限必须标注：单作者、Zenodo note、无实证数字、0 引用，只能作概念锚点，不能作经验证据；且未形式化执行时判定的语义——正是我们能贡献的形式化增量。", "tags": ["执行时授权", "权限坍缩", "概念锚点"], "added": "2026-10-12"}, {"title": "LLMail-Inject: A Dataset from a Realistic Adaptive Prompt Injection Challenge", "authors": "Sahar Abdelnabi、Aideen Fay、Ahmed Salem 等", "url": "https://arxiv.org/abs/2506.09956", "venue": "arXiv 预印本（cs.CR）", "oneliner": "20.8 万条真人红队撰写的间接提示注入攻击，评估“检索→绕防御→触发未授权工具调用”完整攻击链：Meta SecAlign 仍 32% ASR、GPT-4o 58%、GPT-5 mini 47%，旧基准已饱和而它没有。", "insight": "与我们两条主线都对话的攻击侧基准：攻击链恰好横跨检索层授权（retrieve-then-project）与执行层授权（方向2），其 28–45% 的跨域迁移 ASR 是论证“仅做检索侧裁剪不够”的有力数字；引用它的“旧基准饱和论”可为防御评估选用高强度基准背书。注意它的“未授权”指任务目标被篡改、非用户权限不足，引用时需注明。", "tags": ["提示注入", "评测基准", "agent 安全"], "added": "2026-10-13"}, {"title": "Designing for Doubt: The Case for Informed Abstention in Autonomous Agents", "authors": "Victor Ojewale、Suresh Venkatasubramanian", "url": "https://doi.org/10.1609/aies.v9i3.43281", "venue": "AAAI/ACM AIES 2026", "oneliner": "诊断 agent 评测的合规偏置（只奖“做完”不奖“该停就停”），提出“知情弃权”：缺输入/证据/授权时阻断下一次工具调用；144 场景评测中危险动作阻断率 87.5–91%、授权场景可用性 75–92%。", "insight": "方向2（执行时授权绑定）最强的同盟文献之一：“缺授权→结构化暂停+阻断工具调用”正是执行时授权绑定的 fail-closed 降级语义；“危险动作阻断率/授权场景可用性”双指标可直接复用为我们评估执行时绑定的指标对；runtime enforcement + auditable trace 与“查询时逐 AU 求值+审计日志”架构同构。差异点：它的弃权是 agent 自主判断，我们是外部策略求值 P(a,u)——两篇论文可互相引用。注意：AIES 为伦理社会会议、初步评测仅 144 场景，引用时如实标注。", "tags": ["执行时授权", "agent 安全", "评估方法"], "added": "2026-10-13"}, {"title": "Kairos: Transactional Security Enforcement at the System Boundary for LLM Agents", "authors": "Kristoffer Hempel、Nils Loose、Lorenzo Cavallaro、Thomas Eisenbarth", "url": "https://arxiv.org/abs/2610.18457", "venue": "arXiv 预印本（cs.CR/cs.LG，2026-10-13）", "oneliner": "不改造 agent 本体，在系统隔离边界做 reference monitor：tool call/shell/脚本越界一律视为文件与网络操作；声明式策略定可信来源，判不定的挂起、agent 推测执行，权限受限的决策预言机按完整 trace 逐条裁决；AgentDojo 攻击成功率 47.0%→2.7%，良性效用不降。", "i
