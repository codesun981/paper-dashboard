<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">Akka 基于65个开源项目实证评估了规格驱动的AI辅助软件移植工作流，覆盖规格建模、自动化验证与性能基准，首轮测试耗时99.3小时、消耗94.1亿token，57/65项目在代码规模或运行时性能上取得提升。</p><p class="_summary-paragraph_1ssal_95">结构化规格（含声明、证据、类型化行为）显著提升首次实现质量；上下文缺失跨组件决策信息是主要瓶颈；Opus比Sonnet节省约40% token但耗时翻倍，工作量提升不带来持续效率增益。</p><p class="_summary-paragraph_1ssal_95">适合AI工程化团队、编程语言迁移工程师、DevOps架构师阅读。</p></div></div></div>
