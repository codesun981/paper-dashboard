<p>自 2026 年 10 月起，使用个人账号访问 Gemini 应用时，模型可用情况将发生变更。</p> <p>对于未订阅 AI 方案的用户，这些变更将于 10 月 9 日生效。如果你订阅了 AI Plus ，应该会收到一封电子邮件，说明这些变化何时对你生效。</p> <p>这些变更生效后的模型可用情况：</p> <table> <thead> <tr> <th>Google AI 方案</th> <th>Flash-Lite</th> <th>Flash</th> <th>Pro</th> </tr> </thead> <tbody> <tr> <td>未订阅方案</td> <td>✓</td> <td>✗</td> <td>✗</td> </tr> <tr> <td>AI Plus</td> <td>✓</td> <td>✓</td> <td>✗</td> </tr> <tr> <td>AI Pro</td> <td>✓</td> <td>✓</td> <td>✓</td> </tr> <tr> <td>AI Ultra</td> <td>✓</td> <td>✓</td> <td>✓</td> </tr> </tbody></table><p>参考链接: <a href="https://support.google.com/gemini/answer/17004136" rel="nofollow">https://support.google.com/gemini/answer/17004136</a></p>
