<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">Muse macOS 客户端存在未修复零日漏洞，源于可被非特权进程篡改的 endo_voyager_dictation_endpoint 配置键，导致语音听写流量劫持。攻击者可窃取音频、会话令牌，并实施提示词注入执行越权操作。Meta 尚未发布安全公告或申请 CVE 编号。</p><ul class="_summary-list_1ssal_99"><li>漏洞允许非特权本地进程静默覆盖关键配置键，绕过 macOS 权限提示</li><li>听写功能泄露原始麦克风音频与有效身份验证令牌至攻击者控制的端点</li><li>获取会话凭据后可实施提示词注入，驱动助手执行窃取本地文件等后台任务</li></ul><p class="_summary-paragraph_1ssal_95">适合 macOS 安全工程师、客户端架构师、AI 应用渗透测试人员阅读</p></div></div></div>
