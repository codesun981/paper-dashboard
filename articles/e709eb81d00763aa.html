<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">GitHub Agentic Workflows 正式发布，支持在 Actions 中安全运行编码智能体，处理 Issue 分类与 CI 故障分析等任务；智能体默认只读，写入由隔离作业执行，并受沙箱容器与变更扫描保护。</p><p class="_summary-paragraph_1ssal_95">智能体变更需经独立写入作业应用，不自动规避用户授予的直接写入权限；支持 YAML Front Matter 配置与自然语言任务描述；可复用现有 Runner 组、策略及 Copilot 或第三方智能体。</p><p class="_summary-paragraph_1ssal_95">适合平台工程师、DevOps 工程师、AI 编程工具链开发者阅读。</p></div></div></div>
