            <p data-vmark="1f45"><a class="s_tag" href="https://www.ithome.com/" target="_blank" rel="noopener">IT之家</a> 10 月 7 日消息，据科技媒体 TechRadar 今天报道，AMD 首席执行官苏姿丰向外界保证，公司将于 2027 年增加 AI 数据中心芯片产量。</p><p data-vmark="7216"><img src="https://img.ithome.com/images/v2/t.png" title="AMD 苏姿丰承诺 2027 年大幅增加 AI 数据中心芯片供应" loading="lazy"></p><p data-vmark="4e19">苏姿丰在中国台湾地区接受采访时表示：“随着 2026 年的推进，我们已经能确保增加供应。到 2027 年，我们将大幅增加供应。”据悉，<strong>她此次行程访问了富士康、台积电</strong>，<strong>旨在确保 AMD 能够扩大 CPU 和 GPU 产能</strong>，<strong>满足不断增长的 AI 需求</strong>。</p><p data-vmark="e705">IT之家从原报道获悉，苏姿丰此番言论完全没有提到消费级产品，这对普通消费者来说并不是什么好消息。从商业利益层面来看，生产 AI 芯片的利润显然比消费级 CPU、GPU 高得多。</p>
