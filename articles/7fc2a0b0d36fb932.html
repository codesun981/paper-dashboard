<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">AX 是谷歌开源的声明式 AI 代理编排器，基于 Agent Substrate 运行时，专为有状态、长周期、间歇性计算的自主代理设计。它通过亚秒级检查点挂起/恢复与 Actor 多路复用，显著提升资源利用率与响应性能。</p><p class="_summary-paragraph_1ssal_95">支持亚秒级状态挂起与无冷启动恢复；提供 Task/Workspace/Gateway/Model 四类声明式原语；在共享主机进程上复用数十个隔离 Actor 沙箱。</p><p class="_summary-paragraph_1ssal_95">适合 AI 系统工程师、MLOps 架构师、大模型平台开发者阅读。</p></div></div></div>
