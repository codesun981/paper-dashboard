<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">QCon 上海站聚焦 AI Native 时代工程落地，覆盖 AI Infra、Agent Runtime、安全可观测等九大关键技术方向，汇集百个产业级实战案例。</p><p class="_summary-paragraph_1ssal_95">AI Native 架构需重构系统设计范式，非仅模型集成；Agent Runtime 是生产级智能体的基础设施核心；Loop Engineering 与 Vibe Coding 代表人机协同新开发范式。</p><p class="_summary-paragraph_1ssal_95">适合 AI 工程师、平台架构师、MLOps 工程师、技术决策者阅读。</p></div></div></div>
