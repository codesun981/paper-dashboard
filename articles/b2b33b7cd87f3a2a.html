<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">Cat Wu 作为 Claude Code 核心产品负责人，已从 Anthropic 离职并加入 OpenAI，将负责核心产品管理。她曾主导 Claude Code 从内部工具演进为面向开发者的正式产品，并参与 Cowork 项目。</p><p class="_summary-paragraph_1ssal_95">Anthropic 核心产品人才流向 OpenAI，反映大模型公司对工程化落地能力的争夺加剧；Claude Code 的产品化路径具备可复用的方法论价值；AI 编程工具正从辅助编码向智能体协作演进。</p><p class="_summary-paragraph_1ssal_95">适合 AI 产品负责人、编程基础设施工程师、大模型应用架构师阅读。</p></div></div></div>
