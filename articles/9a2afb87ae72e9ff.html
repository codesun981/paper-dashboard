            <p data-vmark="df78"><a class="s_tag" href="https://www.ithome.com/" target="_blank" rel="noopener">IT之家</a> 11 月 18 日消息，谷歌昨日发布公告，宣布更新 Gemini 应用程序的控制选项，<strong>允许用户自行决定是否将 Gemini 聊天记录用于 AI 模型训练</strong>。</p><p data-vmark="8762"><img src="https://img.ithome.com/images/v2/t.png" title="谷歌更新 Gemini 隐私控制，可保留聊天记录且不参与 AI 训练" loading="lazy"></p><p data-vmark="0ab6">谷歌表示，新增的设置选项允许用户在保留 Gemini 聊天记录的同时，选择不将聊天记录用于生成式 AI 模型训练。用户仍然可以调整聊天记录的保存期限，并手动查看或删除聊天记录。</p><p data-vmark="305e">IT之家注意到，谷歌还将提升 Gemini 的安全性。如果用户关闭新的“历史记录”设置，之后产生的聊天内容仍会保存约两个月，用于向用户提供回复、处理用户反馈，以及保护谷歌、用户和公众的安全。</p>
