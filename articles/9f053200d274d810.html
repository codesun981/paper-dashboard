<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">Google 推出基于 Gemini 的安全代理 PageBreak，通过在运行环境中执行真实漏洞利用（如 JS 注入、DNS 外连等）验证 XSS 等缺陷，实现近零误报；已发现超 500 个真实 XSS 漏洞。</p><p class="_summary-paragraph_1ssal_95">确定性验证优先：仅复现成功的漏洞才上报，杜绝无效告警。</p><p class="_summary-paragraph_1ssal_95">闭环验证机制：所有报告均经运行时 exploit 验证，非确定性结果内部留存用于能力迭代。</p><p class="_summary-paragraph_1ssal_95">验证器驱动演进：未验证候选漏洞反哺新验证器研发，提升覆盖边界。</p><p class="_summary-paragraph_1ssal_95">适合应用安全工程师、红队/渗透测试工程师、AI 安全系统架构师阅读。</p></div></div></div>
