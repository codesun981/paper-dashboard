        <h1 class="article-tit">美财长施压英伟达：要求外部换帅 限期10天回应合规问题</h1>
        <p class="article-byline">
            <a class="commnum" href="https://m.cnbeta.com.tw/comment/1586512.htm" target="_blank" rel="noopener"><i></i>0</a>
            <span><span>环球市场播报</span>  </span>
        <time class="time">2026-11-16 00:20:35</time></p>
    </header>

    <div class="article-summ"><p><b>摘要：</b></p><p>针对英伟达近期的出口限制争议，美国财政部长贝森特发表系列强硬表态，要求英伟达必须从外部寻找新领导人，并对公司现有领导层进行“大幅调整”。</p></div>
    <div class="articleCont" id="artibody">
    <p class="article-global"></p>    <p><a href="https://n.sinaimg.cn/finance/transform/162/w550h412/20260921/9c22-165b958ce8fd243c8213c744d705eaf9.png" target="_blank" rel="noopener"><img src="https://n.sinaimg.cn/finance/transform/162/w550h412/20260921/9c22-165b958ce8fd243c8213c744d705eaf9.png" loading="lazy"></a></p><p>贝森特强调，审查英伟达是否遵守出口限制至关重要，并将密切观察该公司是否故意无视了警示信号。</p><p>此外，贝森特指出，报告显示在新加坡销售的芯片中仅有1%留在当地，这引发了对芯片违规流向的严重质疑。他要求英伟达董事会及外部律师必须在“未来10天内”就公司的出口限制合规文化作出正式回应。</p>    </div>
    </div></div>
