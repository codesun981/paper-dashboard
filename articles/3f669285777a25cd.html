            <p data-vmark="4d43"><a class="s_tag" href="https://www.ithome.com/" target="_blank" rel="noopener">IT之家</a> 11 月 12 日消息，英伟达刚刚发布声明称，黄仁勋已辞去总裁、首席执行官及董事会成员职务，即刻生效。截至IT之家发稿，英伟达美股盘前跌幅扩大至 10%。</p><p data-vmark="93f3"><img src="https://img.ithome.com/images/v2/t.png" title="黄仁勋辞任英伟达 CEO，公司美股盘前跌幅扩大至 10%" loading="lazy"></p><p data-vmark="2196">现任执行副总裁兼首席财务官科莱特 · 克雷斯（Colette Kress）已同意担任临时 CEO。在正式继任者确定之前，克雷斯将继续履行其执行副总裁兼首席财务官的职责。董事会目前已启动正式 CEO 的遴选工作，并将综合考量内部及外部候选人。</p><p data-vmark="3ebb">英伟达董事会还任命 Harvey C. Jones 为公司史上首位董事会主席。</p><p data-vmark="da78"><img src="https://img.ithome.com/images/v2/t.png" alt="" title="黄仁勋辞任英伟达 CEO，公司美股盘前跌幅扩大至 10%" loading="lazy"></p>
