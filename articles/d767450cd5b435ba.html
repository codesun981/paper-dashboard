<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">Edera 提出基于虚拟机监控器层的对象能力受限权限模型，实现 AI 智能体操作权限与敏感凭证的强制分离。该方案支持 MCP 服务器与自主智能体在无静态密钥前提下执行受控操作，显著收缩攻击面。</p><p class="_summary-paragraph_1ssal_95">对象能力控制在 VMM 层实施，避免凭证注入执行环境；权限粒度细化至单资源单操作（如仅限某 GitHub 仓库的 push）；解决 LLM 驱动智能体遭提示注入后横向移动的关键风险。</p><p class="_summary-paragraph_1ssal_95">适合云原生安全架构师、AI 工程平台负责人、MCP 协议开发者阅读。</p></div></div></div>
