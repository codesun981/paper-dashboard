<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">QCon 上海站聚焦 AI Native 时代工程落地，覆盖 AI Infra、Agent Runtime、Loop Engineering 等九大关键技术方向，汇集百余实战案例。</p><p class="_summary-paragraph_1ssal_95">AI Native 架构需重构系统边界与协作范式；Agent Runtime 是生产级智能体的基础设施底座；Loop Engineering 强调人机协同闭环的可观测与可调试性。</p><p class="_summary-paragraph_1ssal_95">适合 AI 平台工程师、MLOps 工程师、系统架构师阅读。</p></div></div></div>
