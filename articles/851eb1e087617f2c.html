<div><div><div class="_summary-content_1ssal_88"><p class="_summary-paragraph_1ssal_95">Docker Cloud Sandboxes 是面向 AI 编码智能体的云端 microVM 托管执行环境，支持长周期、多实例并行任务的无缝迁移与统一管理。它延续本地 Sandboxes 的硬件级隔离模型与 CLI 接口，解决笔记本硬件限制导致的执行中断问题。</p><p class="_summary-paragraph_1ssal_95">提供硬件强制隔离的云端 microVM 执行环境；支持本地与云端沙箱一键迁移；统一 CLI 管理，实现长时任务无人值守运行。</p><p class="_summary-paragraph_1ssal_95">适合 AI 工程师、MLOps 工程师、DevOps 工程师阅读</p></div></div></div>
